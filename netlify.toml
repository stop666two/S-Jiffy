[[redirects]]
  from = "/projects/ip-location/*"
  to = "/projects/ip-lookup/"
  status = 301

[build]
  command = ""
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-cache"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; connect-src 'self' https://api.ipify.org https://ip-api.com https://ipinfo.io https://ipapi.co https://dns.google https://huggingface.co https://modelscope.cn https://cdn.jsdelivr.net https://open.er-api.com https://frankfurter.app; img-src 'self' data: https://www.gravatar.com; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/i18n/*"
  [headers.values]
    Cache-Control = "no-cache"
