<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>无障碍检查清单 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .check-item { display: flex; align-items: flex-start; gap: var(--space-1); padding: var(--space-1) 0; cursor: pointer; border-bottom: 1px solid var(--color-border); }
    .check-item:last-child { border-bottom: none; }
    .check-item input { margin-top: 4px; cursor: pointer; }
    .check-title { font-size: var(--font-size-sm); font-weight: 500; color: var(--color-text-primary); min-width: 110px; }
    .check-desc { font-size: var(--font-size-sm); color: var(--color-text-secondary); }
    .progress-wrap { margin: var(--space-2) 0; }
    .progress-text { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: var(--space-1); display: block; }
    .progress-track { height: 8px; background: var(--color-bg-soft); border: 1px solid var(--color-border); border-radius: var(--radius-sm); overflow: hidden; }
    .progress-bar { height: 100%; width: 0; background: var(--color-success); transition: width 0.2s; }
    .btn-row { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-2); }
    .code-block { margin: 0; font-family: inherit; font-size: var(--font-size-sm); white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <a href="../../index.html" class="back-btn">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1>无障碍检查清单</h1>
    <p class="tool-desc">逐项勾选 16 条 WCAG 检查项，实时查看完成进度，一键生成检查报告。</p>
    <div class="card">
      <div id="checkCard"></div>
      <div class="progress-wrap">
        <span class="progress-text" id="progressText">已勾选 0/16</span>
        <div class="progress-track">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="reportBtn">生成报告</button>
        <button class="btn btn-secondary" id="allBtn">全部勾选</button>
        <button class="btn btn-secondary" id="clearBtn">清空</button>
      </div>
    </div>
    <div id="resultBox" class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div>S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script>
    (function () {
      var ITEMS = [
        { key: 'contrast', title: '颜色对比度', desc: '正文与背景色的对比度不低于 4.5:1，大号文字不低于 3:1' },
        { key: 'semantics', title: '语义化标签', desc: '使用 header/main/nav/footer/article 等语义化标签组织页面结构' },
        { key: 'keyboard', title: '键盘导航', desc: '所有交互元素（链接、按钮、表单）均可仅用键盘完成操作' },
        { key: 'focus', title: '焦点可见', desc: 'Tab 切换时焦点指示清晰可见，不被样式隐藏或覆盖' },
        { key: 'aria', title: '图标按钮 ARIA', desc: '无文字内容的图标按钮提供 aria-label 等可访问名称' },
        { key: 'alt', title: '图片替代文本', desc: '所有 img 图片提供描述性 alt 属性，装饰图使用空 alt' },
        { key: 'labels', title: '表单标签', desc: '每个输入控件关联可见 label 或 aria-label' },
        { key: 'headings', title: '标题层级', desc: '页面标题按 h1 至 h6 顺序使用，不跳级、不滥用' },
        { key: 'lang', title: '语言声明', desc: 'html 标签声明 lang 属性（如 lang="zh-CN"）' },
        { key: 'motion', title: '减少动效', desc: '支持 prefers-reduced-motion，尊重用户减少动效的偏好' },
        { key: 'captions', title: '媒体字幕', desc: '视频提供字幕，音频提供文字稿或转录文本' },
        { key: 'touch', title: '触控目标', desc: '可点击目标尺寸不小于 44×44px 且彼此间距充足' },
        { key: 'errors', title: '错误提示', desc: '表单错误信息与对应输入框关联，并给出修复建议' },
        { key: 'color', title: '颜色非唯一', desc: '不使用颜色作为传递信息的唯一手段，辅以图标或文字' },
        { key: 'scroll', title: '滚动区域', desc: '溢出内容区域可滚动、滚动条可见，并支持键盘滚动' },
        { key: 'zoom', title: '字体缩放', desc: '页面在浏览器 200% 缩放下内容完整可读、功能不丢失' }
      ];
      var checkCard = document.getElementById('checkCard');
      var progressText = document.getElementById('progressText');
      var progressBar = document.getElementById('progressBar');
      var outputText = document.getElementById('outputText');
      var currentReport = '';
      var boxes = [];

      function renderList() {
        var html = '';
        for (var i = 0; i < ITEMS.length; i++) {
          html += '<label class="check-item"><input type="checkbox" id="chk' + i + '"' + (i === 0 ? ' class="js-focus-input"' : '') + '>' +
            '<span class="check-title">' + htmlEscape(ITEMS[i].title) + '</span>' +
            '<span class="check-desc">' + htmlEscape(ITEMS[i].desc) + '</span></label>';
        }
        checkCard.innerHTML = html;
        for (var k = 0; k < ITEMS.length; k++) {
          boxes[k] = document.getElementById('chk' + k);
          boxes[k].addEventListener('change', updateProgress);
        }
        updateProgress();
      }

      function updateProgress() {
        var n = 0;
        for (var i = 0; i < boxes.length; i++) {
          if (boxes[i].checked) n++;
        }
        progressText.textContent = '已勾选 ' + n + '/' + ITEMS.length;
        progressBar.style.width = Math.round(n / ITEMS.length * 100) + '%';
        return n;
      }

      function generateReport() {
        var passed = [];
        var pending = [];
        for (var i = 0; i < boxes.length; i++) {
          if (boxes[i].checked) {
            passed.push(ITEMS[i]);
          } else {
            pending.push(ITEMS[i]);
          }
        }
        var n = passed.length;
        var lines = [];
        lines.push('无障碍检查报告');
        lines.push('通过 ' + n + '/' + ITEMS.length + '，待修复 ' + (ITEMS.length - n) + '/' + ITEMS.length);
        lines.push('');
        lines.push('[通过]');
        if (!passed.length) {
          lines.push('（无）');
        } else {
          for (var a = 0; a < passed.length; a++) {
            lines.push(passed[a].title + '：' + passed[a].desc);
          }
        }
        lines.push('');
        lines.push('[待修复]');
        if (!pending.length) {
          lines.push('（无）');
        } else {
          for (var b = 0; b < pending.length; b++) {
            lines.push(pending[b].title + '：' + pending[b].desc);
          }
        }
        currentReport = lines.join('\n');
        outputText.innerHTML = '<pre class="code-block">' + htmlEscape(currentReport) + '</pre>';
        setStatus('报告已生成');
      }

      document.getElementById('reportBtn').addEventListener('click', generateReport);
      document.getElementById('allBtn').addEventListener('click', function () {
        for (var i = 0; i < boxes.length; i++) boxes[i].checked = true;
        updateProgress();
        setStatus('已全部勾选');
      });
      document.getElementById('clearBtn').addEventListener('click', function () {
        for (var i = 0; i < boxes.length; i++) boxes[i].checked = false;
        updateProgress();
        setStatus('已清空勾选');
      });
      document.getElementById('copyBtn').addEventListener('click', function () {
        if (!currentReport) return;
        copyToClipboard(currentReport, this);
        setStatus('已复制报告');
      });
      renderList();
    })();
  </script>
</body>
</html>
