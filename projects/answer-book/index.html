<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>答案之书 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .ask-wrap { text-align: center; padding: var(--space-2) 0 var(--space-1); }
    .ask-mark { font-size: var(--font-size-lg); font-weight: 600; letter-spacing: 2px; margin-bottom: var(--space-1); }
    .ask-hint { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: var(--space-3); }
    .find-btn { height: 56px; padding: 0 40px; font-size: var(--font-size-base); border-radius: 9999px; }
    .book-stage { position: relative; min-height: 220px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .book-cover { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-1); transition: opacity 0.25s; }
    .book-cover.fade { opacity: 0; }
    .book-title { font-size: var(--font-size-lg); font-weight: 600; letter-spacing: 6px; }
    .book-sub { font-size: var(--font-size-xs); color: var(--color-text-disabled); letter-spacing: 3px; }
    .answer-box { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: var(--space-3); }
    .answer-txt { font-size: 34px; font-weight: 600; line-height: 1.4; text-align: center; letter-spacing: 2px; animation: answerIn 0.45s ease both; }
    .answer-txt.hide { animation: none; opacity: 0; }
    @keyframes answerIn {
      0% { opacity: 0; transform: scale(0.86) translateY(8px); }
      70% { opacity: 1; transform: scale(1.03) translateY(-2px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .draw-count { text-align: center; font-size: var(--font-size-xs); color: var(--color-text-disabled); margin-top: var(--space-2); min-height: 18px; }
    .note-line { font-size: var(--font-size-xs); color: var(--color-text-disabled); text-align: center; margin-top: var(--space-2); }
    .rule-list { font-size: var(--font-size-sm); color: var(--color-text-secondary); line-height: 2; }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">答案之书</h1>
    <p class="tool-desc" data-i18n="desc">心中默念一个问题，翻开书页，得到一个提示性的答案。</p>
    <div class="card">
      <div class="ask-wrap">
        <div class="ask-mark">？</div>
        <p class="ask-hint" data-i18n="ui.1">先在心中默念你的问题，问题越具体，答案越有启发</p>
        <button id="findBtn" class="btn btn-primary find-btn" data-i18n="ui.2">查找答案</button>
      </div>
      <div class="book-stage" id="bookStage">
        <div class="book-cover" id="bookCover">
          <div class="book-title" data-i18n="ui.3">答案之书</div>
          <div class="book-sub">THE ANSWER BOOK</div>
        </div>
        <div class="answer-box">
          <div class="answer-txt hide" id="answerTxt"></div>
        </div>
      </div>
      <div class="draw-count" id="drawCount"></div>
    </div>
    <div class="card">
      <p class="rule-list" data-i18n="ui.4">使用方式：</p>
      <p class="rule-list" data-i18n="ui.5">1. 闭上眼，在心里默念一个困扰你的问题。</p>
      <p class="rule-list" data-i18n="ui.6">2. 点击「查找答案」，书页会随机翻开一页。</p>
      <p class="rule-list" data-i18n="ui.7">3. 读完答案后，可以再次抽取，换一个问题再问。</p>
      <p class="rule-list" data-i18n="ui.8">4. 同一问题反复出现时，也许答案已经很明显。</p>
    </div>
    <div class="card">
      <p class="note-line" data-i18n="ui.9">答案之书属于娱乐参考，不能替代专业判断，重大决定请自行负责。</p>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script></script>

      var stage = document.getElementById('bookStage');
      var cover = document.getElementById('bookCover');
      var txt = document.getElementById('answerTxt');
      var drawCount = document.getElementById('drawCount');
      var count = 0;
      var lastIdx = -1;
      var timer = null;

      function pickAnswer() {
        var idx = Math.floor(Math.random() * ANSWERS.length);
        if (ANSWERS.length > 1 && idx === lastIdx) {
          idx = (idx + 1) % ANSWERS.length;
        }
        lastIdx = idx;
        return ANSWERS[idx];
      }

      function draw() {
        clearTimeout(timer);
        txt.className = 'answer-txt hide';
        txt.textContent = '';
        cover.classList.remove('fade');
        setTimeout(function () {
          cover.classList.add('fade');
          txt.textContent = pickAnswer();
          txt.className = 'answer-txt';
          count += 1;
          drawCount.textContent = t('ui.13','已翻开 ') + count + t('ui.12',' 页');
          setStatus(t('ui.11','答案已给出，用心体会'));
        }, 200);
      }

      document.getElementById('findBtn').addEventListener('click', function () {
        draw();
      });

      drawCount.textContent = t('ui.10','翻开书页，开启一次问答');
