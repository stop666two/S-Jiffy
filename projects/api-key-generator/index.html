<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Key 生成器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .ak-row { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-bottom:var(--space-3); }
    .ak-row .field { flex:1; min-width:100px; }
    .ak-row label { display:block; font-size:var(--font-size-sm); color:var(--color-text-secondary); margin-bottom:4px; }
    .dc-tabs { display:flex; gap:var(--space-1); margin-bottom:var(--space-3); }
    .dc-tabs button { flex:1; height:44px; font-size:var(--font-size-sm); border:1px solid var(--color-border); border-radius:var(--radius-md); background:var(--color-bg); cursor:pointer; transition:all .15s; }
    .dc-tabs button.active { background:var(--color-text-primary); color:#fff; border-color:var(--color-text-primary); }
    .risk-box { font-size:var(--font-size-sm); line-height:1.7; color:var(--color-error); border:1px solid rgba(159,47,45,0.3); background:rgba(159,47,45,0.05); border-radius:var(--radius-md); padding:var(--space-2) var(--space-3); margin-bottom:var(--space-2); display:none; }
    .risk-box-title { font-weight:600; margin-bottom:4px; }
    .det-table-wrap { overflow-x:auto; }
    .det-table { width:100%; border-collapse:collapse; font-size:var(--font-size-sm); }
    .det-table th { text-align:left; font-weight:600; color:var(--color-text-secondary); padding:8px 10px; border-bottom:2px solid var(--color-border); white-space:nowrap; }
    .det-table td { padding:8px 10px; border-bottom:1px solid var(--color-border); }
    .det-table .mono { font-family:var(--font-mono); word-break:break-all; }
    .det-count { display:inline-block; min-width:28px; text-align:center; padding:1px 8px; border-radius:9999px; background:var(--color-bg-soft); border:1px solid var(--color-border); }
    .det-count-hit { background:rgba(52,101,56,0.1); color:var(--color-success); border-color:rgba(52,101,56,0.3); font-weight:600; }
  </style>
</head>
<body>
  <header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">API 密钥生成器</h1>
    <p class="tool-desc" data-i18n="desc">生成 API 密钥（自定义前缀/格式/长度），并可粘贴文本识别 AWS、GitHub、Stripe 等平台的密钥格式</p>
    <div class="dc-tabs">
      <button id="tabGenerate" class="active" type="button" data-i18n="ui.tabGenerate">生成</button>
      <button id="tabDetect" type="button" data-i18n="ui.tabDetect">识别</button>
    </div>
    <div id="panelGenerate">
      <div class="card">
        <div class="ak-row">
          <div class="field"><label for="prefixVal" data-i18n="ui.1">前缀（可选）</label><input id="prefixVal" class="input" type="text" value="sk-" data-i18n-placeholder="ui.101" placeholder="例如 sk-"></div>
          <div class="field"><label for="fmtSel" data-i18n="ui.2">格式</label>
            <select id="fmtSel" class="input" style="width:auto;min-width:80px;">
              <option value="hex">Hex</option>
              <option value="base64">Base64 (URL-safe)</option>
              <option value="hybrid" selected>Hybrid</option>
            </select>
          </div>
          <div class="field"><label for="lenVal" data-i18n="ui.3">总长度</label><input id="lenVal" class="input" type="number" value="32" min="8" max="256"></div>
          <div class="field"><label for="countVal" data-i18n="ui.quantity">数量</label><input id="countVal" class="input" type="number" value="3" min="1" max="100"></div>
        </div>
        <div><button id="genBtn" class="btn btn-primary" data-i18n="ui.generate">生成</button></div>
      </div>
    </div>
    <div id="panelDetect" style="display:none;">
      <div class="card">
        <textarea id="inputText" class="input textarea js-focus-input" data-i18n-placeholder="det.placeholder" placeholder="粘贴配置、日志或代码片段，自动检测其中的 API Key..."></textarea>
        <div style="margin-top:12px;display:flex;gap:12px;">
          <button id="clearBtn" class="btn btn-secondary" data-i18n="det.clear">清空</button>
        </div>
      </div>
      <div id="riskBox" class="risk-box">
        <div class="risk-box-title" data-i18n="det.riskTitle">高风险提示</div>
        <span id="riskText"></span>
      </div>
      <div id="tableCard" class="card" style="display:none;">
        <div class="det-table-wrap">
          <table class="det-table">
            <thead>
              <tr>
                <th data-i18n="det.platform">平台</th>
                <th data-i18n="det.count">匹配数</th>
                <th data-i18n="det.sample">打码示例</th>
              </tr>
            </thead>
            <tbody id="detBody"></tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="output-box"><span id="outputText" style="display:block;padding-right:60px;"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
  </main>
  <footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>(function(){
    var prefixEl = document.getElementById('prefixVal');
    var fmtEl = document.getElementById('fmtSel');
    var lenEl = document.getElementById('lenVal');
    var countEl = document.getElementById('countVal');
    var genBtn = document.getElementById('genBtn');
    var outputEl = document.getElementById('outputText');
    var copyBtn = document.getElementById('copyBtn');

    var hexChars = '0123456789abcdef';
    var b64Chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
    var hybridChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

    function generate() {
      var prefix = prefixEl.value;
      var fmt = fmtEl.value;
      var totalLen = parseInt(lenEl.value, 10) || 32;
      if (totalLen < 8) totalLen = 8;
      if (totalLen > 256) totalLen = 256;
      var count = parseInt(countEl.value, 10) || 1;
      if (count < 1) count = 1;
      if (count > 1000) count = 1000;

      var bodyLen = totalLen - prefix.length;
      if (bodyLen < 4) { setStatus(t('ui.100','前缀过长，请缩短前缀或增加长度'), 'error'); return; }

      var chars;
      if (fmt === 'hex') chars = hexChars;
      else if (fmt === 'base64') chars = b64Chars;
      else chars = hybridChars;

      var result = [];
      for (var n = 0; n < count; n++) {
        var body = '';
        var bytes = new Uint8Array(bodyLen);
        crypto.getRandomValues(bytes);
        for (var i = 0; i < bodyLen; i++) {
          body += chars[bytes[i] % chars.length];
        }
        result.push(prefix + body);
      }
      outputEl.textContent = result.join('\n');
      setStatus(t('ui.generated','已生成 ') + count + t('ui.4',' 个 API Key'));
    }

    genBtn.addEventListener('click', generate);
    copyBtn.addEventListener('click', function() { if (outputEl.textContent) { copyToClipboard(outputEl.textContent, copyBtn); setStatus(t('ui.copied','已复制')); } });

    /* ============ detect tab (merged from api-key-detector) ============ */
    var tabGenerate = document.getElementById('tabGenerate'), tabDetect = document.getElementById('tabDetect');
    var panelGenerate = document.getElementById('panelGenerate'), panelDetect = document.getElementById('panelDetect');
    function switchTab(which) {
      if (which === 'generate') {
        tabGenerate.className = 'active'; tabDetect.className = '';
        panelGenerate.style.display = ''; panelDetect.style.display = 'none';
      } else {
        tabDetect.className = 'active'; tabGenerate.className = '';
        panelDetect.style.display = ''; panelGenerate.style.display = 'none';
      }
    }
    tabGenerate.addEventListener('click', function () { switchTab('generate'); });
    tabDetect.addEventListener('click', function () { switchTab('detect'); });

    var inputText = document.getElementById('inputText');
    var clearBtn = document.getElementById('clearBtn');
    var riskBox = document.getElementById('riskBox');
    var riskText = document.getElementById('riskText');
    var tableCard = document.getElementById('tableCard');
    var detBody = document.getElementById('detBody');

    var PATTERNS = [
      { name: 'AWS Access Key', regex: /AKIA[0-9A-Z]{16}/g, example: 'AKIA****' },
      { name: 'Google API Key', regex: /AIza[0-9A-Za-z_-]{35}/g, example: 'AIza****' },
      { name: 'GitHub Token', regex: /(?:ghp_|gho_|ghu_|ghs_|ghr_|github_pat_)[0-9A-Za-z_]{15,}/g, example: 'ghp_****' },
      { name: 'Stripe Secret Key', regex: /(?:sk_live_|rk_live_)[0-9A-Za-z]{24}/g, example: 'sk_live_****' },
      { name: 'OpenAI API Key', regex: /\bsk-[A-Za-z0-9_-]{20,}\b/g, example: 'sk-****' },
      { name: 'Slack Token', regex: /xox[baprs]-[0-9A-Za-z-]{10,}/g, example: 'xoxb-****' },
      { name: 'Twilio API Key', regex: /\bSK[0-9a-fA-F]{32}\b/g, example: 'SK****' },
      { name: 'SendGrid API Key', regex: /SG\.[0-9A-Za-z_-]{22}\.[0-9A-Za-z_-]{43}/g, example: 'SG.****' },
      { name: 'Telegram Bot Token', regex: /\b\d{8,10}:[A-Za-z0-9_-]{35}\b/g, example: '123456789:****' },
      { name: 'JWT Token', regex: /\beyJ[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{5,}\b/g, example: 'eyJ****' }
    ];

    function maskSample(s) {
      if (!s) return '';
      if (s.length <= 8) return s.charAt(0) + '****';
      return s.slice(0, 4) + '****';
    }

    function detect() {
      var text = inputText.value;
      if (!text.trim()) {
        tableCard.style.display = 'none';
        detBody.innerHTML = '';
        riskBox.style.display = 'none';
        outputEl.textContent = '';
        setStatus('');
        return;
      }
      var rows = '';
      var total = 0;
      var hitPlatforms = 0;
      for (var i = 0; i < PATTERNS.length; i++) {
        var p = PATTERNS[i];
        p.regex.lastIndex = 0;
        var matches = text.match(p.regex);
        var count = matches ? matches.length : 0;
        total += count;
        if (count > 0) hitPlatforms++;
        var sample = matches ? maskSample(matches[0]) : '';
        var noMatchLabel = t('det.none','未发现');
        var cls = count > 0 ? 'det-count det-count-hit' : 'det-count';
        rows += '<tr>' +
          '<td>' + htmlEscape(p.name) + '</td>' +
          '<td><span class="' + cls + '">' + count + '</span></td>' +
          '<td class="mono">' + (sample ? htmlEscape(sample) : '<span style="color:var(--color-text-disabled)">' + noMatchLabel + '</span>') + '</td>' +
          '</tr>';
      }
      detBody.innerHTML = rows;
      tableCard.style.display = 'block';
      if (total > 0) {
        outputEl.textContent = t('det.found1','检测到 ') + total + t('det.found2',' 个疑似密钥，涉及 ') + hitPlatforms + t('det.found3',' 个平台');
        riskText.textContent = t('det.riskMsg','文本中存在疑似密钥，可能已被泄露。请立即在对应平台的控制台吊销并轮换密钥；切勿将密钥提交到公共仓库、日志或聊天记录；建议接入密钥扫描与密钥管理服务（如 Vault、云平台 Secret Manager）。');
        riskBox.style.display = 'block';
        setStatus(t('det.suspected','检测到疑似密钥'));
      } else {
        outputEl.textContent = t('det.scanned1','未检测到疑似密钥（已扫描 ') + PATTERNS.length + t('det.scanned2',' 种格式）');
        riskBox.style.display = 'none';
        setStatus(t('det.noKeys','未发现密钥'));
      }
    }

    inputText.addEventListener('input', function () { detect(); });
    clearBtn.addEventListener('click', function () {
      inputText.value = '';
      detect();
      inputText.focus();
    });
  })();</script>
</body>
</html>
