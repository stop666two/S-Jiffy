<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API 请求签名器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .form-row { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-2); }
    .form-row .input { flex: 1; min-width: 160px; }
    .form-row select.input { flex: 0 0 auto; width: 120px; }
    .form-hint { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: var(--space-1); }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">API 请求签名器</h1>
    <p class="tool-desc" data-i18n="desc">用 HMAC-SHA256 对「方法 + 路径 + 时间戳」计算签名，输出签名 hex 与完整的 Authorization 请求头示例。</p>
    <div class="card">
      <div class="form-row">
        <select id="methodSel" class="input">
          <option>GET</option>
          <option>POST</option>
          <option>PUT</option>
          <option>DELETE</option>
          <option>PATCH</option>
          <option>HEAD</option>
          <option>OPTIONS</option>
        </select>
        <input id="pathInput" class="input js-focus-input" data-i18n-placeholder="ui.105" placeholder="请求路径，如 /api/users/1">
      </div>
      <div class="form-row">
        <input id="tsInput" class="input" data-i18n-placeholder="ui.106" placeholder="时间戳（Unix 秒）">
        <button class="btn btn-secondary" id="nowBtn" data-i18n="ui.1">填入当前时间</button>
      </div>
      <div class="form-row">
        <input id="secretInput" class="input" type="password" data-i18n-placeholder="ui.107" placeholder="共享密钥 Secret Key">
        <button class="btn btn-primary" id="signBtn" data-i18n="ui.2">生成签名</button>
      </div>
      <div class="form-hint" data-i18n="ui.108">签名规则：message = 方法 + 路径 + 时间戳，Authorization 头格式：HMAC &lt;timestamp&gt;:&lt;hex&gt;。浏览器签名需 HTTPS 或 localhost 环境。</div>
    </div>
    <div id="resultBox" class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>
    (function () {
      var output = document.getElementById('outputText');
      var current = '';

      function toHex(buf) {
        var bytes = new Uint8Array(buf);
        var out = '';
        for (var i = 0; i < bytes.length; i++) {
          var h = bytes[i].toString(16);
          out += h.length === 1 ? '0' + h : h;
        }
        return out;
      }

      function fillNow() {
        document.getElementById('tsInput').value = String(Math.floor(Date.now() / 1000));
      }

      function doSign() {
        var method = document.getElementById('methodSel').value;
        var path = document.getElementById('pathInput').value.trim();
        var ts = document.getElementById('tsInput').value.trim();
        var secret = document.getElementById('secretInput').value;
        if (!path) {
          output.innerHTML = '';
          current = '';
          setStatus(t('ui.100','请输入请求路径'), 'error');
          return;
        }
        if (!/^\d+$/.test(ts)) {
          output.innerHTML = '';
          current = '';
          setStatus(t('ui.101','时间戳必须为整数秒，可点击「填入当前时间」'), 'error');
          return;
        }
        if (!secret) {
          output.innerHTML = '';
          current = '';
          setStatus(t('ui.102','请输入共享密钥'), 'error');
          return;
        }
        if (!window.crypto || !window.crypto.subtle) {
          output.innerHTML = '';
          current = '';
          setStatus(t('ui.103','当前环境不支持 Web Crypto API（需 HTTPS 或 localhost），无法生成签名'), 'error');
          return;
        }
        var message = method + path + ts;
        var enc = new TextEncoder();
        setStatus(t('ui.7','正在计算 HMAC-SHA256 签名…'));
        window.crypto.subtle.importKey('raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign'])
          .then(function (key) {
            return window.crypto.subtle.sign('HMAC', key, enc.encode(message));
          })
          .then(function (sig) {
            var hex = toHex(sig);
            current = t('ui.6','待签名原文：') + message + '\n\n签名 hex：' + hex + '\n\nAuthorization 请求头：\nAuthorization: HMAC ' + ts + ':' + hex;
            output.innerHTML = '<pre style="margin:0;font-size:var(--font-size-sm);white-space:pre-wrap;word-break:break-all;font-family:var(--font-mono)">' + htmlEscape(current) + '</pre>';
            setStatus(t('ui.5','签名已生成'));
          })
          .catch(function () {
            output.innerHTML = '';
            current = '';
            setStatus(t('ui.104','签名失败：请检查密钥与输入内容'), 'error');
          });
      }

      document.getElementById('signBtn').addEventListener('click', doSign);
      document.getElementById('nowBtn').addEventListener('click', function () {
        fillNow();
        setStatus(t('ui.4','已填入当前时间戳'));
      });
      document.getElementById('copyBtn').addEventListener('click', function () {
        if (!current) return;
        copyToClipboard(current, this);
        setStatus(t('ui.3','已复制签名结果'));
      });
      fillNow();
    })();
  </script>
</body>
</html>
