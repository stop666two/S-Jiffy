<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音频转换器 - S-Jiffy</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../assets/css/global.css">
<style>
.audio-drop{border:2px dashed var(--color-border);border-radius:var(--radius-md);padding:28px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;}
.audio-drop.dragover{border-color:var(--color-text-primary);background:var(--color-bg-soft);}
.audio-drop .ico{font-size:34px;display:block;margin-bottom:8px;color:var(--color-text-disabled);}
.audio-drop .hint{font-size:var(--font-size-sm);color:var(--color-text-secondary);}
.audio-drop input{display:none;}
.file-chip{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--color-bg-soft);border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:var(--font-size-sm);margin-bottom:12px;}
.file-chip .meta{color:var(--color-text-secondary);font-size:var(--font-size-xs);margin-top:2px;}
.file-chip .x{cursor:pointer;border:none;background:none;color:var(--color-text-secondary);font-size:14px;padding:4px;}
.file-chip .x:hover{color:var(--color-error);}
.wave-box{position:relative;background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden;margin-bottom:12px;}
.wave-box canvas{display:block;width:100%;height:120px;touch-action:none;}
.opt-card{border:1px solid var(--color-border);border-radius:var(--radius-md);padding:14px;margin-bottom:12px;}
.opt-card h3{font-size:var(--font-size-sm);font-weight:600;margin-bottom:10px;}
.opt-row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;}
.opt-group .lbl{font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-bottom:6px;}
.seg-btn{padding:4px 10px;font-size:var(--font-size-xs);border:1px solid var(--color-border);border-radius:var(--radius-sm);background:transparent;cursor:pointer;color:var(--color-text-primary);}
.seg-btn.active{background:var(--color-text-primary);color:#fff;border-color:var(--color-text-primary);}
.note{font-size:var(--font-size-xs);color:var(--color-text-disabled);margin-top:8px;}
.progress{height:6px;background:var(--color-bg-soft);border-radius:3px;overflow:hidden;margin:10px 0 4px;}
.progress>div{height:100%;width:0;background:var(--color-text-primary);transition:width .15s;}
.dl-btn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:var(--radius-md);border:none;background:var(--color-text-primary);color:#fff;font-size:14px;font-weight:500;cursor:pointer;width:100%;}
.dl-btn:disabled{opacity:.4;cursor:not-allowed;}
.dl-btn.green{background:var(--color-success);}
.hidden{display:none;}
.err-msg{padding:10px 14px;background:#fdecea;border:1px solid #f5c6c2;color:var(--color-error);border-radius:var(--radius-md);font-size:var(--font-size-sm);margin-bottom:12px;}
.result-card{border:1px solid #bcd9c0;border-radius:var(--radius-md);padding:14px;margin-bottom:12px;}
.result-card h3{font-size:var(--font-size-sm);font-weight:600;color:var(--color-success);margin-bottom:10px;}
.result-card audio{width:100%;height:40px;margin-bottom:10px;}
</style>
</head>
<body>
<header class="global-header">
<a href="../../index.html" class="logo">S-Jiffy</a>
<select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a>
</header>
<main class="tool-workspace">
<h1 data-i18n="h1">音频转换器</h1>
<p class="tool-desc" data-i18n="desc">将音频文件转换为WAV或WebM格式。浏览器内运行。</p>
<div class="card">
<label class="audio-drop" id="dropZone">
<span class="ico">🎵</span>
<span class="hint"></span>
<input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac,.webm,.mp4">
</label>
<div class="file-chip hidden" id="fileChip">
<div><div id="fileName"></div><div class="meta" id="fileMeta"></div></div>
<button class="x" id="fileRemove" type="button">✕</button>
</div>
<div class="err-msg hidden" id="errBox"></div>
<div id="waveWrap" class="hidden">
<div class="wave-box"><canvas id="waveCanvas"></canvas></div>
<div class="opt-card">
<h3 data-i18n="formatLabel">格式</h3>
<div class="opt-row">
<div class="opt-group"><div class="lbl" data-i18n="ui.108">输出格式</div>
<div id="fmtBtns">
<button class="seg-btn active" data-fmt="wav" type="button">WAV</button>
<button class="seg-btn" data-fmt="mp3" type="button">MP3</button>
<button class="seg-btn" data-fmt="ogg" type="button">OGG</button>
<button class="seg-btn" data-fmt="webm" type="button">WebM</button>
</div></div>
<div class="opt-group hidden" id="bitrateGroup"><div class="lbl" data-i18n="bitrateLabel">比特率</div>
<div id="bitrateBtns">
<button class="seg-btn" data-br="128" type="button">128k</button>
<button class="seg-btn active" data-br="192" type="button">192k</button>
<button class="seg-btn" data-br="320" type="button">320k</button>
</div></div>
<div class="opt-group hidden" id="srGroup"><div class="lbl" data-i18n="sampleRateLabel">采样率</div>
<div id="srBtns">
<button class="seg-btn active" data-sr="44100" type="button">44.1 kHz</button>
<button class="seg-btn" data-sr="48000" type="button">48 kHz</button>
</div></div>
</div>
<p class="note hidden" id="webmNote" data-i18n="webmNote">WebM/Opus 使用浏览器 MediaRecorder，比特率和采样率由浏览器控制。</p>
</div>
<div class="progress hidden" id="progress"><div id="progressFill"></div></div>
<button class="dl-btn" id="btnConvert" type="button" disabled>⇄ <span data-i18n="ui.107">转换为 WAV</span></button>
<div class="result-card hidden" id="resultCard">
<h3 data-i18n="previewConverted">预览转换后的音频</h3>
<audio controls id="resultAudio"></audio>
<button class="dl-btn green" id="btnDownload" type="button">⬇ <span data-i18n="ui.106">下载</span></button>
</div>
</div>
</div>
</main>
<footer class="global-footer">
<div class="tool-status" id="statusBar"></div>
<div data-i18n="common.footer">S-Jiffy · 即用即走</div>
</footer>
<script src="../../assets/js/global.js"></script>
<script src="../../assets/js/i18n.js"></script>
<script src="../../assets/js/audio-core.js"></script>
<script src="../../assets/vendor/lame.min.js"></script>
<script>
(function () {
  var AK = window.AudioKit;
  var dropZone = document.getElementById('dropZone');
  var fileInput = document.getElementById('fileInput');
  var fileChip = document.getElementById('fileChip');
  var fileName = document.getElementById('fileName');
  var fileMeta = document.getElementById('fileMeta');
  var fileRemove = document.getElementById('fileRemove');
  var errBox = document.getElementById('errBox');
  var waveWrap = document.getElementById('waveWrap');
  var canvas = document.getElementById('waveCanvas');
  var fmtBtns = document.getElementById('fmtBtns');
  var bitrateBtns = document.getElementById('bitrateBtns');
  var bitrateGroup = document.getElementById('bitrateGroup');
  var srBtns = document.getElementById('srBtns');
  var srGroup = document.getElementById('srGroup');
  var webmNote = document.getElementById('webmNote');
  var btnConvert = document.getElementById('btnConvert');
  var btnDownload = document.getElementById('btnDownload');
  var resultCard = document.getElementById('resultCard');
  var resultAudio = document.getElementById('resultAudio');
  var progress = document.getElementById('progress');
  var progressFill = document.getElementById('progressFill');

  var file = null;
  var buffer = null;
  var duration = 0;
  var fmt = 'wav';
  var bitrate = 192;
  var sampleRate = 44100;
  var resultUrl = null;
  var processing = false;

  function t(key, fb) { var v = (window.I18N && I18N.t) ? I18N.t(key) : null; return (v === key || v == null) ? fb : v; }
  function showErr(msg) { errBox.textContent = msg; errBox.classList.remove('hidden'); }
  function hideErr() { errBox.classList.add('hidden'); }
  function setProgress(p) {
    if (p >= 1) { progress.classList.add('hidden'); return; }
    progress.classList.remove('hidden');
    progressFill.style.width = Math.round(p * 100) + '%';
  }
  function clearResult() {
    if (resultUrl) { URL.revokeObjectURL(resultUrl); resultUrl = null; }
    resultCard.classList.add('hidden');
    resultAudio.src = '';
    btnDownload.disabled = true;
  }

  function draw() {
    AK.drawWaveform(canvas, { peaks: AK.computePeaks(buffer, 2000), duration: duration, viewStart: 0, viewDuration: duration, playheadSec: 0 });
  }

  function updateUI() {
    bitrateGroup.classList.toggle('hidden', fmt !== 'mp3');
    srGroup.classList.toggle('hidden', fmt === 'webm');
    webmNote.classList.toggle('hidden', fmt !== 'webm');
    btnConvert.querySelector('span').textContent = t('ui.104','转换为 ') + fmt.toUpperCase();
    var all = fmtBtns.querySelectorAll('.seg-btn');
    for (var i = 0; i < all.length; i++) all[i].classList.toggle('active', all[i].getAttribute('data-fmt') === fmt);
  }

  function loadFile(f) {
    hideErr();
    clearResult();
    setStatus(t('ui.100','正在解码音频…'));
    AK.decodeAudioFile(f, function (buf) {
      file = f;
      buffer = buf;
      duration = buf.duration;
      fileName.textContent = f.name;
      var rate = buf.sampleRate;
      var mono = buf.numberOfChannels === 1;
      fileMeta.textContent = AK.formatDuration(duration) + ' · ' + AK.formatBytes(f.size) + ' · ' + (rate / 1000) + 'kHz · ' + (mono ? 'Mono' : 'Stereo');
      fileChip.classList.remove('hidden');
      waveWrap.classList.remove('hidden');
      dropZone.style.display = 'none';
      btnConvert.disabled = false;
      draw();
      setStatus(t('ui.101','文件已就绪'));
    }, function () {
      showErr(t('failedToLoad', '加载失败。请确认文件为受支持的音频格式且未损坏。'));
      setStatus(t('failedToLoad', '加载失败。请确认文件为受支持的音频格式且未损坏。'), 'error');
    });
  }

  dropZone.addEventListener('click', function () { fileInput.click(); });
  dropZone.addEventListener('dragover', function (e) { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', function () { dropZone.classList.remove('dragover'); });
  dropZone.addEventListener('drop', function (e) {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files && e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', function () {
    if (fileInput.files && fileInput.files.length) loadFile(fileInput.files[0]);
    fileInput.value = '';
  });
  fileRemove.addEventListener('click', function () {
    file = null; buffer = null;
    fileChip.classList.add('hidden');
    waveWrap.classList.add('hidden');
    dropZone.style.display = '';
    btnConvert.disabled = true;
    clearResult();
    setStatus('');
  });

  fmtBtns.addEventListener('click', function (e) {
    var b = e.target;
    if (b.tagName !== 'BUTTON') return;
    fmt = b.getAttribute('data-fmt');
    if (fmt === 'ogg' || fmt === 'webm') {
      var mime = 'audio/' + fmt;
      if (!window.MediaRecorder || !MediaRecorder.isTypeSupported(mime)) {
        setStatus('当前浏览器不支持 ' + fmt.toUpperCase() + ' 输出', 'error');
        return;
      }
    }
    updateUI();
    clearResult();
  });
  bitrateBtns.addEventListener('click', function (e) {
    var b = e.target;
    if (b.tagName !== 'BUTTON') return;
    bitrate = Number(b.getAttribute('data-br'));
    var all = bitrateBtns.querySelectorAll('.seg-btn');
    for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
    b.classList.add('active');
  });
  srBtns.addEventListener('click', function (e) {
    var b = e.target;
    if (b.tagName !== 'BUTTON') return;
    sampleRate = Number(b.getAttribute('data-sr'));
    var all = srBtns.querySelectorAll('.seg-btn');
    for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
    b.classList.add('active');
  });

  btnConvert.addEventListener('click', function () {
    if (!buffer || processing) return;
    processing = true;
    btnConvert.disabled = true;
    hideErr();
    clearResult();
    setProgress(0);
    setStatus(t('exportingLabel', '导出中…'));
    var work = buffer;
    function go(buf) {
      if (fmt === 'webm') {
        AK.exportBuffer(buf, fmt, {}, function (p) { setProgress(p); }, done, failed);
        return;
      }
      if (fmt === 'ogg') {
        AK.exportBuffer(buf, fmt, {}, function (p) { setProgress(p); }, done, failed);
        return;
      }
      if (fmt === 'wav') {
        AK.exportBuffer(buf, 'wav', {}, function (p) { setProgress(p); }, done, failed);
        return;
      }
      AK.exportBuffer(buf, 'mp3', { bitrate: bitrate }, function (p) { setProgress(p); }, done, failed);
    }
    function done(blob) {
      clearResult();
      resultUrl = URL.createObjectURL(blob);
      resultAudio.src = resultUrl;
      resultCard.classList.remove('hidden');
      btnDownload.disabled = false;
      btnDownload.querySelector('span').textContent = t('ui.105','下载 .') + fmt;
      setProgress(1);
      processing = false;
      btnConvert.disabled = false;
      setStatus(t('ui.102','转换完成'));
    }
    function failed(err) {
      setProgress(1);
      processing = false;
      btnConvert.disabled = false;
      var detail = err && err.message ? err.message : '';
      var msg;
      if (detail === 'unsupported mime') {
        msg = '当前浏览器不支持 ' + fmt.toUpperCase() + ' 输出，请选择 WAV 或 MP3';
      } else if (detail === 'load error') {
        msg = fmt.toUpperCase() + ' 转换加载失败，请重试或改用 WAV/MP3';
      } else if (detail && detail.indexOf('recorder') !== -1) {
        msg = fmt.toUpperCase() + ' 录制失败，请重试或改用 WAV/MP3';
      } else {
        msg = '转换失败' + (detail ? '（' + detail + '）' : '');
      }
      showErr(msg);
      setStatus(msg, 'error');
    }
    if (sampleRate && sampleRate !== buffer.sampleRate && (fmt === 'wav' || fmt === 'mp3')) {
      AK.resampleBuffer(buffer, sampleRate, go, failed);
    } else {
      go(buffer);
    }
  });

  btnDownload.addEventListener('click', function () {
    if (!resultUrl) return;
    var a = document.createElement('a');
    a.href = resultUrl;
    a.download = AK.getOutputName(file.name, 'converted', fmt);
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setStatus(t('ui.103','已开始下载'));
  });

  var h1 = document.querySelector('h1');
  document.getElementById('dropZone').querySelector('.hint').textContent = t('hint', '点击或拖放音频文件到这里（MP3 / WAV / OGG / AAC / FLAC / M4A / WebM，≤50MB）');
})();
</script>
</body>
</html>
