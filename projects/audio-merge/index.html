<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音频合并器 - S-Jiffy</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../assets/css/global.css">
<style>
.audio-drop{border:2px dashed var(--color-border);border-radius:var(--radius-md);padding:28px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;}
.audio-drop.dragover{border-color:var(--color-text-primary);background:var(--color-bg-soft);}
.audio-drop .ico{font-size:34px;display:block;margin-bottom:8px;color:var(--color-text-disabled);}
.audio-drop .hint{font-size:var(--font-size-sm);color:var(--color-text-secondary);}
.audio-drop input{display:none;}
.timeline{display:flex;height:64px;background:var(--color-bg-soft);border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden;margin-bottom:8px;}
.timeline .seg{flex-shrink:0;border-right:1px solid var(--color-border);position:relative;overflow:hidden;min-width:8px;}
.timeline .seg .nm{position:absolute;bottom:4px;left:4px;right:4px;font-size:10px;color:var(--color-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.timeline .seg .ix{position:absolute;top:4px;left:6px;font-size:10px;color:var(--color-text-disabled);}
.list-note{display:flex;justify-content:space-between;font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-bottom:8px;}
.merge-list{border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden;margin-bottom:8px;}
.merge-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--color-border);font-size:var(--font-size-sm);}
.merge-item:last-child{border-bottom:none;}
.merge-item .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.merge-item .ix{font-size:var(--font-size-xs);color:var(--color-text-disabled);width:18px;text-align:center;flex-shrink:0;}
.merge-item .info{flex:1;min-width:0;}
.merge-item .info .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.merge-item .info .mt{font-size:var(--font-size-xs);color:var(--color-text-secondary);}
.merge-item .ops{display:flex;gap:4px;flex-shrink:0;}
.merge-item .ops button{width:28px;height:28px;border:1px solid var(--color-border);background:transparent;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;color:var(--color-text-secondary);}
.merge-item .ops button:hover{color:var(--color-text-primary);border-color:var(--color-text-primary);}
.merge-item .ops .del:hover{color:var(--color-error);border-color:var(--color-error);}
.fade-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;border:1px solid var(--color-border);border-radius:var(--radius-md);padding:14px;margin-bottom:12px;}
.fade-cell .fh{display:flex;justify-content:space-between;font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-bottom:6px;}
.fade-cell .fh b{color:var(--color-text-primary);}
.fade-cell input[type=range]{width:100%;accent-color:var(--color-text-primary);cursor:pointer;}
.total{display:flex;justify-content:flex-end;font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-bottom:12px;}
.progress{height:6px;background:var(--color-bg-soft);border-radius:3px;overflow:hidden;margin:10px 0 4px;}
.progress>div{height:100%;width:0;background:var(--color-text-primary);transition:width .15s;}
.dl-btn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:var(--radius-md);border:none;background:var(--color-text-primary);color:#fff;font-size:14px;font-weight:500;cursor:pointer;width:100%;}
.dl-btn:disabled{opacity:.4;cursor:not-allowed;}
.dl-btn.green{background:var(--color-success);}
.hidden{display:none;}
.err-msg{padding:10px 14px;background:#fdecea;border:1px solid #f5c6c2;color:var(--color-error);border-radius:var(--radius-md);font-size:var(--font-size-sm);margin-bottom:12px;}
.result-card{border:1px solid #bcd9c0;border-radius:var(--radius-md);padding:14px;margin-bottom:12px;}
.result-card h3{font-size:var(--font-size-sm);font-weight:600;color:var(--color-success);margin-bottom:10px;}
.result-card audio{width:100%;height:40px;margin-bottom:10px;}
</style>
</head>
<body>
<header class="global-header">
<a href="../../index.html" class="logo">S-Jiffy</a>
<select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a>
</header>
<main class="tool-workspace">
<h1 data-i18n="h1">音频合并器</h1>
<p class="tool-desc" data-i18n="desc">将多个音频文件合并为一个。调整顺序并下载为WAV。</p>
<div class="card">
<label class="audio-drop" id="dropZone">
<span class="ico">🎵</span>
<span class="hint"></span>
<input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac,.webm,.mp4" multiple>
</label>
<div class="err-msg hidden" id="errBox"></div>
<div id="stage" class="hidden">
<div class="timeline" id="timeline"></div>
<div class="list-note"><span data-i18n="ui.106">拖动文件调整顺序</span><span id="fileCount"></span></div>
<div class="merge-list" id="mergeList"></div>
<div class="total"><span id="totalDur"></span></div>
<div class="fade-grid">
<div class="fade-cell">
<div class="fh"><span data-i18n="ui.105">淡入</span><b id="fadeInVal">0.20s</b></div>
<input type="range" id="fadeIn" min="0" max="2" step="0.05" value="0.2">
</div>
<div class="fade-cell">
<div class="fh"><span data-i18n="ui.104">淡出</span><b id="fadeOutVal">0.20s</b></div>
<input type="range" id="fadeOut" min="0" max="2" step="0.05" value="0.2">
</div>
</div>
<div class="progress hidden" id="progress"><div id="progressFill"></div></div>
<button class="dl-btn" id="btnMerge" type="button" disabled><span data-i18n="ui.103">合并文件</span></button>
<div class="result-card hidden" id="resultCard">
<h3 data-i18n="mergedPreview">合并预览</h3>
<audio controls id="resultAudio"></audio>
<button class="dl-btn green" id="btnDownload" type="button">⬇ <span data-i18n="downloadMergedWav">下载合并 WAV</span></button>
</div>
</div>
</div>
</main>
<footer class="global-footer">
<div class="tool-status" id="statusBar"></div>
<div data-i18n="common.footer">S-Jiffy · 即用即走</div>
</footer>
<script src="../../assets/js/global.js"></script>
<script src="../../assets/js/i18n.js"></script>
<script src="../../assets/js/audio-core.js"></script>
<script>
(function () {
  var AK = window.AudioKit;
  var dropZone = document.getElementById('dropZone');
  var fileInput = document.getElementById('fileInput');
  var errBox = document.getElementById('errBox');
  var stage = document.getElementById('stage');
  var timeline = document.getElementById('timeline');
  var mergeList = document.getElementById('mergeList');
  var fileCount = document.getElementById('fileCount');
  var totalDur = document.getElementById('totalDur');
  var fadeIn = document.getElementById('fadeIn');
  var fadeOut = document.getElementById('fadeOut');
  var fadeInVal = document.getElementById('fadeInVal');
  var fadeOutVal = document.getElementById('fadeOutVal');
  var btnMerge = document.getElementById('btnMerge');
  var resultCard = document.getElementById('resultCard');
  var resultAudio = document.getElementById('resultAudio');
  var btnDownload = document.getElementById('btnDownload');
  var progress = document.getElementById('progress');
  var progressFill = document.getElementById('progressFill');

  var COLORS = ['#111111', '#346538', '#9a6700', '#8250df', '#0550ae', '#953800'];
  var entries = [];
  var processing = false;
  var resultBlob = null;
  var resultUrl = null;

  function t(key, fb) { var v = (window.I18N && I18N.t) ? I18N.t(key) : null; return (v === key || v == null) ? fb : v; }
  function showErr(msg) { errBox.textContent = msg; errBox.classList.remove('hidden'); }
  function hideErr() { errBox.classList.add('hidden'); }
  function setProgress(p) {
    if (p >= 1) { progress.classList.add('hidden'); return; }
    progress.classList.remove('hidden');
    progressFill.style.width = Math.round(p * 100) + '%';
  }
  function clearResult() {
    if (resultUrl) { URL.revokeObjectURL(resultUrl); resultUrl = null; }
    resultCard.classList.add('hidden');
    resultAudio.src = '';
    resultBlob = null;
  }

  function totalDuration() {
    var sum = 0;
    for (var i = 0; i < entries.length; i++) if (entries[i].duration) sum += entries[i].duration;
    return sum;
  }

  function render() {
    hideErr();
    timeline.innerHTML = '';
    mergeList.innerHTML = '';
    var total = totalDuration();
    for (var i = 0; i < entries.length; i++) {
      var en = entries[i];
      var seg = document.createElement('div');
      seg.className = 'seg';
      seg.style.width = (total > 0 ? (en.duration / total) * 100 : 100 / entries.length) + '%';
      seg.style.background = en.color + '22';
      var ix = document.createElement('span');
      ix.className = 'ix';
      ix.textContent = i + 1;
      var nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = en.file.name;
      seg.appendChild(ix);
      seg.appendChild(nm);
      timeline.appendChild(seg);

      var item = document.createElement('div');
      item.className = 'merge-item';
      item.setAttribute('draggable', 'true');
      item.setAttribute('data-idx', String(i));
      var dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = en.color;
      var ix2 = document.createElement('span');
      ix2.className = 'ix';
      ix2.textContent = i + 1;
      var info = document.createElement('div');
      info.className = 'info';
      var nm2 = document.createElement('div');
      nm2.className = 'nm';
      nm2.textContent = en.file.name;
      var mt = document.createElement('div');
      mt.className = 'mt';
      mt.textContent = en.duration ? AK.formatDuration(en.duration) + ' · ' + AK.formatBytes(en.file.size) : '加载失败';
      info.appendChild(nm2);
      info.appendChild(mt);
      var ops = document.createElement('div');
      ops.className = 'ops';
      var up = document.createElement('button');
      up.type = 'button';
      up.textContent = '↑';
      up.title = '上移';
      up.addEventListener('click', function (idx) { return function () { move(idx, -1); }; }(i));
      var down = document.createElement('button');
      down.type = 'button';
      down.textContent = '↓';
      down.title = '下移';
      down.addEventListener('click', function (idx) { return function () { move(idx, 1); }; }(i));
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.textContent = '✕';
      del.title = '移除';
      del.addEventListener('click', function (idx) { return function () { remove(idx); }; }(i));
      ops.appendChild(up);
      ops.appendChild(down);
      ops.appendChild(del);
      item.appendChild(dot);
      item.appendChild(ix2);
      item.appendChild(info);
      item.appendChild(ops);
      item.addEventListener('dragstart', function (e) {
        e.dataTransfer.setData('text/plain', e.currentTarget.getAttribute('data-idx'));
        e.currentTarget.style.opacity = '0.4';
      });
      item.addEventListener('dragend', function (e) { e.currentTarget.style.opacity = ''; });
      item.addEventListener('dragover', function (e) { e.preventDefault(); });
      item.addEventListener('drop', function (e) {
        e.preventDefault();
        var from = Number(e.dataTransfer.getData('text/plain'));
        var to = Number(e.currentTarget.getAttribute('data-idx'));
        if (!isNaN(from) && from !== to && entries[from]) {
          var moved = entries.splice(from, 1)[0];
          entries.splice(to, 0, moved);
          render();
          setStatus(t('ui.100','已调整顺序'));
        }
      });
      mergeList.appendChild(item);
    }
    fileCount.textContent = t('fileCount', '共 {n} 个文件').replace('{n}', entries.length);
    totalDur.textContent = t('totalDurationLabel', '总时长：{duration}').replace('{duration}', AK.formatDuration(total));
    btnMerge.disabled = entries.length < 2 || processing;
    btnMerge.querySelector('span').textContent = t('mergeNFiles', '合并 {count} 个文件').replace('{count}', entries.length);
    if (entries.length > 0) stage.classList.remove('hidden');
    else stage.classList.add('hidden');
  }

  function move(idx, dir) {
    var to = idx + dir;
    if (to < 0 || to >= entries.length) return;
    var tmp = entries[idx];
    entries[idx] = entries[to];
    entries[to] = tmp;
    render();
  }
  function remove(idx) {
    entries.splice(idx, 1);
    if (entries.length === 0) {
      clearResult();
    }
    render();
  }

  function addFiles(files) {
    hideErr();
    clearResult();
    var list = [];
    for (var i = 0; i < files.length; i++) {
      if (files[i].type && files[i].type.indexOf('audio/') !== 0 && files[i].type !== '') continue;
      list.push(files[i]);
    }
    if (!list.length) {
      showErr(t('mergeAtLeast', '请至少添加 {count} 个文件以合并').replace('{count}', 2));
      setStatus(t('mergeAtLeast', '请至少添加 {count} 个文件以合并').replace('{count}', 2), 'error');
      return;
    }
    var pending = list.length;
    list.forEach(function (f, i) {
      var color = COLORS[(entries.length + i) % COLORS.length];
      entries.push({ file: f, duration: 0, color: color });
      AK.decodeAudioFile(f, function (buf) {
        for (var j = 0; j < entries.length; j++) {
          if (entries[j].file === f) entries[j].duration = buf.duration;
        }
        pending--;
        if (pending === 0) render();
      }, function () {
        pending--;
        if (pending === 0) render();
      });
    });
    render();
  }

  dropZone.addEventListener('click', function () { fileInput.click(); });
  dropZone.addEventListener('dragover', function (e) { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', function () { dropZone.classList.remove('dragover'); });
  dropZone.addEventListener('drop', function (e) {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', function () {
    if (fileInput.files && fileInput.files.length) addFiles(fileInput.files);
    fileInput.value = '';
  });

  fadeIn.addEventListener('input', function () { fadeInVal.textContent = Number(fadeIn.value).toFixed(2) + 's'; });
  fadeOut.addEventListener('input', function () { fadeOutVal.textContent = Number(fadeOut.value).toFixed(2) + 's'; });

  btnMerge.addEventListener('click', function () {
    if (entries.length < 2 || processing) return;
    processing = true;
    btnMerge.disabled = true;
    hideErr();
    clearResult();
    setProgress(0.05);
    setStatus(t('processingLabel', '处理中…'));
    var pending = entries.length;
    var buffers = new Array(entries.length);
    var failed = false;
    entries.forEach(function (en, i) {
      AK.decodeAudioFile(en.file, function (buf) {
        if (failed) return;
        buffers[i] = buf;
        setProgress(0.05 + 0.35 * ((pending - 1) / entries.length));
        pending--;
        if (pending === 0) runMerge();
      }, function () {
        if (failed) return;
        failed = true;
        finishError('部分文件解码失败，请重新添加');
      });
    });
    function runMerge() {
      var ok = true;
      for (var k = 0; k < buffers.length; k++) if (!buffers[k]) { ok = false; break; }
      if (!ok) { finishError('部分文件解码失败，请重新添加'); return; }
      AK.mergeBuffers(buffers, { fadeIn: Number(fadeIn.value), fadeOut: Number(fadeOut.value) }, function (merged) {
        try {
          var blob = AK.audioBufferToWav(merged);
          resultBlob = blob;
          if (resultUrl) URL.revokeObjectURL(resultUrl);
          resultUrl = URL.createObjectURL(blob);
          resultAudio.src = resultUrl;
          resultCard.classList.remove('hidden');
          btnDownload.disabled = false;
          setProgress(1);
          processing = false;
          render();
          setStatus(t('ui.101','合并完成'));
        } catch (e) {
          finishError('合并失败');
        }
      }, function (err) {
        finishError(err && err.message ? err.message : '合并失败');
      });
    }
    function finishError(msg) {
      setProgress(1);
      processing = false;
      render();
      showErr(msg);
      setStatus(msg, 'error');
    }
  });

  btnDownload.addEventListener('click', function () {
    if (!resultBlob) return;
    AK.downloadBlob(resultBlob, 'merged_audio.wav');
    setStatus(t('ui.102','已开始下载'));
  });

  document.getElementById('dropZone').querySelector('.hint').textContent = t('hint', '点击或拖放多个音频文件（MP3 / WAV / OGG / AAC / FLAC / M4A，≤50MB）');
})();
</script>
</body>
</html>
