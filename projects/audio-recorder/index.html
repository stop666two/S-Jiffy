<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>在线录音 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css">
<style>
.rec-bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:var(--space-3);}
.timer-display{font-size:56px;font-weight:600;font-family:var(--font-mono);text-align:center;padding:var(--space-2);}
.rec-state{text-align:center;font-size:var(--font-size-sm);margin-bottom:var(--space-2);min-height:20px;}
.rec-state.recording{color:var(--color-error);font-weight:600;}
.rec-state.paused{color:var(--color-text-secondary);}
.ctrl-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:var(--space-2);}
.rec-list{list-style:none;}
.rec-item{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:var(--space-2) 0;border-bottom:1px solid var(--color-border);font-size:var(--font-size-sm);}
.rec-item .meta{min-width:140px;color:var(--color-text-secondary);}
.rec-item audio{height:36px;flex:1;min-width:220px;}
.rec-item .ops{display:flex;gap:8px;}
.rec-item .ops button{height:32px;padding:0 14px;font-size:var(--font-size-xs);border-radius:var(--radius-sm);border:1px solid var(--color-border);background:var(--color-bg);cursor:pointer;color:var(--color-text-primary);}
.rec-item .ops button:hover{background:var(--color-bg-soft);}
.empty-tip{text-align:center;color:var(--color-text-disabled);padding:var(--space-3) 0;font-size:var(--font-size-sm);}
.focus-warn{display:none;background:#fff3e0;color:#e65100;font-size:var(--font-size-sm);padding:var(--space-2);border-radius:var(--radius-md);margin-bottom:var(--space-2);}
</style></head>
<body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
<main class="tool-workspace"><h1 data-i18n="h1">在线录音</h1><p class="tool-desc" data-i18n="desc">使用浏览器麦克风录制音频，支持暂停继续与本地保存，录音数据不出本机。</p>
<div class="card">
<div class="focus-warn" id="focusWarn" data-i18n="ui.1">页面已切换或隐藏，录音仍在后台继续，请勿关闭本页面，以免丢失录音。</div>
<div class="rec-state" id="recState" data-i18n="ui.2">未开始</div>
<div class="timer-display" id="timerDisplay">00:00:00</div>
<div class="ctrl-row">
<button id="startBtn" class="btn btn-primary" data-i18n="ui.3">开始录音</button>
<button id="pauseBtn" class="btn btn-secondary" disabled data-i18n="ui.4">暂停</button>
<button id="stopBtn" class="btn btn-secondary" disabled data-i18n="ui.5">停止</button>
</div>
<p class="opt-hint" style="text-align:center;color:var(--color-text-disabled);font-size:var(--font-size-xs);" data-i18n="ui.6">录音过程中请保持页面在前台，浏览器会持续采集麦克风音频。</p>
</div>
<div class="card">
<h2 style="font-size:var(--font-size-lg);font-weight:600;margin-bottom:var(--space-2);" data-i18n="ui.7">录音列表</h2>
<ul class="rec-list" id="recList"></ul>
<div class="empty-tip" id="emptyTip" data-i18n="ui.8">暂无录音，点击「开始录音」录制第一条。</div>
</div></main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
<script>
(function(){
var startBtn=document.getElementById('startBtn'),pauseBtn=document.getElementById('pauseBtn'),stopBtn=document.getElementById('stopBtn');
var recState=document.getElementById('recState'),timerDisplay=document.getElementById('timerDisplay');
var recList=document.getElementById('recList'),emptyTip=document.getElementById('emptyTip'),focusWarn=document.getElementById('focusWarn');
var stream=null,recorder=null,chunks=[],recording=false,paused=false;
var accMs=0,startMark=0,timerId=null,items=[],itemId=0;
var MIME_CANDIDATES=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/mp4;codecs=mp4a.40.2'];

function fmt(ms){
var s=Math.floor(ms/1000);
var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
return (h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;}
function pickMime(){
if(!window.MediaRecorder)return null;
for(var i=0;i<MIME_CANDIDATES.length;i++){
if(MediaRecorder.isTypeSupported(MIME_CANDIDATES[i]))return MIME_CANDIDATES[i];}
return '';}
function extOf(mime){
if(mime.indexOf('webm')!==-1)return 'webm';
if(mime.indexOf('mp4')!==-1)return 'm4a';
return 'webm';}
function renderItems(){
recList.innerHTML='';
emptyTip.style.display=items.length?'none':'block';
for(var i=0;i<items.length;i++){
(function(it){
var li=document.createElement('li');
li.className='rec-item';
var meta=document.createElement('span');
meta.className='meta';
meta.textContent = t('ui.nth','第 ')+(i+1)+ t('ui.24',' 段 · ')+it.dur;
var audio=document.createElement('audio');
audio.controls=true;
audio.preload='metadata';
audio.src=it.url;
var ops=document.createElement('span');
ops.className='ops';
var dl=document.createElement('button');
dl.textContent = t('ui.23','下载');
dl.addEventListener('click',function(){
try{
var a=document.createElement('a');
a.href=it.url;
a.download='recording-'+it.name+'.'+extOf(it.mime);
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
setStatus(t('ui.22','已开始下载录音'));}
catch(e){setStatus(t('ui.100','下载失败'),'error');}});
var del=document.createElement('button');
del.textContent = t('ui.21','删除');
del.addEventListener('click',function(){
URL.revokeObjectURL(it.url);
var idx=items.indexOf(it);
if(idx>-1)items.splice(idx,1);
renderItems();
setStatus(t('ui.20','已删除该条录音'));});
ops.appendChild(dl);
ops.appendChild(del);
li.appendChild(meta);
li.appendChild(audio);
li.appendChild(ops);
recList.appendChild(li);
})(items[i]);}}

function startRec(){
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
recState.textContent = t('ui.19','当前浏览器不支持录音');
setStatus(t('ui.101','浏览器不支持麦克风录音'),'error');
return;}
if(!window.MediaRecorder){
recState.textContent = t('ui.18','当前浏览器不支持 MediaRecorder');
setStatus(t('ui.102','浏览器不支持 MediaRecorder 录音'),'error');
return;}
navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
stream=s;
var mime=pickMime();
try{
recorder=mime===null?new MediaRecorder(s):new MediaRecorder(s,{mimeType:mime});
}catch(e){
try{recorder=new MediaRecorder(s);}
catch(e2){recState.textContent = t('ui.17','录音初始化失败');setStatus(t('ui.103','录音初始化失败'),'error');return;}}
chunks=[];
recorder.ondataavailable=function(e){if(e.data&&e.data.size>0)chunks.push(e.data);};
recorder.onstop=function(){
var blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});
var url=URL.createObjectURL(blob);
itemId++;
items.push({name:itemId,dur:fmt(accMs),url:url,mime:recorder.mimeType||'audio/webm'});
renderItems();
finishState();
setStatus(t('ui.16','录音已保存到列表'));};
recorder.start(250);
recording=true;paused=false;
accMs=0;startMark=Date.now();
timerId=setInterval(updateTimer,200);
setButtons();
recState.textContent = t('ui.13','录音中…');
recState.className='rec-state recording';
setStatus(t('ui.15','录音已开始，请对准麦克风说话'));}).catch(function(err){
recState.textContent = t('ui.14','麦克风权限被拒绝');
recState.className='rec-state';
setStatus(t('ui.104','无法获取麦克风权限：请在浏览器地址栏或设置中允许本页使用麦克风，并通过 HTTPS 或 localhost 访问本页'),'error');});}
function updateTimer(){
if(paused)return;
accMs+=200;
timerDisplay.textContent=fmt(accMs);}
function finishState(){
recording=false;paused=false;
if(timerId){clearInterval(timerId);timerId=null;}
timerDisplay.textContent='00:00:00';
accMs=0;
if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}
recorder=null;chunks=[];
setButtons();
recState.textContent = t('ui.2','未开始');
recState.className='rec-state';}

function setButtons(){
startBtn.disabled=recording;
pauseBtn.disabled=!recording;
stopBtn.disabled=!recording;
pauseBtn.textContent=paused?'继续':'暂停';}
function togglePause(){
if(!recorder||!recording)return;
if(paused){
recorder.resume();
paused=false;
startMark=Date.now();
recState.textContent = t('ui.13','录音中…');
recState.className='rec-state recording';
setStatus(t('ui.12','已继续录音'));}
else{
recorder.pause();
paused=true;
recState.textContent = t('ui.11','已暂停，点击「继续」恢复录音');
recState.className='rec-state paused';
setStatus(t('ui.10','录音已暂停'));}
setButtons();}

startBtn.addEventListener('click',startRec);
pauseBtn.addEventListener('click',togglePause);
stopBtn.addEventListener('click',function(){
if(!recorder||!recording)return;
if(paused){paused=false;setButtons();}
try{recorder.stop();}
catch(e){finishState();setStatus(t('ui.105','录音已停止'),'error');}});
document.addEventListener('visibilitychange',function(){
if(document.hidden&&recording){
focusWarn.style.display='block';
setStatus(t('ui.9','页面已隐藏，录音仍在后台进行'));}
else{focusWarn.style.display='none';}});

renderItems();
})();
</script></body></html>
