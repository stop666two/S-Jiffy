<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音频分割器 - S-Jiffy</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../assets/css/global.css">
<style>
.audio-drop{border:2px dashed var(--color-border);border-radius:var(--radius-md);padding:28px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;}
.audio-drop.dragover{border-color:var(--color-text-primary);background:var(--color-bg-soft);}
.audio-drop .ico{font-size:34px;display:block;margin-bottom:8px;color:var(--color-text-disabled);}
.audio-drop .hint{font-size:var(--font-size-sm);color:var(--color-text-secondary);}
.audio-drop input{display:none;}
.file-chip{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--color-bg-soft);border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:var(--font-size-sm);margin-bottom:12px;}
.file-chip .meta{color:var(--color-text-secondary);font-size:var(--font-size-xs);margin-top:2px;}
.file-chip .x{cursor:pointer;border:none;background:none;color:var(--color-text-secondary);font-size:14px;padding:4px;}
.file-chip .x:hover{color:var(--color-error);}
.wave-box{position:relative;background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden;margin-bottom:8px;}
.wave-box canvas{display:block;width:100%;height:170px;touch-action:none;}
.kbd-hints{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:var(--font-size-xs);color:var(--color-text-secondary);margin:0 0 12px;}
kbd{padding:1px 6px;background:var(--color-bg-soft);border:1px solid var(--color-border);border-radius:3px;font-family:var(--font-mono);}
.ctrl-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.btn-sm{height:36px;padding:0 16px;font-size:var(--font-size-sm);}
.btn-sm.orange{background:#fff4e0;border-color:#e8c47a;color:#9a6700;}
.btn-sm.orange:hover{background:#ffe8bf;}
.split-list{border:1px solid var(--color-border);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:12px;}
.split-list h3{font-size:var(--font-size-sm);font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.split-list .clear{cursor:pointer;color:var(--color-text-secondary);font-size:var(--font-size-xs);border:none;background:none;}
.split-list .clear:hover{color:var(--color-text-primary);}
.split-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--color-bg-soft);border:1px solid var(--color-border);border-radius:var(--radius-sm);margin-bottom:6px;font-size:var(--font-size-sm);}
.split-item .tm{font-family:var(--font-mono);color:#9a6700;}
.split-item button{border:none;background:none;cursor:pointer;color:var(--color-text-secondary);}
.split-item button:hover{color:var(--color-error);}
.seg-count{display:flex;justify-content:space-between;padding:10px 14px;border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:var(--font-size-sm);color:var(--color-text-secondary);margin-bottom:12px;}
.seg-count b{color:var(--color-text-primary);}
.opt-card{border:1px solid var(--color-border);border-radius:var(--radius-md);padding:14px;margin-bottom:12px;}
.opt-row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;}
.opt-group .lbl{font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-bottom:6px;}
.seg-btn{padding:4px 10px;font-size:var(--font-size-xs);border:1px solid var(--color-border);border-radius:var(--radius-sm);background:transparent;cursor:pointer;color:var(--color-text-primary);}
.seg-btn.active{background:var(--color-text-primary);color:#fff;border-color:var(--color-text-primary);}
.progress{height:6px;background:var(--color-bg-soft);border-radius:3px;overflow:hidden;margin:10px 0 4px;}
.progress>div{height:100%;width:0;background:var(--color-text-primary);transition:width .15s;}
.dl-btn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:var(--radius-md);border:none;background:var(--color-text-primary);color:#fff;font-size:14px;font-weight:500;cursor:pointer;width:100%;}
.dl-btn:disabled{opacity:.4;cursor:not-allowed;}
.hidden{display:none;}
.err-msg{padding:10px 14px;background:#fdecea;border:1px solid #f5c6c2;color:var(--color-error);border-radius:var(--radius-md);font-size:var(--font-size-sm);margin-bottom:12px;}
.result-card{border:1px solid var(--color-border);border-radius:var(--radius-md);padding:14px;margin-bottom:12px;}
.result-card h3{font-size:var(--font-size-sm);font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.result-card .re{border:none;background:none;cursor:pointer;color:var(--color-text-secondary);font-size:var(--font-size-xs);}
.result-card .re:hover{color:var(--color-text-primary);}
.part-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--color-bg-soft);border:1px solid var(--color-border);border-radius:var(--radius-sm);margin-bottom:6px;font-size:var(--font-size-sm);}
.part-item .pi-meta{color:var(--color-text-secondary);}
.part-item .pi-meta .tm{font-family:var(--font-mono);color:var(--color-text-disabled);font-size:var(--font-size-xs);}
.part-item .dl{flex-shrink:0;height:32px;padding:0 14px;font-size:var(--font-size-xs);border:none;border-radius:var(--radius-sm);background:var(--color-text-primary);color:#fff;cursor:pointer;}
</style>
</head>
<body>
<header class="global-header">
<a href="../../index.html" class="logo">S-Jiffy</a>
<select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a>
</header>
<main class="tool-workspace">
<h1 data-i18n="h1">音频分割器</h1>
<p class="tool-desc" data-i18n="desc">通过指定时间点将音频分割为片段。下载每个片段。</p>
<div class="card">
<label class="audio-drop" id="dropZone">
<span class="ico">🎵</span>
<span class="hint"></span>
<input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac,.webm,.mp4">
</label>
<div class="file-chip hidden" id="fileChip">
<div><div id="fileName"></div><div class="meta" id="fileMeta"></div></div>
<button class="x" id="fileRemove" type="button">✕</button>
</div>
<div class="err-msg hidden" id="errBox"></div>
<div id="waveWrap" class="hidden">
<div class="wave-box"><canvas id="waveCanvas"></canvas></div>
<div class="kbd-hints">
<span><kbd>Space</kbd> <span data-i18n="kbdPauseResume">暂停 / 继续</span></span>
<span><span data-i18n="kbdScrollZoom">滚轮缩放</span></span>
<span><span data-i18n="kbdDragPan">长按拖动平移</span></span>
<span><span data-i18n="kbdDblSplit">双击添加/删除分割点</span></span>
</div>
<div class="ctrl-row">
<button class="btn btn-secondary btn-sm" id="btnPlay" type="button"><span data-i18n="playAll">播放全部</span></button>
<button class="btn btn-secondary btn-sm hidden" id="btnStop" type="button"><span data-i18n="stop">停止</span></button>
<button class="btn btn-secondary btn-sm" id="btnPause" type="button" style="display:none"><span data-i18n="pause">暂停</span></button>
<button class="btn btn-secondary btn-sm orange" id="btnSplitHere" type="button">✂ <span data-i18n="splitHere">在此分割</span></button>
<span style="flex:1"></span>
<span id="zoomWrap"><span style="font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-right:6px" data-i18n="zoomLabel">缩放</span></span>
</div>
<div class="split-list hidden" id="splitListWrap">
<h3><span data-i18n="splitPointsLabel">分割点（0）</span><button class="clear" id="btnClearSplits" type="button">清除全部</button></h3>
<div id="splitList"></div>
</div>
<div class="seg-count"><span data-i18n="segmentsLabel">片段数</span><b id="segCount">1</b></div>
<div class="opt-card">
<div class="opt-row">
<div class="opt-group"><div class="lbl" data-i18n="formatLabel">格式</div>
<div id="fmtBtns">
<button class="seg-btn active" data-fmt="wav" type="button">WAV</button>
<button class="seg-btn" data-fmt="mp3" type="button">MP3</button>
</div></div>
<div class="opt-group hidden" id="bitrateGroup"><div class="lbl" data-i18n="bitrateLabel">比特率</div>
<div id="bitrateBtns">
<button class="seg-btn" data-br="128" type="button">128k</button>
<button class="seg-btn active" data-br="192" type="button">192k</button>
<button class="seg-btn" data-br="320" type="button">320k</button>
</div></div>
</div>
</div>
<div class="progress hidden" id="progress"><div id="progressFill"></div></div>
<button class="dl-btn" id="btnExport" type="button" disabled><span data-i18n="ui.104">导出 1 个片段</span></button>
<div class="result-card hidden" id="resultCard">
<h3><span data-i18n="segmentsReady">片段已就绪</span><button class="re" id="btnReExport" type="button" data-i18n="reExportBtn">重新导出</button></h3>
<div id="partList"></div>
</div>
</div>
</div>
</main>
<footer class="global-footer">
<div class="tool-status" id="statusBar"></div>
<div data-i18n="common.footer">S-Jiffy · 即用即走</div>
</footer>
<script src="../../assets/js/global.js"></script>
<script src="../../assets/js/i18n.js"></script>
<script src="../../assets/js/audio-core.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<script>
(function () {
  var AK = window.AudioKit;
  var dropZone = document.getElementById('dropZone');
  var fileInput = document.getElementById('fileInput');
  var fileChip = document.getElementById('fileChip');
  var fileName = document.getElementById('fileName');
  var fileMeta = document.getElementById('fileMeta');
  var fileRemove = document.getElementById('fileRemove');
  var errBox = document.getElementById('errBox');
  var waveWrap = document.getElementById('waveWrap');
  var canvas = document.getElementById('waveCanvas');
  var btnPlay = document.getElementById('btnPlay');
  var btnStop = document.getElementById('btnStop');
  var btnPause = document.getElementById('btnPause');
  var btnSplitHere = document.getElementById('btnSplitHere');
  var btnClearSplits = document.getElementById('btnClearSplits');
  var splitListWrap = document.getElementById('splitListWrap');
  var splitList = document.getElementById('splitList');
  var segCount = document.getElementById('segCount');
  var fmtBtns = document.getElementById('fmtBtns');
  var bitrateBtns = document.getElementById('bitrateBtns');
  var bitrateGroup = document.getElementById('bitrateGroup');
  var btnExport = document.getElementById('btnExport');
  var resultCard = document.getElementById('resultCard');
  var btnReExport = document.getElementById('btnReExport');
  var partList = document.getElementById('partList');
  var progress = document.getElementById('progress');
  var progressFill = document.getElementById('progressFill');
  var zoomWrap = document.getElementById('zoomWrap');

  var file = null;
  var buffer = null;
  var peaks = null;
  var duration = 0;
  var splits = [];
  var zoom = 1;
  var viewStart = 0;
  var fmt = 'wav';
  var bitrate = 192;
  var processing = false;
  var resultBlobs = [];
  var boundaries = [0];
  var playhead = 0;
  var playEnd = 0;

  var player = AK.createPlayer({
    getBuffer: function () { return buffer; },
    onPlayhead: function (t) { playhead = t; draw(); },
    onState: function (playing, paused) {
      btnStop.classList.toggle('hidden', !(playing || paused));
      btnPause.style.display = (playing && !paused) ? '' : 'none';
      btnPause.querySelector('span').textContent = paused ? t('resume', '继续') : t('pause', '暂停');
    },
    onEnd: function () { draw(); }
  });

  function t(key, fb) { var v = (window.I18N && I18N.t) ? I18N.t(key) : null; return (v === key || v == null) ? fb : v; }
  function showErr(msg) { errBox.textContent = msg; errBox.classList.remove('hidden'); }
  function hideErr() { errBox.classList.add('hidden'); }
  function setProgress(p) {
    if (p >= 1) { progress.classList.add('hidden'); return; }
    progress.classList.remove('hidden');
    progressFill.style.width = Math.round(p * 100) + '%';
  }
  function getSegments() {
    var s = splits.slice().sort(function (a, b) { return a - b; });
    var b = [0].concat(s, [duration]);
    return b;
  }

  function draw() {
    var vd = duration > 0 ? Math.max(0.01, duration / zoom) : 1;
    if (viewStart > duration - vd) viewStart = Math.max(0, duration - vd);
    AK.drawWaveform(canvas, {
      peaks: peaks, duration: duration, viewStart: viewStart, viewDuration: vd,
      splitPoints: splits, playheadSec: player.isPlaying() || player.isPaused() ? playhead : playhead
    });
  }

  function renderSplits() {
    boundaries = getSegments();
    splitListWrap.classList.toggle('hidden', splits.length === 0);
    splitListWrap.querySelector('h3 span').textContent = t('splitPointsLabel', '分割点（{count}）').replace('{count}', splits.length);
    splitList.innerHTML = '';
    for (var i = 0; i < splits.length; i++) {
      (function (sp) {
        var item = document.createElement('div');
        item.className = 'split-item';
        var tm = document.createElement('span');
        tm.className = 'tm';
        tm.textContent = AK.fmtMs(sp);
        var del = document.createElement('button');
        del.type = 'button';
        del.textContent = '✕';
        del.title = '删除分割点';
        del.addEventListener('click', function () {
          splits = splits.filter(function (x) { return x !== sp; });
          renderSplits();
          draw();
        });
        item.appendChild(tm);
        item.appendChild(del);
        splitList.appendChild(item);
      })(splits[i]);
    }
    segCount.textContent = boundaries.length - 1;
    btnExport.querySelector('span').textContent = t('exportNSegments', '导出 {count} 个片段{s}').replace('{count}', boundaries.length - 1).replace('{s}', boundaries.length - 1 > 1 ? 's' : '');
    draw();
  }

  function loadFile(f) {
    hideErr();
    setStatus(t('ui.100','正在解码音频…'));
    AK.decodeAudioFile(f, function (buf) {
      file = f;
      buffer = buf;
      duration = buf.duration;
      splits = [];
      zoom = 1;
      viewStart = 0;
      peaks = AK.computePeaks(buf);
      fileName.textContent = f.name;
      var rate = buf.sampleRate;
      var mono = buf.numberOfChannels === 1;
      fileMeta.textContent = AK.formatDuration(duration) + ' · ' + AK.formatBytes(f.size) + ' · ' + (rate / 1000) + 'kHz · ' + (mono ? 'Mono' : 'Stereo');
      fileChip.classList.remove('hidden');
      waveWrap.classList.remove('hidden');
      dropZone.style.display = 'none';
      btnExport.disabled = false;
      resultCard.classList.add('hidden');
      resultBlobs = [];
      renderSplits();
      draw();
      setStatus(t('ui.101','文件已就绪'));
    }, function () {
      showErr(t('failedToLoad', '加载失败。请确认文件为受支持的音频格式且未损坏。'));
      setStatus(t('failedToLoad', '加载失败。请确认文件为受支持的音频格式且未损坏。'), 'error');
    });
  }

  function addSplitAt(t) {
    if (t <= 0.001 || t >= duration - 0.001) return;
    var dup = false;
    for (var i = 0; i < splits.length; i++) if (Math.abs(splits[i] - t) < 0.05) { dup = true; break; }
    if (dup) return;
    splits.push(t);
    renderSplits();
  }
  function removeSplitNear(t) {
    for (var i = 0; i < splits.length; i++) {
      var vd = duration / zoom;
      var W = canvas.clientWidth;
      var spX = ((splits[i] - viewStart) / vd) * W;
      if (Math.abs(spX - t) <= 24) {
        splits.splice(i, 1);
        renderSplits();
        return true;
      }
    }
    return false;
  }

  dropZone.addEventListener('click', function () { fileInput.click(); });
  dropZone.addEventListener('dragover', function (e) { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', function () { dropZone.classList.remove('dragover'); });
  dropZone.addEventListener('drop', function (e) {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files && e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', function () {
    if (fileInput.files && fileInput.files.length) loadFile(fileInput.files[0]);
    fileInput.value = '';
  });
  fileRemove.addEventListener('click', function () {
    player.stop();
    file = null; buffer = null; peaks = null; duration = 0; splits = [];
    fileChip.classList.add('hidden');
    waveWrap.classList.add('hidden');
    dropZone.style.display = '';
    btnExport.disabled = true;
    resultCard.classList.add('hidden');
    resultBlobs = [];
    setStatus('');
  });

  btnPlay.addEventListener('click', function () { if (buffer) { playhead = 0; player.play(0, duration); } });
  btnPause.addEventListener('click', function () {
    if (player.isPaused()) { player.resume(); btnPause.querySelector('span').textContent = t('pause', '暂停'); }
    else { player.pause(); btnPause.querySelector('span').textContent = t('resume', '继续'); }
  });
  btnStop.addEventListener('click', function () { player.stop(); draw(); });
  btnSplitHere.addEventListener('click', function () { addSplitAt(playhead); });
  btnClearSplits.addEventListener('click', function () { splits = []; renderSplits(); });

  [1, 2, 4, 8, 16].forEach(function (z) {
    var b = document.createElement('button');
    b.className = 'seg-btn' + (z === 1 ? ' active' : '');
    b.textContent = z + '×';
    b.addEventListener('click', function () {
      zoom = z;
      var vd = duration / z;
      var center = playhead > 0 ? playhead : viewStart + (duration / zoom) / 2;
      viewStart = AK.clamp(center - vd / 2, 0, Math.max(0, duration - vd));
      var btns = zoomWrap.querySelectorAll('.seg-btn');
      for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
      b.classList.add('active');
      draw();
    });
    zoomWrap.appendChild(b);
  });

  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    var W = canvas.clientWidth;
    var rect = canvas.getBoundingClientRect();
    var mx = e.clientX - rect.left;
    var mTime = viewStart + (mx / W) * (duration / zoom);
    var factor = e.deltaY > 0 ? 0.75 : 1 / 0.75;
    var newZoom = AK.clamp(zoom * factor, 1, 64);
    var newVD = duration / newZoom;
    zoom = newZoom;
    viewStart = AK.clamp(mTime - (mx / W) * newVD, 0, Math.max(0, duration - newVD));
    draw();
  }, { passive: false });

  var drag = null;
  canvas.addEventListener('pointerdown', function (e) {
    if (!buffer) return;
    var rect = canvas.getBoundingClientRect();
    var x = e.clientX - rect.left;
    var W = canvas.clientWidth;
    var H = canvas.clientHeight - 30;
    var vd = duration / zoom;
    if (e.clientY > rect.top + H) return;
    if (zoom > 1) {
      drag = { type: 'pan', startX: x, startVS: viewStart };
    } else {
      drag = { type: 'seek', startX: x };
    }
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var rect = canvas.getBoundingClientRect();
    var x = e.clientX - rect.left;
    var W = canvas.clientWidth;
    var vd = duration / zoom;
    if (drag.type === 'pan') {
      viewStart = AK.clamp(drag.startVS - ((x - drag.startX) / W) * vd, 0, Math.max(0, duration - vd));
      draw();
    }
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!drag) return;
    var rect = canvas.getBoundingClientRect();
    var x = e.clientX - rect.left;
    var W = canvas.clientWidth;
    var vd = duration / zoom;
    var t = AK.clamp(viewStart + (x / W) * vd, 0, duration);
    if (drag.type === 'seek') {
      playhead = t;
      player.stop();
      draw();
    }
    drag = null;
  });
  canvas.addEventListener('dblclick', function (e) {
    if (!buffer) return;
    var rect = canvas.getBoundingClientRect();
    var x = e.clientX - rect.left;
    var W = canvas.clientWidth;
    var vd = duration / zoom;
    if (!removeSplitNear(x)) {
      addSplitAt(viewStart + (x / W) * vd);
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.code !== 'Space') return;
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    e.preventDefault();
    if (player.isPlaying() || player.isPaused()) {
      if (player.isPaused()) { player.resume(); btnPause.querySelector('span').textContent = t('pause', '暂停'); }
      else { player.pause(); btnPause.querySelector('span').textContent = t('resume', '继续'); }
    } else if (buffer) {
      player.play(playhead, duration);
    }
  });

  window.addEventListener('resize', function () { if (buffer) draw(); });

  fmtBtns.addEventListener('click', function (e) {
    var b = e.target;
    if (b.tagName !== 'BUTTON') return;
    fmt = b.getAttribute('data-fmt');
    var all = fmtBtns.querySelectorAll('.seg-btn');
    for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
    b.classList.add('active');
    bitrateGroup.classList.toggle('hidden', fmt !== 'mp3');
  });
  bitrateBtns.addEventListener('click', function (e) {
    var b = e.target;
    if (b.tagName !== 'BUTTON') return;
    bitrate = Number(b.getAttribute('data-br'));
    var all = bitrateBtns.querySelectorAll('.seg-btn');
    for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
    b.classList.add('active');
  });

  btnExport.addEventListener('click', function () {
    if (!buffer || processing) return;
    if (splits.length === 0) { setStatus(t('ui.102','请先添加分割点'), 'error'); return; }
    processing = true;
    btnExport.disabled = true;
    hideErr();
    setProgress(0);
    resultBlobs = [];
    boundaries = getSegments();
    setStatus(t('exportingSegments', '正在导出片段…'));
    var blobs = [];
    var idx = 0;
    var ext = fmt;
    function next() {
      if (idx >= boundaries.length - 1) {
        resultBlobs = blobs;
        renderParts();
        setProgress(1);
        processing = false;
        btnExport.disabled = false;
        setStatus(t('segmentsReady', '片段已就绪'));
        return;
      }
      AK.trimBuffer(buffer, boundaries[idx], boundaries[idx + 1], function (trimmed) {
        AK.exportBuffer(trimmed, fmt, { bitrate: bitrate }, function () {}, function (blob) {
          blobs.push(blob);
          idx++;
          setProgress(idx / (boundaries.length - 1));
          next();
        }, function (err) {
          finishErr(err);
        });
      }, function () { finishErr(new Error('trim failed')); });
    }
    function finishErr(err) {
      setProgress(1);
      processing = false;
      btnExport.disabled = false;
      showErr(err && err.message ? err.message : '导出失败');
      setStatus(t('ui.103','导出失败'), 'error');
    }
    next();
  });

  function renderParts() {
    partList.innerHTML = '';
    for (var i = 0; i < resultBlobs.length; i++) {
      (function (blob, n) {
        var item = document.createElement('div');
        item.className = 'part-item';
        var meta = document.createElement('span');
        meta.className = 'pi-meta';
        meta.innerHTML = t('partLabel', '第 {n} 部分').replace('{n}', n + 1) + ' <span class="tm">' + AK.fmtMs(boundaries[n]) + ' – ' + AK.fmtMs(boundaries[n + 1]) + '</span> · ' + AK.formatBytes(blob.size);
        var dl = document.createElement('button');
        dl.type = 'button';
        dl.className = 'dl';
        dl.textContent = t('download', '下载');
        dl.addEventListener('click', function () {
          AK.downloadBlob(blob, AK.getOutputName(file.name, 'part' + (n + 1), ext));
          setStatus('已开始下载片段 ' + (n + 1));
        });
        item.appendChild(meta);
        item.appendChild(dl);
        partList.appendChild(item);
      })(resultBlobs[i], i);
    }
    resultCard.classList.remove('hidden');
    resultCard.querySelector('h3 span').textContent = t('segmentsReady', '{count} 个片段已就绪').replace('{count}', resultBlobs.length);
  }

  btnReExport.addEventListener('click', function () {
    resultCard.classList.add('hidden');
    resultBlobs = [];
    btnExport.click();
  });

  document.getElementById('dropZone').querySelector('.hint').textContent = t('hint', '点击或拖放音频文件到这里（MP3 / WAV / OGG / AAC / FLAC / M4A，≤50MB）');
})();
</script>
</body>
</html>
