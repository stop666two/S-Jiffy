<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数字进制转换器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .bc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-2); }
    .bc-field label { display: block; font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: 4px; }
    .bc-field .input { font-family: var(--font-mono); }
    .bc-all { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--space-2); margin-top: var(--space-3); }
    .bc-all .item { background: var(--color-bg-soft); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-2); }
    .bc-all .item .lbl { font-size: var(--font-size-xs); color: var(--color-text-secondary); }
    .bc-all .item .val { font-family: var(--font-mono); font-size: var(--font-size-base); font-weight: 600; word-break: break-all; margin-top: 2px; }
    .bc-all .item:hover { border-color: var(--color-text-primary); cursor: pointer; }
    .bc-hint { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: var(--space-2); }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">数字进制转换器</h1>
    <p class="tool-desc" data-i18n="desc">即时在十进制、二进制、八进制和十六进制之间转换数字。</p>
    <div class="card">
      <p class="bc-hint" data-i18n="baseConvertLive">在任意栏输入即可实时转换。</p>
      <div class="bc-grid">
        <div class="bc-field">
          <label data-i18n="binary">二进制</label>
          <input id="bcBin" class="input js-focus-input" type="text" autocomplete="off" spellcheck="false" placeholder="1010">
        </div>
        <div class="bc-field">
          <label data-i18n="octal">八进制</label>
          <input id="bcOct" class="input" type="text" autocomplete="off" spellcheck="false" placeholder="12">
        </div>
        <div class="bc-field">
          <label id="bcDecLabel">十进制</label>
          <input id="bcDec" class="input" type="text" autocomplete="off" spellcheck="false" placeholder="10">
        </div>
        <div class="bc-field">
          <label data-i18n="hexadecimal">十六进制</label>
          <input id="bcHex" class="input" type="text" autocomplete="off" spellcheck="false" placeholder="A">
        </div>
      </div>
    </div>
    <div class="card" id="bcAllBox" style="display:none;">
      <p class="bc-hint" data-i18n="allRepresentations">所有表示</p>
      <div class="bc-all" id="bcAllGrid"></div>
    </div>
    <div class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="common.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>
    (function () {
      var fields = {
        '2': document.getElementById('bcBin'),
        '8': document.getElementById('bcOct'),
        '10': document.getElementById('bcDec'),
        '16': document.getElementById('bcHex')
      };
      var allBox = document.getElementById('bcAllBox');
      var allGrid = document.getElementById('bcAllGrid');
      var outputEl = document.getElementById('outputText');
      var copyBtn = document.getElementById('copyBtn');

      document.getElementById('bcDecLabel').textContent = t('decimal', '十进制');

      var B = [
        { base: 2, key: 'binary', prefix: '0b', fallback: '二进制' },
        { base: 8, key: 'octal', prefix: '0o', fallback: '八进制' },
        { base: 10, key: 'decimal', prefix: '', fallback: '十进制' },
        { base: 16, key: 'hexadecimal', prefix: '0x', fallback: '十六进制' }
      ];

      function fillFrom(field, base) {
        var raw = field.value.trim();
        if (!raw) {
          for (var k in fields) { if (String(k) !== String(base)) fields[k].value = ''; }
          allBox.style.display = 'none';
          outputEl.textContent = '';
          return;
        }
        var n = parseInt(raw, base);
        if (isNaN(n)) {
          for (var k2 in fields) { if (String(k2) !== String(base)) fields[k2].value = ''; }
          allBox.style.display = 'none';
          outputEl.textContent = '';
          setStatus(t('invalidNumber', '请输入当前进制的有效数字'), 'error');
          return;
        }
        for (var k3 in fields) {
          if (String(k3) !== String(base)) fields[k3].value = n.toString(parseInt(k3, 10)).toUpperCase();
        }
        renderAll(n);
        outputEl.textContent = B.map(function (b) {
          return (b.prefix || '') + n.toString(b.base).toUpperCase() + ' (' + t(b.key, b.fallback) + ')';
        }).join('\n');
        setStatus(t('done', '计算完成'));
      }

      function renderAll(n) {
        allGrid.innerHTML = '';
        var i, item, lbl, val;
        for (i = 0; i < B.length; i++) {
          item = document.createElement('div');
          item.className = 'item';
          lbl = document.createElement('div');
          lbl.className = 'lbl';
          lbl.textContent = t(B[i].key, B[i].fallback);
          val = document.createElement('div');
          val.className = 'val';
          val.textContent = (B[i].prefix || '') + n.toString(B[i].base).toUpperCase();
          item.appendChild(lbl);
          item.appendChild(val);
          (function (v) {
            item.addEventListener('click', function () {
              copyToClipboard(v, copyBtn);
              setStatus(t('common.copied', '已复制'));
            });
          })(val.textContent);
          allGrid.appendChild(item);
        }
        allBox.style.display = '';
      }

      Object.keys(fields).forEach(function (b) {
        fields[b].addEventListener('input', function () { fillFrom(fields[b], parseInt(b, 10)); });
      });

      copyBtn.addEventListener('click', function () {
        if (outputEl.textContent) {
          copyToClipboard(outputEl.textContent, copyBtn);
          setStatus(t('common.copied', '已复制'));
        }
      });
    })();
  </script>
</body>
</html>
