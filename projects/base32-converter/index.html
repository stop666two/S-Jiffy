<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Base32 编解码 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css"><style>
.code-pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:250px}@media(max-width:700px){.code-pair{grid-template-columns:1fr}}.code-pair textarea{height:250px;resize:vertical;font-family:var(--font-mono);font-size:13px;padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-md);outline:none}.code-pair textarea:focus{border-color:var(--color-text-primary);box-shadow:var(--shadow-focus)}
</style></head><body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
<main class="tool-workspace"><h1 data-i18n="h1">Base32 编解码</h1><p class="tool-desc" data-i18n="desc">Base32 编码/解码（RFC 4648 标准）。支持 UTF-8 文本。</p>
<div class="card">
<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
<button id="encodeBtn" class="btn btn-primary" data-i18n="ui.encode">编码</button>
<button id="decodeBtn" class="btn btn-secondary" data-i18n="ui.decode">解码</button>
<button id="clearBtn" class="btn btn-secondary" data-i18n="ui.clear">清空</button>
</div>
<div class="code-pair">
<textarea id="inputText" class="js-focus-input" data-i18n-placeholder="ui.104" placeholder="输入文本...">Hello, S-Jiffy!</textarea>
<textarea id="outputText" readonly data-i18n-placeholder="ui.105" placeholder="结果..." style="background:var(--color-bg-soft);"></textarea>
</div>
</div>
<div class="output-box"><span id="statusText" style="display:block;padding-right:60px;"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
</main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script></script><script>(function(){
var ALPHABET='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';

function bytesToBase32(bytes){
var result='';
var bits=0;
var bitCount=0;
for(var i=0;i<bytes.length;i++){
bits=(bits<<8)|bytes[i];
bitCount+=8;
while(bitCount>=5){
bitCount-=5;
result+=ALPHABET[(bits>>bitCount)&31];
}
}
if(bitCount>0){
result+=ALPHABET[(bits<<(5-bitCount))&31];
}
while(result.length%8)result+='=';
return result;
}

function base32ToBytes(str){
str=str.replace(/=+$/,'').toUpperCase();
var result=[];
var bits=0;
var bitCount=0;
for(var i=0;i<str.length;i++){
var idx=ALPHABET.indexOf(str[i]);
if(idx===-1)continue;
bits=(bits<<5)|idx;
bitCount+=5;
if(bitCount>=8){
bitCount-=8;
result.push((bits>>bitCount)&255);
}
}
return new Uint8Array(result);
}

function encode(){
var text=inputEl.value;
if(!text){outputEl.value='';statusText.textContent='';setStatus(t('ui.100','请输入内容'),'error');return;}
try{
var encoder=new TextEncoder();
var bytes=encoder.encode(text);
var base32=bytesToBase32(bytes);
outputEl.value=base32;
statusText.textContent = t('ui.2','编码完成，')+base32.length+ t('ui.chars',' 字符');
setStatus('');
}catch(e){setStatus(t('ui.101','编码错误'),'error');}
}

function decode(){
var text=inputEl.value.trim();
if(!text){outputEl.value='';statusText.textContent='';setStatus(t('ui.102','请输入 Base32'),'error');return;}
try{
var bytes=base32ToBytes(text);
var decoder=new TextDecoder();
var decoded=decoder.decode(bytes);
outputEl.value=decoded;
statusText.textContent = t('ui.1','解码完成，')+decoded.length+ t('ui.chars',' 字符');
setStatus('');
}catch(e){setStatus(t('ui.103','解码错误：Base32 格式无效'),'error');}
}

var inputEl=document.getElementById('inputText');
var outputEl=document.getElementById('outputText');
var encodeBtn=document.getElementById('encodeBtn');
var decodeBtn=document.getElementById('decodeBtn');
var clearBtn=document.getElementById('clearBtn');
var statusText=document.getElementById('statusText');
var copyBtn=document.getElementById('copyBtn');

encodeBtn.addEventListener('click',encode);
decodeBtn.addEventListener('click',decode);
clearBtn.addEventListener('click',function(){inputEl.value='';outputEl.value='';statusText.textContent='';setStatus('');inputEl.focus();});
copyBtn.addEventListener('click',function(){if(outputEl.value){copyToClipboard(outputEl.value,copyBtn);setStatus(t('ui.copied','已复制'));}});
})();</script></body></html>
