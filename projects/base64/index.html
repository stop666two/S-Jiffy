<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Base64 编解码 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css">
<style>
.b64-preview{max-width:200px;max-height:200px;border:1px solid var(--color-border);border-radius:var(--radius-sm);margin-top:8px;}
.b64-file-info{font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-top:4px;}
.opt-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:var(--font-size-sm);}
.valid-msg{padding:4px 12px;border-radius:9999px;font-size:var(--font-size-xs);display:inline-block;}
.valid-msg.ok{background:#e8f5e9;color:#2e7d32;}
.valid-msg.fail{background:#ffebee;color:#c62828;}
</style></head>
<body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><a href="../../index.html" class="back-btn">← 返回</a></header>
<main class="tool-workspace">
<h1 data-i18n="b64.h1">Base64 编解码</h1>
<p class="tool-desc" data-i18n="b64.desc">文本与 Base64 标准/URL安全模式互相转换，支持文件上传。</p>
<div class="card">
<div class="opt-row">
<label><input type="radio" name="b64mode" value="standard" checked> <span data-i18n="b64.optStandard">标准模式</span></label>
<label><input type="radio" name="b64mode" value="urlsafe"> <span data-i18n="b64.optUrlSafe">URL 安全模式</span></label>
<label><input type="checkbox" id="chkValidate"> <span data-i18n="b64.chkValidate">编解码校验</span></label>
</div>
<textarea id="inputText" class="input textarea js-focus-input" placeholder="输入文本..." data-i18n-placeholder="b64.placeholder" style="min-height:120px;"></textarea>
</div>
<div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
    <button id="fileBtn" class="btn btn-secondary" style="height:36px;font-size:13px;min-width:auto;" data-i18n="common.fileSelect">📁 选择文件</button>
    <input type="file" id="fileInput" style="display:none">
    <span id="fileInfo" class="b64-file-info"></span>
</div>
<div class="action-bar" style="display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;">
<button id="encodeBtn" class="btn btn-primary" data-i18n="b64.encode">编码</button>
<button id="decodeBtn" class="btn btn-secondary" data-i18n="b64.decode">解码</button>
<button id="clearBtn" class="btn btn-secondary" data-i18n="b64.clear">清空</button>
</div>
<div class="output-box" id="输出Container">
<span id="outputText" style="display:block;padding-right:60px;"></span>
<button class="copy-btn" id="copyBtn" data-i18n="common.copy">复制</button>
</div>
<div id="validation结果" style="margin-top:var(--space-2);"></div>
<div id="previewArea" style="display:none;margin-top:var(--space-2);">
<div class="card" style="text-align:center;">
<img id="previewImage" class="b64-preview" src="" alt="预览">
<div style="margin-top:8px;"><button id="downloadImgBtn" class="btn btn-secondary" data-i18n="b64.downloadImage">下载图片</button></div>
</div></div></main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
<script src="../../assets/js/i18n.js"></script>
<script>
(function(){
  var inputEl=document.getElementById('inputText'),outputEl=document.getElementById('outputText'),fileInput=document.getElementById('fileInput'),fileBtn=document.getElementById('fileBtn'),fileInfo=document.getElementById('fileInfo');
  var previewArea=document.getElementById('previewArea'),previewImage=document.getElementById('previewImage'),downloadImgBtn=document.getElementById('downloadImgBtn'),vr=document.getElementById('validation结果');

  function getMode(){var r=document.getElementsByName('b64mode');for(var i=0;i<r.length;i++){if(r[i].checked)return r[i].value;}return'standard';}

  function toStandard(b64){return b64.replace(/-/g,'+').replace(/_/g,'/');}
  function toUrlSafe(b64){return b64.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}

  function isValidBase64(str){try{var s=toStandard(str);return btoa(atob(s))===s;}catch(e){return false;}}

  function process(type){
    var text=inputEl.value.trim(),mode=getMode(),validate=document.getElementById('chkValidate').checked;
    if(!text){outputEl.textContent='';previewArea.style.display='none';setStatus(t('b64.emptyInput','请输入内容'),'error');return;}
    try{
      var result;
      if(type==='encode'){var encoded=btoa(unescape(encodeURIComponent(text)));result=mode==='urlsafe'?toUrlSafe(encoded):encoded;
        if(validate){vr.innerHTML='<span class="valid-msg ok">'+t('b64.validEncode','编码有效（可解码还原）')+'</span>';}}else{var processed=mode==='urlsafe'?toStandard(text):text;
        if(validate&&!isValidBase64(processed)){vr.innerHTML='<span class="valid-msg fail">'+t('b64.invalidInput','无效的 Base64 输入')+'</span>';}else{vr.innerHTML='';}
        result=decodeURIComponent(escape(atob(processed)));}
      outputEl.textContent=result;
      if(type==='decode'){if(text.startsWith('data:image/')){previewArea.style.display='block';previewImage.src=text;
        var mime=text.match(/^data:([^;]+);/);downloadImgBtn.onclick=function(){var l=document.createElement('a');l.download='decoded.'+(mime?mime[1].split('/')[1]:'png');l.href=text;l.click();setStatus(t('b64.downloaded','已下载'));};}else{previewArea.style.display='none';}}
      setStatus('');}catch(e){outputEl.textContent='';previewArea.style.display='none';setStatus(t('b64.invalidFormat','无效的 Base64 格式'),'error');}}

  if(fileBtn)fileBtn.addEventListener('click',function(){fileInput.click();});
  fileInput.addEventListener('change',function(){
    var file=this.files[0];if(!file){fileInfo.textContent='';return;}
    fileInfo.textContent=file.name+' ('+file.size+' '+t('b64.bytes','字节')+')';
    var reader=new FileReader();
    reader.onload=function(e){var b=e.target.result;inputEl.value=b;outputEl.textContent=b;previewArea.style.display='block';previewImage.src=b;
      downloadImgBtn.onclick=function(){var l=document.createElement('a');l.download=file.name;l.href=b;l.click();};setStatus(t('b64.fileLoaded','已加载文件'));};
    reader.readAsDataURL(file);});

  encodeBtn.addEventListener('click',function(){process('encode');});
  decodeBtn.addEventListener('click',function(){process('decode');});
  clearBtn.addEventListener('click',function(){inputEl.value='';outputEl.textContent='';fileInput.value='';fileInfo.textContent='';previewArea.style.display='none';vr.innerHTML='';setStatus('');inputEl.focus();});
  copyBtn.addEventListener('click',function(){var r=outputEl.textContent;if(r){copyToClipboard(r,copyBtn);setStatus(t('common.copied','已复制'));}});
})();
</script></body></html>
