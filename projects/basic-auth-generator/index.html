<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Auth 生成器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .auth-row { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; }
    .auth-row .field { flex:1; min-width:200px; }
    .auth-row label { display:block; font-size:var(--font-size-sm); color:var(--color-text-secondary); margin-bottom:4px; }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
  <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">Basic Auth 生成</h1>
    <p class="tool-desc" data-i18n="desc">将用户名和密码转换为 HTTP Basic Authentication 请求头。</p>
    <div class="card">
      <div class="auth-row">
        <div class="field"><label for="authUsername" data-i18n="ui.1">用户名</label><input id="authUsername" class="input" type="text" placeholder="username"></div>
        <div class="field"><label for="authPassword" data-i18n="ui.2">密码</label><input id="authPassword" class="input" type="password" placeholder="password"></div>
      </div>
      <div style="margin-top:var(--space-3);"><button id="generateBtn" class="btn btn-primary" data-i18n="ui.3">生成 Header</button></div>
    </div>
    <div class="output-box">
      <span id="outputText" style="display:block; padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>
    (function() {
      var authUsername = document.getElementById('authUsername');
      var authPassword = document.getElementById('authPassword');
      var generateBtn = document.getElementById('generateBtn');
      var outputEl = document.getElementById('outputText');
      var copyBtn = document.getElementById('copyBtn');

      generateBtn.addEventListener('click', function () {
        var user = authUsername.value;
        var pass = authPassword.value;
        if (!user && !pass) { setStatus(t('ui.100','请输入用户名和密码'), 'error'); return; }
        var token = btoa(unescape(encodeURIComponent(user + ':' + pass)));
        var header = 'Authorization: Basic ' + token;
        outputEl.textContent = header;
        setStatus('');
      });

      copyBtn.addEventListener('click', function () {
        var text = outputEl.textContent;
        if (text) { copyToClipboard(text, copyBtn); setStatus(t('ui.copiedClip','已复制到剪贴板')); }
      });
    })();
  </script>
</body>
</html>
