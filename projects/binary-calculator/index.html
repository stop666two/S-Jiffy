<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>二进制计算器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .bi-row { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-2); }
    .bi-field { flex: 1; min-width: 220px; }
    .bi-field label { display: block; font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: 4px; }
    .bi-field .input { font-family: var(--font-mono); }
    .bi-dec { font-size: var(--font-size-xs); color: var(--color-text-secondary); margin-top: 4px; font-family: var(--font-mono); }
    .bi-ops { display: flex; gap: var(--space-1); flex-wrap: wrap; margin-bottom: var(--space-2); }
    .bi-ops button { min-width: 56px; height: 44px; font-family: var(--font-mono); font-size: var(--font-size-lg); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); cursor: pointer; transition: all .15s; }
    .bi-ops button.active { background: var(--color-text-primary); color: #fff; border-color: var(--color-text-primary); }
    .bi-ops button:hover { border-color: var(--color-text-primary); }
    .bi-result-row { display: flex; justify-content: space-between; align-items: center; padding: var(--space-1) 0; border-bottom: 1px solid var(--color-border); font-family: var(--font-mono); }
    .bi-result-row:last-child { border-bottom: none; }
    .bi-result-row .lbl { font-size: var(--font-size-sm); color: var(--color-text-secondary); }
    .bi-result-row .val { font-weight: 600; word-break: break-all; text-align: right; }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">二进制计算器</h1>
    <p class="tool-desc" data-i18n="desc">对二进制数进行加减乘除运算，结果同时以二进制、十进制和十六进制显示。</p>
    <div class="card">
      <div class="bi-row">
        <div class="bi-field">
          <label data-i18n="binary">二进制 A</label>
          <input id="biA" class="input js-focus-input" type="text" autocomplete="off" spellcheck="false" placeholder="1010">
          <p class="bi-dec" id="decA">= 0</p>
        </div>
        <div class="bi-field">
          <label data-i18n="binary">二进制 B</label>
          <input id="biB" class="input" type="text" autocomplete="off" spellcheck="false" placeholder="0110">
          <p class="bi-dec" id="decB">= 0</p>
        </div>
      </div>
      <div class="bi-ops" id="opBar">
        <button type="button" data-op="+" class="active">+</button>
        <button type="button" data-op="-">−</button>
        <button type="button" data-op="*">×</button>
        <button type="button" data-op="/">÷</button>
      </div>
      <div>
        <button id="calcBtn" class="btn btn-primary" data-i18n="calculate">计算</button>
        <button id="clearBtn" class="btn btn-secondary" data-i18n="clear">清空</button>
      </div>
    </div>
    <div class="card" id="resultCard" style="display:none;">
      <div class="bi-result-row"><span class="lbl" data-i18n="binaryResult">二进制结果</span><span class="val" id="resBin">—</span></div>
      <div class="bi-result-row"><span class="lbl" id="decLbl" data-i18n="ui.101">十进制</span><span class="val" id="resDec">—</span></div>
      <div class="bi-result-row"><span class="lbl" id="hexLbl" data-i18n="ui.100">十六进制</span><span class="val" id="resHex">—</span></div>
    </div>
    <div class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="common.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>
    (function () {
      var aEl = document.getElementById('biA');
      var bEl = document.getElementById('biB');
      var decA = document.getElementById('decA');
      var decB = document.getElementById('decB');
      var op = '+';
      var resultCard = document.getElementById('resultCard');
      var outputEl = document.getElementById('outputText');
      var copyBtn = document.getElementById('copyBtn');

      document.getElementById('decLbl').textContent = t('decimal', '十进制');
      document.getElementById('hexLbl').textContent = t('hexadecimal', '十六进制');
      document.getElementById('clearBtn').textContent = t('clear', '清空');

      function parseBin(v) {
        var s = String(v || '').replace(/\s/g, '');
        if (!s) return null;
        if (!/^[01]+$/.test(s)) return NaN;
        return parseInt(s, 2);
      }

      function updateDec() {
        var na = parseBin(aEl.value);
        var nb = parseBin(bEl.value);
        decA.textContent = '= ' + (isNaN(na) ? t('invalid', '无效') : (na === null ? '0' : na));
        decB.textContent = '= ' + (isNaN(nb) ? t('invalid', '无效') : (nb === null ? '0' : nb));
      }

      aEl.addEventListener('input', function () {
        aEl.value = aEl.value.replace(/[^01\s]/g, '');
        updateDec();
      });
      bEl.addEventListener('input', function () {
        bEl.value = bEl.value.replace(/[^01\s]/g, '');
        updateDec();
      });

      var opBtns = document.querySelectorAll('#opBar button');
      var i;
      for (i = 0; i < opBtns.length; i++) {
        (function (btn) {
          btn.addEventListener('click', function () {
            op = btn.getAttribute('data-op');
            for (var j = 0; j < opBtns.length; j++) opBtns[j].className = '';
            btn.className = 'active';
          });
        })(opBtns[i]);
      }

      function calc() {
        var na = parseBin(aEl.value);
        var nb = parseBin(bEl.value);
        if (aEl.value.replace(/\s/g, '') === '' || bEl.value.replace(/\s/g, '') === '') {
          setStatus(t('emptyInput', '请输入两个二进制数'), 'error');
          return;
        }
        if (isNaN(na)) { setStatus(t('invalidA', '无效的二进制数 A'), 'error'); return; }
        if (isNaN(nb)) { setStatus(t('invalidB', '无效的二进制数 B'), 'error'); return; }

        var result, err = null;
        switch (op) {
          case '+': result = na + nb; break;
          case '-': result = na - nb; break;
          case '*': result = na * nb; break;
          case '/':
            if (nb === 0) { err = t('divByZero', '除数不能为零'); break; }
            result = Math.trunc(na / nb);
            break;
        }
        if (err) { resultCard.style.display = 'none'; outputEl.textContent = ''; setStatus(err, 'error'); return; }
        if (!isFinite(result)) { resultCard.style.display = 'none'; outputEl.textContent = ''; setStatus(t('overflow', '结果溢出'), 'error'); return; }

        var neg = result < 0;
        var abs = Math.abs(result);
        document.getElementById('resBin').textContent = (neg ? '-' : '') + abs.toString(2);
        document.getElementById('resDec').textContent = result;
        document.getElementById('resHex').textContent = (neg ? '-' : '') + abs.toString(16).toUpperCase();
        outputEl.textContent =
          t('binaryResult', '二进制结果') + ': ' + (neg ? '-' : '') + abs.toString(2) +
          ' | ' + t('decimal', '十进制') + ': ' + result +
          ' | ' + t('hexadecimal', '十六进制') + ': ' + (neg ? '-' : '') + abs.toString(16).toUpperCase();
        resultCard.style.display = '';
        setStatus(t('done', '计算完成'));
      }

      document.getElementById('calcBtn').addEventListener('click', calc);
      document.getElementById('clearBtn').addEventListener('click', function () {
        aEl.value = '';
        bEl.value = '';
        decA.textContent = '= 0';
        decB.textContent = '= 0';
        resultCard.style.display = 'none';
        outputEl.textContent = '';
        setStatus('');
      });

      copyBtn.addEventListener('click', function () {
        if (outputEl.textContent) {
          copyToClipboard(outputEl.textContent, copyBtn);
          setStatus(t('common.copied', '已复制'));
        }
      });
    })();
  </script>
</body>
</html>
