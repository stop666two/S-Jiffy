<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI 计算器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .bmi-row { display: flex; gap: var(--space-2); align-items: flex-end; flex-wrap: wrap; margin-bottom: var(--space-2); }
    .bmi-row label { font-size: var(--font-size-sm); color: var(--color-text-secondary); display: block; margin-bottom: 4px; }
    .bmi-unit-tabs { display: flex; gap: var(--space-1); margin-bottom: var(--space-2); flex-wrap: wrap; }
    .bmi-unit-tabs button { height: 40px; padding: 0 var(--space-2); font-size: var(--font-size-sm); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); cursor: pointer; transition: all .15s; }
    .bmi-unit-tabs button.active { background: var(--color-text-primary); color: #fff; border-color: var(--color-text-primary); }
    .result-big { font-size: 48px; font-weight: 700; text-align: center; padding: var(--space-2) 0; }
    .result-label { text-align: center; font-size: var(--font-size-base); padding: 8px 16px; border-radius: var(--radius-md); margin-top: var(--space-1); }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-1); margin-top: var(--space-2); }
    .detail-item { padding: var(--space-2); background: var(--color-bg-soft); border-radius: var(--radius-md); text-align: center; }
    .detail-item .val { font-size: var(--font-size-lg); font-weight: 600; }
    .detail-item .lbl { font-size: var(--font-size-xs); color: var(--color-text-secondary); margin-top: 4px; }
    .bmi-scale-wrap { margin-top: var(--space-2); }
    .bmi-bar { position: relative; height: 12px; border-radius: 999px; background: linear-gradient(to right, #2196F3 0%, #4CAF50 25%, #FF9800 50%, #F44336 75%, #9C27B0 100%); overflow: visible; }
    .bmi-marker { position: absolute; top: 50%; width: 18px; height: 18px; background: #fff; border: 2px solid var(--color-text-primary); border-radius: 50%; transform: translate(-50%, -50%); transition: left .2s; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
    .bmi-scale-labels { display: flex; justify-content: space-between; font-size: var(--font-size-xs); color: var(--color-text-secondary); margin-top: 4px; }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1 data-i18n="bmi.h1">BMI 计算器</h1>
    <p class="tool-desc" data-i18n="bmi.desc">根据身高体重计算体质指数（BMI）并给出分类与健康体重范围。</p>
    <div class="card">
      <div class="bmi-unit-tabs">
        <button id="unitMetric" class="active" type="button" data-i18n="metricUnit">公制（千克，厘米）</button>
        <button id="unitImperial" type="button" data-i18n="imperialUnit">英制（磅，英寸）</button>
      </div>
      <div class="bmi-row">
        <div>
          <label id="heightLbl" data-i18n="bmi.labelHeight">身高 (cm)</label>
          <input id="height" class="input" type="number" value="170" min="50" max="250" step="0.1">
        </div>
        <div>
          <label id="weightLbl" data-i18n="bmi.labelWeight">体重 (kg)</label>
          <input id="weight" class="input" type="number" value="65" min="10" max="300" step="0.1">
        </div>
        <div style="display:flex;align-items:flex-end;gap:var(--space-1)">
          <button id="calcBtn" class="btn btn-primary" data-i18n="bmi.calc">计算</button>
          <button id="clearBtn" class="btn btn-secondary" style="min-width:auto;padding:0 var(--space-2)" data-i18n="bmi.clear">清空</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="result-big" id="bmiDisplay">—</div>
      <div class="result-label" id="bmiLabel" data-i18n="bmi.hint">输入身高体重后点击计算</div>
      <div class="bmi-scale-wrap" id="scaleWrap" style="display:none;">
        <div class="bmi-bar"><div class="bmi-marker" id="bmiMarker"></div></div>
        <div class="bmi-scale-labels"><span>15</span><span>18.5</span><span>25</span><span>30</span><span>40</span></div>
      </div>
      <div class="detail-grid">
        <div class="detail-item"><div class="val" id="whoVal">—</div><div class="lbl">WHO</div></div>
        <div class="detail-item"><div class="val" id="categoryVal">—</div><div class="lbl" data-i18n="bmi.lblCategory">分类</div></div>
        <div class="detail-item"><div class="val" id="rangeVal">—</div><div class="lbl" data-i18n="bmi.lblRange">健康体重范围</div></div>
        <div class="detail-item"><div class="val" id="idealVal">—</div><div class="lbl" data-i18n="bmi.lblIdeal">理想体重</div></div>
        <div class="detail-item"><div class="val" id="heightVal">—</div><div class="lbl" data-i18n="bmi.lblHeight">身高</div></div>
        <div class="detail-item"><div class="val" id="healthyVal">—</div><div class="lbl" data-i18n="healthyRange">健康范围</div></div>
      </div>
    </div>
    <div class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="common.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>
    (function () {
      var h = document.getElementById('height');
      var w = document.getElementById('weight');
      var b = document.getElementById('bmiDisplay');
      var l = document.getElementById('bmiLabel');
      var cat = document.getElementById('categoryVal');
      var r = document.getElementById('rangeVal');
      var iv = document.getElementById('idealVal');
      var hv = document.getElementById('heightVal');
      var whov = document.getElementById('whoVal');
      var htv = document.getElementById('healthyVal');
      var o = document.getElementById('outputText');
      var scaleWrap = document.getElementById('scaleWrap');
      var marker = document.getElementById('bmiMarker');
      var unit = 'metric';

      var heightLbl = document.getElementById('heightLbl');
      var weightLbl = document.getElementById('weightLbl');

      function setUnit(u) {
        unit = u;
        document.getElementById('unitMetric').className = u === 'metric' ? 'active' : '';
        document.getElementById('unitImperial').className = u === 'imperial' ? 'active' : '';
        var hvNum = parseFloat(h.value);
        var wvNum = parseFloat(w.value);
        if (u === 'metric') {
          heightLbl.textContent = t('heightCm', '身高 (cm)');
          weightLbl.textContent = t('weightKg', '体重 (kg)');
          h.min = '50'; h.max = '250';
          w.min = '10'; w.max = '300';
          if (!isNaN(hvNum)) h.value = Math.round(hvNum * 2.54 * 10) / 10;
          if (!isNaN(wvNum)) w.value = Math.round(wvNum * 0.45359237 * 10) / 10;
        } else {
          heightLbl.textContent = t('heightIn', '身高 (英寸)');
          weightLbl.textContent = t('weightLb', '体重 (磅)');
          h.min = '20'; h.max = '100';
          w.min = '20'; w.max = '700';
          if (!isNaN(hvNum)) h.value = Math.round(hvNum / 2.54 * 10) / 10;
          if (!isNaN(wvNum)) w.value = Math.round(wvNum / 0.45359237 * 10) / 10;
        }
      }

      document.getElementById('unitMetric').addEventListener('click', function () { setUnit('metric'); });
      document.getElementById('unitImperial').addEventListener('click', function () { setUnit('imperial'); });

      var WHO_LABELS = {
        'Underweight': function () { return t('bmiUnderweight', '体重不足'); },
        'Normal weight': function () { return t('bmiNormal', '正常体重'); },
        'Overweight': function () { return t('bmiOverweight', '超重'); },
        'Obese (Class I)': function () { return t('bmiObeseI', '肥胖（I级）'); },
        'Obese (Class II)': function () { return t('bmiObeseII', '肥胖（II级）'); },
        'Obese (Class III)': function () { return t('bmiObeseIII', '肥胖（III级）'); }
      };

      function whoCategory(bmi) {
        if (bmi < 18.5) return 'Underweight';
        if (bmi < 25) return 'Normal weight';
        if (bmi < 30) return 'Overweight';
        if (bmi < 35) return 'Obese (Class I)';
        if (bmi < 40) return 'Obese (Class II)';
        return 'Obese (Class III)';
      }

      function fmt(n) { return Math.round(n * 10) / 10; }

      function calc() {
        var hVal = parseFloat(h.value);
        var wVal = parseFloat(w.value);
        if (!hVal || !wVal || hVal <= 0 || wVal <= 0) {
          setStatus(t('bmi.invalid', '请输入有效的身高和体重'), 'error');
          return;
        }
        var bmi;
        var hM;
        if (unit === 'metric') {
          if (hVal < 50 || hVal > 250) { setStatus(t('bmi.invalid', '请输入有效的身高和体重'), 'error'); return; }
          hM = hVal / 100;
          bmi = wVal / (hM * hM);
        } else {
          if (hVal < 20 || hVal > 100) { setStatus(t('bmi.invalid', '请输入有效的身高和体重'), 'error'); return; }
          bmi = (703 * wVal) / (hVal * hVal);
        }
        bmi = Math.round(bmi * 10) / 10;
        b.textContent = bmi.toFixed(1);

        var catText = '', color = '', catEn = '';
        if (bmi < 18.5) { catText = t('bmi.catUnder', '偏瘦'); color = '#2196F3'; catEn = 'Underweight'; }
        else if (bmi < 24) { catText = t('bmi.catNormal', '正常'); color = '#4CAF50'; catEn = 'Normal'; }
        else if (bmi < 28) { catText = t('bmi.catOver', '超重'); color = '#FF9800'; catEn = 'Overweight'; }
        else if (bmi < 35) { catText = t('bmi.catObese', '肥胖'); color = '#F44336'; catEn = 'Obese'; }
        else { catText = t('bmi.catSevere', '重度肥胖'); color = '#9C27B0'; catEn = 'Severely Obese'; }

        b.style.color = color;
        l.textContent = catText + ' (' + catEn + ')';
        l.style.background = color + '20';
        l.style.color = color;
        cat.textContent = catText;

        var whoEn = whoCategory(bmi);
        whov.textContent = WHO_LABELS[whoEn]() + ' (' + whoEn + ')';

        var hMeter = unit === 'metric' ? hVal / 100 : hVal * 0.0254;
        var minW = 18.5 * hMeter * hMeter;
        var maxW = 24 * hMeter * hMeter;
        var unitSuffix = unit === 'metric' ? ' kg' : ' lbs';
        r.textContent = fmt(minW) + ' - ' + fmt(maxW) + unitSuffix;
        iv.textContent = fmt(22 * hMeter * hMeter) + unitSuffix;
        hv.textContent = (unit === 'metric' ? hVal : Math.round(hVal * 2.54 * 10) / 10) + (unit === 'metric' ? ' cm' : ' cm');

        var healthyLow = unit === 'metric' ? fmt(18.5 * hMeter * hMeter) : fmt(18.5 * (hVal * hVal) / 703);
        var healthyHigh = unit === 'metric' ? fmt(24.9 * hMeter * hMeter) : fmt(24.9 * (hVal * hVal) / 703);
        htv.textContent = healthyLow + ' - ' + healthyHigh + unitSuffix;

        var pct = Math.min(100, Math.max(0, ((bmi - 15) / 25) * 100));
        marker.style.left = pct + '%';
        scaleWrap.style.display = '';

        o.textContent = 'BMI: ' + bmi.toFixed(1) + ' | ' + t('bmi.lblCategory', '分类') + ': ' + catText +
          ' | WHO: ' + WHO_LABELS[whoEn]() +
          ' | ' + t('bmi.lblRange', '健康体重范围') + ': ' + fmt(minW) + '-' + fmt(maxW) + unitSuffix;
        setStatus(t('bmi.done', '计算完成'));
      }

      function clearAll() {
        b.textContent = '—';
        l.textContent = t('bmi.hint', '输入身高体重后点击计算');
        l.style.background = '';
        l.style.color = '';
        cat.textContent = '—';
        whov.textContent = '—';
        r.textContent = '—';
        iv.textContent = '—';
        hv.textContent = '—';
        htv.textContent = '—';
        scaleWrap.style.display = 'none';
        o.textContent = '';
        setStatus('');
      }

      document.getElementById('calcBtn').addEventListener('click', calc);
      document.getElementById('clearBtn').addEventListener('click', clearAll);
      document.getElementById('copyBtn').addEventListener('click', function () {
        if (o.textContent) {
          copyToClipboard(o.textContent, this);
          setStatus(t('common.copied', '已复制'));
        }
      });
    })();
  </script>
</body>
</html>
