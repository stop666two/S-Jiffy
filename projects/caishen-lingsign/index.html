<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>财神灵签 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .logo-text { font-size: var(--font-size-lg); font-weight: 600; }
    .draw-card { text-align: center; }
    .draw-tip { max-width: 540px; margin: 0 auto var(--space-3); font-size: var(--font-size-sm); color: var(--color-text-secondary); line-height: 1.7; }
    .qian-card { position: relative; width: 96px; height: 196px; margin: 0 auto var(--space-3); background: repeating-linear-gradient(90deg, transparent 0 30px, rgba(0,0,0,0.045) 30px 32px), linear-gradient(180deg, #FBF7EE 0%, #F5EDDC 55%, #F1E6CF 100%); border: 1px solid #D9CBAA; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,0.12); overflow: hidden; user-select: none; }
    .qian-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 26px; background: #B3202C; border-radius: 9px 9px 0 0; }
    .qian-card::after { content: "签"; position: absolute; top: 34px; left: 0; right: 0; font-size: 34px; color: #8A4A1F; text-align: center; font-weight: 600; }
    .qian-card.drawing { animation: qianShake 2.5s ease-in-out both; }
    .qian-card.drawing::before { animation: qianPulse 0.5s ease-in-out infinite alternate; }
    .qian-card.drawn::after { content: "✓"; color: #346538; }
    @keyframes qianShake {
      0% { transform: rotate(0deg) translateY(0); }
      12% { transform: rotate(-7deg) translateY(-8px); }
      24% { transform: rotate(6deg) translateY(-16px); }
      36% { transform: rotate(-6deg) translateY(-22px); }
      48% { transform: rotate(7deg) translateY(-16px); }
      60% { transform: rotate(-5deg) translateY(-8px); }
      72% { transform: rotate(4deg) translateY(0); }
      84% { transform: rotate(-2deg) translateY(4px); }
      100% { transform: rotate(0deg) translateY(0); }
    }
    @keyframes qianPulse { from { opacity: 1; } to { opacity: 0.5; } }
    .result-head { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); flex-wrap: wrap; }
    .qian-no { font-size: 28px; font-weight: 700; line-height: 1.2; }
    .ji-badge { display: inline-block; padding: 2px 10px; border-radius: 9999px; border: 1px solid; font-size: var(--font-size-sm); }
    .jl-up { color: #2E5B31; background: #E9F1E9; border-color: #C4D8C6; }
    .jl-mid { color: #8A5B00; background: #F7EFDF; border-color: #E6D5AC; }
    .jl-down { color: #98302E; background: #F7E8E7; border-color: #E4C6C4; }
    .qian-poem { font-size: 17px; line-height: 2; margin-bottom: var(--space-2); }
    .qian-jie { font-size: var(--font-size-sm); color: var(--color-text-secondary); line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
    .qian-extra-line { font-size: var(--font-size-sm); color: var(--color-text-secondary); line-height: 1.8; white-space: pre-wrap; word-break: break-word; margin-top: var(--space-1); }
    .result-actions { display: flex; gap: var(--space-2); margin-top: var(--space-3); flex-wrap: wrap; }
    .result-card.show { animation: fadeUp 0.45s ease-out; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .all-actions { display: flex; gap: var(--space-2); margin-bottom: var(--space-2); }
    .all-list { display: none; }
    .all-row { border: 1px solid var(--color-border); border-radius: var(--radius-md); margin-bottom: 8px; overflow: hidden; }
    .all-head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--color-bg); border: none; cursor: pointer; font-family: var(--font-mono); font-size: 14px; color: var(--color-text-primary); text-align: left; }
    .all-head:hover { background: var(--color-bg-soft); }
    .all-head::after { content: "▸"; margin-left: auto; color: var(--color-text-secondary); }
    .all-row.open .all-head::after { content: "▾"; }
    .all-no { flex-shrink: 0; font-weight: 600; }
    .all-poem { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--color-text-secondary); font-size: var(--font-size-sm); }
    .all-body { display: none; padding: 12px 14px; border-top: 1px dashed var(--color-border); background: var(--color-bg-soft); font-size: var(--font-size-sm); line-height: 1.8; color: var(--color-text-secondary); white-space: pre-wrap; word-break: break-word; }
    .all-row.open .all-body { display: block; }
    .all-poem-full { color: var(--color-text-primary); margin-bottom: 6px; }
    .all-jie { margin-top: 4px; }
    .tool-note { margin-top: var(--space-4); font-size: var(--font-size-xs); color: var(--color-text-disabled); text-align: center; }
    footer.tool-status { padding: var(--space-2) var(--space-3); border-top: 1px solid var(--color-border); }
  </style>
</head>
<body>
  <header class="global-header">
    <a class="back-btn" href="../../index.html">← 返回</a>

  <main class="tool-workspace">
    <h1>财神灵签</h1>
    <p class="tool-desc">财神灵签共六十二支，宜问财运进退、事业成败、谋事求财，得签而明得失。</p>
    <div class="card draw-card">
      <p class="draw-tip">默念所求之事（财运、事业、投资皆可），凝神静心，再开始抽签。</p>
      <div class="qian-card" id="qianCard"></div>
      <button id="drawBtn" class="btn btn-primary">开始抽签</button>
    </div>
    <div class="card result-card" id="resultCard" style="display:none" aria-live="polite">
      <div class="result-head">
        <span class="qian-no" id="resNo"></span>
        <span id="resJi"></span>
      </div>
      <div class="qian-poem" id="resPoem"></div>
      <div class="qian-jie" id="resJie"></div>
      <div id="resExtra"></div>
      <div class="result-actions">
        <button id="againBtn" class="btn btn-secondary">重新抽签</button>
        <button id="copyBtn" class="btn btn-secondary">复制结果</button>
      </div>
    </div>
    <div class="card">
      <div class="all-actions">
        <button id="allToggle" class="btn btn-secondary">查看全部签文</button>
      </div>
      <div class="all-list" id="allList" style="display:none"></div>
    </div>
    <p class="tool-note">本工具数据源自公开传统文化资料，仅供娱乐参考。</p>
  </main>
  <footer class="tool-status" id="statusBar"></footer>
  <script src="../../assets/js/global.js"></script>
  <script>
(function () {
  var CFG = {"name":"财神灵签","poemLabel":"签文","jieLabel":"解签","jieField":"jieyue","extraFields":[]};
  var QIAN = [{"n":1,"no":"第 1 号签","ji":"大吉签","text":"福如东海寿如山富贵荣华天付汝玉殿千官第一班巍巍独步向云间","jieyue":"此籤谋望通达。无不遂意。但各有所主。官员占兹。有超越之喜。士人有功名之望。庶人不吉。若谋望。求财者。有名无实。为语多空虚也。"},{"n":2,"no":"第 2 号签","ji":"上吉签","text":"须凭方寸好修为若问前程归缩地自此君当百事宜盈虚消息总天时","jieyue":"此籤谋望虚。查不宜速进。且须待时。方可成就。婚则合。讼宜和。求财有。行人至。孕生女。病宜祷。大概以正心修德为要。"},{"n":3,"no":"第 3 号签","ji":"中吉签","text":"福禄来成祸不侵但能孝悌存忠信劝君不用苦劳心衣食自然生处有","jieyue":"此籤只宜守旧。不可贪求。但存中直。却得两平。谋事迟。求财阻。婚姻可。风水更。孕将生。宜早保。免忧惊。"},{"n":4,"no":"第 4 号签","ji":"下下签","text":"莫教福谢悔无追好把瓣香告神佛若较今年时运衰去年百事可相宜","jieyue":"此籤吉事已去。凶将渐来。祈祷神明。以保平安。官事临身。是非自见。凡事谋望主不成。求财交易不就。所为皆不利也。"},{"n":5,"no":"第 5 号签","ji":"中平签","text":"万事回春不用忧若逢牛鼠交承日门庭萧索冷如秋子有三般不自由","jieyue":"此籤先忧后喜。三般者。心口意。十二时中却得衣食。官员主有迁移之兆。应在子丑。凶者渐吉。事皆可望也。"},{"n":6,"no":"第 6 号签","ji":"下下签","text":"休将私意忆浓情彼此怀疑不相信寸步如登万里程何劳鼓瑟更吹笙","jieyue":"此籤谓人类不齐。有阳为君子。阴为小人者。须防其面是实非之心。讼只可和。主有离开。凡事谨慎周密。庶不误败。"},{"n":7,"no":"第 7 号签","ji":"大吉签","text":"一朝引领向天行指日丹成谢岩谷又遇仙宗为主盟仙风道骨本天生","jieyue":"此籤。贵人占之有荐投之喜。士人占之有不虞之誉。庶人占之有百倍之利。若占病。当有仙医扶佑。在三七日内有效。否则凶。"},{"n":8,"no":"第 8 号签","ji":"上上签","text":"士农工贾百无忧况遇太平无事日今岁田畴定有秋年来耕稼苦无收","jieyue":"此籤宜改图谋利。凡百事实践之人皆有望。问病占讼。先忧后喜。问孕生男。风水吉利。子孙亨嘉也。"},{"n":9,"no":"第 9 号签","ji":"大吉签","text":"今朝喜色上眉端见说文书将入境常把菱花仔细看望渠消息向长安","jieyue":"此籤谋事尚远。自己心急。他人不知。若问远行。只在百日之内。婚姻有期合。病者宜请祷。大概空虚无的实也。"},{"n":10,"no":"第 10 号签","ji":"下下签","text":"始可求神仗佛持直教重见一阳后何须打瓦共鑽龟病患时时命蹇衰","jieyue":"此籤大意。晓然欲恶人知悔过。若问病讼。十月方可。不然莫解。若作非为。祸患立至。主家神不安也。"},{"n":11,"no":"第 11 号签","ji":"下下签","text":"到头独立转伤神谁识机关难料处富贵荣华萃汝身今年好事一番新","jieyue":"此籤宜更改方得财禄。要知足。不可与人其事。恐机事不密。反成祸败。官有旌麾之喜。孕生男。士有超拔之喜。讼者胜。婚不吉。"},{"n":12,"no":"第 12 号签","ji":"中平签","text":"一生活计始安全直遇清江贵公子谁料秋来又不然营为期望在春前","jieyue":"此籤先忧继疑。最后始定。 谋事须托。傍人扶持。或官场或绅士。方能有成。讼宜休。病择医。直到秋散后。始获安全。慎勿误听谗言。信任非人可也。"},{"n":13,"no":"第 13 号签","ji":"中平签","text":"万人头上逞英雄玉兔重生应发迹且向江头作钓翁君今庚甲未亨通","jieyue":"此籤。君子占有五年之厄。庶人占有五年之难。若能守己。转祸为福。不宜进图更改。休问讼。免是非也。"},{"n":14,"no":"第 14 号签","ji":"下下签","text":"历涉应知行路难人情冷暖君休讶谁知去后有多般一见佳人便喜欢","jieyue":"此籤先喜后忧。不宜放肆。大概亲而又陈。合而复离。历涉险阻。竟无成。尤兢兢业业。庶免后悔。"},{"n":15,"no":"第 15 号签","ji":"中平签","text":"却调琴瑟向兰房直待春风好消息不是姻缘莫较量两家门户各相当","jieyue":"此籤名不成。利不就。婚不合。凡事却待新春。方始称意。若妄作。反劳心力。终不能如人心愿也。"},{"n":16,"no":"第 16 号签","ji":"下下签","text":"此事当谋亲弟兄旁人煽惑君休信不如息了且归耕官事悠悠难辨明","jieyue":"此籤讼事未辨。以和为贵。名利全无。婚姻未当。凡有谋望。且待时来。有人煽惑。勿轻信也。"},{"n":17,"no":"第 17 号签","ji":"下下签","text":"定为后世子孙殃纵使机关图得胜事到公庭彼此伤田园价贯好商量","jieyue":"此籤切须依本分。自有前程。如有机关。反成害己利人。凡谋望。自家商酌方好。名利未遂。宜守平常。 行人有阻。病可禳。婚难成。谨保安康。"},{"n":18,"no":"第 18 号签","ji":"中平签","text":"善为善应永无差牢把脚根踏实地底事茫茫未有涯知君指拟是空华","jieyue":"此籤不宜妄意求谋。无事空自指拟。定必有损。切宜向善。祈祷神灵。转祸成福。事有多般。功名无。讼勿斗。行人迟。财难就。向善保安。乃为上策。"},{"n":19,"no":"第 19 号签","ji":"上吉签","text":"和合婚姻诞贵儿营求动作都如意今年星运颇相宜嗟子从来未得时","jieyue":"此籤不问贵贱。皆有和合之象。谋为各事。从今以后可成就也。"},{"n":20,"no":"第 20 号签","ji":"下下签","text":"功名富贵等浮云世事尽从流水去十八滩头说与君一生心事向谁论","jieyue":"此籤得之外履。程途险阻。终不大吉利。讼终凶。止则吉。功名轻。行人迟。婚未成。凡事到底不吉。宜谨守可也。"},{"n":21,"no":"第 21 号签","ji":"下下签","text":"祈求户内保婵娟好把经文多讽诵今日相逢那得缘与君夙昔结成冤","jieyue":"此籤旧有夙冤。问事无缘。讼凶。贵人占之不吉。庶人占之不利。行人未至。谋望不成。若问病。宜禳谢方保。财物散。不吉利也。"},{"n":22,"no":"第 22 号签","ji":"上吉签","text":"正是人间第一仙生来骨格超凡俗庄严色相自天然碧玉池中开白莲","jieyue":"此籤可谋财。可望事。若有现成。不图自至。不劳心力。讼已决。名利成。病则愈。婚则成。凡事皆成就也。"},{"n":23,"no":"第 23 号签","ji":"下下签","text":"到头万事总成空羡子荣华今已矣贵贱穷通百岁中花开花谢在春风","jieyue":"此籤求望有成有败。初快意。终有害。吉中有凶。否有泰。不善歛藏。后忧更大。名利虐。讼宜散。病防老人为凶。婚未成。行人迟。失物之忧。大不吉也。"},{"n":24,"no":"第 24 号签","ji":"中平(中吉)签","text":"恰如骑鹤与腰缠更遇秋成冬至后夏里营求始帖然一春万事苦忧煎","jieyue":"此籤先难后易。官员占之。有超擢之喜。士人占之。名利晚成。凡诸谋望。只是后好。讼终解。婚姻宜。行人远。病难好。凡事可为。自有成就也。"},{"n":25,"no":"第 25 号签","ji":"中平签","text":"枯木逢春自放花待逢玉兔金鸡会亥子丑月渐亨嘉寅午戍年多阻滞","jieyue":"此籤作事迟疑。至三冬乃通。卯酉日月作事得时。如枯木开花。谋望各事。不劳心力而成。以寅午戍三者为凶。亥子丑年月日为吉。若谋事决。宜审时。不得妄动。讼终息。名利迟。婚姻吉。行人归也。"},{"n":26,"no":"第 26 号签","ji":"中吉签","text":"田畴霑足雨滂沱与子定期三日内祇是今年旱较多年来丰歉皆天数","jieyue":"此籤谋事先损后遂。问病。星运未顺。目下多悔方吉。病遇庚申日安。讼即解。名利难。行人三日内必至。婚未成。求财无。凡事不利达也。"},{"n":27,"no":"第 27 号签","ji":"下下(中平)签","text":"也须步步循规矩英雄豪杰自天生一粒一毫君莫取世间万物各有主","jieyue":"此籤只宜守分。不可妄为。若要谋事。不可以强凌弱。以富压贫。稍涉欺凌。反成灾害。讼必和。名利有。财难求。行人有阻。病宜禳方可。婚不宜也。"},{"n":28,"no":"第 28 号签","ji":"中吉签","text":"才高岂得困林泉人事尽从天理见好把勤劳契上天公侯将相本无种","jieyue":"此籤吉利。凡事切莫歎息。更须修心向善。自有好处。问讼。久方决。名利达。失物寻在。病宜祈保。行人还。求财得。"},{"n":29,"no":"第 29 号签","ji":"上上签","text":"天须还汝旧青毡若更操修无倦已源远流长庆自然祖宗积德几多年","jieyue":"此籤。士人占之大吉。官员占之高擢。庶人占之终有发达。讼得理。病易安。婚必成。名利遂。行人即回。凡事如意。但要修心积善方好。不可着急也。"},{"n":30,"no":"第 30 号签","ji":"中吉签","text":"秋期与子定佳音目下营求且休矣自有亨通吉利临奉公谨守莫欺心","jieyue":"此籤目下不宜妄取。只宜守己。官员占之。必有忧疑。若能谨守。方得吉利。士人占之。且待时来。庶人占之平顺。病宜服药。讼宜和。婚有约。谋望先难后易。不可躁进。安分守己。秋月方佳也。"},{"n":31,"no":"第 31 号签","ji":"中吉签","text":"萱堂快乐未渠央千里信音符远望春到门庭渐吉昌秋冬作事只寻常","jieyue":"此籤秋冬平平。逢春求财谋事。只宜渐进。不可急切。行人至。讼必理。病渐安。婚久成。凡谋事缓。则安康也。"},{"n":32,"no":"第 32 号签","ji":"下下签","text":"何如休要用心机事到头来浑似梦疾病兼多是与非劳心汨汨竟何归","jieyue":"此籤问病不利。讼不好。谋事皆不如意。主口舌之忧。事虽有成。后必有败。空劳心力。只宜安分。不可妄为。"},{"n":33,"no":"第 33 号签","ji":"中平(中吉)签","text":"不论贵贱与穷通熟读黄庭经一卷眼底昏昏耳似聋不分南北与西东","jieyue":"此籤不宜妄想。只宜守旧。自有成就。不意反成得意。无望反成有望。宜谨守所为。不可自专。讼莫兴。病宜禳。利葵贪。行人阻。若修善。自有神助也。"},{"n":34,"no":"第 34 号签","ji":"中平(中吉)签","text":"休把私心情意浓贵人垂手来相接纷纷谋虑搅心胸春夏纔过秋又冬","jieyue":"此籤空虚。指望无成。徒劳自己心力。谋事不就。所为虚费功夫。营求未有发达。若得贵人提携。渐渐亨通。莫信私言巧语。方免聒聒也。"},{"n":35,"no":"第 35 号签","ji":"下下签","text":"空帏无语对银缸谁料半途分折去门里团圆事事双一山如画对清江","jieyue":"此籤坟宅虽吉。命运未通。谋望到底成空。先吉后凶。有始无终。须防有死亡之患。讼必凶。病主险。求财必无。行人有阻也。"},{"n":36,"no":"第 36 号签","ji":"上吉签","text":"吴山顶上好鑽龟万里鹏程君有分偶着先鞭莫问伊功名富贵自能为","jieyue":"此籤不可躁进。欲速则不达。富贵迟速有时。若在家则困苦。出外则震亨。不宜守旧。讼得理。名利晚成。行人阻。婚必成。病渐安。先凶后吉也。"},{"n":37,"no":"第 37 号签","ji":"中吉签","text":"出门无碍是通时屏却昧公心里事善恶平分汝自知焚香来告复何辞","jieyue":"此籤显然说。主人家人有害人之心。而又受人之害。若能悔过则吉。讼宜和。病祈福。求财少。名利难。婚可合。只要心正。无事不吉也。"},{"n":38,"no":"第 38 号签","ji":"下下签","text":"秋冬括括雨靡靡等得荣华公子到千里悬悬望信归蛩吟唧唧守孤帏","jieyue":"此籤主有死亡之忧。哭泣之哀。讼休问。病有险。财莫求。婚难成。行人不至。谋事凶多吉少。秋冬占之大不吉。纵有虚喜。终是大忧。"},{"n":39,"no":"第 39 号签","ji":"中下签","text":"鳞鸿虽便莫修书堪笑包藏许多事若问终时慎厥初北山门外好安居","jieyue":"此籤只宜守旧。不可妄想。谋望迟迟。且待时至。还须退步。方得安宁。病择医。讼宜解。求财无。婚宜审。行人阻。谨慎修为。庶几得以长保。"},{"n":40,"no":"第 40 号签","ji":"上吉签","text":"崎岖历尽见亨衢只听耳边消息到何用随他步与趋新来换得好规模","jieyue":"此籤谋望更变儘好。莫听人言闲是闲非。何必依人。自可远到。名后成。讼得胜。孕生子。保无病。行人回。婚宜定。凡事宜。迟必有馀庆也。"},{"n":41,"no":"第 41 号签","ji":"中吉签","text":"好将名姓榜头题遇鼠逢牛三弄笛欲到天涯谁作梯自南自北自东西","jieyue":"此籤妄意。事务皆无定准。须缓求之。方有成就。讼必反覆。婚有三变之说。遇子丑日。或姓萧之人方可。功名。初年难。望病多变。信能到。婚姻好。名利得。必待子丑年月。方得显达也。"},{"n":42,"no":"第 42 号签","ji":"中吉签","text":"营谋应得称心怀但改新图莫依旧谁料修为果自乖我曾许汝事和谐","jieyue":"此籤宜更改。问婚当有再合之意。讼宜和。利吉。孕生男。求利改图方好。病更医。功名未遂。凡事更改方称意。"},{"n":43,"no":"第 43 号签","ji":"中吉签","text":"保汝平安去复回虽然目下多惊险扁舟速下浪如雷一纸官书火急催","jieyue":"此籤先凶后吉者。谋望终有好处。病者虚险。自然解散。大事成。求官遂。问讼好。婚姻不难。失物还。行人至。凡事大吉。"},{"n":44,"no":"第 44 号签","ji":"中平签","text":"富贵荣华萃汝身坚牢一念酬香愿误为误作损精神汝是人中最吉人","jieyue":"此籤防有横逆事。若能改过。则吉。凡事且也不宜躁进。讼莫作。利未有。婚莫求。病祷神。行人未归。悔过名利双全也。"},{"n":45,"no":"第 45 号签","ji":"中平签","text":"修为到底却输君阴地不如心地好彼此山头总是坟好将心地力耕耘","jieyue":"此籤不可妄求。但依本分。方得天之庥庇。问地利。不宜迁改。行人必至。病则安。求财无。且宜守旧。讼必凶。宜和息。凡事只宜修积善心。庶免灾祸也。"},{"n":46,"no":"第 46 号签","ji":"中平签","text":"争似骑牛得自由今朝马上看山色信知骑马胜骑牛君是山中万户侯","jieyue":"此籤宜守旧。不可妄作。远行必有阻滞。讼必凶。病多险。婚两平。有是非。名利休问。凡事不好。但安分方亨荣华。许君静处安身。可免灾祸。"},{"n":47,"no":"第 47 号签","ji":"下下签","text":"试于清夜把心扪讼则终凶君记取祗欲平和雪尔冤与君万语复千言","jieyue":"此籤不可妄意。切莫贪求。但要和平。冤自可雪。谋事有反覆。婚难成。久而后成。财莫贪。疾未安。讼必凶。若有害人之意。反成殃也。"},{"n":48,"no":"第 48 号签","ji":"中平签","text":"全家谁保汝重欢不遇虎头人一唤兄弟姻亲那得安登山涉水正天寒","jieyue":"此籤家道不安。须防人口舌。怨恨临门(怨恨本作孝眼。意不明)。财有失。逢贵人提挈方保。渐亨不成。多口舌。问婚讼平。病有惊。财物耗散。名利空虚。只宜守旧。不利远行。防亲人侵损也。"},{"n":49,"no":"第 49 号签","ji":"下下签","text":"许多劳碌不如閒日月如梭人易老如何似隔鬼门关彼此居家只一山","jieyue":"此籤事有阻滞。且随缘分。切莫贪求。讼宜和。病有祟。名利阻。问婚不和。家宅有难。阴人有灾。凡事防凶人中途侵害也。"},{"n":50,"no":"第 50 号签","ji":"上平签","text":"萋菲谗言莫听偏一家和气多生福也须步要多週旋人说今年胜去年","jieyue":"此籤大吉。富贵荣华。门庭兴旺。见喜添丁。但谋事要和合。莫信谗言。只宜保守。方得安乐。出入吉。财可求。婚可结。行人至。病得痊。讼宜和。百事亨泰也。"},{"n":51,"no":"第 51 号签","ji":"上吉签","text":"喜逢新运称心田莫叹年来不如意水到渠成听自然君今百事且随缘","jieyue":"此籤好事重重。名利渐达。财缓发。婚可定。行人有信。病渐安。讼得理。时运亨泰。孕生贵子。风水合利。自有称心之望也。"},{"n":52,"no":"第 52 号签","ji":"上吉签","text":"活计扁舟渡北朝黄金忽报秋光好孤灯掩映度清宵兀坐幽居歎寂寥","jieyue":"此籤有文书之喜。谋事先难后易。先忧后喜。图名必高。求财必(得)。婚姻吉。行人回。讼者胜。病渐安。功名有望。百事皆吉。"},{"n":53,"no":"第 53 号签","ji":"下下签","text":"相逢却在夏秋交今日贵人曾识面南鸟孤飞依北巢艰难险阻路蹊跷","jieyue":"此籤历涉艰难。凡事不遂。如南鸟依北巢。失其所居之处。若遇秋之后。方得贵人提携。病宜防。讼亦险。名利俱阻。行人未回。婚能成。财缓有。言目下终未便也。"},{"n":54,"no":"第 54 号签","ji":"中平签","text":"青灯黄卷且勤劳争奈承流风未便便欲飞腾霄汉高万人丛里逞英豪","jieyue":"此籤惺惺成懞憧。凡事皆不如意。只可守旧。休自躁进。徒劳心力。直待时来。自有亨泰。名未超。财未遂。讼不宜。婚休问。行人远。病未安。命运迍。宜谨守也。"},{"n":55,"no":"第 55 号签","ji":"中平签","text":"不如逐岁廪米多纵使经商收倍利衣食随时安分过勤耕力作莫蹉跎","jieyue":"此籤显然说安分。随时谨守方好。名莫贪。讼宜和。病自安。婚自就。远行回。休出入。福禄随分也。"},{"n":56,"no":"第 56 号签","ji":"下下签","text":"身投宪网莫咨嗟一旦丑形临月镜直欲欺官行路斜心头理曲强词遮","jieyue":"此籤先凶后吉。有成有败。不如退步免祸。休问讼。莫求财。病有邪。婚不成。信未同(至)。修阴骘。免凶灾也。"},{"n":57,"no":"第 57 号签","ji":"中平签","text":"纷纷闹里更思量一着仙机君记取莫听人言自主张事端百出虑虽长","jieyue":"此籤只宜退步。不可求胜。莫信人言。当自理会。搀先一着。何忧不济。婚不成。财如常。讼宜和。病蚤禳（蚤应为早字之音误，亦有考证蚤与早相通）。信即至。 孕可虑。祷神康。防人侵害也。"},{"n":58,"no":"第 58 号签","ji":"上吉签","text":"前程万里自通亨更好修为阴骘事富贵功名在此行苏秦三寸足平生","jieyue":"此籤只宜谨慎。不可强为。防有口舌之忧。莫听人言。方可无事。婚宜定。讼决胜。病遇良医即愈。凡谋望远行则吉。求财豊原。功名必得。要修阴德。自然福禄全成。"},{"n":59,"no":"第 59 号签","ji":"中平签","text":"香烟未断续螟蛉幸有祖宗阴骘在可叹祈求不一灵门衰户冷苦伶仃","jieyue":"此籤冷落中有生气。当见重重之喜。必得螟蛉之续。虽然假合。却是前缘。讼且和。财未遂。名难得。婚却合。信音无。病急祈祷。幸有祖宗阴骘可保。更作好事相助也。"},{"n":60,"no":"第 60 号签","ji":"上上签","text":"巍巍科甲两同登丹诏槐黄消息近一意谦撝莫自矜羡君兄弟好名声","jieyue":"此籤百般如意。谋事有成。出入好。求财多。高登科。讼必解。病即癒。财方旺。功名必得。行人即至。孕生男。婚必合。宅舍吉。神明相助也。"},{"n":61,"no":"第 61 号签","ji":"中平签","text":"不用干戈盗贼休主人大笑出门去善良无事苦煎忧啸聚山林凶恶俦","jieyue":"此籤主有惊险。防小人侵害。若能守性存善。却有德曜及身。神明助之。阴消祸变。病恐险。讼必散。财平平。婚宜审。凡事有阴。及后平和。"},{"n":62,"no":"第 62 号签","ji":"中平签","text":"虎头城里喜相寻得胜回时秋渐老赖汝干戈用力百千人面虎狼心","jieyue":"此籤其先险阻。后却亨通。凡事迟滞。防有后难。若遇秋日。事事皆吉。婚成讼胜。病防反覆。财有进退。远行有伤。名利终不遂意。"}];

  function jiLevel(ji) {
    var s = String(ji || "").replace(/^\s+|\s+$/g, "");
    if (!s) return "";
    if (s.indexOf("下") !== -1 || s.indexOf("凶") !== -1) return "down";
    if (s.indexOf("上") !== -1 || s.indexOf("大") !== -1) return "up";
    if (s.indexOf("中") !== -1 || s.indexOf("平") !== -1) return "mid";
    return "mid";
  }

  function makeJiBadge(ji) {
    var span = document.createElement("span");
    span.className = "ji-badge jl-" + jiLevel(ji);
    span.textContent = ji;
    return span;
  }

  function clearChildren(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
  }

  function normalize(q) {
    var n = {
      no: q.no || ("第 " + q.n + " 号签"),
      ji: q.ji || "",
      poem: q.text || q.name || "",
      jie: (CFG.jieField && q[CFG.jieField]) || q.jie || q.jieyue || "",
      extra: []
    };
    for (var i = 0; i < CFG.extraFields.length; i++) {
      var e = CFG.extraFields[i];
      if (q[e.key]) n.extra.push({ label: e.label, value: q[e.key] });
    }
    return n;
  }

  function buildText(q) {
    var lines = [CFG.name + " · " + q.no];
    if (q.ji) lines.push(q.ji);
    if (q.poem) lines.push(CFG.poemLabel + "：" + q.poem);
    lines.push(CFG.jieLabel + "：" + q.jie);
    for (var i = 0; i < q.extra.length; i++) lines.push(q.extra[i].label + "：" + q.extra[i].value);
    return lines.join("\n");
  }

  function showResult(q) {
    resNo.textContent = q.no;
    clearChildren(resJi);
    if (q.ji) {
      var b = makeJiBadge(q.ji);
      if (b) resJi.appendChild(b);
    }
    resPoem.style.display = q.poem ? "" : "none";
    resPoem.textContent = q.poem;
    resJie.textContent = CFG.jieLabel + "：" + q.jie;
    clearChildren(resExtra);
    for (var i = 0; i < q.extra.length; i++) {
      var line = document.createElement("div");
      line.className = "qian-extra-line";
      line.textContent = q.extra[i].label + "：" + q.extra[i].value;
      resExtra.appendChild(line);
    }
    resultCard.style.display = "block";
    resultCard.classList.remove("show");
    void resultCard.offsetWidth;
    resultCard.classList.add("show");
    lastText = buildText(q);
  }

  function startDraw() {
    if (drawing) return;
    if (!QIAN || !QIAN.length) {
      setStatus("签文数据为空，无法抽签", "error");
      return;
    }
    drawing = true;
    drawBtn.textContent = "抽签中...";
    drawBtn.disabled = true;
    resultCard.style.display = "none";
    resultCard.classList.remove("show");
    qianCard.classList.remove("drawing", "drawn");
    void qianCard.offsetWidth;
    qianCard.classList.add("drawing");
    var picked = QIAN[Math.floor(Math.random() * QIAN.length)];
    setTimeout(function () {
      qianCard.classList.remove("drawing");
      qianCard.classList.add("drawn");
      drawBtn.textContent = "开始抽签";
      drawBtn.disabled = false;
      drawing = false;
      showResult(normalize(picked));
    }, 2600);
  }

  drawBtn.addEventListener("click", startDraw);
  againBtn.addEventListener("click", startDraw);

  copyBtn.addEventListener("click", function () {
    if (!lastText) return;
    copyToClipboard(lastText, copyBtn);
    setStatus("结果已复制到剪贴板");
  });

  allToggle.addEventListener("click", function () {
    var open = allList.style.display !== "none";
    allList.style.display = open ? "none" : "block";
    allToggle.textContent = open ? "查看全部签文" : "收起全部签文";
  });

  (function buildAll() {
    for (var i = 0; i < QIAN.length; i++) {
      var q = normalize(QIAN[i]);
      var row = document.createElement("div");
      row.className = "all-row";
      var head = document.createElement("button");
      head.type = "button";
      head.className = "all-head";
      var noSpan = document.createElement("span");
      noSpan.className = "all-no";
      noSpan.textContent = q.no;
      head.appendChild(noSpan);
      if (q.ji) {
        var b = makeJiBadge(q.ji);
        if (b) head.appendChild(b);
      }
      var poemSpan = document.createElement("span");
      poemSpan.className = "all-poem";
      poemSpan.textContent = q.poem || q.jie;
      head.appendChild(poemSpan);
      var body = document.createElement("div");
      body.className = "all-body";
      var p = document.createElement("div");
      p.className = "all-poem-full";
      p.textContent = q.poem;
      body.appendChild(p);
      var j = document.createElement("div");
      j.className = "all-jie";
      j.textContent = CFG.jieLabel + "：" + q.jie;
      body.appendChild(j);
      for (var k = 0; k < q.extra.length; k++) {
        var line = document.createElement("div");
        line.className = "all-jie";
        line.textContent = q.extra[k].label + "：" + q.extra[k].value;
        body.appendChild(line);
      }
      row.appendChild(head);
      row.appendChild(body);
      head.addEventListener("click", function (e) { e.currentTarget.parentNode.classList.toggle("open"); });
      allList.appendChild(row);
    }
  })();
})();
  </script>
</body>
</html>
