<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>校验和计算器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .drop-zone{border:2px dashed var(--color-border);border-radius:var(--radius-md);padding:var(--space-4);text-align:center;color:var(--color-text-secondary);font-size:var(--font-size-sm);cursor:pointer;transition:all .2s;margin-bottom:var(--space-3)}
    .drop-zone.dragover{border-color:var(--color-text-primary);background:var(--color-bg-soft)}
    .drop-zone .fname{font-size:var(--font-size-base);color:var(--color-text-primary);margin-top:8px;word-break:break-all}
    .checksum-grid{display:grid;gap:6px}
    .chk-row{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--color-bg-soft);border:1px solid var(--color-border);border-radius:var(--radius-md)}
    .chk-row .lbl{width:80px;font-size:var(--font-size-sm);font-weight:600;flex-shrink:0}
    .chk-row .val{font-family:var(--font-mono);font-size:13px;word-break:break-all;flex:1;min-width:0}
    .chk-row .cpy{font-size:var(--font-size-xs);color:var(--color-text-secondary);cursor:pointer;flex-shrink:0;padding:2px 6px;border-radius:var(--radius-sm)}
    .chk-row .cpy:hover{background:rgba(0,0,0,.05)}
    .progress-row{margin-bottom:var(--space-2);display:flex;align-items:center;gap:12px;display:none}
    .progress-row .bar{flex:1;height:4px;background:var(--color-border);border-radius:2px;overflow:hidden}
    .progress-row .bar .fill{height:100%;background:var(--color-text-primary);width:0;transition:width .3s}
    .text-mode-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--space-3)}
    .text-mode-row .input{flex:1;min-width:200px}
    .chk-header{font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-bottom:var(--space-1)}
    .chk-type-name{font-size:var(--font-size-sm);color:var(--color-text-secondary);margin-bottom:var(--space-2)}
  </style>
</head>
<body>
  <header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a></header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">校验和计算器</h1>
    <p class="tool-desc" data-i18n="desc">计算文件或文本的 CRC16、CRC32、Adler-32、MD5、SHA-1、SHA-256 校验和，支持拖放文件。<span id="httpsWarning" style="display:none;font-size:var(--font-size-xs);color:var(--color-error);margin-top:4px;" data-i18n="ui.1">⚠ 需 HTTPS/localhost 环境</span></p>
    <div class="card">
      <div class="text-mode-row">
        <input id="textInput" class="input js-focus-input" data-i18n-placeholder="ui.101" placeholder="输入文本计算校验和...">
        <button id="textCalcBtn" class="btn btn-secondary" data-i18n="ui.calc">计算</button>
        <button id="clearBtn" class="btn btn-secondary" style="min-width:auto;padding:0 12px;" data-i18n="ui.clear">清空</button>
      </div>
      <div class="drop-zone" id="dropZone" data-i18n="ui.drop">
        拖放文件到此处，或点击选择文件
        <div class="fname" id="fileName"></div>
      </div>
      <input id="fileInput" type="file" style="display:none">
      <div class="progress-row" id="progressRow"><span style="font-size:var(--font-size-xs);color:var(--color-text-secondary)" data-i18n="ui.2">计算中...</span><div class="bar"><div class="fill" id="progressFill"></div></div></div>
      <div class="chk-type-name" id="sourceLabel" data-i18n="ui.3">计算结果显示在此</div>
      <div class="checksum-grid" id="checksumGrid"></div>
    </div>
    <div class="output-box"><span id="outputText"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.4">复制全部</button></div>
  </main>
  <footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>
    (function() {
      var textInp=document.getElementById('textInput');
      var textBtn=document.getElementById('textCalcBtn');
      var clearBtn=document.getElementById('clearBtn');
      var drop=document.getElementById('dropZone');
      var fname=document.getElementById('fileName');
      var fileInp=document.getElementById('fileInput');
      var prog=document.getElementById('progressRow');
      var progFill=document.getElementById('progressFill');
      var grid=document.getElementById('checksumGrid');
      var sourceLabel=document.getElementById('sourceLabel');
      var out=document.getElementById('outputText');
      var copyBtn=document.getElementById('copyBtn');

      var algos=[
        {id:'CRC16',name:'CRC-16'},
        {id:'CRC32',name:'CRC-32'},
        {id:'ADLER32',name:'Adler-32'},
        {id:'MD5',name:'MD5'},
        {id:'SHA-1',name:'SHA-1'},
        {id:'SHA-256',name:'SHA-256'},
        {id:'SHA-384',name:'SHA-384'},
        {id:'SHA-512',name:'SHA-512'}
      ];

      function crc16(str) {
        var crc = 0xFFFF;
        for (var i = 0; i < str.length; i++) {
          crc ^= str.charCodeAt(i);
          for (var j = 0; j < 8; j++) {
            crc = (crc & 1) ? (0x8408 ^ (crc >>> 1)) : (crc >>> 1);
          }
        }
        return (crc ^ 0xFFFF).toString(16).padStart(4,'0');
      }

      function crc32(str) {
        var crc = 0xFFFFFFFF;
        for (var i = 0; i < str.length; i++) {
          crc ^= str.charCodeAt(i);
          for (var j = 0; j < 8; j++) {
            crc = (crc & 1) ? (0xEDB88320 ^ (crc >>> 1)) : (crc >>> 1);
          }
        }
        return (crc >>> 0).toString(16).padStart(8,'0');
      }

      function adler32(str) {
        var a = 1, b = 0;
        for (var i = 0; i < str.length; i++) {
          a = (a + str.charCodeAt(i)) % 65521;
          b = (b + a) % 65521;
        }
        return ((b << 16) | a).toString(16).padStart(8,'0');
      }

      function md5(input) {
        var bytes;
        if (typeof input === 'string') {
          bytes = [];
          for (var si = 0; si < input.length; si++) bytes.push(input.charCodeAt(si) & 0xFF);
        } else {
          bytes = input;
        }
        var n = bytes.length;
        var paddedLen = (((n + 8) >> 6) + 1) << 6;
        var data = new Uint8Array(paddedLen);
        for (var di = 0; di < n; di++) data[di] = bytes[di];
        data[n] = 0x80;
        var dv = new DataView(data.buffer);
        var bitLen = n * 8;
        dv.setUint32(paddedLen - 8, bitLen >>> 0, true);
        dv.setUint32(paddedLen - 4, Math.floor(bitLen / 4294967296), true);
        var s = [7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
        var K = [];
        for (var ki = 0; ki < 64; ki++) K[ki] = Math.floor(Math.abs(Math.sin(ki + 1)) * 4294967296) >>> 0;
        var a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476;
        function rol(x, c) { return (x << c) | (x >>> (32 - c)); }
        function add32(x, y) { return (x + y) >>> 0; }
        for (var i = 0; i < paddedLen; i += 64) {
          var M = [];
          for (var j = 0; j < 16; j++) M[j] = dv.getUint32(i + j * 4, true);
          var A = a0, B = b0, C = c0, D = d0;
          for (var k = 0; k < 64; k++) {
            var F, g;
            if (k < 16) { F = (B & C) | (~B & D); g = k; }
            else if (k < 32) { F = (D & B) | (~D & C); g = (5 * k + 1) % 16; }
            else if (k < 48) { F = B ^ C ^ D; g = (3 * k + 5) % 16; }
            else { F = C ^ (B | ~D); g = (7 * k) % 16; }
            var tmp = add32(add32(add32(A, F), K[k]), M[g]);
            var oldD = D;
            D = C; C = B;
            B = add32(B, rol(tmp, s[k]));
            A = oldD;
          }
          a0 = add32(a0, A); b0 = add32(b0, B); c0 = add32(c0, C); d0 = add32(d0, D);
        }
        function toHex(v) {
          var h = '';
          for (var bi = 0; bi < 4; bi++) {
            var byte = (v >>> (bi * 8)) & 0xFF;
            h += (byte < 16 ? '0' : '') + byte.toString(16);
          }
          return h;
        }
        return toHex(a0) + toHex(b0) + toHex(c0) + toHex(d0);
      }

      function showChecksums(hexValues) {
        grid.innerHTML = '';
        var allVals = [];
        for (var i = 0; i < algos.length; i++) {
          var row = document.createElement('div');
          row.className = 'chk-row';
          var val = hexValues[algos[i].id] || '—';
          allVals.push(algos[i].id + ': ' + val);
          row.innerHTML = '<span class="lbl">'+algos[i].name+'</span><span class="val">'+val+'</span><span class="cpy" data-val="'+val+'">'+t('ui.copy','复制')+'</span>';
          grid.appendChild(row);
          row.querySelector('.cpy').addEventListener('click',function(){
            var v=this.getAttribute('data-val');
            if(v&&v!=='—'){copyToClipboard(v,document.getElementById('copyBtn'));setStatus(t('ui.copied','已复制 ') +this.parentElement.querySelector('.lbl').textContent)}
          });
        }
        out.textContent = allVals.join('\n');
      }

      function computeText() {
        var t = textInp.value;
        if (!t) { setStatus(t('ui.100','请输入文本'),'error'); return; }
        sourceLabel.textContent = t('ui.11','文本校验和');
        var vals = {};
        vals['CRC16'] = crc16(t);
        vals['CRC32'] = crc32(t);
        vals['ADLER32'] = adler32(t);
        prog.style.display = 'block';
        progFill.style.width = '30%';

        var encoder = new TextEncoder();
        var data = encoder.encode(t);
        vals['MD5'] = md5(data);
        var digests = [
          crypto.subtle.digest('SHA-1', data),
          crypto.subtle.digest('SHA-256', data),
          crypto.subtle.digest('SHA-384', data),
          crypto.subtle.digest('SHA-512', data)
        ];
        Promise.all(digests).then(function(results) {
          var names = ['SHA-1','SHA-256','SHA-384','SHA-512'];
          for (var i = 0; i < results.length; i++) {
            vals[names[i]] = Array.from(new Uint8Array(results[i])).map(function(b){
              return b.toString(16).padStart(2,'0');
            }).join('');
          }
          progFill.style.width = '100%';
          showChecksums(vals);
          setTimeout(function(){ prog.style.display = 'none'; progFill.style.width = '0'; }, 500);
          setStatus(t('ui.calcDone','计算完成'));
        }).catch(function(err) {
          setStatus(t('ui.10','计算失败：') + (err && err.message ? err.message : String(err)), 'error');
          prog.style.display = 'none';
        });
      }

      function computeFile(file) {
        sourceLabel.textContent = t('ui.9','文件: ') + file.name;
        fname.textContent = file.name;
        prog.style.display = 'flex';
        progFill.style.width = '10%';

        var reader = new FileReader();
        reader.onprogress = function(e) {
          if (e.lengthComputable) {
            progFill.style.width = Math.min(30, (e.loaded / e.total * 30)) + '%';
          }
        };
        reader.onload = function(e) {
          var data = new Uint8Array(e.target.result);
          progFill.style.width = '35%';

          var text = '';
          for (var i = 0; i < data.length; i++) {
            text += String.fromCharCode(data[i]);
          }
          var vals = {};
          vals['CRC16'] = crc16(text);
          vals['CRC32'] = crc32(text);
          vals['ADLER32'] = adler32(text);
          vals['MD5'] = md5(data);
          progFill.style.width = '50%';

          var digests = [
            crypto.subtle.digest('SHA-1', data),
            crypto.subtle.digest('SHA-256', data),
            crypto.subtle.digest('SHA-384', data),
            crypto.subtle.digest('SHA-512', data)
          ];
          Promise.all(digests).then(function(results) {
            var names = ['SHA-1','SHA-256','SHA-384','SHA-512'];
            for (var i = 0; i < results.length; i++) {
              vals[names[i]] = Array.from(new Uint8Array(results[i])).map(function(b){
                return b.toString(16).padStart(2,'0');
              }).join('');
            }
            progFill.style.width = '100%';
            showChecksums(vals);
            setTimeout(function(){ prog.style.display = 'none'; progFill.style.width = '0'; }, 500);
            setStatus(t('ui.8','文件校验完成'));
          }).catch(function(err) {
            setStatus(t('ui.7','校验失败：') + (err && err.message ? err.message : String(err)), 'error');
            prog.style.display = 'none';
          });
        };
        reader.readAsArrayBuffer(file);
      }

      textBtn.addEventListener('click', computeText);
      textInp.addEventListener('keydown', function(e) { if (e.key === 'Enter') computeText(); });

      clearBtn.addEventListener('click', function() {
        textInp.value = '';
        fname.textContent = '';
        sourceLabel.textContent = t('ui.3','计算结果显示在此');
        grid.innerHTML = '';
        out.textContent = '';
        setStatus(t('ui.6','已清空'));
      });

      drop.addEventListener('click', function() { fileInp.click(); });
      drop.addEventListener('dragover', function(e) { e.preventDefault(); drop.classList.add('dragover'); });
      drop.addEventListener('dragleave', function() { drop.classList.remove('dragover'); });
      drop.addEventListener('drop', function(e) {
        e.preventDefault();
        drop.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
          computeFile(e.dataTransfer.files[0]);
        }
      });
      fileInp.addEventListener('change', function() {
        if (this.files.length > 0) {
          computeFile(this.files[0]);
        }
      });

      copyBtn.addEventListener('click', function() {
        var text = out.textContent;
        if (text) { copyToClipboard(text, copyBtn); setStatus(t('ui.5','已复制全部校验和')); }
      });
    })();
  if(!isSecureContext()){var w=document.getElementById('httpsWarning');if(w)w.style.display='block';}</script>
</body>
</html>
