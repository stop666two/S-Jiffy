<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>点击劫持检测 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css">
<style>.status-card{padding:16px;border-radius:var(--radius-md);text-align:center;font-weight:600;margin-bottom:var(--space-2);}.status-protected{background:#e6f4ea;color:var(--color-success);}.status-vulnerable{background:#fce8e6;color:var(--color-error);}.status-unknown{background:#fef7e0;color:#e37400;}.detail-row{padding:6px 0;border-bottom:1px solid var(--color-border);font-size:var(--font-size-sm);display:flex;gap:8px;}.detail-row:last-child{border:none;}.detail-label{color:var(--color-text-secondary);min-width:140px;}</style><!-- seo:start (generated by scripts/gen-meta.js) -->

</head><body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language" onchange="try{localStorage.setItem('s-jiffy:lang',this.value)}catch(e){}location.reload()"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a></header>
<main class="tool-workspace"><h1 data-i18n="h1">点击劫持检测</h1><p class="tool-desc" data-i18n="desc">检测网站是否配置了 X-Frame-Options 或 CSP frame-ancestors 防御点击劫持攻击</p>
<div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;"><input id="urlInput" class="input js-focus-input" placeholder="https://example.com" style="flex:1;"><button id="checkBtn" class="btn btn-primary" data-i18n="ui.1">检测</button></div>
<div class="card" id="resultCard" style="display:none;"><div id="statusDisplay" class="status-card"></div><div id="detailsList"></div><div id="recommendation" style="margin-top:var(--space-2);padding-top:var(--space-2);border-top:1px solid var(--color-border);font-size:var(--font-size-sm);color:var(--color-text-secondary);"></div><div style="margin-top:var(--space-2);padding-top:var(--space-2);border-top:1px solid var(--color-border);font-size:var(--font-size-xs);color:var(--color-text-secondary);"><strong data-i18n="ui.2">检测原理与局限：</strong><br><span data-i18n="ui.7">① 本工具为纯前端检测，结果受浏览器策略差异与目标站点可达性影响，仅作参考。</span><br><span data-i18n="ui.8">② 目标通过 X-Frame-Options 或 CSP 拒绝嵌入时，不同浏览器行为不同（部分触发加载成功但内容不可读，部分触发加载失败），可能导致判定偏差。</span><br><span data-i18n="ui.9">③ 检测结果代表「当前浏览器视角」，建议结合响应头信息或服务端工具进一步确认。</span></div></div>
<div class="output-box"><span id="outputText"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
</main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
<script>(function(){
var urlInput=document.getElementById('urlInput'),checkBtn=document.getElementById('checkBtn'),resultCard=document.getElementById('resultCard'),statusDisplay=document.getElementById('statusDisplay'),detailsList=document.getElementById('detailsList'),recommendation=document.getElementById('recommendation'),outputText=document.getElementById('outputText'),copyBtn=document.getElementById('copyBtn');
var verdictRow=null,auxRows=[],runId=0,currentFrame=null;
function renderDetails(){
  var rows=verdictRow?[verdictRow]:['<div style="padding:8px;color:var(--color-text-secondary);">'+t('ui.3','检测中...')+'</div>'];
  detailsList.innerHTML=rows.concat(auxRows).join('');
}
function removeFrame(frame){
  if(!frame)return;
  if(frame.onload)frame.onload=null;
  if(frame.onerror)frame.onerror=null;
  if(frame.parentNode)frame.parentNode.removeChild(frame);
}
function finish(result){
  statusDisplay.textContent=result.statusText;
  statusDisplay.className='status-card '+result.cls;
  recommendation.innerHTML=result.rec;
  outputText.textContent=result.out;
  verdictRow=result.detail;
  renderDetails();
  setStatus(t('ui.6','检测完成'));
}
function vulnerableDetail(label,text){
  return '<div class="detail-row"><span class="detail-label">'+label+'</span><span style="color:var(--color-error);font-weight:600;">'+text+'</span></div>';
}
function protectedDetail(label,text){
  return '<div class="detail-row"><span class="detail-label">'+label+'</span><span style="color:var(--color-success);font-weight:600;">'+text+'</span></div>';
}
function headerSuggestion(){
  return '<strong>'+t('ui.11','建议：')+'</strong>'+t('ui.12','目标站点应添加响应头 ')+'<code style="background:var(--color-bg-soft);padding:2px 4px;border-radius:3px;">X-Frame-Options: DENY</code>'+t('ui.13',' 或 ')+'<code style="background:var(--color-bg-soft);padding:2px 4px;border-radius:3px;">Content-Security-Policy: frame-ancestors \'none\'</code>'+t('ui.14',' 禁止页面被第三方站点嵌入。');
}
/* 结论判定只依据可验证的证据：
   1) iframe 内的目标文档确认渲染出内容            -> 可嵌入（确定）
   2) 读到明确的 X-Frame-Options / frame-ancestors -> 受保护（确定）
   3) 其余情况（本站 CSP 拦截、跨域读不到响应头、超时）
      -> 无法判定。绝不把"读不到"当成"已保护"。 */
var cspFrameBlocked=false;
document.addEventListener('securitypolicyviolation',function(e){
  var d=e.violatedDirective||'';
  if(d.indexOf('frame-src')===0||d.indexOf('child-src')===0)cspFrameBlocked=true;
});
function probeFrame(url,myRun,state,settle){
  var frame=document.createElement('iframe');
  frame.style.position='fixed';
  frame.style.left='-10000px';
  frame.style.width='900px';
  frame.style.height='600px';
  frame.style.border='0';
  currentFrame=frame;
  var finished=false,timer=null;
  function done(){
    if(finished||myRun!==runId)return;
    finished=true;
    if(timer){clearTimeout(timer);timer=null;}
    if(currentFrame===frame)currentFrame=null;
    removeFrame(frame);
  }
  function setState(kind,note){
    if(myRun!==runId)return;
    state.probe=kind;
    state.probeNote=note||'';
    settle();
  }
  frame.onload=function(){
    if(finished||myRun!==runId)return;
    var doc=null;
    try{doc=frame.contentDocument;}catch(e){doc=null;}
    if(doc){
      var body=null,text='';
      try{body=doc.body;}catch(e2){body=null;}
      try{text=(body&&body.innerHTML)?body.innerHTML.replace(/\s/g,''):'';}catch(e3){text='';}
      if(text){done();setState('embeddable',t('ui.4','目标页面已在 iframe 中成功渲染，可被嵌入'));return;}
    }
    done();
    if(cspFrameBlocked)setState('unknown',t('ui.33','本站的内容安全策略（CSP）阻止了 iframe 探测，因此无法判定目标是否可被嵌入。'));
    else setState('blocked','');
  };
  frame.onerror=function(){
    if(finished||myRun!==runId)return;
    done();
    setState('unknown',t('ui.24','目标站点返回错误，可能拒绝了连接'));
  };
  timer=setTimeout(function(){
    if(finished||myRun!==runId)return;
    done();
    setState('unknown',t('ui.27','3.5 秒内未收到目标响应'));
  },3500);
  frame.src=url;
  document.body.appendChild(frame);
}
function probeHeaders(url,myRun,state,settle){
  fetch(url,{method:'GET',mode:'cors'}).then(function(resp){
    if(myRun!==runId)return;
    var xfo=resp.headers.get('X-Frame-Options');
    var csp=resp.headers.get('Content-Security-Policy');
    var frameAncestors=null;
    if(csp){var m=csp.match(/frame-ancestors\s+([^;]+)/i);if(m)frameAncestors=m[1].trim();}
    state.headersRead=true;state.xfo=xfo||null;state.frameAncestors=frameAncestors;
    var rows=[];
    rows.push('<div class="detail-row"><span class="detail-label">X-Frame-Options</span><span>'+(xfo?'<span style="color:var(--color-success);font-weight:600;">'+htmlEscape(xfo)+'</span>':'<span style="color:var(--color-text-disabled);">'+t('ui.29','未设置')+'</span>')+'</span></div>');
    rows.push('<div class="detail-row"><span class="detail-label">CSP frame-ancestors</span><span>'+(frameAncestors?'<span style="color:var(--color-success);font-weight:600;">'+htmlEscape(frameAncestors)+'</span>':'<span style="color:var(--color-text-disabled);">'+t('ui.29','未设置')+'</span>')+'</span></div>');
    rows.push('<div class="detail-row"><span class="detail-label">'+t('ui.30','状态码')+'</span><span>'+resp.status+' '+htmlEscape(resp.statusText)+'</span></div>');
    auxRows=auxRows.concat(rows);
    renderDetails();
    settle();
  }).catch(function(){
    if(myRun!==runId)return;
    auxRows.push('<div class="detail-row"><span class="detail-label">'+t('ui.31','响应头')+'</span><span style="color:var(--color-text-secondary);">'+t('ui.34','无法跨域读取目标响应头，iframe 探测结果作为唯一依据。')+'<br>'+t('common.cspNote','说明：本站已在生产环境启用内容安全策略（CSP），只允许访问白名单内的外部服务。若目标域名不在白名单内，浏览器会直接拒绝该请求，这与目标站点自身的 CORS 配置无关。')+'</span></div>');
    renderDetails();
    settle();
  });
}
function verdict(state){
  if(state.probe==='embeddable'){
    finish({statusText:t('ui.15','❌ 可嵌入（存在被点击劫持风险）'),cls:'status-vulnerable',out:t('ui.16','可嵌入'),detail:vulnerableDetail(t('ui.17','iframe 探测'),state.probeNote||t('ui.4','目标页面已在 iframe 中成功渲染，可被嵌入')),rec:headerSuggestion()});
    return;
  }
  if(state.xfo||state.frameAncestors){
    finish({statusText:t('ui.19','✅ 受保护'),cls:'status-protected',out:t('ui.20','受保护'),detail:protectedDetail(t('ui.17','iframe 探测'),t('ui.21','目标拒绝在 iframe 中渲染内容，已被 X-Frame-Options 或 CSP frame-ancestors 阻止嵌入')),rec:t('ui.22','该网站已配置防点击劫持保护措施，通过响应头限制自身页面被第三方站点嵌入，点击劫持风险较低。')});
    return;
  }
  var reason=state.probeNote||t('ui.35','结论依据不足：既未读到防嵌套响应头，也未观察到可渲染的 iframe 内容。');
  finish({statusText:t('ui.26','无法判定'),cls:'status-unknown',out:t('ui.26','无法判定'),detail:'<div class="detail-row"><span class="detail-label">'+t('ui.17','iframe 探测')+'</span><span>'+reason+'</span></div>',rec:t('ui.36','本工具为纯前端检测：目标站点未开放 CORS 时读不到响应头，本站 CSP 或目标站点拦截 iframe 时也无法作为证据。请用浏览器开发者工具或服务端工具确认。')});
}
function runCheck(url,myRun){
  var state={probe:null,probeNote:'',xfo:null,frameAncestors:null,headersRead:false};
  var pending=2;
  function settle(){if(pending>0&&--pending===0&&myRun===runId)verdict(state);}
  probeFrame(url,myRun,state,settle);
  probeHeaders(url,myRun,state,settle);
}
checkBtn.addEventListener('click',function(){
  var url=urlInput.value.trim();
  if(!url){setStatus(t('ui.100','请输入 URL'),'error');return;}
  if(!/^https?:\/\//i.test(url))url='https://'+url;
  var myRun=++runId;
  removeFrame(currentFrame);
  currentFrame=null;
  verdictRow=null;
  auxRows=[];
  resultCard.style.display='block';
  statusDisplay.textContent = t('ui.3','检测中...');
  statusDisplay.className='status-card status-unknown';
  recommendation.textContent='';
  outputText.textContent='';
  renderDetails();
  cspFrameBlocked=false;
  runCheck(url,myRun);
});
copyBtn.addEventListener('click',function(){if(outputText.textContent){copyToClipboard(outputText.textContent,this);setStatus(t('ui.copied','已复制'));}});
urlInput.addEventListener('keydown',function(e){if(e.key==='Enter')checkBtn.click();});
})();</script>
</body></html>
