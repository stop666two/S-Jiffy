<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>使命召唤灵敏度转换器 - S-Jiffy</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../assets/css/global.css">
<style>
.sens-desc{font-size:var(--font-size-sm);color:var(--color-text-secondary);margin-bottom:var(--space-2);}
.dpi-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:var(--space-2);}
.dpi-btn{padding:6px 14px;font-size:var(--font-size-sm);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-bg);cursor:pointer;transition:all .15s;}
.dpi-btn.active{background:var(--color-text-primary);color:#fff;border-color:var(--color-text-primary);}
.dpi-btn:not(.active):hover{border-color:var(--color-text-primary);}
.dpi-input{width:110px;height:36px;padding:0 var(--space-2);font-size:var(--font-size-sm);border:1px solid #DDDDDD;border-radius:var(--radius-md);outline:none;}
.dpi-input:focus{border-color:var(--color-text-primary);box-shadow:var(--shadow-focus);}
.conv-grid{display:grid;grid-template-columns:1fr;gap:var(--space-2);}
@media (min-width:640px){.conv-grid{grid-template-columns:1fr auto 1fr;}}
.game-col{min-width:0;}
.field-label{display:block;font-size:var(--font-size-sm);color:var(--color-text-secondary);margin-bottom:4px;font-weight:600;}
.select{width:100%;height:44px;padding:0 10px;font-size:var(--font-size-sm);border:1px solid #DDDDDD;border-radius:var(--radius-md);background:var(--color-bg);outline:none;transition:border-color .15s,box-shadow .15s;}
.select:focus{border-color:var(--color-text-primary);box-shadow:var(--shadow-focus);}
.sens-input{width:100%;height:48px;padding:0 var(--space-2);font-size:var(--font-size-lg);font-weight:600;font-family:var(--font-mono);border:1px solid #DDDDDD;border-radius:var(--radius-md);outline:none;transition:border-color .15s,box-shadow .15s;}
.sens-input:focus{border-color:var(--color-text-primary);box-shadow:var(--shadow-focus);}
.sens-note{font-size:var(--font-size-xs);color:var(--color-text-disabled);margin-top:4px;}
.result-box{background:var(--color-bg-soft);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:10px 14px;min-height:48px;box-sizing:border-box;}
.result-box .v{font-size:var(--font-size-lg);font-weight:700;font-family:var(--font-mono);color:var(--color-text-primary);}
.result-box .v.empty{color:var(--color-text-disabled);}
.swap-col{display:flex;align-items:center;justify-content:center;}
.swap-btn{padding:8px 12px;font-size:var(--font-size-sm);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-bg);cursor:pointer;transition:all .15s;}
.swap-btn:hover{border-color:var(--color-text-primary);}
.cm360-box{margin-top:var(--space-2);background:var(--color-bg-soft);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-2);display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);}
.cm360-box .t{font-size:var(--font-size-xs);color:var(--color-text-secondary);}
.cm360-box .v{font-size:var(--font-size-lg);font-weight:700;font-family:var(--font-mono);}
.cm360-box .d{font-size:var(--font-size-xs);color:var(--color-text-disabled);max-width:220px;text-align:right;}
.table-wrap{margin-top:var(--space-2);overflow-x:auto;}
.conv-table{width:100%;border-collapse:collapse;font-size:var(--font-size-sm);}
.conv-table th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--color-border);font-weight:600;color:var(--color-text-secondary);font-size:var(--font-size-xs);}
.conv-table th:last-child,.conv-table td:last-child{text-align:right;}
.conv-table td{padding:8px 10px;border-bottom:1px solid var(--color-border);}
.conv-table tr:last-child td{border-bottom:none;}
.conv-table tr.hl{background:var(--color-bg-soft);}
.conv-table td.val{font-family:var(--font-mono);font-weight:700;}
.conv-table td.mark{color:var(--color-text-primary);font-weight:700;margin-right:6px;}
.copy-wrap{margin-top:var(--space-2);text-align:right;}
</style>
</head>
<body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a></header>
<main class="tool-workspace">
<h1 data-i18n="h1">使命召唤灵敏度转换器</h1>
<p class="tool-desc" data-i18n="desc">将任何游戏灵敏度转换为使命召唤。精确cm/360计算。</p>
<div class="card">
<p class="sens-desc" id="sensDesc"></p>
<div class="field-label" id="dpiLabel" data-i18n="ui.107">鼠标 DPI</div>
<div class="dpi-row" id="dpiRow">
<button type="button" class="dpi-btn" data-dpi="400">400</button>
<button type="button" class="dpi-btn" data-dpi="800">800</button>
<button type="button" class="dpi-btn" data-dpi="1000">1000</button>
<button type="button" class="dpi-btn" data-dpi="1600">1600</button>
<button type="button" class="dpi-btn" data-dpi="3200">3200</button>
<input type="number" id="dpiInput" class="dpi-input" min="1" max="20000" step="1" value="800">
</div>
<div class="conv-grid">
<div class="game-col">
<div class="field-label" id="fromLbl" data-i18n="ui.106">来源游戏</div>
<select id="fromSelect" class="select"></select>
<div class="field-label" id="fromSensLbl" style="margin-top:var(--space-2);" data-i18n="ui.105">灵敏度</div>
<input type="number" id="fromSens" class="sens-input" step="0.1" min="0.1" max="10" placeholder="e.g. 1.0">
<p class="sens-note" id="fromNote" style="display:none;"></p>
</div>
<div class="swap-col">
<button type="button" id="swapBtn" class="swap-btn" title="⇄ 互换" data-i18n="swapGames">互换</button>
</div>
<div class="game-col">
<div class="field-label" id="toLbl" data-i18n="ui.104">目标游戏</div>
<select id="toSelect" class="select"></select>
<div class="field-label" id="toSensLbl" style="margin-top:var(--space-2);" data-i18n="ui.103">灵敏度（结果）</div>
<div class="result-box"><span class="v empty" id="toSensVal">—</span></div>
<p class="sens-note" id="toNote" style="display:none;"></p>
</div>
</div>
<div class="cm360-box" id="cm360Box" style="display:none;">
<div><div class="t" id="cm360Title">cm / 360°</div><div class="v" id="cm360Val">—</div></div>
<div class="d" id="cm360Desc" data-i18n="ui.102">鼠标旋转一整圈所需移动的距离</div>
</div>
<div class="table-wrap" id="allTable" style="display:none;">
<table class="conv-table">
<thead><tr><th id="thGame" data-i18n="ui.101">游戏</th><th id="thEquiv" data-i18n="ui.100">等效灵敏度</th></tr></thead>
<tbody id="allTbody"></tbody>
</table>
</div>
<div class="copy-wrap"><button id="copyBtn" class="btn btn-secondary" data-i18n="common.copy" style="height:36px;min-width:auto;">复制</button></div>
</div>
</main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
<script src="../../assets/js/i18n.js"></script>
<script>
(function(){
'use strict';
var GAMES=[
{id:'cs2',name:'CS2 / CS:GO',yaw:0.022,smin:0.1,smax:10,sstep:0.1,sdef:1.0,label:'sensLabelSensitivity'},
{id:'valorant',name:'Valorant',yaw:0.07,smin:0.01,smax:10,sstep:0.01,sdef:0.3,label:'sensLabelSensitivity'},
{id:'apex',name:'Apex Legends',yaw:0.022,smin:0.1,smax:5,sstep:0.1,sdef:1.0,label:'sensLabelMouseSensitivity'},
{id:'overwatch2',name:'Overwatch 2',yaw:0.0066,smin:1,smax:100,sstep:1,sdef:7,label:'sensLabelSensitivity'},
{id:'r6siege',name:'Rainbow Six Siege',yaw:0.005729577951,smin:1,smax:100,sstep:1,sdef:40,label:'sensLabelMousePct'},
{id:'pubg',name:'PUBG',yaw:0.00476,smin:1,smax:200,sstep:1,sdef:50,label:'sensLabelGeneralSensitivity'},
{id:'fortnite',name:'Fortnite',yaw:0.22,smin:0.001,smax:1,sstep:0.001,sdef:0.10,label:'sensLabelXY',note:'sensNoteXAxis'},
{id:'cod',name:'Call of Duty',yaw:0.0066,smin:1,smax:20,sstep:0.5,sdef:7,label:'sensLabelSensitivity'},
{id:'tarkov',name:'Escape from Tarkov',yaw:0.01375,smin:0.01,smax:10,sstep:0.01,sdef:0.5,label:'sensLabelMouseSensitivity'},
{id:'bf2042',name:'Battlefield 2042',yaw:0.022,smin:1,smax:100,sstep:1,sdef:40,label:'sensLabelMouseSensitivity'},
{id:'halo',name:'Halo Infinite',yaw:0.022,smin:1,smax:20,sstep:0.5,sdef:4,label:'sensLabelSensitivity'},
{id:'thefinals',name:'The Finals',yaw:0.022,smin:0.01,smax:5,sstep:0.01,sdef:1.0,label:'sensLabelSensitivity'},
{id:'warframe',name:'Warframe',yaw:0.0375,smin:0.01,smax:5,sstep:0.01,sdef:0.5,label:'sensLabelMouseSensitivity'}
];
function t(key,fb){return (window.I18N&&I18N.dict[key]!=null)?I18N.dict[key]:fb;}
function cm360(dpi,sens,yaw){return (360*2.54)/(dpi*sens*yaw);}
function sensFromCm360(dpi,cm,yaw){return (360*2.54)/(dpi*cm*yaw);}
function fmtSens(v){return v.toFixed(v<0.1?4:(v<1?3:2));}
function game(id){for(var i=0;i<GAMES.length;i++){if(GAMES[i].id===id)return GAMES[i];}return null;}
function label(g){return t(g.label,g.label==='sensLabelMouseSensitivity'?'鼠标灵敏度':(g.label==='sensLabelGeneralSensitivity'?'综合灵敏度':(g.label==='sensLabelMousePct'?'鼠标灵敏度 %':(g.label==='sensLabelXY'?'X/Y 灵敏度':'灵敏度'))));}

document.getElementById('sensDesc').textContent=t('sensConverterDesc','输入灵敏度和 DPI，转换结果自动更新。');
document.getElementById('dpiLabel').textContent=t('mouseDPILabel','鼠标 DPI');
document.getElementById('fromLbl').textContent=t('fromGameLabel','来源游戏');
document.getElementById('toLbl').textContent=t('toGameLabel','目标游戏');
document.getElementById('fromSensLbl').textContent=t('sensLabelSensitivity','灵敏度');
document.getElementById('toSensLbl').textContent=t('sensLabelSensitivity','灵敏度')+t('sensResultSuffix','（结果）');
document.getElementById('cm360Title').textContent=t('cm360Title','cm / 360°');
document.getElementById('cm360Desc').textContent=t('cm360Desc','鼠标旋转一整圈所需移动的距离');
document.getElementById('thGame').textContent=t('gameHeader','游戏');
document.getElementById('thEquiv').textContent=t('equivSensHeader','等效灵敏度');
var swapBtn=document.getElementById('swapBtn');
swapBtn.textContent=t('swapGames','⇄ 互换');
swapBtn.title=t('swapGames','互换');

var fromSel=document.getElementById('fromSelect'),toSel=document.getElementById('toSelect');
var fromSens=document.getElementById('fromSens'),toSensVal=document.getElementById('toSensVal');
var dpiInput=document.getElementById('dpiInput'),fromNote=document.getElementById('fromNote'),toNote=document.getElementById('toNote');
var cm360Box=document.getElementById('cm360Box'),cm360Val=document.getElementById('cm360Val');
var allTable=document.getElementById('allTable'),allTbody=document.getElementById('allTbody');
var fromSensLbl=document.getElementById('fromSensLbl'),toSensLbl=document.getElementById('toSensLbl');

var fromId='cod',toId='cs2';

function fillSelects(){
  var html='',i;
  for(i=0;i<GAMES.length;i++){html+='<option value="'+GAMES[i].id+'">'+GAMES[i].name+'</option>';}
  fromSel.innerHTML=html;
  fromSel.value=fromId;
  renderTo();
}
function renderTo(){
  var html='',i;
  for(i=0;i<GAMES.length;i++){
    if(GAMES[i].id===fromId)continue;
    html+='<option value="'+GAMES[i].id+'">'+GAMES[i].name+'</option>';
  }
  toSel.innerHTML=html;
  if(toId!==fromId&&game(toId))toSel.value=toId;
}
function syncFields(){
  var f=game(fromId),tt=game(toId);
  fromSens.step=f.sstep;fromSens.min=f.smin;fromSens.max=f.smax;
  fromSens.placeholder='e.g. '+f.sdef;
  fromSensLbl.textContent=label(f);
  toSensLbl.textContent=label(tt)+t('sensResultSuffix','（结果）');
  fromNote.style.display=f.note?'block':'none';
  toNote.style.display=tt.note?'block':'none';
  if(f.note)fromNote.textContent=t(f.note,'使用 X 轴灵敏度');
  if(tt.note)toNote.textContent=t(tt.note,'使用 X 轴灵敏度');
}
function getDpi(){
  var d=parseFloat(dpiInput.value);
  return (!isNaN(d)&&d>0)?d:0;
}
function compute(){
  var s=parseFloat(fromSens.value);
  var d=getDpi();
  var f=game(fromId),tt=game(toId);
  if(fromSens.value===''){
    toSensVal.textContent='—';toSensVal.className='v empty';
    cm360Box.style.display='none';allTable.style.display='none';
    return;
  }
  if(isNaN(s)||s<=0){
    toSensVal.textContent='—';toSensVal.className='v empty';
    cm360Box.style.display='none';allTable.style.display='none';
    setStatus(t('sensInvalid','请输入有效的灵敏度（大于 0）'),'error');
    return;
  }
  if(!d){
    toSensVal.textContent='—';toSensVal.className='v empty';
    cm360Box.style.display='none';allTable.style.display='none';
    setStatus(t('dpiInvalid','请输入有效的 DPI（大于 0）'),'error');
    return;
  }
  var cm=cm360(d,s,f.yaw);
  var target=sensFromCm360(d,cm,tt.yaw);
  cm360Val.textContent=cm.toFixed(2)+' cm';
  cm360Box.style.display='flex';
  toSensVal.textContent=fmtSens(target);
  toSensVal.className='v';
  renderAllTable(f,d,s);
  setStatus('');
}
function renderAllTable(f,d,s){
  allTable.style.display='block';
  var html='',i;
  for(i=0;i<GAMES.length;i++){
    if(GAMES[i].id===fromId)continue;
    var g=GAMES[i];
    var cm=cm360(d,s,f.yaw);
    var eq=sensFromCm360(d,cm,g.yaw);
    var hl=(g.id===toId)?' class="hl"':'';
    var mark=(g.id===toId)?'<span class="mark">›</span>':'';
    html+='<tr'+hl+'><td>'+mark+g.name+'</td><td class="val">'+fmtSens(eq)+'</td></tr>';
  }
  allTbody.innerHTML=html;
}
function swap(){
  var oldFrom=fromId;
  fromId=toId;
  toId=oldFrom;
  var val=toSensVal.textContent;
  if(val&&val!=='—'){
    fromSens.value=val;
    toSensVal.textContent='—';toSensVal.className='v empty';
  }
  fillSelects();
  syncFields();
  compute();
}
var dpiBtns=document.getElementById('dpiRow').querySelectorAll('.dpi-btn');
for(var di=0;di<dpiBtns.length;di++){
  dpiBtns[di].addEventListener('click',function(){
    for(var i=0;i<dpiBtns.length;i++)dpiBtns[i].className='dpi-btn';
    this.className='dpi-btn active';
    dpiInput.value=this.getAttribute('data-dpi');
    compute();
  });
}
dpiInput.addEventListener('input',function(){
  var v=dpiInput.value;
  for(var i=0;i<dpiBtns.length;i++)dpiBtns[i].className='dpi-btn';
  if(v==='800')dpiBtns[1].className='dpi-btn active';
  compute();
});
fromSel.addEventListener('change',function(){
  if(this.value===toId){toId=fromId;}
  fromId=this.value;
  fromSens.value='';
  fillSelects();
  syncFields();
  compute();
});
toSel.addEventListener('change',function(){toId=this.value;syncFields();compute();});
fromSens.addEventListener('input',function(){compute();});
swapBtn.addEventListener('click',swap);
document.getElementById('copyBtn').addEventListener('click',function(){
  var v=toSensVal.textContent;
  if(!v||v==='—'){setStatus(t('nothingToCopy','暂无可复制的结果'),'error');return;}
  var f=game(fromId),tt=game(toId);
  var s=parseFloat(fromSens.value);
  var d=getDpi();
  var text=tt.name+t('sensCopyLabel',' 灵敏度: ')+v;
  if(!isNaN(s)&&s>0&&d){text+=' | cm/360: '+cm360(d,s,f.yaw).toFixed(2)+' cm | DPI: '+d;}
  copyToClipboard(text,this);
  setStatus(t('common.copied','已复制'));
});
fillSelects();
syncFields();
compute();
})();
</script>
</body>
</html>
