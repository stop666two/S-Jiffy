<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crontab 生成器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .cron-grid { display:grid; gap:var(--space-2); max-width:500px; }
    .cron-row { display:flex; gap:8px; align-items:center; }
    .cron-row label { font-size:var(--font-size-sm); min-width:60px; color:var(--color-text-secondary); }
    .cron-row select { flex:1; height:48px; padding:0 8px; font-family:var(--font-mono); font-size:var(--font-size-base); border:1px solid #ddd; border-radius:var(--radius-md); }
    .cron-preview { margin-top:var(--space-3); padding:var(--space-2); background:var(--color-bg-soft); border-radius:var(--radius-md); font-size:18px; text-align:center; letter-spacing:2px; }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
  <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">Crontab 生成器</h1>
    <p class="tool-desc" data-i18n="desc">通过人类可读的选择生成 cron 表达式。</p>
    <div class="card">
      <div class="cron-grid">
        <div class="cron-row"><label data-i18n="ui.minute">分钟</label><select id="cronMinute"><option value="*" data-i18n="ui.1">每分钟 (*)</option><option value="0" data-i18n="ui.2">整点 (0)</option><option value="15" data-i18n="ui.3">15 分</option><option value="30" data-i18n="ui.4">30 分</option><option value="45" data-i18n="ui.5">45 分</option><option value="*/5" data-i18n="ui.6">每 5 分钟</option><option value="*/10" data-i18n="ui.7">每 10 分钟</option><option value="*/15" data-i18n="ui.8">每 15 分钟</option><option value="*/30" data-i18n="ui.9">每 30 分钟</option></select></div>
        <div class="cron-row"><label data-i18n="ui.hour">小时</label><select id="cronHour"><option value="*" data-i18n="ui.10">每小时 (*)</option><option value="0" data-i18n="ui.11">0 点（午夜）</option><option value="6" data-i18n="ui.12">6 点</option><option value="8" data-i18n="ui.13">8 点</option><option value="9" data-i18n="ui.14">9 点</option><option value="12" data-i18n="ui.15">12 点</option><option value="18" data-i18n="ui.16">18 点</option><option value="*/2" data-i18n="ui.17">每 2 小时</option><option value="*/6" data-i18n="ui.18">每 6 小时</option><option value="*/12" data-i18n="ui.19">每 12 小时</option></select></div>
        <div class="cron-row"><label data-i18n="ui.date">日期</label><select id="cronDay"><option value="*" data-i18n="ui.20">每天 (*)</option><option value="1" data-i18n="ui.21">1 日</option><option value="15" data-i18n="ui.22">15 日</option><option value="28" data-i18n="ui.23">28 日</option><option value="*/2" data-i18n="ui.24">每 2 天</option></select></div>
        <div class="cron-row"><label data-i18n="ui.25">月份</label><select id="cronMonth"><option value="*" data-i18n="ui.26">每月 (*)</option><option value="1" data-i18n="ui.27">一月</option><option value="3" data-i18n="ui.28">三月</option><option value="6" data-i18n="ui.29">六月</option><option value="9" data-i18n="ui.30">九月</option><option value="12" data-i18n="ui.31">十二月</option><option value="*/3" data-i18n="ui.32">每季度</option></select></div>
        <div class="cron-row"><label data-i18n="ui.33">星期</label><select id="cronWeekday"><option value="*" data-i18n="ui.20">每天 (*)</option><option value="0" data-i18n="ui.34">周日</option><option value="1" data-i18n="ui.35">周一</option><option value="2" data-i18n="ui.36">周二</option><option value="3" data-i18n="ui.37">周三</option><option value="4" data-i18n="ui.38">周四</option><option value="5" data-i18n="ui.39">周五</option><option value="6" data-i18n="ui.40">周六</option><option value="1-5" data-i18n="ui.41">周一至周五</option><option value="0,6" data-i18n="ui.42">周末</option></select></div>
      </div>
      <div class="cron-preview" id="cronPreview">* * * * *</div>
    </div>
    <div class="output-box">
      <span id="outputText" style="display:block; padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script></script>
  <script>
    (function() {
      var cronMinute = document.getElementById('cronMinute');
      var cronHour = document.getElementById('cronHour');
      var cronDay = document.getElementById('cronDay');
      var cronMonth = document.getElementById('cronMonth');
      var cronWeekday = document.getElementById('cronWeekday');
      var cronPreview = document.getElementById('cronPreview');
      var outputEl = document.getElementById('outputText');
      var copyBtn = document.getElementById('copyBtn');

      var presets = [
        { expr: '0 9 * * 1-5', label: t('ui.48','工作日 9:00') },
        { expr: '0 0 * * *', label: t('ui.47','每天午夜') },
        { expr: '*/5 * * * *', label: t('ui.6','每 5 分钟') },
        { expr: '0 */2 * * *', label: t('ui.17','每 2 小时') },
        { expr: '0 3 * * 0', label: t('ui.46','每周日凌晨 3 点') },
        { expr: '0 0 1 * *', label: t('ui.45','每月 1 日午夜') },
        { expr: '0 0 * * 0', label: t('ui.44','每周日午夜') },
        { expr: '30 18 * * 1-5', label: t('ui.43','工作日 18:30') }
      ];

      function updateCron() {
        var parts = [
          cronMinute.value,
          cronHour.value,
          cronDay.value,
          cronMonth.value,
          cronWeekday.value
        ];
        var expr = parts.join(' ');
        cronPreview.textContent = expr;
        outputEl.textContent = expr;
        setStatus('');
      }

      var selects = [cronMinute, cronHour, cronDay, cronMonth, cronWeekday];
      for (var i = 0; i < selects.length; i++) {
        selects[i].addEventListener('change', updateCron);
      }

      copyBtn.addEventListener('click', function () {
        var text = outputEl.textContent;
        if (text && text !== '* * * * *') {
          copyToClipboard(text, copyBtn);
          setStatus(t('ui.copiedClip','已复制到剪贴板'));
        }
      });

      updateCron();
    })();
  </script>
</body>
</html>
