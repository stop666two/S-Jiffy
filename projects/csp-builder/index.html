<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CSP 策略构建器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css">
<style>.dir-group{margin-bottom:var(--space-2);padding:var(--space-2);border:1px solid var(--color-border);border-radius:var(--radius-md);}.dir-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer;}.dir-header input[type=checkbox]{width:18px;height:18px;cursor:pointer;}.dir-name{font-weight:600;font-family:var(--font-mono);font-size:var(--font-size-sm);}.dir-desc{font-size:12px;color:var(--color-text-secondary);margin-left:8px;}.source-input{margin-left:26px;display:flex;gap:6px;align-items:center;}.source-input input{flex:1;}.source-tag{display:inline-block;background:var(--color-bg-soft);padding:2px 8px;border-radius:3px;font-size:12px;margin:2px;border:1px solid var(--color-border);}.source-tag .remove{cursor:pointer;margin-left:4px;color:var(--color-error);font-weight:600;}.dc-tabs{display:flex;gap:var(--space-1);margin-bottom:var(--space-3);}.dc-tabs button{flex:1;height:44px;font-size:var(--font-size-sm);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-bg);cursor:pointer;transition:all .15s;}.dc-tabs button.active{background:var(--color-text-primary);color:#fff;border-color:var(--color-text-primary);}.issue-row{padding:6px 0;border-bottom:1px solid var(--color-border);font-size:var(--font-size-sm);display:flex;gap:8px;align-items:flex-start;}.issue-row:last-child{border:none;}.issue-level{padding:1px 6px;border-radius:3px;font-size:11px;font-weight:600;white-space:nowrap;}.issue-error{background:#fce8e6;color:var(--color-error);}.issue-warning{background:#fef7e0;color:#e37400;}.issue-info{background:#e8f0fe;color:#096bde;}.issue-msg{color:var(--color-text-primary);word-break:break-all;}.summary-box{display:flex;gap:12px;margin-bottom:var(--space-2);}.summary-item{flex:1;text-align:center;padding:8px;border-radius:var(--radius-sm);font-size:var(--font-size-sm);}</style></head><body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a></header>
<main class="tool-workspace"><h1 data-i18n="h1">CSP 策略构建器</h1><p class="tool-desc" data-i18n="desc">可视化构建 Content Security Policy 策略，并可粘贴策略文本验证语法、检查常见问题与安全隐患</p>
<div class="dc-tabs">
  <button id="tabBuild" class="active" type="button" data-i18n="ui.tabBuild">构建策略</button>
  <button id="tabValidate" type="button" data-i18n="ui.tabValidate">验证策略</button>
</div>
<div id="panelBuild">
  <div class="card" id="builderArea"></div>
  <div class="card" style="display:flex;gap:12px;flex-wrap:wrap;"><button id="generateBtn" class="btn btn-primary" data-i18n="ui.1">生成策略</button><button id="resetBtn" class="btn btn-secondary" data-i18n="ui.2">重置</button></div>
</div>
<div id="panelValidate" style="display:none;">
  <div class="card"><textarea id="cspInput" class="input textarea js-focus-input" data-i18n-placeholder="val.placeholder" placeholder="default-src 'self'; script-src 'self' 'unsafe-inline'; img-src *" style="min-height:80px;"></textarea></div>
  <div class="card" style="display:flex;gap:12px;flex-wrap:wrap;"><button id="validateBtn" class="btn btn-primary" data-i18n="val.btn">验证</button><button id="valClearBtn" class="btn btn-secondary" data-i18n="val.clear">清空</button></div>
  <div class="card" id="resultCard" style="display:none;"><div class="summary-box" id="summaryBox"></div><div id="issuesList"></div><div id="parsedPolicy" style="margin-top:var(--space-2);padding-top:var(--space-2);border-top:1px solid var(--color-border);font-size:var(--font-size-sm);color:var(--color-text-secondary);"></div></div>
</div>
<div class="output-box"><span id="outputText" style="white-space:pre-wrap;"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
</main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
<script>(function(){
var directives=[
{name:'default-src',desc: t('ui.19','默认资源加载源'),sources:["'self'","'none'"],custom:true},
{name:'script-src',desc: t('ui.18','JavaScript 脚本源'),sources:["'self'","'unsafe-inline'","'unsafe-eval'","'strict-dynamic'","'nonce'"],hasNonce:true,hasHash:true,custom:true},
{name:'style-src',desc: t('ui.17','CSS 样式源'),sources:["'self'","'unsafe-inline'","'strict-dynamic'"],hasNonce:true,hasHash:true,custom:true},
{name:'img-src',desc: t('ui.16','图片源'),sources:["'self'","data:","blob:"],custom:true},
{name:'connect-src',desc: t('ui.15','API/XHR/WebSocket 连接源'),sources:["'self'"],custom:true},
{name:'font-src',desc: t('ui.14','字体源'),sources:["'self'","data:"],custom:true},
{name:'frame-src',desc: t('ui.13','iframe 嵌入源'),sources:["'self'","'none'"],custom:true},
{name:'frame-ancestors',desc: t('ui.12','允许嵌入的父页面'),sources:["'self'","'none'"],custom:true},
{name:'object-src',desc: t('ui.objectSrc','<object>/<embed>/<applet> 源'),sources:["'self'","'none'"],custom:true},
{name:'media-src',desc: t('ui.11','音视频源'),sources:["'self'"],custom:true},
{name:'manifest-src',desc: t('ui.10','Web App Manifest 源'),sources:["'self'"],custom:true},
{name:'worker-src',desc: t('ui.9','Web Worker / Service Worker 源'),sources:["'self'","blob:"],custom:true},
{name:'base-uri',desc: t('ui.baseUri','<base> 标签允许的 URL'),sources:["'self'","'none'"],custom:true},
{name:'form-action',desc: t('ui.8','表单提交目标'),sources:["'self'","'none'"],custom:true},
{name:'report-uri',desc: t('ui.7','报告违规的 URL（已弃用，推荐 report-to）'),custom:true,noPresets:true},
{name:'report-to',desc: t('ui.6','报告端点组名'),custom:true,noPresets:true},
{name:'upgrade-insecure-requests',desc: t('ui.5','将 HTTP 自动升级为 HTTPS'),flag:true},
{name:'block-all-mixed-content',desc: t('ui.4','阻止混合内容加载'),flag:true}
];
var builderArea=document.getElementById('builderArea'),generateBtn=document.getElementById('generateBtn'),resetBtn=document.getElementById('resetBtn'),outputText=document.getElementById('outputText'),copyBtn=document.getElementById('copyBtn');
var state={};
function initBuilder(){
  var html='';
  for(var i=0;i<directives.length;i++){
    var d=directives[i];var id='dir_'+i;
    state[id]={checked:false,sources:d.sources?d.sources.slice():[],customSource:'',nonce:'',hash:''};
    html+='<div class="dir-group" id="group_'+i+'">';
    html+='<div class="dir-header"><input type="checkbox" id="'+id+'_cb"><span class="dir-name">'+htmlEscape(d.name)+'</span><span class="dir-desc">'+htmlEscape(d.desc)+'</span></div>';
    html+='<div id="'+id+'_body" style="display:none;">';
    if(d.flag){
      html+='<div style="font-size:12px;color:var(--color-text-secondary);margin-left:26px;">'+t('ui.flagNote','标记指令，启用即生效')+'</div>';
    }else if(d.noPresets){
      html+='<div class="source-input"><input class="input" id="'+id+'_custom" data-i18n-placeholder="ui.100" placeholder="'+t('ui.100','输入值...')+'" style="height:36px;"><button class="btn btn-secondary addSrcBtn" data-idx="'+i+'" style="height:36px;min-width:auto;padding:0 12px;">'+t('ui.add','添加')+'</button></div>';
    }else{
      html+='<div style="margin-left:26px;margin-bottom:4px;font-size:12px;color:var(--color-text-secondary);">'+t('ui.presetHint','预设源（点击切换）：')+'</div>';
      html+='<div style="margin-left:26px;" id="'+id+'_presets"></div>';
      if(d.hasNonce)html+='<div class="source-input" style="margin-top:4px;"><span style="font-size:12px;color:var(--color-text-secondary);">Nonce:</span><input class="input" id="'+id+'_nonce" data-i18n-placeholder="ui.101" placeholder="'+t('ui.101','nonce 值')+'" style="height:32px;width:120px;"></div>';
      if(d.hasHash)html+='<div class="source-input" style="margin-top:4px;"><span style="font-size:12px;color:var(--color-text-secondary);">Hash:</span><input class="input" id="'+id+'_hash" placeholder="\'sha256-...\'" style="height:32px;flex:1;"></div>';
      html+='<div class="source-input" style="margin-top:4px;"><input class="input" id="'+id+'_custom" data-i18n-placeholder="ui.102" placeholder="'+t('ui.102','自定义源...')+'" style="height:36px;"><button class="btn btn-secondary addSrcBtn" data-idx="'+i+'" style="height:36px;min-width:auto;padding:0 12px;">'+t('ui.add','添加')+'</button></div>';
    }
    html+='<div id="'+id+'_tags" style="margin-left:26px;margin-top:4px;"></div>';
    html+='</div></div>';
  }
  builderArea.innerHTML=html;
  for(var i=0;i<directives.length;i++){var d=directives[i];var id='dir_'+i;
    (function(idx,dirId){
      var cb=document.getElementById(dirId+'_cb');
      cb.addEventListener('change',function(){var body=document.getElementById(dirId+'_body');body.style.display=this.checked?'block':'none';state[dirId].checked=this.checked;if(!this.checked)updateOutput();});
      if(d.sources&&!d.noPresets){
        var presetsEl=document.getElementById(dirId+'_presets');
        for(var j=0;j<d.sources.length;j++){(function(src){
          var btn=document.createElement('button');btn.className='btn btn-secondary';btn.textContent=src;
          btn.style.cssText='height:28px;min-width:auto;padding:0 8px;margin:2px;font-size:12px;';
          var active=state[dirId].sources.indexOf(src)>=0;
          if(active){btn.style.background='var(--color-accent)';btn.style.color='#fff';}
          btn.addEventListener('click',function(){
            var idx=state[dirId].sources.indexOf(src);
            if(idx>=0){state[dirId].sources.splice(idx,1);this.style.background='';this.style.color='';}
            else{state[dirId].sources.push(src);this.style.background='var(--color-accent)';this.style.color='#fff';}
            updateTags(dirId);updateOutput();
          });
          presetsEl.appendChild(btn);
        })(d.sources[j]);}
      }
      var addBtns=document.querySelectorAll('.addSrcBtn[data-idx="'+idx+'"]');
      for(var k=0;k<addBtns.length;k++){addBtns[k].addEventListener('click',function(){
        var custom=document.getElementById(dirId+'_custom');var v=custom.value.trim();
        if(v&&state[dirId].sources.indexOf(v)<0){state[dirId].sources.push(v);updateTags(dirId);updateOutput();custom.value='';}
      });}
      var customInput=document.getElementById(dirId+'_custom');
      if(customInput)customInput.addEventListener('keydown',function(e){if(e.key==='Enter'){var v=this.value.trim();if(v&&state[dirId].sources.indexOf(v)<0){state[dirId].sources.push(v);updateTags(dirId);updateOutput();this.value='';}}});
    })(i,id);
    updateTags(id);
  }
  updateOutput();
}
function updateTags(id){
  var tagsEl=document.getElementById(id+'_tags');var dIdx=parseInt(id.split('_')[1]);
  var d=directives[dIdx];if(d.flag||d.noPresets)return;
  var html='';
  for(var i=0;i<state[id].sources.length;i++){
    var s=state[id].sources[i];
    html+='<span class="source-tag">'+htmlEscape(s)+'<span class="remove" data-idx="'+dIdx+'" data-src="'+htmlEscape(s)+'">✕</span></span>';
  }
  tagsEl.innerHTML=html;
  var rems=tagsEl.querySelectorAll('.remove');
  for(var i=0;i<rems.length;i++){rems[i].addEventListener('click',function(){
    var did=parseInt(this.getAttribute('data-idx'));var src=this.getAttribute('data-src');
    var sid='dir_'+did;var idx=state[sid].sources.indexOf(src);
    if(idx>=0){state[sid].sources.splice(idx,1);updateTags(sid);updateOutput();}
  });}
}
function updateOutput(){
  var parts=[];
  for(var i=0;i<directives.length;i++){
    var id='dir_'+i;var d=directives[i];if(!state[id].checked)continue;
    if(d.flag){parts.push(d.name);continue;}
    var sources=state[id].sources.slice();
    if(d.hasNonce){var nonce=document.getElementById(id+'_nonce');if(nonce&&nonce.value.trim())sources.push("'nonce-"+nonce.value.trim()+"'");}
    if(d.hasHash){var hash=document.getElementById(id+'_hash');if(hash&&hash.value.trim())sources.push("'"+hash.value.trim()+"'");}
    if(d.noPresets){var custom=document.getElementById(id+'_custom');if(custom&&custom.value.trim())sources=sources.concat(custom.value.trim());}
    if(sources.length>0)parts.push(d.name+' '+sources.join(' '));
    else parts.push(d.name);
  }
  outputText.textContent=parts.join('; ');
  setStatus(parts.length+ t('ui.3',' 条指令'));
}
generateBtn.addEventListener('click',updateOutput);
resetBtn.addEventListener('click',function(){
  for(var i=0;i<directives.length;i++){
    var id='dir_'+i;var d=directives[i];
    document.getElementById(id+'_cb').checked=false;
    document.getElementById(id+'_body').style.display='none';
    state[id]={checked:false,sources:d.sources?d.sources.slice():[],customSource:'',nonce:'',hash:''};
    if(d.sources&&!d.noPresets&&!d.flag)updateTags(id);
  }
  outputText.textContent='';setStatus('');
});
copyBtn.addEventListener('click',function(){if(outputText.textContent){copyToClipboard(outputText.textContent,this);setStatus(t('ui.copied','已复制'));}});
initBuilder();

/* ============ validate tab (merged from csp-validator) ============ */
var tabBuild=document.getElementById('tabBuild'),tabValidate=document.getElementById('tabValidate');
var panelBuild=document.getElementById('panelBuild'),panelValidate=document.getElementById('panelValidate');
function switchTab(which){
  if(which==='build'){
    tabBuild.className='active';tabValidate.className='';
    panelBuild.style.display='';panelValidate.style.display='none';
  }else{
    tabValidate.className='active';tabBuild.className='';
    panelValidate.style.display='';panelBuild.style.display='none';
  }
}
tabBuild.addEventListener('click',function(){switchTab('build');});
tabValidate.addEventListener('click',function(){switchTab('validate');});

var cspInput=document.getElementById('cspInput'),validateBtn=document.getElementById('validateBtn'),valClearBtn=document.getElementById('valClearBtn'),resultCard=document.getElementById('resultCard'),summaryBox=document.getElementById('summaryBox'),issuesList=document.getElementById('issuesList'),parsedPolicy=document.getElementById('parsedPolicy');
var knownDirectives=['default-src','script-src','script-src-elem','script-src-attr','style-src','style-src-elem','style-src-attr','img-src','font-src','connect-src','media-src','object-src','frame-src','frame-ancestors','worker-src','manifest-src','base-uri','form-action','report-uri','report-to','navigate-to','prefetch-src','plugin-types','sandbox','upgrade-insecure-requests','block-all-mixed-content','require-sri-for','require-trusted-types-for','trusted-types'];
var knownSources=["'self'","'none'","'strict-dynamic'","'unsafe-inline'","'unsafe-eval'","'unsafe-hashes'","'unsafe-allow-redirects'","'report-sample'","'wasm-unsafe-eval'","data:","blob:","mediastream:","filesystem:"];
function validatePolicy(){
  var policy=cspInput.value.trim();if(!policy){setStatus(t('val.empty','请输入 CSP 策略'),'error');return;}
  var issues=[];var directiveCount=0;
  var directives=policy.split(';').map(function(d){return d.trim();}).filter(function(d){return d;});
  for(var di=0;di<directives.length;di++){
    var parts=directives[di].split(/\s+/);var dirName=parts[0].toLowerCase();
    directiveCount++;
    if(dirName.indexOf(' ')>-1){issues.push({level:'error',msg:t('val.spaceDirective','指令名包含空格: "')+htmlEscape(dirName)+t('val.spaceDirective2','"。指令名不能有空格。')});continue;}
    if(knownDirectives.indexOf(dirName)===-1&&!dirName.startsWith('report-')){issues.push({level:'warning',msg:t('val.unknownDirective','未知或不常见的指令: "')+htmlEscape(dirName)+t('val.unknownDirective2','"')});}
    if(dirName==='report-uri'||dirName==='report-to')continue;
    var sources=parts.slice(1);
    if(sources.length===0&&['upgrade-insecure-requests','block-all-mixed-content','sandbox'].indexOf(dirName)===-1&&dirName!=='report-uri'&&dirName!=='report-to'){
      issues.push({level:'warning',msg:t('val.noSource','指令 "')+htmlEscape(dirName)+t('val.noSource2','" 没有指定任何源')});
    }
    for(var si=0;si<sources.length;si++){
      var src=sources[si];
      if(src==="'unsafe-inline'"&&(dirName==='script-src'||dirName==='script-src-elem'||dirName==='style-src'||dirName==='style-src-elem')){
        issues.push({level:'warning',msg:t('val.noSource','指令 "')+htmlEscape(dirName)+t('val.unsafeInline2','" 使用了 ')+htmlEscape(src)+ t('val.considerNonce','，请考虑使用 nonce 或 hash 作为替代')});
      }
      if(src==="'unsafe-eval'"&&dirName.indexOf('script')>=0){issues.push({level:'warning',msg:t('val.noSource','指令 "')+htmlEscape(dirName)+t('val.unsafeInline2','" 使用了 ')+htmlEscape(src)+t('val.unsafeEval3','，允许 eval() 会降低安全性')});}
      if(src==='*'&&dirName!=='img-src'&&dirName!=='media-src'&&dirName!=='connect-src'){
        issues.push({level:'info',msg:t('val.noSource','指令 "')+htmlEscape(dirName)+t('val.wildcard2','" 使用了通配符 *')});
      }
      if(src.indexOf("'nonce-")===0&&src.length<=8){issues.push({level:'error',msg:t('val.noSource','指令 "')+htmlEscape(dirName)+t('val.nonce2','" 的 nonce 值无效: ')+htmlEscape(src)});}
      if(src.indexOf("'sha")===0&&src.length<=7){issues.push({level:'error',msg:t('val.noSource','指令 "')+htmlEscape(dirName)+t('val.hash2','" 的 hash 值无效: ')+htmlEscape(src)});}
      if(src.indexOf("'")===0&&knownSources.indexOf(src)===-1&&src.indexOf("'nonce-")!==0&&src.indexOf("'sha")!==0){issues.push({level:'info',msg: t('val.unknownSource','未知的特殊源: ')+htmlEscape(src)});}
    }
    if(dirName==='script-src'||dirName==='default-src'){
      var hasNonceOrHash=sources.some(function(s){return s.indexOf("'nonce-")===0||s.indexOf("'sha")===0;});
      var hasStrictDynamic=sources.indexOf("'strict-dynamic'")>=0;
      if(hasStrictDynamic&&!hasNonceOrHash&&sources.indexOf("'unsafe-inline'")===-1){issues.push({level:'info',msg: t('val.strictDynamic','strict-dynamic 需要 nonce 或 hash 配合使用')});}
    }
  }
  if(directiveCount===0){issues.push({level:'error',msg: t('val.noDirectives','未解析到任何 CSP 指令')});}
  var errors=issues.filter(function(i){return i.level==='error';}).length;
  var warnings=issues.filter(function(i){return i.level==='warning';}).length;
  var infos=issues.filter(function(i){return i.level==='info';}).length;
  summaryBox.innerHTML='<div class="summary-item" style="background:'+(errors>0?'#fce8e6':'#e6f4ea')+';color:'+(errors>0?'var(--color-error)':'var(--color-success)')+';">'+t('val.sumErrors','错误: ')+errors+'</div><div class="summary-item" style="background:'+(warnings>0?'#fef7e0':'#e6f4ea')+';color:'+(warnings>0?'#e37400':'var(--color-success)')+';">'+t('val.sumWarnings','警告: ')+warnings+'</div><div class="summary-item" style="background:#e8f0fe;color:#096bde;">'+t('val.sumInfos','信息: ')+infos+'</div><div class="summary-item" style="background:var(--color-bg-soft);color:var(--color-text-secondary);">'+t('val.sumDirectives','指令: ')+directiveCount+'</div>';
  var issuesHtml='';
  for(var i=0;i<issues.length;i++){
    var lvl=issues[i].level;var lvlCls=lvl==='error'?'issue-error':lvl==='warning'?'issue-warning':'issue-info';
    issuesHtml+='<div class="issue-row"><span class="issue-level '+lvlCls+'">'+lvl+'</span><span class="issue-msg">'+issues[i].msg+'</span></div>';
  }
  issuesList.innerHTML=issuesHtml||'<div style="padding:8px;color:var(--color-success);font-weight:600;">'+t('val.noIssues','✅ 未发现明显问题')+'</div>';
  parsedPolicy.innerHTML = t('val.parsed','已解析 ')+directiveCount+ t('ui.3',' 条指令');
  outputText.textContent=errors>0?t('val.failed','验证失败: ')+errors+t('val.errCount',' 个错误'):t('val.pass','验证通过');
  resultCard.style.display='block';
  setStatus(errors>0?t('val.foundErrors','发现错误'):t('val.done','验证完成'));
}
validateBtn.addEventListener('click',validatePolicy);
valClearBtn.addEventListener('click',function(){cspInput.value='';resultCard.style.display='none';outputText.textContent='';setStatus('');cspInput.focus();});
})();</script>
</body></html>
