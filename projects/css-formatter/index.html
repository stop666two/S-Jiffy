<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS 格式化 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
  <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">CSS 格式化</h1>
    <p class="tool-desc" data-i18n="desc">CSS 代码格式化：缩进、换行、属性排序。</p>
    <div class="card">
      <textarea id="inputText" class="input textarea js-focus-input" data-i18n-placeholder="ui.102" placeholder="粘贴 CSS 代码..." style="min-height:200px;"></textarea>
    </div>
    <div class="action-bar" style="display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap;">
      <button id="formatBtn" class="btn btn-primary" data-i18n="ui.format">格式化</button>
      <button id="minifyBtn" class="btn btn-secondary" data-i18n="ui.1">压缩</button>
      <button id="clearBtn" class="btn btn-secondary" data-i18n="ui.clear">清空</button>
    </div>
    <div class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>
    (function () {
      var inputEl = document.getElementById('inputText');
      var outputEl = document.getElementById('outputText');
      var formatBtn = document.getElementById('formatBtn');
      var minifyBtn = document.getElementById('minifyBtn');
      var clearBtn = document.getElementById('clearBtn');
      var copyBtn = document.getElementById('copyBtn');

      function repeatSpaces(count) {
        var s = '';
        for (var r = 0; r < count; r++) s += '  ';
        return s;
      }

      function formatCSS(css) {
        var i = 0;
        var n = css.length;
        var out = [];

        function parseBlock(depth) {
          i++;
          var padChild = repeatSpaces(depth + 1);
          var parts = [];
          var cur = '';
          while (i < n) {
            var ch = css[i];
            if (ch === '{') {
              var nestedSel = cur.trim();
              cur = '';
              if (nestedSel) {
                var inner = parseBlock(depth + 1);
                parts.push(padChild + nestedSel + ' {\n' + inner + '\n' + padChild + '}');
              } else {
                i++;
              }
            } else if (ch === '}') {
              i++;
              if (cur.trim()) {
                var decls = cur.split(';').map(function (s) { return s.trim(); }).filter(function (s) { return s; }).sort();
                for (var d = 0; d < decls.length; d++) {
                  parts.push(padChild + decls[d] + (/^\/\*[\s\S]*\*\/$/.test(decls[d]) ? '' : ';'));
                }
              }
              return parts.join('\n');
            } else {
              cur += ch;
              i++;
            }
          }
          return parts.join('\n');
        }

        while (i < n) {
          while (i < n && /\s/.test(css[i])) i++;
          if (i >= n) break;
          if (css[i] === '}') { i++; continue; }
          var sel = '';
          while (i < n && css[i] !== '{' && css[i] !== '}') { sel += css[i]; i++; }
          var selTrim = sel.trim();
          if (i < n && css[i] === '{') {
            var inner = parseBlock(0);
            if (selTrim) out.push(selTrim + ' {\n' + inner + '\n}');
          } else if (selTrim) {
            out.push(selTrim + ';');
          }
        }
        return out.join('\n\n');
      }

      function minifyCSS(css) {
        return css.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\s+/g, ' ').replace(/\s*([{}:;,])\s*/g, '$1').replace(/;\s*}/g, '}').trim();
      }

      function update(mode) {
        var text = inputEl.value.trim();
        if (!text) { setStatus(t('ui.100','请输入 CSS 代码'), 'error'); return; }
        try {
          if (mode === 'format') {
            outputEl.textContent = formatCSS(text);
          } else {
            outputEl.textContent = minifyCSS(text);
          }
          setStatus('');
        } catch (e) {
          outputEl.textContent = '';
          setStatus(t('ui.101','处理失败'), 'error');
        }
      }

      formatBtn.addEventListener('click', function () { update('format'); });
      minifyBtn.addEventListener('click', function () { update('minify'); });
      clearBtn.addEventListener('click', function () { inputEl.value = ''; outputEl.textContent = ''; setStatus(''); inputEl.focus(); });
      copyBtn.addEventListener('click', function () { if (outputEl.textContent) { copyToClipboard(outputEl.textContent, copyBtn); setStatus(t('ui.copied','已复制')); } });
    })();
  </script>
</body>
</html>
