<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS 遮罩生成器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .field-row { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); flex-wrap: wrap; }
    .field-row label { width: 90px; font-size: var(--font-size-sm); color: var(--color-text-secondary); flex-shrink: 0; }
    .field-row select { width: 200px; }
    .field-row input[type="color"] { width: 44px; height: 44px; padding: 0; border: 1px solid var(--color-border); border-radius: var(--radius-sm); cursor: pointer; background: var(--color-bg); }
    .field-row input[type="number"] { width: 90px; }
    .radio-row { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); flex-wrap: wrap; }
    .radio-row label { font-size: var(--font-size-sm); color: var(--color-text-secondary); display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .mask-preview { width: 100%; height: 160px; border: 1px solid var(--color-border); border-radius: var(--radius-md); margin-bottom: var(--space-2); }
    .code-block { margin: 0; font-family: inherit; font-size: var(--font-size-sm); white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">CSS 遮罩生成器</h1>
    <p class="tool-desc" data-i18n="desc">可视化配置渐变遮罩（mask-image），实时预览并生成可直接使用的 CSS 代码。</p>
    <div class="card">
      <div class="mask-preview" id="maskPreview"></div>
      <div class="radio-row">
        <label><input type="radio" name="maskType" value="linear" checked> linear-gradient</label>
        <label><input type="radio" name="maskType" value="radial"> radial-gradient</label>
      </div>
      <div class="field-row">
        <label data-i18n="ui.1">渐变方向</label>
        <select id="dirSelect" class="input js-focus-input">
          <option value="to right" data-i18n="ui.2">to right（向右）</option>
          <option value="to bottom" data-i18n="ui.3">to bottom（向下）</option>
          <option value="to left" data-i18n="ui.4">to left（向左）</option>
          <option value="to top" data-i18n="ui.5">to top（向上）</option>
          <option value="to bottom right" data-i18n="ui.6">to bottom right（右下）</option>
          <option value="to bottom left" data-i18n="ui.7">to bottom left（左下）</option>
          <option value="to top right" data-i18n="ui.8">to top right（右上）</option>
          <option value="to top left" data-i18n="ui.9">to top left（左上）</option>
          <option value="135deg" data-i18n="ui.10">135deg（斜向）</option>
          <option value="45deg" data-i18n="ui.11">45deg（斜向）</option>
          <option value="225deg" data-i18n="ui.12">225deg（斜向）</option>
          <option value="315deg" data-i18n="ui.13">315deg（斜向）</option>
        </select>
      </div>
      <div class="field-row">
        <label data-i18n="ui.14">径向半径</label>
        <input id="radiusInput" class="input" type="number" value="70" min="0" max="100" step="1">
        <span style="font-size:var(--font-size-sm);color:var(--color-text-secondary);" data-i18n="ui.15">%（透明边界位置）</span>
      </div>
      <div class="field-row">
        <label data-i18n="ui.bgColor">背景色</label>
        <input id="bgInput" type="color" value="#111111">
      </div>
    </div>
    <div id="resultBox" class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script></script>
<script src="../../assets/js/custom-controls.js"></script>
  <script>
    (function () {
      var preview = document.getElementById('maskPreview');
      var dirSelect = document.getElementById('dirSelect');
      var radiusInput = document.getElementById('radiusInput');
      var bgInput = document.getElementById('bgInput');
      var outputText = document.getElementById('outputText');
      var currentCode = '';

      function maskValue() {
        var type = document.querySelector('input[name="maskType"]:checked').value;
        if (type === 'linear') {
          return 'linear-gradient(' + dirSelect.value + ', black, transparent)';
        }
        var radius = parseFloat(radiusInput.value);
        if (!isFinite(radius) || radius < 0) radius = 0;
        if (radius > 100) radius = 100;
        return 'radial-gradient(circle at center, black, transparent ' + radius + '%)';
      }

      function render() {
        var type = document.querySelector('input[name="maskType"]:checked').value;
        dirSelect.disabled = type === 'radial';
        var mv = maskValue();
        preview.style.background = bgInput.value;
        preview.style.webkitMaskImage = mv;
        preview.style.maskImage = mv;
        currentCode = '-webkit-mask-image: ' + mv + ';\nmask-image: ' + mv + ';';
        outputText.innerHTML = '<pre class="code-block">' + htmlEscape(currentCode) + '</pre>';
        setStatus(t('ui.17','已生成遮罩 CSS 代码'));
      }

      var radios = document.querySelectorAll('input[name="maskType"]');
      var i;
      for (i = 0; i < radios.length; i++) {
        radios[i].addEventListener('change', render);
      }
      dirSelect.addEventListener('change', render);
      radiusInput.addEventListener('input', render);
      bgInput.addEventListener('input', render);
      document.getElementById('copyBtn').addEventListener('click', function () {
        if (!currentCode) return;
        copyToClipboard(currentCode, this);
        setStatus(t('ui.16','已复制遮罩代码'));
      });
      render();
    })();
  </script>
</body>
</html>
