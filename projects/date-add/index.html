<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initialisable-scale=1.0"><title>日期计算 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css">
<style>
.date-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:var(--space-3);}
.date-row label{display:block;font-size:var(--font-size-sm);color:var(--color-text-secondary);margin-bottom:4px;}
.date-row .field{min-width:120px;}
.date-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--space-2);}
.date-presets button{padding:4px 12px;font-size:var(--font-size-xs);border:1px solid var(--color-border);border-radius:var(--radius-sm);background:transparent;cursor:pointer;}
.date-presets button:hover{background:var(--color-bg-soft);}
.result-grid{display:grid;gap:var(--space-2);}
.result-row{display:flex;justify-content:space-between;padding:var(--space-2);border:1px solid var(--color-border);border-radius:var(--radius-md);}
.result-row .key{color:var(--color-text-secondary);font-size:var(--font-size-sm);}
.result-row .val{font-weight:500;font-family:var(--font-mono);font-size:var(--font-size-sm);}
</style></head>
<body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
<main class="tool-workspace"><h1 data-i18n="h1">日期加减计算</h1><p class="tool-desc" data-i18n="desc">在日期上增加或减少天、周、月、年。</p>
<div class="card">
<div class="date-row"><div class="field"><label data-i18n="ui.1">开始日期</label><input id="startDate" class="input" type="date"></div>
<div class="field"><label data-i18n="ui.2">操作</label><select id="opSelect" class="input" style="width:auto;"><option value="add" data-i18n="ui.3">增加</option><option value="subtract" data-i18n="ui.4">减少</option></select></div>
<div class="field"><label data-i18n="ui.quantity">数量</label><input id="amountInput" class="input" type="number" value="7" min="1" style="width:110px;"></div>
<div class="field"><label data-i18n="ui.5">单位</label><select id="unitSelect" class="input" style="width:auto;"><option value="days" data-i18n="ui.day">天</option><option value="weeks" data-i18n="ui.week">周</option><option value="months" data-i18n="ui.month">月</option><option value="years" data-i18n="ui.year">年</option></select></div>
<button id="calcBtn" class="btn btn-primary" data-i18n="ui.calc">计算</button>
</div>
<div class="date-presets"><button class="preset-btn" data-days="7" data-i18n="ui.6">+1 周</button><button class="preset-btn" data-days="14" data-i18n="ui.7">+2 周</button><button class="preset-btn" data-days="30" data-i18n="ui.8">+1 月</button><button class="preset-btn" data-days="90" data-i18n="ui.9">+3 月</button><button class="preset-btn" data-days="180" data-i18n="ui.10">+6 月</button><button class="preset-btn" data-days="365" data-i18n="ui.11">+1 年</button><button class="preset-btn" data-days="-7" data-i18n="ui.12">-1 周</button><button class="preset-btn" data-days="-30" data-i18n="ui.13">-1 月</button></div>
</div>
<div class="card"><div class="result-grid" id="resultGrid"></div></div>
<div class="output-box"><span id="outputText" style="display:block;padding-right:60px;"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div></main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
<script>
(function(){var sd=document.getElementById('startDate'),op=document.getElementById('opSelect'),am=document.getElementById('amountInput'),un=document.getElementById('unitSelect'),rg=document.getElementById('resultGrid'),o=document.getElementById('outputText');
sd.value=new Date().toISOString().slice(0,10);

function calc(){var d=new Date(sd.value);if(isNaN(d.getTime())){setStatus(t('ui.100','日期无效'),'error');return;}
var n=parseInt(am.value)||0;if(op.value==='subtract')n=-n;var u=un.value;
var result=new Date(d);if(u==='days')result.setDate(result.getDate()+n);
else if(u==='weeks')result.setDate(result.getDate()+n*7);
else if(u==='months')result.setMonth(result.getMonth()+n);
else if(u==='years')result.setFullYear(result.getFullYear()+n);

var diff=Math.abs(result-d);
var items=[{key:'Start Date',val:d.toDateString()+' '+d.toLocaleDateString('zh-CN')},
{key:'Operation',val:(op.value==='add'?'+':'-')+n+' '+u},
{key:'结果 Date',val:result.toDateString()+' '+result.toLocaleDateString('zh-CN')},
{key:'ISO 8601',val:result.toISOString()},
{key:'Difference',val:Math.floor(diff/86400000)+' days'},
{key:'Weekday',val:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][result.getDay()]},
{key:'Week of Year',val:function(){var t=new Date(result);t.setHours(0,0,0,0);t.setDate(t.getDate()+3-(t.getDay()+6)%7);var w1=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-w1)/86400000-3+(w1.getDay()+6)%7)/7);}()}];
rg.innerHTML=items.map(function(it){return'<div class="result-row"><span class="key">'+it.key+'</span><span class="val">'+it.val+'</span></div>';}).join('');
o.textContent=result.toISOString().slice(0,10);}

document.getElementById('calcBtn').addEventListener('click',calc);
var presets=document.querySelectorAll('.preset-btn');for(var i=0;i<presets.length;i++){presets[i].addEventListener('click',function(){var d=parseInt(this.dataset.days);am.value=Math.abs(d);op.value=d>0?'add':'subtract';un.value='days';calc();});}
document.getElementById('copyBtn').addEventListener('click',function(){if(o.textContent){copyToClipboard(o.textContent,this);setStatus(t('ui.copied','已复制'));}});
calc();})();
</script></body></html>
