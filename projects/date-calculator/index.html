<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日期计算器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .dc-row { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-2); }
    .dc-field { flex: 1; min-width: 180px; }
    .dc-field label { display: block; font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: 4px; }
    .dc-dir { display: flex; gap: var(--space-1); margin-bottom: var(--space-2); }
    .dc-dir button { flex: 1; height: 44px; font-size: var(--font-size-sm); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); cursor: pointer; transition: all .15s; }
    .dc-dir button.active { background: var(--color-text-primary); color: #fff; border-color: var(--color-text-primary); }
    .dc-hint { font-size: var(--font-size-xs); color: var(--color-text-secondary); margin-bottom: var(--space-2); }
    .dc-result { text-align: center; padding: var(--space-2); }
    .dc-result .val { font-size: var(--font-size-xl); font-weight: 700; }
    .dc-result .weekday { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-top: 4px; }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">日期计算器</h1>
    <p class="tool-desc" data-i18n="desc">对任意日期加减年、月、周或天数，即时得到精确结果日期。</p>
    <div class="card">
      <div class="dc-row">
        <div class="dc-field">
          <label data-i18n="baseDateLabel">基准日期</label>
          <input id="baseDate" class="input js-focus-input" type="date">
        </div>
        <div class="dc-field">
          <label data-i18n="operationLabel">操作</label>
          <div class="dc-dir" style="margin-bottom:0;">
            <button id="dirAdd" class="active" type="button" data-i18n="addOp">+ 加</button>
            <button id="dirSub" type="button" data-i18n="subtractOp">- 减</button>
          </div>
        </div>
      </div>
      <p class="dc-hint" data-i18n="dateCalcHint">填写任意组合的时间单位——所有单位同时生效</p>
      <div class="dc-row">
        <div class="dc-field">
          <label data-i18n="yearsLabel">年</label>
          <input id="nYears" class="input" type="number" value="0" min="0">
        </div>
        <div class="dc-field">
          <label data-i18n="monthsLabel">月</label>
          <input id="nMonths" class="input" type="number" value="0" min="0">
        </div>
        <div class="dc-field">
          <label data-i18n="weeksLabel">周</label>
          <input id="nWeeks" class="input" type="number" value="0" min="0">
        </div>
        <div class="dc-field">
          <label data-i18n="daysLabel">天</label>
          <input id="nDays" class="input" type="number" value="0" min="0">
        </div>
      </div>
      <div>
        <button id="calcBtn" class="btn btn-primary">计算</button>
        <button id="clearBtn" class="btn btn-secondary">清空</button>
      </div>
    </div>
    <div class="card" id="resultCard" style="display:none;">
      <div class="dc-result">
        <p class="tool-desc" style="font-size:var(--font-size-sm);margin-bottom:var(--space-1);" data-i18n="ui.100">结果日期</p>
        <div class="val" id="resultDate">—</div>
        <div class="weekday" id="resultWeekday"></div>
      </div>
    </div>
    <div class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="common.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>
    (function () {
      var baseEl = document.getElementById('baseDate');
      var dir = 'add';
      var resultCard = document.getElementById('resultCard');
      var outputEl = document.getElementById('outputText');
      var copyBtn = document.getElementById('copyBtn');

      document.getElementById('calcBtn').textContent = t('calculate', '计算');
      document.getElementById('clearBtn').textContent = t('clear', '清空');

      function todayStr() {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }
      baseEl.value = todayStr();

      document.getElementById('dirAdd').addEventListener('click', function () {
        dir = 'add';
        document.getElementById('dirAdd').className = 'active';
        document.getElementById('dirSub').className = '';
      });
      document.getElementById('dirSub').addEventListener('click', function () {
        dir = 'sub';
        document.getElementById('dirSub').className = 'active';
        document.getElementById('dirAdd').className = '';
      });

      var WEEKDAYS = [
        t('sun', '周日'), t('mon', '周一'), t('tue', '周二'), t('wed', '周三'),
        t('thu', '周四'), t('fri', '周五'), t('sat', '周六')
      ];

      function calc() {
        var dateStr = baseEl.value;
        if (!dateStr) { setStatus(t('invalidDate', '请选择基准日期'), 'error'); return; }
        var y = parseInt(document.getElementById('nYears').value, 10) || 0;
        var mo = parseInt(document.getElementById('nMonths').value, 10) || 0;
        var w = parseInt(document.getElementById('nWeeks').value, 10) || 0;
        var d = parseInt(document.getElementById('nDays').value, 10) || 0;
        if (!y && !mo && !w && !d) {
          setStatus(t('atLeastOne', '请至少填写一个时间单位'), 'error');
          return;
        }
        var sign = dir === 'add' ? 1 : -1;
        try {
          var base = new Date(dateStr + 'T00:00:00');
          if (isNaN(base.getTime())) { setStatus(t('invalidDate', '无效的基准日期'), 'error'); return; }
          base.setFullYear(base.getFullYear() + sign * y);
          base.setMonth(base.getMonth() + sign * mo);
          base.setDate(base.getDate() + sign * (w * 7 + d));
          var result = base.getFullYear() + '-' + String(base.getMonth() + 1).padStart(2, '0') + '-' + String(base.getDate()).padStart(2, '0');
          document.getElementById('resultDate').textContent = result;
          document.getElementById('resultWeekday').textContent = WEEKDAYS[base.getDay()];
          outputEl.textContent = result + ' ' + WEEKDAYS[base.getDay()];
          resultCard.style.display = '';
          setStatus(t('done', '计算完成'));
        } catch (e) {
          setStatus(t('calcFailed', '计算失败'), 'error');
        }
      }

      document.getElementById('calcBtn').addEventListener('click', calc);
      document.getElementById('clearBtn').addEventListener('click', function () {
        document.getElementById('nYears').value = '0';
        document.getElementById('nMonths').value = '0';
        document.getElementById('nWeeks').value = '0';
        document.getElementById('nDays').value = '0';
        resultCard.style.display = 'none';
        outputEl.textContent = '';
        setStatus('');
      });

      copyBtn.addEventListener('click', function () {
        if (outputEl.textContent) {
          copyToClipboard(outputEl.textContent, copyBtn);
          setStatus(t('common.copied', '已复制'));
        }
      });
    })();
  </script>
</body>
</html>
