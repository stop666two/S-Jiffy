<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日期序列生成器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .range-controls { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; }
    .range-controls select { width: auto; }
    .range-summary { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: var(--space-2); }
    .range-summary b { color: var(--color-text-primary); }
    .date-list { max-height: 320px; overflow-y: auto; font-family: var(--font-mono); font-size: var(--font-size-sm); line-height: 1.8; }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">日期序列生成器</h1>
    <p class="tool-desc" data-i18n="desc">按天、周、月或年步长生成两日期之间的日期序列，支持一键复制。</p>
    <div class="card">
      <div class="range-controls">
        <input id="startInput" type="date" class="input js-focus-input">
        <span data-i18n="ui.1">至</span>
        <input id="endInput" type="date" class="input">
        <select id="stepSelect" class="input">
          <option value="day" data-i18n="ui.2">每天</option>
          <option value="week" data-i18n="ui.3">每周</option>
          <option value="month" data-i18n="ui.4">每月</option>
          <option value="year" data-i18n="ui.5">每年</option>
        </select>
      </div>
    </div>
    <div id="resultBox" class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>
  (function () {
    var startInput = document.getElementById('startInput');
    var endInput = document.getElementById('endInput');
    var stepSelect = document.getElementById('stepSelect');
    var outputText = document.getElementById('outputText');
    var copyBtn = document.getElementById('copyBtn');
    var MAX_ITEMS = 5000;

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function parseDate(s) {
      var parts = s.split('-');
      if (parts.length !== 3) { return null; }
      var y = parseInt(parts[0], 10);
      var m = parseInt(parts[1], 10);
      var d = parseInt(parts[2], 10);
      if (isNaN(y) || isNaN(m) || isNaN(d)) { return null; }
      var dt = new Date(y, m - 1, d);
      if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) { return null; }
      return dt;
    }

    function daysInMonth(y, m) {
      return new Date(y, m, 0).getDate();
    }

    function fmt(dt) {
      return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
    }

    function render() {
      var sv = startInput.value;
      var ev = endInput.value;
      if (!sv || !ev) {
        outputText.innerHTML = '';
        setStatus('');
        return;
      }
      var start = parseDate(sv);
      var end = parseDate(ev);
      if (!start || !end) {
        outputText.innerHTML = '';
        setStatus(t('ui.100','请输入有效的开始与结束日期'), 'error');
        return;
      }
      if (start.getTime() > end.getTime()) {
        outputText.innerHTML = '';
        setStatus(t('ui.101','开始日期不能晚于结束日期'), 'error');
        return;
      }
      var step = stepSelect.value;
      var baseDay = start.getDate();
      var baseMonth = start.getMonth();
      var baseYear = start.getFullYear();
      var list = [];
      var i = 0;
      var cur;
      if (step === 'day') {
        for (cur = new Date(start); cur.getTime() <= end.getTime(); cur.setDate(cur.getDate() + 1)) {
          list.push(fmt(cur));
          i++;
          if (i > MAX_ITEMS) { break; }
        }
      } else if (step === 'week') {
        for (cur = new Date(start); cur.getTime() <= end.getTime(); cur.setDate(cur.getDate() + 7)) {
          list.push(fmt(cur));
          i++;
          if (i > MAX_ITEMS) { break; }
        }
      } else if (step === 'month') {
        var mIdx = 0;
        while (true) {
          var ty = baseYear + Math.floor((baseMonth + mIdx) / 12);
          var tm = ((baseMonth + mIdx) % 12) + 1;
          var day = Math.min(baseDay, daysInMonth(ty, tm));
          cur = new Date(ty, tm - 1, day);
          if (cur.getTime() > end.getTime()) { break; }
          if (cur.getTime() >= start.getTime()) {
            list.push(fmt(cur));
            i++;
          }
          mIdx++;
          if (i > MAX_ITEMS) { break; }
        }
      } else {
        var yIdx = 0;
        while (true) {
          var yy = baseYear + yIdx;
          var day2 = Math.min(baseDay, daysInMonth(yy, baseMonth + 1));
          cur = new Date(yy, baseMonth, day2);
          if (cur.getTime() > end.getTime()) { break; }
          if (cur.getTime() >= start.getTime()) {
            list.push(fmt(cur));
            i++;
          }
          yIdx++;
          if (i > MAX_ITEMS) { break; }
        }
      }
      if (i > MAX_ITEMS) {
        outputText.innerHTML = '';
        setStatus(t('ui.8','日期序列超过 ') + MAX_ITEMS + t('ui.7',' 条，请缩小日期范围'), 'error');
        return;
      }
      var html = '<div class="range-summary">' + t('ui.count','共 <b>{n}</b> 个日期（').replace('{n}',list.length) + '</b> 个日期（' + htmlEscape(stepLabel(step)) + t('ui.closeParen','）') + '</div>';
      html += '<div class="date-list">' + htmlEscape(list.join('\n')).replace(/\n/g, '<br>') + '</div>';
      outputText.innerHTML = html;
      copyBtn.onclick = function () { copyToClipboard(list.join('\n'), copyBtn); };
      setStatus(t('ui.generated','已生成 ') + list.length + t('ui.6',' 个日期'));
    }

    function stepLabel(step) {
      if (step === 'day') { return t('ui.stepDay','每天'); }
      if (step === 'week') { return t('ui.stepWeek','每周'); }
      if (step === 'month') { return t('ui.stepMonth','每月'); }
      return t('ui.stepYear','每年');
    }

    startInput.addEventListener('input', render);
    endInput.addEventListener('input', render);
    stepSelect.addEventListener('change', render);
    render();
  })();
  </script>
</body>
</html>
