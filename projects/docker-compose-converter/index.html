<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docker Compose 转换器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .dc-fields { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .dc-field { display:flex; flex-direction:column; gap:4px; }
    .dc-field label { font-size:12px; color:var(--color-text-secondary); }
    .dc-field input, .dc-field select { height:36px; padding:0 10px; font-size:13px; border:1px solid #ddd; border-radius:var(--radius-md); font-family:var(--font-mono); }
    .dc-checkboxes { display:flex; flex-wrap:wrap; gap:8px; }
    .dc-checkboxes label { font-size:13px; color:var(--color-text-secondary); display:flex; align-items:center; gap:4px; cursor:pointer; }
    .dc-addl { margin-top:12px; }
    .dc-addl textarea { min-height:60px; }
    .dc-tabs { display:flex; gap:var(--space-1); margin-bottom:var(--space-3); }
    .dc-tabs button { flex:1; height:44px; font-size:var(--font-size-sm); border:1px solid var(--color-border); border-radius:var(--radius-md); background:var(--color-bg); cursor:pointer; transition:all .15s; }
    .dc-tabs button.active { background:var(--color-text-primary); color:#fff; border-color:var(--color-text-primary); }
    .service-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-2);margin-bottom:var(--space-3);}
    .service-card{border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-2);cursor:pointer;transition:all .15s;text-align:center;}
    .service-card:hover{border-color:var(--color-text-primary);}
    .service-card.selected{border-color:var(--color-text-primary);background:var(--color-bg-soft);}
    .service-card .icon{font-size:24px;margin-bottom:4px;}
    .service-card .sname{font-size:var(--font-size-sm);font-weight:600;}
    .service-card .sdesc{font-size:var(--font-size-xs);color:var(--color-text-secondary);}
    .param-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-bottom:var(--space-3);}
    @media(max-width:600px){.service-grid,.param-grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
  <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a></header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">Docker Run→Compose</h1>
    <p class="tool-desc" data-i18n="desc">将 <code>docker run</code> 参数转换为 docker-compose.yml 格式。</p>
    <div class="dc-tabs">
      <button id="tabConvert" class="active" type="button" data-i18n="ui.s15">转换</button>
      <button id="tabSnippets" type="button" data-i18n="ui.s14">片段</button>
    </div>
    <div id="panelConvert">
    <div class="card">
      <div class="dc-fields">
        <div class="dc-field">
          <label data-i18n="ui.1">镜像 (image)</label>
          <input id="imageInput" class="js-focus-input" placeholder="nginx:latest">
        </div>
        <div class="dc-field">
          <label data-i18n="ui.2">容器名称 (--name)</label>
          <input id="nameInput" placeholder="my-container">
        </div>
        <div class="dc-field">
          <label data-i18n="ui.3">端口映射 (-p, 如 80:80)</label>
          <input id="portsInput" placeholder="80:80">
        </div>
        <div class="dc-field">
          <label data-i18n="ui.4">卷挂载 (-v, 如 ./html:/usr/share/nginx/html)</label>
          <input id="volumesInput" placeholder="./html:/usr/share/nginx/html">
        </div>
        <div class="dc-field">
          <label data-i18n="ui.5">环境变量 (-e, 如 KEY=value)</label>
          <input id="envInput" placeholder="KEY=value">
        </div>
        <div class="dc-field">
          <label data-i18n="ui.6">网络 (--network)</label>
          <input id="networkInput" placeholder="bridge">
        </div>
        <div class="dc-field">
          <label data-i18n="ui.7">重启策略 (--restart)</label>
          <select id="restartSelect">
            <option value="" data-i18n="ui.none">无</option>
            <option value="no">no</option>
            <option value="always">always</option>
            <option value="on-failure">on-failure</option>
            <option value="unless-stopped">unless-stopped</option>
          </select>
        </div>
        <div class="dc-field">
          <label data-i18n="ui.8">命令 (command)</label>
          <input id="commandInput" placeholder="nginx -g daemon off;">
        </div>
      </div>
      <div class="dc-checkboxes" style="margin-top:12px;">
        <label><input type="checkbox" id="detachChk"><span data-i18n="ui.detach"> -d (后台运行)</span></label>
        <label><input type="checkbox" id="ttyChk"> -t (TTY)</label>
        <label><input type="checkbox" id="interactiveChk"><span data-i18n="ui.interactive"> -i (交互)</span></label>
        <label><input type="checkbox" id="rmChk"><span data-i18n="ui.remove"> --rm (自动删除)</span></label>
        <label><input type="checkbox" id="privilegedChk"> --privileged</label>
      </div>
      <div class="dc-addl">
        <textarea id="extraInput" class="input textarea" data-i18n-placeholder="ui.101" placeholder='额外 docker run 参数 (每行一个, 如 --restart=always 等)' style="min-height:40px;"></textarea>
      </div>
    </div>
    <div class="action-bar" style="display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap;">
      <button id="convertBtn" class="btn btn-primary" data-i18n="ui.9">生成 Compose</button>
      <button id="clearBtn" class="btn btn-secondary" data-i18n="ui.clear">清空</button>
    </div>
    </div>
    <div id="panelSnippets" style="display:none;">
    <div class="service-grid">
      <div class="service-card" data-service="nginx"><div class="icon">🌐</div><div class="sname">Nginx</div><div class="sdesc">Web Server / Reverse Proxy</div></div>
      <div class="service-card" data-service="postgres"><div class="icon">🗄️</div><div class="sname">PostgreSQL</div><div class="sdesc" data-i18n="ui.s1">关系型数据库</div></div>
      <div class="service-card" data-service="redis"><div class="icon">⚡</div><div class="sname">Redis</div><div class="sdesc" data-i18n="ui.s2">缓存 / 消息队列</div></div>
      <div class="service-card" data-service="mysql"><div class="icon">🐬</div><div class="sname">MySQL</div><div class="sdesc" data-i18n="ui.s1">关系型数据库</div></div>
      <div class="service-card" data-service="mongo"><div class="icon">🍃</div><div class="sname">MongoDB</div><div class="sdesc" data-i18n="ui.s3">NoSQL 数据库</div></div>
      <div class="service-card" data-service="rabbitmq"><div class="icon">🐇</div><div class="sname">RabbitMQ</div><div class="sdesc" data-i18n="ui.s4">消息队列</div></div>
    </div>
    <div id="paramArea" class="param-grid"></div>
    <div class="action-bar" style="display:flex;gap:12px;margin-bottom:var(--space-3);"><button id="snipGenBtn" class="btn btn-primary" data-i18n="ui.s5">生成片段</button></div>
    </div>
    <div class="output-box" id="输出Container">
      <span id="outputText" style="display:block; padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>
    (function () {
      var outputEl = document.getElementById('outputText');
      var imageEl = document.getElementById('imageInput');
      var nameEl = document.getElementById('nameInput');
      var portsEl = document.getElementById('portsInput');
      var volumesEl = document.getElementById('volumesInput');
      var envEl = document.getElementById('envInput');
      var networkEl = document.getElementById('networkInput');
      var restartEl = document.getElementById('restartSelect');
      var commandEl = document.getElementById('commandInput');
      var detachChk = document.getElementById('detachChk');
      var ttyChk = document.getElementById('ttyChk');
      var interactiveChk = document.getElementById('interactiveChk');
      var rmChk = document.getElementById('rmChk');
      var privilegedChk = document.getElementById('privilegedChk');
      var extraEl = document.getElementById('extraInput');

      function yamlVal(s) {
        if (s === undefined || s === null) return '';
        return String(s);
      }

      document.getElementById('convertBtn').addEventListener('click', function () {
        var image = imageEl.value.trim();
        if (!image) { setStatus(t('ui.100','请输入镜像名称'), 'error'); return; }

        var lines = [];
        lines.push('version: "3.8"');
        lines.push('');
        lines.push('services:');
        var svcName = nameEl.value.trim() || 'app';
        lines.push('  ' + svcName + ':');
        lines.push('    image: ' + image);

        var ports = portsEl.value.trim();
        if (ports) {
          lines.push('    ports:');
          var portList = ports.split(/[\s,]+/);
          for (var i = 0; i < portList.length; i++) {
            if (portList[i].trim()) {
              lines.push('      - "' + portList[i].trim() + '"');
            }
          }
        }

        var volumes = volumesEl.value.trim();
        if (volumes) {
          lines.push('    volumes:');
          var volList = volumes.split(/[\s,]+/);
          for (var i = 0; i < volList.length; i++) {
            if (volList[i].trim()) {
              lines.push('      - ' + volList[i].trim());
            }
          }
        }

        var env = envEl.value.trim();
        if (env) {
          lines.push('    environment:');
          var envList = env.split(/[\s,]+/);
          for (var i = 0; i < envList.length; i++) {
            var e = envList[i].trim();
            if (e) {
              var eqIdx = e.indexOf('=');
              if (eqIdx > 0) {
                var k = e.substring(0, eqIdx);
                var v = e.substring(eqIdx + 1);
                lines.push('      ' + k + ': "' + v + '"');
              } else {
                lines.push('      ' + e + ': ""');
              }
            }
          }
        }

        var restart = restartEl.value;
        if (restart) lines.push('    restart: ' + restart);

        var network = networkEl.value.trim();
        if (network) {
          lines.push('    networks:');
          lines.push('      - ' + network);
        }

        var command = commandEl.value.trim();
        if (command) {
          lines.push('    command: ' + command);
        }

        var extraOpts = [];
        if (detachChk.checked) extraOpts.push('detach: true');
        if (ttyChk.checked) extraOpts.push('tty: true');
        if (interactiveChk.checked) extraOpts.push('stdin_open: true');
        if (rmChk.checked) extraOpts.push('auto_remove: true');
        if (privilegedChk.checked) extraOpts.push('privileged: true');

        var extraRaw = extraEl.value.trim();
        if (extraRaw) {
          var extraLines = extraRaw.split('\n');
          for (var i = 0; i < extraLines.length; i++) {
            var el = extraLines[i].trim();
            if (el) extraOpts.push(el);
          }
        }

        if (extraOpts.length > 0) {
          for (var i = 0; i < extraOpts.length; i++) {
            lines.push('    ' + extraOpts[i]);
          }
        }

        outputEl.textContent = lines.join('\n');
        setStatus(t('ui.10','已生成 docker-compose.yml'));
      });

      document.getElementById('clearBtn').addEventListener('click', function () {
        imageEl.value = ''; nameEl.value = ''; portsEl.value = ''; volumesEl.value = '';
        envEl.value = ''; networkEl.value = ''; restartEl.value = ''; commandEl.value = '';
        detachChk.checked = false; ttyChk.checked = false; interactiveChk.checked = false;
        rmChk.checked = false; privilegedChk.checked = false;
        extraEl.value = ''; outputEl.textContent = ''; setStatus(''); imageEl.focus();
      });

      document.getElementById('copyBtn').addEventListener('click', function () { if (outputEl.textContent) { copyToClipboard(outputEl.textContent, this); setStatus(t('ui.copiedClip','已复制到剪贴板')); } });

      var tabConvert=document.getElementById('tabConvert'),tabSnippets=document.getElementById('tabSnippets');
      var panelConvert=document.getElementById('panelConvert'),panelSnippets=document.getElementById('panelSnippets');
      function switchTab(which){
        if(which==='convert'){tabConvert.className='active';tabSnippets.className='';panelConvert.style.display='';panelSnippets.style.display='none';}
        else{tabSnippets.className='active';tabConvert.className='';panelSnippets.style.display='';panelConvert.style.display='none';}
      }
      tabConvert.addEventListener('click',function(){switchTab('convert');});
      tabSnippets.addEventListener('click',function(){switchTab('snippets');});

      var pa=document.getElementById('paramArea');
      var currentService='nginx';
      var paramDefs={
        nginx:[{key:'port',label: t('ui.s9','宿主机端口'),val:'8080'},{key:'volume',label: t('ui.s12','挂载配置目录'),val:'./nginx.conf:/etc/nginx/conf.d/default.conf'}],
        postgres:[{key:'port',label: t('ui.s9','宿主机端口'),val:'5432'},{key:'password',label:'POSTGRES_PASSWORD',val:'mysecretpassword'},{key:'db',label:'POSTGRES_DB',val:'mydb'}],
        redis:[{key:'port',label: t('ui.s9','宿主机端口'),val:'6379'},{key:'password',label: t('ui.s11','密码（可选）'),val:''},{key:'persistent',label: t('ui.s10','持久化存储'),val:'yes'}],
        mysql:[{key:'port',label: t('ui.s9','宿主机端口'),val:'3306'},{key:'password',label:'MYSQL_ROOT_PASSWORD',val:'rootpassword'},{key:'db',label:'MYSQL_DATABASE',val:'mydb'}],
        mongo:[{key:'port',label: t('ui.s9','宿主机端口'),val:'27017'},{key:'user',label:'MONGO_INITDB_ROOT_USERNAME',val:'admin'},{key:'password',label:'MONGO_INITDB_ROOT_PASSWORD',val:'password'}],
        rabbitmq:[{key:'port',label: t('ui.s8','AMQP 端口'),val:'5672'},{key:'uiPort',label: t('ui.s7','管理界面端口'),val:'15672'},{key:'user',label:'RABBITMQ_DEFAULT_USER',val:'guest'},{key:'password',label:'RABBITMQ_DEFAULT_PASS',val:'guest'}]
      };
      function buildParams(service){
        var defs=paramDefs[service]||[];var h='';
        defs.forEach(function(d,i){h+='<div class="card" style="margin-bottom:0;"><label style="font-size:var(--font-size-sm);color:var(--color-text-secondary);display:block;margin-bottom:4px;">'+d.label+'</label><input id="param_'+i+'" class="input" value="'+d.val+'"></div>';});
        pa.innerHTML=h;
      }
      var cards=document.querySelectorAll('.service-card');
      for(var ci=0;ci<cards.length;ci++){cards[ci].addEventListener('click',function(){
        cards.forEach(function(c){c.classList.remove('selected');});this.classList.add('selected');
        currentService=this.dataset.service;buildParams(currentService);outputEl.textContent='';setStatus('');
      });}
      var composeTemplates={
        nginx:function(v){return'  nginx:\n    image: nginx:alpine\n    container_name: nginx\n    ports:\n      - "'+v[0]+':80"\n    volumes:\n      - '+v[1]+'\n    restart: unless-stopped';},
        postgres:function(v){return'  postgres:\n    image: postgres:16-alpine\n    container_name: postgres\n    ports:\n      - "'+v[0]+':5432"\n    environment:\n      POSTGRES_PASSWORD: '+v[1]+'\n      POSTGRES_DB: '+v[2]+'\n    volumes:\n      - pgdata:/var/lib/postgresql/data\n    restart: unless-stopped';},
        redis:function(v){var lines='  redis:\n    image: redis:7-alpine\n    container_name: redis\n    ports:\n      - "'+v[0]+':6379"';if(v[1])lines+='\n    command: redis-server --requirepass '+v[1];if(v[2]==='yes')lines+='\n    volumes:\n      - redisdata:/data';lines+='\n    restart: unless-stopped';return lines;},
        mysql:function(v){return'  mysql:\n    image: mysql:8.0\n    container_name: mysql\n    ports:\n      - "'+v[0]+':3306"\n    environment:\n      MYSQL_ROOT_PASSWORD: '+v[1]+'\n      MYSQL_DATABASE: '+v[2]+'\n    volumes:\n      - mysqldata:/var/lib/mysql\n    restart: unless-stopped';},
        mongo:function(v){return'  mongo:\n    image: mongo:7\n    container_name: mongo\n    ports:\n      - "'+v[0]+':27017"\n    environment:\n      MONGO_INITDB_ROOT_USERNAME: '+v[1]+'\n      MONGO_INITDB_ROOT_PASSWORD: '+v[2]+'\n    volumes:\n      - mongodata:/data/db\n    restart: unless-stopped';},
        rabbitmq:function(v){return'  rabbitmq:\n    image: rabbitmq:3-management-alpine\n    container_name: rabbitmq\n    ports:\n      - "'+v[0]+':5672"\n      - "'+v[1]+':15672"\n    environment:\n      RABBITMQ_DEFAULT_USER: '+v[2]+'\n      RABBITMQ_DEFAULT_PASS: '+v[3]+'\n    restart: unless-stopped';}
      };
      document.getElementById('snipGenBtn').addEventListener('click',function(){
        var vals=[];var defs=paramDefs[currentService]||[];
        for(var i=0;i<defs.length;i++){var el=document.getElementById('param_'+i);vals.push(el?el.value:'');}
        var tpl=composeTemplates[currentService];
        if(tpl){outputEl.textContent='version: "3.8"\n\nservices:\n'+tpl(vals);setStatus(t('ui.s6','docker-compose 片段已生成'));}
        else{setStatus(t('ui.s13','未知服务类型'),'error');}
      });
      buildParams('nginx');cards[0].classList.add('selected');
    })();
  </script>
</body>
</html>
