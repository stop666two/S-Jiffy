<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dockerfile 生成 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css">
<style>
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-bottom:var(--space-3);}
.form-grid .card{margin-bottom:0;}
@media(max-width:600px){.form-grid{grid-template-columns:1fr;}}
.dc-tabs{display:flex;gap:var(--space-1);margin-bottom:var(--space-3);}
.dc-tabs button{flex:1;height:44px;font-size:var(--font-size-sm);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-bg);cursor:pointer;transition:all .15s;}
.dc-tabs button.active{background:var(--color-text-primary);color:#fff;border-color:var(--color-text-primary);}
.issue{padding:8px 12px;margin-bottom:6px;border-radius:var(--radius-sm);font-size:13px;display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.issue-error{background:#ffebee;border-left:3px solid var(--color-error)}
.issue-warn{background:#fff8e1;border-left:3px solid #f9a825}
.issue-info{background:#e3f2fd;border-left:3px solid #1976d2}
.issue-pass{background:#e8f5e9;border-left:3px solid var(--color-success)}
.issue .icon{font-size:16px;flex-shrink:0;margin-top:1px}
.summary{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:var(--space-2);padding:var(--space-2);background:var(--color-bg-soft);border-radius:var(--radius-md)}
.summary-item{text-align:center;min-width:60px}
.summary-item .num{font-size:var(--font-size-lg);font-weight:700}
.summary-item .lbl{font-size:var(--font-size-xs);color:var(--color-text-secondary)}
</style></head><body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a></header>
<main class="tool-workspace"><h1 data-i18n="h1">Dockerfile 生成</h1><p class="tool-desc" data-i18n="desc">基于基础镜像、安装包与运行命令生成 Dockerfile，并可按最佳实践检查 Dockerfile 问题。</p>
<div class="dc-tabs">
<button id="tabGen" class="active" type="button" data-i18n="ui.l23">生成</button>
<button id="tabCheck" type="button" data-i18n="ui.l22">检查</button>
</div>
<div id="panelGen">
<div class="form-grid">
<div class="card"><label style="font-size:var(--font-size-sm);color:var(--color-text-secondary);display:block;margin-bottom:6px;" data-i18n="ui.1">基础镜像</label>
<select id="baseImage" class="input">
  <option value="node:20-alpine">node:20-alpine</option>
  <option value="node:20-slim">node:20-slim</option>
  <option value="python:3.12-slim">python:3.12-slim</option>
  <option value="python:3.12-alpine">python:3.12-alpine</option>
  <option value="golang:1.22-alpine">golang:1.22-alpine</option>
  <option value="openjdk:21-slim">openjdk:21-slim</option>
  <option value="rust:1.78-slim">rust:1.78-slim</option>
  <option value="nginx:alpine">nginx:alpine</option>
  <option value="ubuntu:24.04">ubuntu:24.04</option>
  <option value="alpine:3.20">alpine:3.20</option>
</select></div>
<div class="card"><label style="font-size:var(--font-size-sm);color:var(--color-text-secondary);display:block;margin-bottom:6px;" data-i18n="ui.2">工作目录</label>
<input id="workDir" class="input" value="/app" placeholder="/app"></div>
<div class="card"><label style="font-size:var(--font-size-sm);color:var(--color-text-secondary);display:block;margin-bottom:6px;" data-i18n="ui.3">安装包（逗号分隔）</label>
<input id="packages" class="input" value="" placeholder="curl, git, vim"></div>
<div class="card"><label style="font-size:var(--font-size-sm);color:var(--color-text-secondary);display:block;margin-bottom:6px;" data-i18n="ui.4">监听端口</label>
<input id="exposePort" class="input" type="number" value="3000" placeholder="3000"></div>
<div class="card" style="grid-column:1/-1;"><label style="font-size:var(--font-size-sm);color:var(--color-text-secondary);display:block;margin-bottom:6px;" data-i18n="ui.5">运行命令</label>
<input id="runCmd" class="input" value="npm start" placeholder="npm start"></div>
<div class="card" style="grid-column:1/-1;"><label style="font-size:var(--font-size-sm);color:var(--color-text-secondary);display:block;margin-bottom:6px;" data-i18n="ui.6">额外 RUN 命令（每行一条）</label>
<textarea id="extraRuns" class="input textarea" placeholder="npm ci&#10;npm run build" style="min-height:60px;"></textarea></div></div>
<button id="generateBtn" class="btn btn-primary" style="margin-bottom:var(--space-3);" data-i18n="ui.7">生成 Dockerfile</button>
<div class="output-box"><span id="outputText"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
</div>
<div id="panelCheck" style="display:none;">
<div class="card"><textarea id="dfInput" class="input textarea" data-i18n-placeholder="ui.l13" placeholder="粘贴 Dockerfile 内容" style="min-height:180px;">FROM node:latest
WORKDIR /app
COPY . .
RUN npm install
EXPOSE 3000
CMD ["npm", "start"]</textarea><button id="lintBtn" class="btn btn-primary" style="margin-top:var(--space-2);" data-i18n="ui.l1">检查</button></div>
<div id="lintResult" style="margin-top:var(--space-2);"></div>
</div>
</main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
<script>(function(){
var bi=document.getElementById('baseImage'),wd=document.getElementById('workDir'),pkg=document.getElementById('packages');
var ep=document.getElementById('exposePort'),rc=document.getElementById('runCmd'),er=document.getElementById('extraRuns'),o=document.getElementById('outputText');
document.getElementById('generateBtn').addEventListener('click',function(){
  var lines=['# Dockerfile generated by S-Jiffy\nFROM '+bi.value];
  var pkgs=pkg.value.trim();if(pkgs){var isAlpine=bi.value.indexOf('alpine')!==-1;lines.push('RUN '+(!isAlpine?'apt-get update && apt-get install -y ':'apk add --no-cache ')+pkgs.replace(/,\s*/g,' ')+(!isAlpine?' && rm -rf /var/lib/apt/lists/*':''));}
  lines.push('WORKDIR '+wd.value);
  var extra=er.value.trim();if(extra){var erLines=extra.split('\n').filter(function(l){return l.trim();});erLines.forEach(function(l){lines.push('RUN '+l.trim());});}
  lines.push('COPY . .');
  var port=parseInt(ep.value);if(port&&port>0&&port<65536)lines.push('EXPOSE '+port);
  lines.push('CMD ["'+rc.value.replace(/"/g,'\\"').split(' ').join('","')+'"]');
  o.textContent=lines.join('\n');
  setStatus(t('ui.100','Dockerfile 已生成'));
});
document.getElementById('copyBtn').addEventListener('click',function(){if(o.textContent)copyToClipboard(o.textContent,this);setStatus(t('ui.101','已复制'));});

var tabGen=document.getElementById('tabGen'),tabCheck=document.getElementById('tabCheck');
var panelGen=document.getElementById('panelGen'),panelCheck=document.getElementById('panelCheck');
function switchTab(which){
  if(which==='gen'){tabGen.className='active';tabCheck.className='';panelGen.style.display='';panelCheck.style.display='none';}
  else{tabCheck.className='active';tabGen.className='';panelCheck.style.display='';panelGen.style.display='none';}
}
tabGen.addEventListener('click',function(){switchTab('gen');});
tabCheck.addEventListener('click',function(){switchTab('check');});

var dfInput=document.getElementById('dfInput'),lintBtn=document.getElementById('lintBtn'),lintResult=document.getElementById('lintResult');
function lint(){
  var raw=dfInput.value;
  if(!raw.trim()){setStatus(t('ui.l12','请输入 Dockerfile 内容'),'error');return;}
  var lines=raw.split('\n');
  var issues=[];
  var hasFrom=false,hasWorkdir=false,hasCopy=false,hasUser=false,hasExpose=false,hasCmd=false;
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();
    var lineNum=i+1;
    if(line.startsWith('#'))continue;
    if(line.startsWith('FROM')){
      hasFrom=true;
      var parts=line.split(/\s+/);
      if(parts.length>=2){
        var img=parts[1];
        if(img==='node:latest'||img==='python:latest'||img==='ubuntu:latest'||img.endsWith(':latest')){
          issues.push({type:'warn',msg: t('ui.l14','第 ')+lineNum+t('ui.l15',' 行: 使用 "latest" 标签可能导致不可重复构建。建议固定版本如 ')+img.replace(':latest','')+':18'});
        }else if(img.indexOf(':')===-1){
          issues.push({type:'warn',msg: t('ui.l14','第 ')+lineNum+ t('ui.l10',' 行: 未指定镜像标签，默认使用 latest。建议固定版本')});
        }
        if(img==='ubuntu'||img.startsWith('ubuntu:')){
          issues.push({type:'info',msg: t('ui.l14','第 ')+lineNum+ t('ui.l9',' 行: Ubuntu 镜像建议添加 DEBIAN_FRONTEND=noninteractive')});
        }
      }
      if(parts.length>=4&&parts[2]==='AS'){
        issues.push({type:'info',msg: t('ui.l14','第 ')+lineNum+ t('ui.l11',' 行: 使用多阶段构建 (AS ')+parts[3]+')'});
      }
    }else if(line.startsWith('WORKDIR')){hasWorkdir=true;}
    else if(line.startsWith('COPY')){
      hasCopy=true;
      if(line.indexOf('--chown')===-1&&!hasUser){
        issues.push({type:'info',msg: t('ui.l14','第 ')+lineNum+ t('ui.l8',' 行: COPY 建议使用 --chown 参数指定文件所有者')});
      }
    }else if(line.startsWith('RUN')){
      if(line.indexOf('apt-get')!==-1&&line.indexOf('--no-install-recommends')===-1){
        issues.push({type:'warn',msg: t('ui.l14','第 ')+lineNum+ t('ui.l7',' 行: apt-get 建议添加 --no-install-recommends 参数减少体积')});
      }
      if(line.indexOf('&&')===-1&&line.indexOf('apt-get')!==-1){
        issues.push({type:'info',msg: t('ui.l14','第 ')+lineNum+ t('ui.l6',' 行: 多个 RUN 命令建议用 && 合并以减少层数')});
      }
    }else if(line.startsWith('USER')){hasUser=true;}
    else if(line.startsWith('EXPOSE')){hasExpose=true;}
    else if(line.startsWith('CMD')||line.startsWith('ENTRYPOINT')){hasCmd=true;}
  }
  if(!hasFrom)issues.push({type:'error',msg: t('ui.l5','缺少 FROM 指令')});
  if(!hasCmd)issues.push({type:'warn',msg: t('ui.l4','缺少 CMD 或 ENTRYPOINT 指令')});
  if(hasCopy&&!hasWorkdir)issues.push({type:'info',msg: t('ui.l3','COPY 前建议设置 WORKDIR')});
  if(!hasUser&&hasExpose)issues.push({type:'info',msg:t('ui.l16','暴露端口 (EXPOSE) 前建议创建非 root 用户并使用 USER 切换')});
  var errCount=0,warnCount=0,infoCount=0;
  for(var j=0;j<issues.length;j++){
    if(issues[j].type==='error')errCount++;
    else if(issues[j].type==='warn')warnCount++;
    else infoCount++;
  }
  var html='<div class="summary"><div class="summary-item"><div class="num">'+issues.length+'</div><div class="lbl">'+t('ui.l17','总计')+'</div></div><div class="summary-item"><div class="num" style="color:var(--color-error)">'+errCount+'</div><div class="lbl">'+t('ui.l18','错误')+'</div></div><div class="summary-item"><div class="num" style="color:#f9a825">'+warnCount+'</div><div class="lbl">'+t('ui.l19','警告')+'</div></div><div class="summary-item"><div class="num" style="color:#1976d2">'+infoCount+'</div><div class="lbl">'+t('ui.l20','建议')+'</div></div></div>';
  if(!issues.length){
    html+='<div class="issue issue-pass"><span class="icon">✓</span><span>'+t('ui.l21','未发现问题，Dockerfile 遵循基本最佳实践')+'</span></div>';
  }else{
    for(var k=0;k<issues.length;k++){
      var cls='issue-'+issues[k].type;
      var icon=issues[k].type==='error'?'✗':issues[k].type==='warn'?'⚠':'ℹ';
      html+='<div class="issue '+cls+'"><span class="icon">'+icon+'</span><span>'+htmlEscape(issues[k].msg)+'</span></div>';
    }
  }
  lintResult.innerHTML=html;
  setStatus(t('ui.l2','检查完成'));
}
lintBtn.addEventListener('click',lint);
})();</script>
</body></html>
