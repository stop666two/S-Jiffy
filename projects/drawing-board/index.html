<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>在线画板 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css">
<style>
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:var(--space-3);}
.toolbar .sep{width:1px;height:32px;background:var(--color-border);}
.swatch-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;transition:transform 0.1s;}
.swatch:hover{transform:scale(1.15);}
.swatch.active{border-color:var(--color-text-primary);box-shadow:var(--shadow-focus);}
.size-btn{width:36px;height:36px;border-radius:var(--radius-sm);border:1px solid var(--color-border);background:var(--color-bg);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.size-btn.active{border-color:var(--color-text-primary);box-shadow:var(--shadow-focus);}
.size-dot{background:var(--color-text-primary);border-radius:50%;}
.canvas-wrap{position:relative;border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden;background:#FFFFFF;touch-action:none;}
#board{display:block;width:100%;height:auto;cursor:crosshair;}
.canvas-info{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:var(--space-2);font-size:var(--font-size-xs);color:var(--color-text-secondary);}
.canvas-info select{height:36px;padding:0 var(--space-2);border:1px solid #DDDDDD;border-radius:var(--radius-sm);outline:none;background:var(--color-bg);font-size:var(--font-size-sm);}
</style></head>
<body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><a href="../../index.html" class="back-btn">← 返回</a></header>
<main class="tool-workspace"><h1>在线画板</h1><p class="tool-desc">直接在画布上涂鸦绘画，支持笔刷颜色与粗细调节、橡皮擦和撤销。</p>
<div class="card">
<div class="toolbar">
<div class="swatch-row" id="swatchRow"></div>
<input id="colorInput" type="color" value="#111111" title="自定义颜色" style="width:36px;height:36px;border:none;padding:0;background:transparent;cursor:pointer;">
<div class="sep"></div>
<div class="swatch-row" id="sizeRow"></div>
<div class="sep"></div>
<button id="eraserBtn" class="btn btn-secondary" style="height:36px;min-width:72px;">橡皮擦</button>
<button id="undoBtn" class="btn btn-secondary" style="height:36px;min-width:72px;">撤销</button>
<button id="clearBtn" class="btn btn-secondary" style="height:36px;min-width:72px;">清空</button>
<button id="saveBtn" class="btn btn-primary" style="height:36px;min-width:72px;">下载 PNG</button>
</div>
<div class="canvas-wrap" id="canvasWrap">
<canvas id="board" width="800" height="500"></canvas>
</div>
<div class="canvas-info">
<span id="modeInfo">工具：画笔 颜色：#111111 粗细：4px</span>
<span>画布尺寸 <select id="sizeSelect">
<option value="800,500" selected>800 × 500</option>
<option value="640,480">640 × 480</option>
<option value="1024,640">1024 × 640</option>
</select></span>
</div>
</div></main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div>S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
<script src="../../assets/js/custom-controls.js"></script>
<script>
(function(){
var canvas=document.getElementById('board'),ctx=canvas.getContext('2d');
var swatchRow=document.getElementById('swatchRow'),sizeRow=document.getElementById('sizeRow');
var colorInput=document.getElementById('colorInput'),eraserBtn=document.getElementById('eraserBtn');
var undoBtn=document.getElementById('undoBtn'),clearBtn=document.getElementById('clearBtn');
var saveBtn=document.getElementById('saveBtn'),sizeSelect=document.getElementById('sizeSelect');
var modeInfo=document.getElementById('modeInfo');
var PRESETS=['#111111','#9F2F2D','#C75B39','#B57614','#346538','#14645E','#25588C','#3B5BDB','#5B4A9E','#8E4A7D','#9C6B3A','#787774'];
var SIZES=[2,4,6,10,14];
var curColor='#111111',curSize=4,eraser=false,drawing=false,lastX=0,lastY=0;
var undoStack=[],MAX_UNDO=50;

function fillWhite(){
ctx.fillStyle='#FFFFFF';
ctx.fillRect(0,0,canvas.width,canvas.height);}
function resizeCanvas(w,h){
undoStack=[];
canvas.width=w;
canvas.height=h;
fillWhite();
updateInfo();}
function snapshot(){
if(undoStack.length>=MAX_UNDO)undoStack.shift();
undoStack.push(ctx.getImageData(0,0,canvas.width,canvas.height));}
function renderSwatches(){
swatchRow.innerHTML='';
for(var i=0;i<PRESETS.length;i++){
(function(color){
var b=document.createElement('button');
b.className='swatch'+(color===curColor?' active':'');
b.style.background=color;
b.title=color;
b.addEventListener('click',function(){
curColor=color;colorInput.value=color;eraser=false;
var all=swatchRow.getElementsByTagName('button');
for(var j=0;j<all.length;j++)all[j].className='swatch'+(all[j].style.background===color?' active':'');
updateInfo();setStatus('已选择颜色 '+color);});
swatchRow.appendChild(b);
})(PRESETS[i]);}
colorInput.addEventListener('input',function(){
curColor=colorInput.value;eraser=false;
var all=swatchRow.getElementsByTagName('button');
for(var j=0;j<all.length;j++)all[j].className='swatch';
updateInfo();});}
function renderSizes(){
sizeRow.innerHTML='';
for(var i=0;i<SIZES.length;i++){
(function(size){
var b=document.createElement('button');
b.className='size-btn';
b.setAttribute('data-size',size);
var d=document.createElement('span');
d.className='size-dot';
d.style.width=Math.min(size,14)+'px';
d.style.height=Math.min(size,14)+'px';
b.appendChild(d);
b.title=size+'px';
b.addEventListener('click',function(){
curSize=parseInt(this.getAttribute('data-size'),10);
var all=sizeRow.children;
for(var j=0;j<all.length;j++)all[j].className='size-btn';
this.className='size-btn active';
updateInfo();});
sizeRow.appendChild(b);
})(SIZES[i]);}
sizeRow.children[0].className='size-btn active';}

function canvasPos(e){
var rect=canvas.getBoundingClientRect();
var scaleX=canvas.width/rect.width,scaleY=canvas.height/rect.height;
var x=(e.clientX-rect.left)*scaleX,y=(e.clientY-rect.top)*scaleY;
if(x<0)x=0;if(y<0)y=0;if(x>canvas.width)x=canvas.width;if(y>canvas.height)y=canvas.height;
return {x:x,y:y};}

canvas.addEventListener('pointerdown',function(e){
e.preventDefault();
try{canvas.setPointerCapture(e.pointerId);}catch(err){}
var p=canvasPos(e);
drawing=true;lastX=p.x;lastY=p.y;
snapshot();
ctx.lineWidth=curSize;
ctx.lineCap='round';ctx.lineJoin='round';
setStatus(eraser?'橡皮擦绘制中…':'绘制中…');});
canvas.addEventListener('pointermove',function(e){
if(!drawing)return;
e.preventDefault();
var p=canvasPos(e);
ctx.strokeStyle=eraser?'#FFFFFF':curColor;
ctx.beginPath();
ctx.moveTo(lastX,lastY);
ctx.lineTo(p.x,p.y);
ctx.stroke();
lastX=p.x;lastY=p.y;});
function endStroke(e){
if(!drawing)return;
drawing=false;
setStatus('');}
canvas.addEventListener('pointerup',endStroke);
canvas.addEventListener('pointercancel',endStroke);
canvas.addEventListener('pointerleave',endStroke);

eraserBtn.addEventListener('click',function(){
eraser=!eraser;
eraserBtn.textContent=eraser?'画笔':'橡皮擦';
eraserBtn.classList.toggle('btn-primary',eraser);
eraserBtn.classList.toggle('btn-secondary',!eraser);
if(eraser){var all=swatchRow.getElementsByTagName('button');for(var j=0;j<all.length;j++)all[j].className='swatch';}
updateInfo();setStatus(eraser?'已切换为橡皮擦':'已切换为画笔');});
undoBtn.addEventListener('click',function(){
if(undoStack.length===0){setStatus('没有可撤销的操作');return;}
ctx.putImageData(undoStack.pop(),0,0);
updateInfo();setStatus('已撤销上一步');});
clearBtn.addEventListener('click',function(){
showConfirm('确定要清空画布吗？清空后无法恢复。',function(ok){
if(!ok)return;
snapshot();
fillWhite();
setStatus('画布已清空');});});
saveBtn.addEventListener('click',function(){
try{
var url=canvas.toDataURL('image/png');
var a=document.createElement('a');
a.href=url;
a.download='drawing-'+Date.now()+'.png';
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
setStatus('图片已下载');}
catch(e){setStatus('导出失败','error');}});
sizeSelect.addEventListener('change',function(){
var parts=sizeSelect.value.split(',');
resizeCanvas(parseInt(parts[0],10),parseInt(parts[1],10));
setStatus('画布已调整为 '+parts[0]+' × '+parts[1]);});

function updateInfo(){
var tool=eraser?'橡皮擦':'画笔';
modeInfo.textContent='工具：'+tool+' 颜色：'+(eraser?'—':curColor)+' 粗细：'+curSize+'px';}

resizeCanvas(800,500);
renderSwatches();
renderSizes();
updateInfo();
})();
</script></body></html>
