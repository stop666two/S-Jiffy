<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Emoji 搜索 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css"><style>
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}.emoji-item{text-align:center;padding:10px 4px;border:1px solid var(--color-border);border-radius:var(--radius-sm);cursor:pointer;font-size:28px;line-height:1;transition:all .15s}.emoji-item:hover{transform:scale(1.08);border-color:var(--color-text-primary);background:var(--color-bg-soft)}.emoji-item .label{display:block;font-size:10px;color:var(--color-text-disabled);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.category-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.pill{padding:4px 14px;border:1px solid var(--color-border);border-radius:20px;font-size:12px;cursor:pointer;background:var(--color-bg);transition:all .15s}.pill:hover,.pill.active{border-color:var(--color-text-primary);background:var(--color-text-primary);color:#fff}
.em-tabs{display:flex;gap:var(--space-1);margin-bottom:var(--space-3)}.em-tabs button{flex:1;height:44px;font-size:var(--font-size-sm);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-bg);cursor:pointer;transition:all .15s}.em-tabs button.active{background:var(--color-text-primary);color:#fff;border-color:var(--color-text-primary)}
.emoji-preview{display:flex;align-items:center;gap:12px;padding:12px 0;margin-bottom:12px;border-bottom:1px solid var(--color-border)}.emoji-preview .big{font-size:48px}.emoji-preview .label{font-size:var(--font-size-sm);color:var(--color-text-secondary)}
.re-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:var(--space-3)}.re-row .field{flex:1;min-width:100px}.re-row label{display:block;font-size:var(--font-size-sm);color:var(--color-text-secondary);margin-bottom:4px}
.emoji-display{font-size:32px;line-height:1.4;letter-spacing:8px;word-break:break-all}
</style></head><body>

      nature: ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🐤','🦆','🦅','🦉','🐺','🐗','🐴','🐝','🐛','🦋','🐌','🐞'],
      food: ['🍎','🍐','🍊','🍋','🍌','🍉','🍇','🍓','🫐','🍈','🍒','🍑','🥭','🍍','🥝','🍅','🥑','🥦','🥬','🥒','🌽','🥕','🧅','🧄','🍞','🧀','🥚','🍳','🥞','🍕'],
      activity: ['⚽','🏀','🏈','⚾','🥎','🎾','🏐','🏉','🥏','🎱','🪀','🏓','🏸','🏒','🥊','🚴','🏋️','🤸','🤺','⛷️','🏂','🏄','🚣','🏊','🤿','🧗','🧘','🎯','🎳','🎮'],
      travel: ['🏠','🏡','🏢','🏣','🏤','🏥','🏦','🏨','🏩','🏪','🏫','🏬','🏭','🏯','🏰','💒','🗼','🗽','⛪','🕌','🕍','⛩️','🕋','⛲','⛺','🌄','🌅','🏝️','🏔️','🌋'],
      objects: ['⌚','📱','💻','⌨️','🖥️','🖨️','🖱️','🖲️','🕹️','📷','📹','🔦','🔋','🪫','🔌','💡','🔦','🕯️','💎','💶','💷','💴','💵','💰','💳','🗝️','🔑','🔧','🔨','🪛'],
      符号: ['❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💕','💞','💗','💖','💘','💝','❣️','💟','☮️','✝️','☪️','🕉️','☸️','✡️','🔯','🕎','☯️','🆔','🈳','🈹','🈵']
    };
var searchInput=document.getElementById('searchInput');
var emojiGrid=document.getElementById('emojiGrid');
var pills=document.getElementById('pills');
var outputEl=document.getElementById('outputText');
var copyBtn=document.getElementById('copyBtn');
var activeCategory='';

var categories=[];
var catMap={};
for(var i=0;i<emojis.length;i++){
var cat=emojis[i][2];
if(!catMap[cat]){catMap[cat]=true;categories.push(cat);}
}

function renderPills(){
var html='<span class="pill'+(activeCategory===''?' active':'')+'" data-cat="">'+t('ui.all','全部')+'</span>';
for(var i=0;i<categories.length;i++){
html+='<span class="pill'+(activeCategory===categories[i]?' active':'')+'" data-cat="'+categories[i]+'">'+categories[i]+'</span>';
}
pills.innerHTML=html;
var allPills=pills.querySelectorAll('.pill');
for(var i=0;i<allPills.length;i++){
(function(el){
el.addEventListener('click',function(){
activeCategory=this.getAttribute('data-cat');
renderPills();
renderGrid();
});
})(allPills[i]);
}
}

function renderGrid(){
var q=searchInput.value.toLowerCase();
var html='';
var count=0;
for(var i=0;i<emojis.length;i++){
var e=emojis[i];
if(activeCategory&&e[2]!==activeCategory)continue;
if(q&&e[0].indexOf(q)===-1&&e[1].toLowerCase().indexOf(q)===-1)continue;
count++;
html+='<div class="emoji-item" data-emoji="'+e[0]+'" data-name="'+e[1]+'">'+e[0]+'<span class="label">'+e[1]+'</span></div>';
}
emojiGrid.innerHTML=html||'<div style="grid-column:1/-1;text-align:center;padding:32px;color:var(--color-text-disabled)">'+t('ui.nomatch','未找到匹配')+'</div>';
outputEl.textContent = t('ui.total','共 ')+count+ t('ui.1',' 个 Emoji');
var items=emojiGrid.querySelectorAll('.emoji-item');
for(var i=0;i<items.length;i++){
(function(el){
el.addEventListener('click',function(){
var emoji=this.getAttribute('data-emoji');
var name=this.getAttribute('data-name');
copyToClipboard(emoji,copyBtn);
setStatus(t('ui.copied','已复制 ') +emoji+' ('+name+')');
});
})(items[i]);
}
}

searchInput.addEventListener('input',renderGrid);

var tabSearch = document.getElementById('tabSearch'), tabBrowse = document.getElementById('tabBrowse'), tabRandom = document.getElementById('tabRandom');
var panelSearch = document.getElementById('panelSearch'), panelBrowse = document.getElementById('panelBrowse'), panelRandom = document.getElementById('panelRandom');
var browseInput = document.getElementById('browseInput'), browseGrid = document.getElementById('browseGrid');
var previewArea = document.getElementById('previewArea'), previewEmoji = document.getElementById('previewEmoji');
var previewName = document.getElementById('previewName'), previewCode = document.getElementById('previewCode');
var randCount = document.getElementById('randCount'), randCat = document.getElementById('randCat');
var randGenBtn = document.getElementById('randGenBtn'), randomOut = document.getElementById('randomOut');

function switchTab(which) {
  var panels = { search: panelSearch, browse: panelBrowse, random: panelRandom };
  var tabs = { search: tabSearch, browse: tabBrowse, random: tabRandom };
  for (var k in panels) {
    panels[k].style.display = (k === which) ? '' : 'none';
    tabs[k].className = (k === which) ? 'active' : '';
  }
}
tabSearch.addEventListener('click', function () { switchTab('search'); });
tabBrowse.addEventListener('click', function () { switchTab('browse'); });
tabRandom.addEventListener('click', function () { switchTab('random'); });

function renderBrowse() {
  var q = browseInput.value.toLowerCase().trim();
  var filtered = pickerData;
  if (q) {
    var keywords = q.split(/\s+/);
    filtered = pickerData.filter(function (e) {
      var text = (e.n + ' ' + e.k).toLowerCase();
      for (var ki = 0; ki < keywords.length; ki++) {
        if (text.indexOf(keywords[ki]) === -1) return false;
      }
      return true;
    });
  }
  browseGrid.innerHTML = '';
  var html = '';
  for (var i = 0; i < filtered.length; i++) {
    var e = filtered[i];
    html += '<div class="emoji-item" data-emoji="' + htmlEscape(e.e) + '" data-name="' + htmlEscape(e.n.trim()) + '" data-code="U+' + e.e.codePointAt(0).toString(16).toUpperCase() + '">' + e.e + '<span class="label">' + htmlEscape(e.n.trim()) + '</span></div>';
  }
  browseGrid.innerHTML = html || '<div style="grid-column:1/-1;text-align:center;padding:32px;color:var(--color-text-disabled)">' + t('ui.nomatchBrowse','没有找到匹配的 emoji') + '</div>';
  var items = browseGrid.querySelectorAll('.emoji-item');
  for (var j = 0; j < items.length; j++) {
    (function (el) {
      el.addEventListener('click', function () {
        var emoji = this.getAttribute('data-emoji');
        var name = this.getAttribute('data-name');
        var code = this.getAttribute('data-code');
        outputEl.textContent = emoji;
        previewArea.style.display = 'flex';
        previewEmoji.textContent = emoji;
        previewName.textContent = name;
        previewCode.textContent = code;
        setStatus(t('ui.selected','已选中: ') + emoji);
      });
    })(items[j]);
  }
}
browseInput.addEventListener('input', renderBrowse);
renderBrowse();

function generateRandom() {
  var count = parseInt(randCount.value, 10) || 1;
  if (count < 1) count = 1;
  if (count > 100) count = 100;
  randCount.value = count;
  var cat = randCat.value;
  var pool = [];
  if (cat === 'all') {
    var keys = Object.keys(reData);
    for (var k = 0; k < keys.length; k++) pool = pool.concat(reData[keys[k]]);
  } else {
    pool = reData[cat] || reData['smileys'];
  }
  var result = [];
  for (var i = 0; i < count; i++) {
    var b = new Uint8Array(1);
    crypto.getRandomValues(b);
    result.push(pool[b[0] % pool.length]);
  }
  randomOut.textContent = result.join('');
  outputEl.textContent = result.join(' ');
  setStatus(t('random.generated','已生成 ') + count + t('random.count',' 个 Emoji'));
}
randGenBtn.addEventListener('click', generateRandom);

copyBtn.addEventListener('click',function(){
  var t2 = randomOut.textContent || emojiGrid.textContent.replace(/\s+/g,' ');
  if (t2) { copyToClipboard(t2, copyBtn); setStatus(t('ui.copied','已复制')); }
});
renderPills();
renderGrid();
})();</script></body></html>
