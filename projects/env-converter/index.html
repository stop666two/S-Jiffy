<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>环境变量转换 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css">
<style>.conv-toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:var(--space-2)}.conv-toolbar select{height:48px;padding:0 var(--space-2);font-size:var(--font-size-base);border:1px solid #ddd;border-radius:var(--radius-md);outline:none;background:var(--color-bg);cursor:pointer}.edit-area{display:grid;grid-template-columns:1fr 1fr;gap:12px}textarea{font-family:var(--font-mono)!important;font-size:13px!important;line-height:1.5!important}.stat-note{font-size:13px;color:var(--color-text-secondary);margin-top:var(--space-1)}.dc-tabs{display:flex;gap:var(--space-1);margin-bottom:var(--space-3)}.dc-tabs button{flex:1;height:44px;font-size:var(--font-size-sm);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-bg);cursor:pointer;transition:all .15s}.dc-tabs button.active{background:var(--color-text-primary);color:#fff;border-color:var(--color-text-primary)}.form-grid{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:var(--space-3)}.form-grid .input{width:300px}.name-card{display:flex;justify-content:space-between;align-items:center;padding:var(--space-2);margin-bottom:8px;background:var(--color-bg-soft);border:1px solid var(--color-border);border-radius:var(--radius-md);font-family:var(--font-mono);font-size:14px;cursor:pointer;transition:all 0.1s}.name-card:hover{border-color:var(--color-text-primary)}.name-card .style-tag{font-size:11px;padding:2px 10px;border-radius:999px;background:var(--color-text-primary);color:#fff;flex-shrink:0}.name-card .val{word-break:break-all;padding-right:12px}</style></head><body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a></header>
<main class="tool-workspace"><h1 data-i18n="h1">环境变量转换</h1><p class="tool-desc" data-i18n="desc">在 .env/JSON/YAML 环境变量格式之间互转，并根据词语生成各种风格的编程变量名</p>
<div class="dc-tabs">
  <button id="tabConvert" class="active" type="button" data-i18n="ui.tabConvert">转换</button>
  <button id="tabName" type="button" data-i18n="ui.tabName">命名生成</button>
</div>
<div id="panelConvert">
  <div class="card"><div class="conv-toolbar"><select id="fromFormat"><option value="env" data-i18n="ui.1">.env 格式</option><option value="json" data-i18n="ui.2">JSON 格式</option><option value="yaml" data-i18n="ui.3">YAML 格式</option></select><span style="font-size:13px;color:var(--color-text-secondary)">→</span><select id="toFormat"><option value="json" data-i18n="ui.2">JSON 格式</option><option value="env" data-i18n="ui.1">.env 格式</option><option value="yaml" data-i18n="ui.3">YAML 格式</option></select><button id="convertBtn" class="btn btn-primary" data-i18n="ui.convert">转换</button><button id="swapBtn" class="btn btn-secondary" data-i18n="ui.4">⇄ 互换</button></div>
  <div class="edit-area"><textarea id="inputText" class="input textarea" data-i18n-placeholder="ui.102" placeholder="输入源格式" style="min-height:280px">DATABASE_URL=postgres://localhost:5432/db
API_KEY=sk-abc123
DEBUG=true
PORT=3000
NODE_ENV=production</textarea><textarea id="outputTextArea" class="input textarea" data-i18n-placeholder="ui.103" placeholder="转换结果" style="min-height:280px;background:var(--color-bg-soft)" readonly></textarea></div>
  <div id="statNote" class="stat-note"></div></div>
</div>
<div id="panelName" style="display:none;">
  <div class="card"><div class="form-grid"><input id="wordInput" class="input js-focus-input" data-i18n-placeholder="ngen.placeholder" placeholder="输入词语，空格分隔 (如 user login count)" value="user login count"><button id="genBtn" class="btn btn-primary" data-i18n="ngen.generate">生成</button></div></div>
  <div class="output-box"><div id="nameList"></div><span id="nameOutputText" style="display:none"></span></div>
</div>
<div class="output-box"><span id="outputText"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
</main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
<script>(function(){var inputText=document.getElementById('inputText'),outputTextArea=document.getElementById('outputTextArea'),fromFormat=document.getElementById('fromFormat'),toFormat=document.getElementById('toFormat'),convertBtn=document.getElementById('convertBtn'),swapBtn=document.getElementById('swapBtn'),copyBtn=document.getElementById('copyBtn'),outputText=document.getElementById('outputText'),statNote=document.getElementById('statNote');
function parseEnv(text){var vars={};var lines=text.split('\n');for(var i=0;i<lines.length;i++){var line=lines[i].trim();if(!line||line.startsWith('#'))continue;var eqIdx=line.indexOf('=');if(eqIdx===-1)continue;var key=line.slice(0,eqIdx).trim();var val=line.slice(eqIdx+1).trim();if((val.startsWith('"')&&val.endsWith('"'))||(val.startsWith("'")&&val.endsWith("'"))){val=val.slice(1,-1)}vars[key]=val}return vars}
function toEnv(obj){var lines=[];for(var key in obj){if(obj.hasOwnProperty(key)){var val=String(obj[key]);if(val.indexOf(' ')!==-1||val.indexOf('#')!==-1){val='"'+val+'"'}lines.push(key+'='+val)}}return lines.join('\n')}
function toJson(obj){return JSON.stringify(obj,null,2)}
function toYaml(obj){var lines=[];for(var key in obj){if(obj.hasOwnProperty(key)){var val=obj[key];if(typeof val==='string'&&(val.indexOf(':')!==-1||val.indexOf('#')!==-1||val==='')){val='"'+val.replace(/"/g,'\\"')+'"'}lines.push(key+': '+val)}}return lines.join('\n')}
function parseJson(text){try{var obj=JSON.parse(text);var result={};for(var key in obj){if(obj.hasOwnProperty(key)){result[key]=String(obj[key])}}return result}catch(e){return null}}
function parseYaml(text){var obj={};var lines=text.split('\n');for(var i=0;i<lines.length;i++){var line=lines[i];if(!line.trim()||line.trim().startsWith('#'))continue;var colonIdx=line.indexOf(':');if(colonIdx===-1)continue;var key=line.slice(0,colonIdx).trim();var val=line.slice(colonIdx+1).trim();if(val==='null'||val==='~')val='';if(val==='true')val='true';if(val==='false')val='false';obj[key]=val}return obj}
function convert(){var src=inputText.value;if(!src.trim()){setStatus(t('ui.100','请输入数据'),'error');return}var from=fromFormat.value;var to=toFormat.value;var obj;if(from==='env'){obj=parseEnv(src)}else if(from==='json'){obj=parseJson(src)}else if(from==='yaml'){obj=parseYaml(src)}if(!obj||Object.keys(obj).length===0){outputTextArea.value='';statNote.textContent = t('ui.8','转换失败：无法解析输入数据');setStatus(t('ui.101','转换失败'),'error');return}var result;if(to==='env'){result=toEnv(obj)}else if(to==='json'){result=toJson(obj)}else if(to==='yaml'){result=toYaml(obj)}outputTextArea.value=result;var count=Object.keys(obj).length;statNote.textContent = t('ui.7','成功转换 ')+count+ t('ui.5',' 个变量');outputText.innerHTML = t('ui.6','转换完成 | ')+count+ t('ui.5',' 个变量');setStatus(t('ui.convertDone','转换完成'))}
convertBtn.addEventListener('click',convert);swapBtn.addEventListener('click',function(){var tmp=fromFormat.value;fromFormat.value=toFormat.value;toFormat.value=tmp;convert()});
copyBtn.addEventListener('click',function(){if(outputTextArea.value){copyToClipboard(outputTextArea.value,this);setStatus(t('ui.copied','已复制'))}});

/* ============ name generator tab (merged from variable-name-gen) ============ */
var tabConvert=document.getElementById('tabConvert'),tabName=document.getElementById('tabName');
var panelConvert=document.getElementById('panelConvert'),panelName=document.getElementById('panelName');
function switchTab(which){
  if(which==='convert'){tabConvert.className='active';tabName.className='';panelConvert.style.display='';panelName.style.display='none';}
  else{tabName.className='active';tabConvert.className='';panelName.style.display='';panelConvert.style.display='none';}
}
tabConvert.addEventListener('click',function(){switchTab('convert');});
tabName.addEventListener('click',function(){switchTab('name');});

var wordInput=document.getElementById('wordInput'),genBtn=document.getElementById('genBtn'),nameList=document.getElementById('nameList'),nameOutputText=document.getElementById('nameOutputText');
var styleNames={camel:'camelCase',pascal:'PascalCase',snake:'snake_case',kebab:'kebab-case',upper:'UPPER_CASE',dot:'dot.case',screaming:'SCREAMING_SNAKE',train:'Train-Case'};
function genNames(words){
  var clean=words.replace(/[^a-zA-Z0-9\s-]/g,'').trim();
  if(!clean){var alts=['temp','value','result','data'];clean=alts[Math.floor(Math.random()*alts.length)]}
  var parts=clean.split(/[\s-]+/).filter(function(p){return p.length>0});
  if(!parts.length)parts=['temp'];
  var lowerParts=parts.map(function(p){return p.toLowerCase()});
  var capParts=parts.map(function(p){return p.charAt(0).toUpperCase()+p.slice(1).toLowerCase()});
  var upperParts=parts.map(function(p){return p.toUpperCase()});
  return[{style:'camel',val:lowerParts[0]+capParts.slice(1).join('')},{style:'pascal',val:capParts.join('')},{style:'snake',val:lowerParts.join('_')},{style:'kebab',val:lowerParts.join('-')},{style:'upper',val:upperParts.join('_')},{style:'dot',val:lowerParts.join('.')},{style:'screaming',val:upperParts.join('_')},{style:'train',val:capParts.join('-')}]
}
function renderNames(){
  var raw=wordInput.value.trim();
  if(!raw){setStatus(t('ngen.empty','请输入词语'),'error');return}
  var names=genNames(raw);
  var html='';
  for(var i=0;i<names.length;i++){
    html+='<div class="name-card" data-text="'+htmlEscape(names[i].val)+'">';
    html+='<span class="val">'+htmlEscape(names[i].val)+'</span>';
    html+='<span class="style-tag">'+styleNames[names[i].style]+'</span></div>'
  }
  nameList.innerHTML=html;
  nameOutputText.textContent=names[0].val;
  var cards=nameList.querySelectorAll('.name-card');
  for(var j=0;j<cards.length;j++){(function(card){
    card.addEventListener('click',function(){
      var text=card.getAttribute('data-text');
      copyToClipboard(text,copyBtn);
      setStatus(t('ngen.copied','已复制 ') +text)
    })
  })(cards[j])}
  setStatus(t('ngen.generated','已生成 ') +names.length+ t('ngen.count',' 个变量名'))
}
genBtn.addEventListener('click',renderNames);
wordInput.addEventListener('keydown',function(e){if(e.key==='Enter')renderNames()});
renderNames();
})();</script>
</body></html>
