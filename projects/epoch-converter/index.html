<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>时间戳转换器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css">
<style>
.conv-section{margin-bottom:var(--space-3);}
.conv-section h2{font-size:var(--font-size-base);font-weight:600;margin-bottom:var(--space-2);}
.result-line{font-size:var(--font-size-sm);margin-top:var(--space-1);font-family:var(--font-mono);word-break:break-all;}
.epoch-clock{font-size:36px;font-weight:600;font-family:var(--font-mono);text-align:center;padding:var(--space-3);background:var(--color-bg-soft);border:1px solid var(--color-border);border-radius:var(--radius-md);margin-bottom:var(--space-2);}
.epoch-clock .sub{font-size:var(--font-size-sm);font-weight:400;color:var(--color-text-secondary);}
.tz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--space-2);margin-top:var(--space-2);}
.tz-card{background:var(--color-bg-soft);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-2);}
.tz-card .tz-name{font-size:var(--font-size-xs);color:var(--color-text-secondary);}
.tz-card .tz-time{font-size:var(--font-size-base);font-weight:500;}
</style></head>
<body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
<main class="tool-workspace">
<h1 data-i18n="h1">时间戳转换</h1>
<p class="tool-desc" data-i18n="desc">Unix 时间戳与日期互转，实时时钟、年周、季度、年日。</p>
<div class="card">
<h2 data-i18n="ui.1">⏱ 实时 Epoch 时钟</h2>
<div class="epoch-clock"><div id="currentEpoch">0</div><div class="sub" id="currentMs">ms: 0</div></div>
<div class="tz-grid" id="tzGrid"></div>
</div>
<div class="card conv-section">
<h2 data-i18n="ui.2">时间戳 → 日期</h2>
<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
<input id="tsInput" class="input js-focus-input" data-i18n-placeholder="ui.100" placeholder="输入时间戳，例如 1712345678" style="width:260px;">
<select id="tsUnit" class="input" style="width:auto;"><option value="auto" data-i18n="ui.3">自动检测</option><option value="seconds" data-i18n="ui.second">秒</option><option value="milliseconds" data-i18n="ui.4">毫秒</option></select>
<button id="tsToDateBtn" class="btn btn-primary" data-i18n="ui.convert">转换</button></div>
<div id="ts结果" class="result-line"></div>
<div id="extraDateInfo" style="display:none;margin-top:var(--space-2);">
<div class="tz-card" style="display:inline-block;margin-right:8px;"><span class="tz-name" data-i18n="ui.5">年周</span><div id="weekOfYear" style="font-weight:600;">—</div></div>
<div class="tz-card" style="display:inline-block;margin-right:8px;"><span class="tz-name" data-i18n="ui.6">季度</span><div id="quarter" style="font-weight:600;">—</div></div>
<div class="tz-card" style="display:inline-block;"><span class="tz-name" data-i18n="ui.7">年日</span><div id="dayOfYear" style="font-weight:600;">—</div></div>
</div>
</div>
<div class="card conv-section">
<h2 data-i18n="ui.8">日期 → 时间戳</h2>
<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
<input id="dateInput" type="datetime-local" class="input" style="width:260px;"><button id="dateToTsBtn" class="btn btn-primary" data-i18n="ui.convert">转换</button></div>
<div id="date结果" class="result-line"></div></div>
<div class="output-box"><span id="outputText" style="display:block;padding-right:60px;"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div></main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script></script>
<script>
(function(){
  var tsInput=document.getElementById('tsInput'),ts结果=document.getElementById(t('ui.14','ts结果')),date结果=document.getElementById(t('ui.13','date结果'));
  var currentEpoch=document.getElementById('currentEpoch'),currentMs=document.getElementById('currentMs'),tzGrid=document.getElementById('tzGrid');
  var weekEl=document.getElementById('weekOfYear'),quarterEl=document.getElementById('quarter'),doyEl=document.getElementById('dayOfYear'),extraInfo=document.getElementById('extraDateInfo');
  var tzList=[{name:'UTC',zone:'UTC'},{name:'Local',zone:null},{name:'New York (EST)',zone:'America/New_York'},{name:'London (GMT)',zone:'Europe/London'},{name:'Tokyo (JST)',zone:'Asia/Tokyo'},{name:'Shanghai (CST)',zone:'Asia/Shanghai'}];

  function formatDate(d,tz){var opts={timeZone:tz||undefined,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false};return d.toLocaleString('zh-CN',opts);}

  function getWeekOfYear(d){var t=new Date(d);t.setHours(0,0,0,0);t.setDate(t.getDate()+3-(t.getDay()+6)%7);var w1=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-w1)/86400000-3+(w1.getDay()+6)%7)/7);}
  function getQuarter(d){return Math.floor(d.getMonth()/3)+1;}
  function getDayOfYear(d){var start=new Date(d.getFullYear(),0,0);return Math.floor((d-start)/86400000);}

  function updateClock(){
    var now=Date.now();currentEpoch.textContent=Math.floor(now/1000);currentMs.textContent='ms: '+now;
    var d=new Date(now);var html='';
    for(var i=0;i<tzList.length;i++){html+='<div class="tz-card"><div class="tz-name">'+tzList[i].name+'</div><div class="tz-time">'+formatDate(d,tzList[i].zone)+'</div><div class="tz-name">sec: '+Math.floor(d.getTime()/1000)+'</div></div>';}
    tzGrid.innerHTML=html;}

  function getDateFromTs(val,unit){var num=parseFloat(val);if(isNaN(num))return null;return unit==='auto'?(num>1e12?new Date(num):new Date(num*1000)):(unit==='milliseconds'?new Date(num):new Date(num*1000));}

  function parseAny(raw){
    if(raw.toLowerCase()==='now')return new Date();
    if(/^\d+$/.test(raw)){var num=parseInt(raw,10);return num<1e12?new Date(num*1000):new Date(num);}
    var d=new Date(raw);return isNaN(d.getTime())?null:d;
  }

  function relText(date){
    var now=Date.now(),diff=date.getTime()-now,abs=Math.abs(diff);
    if(abs<60000)return t('justNow','刚刚');
    if(abs<3600000){var mins=Math.round(abs/60000);return diff<0?mins+t('minAgo',' 分钟前'):t('inMin','约 ')+mins+t('minLater',' 分钟后');}
    if(abs<86400000){var hrs=Math.round(abs/3600000);return diff<0?hrs+t('hrAgo',' 小时前'):t('inHr','约 ')+hrs+t('hrLater',' 小时后');}
    var days=Math.round(abs/86400000);
    return diff<0?days+t('dayAgo',' 天前'):t('inDay','约 ')+days+t('dayLater',' 天后');
  }

  document.getElementById('tsToDateBtn').addEventListener('click',function(){
    var raw=tsInput.value.trim();if(!raw){ts结果.textContent = t('ui.12','请输入时间戳');extraInfo.style.display='none';return;}
    var d=parseAny(raw);if(!d||isNaN(d.getTime())){ts结果.textContent = t('ui.11','时间戳无效');extraInfo.style.display='none';return;}
    ts结果.textContent=formatDate(d,'Asia/Shanghai')+' (CST) | '+d.toISOString()+' (UTC)';
    ts结果.innerHTML+='<br>ISO 8601: '+d.toISOString()+'<br>UTC / RFC 2822: '+d.toUTCString()+'<br>'+t('relativeTime','相对时间')+': '+relText(d);
    weekEl.textContent=getWeekOfYear(d);quarterEl.textContent='Q'+getQuarter(d);doyEl.textContent=getDayOfYear(d);extraInfo.style.display='block';
    setStatus(t('ui.converted','已转换'));});

  document.getElementById('dateToTsBtn').addEventListener('click',function(){
    var val=dateInput.value;if(!val){date结果.textContent = t('ui.10','请选择日期/时间');return;}
    var d=new Date(val);if(isNaN(d.getTime())){date结果.textContent = t('ui.9','日期无效');return;}
    date结果.textContent='Seconds: '+Math.floor(d.getTime()/1000)+' | Milliseconds: '+d.getTime()+' | Week: '+getWeekOfYear(d)+' | Q'+getQuarter(d)+' | DOY: '+getDayOfYear(d);});

  tsInput.addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('tsToDateBtn').click();});
  updateClock();setInterval(updateClock,1000);
  document.getElementById('copyBtn').addEventListener('click',function(){if(o.textContent){copyToClipboard(o.textContent,this);setStatus(t('ui.copied','已复制'));}});
  var o=document.getElementById('outputText');
  setInterval(function(){var now=Date.now();o.textContent=Math.floor(now/1000);},1000);
})();
</script></body></html>
