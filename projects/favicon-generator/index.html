<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图标生成器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .field-row { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); flex-wrap: wrap; }
    .field-row label { width: 90px; font-size: var(--font-size-sm); color: var(--color-text-secondary); flex-shrink: 0; }
    .field-row input[type="color"] { width: 44px; height: 44px; padding: 0; border: 1px solid var(--color-border); border-radius: var(--radius-sm); cursor: pointer; background: var(--color-bg); }
    .field-row input[type="number"] { width: 80px; }
    .preview-wrap { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-2); flex-wrap: wrap; }
    .preview-canvas { width: 128px; height: 128px; border: 1px dashed var(--color-border); border-radius: var(--radius-md); background: var(--color-bg-soft); }
    .code-block { margin: 0; font-family: inherit; font-size: var(--font-size-sm); white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">图标生成器</h1>
    <p class="tool-desc" data-i18n="desc">输入文字或 Emoji，自定义背景色、文字色与圆角，实时预览并生成 SVG 图标代码。</p>
    <div class="card">
      <div class="preview-wrap">
        <canvas id="previewCanvas" class="preview-canvas" width="128" height="128"></canvas>
        <span style="font-size:var(--font-size-sm);color:var(--color-text-secondary);" data-i18n="ui.1">128×128 · 实时预览</span>
      </div>
      <div class="field-row">
        <label data-i18n="ui.2">文字 / Emoji</label>
        <input id="textInput" class="input js-focus-input" type="text" placeholder="例如：S 或 🚀" maxlength="8" style="max-width:280px">
      </div>
      <div class="field-row">
        <label data-i18n="ui.bgColor">背景色</label>
        <input id="bgColorInput" type="color" value="#111111">
        <label data-i18n="ui.3">文字色</label>
        <input id="fgColorInput" type="color" value="#ffffff">
        <label data-i18n="ui.4">圆角</label>
        <input id="radiusInput" class="input" type="number" value="20" min="0" max="50" step="1">
        <span style="font-size:var(--font-size-sm);color:var(--color-text-secondary);">%</span>
      </div>
    </div>
    <div id="resultBox" class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script></script>
<script src="../../assets/js/custom-controls.js"></script>
  <script>
    (function () {
      var SIZE = 128;
      var canvas = document.getElementById('previewCanvas');
      var ctx = canvas.getContext('2d');
      var textInput = document.getElementById('textInput');
      var bgInput = document.getElementById('bgColorInput');
      var fgInput = document.getElementById('fgColorInput');
      var radiusInput = document.getElementById('radiusInput');
      var outputText = document.getElementById('outputText');
      var currentCode = '';

      function roundedRect(c, x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        c.beginPath();
        c.moveTo(x + r, y);
        c.lineTo(x + w - r, y);
        c.arcTo(x + w, y, x + w, y + r, r);
        c.lineTo(x + w, y + h - r);
        c.arcTo(x + w, y + h, x + w - r, y + h, r);
        c.lineTo(x + r, y + h);
        c.arcTo(x, y + h, x, y + h - r, r);
        c.lineTo(x, y + r);
        c.arcTo(x, y, x + r, y, r);
        c.closePath();
      }

      function render() {
        var text = textInput.value.trim();
        if (!text) {
          ctx.clearRect(0, 0, SIZE, SIZE);
          outputText.textContent = '';
          currentCode = '';
          setStatus('');
          return;
        }
        var bg = bgInput.value;
        var fg = fgInput.value;
        var radius = parseFloat(radiusInput.value);
        if (!isFinite(radius) || radius < 0) radius = 0;
        if (radius > 50) radius = 50;
        var rx = Math.round(radius * SIZE / 100);
        var fs = Math.min(64, Math.floor(120 / text.length));
        if (fs < 16) fs = 16;
        ctx.clearRect(0, 0, SIZE, SIZE);
        roundedRect(ctx, 1, 1, SIZE - 2, SIZE - 2, Math.max(rx - 1, 0));
        ctx.fillStyle = bg;
        ctx.fill();
        ctx.font = 'bold ' + fs + 'px Arial, sans-serif';
        ctx.fillStyle = fg;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, SIZE / 2, SIZE / 2 + 2);
        currentCode = '<svg xmlns="http://www.w3.org/2000/svg" width="' + SIZE + '" height="' + SIZE + '" viewBox="0 0 ' + SIZE + ' ' + SIZE + '">\n' +
          '  <rect x="1" y="1" width="' + (SIZE - 2) + '" height="' + (SIZE - 2) + '" rx="' + rx + '" fill="' + bg + '"/>\n' +
          '  <text x="64" y="66" font-size="' + fs + '" font-family="Arial, sans-serif" font-weight="bold" fill="' + fg + '" text-anchor="middle" dominant-baseline="central">' + htmlEscape(text) + '</text>\n' +
          '</svg>';
        outputText.innerHTML = '<pre class="code-block">' + htmlEscape(currentCode) + '</pre>';
        setStatus(t('ui.6','已生成 SVG 图标代码'));
      }

      textInput.addEventListener('input', render);
      bgInput.addEventListener('input', render);
      fgInput.addEventListener('input', render);
      radiusInput.addEventListener('input', render);
      document.getElementById('copyBtn').addEventListener('click', function () {
        if (!currentCode) return;
        copyToClipboard(currentCode, this);
        setStatus(t('ui.5','已复制 SVG 代码'));
      });
      render();
    })();
  </script>
</body>
</html>
