<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
.logo-text { font-size: var(--font-size-lg); font-weight: 600; }
.draw-card { text-align: center; }
.draw-tip { max-width: 540px; margin: 0 auto var(--space-3); font-size: var(--font-size-sm); color: var(--color-text-secondary); line-height: 1.7; }
.qian-stage { position: relative; width: 120px; height: 230px; margin: 0 auto var(--space-3); }
.qian-tube { position: absolute; left: 50%; bottom: 0; width: 92px; height: 170px; margin-left: -46px; border: 1px solid #5E2018; border-radius: 10px 10px 16px 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.22); z-index: 0; }
.qian-tube::before { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 9px 9px 15px 15px; background: linear-gradient(180deg, #B3442F, #A03224 30%, #8A2B1E 70%, #7C2418); }
.qian-tube::after { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 24px; border-radius: 9px 9px 0 0; background: linear-gradient(180deg, #C0533C, #A93824); box-shadow: inset 0 -4px 6px rgba(0,0,0,0.25), inset 0 2px 3px rgba(255,255,255,0.18); }
.qian-slip { position: absolute; left: 50%; bottom: 20px; width: 56px; height: 96px; margin-left: -28px; z-index: -1; background: repeating-linear-gradient(90deg, transparent 0 26px, rgba(0,0,0,0.05) 26px 27px), linear-gradient(180deg, #FDF9EF, #F6EDD8); border: 1px solid #D8C79F; border-radius: 5px; }
.qian-slip::after { content: "签"; position: absolute; top: 14px; left: 0; right: 0; text-align: center; font-size: 30px; color: #8A4A1F; font-weight: 600; }
.qian-stage.drawing { animation: stageWiggle 2.6s ease-in-out both; }
.qian-stage.drawing .qian-slip { animation: slipRise 2.6s ease-in-out both; }
.qian-stage.drawing .qian-tube::after { animation: lipPulse 0.45s ease-in-out infinite alternate; }
.qian-stage.drawn .qian-slip { animation: slipOut 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
.qian-stage.drawn .qian-slip::after { content: "✓"; color: #346538; }
@keyframes stageWiggle {
  0% { transform: rotate(0deg) translateY(0); }
  10% { transform: rotate(-5deg) translateY(-4px); }
  20% { transform: rotate(4deg) translateY(-9px); }
  35% { transform: rotate(-4deg) translateY(-13px); }
  50% { transform: rotate(5deg) translateY(-11px); }
  65% { transform: rotate(-3deg) translateY(-7px); }
  80% { transform: rotate(2deg) translateY(-3px); }
  100% { transform: rotate(0deg) translateY(0); }
}
@keyframes slipRise {
  0% { bottom: 20px; }
  12% { bottom: 84px; }
  24% { bottom: 24px; }
  36% { bottom: 96px; }
  48% { bottom: 26px; }
  60% { bottom: 106px; }
  72% { bottom: 28px; }
  84% { bottom: 114px; }
  100% { bottom: 118px; }
}
@keyframes slipOut {
  0% { bottom: 118px; opacity: 1; }
  100% { bottom: 132px; opacity: 1; }
}
@keyframes lipPulse { from { opacity: 1; } to { opacity: 0.55; } }
.result-head { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); flex-wrap: wrap; }
.qian-no { font-size: 28px; font-weight: 700; line-height: 1.2; }
.qian-name { font-size: 15px; color: var(--color-text-secondary); font-weight: 600; }
.ji-badge { display: inline-block; padding: 2px 10px; border-radius: 9999px; border: 1px solid; font-size: var(--font-size-sm); }
.jl-up { color: #2E5B31; background: #E9F1E9; border-color: #C4D8C6; }
.jl-mid { color: #8A5B00; background: #F7EFDF; border-color: #E6D5AC; }
.jl-down { color: #98302E; background: #F7E8E7; border-color: #E4C6C4; }
.qian-poem { font-size: 17px; line-height: 2; margin-bottom: var(--space-2); }
.qian-jie { font-size: var(--font-size-sm); color: var(--color-text-secondary); line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
.qian-extra-line { font-size: var(--font-size-sm); color: var(--color-text-secondary); line-height: 1.8; white-space: pre-wrap; word-break: break-word; margin-top: var(--space-1); }
.result-actions { display: flex; gap: var(--space-2); margin-top: var(--space-3); flex-wrap: wrap; }
.result-card.show { animation: fadeUp 0.45s ease-out; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.all-actions { display: flex; gap: var(--space-2); margin-bottom: var(--space-2); }
.all-list { display: none; }
.all-row { border: 1px solid var(--color-border); border-radius: var(--radius-md); margin-bottom: 8px; overflow: hidden; }
.all-head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--color-bg); border: none; cursor: pointer; font-family: var(--font-mono); font-size: 14px; color: var(--color-text-primary); text-align: left; }
.all-head:hover { background: var(--color-bg-soft); }
.all-head::after { content: "▸"; margin-left: auto; color: var(--color-text-secondary); }
.all-row.open .all-head::after { content: "▾"; }
.all-no { flex-shrink: 0; font-weight: 600; }
.all-poem { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--color-text-secondary); font-size: var(--font-size-sm); }
.all-body { display: none; padding: 12px 14px; border-top: 1px dashed var(--color-border); background: var(--color-bg-soft); font-size: var(--font-size-sm); line-height: 1.8; color: var(--color-text-secondary); white-space: pre-wrap; word-break: break-word; }
.all-row.open .all-body { display: block; }
.all-poem-full { color: var(--color-text-primary); margin-bottom: 6px; }
.all-jie { margin-top: 4px; }
.tool-note { margin-top: var(--space-4); font-size: var(--font-size-xs); color: var(--color-text-disabled); text-align: center; }
footer.tool-status { padding: var(--space-2) var(--space-3); border-top: 1px solid var(--color-border); }
  </style>
</head>

    <p class="tool-note" data-i18n="ui.2">本工具数据源自公开传统文化资料，仅供娱乐参考。</p>

  <script>
(function () {
  var CFG = {"name":"佛祖灵签","noLabel":"第 ","noSuffix":" 签","nameField":"qianyu","jiField":"ji","poemField":"","poemLabel":"签文","jieField":"jie","jieLabel":"解签","extra":[]};
  var QIAN = [{"n":1,"qianyu":"宋太祖登基","ji":"上上","jie":"飞龙变化吉胜无疑之兆。生肖：猴","jieyue":"家宅：三阳交泰转洪钓，瑞气盈门百事新，岁秽时丰财禄旺，又添人口许亲，吉宅人口之卦可得喜气，但防夏月疾难是非涉财火厄，皆因厝前受杀冲伤，向佛祖令旗安门上祭化又嫌水道不美，有利宜修整，则居住平安。岁君：飞龙变化喜逢时，此日升腾果遂期，某望求财皆得利，求官进职更无疑。生意：春月生意欲失财，夏月财利丝丝来，待到秋冬两季节，壮胆经营利路开，五、八、十一月返利可得厚财。谋望：冲霄志气上心头，君子安宁久困穷，岁稔时丰财禄旺，万人头上逞英雄，谋事初时有阻隔，心虽思成，但不随意宜用心窍刻苦谋之，无急迫到底可成也。婚姻：世间天理定婚姻，天配如何误世人，人若自知天理合，何须着意问天神，婚姻成之，是天配良缘，不用问神自能情投意和，白头皆老。出外：一事初有阻隔，但须立胆智交三、五、八月往外有贵人扶助名利双全。开铺：开铺签文叶吉，各事宜小心，可以成功，君若才能高超于五、八、十一月起可得厚财也。合伙：之伙多人多福，各人宜同心同德协力，刻苦经营可得厚财利也。求财：正财初时有些跋涉，宜立胆志向前交三、五、八月返运可得大财利，偏财须大胆谨慎，忍口舌则得之。"},{"n":2,"qianyu":"薛仁贵困白虎关","ji":"中下","jie":"虎鹰相克，循而复吉之兆。生肖：羊","jieyue":"家宅：久淹漏屋欲更新，怎奈伊家欠福神，不但忧惊并怪梦，更添人口及阴人，吉宅人口有喜可得，但防四，七，九月灾疾是非失财，向佛祖保佑平安，外嫌祖山不顺，内是灶君不美，有利宜修整，先人伯叔祖香灯查明奉拜。岁君：虎出山林惊动民，乡民见了却忧疑，虽然不是伤人物，亦是虚惊事可知。生意：白虎凶星当头开，要防阻失惊险来,正材可取偏财失，求神保佑能得财，白虎星当头恐防小人波累，三 ，六，九月阻隔，宜细心防避，从正道财得可安。谋望：不凭天理强支持，妄做胡为岂可基，君子虽贫终身道，莫教失计受人欺，混杂谋事，不凭天理，定生是非口舌，若要事成宜从正道，以免是非。婚姻：自观相见好容仪，谁想中间一点非，不是婚姻休作对，不如撤手且由伊，婚姻有阻隔，对方虽为美丽,当非是百年姻缘，不可强行成婚恐生是非。出外：--开铺：卜开铺之卦应防小人累劫，惊阻凡事宜小心注意，宜请佛祖令旗安门上化吉保平安。合伙：之卦有利可得，但不宜贪心偏心，应忍口舌则免亏本散伙。求财：正财库取利，恐防小人耗劫宜从正道经营，谨慎工作，切勿与人代耽银项，则财得之安稳偏财不可取，取之危险。"},{"n":3,"qianyu":"孟日红寻夫","ji":"大吉","jie":"如鱼化龙灾去终之兆。生肖：马","jieyue":"家宅：莫忧家宅久淹连，天理于人岂有偏，若是从今更改过，管教财谷胜当年，吉宅人口之卦可得喜气，但数年以来财丁阻失，是门庭水道以及灶君不美，宜修通水道，使之合课做过新灶君，则居住财丁昌盛也。岁君：否极从今喜泰来，龙泉磨拂旧尘埃，暮然守旧无他事，闭门深居也获财。生意：有虚无实表皮红，恰似锦被盖鸡笼，幸有福力相扶助，秋冬时节利享通，生意初时有虚无实，面好看内部空交，五、八、十一月返运，可得厚利也。谋望：几年踪迹在江湖，名利无成困路途，今日相逢官贵力，好番春色满皇都，谋事初时有阻隔而且有虚无实，宜立胆智到底有贵人扶助定可成功。婚姻：有缘造物自安排，休叹无缘事不谐，此际好听琴瑟调，莫教夜漏滴空谐，婚姻成之但应从速说合，迟恐有变恐守空房无缘也。出外：一事叶吉但谦心意未定，应有胆敢往于五、八、十一月贵人扶助，各事平安。开铺：之卦为灾去终吉之兆，应小心大量，防止意外事故，初有小利，到底大利也。合伙：之卦可以成功，宜同心协力和气相处，忍口舌可保平安大吉。求财：正财库取利波阻已过，凡事业宜立志经营，候交八、十一月有贵人扶助，可得财利入手偏财初有阻，秋后可得。"},{"n":4,"qianyu":"黄巢出寨","ji":"中平","jie":"花木遭风，借风得舟之兆。生肖：蛇","jieyue":"家宅：无由闲事费支持，枉用贪心不可欺，金产损伤有少失，更防人口有微疲，《吉宅人口之卦可得喜气但防产妇月内惊阻有防三、六、九月灾疾是非失财之厄，皆因门轻重畔，埕口水字不美有利各宜修整则财丁可旺。岁君：劳心费力欲成功，待到花开一阵风，多谢东风轻借力，望东别有一枝红。生意：生意交易欲认真，偏财莫取正财伸，四七九月经营好，买卖求财遂君心，生意取利仍嫌有盒无剑既是空有交易宜谨慎，用苦心智谋秋后有财利。谋望：用尽心机事不成，如今休要问前程，金乌直待震坤日，自然荣显名利成，谋事初时有阻隔不能成功，但应耐心谋之于四，七月有贵人扶助名利双成。婚姻：婚姻到日不须寻，何必区区枉用心，有意种花花不发，无心插柳柳成荫，姻缘在远方成之大吉，若是近处男女两方经常见面的恐难成也。出外：之卦美中不足，恐防有些阻隔，若真心敢往于四，七月便可得到成就。开铺：若是老铺宜守旧经营，若是新创建未开张铺宅恐有不妙之处，勿开为好。合伙：合伙不成，合之不利，因为伙计间有败运者，不要合伙反而安稳大吉也。求财：正财库取利虽有得，恐有阻隔财不住手，应立志经营于四、七、九月一派大好有财利可得，偏财切不可取。"},{"n":5,"qianyu":"苏东坡游江","ji":"大吉","jie":"顺水行舟心动意和之兆。生肖：龙","jieyue":"家宅：门庭兴旺福神多，人虽无灾百事和，春夏宜防官灾疾，秋冬财物满庭稼，喜气盈门，但防春夏月小疾，及火星之厄，早晚火烛小心，是厝内土神愿和久年香火神恩过旺宜安谢土地神恩则财丁昌盛。岁君：舟行风顺去无虑，利涉江湖正遇时，万里程途只可到，所谋遂意事如期。生意：生意兴隆财利开，河有桥来天有阶，五洲四海皆可往，有勇有智有厚利，卜生意道路四通八达，与人交易不可乱猜，宜立智，五、八、十一月可得厚财利。谋望：欲求动止莫怀疑，名利相寻勿待迟，但得便中须速起，休教叹过运中时，做事内心不要乱怀疑要有胆智，灵活谋之交秋后有贵人扶助定可成功。婚姻：婚姻到日不须寻，何必区区枉用心，两边相许无他事，正好乘时射雀屏，婚姻成就百说百合，小登科已到在吉顺也，要借此时运托人说亲也。出外：一事时令当权，凡事勿猜测，大胆前往有贵人重重可得成就。开铺：之卦叶吉，但交易宜谨慎，应防人不仁，有贵人扶助财利兴隆。合伙：之卦叶吉，合之可成，但伙计应同心同德协力经营，有大财利可得。求财：正财库取利宜立智经宜，创举宜占先有贵人扶助可得厚财利，偏财取之恐有失，宜和人家合伙移他人之福也。"},{"n":6,"qianyu":"王昭君和番","ji":"中下","jie":"如鸟失群，称心不遂之兆。生肖：兔","jieyue":"家宅：只望今年百事昌，谁知自小惹祸殃，如今喜得人才好，重把家神炷愿香，《吉宅人口之卦恐防夏月疾难,口舌破财,求佛祖保平安，皆因先人失记小童香灯，应查明安拜，灶位不旺宜做新灶，则居住财丁兴旺。岁君：鸳鸯阻隔两分飞，谋望求财未遇时，守旧却宜休改革，如今进退两迟疑。生意：生意阻滞防有恒，春夏利少勤经营，秋冬两季相交接，千年古树枝又生，生意似鸬鹚限定，上春财喜稀少防阻隔勿执辟，宜见利取，水上生意秋好。谋望：名利从来不易求，茫茫世事水中鸥，天公不任人贫穷，致使白头空浮云，谋事有些阻隔，做事却不可执僻，宜用心窍，补贴些小利事自能成也。婚姻：不将年命合相同，勉强求成岂利通，从然有缘成一处，终须离别分东西，婚姻不成年命不同，勉强求亲虽得成功，终日也要离别，各分东西。出外：之卦恐防称意不遂，有小人寄祸宜守旧经营则免生愁。开铺：之卦未开，勿开或冬尾开之，已开之铺应防火盗，欠账口舌，宜立财帛星君奉拜冬尾有财利。合伙：之卦不成，因伙计三人四心，言行不一致勿合平安也。求财：正财库取财恐是称意不遂，有财利但是聚手经营，宜见利取利，不可贪也偏财恐失切不可取也。"},{"n":7,"qianyu":"韩信得志","ji":"中平","jie":"枯木逢春，暗中有喜之兆。生肖：虎","jieyue":"家宅：淹滞消除正夸？，福神明点照君家，从今莫听闲人说，树正何愁月影斜，吉宅喜气盈门，但防小孩生端 祸非而分家，主事人勿听妇女人言，宜从正气公正理，则家道可圆，埕口水道不美要修通，厝前受杀求令旗安门。岁君：枯木逢春色欲华，愿交树长发萌芽，时人莫把为柴砍，自待春来又发花。生意：春夏生意交易稀，秋冬运开有财利，偏财阻失不可取，正道经营防口舌，生意经营时令合局,宜刻苦维持经营交三、五、八月生意兴隆，有大财利可得。谋望：人在山中待好音，君人拨探说知音，如今借得东风力，万里扬帆渐转身，谋事可成但初谋之有小人阻隔，待三、五八月有贵人扶助，到底可以成功。婚姻：几年久坐少人招，今日枯枝长嫩条，自是有缘千里合，无缘对面路迢迢，婚姻成之佳人出在远方，有缘千里能相会，若是近方的恐是对面不相逢。出外：一事时令当权凡事勿猜测大胆往前有贵人重重，可得成就！开铺：之卦应防小人口舌，防人不仁宜请招财得君镇宅，求佛祖令旗安门上祭化平安。合伙：之卦大吉，合之可成，但伙计应同心同德协力经营，有大财利可得。求财：正财库取财除时利薄，宜刻苦经营立功志维持交二、五、十一月有厚利可取，偏财切不可取之，取之定失。"},{"n":8,"qianyu":"韩文公冻雪","ji":"下下","jie":"破船上滩破船上滩之兆。生肖：牛","jieyue":"家宅：不能安分每奔波，惹得家中祸事多，春夏可忧人口病，秋冬又忙损田禾，吉宅人口连年灾疾，口舌失财，向佛祖相保平安，皆因失祀祖上香火应查明奉祀并做过新灶位，埕口水道宜修通，则居住财丁兴旺。岁君：因见渔舟上逆滩，渔舟上岸且盘桓，前滩过了为闲事，惟有后滩过更难。生意：破船上滩险其中，生意经营有劫凶，来往交易须谨慎，智慧谋取利兴隆，生意经营似破船上滩，财利跋涉，防小人阻隔累害，宜谨慎用智悲谋取利。谋望：命里无时莫强求，何须日夜泛渔舟，红鳞已在秋江上，用尽心机不上钩，谋呈要托别人福，春夏谋之不成，要待交秋月圆，托人帮助为便可成。婚姻：旁人只说俩相当，难测胸怀损虎狼，口好不如心内好，不如独枕卧藤床，婚姻不可成就，因为小人语言不够真实，胸怀似虎狼不可相信。出外：之卦时令不通，恐防小人累害，生端寄祸，宜守旧则免生愁。开铺：之卦不吉，恐伙计不同心，有不美之事发生，勿合平安也。合伙：--求财：正财库取利正如镜内之银，看得见取不着，但宜立志气用谋之可得微利，偏财勿取之。"},{"n":9,"qianyu":"四太子伐中原","ji":"中平","jie":"兰菊芬菲时秋晚节之兆。生肖：鼠","jieyue":"家宅：只望家和万事成，年来愁闷未曾伸，因何不把家神敬，门户无人有响声，吉宅人口可得喜气，家欲合气万事可成，但防夏月疾难祸非涉财，向佛祖保平安，又嫌门轻重畔，灶位不美各宜修整，祖上香灯要拜到则安。岁君：芳兰春景真堪爱，菊吐秋光色又佳，乾坤各自惟消息，不假春风次第开。生意：春夏时运还未通，生意平平利轻松，货物留下秋东卖，时到运开利倍浓，生意虽有利可得，但防夏月阻隔，交秋后有贵人扶助，似兰菊芳芬得后利。谋望：昔年许汝到春来，岂料经营意不谐，且待菊梅开结日，依然名利两成材，卜谋事成，但须切防口舌候四、五月谋之并托人帮助，交秋冬时便可成功。婚姻：婚欲成时待月圆，不须心下意悬悬，虽然好段婚缘事，怎奈他人尚未坚，婚姻成之，但初时人心还未坚，不要急迫，候待月圆便可说合下出聘也。出外：一事要有胆气坚定前往，于二、四月有贵人扶助，可得名利双全。开铺：宜从正道，应防歹人劫物，铺勿离人，财勿露眼，请佛祖令旗安门上平安。合伙：之卦有利，但伙计宜忠直，勿贪心凡事，要能同心协力，要忍口舌秋后可得顺利。求财：正财库取利夏月利少，但宜刻苦维持交九、十月起返运财源广进可得厚利，偏财有利可得，但切不得外涉消息。"},{"n":10,"qianyu":"甘罗十二为丞相","ji":"中下","jie":"滤而即行之兆。生肖：猪","jieyue":"家宅：今年田蚕半吉祥，夏秋又恐损牛羊，冬深人口宜祷福，更防凶人跳矮墙，吉宅人口虽有喜气，但防夏月,疾难口舌，失财贼厄，肖牛者防生痛疾，向佛祖保平安，皆因厝前受水冲伤，求佛祖令旗安门上祭化则平安。岁君：不论平地与山尖，无限风光总被占，采得百花成蜜后，到头辛苦为谁甜。生意：今年生意欲认真，慎防盗贼劫财金，夏月莫挂人家账，秋到求财天有心，生意虽有财利可得，但恐小人,劫货，交易宜谨慎见利取利，则财利吉也。谋望：托人去干心中事，口好如何心不好，早早回头归故里，痴只常惯受灾残，卜谋事须防歹人阻隔，拐骗或抢劫财帛，宜谨慎应防人不仁，勿往外谋之。婚姻：野草闲花迷更乱，一朝乐极更生悲，虑心直待姻缘到，莫听旁人说是非，不可轻信媒人话，是闲花野草也切不可取之，若取之欢乐一时有祸也。出外：卜出外之卦，一事要有胆气坚定前往于二、四月有贵人扶助可得名利双全。开铺：之卦应防盗贼之厄，应防小人诱劫财物，铺门有杀，宜请佛祖符令安门上保平安。合伙：不成，三人四窍伙计不同心，财物恐有走漏，勿合为宜，合之有祸无利也！求财：正财库取财虽有得，但恐防小人负累，勿信直中直，须防仁不仁，宜从正道经营，偏财失之不可取，肖牛、羊者失更大。"},{"n":11,"qianyu":"武吉卖柴","ji":"大吉","jie":"如日之升，久病逢医之兆。生肖：狗","jieyue":"家宅：家旺人兴百事宜，田蚕加倍在秋期，但防阴人生疾病，见喜消灾事可知，吉宅人口可得喜气，但防疾难口舌涉财，是厝内有神恩土德，宜择日改谢清楚，又嫌祖山不顺有利宜修整壮旺，可得财丁兴旺。岁君：囚人出狱公事休，却买甜瓜上酒楼，偶遇故人同畅饮，酒钱不了义相绕。生意：灾过运来得意开，上年赫神恩要还，春夏应防风雨阻，秋冬时节财利来，生意初时利薄又防阻隔，交易宜从正道勿贪心妄取六、八、十一月有贵人可得厚财。谋望：沉迷踪迹未享通，今日承恩谢苍穹，改正前非行大道，自然财禄渐兴隆，谋事前有阻隔，是无先许向神恩，今欲重谋必先改谢神恩交秋后谋定成之。婚姻：前级配偶是今生，莫为资财重与轻，自有贵人扶持处，手攀丹桂上蟾宫，婚姻是前缘配偶，不要计较资财轻重，自有贵人扶持定能成之。出外：一事可大胆往前，凡事勿疑于二、三、五月一派好运自有贵人名利成就。开铺：之卦宜先改谢前年神恩，十一月应防劫厄，上春有阻勿灰心，秋后可得利。合伙：经营必先改谢神恩，伙计之间必须同心同德，言行一致，六、八、十一月可得财利。求财：正财初时利薄，应求神后无谢神应当天改谢之宜正道经营交六、八、十二月地派兴旺重倍偏财勿取。"},{"n":12,"qianyu":"襄王幢子","ji":"中下","jie":"扬花遭风小船出海之兆。生肖：鸡","jieyue":"家宅：路险身衰暮夜归，谨防失足暗中非，家中小口遭灾祸，六甲田蚕也不亏，吉宅人口虽有喜气，但防冲也，还防夏秋口舌失财贼厄，门户小心田蚕有损皆因厝前受杀冲伤，宜求佛祖令旗安门上祭化，居住财丁兴旺。岁君：扬花风卷消息将，恰似襄王忆梦来，夜静更残风力猛，乱飘零落洒莓苔。生意：山高路险有阻坑，生意财利微些些，若是犬吠厚利得，藏货秋冬财利生，生意经营恐有风波阻挡，宜受旧业谨慎经营，九月起可得财，肖犬者得厚财。谋望：欲想前时勉强财，扪心自问尔应灾，君要安为非理事，不招祸至祸自来，谋事恐防是非失财凡事宜从正道，候四，九月时萧犬者谋定成之，余人勿谋。婚姻：未有姻缘不主张，两家命里不相同，媒人只说瞒人话，媒得成来也不长，姻缘未有，命里不相同劝君切莫听媒人话，若是暂时谋之也不长久。出外：一事如小船出海之兆，恐防小人生端寄祸，宜从正道小心经营免生愁。开铺：之卦宜从正直经营，忍口舌不得招灾惹祸，有小利可得，肖犬得厚财利。合伙：之卦似扬花遭风，恐伙计不同心合之亏本破财。求财：正财库运未至宜守旧经营，防小人阻隔交九月起渐渐好转，有财利可得，偏财勿取若取之取恐防要失也。"},{"n":13,"qianyu":"吕蒙政两世姻缘","ji":"大吉","jie":"万物逢春，脱衣换锦。生肖：猴","jieyue":"家宅：今年不似去年贫，财禄重添遇贵宾，人口完成无盗贼，平安赛过九洲人，喜气洋洋，但防疾难口舌失 财盗贼之厄，门户小心皆因祖山不顺，有利宜修整合课，向佛祖保平安，并求福灯吊门上化吉，则财丁可兴旺也。岁君：开花结果喜逢时，赖得天官造化机，谋望求财皆遂意，衣锦还乡事可期。生意：市场货物能购收，精心保管把货留，莫怕初时有阻败，秋至价高利倍售！生意之卦初时财利稀少，但与人交易宜立志坚持候五、九、十一月可得厚财利。谋望：玉体冰肌不可移，真心之有寒岁知，如今喜得阳和日，花落自然中满枝，谋事有贵人扶助，交秋月可定就，但不能三心二意应一心一意，认真谋之。婚姻：郎才女貌世间稀，前缘配定不须疑，如今但愿他人准，好把聘财去定期，郎才女貌前缘配定，美满婚 姻应及早托人前往说定，定期上聘勿失良机。出外：一事名事亨通有贵人扶助，应于三、五、九月往外定有厚财利可得。开铺：之卦宜秋后开业，可一帆风顺得财利，若春夏月开业，宜请佛祖符令贴门上化吉也。合伙：之卦大吉，伙计宜同心同德协力经营，候交秋冬月可得大财利也。求财：正财上半年稀少宜守旧刻苦经营，交五、六、十一月财利亨通，可得厚财大利，偏财初有阻隔后可得，但切须忍口舌。"},{"n":14,"qianyu":"夏得海投文","ji":"中平","jie":"龙蛇混杂，谋望时代。生肖：羊","jieyue":"家宅：不宗香火不收身，未开家门伏祀神，若要财兴人口旺，除非安谢久家神，吉宅人口可得喜气，但防三、四月疾难口舌，祸非失财皆因失祀祖上香灯，嫌灶君不旺，安祀祖上香灯，重做新灶向佛祖保财丁兴旺。岁君：龙蛇混杂最难分，未得风雷变化麟，一日腾云归北海，那时方得见龙津。生意：生意欲做有偏财，购货恐防假不知，货物不可多留久，守旧经营利路开，生意欲做要守旧经营，防三、四月小人拐骗累害，交易欲认真谨慎秋后可得财利。谋望：两头事务尚蹉跎，见好因循本分过，自谋得来不长久，眼前求得也清磨，卜谋事初时有阻隔，宜用劳力心处理之可以成功，但恐不久向神明保佑也。婚姻：婚姻不与众人知，失却伦常邂逅迟，若不被人强占害，亦遭官府受鞭苔，婚姻不成恐被人占害，若成这 恐不合或合之不久，且惹是非也。出外：一事龙蛇混杂内中有事物阻隔，做事勿三心二意，宜守旧经营则安然。开铺：之卦宜守旧经营，防歹人拐骗，以假弄真购买货物谨慎，秋后有财利也。合伙：之卦似龙蛇混杂之兆，恐伙计不同心口舌是非多，勿合免失财利也。求财：正财虽是有得但不安稳，恐阻失宜立志刻苦经营，秋后有财利可得，偏财可取但应忍口舌。"},{"n":15,"qianyu":"诸葛亮出身","ji":"大吉","jie":"旭日东升，谋为果决之兆。生肖：马","jieyue":"家宅：保得自家莫取钱，好香烧炷谢苍天，田蚕六畜皆兴旺，受佛今年胜旧年，吉宅人口可得喜气，但防三、四月口舌涉财，主事人不义之财勿取宜虔诚当天改谢神恩，请佛祖福灯安吊门上祭化之后居住财丁兴隆也。岁君：月满今霄离海边，时人感仰赖青天，清光照耀难星退，君子求谋便得官。生意：春夏财利虽有亏，明智壮大购货归，收购货物仓中放，秋冬出售利非微，生意之卦如龙蛇混杂，恐三、四月有阻隔应谨慎，有贵人扶助五、八、十一月有厚利。谋望：此身相逢更遇邀，龙蛇天外拔迢迢，平生伴你营随意，云有天梯水有路，谋事定成但有些口些舌无妨,宜立智前进有贵人扶助可得名利双成。婚姻：前生注定是姻缘，好貌才郎登对年，要虔事心酬天地，管教夫妻两团圆，前生注定男才女貌俩相配，宜诚心配偶先谢天地，夫妻可得百年皆老。出外：一事时运当权，谋事应有胆量任其向往，有贵人扶助可卜名利双全。开铺：上春恐有阻隔小利，候秋冬月生意兴隆，有贵人扶助源广进。合伙：大吉有财利可得，但防歹人破坏，忍口舌伙计应同心协力经营顺昌也。求财：正财取之有得，但恐防三、四月阻隔，应果决进前交五、八、十一月有厚利入手，偏财有小人恐有官非破财，到底平安也。"},{"n":16,"qianyu":"关公秉烛待旦","ji":"下下","jie":"重囚望赦，浊油点灯。生肖：蛇","jieyue":"家宅：只因不肯敬神明，惹得家中事不宁，今岁若除灾与难，除非重整久家声，吉宅人口可得喜气，但防四、九、十月祸非疾难失财，肖猪狗之人恐惹祸非，宜安份守已，向佛祖奉经拜祖上香灯，做过新灶居住，财丁兴旺兴。岁君：浊油点灯灯自灭，方才剔起又垂微，长心烧书空劳力，何不将身忙自归。生意：何必次次费心机，用尽苦力财力稀，口舌欲任偏财勿，正财守旧能得利，生意似穿破鞋过水，防小人耗财，与人交易信直中直，宜苦力不从经营可得财力。谋望：覆危渡水两头难，万计千磨财利艰，守份安贫宜忍耐，忙忙劳力不如闲，谋事不成如破鞋覆渡水，艰难重重防歹人祸害，九、十月更应谨慎防备。婚姻：方才说起惹忧愁，想是姻缘不到头，如今若得言相许，又恐旁人暗里谣，婚姻不成有小人重重，纵然成之恐不长久，也许被歹徒占有。出外：一事因时令不美，恐防小人生端，宜守旧经营方保无忧。开铺：之卦为浊油点灯，恐防大火是非口舌，小人耗财宜过旧经营平安也。合伙：之卦不吉，伙计多心，恐防是非口舌，亏本切勿合，合之定失。求财：正财库利小九、十月有歹徒负累，宜稳重谨慎经营，见利取利得之安，偏财定失，分文勿取也。"},{"n":17,"qianyu":"王省就亲","ji":"中平","jie":"枯树生枝，一牛二尾。生肖：龙","jieyue":"家宅：莫将怪梦作闲因，邪摩私祸不临神，自是行藏千里合，岂因病小危难消，吉宅人口可得喜气临门，但嫌六杀占宅，恐防六、九、十二月疾难口舌失财，向佛祖奉经保平安，求达摩祖师香火安门上祭化则财丁兴旺。岁君：当时得意反成痴，今日忧疑事不危，若遇贵人相接引，十年桔树又生枝。生意：生意经营切莫贪，牢牢记住守旧框，肖牛之人防阻失，肖羊之人厚利攀，生意有利可得但防阻失，经营要正直谨慎，肖羊者得厚利，肖牛者失财利。谋望：贪多更惹祸临身，名利从来是未真，但得忧游家道乐，知他谁是百年人，谋事可成但有阻隔，做要稳重认真，不可贪心方免惹祸临身。婚姻：不须勉强费尽金，婚来合时何用寻，立志强成非好事，知人知面不知心，婚姻大事切需要探明对方底细，不可马虎从事乱挥金钱，别把野花当红花。出外：一事虽有贵人扶助，但又防小人生端寄祸，不可在外久住，且来来往往。开铺：之卦不美，未开勿开，已开之钥应防盗贼火灾，肖牛者失利肖羊者可得大利。合伙：之卦不美，失字当头，特别是肖牛者更不妙，伙计不同心有小人祸害，勿合也。求财：正财库取利，虽有微利可得，但恐防阻失，凡事业从正道，八、十一月有财利可得，偏财有阻失勿取吉也。"},{"n":18,"qianyu":"董卓收吕布","ji":"中下","jie":"乌云盖月，蟾宫捉兔之兆。生肖：兔","jieyue":"家宅：旧年不利损多端，今年因何又不安，畜产田蚕防损失，更疑火盗两相残，吉宅人口可得喜气，但防疾难祸非失财火盗之厄，是门楼受火烟冲杀，求佛祖令旗门上祭化居住财丁兴旺，妇人有喜小心防冲杀。岁君：养汝原来岁月深，龙面不见空长吟，相应只在秋江上，明月荷花何处寻。生意：偏财一点不能取，正财也要守旧心，生意防阻勿贪心，现买现卖要记心，生意交易似空笼罩鸟，一嫌财利阻隔，二防小人耗劫买卖须用心谨慎。谋望：本来无事做山翁，为受飞禽使运龙，谁料脱身天外去，方贪计尽也成空，谋事难成，防小人阻隔恐生祸是非失财，凡事不可贪心，不可谋守旧则安。婚姻：今晚不管是和非，作教欢心进秀纬，但看却知林里应，五更天晓各分飞，婚姻不成，未与说时勿说,纵然说成洞房花烛结婚也不长久。出外：一事君虽各事通灵，但嫌进令不美有小人无故生端，守旧经营免生衲害。开铺：之卦不美，防小人耗财，防盗窃火灾，交易勿贪心宜从正道。合伙：之卦不美，伙计训怀贪心勿合，免惹是非失利亏本也。求财：正财库取利似空，笼罩鸟财利虚有，又恐小人耗劫宜用心经营，以智谋取之可保平安，偏财定失勿取也。"},{"n":19,"qianyu":"苏秦六国封相","ji":"上上","jie":"万物逢春。生肖：虎","jieyue":"家宅：此卦求问家宅安，财丁两旺事事全，大吉之兆喜且顺，少安老福庆满堂，吉宅之卦签文太旺人口多则兴，人口少则衰，虽有喜气可得，但嫌官非失财，皆因祖山不顺，灶君不旺宜修整合课向佛祖保佑合家平安。岁君：云行雨施正春深，谋望求财总遂心，争公见官皆得理，贵人喜爱自相寻。生意：生意初时有阻缠，刻苦经营利丝丝，待交秋凉寒冬月，货如轮转得厚利，生意初时防阻，财利小宜刻苦经营于五、八月有起色，生意兴隆可得厚利。谋望：逢时日转好和平，谋望求财正利亨，若要经营当此际，皇都及早取功名，谋事有成，但防谋时阻隔凡事勿贪心，不可妄取宜行正道免生祸非而成也。婚姻：人家便把兰门整，好看瑟鸣有凤声，天对姻缘更有合，如今不必问前程，婚姻成之，琴瑟和鸣天配良缘，可把家门修整择其吉日准备迎亲。出外：一事如枯木逢春，有贵人重重宜立胆智，于三月起往外各事平安。开铺：之卦如万物逢春之兆，但初时怕有小阻，宜大胆灵活经营于五、八月起可得厚财利。合伙：之卦吉利，初时有小阻，勿灰心忍口舌，刻苦经营，同心同德定能得财利。求财：正财似雨后春笋，取之大吉，宜立胆智经营进前占先，三、五、八月时令显达可得大利，偏财初有失，宜大胆经营获大利也。"},{"n":20,"qianyu":"曹操下江南","ji":"下下","jie":"破船下滩。生肖：牛","jieyue":"家宅：去年只望今年好，今年何缘又不宁，只为旧房多怪异，却教疑忌损人丁，吉宅人口旺者得喜，衰者破防失之灾，是灶君冲门祖山顺，有利应把灶君祖各宜修理合课向佛祖奉经求佛祖保佑合家平安。岁君：有船无楫难撑驾，更被飘流向海洋，嗟叹世人系不得，误人如此走东西。生意：正直守份生意经，偏财一点取不能，货物不宜贪心购，留货秋后价会升，生意春夏月财利跋涉，宜守旧正直经营，用心刻苦维持，秋后有财利可得。谋望：千谋万计事难成，枉走江山万里程，不如抽身且守耐，不然别月事来惊，谋事难成时运未到，应该守耐之，若要谋之恐有惊阻，失财祸非之危也。婚姻：许了因何又不从，只因年命不相同，莫教勉强心无定，人岂相逢在梦中，婚姻不成虽然曾经相许过，只因年命不同，小人重重，若作成也恰似梦中。出外：之卦不吉，有小人无故生端寄祸，且防水危宜守旧经营，则免生愁也。开铺：之卦时运未通，宜从正道过旧经营，秋后有发展可得财利也。合伙：之卦不美，勿为宜若，合之定被吞没，定是亏本失利并惹起是非。求财：正财库取利稀少，又防小人负累，宜刻苦维持宜守旧经营，交秋时令有利可得，偏财难得不可取之，若为之定失也。"},{"n":21,"qianyu":"上帝收龟精","ji":"大吉","jie":"如鲲化鹏，鸾凤冲霄。生肖：鼠","jieyue":"家宅：须宜另改旧门庭，人旺财兴百事宁，不但田蚕收十倍，更随四方任经营，吉宅可得喜气盈门，如无喜气事就恐有孝服事到来，皆因门字分金不正门庭水字不美，宜修整改正门庭分金水字求佛祖福灯吊正门，上化吉保平安。岁君：鲲化为鹏海浪翻，阴阳交泰太平关，庶人暮有凌云志，平地雷声倚势还。生意：生意求财要有义，偏财一点不得利，肖马之人偏财得，四面八方任行时，春季生意不能得利候五、六月起似龙带雨定有财源广进，惟肖马者有偏财可得。谋望：几年沉落波涛内，未得风雷志气高，今日脱身多变化，应知万里任游遨，谋事有成但防时有阻隔，用心窍候六、九月可成，但肖猴者恐惹官非失财。婚姻：精男巧女两相当，配合婚姻启后昌，此际好求鸾风偶，迟延悔过费思量，精男巧女配合大吉，但要速速下聘办理，不可拖延，若迟恐祸变也。出外：之卦叶吉，有贵人扶助可于三、五月往外有厚利可得各事平安。开铺：卜开铺之卦叶吉，初小利宜壮胆经营交五、六月起如鱼化鹏，可得厚财利也。合伙：之卦大吉，但伙计要有仁义，要同心协力交五、六月起财源广进可得财利。求财：正财库取利上，春财利稀少，但宜刻苦经营秋厚转运，各事亨通可得厚利偏财唯肖马羊者得之。"},{"n":22,"qianyu":"岳飞枪挑小梁王","ji":"大吉","jie":"将军得胜，凤鸣歧山。生肖：猪","jieyue":"家宅：好整新居换新巢，远离群只兔相投，升平无事皆为福，恰似晴明月满宵，吉宅人口之卦虽有喜气可得，但嫌家内不和气且有灾疾，是灶君不旺埕口水路不通，宜择吉方重建新灶，修通水道厝宅修整壮旺居住平安。岁君：凤凰飞出林间去，振翼飞回伏众禽，一日身荣朝上国，四方钦仰尽名闻。生意：正二五九生意时，他有则难价不知，经营勿贪尾空有，偏财得利又失利，生意经营旺相有贵人扶助，宜用智谋大胆经营，于五月起可得厚财利也。谋望：几年静坐守闲居，景色萧条事已虚，此去时通同泰运，名利成就一声雷，数年谋事有虚无，现岁谋事宜，立胆智敢想敢干，于三、七、十一月可成功也。婚姻：旧年夫妻去鸣琴，静里听来鸾凤音，休要蹉跎延岁月，天寒失雁杳难寻，婚姻可成，但宜从速下聘，切不可迟迟拖延岁月事多变。出外：一事得运，身体可平安，大胆前往于三月起有贵人扶助，可得大财利也。开铺：卜开铺之卦，如将军得胜之兆，有贵人扶助宜大胆经营，五月起可得厚财利。合伙：之卦似凤鸣歧山之兆，伙计要同心同德，齐心协力可得大财利也。求财：正财库有利，但初时空有，凡事业宜立胆智交三、八、十一月有贵人扶助，可得厚利，偏财可得恐不住勿贪也。"},{"n":23,"qianyu":"颜回短寿为圣","ji":"下下","jie":"花开遭风，啖河止渴之兆。生肖：狗","jieyue":"家宅：家居不利欲搬移，惹不搬迁惹是非，只是本家人着力，好心人被小人欺，吉宅人口之卦虽有喜气可得，但防疾难口舌失财和盗贼之厄，向佛祖保平安，皆因灶君不旺失祀祖上香灯，宜奉拜周到重新灶君居住兴旺也。岁君：种得桃树满园林，花开遭雨又遭风，当初只望偷桃食，如今到底总成空。生意：生意守分可经营，进出货物看市情，取财勿贪防阻失，现买同卖财利兴，生意宜守旧经营，要现买现卖，不可妄取，防小人劫物六、八、十一月有利可得。谋望：几载蟾宫折桂枝，未逢时节枉心机，寅缘等到花开日，又被连朝大雨欺，谋事难成，恐防小人生端寄祸，累害耗财，肖猴者恐惹官非和失败。婚姻：知人知面不知心，枉使良谋费尽心，只为眼前欢共乐，谁知祸起为娼淫，婚姻不成，对方品质作风差，若成之，恐成之是娼淫惹起是非灾害，不结尾。出外：一事为啖河止渴，恐有小人阻隔，凡事宜守旧经营，各事平安。开铺：卜开铺之卦如花开遭风之兆，未开勿若是老铺宜注意火盗之危，向佛祖保佑平安。合伙：之卦不美，似花开遭风之兆，勿合为要，若合之恐有小人盗劫财物，亏本折利。求财：正财虽有得，但防小人累害，宜守旧经营，钱财不可信中直，应防仁不仁，六、八、十一月有财利也，偏财勿取。"},{"n":24,"qianyu":"唐明皇游月宫","ji":"上上","jie":"吉庆分明，风云际会之兆。生肖：鸡","jieyue":"家宅：汝家无事不须疑，但梦如何有约期，人若安然无他事，提防暗里小人欺，吉宅人口之卦虽有喜气，但阴夏月小疾失财盗贼之厄，门户宜谨慎，有称人承奉祀拜到财丁昌盛，妇联有喜恐无得。岁君：明有当空处处辉，朗然光辉照昏迷，谋所运大家声显，富贵荣华福乐齐。生意：春夏生意有小灾，守份求神能保财，交秋月圆时运转，货物出入利路开，新创生意春夏月防阻失，宜守旧经营，买卖数目应谨慎，交秋月便可得财利。谋望：心欲抽开事未闲，失去无处把身安，如今得有青云路，步上天梯见广寒，谋事初进难成且有阻隔，候三、五、八、十一月用些财帛帮助，事情便可成功。婚姻：婚姻本是合团圆，何必慌忙心里悬，自是有缘千里合，管教男女共安全，婚姻成也缘份生就，男女双方，情投合，同心同德，千里缘合，白头皆老。出外：一事有贵人重重，应于三月往外，不但平安而且有厚利可得。开铺：之事时令合局，为风云际会之兆，宜择吉日，从速开张，定有财利可以得。合伙：之卦顺吉，为吉庆分明兆，但伙计要同心同德，齐心协力，有财利也。求财：正财虽有所得，但防阻失，宜守早，不可偷闲，于三、五、十一月可得厚利，偏财恐失，莫取为好。"},{"n":25,"qianyu":"郭巨埋儿赐黄金","ji":"中平","jie":"铁镜重磨之兆。生肖：猴","jieyue":"家宅：是非叠叠起虚惊，畜产灼危百怪兴，不是营谋不如意，尚防盗贼入门庭，吉宅人口可得喜气，但防夏月疾难口舌，及次次是非盗贼之厄，门前受杀冲伤，求佛祖令符安门上保财丁兴旺，坐北向南白虎畔有石碑移开。岁君：求谋胜遂如君意，欲望青云路转移，守旧却宜方是吉，他时必定见荣华。生意：春夏时令运未通，生意交易守旧风，谋望求财须等候，秋月圆时利倍浓，春夏利薄，宜守旧刻苦经营，秋后可得财利，肖牛者有贵人扶助，新创生意定得厚利。谋望：运未亨通莫强求，眼前求得也成忧，不如守旧依稀过，好得荣华在后秋，肖牛之人谋之定成但是口舌，忍之，余人运未通，候交来年或秋后成之。婚姻：此亲虽好未为良，休要耽迷惹祸殃，且守得有缘份到，不须持早待心坚，婚姻虽好，但内且待缘份到时便可成也。出外：一事上春恐防是非口舌和小人累害，宜勤谨慎守旧业，交秋后各平安。开铺：卜开铺之卦，春夏小利有阻，宜求佛祖符令镇宅保平安，秋后可得财利，肖牛者可得大利。合伙：合伙之卦不美，伙计不同心，各自有私心，恐要亏本惹出是非，勿合为好。求财：正财春夏月时令未通，财利稀薄，宜刻苦守旧经营，秋后后转运有财利，偏财定失，肖马者得大利也。"},{"n":26,"qianyu":"姜太公遇文王","ji":"大吉","jie":"新月如弓之兆。生肖：羊","jieyue":"家宅：敬神自在心头欢，门户光明万事安，不但田蚕皆兴旺，谁知失落不相干，吉宅可有喜气临门，但人口防四、六、九月有口舌痛疾，还防火盗之厄，是厝前受杀，白虎畔有石冲伤，宜求佛祖福灯安门上祭，化居住大吉。岁君：安居旺相进田蚕，天上生云地下雷，禄位高升光显达，荣华富贵入门来。生意：新开商店春夏盈，旧业经营夏平平，欲问交易何时旺，中秋时节财利生，新创业春夏得厚利，宜用苦力，维持，秋后可得财利。谋望：运至方得出运邦，自然财宝聚衣厢，名利喜在随人欲，却笑浮生空白忙，谋事可成但防口舌，宜用苦力，候交秋后有贵人扶助，即可成功也。婚姻：好对婚姻不用谋，有心不必急相催，前生注定非今日，五百年前结果来，婚姻定成且不用媒人，前缘注定，五百年前结成同心同德，互敬互爱。出外：运气方盛宜出运方，有贵人扶助，各事得心应想，可得名利双全。开铺：若新开张铺户，可卜财源广进，若老铺经营，春夏月小得，秋后转运可得厚利也。合伙：之卦叶吉，协力经营有财利可得，但恐合不长久，必须谨慎注意也。求财：正财取之大吉，但春夏月财利稀薄，宜刻苦经营，秋后有贵人可得财利，偏财勿取恐有是非。"},{"n":27,"qianyu":"岳飞风波亭受害","ji":"中下","jie":"泥中取禽，龙入蛇穴。生肖：马","jieyue":"家宅：不祥值梦已虚惊，鸡犬无端作怪声，非是家神来取祸，只因不记旧亡灵，吉宅之卦签文有梦字可化成喜字，但防三、四、九月疾难口舌，是非失财，向佛祖保佑平安，外是祖山不顺，内是灶君不旺，备事修整，则居住财丁兴旺。岁君：家舍惶惶主不祥，只缘先祖作祸殃，且宜作福永祈祷，更答家门香火堂。生意：货物购进快出售，偏财莫取正财筹，稳重谨慎防祸劫，神明炉前好香求，生意似泥中取禽，财利得后恐防小人耗财，宜从正道谨慎经营，勿贪财利则安。谋望：枉使贪心事已迷，不依本份强施为，一朝祸起萧墙内，徒得莺歌鹊已飞，谋事时令不通，谋之恐失也，凡事从正道为佳，肖龙者切不可谋之，谋之定失也。婚姻：占为嫁娶择二堂，意欲求神恐不良，若不三思存善恶，后来追悔受灾殃，占来的嫁娶要惹三重官非，要好好三思不为，若为之恐惹祸非也。出外：时令不美，恐防小人生端寄祸，宜守旧课经营，谨慎用心则平安。开铺：之卦铺面不宜扩大，宜守旧经营，货物不可进得太多，宜立财帛星君奉记吉也。合伙：之卦不吉，如泥中取禽之兆，不可合也，伙计不同心，合之定失财且生是非口舌。求财：正财取利虽有得，但防小人阻隔累劫，凡事从正道守旧经营，偏财勿取，取之定失也。"},{"n":28,"qianyu":"吴春女为王后","ji":"大吉","jie":"万物逢春，谋望遂心之兆。生肖：蛇","jieyue":"家宅：莫将此事起疑心，虽有浮云岂久阴，此际财人两兴旺，更无火盗两相侵，吉宅人口有喜气临门，但防夏月口舌小疾火盗之厄，是厝前有杀冲伤，宜求佛祖七星令旗安门上祭化，有贵人扶助男女老少平安大吉。岁君：贵人接引喜逢时，官非口舌门庭离，病除疾去身安稳，若问求官定得名。生意：公平交易好心机，购货有阴贵人持，偏财勿取取定败，五六十月真价知，生意可得厚利，但初时有阻，幸有贵人扶助，要从正道经营秋后可得厚财利。谋望：积善之家庆有余，吉人自有吉星持，求财心合存天理，任是凶危也消除，谋事可成但防小人阻隔宜立正直有贵人扶助，如若亏人恐生祸非也。婚姻：良谋相对说知音，莫教错过又来春，此际好调琴瑟韵，真是风清月白人，良缘巧合此际可以说成，应该长速下聘，不可迟延拖，若迟这恐生变也。出外：一事宜从正道有贵人扶助，不但平安而且应心得想，东成西就。开铺：之卦叶吉，如万物逢春之兆，宜忍口舌礼貌待客，防火盗之危，宜请水德星君镇宅，秋后可得厚利也。合伙：之卦可成，如万物逢春之兆，但伙计必同心同德，协力经营有厚财利。求财：正财取利大吉，凡事经营宜从正道，不可亏人，交六、八、十一月有贵人扶助，可得厚利，偏财勿取平安。"},{"n":29,"qianyu":"郭子仪拜寿","ji":"上上","jie":"花木逢春，春来花发之兆。生肖：龙","jieyue":"家宅：敬神自是合天心，人善神饮祸不侵，此不淹留无阻滞，田蚕十倍在深秋，吉宅喜气临门田蚕十倍，但嫌夏月人口有小疾口舌涉财，每逢塑望应诚心敬拜佛祖，天地保平安，埕口水道秽修通。岁君：阴阳相合事亨通，如今行在明月中，琴瑟调各门户吉，荣华富贵喜重重。生意：山荼荷花不合丘，初时磨苦小利酬，和气待人心头记，硕果遍地大丰收，生意合伙不利有阻失，独做二、三磨苦小利，交五、八、十一月生意兴隆可得大利。谋望：十年辛苦在寒窗，一旦翻身入选场，幸得朝庭用智士，传扬天府姓名香。定成有贵人扶助，谋之即可随意，但肖龙之人切不可谋，恐祸非失财也。婚姻：赤绳系足问前程，不用求谋事以成，丝牵月明缘份到，静坐好听凤凰鸣。婚姻成之大吉，两人相合不用媒人，待月明之时便可下聘，就可成功也。出外：之卦似春花开之发，凡事勿疑有胆往外，有贵人扶助，可得名利双全。开铺：之卦如春来花发之兆，生意兴隆，可独占鳌头，五月起可得厚财利，但应忍口舌文明经商。合伙：之卦不吉，恐伙计各有私心防是非口舌防阻失，勿合。求财：正财初时稀薄，宜刻苦维持二、五、八、十一月有贵人扶助，可得大财利，偏财初有恐失，但到得底得大利。"},{"n":30,"qianyu":"王可休妻","ji":"中平","jie":"夜雨欺花，玉镜尘之兆。生肖：兔","jieyue":"家宅：有心斋戒不宜开，恐惹祸非横祸来，归去依然修整过，免叫人口起鸣哀，此卦哀声出现，若有六甲喜可将哀误会声消除，但防五、六、十一月口舌祸非疾难，是门字分金不美，灶君山坟不顺，有利各宜修整合课，向佛祖保佑平安。岁君：花正开时夜雨欺，月当明处被支披，寄言桃李本要笑，或者云开也有时。生意：春夏经营难安排，恐有飞祸又破财，交秋冬日生意吉，牛羊之人利路开，春夏月磨苦无利，交秋冬月可得财利，但防小人累害，惟肖牛羊者可得厚利。谋望：世间不及汝聪明，怎奈时乖事不成，且在灯光温习卷，交秋冬日取功名，春夏时乖有小人阻隔，后来有贵人扶助，肖牛羊者定成。婚姻：以前配偶本无缘，却被旁人说乱言，今日欲求难得见，不如归去待迟延，婚姻不成来配偶无缘，又加上旁人说是非，不可议亲，若议之也是不就也。出外：一事似玉镜灰尘之兆，春夏恐事务阻隔，往之不成，中秋后可出外各事平安。开铺：之卦春夏月宜守旧，防小人祸害忍口舌，秋后转运可得财利，肖牛羊者可得厚财利。合伙：之卦虽合成，但恐伙计不同心，各自私偏，合之不长久，肖牛羊者可得厚利。求财：春夏月时令未通，磨力多财利少，宜守旧交秋后，返运可得厚利，偏财唯肖牛羊者可得大财利也。"},{"n":31,"qianyu":"打北齐秦家比械","ji":"中下","jie":"四路虚险，乌云盖月。生肖：虎","jieyue":"家宅：君家何必惹非灾，南北防七星来朝，求祷福神更改吉，不然安得皱眉开，吉宅有七星杀占宅，防三、六、九月灾难口舌失财，向佛祖保平安，请令旗安门上镇宅祭化南北斗星君，居住平安妇，人有喜生女勿出外。岁君：心事忡忡常不宁，坐得方安又未安，兴意施为全未遂，恰似明月被云迷。生意：春夏生意大不祥，正月守分利不偏，祈祷神明力保佑，冬至时节利可添，生意如虎上壁财难得，宜守旧业苦力经营，秋后可得利，肖牛羊者恐折本招祸。谋望：自然心下意忙忙，怎奈他人心自慌，财物如山皆分定，劝君守旧待时光，时令不美谋事难成，肖牛羊之人更不可谋之，定失并防有祸。婚姻：花言巧语岂为真，浪蝶游蜂不可亲，不信但看园内物，一番风雨就伤神，婚姻不成，媒人花言巧语不可信以为真，如浪蝶游蜂不可相亲，若成之恐不长久。出外：一事四路絮险，恐有小人伤害抢劫，宜在家守旧经营，则免生愁。开铺：之卦恐有阻失，肖牛羊者失更大，未开之铺勿开，若是老铺宅应防歹人祸害劫财，宜求佛祖令旗化吉。合伙：之卦不美，如四路虚险之兆，恐伙计有私偏，恐惹是非口舌灾难，勿合为要也。求财：正财春夏月，跋涉又防阻失，凡事立志经营秋后得利，偏财肖牛羊者勿取，恐惹是非受惊。"},{"n":32,"qianyu":"袁术称帝","ji":"中下","jie":"众星侵月，日落斜西之兆。生肖：牛","jieyue":"家宅：阴人灾害事如何，只为家中惹鬼多，如今要保平安日，除非寻僧礼达摩，吉宅人口防夏月有疾难祸非失财，是埕口水道不美，内有阴人作动又嫌祖山不顺，有利各要修整清楚，向佛祖奉经请达摩祖师福灯安门平安。岁君：众星侵月也当防，小口阴人起祸殃，弱也之时休改革，预先借福谢苍穹。生意：守旧经营可平安，小人劫财要提防，百事用心要谨慎，结果只能小利攀，生意不贪心妄作，要仍按旧业 经营防偷劫，货款出入谨慎，用心窍取利也。谋望：古来名利与兵机，谋望虽多得者稀，若不将心且忍耐，必然失计被人欺，谋事有小人累害有口舌，防祸非失财宜用心窍，用些财帛帮助事可成。婚姻：本来婚偶待团圆，怎奈旁人起祸端，若要事成须速早，不然迟慢守寒年，婚姻切切不可拖延，应及早下聘迎娶，若迟延恐失也，今后又恐无妇也。出外：一事时令不通，恐防小人劫财，勿出外，宜守旧经营，则可安然。开铺：之卦不美，未开者开勿，已开者必守旧经营，勿贪财妄取，防小人防亏本，请佛祖符令镇宅平。合伙：之卦似众星侵月之兆，伙计有私心，防小人防亏本，勿合则吉也。求财：正财利小稀薄，防小人耗劫，恐要亏本，宜谨慎从正道，偏财阻失不可取，取必失之。"},{"n":33,"qianyu":"赵子龙救阿斗","ji":"上上","jie":"蛟龙得雨，宝剑出匣之兆。生肖：鼠","jieyue":"家宅：和居新改又新修，更答家门叶满堂，喜得秋成收十倍，遇逢富贵家道和，吉宅喜气临门，但防夏月则口舌是非，失财官厄，家兴无灾家衰失丁，主事宜团结家人，则家道可得圆满，门字分金不美，应修风水居住财丁兴旺。岁君：利磨龙剑快锋芒，志气冲天势敢当，一但偶时携手立，共道英雄志气刚。生意：初时生意市价迟，磨苦只有得小利，秋冬季节时运通，结果定得厚财利，生意经营初时财利跋涉，但宜刻苦经营发展，交三、六、八、十一月如龙得雨。谋望：未逢雷焕便归洲，万炼千磨受苦煎，此去化龙知期日，峥嵘头上有青天，谋事初时不成，有口舌是非，宜忍性用苦力经营，候交秋后定可成就。婚姻：自古婚姻岂偶成，有缘千里得通传，如今宜好团圆日，莫教琵琶向别船，有缘千里结合婚姻成就，白头皆老要及时下聘，切勿错过良机。出外：一事叶吉，应于二、三月时令合局往之，有贵人扶助，可得厚财利也。开铺：之卦似龙得雨，春处夏月恐是非口舌，磨苦小利，秋后转运可得厚财利。合伙：之卦叶吉，但初恐磨苦小利，但伙计宜同心同德，步调一至，秋后转运似龙得雨，可得厚财利。求财：正财初时如鱼于深渊，财利跋涉，宜刻苦经营，交三、六、八月返运似龙得雨可得厚财，偏财一样。"},{"n":34,"qianyu":"孙膑刖足被害","ji":"中平","jie":"病龙得雨，鱼折足之兆。生肖：猪","jieyue":"家宅：怪梦频频心事忧，因何利郎不堪留，但在自已行方便，常念难逃堕九幽，吉宅人口可得六甲喜，但防疾难口舌失财，皆因祖山不顺，宜查明修整，如家内有金斗寿木应速墓团结做善事。岁君：病龙得雨带远危，有病占身事未宜，变化升腾须有日，且宜守旧待明月。生意：今日切防盗劫财，交易出入莫贪闲，数目切勿信他人，刻苦经营祸可排。肖羊之可得大利，但防三、四、月歹人累劫，宜谨慎，数目自检防人不仁。谋望：未动未安势力衰，安排平地起风灾，晓君乐有拿龙手，弄巧反成拙事来，谋事可成但恐成后被人诱骗，歹人生端寄祸劫之，宜谨慎不可信直中直也。婚姻：婚姻一事在秋天，莫听旁人说到颠，要探香花仔细看，休教招错无头莲，婚姻恐不成，是媒人话不真实，是闲花野草，不可看错，应详细探明情况。出外：一事签文不美，恐防小人生端寄祸，不利外出宜守旧，在家乡工作则吉。开铺：之卦宜旧守经营，防是非口舌，防盗贼劫财，宜求佛祖令旗镇宅，有财利也。合伙：之卦恐防伙计三人四心，各有私偏，防歹人劫财物，勿合为妙，若合之恐亏本惹是非也。求财：春夏月跋涉防小人耗劫，不可以人担认，款项防累身宜守旧，六、九月有利入手，偏财勿取也。"},{"n":35,"qianyu":"刘皇叔过江招亲","ji":"上上","jie":"金雉衔赦，金鸡报喜。生肖：狗","jieyue":"家宅：檐前喜鹊叫三声，报汝今年百事成，官位日升财禄进，更依门户发光明，家门喜气盈盈，孕妇可产男儿，但嫌官非口舌失财灾火厄，是厝前受杀冲伤，宜求佛祖福灯吊门上祭化，早晚火烛小心，居住财丁昌盛。岁君：鸡鸣霄汉势冲天，万里程途任着鞭，官位自然财禄进，安居右庆庆时年。生意：今年生意可稀奇，春夏似鸟落毛时，六月开始至秋冬，鸟添羽毛任高低。春夏似鸟落毛生意阻隔，六月起至秋冬似海鹤添寿，可大发展能得大利。谋望：几年松下惜羽毛，不肯低头皆富豪，有日夺身腾碧汉，方知志气此时高。谋事初时有小人阻隔，不可急候，交秋冬事情便可成功也。婚姻：瑶台仙鹤惯牺梧，月里嫦娥岂有夫，惟子欲求佳偶配，及今春色上皇都。卜此婚事可成，不过初时有歹人说是非，但到底大吉可为长久相合之夫妻也。出外：一事签文叶吉，凡事勿疑，要有胆智，往于二、五月有贵人人重重也。开铺：之卦上春有阻隔，防小人祸劫，六月起转运，金鸡报喜可得厚财大利。合伙：之卦大吉，似金鸡报喜之兆，多人多福同心同德，协力经营可得大利。求财：正财如鸟换毛，美在后来凡事宜立胆智前进，二、八、十一月可得厚利，偏财初有阻，后有大利可得。"},{"n":36,"qianyu":"文王遇凤鸣","ji":"上上","jie":"如鱼化龙，凿石见金之兆。生肖：鸡","jieyue":"家宅：瑞气迎祥百事新，贵人相逢便相亲，秋冬小有淹留阻，春夏人财事事亨，吉宅人口之卦可得喜气临门，但签文有淹留两字，恐防夏月涉财是埕口秽气不净，宜经常修理清洁水道流通，居住财丁兴旺。岁君：鱼翻浪跳当三月，此身方起化为龙，他时得位方为吉，百事无忧方变新。生意：春夏财利小小来，逢上阳月路宏开，秋冬时节物涨价，生意经营得厚财。生意可得厚财，但恐上春阻隔少利，宜刻苦经营五、九、十一月有贵人，生意兴隆。谋望：先时一段报君知，秋后经营遂意时，若遇三阳开泰日，即知名利两相宜。谋事可成，但防初时有阻隔，交秋冬有贵人扶助，所谋各事定能成功。婚姻：天配良缘合两头，那堪相合更相谋，水清看见鱼游戏，好把丝纶下钓钩。天配良缘水清鱼戏，情意相投，婚姻定可成功，勿误时机。出外：一事身体虽平安，但有阻隔，可是应有胆智敢于前往，有贵人应心得想。开铺：之卦如鱼如龙之兆，春夏磨苦小利，新开铺定有小阻，但要有胆智经营，秋冬月可得大财利。合伙：之卦如鱼化龙之兆，合之可成，伙计宜同心同德，刻苦经营有贵人扶助，秋后有厚财利可也。求财：正财春夏秋小利，十月超至明年三阳日大吉利。"},{"n":37,"qianyu":"项羽困乌江自刎","ji":"下下","jie":"行船失楫，楚汉争雄。生肖：猴","jieyue":"家宅：无事何须出外游，恐遭灾盗反成忧，今日切防人口损，若见平安只在秋，吉宅人口有喜气可得，但防夏月疾难口舌，盗火失财，求佛祖奉经保平安，山坟不顺有利宜修整壮旺，请南天天帝香火镇宅居住可保平安。岁君：江水无船岂可通，波涛风浪急危饿，出入不宜须守旧，进这难也退无他。生意：防失守分心勿慌，交冬有利路不宽，偏财勿取取必失，求祷神力保平安。春夏财利跋涉，又防小人劫之，交易宜谨慎，稳重行事不可急性，八月起有利入手。谋望：天理于人岂自忘，见他富贵忽忙忙，伊君若要求名利，一旦乌江见汉王。做事虽是精通，但性情急，恐防阻失，宜用心窍智谋之，勿偏想秋冬月可成也。婚姻：眼下心事欲便成，岂知本命不相称，如今只要寻佳偶，且待黄河九渡清。时令未到婚姻难成，宜忍耐些时，皇天不负有心人的。出外：一事如行失楫之兆，恐防奔波小人累害，又防水厄宜守旧勿外出。开铺：之卦不美，如行船失楫之兆，未开铺勿开，若是老铺应防灾盗祸，非失财之厄，宜求佛祖保佑平安。合伙：之卦不美，如楚汉争雄之兆，勿合为佳，若合之伙计不同心恐惹祸非，口舌失财也。求财：正财虽有利可得，但恐小人阻隔，宜从正道，勿贪心妄想，勿迫性则获利不失，偏财定失凶也，勿取之。"},{"n":38,"qianyu":"哪咤出身后为神","ji":"上上","jie":"进身显达，大器晚成之兆。生肖：羊","jieyue":"家宅：君家明德合天心，些小淹留祸不侵，人口六畜休要说，平安二字值千金，吉宅人口舌签文有淹滞二字出现，恐防流泪破失，若有婚事可保无虑，是埕口水道不美，有利修整，初一吉敬拜天地平安可得财利。岁君：红日当天照破云，无愁不独众人钦，君子进身应显达，荣华富贵得安宁。生意：正道买卖勤经营，春夏可得小财经，秋冬时节有财利，肖马五八厚利升。生意取利叶吉，与人交易心地，宜从正道，五、九、十一月扩大经营得厚利肖马者更佳。谋望：天理人心两不亏，自然合道免生灾，公平感得神明佑，南北东西任所为。卜谋事宜从正道，不可亏人，交秋月各事称心如意，定可成功。婚姻：鸳鸯飞入凤凰窝，莫听旁人说事破，自是姻缘天配汝，两人相笑白头过。婚姻可成，但初时有小人破说，双方勿认以为真，可到白头皆老生子传孙。出外：一事身体平安，但闲事勿近，宜从正道，有贵人扶助，可得名利双全。开铺：之卦叶吉，如大器晚成之兆，要公平正道经营，不可亏人，秋后可得厚利，肖马者更妙。合伙：之卦叶吉，肖马者更妙，如大器晚成之兆，伙计宜同心同德，刻苦经营，秋后有财利可得。求财：正财取利叶吉，宜从正道，不可亏人，宜谨慎勤奋经营五、九、十月亨通得厚利，肖马者冬月大胜，偏财定失。"},{"n":39,"qianyu":"司马懿入葫芦谷","ji":"下下","jie":"白虎占度，久客他乡之兆。生肖：马","jieyue":"家宅：畜产无灾人眷旺，无端怪声乱黄昏，如今好问秋成后，早把门庭依旧关，人口兴旺者可得喜气，但防产妇月内危险期，及夏秋月祸非六畜，是门字分金及水道不美，查明之有利宜修整并作过灶君，向佛祖保平安。岁君：忽入深山去路迷，不知何处鹧鸪啼，进退出行皆不利，切须慎防暗中欺。生意：偏财一点不能来，夏月守旧没贪财，诚心诵经求神佛，交秋冬月利路开。初做平，防阻失勿贪心，防小人耗劫，宜谨慎重谋为，秋后可得厚利。谋望：走遍天涯事不成，事成又着一场惊，不如守分随时过，春到人间草木荣。谋事初时，有小人累害劫财等惊阻，宜谨慎用心窍胆智，交小阳可成也。婚姻：栽种芝兰意欲芳，谁知草木怕经霜，如今若得成姻眷，进余进房不长久，芝兰虽芳但恐经霜，婚姻虽免强成之，恐怕不长久，非尔姻缘切勿谈之。出外：一事不美，做事恐有阻隔及小人累害，宜守旧在家经营，则可无忧无虑也。开铺：之卦铺宅离家乡远的勿开，恐防有祸非失财盗窃之危，铺宅在家乡的初有阻涉，勿灰心，秋后可得利。合伙：之卦如白虎占度之兆，凶多吉少，勿合为要，若合之恐亏本，失利惹出祸非也。求财：上春财利小，防小人劫之，宜守旧经营，谨慎稳重，冬月可得财利，肖虎者得大利，偏利失也。"},{"n":40,"qianyu":"夏国美进场","ji":"上上","jie":"桃李芳菲，剑射斗牛之兆。生肖：蛇","jieyue":"家宅：忧疑无虑也无凶，闲愁莫把挂腹中，赖得福神阴力阻，门庭喜气两三重，吉宅喜气盈门，但嫌主事人操心劳累，夏月疾难口舌，肖牛之人防生痛涉财，是因为折虎畔迫塞，宜立八卦安门上抵挡，向佛祖保平安居住财丁兴旺。岁君：鸣鹄冲天得自然，逢时喜气志昂轩，此日升平得自在，翰翔直上九重天。生意：购货防阻切莫贪，偏财无望不可攀，春夏恐防有阻失，交秋冬时力路宽。生意初时阻，失财利小，但宜立志维持五、九、十一月返运，生意旺可得厚利。谋望：失群鸣雁在东西，岂有相逢任飞时，今日脱尘云外去，只留声阶此人知。谋事可成，但防初时有阻隔，候九、十月有贵人扶助定可成功，肖牛者谋之不美也。婚姻：生前虽定自家人，今日相逢又定亲，争奈姻缘时未至，且宜缓缓待寅申。前生注定有缘份，但初时有阻，有人破说，宜向南北斗星君于九、十月定亲。出外：一事叶吉，时令当权，凡事勿疑，大胆出外谋生，有贵人扶助，名利双成。开铺：之卦春夏恐有阻失，防祸非灾厄，宜用心窍刻苦经营，秋后生意兴隆，有大财利也，肖牛者定失。合伙：之卦宜同心同德协力经营，伙计要大公无私，大家出谋献策，有大财利可得。求财：初时利薄，阻隔宜立智维持于三、五、十一月得厚利，偏财初有失。"},{"n":41,"qianyu":"姜承祖遇害","ji":"中平","jie":"落花流水，螳螂捕蝉之兆。生肖：龙","jieyue":"家宅：鬼怪无端入户庭，响声入梦怪人惊，要知因甚人财蹇，只因家庭路不平，吉可得喜气，但防夏秋月疾难失财口舌火厄，向佛祖保平安，厝前受火烟杀冲伤，用八卦符安门上修整水道，祖上香灯拜到居住财丁兴旺。岁君：落花流水两无情，家合惶惶主不宁，小中阴人招疾厄，须当急祷旺宗神。生意：意外之财不可寻，春夏有阻莫贪心，正财少利偏财失，慎防小人劫财金。生意上春防阻失，防小人偷劫，宜守旧业，交易要直勿贪心，交冬可得财利。谋望：当初有意望东楼，既抵蓬来下九洲，不肯回头归去路，即交埋没入荒丘。谋事防人暗算，宜谨慎勿，防口舌失财之祸，心地宜从正道，其事可成。婚姻：休想斯人入汝家，莫教惆伥怨吁嗟，落花有意随流水，流水无情恋落花。此婚事不成，男求女不就，女求男莫恋，流水无情，不能结合也。出外：之卦美中不足，防小人祸害，心中操杂，往之不成，宜在家经营免生祸非。开铺：之卦君心地，宜公平正直，不可亏人勿惹口舌，勿积货防劫厄，宜求佛祖令旗合财帛星君镇铺宅。合伙：之卦如落花流水之兆，时令不吉，勿合为要，若合之，恐惹祸非盗劫失利。求财：正财初时有阻，防小人劫之，经营从正道交秋冬月转运，可得利，偏财莫取。"},{"n":42,"qianyu":"唐天子得国公","ji":"上上","jie":"如鱼得水，囚人遇赦之兆。生肖：兔","jieyue":"家宅：今年喜庆事如何，人口无休畜产多，秋去冬初些小悔，更祷神佑保融和，吉宅气临门，但恐防九、十一月疾难口舌，阻六畜火星小心，宜求本境地头老爷保平安，是埕口水道不美，宜常修清洁居住财丁昌盛。岁君：鱼游出水戏波浪，跳跃优游非等闲，喜逢泰来万事吉，更无阻险在其间。生意：如今得志上青云，谋望求财总遂君，秋末冬初利更重，偏财夏阻冬成堆。现年生意兴隆，但防夏月亏本、五、九、十一月如鱼得水，有贵人可得厚财利。谋望：地冷天寒水作冰，安心守志待仓清，如今正遇阳和日，四海优游任往行。谋事初阻挡不称心，须立志坚持，候交秋月有贵人扶助定可成功。婚姻：天设良缘两相宜，如鱼得水戏河池，此时若得成连娌，那堪相许也相依。天配良缘如鱼得水，立时可成定能同心同德，白头皆老。出外：此次出外叶吉，但嫌心意未定，应有胆智前往三、五月有贵人扶助，可获财利。开铺：之卦如鱼得水之兆，春夏月防祸非失财，秋后转运否极泰来，有厚财大利。合伙：--求财：正财上春跋涉，宜立志维持，谨慎谋之，候五、九、十一月如鱼得水，有厚财利可得，偏财也财样，但不能贪也。"},{"n":43,"qianyu":"仙姬送子","ji":"上上","jie":"蛟龙得雨，谋望遂心。生肖：虎","jieyue":"家宅：福星高照汝家门，些小忧疑不必论，欲安稳时财禄足，神前多把好香焚，吉宅可得财喜，但防夏月口舌疾难，主事人操心劳烦，是厝前受杀冲伤，每逢塑望两日，应拜天地保平安，并求佛祖令旗安门上祭化平安。岁君：日出扶桑万处明，贵人吉庆事皆亨，求财谋望皆如意，若问求官司定得名。生意：劳心吃苦是春时，夏季也是利丝丝，货物大胆停留下，交冬出售得厚长。生意经营上春磨苦，财利稀秋后转运，如龙得雨，生意旺相，可得厚财利。谋望：几年辛苦三更起，以为生平名利中，喜得太阳东海出，光明无处不亨通。几年来谋事劳累双不成就，现年万事亨通，有贵人扶助所谋成功。婚姻：平生喜得自投机，正好成亲送聘仪，相爱相求无别事，勿言贪富及高低。男女双方情投意合，不言富贵荣华，可以下聘成亲平安大吉，白头皆老。出外：时令合局似得雨，前途远大，于三月起大胆往外，有贵人扶助平安。开铺：之卦初有小阻，要用苦力维持，秋后开之生意兴隆，肖龙者谋望遂心得大利。合伙：之卦为龙得雨之兆，若伙计肖龙者，定能得厚利，余人秋后也能得利也。求财：正财大得利，但上春还小，宜苦力坚持，交五、九、十一月转运，似龙得雨，可得大利，偏财有阻，肖龙者得大利。"},{"n":44,"qianyu":"孙策怒斩于吉","ji":"中平","jie":"乌云盖月，沙里淘金之兆。生肖：牛","jieyue":"家宅：欲求香火福神旺，百事无侵耳目端，春夏欲知唇口事，秋冬人口得平安，吉宅防四、五、九月疾难口舌失财，男妇生端宜团结和气，则家道可圆，是由久年香灯神恩太重，宜改谢请上香灯拜到居住财丁兴旺。岁君：乌云遮月暗朦胧，暗昧门庭事未通，且宜守旧方为吉，直待云开万事通。生意：春夏何必枉用心，用尽心机难得金，若得福神来添力，秋冬财利也非轻。生意似沙里淘金，春夏利小阻隔，交秋后转运得利，肖己戌者宜现买现卖，用苦力定得厚利。谋望：秋后冬前欲利交，机关用尽不能成，君能守得阳和日，雨散云开月自明。谋事初时有小人累害劫财，宜谨慎，用心窍胆智交小阳谋之成也。婚姻：天配本是凤姻缘，免把旁人说短长，急慢迟延日过日，勿使琵琶向别船。婚姻成之，但必从速下聘迎接，因有小人破说，如若迟疑恐不能得也。出外：之卦上春时令未谈通，有小人阻隔，交秋厚转运有贵人扶助，出外平安也。开铺：之卦似沙里淘金之兆，上春磨苦小利，注意夜间勿运行，秋后云开明可得财金，肖蛇狗者勿开。合伙：之卦肖蛇狗者勿合，余人合之则吉，但春夏磨苦小阻，秋后月明可得厚利。求财：正财如沙里淘金，春夏磨苦跋涉，宜刻苦勤奋工作，冬月可得财利，偏财不得硬求失也。"},{"n":45,"qianyu":"罗成娶妻","ji":"上上","jie":"万物萌芽，蟾宫折桂之兆。生肖：鼠","jieyue":"家宅：门冷户衰百怪生，人财两散梦魂惊，如今君问平安日，庶民人口进财丁，人财冲冠，防疾难破财是非火盗，男女不和，兄弟分居，宜求佛祖保平安，又嫌门字灶君分金不美，宜修改合课居住财丁昌盛。岁君：风雷鼓舞播乾坤，万物萌芽尽发生，如今君问平安日，待至秋冷月又明。生意：凡事通灵营生意，春夏似月云遮去，秋冬贵人相扶助，借力谋财好局势。按旧来经营恐有阻失，要创新业防初时亏本，要和人合伙移他人福，可得厚财。谋望：本是聪明特达人，恰似明月云遮清，等闲借得东风力，吹去浮云又复明。谋事初时时运未通，防小人阻隔，但又有贵人重重，交三、五月成就，肖牛者更妙。婚姻：本来婚姻要团圆，无奈旁人说乱言，迟定不如早定好，管教男女共完全。有一对好姻缘，但有小人破说，不要乱听闲言宜速定配，成之大吉。出外：一事签文虽安然，但嫌心意未定，要有胆智敢往，五八月有贵人重重。开铺：之卦得鲤鱼，看君的才能，上春恐有阻失，秋后有贵人扶助，能上蟾宫折桂，可得厚财利。合伙：之卦叶吉，如万物逢春之兆，宜同心同德，协力经营，秋后可得厚财利也。求财：正财上春利薄，宜立志气维持，秋后转运有厚利可得，偏财要托他人之福，要忍口舌是非。"},{"n":46,"qianyu":"刘邦斩白蛇","ji":"下下","jie":"恶星占身，新月朦胧之兆。生肖：猪","jieyue":"家宅：家内作怪假疑真，无端思梦又惊人，要知因甚为多事，只为伊家少福神，喜气临门，但防六、九、十二月口舌祸非失财，地灵不旺，灶位不美，宜择吉日修整安灵，谢土地神向佛祖奉经保佑合家平安。岁君：虫蛇入梦主忧疑，慎防家门口舌非，将来运遇方为吉，进退如今未遇时。生意：正二两月守旧框，四九两月小人防，三心二意财难得，偏财勿取正财攀。做事不可三心二意，宜守旧业，四、九月防小人累劫，秋冬可得利，肖羊之人不可原业经营。谋望：心南心北尚迟疑，成否如值未遇期，名利要求非此日，宽心宜守待明时。肖牛之人谋之定成，余者阻挡生口舌，若肖猪犬龙之人勿谋之，原业免生祸非失财。婚姻：婚眷无缘岂易逢，也难进退两三重，从来勉强成婚事，只恐相逢在梦中。婚姻不成，成之无用，非远计也，如果是失夫的可娶。出外：之卦恶星占异，不可往，往之有小人祸累，宜从旧业勤谨工作，可保平安。开铺：之卦不美，如新月不清之兆，防四、六、九月阴失，宜立财帛星君镇宅，求佛祖保平安。合伙：之卦不吉，有恶星占身，有小人祸害，勿合为要，若要合之，恐惹祸非破财，后悔莫及也。求财：偏财至切不可取，取之有祸非，正财宜守旧并忍口舌，勿三心二意，须立智经营，交六、八、十一月可得中财利。"},{"n":47,"qianyu":"许宁祖平番","ji":"中平","jie":"密云不雨，雨湿桃腮之兆。生肖：狗","jieyue":"家宅：门庭暗昧鬼邪多，人眷惊忧乍奈何，若要平安须祀祖，将身快去念弥陀，吉宅人口有喜，但防六、九、十二月疾难是非失财，肖牛之人生痛疾，是厝前受杀冲伤，宜安八卦抵热挡，向佛祖诵经，并修祖山财丁昌盛也。岁君：密云不雨天边暗，却主忧疑事可防，更慎小人来害已，门前暗昧有惊烦。生意：夜间怪梦惊心头，劫财抢物乱一遭，春夏两季宜守旧，秋冬两季财利高。生意防小人耗劫，春夏月勿贪心，秋冬月有小阻，但有厚利得，宜向天地化吉。谋望：否极泰来理自然，莫交运用灾牵连，时有借得东风力，吹去浮云见碧天。谋事肖牛之人有阻失，切勿谋之，余者候，交秋冬月有贵人扶助，定可成功。婚姻：前缘已定枉心亏，从然求得有官非，此处无缘难着聘，何劳注意痴心为。此婚姻不成，若成之有官非口舌，不要枉费心机，君非孤寡辈无须忧疑。出外：一事上春时令未同，恐有小人阻失，交秋冬月可前往，有贵人扶助。开铺：之卦如密云不雨之兆，交易数目宜谨慎，防歹人劫财，秋冬月有财利，肖牛者定失也。合伙：之卦为密云不雨之兆，又有牛尾两旁开之句，失字当头，有恐有歹人盗劫，勿合为要。求财：上春正财不利，八月得利，肖牛者无利也，偏财勿取，取定失，肖龙虎之人忍口舌，取之得利。"},{"n":48,"qianyu":"黄野仁遇仙","ji":"大吉","jie":"金蝉脱壳，九转丹成之兆。生肖：鸡","jieyue":"家宅：凶杀已去福神来，忽汝家中大发财，此际管教人物旺，秋冬百事真和谐，凶灾当头，春夏人口奔波，疾难是非多，失财是厝前受杀冲伤，宜求佛祖令旗安门上，祭化保平安，若有喜凶灾可消除。岁君：宝镜新磨复见光，四方照耀任行藏，成名久有根基在，润色增光声播扬。生意：此卦求问生意经，历时凶险已消清，如今借得东风力，生意兴隆财利升。数年苦力财利难得，现岁凶险消除无阻，立冬后有厚利，肖龙之人更有财利。谋望：百炼千磨方得醇，几年静坐做闲人，如今借得良工力，富贵相逢白色新。谋事防春月有阻，交秋冬月宜用苦力，自有贵人扶助，凡事定能遂心。婚姻：重整衣裳衣色新，相思比做自家人，从来只说人才好，低恐人心又染身。重夫娶之大吉，正配难成，一方有恋一方无心，正如流水无情恋落花。出外：一事有贵人重重，在三、五月出外，但平安而且东成西就，有厚财利可得。开铺：之卦为九转丹成之兆，老铺数年来波阻已过，今年可得厚财利，新开铺宜用苦力经营，冬月有厚利。合伙：之卦叶吉，为金蝉脱壳之兆，除有波阻，伙计宜同心同德，协力经营，秋后有大财利，伙计有肖龙者更妙。求财：正库取财初时利薄，宜加苦力维持于五、九、十一月交运可得利，偏财肖龙之人得之，宜忍口舌。"},{"n":49,"qianyu":"孟姜女哭倒长城","ji":"下下","jie":"柳絮遭风，风扫落叶。生肖：猴","jieyue":"家宅：口舌无端从地来，只因家中有悲哀，归来及早求神佑，合宅如今不受灾，吉宅人口各宜忍口舌，防是非破失，小孩子夜闹，有喜可改化，宜向福德老爷保平安，门字灶君不旺有利宜修整。岁君：群鸦集噪不为奇，慎防家门口舌欺，退步之时方见吉，若然进步主忧疑。生意：货物购售须认真，要防小人劫财金，生意经营宜守旧，数目还防人不仁。恐防亏本和小人耗劫财帛，交易莫信忠直，防人不仁，出入货物要谨慎，钱财勿寄人。谋望：百炼千磨不得齐，心猿意马走东西，鹊巢作成乌鸦占，只为君家命运低。业务虽精通但性急迫，做事不成，防歹人累恐失也，宜守忍。婚姻：本听旁人说事狂，野花那似菊花香，自有良缘来配合，莫认乌鸦做凤凰。君命非孤此时非缘，等待时运，自有良缘婚姻，渐不成是野花看错。出外：一事身体可平安，恐防小人波阻寄祸，凡事宜守旧经营则免生愁。开铺：之卦似风扫落叶之兆，未开者勿开为妙，已开之铺恐防风火厄，小人劫财，求佛祖化吉平安。合伙：之卦似花木遭风之兆，勿合为佳，若合之，恐伙计不同心，小人劫财亏本失利也。求财：正财库取利虽有得，但防小人盗窃，恐失之，不可贪心妄想，宜从正道得则可安，偏财切不可取。"},{"n":50,"qianyu":"唐僧取经","ji":"中平","jie":"乌云盖月，禅门出法之兆。生肖：羊","jieyue":"家宅：人口平安赖佛恩，四处生涯任意勤，年来春夏经营好，勿贪歧路起猜心，吉宅人口虽有喜气可得，但防口舌是非，男女不和，生意可为但不可贪，作物昌盛，埕口水道秽气，要时常修通，请上帝灵符贴保居住平安。岁君：行藏水陆有虚疑，可虑忧疑不可欺，今定所谋前等事，劝君他去莫迟疑。生意：春夏阻失莫贪营，偏财莫取正财宁，待秋冬到可得利，正直守分财利兴。时运不通，春夏月防歹人害劫之，习卖宜正直守分，交秋冬月便可得利。谋望：几年学道讨前程，岂料中途恐虚惊，千万鬼怪俱降伏，秋风清处月光明。谋事可成，但初时防歹人阻隔，宜用小利帮助有吉星拱照，定可成事。婚姻：婚姻急速可为期，赖慢依然有所疑，只是小人言不定，说合成来乍许辞。婚姻宜急速说合下聘，则可成功 ，若迟延不成，是小人乱言也。出外：一事上春未得运，恐防阻失，小人累害，宜守旧候，交秋后往之平安。开铺：之卦似乌云盖月之兆，上春阻失，恐防小人劫财，交秋月明，努力经营可是财利。合伙：之卦似乌云盖月，伙计三人四心，各有私偏，勿合为妙，若合之，恐亏本破财。求财：正财上春利薄，又防阻隔涉财，凡事宜用心窍，守旧经营，交秋月逐渐可得财利，偏财勿取，取定失之。"},{"n":51,"qianyu":"全福签","ji":"上上","jie":"不成转喜，逢凶化吉之兆。生肖：马","jieyue":"家宅：卜吉宅人口求佛祖不诚心，阳宅龙运不旺，灶前污秽，浴盆冲犯帝君，恐防九、十月有灾难破失，常时灶前宜清净，上诸圣神容宜重壮光彩，常时诚心待圣，宜向佛祖送经奉油，可消改水厄，福即来临财丁兴旺。岁君：小孩根苗足养，有旺益上人并茂，虽有小疾无妨，吉星守命平安，小女根基足养，夏月虽有小疾无妨，吉得守度，旺益上人平安。生意：卜现年生意，恐防君办事烦劳操心，恐防歹人累害寄祸，交易谨慎，切勿贪心，宜守旧业，刻苦经营维持，向佛祖奉经添油保生意兴隆，可得大财利。谋望：卜谋事之卦初有，有小人之阻，并防劫财祸非，宜忍口舌，向佛祖诵经添油，有贵人扶助，时运显达可成功。婚姻：自古婚姻定良缘，此卦定卜财喜签，财喜登门有微阻，送经运至得团圆。婚姻之事定成，宜送经添油至佛祖，可化凶为吉，定卜财喜双至也。出外：之事恐尔不全心以待，心坚者，宜向佛祖奉经添油，以全心愿，但肖猪狗之人切勿想成，非非此念必绝。余人可往有利。开铺：之卦恐防初时小人无端生祸劫财，宜守旧经营，向佛祖添油奉经，消灾改厄有财利。合伙：之卦初时恐有隔，伙计宜同心同德合力经营，向佛祖送经奉油，可得财利。求财：正财春夏有阻，失磨力勿贪偏财勿取，向佛祖奉经添油，二月小利。"}];

  var drawBtn = document.getElementById("drawBtn");
  var againBtn = document.getElementById("againBtn");
  var copyBtn = document.getElementById("copyBtn");
  var allToggle = document.getElementById("allToggle");
  var allList = document.getElementById("allList");
  var qianStage = document.getElementById("qianStage");
  var resultCard = document.getElementById("resultCard");
  var resNo = document.getElementById("resNo");
  var resName = document.getElementById("resName");
  var resJi = document.getElementById("resJi");
  var resPoem = document.getElementById("resPoem");
  var resJie = document.getElementById("resJie");
  var resExtra = document.getElementById("resExtra");
  var drawing = false;
  var lastText = "";

  function jiLevel(ji) {
    var s = String(ji || "").replace(/^\s+|\s+$/g, "");
    if (!s) return "";
    if (s.indexOf("下") !== -1 || s.indexOf("凶") !== -1) return "down";
    if (s.indexOf("中") !== -1) return "mid";
    if (s.indexOf("上") !== -1 || s.indexOf("大") !== -1) return "up";
    return "mid";
  }

  function makeJiBadge(ji) {
    var span = document.createElement("span");
    span.className = "ji-badge jl-" + jiLevel(ji);
    span.textContent = ji;
    return span;
  }

  function clearChildren(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
  }

  function normalize(q) {
    var n = {
      no: q.no || CFG.noLabel + q.n + CFG.noSuffix,
      name: CFG.nameField ? (q[CFG.nameField] || "") : "",
      ji: CFG.jiField ? (q[CFG.jiField] || "") : "",
      poem: CFG.poemField ? (q[CFG.poemField] || "") : "",
      jie: CFG.jieField ? (q[CFG.jieField] || "") : "",
      extra: []
    };
    for (var i = 0; i < CFG.extra.length; i++) {
      var e = CFG.extra[i];
      if (q[e.key]) n.extra.push({ label: e.label, value: q[e.key] });
    }
    return n;
  }

  function buildText(q) {
    var lines = [CFG.name + " · " + q.no];
    if (q.name) lines.push(q.name);
    if (q.ji) lines.push(q.ji);
    if (q.poem) lines.push(CFG.poemLabel + "：" + q.poem);
    if (q.jie) lines.push(CFG.jieLabel + "：" + q.jie);
    for (var i = 0; i < q.extra.length; i++) lines.push(q.extra[i].label + "：" + q.extra[i].value);
    return lines.join("\n");
  }

  function showResult(q) {
    resNo.textContent = q.no;
    resName.style.display = q.name ? "" : "none";
    resName.textContent = q.name;
    clearChildren(resJi);
    if (q.ji) {
      var b = makeJiBadge(q.ji);
      if (b) resJi.appendChild(b);
    }
    resPoem.style.display = q.poem ? "" : "none";
    resPoem.textContent = q.poem;
    resJie.style.display = q.jie ? "" : "none";
    resJie.textContent = q.jie ? CFG.jieLabel + "：" + q.jie : "";
    clearChildren(resExtra);
    for (var i = 0; i < q.extra.length; i++) {
      var line = document.createElement("div");
      line.className = "qian-extra-line";
      line.textContent = q.extra[i].label + "：" + q.extra[i].value;
      resExtra.appendChild(line);
    }
    resultCard.style.display = "block";
    resultCard.classList.remove("show");
    void resultCard.offsetWidth;
    resultCard.classList.add("show");
    lastText = buildText(q);
  }

  function startDraw() {
    if (drawing) return;
    if (!QIAN || !QIAN.length) {
      setStatus(t('ui.100','签文数据为空，无法抽签'), "error");
      return;
    }
    drawing = true;
    drawBtn.textContent = t('ui.102','抽签中...');
    drawBtn.disabled = true;
    resultCard.style.display = "none";
    resultCard.classList.remove("show");
    qianStage.classList.remove("drawing", "drawn");
    void qianStage.offsetWidth;
    qianStage.classList.add("drawing");
    var picked = QIAN[Math.floor(Math.random() * QIAN.length)];
    setTimeout(function () {
      qianStage.classList.remove("drawing");
      qianStage.classList.add("drawn");
      drawBtn.textContent = t('ui.103','开始抽签');
      drawBtn.disabled = false;
      drawing = false;
      showResult(normalize(picked));
    }, 2600);
  }

  drawBtn.addEventListener("click", startDraw);
  againBtn.addEventListener("click", startDraw);

  copyBtn.addEventListener("click", function () {
    if (!lastText) return;
    copyToClipboard(lastText, copyBtn);
    setStatus(t('ui.101','结果已复制到剪贴板'));
  });

  allToggle.addEventListener("click", function () {
    var open = allList.style.display !== "none";
    allList.style.display = open ? "none" : "block";
    allToggle.textContent = open ? "查看全部签文" : "收起全部签文";
  });

  (function buildAll() {
    for (var i = 0; i < QIAN.length; i++) {
      var q = normalize(QIAN[i]);
      var row = document.createElement("div");
      row.className = "all-row";
      var head = document.createElement("button");
      head.type = "button";
      head.className = "all-head";
      var noSpan = document.createElement("span");
      noSpan.className = "all-no";
      noSpan.textContent = q.no;
      head.appendChild(noSpan);
      if (q.ji) {
        var b = makeJiBadge(q.ji);
        if (b) head.appendChild(b);
      }
      var poemSpan = document.createElement("span");
      poemSpan.className = "all-poem";
      poemSpan.textContent = q.poem || q.name || q.jie;
      head.appendChild(poemSpan);
      var body = document.createElement("div");
      body.className = "all-body";
      var p = document.createElement("div");
      p.className = "all-poem-full";
      p.textContent = q.poem || q.name;
      body.appendChild(p);
      if (q.jie) {
        var j = document.createElement("div");
        j.className = "all-jie";
        j.textContent = CFG.jieLabel + "：" + q.jie;
        body.appendChild(j);
      }
      for (var k = 0; k < q.extra.length; k++) {
        var line = document.createElement("div");
        line.className = "all-jie";
        line.textContent = q.extra[k].label + "：" + q.extra[k].value;
        body.appendChild(line);
      }
      row.appendChild(head);
      row.appendChild(body);
      (function (r) {
        head.addEventListener("click", function () { r.classList.toggle("open"); });
      })(row);
      allList.appendChild(row);
    }
  })();
})();
  </script>
</body>
</html>
