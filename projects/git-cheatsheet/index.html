content.innerHTML=h2;

for(var m2=0;m2<cards.length;m2++){(function(idx,el){el.onclick=function(){var it=md[idx];lastCopy=it.syntax;o.innerHTML='<div style="font-size:var(--font-size-sm);margin-bottom:var(--space-1);"><b>'+esc(it.name)+'</b> · <span class="cs-cat">'+esc(mdCatLabel[it.cat]||it.cat)+'</span></div><div style="font-family:var(--font-mono);font-size:var(--font-size-sm);white-space:pre-wrap;">'+esc(it.syntax)+'</div>';copyToClipboard(it.syntax,document.getElementById("copyBtn"));setStatus(t('ui.selected','已选中「')+it.name+t('ui.clickCopy','」，点击复制按钮可复制语法'));};})(m2,cards[m2]);}
}
else if(currentTopic==="python"){
renderCats(pyCats,currentCat);
var py=[];
for(var p=0;p<pyItems.length;p++){var pit=pyItems[p];if(currentCat!=="all"&&pit.cat!==currentCat)continue;if(q&&pit.name.toLowerCase().indexOf(q)===-1&&pit.syntax.toLowerCase().indexOf(q)===-1)continue;py.push(pit);}
if(!py.length){content.innerHTML='<div class="cs-empty">'+t('ui.nomatch','没有匹配的条目')+'</div>';o.innerHTML='';return;}
var h3="";
for(var p2=0;p2<py.length;p2++){h3+='<div class="cs-item" data-idx="'+p2+'">';h3+='<div class="cs-item-head"><span class="cs-name">'+esc(py[p2].name)+'</span><span class="cs-cat">'+esc(pyCatName(py[p2].cat))+'</span></div>';h3+='<div class="cs-syntax">'+esc(py[p2].syntax)+'</div>';h3+='<div class="cs-example">'+esc(py[p2].example)+'</div>';h3+='</div>';}
content.innerHTML=h3;
var pcards=content.querySelectorAll(".cs-item");
for(var p3=0;p3<pcards.length;p3++){(function(idx,el){el.onclick=function(){var it=py[idx];lastCopy=it.example;o.innerHTML='<div style="font-size:var(--font-size-sm);margin-bottom:var(--space-1);"><b>'+esc(it.name)+'</b> · '+esc(pyCatName(it.cat))+'</div><div style="font-family:var(--font-mono);font-size:var(--font-size-sm);white-space:pre-wrap;">'+esc(it.example)+'</div>';copyToClipboard(it.example,document.getElementById("copyBtn"));setStatus(t('ui.selected','已选中「')+it.name+t('ui.clickCopy','」，点击复制按钮可复制示例'));};})(p3,pcards[p3]);}
}
else if(currentTopic==="typescript"){
renderCats(tsCats,currentCat);
var ts=[];
for(var tt=0;tt<tsItems.length;tt++){var tit=tsItems[tt];if(currentCat!=="all"&&tit.cat!==currentCat)continue;if(q&&tit.name.toLowerCase().indexOf(q)===-1&&tit.syntax.toLowerCase().indexOf(q)===-1)continue;ts.push(tit);}
if(!ts.length){content.innerHTML='<div class="cs-empty">'+t('ui.nomatch','没有匹配的条目')+'</div>';o.innerHTML='';return;}
var h4="";
for(var t2=0;t2<ts.length;t2++){h4+='<div class="cs-item" data-idx="'+t2+'">';h4+='<div class="cs-item-head"><span class="cs-name">'+esc(ts[t2].name)+'</span><span class="cs-cat">'+esc(tsCatLabel(ts[t2].cat))+'</span></div>';h4+='<div class="cs-syntax">'+esc(ts[t2].syntax)+'</div>';h4+='<div class="cs-example">'+esc(ts[t2].example)+'</div>';h4+='</div>';}
content.innerHTML=h4;
var tcards=content.querySelectorAll(".cs-item");
for(var t3=0;t3<tcards.length;t3++){(function(idx,el){el.onclick=function(){var it=ts[idx];lastCopy=it.example;o.innerHTML='<div style="font-size:var(--font-size-sm);margin-bottom:var(--space-1);"><b>'+esc(it.name)+'</b> · '+esc(tsCatLabel(it.cat))+'</div><div style="font-family:var(--font-mono);font-size:var(--font-size-sm);white-space:pre-wrap;">'+esc(it.example)+'</div>';copyToClipboard(it.example,document.getElementById("copyBtn"));setStatus(t('ui.selected','已选中「')+it.name+t('ui.clickCopy','」，点击复制按钮可复制示例'));};})(t3,tcards[t3]);}
}
else if(currentTopic==="hashcat"){
cb.style.display="none";
document.getElementById("hcCatSelect").style.display="";
var keyword=q;
var hcCat=document.getElementById("hcCatSelect").value;
var matched=0,h5="";
for(var hc=0;hc<hcModes.length;hc++){var m=hcModes[hc];
if(hcCat&&m.cat!==hcCat)continue;
if(keyword&&m.id.indexOf(keyword)===-1&&m.name.toLowerCase().indexOf(keyword)===-1)continue;
matched++;
h5+='<tr data-copy="'+esc(m.id+' | '+m.name)+'">';
h5+='<td class="hc-id">'+esc(m.id)+'</td>';
h5+='<td class="hc-name">'+esc(m.name)+'</td>';
h5+='<td class="hc-hash">'+esc(m.hash)+'</td>';
h5+='<td><span class="hc-badge">'+esc(m.cat)+'</span></td>';
h5+='</tr>';}
content.innerHTML='<table class="cs-table"><thead><tr><th style="width:70px;">'+t('ui.mode','模式号')+'</th><th style="width:230px;">'+t('ui.hashType','哈希类型')+'</th><th>'+t('ui.exampleHash','示例哈希')+'</th><th style="width:80px;">'+t('ui.category','类别')+'</th></tr></thead><tbody>'+h5+'</tbody></table>';
var rows=content.querySelectorAll("tr[data-copy]");
for(var r=0;r<rows.length;r++){rows[r].onclick=function(){var text=this.getAttribute("data-copy");lastCopy=text;o.textContent=text;copyToClipboard(text,document.getElementById("copyBtn"));setStatus(t('ui.copied','已复制：')+text);};}
var countEl=document.createElement("div");
countEl.className="cs-count";
countEl.textContent=t('ui.total','共 ')+hcModes.length+t('ui.hcMatch',' 种模式，当前匹配 ')+matched+t('ui.items',' 项');
content.appendChild(countEl);
}
}

topic.addEventListener("change",function(){currentTopic=topic.value;currentCat="all";document.getElementById("hcCatSelect").style.display=currentTopic==="hashcat"?"":"none";render();});
si.addEventListener("input",render);
document.getElementById("hcCatSelect").addEventListener("change",render);

document.getElementById("copyBtn").addEventListener("click",function(){
if(!lastCopy){setStatus(t('ui.copyFirst','请先点击表格中的一行或选中条目'),'error');return;}
copyToClipboard(lastCopy,this);setStatus(t('ui.copied','已复制'));
});
render();
})();
</script></body></html>
