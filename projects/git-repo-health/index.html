<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git 仓库健康检查 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .field-label { display: block; font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: 4px; }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">Git 仓库健康检查</h1>
    <p class="tool-desc" data-i18n="desc">粘贴 git log 输出，自动统计提交活跃度、作者分布与消息质量，并给出 60-100 的健康评分与改进建议。</p>
    <div class="card">
      <label for="logInput" class="field-label">git log 输出（在仓库目录执行：git log --oneline --pretty=format:"%h|%an|%ad|%s" --date=short）</label>
      <textarea id="logInput" class="input textarea js-focus-input" style="min-height:220px;" placeholder="a1b2c3d|Alice|2026-07-10|fix login redirect bug&#10;e4f5a6b|Bob|2026-07-02|add user profile page&#10;c7d8e9f|Alice|2026-06-18|refactor api client"></textarea>
    </div>
    <div id="resultBox" class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div>S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script>
    (function () {
      var inputEl = document.getElementById('logInput');
      var outputEl = document.getElementById('outputText');
      var copyBtn = document.getElementById('copyBtn');

      function toDate(str) {
        var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(str).trim());
        if (!m) return null;
        var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
        if (isNaN(d.getTime())) return null;
        return d;
      }

      function daysBetween(a, b) {
        return Math.round((b - a) / 86400000);
      }

      function pad2(n) {
        return n < 10 ? '0' + n : String(n);
      }

      function todayShort() {
        var d = new Date();
        return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
      }

      function analyze() {
        var raw = inputEl.value;
        if (!raw.trim()) {
          outputEl.textContent = '';
          setStatus('');
          return;
        }
        var lines = raw.split(/\r?\n/);
        var commits = [];
        var malformed = 0;
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (!line) continue;
          var parts = line.split('|');
          if (parts.length < 4) { malformed++; continue; }
          commits.push({ hash: parts[0], author: parts[1], date: parts[2], subject: parts.slice(3).join('|') });
        }
        if (!commits.length) {
          outputEl.textContent = '';
          setStatus('未识别到有效提交记录，请确认粘贴的是 %h|%an|%ad|%s 格式的 git log 输出', 'error');
          return;
        }
        var total = commits.length;
        var authorMap = {};
        var msgBuckets = { short: 0, mid: 0, long: 0, xlong: 0 };
        var msgLenSum = 0;
        var minDate = null;
        var maxDate = null;
        var invalidDate = 0;
        var today = toDate(todayShort());
        var cutoff = new Date(today.getTime() - 29 * 86400000);
        var last30 = 0;
        for (var j = 0; j < commits.length; j++) {
          var c = commits[j];
          authorMap[c.author] = (authorMap[c.author] || 0) + 1;
          var len = c.subject.length;
          msgLenSum += len;
          if (len < 20) msgBuckets.short++;
          else if (len < 50) msgBuckets.mid++;
          else if (len < 100) msgBuckets.long++;
          else msgBuckets.xlong++;
          var d = toDate(c.date);
          if (d) {
            if (!minDate || d < minDate) minDate = d;
            if (!maxDate || d > maxDate) maxDate = d;
            if (d >= cutoff) last30++;
          } else {
            invalidDate++;
          }
        }
        var authors = Object.keys(authorMap).sort(function (a, b) { return authorMap[b] - authorMap[a]; });
        var spanDays = minDate && maxDate ? daysBetween(minDate, maxDate) + 1 : 0;
        var avg = spanDays > 0 ? total / spanDays : 0;
        var avgLen = msgLenSum / total;
        var shortRatio = msgBuckets.short / total;

        var score = 100;
        if (shortRatio > 0.6) score -= 20;
        else if (shortRatio > 0.3) score -= 10;
        if (authors.length === 1) score -= 8;
        if (last30 === 0) score -= 15;
        if (spanDays > 0 && avg < 0.5) score -= 5;
        if (avgLen < 40) score -= 5;
        if (score < 60) score = 60;

        var lines = [];
        lines.push('Git 仓库健康检查报告');
        lines.push('');
        lines.push('总提交数：' + total);
        lines.push('活跃作者：' + authors.length + ' 位');
        lines.push('时间跨度：' + (minDate ? fmtDate(minDate) : '未知') + ' ~ ' + (maxDate ? fmtDate(maxDate) : '未知') + '（' + (spanDays > 0 ? spanDays : '未知') + ' 天）');
        lines.push('每日平均提交：' + (spanDays > 0 ? avg.toFixed(2) : '无法计算（时间跨度未知）'));
        lines.push('最近 30 天提交：' + last30 + ' 条');
        lines.push('');
        lines.push('作者提交分布：');
        for (var a = 0; a < authors.length; a++) {
          var cnt = authorMap[authors[a]];
          lines.push('  ' + authors[a] + ': ' + cnt + ' 条（' + Math.round(cnt * 100 / total) + '%）');
        }
        lines.push('');
        lines.push('提交消息长度分布（共 ' + total + ' 条，平均 ' + avgLen.toFixed(1) + ' 字）：');
        lines.push('  <20 字：' + msgBuckets.short + ' 条（' + Math.round(msgBuckets.short * 100 / total) + '%）' + (shortRatio > 0.3 ? ' ← 偏短' : ''));
        lines.push('  20-49 字：' + msgBuckets.mid + ' 条（' + Math.round(msgBuckets.mid * 100 / total) + '%）');
        lines.push('  50-99 字：' + msgBuckets.long + ' 条（' + Math.round(msgBuckets.long * 100 / total) + '%）');
        lines.push('  >=100 字：' + msgBuckets.xlong + ' 条（' + Math.round(msgBuckets.xlong * 100 / total) + '%）');
        if (invalidDate > 0) {
          lines.push('');
          lines.push('提示：' + invalidDate + ' 条记录日期无法识别（应使用 --date=short 输出 YYYY-MM-DD）');
        }
        if (malformed > 0) {
          lines.push('提示：' + malformed + ' 行未按 哈希|作者|日期|消息 格式解析，已忽略');
        }
        lines.push('');
        var label = score >= 90 ? '优秀' : score >= 80 ? '良好' : score >= 70 ? '一般' : '需改进';
        lines.push('健康评分：' + score + ' / 100（' + label + '）');
        lines.push('');
        lines.push('改进建议：');
        var advice = [];
        if (shortRatio > 0.3) {
          advice.push('提交消息偏短（' + msgBuckets.short + ' 条小于 20 字），建议遵循 Conventional Commits 规范（type(scope): subject）');
        }
        if (authors.length === 1) {
          advice.push('仓库仅 1 位活跃作者，建议引入代码审查与多人协作，降低单点风险');
        }
        if (last30 === 0) {
          advice.push('最近 30 天没有提交，仓库活跃度偏低，建议保持定期提交节奏');
        }
        if (spanDays > 0 && avg < 0.5) {
          advice.push('提交频率偏低（平均约 ' + (avg > 0 ? Math.round(1 / avg) : 0) + ' 天/次），建议将工作拆分为更小的提交单元');
        }
        if (!advice.length) {
          advice.push('未发现明显问题，继续保持当前提交习惯');
        }
        for (var v = 0; v < advice.length; v++) {
          lines.push((v + 1) + '. ' + advice[v]);
        }
        outputEl.textContent = lines.join('\n');
        setStatus('已生成健康报告');
      }

      function fmtDate(d) {
        return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
      }

      inputEl.addEventListener('input', analyze);

      copyBtn.addEventListener('click', function () {
        var text = outputEl.textContent;
        if (!text) { setStatus('暂无内容可复制', 'error'); return; }
        copyToClipboard(text, copyBtn);
        setStatus('已复制到剪贴板');
      });

      analyze();
    })();
  </script>
</body>
</html>
