<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GraphQL Schema 转 TypeScript - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .stat-line { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: var(--space-1); }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">GraphQL Schema 转 TypeScript</h1>
    <p class="tool-desc" data-i18n="desc">粘贴 GraphQL SDL，自动将 type/interface/enum/input/union 转换为 TypeScript 类型定义，并输出解析统计。</p>
    <div class="card">
      <div class="stat-line" id="statLine"></div>
      <textarea id="inputText" class="input textarea js-focus-input" rows="12" data-i18n-placeholder="ui.101" placeholder="粘贴 GraphQL SDL，例如：&#10;type User {&#10;  id: ID!&#10;  name: String!&#10;  email: String&#10;  age: Int&#10;}&#10;enum Role {&#10;  ADMIN&#10;  USER&#10;}&#10;input UserInput {&#10;  name: String!&#10;}&#10;union SearchResult = User | Article"></textarea>
    </div>
    <div id="resultBox" class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script></script>
  <script>
    (function () {
      var SCALARS = { ID: 'string', String: 'string', Int: 'number', Float: 'number', Boolean: 'boolean' };
      var KIND_LABEL = { type: 'type', interface: 'interface', enum: 'enum', input: 'input', union: 'union' };
      var output = document.getElementById('outputText');
      var current = '';

      function mapType(t) {
        t = String(t).replace(/\s+/g, '');
        var isArr = false;
        t = t.replace(/!$/, '');
        if (t.charAt(0) === '[') {
          isArr = true;
          t = t.slice(1, t.length - 1).replace(/!$/, '');
        }
        var base = SCALARS[t] || t;
        return isArr ? base + '[]' : base;
      }

      function parseBlocks(text) {
        var blocks = [];
        var re = /(?:\bextend\s+)?(type|interface|enum|input)\s+(\w+)\s*\{([\s\S]*?)\}/g;
        var m;
        while ((m = re.exec(text)) !== null) {
          blocks.push({ kind: m[1], name: m[2], body: m[3] });
        }
        var ure = /\b(union)\s+(\w+)\s*=\s*([^\n{#]+)/g;
        while ((m = ure.exec(text)) !== null) {
          blocks.push({ kind: 'union', name: m[2], body: m[3] });
        }
        return blocks;
      }

      function stripComment(line) {
        var idx = line.indexOf('#');
        return idx === -1 ? line : line.slice(0, idx);
      }

      function parseFields(body) {
        var fields = [];
        var lines = body.split(/\r?\n/);
        for (var i = 0; i < lines.length; i++) {
          var line = stripComment(lines[i]).split('@')[0].trim();
          if (!line) continue;
          line = line.replace(/\([^)]*\)/g, '');
          var re = /(\w+)\s*:\s*([\w!\[\]]+)/g;
          var m;
          while ((m = re.exec(line)) !== null) fields.push({ name: m[1], type: m[2] });
        }
        return fields;
      }

      function parseEnumValues(body) {
        var values = [];
        var lines = body.split(/\r?\n/);
        for (var i = 0; i < lines.length; i++) {
          var line = stripComment(lines[i]).split('@')[0].trim();
          var m = line.match(/^(\w+)$/);
          if (m) values.push(m[1]);
        }
        return values;
      }

      function parseUnionMembers(body) {
        var members = [];
        var parts = body.split('|');
        for (var i = 0; i < parts.length; i++) {
          var t = stripComment(parts[i]).trim();
          if (/^\w+$/.test(t)) members.push(t);
        }
        return members;
      }

      function typeFor(block) {
        if (block.kind === 'enum') {
          var vals = parseEnumValues(block.body);
          var quoted = [];
          for (var v = 0; v < vals.length; v++) quoted.push("'" + vals[v] + "'");
          return 'export type ' + block.name + ' = ' + quoted.join(' | ') + ';';
        }
        if (block.kind === 'union') {
          var members = parseUnionMembers(block.body);
          return 'export type ' + block.name + ' = ' + members.join(' | ') + ';';
        }
        var fields = parseFields(block.body);
        var bodyLines = [];
        for (var f = 0; f < fields.length; f++) {
          bodyLines.push('  ' + fields[f].name + ': ' + mapType(fields[f].type) + ';');
        }
        if (!bodyLines.length) bodyLines.push('  [key: string]: unknown;');
        return 'export type ' + block.name + ' = {\n' + bodyLines.join('\n') + '\n};';
      }

      function update() {
        var text = document.getElementById('inputText').value;
        if (!text.trim()) {
          output.innerHTML = '';
          current = '';
          document.getElementById('statLine').textContent = '';
          setStatus('');
          return;
        }
        var blocks = parseBlocks(text);
        if (!blocks.length) {
          output.innerHTML = '';
          current = '';
          document.getElementById('statLine').textContent = '';
          setStatus(t('ui.100','未解析到任何类型定义：请粘贴包含 type/enum/input/union 块的有效 GraphQL SDL'), 'error');
          return;
        }
        var lines = [];
        var counts = { type: 0, interface: 0, enum: 0, input: 0, union: 0 };
        var totalFields = 0;
        for (var i = 0; i < blocks.length; i++) {
          counts[blocks[i].kind] = (counts[blocks[i].kind] || 0) + 1;
          var t = typeFor(blocks[i]);
          if (blocks[i].kind !== 'enum' && blocks[i].kind !== 'union') {
            totalFields += parseFields(blocks[i].body).length;
          } else if (blocks[i].kind === 'enum') {
            totalFields += parseEnumValues(blocks[i].body).length;
          } else {
            totalFields += parseUnionMembers(blocks[i].body).length;
          }
          lines.push(t);
          lines.push('');
        }
        current = lines.join('\n').replace(/\n+$/, '');
        var stat = t('ui.5','解析统计：type ') + counts.type + '、interface ' + counts.interface + '、enum ' + counts.enum +
          '、input ' + counts.input + '、union ' + counts.union + t('ui.4','，共 ') + blocks.length + t('ui.3',' 个定义、') + totalFields + t('ui.2',' 个字段/值');
        document.getElementById('statLine').textContent = stat;
        output.innerHTML = '<pre style="margin:0;font-size:var(--font-size-sm);white-space:pre-wrap;word-break:break-all;font-family:var(--font-mono)">' + htmlEscape(current) + '</pre>';
        setStatus(t('ui.convertDone','转换完成'));
      }

      document.getElementById('inputText').addEventListener('input', update);
      document.getElementById('copyBtn').addEventListener('click', function () {
        if (!current) return;
        copyToClipboard(current, this);
        setStatus(t('ui.1','已复制 TypeScript 定义'));
      });
    })();
  </script>
</body>
</html>
