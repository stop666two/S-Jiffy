<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gRPC JSON 互转 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .radio-row { display: flex; gap: var(--space-3); flex-wrap: wrap; margin-bottom: var(--space-2); font-size: var(--font-size-sm); }
    .radio-row label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--color-text-primary); }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">gRPC JSON 互转</h1>
    <p class="tool-desc" data-i18n="desc">在 JSON 字段驼峰命名与 gRPC/proto 风格的下划线命名之间递归互转，输出格式化 JSON。</p>
    <div class="card">
      <div class="radio-row">
        <label><input type="radio" name="direction" value="toSnake" checked> JSON 字段 → proto 风格 snake_case</label>
        <label><input type="radio" name="direction" value="toCamel"> proto → JSON camelCase</label>
      </div>
      <textarea id="inputText" class="input textarea js-focus-input" rows="10" placeholder='粘贴 JSON，例如：&#10;{"userName": "alice", "orderId": 1001, "items": [{"itemName": "book"}]}'></textarea>
    </div>
    <div id="resultBox" class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script></script>
  <script>
    (function () {
      var output = document.getElementById('outputText');
      var current = '';

      function toSnake(s) {
        return s.replace(/([A-Z])/g, function (m) { return '_' + m.toLowerCase(); });
      }

      function toCamel(s) {
        return s.replace(/_([a-zA-Z])/g, function (m, c) { return c.toUpperCase(); });
      }

      function convert(value, mode) {
        var fn = mode === 'toSnake' ? toSnake : toCamel;
        if (Object.prototype.toString.call(value) === '[object Array]') {
          var arr = [];
          for (var i = 0; i < value.length; i++) arr.push(convert(value[i], mode));
          return arr;
        }
        if (value && typeof value === 'object') {
          var out = {};
          var keys = Object.keys(value);
          for (var k = 0; k < keys.length; k++) {
            out[fn(keys[k])] = convert(value[keys[k]], mode);
          }
          return out;
        }
        return value;
      }

      function update() {
        var text = document.getElementById('inputText').value;
        if (!text.trim()) {
          output.innerHTML = '';
          current = '';
          setStatus('');
          return;
        }
        var mode = 'toSnake';
        var radios = document.getElementsByName('direction');
        for (var i = 0; i < radios.length; i++) {
          if (radios[i].checked) mode = radios[i].value;
        }
        var obj;
        try {
          obj = JSON.parse(text);
        } catch (e) {
          output.innerHTML = '';
          current = '';
          setStatus('JSON 解析失败：请检查语法（括号、引号、逗号）', 'error');
          return;
        }
        var result = convert(obj, mode);
        current = JSON.stringify(result, null, 2);
        output.innerHTML = '<pre style="margin:0;font-size:var(--font-size-sm);white-space:pre-wrap;word-break:break-all;font-family:var(--font-mono)">' + htmlEscape(current) + '</pre>';
        setStatus(t('ui.2','转换完成（') + (mode === 'toSnake' ? 'snake_case' : 'camelCase') + '）');
      }

      document.getElementById('inputText').addEventListener('input', update);
      var radios = document.getElementsByName('direction');
      for (var i = 0; i < radios.length; i++) {
        radios[i].addEventListener('change', update);
      }
      document.getElementById('copyBtn').addEventListener('click', function () {
        if (!current) return;
        copyToClipboard(current, this);
        setStatus(t('ui.1','已复制转换结果'));
      });
    })();
  </script>
</body>
</html>
