<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>观音灵签 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
.logo-text { font-size: var(--font-size-lg); font-weight: 600; }
.draw-card { text-align: center; }
.draw-tip { max-width: 540px; margin: 0 auto var(--space-3); font-size: var(--font-size-sm); color: var(--color-text-secondary); line-height: 1.7; }
.qian-stage { position: relative; width: 120px; height: 230px; margin: 0 auto var(--space-3); }
.qian-tube { position: absolute; left: 50%; bottom: 0; width: 92px; height: 170px; margin-left: -46px; border: 1px solid #5E2018; border-radius: 10px 10px 16px 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.22); z-index: 0; }
.qian-tube::before { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 9px 9px 15px 15px; background: linear-gradient(180deg, #B3442F, #A03224 30%, #8A2B1E 70%, #7C2418); }
.qian-tube::after { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 24px; border-radius: 9px 9px 0 0; background: linear-gradient(180deg, #C0533C, #A93824); box-shadow: inset 0 -4px 6px rgba(0,0,0,0.25), inset 0 2px 3px rgba(255,255,255,0.18); }
.qian-slip { position: absolute; left: 50%; bottom: 20px; width: 56px; height: 96px; margin-left: -28px; z-index: -1; background: repeating-linear-gradient(90deg, transparent 0 26px, rgba(0,0,0,0.05) 26px 27px), linear-gradient(180deg, #FDF9EF, #F6EDD8); border: 1px solid #D8C79F; border-radius: 5px; }
.qian-slip::after { content: "签"; position: absolute; top: 14px; left: 0; right: 0; text-align: center; font-size: 30px; color: #8A4A1F; font-weight: 600; }
.qian-stage.drawing { animation: stageWiggle 2.6s ease-in-out both; }
.qian-stage.drawing .qian-slip { animation: slipRise 2.6s ease-in-out both; }
.qian-stage.drawing .qian-tube::after { animation: lipPulse 0.45s ease-in-out infinite alternate; }
.qian-stage.drawn .qian-slip { animation: slipOut 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
.qian-stage.drawn .qian-slip::after { content: "✓"; color: #346538; }
@keyframes stageWiggle {
  0% { transform: rotate(0deg) translateY(0); }
  10% { transform: rotate(-5deg) translateY(-4px); }
  20% { transform: rotate(4deg) translateY(-9px); }
  35% { transform: rotate(-4deg) translateY(-13px); }
  50% { transform: rotate(5deg) translateY(-11px); }
  65% { transform: rotate(-3deg) translateY(-7px); }
  80% { transform: rotate(2deg) translateY(-3px); }
  100% { transform: rotate(0deg) translateY(0); }
}
@keyframes slipRise {
  0% { bottom: 20px; }
  12% { bottom: 84px; }
  24% { bottom: 24px; }
  36% { bottom: 96px; }
  48% { bottom: 26px; }
  60% { bottom: 106px; }
  72% { bottom: 28px; }
  84% { bottom: 114px; }
  100% { bottom: 118px; }
}
@keyframes slipOut {
  0% { bottom: 118px; opacity: 1; }
  100% { bottom: 132px; opacity: 1; }
}
@keyframes lipPulse { from { opacity: 1; } to { opacity: 0.55; } }
.result-head { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); flex-wrap: wrap; }
.qian-no { font-size: 28px; font-weight: 700; line-height: 1.2; }
.qian-name { font-size: 15px; color: var(--color-text-secondary); font-weight: 600; }
.ji-badge { display: inline-block; padding: 2px 10px; border-radius: 9999px; border: 1px solid; font-size: var(--font-size-sm); }
.jl-up { color: #2E5B31; background: #E9F1E9; border-color: #C4D8C6; }
.jl-mid { color: #8A5B00; background: #F7EFDF; border-color: #E6D5AC; }
.jl-down { color: #98302E; background: #F7E8E7; border-color: #E4C6C4; }
.qian-poem { font-size: 17px; line-height: 2; margin-bottom: var(--space-2); }
.qian-jie { font-size: var(--font-size-sm); color: var(--color-text-secondary); line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
.qian-extra-line { font-size: var(--font-size-sm); color: var(--color-text-secondary); line-height: 1.8; white-space: pre-wrap; word-break: break-word; margin-top: var(--space-1); }
.result-actions { display: flex; gap: var(--space-2); margin-top: var(--space-3); flex-wrap: wrap; }
.result-card.show { animation: fadeUp 0.45s ease-out; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.all-actions { display: flex; gap: var(--space-2); margin-bottom: var(--space-2); }
.all-list { display: none; }
.all-row { border: 1px solid var(--color-border); border-radius: var(--radius-md); margin-bottom: 8px; overflow: hidden; }
.all-head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--color-bg); border: none; cursor: pointer; font-family: var(--font-mono); font-size: 14px; color: var(--color-text-primary); text-align: left; }
.all-head:hover { background: var(--color-bg-soft); }
.all-head::after { content: "▸"; margin-left: auto; color: var(--color-text-secondary); }
.all-row.open .all-head::after { content: "▾"; }
.all-no { flex-shrink: 0; font-weight: 600; }
.all-poem { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--color-text-secondary); font-size: var(--font-size-sm); }
.all-body { display: none; padding: 12px 14px; border-top: 1px dashed var(--color-border); background: var(--color-bg-soft); font-size: var(--font-size-sm); line-height: 1.8; color: var(--color-text-secondary); white-space: pre-wrap; word-break: break-word; }
.all-row.open .all-body { display: block; }
.all-poem-full { color: var(--color-text-primary); margin-bottom: 6px; }
.all-jie { margin-top: 4px; }
.tool-note { margin-top: var(--space-4); font-size: var(--font-size-xs); color: var(--color-text-disabled); text-align: center; }
footer.tool-status { padding: var(--space-2) var(--space-3); border-top: 1px solid var(--color-border); }
  </style>
</head>
<body>
  <header class="global-header">
    <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a class="back-btn" href="../../index.html">← 返回</a>
    <span class="logo-text">S-Jiffy</span>
  </header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">观音灵签</h1>
    <p class="tool-desc" data-i18n="desc">观音灵签共一百支，供奉观世音菩萨，问事求谋、趋吉避凶，皆可一卜。</p>
    <div class="card draw-card">
      <p class="draw-tip">请先在心中默念心中所愿，心诚意正，再开始抽签。</p>
      <div class="qian-stage" id="qianStage">
        <div class="qian-tube"><div class="qian-slip"></div></div>
      </div>
      <button id="drawBtn" class="btn btn-primary">开始抽签</button>
    </div>
    <div class="card result-card" id="resultCard" style="display:none" aria-live="polite">
      <div class="result-head">
        <span class="qian-no" id="resNo"></span>
        <span class="qian-name" id="resName" style="display:none"></span>
        <span id="resJi"></span>
      </div>
      <div class="qian-poem" id="resPoem"></div>
      <div class="qian-jie" id="resJie"></div>
      <div id="resExtra"></div>
      <div class="result-actions">
        <button id="againBtn" class="btn btn-secondary">重新抽签</button>
        <button id="copyBtn" class="btn btn-secondary">复制结果</button>
      </div>
    </div>
    <div class="card">
      <div class="all-actions">
        <button id="allToggle" class="btn btn-secondary">查看全部签文</button>
      </div>
      <div class="all-list" id="allList"></div>
    </div>
    <p class="tool-note">本工具数据源自公开传统文化资料，仅供娱乐参考。</p>
  </main>
  <footer class="tool-status" id="statusBar"></footer>
  <script src="../../assets/js/global.js"></script>
  <script>
(function () {
  var CFG = {"name":"观音灵签","noLabel":"第 ","noSuffix":" 签","nameField":"name","jiField":"ji","poemField":"jieyue","poemLabel":"签诗","jieField":"qianyu","jieLabel":"签语","extra":[{"key":"xiangjie","label":"详解"},{"key":"diangu","label":"典故"}]};
  var QIAN = [{"n":1,"name":"钟离成道","ji":"上灵签","jieyue":"急速兆速年未值时观音降笔先报君知","qianyu":"此卦盘古初开天地之象，诸事皆吉也。","xiangjie":"此签家宅祈福，自身求财，秋冬大利，交易婚姻成，六甲生男，行人至，田蚕六畜好，寻人见，讼事吉，失物东北，疾病愈，山坟吉。","diangu":"汉钟离，八仙之一。汉朝时，钟离原本为将军，因失机得不到朝廷器重，辞官而进入终南山隐居修道，后来得东华帝君传授仙法而成道，为八仙之首领。又传说，他原名钟离权，唐朝时 代人，自称‘天下都散汉钟离权’。遇东华帝君后，又入崆峒三修炼，因而得道成仙，号称‘云房先生’。后皇帝诏封为太级左右宫真人。"},{"n":2,"name":"苏秦不第","ji":"下灵签","jieyue":"得忍且忍得耐且耐须待时至功名还在","qianyu":"此卦鲸鱼未变之象，凡事忍耐待时也。","xiangjie":"此签家宅不安，自身还愿，求财欠利，婚姻难，六甲作福，行人平安，田蚕吉，六畜不利，寻人见，讼和，移徙去，失物东南，病祈保，山坟吉。","diangu":"苏秦是春秋战国撕东周洛阳人，合纵论的代表人物。幼时跟随鬼谷子学习游说术，学成之后，便到各国去游说，谋个高官厚禄，可惜毫无成就，依然贫困落拓，后发愤读研姜太公兵法 ，再出来游说各国联合对抗强大的秦国。“不第”就是古时考试不及格，不被录取。"},{"n":3,"name":"董永遇仙","ji":"下灵签","jieyue":"千般用计晨昏不停谁知此事到底劳心","qianyu":"此卦燕子衔泥之象，凡事劳心费力也。","xiangjie":"此签家宅先凶后吉，自身谨防，求财有，交易成，婚姻不合，行人吉，六甲生男，蚕畜利，讼有理，寻人见，移徙安，失物见，病还头，山坟吉。","diangu":"神话故事。传说汉朝时董永因无钱葬父，卖身为奴，替人做长工。他的孝心感动了天上的仙女，私自下凡来和他结为夫妻，白天劳作，夜间织布，使他得以还债赎身，恢复自由，一年后，仙女辞别回天。"},{"n":4,"name":"玉莲会十朋","ji":"上灵签","jieyue":"淘沙见金骑龙踏虎虽是劳心于中有补","qianyu":"此卦古镜重圆之象，凡事劳心有贵也。","xiangjie":"此签家宅欠利，自身求财秋冬旺，交易允，婚姻成，行人全，寻人见，六甲祈保，蚕畜可养，讼不利，移徙守旧，失物迟见，病祈福，山坟吉。","diangu":"宋朝王十朋少时家贫，好学不倦，和钱玉莲订婚以荆钗为记。结婚后，十朋上京赴考，夫妻暂时离别，奸人孙汝权迫玉莲相嫁，玉莲不从，投河自杀，被救。同时十朋中了状元，也不肯取丞相的女儿为妻，因此被皇帝贬职，后来玉莲经过了许多波折，终于和十朋相会，夫妻重复团圆。"},{"n":5,"name":"刘晨遇仙","ji":"中灵签","jieyue":"欲望心事西方可求不如莫动立地可谋","qianyu":"此卦锥地求泉之象，凡事先难后易也。","xiangjie":"此签家宅祈福，自身求财，利交易，婚姻合，六甲安，行人迟，寻人见，田蚕宜早种，六畜损，讼宜和，移徙吉，失物不见，病禳星，山坟吉。","diangu":"东汉朝时代人。永平年间，刘晨和阮肇国二人进入天台山采药，遇二仙女，颜色绝丽，邀请刘晨和阮肇国至女家，食以胡麻饭，同结为夫妻。住了约半年，二人要求回家，到家后才知道子孙已过了七世了（约百多年时间）。二人再回去找仙女，终找不到原路。"},{"n":6,"name":"仁贵遇主","ji":"中灵签","jieyue":"食用无鱼身清喜贫待时利乐权与概人","qianyu":"此卦投岩铜鸟之象，凡事宜顺吉之兆。","xiangjie":"此签家宅不利，自身中吉，求财中吉，交易难，婚姻平平，六甲安，行人近，田蚕早种，六畜损，寻人见，移徙吉，失物见，疾病殁送，讼有理，山坟安。","diangu":"唐朝李世民皇帝时的征东大将薛仁贵，神武英勇。初年不得志，三次投军不被重用，只任火头军（厨师），打仗有功劳也是由张土贵女婿何忠宪冒领。后李世民在梦中得见薛仁贵，及至世民被盖苏文追杀，仁贵及时出现救了世民（唐太宗）。后几经挫折，仁贵才见到太宗皇帝。"},{"n":7,"name":"苏娘走难","ji":"下灵签","jieyue":"退身可得进步为难只宜守旧莫望高板","qianyu":"此卦拖泥带水之象，凡事守旧则吉也。","xiangjie":"此签家宅不利，求财秋冬吉，交易平平，婚姻六甲祈福，行人阻，蚕畜不利，寻人难，讼亏，移居吉，失物不见，病作福，山坟不利。","diangu":"苏娘是指苏英娘娘。周朝景王（公元前544――520）时，西番国王进贡了三件宝物：温凉盏、醒酒毡、能言鸟（会说话的鹦鹉），皇帝非常高兴，问谁人能逗鸟说话，结果没有人能够，只有东宫皇后苏英娘娘能逗鹦鹉说话，即刻获得皇帝赞赏，西宫皇后梅玉春十分嫉妒，怀恨在心，诬陷苏英入死罪，兴得忠臣潘葛以自己的妻子代替苏英死刑，苏英漏夜出走，逃亡中到了白马寺，生下了太子。"},{"n":8,"name":"姚能遇仙","ji":"上灵签","jieyue":"路上亨通终身有功田蚕丰熟家道兴隆","qianyu":"此卦松柏茂林之象，凡事有贵气也。","xiangjie":"此签家宅吉，自身顺利，求财中平，交易旺，婚姻成，田蚕利，六畜损，六甲生男，行人有信，寻人至，讼有理，移徙吉，失物见，病安，山坟吉。","diangu":"可惜“姚能遇仙”的故事已失传，猜多是受仙人（贵人）指点，而终有成就。"},{"n":9,"name":"孔明点将","ji":"上灵签","jieyue":"心中正直理顺法宽圣无私语终有分明","qianyu":"此卦皎月当空之象，凡事光明通气也。","xiangjie":"此签家宅吉，自身顺，求财中平，交易旺，婚姻成，六甲生男，行人动，田蚕利，六畜损，寻人至，讼有理，移徙吉，失物祈福，病得安，山坟吉。","diangu":"诸葛亮（孔明）被刘备请下山，被礼为军师。时夏侯享引兵攻打刘备，孔明随即调兵点将，准备迎战，但关公张飞都不服气。双方军队会战于博望坡，结果刘备军队大获全胜，证明了诸葛亮军事的高明策略，关张二人从此信服。"},{"n":10,"name":"庞涓观阵","ji":"中灵签","jieyue":"姻缘会遇何事不成须无限意眼前是真","qianyu":"此卦持灯觅火之象，凡事待时成就也。","xiangjie":"此签家宅欠利，自身安，求财难，交易难，婚姻合，六甲女，行人动，讼亏，田蚕秋吉，六畜难养，寻人见，移徙旧安，失物难见，病殁送，山坟中平。","diangu":"庞涓和孙膑同是春秋战国时代人，二人一起向鬼谷子学习兵法。庞涓先下山到魏国做事，掌管兵权；孙膑不久也下山会见庞涓，共为魏国服务。后来庞涓削了孙膑的双脚，使他残废。孙膑逃到齐国，被任军师，田忌任大将。孙膑令田忌带兵攻打庞涓，并排成阵势挑战，庞涓乘车观看，认得是孙膑的颠倒八门阵。结果庞涓破不了此阵，大败逃回魏国。"},{"n":11,"name":"书荐姜维","ji":"上灵签","jieyue":"有意兴变到底安然若问用事只近贵人","qianyu":"此卦因祸得福之象，凡理营谋吉利也。","xiangjie":"此签家宅大吉，自身顺利，求财有，交易成，婚姻合，六甲男，寻人见，行人未至，田蚕中平，六畜中平，公讼有理，移徙旺，失物东方， 疾病禳星，山坟吉。","diangu":"姜维是三国时人，原本为魏国战将，被诸葛亮收服，改投刘备。姜维智勇双全，最得诸葛亮（孔明）器重，孔明六出祈山，不久病于五丈原，自知命在旦夕。一日姜维入帐，孔明就将他生平所学的知识，已经著书二十四篇，计十万四千一百一十二字，内有八务、七戒、六恐、五惧之法，全部传授给姜维，希望姜维能继他之志，竭忠辅主，为国家出力。不久后，孔明去世。书荐姜维，就是《书献姜维》，"},{"n":12,"name":"武吉遇师","ji":"上灵签","jieyue":"换麻得丝系人双足要见分明因祸得福","qianyu":"此卦祸中有福之象，凡事先凶后吉也。","xiangjie":"此签家宅安，自身吉，求财有，交易宜迟，婚姻成，六甲男，行人未回，田蚕利，六畜慎吉，寻人有信，讼吉，移徙守旧，失物见，病秋吉，坟吉。","diangu":"武吉本来是砍柴的樵夫，认识了在胃水旁钓鱼的姜太公（子牙）。后来进城时误杀了人，被捉判死刑，武吉求救于姜太公，太公收他为徒弟并施法解救他。后来武吉被拜为大将，讨伐纣王。"},{"n":13,"name":"罗通拜师","ji":"中灵签","jieyue":"囚人逢赦病即安然龙门得遇名遍皇都","qianyu":"此卦龙门得遇之象，凡事有变大吉也。","xiangjie":"此签家宅祈福，自身祈福，求财秋冬吉，交易宜迟，婚姻合，寻人见，讼有理，六甲女，行人祈保，田蚕中平，六畜中平，移徙守旧，失 物东方，病安，山坟吉。","diangu":"罗通是唐初时英雄好汉，父亲叫罗成，英勇善战，十七岁时，在演武场上比武夺得帅印，领兵征伐北方的敌人，立下汗马功劳。后因迫死 屠炉公主而触怒唐太宗皇帝，被削除官职，不能娶妻。后程咬金求情，得皇帝宽赦。"},{"n":14,"name":"子牙弃官","ji":"中灵签","jieyue":"任意无虞路有亨通随心所欲逍遥如人(神)","qianyu":"此卦仙鹤离笼之象，凡事先凶后吉也。","xiangjie":"此签家宅不安，自身还愿，求财合，交易合，婚姻合，六甲生男 ，行人见，田蚕秋利，六畜损，寻人阻，公讼宜和，移徙吉，失物东南， 疾病殁送，山坟吉。","diangu":"姜子牙（姜太公）离开昆仑山后，住在宋异人家，一无所成，样样失败，时已七十二岁了，火烧琵琶精后，被推荐在纣王宫廷谋一小官做 。一天纣王要兴建鹿台以宣淫行乐，请子牙设计建造。子牙反对，同时向纣王谏了一番，因畏罪遁水而逃。弃官回到宋异人家。后来子牙到胃水钓鱼过日子，等待时机。"},{"n":15,"name":"苏秦得志","ji":"中灵签","jieyue":"若人得怨何时可伸好言不信守旧待时","qianyu":"此卦鸟鹊巢(离)林之象，凡事到底应心也。","xiangjie":"此签家宅先凶后吉，自身谨防，求财吉，交易成，婚姻阻滞，六甲男，行人顺，田蚕利，六畜旺，寻人见，讼有理，移徙远可，病还愿， 失物难见，山坟吉。","diangu":"苏秦不得志后，发奋图强，痛下决心研读太公兵法，再出来谋事。他到了燕国，见了燕文侯，说服了他联合赵国对抗强秦。文侯给了他车 马和金帛，后又说服了赵王，得到黄金千两和其他礼物。赵王请他去游说各国诸侯，联合对抗强大的秦国。苏秦因此被六国重用，封他相印，并配以宝剑。"},{"n":16,"name":"叶梦熊朝帝","ji":"中灵签","jieyue":"得处无失损中有益小人逢凶君子顺吉","qianyu":"此卦阴阳和合之象，凡事所谋皆吉也。","xiangjie":"此签家宅不利，自身秋冬吉，求财交易婚姻成，六甲虚惊，行人至，田蚕祈福，六畜平，寻人见，讼不利，移徙守旧，失物阻，病作福，坟安。","diangu":"叶梦熊是明朝嘉庆年进士，为人有胆识，忠贞爱国，万历年间，承恩在边疆地带滋扰，造成社会不安宁，可是却没有人敢前往平乱。梦熊极为愤慨，亲自上朝晋见神宗皇帝，要求领兵前往讨伐，为国效劳。"},{"n":17,"name":"曹操话梅止渴","ji":"中灵签","jieyue":"心中不定枉看经文恰似书饼食也难吞","qianyu":"此卦画饼充饥之象，凡事多虚少实也。","xiangjie":"此签家宅祈福，自身顺利，求财顺利，交易慢，婚姻阻，六甲安，田蚕宜早种，六畜不利，行人迟，寻人见，讼宜和，失物不见，移徙守旧，疾病还愿，山坟吉。","diangu":"曹操带着军队去打仗，正值天气炎热的时节，士兵们汗流浃背，口干舌燥，但却找不到一滴水喝。士兵们个个筋疲力尽，几乎连路的力气 也没有了。这时，曹操想出一个主意，下令说：前面就是一大片梅树林，到了那里就可以吃梅解渴了。士兵们听到吃梅子，口水直流。便不觉得口渴了。"},{"n":18,"name":"曹国舅为仙","ji":"上灵签","jieyue":"心中无事所作有功如弓上箭一发当空","qianyu":"此卦阴阳消长之象，凡事遂意之兆也。（金乌指太阳，玉兔指月亮）","xiangjie":"此签家宅安，自身吉，求财顺，交易成，婚姻合，六甲男，行人寻人至，田蚕早种，六畜欠安，讼有理，失物迟见，移徙吉，病拜送，山坟大吉。","diangu":"曹国舅是八仙之一，宋朝人，曹太后的弟弟。其弟不守王法，常杀死人。国舅深感耻辱，于是散尽家财，周济穷人，自己进入山林修道。 后来遇汉钟离个吕洞宾，得到指点而成仙。"},{"n":19,"name":"子仪封王","ji":"中灵签","jieyue":"急水下船险处待时若问营谋不可施为","qianyu":"此卦船行急滩之象，凡事守旧待时也。","xiangjie":"此签家宅作福，自身作福，求财未成，交易未成，婚姻不就，六甲虚惊，行人至，田蚕吉，六畜损，寻人难，讼和，移徙守旧，失物难寻，病祈福，山坟吉。","diangu":"郭子仪是唐朝大将军，也是历史上著名的大将。安禄山和史思明叛乱，郭子仪率军讨伐，常把敌人打得落花流水。六十余年征战，经过七 个皇帝，战绩累累，功劳显赫，后唐肃宗重用郭子仪，拜为副元帅；并晋封汾阳郡王，再领大军出征平乱。建中二年（公元七八一年）郭子仪病重逝世，郭寿八十五岁。"},{"n":20,"name":"姜太公遇文王","ji":"中灵签","jieyue":"神佛扶持有灾无危遂生平志到底荣归","qianyu":"此卦久雨初晴之象，凡事遂意也。","xiangjie":"此签家宅中平，自身祈福，求财未遇，交易待时，婚姻随意，六甲女，田蚕六畜阻，讼和，行人阻，寻人迟，失物见，移徙吉，病禳星，坟旧吉。","diangu":"封神榜故事。姜太公（子牙）已年近八十岁，这时，他在胃水旁垂钓，等待时机，周文王夜梦飞熊，在有贤人出现，于是亲身到胃水来访姜太公，并礼聘他辅佐治理国家，封他为‘丞相’之职。后周文王得天下八百余年，是为《周朝》"},{"n":21,"name":"李旦龙凤配合","ji":"上灵签","jieyue":"谋望从心婚姻孕男资财进益更利田蚕","qianyu":"此卦阴阳道合之象，凡事和合大吉也。","xiangjie":"此签家宅安，自身利，求财有，交易成，婚姻合，六甲男，田蚕六畜兴，行人至，寻人见，讼有理，移徙昌盛，失物得见，病遇良方，山坟大吉。","diangu":"李旦是唐高宗李治的儿子，当过皇帝，是为睿宗。武则天登位做了女皇帝后，李旦被贬为平民，其间和民女胡凤姣相识。民间传说，他们 二人手上各有半个从胎带中取出的方印，经过‘斗印’钙明能合一，而结为夫妻。现在湖北省武汉市之鹦鹉州上还有胡凤姣墓的遗迹。"},{"n":22,"name":"六郎逢救","ji":"中灵签","jieyue":"田蚕倍熟命运渐来病遇良药行人便回","qianyu":"此卦旱逢甘雨之象，凡事难中有救也。","xiangjie":"此签家宅祈保，自身安，求财颇有，交易迟，婚姻合，六甲女，行人有阻，田蚕利，六畜利，寻人难，讼亏，移徙守旧，失物西方，疾病殁送，山坟安吉。","diangu":"杨六郎，宋朝时人，名杨延昭，是杨叶的第六个儿子，故称‘六郎’。时杨叶父子军队在陈家谷被番兵围困，形势危急，杨叶头撞李陵碑 而死。杨七郎往取救兵被潘仁美用乱箭射死，只剩下六郎孤军作战，逃到胡原谷又逢番兵围攻，此时幸得杨五郎从五台山赶到，救了六郎，一同上五台山。"},{"n":23,"name":"怀德招亲","ji":"中灵签","jieyue":"商贾利益行藏有危病安讼遂尽可施为","qianyu":"此卦手扳仙桂之象，凡事必有贵人也。","xiangjie":"此签家宅欠安，自身作福，求财遂愿，交易合，婚姻阻，六甲作福，行人有危，田蚕六畜不利，寻人难，讼亏，移居欠吉，病安，山坟旧吉。","diangu":"高怀德，北宋开国功臣，出生于大将家庭，有武勇。宋太主赵匡胤黄袍加身，登位做皇帝后，高怀德就和匡胤的妹妹燕国长公主结婚，加驸马督尉，后和杨家将领兵征战大辽。"},{"n":24,"name":"殷效遇师","ji":"下灵签","jieyue":"是非莫说必须仔细心正理直方免灾危","qianyu":"此卦痴人道塞之象，凡事守旧待时也。","xiangjie":"此签家宅不安，自身险，求财阻，交易难，婚姻待时，田蚕六畜多灾，六甲祈福，行人寻人阻，讼亏，移徙吉，病急急求神，失物难见，山坟不吉。","diangu":"殷效和殷洪两兄弟都是商朝纣王的儿子。殷效被广成子收为徒弟，学习仙法，又变得三头六臂。下山时，在师傅面前发誓，要助周文王， 但走到半路被申公豹说反，欲去助作恶的父亲纣王。广成子下山劝说，师徒反脸，大战一番。后来姜子牙取得杏黄旗，在燃灯道人协助下，打败殷效，将他夹在二山之中，头露山外，广成子用犁锄犁掉他的头，以应其誓。"},{"n":25,"name":"李广机智","ji":"中灵签","jieyue":"讼终有理病得安全出入求谋古井逢泉","qianyu":"此卦古井逢泉之象，凡事贵人成就也。","xiangjie":"此签家宅平平，自身阻滞，求财阻滞，交易阻滞，婚姻和合，六甲有险，讼有理，行人寻人阻隔，田蚕六畜不利，移徙不合，失物难寻， 病祈福，坟不安。","diangu":"李广，汉朝名将，善骑射，以勇敢善战著称。汉文帝时，李广领军攻打匈奴，受了伤，被匈奴兵捉住，放在两匹马之间驱走。李广装死不 动，走了十多里路，李广觉察到有个匈奴兵骑匹好经过，即刻腾空而起，跳到匈奴兵骑马上，把他打倒，夺了他弓箭，策马扬鞭走了几十里，重集其军队，回营准备再攻打敌人。"},{"n":26,"name":"钟馗得道","ji":"中灵签","jieyue":"上下心烦求间不闲欲望功名守旧安身","qianyu":"此卦虚名之象，凡事虚多少实宜守旧也。","xiangjie":"此签家宅祈福，自身安，求财阻，交易不成，婚姻不成，六甲女，行人有信，田蚕半熟，六畜可养，寻人西方，公讼亏，移徙守旧，失物难寻，病祈保，山坟吉。","diangu":"中国古代传说人物，相传是唐朝人。生得豹头环眼，铁面虬髯，相貌丑陋，被后人奉为伏魔降妖大神，多帖在大门，以打鬼和驱除邪魔为 能事。传说钟馗文武全才，唐德宗时上京会考，状元及第，但因他生相丑恶，皇帝取消他的状元资格。钟馗愤怒之极，痛骂皇帝，随后抢过武士宝剑，自刎而死。"},{"n":27,"name":"刘基谏主","ji":"中灵签","jieyue":"改旧从新寒花遇春从前阻滞今得清心","qianyu":"此卦屋好墙壁之象，凡事稳当无险也。","xiangjie":"此签家宅安，自身吉，求财有，交易难，婚姻阻，六甲女，行人寻人迟，田蚕熟，六畜利，讼宜和，移徙吉，失物无踪，病延安，山坟守旧大吉。","diangu":"刘基字伯温，是明朝朱元璋皇帝的军师。朱元璋在应天，韩林儿在安丰自称小明王，被张士诚兵士围攻，形势危急。元璋说要亲自去解围 ，刘基劝阻，认为会面对陈友谅攻击的危险，不可出兵。元璋军队到了安丰，才知道韩林儿已被打败，在逃亡中。这次出兵，如刘基所料，元璋军队被围攻，幸亏大将军徐达和常遇春勇力杀退敌人，才得脱险。"},{"n":28,"name":"李后寻包公","ji":"中灵签","jieyue":"浮云遮月不须疑惑等待云收便见收获","qianyu":"此卦月被云遮之象，凡事昏迷未定也。","xiangjie":"此签家宅不安，自身祈保，求财阻，交易吉，行人滞，田蚕六畜不利，婚姻不合，六甲有惊，寻人难，讼亏，移徙守旧，失物西方，病难痊，山坟改。","diangu":"宋朝真宗皇帝有刘、李二妃。李妃怀孕产子，被刘妃以狸猫换太子手法陷害，被打入冷宫受罪。十多年后，李妃因日夜哭泣，在痛苦中过日子，最后双目失明。她听说包公是位公正廉洁的好官，几经辛苦，终于在天齐庙寻到包公，提出伸冤。"},{"n":29,"name":"赵子龙救阿斗","ji":"中灵签","jieyue":"宝剑出匣光辉万里贵人指引无不欢美","qianyu":"此卦宝剑出匣之象，凡事有威有势也。","xiangjie":"此签家宅祈福，自身吉，求财利，交易成，婚姻好，六甲生女，行人滞，田蚕宜早，六畜损，寻人见，讼和，移徙兴，失物南方，病还旧愿，山坟吉。","diangu":"赵云，字子龙，常山人，为刘备的猛将。时曹操欲下江南，先攻先主刘备于莘野，先主走樊城，复败于当阳，家眷失散。子龙于土墙下遇縻夫人，夫人将子阿斗托云，云将马授夫人，夫人不肯授，投井而死，云哭埋毕，怀抱阿斗，杀死曹军十多员大将，冲出重围，遇张飞在长板坡接应，救出了阿斗。"},{"n":30,"name":"棋盘大会","ji":"中灵签","jieyue":"闭口合齿他事莫理若有亏心到头害己","qianyu":"此卦安份守己之象，凡事小心谨防也。","xiangjie":"此签家宅安，自身平平，求财待时，交易滞，婚未许，行人寻人阻隔，六甲虚惊，田蚕六畜不利，移徙守旧，失物不见，病难痊，山坟大吉。","diangu":"唐太宗时，薛仁贵东征回来不久，又领兵西征苏宝同，被困于西唐的地方，二路元帅薛丁山（仁贵之子）与母柳氏（金定）妹金莲和程咬金等同往解围。大军到了棋盘山，遇到窦一虎劫粮，被丁山战败。窦一虎之妹窦仙童下山战薛丁山兄妹，用仙法生擒薛丁山。金莲回营报讯，程咬金知道仙童与丁山相爱，说服了柳金定，结果薛丁山与窦仙童，窦一虎与薛金莲各成亲，结为夫妻，皆大欢喜，然后一同赴西唐解薛仁贵之围。"},{"n":31,"name":"佛印会东坡","ji":"中灵签","jieyue":"守旧安然叩问神仙直待时来事亦偶然","qianyu":"此卦守旧安然之象，凡事待时则吉也。","xiangjie":"此签家宅祈保，自身安，求财守待，交易宜迟，婚姻合，行人至，讼和，六甲生女，田蚕秋熟，六畜稳，寻人难，移徙吉，失物虚，病殁送，山坟吉。","diangu":"宋朝大诗人苏东坡有七个妻妾，最小的叫朝云。有一年寒冻的一天，佛印禅师来造访苏东坡，二人许久没相见，一谈就谈几个小时，越谈 越高兴。夜深了，东坡就叫朝云去服侍师傅。佛印叫朝云准备了一个水壶，七个火炉，葵扇和火炭等东西，搬到房间来，并叫朝云起火，然后把水壶放在第一个火炉上煮，水滚了 ，又放在第二个火炉上，然后第三个火炉，至到第七个火炉，如照做几遍，直到天亮，佛印在床上入定。突然，卜的一声，水壶里的水烧干而爆裂了，佛印叫朝云不必怕，回去睡觉好了。第二天，朝云将昨夜的事告诉了东坡。东坡终于觉悟到佛印警告他：五欲不断，一定堕落。后来，佛印希望他顿悟人道，息心修行，他说：人生一世间，如白驹过隙，三、二十年，功名宝贵，转眼成空，课不一律勾断，寻取自家本来面目？"},{"n":32,"name":"刘备求贤","ji":"中灵签","jieyue":"宝在石中异人少知直待分明尽可施为","qianyu":"此乃剖石见玉之象，凡事著力成功也。","xiangjie":"此签家宅平平，自身安，求财劳力，交易阻，婚姻成，六甲虚，行人杳，田蚕晚成，六畜旺，寻人见，公讼惊，移徙改，失物西方，疾病欠安，山坟改向吉。","diangu":"刘备求贤(三顾草庐)，三国时，诸葛亮，字孔明，汉末避居南阳。诸葛亮隐居于隆中之茅屋，志学清修，养生之道，研究奇明门遁法，天 文术数，卦算韬略，无所不精。初不求闻达于诸侯，后徐庶荐于刘备。先主刘备与关张三往问计，延为军师。先主即位，拜丞相，受以托孤，后主封为武卿侯。谕有宝心安，得意 迟早，静待时机，不请自来。"},{"n":33,"name":"咬金聘仁贵","ji":"中灵签","jieyue":"内藏金玉何必外寻遇贵指引不须劳心","qianyu":"此卦藏玉外觅之象，凡事待时可也。","xiangjie":"此签家宅祈保，自身安，求财守待，交易迟，婚姻就，六甲男，行人阻，田蚕半熟，六畜旺，寻人劳，讼搁，移徙吉，失物北方，病遇良医，山坟宜改。","diangu":"程咬金是唐朝开国元老，薛仁贵是唐太宗时大将，初时，薛仁贵二次投军都被张士贵阻挠，不被录取。这天仁贵在山上午睡，突然发现咬金路遇被虎追，仁贵赶上，打伤老虎，救了咬金。咬金欣赏仁贵武功，并给他金令箭一支，叫他去投军。第三次投军仍被张士贵欺骗，只当火头军（厨师）。"},{"n":34,"name":"桃园结义","ji":"中灵签","jieyue":"心中无事秋水澄清不须疑惑事自然成","qianyu":"此卦红日当空正照之象，凡事遂意也。","xiangjie":"此签家宅清吉，自身安，求财虚，交易难，婚姻合，六甲有险，行人阻，田蚕不利，六畜衰，寻人滞，讼亏，移徙守旧，失物虚，病殁送，山坟大吉。","diangu":"汉献帝时，天下混乱，盗贼蜂起。刘备（玄德）关羽（云长）张飞（翼德）三人志同道合，在张飞家的桃园结拜为义兄弟，刘备为始，关 羽次之，张飞为弟，三人誓说：同心协力，扶危救困，上报国家，下济黎庶。后来三顾茅庐，礼请诸葛亮下山辅佐中兴汉室，从此崭露头角，刘、关、张、三兄弟名留青史。"},{"n":35,"name":"唐僧取经","ji":"中灵签","jieyue":"不用忧疑自有佳期若问前程前路可宜","qianyu":"此卦衣冠重整之象，凡事先难后易也。","xiangjie":"此签家宅乱，自身吉，求财好，交易利，婚姻阻，六甲惊，行人寻人至，田蚕不利，六畜兴，讼有理，移徙安，失物迟见，病祈福安，山坟宜旧。","diangu":"唐僧就是唐三藏（玄奘）法师，奉太宗皇帝命令，往西天（印度）取佛经，以宏扬佛教于东土。后来经过千辛万苦，行程十万八千里，成功取得经典回国。西游记故事，有悟空、猪八戒、沙僧三人协助唐僧往西天取经，历经九九八十一灾难，终于大功告成，功德圆满。"},{"n":36,"name":"湘子遇宾","ji":"中灵签","jieyue":"脱除了事且自宽心待得时来堪寻正路","qianyu":"此卦猿猴脱锁之象，凡事先难后易也。","xiangjie":"此签家宅不安，自身安，求财大利，交易待时，婚姻未成，行人寻人至，六甲祈福，田蚕十足，六畜平，讼有理，移徙吉，失物远，病欠安，山坟吉。","diangu":"韩湘子和吕洞宾都是八仙人物。韩湘子是唐朝人，幼而落拓，不读书，好饮酒，后被吕洞宾引渡，同入山修道，成为八仙之一。又传说， 韩湘子是大文学家韩愈（文公）的侄子，韩愈不信佛道，湘子时而点化他，要他悟道。后引渡文公仙去。"},{"n":37,"name":"李靖归山","ji":"中灵签","jieyue":"静处安身待命守时动惹非福守旧无疑","qianyu":"此卦风摇灯烛之象，凡事守常则吉也。","xiangjie":"此签家宅守旧，自身平平，求财有，交易难，婚姻不合，六甲祈保，讼和，行人有信，田蚕秋熟，六畜安，寻人见，移徙守旧，病禳星，山坟勿改。","diangu":"李靖就是封神榜里哪吒三太子的父亲，又叫“托塔李天王”，李靖父子协助姜子牙（太公）打败纣王后，建立周朝，武王正式登基。姜子牙于是设封神榜，进行封神仪式，以安定在战斗中死亡将士的亡魂。从此四海升平，天下安宁。武王要封侯行赏，又要分封土地给开国功臣。李靖父子等七人要求归山修道，不要恋栈世间的功名利禄。后来七人都“肉身成圣”，位列仙班。"},{"n":38,"name":"何文秀遇难","ji":"下灵签","jieyue":"家道忧凶人口有灾祈福保庆犹恐破财","qianyu":"此卦云雾遮月之象，凡事未遂守旧也。","xiangjie":"此签家宅不安，自身祈保，求财难，交易待时，婚姻难合，六甲虚惊，行人阻，田蚕六畜损，寻人遇，讼和，移徙安，失物虚，病延安，山坟宜修。","diangu":"穷书生何文秀同富家女王琼珍相爱，出奔海宁，何文秀被土谊陷害，王琼珍剪发毁容，历经各种痛苦灾难，坚不再嫁，二人终得重聚，结为夫妻。"},{"n":39,"name":"姜女寻夫","ji":"下灵签","jieyue":"千般用计徒劳无功不如守旧着甚来由","qianyu":"此卦守常安静之象，凡事守己则吉也。","xiangjie":"此签家宅安，自身提防，求财平平，交易阻，婚姻不合，六甲女，行人动，田蚕利，六畜损，寻人难，讼亏，移徙平，失物空，病殁送安，山坟大吉。","diangu":"秦始皇为了防卫国土，动用了五十万农民，在北方建筑长城，万喜良和孟姜女是对新婚夫妇。丈夫被召去建长城，多年不回家，亦无音信 ，孟姜女为了寻找丈夫，千山万水，走到了人们在建长城的地方，她知道丈夫在工作中死了，悲痛万分，号啕大哭，哭声震动大地，连长城也在这时倒塌了一段。"},{"n":40,"name":"武则天登位","ji":"中灵签","jieyue":"阴利女人不宜男子若是求谋先凶后吉","qianyu":"此卦阴长阳消之象，凡事先难后易也。","xiangjie":"此签家宅不利，自身祈福，求财守待，交易吉，婚姻不合，田蚕六畜旺，六甲虚，行人阻，寻人隔，讼亏，移徙大吉，失物空，病有惊，山坟大吉。","diangu":"武则天是中国历史上唯一的女皇帝。唐高宗（太宗之子）即位不久，她就做了皇后。高宗病死，她以太后身份临时执政，公元六九○年，她六十七岁时，正式登位做女皇帝，改国号为‘周’。她只做了十五年皇帝，八十二岁高龄，被迫退位，由李氏复兴唐朝。"},{"n":41,"name":"董卓收吕布","ji":"中灵签","jieyue":"只这一着君子莫错牢记在心不生寂寞","qianyu":"此卦认贼做子之象，凡事认假作真也。","xiangjie":"此签家宅不安，自身平常，求财守待，交易难，婚姻未合，行人寻人至，六甲男惊，田蚕半熟，六畜安，讼宜和，移徙祈保，病禳星，山坟中平。","diangu":"董卓是东汉末年的大军阀，他残忍暴戾，独断独横，杀人不眨眼。到了长安，又搜刮民财，强取豪夺，令人民愤怒。吕布是个骁勇异常的年轻人，但没有品德，有勇无谋。董卓以一匹良马和许多金钱收买了吕布归顺，后来又认吕布为义子。吕布在凤仪亭调戏董卓爱妾貂禅，导致二人结怨，董卓终被吕布所杀。"},{"n":42,"name":"目莲救母","ji":"上灵签","jieyue":"天皇恩降始终莫忘晨昏礼佛可宜烧香","qianyu":"此卦天垂恩泽之象，凡事成就大吉也。","xiangjie":"此签家宅祈福，自身冬吉，求财未有，交易成，婚姻中吉，六甲平安，行人动，田蚕六畜中平，寻人见，讼胜，移徙守旧，失物空，病解，山坟安。","diangu":"目莲是佛门的尊者，有神通。他的母亲作恶多端，死后在地狱的鬼道受苦，目莲没法救渡母亲，求助于佛祖，也没办法。佛祖唯有叫目莲设兰盆会，供养十方僧侣，并由诸天菩萨施法，救渡地狱中的母亲。由是农历七月十五日为盂兰节，亦即孝亲节。后又演变为七月的“中元普渡”。"},{"n":43,"name":"行者得道","ji":"上灵签","jieyue":"天生万物谋望皆通福德相助瑞气匆匆","qianyu":"此卦天地交泰之象，凡事大吉无危也。","xiangjie":"此签家宅吉，自身安，求财有，婚姻合，六甲生男，行人有阻，田蚕六畜中平，寻人见，讼胜，移徙利，失物东西，病禳星，山坟东西吉。","diangu":"行者就是孙悟空，初时飘洋过海，从花果山到三星洞向菩提祖师学道。悟空心窍玲珑，学功夫却诸多挑剔，祖师因此生气，罚打手心三下 ，他就悟出祖师暗示，半夜三更从后门摸到祖师塌前，要求传道，因而学得七十七变化等神通及长生不老之术。"},{"n":44,"name":"姜维邓艾斗阵","ji":"中灵签","jieyue":"欲求心事恰如围棋到底胜败宜用心机","qianyu":"此卦棋逢敌手之象，凡事用机关则吉也。","xiangjie":"此签家宅大利，自身平稳，求财遂，交易利，婚姻未合，行人寻人阻，六甲女，田蚕平，六畜损，讼宜和，移徙守旧，失物空，病祈保，山坟守旧。","diangu":"三国故事：姜维是蜀国猛将，邓艾是魏国（司马昭）大将，姜维出兵伐魏，双方军队会师于祈山之前。首先姜维摆了阵势，乃是诸葛亮之法，邓艾以十万兵士冲击，皆被打败，次日，姜维摆八卦阵，邓艾也摆八卦阵，复变为八八六十四门户，姜维军进入阵内，变为长索卷地阵，邓艾不能破，被困在中间，幸得司马望赶来救出。"},{"n":45,"name":"仁宗认母","ji":"上灵签","jieyue":"天地有感应验非常佛神护佑得之莫忘","qianyu":"此卦积善温柔之象，凡事贵人和合也。","xiangjie":"此签家宅吉，自身安，求财遂，交易利，婚姻合，六甲男，行人阻，讼胜，田蚕秋利，六甲中平，寻人见，移徙利，失物东方，病祈福，山坟东西向吉。","diangu":"宋朝真宗的李妃生下了太子，被刘妃和郭槐合谋陷害，以一只狸猫换掉太子，李妃因此被打入冷宫受，后又逃到赵州桥，住在寒窑，过着 痛苦生活，日夜哭泣，终致双目失明。刚出生的太子幸得被太监陈琳和宫女寇珠救出，秘密寄养八王爷家中，终为八王爷第三儿子，取名赵桢。六岁时，因真宗无子，又被送到宫 中留养，太子聪明灵活，很得真宗宠爱，册封为太子，真宗归天，台子即位，是为仁宗。十八年后，李后（李妃）在天齐庙寻到包公，提出伸冤，英明的包公，探讨了事情的真相 ，决心设法平反，使皇帝母子相会。仁宗于是在八王爷等安排下，在南清宫会见了李后，母子相认，抱头痛哭。"},{"n":46,"name":"渭水钓鱼","ji":"中灵签","jieyue":"守旧守旧事自成就动则多殃静则无咎","qianyu":"此卦枯木生花之象，凡事自有成就也。","xiangjie":"此签家宅安，自身吉，求财待时，交易成，婚姻就，六甲生女，行人阻，田蚕五分，六畜难，寻人杳，讼吉，移徙守旧，失物空，病求福 ，山坟吉。","diangu":"姜子牙火烧琵琶精后，在朝歌谋事，不久弃官，别了妻子马氏，土遁救了居民，一个人到渭水钓鱼过日子。子牙一意守时侯命，不管闲非 ，日诵《黄庭》，悟道修真。苦闷时，持丝轮倚绿柳而垂钓。后来周文王夜梦飞熊，亲自到渭水礼请子牙出来治国，并封为丞相，时子牙已近八十岁了。姜子牙即姜太公。钓鱼地点：今陕西省宝鸡番溪河畔。"},{"n":47,"name":"梁灏登科","ji":"上灵签","jieyue":"守旧变新名就功成遂平生志尽皆是命","qianyu":"此卦锦上添花之象，凡事大吉大利也。","xiangjie":"此签家宅祈保，自身安，求财利，交易阻，婚姻合，六甲生男，行人阻，田蚕八分，六畜平，寻人至，讼宜和，移徙吉，失物西北，病作福，山坟利。","diangu":"梁灏是北宋时代山东人，字太素。雍熙年（宋太宗）进士，二十三岁登科状元。后人传说梁灏八十岁中状元。"},{"n":48,"name":"韩信挂帅","ji":"中灵签","jieyue":"鲲化为鹏万禽不能桂香一折福禄自增","qianyu":"此卦鲲鹏兴变之象，凡事有变动大吉也。","xiangjie":"此签家宅利，自身吉，求财秋旺，交易迟，婚不合，六甲安，行人阻滞，田蚕中平，六畜春利，寻人见，讼胜，移徙守旧，失物西，病祈福，山坟安。","diangu":"韩信是汉朝初年三杰之一。贫农出身，初在项羽（楚霸王）军中，不得志。后归刘邦，丞相萧何发现韩信很有才华，三番四次推荐他为元帅，但刘邦不肯。韩信在失望之下，骑马出走。萧何知道了，即刻策马星夜追赶韩信回来，这次说服了刘邦，封他为元帅，并设坛举行隆重挂帅仪式。韩信将兵，多多益善，证明了他的军事才华。后被吕后所杀。"},{"n":49,"name":"王祥求鲤","ji":"中灵签","jieyue":"水结成冰冰消成水若是营谋到底如是","qianyu":"此卦水结成冰之象，凡事不用枉求也。","xiangjie":"此签家宅不安，自身祈保，求财难，交易阻，婚姻不合，六甲险，行人迟，田蚕亏，六畜损，寻人见，讼和，移徙守旧，失物空，病难痊，山坟大吉。","diangu":"王祥是晋朝时代人，古代孝子之一，他十分孝顺父母，村里人人称赞他的孝顺行为。母亲死后，父亲再娶，继母对待王祥非常刻薄，一天继母生病，要吃鲤鱼，叫王祥去找，进值冬天，天寒地冻，鱼儿都躲在冰底下了，王祥找不到鱼，只好睡在冰河上，因其孝心感动了天，鲤鱼破冰而出，王祥终有所获。"},{"n":50,"name":"陶朱归五湖","ji":"中灵签","jieyue":"自在悠游不须着力财禄重重无不欣美","qianyu":"此卦顺风撑船之象，凡事皆顺大吉也。","xiangjie":"此签家宅利，自身吉，求财利西，交易宜迟，婚姻不合，六甲安，行人阻，田蚕秋利，六畜春旺，寻人至，讼亏，移徙守旧，失物西方，病解，山坟南吉。","diangu":"陶朱公原名范蠡，春秋时代人，初和越王勾践做事，后来发现勾践是个只能共患难不能共享安乐的人，就毅然离开了他，坐船飘行到五湖去了。到了齐国叫陶的地方，他改名为陶朱公，从事耕种和做买卖生意，不久积蓄了许多钱，成为巨富。"},{"n":51,"name":"孔明入川","ji":"上灵签","jieyue":"进退莫疑自有佳期营谋用度不须妄为","qianyu":"此卦人人愁热之象，凡事随心从意也。","xiangjie":"此签家宅祈福，自身谨防，求财秋吉，交易平常，婚姻合，六甲生男，行人动，田蚕损，六畜平，寻人见，讼吉，移徙旧，失物北方，病还愿，山坟吉。","diangu":"益州（西川）由刘璋占据，北方张鲁要攻打西川，刘璋大忧，在谋臣张松的大力劝说下，刘璋答应让刘备进驻西川，帮助他抵抗张鲁。部 下极力反对，但刘璋坚决要请刘备到来，因刘备是同宗，绝无恶意。因此是年冬月，孔明和刘备率领军队进入西川。西川最后归刘备。"},{"n":52,"name":"太白醉捞明月","ji":"中灵签","jieyue":"言语难思费力劳心宅中忧恼待遇贵人","qianyu":"此卦贪求费力之象，凡事劳心费力也。","xiangjie":"此签家宅不安，自身欠安，求财中平，交易难，婚姻未就，六甲祈保，行人有灾，田蚕五分，六畜衰，寻人至，讼和，移徙平常，病祈保 ，山坟吉。","diangu":"李太白是唐朝诗仙，写了许多诗和文章，流传后世。太白喜欢喝酒，被称为酒仙。六十二岁死，传说当时他喝得酩酊大醉，走上船去，看见水里有月，他跳下水去捞月，结果溺死，后来人有说看到飞来一条鲸鱼，上面骑着一位白衣仙人，飞到天上月宫去了，那白衣仙人就是李太白。"},{"n":53,"name":"刘备招亲","ji":"中灵签","jieyue":"教去即去教住即住自有亨通到头必利","qianyu":"此卦龙吟虎啸之象，凡事顺意有望也。","xiangjie":"此签家宅不安，自身欠吉，求财中平，交易难，婚姻成就，六甲祈保，行人至，寻人至，田蚕五分，六畜损，讼和，移徙吉，失物见，病安，山坟吉。","diangu":"三国时，蜀主刘备因借荆州不还，东吴周瑜向孙权献计，把孙权的妹妹嫁给刘备，但一定要刘备过江来招亲，然后把刘备软禁起来不放。可是刘备得到孔明的锦囊妙计，又有赵子龙保护着，在江东招亲，安然无事。过了一些日子，说服了孙夫人，不辞而别，离开东吴。"},{"n":54,"name":"马超追曹","ji":"下灵签","jieyue":"物在水中形影长短皆有分定不用商量","qianyu":"此卦梦中得宝之象，凡事枉费心力也。","xiangjie":"此签家宅欠安，自身谨防，求财阻，交易难，婚姻待时，田蚕六畜滞，六甲祈保，行人迟，讼亏，移徙吉，失物空，病求神佑，山坟不安。","diangu":"三国时，马超驻守西凉洲，获悉父亲马腾被曹操杀害，即刻起二十万大军，直奔长安，攻打曹操。西凉兵攻克长安，再捣潼关。马超遇到曹操，仇人相间，分外眼红。双方展开激战西凉兵勇猛异常，曹军大败，曹操在乱军中逃命，马超追赶，士兵们高喊捉拿曹操。为了不被认出，曹操至好脱下锦袍丢掉，有用剑割短了胡须，骑着马向前狼狈逃窜，这时幸得曹洪赶到相救，曹操终于得命走脱。"},{"n":55,"name":"周武王登基","ji":"中灵签","jieyue":"接竹引泉流传不绝君子谋望无不欣悦","qianyu":"此卦接竹引泉之象，凡事谋望大吉也。","xiangjie":"此签家宅欠安，自身还愿，求财利，交易成，婚姻合，行人动，寻人难，六甲平安，田蚕吉，六畜损，讼有贵人，移徙吉，失物见，病禳星，山坟安。","diangu":"周武王（文王之子）在尚父姜子牙辅助下，击败了可恶的纣王，纣王在摘星楼上焚火自杀，结束商朝统治。子牙（太公）于是建设楼台，拜祭天地，周武王正式登王位，是为周朝元年壬辰。次日又设鹿台，将钱财分散给人民，以资庆祝。周朝在历史上有八百年的统治。"},{"n":56,"name":"禄山谋反","ji":"中灵签","jieyue":"营谋用事劳心费力守旧待时凡事大吉","qianyu":"此卦船行小滩之象，凡事有贵人助也。","xiangjie":"此签家宅安，自身吉，求财中平，交易利，婚姻遂意，六甲男，行人至，田蚕秋利，六畜损，寻人至，讼有理，移徙吉，失物滞，病即安，山坟宜修。","diangu":"安禄山是唐玄宗时人，骁勇善战，被升为都督。当时朝政腐败无能，安禄山就是从山西省造反，攻打洛阳，再攻下潼关，皇帝逃走到四川。安禄山在长安大肆烧杀抢掠，人民激烈反抗。最后安禄山被自己的儿子杀死。"},{"n":57,"name":"董仲寻亲","ji":"中灵签","jieyue":"所作谋望皆大欢喜从公用力如子逢娘","qianyu":"此卦孩儿见母亲之象，凡事贵人大吉也。","xiangjie":"此签家宅不安，自身平平，求财顺，交易成，婚姻合，六甲女，行人阻，田蚕就，六畜损，寻人难，讼宜和，移徙守旧，失物空，病祈福，山坟吉。","diangu":"神话故事，传说董仲是汉朝董永的儿子，是天上仙女下凡来和董永结合而生下来的。他学得仙法，会飞天，因此到天上去寻找母亲。又传说董仲因感于没有母亲，于七月七日这一天，到太白山上去找，仙女出现，董仲终于见到母亲。"},{"n":58,"name":"文王问卜","ji":"中灵签","jieyue":"得住且住可取且踞莫宜别事只宜守旧","qianyu":"此卦守常待时之象，凡事守旧则吉也。","xiangjie":"此签家宅平常，自身不利，求财吉，交易成，婚姻阻，六甲惊，行人迟，田蚕五分，六畜损，寻人见，讼亏，移徙守旧，病欠安，失物凶，山坟宜改。","diangu":"周文王建造灵台，以占风侯，看验民灾。当晚他太疲倦了，睡在灵台上，时至三更半夜，梦见一双白额猛虎，肋生二双翅膀，飞入帐中，文王惊醒，第二天问卜吉凶，卜后来文王在渭水得遇姜太公。封神演义。"},{"n":59,"name":"张良隐山","ji":"中灵签","jieyue":"如醉饮酒只宜守旧直待时来无灾无咎","qianyu":"此卦守旧随时之象，凡事待时则吉也。","xiangjie":"此签家宅祈福，自身安，求财平常，交易成，婚姻不合，行人至，寻人阻，六甲作福，田蚕半吉，六畜大利，讼亏，移徙吉，失物凶，病祈福，山坟吉。","diangu":"汉朝时候，张良辅助刘邦取天下，打败西楚霸王项羽，建立了汉朝。张良知道刘邦此人，打仗时，称兄道弟，非常友善，可是得了天下就要杀功臣，变成了暴戾的皇帝。为了保全性命，他立刻隐退，不知所踪，据说跟亦松子（仙人）游山玩水去了。"},{"n":60,"name":"赤壁鏖兵","ji":"下灵签","jieyue":"千般用计不如莫动一旦相惹恐祸归身","qianyu":"此卦抱薪救火之象，凡事亦自谨防也。","xiangjie":"此签家宅凶，自身祈保，求财微微，交易难，婚姻不合，六甲险，行人滞，田蚕不利，六畜损，寻人杳，讼亏，移徙吉，失物西方，病有惊，山坟平平。","diangu":"曹操大军驻扎在赤壁江岸旁，兵士多为北方人，不谙水性。周瑜要破曹操大军，苦无良策，幸得孔明祭东风，黄盖引火在三江口火攻曹操 连环铁船，二方军队在赤壁下激烈水战，一片火海，曹军死伤不计其数。曹操带了一只败兵往陆地逃亡，走向鸟林。三国故事。"},{"n":61,"name":"苏小妹难夫","ji":"中灵签","jieyue":"佳人在屋吟唱诗曲一片欢心命中祸福","qianyu":"此卦守旧随时之象，凡事待时吉利也。","xiangjie":"此签家宅安，自身吉，求财顺，交易利，婚姻成，六甲女，行人寻人至，田蚕熟，六畜旺，讼有理，移徙吉，失物凶，病即痊愈，山坟大吉。","diangu":"传说苏小妹是宋朝大文学家苏东坡的妹妹，博学多才，民间故事流传很多，她和诗人秦少游结婚之夜，故意以诗歌、对联来刁难新郎，幸得苏东坡从中暗助，少游才得过关。古今奇观。"},{"n":62,"name":"唐僧得道","ji":"中灵签","jieyue":"平平稳稳四方名显改旧从新亦无凶险","qianyu":"此卦神佛暗佑之象，凡事忍耐大吉也。","xiangjie":"此签家宅安，自身吉，求财西方，交易遂，婚姻成，六甲祈福，行人阻，田蚕七分，六畜利，寻人西方，讼亏，移徙守旧，失物见，病祈福，山坟吉。","diangu":"唐僧（唐三藏）和孙悟空、猪八戒、沙僧，师徒四人往西天取经，走到了一条大河旁，不远就是佛祖的灵山了，但见河水滚浪飞流，十分 惊险，独木桥上写着‘凌云渡’三字，唐僧不敢走独木桥，突然佛祖化身船夫，撑只无底破船来渡唐僧，悟空将唐僧一推，跌落河中，被船夫救起，这么一来，唐僧就已脱胎换骨 ，超凡入圣，得正佛道了。"},{"n":63,"name":"女娲氏炼石","ji":"中灵签","jieyue":"福是禄基禄是福种说得分明切宜守谨","qianyu":"此卦海中寻针之象，凡事费心劳力也。","xiangjie":"此签家宅欠利，自身谨防，求财有，交易成，婚姻不合，六甲阻，行人滞，田蚕吉，六畜莫养，寻人难，讼宜和，移徙宜迁，失物凶，病难痊，坟暂安。","diangu":"女娲氏是传说中的人物。传说，上古时代，共工氏和祝融氏是天上的二个巨人，有一天，二人打起架来，惊天动地，造成了很大的破坏，连天也被打破个洞，不停的流下水来。女娲氏是位女神，她在山上拣了许多五色石，用火烧成石浆，把天上的窟窿给补好了。女娲氏拣石补天。上古传说故事。"},{"n":64,"name":"马前覆水","ji":"下灵签","jieyue":"屋下安身祸从天降早觉先防免遭其殃","qianyu":"此卦鱼遭罗网之象，凡事亦宜提防也。","xiangjie":"此签家宅凶，自身险，求财虚，交易中平，婚姻不合，六甲惊，行人有阻，田蚕损，六畜衰，寻人杳，讼亏，移徙吉，失物凶，病有灾险，山坟宜改。","diangu":"汉朱买臣年轻时贫苦，他的妻子嫌他穷而抛弃他，别嫁他人。买臣发愤读书，求取功名，经年后买臣官至会稽太守，其妻要求再和，买臣骑在马上把水倒在地下，叫妻子再收回来，表示不可能的事。"},{"n":65,"name":"孙膑困庞涓","ji":"下灵签","jieyue":"知止则止知宽自宽割自身肉疾痛一般","qianyu":"此卦割肉成疮之象，凡事只宜守旧待时。","xiangjie":"此签家宅不安，自身口舌，求财不利，交易小人，婚姻不长，六甲有惊，行人阻，田蚕六畜损，寻人招非，讼亏，移徙守旧，失物难寻，病反覆。","diangu":"孙膑为了要报被庞涓削了双足之仇，到了齐国，领兵攻打魏国的庞涓。双方交战后，孙膑佯作败退，引诱庞涓进入幽谷，当晚庞涓进入幽谷，道路狭窄，两旁多阻隘，庞涓被困其中，到了马陵，孙膑军队夹道埋伏，并且万箭齐发，大败魏军，庞涓无路可逃，自知大势已去，就在大树下自杀身亡。"},{"n":66,"name":"霸王被困","ji":"下灵签","jieyue":"守旧待时安静无咎不用求谋自在悠游","qianyu":"此卦船破下滩之象，凡事险阻提防也。","xiangjie":"此签家宅忧疑，自身灾耗，求财破失，交易败，婚姻不长，六甲危险，行人阻，田蚕六畜损，寻人杳，讼亏，移徙莫动，病即殁送，山坟不利。","diangu":"楚霸王（项羽）有一支强大的军队，战无不胜，刘邦的军队也很强大，但不及项羽，项羽多次征战胜利后，就自以为天下无敌了。后来和刘邦开战，项羽被刘邦军队包围在垓下，四面楚歌，军心大动摇。项羽被困在帐中，心情恶劣，饮酒解愁。在绝望中，项羽冲杀出重围，逃到乌江旁，因感到无颜见江东父老，拔剑自杀。"},{"n":67,"name":"金星试窦儿","ji":"上灵签","jieyue":"心平正直到底清平只依本份天下太平","qianyu":"此卦心平正直之象，凡事安稳无凶也。","xiangjie":"此签家宅安，自身平，求财守慎，交易稳，婚姻合，六甲男，行人有信，田蚕稳，六畜安，寻人迟见，讼和，移徙守旧，失物见，病禳星，山坟平。","diangu":"窦燕山因行善积德，后生五子，一门显贵。五子名为窦伦、窦信、窦仁、窦仪、窦偃。一日窦仪投宿某客栈，上天要试窦仪的心，于是派遣金精化为女子，诈称临家少女，夜扣窦仪房门，窦仪闭户不纳，此女以投水自尽相要挟，窦仪终不为所动，开门拔剑追女，女子化做一道金光进入地下，窦仪掘地底金一锭。 应为‘金精试窦儿’以度探窦仪之诚。今河北省涿县窦店就是窦家故籍。"},{"n":68,"name":"郭汾阳祝寿","ji":"中灵签","jieyue":"春深日暖百花自开事莫迟疑从人显达","qianyu":"此卦春梦百花之象，凡事贵人大吉也。","xiangjie":"此签家宅旺，自身安，求财春旺，交易遂，婚姻成，六甲防惊，行人到，田蚕利，六畜旺，寻人至，讼胜，移徙如意，失物急寻，病安，山坟大吉。","diangu":"郭汾阳即郭子仪，因受封汾阳王，故称郭汾阳，其第六个儿子，和皇帝的女儿结婚，夫妻并不和谐。一年，郭子仪做大寿，亲戚朋友都来拜寿，独其媳妇不肯拜，因为她是皇帝的女儿。为了此事，夫妻争吵一番，媳妇投高皇帝，子仪于是见皇帝要求赦罪，但是皇帝宽宏大量，认为是家庭琐事，不予计较。"},{"n":69,"name":"梅开二度","ji":"中灵签","jieyue":"一箭射空当空不空待等春来彩在其中","qianyu":"此卦梅花占魁之象，凡事宜迟则吉也。","xiangjie":"此签家宅欠利，自身作福，求财谨慎，交易待时，婚姻迟成，行人迟至，六甲春实秋虚，寻人见，田蚕六畜旺，讼亏，失物东方，病虚惊，坟宜改。","diangu":"唐朝时代，梅魁被奸臣宰相害死，儿子梅良玉被救，改名王喜童，进住陈日升的家。梅魁是日升好友，一天，梅花盛开，陈公借梅花拜祭 梅公，祈求有日梅公后代能出人头地，为父报仇。当晚梅花皆被风雨打落，陈公和女二杏元、良玉于是拜求上天再一次梅花盛开，诚心感动了上天，第三天果然见到满园梅花盛开 ，香气袭人，梅开二度，成为千古佳话，后来，梅良玉考中状元，几经挫折，终和陈杏元结婚。"},{"n":70,"name":"李密反唐","ji":"下灵签","jieyue":"终朝春色久雨不晴求谋动用不如安静","qianyu":"此卦蜜蜂采花之象，凡事劳心费力也。","xiangjie":"此签家宅口舌，自身小人，求财破耗，交易反覆，婚姻不长，六甲虚惊，行人杳，田蚕六畜损，寻人无踪，讼亏，失物空，病有阻，移徙守旧，山坟改。","diangu":"李密是隋朝末年，反抗隋炀帝的瓦岗军首领，自称魏王，大将有秦琼、单雄信、程咬金等英雄好汉。后众叛亲离，自己和王伯当投靠唐王李渊，并娶了李仁公的公主为妻，安享荣华富贵，但他仍不满足，杀了妻子而反唐，和王伯当一起被乱箭射死，死时三十七岁。"},{"n":71,"name":"文君访相如","ji":"中灵签","jieyue":"不出重重事由天命振放中开切宜谨守","qianyu":"此卦一弓架两箭之象，凡事再合则吉也。","xiangjie":"此签家宅损失，自身是非，求财劳力，交易谨防，婚姻再合，行人阻，六甲先虚后实，田蚕晚收，六畜损，寻人见，讼亏，病禳星，移徙吉，山坟改。","diangu":"古代恋爱故事，汉朝时，卓文君的丈夫死后，在家守寡，读诗书过日子，一日邂逅了很有学问的司马相如，卓文君深夜造访相如，倾诉心中慕情，二人遂私奔出城，回到成都结为夫妇。后来司马相如被汉武帝赏识，在朝庭当官。苍龙：青龙。九衢：繁华的街市。"},{"n":72,"name":"王莽求贤","ji":"中灵签","jieyue":"事须仔细不用强求结蜂采蜜有甚来由","qianyu":"此卦结蜂采蜜之象，凡事劳心费力也。","xiangjie":"此签家宅欠利，自身防，求财阻，交易迟，婚姻阻隔，田蚕六畜少收，六甲虚惊，行人迟，寻人难，讼亏，移徙莫动，失物凶，病殁送，山坟败。","diangu":"汉朝人，王莽的姑母王政君是汉元帝的皇后，初为朝廷大司马，拥有很大势力，被封为新都侯。他表现十分恭谦，疏财仗义，广结天下豪杰和贤能，因而声誉很好。后来王莽篡夺了皇位，改国号为‘新’。由于实行复古制度，加深了人民痛苦，不久刘秀、 刘玄绿林军起义，推翻了王莽政权，东汉王朝开始。"},{"n":73,"name":"陈桥兵变","ji":"上灵签","jieyue":"雷发时转出入两存一朝变化直到天门","qianyu":"此卦雷发百虫之象，凡事遇贵人吉兆也。","xiangjie":"此签家宅祈福，自身平常，求财春利，交易贵人，婚姻成合，六甲男，行人到，田蚕早生，六畜春利，寻人见，讼胜，移徙吉，疾病险阻，山坟吉。","diangu":"周世宗死后，由他七岁的儿子继位，他的母亲符太后掌管政权。赵匡胤为当时长官，许多亲信和兄弟都想造反夺权。这年年初三，匡胤等人率领军队到陈桥驿宿营，当晚一部分将官发动兵变，声言拥赵匡胤为皇帝，并把一件黄袍加在他身上，山呼万岁。黄袍加身后，立即回开封，自己做了皇帝，改国号为宋，是为宋太祖。宋朝在历史上有三百二十年天下。"},{"n":74,"name":"秦败擒三帅","ji":"下灵签","jieyue":"进身可得退步为难低头直去悉在其中","qianyu":"此卦似鹄投水之象，凡事多虚少实也。","xiangjie":"此签家宅不安，自身困滞，求财小人，交易破耗，婚姻刑伤，行人阻，六甲刑劫，田蚕缺，六畜瘟，寻人杳，讼祸，移徙不利，失物凶，病延，坟绝。","diangu":"春秋时代，强大的秦国消灭了一个小国――滑国――之后，满载而归，接着进兵晋国。大军到一个叫上天梯的险要地方，人马皆困乏，要 前进也很难。这时突然发现乱木阻塞，晋国兵士大队杀出，后面也有晋兵夹攻，喊杀声四起，晋兵又放火烧山，烟火漫天，秦兵走投无路，被杀者无数。三位元帅：孟明、白乙丙 、西乞术也就束手被擒了。后来晋王释放了三人。"},{"n":75,"name":"伍员夜出韶关","ji":"中灵签","jieyue":"惊险重重前程有阻若问求谋到底辛苦","qianyu":"此卦抱虎过山之象，凡事险凶惊恐也。","xiangjie":"此签家宅祈保，自身提防，求财谨慎，交易滞，婚姻难顺，六甲有惊，行人阻，田蚕五分，六畜损，寻人杳，讼亏，失物难，病祭虎，移徙守，坟凶。","diangu":"伍员又名伍子胥，春秋时代楚国人，其父兄是朝廷重要官员，他们被楚平王杀死后，伍员和太子健的儿子胜，漏夜逃走。到了昭关，守关 的官员要捕捉他们，伍员和胜分别独自步行出关，躲躲藏藏，提心吊胆，由于过度忧虑，一夜之间，伍员的头发全变白了，伍员和胜终于脱离险境，到达吴国。"},{"n":76,"name":"洪武看牛","ji":"中灵签","jieyue":"虽是滋基也要待时营谋自本切莫妄为","qianyu":"此卦鱼龙未变之象，凡事待时至可也。","xiangjie":"此签家宅平安，自身康泰，求财有，交易待时，婚姻迟合，六甲生男，行人迟，田蚕晚丰，六畜尾利，寻人未遇，讼延，移徙守旧，病阻。","diangu":"朱洪武就是朱元璋，明朝第一任皇帝，他出身在贫苦农民家庭，幼年时替人放牛过日子后来又到皇觉寺当和尚，他参加了农民起义军，率 领军队十万之众，打败了元朝，建立了明朝，是为明太祖。朱元璋小时看牛，很是顽皮，传说他每天放牛上山，就口里喃喃念道：“草儿快快长，快快长，牛猛吃，草猛长”。说完就去玩耍，那些草好似听他金口说话，越长越多，牛也长得又肥又壮。"},{"n":77,"name":"捧壁归赵","ji":"中灵签","jieyue":"如梦说梦声明莫望只待好时贵人指示","qianyu":"此卦梦中得宝之象，凡事虚多少实也。","xiangjie":"此签家宅祈福，自身阻，求财虚，交易难成，婚姻不合，六甲虚，行人迟，田蚕不收，六畜损，寻人杳，讼和，移徙待时，失物远，病殁送，山坟改。","diangu":"春秋时代，赵国惠文王得到一块世上稀有的美玉，称为和氏壁，秦昭王知道了，要以十五座城池封换和氏壁，惠王知道秦王要骗他，但毫无办法对付。他委派蔺相如带了玉壁到秦国谈判，结果暴露了秦王的欺诈，相如收回玉壁，拒绝卖给秦国。当夜相如完好的将玉壁带回赵国，保住了价值连城的宝物。"},{"n":78,"name":"临潼救驾","ji":"上灵签","jieyue":"囚人逢赦病遇良医求财谋望贵人指示","qianyu":"此卦平善用事之象，凡事平稳大吉也。","xiangjie":"此签家宅安，自身吉，求财吉，交易成，婚姻合，六甲男，行人寻人至，田蚕熟，六畜旺，讼散，移徙大吉，失物即见，疾病安然，山坟大吉利。","diangu":"隋朝末年，天下纷争，李渊起兵太原，自称唐王。某日，李渊一家大小，经过临潼山，日方正午，突然杀出一队埋伏的人马，要取李渊等性命，李渊顽抗，形势十分危险，这时秦琼（叔宝）在附近伍员庙中午睡，听到嘶杀声，赶来一看，见是李渊，即刻将敌人杀退，救了唐王。李渊后来为唐高祖，秦琼武艺高强，有万夫不当之勇。"},{"n":79,"name":"暗扶倒铜旗","ji":"中灵签","jieyue":"人有我见心不用忙观音指示切莫轻慢","qianyu":"此卦信实莫信虚之象，凡事守旧之兆也。","xiangjie":"此签家宅还愿，自身许经，求财守份，交易谨慎，婚姻虚，六甲生女，行人滞，田蚕七分，六畜损，寻人杳，讼和，移徙守，失物西方，病解，山坟西向。","diangu":"隋唐故事：东岭关杨义臣摆一座铜旗阵（以一支大旗杆为主）坚强无比，守将东方伯，有万夫莫当之勇，秦叔宝领兵来攻打，罗艺知道了，就命令公子罗成保护铜旗阵，罗成答应，但他母亲说他必须帮助表哥秦叔宝，不能助杨义臣，他必须明保铜旗，暗助西魏（叔宝），罗成果然在破阵日，打倒铜旗，杀了杨义臣等大将，投靠西魏。"},{"n":80,"name":"智远投军","ji":"上灵签","jieyue":"有始有终莫向西东心中用事贵人重重","qianyu":"此卦贵人接引之象，凡事和合大吉也。","xiangjie":"此签家宅平安，自身吉利，求财有利，交易遂意，婚姻双配，行人回，六甲男，田蚕半收，六畜胜，寻人遇，讼胜，移徙吉，失物南，病安，山坟吉。","diangu":"刘智远（知远），沙陀族人，出身贫穷，在患难中和李三娘结为夫妇，住在李家庄，因不堪二舅的欺凌，出外从军，投于岳勋处为部将，终以战功，官九州安抚使。后又投靠石敬溏。公元九四七年在晋阳自立为皇帝。史称后汉高祖，只有二傅。"},{"n":81,"name":"风送腾王阁","ji":"上灵签","jieyue":"心中取事天必从之营谋用事尽可施为","qianyu":"此卦梧桐落叶之象，凡事先凶后吉也。","xiangjie":"此签家宅祈保，自身许经，求财遂意，交易成，婚姻和合，六甲虚惊，行人动，田蚕晚胜，六畜稳，寻人至，讼胜，移徙随意，病喜，山坟择地。","diangu":"唐朝咸淳二年，南昌县长阎伯屿重修腾王阁，定了九月九日设宴请客，并邀请天下名士出席宴会，目的要他女婿写一篇序文，以出风头，时王勃（唐初四杰之一）知道了，要去凑热闹，可是到南昌行程七百里，需时三天，此时已是九月初七日，赶不上了。是夜，王勃梦见水神对他说一句话：“送君一帆”，次日王 勃扬帆过江，舟行飞快，风送七百里路程，王勃及时赶到南昌，在会上写了千古绝妙的《腾王阁序》。风送腾王阁，时来运到的意思。"},{"n":82,"name":"火烧葫芦谷","ji":"中灵签","jieyue":"虽然逢险不损其身营谋用事皆遇贵人","qianyu":"此卦火里生莲之象，凡事似险非险也。","xiangjie":"此签家宅欠安，自身谨防，求财劳力，交易小人，婚姻阻，六甲虚惊，行人阻，田蚕缺，六畜损，寻人西，讼亏，移徙守旧，失物南，病殁送，山坟改。","diangu":"刘备和周瑜联合攻打曹操，孔明设七星台祭东风，助周瑜火烧赤壁，曹军被烧得狼狈而逃，曹操也带着一支残败军队逃亡。孔明派大将在 各处埋伏捉拿曹操。他派张飞去葫芦谷，不久，曹操和兵士到了葫芦谷口，人马困顿，坐下来休息烧饭。曹操在马上大笑孔明智谋不足，突然张飞杀到，山谷四处起火，曹操军队 挣扎一番，在火中狼狈而逃，走华荣道。"},{"n":83,"name":"李渊登位","ji":"中灵签","jieyue":"守旧待时如月初出待等圆时无有不吉","qianyu":"此卦月缺未圆之象，凡事候时则吉也。","xiangjie":"此签家宅许愿，自身夏秋吉，求财谨守，交易待时，婚姻迟，六甲生女，行人阻，田蚕六畜平稳，寻人难，讼和，移徙守旧，失物难，病殁送，山坟改。","diangu":"李渊是隋朝末年在太原起兵的将官，部下大将有秦琼（叔宝）、徐茂公、称咬金等，公元六一八年，隋炀帝在江都被部将杀死，李渊在长安登位做皇帝，国号‘唐’，是为唐高祖。唐朝在历史上有二百多年天下。李渊在位九年，由李世民（唐太宗）接位"},{"n":84,"name":"庄子试妻","ji":"下灵签","jieyue":"寒鱼离水美中不足若问营谋不如莫作","qianyu":"此卦寒鱼离水之象，凡事不可移动也。","xiangjie":"此签家宅六甲煞旺，诸事不利，解除保安。","diangu":"庄子是春秋战国人，大思想家。有一天，他心血来潮，问他老婆，在他死后，是为他守节，还是会再嫁？他老婆自然是信誓旦旦。庄子修炼道法，便以诈死试妻，停柩厅中，他幻化一美男子到来吊丧，自称是老庄远方好友，庄妻为其风仪所迷，两人眉来眼去，正在朗情妾意的时候，那男子捧心倒地，大呼心痛，说除非有‘人心’做汤，服之可愈，就是死了不过三日得人心也可以，庄妻乃演出‘大劈棺’的一幕，要取棺中庄子的心救其情郎，棺木劈开，庄子一跃而出。今古奇观。"},{"n":85,"name":"韩文公遇雪","ji":"中灵签","jieyue":"老者用求春残再开欲求名利晚遇横财","qianyu":"此卦春尽花开之象，凡事主后改变也。","xiangjie":"此签家宅欠利，自身谨慎，求财着力，交易平，婚姻迟，田蚕六畜好，行人阻，六甲女，寻人难，讼反复，移徙更新，失物凶，病延滞，山坟宜改。","diangu":"唐朝时大文学家，韩愈，谥文公，韩文公的侄儿韩湘子（八仙之一）会法术。一天文公生日，湘子到来贺寿，文公说：“你有法术使美酒 开花吗？”湘子说：“可以。”不久果然美酒开花，花间现出二行金字：云横秦岭家何在，雪拥蓝关马不前。文公不解，后来文公被朝廷贬职，到了蓝关，遇到大风雪，马不能前进，文公才悟其意。"},{"n":86,"name":"商辂中三元","ji":"上灵签","jieyue":"朝帝受职如贫得宝谋望从心卦中第一","qianyu":"此卦上朝见帝之象，凡事大吉大利也。","xiangjie":"此签家宅从心所欲，诸事皆吉。","diangu":"商辂，明朝浙江人，父名商琳，早逝。尚辂从小由母亲抚养，天资聪慧。古代科举（考试）制度分乡试，省试，殿试（等于现代的小学， 中学，大学考试），第一名为解元，会元，状元。尚辂在这三次考试中都获得第一名，故称连中三元。"},{"n":87,"name":"咬金探地穴","ji":"中灵签","jieyue":"凿石见玉淘沙见金须要着力只是劳心","qianyu":"此卦淘沙见金人处险境之象，凡事有贵人之兆也。","xiangjie":"此签家宅祈福，自身欠利，求财劳心，交易谨慎，婚姻有阻，六甲虚惊，行人迟，讼亏，田蚕六畜平稳，寻人未遇，移徙守旧，失物凶，病阻，山坟不阻。","diangu":"程咬金和徐茂公等瓦岗寨英雄在设宴庆祝胜利，突然演武场地裂开一大洞，众人称奇，却没有人敢下去探究竟。徐茂公叫大家沾字抽签， 结果咬金抽中，进入地穴探察，地洞内有石门、石桥，到了厅中，发现桌子上有龙袍玉带等宝贵物件，咬金穿在身上，从竹筐子爬了上来，安然无事，后来，咬金做了三年的‘混世魔王’。"},{"n":88,"name":"庞洪畏包公","ji":"中灵签","jieyue":"炉头点雪似耳旁风可宜作福后吉前凶","qianyu":"此卦木虎有威之象，凡事虚惊少实也。","xiangjie":"此签家宅不安，自身口舌，求财小人，交易不利，婚姻不合，六甲虚惊，行人阻，讼亏，田蚕六畜损，寻人杳，移徙守旧，失物凶，病祭虎，山坟凶。","diangu":"庞洪是松仁宗皇帝的妻舅，称为国丈，由于势力大，在朝廷里为非作歹，陷害忠臣。他串通了奸臣杨淘，定计谋害大将狄青，说他杀死妻子，所有官员都审查不出谁是主谋。包公回朝后，要求审办此案，庞洪惊畏不已。案件结束，庞杨二人被包公查出罪状，有人证物证，要皇帝判罪，但终被仁宗皇帝以亲戚关系为理由，释放了二人。"},{"n":89,"name":"大看琼花","ji":"上灵签","jieyue":"如石藏宝贵人指示得宝称心欢怀得意","qianyu":"此卦石藏珍宝之象，凡事称心大吉也。","xiangjie":"此签家宅吉利，自身康泰，求财遂意，交易成，婚姻成就，六甲生男，行人动，田蚕着力，六畜勤理，寻人见，讼胜，移徙吉，失物在，病安，山坟吉。","diangu":"琼花年开一次，且在晚间。隋炀帝听得扬州有琼花，即动用民工开凿运河，南下扬州看花，被杀隋亡。或指欣赏仙境之宝花。"},{"n":90,"name":"韦丹遇仙","ji":"上灵签","jieyue":"若问功名前有贵人理添喜气财禄丰盈","qianyu":"此卦功名成就之象，凡事宜进大吉也。","xiangjie":"此签家宅诸事吉，求之顺遂。","diangu":"韦丹，唐朝时人，年进四十还没考中科举。一天，乘驴至洛阳中桥，见渔人出售一双大鳖，置于桥上，呼呻喘气，快将死去。因见其可怜 ，自己身上又无钱，只好以驴子交换，然后将他放于水中，徒行而去。后遇一算命先生，得其引见一老翁，须眉皓然，身长七尺，见了韦丹就礼拜，称他为救命恩人。老翁殷勤对待韦丹，并从怀中取出一卷文书，说是从天府衙门中抄来的，证明韦丹一生做何官职，开始与何时，至于何时等资料，都是命中注定，上天安排。几天后告别，又借予韦丹五十千文钱，后来一切皆应验，韦丹春风得意，加官进禄，总共十七任。据说，老人就是天上神龙的化身。"},{"n":91,"name":"三战吕布","ji":"中灵签","jieyue":"一条大路可向前行心中用事只可向前","qianyu":"此卦前途显运之象，凡事通泰大吉也。","xiangjie":"此签家宅诸事如心，顺利吉昌。","diangu":"吕布英勇无比，认董卓为父。董卓令吕布领三万大军，扎住于虎牢关，准备迎战曹操和刘备军队。吕布领兵迎战。首先是张飞和吕布酣战，不分胜败，关公见了，随即加入，左右夹攻，刘备也从旁边加入助战，三人厮杀在一块，不分胜负。吕布见不能胜，飞马往关上逃，刘关张三人直追，此为著名的‘三英战吕布 ’。吕布后来归顺曹操，又在白门楼被曹操杀死。"},{"n":92,"name":"蔡卿报恩","ji":"上灵签","jieyue":"自小至大无阻无碍营谋得意功名顺遂","qianyu":"此卦自小为商之象，凡事勤俭无忧也。","xiangjie":"此签家宅安，自身泰，求财顺遂，交易胜，婚姻合，六甲生男，行人动，田蚕半收，六畜旺，寻人见，讼胜，移徙如意，失物在，病即安，山坟大吉。","diangu":"蔡邕新婚不久，即辞别妻子赵五娘，上京考试，五娘辛勤持家，落难受苦，日子非常难过，幸得善人张广才救济。后来蔡邕考中状元，做了大官，又和牛丞相女儿牛小姐结婚，五娘历尽千辛万苦，上京会见了蔡邕，夫妻重逢，和牛小姐一同回乡扫墓，蔡邕赠送许多金钱给张广才，以报答其恩德。‘卿’是古时皇帝封大臣的爱称。"},{"n":93,"name":"高君保招亲","ji":"中灵签","jieyue":"小人日盛君子莫为只宜守己待时施为","qianyu":"此卦鸾凤被雨之象，凡事待时大利也。","xiangjie":"此签家宅欠利，自身谨防，求财阻，交易待时，婚姻迟滞，六甲有虚，行人留连，田蚕晚，六畜损，寻人难，讼亏，移徙守旧，失物凶，病延，山坟改。","diangu":"高君保即高俊保，是宋朝高德怀的儿子。宋太祖赵匡胤征南唐被困，高君保运粮食前往解救，路过双锁山，被女大王刘金定劫持上山，强迫结为夫妻。"},{"n":94,"name":"伯牙访友","ji":"下灵签","jieyue":"知音方许闲事莫理待得贵人无不欢喜","qianyu":"此卦要逢知己之象，凡事守常则吉也。","xiangjie":"此签家宅慎出，自身小人，求财待时，交易谨慎，婚姻宜迟，六甲女，行人动，田蚕少，六畜损，寻人勤，讼和，失物速寻，病阻隔，山坟不利。","diangu":"伯牙是春秋时代人物，善弹琴，相传伯牙操琴，琴声高妙，只有钟子期才知其音，二人成为知音朋友。子期在江旁会见伯牙，谈论琴中意，高山流水声。第二年，伯牙到马鞍山造访知音好友子期，知道钟子期已死，伯牙伤心极了，遂破琴弦，从此不在弹琴。伯牙是晋国人，钟子期是楚国的一名樵夫（砍柴人）。"},{"n":95,"name":"曹丕称帝","ji":"中灵签","jieyue":"志气心动守己未迟金鸡报语无不欢喜","qianyu":"此卦志气功名之象，凡事守常大吉也。","xiangjie":"此签家宅祈保，自身中平，求财劳心，交易早断，婚姻有成，六甲安，田蚕晚成，六畜成，寻人难，讼急断，移徙守，失物远，病延缠，山坟吉。","diangu":"三国时代，曹操、刘备、孙权三足鼎立，分治天下。公元二二○年，魏王曹操死后，他的第二个儿子曹丕将汉献帝迫下台来，自己登位做了皇帝，改国号‘魏’，称号‘文帝’，建都洛阳。曹丕只做了七年皇帝，魏国也仅有四十多年天下，终归司马炎（晋朝）。"},{"n":96,"name":"窦燕山积善","ji":"上灵签","jieyue":"这些福份众人皆见不用心忙福德前定","qianyu":"此卦福德现身之象，凡事大吉大利也。","xiangjie":"此签家宅许愿，自身许经，求财正胜，交易大吉，婚姻好合，六甲喜，行人动，田蚕平稳，六畜欠利，寻人遇，讼和，移徙吉，病禳星，山坟平。","diangu":"宋朝时人，名窦禹均，因住在燕山，又叫燕山。初时，燕山为人不正，心术不好，专做伤天害理的事，至到三十岁，还没有儿女。一晚，他梦到父亲劝他悔过行善，才能挽回天意。燕山从此痛改前非，重新做人，并且广行方便，大做善事。后来生了五个儿子，因管教严明，都有良好成就。他在家贴的门联如下：为善必昌：为善不昌，祖宗之余殃，殃尽必昌；为恶必减：为恶不减，祖宗之余德，德尽必减。"},{"n":97,"name":"六出祈山","ji":"中灵签","jieyue":"富贵在天贫穷是命不用求谋皆是前定","qianyu":"此卦当风点烛之象，凡事虚名少利也。","xiangjie":"此签家宅祈保，自身谨慎，求财得利，交易慎重，婚姻中平，六甲有惊，行人杳，田蚕六畜损，寻人无踪，讼亏，移徙守旧，失物凶，病犯阴，坟改。","diangu":"诸葛亮回到成都后，三年按兵不动。这年建兴十二年春二月，亮又对后主（刘禅）说要第六次出祈山，统帅全军攻打魏国，天文官劝他不可出兵，恐有不利，他坚持要出，说：“鞠躬尽瘁，死而后已”。这回出师果然不利，诸葛亮病死五丈原。浮槎：传说中来往于海上和天河之间的木筏。"},{"n":98,"name":"吉平遇难","ji":"下灵签","jieyue":"守旧随时待贵人至若问诸般主事定迟","qianyu":"此卦守旧随缘之象，凡事不如意主凶也。","xiangjie":"此签家宅忧疑，自身小人，求财破，交易损失，婚姻不长，六甲刑损，行人困，田蚕六畜损，寻人杳，讼亏，移徙勿动，失物凶，病犯罗网，山坟绝。","diangu":"吉平是三国时代的明医，洛阳人，因痛恨曹操为人骄横霸道，和朝臣等人商议谋杀曹操，被家奴偷听到，向曹操告密。曹操假装患头风病，召吉平用药医治。吉平就在药中放了毒药，以毒死曹操。曹操早知有毒，即刻拿下吉平，刑枷拷打迫问，吉平终不肯招供，还破口大骂曹操，最后头撞石头而死。"},{"n":99,"name":"陶三春挂帅","ji":"下灵签","jieyue":"终身劳力莫管是非枷锁临身怨尤自至","qianyu":"此卦半忧半喜之象，凡事只宜行善也。","xiangjie":"此签家宅祈保，自身守慎，求财破，交易阻，婚姻刑克，田蚕六畜损，六甲险， 行人困，寻人招非，讼亏，移徙守旧，失物见，疾病忧危，山坟败。","diangu":"陶三春即宋朝初年郑恩（子明）之妻。初，赵匡胤和郑恩结拜为兄弟，著名武师陶洪有女名陶三春，郑恩与之比武，不能取胜。陶洪爱郑 恩之武艺人才，将三春许配与他为妻。后来三春之子郑印长大往山中学艺，十二年后才回家，并带着妻子王玉娥到汴京认母。这时赵匡胤征南唐被困，石朝怀回朝搬兵，陶三春挂帅带郑印，王玉娥等率兵下南唐，与高俊保刘金定夫妇会师作战。"},{"n":100,"name":"三教谈道","ji":"下灵签","jieyue":"完满灵签尽报君知依旧勿动待等时至","qianyu":"此卦守常勿动之象，凡事宜待时吉也。","xiangjie":"此签是满签，诸事不利，大作福力，可保平安。","diangu":"三教是指：佛（释迦牟尼）儒（孔夫子）道（张道陵）三教派。北周武帝（公元五六一年）时，佛儒道人士纷争和互相排斥，佛教尤受其害。皇帝于是召集佛儒道三教派的代表人物，以辩论所奉的‘道’高低长短，并排名定位，经过三次集会争辩，都没有结论，从此三教派在中国民间自由发展，后佛教演义为中国 人民信仰的主流。也有三教同源之说。"}];

  var drawBtn = document.getElementById("drawBtn");
  var againBtn = document.getElementById("againBtn");
  var copyBtn = document.getElementById("copyBtn");
  var allToggle = document.getElementById("allToggle");
  var allList = document.getElementById("allList");
  var qianStage = document.getElementById("qianStage");
  var resultCard = document.getElementById("resultCard");
  var resNo = document.getElementById("resNo");
  var resName = document.getElementById("resName");
  var resJi = document.getElementById("resJi");
  var resPoem = document.getElementById("resPoem");
  var resJie = document.getElementById("resJie");
  var resExtra = document.getElementById("resExtra");
  var drawing = false;
  var lastText = "";

  function jiLevel(ji) {
    var s = String(ji || "").replace(/^\s+|\s+$/g, "");
    if (!s) return "";
    if (s.indexOf("下") !== -1 || s.indexOf("凶") !== -1) return "down";
    if (s.indexOf("中") !== -1) return "mid";
    if (s.indexOf("上") !== -1 || s.indexOf("大") !== -1) return "up";
    return "mid";
  }

  function makeJiBadge(ji) {
    var span = document.createElement("span");
    span.className = "ji-badge jl-" + jiLevel(ji);
    span.textContent = ji;
    return span;
  }

  function clearChildren(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
  }

  function normalize(q) {
    var n = {
      no: q.no || CFG.noLabel + q.n + CFG.noSuffix,
      name: CFG.nameField ? (q[CFG.nameField] || "") : "",
      ji: CFG.jiField ? (q[CFG.jiField] || "") : "",
      poem: CFG.poemField ? (q[CFG.poemField] || "") : "",
      jie: CFG.jieField ? (q[CFG.jieField] || "") : "",
      extra: []
    };
    for (var i = 0; i < CFG.extra.length; i++) {
      var e = CFG.extra[i];
      if (q[e.key]) n.extra.push({ label: e.label, value: q[e.key] });
    }
    return n;
  }

  function buildText(q) {
    var lines = [CFG.name + " · " + q.no];
    if (q.name) lines.push(q.name);
    if (q.ji) lines.push(q.ji);
    if (q.poem) lines.push(CFG.poemLabel + "：" + q.poem);
    if (q.jie) lines.push(CFG.jieLabel + "：" + q.jie);
    for (var i = 0; i < q.extra.length; i++) lines.push(q.extra[i].label + "：" + q.extra[i].value);
    return lines.join("\n");
  }

  function showResult(q) {
    resNo.textContent = q.no;
    resName.style.display = q.name ? "" : "none";
    resName.textContent = q.name;
    clearChildren(resJi);
    if (q.ji) {
      var b = makeJiBadge(q.ji);
      if (b) resJi.appendChild(b);
    }
    resPoem.style.display = q.poem ? "" : "none";
    resPoem.textContent = q.poem;
    resJie.style.display = q.jie ? "" : "none";
    resJie.textContent = q.jie ? CFG.jieLabel + "：" + q.jie : "";
    clearChildren(resExtra);
    for (var i = 0; i < q.extra.length; i++) {
      var line = document.createElement("div");
      line.className = "qian-extra-line";
      line.textContent = q.extra[i].label + "：" + q.extra[i].value;
      resExtra.appendChild(line);
    }
    resultCard.style.display = "block";
    resultCard.classList.remove("show");
    void resultCard.offsetWidth;
    resultCard.classList.add("show");
    lastText = buildText(q);
  }

  function startDraw() {
    if (drawing) return;
    if (!QIAN || !QIAN.length) {
      setStatus("签文数据为空，无法抽签", "error");
      return;
    }
    drawing = true;
    drawBtn.textContent = "抽签中...";
    drawBtn.disabled = true;
    resultCard.style.display = "none";
    resultCard.classList.remove("show");
    qianStage.classList.remove("drawing", "drawn");
    void qianStage.offsetWidth;
    qianStage.classList.add("drawing");
    var picked = QIAN[Math.floor(Math.random() * QIAN.length)];
    setTimeout(function () {
      qianStage.classList.remove("drawing");
      qianStage.classList.add("drawn");
      drawBtn.textContent = "开始抽签";
      drawBtn.disabled = false;
      drawing = false;
      showResult(normalize(picked));
    }, 2600);
  }

  drawBtn.addEventListener("click", startDraw);
  againBtn.addEventListener("click", startDraw);

  copyBtn.addEventListener("click", function () {
    if (!lastText) return;
    copyToClipboard(lastText, copyBtn);
    setStatus("结果已复制到剪贴板");
  });

  allToggle.addEventListener("click", function () {
    var open = allList.style.display !== "none";
    allList.style.display = open ? "none" : "block";
    allToggle.textContent = open ? "查看全部签文" : "收起全部签文";
  });

  (function buildAll() {
    for (var i = 0; i < QIAN.length; i++) {
      var q = normalize(QIAN[i]);
      var row = document.createElement("div");
      row.className = "all-row";
      var head = document.createElement("button");
      head.type = "button";
      head.className = "all-head";
      var noSpan = document.createElement("span");
      noSpan.className = "all-no";
      noSpan.textContent = q.no;
      head.appendChild(noSpan);
      if (q.ji) {
        var b = makeJiBadge(q.ji);
        if (b) head.appendChild(b);
      }
      var poemSpan = document.createElement("span");
      poemSpan.className = "all-poem";
      poemSpan.textContent = q.poem || q.name || q.jie;
      head.appendChild(poemSpan);
      var body = document.createElement("div");
      body.className = "all-body";
      var p = document.createElement("div");
      p.className = "all-poem-full";
      p.textContent = q.poem || q.name;
      body.appendChild(p);
      if (q.jie) {
        var j = document.createElement("div");
        j.className = "all-jie";
        j.textContent = CFG.jieLabel + "：" + q.jie;
        body.appendChild(j);
      }
      for (var k = 0; k < q.extra.length; k++) {
        var line = document.createElement("div");
        line.className = "all-jie";
        line.textContent = q.extra[k].label + "：" + q.extra[k].value;
        body.appendChild(line);
      }
      row.appendChild(head);
      row.appendChild(body);
      (function (r) {
        head.addEventListener("click", function () { r.classList.toggle("open"); });
      })(row);
      allList.appendChild(row);
    }
  })();
})();
  </script>
</body>
</html>
