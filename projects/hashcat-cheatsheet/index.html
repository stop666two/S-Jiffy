      var searchEl = document.getElementById('searchInput');
      var catEl = document.getElementById('catSelect');
      var bodyEl = document.getElementById('hcBody');
      var countEl = document.getElementById('matchCount');
      var outputEl = document.getElementById('outputText');
      var copyBtn = document.getElementById('copyBtn');
      var currentCopy = '';

      function renderTable() {
        var keyword = searchEl.value.trim().toLowerCase();
        var cat = catEl.value;
        var html = '';
        var matched = 0;
        for (var i = 0; i < MODES.length; i++) {
          var m = MODES[i];
          if (cat && m.cat !== cat) {
            continue;
          }
          if (keyword && m.id.indexOf(keyword) === -1 && m.name.toLowerCase().indexOf(keyword) === -1) {
            continue;
          }
          matched++;
          html += '<tr data-copy="' + htmlEscape(m.id + ' | ' + m.name) + '">';
          html += '<td class="hc-id">' + htmlEscape(m.id) + '</td>';
          html += '<td class="hc-name">' + htmlEscape(m.name) + '</td>';
          html += '<td class="hc-hash">' + htmlEscape(m.hash) + '</td>';
          html += '<td><span class="hc-badge">' + htmlEscape(m.cat) + '</span></td>';
          html += '</tr>';
        }
        bodyEl.innerHTML = html;
        countEl.textContent = t('ui.total','共 ') + MODES.length + t('ui.8',' 种模式，当前匹配 ') + matched + t('ui.items',' 项');
        var rows = bodyEl.querySelectorAll('tr');
        for (var j = 0; j < rows.length; j++) {
          rows[j].addEventListener('click', function () {
            var text = this.getAttribute('data-copy');
            currentCopy = text;
            outputEl.textContent = text;
            copyToClipboard(text, copyBtn);
            setStatus(t('ui.7','已复制：') + text);
          });
        }
      }

      searchEl.addEventListener('input', renderTable);
      catEl.addEventListener('change', renderTable);

      copyBtn.addEventListener('click', function () {
        if (!currentCopy) {
          setStatus(t('ui.100','请先点击表格中的一行'), 'error');
          return;
        }
        copyToClipboard(currentCopy, copyBtn);
        setStatus(t('ui.7','已复制：') + currentCopy);
      });

      renderTable();
    })();
