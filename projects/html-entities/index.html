<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML 实体 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .dc-tabs { display: flex; gap: var(--space-1); margin-bottom: var(--space-3); }
    .dc-tabs button { flex: 1; height: 44px; font-size: var(--font-size-sm); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); cursor: pointer; transition: all .15s; }
    .dc-tabs button.active { background: var(--color-text-primary); color: #fff; border-color: var(--color-text-primary); }
    .lk-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin-bottom: 12px; }
    .lk-row label { font-size: 13px; color: var(--color-text-secondary); display: block; margin-bottom: 4px; }
    .lk-search { flex: 1; min-width: 200px; }
    .lk-res-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 12px; }
    .lk-res-item { padding: 12px; background: var(--color-bg-soft); border-radius: 8px; text-align: center; }
    .lk-res-item .v { font-size: 20px; font-weight: 600; word-break: break-all; }
    .lk-res-item .l { font-size: 12px; color: var(--color-text-secondary); margin-top: 4px; }
    .lk-tbl-wrap { max-height: 420px; overflow-y: auto; margin-top: 12px; border: 1px solid var(--color-border); border-radius: var(--radius-md); }
    .lk-tbl { width: 100%; border-collapse: collapse; font-size: var(--font-size-xs); }
    .lk-tbl th { position: sticky; top: 0; text-align: left; padding: 8px 12px; background: var(--color-bg-soft); border-bottom: 1px solid var(--color-border); font-weight: 600; z-index: 1; }
    .lk-tbl td { padding: 5px 12px; border-bottom: 1px solid var(--color-border); }
    .lk-tbl tr:hover td { background: var(--color-bg-soft); }
    .lk-tbl .mono { font-family: var(--font-mono); }
    .lk-tbl .chr { font-size: 16px; }
    .lk-count { font-size: var(--font-size-xs); color: var(--color-text-secondary); margin-top: 8px; }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
  <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a></header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">HTML 实体转义</h1>
    <p class="tool-desc" data-i18n="desc">对 HTML 特殊字符进行转义（escape）与反转义（unescape），支持字符实体查询（2231 条）。</p>
    <div class="dc-tabs">
      <button id="tabEscape" class="active" type="button" data-i18n="ui.tabEscape">转义</button>
      <button id="tabLookup" type="button" data-i18n="ui.tabLookup">实体查询</button>
    </div>
    <div id="panelEscape">
      <div class="card">
        <textarea id="inputText" class="input textarea js-focus-input" data-i18n-placeholder="ui.102" placeholder="输入 HTML 文本..."></textarea>
      </div>
      <div style="display:flex; gap:12px; margin-bottom:24px;">
        <button id="escapeBtn" class="btn btn-primary" data-i18n="ui.1">转义 (Escape)</button>
        <button id="unescapeBtn" class="btn btn-secondary" data-i18n="ui.2">反转义 (Unescape)</button>
        <button id="clearBtn" class="btn btn-secondary" data-i18n="ui.clear">清空</button>
      </div>
    </div>
    <div id="panelLookup" style="display:none;">
      <div class="card">
        <div class="lk-row">
          <div class="lk-search">
            <label data-i18n="lk.label">输入字符或实体名</label>
            <input id="lkInput" class="input" data-i18n-placeholder="lk.ph" placeholder='如 "&amp;" "©" "&lt;" 或字符' style="width:100%;">
          </div>
          <button id="lkQueryBtn" class="btn btn-primary" data-i18n="lk.query">查询</button>
        </div>
        <div class="lk-res-grid">
          <div class="lk-res-item"><div class="v" id="lkChar">—</div><div class="l" data-i18n="lk.char">显示字符</div></div>
          <div class="lk-res-item"><div class="v" id="lkEntity">—</div><div class="l" data-i18n="lk.entity">HTML 实体</div></div>
          <div class="lk-res-item"><div class="v" id="lkUnicode">—</div><div class="l" data-i18n="lk.unicode">Unicode 码点</div></div>
          <div class="lk-res-item"><div class="v" id="lkHex">—</div><div class="l" data-i18n="lk.hex">十六进制</div></div>
        </div>
      </div>
      <div class="card">
        <label style="font-size:13px;color:var(--color-text-secondary);display:block;margin-bottom:4px;" data-i18n="lk.tblTitle">完整实体表（HTML5 命名实体）</label>
        <input id="tblFilter" class="input" data-i18n-placeholder="lk.searchPh" placeholder="过滤实体表（名称/字符/说明）..." style="width:100%;">
        <div class="lk-tbl-wrap">
          <table class="lk-tbl">
            <thead><tr><th data-i18n="lk.thName">名称</th><th data-i18n="lk.thChar">字符</th><th data-i18n="lk.thDesc">说明</th></tr></thead>
            <tbody id="tblBody"></tbody>
          </table>
        </div>
        <div class="lk-count" id="tblCount"></div>
      </div>
    </div>
    <div class="output-box">
      <span id="outputText" style="display:block; padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>

    (function () {
      var inputEl = document.getElementById('inputText');
      var outputEl = document.getElementById('outputText');
      var escapeBtn = document.getElementById('escapeBtn');
      var unescapeBtn = document.getElementById('unescapeBtn');
      var clearBtn = document.getElementById('clearBtn');
      var copyBtn = document.getElementById('copyBtn');

      function escapeHtml(str) {
        var map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
        return str.replace(/[&<>"']/g, function(m) { return map[m]; });
      }

      function unescapeHtml(str) {
        var doc = document.createElement('textarea');
        doc.innerHTML = str;
        return doc.value;
      }

      escapeBtn.addEventListener('click', function () {
        var text = inputEl.value;
        if (!text) { setStatus(t('ui.100','请输入内容'), 'error'); return; }
        outputEl.textContent = escapeHtml(text);
        setStatus('');
      });

      unescapeBtn.addEventListener('click', function () {
        var text = inputEl.value;
        if (!text) { setStatus(t('ui.101','请输入内容'), 'error'); return; }
        outputEl.textContent = unescapeHtml(text);
        setStatus('');
      });

      clearBtn.addEventListener('click', function () {
        inputEl.value = '';
        outputEl.textContent = '';
        setStatus('');
        inputEl.focus();
      });

      copyBtn.addEventListener('click', function () {
        var text = outputEl.textContent;
        if (text) { copyToClipboard(text, copyBtn); setStatus(t('ui.copiedClip','已复制到剪贴板')); }
      });

      /* ---- tabs ---- */
      var tabEscape = document.getElementById('tabEscape'), tabLookup = document.getElementById('tabLookup');
      var panelEscape = document.getElementById('panelEscape'), panelLookup = document.getElementById('panelLookup');
      function switchTab(which) {
        if (which === 'escape') {
          tabEscape.className = 'active'; tabLookup.className = '';
          panelEscape.style.display = ''; panelLookup.style.display = 'none';
        } else {
          tabLookup.className = 'active'; tabEscape.className = '';
          panelLookup.style.display = ''; panelEscape.style.display = 'none';
        }
      }
      tabEscape.addEventListener('click', function () { switchTab('escape'); });
      tabLookup.addEventListener('click', function () { switchTab('lookup'); });

      /* ---- lookup: query a char / entity name ---- */
      var lkInput = document.getElementById('lkInput');
      var lkChar = document.getElementById('lkChar'), lkEntity = document.getElementById('lkEntity');
      var lkUnicode = document.getElementById('lkUnicode'), lkHex = document.getElementById('lkHex');

      function lookupQuery() {
        var v = lkInput.value.trim();
        if (!v) { setStatus(t('lk.empty','请输入字符或实体'), 'error'); return; }
        var ch = v;
        if (v.charAt(0) === '&' && v.charAt(v.length - 1) === ';') {
          var div = document.createElement('div');
          div.innerHTML = v;
          ch = div.textContent || div.innerText || '';
        }
        if (ch.length === 0) { setStatus(t('lk.invalid','无效输入'), 'error'); return; }
        var cp = ch.charCodeAt(0);
        lkChar.textContent = ch;
        lkEntity.textContent = '&#' + cp + ';';
        lkUnicode.textContent = 'U+' + cp.toString(16).toUpperCase().padStart(4, '0');
        lkHex.textContent = '0x' + cp.toString(16).toUpperCase();
        outputEl.textContent = t('lk.summaryChar','字符: ') + ch + t('lk.summaryEnt',' | 实体: &#') + cp + ';' + t('lk.summaryUni',' | Unicode: U+') + cp.toString(16).toUpperCase();
        setStatus(t('lk.done','查询完成'));
      }
      lkQueryBtn.addEventListener('click', lookupQuery);
      lkInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') lookupQuery(); });

      /* ---- lookup: full entity table ---- */
      var tblFilter = document.getElementById('tblFilter');
      var tblBody = document.getElementById('tblBody');
      var tblCount = document.getElementById('tblCount');

      function renderTable(filter) {
        var q = (filter || '').toLowerCase();
        tblBody.innerHTML = '';
        var count = 0;
        var frag = document.createDocumentFragment();
        for (var i = 0; i < ENT_DATA.length; i++) {
          var row = ENT_DATA[i];
          if (q && row[0].toLowerCase().indexOf(q) === -1 && row[1].toLowerCase().indexOf(q) === -1 && row[2].toLowerCase().indexOf(q) === -1) continue;
          var tr = document.createElement('tr');
          var tdName = document.createElement('td');
          tdName.className = 'mono';
          tdName.textContent = '&' + row[0] + ';';
          var tdChar = document.createElement('td');
          tdChar.className = 'chr';
          tdChar.textContent = row[1];
          var tdDesc = document.createElement('td');
          tdDesc.textContent = row[2];
          tr.appendChild(tdName); tr.appendChild(tdChar); tr.appendChild(tdDesc);
          frag.appendChild(tr);
          count++;
        }
        tblBody.appendChild(frag);
        tblCount.textContent = t('lk.countPrefix','共 ') + count + t('lk.countSuffix',' 个实体');
        if (count === 0) {
          var empty = document.createElement('tr');
          var td = document.createElement('td');
          td.colSpan = 3;
          td.textContent = t('lk.noMatch','未找到匹配');
          td.style.textAlign = 'center';
          td.style.padding = '16px';
          td.style.color = 'var(--color-text-disabled)';
          empty.appendChild(td);
          tblBody.appendChild(empty);
        }
      }
      tblFilter.addEventListener('input', function () { renderTable(this.value); });
      renderTable('');
    })();
  </script>
