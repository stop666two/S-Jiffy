<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>HTML 转 Markdown - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css"><style>
.split-pane{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:300px}@media(max-width:700px){.split-pane{grid-template-columns:1fr}}.split-pane textarea{height:300px;resize:vertical;font-family:var(--font-mono);font-size:13px;padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-md);outline:none}.split-pane textarea:focus{border-color:var(--color-text-primary);box-shadow:var(--shadow-focus)}
</style></head><body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
<main class="tool-workspace"><h1 data-i18n="h1">HTML 转 Markdown</h1><p class="tool-desc" data-i18n="desc">将 HTML 转换为 Markdown 格式文本，支持常用块级和行内元素。</p>
<div class="card">
<div style="display:flex;gap:8px;margin-bottom:12px;">
<button id="convertBtn" class="btn btn-primary" data-i18n="ui.1">转换为 Markdown</button>
<button id="clearBtn" class="btn btn-secondary" data-i18n="ui.clear">清空</button>
</div>
<div class="split-pane">
<textarea id="htmlInput" class="js-focus-input" data-i18n-placeholder="ui.101" placeholder="在此粘贴 HTML 源码..."><h1 data-i18n="ui.2">标题</h1><p><strong data-i18n="ui.3">加粗</strong> 和 <em data-i18n="ui.4">斜体</em></p><ul><li data-i18n="ui.5">列表项 1</li><li data-i18n="ui.6">列表项 2</li></ul><a href="https://example.com" data-i18n="ui.7">链接</a></textarea>
<textarea id="mdOutput" readonly data-i18n-placeholder="ui.102" placeholder="转换后的 Markdown 将显示在此..." style="background:var(--color-bg-soft);"></textarea>
</div>
</div>
<div class="output-box"><span id="outputText" style="display:block;padding-right:60px;"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
</main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script><script>(function(){
var htmlInput=document.getElementById('htmlInput');
var mdOutput=document.getElementById('mdOutput');
var convertBtn=document.getElementById('convertBtn');
var clearBtn=document.getElementById('clearBtn');
var outputEl=document.getElementById('outputText');
var copyBtn=document.getElementById('copyBtn');

function htmlToMd(html){
var text=html;
text=text.replace(/<\/h([1-6])>/g,'\n');
text=text.replace(/<h([1-6])>/g,function(m,l){var n=parseInt(l);return new Array(n+1).join('#')+' ';});
text=text.replace(/<\/p>/g,'\n\n');
text=text.replace(/<p>/g,'');
text=text.replace(/<br\s*\/?>/g,'\n');
text=text.replace(/<\/li>/g,'\n');
text=text.replace(/<li>/g,'- ');
text=text.replace(/<\/ul>/g,'\n');
text=text.replace(/<ul>/g,'');
text=text.replace(/<\/ol>/g,'\n');
text=text.replace(/<ol>/g,'');
text=text.replace(/<strong>/g,'**');
text=text.replace(/<\/strong>/g,'**');
text=text.replace(/<b>/g,'**');
text=text.replace(/<\/b>/g,'**');
text=text.replace(/<em>/g,'*');
text=text.replace(/<\/em>/g,'*');
text=text.replace(/<i>/g,'*');
text=text.replace(/<\/i>/g,'*');
text=text.replace(/<code>/g,'`');
text=text.replace(/<\/code>/g,'`');
text=text.replace(/<pre>/g,'```\n');
text=text.replace(/<\/pre>/g,'\n```');
text=text.replace(/<blockquote>/g,'> ');
text=text.replace(/<\/blockquote>/g,'\n');
text=text.replace(/<hr\s*\/?>/g,'\n---\n');
text=text.replace(/<a\s+[^>]*href="([^"]*)"[^>]*>/g,'[$1](');
text=text.replace(/<\/a>/g,')');
text=text.replace(/<img\s+[^>]*src="([^"]*)"[^>]*alt="([^"]*)"[^>]*\/?>/g,'![$2]($1)');
text=text.replace(/<img\s+[^>]*src="([^"]*)"[^>]*\/?>/g,'![]($1)');
text=text.replace(/<[^>]+>/g,'');
text=text.replace(/\n{3,}/g,'\n\n');
text=text.trim();
return text;
}

function convert(){
var html=htmlInput.value;
if(!html){mdOutput.value='';outputEl.textContent='';setStatus(t('ui.100','请输入 HTML'),'error');return;}
var md=htmlToMd(html);
mdOutput.value=md;
outputEl.textContent = t('ui.8','转换完成，共 ')+md.length+ t('ui.chars',' 字符');
setStatus('');
}

convertBtn.addEventListener('click',convert);
clearBtn.addEventListener('click',function(){htmlInput.value='';mdOutput.value='';outputEl.textContent='';setStatus('');htmlInput.focus();});
copyBtn.addEventListener('click',function(){if(mdOutput.value){copyToClipboard(mdOutput.value,copyBtn);setStatus(t('ui.copied','已复制'));}});
htmlInput.addEventListener('keydown',function(e){if(e.ctrlKey&&e.key==='Enter')convert();});
})();</script></body></html>
