    .qian-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 26px; background: #B3202C; border-radius: 9px 9px 0 0; }
    .qian-card::after { content: "签"; position: absolute; top: 34px; left: 0; right: 0; font-size: 34px; color: #8A4A1F; text-align: center; font-weight: 600; }
    .qian-card.drawing { animation: qianShake 2.5s ease-in-out both; }

    @keyframes qianShake {
      0% { transform: rotate(0deg) translateY(0); }
      12% { transform: rotate(-7deg) translateY(-8px); }
      24% { transform: rotate(6deg) translateY(-16px); }
      36% { transform: rotate(-6deg) translateY(-22px); }
      48% { transform: rotate(7deg) translateY(-16px); }
      60% { transform: rotate(-5deg) translateY(-8px); }
      72% { transform: rotate(4deg) translateY(0); }
      84% { transform: rotate(-2deg) translateY(4px); }
      100% { transform: rotate(0deg) translateY(0); }
    }
    @keyframes qianPulse { from { opacity: 1; } to { opacity: 0.5; } }

    .all-head:hover { background: var(--color-bg-soft); }

    <p class="tool-desc" data-i18n="desc">黄大仙灵签共一百支，相传求签先报姓名生辰，百事可问，以签文断吉凶。</p>

  <script>
(function () {
  var CFG = {"name":"黄大仙灵签","poemLabel":"签题","jieLabel":"解签","jieField":"jie","extraFields":[{"key":"diangu","label":"典故"}]};
  var QIAN = [{"n":1,"name":"姜公封相","ji":"上上灵签","jie":"姜公，姜子牙，世人多称之为姜太公。周朝的开国功臣，他辅佐周武王战败了暴君纣王，在多场敌强我弱的恶战中，如有神助，取得胜利。《封神榜》一书，亦有记载姜公在元始天尊、太乙真人、南极仙翁诸神的扶助，取得封神榜。您求得这支上上签，可喜可贺！龙虎得风云际会，您立下的大志，将会得偿所愿，并能到达至善至乐的境界。正所谓：东成西就，左右逢源，万事如意。","diangu":"周朝开国功臣。姜太公。又名尚。当时得令。龙虎得风云会合。则龙飞九天去。扬扬快乐。即使瑶池仙家地方。亦可到矣。此是荣华发达之象也。"},{"n":2,"name":"王道真误入桃源","ji":"上吉灵签","jie":"桃源，即晋代陶渊明所述的世外桃源。传说中，这位有缘人王道真亦曾顺水行舟，无意间到达桃源，看见一群逃避战乱的先秦遗民，快乐无忧的生活在一个百花争妍，万紫千红，花香蝶舞，枯木逢春的境界。求得此签，有一种否极泰来，枯木逢春、时来运转、快活无忧的征兆，而且，又暗示，一切佳景，不必刻意去强求；顺其自然，尽力而为，反而有意想不到的收获。","diangu":"枯木遇春天而发新芽。花香叶茂引蝴蝶频来。桃源乃世外之境地。其时桃花正开得千红万紫。此时王道真撑艇误入此桃源水道游玩。得见此繁华快乐之景象矣。"},{"n":3,"name":"鲁班开山","ji":"中平灵签","jie":"鲁班，春秋时代鲁国人，发明多种土木建筑工具，被尊崇为建筑行业的祖师爷。他曾训令门徒，切勿乱砍乱伐木材，令这样丰富的牛山，变成牛山濯濯，光秃秃，竟然无一合适的材料可用。这签的主要意思，是说：“本来，有很好的条件，但是，处理失当，不知不觉间，优势尽失，等到急需人、财、物应用的时候，才发觉已经一无所有了。”暗示要珍惜资源，慎防小人，摒弃恶习。","diangu":"牛山之木常属佳品。执斧头之人。尽斩伐之。虽有大件木材。亦无实用。因此木不合规矩。难以做木筏之用也。"},{"n":4,"name":"调雏紫燕正穿梭","ji":"中吉灵签","jie":"董永，东汉人，家贫，少年时卖身葬父。后遇仙女下凡，结为夫妇。此签是说董永与天仙在春天看见的一幅自然景色。檐前燕子往返穿梭，寻觅食物，回巢哺育下一代的风景图。可以告慰的是，燕子为培养下一代，一定会选择较为安全的环境筑巢，而签中第一二句，是母燕在檐前与雏燕呢喃细语，即有平安之象。后两句则是提醒，雏燕的父母为了觅食，来来往往，忽高忽低，暗示运程时起时伏，时好时坏，年中或有波动。","diangu":"燕教小燕子学讲话。在檐口对语。往来飞舞。亦一乐也。但往而复来。低而复起。似无定景象。然平稳而无碍。"},{"n":5,"name":"韩夫人惜花","ji":"中吉灵签","jie":"韩夫人，是隋炀帝的一位姬妾，相传是一位惜花之人。此签是提出一个警告：今年会有较大的波折，“天时”稍差，“地利”亦易有失，唯一可取的，就是“人和”，希望有贵人相助，度过难关，回复生机。东园的百花，被狂风所吹袭，幸有惜花之人，不辞劳苦，去善后，去化险为夷，这个惜花人，可以是自己，也可以是别人。记住：天助自助者。","diangu":"狂风太急。吹得万花倾侧。此惊险之象也。幸有爱惜花者。培回根本。而花复生。此乃有贵人扶助之象也。"},{"n":6,"name":"王羲之归故里","ji":"上吉灵签","jie":"王羲之，（西元三二一、至三七九），东晋人，出身贵族，官至右军将军，会稽内史。后来辞官归故里浙江绍兴，研习书法有卓越成就，自成一格，为后代的毛笔字体开创一条新路。这支签，是形容一位有才学又有相当经济基础的人，放弃官场的争斗，急流勇退，毅然返故乡，一方面得聚天伦及友谊之乐，优哉悠哉，一方面又可以继续发展自己的专长，扬名于后世。","diangu":"晋朝时代。书法名家姓王名羲之。当时在万里远处回家。常吹箫弹琴饮酒。许多朋友相聚谈风说月。心情欢欣。快乐之极。"},{"n":7,"name":"仁贵归家","ji":"中吉灵签","jie":"薛仁贵，唐代名将，率军征东，屡建战功，获封为“平阳郡公”。这支签，是薛仁贵征东后，得胜回朝，领功获赏后，衣锦还乡的好景。但可惜，征人易老，在战争中消磨了青春，而回家途中，又适逢秋天，征雁南归、红叶纷飞，最令人触目伤感的是，不少征人的妻子，正在城头用木捣洗衣服。这暗示会有美中不足，而且会有扫兴或失意事发生。","diangu":"唐朝时代。薛仁贵征东。得胜回朝封王而归家。当时秋将冷。雁南飞。红叶凋谢。人洗寒衣。此秋天冷落之景象。虽无防碍之处。亦无快活之气也。"},{"n":8,"name":"鸠占鹊巢","ji":"下下灵签","jie":"《诗．召南．鹊巢》有云：“维鹊有巢，维鸠居之。”喜鹊善于筑巢，而鸠鸽却不懂筑巢，往往恃恶霸占而居之。此已有主被宾欺之象，也即是俗称的“客家占地主”。萝茑，即茑萝，一种攀藤植物，山岭上的松树，都被它们缠绕着。有困身，小人依附之象。春秋时，崔子因妻被齐王占有，怒而起兵杀之。此签有“鸠占鹊巢”之象，年内谨防小人欺凌，恶人相侵，要小心一言一行。","diangu":"鹊有巢而为鸠所争夺。两家不舒畅。山有松树而被藤萝周身牵缠。等于人而被人欺凌。即依附于人之象。"},{"n":9,"name":"陶渊明赏菊","ji":"上吉灵签","jie":"求得此籤者，可能与陶渊明般，同样拥有一定的本事，于是在某方面有感失意，就心灰意冷，欲转身离去，这虽然不是很好的现象，但可喜的是，正因为有条件这样做的，也非等閒之人也。","diangu":"陶渊明，晋代的一位有识之士，不为五斗而折腰，放弃官禄，回家享清福，在隐居四周，种满菊花，一边享受田园之乐，一边著书立说，写出了很多传诵至今的文章、诗歌。求得此签者，有天时、地利、人和之象，凡事称心如意。"},{"n":10,"name":"苏秦不笫","ji":"中平灵签","jie":"此籤属于典型的凶中藏吉之象，须知苏秦后来再度出山，官至六国大封相。所以，若求得此籤者，也不用太过担心，后头尚有大福也。","diangu":"战国时代苏秦。屡试不第。仍然不屈不挠。卒为六国之宰相。有如月镜挂天中。偶被浮云重重遮盖。此暂时轻轻遭劫之象。要人借我以风吹散浮云。而现下未知何人可借。是未得贵人扶助也。"},{"n":11,"name":"汉文帝赏柳","ji":"上吉灵签","jie":"汉文帝，一个施德政、亲人民的皇帝，在位二十三年，实行“与民休息”的政策，减轻地税、赋役、刑狱，使国家在平定“诸吕之乱”后，国计民生得以复苏，农业生产迅速发展。更难能可贵者，在勤政亲民之余，汉文帝最喜欢欣赏杨柳的美态，为了提高工作效率，他采用“分段睡眠法”，每日三眠三起，醒后必欣赏绿柳垂堤，紫燕在其间飞舞的美好景色。此签有万事如意之象。","diangu":"汉文帝生平最为酷爱杨柳。每日在于政暇时。及杨柳垂堤之时。日中常常三起三眠。以欣赏其秀茂景色。盖杨柳有时垂有时起。且有燕子往来飞舞其间。迎风摇动。景色怡人。此乃心欢快乐之景象也。"},{"n":12,"name":"太白捞月","ji":"下下灵签","jie":"太白，即唐朝大诗人李白。李白失意于官场，以诗酒为友。为人侠义豪放。“醉翁捞月”的故事，就是他做主角，独个儿纵酒大醉，一向有求仙思想的李太白，望着水中的明月倒影，飘飘欲仙，竟伸手去打捞水中月。此签有海市蜃楼的虚假幻象，有花篮打水一场空的预兆，凶多吉少，为下下签。当行善务实为本份，勿被假像所引诱。","diangu":"海中蜃蛤吐气如楼。高接到天。一有风来。便吹散矣。虽散而复聚。亦如烟之浮。不能长久也。此乃一片虚浮景象。跟前虽好。实无归结。"},{"n":13,"name":"孟浩然寻梅","ji":"中平灵签","jie":"孟浩然，唐朝著名诗人。早年隐居鹿门山，游历东南各地，生活隐逸，与多座名山的僧道友善，常有来往，久有修道之意。在“宴梅道士山房”一诗中有“忽逢青鸟侠，邀入赤松家”句，反映孟浩然对赤松子的尊崇。这支签，是孟浩然在岭南寻梅的际遇。把梅花花瓣放入酒中而饮，人生极雅乐之事。路上遇有骑驴人先来一步，在其引领，得偿所愿。","diangu":"岭南梅开最早。将花入酒杯。饮之甚香。遇有骑驴者。寄此梅花于人。百花来开而此花独占先开。亦令人必悦也。"},{"n":14,"name":"东坡归隐","ji":"中吉灵签","jie":"苏东坡，宋代文学家、诗画家，在诗词字画中皆有卓越成就，被列入“唐宋八大家”。但仕途坎坷，曾多次被贬谪，亦曾来过广东省惠州等地。晚年北还，归隐，寄情于山水、诗词、字画。签语描写东坡归隐的清雅生活：为了幽闲，在居所周围种满绿竹，把时间都交托给春天，或躲在茅屋里赏雨，或醉后眠在杏花旁边，安然入梦乡，最怕被黄莺的歌声吵醒。此乃安逸之象。","diangu":"陶渊明辞官归里。隐居家园。多种竹树。买春赏雨。醉卧杏花之边。此安乐之景。怕有莺儿惊梦。此惊慌之象。人能于安乐中。防避口舌。常在一点善心。亦无碍也。读一怕字。要慎防则吉。"},{"n":15,"name":"明皇游月殿","ji":"上吉灵签","jie":"唐明皇，即玄宗李隆基，初登基时，整顿弊政，国民经济得以发展，历史上称为“开元之治”，可惜后来耽于安逸，与杨贵妃风流快活，任由宠臣贪污舞弊，惹出“安史之乱”。但此签只道繁华快活之象，唐明皇得一叶仙舟，扶摇直上九霄，遨游月宫，仙乐飘飘处处闻，传说中，“霓裳羽衣曲”就因此而得，诗酒歌舞，无止无休。求得此签，虽有大吉大利之象，万事如意，但要警惕勿太沉迷酒色安乐。","diangu":"唐明皇时。国泰民安。优游安乐。故此有风流天子之称。因他素慕月殿蟾宫之美丽。时欲想往一游。卒得一叶仙舟。载赴月殿。任其游乐。学得霓裳仙子羽衣曲而回。歌歌唱唱饮酒吟诗。快乐不歇。此快乐之景象。"},{"n":16,"name":"皇叔遇水镜","ji":"中吉灵签","jie":"刘皇叔，即刘备，偶遇水镜先生，当时正值夕阳西下，天边的群鸦纷纷回巢；山岗外，传来了阵阵的笛子声，原来是牧童骑着牛犊，优哉悠哉的返家。牧笛的调子，忽长忽短，忽高忽低，很自由，很谐和，充满了快乐。求得此签者，既有快乐无求之意，又有大器晚成之象，凡事尽力而为，得失无愧于心，即所谓：尽人事，顺天命，自然就“明天会更好”。","diangu":"日落山冈时候。天边之鸦鹊归巢。郊外的牧牛童子。亦骑牛而归家。一路上吹得竹笛之声充满耳。此童子甚快乐也。"},{"n":17,"name":"月下追贤","ji":"中吉灵签","jie":"萧何月下追贤，是汉代一个挽留人才的真实故事。萧何佐辅刘邦建立帝业，名将韩信投靠间邦，未获重用，夤夜驰归，萧何知道后，立即策马在月光下追韩信，晓以大义，劝其回心转意，同建汉朝。“秋水蒹葭白露盈……”这两句，是写秋景，蒹葭，是荻草与芦苇，凝结了霜露，月色满阶。接着是清风中的马铃声，然后是天亮的晨钟声，示意追得韩信回。此签有失而复得，人尽其材之意。","diangu":"秋天多露。月色满阶。风吹马铃。响接晨钟之声。此乃汉时韩信。投奔汉高祖。未获重用。夤夜驰归。为张良所知。告信之能于高祖。乃月下追回韩信时之情景也。"},{"n":18,"name":"杜鹃泣血动客心","ji":"下下灵签","jie":"杜鹃，相传为蜀帝杜宇所化，在《十三州志中》有这样的记载：“当七国称王，独杜宇称帝于蜀，曰望帝。”后来，望帝委派一位叫做鳖冷的臣子去巫山治水而成、功，望帝自觉才德不及鳖冷，“乃委国鳖冷……遂自亡去，化为子规。”子规，就是杜鹃。而杜鹃思念家国，声声啼泣，眼泪化成杜鹃花。异乡客人，寒夜中被杜鹃啼声惊醒，更加触发乡思。此签虽为下下，但小心谨慎，可逢凶化吉。","diangu":"春末夏初之时。杜鹃雀啼。声声悲而且凄切。如怨如慕。如泣如诉。留落异地作他乡客。闻声触感。每动思家之心情。乃一种愁闷之气象。"},{"n":19,"name":"伏羲画八卦","ji":"中吉灵签","jie":"伏羲，即太昊，八卦的图像，为他所创画，并教化人民捕鱼畜牧，改善生活。而八卦第一章，是乾卦，三连划，属太阳，纯阳无阴，唯智者不取。求取此签者，如果能领悟到其中爻象的道理，万事顺昌。“纯阳易伤”的道理，随时都发生在身边，譬如做人怕蚀底，做一偏激，谁人敢与你合作。凡事要看透各方面，不能死牛一面颈。光靠蛮、恶、霸气者，终于会失败。","diangu":"干卦纯阳无阴。初九。潜龙勿用。能想透第一章之句语。隐藏其刚强之气勿用。则百福至而大吉昌矣。"},{"n":20,"name":"雪梅招亲","ji":"中平灵签","jie":"雪梅，是古时安南国（今越南）公主。征联招亲。其上联是“太极殿前三尺雪”，其国内竟无人识对。后来，广东有一位叫做黄华贵的，福至心灵，以“广寒宫里一枝梅”对通，被招为附马。签意是：天上广寒宫里的这枝仙花，别问是谁种的，落得凡间，人事已经变更了。每个人的命运，已由上天注定，善恶到头终有报应的。求得此签，宜多种善作福，顺应天时。","diangu":"雪梅为安南国王之宫主。特征联求婚。其联首曰。太极殿前三尺雪。后有广东人姓黄名华贵。当时福至心灵。以梅之得植于人间。原出于天上仙花之种。乃以“广寒宫里一枝梅”为对。以此联应征。卒获招为驸马。"},{"n":21,"name":"武则天赏花","ji":"中吉灵签","jie":"武则天，唐朝的女皇帝，是历史上一个传奇女子，在位时，曾于冬残春未到时，要欣赏百花，令百花仙子限时争妍斗丽，还亲自击鼓催花。这支签是描述当时赏花情况：天边的红霞如织锦，门外的桃花杏花在争艳，一边品评着哪种花最美丽，一边饮着美酒，真是人生乐事。求得此签，可望富贵平安。","diangu":"此为唐时武则天。于冬天击鼓摧花时。评桃品杏之情景也。"},{"n":22,"name":"陈妙嫦思春","ji":"下下灵签","jie":"陈妙嫦，即陈姑，削发为尼后，凡心未息，常常思念以前的恋人。此为下下签。求得此签，一来景况凄凉，二来因缺乏定力，患得患失，举棋不定，难免一事无成。秋水伊人，天南地北，各处一方，此恨绵绵无尽，满腹相思，凭谁寄语，说不尽的凄凉，枉自痛断肝肠。真的是，字字伤心。宜多作善福，有贵人扶持，才能出生天。","diangu":"天南地北。各居一方。书信又无人寄。思念到肝肠都断。此乃凄凉之景象也。"},{"n":23,"name":"卢生梦","ji":"中平灵签","jie":"邯郸幻梦，即是黄粱美梦。故事发生在唐朝，有一个，叫卢生，在邯郸旅店投宿，遇一姓吕道人，给他一个枕头，睡在上面，发了一梦，享了几十年繁华。梦醒时肚饿极，店主锅中的黄梁还未煮熟呢。这支签，提醒人们别相信幻象，要脚踏实地，欲想衣锦荣归而又不是发白日梦，就要脚踏实地。同时，亦有暗示，不要受骗，小心别人的甜言蜜语，糖衣炮弹。","diangu":"梦中得富贵。着锦绣衣裳回家。醒后仍然记在心中。此乃一片虚假之情形。此签虽无防碍。但亦无可取之处也。"},{"n":24,"name":"白居易归隐","ji":"下下灵签","jie":"白居易，唐朝大诗人。才情绝伦，但官运并不亨通，这支签的意景，在白居易著名作品《琵琶行》中亦有出现过——“其间日暮闻何物，杜鹃啼血猿哀鸣。春江花朝秋月夜，往往取酒还独倾。”在被贬谪（即今日之“下放”）日子里，诗人过着极孤寂的生活。诗酒琴棋当然可以解愁，但是无伴，又怎能行乐呢？自弹自唱谁来欣赏？独自饮酒，既冷淡，又哀愁。此乃下下签，宜多修身，作福。","diangu":"诗酒琴棋。可以解人愁闷。苦无人客知己。独自弹琴唱歌。优点无人得知。如此冷淡。虽然多饮几杯闷酒。仍然是忧也。"},{"n":25,"name":"朱洪武登基","ji":"上吉灵签","jie":"朱洪武，明太祖朱无璋，少年时曾在皇觉寺出家。幼时家贫，放牛以补家计，曾与一群牧童登上嵩山（中岳），说：“他日我若为皇帝，群臣就像群山一样，向我拱、立朝拜。”后来朱无璋建立明朝，果然尊五岳为神。（五岳：东岳泰山、南岳衡山、西岳华山、北岳恒山、中岳嵩山）。此签有位高得意之象，群山纷纷向中岳朝拜，好象臣子列班，整齐又严肃，居此位置，怎能不开心呢？","diangu":"天下之山以中岳为至高。四山朝拱。齐整如人臣拱手排班而立。居此地者。有如君之使臣。一呼即应。明朝开国之君。朱元璋。少时牧牛时。率群童登中岳之巅。戏称自己为帝。使群贺之。后朱元璋竟成真正皇帝。号称洪武。统一山河。"},{"n":26,"name":"徐庶归家","ji":"中平灵签","jie":"徐庶，三国时代一个杰出的政治家、军事家，与孔明是好朋友。本来，徐庶是有心辅佐刘备建立帝业的，但曹操却利用徐庶母亲来“打人质牌”，使徐庶改变初衷，返回家乡，落入曹操手中。徐庶离开刘备时，走马荐诸葛，极力推崇孔明。徐庶归家后，被徐母大骂他上了曹操的当。孝义两难存，徐庶在曹操手下做官，始终是、“身在曹营心在汉”。此签是描述徐庶被曹操放假后，思念母亲，归家心切之情。","diangu":"花影侵于花基上。知系月镜排在空中。忽闻鹤声啼得悲切。即要买舟回家。"},{"n":27,"name":"越王复国","ji":"中平灵签","jie":"这支签，用蝶蚁知时，来比喻越王勾践复国的苦心和知机，凡事要顺时顺势，顺其自然，则较易成功。天晴时，粉蝶就会把被雨露沾湿的衣服（双翼）来晾晒。当天气炎热时，暴风雨来临之前，蚂蚁就会排列成行，整齐地前进或后退，队形时开时合。求得此签者，自己不妨仔细思考其中哲理，可以得到莫大的启示。","diangu":"天晴则蝶晒其翼。将雨则蚁出如摆阵。或进或退。时开时合。在蚁子亦甚得意矣。人与物同。各得其意。便是快活。"},{"n":28,"name":"白居易听琵琶","ji":"中平灵签","jie":"这又是一支与唐朝诗人白居易有关的签，不过，这是中平，而第廿四签是下下。区别是，廿四签失于孤单；这支则属中平，因为，总算有片刻的欢娱。白居易在浔阳江头夜送客，在船上听到悦耳的琵琶声，寻声访问，得见一失意女子，“同是天涯沦落人，相逢何必曾相识”，白居易有感于自己的落泊与琵琶女的遭遇，写成了著名的长诗《琵琶行》。这签中虽有快活，但极短暂，宜修身，忍守。","diangu":"古人白司马。当时被贬闲居。在浔阳江上听琵琶。此非快活之景。两地相思。无人寄信。白发又催人老。此更冷淡。"},{"n":29,"name":"张翰思鲈","ji":"中吉灵签","jie":"张翰，晋代吴郡人，有识之士，曾被齐王召为大司马，当时政局纷乱，张翰不欲卷入政治旋涡，于是，托辞秋风起，思念故乡的鲈鱼、菊花，辞官归故里。此签虽只属中吉，但知足者求得，一定有很愉快的日子。鲈鱼作脍，脍就是鱼生，有黄菊、美酒相伴，在秋高气爽的黄昏，泛舟在涨潮的湖上，试想一想，这样的良辰美景赏心乐事，还有什么忧愁的。","diangu":"好鱼生。好菊花。好酒。好天时。好潮水。在水面快活之景。件件俱全。其乐无穷尽矣。"},{"n":30,"name":"贵妃自缢","ji":"下下灵签","jie":"唐明皇因终日与杨贵妃享尽骄奢淫乐，荒废朝政，惹来安禄山兵变，京师有危，六军保驾往四川方向撤退，行至马嵬坡，将士忽然不肯再行，一定要唐明皇先处死杨贵妃。在无可奈何之情势下，一代 绝色的美人在君皇掩面不忍卒睹时，自缢而死。此签为下下，求得者能引以为戒，仍可避凶。因杨贵妃死后，在天上与唐明皇相见。签首两句，写杨贵妃国色天姿，风流得意时。后两句写死后与唐明皇长相思。","diangu":"唐明皇专宠爱杨贵妃。六宫美女尽不钟意。及安禄山作反。出兵征之。行到马嵬坡。三军不行。要皇将杨贵妃斩首。至肯前进。于是贵妃死在马嵬坡下。而魂飞天上去也。至明皇日日长恨之。此签有凶无吉。"},{"n":31,"name":"蔡中兴遇险","ji":"下下灵签","jie":"蔡中兴，北宋人，在福建泉州当官时，修建洛阳桥，凡事亲力亲为。洛阳桥工程宏大，以当时的建筑技术而言，实在是奇迹，传说中有神仙帮助。这支签，是说蔡中兴晚上乘船视察工程时，忽然遇险。狂风骤雨，吹打着船篷，河边的桃花，都被吹落了。惊醒了船上的渔翁，慌忙中，水流湍急，不辩南北西东。此为下下签，恐有惊险之象。","diangu":"狂风急雨。打落桃花。大雨打落船篷。惊醒鱼翁。此有险之象。竹篙撑艇。不知西东。此彷徨昏迷之象。"},{"n":32,"name":"苏武牧羊","ji":"中平灵签","jie":"苏武，汉代的一位忠臣。武帝派他出使匈奴，被番王单于拘留，威迫利诱，要他变节投降，苏武不屈，被放逐北海牧羊，所牧者，皆公羊，番王下令，除非他回心转、意，又或者公羊能产子，才能获释。苏武饮雪吃草籽，在风雪中挨了十九年，才得以还乡。后获宣帝赐爵“关内侯”。签文道尽苏武牧羊的艰辛，十九年如一日，天天紧握汉朝的使节杖牧羊，最后，连节杖的旗旄也被风吹去了，才得还乡。","diangu":"古人姓苏名武。受困于番邦地方。在海上看羊十九年。天寒无饭食。以毛毯包雪食之。而无人可怜。惟羊仔陪伴。此乃凄凉之景象。"},{"n":33,"name":"孔明借东风","ji":"中平灵签","jie":"三国时期，孔明是刘备的军师、丞相，在与奸雄曹操抗衡中，曾多次运用智谋，把曹操打得落花流水。签中所讲，只是其中两个代表作，一是孔明借东风，火烧赤壁;二是发明了木牛流马这种运输工具，运送粮草补给。曹操有阴谋诡计，但也难胜过诸葛亮的智慧。求得此灵签者，事无大小，都要心存正义，切勿自欺欺人，做事光明正大，才可以远离小人。凡事不利，要防小人是非口舌，如立心光明正大，化凶为吉也。","diangu":"此签源自《三国演义》中赤壁之战的故事。当时，曹操率领大军南下，意图吞并东吴和蜀汉。诸葛亮与周瑜联手制定火攻之计，但火攻需要东风助力。诸葛亮凭借其智慧，预测到风向将改变，并假借“向天借风”之名，成功让东风如期而至，助东吴火烧曹军，大获全胜。这一计策不仅展现了诸葛亮的谋略，也体现了“巧用天时”的智慧。"},{"n":34,"name":"虞舜耕田","ji":"中吉灵签","jie":"舜，中国古代的一位部落联盟领袖。大舜，是尊称。这支签，有孝感动天的含义。大舜虽然在历山这地方耕地，但心里很挂念家中的父母，最难能可贵的，是这两位老人家，都是较为盲塞固执的，而大舜事亲最孝顺。两老在大舜工作期间，时常因争吵而要大舜赶回家中去排解。幸而所养的大象，感于大舜的善良，都很听话，帮助他耕种及处理家务。","diangu":"古人有舜在历山耕田。其父母皆顽梗。不讲仁义忠信。而大舜事之极孝顺。田常有象代舜耕田。有鸟代舜耕草。可知人能行善。则由天遣神佑。可免辛苦。若行恶。象不代他耕田矣。此即可以分出善恶。"},{"n":35,"name":"唐僧取经","ji":"中吉灵签","jie":"唐僧，即唐三藏，本姓陈，法号玄奘，唐人高僧，曾往印度研习佛经，十余年后返国，全心致力译经，凡一千三百三十五卷。他取西经的艰辛故事，在民间流传甚广，最脍炙人口的是《西游记》。这支签，是先苦后甜，凡事要尽心尽力之意。上天要人做大事，首先要令他筋骨辛劳，心脑受苦，甚至还要挨饿。千万别以为好景是天上掉下来的。每一个人今天享福或挨穷受苦，都是有前因的。","diangu":"天将以大任降此人。必先以贫穷劳苦其身。莫谓富贵发达。佳景来得轻易。人之贫穷富贵有前世因果也。求得此签者。要立一片善心。凡事勿辞劳苦。将来必有报应。"},{"n":36,"name":"薛平贵归家","ji":"中吉灵签","jie":"唐朝时，王丞相抛绣球招亲，王家小姐宝钏意属薛平贵，于是，绣球便落在他身上，唯王丞相嫌平贵寒微，有反悔之意，幸宝钏情比金坚，宁愿放弃富贵，下嫁到平贵的寒窑，双宿双栖。婚后不久，平贵从军征战，而宝钏则独守寒窑。这支签，是平贵在军中建立战功，得意回窑，与妻子宝钏重逢的好景——眼前的事，就好像船靠岸，还愁没有风景？抬头见到前面的村屋，在夕阳里升起阵阵的炊烟。","diangu":"行船已湾到岸。不忧无风无水之虑。举头又见自己之村乡屋角煮饭烟起。此乃薛平贵回会妻。来到乡村前所见之景象。心安快乐。无忧无虑。"},{"n":37,"name":"东坡游赤壁","ji":"上吉灵签","jie":"苏东坡虽然官运并不太好，但胜在名士风流，交游广阔，寄情于山水之间，对着良辰美景，与知己诗酒唱酬，亦人生一乐事。苏东坡游赤壁，写下了传诵千古的《大江东去》一词。这支签，记述苏东坡游赤壁的赏心乐事：秋月照在江水，与好朋友泛舟垂钓，居然钓到极品“四腮胪”，于是，把家藏的旧酒拿出来，与大家分享，共度这段欢乐时光。","diangu":"苏东坡月夜与友泛舟游于赤壁。钓得四腮鲈鱼。有一斗家藏旧酒。与好友共斟同饮。此乃快乐优游之景象也。"},{"n":38,"name":"陶渊明辞官","ji":"中吉灵签","jie":"晋朝，陶渊明不为五斗米而折腰，辞官不干，返乡下享其清福。过着归隐的生活，他为此而写的《归去来辞》，就是这支签的含义。归去来兮，做官有什么了不起？回到我简陋的家园，虽然家居窄小，也觉得安乐无比。倚着南窗，寄托我的傲气，与知己把酒谈诗。也可以执杖登高，到处行脚，饱览山林美景。求得此签，乐得清静，有吉无凶。","diangu":"晋陶渊明。辞官归隐。对于做官看得甚闲。屋小仅堪容膝。亦此为可安居。倚南窗谈诗饮酒。倚杖看山。此一片逍遥之安乐光景。"},{"n":39,"name":"夷齐让国","ji":"中吉灵签","jie":"伯夷与叔齐，商朝孤竹君的两个儿子。孤竹君废长立幼，死后立叔齐为继承人，但叔齐却坚决要让给哥哥，伯夷也拒绝接受，结果，两人放弃做君王的机会，先后逃、到周国，后来，周武王代纣，伯夷叔齐叩马谏阻，周王灭商后，两人耻食周粟，逃到首阳山，采薇蕨野草充饥，最终饿死。伯夷叔齐一向都被知识份子崇拜，为高尚节气的榜样。但求得此签者，却属于吉中有凶，有失运的隐忧。","diangu":"昔伯夷叔齐兄弟让国。耻食周粟。采蕨薇食之。后来卒饿死首阳山。但其让国之名。留传万代。"},{"n":40,"name":"伯才碎琴","ji":"下下灵签","jie":"春秋时，出了一位杰出的琴师伯才，他有一位知音，就是钟子期。可惜，钟子期比伯才先离开这世界。伯才悲痛不已，把心爱的琴摔得粉碎，哭着在坟前说：“世上只有子期才领会我的琴意，子期死了，阴阳相隔，天各一方，弹琴还有什么意思呢！”从此真的不再弹琴了。此签为下下，既有悲痛之象，亦有失友失物之意，并暗示本身的才华无人赏识。求得此签者，宜平心静气，修身力学，退守一段时间，再待势复出。","diangu":"昔俞伯牙擅弹琴。钟子期死。伯牙以世上无几人能知音。将琴破碎之。以后不复再弹琴。从此阴阳相隔洒泪坟前。此痛恨之象也。"},{"n":41,"name":"张骞获宝石","ji":"中吉灵签","jie":"张骞，汉朝，曾多次出使西、北邻国，对于文化、经济交流有很大贡献。张骞通西域，有历史记载。玉门关外的宝石、音乐、葡萄，就是由他传入中原的。这支签，是说张骞月夜泛舟，来到天河，见仙女在织锦，他悄悄地取去织机上的一块石头而归，回到凡间，才知道这原来是宝石！求得此签，有福自然来，而且又有身在福中不知福之象。凡事吉祥，勿庸担心。","diangu":"张骞先师于月夜泛艇到天河。见仙女织机。遂取其机头之石而归。世人少有识此宝。不知此宝出自云间也。此签言自己有宝物而不识。此难遇贵人之景象也。"},{"n":42,"name":"王允献貂婵","ji":"中吉灵签","jie":"东汉时期，奸臣董卓当道，民不聊生，王允设“美人计”，献貂婵，令董卓与其义子吕布因争美女而不和，董卓终于失败，暴尸荒野。这签是讲王允徘徊月下花前，正为剿灭奸臣伤脑筋，幸然婢女貂婵自愿以身报国，使王允的美人计得以成功。求得此签，今年有几点一定要注意，凡事立心要忠诚正直，切勿与坏人同流合污；要全力以赴，并要有信心。","diangu":"东汉时。有奸臣姓董名卓。王司徒允欲诛灭之而无计策。月夜在花栏边散步。有婢女名貂婵。欲出计安定汉室。王司徒遂将貂婵嫁与董卓。卓为英雄人物。乃昏迷于貂婵。终受诛灭。是英雄难过美人关也。"},{"n":43,"name":"韩文公被贬","ji":"下下灵签","jie":"韩愈，唐朝一位很有学问的人，为官正直敢言，因上书谏迎佛骨，而被贬广东潮阳。此签是记述当时在贬谪途中的凄凉景况：因为直言进谏，而惹怒皇帝，早上上书，当晚就要起程到边远的潮州，为了赶及上任新的潮州剌史，必须日夜赶程，人不离马鞍，韩愈与随行的仆人忙于奔命，非常疲倦的时候，更遇上大雪拥塞蓝关，人马受阻于途，难再上前一步。此为下下签，得罪皇帝，前途未卜。","diangu":"韩文公以直谏激怒于人君。至被贬远方。日夜骑马鞍行之不歇。主仆如此奔忙。精神亦倦。更加遇落大雪。拥塞蓝关之路。而不能行。此辛苦之景象也。"},{"n":44,"name":"唐天宝评花","ji":"中吉灵签","jie":"唐朝天宝年间，太平盛世，唐玄宗李隆重基在位。当时，世人甚爱牡丹，以之喻意富贵吉祥。这支灵签是当时百花争艳，牡丹被评为百花之首的情景。满园春色，百花都在炫耀自己的新妆，大家都有意争夺国香的殊荣。到底是谁名列第一呢?你看牡丹!她艳压群芳，获得全场冠军!此灵签虽只是中吉，但有春风得意之好兆头。","diangu":"此签源自唐朝天宝年间（公元742-756年），唐玄宗李隆基在位时期。当时，社会繁荣，人们尤其喜爱牡丹，认为其象征富贵吉祥。传说中，唐玄宗与杨贵妃在沉香亭赏牡丹时，命李白作诗赞花，李白挥笔写下“云想衣裳花想容，春风拂槛露华浓”等名句，将牡丹的美艳和杨贵妃的美丽相提并论。最终，牡丹因艳压群芳，被公认为百花之首。"},{"n":45,"name":"王质遇仙","ji":"中平灵签","jie":"王质，本是一位平凡的樵夫，有一日，上山砍柴，无意中，误进仙山，看见两位老人家在下棋，棋局适逢高手，变化万千，非常有趣，王质看得入神，忘记一切，七、日七夜，很快就过去了，王质才发现自已带来的斧头竟然烂了，才醒悟要取柴回家。当他返回家时，一切都已经改变了，没有人认识他，他又不认识任何人，细问之下，才知道他离家已经一千年了！这就是“山中方七日，世上已千年”的故事。","diangu":"古人姓王名质。入山采薪。巧遇两仙人敲棋。看到斧头柄栏了。然后归家。在山中不过七日。而世上经已过千年矣。结局似觉平淡。无甚欢喜。亦无妨碍。"},{"n":46,"name":"左慈戏曹操","ji":"下下灵签","jie":"左慈是三国时代，一位传奇人物，曾多次运用法术，戏弄曹操，令这个已患有头痛痼疾的一代奸雄，更加头痛。但左慈最后亦被曹操追杀，不知所终。签中所举的只是左慈戏曹操的其中一个例子：他把几盒外表金黄的极品柑果献给曹操，但用刀切开来一看，内里却是空空如也的。激怒了奸雄曹操要把他追杀，他连忙混在羊群中逃走。这支签暗喻，在好的假像中，有极坏的潜伏。","diangu":"三国时。左慈献柑数盒于曹操。操将其柑剖开。无一个有肉。激怒曹操。以斧头斩之。慈即奔入群羊中退避。此以假局欺人。惹祸归身。有凶无吉矣。求得此签者。凡事凶多吉少。急宜多行善事。凡做一事。必要真实无妄。忠直存心。宽厚待人。方能化凶为吉也。"},{"n":47,"name":"鲁肃索荆州","ji":"中平灵签","jie":"三国，魏、蜀、吴，即曹操、刘备、孙权，刘备曾听孔明之言，联吴抗魏。初时，刘备未在四川一带建立蜀国的根基，曾向孙权借荆州，作为暂且栖身之地。后来，东吴曾多次由鲁肃出面向刘备要求归还，但刘备诸多理由，一味用“拖字诀”，推说是“无可奈何，暂时无法归还荆州”。这就是“刘备借荆州，一去无回头”的典故了。此签中，有借而不还，亦有哭泣之象，求得者宜细心领悟其中意思。","diangu":"昔刘备向吴借荆州。及刘备得蜀之后。东吴使人来西蜀。索取荆州。刘备一言未出。便痛哭流泪。自思无计策可以圆转也。以一哭得还荆州。有借无还。而当哭泣之时。乃悲愁之景象。"},{"n":48,"name":"卓文君卖酒","ji":"中平灵签","jie":"卓文君，西汉时的一位奇女子，她祖父是卓王。文君擅长弹琴，思想开放，丈夫死后不久，即遇上才子司马相如，两人一见钟情，结为夫妻并私奔。后来更不理人、言，双双返回故乡，在闹市开设酒家，才子司马相如下厨，佳人卓文君当炉卖酒，成为一时佳话。虽然贫贱夫妻，却竟也百事不哀而极之快乐。此签是文君新寡时，夜里听到司马相如的琴挑，于是决意漏夜跟他私逃。后来二人临邛闹市卖酒，夫妻齐心合协力。","diangu":"昔卓氏有女名文君。新寡。听司马相如弹琴。遂起情心。乘夜奔往相处。成为夫妻。但家贫。两夫妇在临邛市开设酒档。一个是才子。一个是佳人。两家都要当炉卖酒。此亦有辛苦之气象也。司马相如后大贵。"},{"n":49,"name":"司马相如题桥","ji":"中吉灵签","jie":"司马相如，是一位有学问的才子，琴棋诗画，样样皆精，他的赋体文字华丽，后来被汉武帝赏识，获封官。此签记述司马相如未成名之时，在桥头题字的感人故事。十年寒窗苦读书，终于学业有成了，但心中的大志，却无机会得以发挥。于是，司马相如在四川成都家乡的一条桥上，题了这十三个字“他日若不乘高车驷马，不过此桥！”其志竟有如此坚决者。","diangu":"昔司马相如。十年窗下苦心读书。贫穷不得意。其为有志气之人。故当入蜀过桥。题十三字于桥柱曰。他日若不乘高车驷马。不过此桥。随后果得大贵回家。经过此桥。有志者事竟成矣。"},{"n":50,"name":"伍员出关","ji":"中吉灵签","jie":"伍员，即伍子胥，春秋战国楚人，父兄被楚平王杀害，幸及时逃到吴国，后助吴王伐楚，掘楚平王墓，鞭尸三百以泄恨。当年伍员逃难时，困难重重，一夜白头。这支签是记述伍员逃亡时遇贵人。伍子胥逃难时，被江水阻隔，前无去路，后有追兵，幸有渔夫相救，载他渡江，伍子胥感激之余，坚持要以宝剑相赠，但渔夫却辞之不受。","diangu":"昔伍子胥楚人也。楚王追杀之。避难奔至江边。有一渔舟救之渡江。伍子胥将自己之剑赠于渔父。渔父不受。以此大义相交。故辞剑也。"},{"n":51,"name":"成王剪桐封第","ji":"中平灵签","jie":"成王，西周国王，年幼丧父，国事暂由王叔周公管理。成王有一天，与弟弟唐叔玩游戏，成王把桐叶剪成圭形，说：“我封你为诸候。”周公知道这件事，便恭喜唐、叔。成王却说，开玩笑而已。周公教训他：“君无戏言。”后来，周公东征胜利，巩固了西周的政治势力，并还政于成王，成王大封诸候，果然守信，把唐这地方封给唐叔。此签之含意甚深，凡事要诚恳，慎言，守信，兄弟要和好。","diangu":"周成王在宫中。自剪桐叶如圭形。与弟戏言曰。封尔为诸侯。至周公入贺。成王曰。吾戏言耳。周公曰。君无戏言。遂封其弟唐叔于唐。随后其子改唐国日晋国。"},{"n":52,"name":"盘古开天辟地","ji":"中平灵签","jie":"盘古，生于天地混沌中，后来他开天辟地，盘古每日长高一丈，天亦高一丈，地亦厚一丈，经过一万八千年，天地才完成。这支签，是说：气清而上浮者为天，气浊而下凝者为地，中间清浊二气相混者，就是人。假如你求得这签，只要仔细思考一下，将上中下的气与上中下等人联想，就不难悟出真理了。明乎此，要凶要吉，全在乎自己，要做上浮之清气，还是下凝之浊气，请自便吧。","diangu":"气清而上浮者为天。气浊则下凝者为地。半清半浊在中间为人。三等分开。"},{"n":53,"name":"冯暧客孟尝","ji":"中吉灵签","jie":"战国时期，孟尝君有食客三千，冯暧初时只被当作“下宾”，冯暧拍击着剑套，大声地说：“剑啊，我们不如走吧！这里食无鱼，出无车！”孟尝君闻后待之为上宾。后来，冯替孟尝君广结善缘，使孟尝君不但逃过大难，而且收复封邑。这支签是说：孟尝君食客三千，谁人独具慧眼，识得其中这样的人才呢？这位曾经弹铗而歌者，便是冯暧这位英雄了。","diangu":"战国时。齐公子孟尝君。有食客三千人。冯暖为下客。弹剑铗而歌曰。弹铗归来乎食无鱼。出无车。孟尝君因之待以上客之礼。冯暖为英雄人物。其志气无人可当也。"},{"n":54,"name":"庄周梦蝶","ji":"中平灵签","jie":"庄周，战国时一位杰出的思想家，主张清静无为，著作甚多，楚威王甘词厚蹩，封他为相，也遭拒绝。唐朝尊崇道教，天宝元年号庄子为南华真人。这支签，说的是“庄周梦蝶”的故事：话说庄子在梦中化成一只蝴蝶，在百花丛里飞来飞去，采得香花归来时，却发现自己仍然睡在高床暖枕里。求得此签者，逍遥快乐，与世无争，与人无求。暗示未是谋大事的时候。","diangu":"古人姓庄名周。梦自己化为蝴蝶。飞入花丛采花。梦醒之后。乃在高床暖枕中也。此乃一片假局。"},{"n":55,"name":"吴隐之投沉香","ji":"中平灵签","jie":"吴隐之，一位清官，曾来广东省当官，爱民如子，后来辞官离去时，两袖清风，人民感激其任内德政，纷纷致送礼品，吴隐之一一婉拒，岂料归舟在珠江河上行走，忽然风浪大作，吴隐之连忙查问家人手下有无收受利者，众人都说没有，但有人提醒他，吴夫人手上的沉香扇，乃一父老所赠。吴隐之马上焚香向天祷告，然后把沉、香扇投入江心，果然风平浪静，江上出现一小岛，即今日之沉香浦。","diangu":"古人吴隐之。来广东作官。爱护子民。两袖清风。及辞官回家。人民感其德政。纷纷赠以礼物。隐之不接受。只受一沉香扇坠。及乘舟离任。风浪大作。隐之祷告天地。将该沉香扇坠投于水。以示清廉。果然风平浪静。一路平安达家园。后人因此称该处为沉香浦。渡江者每追念当年隐之之清廉。"},{"n":56,"name":"吕祖桃木剑","ji":"中吉灵签","jie":"吕祖，吕洞宾，八仙之一。桃木剑，就是这位纯阳祖师，在唐朝时辞官修道，所持的仙器。本签寓意吉祥，暗示一切都向好的方面发展。仙机见于签语的首两字——“安知”——怎么知道这把桃木剑不会成龙呢？将来修成正果，一见仙水，它就会化成一条龙，从吕祖的衣袖中飞腾而出，飞升千万里，空中还有彩云相伴随！求得此签，应努力振作修为，必成大器。","diangu":"袖中之剑。见水则出而化为龙。飞腾万里。此古之奇事。吉祥之兆也。但本签有安知二字。则此剑仍未化龙也。"},{"n":57,"name":"独占花魁","ji":"中吉灵签","jie":"这支签是说，春天来了，带来新的生机，要及时把握，独占花魁，（魁者，首也，暗示凡事要饮头啖汤），但行事要胆大心细，眼明手快之外，还要循序渐进，俗语说，捉到鹿，要识得慢慢脱角。您看看签语怎么说？——在小楼上，听得绵绵的春雨终于停下来了，但街头的脚步声，却又响个不停，忽然听见巷口传来卖花人的声音，马上买了第一枝花，然后在湿滑的街上，安步走回家。","diangu":"春雨初歇。穿屐行街者不停。忽闻有卖花者入巷叫卖鲜花。买得花一枝。而慢慢行路。恐路湿滑也。"},{"n":58,"name":"蹇叔哭师","ji":"下下灵签","jie":"春秋时，秦穆公要出兵侵犯郑国与晋国，老臣子蹇叔，极力劝谏，不可做这等无良无义之事，但秦穆公一意孤行，结果，大败于淆山，统领军队的三个元帅，俱被对、方生擒。晋君之母乃秦穆公之女，晋康公念外祖父之情，释放这支败军返秦，但要倒戈舍甲（把兵器的利刃向下，脱去战袍护甲，情形十分狼狈）。这支签凶险很多，第一是妄想，第二是不听忠言，一意孤行，第三是失败，第四是蒙羞。宜多加避凶。","diangu":"秦穆公不听老臣蹇公之言。出师侵郑与晋人战于殽。秦师不敌大败。三个大元帅俱皆被擒。秦穆公之女。本为晋君之母。请晋康公将三元帅放还回秦。倒戈弃甲。"},{"n":59,"name":"东施效颦","ji":"下下灵签","jie":"西施，中国古代四大美人之一。春秋时，越国几乎被吴国所亡，后来，越王勾践得范蠡献西施，与吴国议和，吴王夫差得西施后，荒淫迷乱，终被越王所亡。这支签是说，西施这位浣纱女，美艳无双，一笑倾城，再笑便令吴王倾国了。最不自量的是丑女东施，整天模仿西施皱眉头的样子，以为可以博取别人的怜爱，其实，山鸡就是野鸡了，岂可以冒充凤凰呢？","diangu":"昔有美女名西施。原为在溪边涴纱之女。越王勾践。送上西施于吴王。媚得吴王极昏。终至亡国。有女子东施者。其貌极丑。乃学西施之颦笑以媚人。以至弄巧反拙。所谓山鸡岂会变凤凰。即此之意也。"},{"n":60,"name":"李白醉和番书","ji":"中平灵签","jie":"诗人李白，曾被奸臣杨国忠、高力士所辱，杨国忠曾奚落李白，“你的文章算什么？只配替我磨墨！”高力士附和：“不，磨墨也不够资格，只配脱靴提鞋而已。”后来，番邦派特使来长安，诸多威胁求索，最危险的是，朝中竟无一人可与特使沟通。当时，有人向皇帝推荐李白，惜李白正大醉，皇帝颁召令请他入宫，亲自喂他服食解酒汤。李白醒后，要杨国忠磨墨，高力士背靴，醉眼昏花下，笔似云烟，写了“和番书”，吓得番邦不敢再来犯。","diangu":"古人李太白。性好酒。日眠于长安市酒店。唐明皇有令召之。再呼亦不下船。因此地乃一好快活逍遥之所。而且他不贪富贵者也。"},{"n":61,"name":"十二金牌召岳飞","ji":"下下灵签","jie":"宋朝忠良岳飞，大破金兵，眼看就要直捣黄龙，救出徽钦二宗，无奈奸臣秦桧，假传圣旨，擅用十二度金牌召回岳飞，继而以谋反之罪，害死岳飞父子。此签为下下签，暗示在功败垂成的一刻，遭奸人所害。十二度金牌召回岳飞时，百姓扶老携幼送行，悲哀万分。求得此签，要趋吉避凶，首先要修善积福，其次是处处防犯小人，再者更要广结善缘。常常听取别人忠告。","diangu":"宋岳飞。大败金人。奸臣秦桧。设法假冒圣旨害之。擅用十二度金牌。召岳飞收兵回朝。使岳飞之兵散局。而不成就。老少扶着岳飞之车而泣。哀声不断。岳飞卒被秦桧害死。"},{"n":62,"name":"孔子守道","ji":"中平灵签","jie":"孔子，圣人也。无论学识、道德、思想，都是万世师表，但是，他的仕途官运都不好，唯将毕生精神都放在教化学生和著书立说的学问工夫中。这支灵签是说：一个人的才学，就像一块美玉，应该好好珍惜，收藏在柜中，并不是等待有好的价钱，然后出卖。而是要看机缘，假如遇上有眼光，真正欣赏自己的识货之人，那又是另一回事。怀才不遇的人，又何必常常顾影自怜呢?","diangu":"孔子一生坚守道德与学问，虽未能在仕途上获得成功，却将毕生精力投入教育和著述，最终成为万世师表。这反映了孔子在逆境中不放弃对“道”的追求，体现了儒家“守道”的精神。"},{"n":63,"name":"颜回乐道安贫","ji":"中吉灵签","jie":"颜回，春秋鲁国人，孔子的好学生。世人尊称孔子为“至圣“，也曾有人称颜回为“亚圣”，但后来，大多数都把“亚圣”这名衔尊加于孟子，而改称颜回为“复圣”。这支签，是孔子称赞颜回的话：颜回，真是一个贤人，他乐道安贫，生活在陋巷里，只得一碗饭、一杯水，旁人看见他的环境，都替他担忧，但他却无忧无愁。世人应知道，一个人如能专心于学问修道，是可以忘记贫穷的。","diangu":"古人姓颜名回。一箪食。一瓢饮。在于陋巷。旁人见之甚忧。而颜子自乐其道。他不觉自己之穷。工夫做到圣人地位。而名留万古。"},{"n":64,"name":"孟之反殿师","ji":"中吉灵签","jie":"孟之反，春秋鲁国人，官至大夫。有一次鲁国被齐国打败，鲁军争相撤退回城，狂奔之情景，非常狼狈，但孟之反却坚持要做殿后将军，当他最后一个撤入城门时，别人都称赞他勇敢而又肯照顾他人，因为按照常理，败军，谁肯甘愿跑最尾呢？但是，孟之反还有更伟大的情操，他在别人的称颂声中，却很谦虚的说：“我不是勇、敢，只是我的坐骑太累了，怎么样鞭打它也不肯走呢！”孔子曾大赞孟之反的英勇仁义。","diangu":"昔鲁与齐战。鲁师败北。孟之反奔到收尾第一。谓之殿军。此有功能最着者也。在人必夸张不已。孟之反入门策马曰。非敢后也。马不进也。此不夸自己之功能。孔子尝称赞之。"},{"n":65,"name":"后主失国","ji":"下下灵签","jie":"这是一个哀怨缠绵的历史故事。记述风流亡帝陈后主，好色昏庸，终日迷恋于张贵妃和孔贵妃，不理朝政，后来，隋高祖起兵讨伐，陈后主的江山，就在剑戈中倒台了。陈后主左拥右抱着两名宠妃，东奔西跑，苦无逃生之路，唯有藏进胭脂井中，隋兵赶至后宫，发现他们的踪迹，用绳吊他们上来。此为下下签，凶险多多，要及早防范，不要沉迷酒色，胡天胡地，否则，灾祸速至，后悔莫及。","diangu":"昔陈后主。为张贵妃孔贵妃所媚。昏迷之极。隋高祖起兵伐之。陈后主东奔西走。无可藏匿。遂与贵妃等隐藏于宫中之胭脂井。隋兵到。以绳引之而出。执之以归。遂将陈灭。败国而丧身。"},{"n":66,"name":"羲之会群贤","ji":"上吉灵签","jie":"王羲之，书法家，他的字帖，为历代朝野收藏的至宝，很多皇帝甚至用王羲之的字作为陪葬品。后人尊他为“书圣”。《兰亭序》更是王羲之最著名最成功的书法，卷上有多位皇帝加盖玺印。《兰亭序》记述王羲之，在三月三日与一众好友在会稽山之兰亭，欢聚的情景。在短短的二十八字签语中，已写出一幅有音有色的图画。求得此签，百事吉祥，快活顺景。","diangu":"古人王羲之。三月三日。合众贤人至会稽山之兰亭。是日天气朗润而不暗。惠风和畅而不寒。此地有茂林修竹。王羲之与群贤。曲水流觞而饮西。此乃一种自在逍遥快乐景象。"},{"n":67,"name":"李元霸称雄","ji":"中平灵签","jie":"李元霸，隋唐时的第一号风云人物，年少力勇，武功盖世，为唐朝的建立，打下基础。可惜，英雄寿短，牺牲沙场。此签有提醒凡事不可锋芒毕露，搏得太尽，容易残。签语云：李元霸这人，虽然能力不可挡，但是，不要自恃年少气盛，到处耀武扬威，即使有力拔泰山、翻江倒海的力量，也应该顾及自己的生命。做人不能一味靠恶、靠蛮力。","diangu":"人虽有勇力。不可自恃。李元霸称第一英雄。能做得世间极难之事。能挟泰山以超北海。其身也要保重。虑其存而易亡。此心要持守。不可亡而不存也。"},{"n":68,"name":"姜太公得志","ji":"中吉灵签","jie":"姜太公，怀才不遇，只有在山水间寄托自己的凌云大志。他在渭水钓鱼，荷枝作著名的古语——“姜太公钓鱼，愿者上钩”。当时，纣王无道，群雄并举，周文王不、远千里而来，到渭水之滨寻访隐居的姜太公，终于，姜太公协助周文王、周武王，打败了纣王，建立周朝帝业。此签虽为中吉，但寓意吉祥，求得者，只要能顺应天、时，立心良善，必然万事如意。","diangu":"古人姜太公。久有出身之志。而未合时。隐于渭水钓鱼。及文王远求贤士。拜姜太公为帅。灭商兴周。任其意思自如。"},{"n":69,"name":"韩文公祭鳄鱼","ji":"中吉灵签","jie":"韩愈，虽因直言而被皇帝贬官潮州，但因文、德、政各方面都有很大的贡献，后被尊为文公。韩文公在潮州为官，勤政廉洁，为国为民，当时潮洲沿海一带常有鳄鱼、出没，威胁人畜的生命，韩愈写了一篇“祭鳄鱼文”，虔诚祭之，并限日鳄鱼迁徙，结果，奇迹出现，从此不再见有鳄鱼出现。求得此签者，凡事心诚志坚，定可逢、凶化吉——韩文公在潮州为官十年，心存忠义，令当地人民安居乐业，诚心祷告之后，连恶毒的鳄鱼也平息。","diangu":"韩文公为潮州刺史。忠心为国为民。年丰民乐。潮州大海有鳄鱼食人。韩文公祭之。其害遂止息。"},{"n":70,"name":"塞翁失马","ji":"中平灵签","jie":"古时，边塞地区有一老翁，失一马，他泰然处之，后来，马回来了，还带着一匹小马。塞翁之子，骑这小马时，不慎跌断足，塞翁亦泰然处之，不久，村内所有壮丁都被征往修筑长城，而塞翁之子得以免役而保存性命。这支签，暗喻事情仍有反覆，坏事可以转化成为好事，而好事亦会转化成坏事，但是，我们只能像当年的塞翁一样，暂且接受现实，不管是祸是福，都要处之泰然，善恶到头，是会有结果的。","diangu":"人塞翁失马。人吊之。塞翁曰安知非福。随后马回。人贺之。塞翁曰。安知非祸。其子骑跌伤足。人亦吊之。塞翁曰。安知非福。其后秦王筑城。各家也要人去筑城。塞翁以其子不便于行动。遂免。是福也。人生祸福。难以判定。到底方知。惟行善者。祸可以转为福。"},{"n":71,"name":"庄周活鲋","ji":"中平灵签","jie":"这签是庄周笔下的一个故事：有一条鲋鱼，被困在车轮压成的一个小水坑中，当时的穷途困境，不用多说，相信大家都会明白。但是，假使间，西江水引入，涸辙之鱼能逃过此难，他日重回大海，成龙也是有可能的。求得此签，是凶多吉少之象，而困境非常艰险，又不能自拔自救，必须要等待时运的大变，或得到大贵人施以援手，方能获得解脱。","diangu":"鱼困于水车坑。辛苦极矣。若引西江水来救之。则他日成龙未可知也。"},{"n":72,"name":"高文定守困","ji":"中平灵签","jie":"宋国有一农夫，偶然遇一野兔奔跑，撞倒在树头，于是捡回家，宰来食，从此，每天不去耕种，只坐在树头，等待下一只兔子的光临。也有用此来形容像高文定这样、抱残守缺的人。签文说：花这么长时间去等待兔子，又何苦来由呢？这个守株待兔的愚人，真是可怜。他的低能，实在令人好笑，做人为什么这样守旧而自我拘禁呢？求得此签者，虽无大碍，但短期内亦难望有什么大作为。","diangu":"古人有看守一树而待兔来者。待之甚久。不见兔来。此人仍守树而不去。其愚拙无才能。真令人笑矣。"},{"n":73,"name":"孙霖中状元","ji":"上上灵签","jie":"这是一支春风得意、衣锦荣归的上上签。签语道尽孙霖中状元的喜气洋洋。新科状元骑着骏马，大道两旁的香花，好像在夹道欢迎。昔日的布衣蓝袍，寒窗下苦读的日子，已经成为过去，如今穿上状元锦袍而归，满街漂亮的女孩子，都用倾慕的目光，望着这位芳名题在雁塔的新贵人。求得此签，得偿素愿，吐气扬眉，名成利就，有一个非常美好的开始。","diangu":"中进士点状元谓之雁塔题名。穿着蓝袍去而换转锦衣归。一路花香衬马蹄。满街都是红粉女。争看状元来。此乃群众欢呼快活之事。"},{"n":74,"name":"朱买臣分妻","ji":"下下灵签","jie":"朱买臣，汉朝一位读书人，本是贫寒之人，妻子不愿意跟他挨饿一世，提出离婚。后来，朱买臣当了大官，妻子要求复合，朱买臣把一盆水泼在地上，说：“你能把这些水都收回到盆里，我们就复合吧！”这就是“复水难收”的典故了。回忆当年我运滞的时候，夫妻反目，闹离婚。如今我名题雁塔载誉归来，你却又要求重修旧好，你看看，我泼在地上的那盆水，有没有办法收拾，真可惜！","diangu":"人朱买臣。家贫其妻求去。随后朱买臣大贵。其妻愁恨。欲想求再为夫妻而不得。如覆水于马头。此水已经落地。难以回收也。"},{"n":75,"name":"伦文叙戏妻","ji":"下下灵签","jie":"这又是一支贫贱夫妻百事哀的下下签。伦文叙是一介寒生，妻子嫌他穷，改嫁了。当伦文叙中状元后，妻子悔恨交集，被伦文叙奚落了几句，就跳楼身亡了。试看看签语给我们的启示：婚姻是终生大事，岂可因一时贫困而变心呢？伦文叙夫妻，就是这样拆散了，一旦丈夫金榜题名，那时就后悔莫及了。此签险象环生，一是要挨穷；二是夫妻拆散；三是看不开时，还会有更大的不幸。","diangu":"古人伦文叙。家贫。其妻因而改嫁去。及伦文叙中状元回家。其妻恨错难翻。跳楼自尽而亡。此凶极之签也。"},{"n":76,"name":"孔子修身不厌贫","ji":"中平灵签","jie":"这是至圣孔子修身乐道安贫的写照。人，贵于能向往真理正义，不断求学问，修养自己的品格，即使暂且的环境不好，粗茶淡饭，甚至要枕着自己的手臂而眠，我们也不要自暴自弃。对于那些谋取不义之财而成为富贵的人，在我的心里，就只会当作是浮云而已。求得此签者，虽然可能大运未到，但只要坚守原则，站稳岗位，始终是有成正果之日的。","diangu":"昔孔子食粗饭。饮水。枕手肱。不厌自己贫穷。仍然快乐。自修其身。不合义之富贵则视如浮云之无有。"},{"n":77,"name":"公冶长入狱","ji":"中平灵签","jie":"此签虽然有惊无险，但如果轻信人言，则容易惹祸上身，等到有人相救，已经吃了眼前亏了。","diangu":"公冶长，古时一位能解鸟语的奇人，有一日，正值家贫无米下锅之际，有一鸟飞来对他说：“公冶长，南山有虎拖羊，你食肉，我食肠。”公冶长闻讯即往南山，果然见一羊，他吓走老虎，把肠脏留给鸟食，自己把羊肉带返家，岂料有人眼红，诬告公冶长偷羊，虽然被关在狱中，但到底他是清白的，后来，该鸟设法相救，公冶、长得脱官非。"},{"n":78,"name":"曾点论志","ji":"上吉灵签","jie":"曾点，春秋时代鲁国人，不但文思敏捷、心地善良，而且随遇而安，很懂得因应时间去做适宜的事。这支签，是曾点向别人说出他最大的愿望——希望和谐的琴声，到处飘扬；在暮春三月，穿上刚刚缝好的单衣，带着五六位年青人、六七位儿童，虔诚地去做完了求雨的祭祀，归家途中，心安理得，放怀唱咏。求得此签，只要心诚心善，事事如意，天从人愿。","diangu":"昔曾点与孔子言志。鼓瑟希铿称。舍瑟而作。曰时逢三月。暮春之衣服。单衫夹衲。刚已缝起。与二十岁之冠者。即已婚之人。约五六人。十五六岁之童子。又约六七人。同一队往鲁国沂水处。澣濯其身。舞雩林下乘凉。一路唱歌而归。以此为舒畅其心情。此乃快活之景象也。"},{"n":79,"name":"张良悟道","ji":"中平灵签","jie":"张良，祖先五代为韩国丞相，后秦亡韩，张良结交刺客，在博浪水狙击秦王而未果，逃亡江苏，遇黄石公，得传“太公兵法”，后助刘邦建立汉朝，封“留候”。此签系张良在拜相封候之后，领悟到人生如梦，富贵名利像过眼云烟。富贵，好像春梦一场，世人又何苦费力去追求呢？即使争得到，手托朝笏，站在天子殿下，他日死时，还不是留下一堆黄土？此签有劝人安分守己，凡事不可强求之意。","diangu":"富贵如春梦。一醒便无。世人何苦强求。任你为相封侯。官居极品。人生数十年光景。死后惟剩一堆坭土而已。一念及此。殊觉冷淡。"},{"n":80,"name":"乐广释疑","ji":"中吉灵签","jie":"这是“杯弓蛇影”的故事。乐广有一天请人吃饭，客人中，有一人疑心很重，居然怀疑杯中的弓影是蛇，饮后归家，闷闷不乐，乐广知道后，再请他来家里，坐在原先的位置，让他弄清楚，酒杯中的蛇，原来只是挂着的弓箭的影子。释疑后，此人才心安理得。一边饮酒一边欣赏歌舞，是多么难得的乐事，无端端却把杯中的弓影误作是蛇，真冤枉！明白此中的道理，就是趋吉避凶。","diangu":"饮酒歌舞。本极快活。而杯中弓影。作错误认为蛇。是无事而为有事也。不知人衰到极地。天道循环。自然否极泰来。断无差错。可预卜之。"},{"n":81,"name":"子路拱雉","ji":"中吉灵签","jie":"孔子与学生子路，在山边看见一只雌雉，非常机警醒目，在树叶间跳上跳落，快乐地鸣叫着，但它发觉周围有什么异动时，马上飞走，等到确定安全时，再飞回来，在它飞走的时候，连叫三声，消失在山野间。因孔子被尊为“至圣”，这只雌雉在孔子面前歌舞，亦被称为“朝圣”。按照签意，是有一番好景的，但凡事都要知机，间中可能会出现危机时，要知道避忌。","diangu":"孔子与子路经过桥边。见山上有一雌雉飞上飞落。真得其时。看见有人想害自己之颜色。即时高飞远去。四围审慎乃敢栖止。又鸣三声而飞过山侧。此有惊险之意也。鸟之知机如此。"},{"n":82,"name":"孔子击磬","ji":"中平灵签","jie":"孔子击磬的故事，告诫我们，要惜取少年时，应该做的，就要及时去做，否则老之将至，有心无力了。圣人孔子，在卫国击磬的时候，门外有人担着竹篑路过，在磬声中，听出孔子是有志做一番救世救民的事业心，可惜，时不我与，岁月就这样逝去了。求得此签者，凡事以善良和顺为贵，不要以为善事太小而不去做，也不要以为恶事太小而去做。做人，要把握今天，珍惜今天。","diangu":"昔孔夫子有卫国击磬。有一人挑一竹箩行过门口。闻磬声而嗟叹。话击磬者系有心救世之人。可惜今日年纪将老耳。"},{"n":83,"name":"赤松子招隐","ji":"中平灵签","jie":"这支签，是神仙赤松子劝人归隐的意思。他说：“寄身在凡尘间，真不知道什么时候才得清闲。世事浑浑噩噩，堆积如山，无钱的望发达，有钱的又担心子女不成材。辛苦钻营中，不知不觉花开又花落了。”世事如轮转，功名利禄的追求，永无止境，何不随遇而安，把得失荣辱都置诸度外，凡事但求心之所安，要做生命的主人，不做生命的奴隶。一个人，能看化，能知足，就乐在其中了。","diangu":"人在凡尘。无几时得闲暇。冷眼一看。世事之多。堆积如山。既得富而有钱。尚忧无贵子。得一件又想另一件。须知花花世界。花开则花又谢也。"},{"n":84,"name":"韩信弃楚归汉","ji":"中吉灵签","jie":"韩信，汉时的一名将，辅助刘邦建立汉家江山。这支签，记述韩信在张良指引，离开楚霸王项羽，投靠刘邦。满腹奇才的韩信，冲霄之志未能得偿所愿，在楚王军中，曾被项羽指令试举一只铁铸公鸡而未成功，自尊心受挫。后来，幸得张良指引，投靠刘邦，终于打败项羽，使他乌江自刎，吐了一口屈气。求得此签，今年会有转机，宜好自把握，切勿自暴自弃。","diangu":"汉朝韩信。满腹奇才。而不得志。力弱欲举铁鸡而不得。随后遇张良。教之投入汉高祖军中。辅佐高祖。击败项羽。在乌江自刎。"},{"n":85,"name":"刘向得志","ji":"上吉灵签","jie":"刘向，汉室皇胄，因劝谏曾下狱，狱中坚持苦读，后获平反，出人头地。太乙，天神中最尊贵者。太乙神仙燃藜作灯照明刘向，是有大贵人相助，天时尽得之吉祥寓意，是一支很好的签。求得者假如能把握良机，未来数年必定有一番成就。签意是：太乙神仙燃藜为灯，照我读书，十年寒窗下的辛苦用功，终于是舒一口的时候了。看我身穿锦袍，扬眉吐气，坐着四匹马拉的高车，前呼后拥，多快乐。","diangu":"太乙神燃藜枝。照明读书。又用十年辛苦工夫。一旦得大贵回家。身穿锦袍。有高车驷马随后。此荣华发达。快活无忧之景象。"},{"n":86,"name":"侃母迎宾","ji":"中平灵签","jie":"陶侃，晋代一位德才兼备的大官，初为县吏，因表现出色，后逐步升迁，官至征西大将军，荆江两州刺史，统领八州军事。为官四十年如一日，不贪不饮不赌，从不浪费一纸一木。这支签是讲述陶侃年少时家贫，无钱迎迓宾客，陶母非常贤淑，毅然剪下自己的长发，拿去变卖。这样的贤妇，古今只得陶母一个，是值得万世景仰的。求得此签，他日或者有好环境，但目前就要设法守一段日子了。","diangu":"昔陶侃之母。家贫有客到。截自己之头发卖之。以买待酒待客。人皆知之。称为贤妇。名留万代。"},{"n":87,"name":"陆士龙会客","ji":"中平灵签","jie":"荀鸣鹤与陆士龙，都是西晋时代的有为之士，各有抱负，各有著作，有一天，两雄相遇，坐在一起，各抒己见，雄辩滔滔，无法分出高下。此签有口舌是非之象，凡事切忌“口水多过茶”。签意是：在会谈中，各逞英雄，究竟哪一位的观点最正确呢？难以定论。有人说：荀鸣鹤有道理；也有人说：陆士龙辩赢了。虽然无伤大雅，但与人争执，费时失事伤感情。","diangu":"荀鸣鹤陆士龙。皆古时出色英雄人物。有一日。荀陆两人相遇座中谈论。一人讲一样。各逞英雄。难分第一。终亦无人能秉公决断之。此有口舌是非之象。"},{"n":88,"name":"花木兰从军","ji":"中吉灵签","jie":"花木兰，古时一位奇女子，因代父从军而成为巾帼英雄。求得此签，可从中省悟两个道理：一是尽孝心，二是尽忠心。替父从军，胆色过人，女人能有男人勇，世上有几人？以身报国，既忠且孝，当时很多大男人都自叹不如呢！凡事尽忠孝之心，定能逢凶化吉，无论有什么艰难困阻，都可以安然度过的。此签暗示，努力坚决下去，终会出人头地的。","diangu":"昔有女子花木兰。代父从军出战。以身报国。尽忠兼能尽孝。本系女子巾帼。而有男子须气概。英雄胆志。当时许多出色人物。衮衮诸公。皆不及此女子。真可笑矣。"},{"n":89,"name":"吴季子挂剑","ji":"下下灵签","jie":"吴季子，吴王寿梦之末子，聪明博学，吴王拟废长立幼，传位于他，但他坚拒，后周游列国，以见闻广博著称。吴季子游历到徐国时，徐君很喜欢季子的鱼肠剑，季子答应他，游罢归来，就将宝剑送给他。不料他日归来，徐君已逝，季子只得把鱼肠剑挂在徐君坟前的大树下，以表达自己的长情和哀思。此签为下下，求得者，要小心趋避，凡事要谨慎，不可任意妄为。如果以此签问自身者，今年内暂勿往探病吊丧。","diangu":"吴季子。佩着宝剑游历他邦。经过徐国。徐君见此剑而甚爱之。季子欲待游罢之后。再经过徐国。然后将此剑送与徐君。及返。徐君己死。季子将剑挂于徐君之坟墓前树上而去。以表自己之长情也。"},{"n":90,"name":"红拂女私奔","ji":"中平灵签","jie":"红拂女、李靖、虬髯客，三人之间的微妙关系，藉此签提醒我们，凡事要忍让，不可鲁莽行事。杨府歌妓红拂女与李靖有情，两人正准备漏夜私奔，偏偏虬髯客在这时出现，虬髯客与红佛女以兄妹相称，倾谈中，李靖误会虬髯客调戏她，阻碍他俩的私奔，三次拔剑要斩虬髯客，都被红佛女阻止，彼此明白意向时，在虬髯客帮助下，三人一齐逃出杨府，结成“风尘三侠”，共同闯荡江湖。","diangu":"昔有红拂女。与李靖有私情。夜欲私奔。红拂女方梳妆。适遇虬髯公到。见此女而钟爱之。李靖以为虬髯公调戏此女。欲拔剑斩之。红拂女止之。三次欲拔剑而未动。彼此随后亦无妨碍。"},{"n":91,"name":"月里嫦娥","ji":"上上灵签","jie":"嫦娥，后羿之妻，服了灵丹之后，飞升上天，成为“月中仙子”。此签是说嫦娥在月宫无忧无虑的神仙生活。在蟾宫月殿中，桂花常飘香。一轮圆月，像玉箧，照得万里银光。人间的六水三山，都在月色下展现无遗，白譬无暇的一片圣洁，高高悬挂在青天。求得此上上签，高贵神圣，万事皆圆满，前途光明。","diangu":"月光圆满。丹桂飘香。无半点云霞遮蔽。万里光明。四围山水都照见。"},{"n":92,"name":"孔子闻韶乐","ji":"中吉灵签","jie":"至圣孔子，在齐国听到韶乐，令他心神陶醉，历三个月之久，每餐饭中，竟不知肉是什么味道，专心致志去研究韶乐的制作，所谓废寝忘餐，终于大功告成。签诗的含意，简明易懂，但其中道理，就要求得此签的人，慢慢去领悟了。大致上，有吉无凶，但是，吉祥的程度有多大，与个人的努力有密切关系，如果，明知前面有个大金桔，也懒得去摘，那就如入宝山空手回了。","diangu":"昔孔子周游列国。在齐国闻人作诏乐。因之学作诏乐。有三个月之久。每膳不知肉味。其专心为此。必得成功矣。"},{"n":93,"name":"孔子闻卫乐","ji":"下下灵签","jie":"郑国、卫国之音，超离正途，萎靡不振，主题不健康，用今日的标准，就是黄色下流了。孔子闻之，痛斥其非，后来，郑、卫终于因文化堕落亡国，这些音乐，也可算是亡国之音了。签云：郑、卫的音乐，真难听！既诲淫，又伤风败俗，迟早会令国家倾亡的。因为，它所奏的，全非正经音乐，听多了，会消磨壮志，误入迷途的。求得此签，有所警惕，是可以趋吉避凶的。","diangu":"郑卫之音。败坏风俗。至于亡国。令人听闻后一味昏迷依恋。有损无益。"},{"n":94,"name":"髯公远走扶桑","ji":"中平灵签","jie":"虬髯客是个看化一切的世外高人，本来他也喜欢红拂女，但却与她结谊兄妹，把机会让给李靖，三个行侠仗义，共反暴隋。后来，风尘三侠见李世民后，虬髯客洞悉、天机，说此人乃真命天子，一山不能藏二虎，于是，与李靖、红拂女话别，独自乘船投奔怒海，远走扶桑国，自为山寨王。正所谓，一山难藏二虎，倒不如知机另觅山头栖身，各有各的环境，这样可以避免两虎相斗必有一伤的命运了。","diangu":"一山不能藏二虎。若有风起。当乘风而分栖别岭。各守一巢穴。免至两家相争。两家都受祸。恨错难返也。"},{"n":95,"name":"女娲炼石补天","ji":"中平灵签","jie":"太古之时，青天穿了个大洞，女娲不辞劳苦，炼石为浆，用以补天，历尽艰辛，终于有成。此签有劝人将勤补拙之意：别看轻这一捧一捧的泥土，堆积在一起，就可以成为一座山了。凡事都是由少而多，不要怕麻烦，做事怕辛苦，会令您一事无成。不信？您看看，女娲炼石补天的例子，又有什么“难”字可言呢？求得此签，宜在平稳中勤奋工作，创造未来。","diangu":"勤力担泥。一斗又一斗。由少而多。可以积成一山。今人作事。每好逸恶劳。是划地自限也。若能立定坚志。努力向前。如女娲氏炼石以补天。亦无难事也。"},{"n":96,"name":"文姬思汉","ji":"中平灵签","jie":"蔡文姬，东汉人，为匈奴乱兵所掠，嫁与左贤王，十二年后才归汉家。这是一个悲凉的意境，在秋冬两季求得此签者，要特别小心。如果在春夏时分求得，则及早趋吉避凶。羌笛在塞外频吹，曲调更令人伤感。它使异乡的游子，醒悟起归家的日子，遥遥无期。南来的孤雁，假若同情我，请常常替我传递家书给故乡的亲人。于此环境，首先要自我珍重，保存实力，等待运转的一日。","diangu":"凡游子出外作客。以依期归家为快。今作客他乡。闻吹羌笛之声。音韵悲切。想起回家日期而未得归。惟望雁鸿怜悯。托带家书以报平安。此乃出路艰难之景况。"},{"n":97,"name":"康顺钓鱼","ji":"中平灵签","jie":"康顺，古时一隐士。这支签中虽然并无凶险，但亦只空有良辰美景，钓鱼不得其法，有无收获，还是个未知数。倚着向南楼台的栏杆，满目的风光景色幽雅，水面上，有一叶小舟，只见康顺作渔翁打扮，频频下钓，至于有没有鱼获，那就不得而知了。求得此签者，要看看自己的年龄，年老者，姑且逍遥度日，但求心之所安，年青者，那就要好好把握时机了。","diangu":"凡取鱼者。用网一抛而得鱼多。用钓则逐个而得鱼少。今登楼晚望。满目佳景。见一艇细小如叶。浮于水面。不甚安稳。渔翁频频下钓。未有休息。而未知钓得鱼否。"},{"n":98,"name":"管鲍分金","ji":"中平灵签","jie":"春秋，齐国有两位患难知己，他们就是管仲与鲍叔牙，即使贫困中，他们也视钱财如粪土。后人以“管鲍之交”来称誉真正朋友。此签以管鲍分金，来劝喻世人不要因利忘义。签云：自私的人，入山采玉，又嫌自己的田地狭窄；掘地寻金，又厌寻金客多会分薄自己。唉！其实，我们应该学管子与鲍子，明白富贵贫穷一早就天注定，世人何苦为财而奔波呢？求得此签，要守义修善果，不要做金钱的奴隶。","diangu":"入山种玉。田狭则收成少。掘地求金。人多就会分得薄。实则为人不必如此辛苦奔波。因富贵二字。有前生因果。上天已安排分配注定矣。"},{"n":99,"name":"韩文公遇害","ji":"中平灵签","jie":"八仙之一的韩湘子，是韩愈的侄孙，他曾在初冬施法，令牡丹开花，而每朵花有一字，合起来就是“云横秦岭家何在，雪拥篮关马不前”，韩愈不解其意，不久后，因谏迎佛骨，惹怒皇上，贬谪潮州刺史，途中遇上风雪，马不前，船夫亦不开船，后韩湘子赶来相送，韩愈始明白韩湘子的预言。此签有叹息时运不佳之意——落花流水谁人同情，唯有靠自己立志坚定而已。后来韩愈在潮州政绩伟然，被谥为“文公”。","diangu":"唐朝韩文公。被贬到潮州为官。来到秦岭。遇大风雪。马不能行。船亦不能开航。所谓云横秦岭家何在。雪拥蓝关马不前。进退为谷。幸得湘子救护。始获脱危难。"},{"n":100,"name":"唐明皇赏花","ji":"中吉灵签","jie":"黄大仙灵签一百枝，这是最末一枝，虽为中吉，但有“宝物沉归底”之意，又有否极泰来、面临另一个回圈之象，求得者，苦尽甘来，运势转弱为强，处处显现生机。古人为唐明皇赏花：太平盛世，百花争妍斗丽，庆贺新春，万物从此又送旧迎新。别以为开得最尾、赏得最尾的那朵花就最差，应该明白，凡事到了尽头，就是新的开始了，这就是周而复始、否极泰来的道理了。求得此签，必有一番新景象。","diangu":"此签乃收尾第一。数目到此。则为尽头。人运到此。则为穷极矣。惟穷极无路。转移在人。易穷则变。变则通。天运循环。无往不复。如百花争放。以贺新春。万象维新。人亦从此改过从善。涤虑洗心。旧染污浊。焕然一新。虽目前否塞之极。自有亨通荣发之时也。"}];

  var drawBtn = document.getElementById("drawBtn");
  var againBtn = document.getElementById("againBtn");
  var copyBtn = document.getElementById("copyBtn");
  var allToggle = document.getElementById("allToggle");
  var allList = document.getElementById("allList");
  var qianCard = document.getElementById("qianCard");
  var resultCard = document.getElementById("resultCard");
  var resNo = document.getElementById("resNo");
  var resJi = document.getElementById("resJi");
  var resPoem = document.getElementById("resPoem");
  var resJie = document.getElementById("resJie");
  var resExtra = document.getElementById("resExtra");
  var drawing = false;
  var lastText = "";

  function jiLevel(ji) {
    var s = String(ji || "").replace(/^\s+|\s+$/g, "");
    if (!s) return "";
    if (s.indexOf("下") !== -1 || s.indexOf("凶") !== -1) return "down";
    if (s.indexOf("上") !== -1 || s.indexOf("大") !== -1) return "up";
    if (s.indexOf("中") !== -1 || s.indexOf("平") !== -1) return "mid";
    return "mid";
  }

  function makeJiBadge(ji) {
    var span = document.createElement("span");
    span.className = "ji-badge jl-" + jiLevel(ji);
    span.textContent = ji;
    return span;
  }

  function clearChildren(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
  }

  function normalize(q) {
    var n = {
      no: q.no || ("第 " + q.n + " 号签"),
      ji: q.ji || "",
      poem: q.text || q.name || "",
      jie: (CFG.jieField && q[CFG.jieField]) || q.jie || q.jieyue || "",
      extra: []
    };
    for (var i = 0; i < CFG.extraFields.length; i++) {
      var e = CFG.extraFields[i];
      if (q[e.key]) n.extra.push({ label: e.label, value: q[e.key] });
    }
    return n;
  }

  function buildText(q) {
    var lines = [CFG.name + " · " + q.no];
    if (q.ji) lines.push(q.ji);
    if (q.poem) lines.push(CFG.poemLabel + "：" + q.poem);
    lines.push(CFG.jieLabel + "：" + q.jie);
    for (var i = 0; i < q.extra.length; i++) lines.push(q.extra[i].label + "：" + q.extra[i].value);
    return lines.join("\n");
  }

  function showResult(q) {
    resNo.textContent = q.no;
    clearChildren(resJi);
    if (q.ji) {
      var b = makeJiBadge(q.ji);
      if (b) resJi.appendChild(b);
    }
    resPoem.style.display = q.poem ? "" : "none";
    resPoem.textContent = q.poem;
    resJie.textContent = CFG.jieLabel + "：" + q.jie;
    clearChildren(resExtra);
    for (var i = 0; i < q.extra.length; i++) {
      var line = document.createElement("div");
      line.className = "qian-extra-line";
      line.textContent = q.extra[i].label + "：" + q.extra[i].value;
      resExtra.appendChild(line);
    }
    resultCard.style.display = "block";
    resultCard.classList.remove("show");
    void resultCard.offsetWidth;
    resultCard.classList.add("show");
    lastText = buildText(q);
  }

  function startDraw() {
    if (drawing) return;
    if (!QIAN || !QIAN.length) {
      setStatus("签文数据为空，无法抽签", "error");
      return;
    }
    drawing = true;
    drawBtn.textContent = "抽签中...";
    drawBtn.disabled = true;
    resultCard.style.display = "none";
    resultCard.classList.remove("show");
    qianCard.classList.remove("drawing", "drawn");
    void qianCard.offsetWidth;
    qianCard.classList.add("drawing");
    var picked = QIAN[Math.floor(Math.random() * QIAN.length)];
    setTimeout(function () {
      qianCard.classList.remove("drawing");
      qianCard.classList.add("drawn");
      drawBtn.textContent = "开始抽签";
      drawBtn.disabled = false;
      drawing = false;
      showResult(normalize(picked));
    }, 2600);
  }

  drawBtn.addEventListener("click", startDraw);
  againBtn.addEventListener("click", startDraw);

  copyBtn.addEventListener("click", function () {
    if (!lastText) return;
    copyToClipboard(lastText, copyBtn);
    setStatus("结果已复制到剪贴板");
  });

  allToggle.addEventListener("click", function () {
    var open = allList.style.display !== "none";
    allList.style.display = open ? "none" : "block";
    allToggle.textContent = open ? "查看全部签文" : "收起全部签文";
  });

  (function buildAll() {
    for (var i = 0; i < QIAN.length; i++) {
      var q = normalize(QIAN[i]);
      var row = document.createElement("div");
      row.className = "all-row";
      var head = document.createElement("button");
      head.type = "button";
      head.className = "all-head";
      var noSpan = document.createElement("span");
      noSpan.className = "all-no";
      noSpan.textContent = q.no;
      head.appendChild(noSpan);
      if (q.ji) {
        var b = makeJiBadge(q.ji);
        if (b) head.appendChild(b);
      }
      var poemSpan = document.createElement("span");
      poemSpan.className = "all-poem";
      poemSpan.textContent = q.poem || q.jie;
      head.appendChild(poemSpan);
      var body = document.createElement("div");
      body.className = "all-body";
      var p = document.createElement("div");
      p.className = "all-poem-full";
      p.textContent = q.poem;
      body.appendChild(p);
      var j = document.createElement("div");
      j.className = "all-jie";
      j.textContent = CFG.jieLabel + "：" + q.jie;
      body.appendChild(j);
      for (var k = 0; k < q.extra.length; k++) {
        var line = document.createElement("div");
        line.className = "all-jie";
        line.textContent = q.extra[k].label + "：" + q.extra[k].value;
        body.appendChild(line);
      }
      row.appendChild(head);
      row.appendChild(body);
      head.addEventListener("click", function (e) { e.currentTarget.parentNode.classList.toggle("open"); });
      allList.appendChild(row);
    }
  })();
})();
  </script>
</body>
