<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片滤镜效果 - S-Jiffy</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../assets/css/global.css">
<style>
.drop-zone{border:2px dashed var(--color-border);border-radius:var(--radius-lg);padding:44px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;}
.drop-zone:hover{border-color:var(--color-text-primary);background:var(--color-bg-soft);}
.drop-zone.dragover{border-color:var(--color-accent);background:var(--color-bg-soft);}
.dz-icon{font-size:34px;margin-bottom:8px;}
.dz-title{font-size:var(--font-size-base);font-weight:600;}
.dz-sub{font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-top:4px;}
.dz-hint{font-size:var(--font-size-xs);color:var(--color-text-disabled);margin-top:6px;}
.file-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:var(--space-2);}
.file-name{font-size:var(--font-size-sm);font-weight:600;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.file-meta{font-size:var(--font-size-xs);color:var(--color-text-secondary);}
.file-remove{height:28px;min-width:auto;padding:0 12px;font-size:var(--font-size-xs);border-radius:9999px;margin-left:auto;}
.section-title{font-size:var(--font-size-xs);font-weight:600;color:var(--color-text-secondary);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;}
.preset-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--space-2);}
.preset-btn{height:32px;min-width:auto;padding:0 12px;font-size:var(--font-size-xs);border:1px solid var(--color-border);background:transparent;color:var(--color-text-primary);}
.preset-btn.active{background:var(--color-text-primary);color:#fff;border-color:var(--color-text-primary);}
.slider-row{margin-bottom:10px;}
.slider-head{display:flex;justify-content:space-between;margin-bottom:2px;}
.slider-head label{font-size:var(--font-size-sm);color:var(--color-text-secondary);}
.slider-head span{font-size:var(--font-size-sm);font-weight:600;min-width:40px;text-align:right;}
.slider-row input[type=range]{width:100%;accent-color:var(--color-text-primary);cursor:pointer;}
.chk-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;}
.chk-row label{display:flex;align-items:center;gap:6px;font-size:var(--font-size-sm);cursor:pointer;}
.chk-row input{width:16px;height:16px;accent-color:var(--color-text-primary);cursor:pointer;}
.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);align-items:start;margin-top:var(--space-2);}
@media (max-width:760px){.editor-grid{grid-template-columns:1fr;}}
.pv-label{font-size:var(--font-size-xs);font-weight:600;color:var(--color-text-secondary);margin-bottom:6px;}
.pv-frame{background:var(--color-bg-soft);border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden;min-height:120px;display:flex;align-items:center;justify-content:center;}
.pv-frame img{max-width:100%;max-height:400px;display:block;}
.pv-size{font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-top:4px;}
.diff-down{color:var(--color-success);font-weight:600;}
.diff-up{color:var(--color-error);font-weight:600;}
.error-box{font-size:var(--font-size-xs);color:var(--color-error);background:rgba(159,47,45,.08);border:1px solid rgba(159,47,45,.25);border-radius:var(--radius-md);padding:10px 14px;margin-bottom:var(--space-2);}
.tool-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:var(--space-2);}
.tool-row .btn{flex:1;min-width:180px;}
</style>
</head>
<body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
<main class="tool-workspace">
<h1 data-i18n="h1">图片滤镜效果</h1>
<p class="tool-desc" data-i18n="desc">对图片应用亮度、对比度、饱和度、模糊、锐化、灰度和褪色效果。</p>

<div class="card" id="uploadCard">
  <div id="dropZone" class="drop-zone">
    <div class="dz-icon">🎨</div>
    <p class="dz-title" data-i18n="ui.102">将图片拖放到此处</p>
    <p class="dz-sub" data-i18n="ui.101">格式自动检测 — 无需手动选择</p>
    <p class="dz-hint" data-i18n="ui.100">JPG · PNG · WebP · 最大 50MB · 本地处理</p>
  </div>
  <input type="file" id="fileInput" accept="image/jpeg,image/jpg,image/png,image/webp,.jpg,.jpeg,.png,.webp" style="display:none">
</div>

<div class="card" id="workCard" style="display:none">
  <div class="file-bar">
    <span class="file-name" id="fileName"></span>
    <span class="file-meta" id="fileMeta"></span>
    <button type="button" class="btn btn-secondary file-remove" id="removeBtn"></button>
  </div>

  <div id="errorBox" class="error-box" style="display:none"></div>

  <div class="editor-grid">
    <div class="left-col">
      <p class="section-title" data-i18n="filterPresetsLabel">预设</p>
      <div class="preset-row" id="presetRow"></div>

      <p class="section-title" data-i18n="filterManualAdjust">手动调整</p>
      <div class="slider-row">
        <div class="slider-head"><label data-i18n="filterBrightness">亮度</label><span id="brightnessVal">0</span></div>
        <input type="range" id="brightnessRange" min="-100" max="100" step="1" value="0">
      </div>
      <div class="slider-row">
        <div class="slider-head"><label data-i18n="filterContrast">对比度</label><span id="contrastVal">0</span></div>
        <input type="range" id="contrastRange" min="-100" max="100" step="1" value="0">
      </div>
      <div class="slider-row">
        <div class="slider-head"><label data-i18n="filterSaturation">饱和度</label><span id="saturationVal">0</span></div>
        <input type="range" id="saturationRange" min="-100" max="100" step="1" value="0">
      </div>
      <div class="slider-row">
        <div class="slider-head"><label data-i18n="filterBlur">模糊</label><span id="blurVal">0</span></div>
        <input type="range" id="blurRange" min="0" max="10" step="0.5" value="0">
      </div>
      <div class="chk-row">
        <label><input type="checkbox" id="grayscaleChk"> <span data-i18n="filterGrayscale">灰度</span></label>
        <label><input type="checkbox" id="sepiaChk"> <span data-i18n="filterSepia">棕褐色</span></label>
        <label><input type="checkbox" id="invertChk"> <span data-i18n="filterInvert">反色</span></label>
      </div>
      <p class="pv-size" id="resultSize" style="margin-top:12px;"></p>
    </div>

    <div class="right-col">
      <p class="pv-label" data-i18n="livePreview">实时预览</p>
      <div class="pv-frame"><img id="previewImg" alt=""></div>
    </div>
  </div>

  <div class="tool-row">
    <button type="button" class="btn btn-primary" id="applyBtn">应用滤镜</button>
    <button type="button" class="btn btn-secondary" id="resetResultBtn" style="display:none">重新调整</button>
    <button type="button" class="btn btn-primary" id="downloadBtn" style="display:none">下载</button>
  </div>
</div>
</main>
<footer class="global-footer">
  <div class="tool-status" id="statusBar"></div>
  <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
</footer>
<script src="../../assets/js/global.js"></script>
<script src="../../assets/js/i18n.js"></script>
<script>
(function () {
  'use strict';
  var MAX_MB = 50;
  var PRESETS = [
    { key: 'filterOriginal', icon: '○', b: 0, c: 0, s: 0, bl: 0, gs: false, sp: false, iv: false },
    { key: 'filterVivid', icon: '◈', b: 10, c: 25, s: 50, bl: 0, gs: false, sp: false, iv: false },
    { key: 'filterVintage', icon: '◫', b: -5, c: -10, s: -30, bl: 0, gs: false, sp: true, iv: false },
    { key: 'filterGrayscale', icon: '◐', b: 0, c: 10, s: 0, bl: 0, gs: true, sp: false, iv: false },
    { key: 'filterNoir', icon: '◼', b: -20, c: 40, s: 0, bl: 0, gs: true, sp: false, iv: false },
    { key: 'filterCool', icon: '❄', b: 5, c: 5, s: -15, bl: 0, gs: false, sp: false, iv: false },
    { key: 'filterWarm', icon: '☀', b: 10, c: 10, s: 20, bl: 0, gs: false, sp: false, iv: false },
    { key: 'filterFade', icon: '◎', b: 20, c: -30, s: -20, bl: 0, gs: false, sp: false, iv: false },
    { key: 'filterInvert', icon: '⊕', b: 0, c: 0, s: 0, bl: 0, gs: false, sp: false, iv: true },
    { key: 'filterSoft', icon: '✦', b: 15, c: -15, s: 5, bl: 1, gs: false, sp: false, iv: false }
  ];
  var fb = {
    filterOriginal: '原图', filterVivid: '鲜艳', filterVintage: '复古', filterGrayscale: '灰度',
    filterNoir: '黑白', filterCool: '冷色', filterWarm: '暖色', filterFade: '褪色',
    filterInvert: '反色', filterSoft: '柔和'
  };

  var file = null, imgEl = null, origUrl = null;
  var val = { brightness: 0, contrast: 0, saturation: 0, blur: 0, grayscale: false, sepia: false, invert: false };
  var result = null, processing = false;

  function $(id) { return document.getElementById(id); }
  function t(key, f) { return (window.I18N && I18N.dict[key] != null) ? I18N.dict[key] : f; }
  function fmtBytes(b) {
    if (!b) return '0 B';
    var k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
    var i = Math.floor(Math.log(b) / Math.log(k));
    return (b / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
  }
  function baseName(n) { return n.replace(/\.[^/.]+$/, ''); }
  function download(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 100);
  }
  function setErr(msg) { setStatus(msg, 'error'); var b = $('errorBox'); b.textContent = msg; b.style.display = 'block'; }
  function clearErr() { $('errorBox').textContent = ''; $('errorBox').style.display = 'none'; }

  function cssFilter() {
    var f = [];
    if (val.brightness !== 0) f.push('brightness(' + (1 + val.brightness / 100) + ')');
    if (val.contrast !== 0) f.push('contrast(' + (1 + val.contrast / 100) + ')');
    if (val.saturation !== 0) f.push('saturate(' + (1 + val.saturation / 100) + ')');
    if (val.blur > 0) f.push('blur(' + val.blur + 'px)');
    if (val.grayscale) f.push('grayscale(1)');
    if (val.sepia) f.push('sepia(1)');
    if (val.invert) f.push('invert(1)');
    return f.length ? f.join(' ') : 'none';
  }

  function updatePreview() {
    if (imgEl) $('previewImg').style.filter = cssFilter();
    renderPresets();
  }

  function renderPresets() {
    var row = $('presetRow');
    row.innerHTML = '';
    for (var i = 0; i < PRESETS.length; i++) {
      var p = PRESETS[i];
      var active = val.brightness === p.b && val.contrast === p.c && val.saturation === p.s &&
        val.blur === p.bl && val.grayscale === p.gs && val.sepia === p.sp && val.invert === p.iv;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn preset-btn' + (active ? ' active' : '');
      btn.textContent = p.icon + ' ' + t(p.key, fb[p.key]);
      (function (pp) {
        btn.addEventListener('click', function () {
          val.brightness = pp.b; val.contrast = pp.c; val.saturation = pp.s; val.blur = pp.bl;
          val.grayscale = pp.gs; val.sepia = pp.sp; val.invert = pp.iv;
          syncSliders();
          updatePreview();
        });
      })(p);
      row.appendChild(btn);
    }
  }

  function syncSliders() {
    $('brightnessRange').value = String(val.brightness);
    $('contrastRange').value = String(val.contrast);
    $('saturationRange').value = String(val.saturation);
    $('blurRange').value = String(val.blur);
    $('grayscaleChk').checked = val.grayscale;
    $('sepiaChk').checked = val.sepia;
    $('invertChk').checked = val.invert;
    $('brightnessVal').textContent = String(val.brightness);
    $('contrastVal').textContent = String(val.contrast);
    $('saturationVal').textContent = String(val.saturation);
    $('blurVal').textContent = String(val.blur);
  }

  function process() {
    if (!file || !imgEl || processing) return;
    processing = true;
    clearErr();
    $('applyBtn').disabled = true;
    $('applyBtn').textContent = t('processing', '处理中…');
    var w = imgEl.naturalWidth, h = imgEl.naturalHeight;
    var canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    ctx.filter = cssFilter();
    ctx.drawImage(imgEl, 0, 0);
    ctx.filter = 'none';
    var mime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
    var ext = file.type === 'image/png' ? 'png' : 'jpg';
    canvas.toBlob(function (blob) {
      processing = false;
      $('applyBtn').disabled = false;
      if (!blob) { setErr(t('conversionFailed', '处理失败，请重试。')); return; }
      if (result && result.url) URL.revokeObjectURL(result.url);
      result = { blob: blob, url: URL.createObjectURL(blob), name: baseName(file.name) + '_filtered.' + ext };
      var diff = (blob.size - file.size) / file.size * 100;
      var sign = diff > 0 ? '+' : '';
      $('resultSize').innerHTML = fmtBytes(blob.size) + ' <span class="' + (diff <= 0 ? 'diff-down' : 'diff-up') + '">' + sign + diff.toFixed(0) + '%</span>';
      $('applyBtn').style.display = 'none';
      $('downloadBtn').style.display = 'inline-flex';
      $('resetResultBtn').style.display = 'inline-flex';
      setStatus(t('ready', '就绪'));
    }, mime, 0.92);
  }

  function clearResult() {
    if (result && result.url) { URL.revokeObjectURL(result.url); result = null; }
    $('downloadBtn').style.display = 'none';
    $('resetResultBtn').style.display = 'none';
    $('applyBtn').style.display = 'inline-flex';
    $('resultSize').textContent = '';
    $('applyBtn').textContent = t('applyFilter', '应用滤镜');
    if (imgEl) $('previewImg').style.filter = cssFilter();
  }

  function handleFile(f) {
    if (!f) return;
    if (f.size > MAX_MB * 1024 * 1024) {
      setErr(t('fileTooLargeSimple', '文件过大（最大 {size}MB）。').replace('{size}', String(MAX_MB)));
      $('fileInput').value = '';
      return;
    }
    file = f;
    clearErr();
    if (origUrl) URL.revokeObjectURL(origUrl);
    origUrl = URL.createObjectURL(f);
    $('uploadCard').style.display = 'none';
    $('workCard').style.display = 'block';
    $('fileName').textContent = f.name;
    $('fileMeta').textContent = fmtBytes(f.size);
    $('previewImg').src = origUrl;
    $('previewImg').style.filter = cssFilter();
    var img = new Image();
    img.onload = function () { imgEl = img; updatePreview(); };
    img.onerror = function () { setErr(t('conversionFailed', '图片解码失败，请重试。')); };
    img.src = origUrl;
  }

  function resetAll() {
    file = null; imgEl = null; result = null;
    val = { brightness: 0, contrast: 0, saturation: 0, blur: 0, grayscale: false, sepia: false, invert: false };
    syncSliders();
    if (origUrl) { URL.revokeObjectURL(origUrl); origUrl = null; }
    $('fileInput').value = '';
    $('uploadCard').style.display = 'block';
    $('workCard').style.display = 'none';
    clearErr();
    setStatus('');
  }

  var dz = $('dropZone');
  dz.addEventListener('click', function () { $('fileInput').click(); });
  dz.addEventListener('dragover', function (e) { e.preventDefault(); dz.classList.add('dragover'); });
  dz.addEventListener('dragleave', function () { dz.classList.remove('dragover'); });
  dz.addEventListener('drop', function (e) {
    e.preventDefault(); dz.classList.remove('dragover');
    var f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handleFile(f);
  });
  $('fileInput').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (f) handleFile(f);
  });
  $('removeBtn').addEventListener('click', resetAll);

  $('brightnessRange').addEventListener('input', function () { val.brightness = parseInt(this.value, 10); $('brightnessVal').textContent = String(val.brightness); updatePreview(); });
  $('contrastRange').addEventListener('input', function () { val.contrast = parseInt(this.value, 10); $('contrastVal').textContent = String(val.contrast); updatePreview(); });
  $('saturationRange').addEventListener('input', function () { val.saturation = parseInt(this.value, 10); $('saturationVal').textContent = String(val.saturation); updatePreview(); });
  $('blurRange').addEventListener('input', function () { val.blur = parseFloat(this.value); $('blurVal').textContent = String(val.blur); updatePreview(); });
  $('grayscaleChk').addEventListener('change', function () { val.grayscale = this.checked; updatePreview(); });
  $('sepiaChk').addEventListener('change', function () { val.sepia = this.checked; updatePreview(); });
  $('invertChk').addEventListener('change', function () { val.invert = this.checked; updatePreview(); });
  $('applyBtn').addEventListener('click', process);
  $('resetResultBtn').addEventListener('click', clearResult);
  $('downloadBtn').addEventListener('click', function () {
    if (result) { download(result.blob, result.name); setStatus(t('downloaded', '已开始下载')); }
  });

  renderPresets();
})();
</script>
</body>
</html>
