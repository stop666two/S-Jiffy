<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片转PDF - S-Jiffy</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../assets/css/global.css">
<style>
.dropzone{border:1.5px dashed var(--color-border);border-radius:var(--radius-md);padding:36px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;}
.dropzone:hover,.dropzone.dragover{border-color:var(--color-text-primary);background:var(--color-bg-soft);}
.dz-icon{font-size:34px;margin-bottom:8px;}
.dz-label{font-size:var(--font-size-sm);font-weight:500;}
.dz-sub{font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-top:4px;}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.card-title{font-size:var(--font-size-sm);font-weight:600;}
.link-btn{background:none;border:none;cursor:pointer;font-size:var(--font-size-xs);color:var(--color-text-secondary);padding:2px 6px;}
.link-btn:hover{color:var(--color-text-primary);}
.img-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--color-border);border-radius:var(--radius-md);margin-bottom:8px;font-size:var(--font-size-sm);}
.img-row.drag{opacity:.4;}
.img-row.drop-before{border-left:3px solid var(--color-accent);}
.badge{width:22px;height:22px;border-radius:6px;background:var(--color-bg-soft);border:1px solid var(--color-border);font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.row-thumb{width:52px;height:40px;object-fit:cover;border:1px solid var(--color-border);border-radius:6px;flex-shrink:0;background:#fff;}
.file-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.file-meta{font-size:var(--font-size-xs);color:var(--color-text-secondary);flex-shrink:0;}
.handle{cursor:grab;color:var(--color-text-disabled);user-select:none;flex-shrink:0;}
.remove-btn{background:none;border:none;cursor:pointer;color:var(--color-text-disabled);font-size:16px;padding:4px;flex-shrink:0;}
.remove-btn:hover{color:var(--color-error);}
.hint{font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-top:8px;}
.opt-grid{display:grid;grid-template-columns:1fr 1fr 2fr;gap:12px;margin-top:12px;}
.opt-group label{font-size:var(--font-size-sm);display:block;margin-bottom:6px;color:var(--color-text-secondary);}
.seg-btns{display:flex;gap:6px;}
.seg-btn{flex:1;padding:8px 6px;font-size:var(--font-size-xs);border:1px solid var(--color-border);border-radius:var(--radius-md);cursor:pointer;background:transparent;color:var(--color-text-secondary);}
.seg-btn.on{background:var(--color-text-primary);color:#fff;border-color:var(--color-text-primary);}
.seg-btn:disabled{opacity:.4;cursor:not-allowed;}
.slider-row{display:flex;align-items:center;gap:10px;}
.slider-row input[type=range]{flex:1;accent-color:var(--color-accent);}
.slider-val{font-size:var(--font-size-xs);color:var(--color-text-secondary);min-width:44px;text-align:right;}
.progress-wrap{margin:12px 0;}
.progress-bar{height:6px;background:var(--color-bg-soft);border:1px solid var(--color-border);border-radius:9999px;overflow:hidden;}
.progress-fill{height:100%;background:var(--color-accent);width:0;transition:width .2s;}
.progress-txt{font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-top:4px;}
.action-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;align-items:center;}
</style>
</head>
<body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
<main class="tool-workspace">
<h1 data-i18n="h1">图片转PDF</h1>
<p class="tool-desc" data-i18n="desc">将多张JPG、PNG或WebP图片合并成一个PDF文件。可拖拽调整页面顺序，选择A4或Letter大小，一键下载，完全在浏览器中处理。</p>
<div class="card">
<div class="dropzone" id="dropZone">
<div class="dz-icon">🖼️</div>
<div class="dz-label" id="dzLabel" data-i18n="dropImagesHere">将图片拖放至此或点击上传</div>
<div class="dz-sub" id="dzSub"></div>
</div>
<input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" multiple style="display:none">
</div>
<div class="card" id="listCard" style="display:none">
<div class="card-head">
<span class="card-title" id="imgCount"></span>
<button class="link-btn" id="clearBtn" data-i18n="clearAll">清除全部</button>
</div>
<div id="imgList"></div>
<p class="hint" data-i18n="dragHandleHint">拖动左侧手柄以重新排列页面</p>
<div class="opt-grid">
<div class="opt-group">
<label data-i18n="pageSizeLabel">页面大小</label>
<div class="seg-btns">
<button class="seg-btn on" data-sz="A4">A4</button>
<button class="seg-btn" data-sz="Letter">Letter</button>
<button class="seg-btn" data-sz="fit">Fit</button>
</div>
</div>
<div class="opt-group">
<label data-i18n="orientationLabel">方向</label>
<div class="seg-btns">
<button class="seg-btn on" data-ori="portrait">↕ 纵向</button>
<button class="seg-btn" data-ori="landscape">↔ 横向</button>
</div>
</div>
<div class="opt-group">
<label data-i18n="marginLabel">边距</label>
<div class="slider-row"><input type="range" id="margin" min="0" max="40" step="2" value="20"><span class="slider-val" id="marginVal">20pt</span></div>
</div>
</div>
<div class="progress-wrap" id="progressWrap" style="display:none">
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="progress-txt" id="progressTxt"></div>
</div>
<div class="action-row">
<button class="btn btn-primary" id="genBtn" disabled data-i18n="uploadImagesFirst">请先上传图片</button>
</div>
</div>
</main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
<script src="../../assets/js/i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
<script>
/* ES5 IIFE：var/function，不用 let/const/箭头函数/模板字符串 */
(function(){
'use strict';
function $(id){return document.getElementById(id);}
var MAX_FILES=20,MAX_PER_MB=5,MAX_TOTAL_MB=50;
var images=[];
var pageSize='A4',orientation='portrait',marginPt=20;
var busy=false;
var dz=$('dropZone'),fi=$('fileInput'),btn=$('genBtn');
var PAGE_DIMS={A4:{w:595.28,h:841.89},Letter:{w:612,h:792}};
function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';return (b/1048576).toFixed(2)+' MB';}
function download(blob,name){var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u);},3000);}
function checkMagic(f,cb){
  var r=new FileReader();
  r.onload=function(){
    var b=new Uint8Array(r.result),ok=false;
    if(b[0]===0xFF&&b[1]===0xD8&&b[2]===0xFF)ok=true;
    else if(b[0]===0x89&&b[1]===0x50&&b[2]===0x4E&&b[3]===0x47)ok=true;
    else if(b[0]===0x52&&b[1]===0x49&&b[2]===0x46&&b[3]===0x46&&b[8]===0x57&&b[9]===0x45&&b[10]===0x42&&b[11]===0x50)ok=true;
    cb(ok);
  };
  r.onerror=function(){cb(false);};
  r.readAsArrayBuffer(f.slice(0,12));
}
function getDims(img){
  return new Promise(function(res,rej){
    var im=new Image();
    im.onload=function(){res({w:im.naturalWidth,h:im.naturalHeight});};
    im.onerror=function(){rej(new Error('img'));};
    im.src=img;
  });
}
function readAB(f,cb){var r=new FileReader();r.onload=function(){cb(r.result);};r.readAsArrayBuffer(f);}
function addFiles(list){
  var incoming=[],i;
  for(i=0;i<list.length;i++)incoming.push(list[i]);
  if(!incoming.length)return;
  if(images.length+incoming.length>MAX_FILES){setStatus(t('maxFiles','最多')+' '+MAX_FILES+t('files',' 张图片'),'error');return;}
  var total=images.reduce(function(s,e){return s+e.file.size;},0);
  for(i=0;i<incoming.length;i++)total+=incoming[i].size;
  if(total>MAX_TOTAL_MB*1048576){setStatus(t('totalTooLarge','总大小超过')+' '+MAX_TOTAL_MB+'MB','error');return;}
  var okList=[];
  var chain=Promise.resolve();
  incoming.forEach(function(f){
    chain=chain.then(function(){
      return new Promise(function(res){
        var t=f.type||'';
        var okType=(t==='image/jpeg'||t==='image/png'||t==='image/webp')||
          (f.name&&/(\.jpe?g|\.png|\.webp)$/i.test(f.name));
        if(!okType){setStatus(htmlEscape(f.name)+': '+t('badType','不支持的格式（仅 JPG/PNG/WebP）'),'error');res();return;}
        if(f.size>MAX_PER_MB*1048576){setStatus(htmlEscape(f.name)+': '+t('tooLarge','超过')+' '+MAX_PER_MB+'MB','error');res();return;}
        checkMagic(f,function(ok){
          if(!ok){setStatus(htmlEscape(f.name)+': '+t('badHeader','文件头不匹配，不是有效图片'),'error');res();return;}
          var url=URL.createObjectURL(f);
          getDims(url).then(function(d){
            okList.push({file:f,url:url,w:d.w,h:d.h});
            res();
          },function(){URL.revokeObjectURL(url);res();});
        });
      });
    });
  });
  chain.then(function(){
    if(!okList.length)return;
    images=images.concat(okList);
    render();
    setStatus('');
  });
}
function render(){
  var html='',i;
  for(i=0;i<images.length;i++){
    var im=images[i];
    html+='<div class="img-row"><span class="handle">⠿</span><span class="badge">'+(i+1)+'</span>'
      +'<img class="row-thumb" src="'+im.url+'" alt="">'
      +'<span class="file-name">'+htmlEscape(im.file.name)+'</span>'
      +'<span class="file-meta">'+im.w+'×'+im.h+' · '+fmtSize(im.file.size)+'</span>'
      +'<button class="remove-btn rm" data-i="'+i+'" title="×">✕</button></div>';
  }
  $('imgList').innerHTML=html;
  $('listCard').style.display='block';
  $('imgCount').textContent=images.length+t('images',' 张图片')+' · '+fmtSize(images.reduce(function(s,e){return s+e.file.size;},0));
  var btns=$('imgList').querySelectorAll('.remove-btn'),k;
  for(k=0;k<btns.length;k++){btns[k].onclick=function(){images.splice(parseInt(this.getAttribute('data-i'),10),1);render();};}
  updateBtn();
}
function updateBtn(){
  if(busy){btn.disabled=true;btn.textContent=t('generatingPdf','生成PDF中…');}
  else if(!images.length){btn.disabled=true;btn.textContent=t('uploadImagesFirst','请先上传图片');}
  else{btn.disabled=false;btn.textContent=t('generatePdfBtn','生成PDF')+' ('+images.length+t('pages',' 页')+')';}
}
function toEmbeddable(entry){
  return new Promise(function(res,rej){
    var f=entry.file,t=f.type||'';
    if(t==='image/jpeg'||t==='image/png'){
      readAB(f,function(buf){res({bytes:new Uint8Array(buf),kind:t==='image/jpeg'?'jpg':'png'});});
      return;
    }
    var im=new Image();
    im.onload=function(){
      var c=document.createElement('canvas');
      c.width=im.naturalWidth;c.height=im.naturalHeight;
      c.getContext('2d').drawImage(im,0,0);
      c.toBlob(function(blob){
        c.width=0;
        if(!blob){rej(new Error('conv'));return;}
        readAB(blob,function(buf){res({bytes:new Uint8Array(buf),kind:'jpg'});});
      },'image/jpeg',0.92);
    };
    im.onerror=function(){rej(new Error('img'));};
    im.src=entry.url;
  });
}
function doGenerate(){
  if(!images.length||busy)return;
  busy=true;updateBtn();setStatus('');
  $('progressWrap').style.display='block';
  $('progressFill').style.width='0%';
  $('progressTxt').textContent=t('generatingPdf','生成PDF中…')+' 0%';
  PDFLib.PDFDocument.create().then(function(pdfDoc){
    var chain=Promise.resolve();
    images.forEach(function(entry,i){
      chain=chain.then(function(){
        $('progressFill').style.width=Math.round(i/images.length*88)+2+'%';
        $('progressTxt').textContent=t('generatingPdf','生成PDF中…')+' '+Math.round(i/images.length*88)+'%';
        return toEmbeddable(entry).then(function(emb){
          var p=emb.kind==='jpg'?pdfDoc.embedJpg(emb.bytes):pdfDoc.embedPng(emb.bytes);
          return p.then(function(pdfImg){
            var pgW,pgH;
            if(pageSize==='fit'){pgW=pdfImg.width;pgH=pdfImg.height;}
            else{
              var base=PAGE_DIMS[pageSize];
              pgW=orientation==='portrait'?base.w:base.h;
              pgH=orientation==='portrait'?base.h:base.w;
            }
            var page=pdfDoc.addPage([pgW,pgH]);
            var contentW=pgW-marginPt*2,contentH=pgH-marginPt*2;
            var imgAspect=pdfImg.width/pdfImg.height;
            var contentAspect=contentW/contentH;
            var drawW=contentW,drawH=contentH;
            if(imgAspect>contentAspect){drawH=contentW/imgAspect;}
            else{drawW=contentH*imgAspect;}
            page.drawImage(pdfImg,{x:(pgW-drawW)/2,y:(pgH-drawH)/2,width:drawW,height:drawH});
          });
        });
      });
    });
    chain.then(function(){
      $('progressFill').style.width='96%';
      return pdfDoc.save();
    }).then(function(bytes){
      $('progressFill').style.width='100%';
      download(new Blob([bytes.buffer],{type:'application/pdf'}),'images-to-pdf.pdf');
      busy=false;
      updateBtn();
      $('progressWrap').style.display='none';
      setStatus(t('pdfReady','PDF已生成并下载'));
    });
  }).catch(function(err){
    busy=false;
    updateBtn();
    $('progressWrap').style.display='none';
    setStatus(t('genFailed','生成失败：')+err.message,'error');
  });
}
(function(){
  var dragEl=null,from=-1,to=-1,list=$('imgList');
  function idxOf(el){var a=list.querySelectorAll('.img-row'),i;for(i=0;i<a.length;i++){if(a[i]===el)return i;}return -1;}
  function closestEl(el,sel,root){while(el&&el!==root){if(el.matches&&el.matches(sel))return el;el=el.parentNode;}return null;}
  list.addEventListener('pointerdown',function(e){
    var t=closestEl(e.target,'.img-row',list);
    if(!t)return;
    if(closestEl(e.target,'.remove-btn',list))return;
    e.preventDefault();
    dragEl=t;from=idxOf(t);
    try{t.setPointerCapture(e.pointerId);}catch(err){}
    t.classList.add('drag');
  });
  list.addEventListener('pointermove',function(e){
    if(!dragEl)return;
    var items=list.querySelectorAll('.img-row'),n=items.length,i,r;
    to=n;
    for(i=0;i<n;i++){
      r=items[i].getBoundingClientRect();
      if(e.clientY<r.top+r.height/2||(e.clientY<r.bottom&&e.clientX<r.left+r.width/2)){to=i;break;}
    }
    for(i=0;i<n;i++){items[i].classList.remove('drop-before');}
    if(to<n)items[to].classList.add('drop-before');
  });
  function up(){
    if(!dragEl)return;
    if(from!==to&&to>=0){
      var it=images.splice(from,1)[0];
      images.splice(to>from?to-1:to,0,it);
      render();
    }
    dragEl=null;from=-1;to=-1;
    var items=list.querySelectorAll('.img-row'),i;
    for(i=0;i<items.length;i++){items[i].classList.remove('drag');items[i].classList.remove('drop-before');}
  }
  list.addEventListener('pointerup',up);
  list.addEventListener('pointercancel',up);
})();
dz.addEventListener('click',function(){fi.click();});
dz.addEventListener('dragover',function(e){e.preventDefault();dz.classList.add('dragover');});
dz.addEventListener('dragleave',function(){dz.classList.remove('dragover');});
dz.addEventListener('drop',function(e){e.preventDefault();dz.classList.remove('dragover');addFiles(e.dataTransfer.files);});
fi.addEventListener('change',function(){addFiles(this.files);this.value='';});
$('clearBtn').addEventListener('click',function(){
  var i;
  for(i=0;i<images.length;i++){URL.revokeObjectURL(images[i].url);}
  images=[];
  render();
  setStatus('');
});
var szBtns=document.querySelectorAll('[data-sz]'),i;
for(i=0;i<szBtns.length;i++){
  szBtns[i].addEventListener('click',function(){
    pageSize=this.getAttribute('data-sz');
    var k;
    for(k=0;k<szBtns.length;k++){szBtns[k].classList.toggle('on',szBtns[k]===this);}
    var oriBtns=document.querySelectorAll('[data-ori]'),j;
    for(j=0;j<oriBtns.length;j++){oriBtns[j].disabled=pageSize==='fit';}
  });
}
var oriBtns=document.querySelectorAll('[data-ori]');
for(i=0;i<oriBtns.length;i++){
  oriBtns[i].addEventListener('click',function(){
    orientation=this.getAttribute('data-ori');
    var k;
    for(k=0;k<oriBtns.length;k++){oriBtns[k].classList.toggle('on',oriBtns[k]===this);}
  });
}
$('margin').addEventListener('input',function(){marginPt=parseInt(this.value,10);$('marginVal').textContent=this.value+'pt';});
btn.addEventListener('click',doGenerate);
var hint=t('imgFormatHint','JPG · PNG · WebP · 每张最大{maxMB}MB · 最多{maxFiles}张').replace('{maxMB}',MAX_PER_MB).replace('{maxFiles}',MAX_FILES);
$('dzSub').textContent=hint;
})();
</script>
</body>
</html>
