<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JSON格式化器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css">
<style>
.json-tree{font-family:var(--font-mono);font-size:13px;line-height:1.6;}
.json-tree .toggle{cursor:pointer;user-select:none;color:var(--color-text-disabled);margin-right:4px;display:inline-block;width:12px;text-align:center;}
.json-tree .key{color:#881280;}.json-tree .string{color:#0451A5;}.json-tree .number{color:#098658;}.json-tree .bool{color:#0000FF;}.json-tree .null{color:#808080;}
.json-tree .collapsed>.children{display:none;}.json-tree .children{padding-left:20px;}
.json-path-result{font-family:var(--font-mono);font-size:13px;padding:8px;background:var(--color-bg-soft);border:1px solid var(--color-border);border-radius:var(--radius-sm);margin-top:8px;max-height:200px;overflow:auto;}
.diff-view{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-family:var(--font-mono);font-size:12px;}
.diff-view pre{margin:0;padding:8px;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-bg);overflow:auto;max-height:400px;}
.tree-wrap{max-height:400px;overflow:auto;border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-2);background:var(--color-bg);}
.error-detail{font-size:13px;padding:8px 12px;border-radius:var(--radius-sm);margin-top:8px;background:rgba(159,47,45,0.08);border:1px solid rgba(159,47,45,0.35);color:var(--color-error);white-space:pre-wrap;display:none;}
.tool-row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.card .sub-label{display:block;font-size:var(--font-size-sm);color:var(--color-text-secondary);margin-bottom:8px;}
</style></head>
<body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
<main class="tool-workspace">
<h1 data-i18n="h1">JSON 格式化器</h1>
<p class="tool-desc" data-i18n="desc">格式化、压缩、验证、树视图、JSONPath 查询、差异视图、JSON 转 TypeScript 类型。</p>
<div class="card">
<label class="sub-label" data-i18n="inputJson">输入JSON</label>
<textarea id="inputText" class="input textarea js-focus-input" placeholder='{"name":"test","list":[1,2,3]}' style="min-height:150px;"></textarea>
</div>
<div class="tool-row">
<button id="formatBtn" class="btn btn-primary" data-i18n="formatJson">格式化JSON</button>
<button id="minifyBtn" class="btn btn-secondary" data-i18n="minifyJson">压缩JSON</button>
<button id="validateBtn" class="btn btn-secondary" data-i18n="validateJson">验证JSON</button>
<button id="treeBtn" class="btn btn-secondary">树视图</button>
<button id="toTsBtn" class="btn btn-secondary">→ TS 类型</button>
<button id="clearBtn" class="btn btn-secondary">清空</button>
</div>
<div class="card">
<label class="sub-label" data-i18n="ui.101">JSON 差异（粘贴第二段 JSON）</label>
<textarea id="jsonBText" class="input textarea" placeholder='{"name":"test2","list":[1,2,3,4]}' style="min-height:60px;"></textarea>
<button id="diffBtn" class="btn btn-secondary" style="margin-top:8px;">对比差异</button>
<div id="diffView" class="diff-view" style="margin-top:8px;"></div>
</div>
<div class="card">
<label class="sub-label" data-i18n="ui.100">JSONPath 查询</label>
<div class="tool-row" style="margin-bottom:0;">
<input id="jsonPathInput" class="input" placeholder="$.store.book[0].title" style="flex:1;min-width:160px;">
<button id="jsonPathBtn" class="btn btn-secondary">查询</button>
</div>
<div id="jsonPathResult"></div>
</div>
<div id="errorDetail" class="error-detail"></div>
<div class="output-box" id="outputContainer" style="min-height:80px;"><span id="outputText" style="display:block;padding-right:60px;"></span><button class="copy-btn" id="copyBtn">复制</button></div>
</main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
<script src="../../assets/js/i18n.js"></script>
<script>
(function(){
  'use strict';
  var inputEl=document.getElementById('inputText'),outputText=document.getElementById('outputText'),copyBtn=document.getElementById('copyBtn');
  var jpInput=document.getElementById('jsonPathInput'),jpResult=document.getElementById('jsonPathResult'),errorDetail=document.getElementById('errorDetail');
  var jsonB=document.getElementById('jsonBText'),diffView=document.getElementById('diffView');
  var currentParsed=null;

  function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  function tryParse(v){
    try{return{ok:true,data:JSON.parse(v)};}
    catch(e){
      var msg=e.message,posMatch=msg.match(/position\s*(\d+)/i)||msg.match(/at\s+position\s+(\d+)/i);
      errorDetail.style.display='block';
      if(posMatch){
        var pos=parseInt(posMatch[1],10),before=v.substr(0,pos),lines=before.split('\n'),line=lines.length,col=(lines[lines.length-1]||'').length+1;
        errorDetail.innerHTML='<strong>'+t('invalidJson','无效JSON')+'</strong> at pos '+pos+' (line '+line+', col '+col+')<br>'+escapeHtml(msg);
      }else{
        errorDetail.innerHTML='<strong>'+t('invalidJson','无效JSON')+'</strong><br>'+escapeHtml(msg);
      }
      return{ok:false};
    }
  }

  function jsonToTs(obj,name){
    name=name||'Root';
    if(obj===null)return'type '+name+' = null;';
    if(typeof obj==='boolean')return'type '+name+' = boolean;';
    if(typeof obj==='number')return'type '+name+' = number;';
    if(typeof obj==='string')return'type '+name+' = string;';
    if(Object.prototype.toString.call(obj)==='[object Array]'){
      if(obj.length===0)return'type '+name+' = any[];';
      var types={};
      for(var i=0;i<obj.length;i++){
        var t=jsonToTs(obj[i],'Item').replace(/^type Item = /,'').replace(/;$/,'');
        types[t]=true;
      }
      return'type '+name+' = ('+Object.keys(types).join(' | ')+')[];';
    }
    if(typeof obj==='object'){
      var props=[];
      for(var k in obj){
        if(Object.prototype.hasOwnProperty.call(obj,k)){
          props.push('  '+k+': '+jsonToTs(obj[k],'').replace(/^type \w+ = /,'').replace(/;$/,'')+';');
        }
      }
      return'type '+name+' = {\n'+props.join('\n')+'\n};';
    }
    return'type '+name+' = any;';
  }

  function buildTree(value,key){
    var div=document.createElement('div');div.className='entry';
    var prefix=key!==undefined?'<span class="key">'+escapeHtml(JSON.stringify(key))+'</span>: ':'';
    if(value===null)div.innerHTML=prefix+'<span class="null">null</span>';
    else if(typeof value==='boolean')div.innerHTML=prefix+'<span class="bool">'+value+'</span>';
    else if(typeof value==='number')div.innerHTML=prefix+'<span class="number">'+value+'</span>';
    else if(typeof value==='string')div.innerHTML=prefix+'<span class="string">'+escapeHtml(JSON.stringify(value))+'</span>';
    else if(Object.prototype.toString.call(value)==='[object Array]'){
      if(value.length===0){div.innerHTML=prefix+'[]';return div;}
      var toggle=document.createElement('span');toggle.className='toggle';toggle.textContent='▼';
      div.appendChild(toggle);
      div.appendChild(document.createTextNode(prefix+'['));
      var children=document.createElement('div');children.className='children';
      for(var i=0;i<value.length;i++){
        var child=buildTree(value[i],i);
        var comma=i<value.length-1?',':'';
        child.appendChild(document.createTextNode(comma));
        children.appendChild(child);
      }
      div.appendChild(children);div.appendChild(document.createTextNode(']'));
      toggle.addEventListener('click',function(){div.classList.toggle('collapsed');this.textContent=div.classList.contains('collapsed')?'▶':'▼';});
    }else if(typeof value==='object'){
      var keys=Object.keys(value);
      if(keys.length===0){div.innerHTML=prefix+'{}';return div;}
      var toggle2=document.createElement('span');toggle2.className='toggle';toggle2.textContent='▼';
      div.appendChild(toggle2);
      div.appendChild(document.createTextNode(prefix+'{'));
      var children2=document.createElement('div');children2.className='children';
      for(var j=0;j<keys.length;j++){
        var child2=buildTree(value[keys[j]],keys[j]);
        var comma2=j<keys.length-1?',':'';
        child2.appendChild(document.createTextNode(comma2));
        children2.appendChild(child2);
      }
      div.appendChild(children2);div.appendChild(document.createTextNode('}'));
      toggle2.addEventListener('click',function(){div.classList.toggle('collapsed');this.textContent=div.classList.contains('collapsed')?'▶':'▼';});
    }
    return div;
  }

  function showOutput(htmlText){
    outputText.innerHTML=htmlText;
    setStatus('');
  }

  function formatJson(){
    var v=inputEl.value.trim();
    errorDetail.style.display='none';jpResult.innerHTML='';currentParsed=null;
    if(!v){outputText.innerHTML='';setStatus(t('emptyInput','请输入 JSON'),'error');return;}
    var result=tryParse(v);
    if(!result.ok){outputText.innerHTML='';setStatus(t('invalidJson','无效JSON'),'error');return;}
    currentParsed=result.data;
    showOutput('<pre style="font-family:var(--font-mono);font-size:13px;margin:0;">'+escapeHtml(JSON.stringify(result.data,null,2))+'</pre>');
  }

  document.getElementById('formatBtn').addEventListener('click',formatJson);
  document.getElementById('minifyBtn').addEventListener('click',function(){
    var v=inputEl.value.trim();errorDetail.style.display='none';jpResult.innerHTML='';currentParsed=null;
    if(!v){setStatus(t('emptyInput','请输入 JSON'),'error');return;}
    var result=tryParse(v);
    if(!result.ok){setStatus(t('invalidJson','无效JSON'),'error');return;}
    currentParsed=result.data;
    showOutput('<pre style="font-family:var(--font-mono);font-size:13px;margin:0;">'+escapeHtml(JSON.stringify(result.data))+'</pre>');
  });
  document.getElementById('validateBtn').addEventListener('click',function(){
    var v=inputEl.value.trim();errorDetail.style.display='none';
    if(!v){setStatus(t('emptyInput','请输入 JSON'),'error');return;}
    var result=tryParse(v);
    if(!result.ok){setStatus(t('invalidJson','无效JSON'),'error');return;}
    errorDetail.style.display='none';
    outputText.innerHTML='<span style="color:var(--color-success);">✔ '+t('validJson','有效JSON')+'</span>';
    setStatus(t('validJson','有效JSON'),'success');
  });
  document.getElementById('treeBtn').addEventListener('click',function(){
    var v=inputEl.value.trim();errorDetail.style.display='none';jpResult.innerHTML='';currentParsed=null;
    if(!v){setStatus(t('emptyInput','请输入 JSON'),'error');return;}
    var result=tryParse(v);
    if(!result.ok){setStatus(t('invalidJson','无效JSON'),'error');return;}
    currentParsed=result.data;
    outputText.innerHTML='';
    var tw=document.createElement('div');tw.className='tree-wrap json-tree';tw.appendChild(buildTree(result.data));
    outputText.appendChild(tw);
    setStatus('');
  });
  document.getElementById('toTsBtn').addEventListener('click',function(){
    var v=inputEl.value.trim();errorDetail.style.display='none';
    if(!v){setStatus(t('emptyInput','请输入 JSON'),'error');return;}
    var result=tryParse(v);
    if(!result.ok){setStatus(t('invalidJson','无效JSON'),'error');return;}
    showOutput('<pre style="font-family:var(--font-mono);font-size:13px;margin:0;">'+escapeHtml(jsonToTs(result.data))+'</pre>');
    setStatus(t('tsGenerated','TS 类型已生成'));
  });
  document.getElementById('diffBtn').addEventListener('click',function(){
    var a=inputEl.value.trim(),b=jsonB.value.trim();
    if(!a||!b){setStatus(t('needBothJson','请输入两段 JSON'),'error');return;}
    var ra=tryParse(a),rb=tryParse(b);
    if(!ra.ok||!rb.ok){setStatus(t('invalidJson','无效JSON'),'error');return;}
    diffView.innerHTML='<pre style="background:var(--color-bg-soft);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:8px;">A: '+escapeHtml(JSON.stringify(ra.data,null,2))+'</pre><pre style="background:var(--color-bg-soft);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:8px;">B: '+escapeHtml(JSON.stringify(rb.data,null,2))+'</pre>';
    setStatus(t('diffShown','差异已显示'));
  });
  document.getElementById('clearBtn').addEventListener('click',function(){
    inputEl.value='';outputText.innerHTML='';errorDetail.style.display='none';jpResult.innerHTML='';diffView.innerHTML='';jsonB.value='';currentParsed=null;setStatus('');inputEl.focus();
  });
  document.getElementById('jsonPathBtn').addEventListener('click',function(){
    if(!currentParsed){jpResult.innerHTML='<div class="json-path-result" style="color:var(--color-error);">'+t('formatFirst','请先格式化 JSON')+'</div>';return;}
    var path=jpInput.value.trim();
    if(!path){jpResult.innerHTML='';return;}
    try{
      var parts=path.replace(/^\$\.?/,'').split(/\.|\[|\]\.|'|"/).filter(function(p){return p!=='';});
      var results=[currentParsed];
      for(var i=0;i<parts.length;i++){
        var part=parts[i],next=[];
        for(var j=0;j<results.length;j++){
          var item=results[j];
          if(item&&typeof item==='object'){
            if(Object.prototype.toString.call(item)==='[object Array]'){
              if(part==='*'){for(var k=0;k<item.length;k++)next.push(item[k]);}
              else if(!isNaN(part)&&item[+part]!==undefined)next.push(item[+part]);
            }else{
              if(part==='*'){for(var key in item){if(Object.prototype.hasOwnProperty.call(item,key))next.push(item[key]);}}
              else if(item[part]!==undefined)next.push(item[part]);
            }
          }
        }
        results=next;
      }
      jpResult.innerHTML='<div class="json-path-result"><strong>'+t('matches','匹配')+' ('+results.length+')</strong><br>'+escapeHtml(JSON.stringify(results,null,2))+'</div>';
      setStatus('');
    }catch(e){
      jpResult.innerHTML='<div class="json-path-result" style="color:var(--color-error);">Query error: '+escapeHtml(e.message)+'</div>';
    }
  });
  jpInput.addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('jsonPathBtn').click();});
  copyBtn.addEventListener('click',function(){
    var text=outputText.textContent;
    if(text){copyToClipboard(text,copyBtn);setStatus(t('common.copied','已复制'));}
  });
})();
</script>
</body>
</html>
