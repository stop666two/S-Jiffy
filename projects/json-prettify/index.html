<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>JSON 美化 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css"></head>
<body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
<main class="tool-workspace"><h1 data-i18n="h1">JSON 美化输出</h1><p class="tool-desc" data-i18n="desc">格式化 JSON 并缩进（2/4/8 空格或 Tab），支持按键排序。</p>
<div class="card">
<div style="display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;">
<label style="font-size:var(--font-size-sm);color:var(--color-text-secondary);" data-i18n="ui.1">缩进</label>
<select id="indentSelect" class="input" style="width:100px;"><option value="2" data-i18n="ui.2">2 空格</option><option value="4" selected data-i18n="ui.3">4 空格</option><option value="8" data-i18n="ui.4">8 空格</option><option value="tab">Tab</option></select>
<label style="margin-left:12px;display:flex;align-items:center;gap:4px;font-size:var(--font-size-sm);cursor:pointer;"><input type="checkbox" id="sortKeys"> 按键排序</label>
</div>
</div>
<div class="card"><textarea id="inputText" class="input textarea js-focus-input" placeholder="输入 JSON..." style="min-height:150px;"></textarea></div>
<div class="action-bar" style="display:flex;gap:12px;margin:var(--space-2) 0;flex-wrap:wrap;align-items:center;">
<button id="formatBtn" class="btn btn-primary" data-i18n="ui.format">格式化</button><button id="clearBtn" class="btn btn-secondary" data-i18n="ui.clear">清空</button>
</div>
<div class="output-box"><span id="outputText" style="display:block;padding-right:60px;font-family:var(--font-mono);font-size:var(--font-size-xs);white-space:pre-wrap;"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
</main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script></script><script>
(function(){
var inputEl=document.getElementById('inputText');
var outputEl=document.getElementById('outputText');
var formatBtn=document.getElementById('formatBtn');
var clearBtn=document.getElementById('clearBtn');
var copyBtn=document.getElementById('copyBtn');
var indentSelect=document.getElementById('indentSelect');
var sortKeys=document.getElementById('sortKeys');
function getIndent(){
var v=indentSelect.value;
if(v==='tab')return'\t';
return parseInt(v);
}
function sortObject(obj){
if(typeof obj!=='object'||obj===null||Array.isArray(obj))return obj;
var sorted={};
Object.keys(obj).sort().forEach(function(k){sorted[k]=sortObject(obj[k]);});
return sorted;
}
formatBtn.addEventListener('click',function(){
var t=inputEl.value.trim();
if(!t){setStatus('请输入 JSON','error');return;}
try{
var parsed=JSON.parse(t);
var data=sortKeys.checked?sortObject(parsed):parsed;
outputEl.textContent=JSON.stringify(data,null,getIndent());
setStatus('');
}catch(e){
setStatus(t('ui.5','JSON 格式错误: ') +e.message,'error');
}
});
clearBtn.addEventListener('click',function(){inputEl.value='';outputEl.textContent='';setStatus('');inputEl.focus();});
copyBtn.addEventListener('click',function(){if(outputEl.textContent){copyToClipboard(outputEl.textContent,copyBtn);setStatus(t('ui.copied','已复制'));}});
})();
</script></body></html>
