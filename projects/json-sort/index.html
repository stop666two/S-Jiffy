<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>JSON 键排序器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css">
<style>
.opt-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:var(--space-3);}
.opt-row label{font-size:var(--font-size-sm);color:var(--color-text-secondary);}
.diff-output{font-family:var(--font-mono);font-size:13px;line-height:1.5;max-height:400px;overflow:auto;}
</style></head>
<body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
<main class="tool-workspace"><h1 data-i18n="h1">JSON 排序工具</h1><p class="tool-desc" data-i18n="desc">按字母顺序排序 JSON 键，支持嵌套/深层排序与对比视图。</p>
<div class="card"><textarea id="inputText" class="input textarea js-focus-input" placeholder='{"z":[3,2,1],"a":{"nested":{"c":1,"b":2,"a":3}}}' style="min-height:150px;"></textarea></div>
<div class="opt-row">
<label><input type="checkbox" id="chkDeep" checked> 深层排序（嵌套）</label>
<label><input type="checkbox" id="chkDesc"> 降序</label>
<label><input type="checkbox" id="chkArray"> 排序数组</label>
<label data-i18n="ui.1">缩进</label><select id="indentSelect" class="input" style="width:auto;"><option value="2" data-i18n="ui.2">2 空格</option><option value="4" data-i18n="ui.3">4 空格</option><option value="tab">Tab</option></select>
</div>
<div style="display:flex;gap:12px;margin-bottom:var(--space-3);flex-wrap:wrap;">
<button id="sortBtn" class="btn btn-primary" data-i18n="ui.sort">排序</button>
<button id="reverseBtn" class="btn btn-secondary" data-i18n="ui.4">反转键序</button>
<button id="clearBtn" class="btn btn-secondary" data-i18n="ui.clear">清空</button>
</div>
<div class="output-box"><div id="diff输出" class="diff-output"></div><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div></main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script></script>
<script>
(function(){var i=document.getElementById('inputText'),dO=document.getElementById(t('ui.7','diff输出'));

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function sortKeys(obj,desc,deep,sortArrays){if(obj===null||typeof obj!=='object')return obj;
if(Array.isArray(obj)&&!sortArrays)return obj.map(function(v){return deep?sortKeys(v,desc,deep,sortArrays):v;});
if(Array.isArray(obj)&&sortArrays)return obj.slice().sort(function(a,b){return desc?String(b).localeCompare(String(a)):String(a).localeCompare(String(b));});
var keys=Object.keys(obj).sort(function(a,b){return desc?b.localeCompare(a):a.localeCompare(b);});
var result={};for(var i=0;i<keys.length;i++){var val=obj[keys[i]];result[keys[i]]=deep?sortKeys(val,desc,deep,sortArrays):val;}
return result;}
function reverseKeys(obj,deep){if(obj===null||typeof obj!=='object')return obj;if(Array.isArray(obj))return obj.map(function(v){return deep?reverseKeys(v,deep):v;});
var keys=Object.keys(obj).reverse();var result={};for(var i=0;i<keys.length;i++){result[keys[i]]=deep?reverseKeys(obj[keys[i]],deep):obj[keys[i]];}
return result;}

function getIndent(){var v=document.getElementById('indentSelect').value;return v==='tab'?'\t':parseInt(v);}

function process(fn){var t=i.value.trim();if(!t){setStatus(t('ui.100','请输入 JSON'),'error');return;}
try{var parsed=JSON.parse(t);var deep=document.getElementById('chkDeep').checked;var desc=document.getElementById('chkDesc').checked;
var sortAr=document.getElementById('chkArray').checked;var result=fn(parsed,desc,deep,sortAr);
var indent=getIndent();dO.textContent=JSON.stringify(result,null,indent);setStatus(t('ui.6','完成'));}catch(e){setStatus(t('ui.5','无效 JSON：') +e.message,'error');}}

document.getElementById('sortBtn').addEventListener('click',function(){process(function(obj,desc,deep,sortAr){return sortKeys(obj,desc,deep,sortAr);});});
document.getElementById('reverseBtn').addEventListener('click',function(){process(function(obj,desc,deep,sortAr){return reverseKeys(obj,deep);});});
document.getElementById('clearBtn').addEventListener('click',function(){i.value='';dO.textContent='';setStatus('');i.focus();});
document.getElementById('copyBtn').addEventListener('click',function(){if(dO.textContent){copyToClipboard(dO.textContent,this);setStatus(t('ui.copied','已复制'));}});
})();
</script></body></html>
