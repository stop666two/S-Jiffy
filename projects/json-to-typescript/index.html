<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON 转代码 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .io-pair { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-2); }
    @media(max-width:640px){ .io-pair { grid-template-columns:1fr; } }
    .output-box textarea { width:100%; min-height:300px; border:none; background:transparent; font-family:var(--font-mono); font-size:13px; resize:vertical; outline:none; }
    .opts-row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .opts-row label { font-size:var(--font-size-sm); color:var(--color-text-secondary); display:flex; align-items:center; gap:6px; }
    .opts-row select, .opts-row input { height:36px; padding:0 10px; font-size:13px; border:1px solid #ddd; border-radius:var(--radius-md); font-family:var(--font-mono); }
    .stat-line { font-size:var(--font-size-sm); color:var(--color-text-secondary); margin:var(--space-1) 0; }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
  <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">JSON 转代码</h1>
    <p class="tool-desc" data-i18n="desc">将 JSON 转换为 TypeScript、C#、Go、Rust、Swift、Kotlin、Dart、Java、Python 类型定义，或将 JSON Schema、GraphQL SDL、JavaScript 转换为 TypeScript。</p>

    <div class="card">
      <div class="io-pair">
        <div>
          <label id="inputLabel" style="font-size:var(--font-size-xs);color:var(--color-text-disabled);" data-i18n="ui.1">JSON 输入</label>
          <textarea id="jsonInput" class="input textarea js-focus-input" style="min-height:300px;"></textarea>
        </div>
        <div>
          <label style="font-size:var(--font-size-xs);color:var(--color-text-disabled);" data-i18n="ui.2">代码输出</label>
          <div class="output-box" style="min-height:340px;">
            <textarea id="tsOutput" readonly data-i18n-placeholder="ui.101" placeholder="生成的 TypeScript 接口..."></textarea>
            <button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card opts-row">
      <label data-i18n="ui.5">目标语言
        <select id="targetLang">
          <option value="ts" selected data-i18n="ui.ts">TypeScript</option>
          <option value="csharp" data-i18n="ui.csharp">C#</option>
          <option value="go" data-i18n="ui.go">Go</option>
          <option value="rust" data-i18n="ui.rust">Rust</option>
          <option value="swift" data-i18n="ui.swift">Swift</option>
          <option value="kotlin" data-i18n="ui.kotlin">Kotlin</option>
          <option value="dart" data-i18n="ui.dart">Dart</option>
          <option value="java" data-i18n="ui.java">Java</option>
          <option value="python" data-i18n="ui.python">Python</option>
          <option value="schema" data-i18n="ui.schemaTs">JSON Schema → TypeScript</option>
          <option value="graphql" data-i18n="ui.graphqlTs">GraphQL → TypeScript</option>
          <option value="js" data-i18n="ui.jsTs">JavaScript → TypeScript</option>
        </select>
      </label>
      <label data-i18n="ui.111">根名称
        <input id="rootName" class="input" value="RootClass" style="width:160px;">
      </label>
      <button id="convertBtn" class="btn btn-primary" data-i18n="ui.convert">转换</button>
      <button id="clearBtn" class="btn btn-secondary" data-i18n="ui.clear">清空</button>
    </div>

    <div class="stat-line" id="statLine" style="display:none;"></div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>
    (function () {
      var jsonInput = document.getElementById('jsonInput');
      var tsOutput = document.getElementById('tsOutput');
      var convertBtn = document.getElementById('convertBtn');
      var clearBtn = document.getElementById('clearBtn');
      var copyBtn = document.getElementById('copyBtn');
      var targetLang = document.getElementById('targetLang');
      var rootNameEl = document.getElementById('rootName');
      var inputLabel = document.getElementById('inputLabel');
      var statLine = document.getElementById('statLine');

      var PLACEHOLDER_JSON = '{"name":"Alice","age":30,"items":[1,2,3]}';
      var PLACEHOLDER_SCHEMA = '{\n  "type": "object",\n  "properties": {\n    "id": { "type": "integer" },\n    "name": { "type": "string" },\n    "tags": { "type": "array", "items": { "type": "string" } },\n    "address": {\n      "type": "object",\n      "properties": {\n        "city": { "type": "string" },\n        "zip": { "type": "string" }\n      },\n      "required": ["city"]\n    }\n  },\n  "required": ["id", "name"]\n}';
      var PLACEHOLDER_GRAPHQL = 'type User {\n  id: ID!\n  name: String!\n  email: String\n  age: Int\n}\nenum Role {\n  ADMIN\n  USER\n}\ninput UserInput {\n  name: String!\n}\nunion SearchResult = User | Article';
      var PLACEHOLDER_JS = 'function greet(name) {\n  return "Hello, " + name;\n}\n\nconst age = 25;\nlet active = true;\n';

      function placeholderFor(target) {
        if (target === 'schema') return PLACEHOLDER_SCHEMA;
        if (target === 'graphql') return PLACEHOLDER_GRAPHQL;
        if (target === 'js') return PLACEHOLDER_JS;
        return PLACEHOLDER_JSON;
      }

      function capitalize(s) {
        if (!s) return 'EmptyField';
        return s.charAt(0).toUpperCase() + s.slice(1);
      }

      function safeName(s) {
        return s.replace(/[^a-zA-Z0-9_]/g, '_').replace(/^(\d)/, '_$1');
      }

      function camelCase(s) {
        return s.replace(/[^a-zA-Z0-9]+(.)/g, function (_, c) { return c.toUpperCase(); }).replace(/^[A-Z]/, function (c) { return c.toLowerCase(); });
      }

      function snakeCase(s) {
        return s.replace(/([A-Z])/g, '_$1').replace(/[^a-zA-Z0-9_]/g, '_').replace(/^_/, '').toLowerCase().replace(/__+/g, '_');
      }

      var usedNames = {};

      function uniqueName(base) {
        var n = base; var i = 1;
        while (usedNames[n]) { n = base + i; i++; }
        usedNames[n] = true;
        return n;
      }

      function uniqueGoName(base) {
        var n = base; var i = 1;
        while (usedNames[n]) { n = base + '_' + i; i++; }
        usedNames[n] = true;
        return n;
      }

      function toTypeName(key) {
        var name = key.replace(/[^a-zA-Z0-9]/g, ' ');
        name = name.split(/\s+/).map(function (w) { return w ? capitalize(w) : ''; }).join('');
        if (!name) return 'Anonymous';
        if (/^\d/.test(name)) name = '_' + name;
        return name;
      }

      var tsInterfaces = [];

      function tsGetType(val, key, seen) {
        if (val === null || val === undefined) return 'any';
        if (typeof val === 'string') return 'string';
        if (typeof val === 'number') return 'number';
        if (typeof val === 'boolean') return 'boolean';
        if (Array.isArray(val)) {
          if (val.length === 0) return 'any[]';
          var types = {};
          for (var i = 0; i < Math.min(val.length, 5); i++) {
            var tp = tsGetType(val[i], key, seen);
            types[tp] = true;
          }
          var typeKeys = Object.keys(types);
          if (typeKeys.length === 1) return typeKeys[0] + '[]';
          return '(' + typeKeys.join(' | ') + ')[]';
        }
        if (typeof val === 'object') {
          var name = toTypeName(key);
          if (seen[name]) return name;
          seen[name] = true;
          return tsBuildInterface(val, name, seen);
        }
        return 'any';
      }

      function tsBuildInterface(obj, name, seen) {
        var lines = ['export interface ' + name + ' {'];
        var keys = Object.keys(obj);
        for (var i = 0; i < keys.length; i++) {
          var k = keys[i];
          var val = obj[k];
          var tsType = tsGetType(val, k, seen);
          var opt = val === null ? '?' : '';
          lines.push('  ' + k + opt + ': ' + tsType + ';');
        }
        lines.push('}');
        var str = lines.join('\n');
        tsInterfaces.push(str);
        return name;
      }

      function genTS(obj) {
        tsInterfaces = [];
        var seen = {};
        var rootName = obj.constructor === Array ? 'RootArray' : 'RootType';
        var rootType = tsGetType(obj, 'root', seen);
        var finalStr = tsInterfaces.reverse().join('\n\n');
        if (rootName === 'RootArray') {
          var arrayItemType = rootType.replace('[]', '');
          finalStr += '\n\nexport type ' + rootName + ' = ' + arrayItemType + '[];';
        }
        return finalStr || 'export type ' + rootName + ' = ' + rootType + ';';
      }

      function csharpType(v) {
        if (v === null) return 'object';
        if (typeof v === 'string') return 'string';
        if (typeof v === 'number') return v % 1 === 0 ? 'int' : 'double';
        if (typeof v === 'boolean') return 'bool';
        if (Array.isArray(v)) return 'List<object>';
        return 'object';
      }

      function toPascal(s) {
        return s.charAt(0).toUpperCase() + s.slice(1).replace(/[^a-zA-Z0-9]/g, '_');
      }

      function genCSharp(obj, rootName) {
        if (!obj || typeof obj !== 'object') return t('ui.104', '// 需要对象或数组');
        if (Array.isArray(obj) && obj.length > 0) obj = obj[0];
        if (typeof obj !== 'object' || obj === null) return t('ui.105', '// 无法推断结构');
        var lines = ['public class ' + rootName + '\n{'];
        for (var k in obj) {
          var propName = toPascal(k);
          var propType = csharpType(obj[k]);
          lines.push('    public ' + propType + ' ' + propName + ' { get; set; }');
        }
        lines.push('}');
        return lines.join('\n');
      }

      function goTypeName(val, depth) {
        if (depth === undefined) depth = 0;
        if (depth > 10) return 'interface{}';
        if (val === null) return 'interface{}';
        if (typeof val === 'boolean') return 'bool';
        if (typeof val === 'number') {
          if (Number.isInteger(val)) return 'int64';
          return 'float64';
        }
        if (typeof val === 'string') return 'string';
        if (Array.isArray(val)) {
          if (val.length === 0) return '[]interface{}';
          var elem = goTypeName(val[0], depth + 1);
          for (var i = 1; i < val.length; i++) {
            var tp = goTypeName(val[i], depth + 1);
            if (tp !== elem) { elem = 'interface{}'; break; }
          }
          return '[]' + elem;
        }
        if (typeof val === 'object') return 'map[string]interface{}';
        return 'interface{}';
      }

      function generateGoStruct(val, name, depth) {
        if (depth === undefined) depth = 0;
        if (depth > 10) return '';
        if (val === null || typeof val !== 'object' || Array.isArray(val)) return '';
        var keys = Object.keys(val);
        var result = 'type ' + name + ' struct {\n';
        for (var i = 0; i < keys.length; i++) {
          var k = keys[i];
          var v = val[k];
          var fieldName = uniqueGoName(capitalize(safeName(k)));
          var tag = k;
          var goType = goTypeName(v, depth);
          var inlineStruct = false;
          if (v !== null && typeof v === 'object' && !Array.isArray(v)) {
            inlineStruct = true;
            var structName = uniqueGoName(capitalize(safeName(k)) + 'Struct');
            if (depth < 8) {
              result += '  ' + fieldName + ' ' + structName + ' `json:"' + htmlEscape(tag) + '"`\n';
            } else {
              goType = goTypeName(v, depth);
              result += '  ' + fieldName + ' ' + goType + ' `json:"' + htmlEscape(tag) + '"`\n';
              inlineStruct = false;
            }
          } else if (Array.isArray(v) && v.length > 0 && v[0] !== null && typeof v[0] === 'object' && !Array.isArray(v[0])) {
            var arrStructName = uniqueGoName(capitalize(safeName(k)) + 'Item');
            inlineStruct = true;
            result += '  ' + fieldName + ' []' + arrStructName + ' `json:"' + htmlEscape(tag) + '"`\n';
          } else {
            result += '  ' + fieldName + ' ' + goType + ' `json:"' + htmlEscape(tag) + '"`\n';
          }
        }
        result += '}\n';
        for (var i = 0; i < keys.length; i++) {
          var v = val[keys[i]];
          if (v !== null && typeof v === 'object' && !Array.isArray(v) && depth < 8) {
            var subName = uniqueGoName(capitalize(safeName(keys[i])) + 'Struct');
            result += '\n' + generateGoStruct(v, subName, depth + 1);
          }
          if (Array.isArray(v) && v.length > 0 && v[0] !== null && typeof v[0] === 'object' && !Array.isArray(v[0])) {
            var arrSubName = uniqueGoName(capitalize(safeName(keys[i])) + 'Item');
            result += '\n' + generateGoStruct(v[0], arrSubName, depth + 1);
          }
        }
        return result;
      }

      function genGo(parsed, name) {
        usedNames = {};
        name = uniqueGoName(capitalize(safeName(name)));
        return 'package main\n\n' + generateGoStruct(parsed, name, 0);
      }
      function rustType(val, depth) {
        if (depth === undefined) depth = 0;
        if (depth > 10) return 'serde_json::Value';
        if (val === null) return 'Option<serde_json::Value>';
        if (typeof val === 'boolean') return 'bool';
        if (typeof val === 'number') {
          if (Number.isInteger(val)) {
            if (val >= 0 && val <= 127) return 'i8';
            if (val >= -128 && val <= 127) return 'i8';
            if (val >= -32768 && val <= 32767) return 'i16';
            if (val >= -2147483648 && val <= 2147483647) return 'i32';
            return 'i64';
          }
          return 'f64';
        }
        if (typeof val === 'string') return 'String';
        if (Array.isArray(val)) {
          if (val.length === 0) return 'Vec<serde_json::Value>';
          var elem = rustType(val[0], depth + 1);
          for (var i = 1; i < val.length; i++) {
            if (rustType(val[i], depth + 1) !== elem) { elem = 'serde_json::Value'; break; }
          }
          return 'Vec<' + elem + '>';
        }
        if (typeof val === 'object') return 'struct';
        return 'serde_json::Value';
      }

      function generateRustStruct(val, name, depth) {
        if (depth === undefined) depth = 0;
        if (depth > 10) return '';
        if (val === null || typeof val !== 'object' || Array.isArray(val)) return '';
        var keys = Object.keys(val);
        var derives = '#[derive(Debug, Clone, Serialize, Deserialize)]\n';
        var result = derives + 'pub struct ' + name + ' {\n';
        for (var i = 0; i < keys.length; i++) {
          var k = keys[i];
          var v = val[k];
          var fieldName = safeName(k);
          var fieldRust = fieldName.replace(/_([a-z])/g, function (m, c) { return c.toUpperCase(); });
          fieldRust = fieldName.split('_').map(function (s) { if (s.length === 0) return s; return s.charAt(0).toUpperCase() + s.slice(1); }).join('');
          if (fieldRust.length === 0) fieldRust = 'Field' + i;
          fieldRust = uniqueName(capitalize(fieldRust));
          var rType = rustType(v, depth);
          var serdeAttr = '#[serde(rename = ' + JSON.stringify(k) + ')]';
          var typeStr;
          if (v !== null && typeof v === 'object' && !Array.isArray(v) && depth < 8) {
            var subName = uniqueName(capitalize(safeName(k)));
            result += '  ' + serdeAttr + '\n  pub ' + fieldName + ': ' + subName + ',\n';
            for (var j = 0; j < keys.length; j++) {
              if (j === i) continue;
            }
          } else if (Array.isArray(v) && v.length > 0 && v[0] !== null && typeof v[0] === 'object' && !Array.isArray(v[0]) && depth < 8) {
            var arrSubName = uniqueName(capitalize(safeName(k)) + 'Item');
            result += '  ' + serdeAttr + '\n  pub ' + fieldName + ': Vec<' + arrSubName + '>,\n';
          } else {
            typeStr = rType;
            if (v === null) typeStr = 'Option<' + typeStr + '>';
            result += '  ' + serdeAttr + '\n  pub ' + fieldName + ': ' + typeStr + ',\n';
          }
        }
        result += '}\n';
        for (var i = 0; i < keys.length; i++) {
          var v = val[keys[i]];
          if (v !== null && typeof v === 'object' && !Array.isArray(v) && depth < 8) {
            var subName = uniqueName(capitalize(safeName(keys[i])));
            result += '\n' + generateRustStruct(v, subName, depth + 1);
          }
          if (Array.isArray(v) && v.length > 0 && v[0] !== null && typeof v[0] === 'object' && !Array.isArray(v[0]) && depth < 8) {
            var arrSubName = uniqueName(capitalize(safeName(keys[i])) + 'Item');
            result += '\n' + generateRustStruct(v[0], arrSubName, depth + 1);
          }
        }
        return result;
      }

      function genRust(parsed) {
        usedNames = {};
        var name = uniqueName('Root');
        return 'use serde::{Deserialize, Serialize};\n\n' + generateRustStruct(parsed, name, 0);
      }

      String.prototype.prefix = String.prototype.prefix || function (n) { return this.substring(0, n); };

      function swiftType(val, depth) {
        if (depth === undefined) depth = 0;
        if (depth > 10) return 'Any';
        if (val === null) return 'Any?';
        if (typeof val === 'boolean') return 'Bool';
        if (typeof val === 'number') {
          if (Number.isInteger(val)) {
            if (val >= Number.MIN_SAFE_INTEGER && val <= Number.MAX_SAFE_INTEGER) return 'Int';
            return 'Int64';
          }
          return 'Double';
        }
        if (typeof val === 'string') return 'String';
        if (Array.isArray(val)) {
          if (val.length === 0) return '[Any]';
          var elem = swiftType(val[0], depth + 1);
          for (var i = 1; i < val.length; i++) {
            if (swiftType(val[i], depth + 1) !== elem) { elem = 'Any'; break; }
          }
          return '[' + elem + ']';
        }
        if (typeof val === 'object') return 'struct';
        return 'Any';
      }

      function generateSwiftStruct(val, name, depth) {
        if (depth === undefined) depth = 0;
        if (depth > 10) return '';
        if (val === null || typeof val !== 'object' || Array.isArray(val)) return '';
        var keys = Object.keys(val);
        var result = 'struct ' + name + ': Codable {\n';
        for (var i = 0; i < keys.length; i++) {
          var k = keys[i];
          var v = val[k];
          var propName = camelCase(safeName(k));
          propName = uniqueName(propName || 'field' + i);
          var sType = swiftType(v, depth);
          var typeStr;
          if (v !== null && typeof v === 'object' && !Array.isArray(v) && depth < 8) {
            var subName = uniqueName(capitalize(safeName(k)));
            typeStr = subName;
          } else if (Array.isArray(v) && v.length > 0 && v[0] !== null && typeof v[0] === 'object' && !Array.isArray(v[0]) && depth < 8) {
            var arrSubName = uniqueName(capitalize(safeName(k)) + 'Item');
            typeStr = '[' + arrSubName + ']';
          } else {
            typeStr = sType;
          }
          if (v === null) typeStr += '?';
          result += '  let ' + propName + ': ' + typeStr + '\n';
        }
        var codingKeys = '  enum CodingKeys: String, CodingKey {\n';
        for (var i = 0; i < keys.length; i++) {
          var k = keys[i];
          var propName = camelCase(safeName(k)) || 'field' + i;
          if (propName === k) {
            codingKeys += '    case ' + propName + '\n';
          } else {
            codingKeys += '    case ' + propName + ' = ' + JSON.stringify(k) + '\n';
          }
        }
        codingKeys += '  }\n';
        result += codingKeys + '}\n';
        for (var i = 0; i < keys.length; i++) {
          var v = val[keys[i]];
          if (v !== null && typeof v === 'object' && !Array.isArray(v) && depth < 8) {
            var subName = uniqueName(capitalize(safeName(keys[i])));
            result += '\n' + generateSwiftStruct(v, subName, depth + 1);
          }
          if (Array.isArray(v) && v.length > 0 && v[0] !== null && typeof v[0] === 'object' && !Array.isArray(v[0]) && depth < 8) {
            var arrSubName = uniqueName(capitalize(safeName(keys[i])) + 'Item');
            result += '\n' + generateSwiftStruct(v[0], arrSubName, depth + 1);
          }
        }
        return result;
      }

      function genSwift(parsed) {
        usedNames = {};
        var name = uniqueName('Root');
        return 'import Foundation\n\n' + generateSwiftStruct(parsed, name, 0);
      }

      function kotlinType(val, depth) {
        if (depth === undefined) depth = 0;
        if (depth > 10) return 'Any';
        if (val === null) return 'Any?';
        if (typeof val === 'boolean') return 'Boolean';
        if (typeof val === 'number') {
          if (Number.isInteger(val)) {
            if (val >= -2147483648 && val <= 2147483647) return 'Int';
            return 'Long';
          }
          return 'Double';
        }
        if (typeof val === 'string') return 'String';
        if (Array.isArray(val)) {
          if (val.length === 0) return 'List<Any>';
          var elem = kotlinType(val[0], depth + 1);
          for (var i = 1; i < val.length; i++) {
            if (kotlinType(val[i], depth + 1) !== elem) { elem = 'Any'; break; }
          }
          return 'List<' + elem + '>';
        }
        if (typeof val === 'object') return 'data class';
        return 'Any';
      }

      function generateKotlinDataClass(val, name, depth) {
        if (depth === undefined) depth = 0;
        if (depth > 10) return '';
        if (val === null || typeof val !== 'object' || Array.isArray(val)) return '';
        var keys = Object.keys(val);
        var result = 'data class ' + name + '(\n';
        var fields = [];
        for (var i = 0; i < keys.length; i++) {
          var k = keys[i];
          var v = val[k];
          var propName = safeName(k);
          propName = uniqueName(propName || 'field' + i);
          var ktType = kotlinType(v, depth);
          var typeStr;
          if (v !== null && typeof v === 'object' && !Array.isArray(v) && depth < 8) {
            var subName = uniqueName(capitalize(safeName(k)));
            typeStr = subName;
          } else if (Array.isArray(v) && v.length > 0 && v[0] !== null && typeof v[0] === 'object' && !Array.isArray(v[0]) && depth < 8) {
            var arrSubName = uniqueName(capitalize(safeName(k)) + 'Item');
            typeStr = 'List<' + arrSubName + '>';
          } else {
            typeStr = ktType;
          }
          if (v === null) typeStr += '?';
          var jsonName = k;
          var annotation = '  @SerializedName(' + JSON.stringify(jsonName) + ')\n';
          fields.push({ annotation: annotation, prop: propName, type: typeStr });
        }
        for (var i = 0; i < fields.length; i++) {
          result += fields[i].annotation;

              } else if (keyword === 'const') {
                result.push(indent + 'const ' + varName + (rhs ? ' = ' + rhs : '') + (comment ? ' ' + comment : ''));
              } else if (keyword === 'var') {
                result.push(indent + 'let ' + varName + ': ' + tsType + (rhs ? ' = ' + rhs : '') + (comment ? ' ' + comment : ''));
              } else {
                result.push(indent + 'let ' + varName + ': ' + tsType + (rhs ? ' = ' + rhs : '') + (comment ? ' ' + comment : ''));
              }
            } else {
              result.push(line);
            }
            continue;
          }

          if (/^function\s+/.test(codePart)) {
            var funcMatch = codePart.match(/^function\s+(\w[\w$]*)\s*\(([^)]*)\)\s*(:\s*\w[\w<>,[\]|\s]*)?\s*\{?$/);
            if (funcMatch) {
              var funcName = funcMatch[1];
              var params = funcMatch[2].trim();
              var hasReturnType = funcMatch[3];
              var typedParams = [];
              if (params) {
                var paramList = params.split(',');
                for (var j = 0; j < paramList.length; j++) {
                  var p = paramList[j].trim();
                  if (!p) continue;
                  if (p.indexOf(':') === -1) {
                    typedParams.push(p + ': any');
                  } else {
                    typedParams.push(p);
                  }
                }
              }
              if (hasReturnType) {
                result.push(indent + 'function ' + funcName + '(' + typedParams.join(', ') + ')' + hasReturnType + ' {');
              } else {
                result.push(indent + 'function ' + funcName + '(' + typedParams.join(', ') + '): any {');
              }
            } else {
              result.push(line);
            }
            continue;
          }

          if (/^const\s+\w+\s*=\s*\(/.test(codePart) || /^const\s+\w+\s*=\s*function/.test(codePart) || /^const\s+\w+\s*=\s*async\s*\(/.test(codePart)) {
            var arrowMatch = codePart.match(/^const\s+(\w[\w$]*)\s*=\s*(async\s*)?(?:function\s*)?\(([^)]*)\)\s*(?::\s*\w[\w<>,[\]|\s]*)?\s*=>?\s*\{?$/);
            if (arrowMatch) {
              var arrowName = arrowMatch[1];
              var asyncKw = arrowMatch[2] || '';
              var arrowParams = arrowMatch[3].trim();
              var typedArrowParams = [];
              if (arrowParams) {
                var apList = arrowParams.split(',');
                for (var j = 0; j < apList.length; j++) {
                  var ap = apList[j].trim();
                  if (!ap) continue;
                  if (ap.indexOf(':') === -1) typedArrowParams.push(ap + ': any');
                  else typedArrowParams.push(ap);
                }
              }
              result.push(indent + 'const ' + arrowName + ': (' + typedArrowParams.join(', ') + ') => any = ' + asyncKw + '(' + typedArrowParams.join(', ') + ') => {');
            } else {
              result.push(line);
            }
            continue;
          }

          if (/^for\s*\(/.test(codePart)) {
            var forMatch = codePart.match(/^for\s*\(\s*(let|var|const)?\s*(\w[\w$]*)\s*(=.*)?;\s*(.*);\s*(.*)\)/);
            if (forMatch) {
              var forKeyword = forMatch[1] || 'let';
              var forVar = forMatch[2];
              result.push(indent + 'for (' + forKeyword + ' ' + forVar + ': number =' + (forMatch[3] || ' 0') + '; ' + forMatch[4] + '; ' + forMatch[5] + ')');
            } else {
              result.push(line);
            }
            continue;
          }

          if (/^(catch\s*\()(\w+)(\))/.test(codePart)) {
            result.push(line.replace(/^(catch\s*\()(\w+)(\))/, '$1$2: any$3'));
            continue;
          }

          result.push(line);
        }
        return result.join('\n');
      }

      function convert() {
        var target = targetLang.value;
        var text = jsonInput.value;
        statLine.textContent = '';
        statLine.style.display = 'none';

        if (target === 'graphql') {
          if (!text.trim()) { tsOutput.value = ''; setStatus(''); return; }
          var g = genGraphQL(text);
          if (!g) {
            tsOutput.value = '';
            setStatus(t('ui.106', '未解析到任何类型定义：请粘贴包含 type/interface/enum/input/union 块的有效 GraphQL SDL'), 'error');
            return;
          }
          tsOutput.value = g.code;
          statLine.textContent = g.stat;
          statLine.style.display = '';
          setStatus(t('ui.convertOk', '转换成功'));
          return;
        }

        if (target === 'js') {
          if (!text.trim()) { setStatus(t('ui.107', '请输入 JavaScript 代码'), 'error'); return; }
          tsOutput.value = jsToTs(text);
          setStatus(t('ui.convertOk', '转换成功'));
          return;
        }

        if (!text.trim()) {
          setStatus(t(target === 'schema' ? 'ui.102' : 'ui.100', target === 'schema' ? '请输入 JSON Schema' : '请输入 JSON'), 'error');
          return;
        }

        var parsed;
        try {
          parsed = JSON.parse(text);
        } catch (e) {
          if (target === 'csharp') {
            tsOutput.value = t('ui.103', '// 无效 JSON: ') + e.message;
            setStatus(t('ui.convertOk', '转换成功'));
          } else {
            tsOutput.value = '';
            setStatus(t('ui.3', 'JSON 解析失败: ') + e.message, 'error');
          }
          return;
        }

        var out;
        try {
          switch (target) {
            case 'ts':
              out = genTS(parsed);
              break;
            case 'csharp':
              out = genCSharp(parsed, rootNameEl.value.trim() || 'RootClass');
              break;
            case 'go':
              out = genGo(parsed, rootNameEl.value.trim() || 'AutoGenerated');
              break;
            case 'rust':
              out = genRust(parsed);
              break;
            case 'swift':
              out = genSwift(parsed);
              break;
            case 'kotlin':
              out = genKotlin(parsed);
              break;
            case 'dart':
              out = genDart(parsed);
              break;
            case 'java':
              out = genJava(parsed);
              break;
            case 'python':
              out = genPython(parsed);
              break;
            case 'schema':
              out = genSchema(parsed);
              break;
            default:
              out = genTS(parsed);
              break;
          }
        } catch (e) {
          tsOutput.value = '';
          setStatus(t('ui.3', 'JSON 解析失败: ') + e.message, 'error');
          return;
        }
        tsOutput.value = out;
        setStatus(t('ui.convertOk', '转换成功'));
      }

      function onTargetChange() {
        var target = targetLang.value;
        if (target === 'schema') {
          inputLabel.textContent = t('ui.108', 'JSON Schema 输入');
        } else if (target === 'graphql') {
          inputLabel.textContent = t('ui.109', 'GraphQL SDL 输入');
        } else if (target === 'js') {
          inputLabel.textContent = t('ui.110', 'JavaScript 代码输入');
        } else {
          inputLabel.textContent = t('ui.1', 'JSON 输入');
        }
        jsonInput.placeholder = placeholderFor(target);
        if (target === 'csharp' && !rootNameEl.value) rootNameEl.value = 'RootClass';
        if (target === 'go' && !rootNameEl.value) rootNameEl.value = 'AutoGenerated';
        tsOutput.placeholder = target === 'ts' ? t('ui.101', '生成的 TypeScript 接口...') : t('ui.112', '生成的代码...');
        statLine.textContent = '';
        statLine.style.display = 'none';
        setStatus('');
      }

      convertBtn.addEventListener('click', convert);
      clearBtn.addEventListener('click', function () {
        jsonInput.value = '';
        tsOutput.value = '';
        statLine.textContent = '';
        statLine.style.display = 'none';
        setStatus('');
        jsonInput.focus();
      });
      copyBtn.addEventListener('click', function () {
        if (tsOutput.value) {
          copyToClipboard(tsOutput.value, copyBtn);
          setStatus(t('ui.copied', '已复制'));
        }
      });
      targetLang.addEventListener('change', onTargetChange);
      jsonInput.addEventListener('keydown', function (e) {
        if (e.ctrlKey && e.key === 'Enter') convert();
      });

      onTargetChange();
    })();
  </script>
</body>
</html>
