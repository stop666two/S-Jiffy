<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>闰年检测 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css"><style>.ly-list{font-family:var(--font-mono);font-size:var(--font-size-sm);color:var(--color-text-secondary)}</style></head>
<body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a></header>
<main class="tool-workspace"><h1 data-i18n="h1">闰年判断</h1><p class="tool-desc" data-i18n="desc">检测任意年份是否为闰年，显示前后最近的闰年。</p>
<div class="card"><input id="yearInput" type="number" class="input" data-i18n-placeholder="ui.101" placeholder="输入年份..." value="2024" style="width:200px;">
<div style="display:flex;gap:12px;margin-top:var(--space-2);flex-wrap:wrap;"><button id="checkBtn" class="btn btn-primary" data-i18n="ui.1">检测</button><button id="clearBtn" class="btn btn-secondary" data-i18n="ui.clear">清空</button></div>
</div>
<div class="card" id="resultCard" style="display:none;"><h3 id="resultTitle" style="margin-bottom:var(--space-2);"></h3>
<p id="resultDetail" style="font-size:var(--font-size-sm);margin-bottom:var(--space-2);"></p>
<p style="font-size:var(--font-size-xs);color:var(--color-text-secondary);">前一个闰年: <span id="prevLeap">-</span></p>
<p style="font-size:var(--font-size-xs);color:var(--color-text-secondary);">后一个闰年: <span id="nextLeap">-</span></p>
</div>
<div class="output-box"><span id="outputText" style="display:block;padding-right:60px;"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
</main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script><script>
(function(){
var yearInput=document.getElementById('yearInput');
var checkBtn=document.getElementById('checkBtn');
var clearBtn=document.getElementById('clearBtn');
var copyBtn=document.getElementById('copyBtn');
var resultCard=document.getElementById('resultCard');
var resultTitle=document.getElementById('resultTitle');
var resultDetail=document.getElementById('resultDetail');
var prevLeap=document.getElementById('prevLeap');
var nextLeap=document.getElementById('nextLeap');
var outputEl=document.getElementById('outputText');
function isLeap(y){return(y%4===0&&y%100!==0)||y%400===0;}
function findPrev(y){for(var i=y-1;i>0;i--){if(isLeap(i))return i;}return null;}
function findNext(y){for(var i=y+1;i<=9999;i++){if(isLeap(i))return i;}return null;}
function check(){
var y=parseInt(yearInput.value);
if(isNaN(y)||y<1||y>9999){setStatus(t('ui.100','请输入有效年份(1-9999)'),'error');resultCard.style.display='none';return;}
resultCard.style.display='block';
var leap=isLeap(y);
resultTitle.textContent=y+ t('ui.year',' 年')+(leap?' ✓ 是闰年':' ✗ 不是闰年');
resultTitle.style.color=leap?'var(--color-primary)':'var(--color-error)';
var febDays=leap?29:28;
resultDetail.textContent = t('ui.5','2月有 ')+febDays+ t('ui.4',' 天，全年 ')+(leap?366:365)+ t('ui.3',' 天。');
var p=findPrev(y);
var n=findNext(y);
prevLeap.textContent=p!==null?p:'-';
nextLeap.textContent=n!==null?n:'-';
outputEl.textContent=y+ t('ui.year',' 年')+(leap?' 是':' 不是')+ t('ui.2','闰年');
setStatus('');
}
yearInput.addEventListener('keydown',function(e){if(e.key==='Enter')check();});
checkBtn.addEventListener('click',check);
clearBtn.addEventListener('click',function(){yearInput.value='';resultCard.style.display='none';outputEl.textContent='';setStatus('');yearInput.focus();});
copyBtn.addEventListener('click',function(){if(outputEl.textContent){copyToClipboard(outputEl.textContent,copyBtn);setStatus(t('ui.copied','已复制'));}});
})();
</script></body></html>
