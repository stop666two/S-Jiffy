<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>六爻排盘 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .mode-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: var(--space-3); }
    .mode-btn { height: 40px; min-width: 0; padding: 0 16px; font-size: 13px; }
    .mode-btn.on { background: var(--color-text-primary); color: #fff; border-color: var(--color-text-primary); }
    .mode-panel { display: none; }
    .mode-panel.show { display: block; }
    .row3 { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-2); }
    .input-group { display: flex; flex-direction: column; gap: 4px; }
    .input-group label { font-size: var(--font-size-xs); color: var(--color-text-secondary); }
    .input-group .input { width: 140px; height: 44px; }
    .check-label { display: flex; align-items: center; gap: 8px; font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: var(--space-2); cursor: pointer; }
    .coin-wrap { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
    .coin-btn { width: 116px; height: 116px; border-radius: 50%; font-size: 15px; flex-shrink: 0; }
    .throw-hint { font-size: var(--font-size-sm); color: var(--color-text-secondary); }
    .throw-list { margin-top: var(--space-2); font-size: var(--font-size-sm); line-height: 1.9; color: var(--color-text-secondary); min-height: 24px; }
    .reset-btn { margin-top: var(--space-2); }
    .pan-meta { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: var(--space-3); line-height: 1.8; }
    .pan-grid { display: flex; gap: var(--space-4); flex-wrap: wrap; }
    .pan-col { flex: 1; min-width: 250px; }
    .pan-title { font-size: var(--font-size-lg); font-weight: 600; margin-bottom: 4px; }
    .pan-sub { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: var(--space-2); }
    .yao-wrap { width: 160px; }
    .yao { height: 12px; margin: 5px 0; position: relative; }
    .yao .seg { position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 2px; background: var(--color-text-primary); }
    .yao .seg.l { left: 0; }
    .yao .seg.r { right: 0; }
    .yao.yang .seg { width: 100%; right: auto; }
    .yao .mlabel { position: absolute; right: 100%; top: -3px; margin-right: 10px; font-size: 11px; color: var(--color-text-secondary); white-space: nowrap; }
    .yao .mmark { position: absolute; left: 100%; top: -4px; margin-left: 10px; font-size: 13px; color: var(--color-error); font-weight: 700; }
    .guaci { font-size: 14px; line-height: 1.7; margin-top: var(--space-2); }
    .guaci .glabel { color: var(--color-text-secondary); }
    .move-line { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-top: var(--space-2); }
    .disclaim { font-size: var(--font-size-xs); color: var(--color-text-disabled); margin-top: var(--space-3); }
    .act-row { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <a href="../../index.html" class="back-btn">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1>六爻排盘</h1>
    <p class="tool-desc">按传统六爻规则起卦排盘，自动推演本卦与变卦，供传统文化爱好者参考。</p>
    <div class="card">
      <div class="mode-row" id="modeRow">
        <button class="btn btn-secondary mode-btn on" data-mode="manual">手工摇卦</button>
        <button class="btn btn-secondary mode-btn" data-mode="num">报数起卦</button>
        <button class="btn btn-secondary mode-btn" data-mode="time">时间起卦</button>
        <button class="btn btn-secondary mode-btn" data-mode="auto">自动起卦</button>
      </div>
      <div class="mode-panel show" id="panelManual">
        <div class="coin-wrap">
          <button id="coinBtn" class="btn btn-primary coin-btn">掷铜钱</button>
          <div>
            <div class="throw-hint" id="throwHint">第 1/6 次 · 点击铜钱模拟抛掷三枚硬币</div>
            <div class="throw-list" id="throwList"></div>
            <button id="resetBtn" class="btn btn-secondary reset-btn">重新起卦</button>
          </div>
        </div>
      </div>
      <div class="mode-panel" id="panelNum">
        <div class="row3">
          <div class="input-group">
            <label>上卦数（1 乾 / 2 兑 / 3 离 / 4 震 / 5 巽 / 6 坎 / 7 艮 / 8 坤）</label>
            <input id="numUpper" class="input" type="number" min="1" max="8" value="1">
          </div>
          <div class="input-group">
            <label>下卦数（1-8）</label>
            <input id="numLower" class="input" type="number" min="1" max="8" value="2">
          </div>
          <div class="input-group">
            <label>动爻（1-6，初爻为 1）</label>
            <input id="numMove" class="input" type="number" min="1" max="6" value="3">
          </div>
        </div>
        <label class="check-label"><input type="checkbox" id="useShichen"> 以当前时辰修正动爻：动爻 =（上卦数 + 下卦数 + 时辰数）÷ 6 的余数，余 0 取 6</label>
        <button id="numBtn" class="btn btn-primary">起卦</button>
      </div>
      <div class="mode-panel" id="panelTime">
        <p class="opt-hint">以当前公历年月日时推算上下卦与动爻，同时显示当前时辰。</p>
        <button id="timeBtn" class="btn btn-primary">以当前时间起卦</button>
      </div>
      <div class="mode-panel" id="panelAuto">
        <p class="opt-hint">随机生成上下卦与动爻，一键完成排盘。</p>
        <button id="autoBtn" class="btn btn-primary">自动起卦</button>
      </div>
    </div>
    <div class="card">
      <div id="resultArea"></div>
    </div>
    <div class="card">
      <div class="act-row">
        <button id="copyBtn" class="btn btn-secondary" style="display:none">复制排盘</button>
        <span class="opt-hint">本工具为传统文化排盘参考，仅供娱乐。</span>
      </div>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div>S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>

        { n: '水风井', l: '011010', g: '改邑不改井，无丧无得，往来井井。汔至亦未繘井，羸其瓶，凶。' },
        { n: '泽火革', l: '101110', g: '已日乃孚。元亨利贞，悔亡。' },
        { n: '火风鼎', l: '011101', g: '元吉，亨。' },
        { n: '震为雷', l: '100100', g: '亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。' },
        { n: '艮为山', l: '001001', g: '艮其背，不获其身；行其庭，不见其人，无咎。' },
        { n: '风山渐', l: '001011', g: '女归吉，利贞。' },
        { n: '雷泽归妹', l: '110100', g: '征凶，无攸利。' },
        { n: '雷火丰', l: '101100', g: '亨，王假之。勿忧，宜日中。' },
        { n: '火山旅', l: '001101', g: '小亨，旅贞吉。' },
        { n: '巽为风', l: '011011', g: '小亨。利有攸往，利见大人。' },
        { n: '兑为泽', l: '110110', g: '亨，利贞。' },
        { n: '风水涣', l: '010011', g: '亨。王假有庙，利涉大川，利贞。' },
        { n: '水泽节', l: '110010', g: '亨。苦节不可贞。' },
        { n: '风泽中孚', l: '110011', g: '豚鱼吉，利涉大川，利贞。' },
        { n: '雷山小过', l: '001100', g: '亨，利贞。可小事，不可大事。飞鸟遗之音，不宜上，宜下，大吉。' },
        { n: '水火既济', l: '101010', g: '亨小，利贞。初吉终乱。' },
        { n: '火水未济', l: '010101', g: '亨。小狐汔济，濡其尾，无攸利。' }
      ];
      var TRIGRAMS = ['乾', '兑', '离', '震', '巽', '坎', '艮', '坤'];
      var TRIG_LINES = ['111', '110', '101', '100', '011', '010', '001', '000'];
      var YAO_NAMES = ['初爻', '二爻', '三爻', '四爻', '五爻', '上爻'];
      var YAO_TYPES = { 3: '老阳', 0: '老阴', 2: '少阳', 1: '少阴' };
      var MARK_TXT = { 3: '○', 0: '×' };

      var modeBtn = {};
      var panelMap = { manual: 'panelManual', num: 'panelNum', time: 'panelTime', auto: 'panelAuto' };
      var currentMode = 'manual';
      var throws = [];
      var resultArea = document.getElementById('resultArea');
      var copyBtn = document.getElementById('copyBtn');
      var lastCopyText = '';

      function lookupGua(bits) {
        for (var i = 0; i < GUA.length; i++) if (GUA[i].l === bits) return GUA[i];
        return null;
      }

      function shichenNow() {
        var h = new Date().getHours();
        var table = [[23, 1, '子'], [1, 3, '丑'], [3, 5, '寅'], [5, 7, '卯'], [7, 9, '辰'], [9, 11, '巳'], [11, 13, '午'], [13, 15, '未'], [15, 17, '申'], [17, 19, '酉'], [19, 21, '戌'], [21, 23, '亥']];
        for (var i = 0; i < table.length; i++) {
          var lo = table[i][0], hi = table[i][1], name = table[i][2];
          if (h >= lo && h < hi) return { name: name, num: i + 1 };
          if (lo === 23 && h >= 23) return { name: name, num: i + 1 };
        }
        return { name: '子', num: 1 };
      }

      function trigBits(n) {
        n = ((n - 1) % 8 + 8) % 8;
        return TRIG_LINES[n];
      }

      function clampInt(v, lo, hi) {
        if (isNaN(v)) return null;
        return Math.max(lo, Math.min(hi, Math.floor(v)));
      }

      function randInt(lo, hi) {
        return lo + Math.floor(Math.random() * (hi - lo + 1));
      }

      function buildYao(line) {
        var div = document.createElement('div');
        div.className = 'yao ' + (line >= 2 ? 'yang' : 'yin');
        var segL = document.createElement('div');
        segL.className = 'seg l';
        var segR = document.createElement('div');
        segR.className = 'seg r';
        div.appendChild(segL);
        div.appendChild(segR);
        return div;
      }

      function buildYaoWrap(lines, withLabels) {
        var wrap = document.createElement('div');
        wrap.className = 'yao-wrap';
        for (var i = 5; i >= 0; i--) {
          var row = buildYao(lines[i]);
          if (withLabels) {
            var lab = document.createElement('span');
            lab.className = 'mlabel';
            lab.textContent = YAO_NAMES[i];
            row.appendChild(lab);
          }
          if (lines[i] === 3 || lines[i] === 0) {
            var mark = document.createElement('span');
            mark.className = 'mmark';
            mark.textContent = MARK_TXT[lines[i]];
            row.appendChild(mark);
          }
          wrap.appendChild(row);
        }
        return wrap;
      }

      function fmtThrow(th) {
        var coins = th.coins;
        var heads = 0;
        for (var i = 0; i < 3; i++) if (coins[i] === 1) heads++;
        var desc = heads === 3 ? '三正' : heads === 0 ? '三反' : heads === 2 ? '二正一反' : '一正二反';
        return '第 ' + th.idx + ' 次：' + YAO_TYPES[th.v] + '（' + desc + '）';
      }

      function doManualThrow() {
        if (throws.length >= 6) return;
        var coins = [0, 0, 0];
        var heads = 0;
        for (var i = 0; i < 3; i++) {
          coins[i] = Math.random() < 0.5 ? 1 : 0;
          if (coins[i] === 1) heads++;
        }
        var v = heads === 3 ? 3 : heads === 0 ? 0 : heads === 2 ? 2 : 1;
        var idx = throws.length + 1;
        throws.push({ idx: idx, coins: coins, v: v });
        var list = document.getElementById('throwList');
        var item = document.createElement('div');
        item.textContent = fmtThrow({ idx: idx, coins: coins, v: v });
        list.appendChild(item);
        if (throws.length < 6) {
          document.getElementById('throwHint').textContent = '第 ' + (idx + 1) + '/6 次 · 点击铜钱模拟抛掷三枚硬币';
        } else {
          document.getElementById('throwHint').textContent = '六次摇毕，正在排盘';
          var lines = [];
          for (var j = 0; j < 6; j++) lines.push(throws[j].v);
          renderPan(lines, '手工摇卦');
        }
      }

      function resetManual() {
        throws = [];
        document.getElementById('throwList').innerHTML = '';
        document.getElementById('throwHint').textContent = '第 1/6 次 · 点击铜钱模拟抛掷三枚硬币';
        resultArea.innerHTML = '';
        copyBtn.style.display = 'none';
      }

      function numPan() {
        var upper = clampInt(parseInt(document.getElementById('numUpper').value, 10), 1, 8);
        var lower = clampInt(parseInt(document.getElementById('numLower').value, 10), 1, 8);
        if (upper === null || lower === null) {
          setStatus('上卦数与下卦数需为 1-8 的整数', 'error');
          return;
        }
        var sh = shichenNow();
        var useSh = document.getElementById('useShichen').checked;
        var move = clampInt(parseInt(document.getElementById('numMove').value, 10), 1, 6);
        if (!useSh && move === null) {
          setStatus('动爻需为 1-6 的整数', 'error');
          return;
        }
        if (useSh) {
          move = (upper + lower + sh.num) % 6;
          if (move === 0) move = 6;
        }
        var bits = trigBits(lower) + trigBits(upper);
        var lines = [];
        for (var i = 0; i < 6; i++) {
          lines.push(bits.charAt(i) === '1' ? 2 : 1);
        }
        lines[move - 1] = lines[move - 1] === 2 ? 3 : 0;
        renderPan(lines, '报数起卦' + (useSh ? '（时辰修正，' + sh.name + '时=' + sh.num + '）' : ''));
      }

      function timePan() {
        var d = new Date();
        var y = d.getFullYear(), mo = d.getMonth() + 1, day = d.getDate(), h = d.getHours();
        var sh = shichenNow();
        var upper = (y + mo + day) % 8;
        var lower = (y + mo + day + h) % 8;
        var move = (y + mo + day + h) % 6;
        if (upper === 0) upper = 8;
        if (lower === 0) lower = 8;
        if (move === 0) move = 6;
        var bits = trigBits(lower) + trigBits(upper);
        var lines = [];
        for (var i = 0; i < 6; i++) {
          lines.push(bits.charAt(i) === '1' ? 2 : 1);
        }
        lines[move - 1] = lines[move - 1] === 2 ? 3 : 0;
        renderPan(lines, '时间起卦（' + sh.name + '时=' + sh.num + '）');
      }

      function autoPan() {
        var lines = [];
        for (var i = 0; i < 6; i++) {
          var r = randInt(0, 3);
          lines.push(r === 3 ? 3 : r === 0 ? 0 : r === 1 ? 2 : 1);
        }
        renderPan(lines, '自动起卦');
      }

      function renderPan(lines, method) {
        var bits = '';
        for (var i = 0; i < 6; i++) bits += (lines[i] === 3 || lines[i] === 2) ? '1' : '0';
        var moving = [];
        for (var j = 0; j < 6; j++) {
          if (lines[j] === 3 || lines[j] === 0) moving.push(j);
        }
        var ben = lookupGua(bits);
        var bian = null;
        var bianBits = '';
        if (moving.length > 0) {
          for (var k = 0; k < 6; k++) {
            var ch = bits.charAt(k);
            if (lines[k] === 3) ch = '0';
            else if (lines[k] === 0) ch = '1';
            bianBits += ch;
          }
          bian = lookupGua(bianBits);
        }
        var d = new Date();
        var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
        var timeStr = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        resultArea.innerHTML = '';
        var meta = document.createElement('div');
        meta.className = 'pan-meta';
        meta.textContent = '起卦方式：' + method + '　起卦时间：' + timeStr;
        resultArea.appendChild(meta);
        var grid = document.createElement('div');
        grid.className = 'pan-grid';
        var colBen = document.createElement('div');
        colBen.className = 'pan-col';
        var tBen = document.createElement('div');
        tBen.className = 'pan-title';
        tBen.textContent = '本卦 · ' + (ben ? ben.n : '未知卦');
        var subBen = document.createElement('div');
        subBen.className = 'pan-sub';
        var upN = TRIG_LINES.indexOf(bits.charAt(3) + bits.charAt(4) + bits.charAt(5));
        var loN = TRIG_LINES.indexOf(bits.charAt(0) + bits.charAt(1) + bits.charAt(2));
        subBen.textContent = '上' + TRIGRAMS[upN] + '下' + TRIGRAMS[loN] + ' · 六爻';
        colBen.appendChild(tBen);
        colBen.appendChild(subBen);
        colBen.appendChild(buildYaoWrap(lines, true));
        if (ben) {
          var gBen = document.createElement('div');
          gBen.className = 'guaci';
          gBen.innerHTML = '<span class="glabel">卦辞：</span>' + htmlEscape(ben.g);
          colBen.appendChild(gBen);
        }
        var mv = document.createElement('div');
        mv.className = 'move-line';
        if (moving.length > 0) {
          var parts = [];
          for (var m = 0; m < moving.length; m++) {
            parts.push(YAO_NAMES[moving[m]] + '（' + YAO_TYPES[lines[moving[m]]] + '）');
          }
          mv.textContent = '动爻：' + parts.join('、');
        } else {
          mv.textContent = '六爻安静，无动爻，不变卦';
        }
        colBen.appendChild(mv);
        grid.appendChild(colBen);
        if (bian) {
          var colBian = document.createElement('div');
          colBian.className = 'pan-col';
          var tBian = document.createElement('div');
          tBian.className = 'pan-title';
          tBian.textContent = '变卦 · ' + bian.n;
          var subBian = document.createElement('div');
          subBian.className = 'pan-sub';
          subBian.textContent = '由本卦动爻变化而来';
          var bianLines = [];
          for (var b = 0; b < 6; b++) bianLines.push(bianBits.charAt(b) === '1' ? 2 : 1);
          colBian.appendChild(tBian);
          colBian.appendChild(subBian);
          colBian.appendChild(buildYaoWrap(bianLines, true));
          var gBian = document.createElement('div');
          gBian.className = 'guaci';
          gBian.innerHTML = '<span class="glabel">卦辞：</span>' + htmlEscape(bian.g);
          colBian.appendChild(gBian);
          grid.appendChild(colBian);
        }
        resultArea.appendChild(grid);
        var disc = document.createElement('div');
        disc.className = 'disclaim';
        disc.textContent = '本工具为传统文化排盘参考，仅供娱乐。';
        resultArea.appendChild(disc);
        copyBtn.style.display = '';
        lastCopyText = '【六爻排盘】\n起卦方式：' + method + '\n起卦时间：' + timeStr + '\n本卦：' + (ben ? ben.n : '') + '\n卦辞：' + (ben ? ben.g : '') + '\n' + mv.textContent + (bian ? '\n变卦：' + bian.n + '\n卦辞：' + bian.g : '') + '\n本工具为传统文化排盘参考，仅供娱乐。';
      }

      function setMode(mode) {
        currentMode = mode;
        var btns = document.querySelectorAll('.mode-btn');
        for (var i = 0; i < btns.length; i++) {
          btns[i].className = 'btn btn-secondary mode-btn' + (btns[i].getAttribute('data-mode') === mode ? ' on' : '');
        }
        for (var key in panelMap) {
          document.getElementById(panelMap[key]).className = 'mode-panel' + (key === mode ? ' show' : '');
        }
      }

      function bindEvents() {
        var btns = document.querySelectorAll('.mode-btn');
        for (var i = 0; i < btns.length; i++) {
          btns[i].addEventListener('click', function () {
            setMode(this.getAttribute('data-mode'));
          });
        }
        document.getElementById('coinBtn').addEventListener('click', doManualThrow);
        document.getElementById('resetBtn').addEventListener('click', resetManual);
        document.getElementById('numBtn').addEventListener('click', numPan);
        document.getElementById('timeBtn').addEventListener('click', timePan);
        document.getElementById('autoBtn').addEventListener('click', autoPan);
        document.getElementById('useShichen').addEventListener('change', function () {
          document.getElementById('numMove').disabled = this.checked;
        });
        copyBtn.addEventListener('click', function () {
          if (lastCopyText) {
            copyToClipboard(lastCopyText, copyBtn);
            setStatus('已复制排盘结果');
          }
        });
      }

      bindEvents();
      resetManual();
    })();
  </script>
</body>
</html>
