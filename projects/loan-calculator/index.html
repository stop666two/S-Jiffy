<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贷款/房贷计算器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .ln-row { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: flex-end; margin-bottom: var(--space-2); }
    .ln-row label { font-size: var(--font-size-sm); color: var(--color-text-secondary); display: block; margin-bottom: 4px; }
    .res-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-1); margin-top: var(--space-2); }
    .res-item { padding: var(--space-2); background: var(--color-bg-soft); border-radius: var(--radius-md); text-align: center; }
    .res-item .v { font-size: var(--font-size-lg); font-weight: 600; }
    .res-item .l { font-size: var(--font-size-xs); color: var(--color-text-secondary); margin-top: 4px; }
    .ratio-bar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; margin-top: var(--space-2); background: var(--color-bg-soft); }
    .ratio-principal { background: var(--color-text-primary); }
    .ratio-interest { background: var(--color-error); }
    .ratio-legend { display: flex; gap: var(--space-2); font-size: var(--font-size-xs); color: var(--color-text-secondary); margin-top: var(--space-1); }
    .ratio-legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
    .amort-table-wrap { overflow-x: auto; margin-top: var(--space-2); }
    table.amort { width: 100%; border-collapse: collapse; font-size: var(--font-size-sm); font-family: var(--font-mono); }
    table.amort th { text-align: right; color: var(--color-text-secondary); font-size: var(--font-size-xs); padding: 8px 6px; border-bottom: 1px solid var(--color-border); }
    table.amort th:first-child { text-align: left; }
    table.amort td { text-align: right; padding: 6px; border-bottom: 1px solid var(--color-border); }
    table.amort td:first-child { text-align: left; color: var(--color-text-secondary); }
    .show-all-btn { background: none; border: none; color: var(--color-text-primary); text-decoration: underline; cursor: pointer; font-size: var(--font-size-sm); margin-top: var(--space-1); }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">贷款/房贷计算器</h1>
    <p class="tool-desc" data-i18n="desc">等额本息贷款月供、总利息计算，并生成完整还款计划表。</p>
    <div class="card">
      <div class="ln-row">
        <div>
          <label data-i18n="loanAmountLabel">贷款金额 (元)</label>
          <input id="amount" class="input" type="number" value="1000000" min="1" step="1000">
        </div>
        <div>
          <label data-i18n="annualRateLabel">年利率 (%)</label>
          <input id="rate" class="input" type="number" value="4.2" min="0" step="0.01">
        </div>
        <div>
          <label data-i18n="termYearsLabel">期限（年）</label>
          <input id="years" class="input" type="number" value="30" min="1" max="50">
        </div>
        <div style="display:flex;align-items:flex-end;gap:var(--space-1)">
          <button id="calcBtn" class="btn btn-primary">计算</button>
          <button id="clearBtn" class="btn btn-secondary" style="min-width:auto;padding:0 var(--space-2)">清空</button>
        </div>
      </div>
    </div>
    <div class="card" id="resultCard" style="display:none;">
      <div class="res-grid">
        <div class="res-item"><div class="v" id="monthlyVal">—</div><div class="l" data-i18n="monthlyPayment">月供</div></div>
        <div class="res-item"><div class="v" id="interestVal">—</div><div class="l" data-i18n="totalInterest">总利息</div></div>
        <div class="res-item"><div class="v" id="totalVal">—</div><div class="l" data-i18n="totalPayment">总还款额</div></div>
        <div class="res-item"><div class="v" id="ratioVal">—</div><div class="l" data-i18n="ui.100">利息占比</div></div>
      </div>
      <div class="ratio-bar">
        <div class="ratio-principal" id="barPrincipal" style="width:50%"></div>
        <div class="ratio-interest" id="barInterest"></div>
      </div>
      <div class="ratio-legend">
        <span><span class="dot ratio-principal"></span><span data-i18n="principalLabel">本金</span></span>
        <span><span class="dot ratio-interest"></span><span data-i18n="interestLabel">利息</span></span>
      </div>
      <p id="amortTitle" style="font-size:var(--font-size-sm);color:var(--color-text-secondary);margin-top:var(--space-2);"></p>
      <div class="amort-table-wrap">
        <table class="amort">
          <thead>
            <tr>
              <th data-i18n="monthHeader">月份</th>
              <th data-i18n="paymentHeader">还款额</th>
              <th data-i18n="principalLabel">本金</th>
              <th data-i18n="interestLabel">利息</th>
              <th data-i18n="balanceHeader">余额</th>
            </tr>
          </thead>
          <tbody id="amortBody"></tbody>
        </table>
      </div>
      <button id="showAllBtn" class="show-all-btn" style="display:none;"></button>
    </div>
    <div class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="common.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>
    (function () {
      var am = document.getElementById('amount');
      var ra = document.getElementById('rate');
      var yr = document.getElementById('years');
      var mv = document.getElementById('monthlyVal');
      var iv = document.getElementById('interestVal');
      var tv = document.getElementById('totalVal');
      var rv = document.getElementById('ratioVal');
      var o = document.getElementById('outputText');
      var resultCard = document.getElementById('resultCard');
      var amortBody = document.getElementById('amortBody');
      var amortTitle = document.getElementById('amortTitle');
      var showAllBtn = document.getElementById('showAllBtn');
      var barP = document.getElementById('barPrincipal');
      var barI = document.getElementById('barInterest');
      var showFull = false;
      var lastSchedule = [];

      document.getElementById('clearBtn').textContent = t('clear', '清空');
      document.getElementById('calcBtn').textContent = t('calculate', '计算');

      function fmtMoney(n) {
        return Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      function calc() {
        var p = parseFloat(am.value);
        var rate = parseFloat(ra.value);
        var years = parseInt(yr.value, 10);
        if (!p || isNaN(p) || p < 1) { setStatus(t('invalidAmount', '请输入有效的贷款金额'), 'error'); return; }
        if (isNaN(rate) || rate < 0) { setStatus(t('invalidRate', '请输入有效的年利率'), 'error'); return; }
        if (isNaN(years) || years < 1) { setStatus(t('invalidYears', '请输入有效的贷款期限'), 'error'); return; }

        var monthlyRate = rate / 100 / 12;
        var n = years * 12;
        var monthly;
        if (monthlyRate === 0) {
          monthly = p / n;
        } else {
          monthly = (p * monthlyRate * Math.pow(1 + monthlyRate, n)) / (Math.pow(1 + monthlyRate, n) - 1);
        }
        monthly = Math.round(monthly * 100) / 100;

        var schedule = [];
        var balance = p;
        var i;
        for (i = 1; i <= n; i++) {
          var interestPmt = Math.round(balance * monthlyRate * 100) / 100;
          var principalPmt = Math.round((monthly - interestPmt) * 100) / 100;
          balance = Math.round((balance - principalPmt) * 100) / 100;
          if (balance < 0) balance = 0;
          schedule.push({ month: i, payment: monthly, principal: principalPmt, interest: interestPmt, balance: balance });
        }
        var total = Math.round(monthly * n * 100) / 100;
        var interest = Math.round((total - p) * 100) / 100;

        mv.textContent = fmtMoney(monthly) + ' 元';
        iv.textContent = fmtMoney(interest) + ' 元';
        tv.textContent = fmtMoney(total) + ' 元';
        rv.textContent = (interest / total * 100).toFixed(1) + '%';
        barP.style.width = (p / total * 100).toFixed(2) + '%';
        barI.style.width = 'auto';
        barI.style.flex = '1';

        lastSchedule = schedule;
        showFull = false;
        renderAmort();
        amortTitle.textContent = t('amortizationFirst12', '还款计划表（前12个月）');

        o.textContent =
          t('monthlyPayment', '月供') + ': ' + fmtMoney(monthly) + ' 元 | ' +
          t('totalInterest', '总利息') + ': ' + fmtMoney(interest) + ' 元 | ' +
          t('totalPayment', '总还款额') + ': ' + fmtMoney(total) + ' 元 | ' +
          t('interestRatio', '利息占比') + ': ' + (interest / total * 100).toFixed(1) + '%';
        resultCard.style.display = '';
        setStatus(t('done', '计算完成'));
      }

      function renderAmort() {
        amortBody.innerHTML = '';
        var rows = showFull ? lastSchedule : lastSchedule.slice(0, 12);
        var i, tr, td;
        for (i = 0; i < rows.length; i++) {
          tr = document.createElement('tr');
          td = document.createElement('td'); td.textContent = rows[i].month; tr.appendChild(td);
          td = document.createElement('td'); td.textContent = fmtMoney(rows[i].payment); tr.appendChild(td);
          td = document.createElement('td'); td.textContent = fmtMoney(rows[i].principal); tr.appendChild(td);
          td = document.createElement('td'); td.textContent = fmtMoney(rows[i].interest); tr.appendChild(td);
          td = document.createElement('td'); td.textContent = fmtMoney(rows[i].balance); tr.appendChild(td);
          amortBody.appendChild(tr);
        }
        if (lastSchedule.length > 12) {
          showAllBtn.style.display = '';
          showAllBtn.textContent = showFull ? t('showLessBtn', '收起') : t('showAllMonths', '显示全部 {n} 个月').replace('{n}', lastSchedule.length);
          amortTitle.textContent = showFull ? t('amortizationSchedule', '还款计划表') : t('amortizationFirst12', '还款计划表（前12个月）');
        } else {
          showAllBtn.style.display = 'none';
          amortTitle.textContent = t('amortizationSchedule', '还款计划表');
        }
      }

      showAllBtn.addEventListener('click', function () {
        showFull = !showFull;
        renderAmort();
      });

      document.getElementById('calcBtn').addEventListener('click', calc);
      document.getElementById('clearBtn').addEventListener('click', function () {
        mv.textContent = '—'; iv.textContent = '—'; tv.textContent = '—'; rv.textContent = '—';
        resultCard.style.display = 'none';
        o.textContent = '';
        setStatus('');
      });
      document.getElementById('copyBtn').addEventListener('click', function () {
        if (o.textContent) {
          copyToClipboard(o.textContent, this);
          setStatus(t('common.copied', '已复制'));
        }
      });
    })();
  </script>
</body>
</html>
