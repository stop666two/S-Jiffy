<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对数计算器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .lc-row { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-bottom:var(--space-3); }
    .lc-row .field { flex:1; min-width:100px; }
    .lc-row label { display:block; font-size:var(--font-size-sm); color:var(--color-text-secondary); margin-bottom:4px; }
    .log-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:var(--space-2); }
    .log-item { background:var(--color-bg); border:1px solid var(--color-border); border-radius:var(--radius-md); padding:var(--space-2); }
    .log-item .label { font-size:var(--font-size-xs); color:var(--color-text-secondary); }
    .log-item .value { font-size:var(--font-size-lg); font-weight:600; }
  </style>
</head>
<body>
  <header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">对数计算器</h1>
    <p class="tool-desc" data-i18n="desc">同时计算常用对数 (log₁₀)、自然对数 (ln)、以 2 为底的对数和自定义底数。</p>
    <div class="card">
      <div class="lc-row">
        <div class="field"><label for="inputVal" data-i18n="ui.number">数值</label><input id="inputVal" class="input" type="number" value="100" step="any" min="0.0001"></div>
        <div class="field"><label for="baseVal" data-i18n="ui.1">自定义底数（可选）</label><input id="baseVal" class="input" type="number" data-i18n-placeholder="ui.101" placeholder="留空不显示" step="any" min="0.1"></div>
      </div>
      <div><button id="genBtn" class="btn btn-primary" data-i18n="ui.calc">计算</button></div>
      <div class="log-grid" id="logGrid">
        <div class="log-item"><div class="label" data-i18n="ui.2">log₁₀ (常用对数)</div><div class="value" id="log10Val">-</div></div>
        <div class="log-item"><div class="label" data-i18n="ui.3">ln (自然对数)</div><div class="value" id="lnVal">-</div></div>
        <div class="log-item"><div class="label" data-i18n="ui.4">log₂ (二进制对数)</div><div class="value" id="log2Val">-</div></div>
        <div class="log-item"><div class="label" id="customLabel" data-i18n="ui.5">自定义底数</div><div class="value" id="customVal">-</div></div>
      </div>
    </div>
    <div class="output-box"><span id="outputText" style="display:block;padding-right:60px;"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
  </main>
  <footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script></script>
  <script>(function(){
    var inputEl = document.getElementById('inputVal');
    var baseEl = document.getElementById('baseVal');
    var genBtn = document.getElementById('genBtn');
    var outputEl = document.getElementById('outputText');
    var copyBtn = document.getElementById('copyBtn');

    function generate() {
      var val = parseFloat(inputEl.value);
      if (isNaN(val) || val <= 0) { setStatus(t('ui.100','请输入大于 0 的有效数字'), 'error'); return; }

      var log10 = Math.log10(val);
      var ln = Math.log(val);
      var log2 = Math.log2(val);

      document.getElementById('log10Val').textContent = log10.toFixed(6);
      document.getElementById('lnVal').textContent = ln.toFixed(6);
      document.getElementById('log2Val').textContent = log2.toFixed(6);

      var customBase = baseEl.value.trim();
      if (customBase) {
        var base = parseFloat(customBase);
        if (isNaN(base) || base <= 0 || base === 1) {
          document.getElementById('customVal').textContent = t('ui.6','无效底数');
        } else {
          var customLog = Math.log(val) / Math.log(base);
          document.getElementById('customLabel').textContent = 'log' + base.sub;
          document.getElementById('customLabel').innerHTML = 'log<sub>' + base + '</sub>';
          document.getElementById('customVal').textContent = customLog.toFixed(6);
        }
      } else {
        document.getElementById('customLabel').innerHTML = t('ui.5','自定义底数');
        document.getElementById('customVal').textContent = '-';
      }

      var output = 'log₁₀(' + val + ') = ' + log10.toFixed(6) + '\n';
      output += 'ln(' + val + ') = ' + ln.toFixed(6) + '\n';
      output += 'log₂(' + val + ') = ' + log2.toFixed(6);
      if (customBase) {
        var base = parseFloat(customBase);
        if (!isNaN(base) && base > 0 && base !== 1) {
          var customLog = Math.log(val) / Math.log(base);
          output += '\nlog_' + base + '(' + val + ') = ' + customLog.toFixed(6);
        }
      }
      outputEl.textContent = output;
      setStatus(t('ui.calcDone','计算完成'));
    }

    genBtn.addEventListener('click', generate);
    copyBtn.addEventListener('click', function() { if (outputEl.textContent) { copyToClipboard(outputEl.textContent, copyBtn); setStatus(t('ui.copied','已复制')); } });
  })();</script>
</body>
</html>
