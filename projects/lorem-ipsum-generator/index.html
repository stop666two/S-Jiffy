<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Lorem Ipsum 生成器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css">
<style>
.lorem-controls{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:var(--space-3);}
.lorem-controls label{display:block;font-size:var(--font-size-sm);color:var(--color-text-secondary);margin-bottom:4px;}
.lorem-controls .field{min-width:100px;}
.lorem-controls input{width:100px;}
.gen-stats{display:flex;gap:var(--space-2);margin-bottom:var(--space-2);flex-wrap:wrap;}
.gen-stats .stat{font-size:var(--font-size-sm);color:var(--color-text-secondary);background:var(--color-bg-soft);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:4px 12px;}
.gen-stats .stat strong{color:var(--color-text-primary);}
</style></head>
<body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
<main class="tool-workspace">
<h1 data-i18n="h1">Lorem Ipsum 生成器</h1>
<p class="tool-desc" data-i18n="desc">生成占位文本，支持字节、Markdown 模式与多语言词库。</p>
<div class="card">
<div class="lorem-controls">
<div class="field"><label for="loremUnit" data-i18n="ui.1">单位</label>
<select id="loremUnit" class="input" style="width:auto;">
<option value="paragraphs" data-i18n="ui.2">段落</option><option value="sentences" data-i18n="ui.3">句子</option><option value="words" data-i18n="ui.4">单词</option><option value="chars" data-i18n="ui.chars">字符</option><option value="bytes" data-i18n="ui.bytes">字节</option>
</select></div>
<div class="field"><label for="loremCount" data-i18n="ui.5">计数</label><input id="loremCount" class="input" type="number" min="1" max="500" value="3"></div>
<div class="field"><label for="loremFormat" data-i18n="ui.format">格式化</label>
<select id="loremFormat" class="input" style="width:auto;">
<option value="text" data-i18n="ui.6">纯文本</option><option value="html">HTML</option><option value="markdown">Markdown</option>
</select></div>
<div class="field"><label for="loremLocale" data-i18n="ui.7">语言</label>
<select id="loremLocale" class="input" style="width:auto;">
<option value="latin" data-i18n="ui.8">拉丁语</option><option value="english" data-i18n="ui.9">英语</option><option value="chinese" data-i18n="ui.10">中文</option>
</select></div>
<div><button id="generateBtn" class="btn btn-primary" data-i18n="ui.generate">生成</button></div>
</div>
<div class="gen-stats" id="genStats">
<span class="stat">单词：<strong id="statWords">0</strong></span>
<span class="stat">字符：<strong id="statChars">0</strong></span>
<span class="stat">段落：<strong id="statParas">0</strong></span>
<span class="stat">句子：<strong id="statSents">0</strong></span>
</div>
</div>
<div class="output-box"><span id="outputText" style="display:block;padding-right:60px;"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div></main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
<script>
(function(){
  var loremUnit=document.getElementById('loremUnit'),loremCount=document.getElementById('loremCount'),loremFormat=document.getElementById('loremFormat'),loremLocale=document.getElementById('loremLocale');
  var generateBtn=document.getElementById('generateBtn'),outputEl=document.getElementById('outputText');
  var statWords=document.getElementById('statWords'),statChars=document.getElementById('statChars'),statParas=document.getElementById('statParas'),statSents=document.getElementById('statSents');

  var wordLists={
    latin:['lorem','ipsum','dolor','sit','amet','consectetur','adipiscing','elit','sed','do','eiusmod','tempor','incididunt','ut','labore','et','dolore','magna','aliqua','enim','ad','minim','veniam','quis','nostrud','exercitation','ullamco','laboris','nisi','aliquip','ex','ea','commodo','consequat','duis','aute','irure','reprehenderit','voluptate','velit','esse','cillum','fugiat','nulla','pariatur','excepteur','sint','occaecat','cupidatat','non','proident','sunt','culpa','officia','deserunt','mollit','anim','id','est','laborum'],
    english:['the','quick','brown','fox','jumps','over','lazy','dog','hello','world','example','sample','text','generate','random','content','placeholder','data','value','test','demo','user','input', t('ui.23','输出'),'format','parser','builder','maker','tool','utility','function','method','variable','constant','string','number','array','object','boolean','null','undefined'],
    chinese:[ t('ui.33','你好'), t('ui.32','世界'), t('ui.31','示例'), t('ui.30','文本'), t('ui.generate','生成'), t('ui.29','随机'), t('ui.28','内容'), t('ui.27','占位'), t('ui.26','数据'), t('ui.test','测试'), t('ui.25','用户'), t('ui.24','输入'), t('ui.23','输出'), t('ui.22','格式'), t('ui.parse','解析'), t('ui.21','构建'), t('ui.20','工具'), t('ui.19','功能'), t('ui.18','方法'), t('ui.17','变量'), t('ui.16','常量'), t('ui.string','字符串'), t('ui.15','数字'), t('ui.14','数组'), t('ui.13','对象'), t('ui.12','布尔'), t('ui.11','空值')]
  };
  function getWords(){return wordLists[loremLocale.value]||wordLists.latin;}
  function randomWord(){var w=getWords();return w[Math.floor(Math.random()*w.length)];}
  function capitalize(s){return s.charAt(0).toUpperCase()+s.slice(1);}
  function makeSentence(){var len=5+Math.floor(Math.random()*10),sent=[];for(var i=0;i<len;i++)sent.push(randomWord());return capitalize(sent.join(' '))+'.';}

  function generate(){
    var unit=loremUnit.value,count=parseInt(loremCount.value,10)||1;if(count<1)count=1;
    var max=unit==='chars'||unit==='bytes'?10000:500;if(count>max)count=max;
    var format=loremFormat.value,result=[];
    if(unit==='words'){for(var i=0;i<count;i++)result.push(randomWord());outputEl.textContent=result.join(' ');}
    else if(unit==='chars'){var str='';while(str.replace(/\s/g,'').length<count)str+=makeSentence()+' ';outputEl.textContent=str.trim();}
    else if(unit==='bytes'){var str2='',target=count;while(new TextEncoder().encode(str2).length<target)str2+=makeSentence()+' ';outputEl.textContent=str2.trim();}
    else if(unit==='sentences'){for(var i=0;i<count;i++)result.push(makeSentence());outputEl.textContent=result.join(' ');}
    else{for(var p=0;p<count;p++){var para=[],sentCount=3+Math.floor(Math.random()*5);for(var i=0;i<sentCount;i++)para.push(makeSentence());result.push(para.join(' '));}
    outputEl.textContent=result.join('\n\n');}

    var raw=outputEl.textContent;
    if(format==='html'){var hp=raw.split('\n\n'),ho=[];for(var i=0;i<hp.length;i++){if(hp[i].trim())ho.push('<p>'+hp[i].trim()+'</p>');}
    outputEl.textContent=ho.join('\n');}else if(format==='markdown'){var mp=raw.split('\n\n'),mo=[];for(var i=0;i<mp.length;i++){if(mp[i].trim())mo.push(mp[i].trim()+'\n');}
    outputEl.textContent=mo.join('\n\n');}

    var ft=outputEl.textContent;statWords.textContent=ft.trim()?ft.trim().split(/\s+/).length:0;
    statChars.textContent=ft.length;statParas.textContent=ft.split(/\n\s*\n/).filter(function(p){return p.trim().length>0;}).length||(ft.trim()?1:0);
    statSents.textContent=ft.split(/[.!?。！？]+/).filter(function(s){return s.trim().length>0;}).length;
    setStatus(t('ui.generated','已生成 ') +count+' '+unit);}

  generateBtn.addEventListener('click',generate);
  document.getElementById('copyBtn').addEventListener('click',function(){var t=outputEl.textContent;if(t){copyToClipboard(t,this);setStatus(t('ui.copied','已复制'));}});
  generate();
})();
</script></body></html>
