    .qian-card { position: relative; width: 96px; height: 196px; margin: 0 auto var(--space-3); background: repeating-linear-gradient(90deg, transparent 0 30px, rgba(0,0,0,0.045) 30px 32px), linear-gradient(180deg, #FBF7EE 0%, #F5EDDC 55%, #F1E6CF 100%); border: 1px solid #D9CBAA; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,0.12); overflow: hidden; user-select: none; }
    .qian-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 26px; background: #B3202C; border-radius: 9px 9px 0 0; }
    .qian-card::after { content: "签"; position: absolute; top: 34px; left: 0; right: 0; font-size: 34px; color: #8A4A1F; text-align: center; font-weight: 600; }
    .qian-card.drawing { animation: qianShake 2.5s ease-in-out both; }

    @keyframes qianShake {

    .result-actions { display: flex; gap: var(--space-2); margin-top: var(--space-3); flex-wrap: wrap; }

    .all-head:hover { background: var(--color-bg-soft); }

    <p class="tool-desc" data-i18n="desc">吕祖灵签共一百支，相传为吕洞宾仙师所传，凡所问之事，皆可于签文中寻得端倪。</p>
    <div class="card draw-card">
      <p class="draw-tip">默念「吕祖仙师，指点迷津」，陈述所问之事，心诚意正，再开始抽签。</p>
      <div class="qian-card" id="qianCard"></div>

  <script>
(function () {
  var CFG = {"name":"吕祖灵签","poemLabel":"签文","jieLabel":"解签","jieField":"jieyue","extraFields":[]};
  var QIAN = [{"n":1,"no":"第 1 号签","text":"蓬莱东阁玉桃香，顺水行舟仙赐方。宜男正好图全计，不必他方卜地长。","jieyue":"在运势尚未通达的时候，当然是有志难伸，一旦鳌头独佔。跟红顶白、锦上添花的人会接踵而来，如果一下子利欲薰心，很容易把大好前程新自断送。这段时候最 好是自我签讨，保持稳健踏实的态度，才能够使到福禄绵绵不绝"},{"n":2,"no":"第 2 号签","text":"潜藏自有光明日，守耐无如待丙丁。龙虎相争生定数，春风一转渐飞惊。","jieyue":"人有三衰六旺，衰的时间短，旺的时间长；旺的时间有贵人相逢，有所扶助，连门庭枯木都有凤凰来朝。要保持有这种吉祥之运，最重要的是要本着忠信孝悌，尤其是不要胡乱听从旁人的口舌是非，打乱自己一往秉持的信念。"},{"n":3,"no":"第 3 号签","text":"明月当三五，天地自无私。一阳来已複，得意在秋时。","jieyue":"牡丹花被喻为富贵之花，是衆花之魁首。在其极盛之时，时间很短促。但只要在做任何事情之时，留着后步（不要去得太尽），这些就不会有什么凶险了。占者防小人得志而对己不利。"},{"n":4,"no":"第 4 号签","text":"正大有鬼神之助，吉祥成忠厚之报。不怕邪魔小崇，只看秋收冬藏。","jieyue":"人世间最难忖测的是人心，所谓「心猿意马」，一刹那间人的思维可以有很大的变化和波动，因此为善为恶也在一念之间。若能使自己时刻秉持忠厚、正大之心，则一生不会经历大凶险，亦不会有太大的蹇滞出现。"},{"n":5,"no":"第 5 号签","text":"柔顺而静，坤之六爻皆吉。阴盛于阳，不怕亢龙之悔。若此消息，只待羊兔相宜。","jieyue":"田园作业，四时有序。播种、插秧、收割、打禾都有一定时节。农人只要按时勤耕当然有收穫，若贪图逸乐或一暴十寒，当然没有收成，到时悔恨亦已迟了。占者宜勤不宜惰，凡事小心则吉。"},{"n":6,"no":"第 6 号签","text":"如争如战，长子克家，从吉而贞。当知天从人愿，不必二二三三。","jieyue":"祖宗积德行善，福泽被及子孙，如果子孙又能恪守祖训，以仁德行事，其人将不虞受凶险所侵。更进一步来说，如果能遇到适当时机，则名声可直上九重天，为人所仰望，这些天从人愿的事，就是从积福德所致。"},{"n":7,"no":"第 7 号签","text":"临物易与，天地人合。一到春风，百祥骈集。","jieyue":"「善有善报，恶有恶报」是人人都认识的语名，但如何能真正地体会到呢？就未必人人知道。简单来说，善就是心中常存有仁恕、行为有德行，恶就是贪婪、嗔怒所引发。因此要有善的报应，就必须要种善的因，这种的话，即使遇上任何凶险都可以化解。"},{"n":8,"no":"第 8 号签","text":"喜喜喜，春凤桃李。鹊噪簷前，锦衣归里。酉戍相看，天祐好子。","jieyue":"名与利，原来本是一体，故此有名则有利，相对来说，有利必有名。运势未到之前，一切的运作是不必强求，亦是强求不到的。但运气一到，就不需好劳心劳力，自然会安安稳稳地不劳而获，而且可以为时甚久。"},{"n":9,"no":"第 9 号签","text":"鲲化为鹏一任飞，长安路上好光辉。阴谋阴卜皆如许，顺水行舟定好归。","jieyue":"东奔西走所求的是甚么？积聚多多，很多时亦只不过是为儿孙作马牛而已！儿孙自然有其福份，只要自己及教导他们积善贻谋便可以，不必有实质的金钱及物业留下来以遗害他们。占者已由当年的忧虑而进展至开始有成就，成功的目标已很接近了。"},{"n":10,"no":"第 10 号签","text":"问仙须要酬天地，百事如心定有利。果能春秋两处好，龙虎呈祥，风云际会。","jieyue":"一个人不如意时，如月亮被云遮挡着而不能得见，一旦云散月落，皎皎的月色当然光照大地，令人感到开怀。对于很多繁琐的事情，会更付出心为去处理，若一旦取得重点，而放手一搏，问题就会迎刃而解了。名利之收穫当在丑年月前，午年月后。"},{"n":11,"no":"第 11 号签","text":"一个兔儿一个鸡，等全无不合人思。有朝遇着东风力，且看天公造化机。","jieyue":"凡是与人合伙营谋，最重要坦诚相对，然后才能取长补短，发挥出最强的力量。若果双方各怀异心，必定会有欺诈的事情发生，那时不独不能有增加自己力量的情况出现，还会互相猜测排斥。占此卦者做事可得成功，其最能获吉的月份是在秋季之后。"},{"n":12,"no":"第 12 号签","text":"十日坐，一日行。矶头有水，不碍利前程。问到如何境，刘阮天台不误人。","jieyue":"有远大的前程，本却离乡别井，独自前往，然后奋斗一番事业。可幸在途中遇到朋友，大家志同道合，一路上同心共济，由于双方的互相激励，终于各自创出大的事业。故占者若能放弃目前名利，远赴外地图谋，则大吉大利，事事皆顺，可扬名于异域。"},{"n":13,"no":"第 13 号签","text":"有剑开神路，何妖敢犯神。君子道长，小人道消。月明终有望，河上任逍遥。","jieyue":"凡是有用的东西，包括人，潜藏着是没有用处的，因为人们跟本就不知道其优点，要表现出其威力或才能才，可以让世人看出及加以利用，当时势可以造就及发挥出物品或人物的实际功能时，就如鲤跃龙门后一样，身价当然上升百倍。"},{"n":14,"no":"第 14 号签","text":"一虎出山，一龙飞天。天缘人缘，上国收贤。生育之美，造化两全。","jieyue":"鹏鸟与鄂鸟都是一飞万里的神鸟，当其展翅腾飞之时，虽然远到月宫都是可以的。最重要的问题是能够乘时而时，这样就会很容易和很迅速了。这是「时势造就出的英雄」，所以在碰到这种时机时，他日的成就，亦是无可限量的。"},{"n":15,"no":"第 15 号签","text":"月到天心人有望，牛郎巧合属天成。不须辗转求良偶，天喜从人命自荣。","jieyue":"寒来暑往，冬收冬藏，一到了秋季时，就是农民准备收割农作物的时间，由于黄梅时节雨水充足，所以田间的农作物今岁不必担心，必定是会得到丰收的。只要在时机成熟的时间进行便可以了，占者运势中上。"},{"n":16,"no":"第 16 号签","text":"时来风送滕王阁，运至何忧跨仙鹤。甲乙两运天云梯，也知桂香味早卓。","jieyue":"人情间的冷暖，锦上添花的很多，而雪中送炭的很少，为什么呢？跟红顶白是人之常情，而打落水狗也是人的劣根性，是根本上很难杜绝的。而以此签来说，事情得到如此的得意，因此不必再担心，如果能耐心一点守候的话，收益便必会更多。"},{"n":17,"no":"第 17 号签","text":"一旦雷声震，四方皆有庆。转吉又增祥，壬癸子午定。","jieyue":"有很多人常常用欺诈手段来取得人的信任或利益，以满足一已之欲。事实上，他所施展的手段，以为很高明，其实往往弄巧反拙，欺人反自欺。只要能够在初期时有正确的宗旨来干，则往后就不会偏歪。"},{"n":18,"no":"第 18 号签","text":"十日滩头生，一日过九滩。东风须着力，人事自完全。","jieyue":"人在营谋时，当然是要全力以赴，但所持的心态是谋事在人，成事在天，因为付出的努力很多时候并非与收穫成正比的。所以开始谋为时不必为成功或失败而忧心忡忡，这样的话，做起事来就可以更为戳力，反而成功的机会更大。"},{"n":19,"no":"第 19 号签","text":"喜得秋风万事足，一举成中天下福。风凰五彩利飞行，只看子午时日卜。","jieyue":"月老即冰人，职司撮合人姻缘的仙人。只要他将红丝繫上，男女虽为仇敌，或远在天涯，也会得到结合，完全不需要自己劳心劳神。在那段时间，只要能够坚守自己的岗位，则在农曆秋季时节，名利会有成就，兼且喜气盈门。"},{"n":20,"no":"第 20 号签","text":"人转丹成白日升，神仙有数利人营。 一朝走马龙行会，此是荣华一美因。","jieyue":"炼丹犹如做事，在基础上已经努力了八九分，只要再加一把劲，不使其有所脱节的话，很容易便会得到一个重大的突破，使自己所坚持、所进行的事情得到圆满的解决。若问荣华何时可以享得，则会在丙丁年月取获。"},{"n":21,"no":"第 21 号签","text":"吉人天相，子丑相当。西北有荣，风行水上。","jieyue":"本来对着一隻老虎，是非常凶险的事，但如果你只是从其虎尾处经过而不惊动它，也是可以顺利而无甚危险的。很多时要想事情得到成功，如果不深入而踏实地去干，一定不会有成的。因此，只要小心一点，即使是进入虎穴，也会无事，而且更能取得成果。"},{"n":22,"no":"第 22 号签","text":"上上等，利有攸往。一日遇合，鼠牛相放。好好机会，名登天榜。","jieyue":"豹变即是由贫贱而富贵，乘龙即指人女婿。如果是栽培得当，一切的风雨的侵害都不会成功，一旦得遇时机便能成就一番事业，振兴名声。只要时刻努力进修，行仁德之事，不生妒忌之心，则福德自然随之而至。"},{"n":23,"no":"第 23 号签","text":"海上一龙飞，春风得意回。从此欣荣遇，只待一壬来。","jieyue":"吃得苦中苦方为人上人，因十年寒窗苦读仍未折桂，始终都不能说是有所成就。犹如人努力在发展自己的事业，但未有寸进，仍然是云遮月头，但如果能得到突破，则一雷天下响，吐气扬眉了，必然惹来豔羡目光。占此卦得运之时应在夏末初秋。"},{"n":24,"no":"第 24 号签","text":"说到龙蛇马又来，看看无不遂心怀。前生俱是有缘份，及到今时运已该。","jieyue":"古人常说：「富易交，贵易妻」。当人取得富贵之后，很多人都会抛弃贫贱时的朋友与妻子。能够象张节一样，「贫贱之交不可忘，糟糠之妻不下堂」又有几人？所以在得意时，能够不动摇自己的心志，才是顶天立地的人，运气才能保持。"},{"n":25,"no":"第 25 号签","text":"猪鼠相合，卯酉相同。一船满载，载载不空，得心应手。只在三四五成功。","jieyue":"寅午戌合成火局，因此在属火之年会很多阻滞，亥子丑合成水局，因此在属水之月会渐渐享通。故占得此签的人，在火年遇木（卯、玉兔）月，如果有金（酉、金鸡）来克制木的话，则可以使不成火局。故此卦是喜水而忌火。"},{"n":26,"no":"第 26 号签","text":"一天喜气一门吉，一人有庆皆受益。一箭中红心，功名成遂转，祥风生四壁，门庭光奕奕。","jieyue":"天数的吉凶，如何地影响人们的命运，未到时节实在是很难预测得到，但当其一到来的时候，也不是人所能抵挡或回避得到的。但占此签者，在三个月之内应该会得出好的结果，万事如意，喜气盈门矣！"},{"n":27,"no":"第 27 号签","text":"凤翥丹山报晓时，人生得意是奇奇。看来自有探龙宝，日月光辉申与鸡。","jieyue":"荆棘满布，虽然是凶险，但若为凤凰栖身之处，则终必落于其中，目前形势既然是未能有这种条件，何妨再耐心地等待时机，现在已经是杞人忧天的话，实在是未有这种必要，占得此签者，凡事要耐心等待，是先凶后吉之象。"},{"n":28,"no":"第 28 号签","text":"前生原是此家人，今世相逢定有因。龙虎呈祥遂天子，五三六二是奇期。","jieyue":"人生的造化（即运气、福份）原有天定，但以自然平常之心来对待的话，自然会感到事事都顺遂，而享得的福泽也会绵绵不绝。功名（官职）的成就也可以得到神明的帮助而取得。应验变迁的时间会在卯巳年月日。"},{"n":29,"no":"第 29 号签","text":"猴儿来，兔儿去，龙呤虎啸。乃是收成佳遇，不须求际。","jieyue":"水与火原本相克，但在某种状况下，水火亦能相济相生，这就是阴阳相契之意。天地原先无极，动则生出阴阳，阴阳相合，则生四衆，而天地间之育物新民，皆由阴阳互相合化而成。故此引伸出得失荣辱，人的际遇而由此而定。"},{"n":30,"no":"第 30 号签","text":"乾三爻，渐三爻。一时遇合，鹤鸣九皋。","jieyue":"人生追求不外乎名利，有些人名利双收，有些人名利俱无，有此人有名无利，有此人是有利无名。无论是属于那一种，只要知足便能生活无忧。「知足者，贫亦乐；不足知者，富亦忧。」此喻示家境富足无名禄，劝人不必因此而羡慕名位的人。"},{"n":31,"no":"第 31 号签","text":"水上顺风吹，高才得意挥。学成文武艺，自有好栽培。","jieyue":"聪明的人考虑事情，有时候也会有失误的，而愚笨的人在考虑事情时，有时候也会福至心灵，偶有佳作，这可说是上天的公平安排。但这些仍未算是最佳处理事情方法，最好是小心谨慎，在遇到障碍时任你有多大计谋，莫要强为，以防有祸。"},{"n":32,"no":"第 32 号签","text":"荣华贵，富贵来。天地生成，多吉少悔。三九遂心怀，虔许善功福自来。","jieyue":"夷吾与子贡均为春秋时人，以擅长于经商闻名。其中子贡的名声更为响亮，因他是孔子的学生，善于辞令，经商曹、鲁国之间，富至千金，并常参与政治活动，并受官职于鲁、卫国家。占得此卦，如欲觅取蝇头小利，到冬天时节应可称心如意。"},{"n":33,"no":"第 33 号签","text":"梅占花魁及第巍，天生福禄禄同辉。问到终身何所就，三七之内是荣华。","jieyue":"相传世上有月下老人，每个人的姻缘都掌握在他手上，只要他在男女双方的脚上系上一条红绳，则这对男女虽远隔千里，到头来也会结合在一起。因此，有很多事情虽然是无可奈何，但亦只能说是命运弄人。只要事事看得开，灾祸是非口舌等等麻烦都不会惹上的。"},{"n":34,"no":"第 34 号签","text":"自从河洛周天数，演到出门交有功。一生际遇须龙马，不用踌躇自合行。","jieyue":"一二三四五为生数，六七八九十为成数。生数不可移，成数可以移，两者之间有着相生相成的关係。一奇、一偶两组数的配搭，表示世间万物皆由阴阳化合而生成。乾为老阳，老阳未变则不能乾坤生合，占之者遇此，万事宜静不宜动，静则吉。"},{"n":35,"no":"第 35 号签","text":"阴德不是非凡事，积善之家度有馀。厄去福来天凑巧，龙飞虎跃一鸡啼。","jieyue":"同室操戈，兄弟不和，是很多家庭中常有发生的事，究其原因，当然是当父母的处事不公平，日积月累而引起的。因此家不齐，身不修就不能当上大事，得到高职。要厄去福来，必须是积善之家，同时要时常行阴德之事才可以，这也是人情练达的一种表现，只要事事小心，遇厄也可无碍。"},{"n":36,"no":"第 36 号签","text":"芹香鹿鸣，不远不近，二五之内，自然有幸，天喜文昌照命。","jieyue":"古老相传，喜鹊鸣噪是为报佳间，必有喜事到来。而古时用灯芯浸油燃点用来明亮，果见到灯芯明亮，也喻示吉兆。既然有种种的佳音佳兆到来，忧愁当然会渐渐消退，代之而起的是好运开始来了。"},{"n":37,"no":"第 37 号签","text":"黄金自重，人天雨映。春花秋果，何悔何吝。","jieyue":"逆水行舟，是吃力不讨好的，因此人生一直在逆水的环境中的话，是相当辛苦的，这就是人处于逆运的时节了，反过来，如果是顺水的随波逐流，可以在瞬息之间，得走千里，即轻鬆又写意，要达到这个地步，日常积德向善，可减少人生的阻碍。"},{"n":38,"no":"第 38 号签","text":"时行运遂不须愁，一到桃花皆自由。果然渊内龙飞跃，脱俗超化始出头。","jieyue":"上天对人都是颇为公平的，每个人一生中都总会有机会给自己发挥的。故俗语说：人有三衰六旺，旺是比衰多的。但究竟如何掌握这个时机？这个时机究竟有多长久呢？就非人所知了。所以有些人在少年时发迹，甘罗在十二岁拜相，亦有人在晚年发迹，如姜太公八十遇文王。但常心存行善之心，则贵不可言。"},{"n":39,"no":"第 39 号签","text":"鞭策长安路，天仙第一班。已及时，春风桃李姓名奇。一枝独佔梅花上，次第春风到草芦。三十六宫春，上国定观光。","jieyue":"人未得时，如龙潜于深渊，蛰伏不动，得时则跃出于渊，大展所长。而其德才华，将会遍泽大千世界，万物受其覆育而欣欣向荣。故凡事要坚忍耐劳，以待时机。"},{"n":40,"no":"第 40 号签","text":"富贵功名各有期，龙虎相逢鸡犬宜。果煞采获仙人手，自是金麟上玉时。","jieyue":"古人说：二人同心，其利断金，几个志同道合的人合在一些，其团结出来的力量是相当大的，办起事来特别容易成功，如管仲、鲍叔牙二人为好朋友，同时以共同做事，所以在辅助晋文公时使得晋文公成为霸主，这就是和合见交情的含义。"},{"n":41,"no":"第 41 号签","text":"圆又缺，缺又圆。连又断，断又连。遇渡桥，舟在前。也须慎言，方得周全。","jieyue":"前途有惊险，处境不佳，蹇滞凶阻如布天罗地网般，只要轻举妄动或偶一失足，就陷入万劫不复之地。但只要谨慎，无急躁之心，可以无碍。故处事要如踏上薄冰上行走一样，步步为营便可。"},{"n":42,"no":"第 42 号签","text":"只说有愁烦，事到其中兴不阑。逢午方可良，不必乱张惶。","jieyue":"自己怀有满腹才华，当然希望能一展抱负，让世人知道，但时运未至，一方面未为人所尝识，另方面亦未取得发挥的机会，使得自己的本领毫无着力之处，怎么办？宜守候时机，及再充实自己，必能大器晚成。"},{"n":43,"no":"第 43 号签","text":"天有时，地有时，人尚少期。要得好时，也看三六九期，忧转嘻嘻。","jieyue":"虽然在这处有损失，但在另一处则有收穫，这此叫「失之东隅，收之桑榆；」即然是有得有失，月亮也是有圆有缺的。所以凡事不要太着重于「强求」，只要做到不过不失，当时运一到，自不然会转为喜乐重重了。"},{"n":44,"no":"第 44 号签","text":"莫孤疑，事在可疑。有可疑，不疾不徐，自有出头日子，当看金花一二枝。","jieyue":"在可以攻的时候攻，在应该守的时候守，如果能真正做到这一地步，就是知道进退了。以这一支签意的理解，现阶段绝对是只适宜守的，因为一进就会産生很多是非口舌和争拗。为保持自己目前尚不算差的运气，还是以守为妙！"},{"n":45,"no":"第 45 号签","text":"天时人事，正是好佳期，又恐跷蹊。但看双入卯金宜，只待十八子一提携。","jieyue":"古语说：「生死有命，富贵攸关。」所以富贵虽然是每个人所梦想、所祈求，但又未能一一如人所愿可以垂手而得。如果能够常常秉持着满招损、谦受益的心态，贫富也不忘其本，当有奇逢之喜，终归有益。"},{"n":46,"no":"第 46 号签","text":"桥已断，路不通。若要通时，也候三五之中。许下善功息不穷。","jieyue":"身离渡口即在江中，箭离弦即已发箭，喻示事情已在进行之中，还可以走回头路吗？当然是不可以了，所以只有鼓其馀勇，继续向自己的目标进发。同时千万不要怨歎做事的收成太迟，上天一定会清楚你的行善之心而给你一个满意的答覆。"},{"n":47,"no":"第 47 号签","text":"已成了，又难保，只待舟济顺风行跑。每事多烦恼，虔心神前修省长安保。","jieyue":"出外征战唯凭仗剑而行，可惜有时连很少的敌人都未必能够一下子消灭，到头来虽然是戎马半生，而且功劳不少，但仍未能得到封候拜将，徒然惹得自己伤悲。因此看来，是非閒事莫管，亦切勿妄求，而且一心向善，诸恶勿作，神必保佑吉昌。"},{"n":48,"no":"第 48 号签","text":"一枝已报晓，恐难得，时尚早。有箇成就之时，须向神前恳告。","jieyue":"当运势未到，有困难重重之时，必须要坚苦卓忍，守着自己的本道而行。长嗟短歎或者怨天尤人，只会增加自己的麻烦，不如放开怀抱，以「输」的心理来努力进取。天上的云雾不能遮盖多时，一旦拨开，青天重见，即如枯木逢春一样，一定会发芽生花的。"},{"n":49,"no":"第 49 号签","text":"牆头草，篱下花，山穷水尽，未必繁华。若要繁华，也要归家，方可如心得奢。","jieyue":"世事如棋局局新，在人世间待人处事，无不为蝇头小利而劳碌。只要环境许可，退隐泉林自耕自种亦是一个好办法。但这对大部份人来说是奢望。退而求次，做人处事以退隐的心情，处处以不争，以退让为先，则可减少很多祸缠。"},{"n":50,"no":"第 50 号签","text":"一声莺报上林春，恐是虚声，未必峥嵘。若要争荣，还候丙丁。","jieyue":"人的命运犹如人行在道路上，如是平坦大道，当然是一帆风顺，平步青云。稍为崎岖则是一步高一步低的摸索向前进。但只要坚忍守成，不焦躁，不急进，看清楚才行，仍可在崎岖的路上选择到较平坦的路来行走，完全视乎个人心性而定。"},{"n":51,"no":"第 51 号签","text":"镜破月缺，孙山保得。若要安康，酬神免业。","jieyue":"游子在外时，难免有思乡亲之情，每在夜阑人静，寂寞无聊，尤其遭逢蹇滞困厄之事时，更会惹得愁思串串，令人惆怅。在这种境况下，必须十分忍耐，善于排遣，更要修德行善，自必有神明永保平安。"},{"n":52,"no":"第 52 号签","text":"虎坐中堂，鸡太相闹。天不如人求，反增多少笑。安而不危，菊花天到。","jieyue":"天道即人道，故人凭着自己的良心来做事是有神明鉴听的，这就即是世说的因果，所以天道是无私的。只对人的反应是基于人的所作所为而定，倘然良知完全泯灭，那么往后的结果会是怎样呢？须记着，祸由自招，求天福不如求自己了。"},{"n":53,"no":"第 53 号签","text":"一枝好花，风雨未到。只待清明香可味，顺水过渡。","jieyue":"树上生花，而无风雨吹打，当然是愈发茂盛。即如做事营运，已有基础，如无特殊因素发生，当然容易臻至佳境。如果在中途遇有阻滞，但有贵人扶助，仍然是行走在坦途之中，只待厄消祸去，福泽自然会随之而至。"},{"n":54,"no":"第 54 号签","text":"一半就，一半不就，惹得争斗。取之不合，治之宜早；吉祥方保，也要慢寻讨。","jieyue":"做事皆有动静两方面，静为思考策划，动为执行。在处于目前的境况，静时未能取得法，动时又容易生出错误，人到此时，可谓狼狈至极，因为有所阻碍而不能顺利前进。故宜以忍耐守成为上，待时运一至，然后才顺势推行。"},{"n":55,"no":"第 55 号签","text":"月在天心人在船，名已将得，利已将偿，何不耐烦，不久起床，也要斟详。","jieyue":"富与贵，是每个人都希望得到的，究竟怎样可以取得富贵呢？道理很简单，但要做到则绝不简单。勤力工作能致富，修心修身得贵来。除此以外，始能戒除贪念，待人和气，谨慎行事都可以协助你取得富贵，所以能有恒地坚守上述条目，灾殃必去，福星常来。"},{"n":56,"no":"第 56 号签","text":"皇皇典，喜喜贲，天衢平坦。只待小人得志，休得动风，自然既济。","jieyue":"人一生吃多少、穿多少，都由命运所定。有的不会缺少，没有的不会多出，因此要常存知足的念头，然后才可以尽情地享受自己的人生。而尤其最重要的，是得意之时不要太逾份，要提防失意之时又如何；故能存信义立世，则能逢凶化吉。"},{"n":57,"no":"第 57 号签","text":"乐以忘忧，也要踌躇。事未必月在楼头，那得要休要休，可向金木人儿一搆。","jieyue":"世人劳碌忙乱，求的不外是名和利。亦由于名和利，使人的天真的个性大变，但最终很多说只不过是徒劳而已！如果你是具有这种取得名利的福份，命运终必令你得到，你不须强求的；否则，纵然耗尽千方百计，也是一场春梦。"},{"n":58,"no":"第 58 号签","text":"可罢即罢，不须斩尽杀绝，事到无可奈何。也要守旧安歇，力保无失可得，三七可决。","jieyue":"很多时做事不是一下子就可以成功的，即使在事前你的准备工夫是如何细心及部署如何慎密，也会因特殊的因素而棋差一着。但只要不惧困难，即使是三战皆北（输了），但只要你一旦成功，每一个人都会因此而对你刮目相看。"},{"n":59,"no":"第 59 号签","text":"去的去，来的来，东南一方。自迩遂依，切莫双疑猜。","jieyue":"一个人天生下来即含着金锁匙的话，其际遇当然较诸一般人的生活为佳。尤其是他由直道前时，每一条都是康庄的坦道，这或许是他积了很多福才有这此日子，姑无论如何，如果在事业上能遂意的话，子孙也有利得多。如果能乐喜好施，其福泽也是无量的。"},{"n":60,"no":"第 60 号签","text":"苦而甘，甘而甘，一子一午。送喜不送忧，也要自裁生。","jieyue":"一个人一生之中有多少衣食，已有定数，所以毋须强自求谋，即使是经过一番苦干后得来的，也会无缘无故的失去，因为这并非是你的福禄所能享用至的。因此，对于一切强求的物品都应谢绝，这样才能保持自己既有的运势，也不会到最后劳而无功。"},{"n":61,"no":"第 61 号签","text":"鸿飞天外，舟动无风。人有月明中，自有喜相逢。","jieyue":"前人种树后人凉，前人积福后人收，既然是已收前人的福荫，后人更应扮作前人，积福积善以留后代人享用。代代积福，代代可享，所谓积善之家，必有馀庆就是这个意思。运势亨通的，则不管何地何方，皆为康庄之道，任你驰骋，因此修善积福至为重要。"},{"n":62,"no":"第 62 号签","text":"吉吉吉，益益益，不必多急，自有文章东壁。只在初三十一，方可必，方可必。","jieyue":"修善修身为一个人秉持的信念，能够时刻地做到，就可以修炼成神仙，这是修道人所期望的最高境界。但要做到这一步，一定要有下功夫的态度，不畏难的精神，才能够把好的运气儘量地发挥出来。因此已有种福因的人，今岁可收得善果的条件。"},{"n":63,"no":"第 63 号签","text":"龙已飞，虎已归，笙歌已歇。兴而不久，万事如灰。","jieyue":"当命蹇时迟，一切不如意事都会接踵而来，灾殃病患，也会因以前积下的因而生出今时的果。以前行善积德者当然是遇难有救，但如果从前未种下如此善福的人，就颇为凶了，自今日起修善修德，虽然是「临急抱佛脚」，但亦可获得一定的庇佑。"},{"n":64,"no":"第 64 号签","text":"生之时多乐，半路上下不相逢。只看无妄之卦，方可悔吝分明。","jieyue":"富贵本为镜中月，水中花，往往很多人「三更穷，五更富」，对于很多本来为贫苦的人家，一旦发迹起来，很容易忘记当日自己捱穷的日子，对于贫苦的人其怜悯心也不会很大，所谓为富不仁，因此这些人很多时会为维持自己的财富而做欺心之事，贫富其实只在于知不知足，能不欺心则天必得佑，祸必不侵。"},{"n":65,"no":"第 65 号签","text":"一天星斗灿辉煌，风雨未光。起而不扬，也要两三番。","jieyue":"当人对每一件事都毫不牵挂地放下时，他实际已到了一个返璞归真的地步，一切名利、荣辱都已是身外之物，绝不会打动他们的心。但很多时你愈不追求的，它愈是追着你，又不是人所可控制，取捨如何？要视乎自己的情况。总之，即是事情看起来已经到了尽头，但最后都会有柳暗花明之象出现，一切无妨。"},{"n":66,"no":"第 66 号签","text":"得失皆天定，忧喜总归命。知天知命，守之为幸。","jieyue":"有积蓄是人人所喜爱的，有钱的人积金，有德行的人则积德。积金是有形的、积德是无形的，但古人言，功名利禄皆由积德之士所有，故积德亦可以成为有形的回报，只要能安份纪，处处以守为重，则不会迷失心性。"},{"n":67,"no":"第 67 号签","text":"一跌复一跌，只恐卤莽灭裂。果能惜得寸金，也要调摄。","jieyue":"每个人的祸福都根由于因果，因果有来自先天命运，也有来自后天。以后天而言，和气待人，大家都不生争拗，自然可得祯祥。乖气凌人，大家互出计谋，自然是戾气冲天，所以要令自己得到兴盛的话，必须以和为上上之策。故此忍让谦和，自然可趋吉避凶。"},{"n":68,"no":"第 68 号签","text":"一门天赐平安福，只恐小人不理。防犬防牛，应取不取。只在三旬裡，也有三分喜。","jieyue":"俗语说，莫信直中直，须防人不仁，很多是非小人会联合起来，口密腹剑地向你提出很多建议，游说你干这干那，千万不要随便答应，尤其是属于丑、戍之年、月、日时期。"},{"n":69,"no":"第 69 号签","text":"防口甚于防川，不当顽顽；急水莫开船，也要黄昏，乃命得长。若知消息，方要周旋停当，当在二七三上。","jieyue":"蛟龙受困于浅泽之中，只是一时之际遇未至，又怎能说其能力平平，因而对其白眼相加，待一朝风云际遇，就会吉人天相，遇险灾消，一洗当年的秃风。做事只要小心，提防小人的口舌则吉。"},{"n":70,"no":"第 70 号签","text":"锦衣万里，劳劳而后喜，一朝可望生成。也是文昌照汝，定是佳人贵子。","jieyue":"人说命好不如运好，运好即一帆风顺，无风无险。如一只船在万里碧波航行，藉着顺风，扯起一帆，在波浪不惊的环境下向前直驶，正是「轻舟已过万重山」。因此只要运气好，一生都在安稳中渡过。"},{"n":71,"no":"第 71 号签","text":"黑云迷径人难走，桥断风吹舟又危。莫思徘徊，且去自思维。","jieyue":"一个人立身处世必须要知足，不要贪图欲望。把自己的思想和行为都深入欲海之中，这样会使人的性格及价值观完全摧毁。如东廓先生当年贫无立锥，以乞维持生活，一朝得志即忘记其初段时间的艰苦，使自己受欲望的枷锁牵着来走，终至不能自拨。因此只要不自暴自弃，全心全意地干，也不要忘本，最后都可以得到成功。"},{"n":72,"no":"第 72 号签","text":"白日雨如注，行人已自栖，闻道天衢泰。还有不宁居，何必向前进，危且殆乎？","jieyue":"前途虽有风险，但由于危桥已过，又回复行到康庄之道，自此便不必再有挂虑，再逢艰难了。正如一直困于浅水的蛟龙，一旦得意飞腾，在天上兴云布雨，显示出其卓绝不凡的能力。故此只要在行事之初段能够谨慎，经过阻滞后，也可获祯祥。"},{"n":73,"no":"第 73 号签","text":"鬼迷神不佑，须求天神救。立善行功成，好事方成就。三接其画，多许诚求。","jieyue":"祸福虽然说是由天所界定，但细心想一想，绝对是由人来取决的，这就是有其因必有果的缘故。而且亦是古语说：「祸兮福所倚，福兮祸所倚」的结果。因此塞翁失马不必以此为忧，得马亦不必以此为喜，因为其中所包含是福是祸仍未清晰。但只要时常修身，反省自己则可保一切平安。"},{"n":74,"no":"第 74 号签","text":"勐虎噬人，恶犬欺生。一箇昏天，如何扬眉吐气。","jieyue":"时来运未至之际，作事如望梅止渴、画饼充饥，始终都是水中月、镜中花，是没有结果的。同时，更多的小人羁伴在侧，使你举步维艰，愈是想前进，愈受阻延。因此，应不畏辛苦做事，步步为营，须防小人作祟，生出意外。"},{"n":75,"no":"第 75 号签","text":"天不佑之，时不合也。花被风折，人在海底。","jieyue":"欲望是无底的深潭，得一想二，得寸进尺，当然这也是人的常情。所以身处高山，就想登天，以为登天很易，当知道难或因进得退时，就知道事情的真象。因此处理事情有时要从正反二方来看，总予人家留有馀地，亦即留有馀地给自己。"},{"n":76,"no":"第 76 号签","text":"水落石出，荣华已矣！若得一通，除非再起。不宜前进，当守时势。","jieyue":"做人要安份守纪，在高位亦常存谦恭之心，不要太过冒进，同时也不要常常存有「人比人」的心理。因为「人比人，比死人」。只要在退处时听凭命运中的升降浮沉，终必获吉。这样才可以做到「得志，与人民一起进取；失意，独善其身」的地步。"},{"n":77,"no":"第 77 号签","text":"前车已覆，当为殷鉴。安份守命，自然顺便。","jieyue":"有才能的人受气运的限制，犹如蛟龙被困，亦似有船而没有江河可渡，始终不能一展所长。这时，凡事应当忍耐守候，以候时机，不宜强为，因人事不易胜天。唯一可以做得适当的是耐心，始终是可以得到时机发挥自己的所长。"},{"n":78,"no":"第 78 号签","text":"牆倾屋拆，大势已裂。防而无悔，土崩地决。","jieyue":"痴人为何能得痴福呢？此无他，因为他的「因」是「痴」，所以其得的「果」也是「痴」。这种「痴」不一定是「傻」，可以说是单纯或太专注，所以常得贵人的扶助而得到安康。"},{"n":79,"no":"第 79 号签","text":"不是知音不与论，只看镜破风不正。逆水莫行舟，气散宜当尽。","jieyue":"做人率性而为，是为天真，但太天真则未必能容于世俗的礼节，所以除非是遁隐泉林，过着隐士的生活，否则亦须顾及少许礼俗之事，只要凡事不欺心，即使祸害不至，再时常修德的话，灾祸自然不会临身。"},{"n":80,"no":"第 80 号签","text":"三分而已，何须望奢。人要回家，只待日西斜。","jieyue":"明明是已有名有利，知道再努力强求也是如此，但亦切勿守株待兔地等待命运的安排，要进取。因为名利如逆水行舟，不进则退，守成是一个最愚蠢的方法，所以一定要抱着奋斗的精神，这样的话，比纵使失这东隅，也必会收之桑榆的。"},{"n":81,"no":"第 81 号签","text":"合而分，分而合。天时人事，雨斟酌。","jieyue":"造物者对人的命运有时也是每多作弄的，因此要计算自己的成功失败亦是没有甚么可根的。在这样情况下，往往有心栽花的，未必能长满花朵，而无心插柳的，偏偏它就很茂盛。因此一得一失，一成一败都有前定之数，凡事与他人合作都会成功，但亦须防合久则分。"},{"n":82,"no":"第 82 号签","text":"月已落，风又紧，舟无蓬，水底影。若要如心，三春一景。","jieyue":"古人说：福无重至，祸不单行。因此遭遇不幸的事情时，感觉上或事实上有很多不利的事情会相继而至。其实这只不过是一种错觉，只要凡事谨慎处理，只问耕耘，不问收穫的小心去做，终必能渡过重重灾厄，到达彼岸。"},{"n":83,"no":"第 83 号签","text":"马已疲，人又疾。天不从人，何须亟亟。","jieyue":"一个人的命运在蹇滞之时，其所得的机缘也是相违背的，当灾祸降临在他身上时，可能当时他的身体情况也是很羸弱的。为甚么呢？这就是「祸不单行」的原故，亦即是因果的循环。既苍天都不予以庇佑，予以关顾，自己就不亟亟地营谋，首先打好自己的基础，充实好己，以候时机一到，自然水到渠成。"},{"n":84,"no":"第 84 号签","text":"秋风正好月当中，忽被雨朦胧。如何往，难成功；不宜谋，须神工。","jieyue":"此签运势有若梅花间竹式，一事成空，一事成喜。空与喜交迭而生，令人徒费力气。在这段时间更要小心草头姓的人，所谓草头人，即姓黄、董、蒋、范、蔡等，若与他们在一起，很容易无端起祸，危及自身的安全，故一切以守为宜。"},{"n":85,"no":"第 85 号签","text":"一去中阻，云雾不开。且自宽怀，须许善愿无碍。","jieyue":"在庭院里打开弦琴，以等待月亮，当月亮运行在天中时，光华映耀，庭院生辉，在此时抚弄琴弦，以作和应，当能触景而生情，但须有节制及忍耐才能达到这个目标。"},{"n":86,"no":"第 86 号签","text":"席已散堂中，寂寞恐难看。若得重欢，只待一轮月上。","jieyue":"花无百日红，有盛必有衰，人无千日好，有吉必有凶。乐极易生悲，忧时福又至。故本着平常之心待人处事，则无大凶险，日落西山的光芒虽好，但在黄昏之际尚能美好几多时间呢？故凡事以守成为妙。"},{"n":87,"no":"第 87 号签","text":"锦绣不成文，只恨修之短。挽回时命，鸡鼠猪牛，也宜推让，问过收成子罕上。","jieyue":"当一个人运势不畅通之时候，事事皆有阻滞，君子安穷，要在运蹇时甘之如饴。守株待兔，缘木求鱼，虽然都是千万中不能得一的机会，但仍然是有其一定微细的机遇的。但切勿不能心急，待时至即可。"},{"n":88,"no":"第 88 号签","text":"悔亡悔亡，空耗两难。人在东，西何可遇，莫劳心力待时遇。","jieyue":"全签皆喻示应遇而不遇，应逢而不逢的情况，水中之月，镜中之花，可望而不可得，精卫鸟啣石欲填平海，空劳气力，以珍珠来打雀，徙然浪费，正如月沉于海底，人在梦中，要勉力而为亦不可得，终是画饼充饥。"},{"n":89,"no":"第 89 号签","text":"隔了几重山与水，前途终是隔难行。只待草头人，方可两成谋。","jieyue":"船到江中心突然遭遇波涛胸涌，拍天而起，这种情况非常之危险，可幸此次情况是有惊无险，终必安然渡过。但虽然如此，仍然不能大意，要作好一切安全措施，使船稳定地向前行，因为前面还有十八个险滩要渡过呢？故此签喻示作事有阻滞但无碍，但仍然要谨慎地贯彻始终，以避免功亏一篑。"},{"n":90,"no":"第 90 号签","text":"雨打梨花，人在天涯，功名多费力，图事不能成，阴阳反复，时过令人嗟。","jieyue":"十分危险，幸得有救。李彦贵求功名自家乡上京赴考，途中遇难获救，家人未悉，以为已赴险曹，故祭之。求得此签者，运蹇时乖，诸事欠吉，加上事事反反覆覆，时好时坏 ，令人摸不着头脑。唯有自已处处小心，靠神灵的庇佑，朋友的协助，然后才能从危机中得救援，一切须待时机。"},{"n":91,"no":"第 91 号签","text":"莫急走，看绊跌，云掩风霾，终是一场冤业。若冤业，修省方免得。","jieyue":"古时人曾假设最危险的事情是甚么？答桉是：盲人骑瞎马，夜半临深池。试想盲人骑着盲马，深夜在一个深渊的旁边，就如此签乘着病弱之马行至危坡，是很容易因疏忽而失足陷下。犹幸危中有救，有执鞭疆的人辅助，使得临危也有救助。"},{"n":92,"no":"第 92 号签","text":"雷声大，雨点小，纵好不好。事在解铃人，福自改过，多行善可保。","jieyue":"已经犯下的错误当然无可挽回，但所受的刑责却因有上天的庇荫而得到宽减，所以纵有祸亦非严重。同时，一切问题的症结仍在你的手上，所以要得到解决之方，就要看解铃之人，多行善则可得福。"},{"n":93,"no":"第 93 号签","text":"心急马行迟，妄干何有益。且自安份，天神护吉。","jieyue":"六阴若相逢，表示将发生灾厄凶危之事，此番透此的消息既然是这样，不必妄动，强要运转乾坤，凡事只要小心在意提防，勤加修饰己身，则自不然灾祸消弭，随着吉祥之神来运转。"},{"n":94,"no":"第 94 号签","text":"事已如此，悔之何及。纵有不祥，还宜阴骘。","jieyue":"每一件事情，到达了某一个地步，就应依着其理法来进行，不必再想或后悔当日为何不如此如此的去做。纵使是绕路而行，终必有成。若一味转变行事方针，则只不过是原地踏步，再无进展之势。故此依理而做，而不必再有猜疑。"},{"n":95,"no":"第 95 号签","text":"已入笼，何可脱。已落空，难觅着。遇鸡鼠，自知觉。病果起，勿服药。","jieyue":"一到春季时万花盛开，花团锦族，在枝头上花朵开放得十分烂漫，令人感到十分写意。但须防盛极必衰，在最灿烂时又会趋于平静，在这种情况下，必须处处小心，步步为营，不能轻率大意，同时一定要居安思危，为将来作出部署，才能转厄为祥。"},{"n":96,"no":"第 96 号签","text":"潭深鱼不饵，鸟飞难弋获。时势已如此，一笑又一哭。","jieyue":"人生的得与失是非常玄妙的，所谓有一得必有一失。例如你抽出更多的时间在事业上，于是你得到成就，但相对来说，你失去和家人相聚的时间，或自己娱乐的时间。因此两者间的关係就如影随形一样，是永远相连在一起的。所以自己要立定心意，要得或是失。"},{"n":97,"no":"第 97 号签","text":"吉凶相半人宜识，莫任劳劳损无益。有时天运一回还，自然天道无痕迹。","jieyue":"心中已萌生了营谋之念头，不必急躁也不必担心，希望是可以得到实现的，而且成绩也是不错的。须注意，重点是在时间和成就上，因此只要不冒然求进，终归可遂心愿，若果急于求成，反为不美。"},{"n":98,"no":"第 98 号签","text":"东不如西，也要识时，是乃有命。可不知之，知时命，久谋自合宜。","jieyue":"究竟一个的成功是易抑或难呢？这是没有定则的。时来运到时，虽难成就者亦变得容易，时乖命蹇，垂手可得之势也会骤生突变，阻障重重，此一切皆由缘来作主宰。但只要尽人事而顺应天命，则万事得吉。"},{"n":99,"no":"第 99 号签","text":"可以转移，可以了结。只恨运命屯邅，故此一得一失。","jieyue":"老虎横在路途之上打瞌睡，对人本是极为凶险之事，因它一醒觉便会噬人。但只要行人小心谨慎，不惊呼狂叫，把睡着的老虎弄醒。这样，你慢慢的从它旁边经过，也是有惊无险，不会发生灾祸的，故平心息气，为此签的重大啓示。"},{"n":100,"no":"第 100 号签","text":"月落星沉，风生雨至。只要龙虎不相争，方可如时利。","jieyue":"桃花、李树在春初发茂，盛放于春末，故春来是桃李由盛而衰之时节。而候鸟亦由迁居地飞返回原居地，人虽然是平静如常地，但外来的冲击颇大，如船置身于波涛之中。依此诗意，凡事均须小心谨慎，提防一切突然而来的变故。"}];

  var drawBtn = document.getElementById("drawBtn");
  var againBtn = document.getElementById("againBtn");
  var copyBtn = document.getElementById("copyBtn");
  var allToggle = document.getElementById("allToggle");
  var allList = document.getElementById("allList");
  var qianCard = document.getElementById("qianCard");
  var resultCard = document.getElementById("resultCard");
  var resNo = document.getElementById("resNo");
  var resJi = document.getElementById("resJi");
  var resPoem = document.getElementById("resPoem");
  var resJie = document.getElementById("resJie");
  var resExtra = document.getElementById("resExtra");
  var drawing = false;
  var lastText = "";

  function jiLevel(ji) {
    var s = String(ji || "").replace(/^\s+|\s+$/g, "");
    if (!s) return "";
    if (s.indexOf("下") !== -1 || s.indexOf("凶") !== -1) return "down";
    if (s.indexOf("上") !== -1 || s.indexOf("大") !== -1) return "up";
    if (s.indexOf("中") !== -1 || s.indexOf("平") !== -1) return "mid";
    return "mid";
  }

  function makeJiBadge(ji) {
    var span = document.createElement("span");
    span.className = "ji-badge jl-" + jiLevel(ji);
    span.textContent = ji;
    return span;
  }

  function clearChildren(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
  }

  function normalize(q) {
    var n = {
      no: q.no || ("第 " + q.n + " 号签"),
      ji: q.ji || "",
      poem: q.text || q.name || "",
      jie: (CFG.jieField && q[CFG.jieField]) || q.jie || q.jieyue || "",
      extra: []
    };
    for (var i = 0; i < CFG.extraFields.length; i++) {
      var e = CFG.extraFields[i];
      if (q[e.key]) n.extra.push({ label: e.label, value: q[e.key] });
    }
    return n;
  }

  function buildText(q) {
    var lines = [CFG.name + " · " + q.no];
    if (q.ji) lines.push(q.ji);
    if (q.poem) lines.push(CFG.poemLabel + "：" + q.poem);
    lines.push(CFG.jieLabel + "：" + q.jie);
    for (var i = 0; i < q.extra.length; i++) lines.push(q.extra[i].label + "：" + q.extra[i].value);
    return lines.join("\n");
  }

  function showResult(q) {
    resNo.textContent = q.no;
    clearChildren(resJi);
    if (q.ji) {
      var b = makeJiBadge(q.ji);
      if (b) resJi.appendChild(b);
    }
    resPoem.style.display = q.poem ? "" : "none";
    resPoem.textContent = q.poem;
    resJie.textContent = CFG.jieLabel + "：" + q.jie;
    clearChildren(resExtra);
    for (var i = 0; i < q.extra.length; i++) {
      var line = document.createElement("div");
      line.className = "qian-extra-line";
      line.textContent = q.extra[i].label + "：" + q.extra[i].value;
      resExtra.appendChild(line);
    }
    resultCard.style.display = "block";
    resultCard.classList.remove("show");
    void resultCard.offsetWidth;
    resultCard.classList.add("show");
    lastText = buildText(q);
  }

  function startDraw() {
    if (drawing) return;
    if (!QIAN || !QIAN.length) {
      setStatus("签文数据为空，无法抽签", "error");
      return;
    }
    drawing = true;
    drawBtn.textContent = "抽签中...";
    drawBtn.disabled = true;
    resultCard.style.display = "none";
    resultCard.classList.remove("show");
    qianCard.classList.remove("drawing", "drawn");
    void qianCard.offsetWidth;
    qianCard.classList.add("drawing");
    var picked = QIAN[Math.floor(Math.random() * QIAN.length)];
    setTimeout(function () {
      qianCard.classList.remove("drawing");
      qianCard.classList.add("drawn");
      drawBtn.textContent = "开始抽签";
      drawBtn.disabled = false;
      drawing = false;
      showResult(normalize(picked));
    }, 2600);
  }

  drawBtn.addEventListener("click", startDraw);
  againBtn.addEventListener("click", startDraw);

  copyBtn.addEventListener("click", function () {
    if (!lastText) return;
    copyToClipboard(lastText, copyBtn);
    setStatus("结果已复制到剪贴板");
  });

  allToggle.addEventListener("click", function () {
    var open = allList.style.display !== "none";
    allList.style.display = open ? "none" : "block";
    allToggle.textContent = open ? "查看全部签文" : "收起全部签文";
  });

  (function buildAll() {
    for (var i = 0; i < QIAN.length; i++) {
      var q = normalize(QIAN[i]);
      var row = document.createElement("div");
      row.className = "all-row";
      var head = document.createElement("button");
      head.type = "button";
      head.className = "all-head";
      var noSpan = document.createElement("span");
      noSpan.className = "all-no";
      noSpan.textContent = q.no;
      head.appendChild(noSpan);
      if (q.ji) {
        var b = makeJiBadge(q.ji);
        if (b) head.appendChild(b);
      }
      var poemSpan = document.createElement("span");
      poemSpan.className = "all-poem";
      poemSpan.textContent = q.poem || q.jie;
      head.appendChild(poemSpan);
      var body = document.createElement("div");
      body.className = "all-body";
      var p = document.createElement("div");
      p.className = "all-poem-full";
      p.textContent = q.poem;
      body.appendChild(p);
      var j = document.createElement("div");
      j.className = "all-jie";
      j.textContent = CFG.jieLabel + "：" + q.jie;
      body.appendChild(j);
      for (var k = 0; k < q.extra.length; k++) {
        var line = document.createElement("div");
        line.className = "all-jie";
        line.textContent = q.extra[k].label + "：" + q.extra[k].value;
        body.appendChild(line);
      }
      row.appendChild(head);
      row.appendChild(body);
      head.addEventListener("click", function (e) { e.currentTarget.parentNode.classList.toggle("open"); });
      allList.appendChild(row);
    }
  })();
})();
  </script>
</body>
</html>
