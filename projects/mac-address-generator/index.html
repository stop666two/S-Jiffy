<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAC 地址生成器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
  <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">MAC 地址生成器</h1>
    <p class="tool-desc" data-i18n="desc">生成随机 MAC 地址，支持自定义前缀、大小写和分隔符。</p>
    <div class="card" style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
      <label style="font-size:var(--font-size-sm);color:var(--color-text-secondary);" data-i18n="ui.1">前缀</label>
      <input id="prefixInput" class="input" type="text" value="" data-i18n-placeholder="ui.100" placeholder="留空随机" style="width:130px;">
      <label style="font-size:var(--font-size-sm);color:var(--color-text-secondary);" data-i18n="ui.separator">分隔符</label>
      <select id="sepSelect" class="input" style="width:auto;min-width:70px;">
        <option value=":">:</option>
        <option value="-">-</option>
        <option value="" data-i18n="ui.none">无</option>
      </select>
      <label style="font-size:var(--font-size-sm);color:var(--color-text-secondary);" data-i18n="ui.2">大小写</label>
      <select id="caseSelect" class="input" style="width:auto;min-width:70px;">
        <option value="lower" data-i18n="ui.3">小写</option>
        <option value="upper" data-i18n="ui.4">大写</option>
      </select>
      <label style="font-size:var(--font-size-sm);color:var(--color-text-secondary);" data-i18n="ui.quantity">数量</label>
      <input id="countInput" class="input" type="number" value="1" min="1" max="100" style="width:110px;">
      <button id="generateBtn" class="btn btn-primary" data-i18n="ui.generate">生成</button>
      <button id="clearBtn" class="btn btn-secondary" data-i18n="ui.clear">清空</button>
    </div>
    <div class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script></script>
  <script>(function(){
    var prefixEl = document.getElementById('prefixInput');
    var sepEl = document.getElementById('sepSelect');
    var caseEl = document.getElementById('caseSelect');
    var countEl = document.getElementById('countInput');
    var outputEl = document.getElementById('outputText');
    function randomByte() { return Math.floor(Math.random() * 256); }
    function toHex(n) { var h = n.toString(16); return h.length === 1 ? '0' + h : h; }
    function generateMac() {
      var prefix = prefixEl.value.trim();
      var sep = sepEl.value;
      var useUpper = caseEl.value === 'upper';
      var bytes = [];
      if (prefix) {
        var parts = prefix.replace(/[:\-]/g, '').match(/.{1,2}/g) || [];
        for (var i = 0; i < parts.length; i++) { bytes.push(parseInt(parts[i], 16)); }
      }
      while (bytes.length < 6) { bytes.push(randomByte()); }
      var hex = bytes.map(function(b) { return toHex(b); }).join(sep);
      return useUpper ? hex.toUpperCase() : hex;
    }
    document.getElementById('generateBtn').addEventListener('click', function() {
      var n = parseInt(countEl.value) || 1;
      if (n < 1) n = 1; if (n > 100) n = 100;
      var arr = [];
      for (var i = 0; i < n; i++) arr.push(generateMac());
      outputEl.textContent = arr.join('\n');
      setStatus(t('ui.generated','已生成 ') + n + t('ui.5',' 个 MAC 地址'));
    });
    document.getElementById('clearBtn').addEventListener('click', function() { outputEl.textContent = ''; setStatus(''); });
    document.getElementById('copyBtn').addEventListener('click', function() { if (outputEl.textContent) { copyToClipboard(outputEl.textContent, this); setStatus(t('ui.copied','已复制')); } });
  })();</script>
</body>
</html>
