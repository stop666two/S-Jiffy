<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAC 地址生成器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .dc-tabs { display: flex; gap: var(--space-1); margin-bottom: var(--space-3); }
    .dc-tabs button { flex: 1; height: 44px; font-size: var(--font-size-sm); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); cursor: pointer; transition: all .15s; }
    .dc-tabs button.active { background: var(--color-text-primary); color: #fff; border-color: var(--color-text-primary); }
    .mac-input-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .mac-input-row input { font-family: var(--font-mono); font-size: 16px; letter-spacing: 0.1em; }
    .mac-result { display: flex; align-items: center; gap: 16px; padding: var(--space-2); }
    .mac-vendor { font-size: 18px; font-weight: 600; }
    .mac-oui { font-size: 12px; color: var(--color-text-disabled); }
    .mac-empty { color: var(--color-text-disabled); text-align: center; padding: var(--space-4); }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
  <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a></header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">MAC 地址生成器</h1>
    <p class="tool-desc" data-i18n="desc">生成随机 MAC 地址（自定义前缀/大小写/分隔符），并可按 OUI 前缀查询厂商（152 条）。</p>
    <div class="dc-tabs">
      <button id="tabGen" class="active" type="button" data-i18n="ui.tabGen">生成</button>
      <button id="tabLookup" type="button" data-i18n="ui.tabLookup">查询</button>
    </div>
    <div id="panelGen">
      <div class="card" style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
        <label style="font-size:var(--font-size-sm);color:var(--color-text-secondary);" data-i18n="ui.1">前缀</label>
        <input id="prefixInput" class="input" type="text" value="" data-i18n-placeholder="ui.100" placeholder="留空随机" style="width:130px;">
        <label style="font-size:var(--font-size-sm);color:var(--color-text-secondary);" data-i18n="ui.separator">分隔符</label>
        <select id="sepSelect" class="input" style="width:auto;min-width:70px;">
          <option value=":">:</option>
          <option value="-">-</option>
          <option value="" data-i18n="ui.none">无</option>
        </select>
        <label style="font-size:var(--font-size-sm);color:var(--color-text-secondary);" data-i18n="ui.2">大小写</label>
        <select id="caseSelect" class="input" style="width:auto;min-width:70px;">
          <option value="lower" data-i18n="ui.3">小写</option>
          <option value="upper" data-i18n="ui.4">大写</option>
        </select>
        <label style="font-size:var(--font-size-sm);color:var(--color-text-secondary);" data-i18n="ui.quantity">数量</label>
        <input id="countInput" class="input" type="number" value="1" min="1" max="100" style="width:110px;">
        <button id="generateBtn" class="btn btn-primary" data-i18n="ui.generate">生成</button>
        <button id="clearBtn" class="btn btn-secondary" data-i18n="ui.clear">清空</button>
      </div>
      <div class="output-box">
        <span id="outputText" style="display:block;padding-right:60px;"></span>
        <button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button>
      </div>
    </div>
    <div id="panelLookup" style="display:none;">
      <div class="card mac-input-row">
        <input id="macInput" class="input js-focus-input" data-i18n-placeholder="lk.ph" placeholder="00:1B:44:11:22:33" style="width:260px; text-transform: uppercase;">
        <button id="lookupBtn" class="btn btn-primary" data-i18n="lk.query">查询</button>
        <button id="lkClearBtn" class="btn btn-secondary" data-i18n="ui.clear">清空</button>
      </div>
      <div class="output-box" id="outputArea" style="min-height:80px;">
        <div id="resultArea" class="mac-empty" data-i18n="lk.hint">输入 MAC 地址即可查询</div>
        <button class="copy-btn" id="lkCopyBtn" data-i18n="ui.copy">复制</button>
      </div>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>

  <script>(function(){
    /* ============ generate tab (original) ============ */
    var prefixEl = document.getElementById('prefixInput');
    var sepEl = document.getElementById('sepSelect');
    var caseEl = document.getElementById('caseSelect');
    var countEl = document.getElementById('countInput');
    var outputEl = document.getElementById('outputText');
    function randomByte() { return Math.floor(Math.random() * 256); }
    function toHex(n) { var h = n.toString(16); return h.length === 1 ? '0' + h : h; }
    function generateMac() {
      var prefix = prefixEl.value.trim();
      var sep = sepEl.value;
      var useUpper = caseEl.value === 'upper';
      var bytes = [];
      if (prefix) {
        var parts = prefix.replace(/[:\-]/g, '').match(/.{1,2}/g) || [];
        for (var i = 0; i < parts.length; i++) { bytes.push(parseInt(parts[i], 16)); }
      }
      while (bytes.length < 6) { bytes.push(randomByte()); }
      var hex = bytes.map(function(b) { return toHex(b); }).join(sep);
      return useUpper ? hex.toUpperCase() : hex;
    }
    document.getElementById('generateBtn').addEventListener('click', function() {
      var n = parseInt(countEl.value) || 1;
      if (n < 1) n = 1; if (n > 100) n = 100;
      var arr = [];
      for (var i = 0; i < n; i++) arr.push(generateMac());
      outputEl.textContent = arr.join('\n');
      setStatus(t('ui.generated','已生成 ') + n + t('ui.5',' 个 MAC 地址'));
    });
    document.getElementById('clearBtn').addEventListener('click', function() { outputEl.textContent = ''; setStatus(''); });
    document.getElementById('copyBtn').addEventListener('click', function() { if (outputEl.textContent) { copyToClipboard(outputEl.textContent, this); setStatus(t('ui.copied','已复制')); } });

    /* ============ lookup tab (merged from mac-address-lookup) ============ */
    var tabGen = document.getElementById('tabGen'), tabLookup = document.getElementById('tabLookup');
    var panelGen = document.getElementById('panelGen'), panelLookup = document.getElementById('panelLookup');
    function switchTab(which) {
      if (which === 'gen') {
        tabGen.className = 'active'; tabLookup.className = '';
        panelGen.style.display = ''; panelLookup.style.display = 'none';
      } else {
        tabLookup.className = 'active'; tabGen.className = '';
        panelLookup.style.display = ''; panelGen.style.display = 'none';
      }
    }
    tabGen.addEventListener('click', function () { switchTab('gen'); });
    tabLookup.addEventListener('click', function () { switchTab('lookup'); });

    var macInput = document.getElementById('macInput');
    var resultEl = document.getElementById('resultArea');

    function normalizeMac(s) {
      s = s.toUpperCase().replace(/[^0-9A-F]/g, '');
      if (s.length < 6) return null;
      var parts = [];
      for (var i = 0; i < s.length && i < 12; i += 2) {
        parts.push(s.substring(i, i + 2));
      }
      return parts.join(':');
    }

    function lookupOui(normalized) {
      var oui3 = normalized.substring(0, 8);
      var oui6 = normalized.substring(0, 17);
      for (var i = 0; i < OUI_DB.length; i++) {
        if (OUI_DB[i][0] === oui6) return OUI_DB[i];
      }
      for (var j = 0; j < OUI_DB.length; j++) {
        if (OUI_DB[j][0] === oui3) return OUI_DB[j];
      }
      return null;
    }

    document.getElementById('lookupBtn').addEventListener('click', function () {
      var raw = macInput.value.trim();
      if (!raw) { setStatus(t('lk.enterMac','请输入 MAC 地址'), 'error'); return; }
      var normalized = normalizeMac(raw);
      if (!normalized || normalized.length < 8) {
        resultEl.innerHTML = '<div class="mac-empty">' + t('lk.invalid','无效的 MAC 地址格式') + '</div>';
        setStatus(t('lk.formatError','格式错误'), 'error');
        return;
      }
      var found = lookupOui(normalized);
      if (found) {
        resultEl.innerHTML = '<div class="mac-result"><div><div class="mac-vendor">' + htmlEscape(found[1]) + '</div><div class="mac-oui">OUI: ' + found[0] + t('lk.fullMac',' · 完整 MAC: ') + htmlEscape(normalized) + '</div></div></div>';
        setStatus(t('lk.success','查询成功'));
      } else {
        resultEl.innerHTML = '<div class="mac-empty">' + t('lk.noFound','未找到厂商信息 (OUI: ') + htmlEscape(normalized.substring(0, 8)) + ')' + '</div>';
        setStatus(t('lk.noVendor','未匹配到厂商'), 'error');
      }
    });

    macInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('lookupBtn').click();
    });

    document.getElementById('lkClearBtn').addEventListener('click', function () { macInput.value = ''; resultEl.innerHTML = '<div class="mac-empty">' + t('lk.hint','输入 MAC 地址即可查询') + '</div>'; setStatus(''); macInput.focus(); });
    document.getElementById('lkCopyBtn').addEventListener('click', function () {
      var text = resultEl.textContent;
      if (text && text.indexOf(t('lk.enterMac','输入 MAC')) === -1 && text.trim()) { copyToClipboard(text.trim(), this); setStatus(t('ui.copied','已复制')); }
    });
  })();</script>
