<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>数学计算器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css">
<style>.math-input{position:relative;}</style></head>
<body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
<main class="tool-workspace">
<h1 data-i18n="h1">数学表达式计算</h1>
<p class="tool-desc" data-i18n="desc">支持 log、三角、反三角、双曲函数和常量的表达式求值。</p>
<div class="card"><div class="math-input"><input id="exprInput" class="input js-focus-input" type="text" placeholder="e.g. log10(100) + tanh(0.5) + asin(1)" value="2 + 2 * 3"></div></div>
<div style="display:flex;gap:12px;margin-bottom:var(--space-3);flex-wrap:wrap;">
<button id="evalBtn" class="btn btn-primary" data-i18n="ui.calc">计算</button>
<button id="clearBtn" class="btn btn-secondary" data-i18n="ui.clear">清空</button>
</div>
<div class="card" style="font-size:var(--font-size-sm);color:var(--color-text-secondary);">
<strong data-i18n="ui.1">可用函数：</strong> abs, ceil, floor, round, sqrt, cbrt, pow, exp, log, log2, log10, log1p, sin, cos, tan, asin, acos, atan, atan2, sinh, cosh, tanh, asinh, acosh, atanh, min, max, sign, trunc, PI, E, LN2, LN10, SQRT2, random()
</div>
<div class="card" style="font-size:var(--font-size-sm);color:var(--color-text-secondary);">
<strong data-i18n="ui.2">历史记录：</strong><div id="historyList" style="margin-top:4px;font-family:var(--font-mono);"></div></div>
<div class="output-box"><span id="outputText" style="display:block;padding-right:60px;"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div></main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script></script>
<script>
(function(){
  var exprInput=document.getElementById('exprInput'),outputEl=document.getElementById('outputText'),historyList=document.getElementById('historyList');
  var history=[];

  function evaluate(){
    var expr=exprInput.value.trim();if(!expr){outputEl.textContent='';return;}
    try{
      var scope={abs:Math.abs,ceil:Math.ceil,floor:Math.floor,round:Math.round,sqrt:Math.sqrt,cbrt:Math.cbrt,pow:Math.pow,exp:Math.exp,log:Math.log,log2:Math.log2,log10:Math.log10,log1p:Math.log1p,sign:Math.sign,trunc:Math.trunc,
        sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,atan2:Math.atan2,sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh,asinh:Math.asinh,acosh:Math.acosh,atanh:Math.atanh,
        min:Math.min,max:Math.max,PI:Math.PI,E:Math.E,LN2:Math.LN2,LN10:Math.LN10,SQRT2:Math.SQRT2,random:Math.random};
      var keys=[],vals=[];for(var k in scope){if(scope.hasOwnProperty(k)){keys.push(k);vals.push(scope[k]);}}
      var fn=new (Function.prototype.bind.apply(Function,[null].concat(keys,['return ('+expr+')'])));
      var result=fn.apply(null,vals);outputEl.textContent=expr+' = '+result;
      history.unshift(expr+' = '+result);if(history.length>10)history.pop();
      historyList.innerHTML=history.map(function(h){return'<div style="padding:2px 0;border-bottom:1px solid var(--color-border);">'+htmlEscape(h)+'</div>';}).join('');
      setStatus('');}
    catch(e){outputEl.textContent='';setStatus(t('ui.3','错误: ') +e.message,'error');}}

  evalBtn.addEventListener('click',evaluate);
  exprInput.addEventListener('keydown',function(e){if(e.key==='Enter')evaluate();});
  clearBtn.addEventListener('click',function(){exprInput.value='';outputEl.textContent='';setStatus('');exprInput.focus();});
  copyBtn.addEventListener('click',function(){var t=outputEl.textContent;if(t){copyToClipboard(t,copyBtn);setStatus(t('ui.copied','已复制'));}});
  evaluate();
})();
</script></body></html>
