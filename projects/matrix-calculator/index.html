<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>矩阵计算器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .mtx-row { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-2); }
    .mtx-col { display: flex; flex-direction: column; gap: var(--space-1); flex: 1; min-width: 220px; }
    .mtx-col label { font-size: var(--font-size-sm); color: var(--color-text-secondary); }
    .mtx-col .textarea { font-family: var(--font-mono); min-height: 120px; resize: vertical; }
    .op-row { display: flex; align-items: flex-end; gap: var(--space-2); margin-bottom: var(--space-2); flex-wrap: wrap; }
    .op-row label { font-size: var(--font-size-sm); color: var(--color-text-secondary); display: block; margin-bottom: 4px; }
    .op-row .input { width: 180px; }
    .res-label { font-size: var(--font-size-sm); color: var(--color-text-secondary); display: block; margin-bottom: var(--space-1); }
    .matrix-out { font-family: var(--font-mono); font-size: var(--font-size-base); color: var(--color-text-primary); white-space: pre; line-height: 1.6; }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">矩阵计算器</h1>
    <p class="tool-desc" data-i18n="desc">输入矩阵执行转置、行列式、逆矩阵、乘法、加法与减法运算，结果精确到 6 位小数。</p>
    <div class="card">
      <p class="tool-desc" style="margin-bottom:var(--space-2);font-size:var(--font-size-sm);" data-i18n="matrixHint">用换行分隔行，用空格或逗号分隔列。</p>
      <div class="mtx-row">
        <div class="mtx-col">
          <label for="matA">矩阵 A</label>
          <textarea id="matA" class="input textarea js-focus-input" placeholder="1 2 3&#10;4 5 6&#10;7 8 9"></textarea>
        </div>
        <div class="mtx-col" id="matBCol" style="display:none;">
          <label for="matB">矩阵 B</label>
          <textarea id="matB" class="input textarea" placeholder="9 8 7&#10;6 5 4&#10;3 2 1"></textarea>
        </div>
      </div>
      <div class="op-row">
        <div>
          <label for="opSelect">操作</label>
          <select id="opSelect" class="input">
            <option value="transpose">转置 A</option>
            <option value="transpose-b">转置 B</option>
            <option value="determinant">行列式</option>
            <option value="inverse">逆矩阵</option>
            <option value="multiply">矩阵 × 矩阵</option>
            <option value="add">加法 A + B</option>
            <option value="subtract">减法 A - B</option>
          </select>
        </div>
        <button class="btn btn-primary" id="calcBtn">计算</button>
      </div>
    </div>
    <div id="resultBox" class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="common.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>
    (function () {
      var matAEl = document.getElementById('matA');
      var matBEl = document.getElementById('matB');
      var matBCol = document.getElementById('matBCol');
      var opEl = document.getElementById('opSelect');
      var calcBtn = document.getElementById('calcBtn');
      var outputText = document.getElementById('outputText');
      var copyBtn = document.getElementById('copyBtn');

      calcBtn.textContent = t('calculate', '计算');
      matBCol.querySelector('label').textContent = t('matrixB', '矩阵 B');
      matAEl.placeholder = t('matrixPlaceholderA', '1 2 3\n4 5 6\n7 8 9');
      matBEl.placeholder = t('matrixPlaceholderB', '9 8 7\n6 5 4\n3 2 1');

      function round6(v) {
        var r = Math.round(v * 1e6) / 1e6;
        if (Math.abs(r) < 5e-7) r = 0;
        return r;
      }

      function parseMatrix(text) {
        var lines = String(text).split(/\r?\n/);
        var rows = [];
        var i, j, parts, row;
        for (i = 0; i < lines.length; i++) {
          parts = lines[i].trim().split(/[,\s]+/);
          if (parts.length === 1 && parts[0] === '') continue;
          row = [];
          for (j = 0; j < parts.length; j++) {
            if (parts[j] === '') continue;
            if (!/^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(parts[j])) {
              return { error: t('rowNonNumeric', '第 ') + (i + 1) + t('rowNonNumeric2', ' 行包含非数字："') + parts[j] + '"' };
            }
            row.push(parseFloat(parts[j]));
          }
          rows.push(row);
        }
        if (rows.length === 0) return { error: t('emptyMatrix', '矩阵不能为空') };
        var cols = rows[0].length;
        for (i = 0; i < rows.length; i++) {
          if (rows[i].length === 0) return { error: t('emptyRow', '第 ') + (i + 1) + t('rowEmpty', ' 行为空') };
          if (rows[i].length !== cols) {
            return { error: t('colMismatch', '各行列数不一致：第 1 行 ') + cols + t('colMismatch2', ' 列，第 ') + (i + 1) + t('colMismatch3', ' 行 ') + rows[i].length + t('colMismatch4', ' 列') };
          }
        }
        return { data: rows };
      }

      function minorMat(m, skipRow, skipCol) {
        var out = [], i, j, row;
        for (i = 0; i < m.length; i++) {
          if (i === skipRow) continue;
          row = [];
          for (j = 0; j < m[i].length; j++) {
            if (j !== skipCol) row.push(m[i][j]);
          }
          out.push(row);
        }
        return out;
      }

      function determinant(m) {
        var n = m.length, j, sign;
        if (n === 1) return m[0][0];
        if (n === 2) return m[0][0] * m[1][1] - m[0][1] * m[1][0];
        var det = 0;
        for (j = 0; j < n; j++) {
          sign = j % 2 === 0 ? 1 : -1;
          det += sign * m[0][j] * determinant(minorMat(m, 0, j));
        }
        return det;
      }

      function cofactorMat(m) {
        var n = m.length, out = [], i, j, sign, row;
        for (i = 0; i < n; i++) {
          row = [];
          for (j = 0; j < n; j++) {
            sign = (i + j) % 2 === 0 ? 1 : -1;
            row.push(sign * determinant(minorMat(m, i, j)));
          }
          out.push(row);
        }
        return out;
      }

      function transpose(m) {
        var out = [], j, i, row;
        for (j = 0; j < m[0].length; j++) {
          row = [];
          for (i = 0; i < m.length; i++) row.push(m[i][j]);
          out.push(row);
        }
        return out;
      }

      function inverse(m) {
        var det = determinant(m);
        if (Math.abs(det) < 1e-12) return { error: t('singular', '矩阵不可逆（行列式为 0）') };
        var cof = cofactorMat(m);
        var adj = transpose(cof);
        var out = [], i, j, row;
        for (i = 0; i < adj.length; i++) {
          row = [];
          for (j = 0; j < adj[i].length; j++) row.push(round6(adj[i][j] / det));
          out.push(row);
        }
        return { data: out };
      }

      function addMat(a, b) {
        var out = [], i, j, row;
        for (i = 0; i < a.length; i++) {
          row = [];
          for (j = 0; j < a[i].length; j++) row.push(round6(a[i][j] + b[i][j]));
          out.push(row);
        }
        return out;
      }

      function subMat(a, b) {
        var out = [], i, j, row;
        for (i = 0; i < a.length; i++) {
          row = [];
          for (j = 0; j < a[i].length; j++) row.push(round6(a[i][j] - b[i][j]));
          out.push(row);
        }
        return out;
      }

      function mulMat(a, b) {
        var out = [], i, j, k, sum, row;
        for (i = 0; i < a.length; i++) {
          row = [];
          for (j = 0; j < b[0].length; j++) {
            sum = 0;
            for (k = 0; k < a[i].length; k++) sum += a[i][k] * b[k][j];
            row.push(round6(sum));
          }
          out.push(row);
        }
        return out;
      }

      function fmtNum(v) {
        var r = round6(v);
        if (!isFinite(r)) return r > 0 ? 'Infinity' : '-Infinity';
        if (Math.abs(r) < 1e-9 && r !== 0) return r.toExponential(6);
        return String(r);
      }

      function fmtMat(m) {
        var widths = [], str = [], i, j, s, line;
        for (j = 0; j < m[0].length; j++) widths.push(0);
        for (i = 0; i < m.length; i++) {
          line = [];
          for (j = 0; j < m[i].length; j++) {
            s = fmtNum(m[i][j]);
            line.push(s);
            if (s.length > widths[j]) widths[j] = s.length;
          }
          str.push(line);
        }
        var lines = [];
        for (i = 0; i < str.length; i++) {
          line = [];
          for (j = 0; j < str[i].length; j++) {
            while (str[i][j].length < widths[j]) str[i][j] = ' ' + str[i][j];
            line.push(str[i][j]);
          }
          lines.push(line.join('  '));
        }
        return lines.join('\n');
      }

      function renderResult(text) {
        outputText.innerHTML = '<span class="res-label">' + t('result', '结果') + '</span><span class="matrix-out">' + htmlEscape(text) + '</span>';
      }

      function run() {
        var op = opEl.value;
        var needB = op === 'multiply' || op === 'add' || op === 'subtract';
        matBCol.style.display = needB ? '' : 'none';
        if (matAEl.value.trim() === '') {
          outputText.innerHTML = '';
          setStatus('');
          return;
        }
        var pa = parseMatrix(matAEl.value);
        if (pa.error) { setStatus(pa.error, 'error'); return; }
        var a = pa.data;

        if (op === 'transpose') {
          renderResult(fmtMat(transpose(a)));
          setStatus(t('done', '计算完成'));
          return;
        }
        if (op === 'transpose-b') {
          if (matBEl.value.trim() === '') { setStatus(t('needMatrixB', '请填写矩阵 B'), 'error'); return; }
          var pb2 = parseMatrix(matBEl.value);
          if (pb2.error) { setStatus(pb2.error, 'error'); return; }
          renderResult(fmtMat(transpose(pb2.data)));
          setStatus(t('done', '计算完成'));
          return;
        }

        if (needB) {
          if (matBEl.value.trim() === '') { setStatus(t('needMatrixB', '请填写矩阵 B'), 'error'); return; }
          var pb = parseMatrix(matBEl.value);
          if (pb.error) { setStatus(pb.error, 'error'); return; }
          var b = pb.data;
          if (op === 'add' || op === 'subtract') {
            if (a.length !== b.length || a[0].length !== b[0].length) {
              setStatus(t('dimMismatch', '加减运算要求两矩阵尺寸相同：A 为 ') + a.length + '×' + a[0].length + t('dimMismatch2', '，B 为 ') + b.length + '×' + b[0].length, 'error');
              return;
            }
            var res2 = op === 'add' ? addMat(a, b) : subMat(a, b);
            renderResult(fmtMat(res2));
            setStatus(t('done', '计算完成'));
            return;
          }
          if (a[0].length !== b.length) {
            setStatus(t('mulMismatch', '乘法要求 A 的列数等于 B 的行数：A 为 ') + a.length + '×' + a[0].length + t('dimMismatch2', '，B 为 ') + b.length + '×' + b[0].length, 'error');
            return;
          }
          var res3 = mulMat(a, b);
          renderResult(fmtMat(res3));
          setStatus(t('done', '计算完成'));
          return;
        }

        if (a.length !== a[0].length) {
          setStatus(t('needSquare', '该操作要求方阵：当前为 ') + a.length + '×' + a[0].length, 'error');
          return;
        }
        if (op === 'determinant') {
          var det = determinant(a);
          outputText.innerHTML = '<span class="res-label">' + t('detLabel', '行列式 det(A)') + '</span><span class="matrix-out">' + htmlEscape(fmtNum(det)) + '</span>';
          setStatus(t('done', '计算完成'));
          return;
        }
        if (op === 'inverse') {
          var inv = inverse(a);
          if (inv.error) { outputText.innerHTML = ''; setStatus(inv.error, 'error'); return; }
          renderResult(fmtMat(inv.data));
          setStatus(t('done', '计算完成'));
        }
      }

      opEl.addEventListener('change', run);
      calcBtn.addEventListener('click', run);
      copyBtn.addEventListener('click', function () {
        copyToClipboard(outputText.textContent.trim(), copyBtn);
      });
    })();
  </script>
</body>
</html>
