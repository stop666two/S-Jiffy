      var max = 200;
      var shown = 0;
      for (var i = 0; i < list.length; i++) {
        if (shown >= max) { break; }
        var it = list[i];
        html += '<div class="my-item' + (randomMark && i === 0 ? ' my-random' : '') + '"><span data-copy="' + htmlEscape(it[0] + '——' + it[1]) + '"><span class="my-text">' + htmlEscape(it[0]) + '</span><span class="my-author">—— ' + htmlEscape(it[1]) + '</span></span></div>';
        copyLines.push(it[0] + '——' + it[1]);
        shown++;
      }
      if (list.length > max) {
        html += '<div class="my-more">共 ' + list.length + t('ui.11',' 条，仅显示前 ') + max + ' 条，请补充关键词缩小范围。</div>';
      }
      outputText.innerHTML = html;
      lastCopyText = copyLines.join('\n');
      lastRows = outputText.querySelectorAll('span[data-copy]');
      bindRows();
      copyBtn.style.display = 'block';
    }

    function bindRows() {
      for (var i = 0; i < lastRows.length; i++) {
        lastRows[i].onclick = (function (el) {
          return function () { copyToClipboard(el.getAttribute('data-copy'), el); };
        })(lastRows[i]);
      }
    }

    function doSearch() {
      var kw = searchInput.value.trim();
      if (!kw) {
        setStatus(t('ui.100','请输入关键词'), 'error');
        return;
      }
      var list = [];
      for (var i = 0; i < DATA.length; i++) {
        var it = DATA[i];
        if (it[0].indexOf(kw) !== -1 || it[1].indexOf(kw) !== -1) {
          list.push(it);
        }
      }
      render(list, false);
      if (list.length) { setStatus(t('ui.10','找到 ') + list.length + t('ui.9',' 条匹配结果')); }
    }

    function doRandom() {
      var idx = Math.floor(Math.random() * DATA.length);
      render([DATA[idx]], true);
      setStatus(t('ui.8','随机抽取第 ') + (idx + 1) + t('ui.7',' 条，点击条目可复制'));
    }

    searchBtn.onclick = doSearch;
    randomBtn.onclick = doRandom;
    searchInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { doSearch(); }
    });
    copyBtn.onclick = function () {
      if (lastCopyText) { copyToClipboard(lastCopyText, copyBtn); }
    };

    totalText.textContent = t('ui.6','共收录 ') + DATA.length + t('ui.5',' 条名言');
    setStatus(t('ui.4','已加载 ') + DATA.length + t('ui.3',' 条数据'));
  })();
  </script>
</body>
</html>
