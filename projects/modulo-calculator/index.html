<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模运算计算器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .mc-row { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-bottom:var(--space-3); }
    .mc-row .field { flex:1; min-width:80px; }
    .mc-row label { display:block; font-size:var(--font-size-sm); color:var(--color-text-secondary); margin-bottom:4px; }
  </style>
</head>
<body>
  <header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">模运算计算器</h1>
    <p class="tool-desc" data-i18n="desc">计算 a mod b、模逆元和模幂运算。</p>
    <div class="card">
      <div class="mc-row">
        <div class="field"><label for="aVal" data-i18n="ui.1">a（底数）</label><input id="aVal" class="input" type="number" value="7"></div>
        <div class="field"><label for="bVal" data-i18n="ui.2">b（模数）</label><input id="bVal" class="input" type="number" value="26"></div>
      </div>
      <div class="mc-row" id="powRow" style="display:none;">
        <div class="field"><label for="expVal" data-i18n="ui.3">指数 (mod pow)</label><input id="expVal" class="input" type="number" value="3" min="0"></div>
      </div>
      <div class="mc-row">
        <label style="display:flex;align-items:center;gap:8px;"><input id="showPowChk" type="checkbox"> 模幂运算</label>
      </div>
      <div><button id="genBtn" class="btn btn-primary" data-i18n="ui.calc">计算</button></div>
    </div>
    <div class="output-box"><span id="outputText" style="display:block;padding-right:60px;"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
  </main>
  <footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>(function(){
    var aEl = document.getElementById('aVal');
    var bEl = document.getElementById('bVal');
    var expEl = document.getElementById('expVal');
    var showPowChk = document.getElementById('showPowChk');
    var powRow = document.getElementById('powRow');
    var genBtn = document.getElementById('genBtn');
    var outputEl = document.getElementById('outputText');
    var copyBtn = document.getElementById('copyBtn');

    showPowChk.addEventListener('change', function() {
      powRow.style.display = showPowChk.checked ? 'flex' : 'none';
    });

    function gcd(a, b) {
      a = Math.abs(a);
      b = Math.abs(b);
      while (b) { var t = b; b = a % b; a = t; }
      return a;
    }

    function modInverse(a, m) {
      a = ((a % m) + m) % m;
      for (var x = 1; x < m; x++) {
        if ((a * x) % m === 1) return x;
      }
      return null;
    }

    function modPow(base, exp, mod) {
      var result = 1;
      base = base % mod;
      while (exp > 0) {
        if (exp % 2 === 1) result = (result * base) % mod;
        exp = Math.floor(exp / 2);
        base = (base * base) % mod;
      }
      return result;
    }

    function generate() {
      var a = parseInt(aEl.value, 10);
      var b = parseInt(bEl.value, 10);
      if (isNaN(a) || isNaN(b)) { setStatus(t('ui.100','请输入有效数字'), 'error'); return; }
      if (b === 0) { setStatus(t('ui.101','模数不能为 0'), 'error'); return; }

      var modVal = ((a % b) + b) % b;
      var inv = modInverse(a, b);
      var output = 'a = ' + a + ', b = ' + b + '\n';
      output += '\na mod b = ' + a + ' % ' + b + ' = ' + modVal + '\n';
      output += '\n模逆元: ' + a + '⁻¹ mod ' + b + ' = ';
      if (inv === null) {
        output += '不存在（gcd(' + a + ', ' + b + ') = ' + gcd(a, b) + ' ≠ 1）';
      } else {
        output += inv + ' (验证: ' + a + ' × ' + inv + ' % ' + b + ' = ' + (a * inv % b) + ')';
      }

      if (showPowChk.checked) {
        var exp = parseInt(expEl.value, 10) || 0;
        if (exp < 0) exp = 0;
        var pow结果 = modPow(a, exp, b);
        output += '\n\n模幂运算: ' + a + '^' + exp + ' mod ' + b + ' = ' + pow结果;
      }

      outputEl.textContent = output;
      setStatus(t('ui.calcDone','计算完成'));
    }

    genBtn.addEventListener('click', generate);
    copyBtn.addEventListener('click', function() { if (outputEl.textContent) { copyToClipboard(outputEl.textContent, copyBtn); setStatus(t('ui.copied','已复制')); } });
  })();</script>
</body>
</html>
