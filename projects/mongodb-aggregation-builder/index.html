<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MongoDB 聚合管道构建器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .step-row { border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-2); margin-bottom: var(--space-2); background: var(--color-bg); }
    .step-row.invalid { border-color: var(--color-error); }
    .step-head { display: -webkit-box; display: -ms-flexbox; display: flex; -webkit-box-align: center; -ms-flex-align: center; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); -ms-flex-wrap: wrap; flex-wrap: wrap; }
    .step-no { font-size: var(--font-size-sm); color: var(--color-text-secondary); min-width: 48px; }
    .step-head .input { width: 170px; }
    .step-actions { margin-left: auto; display: -webkit-box; display: -ms-flexbox; display: flex; gap: var(--space-1); }
    .step-row textarea { width: 100%; -webkit-box-sizing: border-box; box-sizing: border-box; min-height: 72px; font-family: var(--font-mono); font-size: var(--font-size-sm); resize: vertical; }
    .step-desc { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-top: var(--space-1); line-height: 1.5; }
    .op-toolbar { display: -webkit-box; display: -ms-flexbox; display: flex; gap: var(--space-2); margin-bottom: var(--space-2); }
    .out-block { margin-bottom: var(--space-2); }
    .out-label { font-size: var(--font-size-sm); font-weight: 600; margin-bottom: var(--space-1); color: var(--color-text-primary); }
    pre.code { background: var(--color-bg-soft); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-2); font-family: var(--font-mono); font-size: var(--font-size-sm); white-space: pre-wrap; word-break: break-all; max-height: 420px; overflow-y: auto; margin: 0; }
    .explain-list { list-style: none; padding: 0; margin: 0; }
    .explain-list li { font-size: var(--font-size-sm); color: var(--color-text-primary); padding: var(--space-1) 0; border-bottom: 1px solid var(--color-border); line-height: 1.5; }
    .explain-list li:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <a href="../../index.html" class="back-btn">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1>MongoDB 聚合管道构建器</h1>
    <p class="tool-desc">可视化编排 $match / $group / $lookup 等聚合阶段，实时生成管道代码与逐步说明。</p>
    <div class="card">
      <div class="op-toolbar">
        <button class="btn btn-primary" id="addStepBtn">+ 添加步骤</button>
        <button class="btn btn-secondary" id="clearBtn">清空全部</button>
      </div>
      <div id="stepList"></div>
      <p class="tool-desc" id="stepHint">每个步骤选择一个聚合操作符，并填写其 JSON 参数（保持参数为 JSON 对象）。</p>
    </div>
    <div id="resultBox" class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div>S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script>
  (function () {
    var OPS = [
      { value: '$match', label: '$match 筛选', desc: '筛选符合条件的文档（相当于 SQL WHERE）' },
      { value: '$group', label: '$group 分组', desc: '按 _id 分组并计算聚合表达式（相当于 GROUP BY）' },
      { value: '$sort', label: '$sort 排序', desc: '按字段排序，1 升序，-1 降序' },
      { value: '$project', label: '$project 投影', desc: '选择 / 重塑输出的字段' },
      { value: '$limit', label: '$limit 限制', desc: '仅保留前 N 条文档' },
      { value: '$skip', label: '$skip 跳过', desc: '跳过前 N 条文档' },
      { value: '$unwind', label: '$unwind 展开', desc: '将数组字段拆分为多条文档' },
      { value: '$lookup', label: '$lookup 关联', desc: '关联查询其他集合（相当于 LEFT JOIN）' },
      { value: '$addFields', label: '$addFields 加字段', desc: '为文档添加 / 覆盖字段' }
    ];
    var DEFAULTS = {
      '$match': '{ "status": "active" }',
      '$group': '{ "_id": "$category", "count": { "$sum": 1 } }',
      '$sort': '{ "createdAt": -1 }',
      '$project': '{ "title": 1, "price": 1, "_id": 0 }',
      '$limit': '{ "n": 10 }',
      '$skip': '{ "n": 20 }',
      '$unwind': '{ "path": "$tags" }',
      '$lookup': '{ "from": "orders", "localField": "_id", "foreignField": "userId", "as": "orders" }',
      '$addFields': '{ "total": { "$multiply": ["$price", "$qty"] } }'
    };

    var stepList = document.getElementById('stepList');
    var outputText = document.getElementById('outputText');
    var copyBtn = document.getElementById('copyBtn');
    var stepHint = document.getElementById('stepHint');
    var steps = [
      { op: '$match', text: DEFAULTS['$match'] },
      { op: '$group', text: DEFAULTS['$group'] }
    ];

    function getOpLabel(op) {
      for (var i = 0; i < OPS.length; i++) {
        if (OPS[i].value === op) return OPS[i].label;
      }
      return op;
    }

    function getOpDesc(op) {
      for (var i = 0; i < OPS.length; i++) {
        if (OPS[i].value === op) return OPS[i].desc;
      }
      return '';
    }

    function parseJson(text) {
      try {
        return JSON.parse(text);
      } catch (e) {
        return null;
      }
    }

    function explainStep(step) {
      var obj = parseJson(step.text);
      var base = getOpDesc(step.op);
      if (!obj) return base;
      var extra = '';
      if (step.op === '$match') {
        extra = '（条件字段：' + Object.keys(obj).join('、') + '）';
      } else if (step.op === '$sort') {
        var dirs = [];
        var keys = Object.keys(obj);
        for (var i = 0; i < keys.length; i++) {
          dirs.push(keys[i] + ' ' + (obj[keys[i]] < 0 ? '降序' : '升序'));
        }
        extra = '（' + dirs.join('，') + '）';
      } else if (step.op === '$group') {
        extra = '（按 ' + String(obj['_id'] || '自定义键') + ' 分组）';
      } else if (step.op === '$project') {
        extra = '（输出字段：' + Object.keys(obj).join('、') + '）';
      } else if (step.op === '$limit' || step.op === '$skip') {
        var n = obj['n'] !== undefined ? obj['n'] : (obj[step.op.replace('$', '')] !== undefined ? obj[step.op.replace('$', '')] : '');
        if (n !== '') extra = '（数量：' + n + '）';
      } else if (step.op === '$unwind') {
        extra = '（路径：' + String(obj['path'] || obj['$unwind'] || '') + '）';
      } else if (step.op === '$lookup') {
        extra = '（关联集合 ' + String(obj['from'] || '?') + '，' + String(obj['localField'] || '?') + ' = ' + String(obj['foreignField'] || '?') + '）';
      } else if (step.op === '$addFields') {
        extra = '（新增字段：' + Object.keys(obj).join('、') + '）';
      }
      return base + extra;
    }

    function buildPipeline() {
      var pipeline = [];
      for (var i = 0; i < steps.length; i++) {
        var obj = parseJson(steps[i].text);
        var stage = {};
        stage[steps[i].op] = obj;
        pipeline.push(stage);
      }
      return pipeline;
    }

    function render() {
      var html = '';
      for (var i = 0; i < steps.length; i++) {
        var s = steps[i];
        var valid = parseJson(s.text) !== null;
        html += '<div class="step-row' + (valid ? '' : ' invalid') + '" id="step_' + i + '">'
          + '<div class="step-head">'
          + '<span class="step-no">步骤 ' + (i + 1) + '</span>'
          + '<select class="input" data-idx="' + i + '" data-role="op">';
        for (var o = 0; o < OPS.length; o++) {
          html += '<option value="' + htmlEscape(OPS[o].value) + '"' + (OPS[o].value === s.op ? ' selected' : '') + '>' + htmlEscape(OPS[o].label) + '</option>';
        }
        html += '</select>'
          + '<span class="step-actions">'
          + '<button class="btn btn-secondary" data-idx="' + i + '" data-role="up"' + (i === 0 ? ' disabled' : '') + '>上移</button>'
          + '<button class="btn btn-secondary" data-idx="' + i + '" data-role="down"' + (i === steps.length - 1 ? ' disabled' : '') + '>下移</button>'
          + '<button class="btn btn-secondary" data-idx="' + i + '" data-role="del"' + (steps.length === 1 ? ' disabled' : '') + '>删除</button>'
          + '</span>'
          + '</div>'
          + '<textarea class="input textarea" data-idx="' + i + '" data-role="json" placeholder="' + htmlEscape(DEFAULTS[s.op] || '{}') + '">' + htmlEscape(s.text) + '</textarea>'
          + '<div class="step-desc">' + htmlEscape(explainStep(s)) + '</div>'
          + '</div>';
      }
      stepList.innerHTML = html;
      stepHint.textContent = steps.length === 0 ? '当前没有步骤，点击「添加步骤」开始构建。' : '共 ' + steps.length + ' 个步骤，参数以 JSON 对象书写。';
      bindEvents();
      updateOutput();
    }

    function bindEvents() {
      var selects = stepList.querySelectorAll('select[data-role="op"]');
      for (var i = 0; i < selects.length; i++) {
        selects[i].onchange = (function (el) {
          return function () {
            var idx = Number(el.getAttribute('data-idx'));
            steps[idx].op = el.value;
            if (!parseJson(steps[idx].text)) {
              steps[idx].text = DEFAULTS[el.value] || '{}';
            }
            render();
          };
        })(selects[i]);
      }
      var textareas = stepList.querySelectorAll('textarea[data-role="json"]');
      for (var j = 0; j < textareas.length; j++) {
        textareas[j].oninput = (function (el) {
          return function () {
            var idx = Number(el.getAttribute('data-idx'));
            steps[idx].text = el.value;
            render();
          };
        })(textareas[j]);
      }
      var buttons = stepList.querySelectorAll('button[data-role]');
      for (var k = 0; k < buttons.length; k++) {
        buttons[k].onclick = (function (el) {
          return function () {
            var idx = Number(el.getAttribute('data-idx'));
            var role = el.getAttribute('data-role');
            if (role === 'up' && idx > 0) {
              var t = steps[idx - 1];
              steps[idx - 1] = steps[idx];
              steps[idx] = t;
            } else if (role === 'down' && idx < steps.length - 1) {
              var u = steps[idx + 1];
              steps[idx + 1] = steps[idx];
              steps[idx] = u;
            } else if (role === 'del' && steps.length > 1) {
              steps.splice(idx, 1);
            }
            render();
          };
        })(buttons[k]);
      }
    }

    function updateOutput() {
      if (steps.length === 0) {
        outputText.textContent = '';
        setStatus('请先添加至少一个步骤', 'error');
        return;
      }
      var invalidIdx = -1;
      for (var i = 0; i < steps.length; i++) {
        if (!parseJson(steps[i].text)) {
          invalidIdx = i;
          break;
        }
      }
      if (invalidIdx !== -1) {
        outputText.textContent = '第 ' + (invalidIdx + 1) + ' 步的参数不是合法的 JSON，请检查后再生成管道。';
        setStatus('第 ' + (invalidIdx + 1) + ' 步 JSON 无效', 'error');
        return;
      }
      var pipeline = buildPipeline();
      var code = JSON.stringify(pipeline, null, 2);
      var lines = ['聚合管道（' + steps.length + ' 个阶段）：'];
      for (var j = 0; j < steps.length; j++) {
        lines.push((j + 1) + '. ' + getOpLabel(steps[j].op) + ' — ' + explainStep(steps[j]));
      }
      outputText.textContent = '```\n' + code + '\n```\n\n' + lines.join('\n');
      setStatus('管道已生成');
    }

    document.getElementById('addStepBtn').onclick = function () {
      steps.push({ op: '$project', text: DEFAULTS['$project'] });
      render();
    };
    document.getElementById('clearBtn').onclick = function () {
      steps = [{ op: '$match', text: DEFAULTS['$match'] }];
      render();
    };
    copyBtn.onclick = function () {
      var pipeline = [];
      var ok = true;
      for (var i = 0; i < steps.length; i++) {
        var obj = parseJson(steps[i].text);
        if (!obj) { ok = false; break; }
        var stage = {};
        stage[steps[i].op] = obj;
        pipeline.push(stage);
      }
      if (!ok || steps.length === 0) {
        setStatus('存在无效步骤，无法复制', 'error');
        return;
      }
      copyToClipboard(JSON.stringify(pipeline, null, 2), copyBtn);
    };
    render();
  })();
  </script>
</body>
</html>
