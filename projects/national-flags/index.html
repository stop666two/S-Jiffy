<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>世界各国国旗 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .fl-controls { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; margin-bottom: var(--space-2); }
    .fl-controls input { width: 200px; }
    .fl-filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .fl-filters button { font-size: var(--font-size-xs); font-family: var(--font-mono); padding: 5px 10px; border: 1px solid var(--color-border); border-radius: 9999px; background: transparent; cursor: pointer; color: var(--color-text-secondary); transition: all 0.15s; }
    .fl-filters button:hover { border-color: var(--color-text-primary); color: var(--color-text-primary); }
    .fl-filters button.active { background: var(--color-text-primary); color: #fff; border-color: var(--color-text-primary); }
    .fl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: var(--space-2); }
    .fl-card { border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-2); text-align: center; transition: border-color 0.15s, background 0.15s; }
    .fl-card:hover { border-color: var(--color-text-primary); background: var(--color-bg-soft); }
    .fl-card .fl-flag { font-size: 44px; line-height: 1.3; }
    .fl-card .fl-name { font-size: var(--font-size-sm); margin-top: 4px; word-break: break-all; }
    .fl-card.china { border-color: var(--color-accent); background: var(--color-bg-soft); }
    .fl-card.china .fl-name { color: var(--color-accent-hover); font-weight: 600; }
    .fl-none { font-size: var(--font-size-sm); color: var(--color-text-secondary); padding: var(--space-3) 0; text-align: center; }
    .fl-total { font-size: var(--font-size-xs); color: var(--color-text-disabled); margin-top: var(--space-2); }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a>

  <main class="tool-workspace">
    <h1 data-i18n="h1">世界各国国旗</h1>

    <div class="card">
      <div class="fl-controls">
        <input id="searchInput" class="input js-focus-input" type="text" data-i18n-placeholder="ui.101" placeholder="搜索国名，如：中国、法国、巴西">
        <div class="fl-filters" id="filterBox"></div>
      </div>
      <div class="fl-total" id="totalText"></div>
    </div>
    <div class="card">
      <div id="gridBox"></div>
    </div>
  </main>
  <footer class="tool-status" id="statusBar"></footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>

,["瑞士","CH","欧洲"],["挪威","NO","欧洲"],["英国","GB","欧洲"],["希腊","GR","欧洲"],["瑞典","SE","欧洲"],["俄罗斯","RU","欧洲"],["爱尔兰","IE","欧洲"],["安道尔","AD","欧洲"],["奥地利","AT","欧洲"],["卢森堡","LU","欧洲"],["比利时","BE","欧洲"],["梵蒂冈","VA","欧洲"],["马耳他","MT","欧洲"],["摩纳哥","MC","欧洲"],["西班牙","ES","欧洲"],["乌克兰","UA","欧洲"],["葡萄牙","PT","欧洲"],["立陶宛","LT","欧洲"],["意大利","IT","欧洲"],["匈牙利","HU","欧洲"],["白俄罗斯","BY","欧洲"],["所罗门群岛","SB","大洋洲"],["南斯拉夫","","欧洲"],["克罗地亚","HR","欧洲"],["拉脱维亚","LV","欧洲"],["爱沙尼亚","EE","欧洲"],["保加利亚","BG","欧洲"],["罗马尼亚","RO","欧洲"],["摩尔多瓦","MD","欧洲"],["斯洛伐克","SK","欧洲"],["斯洛文尼亚","SI","欧洲"],["阿尔巴尼亚","AL","欧洲"],["列支敦士登","LI","欧洲"],["智利","CL","美洲"],["古巴","CU","美洲"],["美国","US","美洲"],["海地","HT","美洲"],["巴西","BR","美洲"],["圭亚那","GY","美洲"],["委内瑞拉","VE","美洲"],["安提瓜和巴布达","AG","美洲"],["阿根廷","AR","美洲"],["伯利兹","BZ","美洲"],["巴哈马","BS","美洲"],["巴拿马","PA","美洲"],["巴拉圭","PY","美洲"],["墨西哥","MX","美洲"],["苏里南","SR","美洲"],["加拿大","CA","美洲"],["乌拉圭","UY","美洲"],["厄瓜多尔","EC","美洲"],["格林纳达","GD","美洲"],["洪都拉斯","HN","美洲"],["多米尼加","DO","美洲"],["玻利维亚","BO","美洲"],["秘鲁","PE","美洲"],["牙买加","JM","美洲"],["危地马拉","GT","美洲"],["圣卢西亚","LC","美洲"],["多米尼克","DM","美洲"],["哥斯达黎加","CR","美洲"],["圣基茨和尼维斯","KN","美洲"],["尼加拉瓜","NI","美洲"],["哥伦比亚","CO","美洲"],["特立尼达和多巴哥","TT","美洲"],["圣文森特和格林纳丁斯","VC","美洲"],["巴巴多斯","BB","美洲"],["瑙鲁","NR","大洋洲"],["纽埃","NU","大洋洲"],["巴新","PG","大洋洲"],["斐济","FJ","大洋洲"],["汤加","TO","大洋洲"],["帕劳","PW","大洋洲"],["萨摩亚","WS","大洋洲"],["新西兰","NZ","大洋洲"],["瓦努阿图","VU","大洋洲"],["图瓦卢","TV","大洋洲"],["澳大利亚","AU","大洋洲"],["基里巴斯","KI","大洋洲"],["库克群岛","CK","大洋洲"],["马绍尔群岛","MH","大洋洲"],["密克罗尼西亚","FM","大洋洲"]];
    var searchInput = document.getElementById('searchInput');
    var filterBox = document.getElementById('filterBox');
    var totalText = document.getElementById('totalText');
    var gridBox = document.getElementById('gridBox');
    var curFilter = 'all';

    var conts = [
      { key: 'all', name: t('ui.all','全部') },
      { key: '亚洲', name: t('ui.9','亚洲') },
      { key: '非洲', name: t('ui.8','非洲') },
      { key: '欧洲', name: t('ui.7','欧洲') },
      { key: '美洲', name: t('ui.6','美洲') },
      { key: '大洋洲', name: t('ui.5','大洋洲') }
    ];

    function flagEmoji(code) {
      if (!code || code.length !== 2) { return '\uD83C\uDFF4'; }
      var a = code.toUpperCase().charCodeAt(0) - 65;
      var b = code.toUpperCase().charCodeAt(1) - 65;
      return String.fromCharCode(0xD83C, 0xDDE6 + a) +
             String.fromCharCode(0xD83C, 0xDDE6 + b);
    }

    function countOf(key) {
      if (key === 'all') { return DATA.length; }
      var n = 0;
      for (var i = 0; i < DATA.length; i++) {
        if (DATA[i][2] === key) { n++; }
      }
      return n;
    }

    function buildFilters() {
      var html = '';
      for (var i = 0; i < conts.length; i++) {
        var c = conts[i];
        html += '<button data-k="' + c.key + '"' + (c.key === curFilter ? ' class="active"' : '') + '>' + htmlEscape(c.name + ' ' + countOf(c.key)) + '</button>';
      }
      filterBox.innerHTML = html;
      var btns = filterBox.getElementsByTagName('button');
      for (var j = 0; j < btns.length; j++) {
        btns[j].onclick = (function (el, k) {
          return function () { curFilter = k; render(); };
        })(btns[j], btns[j].getAttribute('data-k'));
      }
    }

    function render() {
      var kw = searchInput.value.trim();
      var list = [];
      for (var i = 0; i < DATA.length; i++) {
        var it = DATA[i];
        if (curFilter !== 'all' && it[2] !== curFilter) { continue; }
        if (kw && it[0].indexOf(kw) === -1) { continue; }
        list.push(it);
      }
      if (!list.length) {
        gridBox.innerHTML = '<div class="fl-none">' + t('ui.101', '没有找到匹配的国家，换个关键词试试。') + '</div>';
        setStatus(t('ui.100','未找到匹配结果'), 'error');
        return;
      }
      var html = '';
      for (var j = 0; j < list.length; j++) {
        var c = list[j];
        var isChina = c[0] === '中国';
        html += '<div class="fl-card' + (isChina ? ' china' : '') + '"><div class="fl-flag">' + flagEmoji(c[1]) + '</div><div class="fl-name">' + htmlEscape(c[0]) + '</div></div>';
      }
      gridBox.innerHTML = html;
      setStatus(t('ui.4','当前显示 ') + list.length + t('ui.3',' 个国家'));
    }

    buildFilters();
    totalText.textContent = t('ui.2','共收录 ') + DATA.length + t('ui.1',' 个国家与地区，按洲分类浏览');
    searchInput.addEventListener('input', render);
    render();
  })();
  </script>

</html>
