<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正态分布计算器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .param-grid { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-2); }
    .param-field { display: flex; flex-direction: column; gap: var(--space-1); }
    .param-field label { font-size: var(--font-size-sm); color: var(--color-text-secondary); }
    .mode-row { margin-bottom: var(--space-2); display: flex; align-items: center; gap: var(--space-2); }
    .mode-row label { font-size: var(--font-size-sm); color: var(--color-text-secondary); }
    .x-row { display: flex; gap: var(--space-2); flex-wrap: wrap; }
    .res-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--space-2); margin-top: var(--space-2); }
    .res-item { background: var(--color-bg-soft); border-radius: var(--radius-md); padding: var(--space-2); }
    .res-item .res-label { font-size: var(--font-size-xs); color: var(--color-text-secondary); display: block; }
    .res-item .res-value { font-size: var(--font-size-lg); font-family: var(--font-mono); color: var(--color-text-primary); display: block; margin-top: var(--space-1); }
    .chart-wrap { margin-top: var(--space-3); text-align: center; }
    .chart-wrap canvas { max-width: 100%; height: auto; background: var(--color-bg-soft); border: 1px solid var(--color-border); border-radius: var(--radius-md); }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">正态分布计算器</h1>
    <p class="tool-desc" data-i18n="desc">输入均值与标准差，计算 Z 分数、累积概率与区间概率，并绘制正态曲线图。</p>
    <div class="card">
      <div class="param-grid">
        <div class="param-field">
          <label for="meanInput" data-i18n="ui.1">均值 μ</label>
          <input type="text" id="meanInput" class="input js-focus-input" placeholder="如 0">
        </div>
        <div class="param-field">
          <label for="sdInput" data-i18n="ui.2">标准差 σ</label>
          <input type="text" id="sdInput" class="input" placeholder="如 1">
        </div>
      </div>
      <div class="mode-row">
        <label for="modeSelect" data-i18n="ui.3">计算模式</label>
        <select id="modeSelect" class="input">
          <option value="single" data-i18n="ui.4">单 X 值</option>
          <option value="interval" data-i18n="ui.5">区间 [x1, x2]</option>
        </select>
      </div>
      <div class="x-row">
        <div class="param-field">
          <label for="x1Input" id="x1Label" data-i18n="ui.6">X 值</label>
          <input type="text" id="x1Input" class="input" placeholder="如 1.5">
        </div>
        <div class="param-field" id="x2Field" style="display:none;">
          <label for="x2Input" data-i18n="ui.7">X2 值</label>
          <input type="text" id="x2Input" class="input" placeholder="如 2.5">
        </div>
      </div>
      <div style="margin-top:var(--space-2);">
        <button class="btn btn-primary" id="calcBtn" data-i18n="ui.calc">计算</button>
      </div>
    </div>
    <div id="resultBox" class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button>
    </div>
    <div class="chart-wrap" id="chartWrap" style="display:none;">
      <canvas id="normChart" width="640" height="260"></canvas>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script></script>
  <script>
    (function () {
      var meanEl = document.getElementById('meanInput');
      var sdEl = document.getElementById('sdInput');
      var modeEl = document.getElementById('modeSelect');
      var x1El = document.getElementById('x1Input');
      var x2El = document.getElementById('x2Input');
      var x2Field = document.getElementById('x2Field');
      var x1Label = document.getElementById('x1Label');
      var calcBtn = document.getElementById('calcBtn');
      var outputText = document.getElementById('outputText');
      var copyBtn = document.getElementById('copyBtn');
      var chartWrap = document.getElementById('chartWrap');
      var chart = document.getElementById('normChart');

      function parseNum(v) {
        var s = String(v).trim();
        if (s === '') {
          return null;
        }
        if (!/^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(s)) {
          return NaN;
        }
        return parseFloat(s);
      }

      function fmt(n) {
        if (Math.abs(n) < 1e-9 && n !== 0) {
          return n.toExponential(6);
        }
        return String(Math.round(n * 1e6) / 1e6);
      }

      function erf(x) {
        var sign = x < 0 ? -1 : 1;
        var ax = Math.abs(x);
        var t = 1 / (1 + 0.3275911 * ax);
        var y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-ax * ax);
        return sign * y;
      }

      function normCdf(z) {
        return 0.5 * (1 + erf(z / Math.SQRT2));
      }

      function density(z) {
        return Math.exp(-z * z / 2) / Math.sqrt(2 * Math.PI);
      }

      function drawCurve(mu, sigma, z1, z2, isInterval) {
        var ctx = chart.getContext('2d');
        var w = chart.width;
        var h = chart.height;
        var left = 40;
        var right = w - 16;
        var top = 16;
        var bottom = h - 34;
        var halfSpan = 4 * sigma;
        if (halfSpan <= 0) {
          halfSpan = 1;
        }
        var xMin = mu - halfSpan;
        var xMax = mu + halfSpan;
        var px = function (x) {
          return left + (x - xMin) / (xMax - xMin) * (right - left);
        };
        var py = function (x) {
          return bottom - (x - mu) / sigma;
        };
        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = '#999';
        ctx.fillStyle = '#999';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(left, bottom);
        ctx.lineTo(right, bottom);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(px(mu), bottom);
        ctx.lineTo(px(mu), top);
        ctx.stroke();
        ctx.font = '11px sans-serif';
        ctx.fillText('μ=' + fmt(mu), px(mu) + 4, top + 12);
        ctx.fillText('σ=' + fmt(sigma), 4, top + 12);
        var fillFrom = isInterval ? Math.max(z1, -4) : -4;
        var fillTo = isInterval ? Math.min(z2, 4) : Math.max(z1, -4);
        if (fillTo < -4) {
          fillTo = -4;
        }
        ctx.fillStyle = 'rgba(52,101,56,0.35)';
        ctx.beginPath();
        ctx.moveTo(px(mu + fillFrom * sigma), bottom);
        var x;
        for (var i = 0; i <= 120; i++) {
          x = fillFrom + (fillTo - fillFrom) * i / 120;
          ctx.lineTo(px(mu + x * sigma), py(mu + x * sigma));
        }
        ctx.lineTo(px(mu + fillTo * sigma), bottom);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (var j = 0; j <= 240; j++) {
          x = xMin + (xMax - xMin) * j / 240;
          var yv = bottom - density((x - mu) / sigma) / density(0) * (bottom - top);
          if (j === 0) {
            ctx.moveTo(px(x), yv);
          } else {
            ctx.lineTo(px(x), yv);
          }
        }
        ctx.stroke();
        ctx.fillStyle = '#111';
        ctx.textAlign = 'center';
        if (isInterval) {
          ctx.fillText('P(x1≤X≤x2) 阴影区', (left + right) / 2, h - 8);
        } else {
          ctx.fillText('P(X≤x) 阴影区', (left + right) / 2, h - 8);
        }
        ctx.textAlign = 'left';
      }

      function run() {
        var mu = parseNum(meanEl.value);
        var sigma = parseNum(sdEl.value);
        var mode = modeEl.value;
        if (mu === null && sigma === null && x1El.value.trim() === '') {
          outputText.innerHTML = '';
          setStatus('');
          chartWrap.style.display = 'none';
          return;
        }
        if (mu === null || isNaN(mu)) {
          setStatus('请输入有效的均值 μ', 'error');
          return;
        }
        if (sigma === null || isNaN(sigma)) {
          setStatus('请输入有效的标准差 σ', 'error');
          return;
        }
        if (sigma <= 0) {
          setStatus('标准差 σ 必须大于 0', 'error');
          return;
        }
        var x1 = parseNum(x1El.value);
        var x2 = null;
        if (mode === 'interval') {
          x2 = parseNum(x2El.value);
          if (x1 === null || isNaN(x1)) {
            setStatus('请输入有效的 X1 值', 'error');
            return;
          }
          if (x2 === null || isNaN(x2)) {
            setStatus('请输入有效的 X2 值', 'error');
            return;
          }
          if (x1 >= x2) {
            setStatus('X1 必须小于 X2', 'error');
            return;
          }
        } else {
          if (x1 === null || isNaN(x1)) {
            setStatus('请输入有效的 X 值', 'error');
            return;
          }
        }
        var z1 = (x1 - mu) / sigma;
        var cdf1 = normCdf(z1);
        var html = '';
        if (mode === 'single') {
          var prob = cdf1;
          html += '<div class="res-grid">';
          html += '<div class="res-item"><span class="res-label">Z 分数</span><span class="res-value">' + htmlEscape(fmt(z1)) + '</span></div>';
          html += '<div class="res-item"><span class="res-label">P(X ≤ x)</span><span class="res-value">' + htmlEscape(fmt(prob)) + '</span></div>';
          html += '<div class="res-item"><span class="res-label">P(X &gt; x)</span><span class="res-value">' + htmlEscape(fmt(1 - prob)) + '</span></div>';
          html += '</div>';
        } else {
          var z2 = (x2 - mu) / sigma;
          var cdf2 = normCdf(z2);
          var probInterval = cdf2 - cdf1;
          html += '<div class="res-grid">';
          html += '<div class="res-item"><span class="res-label">Z1 分数</span><span class="res-value">' + htmlEscape(fmt(z1)) + '</span></div>';
          html += '<div class="res-item"><span class="res-label">Z2 分数</span><span class="res-value">' + htmlEscape(fmt(z2)) + '</span></div>';
          html += '<div class="res-item"><span class="res-label">P(X ≤ x1)</span><span class="res-value">' + htmlEscape(fmt(cdf1)) + '</span></div>';
          html += '<div class="res-item"><span class="res-label">P(x1 ≤ X ≤ x2)</span><span class="res-value">' + htmlEscape(fmt(probInterval)) + '</span></div>';
          html += '<div class="res-item"><span class="res-label">P(X &lt; x1 或 X &gt; x2)</span><span class="res-value">' + htmlEscape(fmt(1 - probInterval)) + '</span></div>';
          html += '</div>';
        }
        outputText.innerHTML = html;
        chartWrap.style.display = 'block';
        if (mode === 'single') {
          drawCurve(mu, sigma, z1, 0, false);
        } else {
          drawCurve(mu, sigma, z1, (x2 - mu) / sigma, true);
        }
        setStatus(t('ui.calcDone','计算完成'));
      }

      function toggleMode() {
        var isInterval = modeEl.value === 'interval';
        x2Field.style.display = isInterval ? '' : 'none';
        x1Label.textContent = isInterval ? 'X1 值' : 'X 值';
      }

      modeEl.addEventListener('change', function () {
        toggleMode();
        run();
      });
      calcBtn.addEventListener('click', run);
      x1El.addEventListener('change', run);
      x2El.addEventListener('change', run);
      meanEl.addEventListener('change', run);
      sdEl.addEventListener('change', run);
      copyBtn.addEventListener('click', function () {
        copyToClipboard(outputText.textContent.replace(/\s+/g, ' ').trim(), copyBtn);
      });
    })();
  </script>
</body>
</html>
