<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>npm 版本范围解释器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .field-label { display: block; font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: 4px; }
    .range-hint { font-size: var(--font-size-xs); color: var(--color-text-disabled); margin-top: 6px; }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">npm 版本范围解释器</h1>
    <p class="tool-desc" data-i18n="desc">输入 npm 版本范围表达式（如 ^1.2.3、~1.2.3、1.2.x、1.2.3 - 2.0.0、|| 组合），解释其语义并列出允许范围内的版本。</p>
    <div class="card">
      <label for="rangeInput" class="field-label" data-i18n="ui.1">版本范围表达式</label>
      <input id="rangeInput" class="input js-focus-input" placeholder="^1.2.3">
      <div style="margin-top:12px;"><button id="explainBtn" class="btn btn-primary" data-i18n="ui.2">解释范围</button></div>
      <p class="range-hint" data-i18n="ui.103">支持：精确版本 1.2.3、^1.2.3、~1.2.3、>=1.0.0 &lt;2.0.0、1.2.x、1.2.3 - 2.0.0、*、latest、|| 或运算</p>
    </div>
    <div id="resultBox" class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script></script>
  <script>
    (function () {
      var inputEl = document.getElementById('rangeInput');
      var explainBtn = document.getElementById('explainBtn');
      var outputEl = document.getElementById('outputText');
      var copyBtn = document.getElementById('copyBtn');

      function toNum(str, fallback) {
        var n = parseInt(str, 10);
        return isNaN(n) ? fallback : n;
      }

      function parseVersion(str) {
        var s = String(str).trim().replace(/^v/, '');
        var m = /^(\d+)(?:\.(\d+))?(?:\.(\d+))?/.exec(s);
        if (!m) return null;
        var rest = s.substring(m[0].length);
        if (rest && !/^[-+][0-9A-Za-z.\-]*$/.test(rest)) return null;
        var parts = m[0].split('.');
        return {
          major: toNum(parts[0], 0),
          minor: parts.length > 1 ? toNum(parts[1], 0) : 0,
          patch: parts.length > 2 ? toNum(parts[2], 0) : 0,
          parts: parts.length
        };
      }

      function hasWildcard(str) {
        return str.indexOf('*') !== -1 || /(^|[^a-z])x($|[^a-z])/i.test(str) || /(^|\.)x(\.|$)/i.test(str);
      }

      function compare(a, b) {
        if (a.major !== b.major) return a.major < b.major ? -1 : 1;
        if (a.minor !== b.minor) return a.minor < b.minor ? -1 : 1;
        if (a.patch !== b.patch) return a.patch < b.patch ? -1 : 1;
        return 0;
      }

      function satisfies(v, cmp) {
        var c = compare(v, cmp.v);
        if (cmp.op === '=') return c === 0;
        if (cmp.op === '>') return c > 0;
        if (cmp.op === '>=') return c >= 0;
        if (cmp.op === '<') return c < 0;
        if (cmp.op === '<=') return c <= 0;
        return false;
      }

      function verStr(v) {
        return v.major + '.' + v.minor + '.' + v.patch;
      }

      function atom(comparators, text) {
        return { comparators: comparators, text: text };
      }

      function nextMajor(v) {
        return { major: v.major + 1, minor: 0, patch: 0 };
      }
      function nextMinor(v) {
        return { major: v.major, minor: v.minor + 1, patch: 0 };
      }
      function nextPatch(v) {
        return { major: v.major, minor: v.minor, patch: v.patch + 1 };
      }

      function caretAtom(raw) {
        var s = raw.substring(1).trim();
        if (s === '*' || s.toLowerCase() === 'x') {
          return atom([{ op: '>=', v: { major: 0, minor: 0, patch: 0 } }], '^' + s + t('ui.14',' 表示任意版本'));
        }
        if (hasWildcard(s)) {
          var parts = s.split('.');
          if (parts.length === 2) {
            var low = { major: toNum(parts[0], 0), minor: 0, patch: 0 };
            return atom([{ op: '>=', v: low }, { op: '<', v: nextMajor(low) }], '^' + s + t('meansGte',' 表示 >=') + verStr(low) + t('andLt',' 且 <') + verStr(nextMajor(low)) + t('ui.24','（仅主版本不变）'));
          }
          var low2 = { major: toNum(parts[0], 0), minor: toNum(parts[1], 0), patch: 0 };
          return atom([{ op: '>=', v: low2 }, { op: '<', v: nextMinor(low2) }], '^' + s + t('meansGte',' 表示 >=') + verStr(low2) + t('andLt',' 且 <') + verStr(nextMinor(low2)) + t('ui.23','（主次版本不变）'));
        }
        var v = parseVersion(s);
        if (!v) return null;
        var low = { major: v.major, minor: v.minor, patch: v.patch };
        var high;
        if (v.major > 0) {
          high = nextMajor(v);
        } else if (v.minor > 0) {
          high = nextMinor(v);
        } else if (v.patch > 0) {
          high = nextPatch(v);
        } else {
          return atom([{ op: '=', v: low }], t('ui.22','^0.0.0 表示仅允许 0.0.0'));
        }
        return atom([{ op: '>=', v: low }, { op: '<', v: high }], raw + t('meansGte',' 表示 >=') + verStr(low) + t('andLt',' 且 <') + verStr(high) + t('ui.21','（主版本不变，允许次版本与补丁版本更新）'));
      }

      function tildeAtom(raw) {
        var s = raw.substring(1).trim();
        if (s === '*' || s.toLowerCase() === 'x') {
          return atom([{ op: '>=', v: { major: 0, minor: 0, patch: 0 } }], '~' + s + t('ui.14',' 表示任意版本'));
        }
        if (hasWildcard(s)) {
          var parts = s.split('.');
          if (parts.length === 1 || parts[1] === 'x') {
            var low = { major: toNum(parts[0], 0), minor: 0, patch: 0 };
            return atom([{ op: '>=', v: low }, { op: '<', v: nextMajor(low) }], '~' + s + t('meansGte',' 表示 >=') + verStr(low) + t('andLt',' 且 <') + verStr(nextMajor(low)) + t('ui.20','（仅补丁版本更新）'));
          }
          var low2 = { major: toNum(parts[0], 0), minor: toNum(parts[1], 0), patch: 0 };
          return atom([{ op: '>=', v: low2 }, { op: '<', v: nextMinor(low2) }], '~' + s + t('meansGte',' 表示 >=') + verStr(low2) + t('andLt',' 且 <') + verStr(nextMinor(low2)) + t('ui.20','（仅补丁版本更新）'));
        }
        var v = parseVersion(s);
        if (!v) return null;
        var low = { major: v.major, minor: v.minor, patch: v.patch };
        var high;
        if (v.parts === 1) {
          high = nextMajor(v);
        } else {
          high = nextMinor(v);
        }
        return atom([{ op: '>=', v: low }, { op: '<', v: high }], raw + t('meansGte',' 表示 >=') + verStr(low) + t('andLt',' 且 <') + verStr(high) + t('ui.19','（仅允许补丁版本更新）'));
      }

      function wildcardAtom(token) {
        var s = token.toLowerCase();
        if (s === '*' || s === 'x') {
          return atom([{ op: '>=', v: { major: 0, minor: 0, patch: 0 } }], '*' + t('ui.14',' 表示任意版本'));
        }
        var parts = s.split('.');
        for (var i = 0; i < parts.length; i++) {
          if (parts[i] === '*' || parts[i] === 'x') parts[i] = 'x';
        }
        if (parts[0] === 'x') {
          return atom([{ op: '>=', v: { major: 0, minor: 0, patch: 0 } }], token + t('ui.14',' 表示任意版本'));
        }
        if (parts.length === 1 || parts[1] === 'x') {
          var low = { major: toNum(parts[0], 0), minor: 0, patch: 0 };
          return atom([{ op: '>=', v: low }, { op: '<', v: nextMajor(low) }], token + t('ui.17',' 表示 ') + parts[0] + t('latestVersionRange',' 的最新版本（>=') + verStr(low) + t('andLt',' 且 <') + verStr(nextMajor(low)) + t('closeParen','）'));
        }
        var low2 = { major: toNum(parts[0], 0), minor: toNum(parts[1], 0), patch: 0 };
        return atom([{ op: '>=', v: low2 }, { op: '<', v: nextMinor(low2) }], token + t('ui.17',' 表示 ') + parts[0] + '.' + parts[1] + t('latestVersionRange',' 的最新版本（>=') + verStr(low2) + t('andLt',' 且 <') + verStr(nextMinor(low2)) + t('closeParen','）'));
      }

      function bareAtom(token) {
        var v = parseVersion(token);
        if (!v) return null;
        if (v.parts === 3) {
          return atom([{ op: '=', v: v }], token + t('ui.18',' 表示仅允许精确版本 ') + verStr(v));
        }
        var low = { major: v.major, minor: v.minor, patch: v.patch };
        if (v.parts === 1) {
          return atom([{ op: '>=', v: low }, { op: '<', v: nextMajor(low) }], token + t('ui.17',' 表示 ') + v.major + t('latestVersionRange',' 的最新版本（>=') + verStr(low) + t('andLt',' 且 <') + verStr(nextMajor(low)) + t('closeParen','）'));
        }
        return atom([{ op: '>=', v: low }, { op: '<', v: nextMinor(low) }], token + t('ui.17',' 表示 ') + v.major + '.' + v.minor + t('latestVersionRange',' 的最新版本（>=') + verStr(low) + t('andLt',' 且 <') + verStr(nextMinor(low)) + t('closeParen','）'));
      }

      function comparatorAtom(op, token) {
        var v = parseVersion(token);
        if (!v) return null;
        var low = { major: v.major, minor: v.minor, patch: v.patch };
        var label = op === '=' ? t('opEqual','等于') : op === '>' ? t('opGt','大于') : op === '>=' ? t('opGte','大于等于') : op === '<' ? t('opLt','小于') : t('opLte','小于等于');
        return atom([{ op: op, v: low }], op + token + t('ui.16',' 表示版本') + label + ' ' + verStr(low));
      }

      function hyphenAtom(tokens, idx) {
        var lowV = parseVersion(tokens[idx - 1]);
        var highV = parseVersion(tokens[idx + 1]);
        if (!lowV || !highV) return null;
        var comparators = [{ op: '>=', v: lowV }];
        if (highV.parts >= 3) {
          comparators.push({ op: '<=', v: highV });
        } else if (highV.parts === 2) {
          comparators.push({ op: '<', v: nextMinor(highV) });
        } else {
          comparators.push({ op: '<', v: nextMajor(highV) });
        }
        var highLabel = highV.parts >= 3 ? '<=' + verStr(highV) : '<' + verStr(highV.parts === 2 ? nextMinor(highV) : nextMajor(highV));
        return { atom: atom(comparators, tokens[idx - 1] + ' - ' + tokens[idx + 1] + t('rangeMeans',' 表示版本范围：>=') + verStr(lowV) + t('ui.9',' 且 ') + highLabel + t('ui.15','（含两端）')), consumed: true };
      }

      function parseBranch(tokens) {
        var comparators = [];
        var texts = [];
        var used = {};
        var ranges = [];
        for (var i = 0; i < tokens.length; i++) {
          if (tokens[i] === '-') {
            if (i === 0 || i === tokens.length - 1) return null;
            if (used[i - 1] || used[i + 1]) return null;
            var hr = hyphenAtom(tokens, i);
            if (!hr) return null;
            ranges.push({ atom: hr.atom });
            used[i - 1] = true;
            used[i] = true;
            used[i + 1] = true;
          }
        }
        for (var j = 0; j < tokens.length; j++) {
          if (used[j]) continue;
          var token = tokens[j];
          var a = null;
          if (token.indexOf('^') === 0) {
            a = caretAtom(token);
          } else if (token.indexOf('~') === 0) {
            a = tildeAtom(token);
          } else if (token.indexOf('>=') === 0) {
            a = comparatorAtom('>=', token.substring(2));
          } else if (token.indexOf('<=') === 0) {
            a = comparatorAtom('<=', token.substring(2));
          } else if (token.indexOf('>') === 0) {
            a = comparatorAtom('>', token.substring(1));
          } else if (token.indexOf('<') === 0) {
            a = comparatorAtom('<', token.substring(1));
          } else if (token.indexOf('=') === 0) {
            a = comparatorAtom('=', token.substring(1));
          } else if (token === '*' || token.toLowerCase() === 'x') {
            a = atom([{ op: '>=', v: { major: 0, minor: 0, patch: 0 } }], token + t('ui.14',' 表示任意版本'));
          } else if (hasWildcard(token)) {
            a = wildcardAtom(token);
          } else {
            a = bareAtom(token);
          }
          if (!a) return null;
          comparators = comparators.concat(a.comparators);
          texts.push(a.text);
        }
        for (var r = 0; r < ranges.length; r++) {
          comparators = comparators.concat(ranges[r].atom.comparators);
          texts.push(ranges[r].atom.text);
        }
        return { comparators: comparators, texts: texts };
      }

      function inBranch(v, comparators) {
        for (var i = 0; i < comparators.length; i++) {
          if (!satisfies(v, comparators[i])) return false;
        }
        return true;
      }

      function listExamples(branches) {
        var found = [];
        for (var major = 1; major <= 3; major++) {
          for (var minor = 0; minor <= 9; minor++) {
            for (var patch = 0; patch <= 9; patch++) {
              var v = { major: major, minor: minor, patch: patch };
              if (compare(v, { major: 3, minor: 0, patch: 0 }) > 0) continue;
              var ok = false;
              for (var b = 0; b < branches.length; b++) {
                if (inBranch(v, branches[b].comparators)) { ok = true; break; }
              }
              if (ok) found.push(v);
            }
          }
        }
        return found;
      }

      function explain() {
        var expr = inputEl.value.trim();
        if (!expr) {
          outputEl.textContent = '';
          setStatus('');
          return;
        }
        if (expr === 'latest') {
          outputEl.textContent = t('ui.11','范围表达式：') + 'latest\n\n' + t('latestDesc','latest 是发布标签（dist-tag），表示当前最新发布版本，不属于语义版本范围，无法枚举具体版本。') + '\n\n' + t('latestAdvice','建议使用：npm install <包名>@latest 获取最新版本。');
          setStatus(t('ui.13','已解释 latest 标签'));
          return;
        }
        var rawBranches = expr.split('||');
        var branches = [];
        for (var i = 0; i < rawBranches.length; i++) {
          var raw = rawBranches[i].trim();
          if (!raw) { outputEl.textContent = ''; setStatus(t('ui.100','范围表达式中存在空的 || 分支'), 'error'); return; }
          if (raw === 'latest') { outputEl.textContent = ''; setStatus(t('ui.101','latest 只能单独使用，不能与其他范围组合'), 'error'); return; }
          var tokens = raw.split(/\s+/);
          var parsed = parseBranch(tokens);
          if (!parsed) { outputEl.textContent = ''; setStatus(t('ui.12','无法解析的分支：') + raw, 'error'); return; }
          branches.push(parsed);
        }
        var lines = [];
        lines.push(t('ui.11','范围表达式：') + expr);
        lines.push('');
        lines.push(t('ui.10','语义解释：'));
        for (var j = 0; j < branches.length; j++) {
          var sep = j < branches.length - 1 ? t('branchSep','；或 ') : '';
          lines.push('  ' + branches[j].texts.join(t('ui.9',' 且 ')) + sep);
        }
        lines.push('');
        var examples = listExamples(branches);
        if (examples.length) {
          lines.push(t('ui.8','允许范围（数值）：') + (branches.length === 1 ? branches[0].texts.join(t('commaJoin','，')) : t('unionBranches','多个分支的并集')));
          lines.push('');
          var shown = examples.length > 100 ? 100 : examples.length;
          lines.push(t('ui.7','匹配版本示例（从 1.0.0 到 3.0.0 扫描，共 ') + examples.length + t('ui.6',' 个，显示前 ') + shown + t('ui.5',' 个）：'));
          for (var k = 0; k < shown; k++) {
            lines.push('  ' + verStr(examples[k]));
          }
        } else {
          lines.push(t('ui.4','匹配版本示例：在 1.0.0 到 3.0.0 范围内没有满足条件的版本'));
        }
        outputEl.textContent = lines.join('\n');
        setStatus(t('ui.3','已解释版本范围'));
      }

      explainBtn.addEventListener('click', explain);
      inputEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') explain();
      });

      copyBtn.addEventListener('click', function () {
        var text = outputEl.textContent;
        if (!text) { setStatus(t('ui.102','暂无内容可复制'), 'error'); return; }
        copyToClipboard(text, copyBtn);
        setStatus(t('ui.copiedClip','已复制到剪贴板'));
      });
    })();
  </script>
</body>
</html>
