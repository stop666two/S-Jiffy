<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIN 码生成器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .pp-row { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-bottom:var(--space-3); }
    .pp-row .field { flex:1; min-width:100px; }
    .pp-row label { display:block; font-size:var(--font-size-sm); color:var(--color-text-secondary); margin-bottom:4px; }
  </style>
</head>
<body>
  <header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">PIN 码生成器</h1>
    <p class="tool-desc" data-i18n="desc">生成数字 PIN 码，支持长度设置、禁止重复和连续数字选项。</p>
    <div class="card">
      <div class="pp-row">
        <div class="field"><label for="lenVal" data-i18n="ui.1">长度</label><input id="lenVal" class="input" type="number" value="6" min="4" max="12"></div>
        <div class="field"><label for="countVal" data-i18n="ui.quantity">数量</label><input id="countVal" class="input" type="number" value="5" min="1" max="100"></div>
      </div>
      <div class="pp-row">
        <label style="display:flex;align-items:center;gap:8px;"><input id="noRepeatChk" type="checkbox"> 禁止重复数字</label>
        <label style="display:flex;align-items:center;gap:8px;"><input id="noSeqChk" type="checkbox"> 禁止连续数字</label>
      </div>
      <div><button id="genBtn" class="btn btn-primary" data-i18n="ui.generate">生成</button></div>
    </div>
    <div class="output-box"><span id="outputText" style="display:block;padding-right:60px;"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
  </main>
  <footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script></script>
  <script>(function(){
    var lenEl = document.getElementById('lenVal');
    var countEl = document.getElementById('countVal');
    var noRepeatChk = document.getElementById('noRepeatChk');
    var noSeqChk = document.getElementById('noSeqChk');
    var genBtn = document.getElementById('genBtn');
    var outputEl = document.getElementById('outputText');
    var copyBtn = document.getElementById('copyBtn');

    function cryptoDigit() {
      var b = new Uint8Array(1);
      crypto.getRandomValues(b);
      return b[0] % 10;
    }

    function hasConsecutive(s) {
      for (var i = 1; i < s.length; i++) {
        if (parseInt(s[i]) === parseInt(s[i-1]) + 1 || parseInt(s[i]) === parseInt(s[i-1]) - 1) return true;
      }
      return false;
    }

    function generatePIN(len, noRepeat, noSeq) {
      var attempts = 0;
      while (attempts < 1000) {
        var digits = [];
        for (var i = 0; i < len; i++) digits.push(cryptoDigit());
        var pin = digits.join('');
        if (noRepeat) {
          var seen = {};
          var dup = false;
          for (var i = 0; i < digits.length; i++) {
            if (seen[digits[i]]) { dup = true; break; }
            seen[digits[i]] = true;
          }
          if (dup) { attempts++; continue; }
        }
        if (noSeq && hasConsecutive(pin)) { attempts++; continue; }
        return pin;
      }
      return null;
    }

    function generate() {
      var len = parseInt(lenEl.value, 10) || 6;
      if (len < 4) len = 4;
      if (len > 12) len = 12;
      var count = parseInt(countEl.value, 10) || 1;
      if (count < 1) count = 1;
      if (count > 1000) count = 1000;
      var noRepeat = noRepeatChk.checked;
      var noSeq = noSeqChk.checked;

      if (noRepeat && len > 10) { setStatus('禁止重复时长度不能超过 10', 'error'); return; }

      var result = [];
      for (var i = 0; i < count; i++) {
        var pin = generatePIN(len, noRepeat, noSeq);
        if (pin === null) { result.push(t('ui.3','生成失败')); break; }
        result.push(pin);
      }
      outputEl.textContent = result.join('\n');
      setStatus(t('ui.generated','已生成 ') + result.length + t('ui.2',' 个 PIN 码'));
    }

    genBtn.addEventListener('click', generate);
    copyBtn.addEventListener('click', function() { if (outputEl.textContent) { copyToClipboard(outputEl.textContent, copyBtn); setStatus(t('ui.copied','已复制')); } });
  })();</script>
</body>
</html>
