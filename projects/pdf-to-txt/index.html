<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF转文本 - S-Jiffy</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../assets/css/global.css">
<style>
.dropzone{border:1.5px dashed var(--color-border);border-radius:var(--radius-md);padding:36px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;}
.dropzone:hover,.dropzone.dragover{border-color:var(--color-text-primary);background:var(--color-bg-soft);}
.dz-icon{font-size:34px;margin-bottom:8px;}
.dz-label{font-size:var(--font-size-sm);font-weight:500;}
.dz-sub{font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-top:4px;}
.file-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border:1px solid var(--color-border);border-radius:var(--radius-md);margin-bottom:12px;font-size:var(--font-size-sm);}
.file-bar .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
.file-bar .fm{font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-right:12px;}
.file-bar .x{background:none;border:none;cursor:pointer;color:var(--color-text-disabled);font-size:16px;padding:4px;}
.file-bar .x:hover{color:var(--color-error);}
.result-head{display:flex;align-items:center;justify-content:space-between;margin:12px 0 8px;font-size:var(--font-size-xs);color:var(--color-text-secondary);}
.result-head .ops{display:flex;gap:8px;}
.mini-btn{border:1px solid var(--color-border);background:transparent;border-radius:9999px;font-size:var(--font-size-xs);padding:5px 14px;cursor:pointer;color:var(--color-text-secondary);}
.mini-btn:hover{border-color:var(--color-text-primary);color:var(--color-text-primary);}
.out-text{width:100%;min-height:280px;font-family:var(--font-mono);font-size:12px;line-height:1.6;border:1px solid var(--color-border);border-radius:var(--radius-md);padding:12px;resize:vertical;}
.action-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;align-items:center;}
</style>
</head>
<body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a></header>
<main class="tool-workspace">
<h1 data-i18n="h1">PDF转文本</h1>
<p class="tool-desc" data-i18n="desc">从PDF文件中提取所有文本内容。快速私密的浏览器工具。</p>
<div class="card">
<div class="dropzone" id="dropZone">
<div class="dz-icon">📝</div>
<div class="dz-label" data-i18n="uploadPdfFiles">上传PDF文件</div>
<div class="dz-sub" id="dzSub"></div>
</div>
<input type="file" id="fileInput" accept=".pdf,application/pdf" style="display:none">
</div>
<div class="card" id="workCard" style="display:none">
<div class="file-bar">
<span class="fn" id="fileName"></span>
<span class="fm" id="fileMeta"></span>
<button class="x" id="removeBtn" title="×">✕</button>
</div>
<div class="result-head" id="resultHead" style="display:none">
<span id="wordCount"></span>
<span class="ops">
<button class="mini-btn" id="copyBtn" data-i18n="common.copy">复制</button>
<button class="mini-btn" id="dlBtn" data-i18n="downloadTxt">下载.txt</button>
</span>
</div>
<textarea class="out-text" id="outText" readonly placeholder=""></textarea>
<div class="action-row">
<button class="btn btn-primary" id="extractBtn" disabled data-i18n="extractText">提取文本</button>
</div>
</div>
</main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
<script src="../../assets/js/i18n.js"></script>
<script src="../../assets/vendor/pdf.min.js"></script>
<script>
/* ES5 IIFE：var/function，不用 let/const/箭头函数/模板字符串 */
(function(){
'use strict';
function $(id){return document.getElementById(id);}
var MAX_MB=20;
var file=null,busy=false;
var dz=$('dropZone'),fi=$('fileInput'),btn=$('extractBtn');
pdfjsLib.GlobalWorkerOptions.workerSrc='../../assets/vendor/pdf.worker.min.js';
function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';return (b/1048576).toFixed(2)+' MB';}
function download(blob,name){var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u);},3000);}
function readAB(f,cb,eb){var r=new FileReader();r.onload=function(){cb(r.result);};r.onerror=function(){if(eb)eb();};r.readAsArrayBuffer(f);}
function loadFile(f){
  var isP=(f.type==='application/pdf')||(f.name&&f.name.toLowerCase().indexOf('.pdf')!==-1);
  if(!isP){setStatus(t('notPdf','请选择PDF文件'),'error');return;}
  if(f.size>MAX_MB*1048576){setStatus(t('tooLarge','文件过大（超过')+' '+MAX_MB+'MB）','error');return;}
  file=f;
  $('workCard').style.display='block';
  $('fileName').textContent=f.name;
  $('fileMeta').textContent=fmtSize(f.size);
  $('outText').value='';
  $('resultHead').style.display='none';
  setStatus('');
  updateBtn();
}
function updateBtn(){
  btn.disabled=busy||!file;
  btn.textContent=busy?t('extracting','提取中...'):t('extractText','提取文本');
}
function extractFromPDF(pdf){
  var seq=[],i;
  for(i=1;i<=pdf.numPages;i++)seq.push(i);
  var chain=Promise.resolve();
  var pageTexts=[];
  seq.forEach(function(pn){
    chain=chain.then(function(){
      return pdf.getPage(pn).then(function(page){
        return page.getTextContent().then(function(content){
          var text='',lastY=null,j;
          for(j=0;j<content.items.length;j++){
            var item=content.items[j];
            if(!item.str)continue;
            var y=item.transform[5];
            if(lastY!==null&&Math.abs(y-lastY)>5)text+='\n';
            text+=item.str;
            if(item.hasEOL)text+='\n';
            lastY=y;
          }
          if(text.trim())pageTexts.push(text.trim());
        });
      });
    });
  });
  return chain.then(function(){return pageTexts.join('\n\n');});
}
function doExtract(){
  if(!file||busy)return;
  busy=true;updateBtn();setStatus('');
  readAB(file,function(buf){
    pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise.then(function(pdf){
      extractFromPDF(pdf).then(function(text){
        pdf.destroy();
        busy=false;updateBtn();
        if(!text.trim()){
          setStatus(t('noTextFound','未找到文本。此PDF可能使用图像内容，无法在没有OCR的情况下提取。'),'error');
          return;
        }
        $('outText').value=text;
        $('resultHead').style.display='flex';
        var words=text.split(/\s+/).filter(Boolean).length;
        $('wordCount').textContent=words+' '+t('words','个词');
        setStatus(t('extractDone','文本提取完成'));
      });
    },function(){
      busy=false;updateBtn();
      setStatus(t('badPdf','无法解析的PDF文件或PDF已损坏'),'error');
    });
  },function(){
    busy=false;updateBtn();
    setStatus(t('readFailed','文件读取失败'),'error');
  });
}
dz.addEventListener('click',function(){fi.click();});
dz.addEventListener('dragover',function(e){e.preventDefault();dz.classList.add('dragover');});
dz.addEventListener('dragleave',function(){dz.classList.remove('dragover');});
dz.addEventListener('drop',function(e){e.preventDefault();dz.classList.remove('dragover');if(e.dataTransfer.files.length)loadFile(e.dataTransfer.files[0]);});
fi.addEventListener('change',function(){if(this.files.length)loadFile(this.files[0]);this.value='';});
$('removeBtn').addEventListener('click',function(){file=null;$('workCard').style.display='none';updateBtn();setStatus('');});
btn.addEventListener('click',doExtract);
$('copyBtn').addEventListener('click',function(){
  if($('outText').value){copyToClipboard($('outText').value,this);setStatus(t('common.copied','已复制'));}
});
$('dlBtn').addEventListener('click',function(){
  if(!file)return;
  download(new Blob([$('outText').value],{type:'text/plain;charset=utf-8'}),file.name.replace(/\.pdf$/i,'')+'.txt');
});
$('dzSub').textContent=t('supportedFormats','支持：{formats}').replace('{formats}','PDF')+' · '+t('maxPdfHint','最大20MB · .pdf');
})();
</script>
</body>
</html>
