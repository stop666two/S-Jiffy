    function detectCountry(raw) {
      var digits = raw.replace(/[^\d]/g, '');
      var best = null;
      for (var i = 0; i < countryCodes.length; i++) {
        var cc = countryCodes[i];
        if (digits.indexOf(cc.code) === 0) {
          if (!best || cc.code.length > best.code.length) { best = cc; }
        }
      }
      return best;
    }
    function parsePhone(raw) {
      var cleaned = raw.trim();
      var country = detectCountry(cleaned);
      var digits = cleaned.replace(/[^\d]/g, '');
      var hasPlus = cleaned.indexOf('+') !== -1;
      var nationalNumber = country ? digits.substr(country.code.length) : digits;
      return { raw: cleaned, digits: digits, hasPlus: hasPlus, country: country, nationalNumber: nationalNumber, isValid: hasPlus && country && nationalNumber.length >= 6 };
    }

      outputEl.style.color = d.isValid ? 'var(--color-success)' : 'var(--color-error)';
      var items = [
        { label: t('ui.7','原始输入'), val: d.raw },
        { label: t('ui.6','有效性'), val: d.isValid ? '有效' : (d.hasPlus ? '号码格式可能不完整' : '缺少国际前缀 +') },
        { label: t('ui.5','国家代码'), val: d.country ? '+' + d.country.code : '未识别' },
        { label: t('ui.4','国家或地区'), val: d.country ? d.country.name : '-' },
        { label: t('ui.3','国内号码'), val: d.nationalNumber || '-' },
        { label: t('ui.2','数字长度'), val: d.digits.length + t('ui.1',' 位') }
      ];
      var html = '';
      for (var i = 0; i < items.length; i++) {
        html += '<div class="phone-item"><label>' + items[i].label + '</label><span>' + htmlEscape(items[i].val) + '</span></div>';
      }
      gridEl.innerHTML = html;
    }

      var raw = inputEl.value.trim();
      if (!raw) { setStatus(t('ui.167','请输入电话号码'), 'error'); render(null); return; }

      render(result);
      setStatus(result.isValid ? t('ui.169','解析完成') : t('ui.170','号码格式可能不完整'));
    }
