    .filter-row { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-2); }

    .filter-row select { flex: 0 0 auto; width: 130px; }

    .port-table th { position: sticky; top: 0; background: var(--color-bg-soft); text-align: left; padding: 8px 10px; color: var(--color-text-secondary); font-weight: 500; border-bottom: 1px solid var(--color-border); }

    .port-num { font-family: var(--font-mono); color: var(--color-accent); font-weight: 500; white-space: nowrap; }
    .cat-tag { display: inline-block; padding: 0 6px; border-radius: var(--radius-sm); font-size: var(--font-size-xs); background: var(--color-bg-soft); color: var(--color-text-secondary); }

    <h1>常用端口速查</h1>
    <p class="tool-desc">内置 130+ 常用 TCP/UDP 端口，支持按端口号、名称或用途搜索，可按分类筛选，点击行一键复制端口号。</p>

          <option value="web">Web</option>
          <option value="db">数据库</option>
          <option value="mail">邮件</option>
          <option value="remote">远程</option>
          <option value="other">其他</option>

      <div class="port-count" id="countLine"></div>
      <div class="port-scroll">
        <table class="port-table">
          <thead><tr><th>端口</th><th>服务</th><th>协议</th><th>用途</th></tr></thead>
          <tbody id="portBody"></tbody>
        </table>
      </div>
    </div>
    <div id="resultBox" class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div>S-Jiffy · 即用即走</div>

        var html = '';
        for (var k = 0; k < rows.length; k++) {
          html += '<tr data-port="' + rows[k].p + '"><td class="port-num">' + rows[k].p + '</td><td>' + htmlEscape(rows[k].n) + '</td><td>' + htmlEscape(rows[k].t) + '</td><td>' + htmlEscape(rows[k].u) + ' <span class="cat-tag">' + htmlEscape(catLabel(rows[k].c)) + '</span></td></tr>';
        }
        document.getElementById('portBody').innerHTML = html;
        document.getElementById('countLine').textContent = '共 ' + PORTS.length + ' 个端口，当前显示 ' + rows.length + ' 个';
        var tail = lastCopied ? '｜最近复制：' + lastCopied : '';
        output.innerHTML = '<span style="font-size:var(--font-size-sm);color:var(--color-text-secondary)">当前显示 ' + rows.length + '/' + PORTS.length + ' 个端口。点击任意行复制该端口号。' + htmlEscape(tail) + '</span>';
        current = '';
        var list = [];
        for (var j = 0; j < rows.length; j++) list.push(rows[j].p + ' ' + rows[j].n);
        current = list.join('\n');
      }

      function catLabel(c) {
        if (c === 'web') return 'Web';
        if (c === 'db') return '数据库';
        if (c === 'mail') return '邮件';
        if (c === 'remote') return '远程';
        return '其他';
      }

      document.getElementById('portBody').addEventListener('click', function (e) {
        var tr = e.target;
        while (tr && tr.tagName !== 'TR') tr = tr.parentNode;
        if (!tr || !tr.getAttribute('data-port')) return;
        var port = tr.getAttribute('data-port');
        lastCopied = port;
        copyToClipboard(port, document.getElementById('copyBtn'));
        setStatus('已复制端口号 ' + port);
        render();
      });
      document.getElementById('searchInput').addEventListener('input', render);
      document.getElementById('catSel').addEventListener('change', render);
      document.getElementById('copyBtn').addEventListener('click', function () {
        if (!current) return;
        copyToClipboard(current, this);
        setStatus('已复制当前筛选出的端口清单');
      });
      render();
    })();
  </script>
</body>
</html>
