<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>质因数分解器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .pf-row { display: flex; gap: var(--space-2); align-items: flex-end; flex-wrap: wrap; margin-bottom: var(--space-2); }
    .pf-field { display: flex; flex-direction: column; gap: var(--space-1); }
    .pf-field label { font-size: var(--font-size-sm); color: var(--color-text-secondary); }
    .pf-field .input { min-width: 260px; font-family: var(--font-mono); }
    .res-label { font-size: var(--font-size-sm); color: var(--color-text-secondary); display: block; margin-bottom: var(--space-1); margin-top: var(--space-2); }
    .res-line { font-size: var(--font-size-lg); font-family: var(--font-mono); color: var(--color-text-primary); line-height: 1.8; word-break: break-all; }
    .res-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--space-2); }
    .res-item { background: var(--color-bg-soft); border-radius: var(--radius-md); padding: var(--space-2); }
    .res-item .res-label { margin: 0; }
    .res-item .res-value { font-size: var(--font-size-base); font-family: var(--font-mono); color: var(--color-text-primary); display: block; margin-top: var(--space-1); }
    .prime-hint { font-size: var(--font-size-sm); color: var(--color-error); }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <a href="../../index.html" class="back-btn">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1>质因数分解器</h1>
    <p class="tool-desc">对 1 至 10^12 的整数做质因数分解，输出指数形式、因数个数与约数和。</p>
    <div class="card">
      <div class="pf-row">
        <div class="pf-field">
          <label for="numInput">输入整数（1 至 10^12）</label>
          <input type="text" id="numInput" class="input js-focus-input" placeholder="如 360">
        </div>
        <button class="btn btn-primary" id="calcBtn">分解</button>
      </div>
    </div>
    <div id="resultBox" class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div>S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script>
    (function () {
      var numEl = document.getElementById('numInput');
      var calcBtn = document.getElementById('calcBtn');
      var outputText = document.getElementById('outputText');
      var copyBtn = document.getElementById('copyBtn');
      var MAX_N = 1000000000000;

      function factorize(n) {
        var factors = [];
        var m = n;
        if (m % 2 === 0) {
          var e2 = 0;
          while (m % 2 === 0) {
            m /= 2;
            e2++;
          }
          factors.push({ p: 2, e: e2 });
        }
        var p = 3;
        while (p * p <= m) {
          if (m % p === 0) {
            var e = 0;
            while (m % p === 0) {
              m /= p;
              e++;
            }
            factors.push({ p: p, e: e });
          }
          p += 2;
        }
        if (m > 1) {
          factors.push({ p: m, e: 1 });
        }
        return factors;
      }

      function fmtExp(factors) {
        var parts = [];
        for (var i = 0; i < factors.length; i++) {
          parts.push(factors[i].e > 1 ? factors[i].p + '^' + factors[i].e : String(factors[i].p));
        }
        return parts.join(' × ');
      }

      function powInt(b, e) {
        var r = 1;
        for (var i = 0; i < e; i++) {
          r *= b;
        }
        return r;
      }

      function run() {
        var raw = numEl.value.trim();
        if (raw === '') {
          outputText.innerHTML = '';
          setStatus('');
          return;
        }
        if (!/^\d+$/.test(raw)) {
          setStatus('请输入正整数', 'error');
          return;
        }
        var n = parseInt(raw, 10);
        if (String(n) !== raw.replace(/^0+/, '') && raw.replace(/^0+/, '') !== '') {
          setStatus('数值过大或格式无效', 'error');
          return;
        }
        if (n < 1) {
          setStatus('请输入不小于 1 的整数', 'error');
          return;
        }
        if (n > MAX_N) {
          setStatus('超出范围：仅支持 1 至 10^12 的整数', 'error');
          return;
        }
        var html = '';
        if (n === 1) {
          html += '<span class="res-label">分解结果</span>';
          html += '<span class="res-line">1 没有质因数</span>';
          html += '<div class="res-grid">';
          html += '<div class="res-item"><span class="res-label">因数个数</span><span class="res-value">1</span></div>';
          html += '<div class="res-item"><span class="res-label">约数和</span><span class="res-value">1</span></div>';
          html += '</div>';
          outputText.innerHTML = html;
          setStatus('分解完成');
          return;
        }
        var factors = factorize(n);
        var divCount = 1;
        var sumDiv = 1;
        var maxPrime = 0;
        for (var i = 0; i < factors.length; i++) {
          divCount *= (factors[i].e + 1);
          sumDiv *= (powInt(factors[i].p, factors[i].e + 1) - 1) / (factors[i].p - 1);
          if (factors[i].p > maxPrime) {
            maxPrime = factors[i].p;
          }
        }
        html += '<span class="res-label">质因数分解（指数形式）</span>';
        html += '<span class="res-line">' + htmlEscape(fmtExp(factors)) + '</span>';
        if (factors.length === 1 && factors[0].e === 1 && factors[0].p > 1000000) {
          html += '<div class="prime-hint">' + htmlEscape(raw) + ' 的剩余因子 ' + factors[0].p + ' 大于 10^6，试除法未充分验证，可能为素数（Miller-Rabin 请参考大整数计算器）</div>';
        }
        html += '<div class="res-grid">';
        html += '<div class="res-item"><span class="res-label">因数个数</span><span class="res-value">' + htmlEscape(String(divCount)) + '</span></div>';
        html += '<div class="res-item"><span class="res-label">约数和 σ(n)</span><span class="res-value">' + htmlEscape(String(sumDiv)) + '</span></div>';
        html += '<div class="res-item"><span class="res-label">最大质因子</span><span class="res-value">' + htmlEscape(String(maxPrime)) + '</span></div>';
        html += '</div>';
        outputText.innerHTML = html;
        setStatus('分解完成');
      }

      calcBtn.addEventListener('click', run);
      numEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          run();
        }
      });
      copyBtn.addEventListener('click', function () {
        copyToClipboard(outputText.textContent.replace(/\s+/g, ' ').trim(), copyBtn);
      });
    })();
  </script>
</body>
</html>
