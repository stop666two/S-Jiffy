<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>代理检测 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css">
<style>.detect-row{padding:8px 0;border-bottom:1px solid var(--color-border);font-size:var(--font-size-sm);display:flex;justify-content:space-between;}.detect-row:last-child{border:none;}.detect-label{color:var(--color-text-secondary);}.detect-val{font-family:var(--font-mono);font-weight:500;}.yes{color:var(--color-success);}.no{color:var(--color-text-disabled);}.unknown{color:#e37400;}</style></head><body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
<main class="tool-workspace"><h1 data-i18n="h1">代理检测</h1><p class="tool-desc" data-i18n="desc">分析浏览器环境，检测是否通过代理服务器连接网络</p>
<div class="card" style="display:flex;gap:12px;flex-wrap:wrap;"><button id="detectBtn" class="btn btn-primary" data-i18n="ui.1">开始检测</button></div>
<div class="card" id="resultCard" style="display:none;"><div id="detectResults"></div><div id="detectSummary" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--color-border);font-size:var(--font-size-sm);color:var(--color-text-secondary);"></div></div>
<div class="output-box"><span id="outputText"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
</main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
<script>(function(){
var detectBtn=document.getElementById('detectBtn'),resultCard=document.getElementById('resultCard'),detectResults=document.getElementById('detectResults'),detectSummary=document.getElementById('detectSummary'),outputText=document.getElementById('outputText'),copyBtn=document.getElementById('copyBtn');
var IP4_RE=/^\d{1,3}(\.\d{1,3}){3}$/;
function row(label,value,cls){return '<div class="detect-row"><span class="detect-label">'+label+'</span><span class="detect-val'+(cls?' '+cls:'')+'" style="font-size:12px;">'+value+'</span></div>';}
function escapeH(v){return htmlEscape(String(v));}
function getWebRTCIPs(cb){
  var local=[];var pub=[];var pc=null;var finished=false;
  function finish(){if(finished)return;finished=true;if(pc){try{pc.close();}catch(e){}}cb({local:local,pub:pub});}
  try{
    var Ctor=window.RTCPeerConnection||window.webkitRTCPeerConnection;
    if(!Ctor){finish();return;}
    pc=new Ctor({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}]});
    pc.createDataChannel('probe');
    pc.onicecandidate=function(e){
      if(!e.candidate){finish();return;}
      var parts=(e.candidate.candidate||'').split(' ');
      if(parts.length<8||!IP4_RE.test(parts[4]))return;
      var typ=parts[7];
      if(typ==='srflx'||typ==='prflx'){if(pub.indexOf(parts[4])<0)pub.push(parts[4]);}
      else if(typ==='host'){if(local.indexOf(parts[4])<0)local.push(parts[4]);}
    };
    pc.createOffer().then(function(o){return pc.setLocalDescription(o);}).then(function(){setTimeout(finish,3000);}).catch(finish);
  }catch(e){finish();}
}
function fetchPublicIP(cb){
  var apis=[
    {url:'https://api.ipify.org?format=json',parse:function(d){return d&&d.ip;}},
    {url:'https://ipapi.co/json/',parse:function(d){return d&&d.ip;}},
    {url:'https://ipinfo.io/json',parse:function(d){return d&&d.ip;}}
  ];
  var i=0;
  function next(){
    if(i>=apis.length){cb(null);return;}
    var a=apis[i++];var xhr=new XMLHttpRequest();
    var timer=setTimeout(function(){try{xhr.abort();}catch(e){}next();},8000);
    xhr.onreadystatechange=function(){
      if(xhr.readyState!==4)return;
      clearTimeout(timer);
      if(xhr.status===200){
        try{var ip=a.parse(JSON.parse(xhr.responseText));if(ip){cb(ip);return;}}catch(e){}
      }
      next();
    };
    xhr.open('GET',a.url,true);xhr.send();
  }
  next();
}
function uaHas(re){return re.test(navigator.userAgent);}
function detect(){
  detectBtn.disabled=true;
  setStatus(t('ui.checking','正在检测…'));
  var rows=[];
  var score=0;var reasons=[];
  var out='';
  rows.push(row('User Agent',escapeH(navigator.userAgent)));
  rows.push(row(t('platformLabel','平台'),escapeH(navigator.platform||t('unknown','未知'))));
  var langs=navigator.languages?navigator.languages.join(', '):navigator.language||t('unknown','未知');
  rows.push(row(t('languageLabel','语言'),escapeH(langs)));
  var tzName='';
  try{tzName=Intl.DateTimeFormat().resolvedOptions().timeZone||'';}catch(e){}
  var timezone=new Date().getTimezoneOffset();
  var tzDisplay=tzName?escapeH(tzName)+' (UTC'+(timezone<=0?'+':'-')+Math.abs(timezone/60)+')':'UTC'+(timezone<=0?'+':'-')+Math.abs(timezone/60);
  rows.push(row(t('timezoneOffsetLabel','时区'),tzDisplay));
  var isTor=uaHas(/tor|onion/i);
  rows.push(row(t('torBrowserLabel','Tor 浏览器'),isTor?t('suspected','疑似'):t('noWord','否'),isTor?'yes':'no'));
  if(isTor)score+=3;
  var vpnUAs=uaHas(/vpn|proxy|securenet|ivacy|nordvpn|expressvpn|surfshark|hotspot shield|windscribe|purevpn|private internet access/i);
  rows.push(row(t('vpnUaLabel','VPN/Proxy UA 标记'),vpnUAs?t('likelyPresent','可能存在'):t('notDetected','未检测到'),vpnUAs?'yes':'no'));
  if(vpnUAs)score+=2;
  var cookieEnabled=navigator.cookieEnabled;
  rows.push(row(t('cookieEnabledLabel','Cookie 启用'),cookieEnabled?t('yesWord','是'):t('noWord','否'),cookieEnabled?'yes':'no'));
  if(!cookieEnabled)score+=1;
  rows.push(row(t('hostLabel','当前主机'),escapeH(location.hostname)));
  rows.push(row(t('protocolLabel','协议'),escapeH(location.protocol)));
  var ref=document.referrer||t('none','(无)');
  rows.push(row(t('referrerLabel','来源页面'),escapeH(ref)));
  var conn=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
  if(conn){
    rows.push(row(t('networkTypeLabel','网络类型'),escapeH(conn.effectiveType||t('unknown','未知'))));
    rows.push(row('RTT',(conn.rtt||t('unknown','未知'))+'ms'));
    rows.push(row(t('downlinkLabel','下行速度'),(conn.downlink||t('unknown','未知'))+' Mbps'));
  }else{
    rows.push(row('Network Info API',t('unavailable','不可用'),'unknown'));
  }
  getWebRTCIPs(function(webrtc){
    var webrtcIPs=webrtc.local.concat(webrtc.pub);
    var publicIp=null;
    var render=function(){
      var webrtcPublic=webrtc.pub;
      var webrtcVal=webrtcIPs.length?webrtcIPs.join(', '):t('unavailable','不可用');
      if(webrtcIPs.length===0)rows.push(row(t('webrtcLabel','WebRTC IP 泄漏'),webrtcVal,'unknown'));
      else rows.push(row(t('webrtcLabel','WebRTC IP 泄漏'),escapeH(webrtcVal),webrtcPublic.length?'yes':'no'));
      var ipVal=publicIp?escapeH(publicIp):t('ipUnknownVal','无法判断');
      rows.push(row(t('publicIpLabel','页面出口 IP'),ipVal,publicIp?'yes':'unknown'));
      var mismatch=webrtcPublic.length&&publicIp&&webrtcPublic.indexOf(publicIp)<0;
      var same=publicIp&&webrtcPublic.length&&webrtcPublic.indexOf(publicIp)>=0;
      var cmpVal=mismatch?t('ipMismatchVal','不一致（疑似代理/VPN）'):(same?t('ipMatchVal','一致'):t('ipUnknownVal','无法判断'));
      rows.push(row(t('ipCompareLabel','IP 一致性'),cmpVal,mismatch?'yes':(same?'yes':'unknown')));
      if(mismatch)score+=4;
      var summary='';
      var cls='';
      if(score>=4){summary=t('summaryHigh','⚠️ 检测到多个代理/匿名化特征。');cls='yes';}
      else if(score>=2){summary=t('summaryMedium','ℹ️ 部分特征可能与代理环境相关。');cls='unknown';}
      else if(score>=1){summary=t('summaryLow','✅ 未检测到明显代理特征。');}
      else if(!webrtcPublic.length&&!publicIp){summary=t('summaryUnknown','无法完成检测');cls='unknown';}
      else{summary=t('summaryLow','✅ 未检测到明显代理特征。');}
      detectResults.innerHTML=rows.join('');
      detectSummary.textContent=summary;
      outputText.textContent=summary;
      resultCard.style.display='block';
      detectBtn.disabled=false;
      setStatus(t('ui.2','检测完成'));
    };
    fetchPublicIP(function(ip){publicIp=ip;render();});
  });
}
detectBtn.addEventListener('click',detect);
copyBtn.addEventListener('click',function(){if(outputText.textContent){copyToClipboard(outputText.textContent,this);setStatus(t('ui.copied','已复制'));}});
})();</script>
</body></html>
