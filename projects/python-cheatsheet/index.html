<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python 速查卡 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .py-controls { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; margin-bottom: var(--space-2); }
    .py-controls input { width: 240px; }
    .py-cats { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-bottom: var(--space-2); }
    .py-cat-btn { padding: 4px 12px; border: 1px solid var(--color-border); border-radius: 999px; font-size: var(--font-size-sm); cursor: pointer; background: var(--color-bg); color: var(--color-text-secondary); }
    .py-cat-btn.on { background: var(--color-accent); color: #fff; border-color: var(--color-accent); }
    .py-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
    @media (max-width: 720px) { .py-grid { grid-template-columns: 1fr; } }
    .py-item { border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-2); cursor: pointer; }
    .py-item:hover { border-color: var(--color-accent); box-shadow: var(--shadow-focus); }
    .py-item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-1); gap: var(--space-1); }
    .py-name { font-weight: 600; font-size: var(--font-size-sm); }
    .py-cat { font-size: var(--font-size-xs); color: var(--color-text-secondary); background: var(--color-bg-soft); padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
    .py-syntax { font-family: var(--font-mono); font-size: var(--font-size-xs); background: var(--color-bg-soft); border-radius: var(--radius-sm); padding: 4px 8px; margin-bottom: 4px; white-space: pre-wrap; word-break: break-all; }
    .py-example { font-family: var(--font-mono); font-size: var(--font-size-xs); background: var(--color-bg-soft); border-radius: var(--radius-sm); padding: 4px 8px; white-space: pre-wrap; word-break: break-all; }
    .py-empty { color: var(--color-text-secondary); font-size: var(--font-size-sm); padding: var(--space-2) 0; }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">Python 速查卡</h1>
    <p class="tool-desc" data-i18n="desc">Python 常用语法与示例，支持分类过滤与搜索，点击条目复制。</p>
    <div class="card">
      <div class="py-controls">
        <input id="searchInput" type="text" class="input js-focus-input" data-i18n-placeholder="ui.100" placeholder="搜索关键词...">
      </div>
      <div class="py-cats" id="catBar"></div>
      <div class="py-grid" id="pyGrid"></div>
    </div>
    <div id="resultBox" class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>
  (function () {
    var searchInput = document.getElementById('searchInput');
    var catBar = document.getElementById('catBar');
    var pyGrid = document.getElementById('pyGrid');
    var outputText = document.getElementById('outputText');
    var copyBtn = document.getElementById('copyBtn');
    var currentCat = 'all';
    var lastCopy = '';

    var CATS = [
      { id: 'all', key: 'ui.all', zh: '全部' },
      { id: 'basic', key: 'ui.15', zh: '变量与基础' },
      { id: 'list', key: 'ui.14', zh: '列表与切片' },
      { id: 'dict', key: 'ui.13', zh: '字典' },
      { id: 'func', key: 'ui.12', zh: '函数' },
      { id: 'exc', key: 'ui.11', zh: '异常' },
      { id: 'file', key: 'ui.10', zh: '文件读写' },
      { id: 'builtin', key: 'ui.9', zh: '内置函数' },
      { id: 'str', key: 'ui.8', zh: '字符串方法' },
      { id: 'set', key: 'ui.7', zh: '集合' },
      { id: 'deco', key: 'ui.6', zh: '装饰器' },
      { id: 'gen', key: 'ui.5', zh: '生成器' },
      { id: 'venv', key: 'ui.4', zh: '虚拟环境' },
      { id: 'lib', key: 'ui.3', zh: '常用库' }
    ];
    var CAT_BY_ID = {};
    for (var ci = 0; ci < CATS.length; ci++) CAT_BY_ID[CATS[ci].id] = CATS[ci];
    function catName(id) { var c = CAT_BY_ID[id]; return c ? t(c.key, c.zh) : id; }

    var items = [
      { cat: 'basic', name: t('ui.37','变量与类型'), syntax: 'x = 1\ny = "str"\nz = 1.5', example: 'age = 25\nname = "Tom"\npi = 3.14\nis_ok = True' },
      { cat: 'basic', name: t('ui.36','f-string 格式化'), syntax: 'f"{name} 今年 {age} 岁"', example: 'name = "Tom"\nprint(f"Hello, {name}!")' },
      { cat: 'basic', name: t('ui.35','解包赋值'), syntax: 'a, b = b, a\nx, *rest = items', example: 'a, b = 1, 2\na, b = b, a\nnums = [1, 2, 3]\nfirst, *rest = nums' },
      { cat: 'list', name: t('ui.34','列表推导式'), syntax: '[expr for x in seq if cond]', example: 'squares = [n * n for n in range(10)]\nevens = [n for n in range(20) if n % 2 == 0]' },
      { cat: 'list', name: t('ui.33','切片'), syntax: 'seq[start:stop:step]', example: 'nums = [0, 1, 2, 3, 4, 5]\nnums[1:4]   # [1, 2, 3]\nnums[::-1]  # '+t('ex.reverse','反转') },
      { cat: 'list', name: t('ui.32','列表常用方法'), syntax: 'list.append(x) / extend(seq) / remove(x)', example: 'lst = [1, 2]\nlst.append(3)\nlst.extend([4, 5])\nlst.remove(2)' },
      { cat: 'dict', name: t('ui.31','字典操作'), syntax: 'd = {"a": 1}\nd["b"] = 2\nd.get("a")', example: 'd = {"name": "Tom", "age": 25}\nd["city"] = "Beijing"\nd.get("name")      # Tom\nitems = d.items()' },
      { cat: 'dict', name: t('ui.30','字典推导与合并'), syntax: '{k: v for ...}\n{a: b, **c}', example: 'sq = {n: n * n for n in range(3)}\nd1 = {"a": 1}\nd2 = {"b": 2}\nmerged = {**d1, **d2}' },
      { cat: 'func', name: t('ui.29','函数定义'), syntax: 'def f(a, b=10):\n    return a + b', example: 'def greet(name, greeting="Hi"):\n    return f"{greeting}, {name}"' },
      { cat: 'func', name: t('ui.28','参数类型'), syntax: 'def f(*args, **kwargs):', example: 'def log(*args, **kwargs):\n    print(args, kwargs)\n\nlog(1, 2, key="v")' },
      { cat: 'func', name: t('ui.27','lambda 匿名函数'), syntax: 'lambda x: x + 1', example: 'double = lambda x: x * 2\nsorted([3, 1, 2], key=lambda x: -x)' },
      { cat: 'exc', name: 'try / except', syntax: 'try:\n    ...\nexcept ValueError:\n    ...\nfinally:\n    ...', example: 'try:\n    n = int("abc")\nexcept ValueError:\n    print("'+t('ex.convFailed','转换失败')+'")' },
      { cat: 'exc', name: t('ui.26','抛出异常'), syntax: 'raise ValueError("msg")', example: 'def check(x):\n    if x < 0:\n        raise ValueError("'+t('ex.negative','不能为负数')+'")\n    return x' },
      { cat: 'file', name: t('ui.10','文件读写'), syntax: 'with open("f.txt", "r") as f:\n    data = f.read()', example: 'with open("data.txt", "w", encoding="utf-8") as f:\n    f.write("hello")\n\nwith open("data.txt", "r") as f:\n    for line in f:\n        print(line.strip())' },
      { cat: 'builtin', name: t('ui.25','常用内置函数'), syntax: 'len() / type() / range() / zip() / enumerate()', example: 'names = ["a", "b"]\nfor i, n in enumerate(names, 1):\n    print(i, n)\n\nlist(zip([1, 2], ["x", "y"]))' },
      { cat: 'builtin', name: t('ui.24','排序与聚合'), syntax: 'sorted() / min() / max() / sum()', example: 'nums = [3, 1, 2]\nsorted(nums)         # [1, 2, 3]\nsum(nums)            # 6\nmax(nums, key=lambda x: -x)' },
      { cat: 'str', name: t('ui.23','字符串常用方法'), syntax: 's.upper() / strip() / split() / join()', example: 's = "  hello world  "\ns.strip()\ns.split()\n"-".join(["a", "b"])\ns.replace("world", "python")' },
      { cat: 'str', name: t('ui.22','字符串判断'), syntax: 's.startswith() / isdigit() / find()', example: 'url = "https://example.com"\nurl.startswith("https")\n"123".isdigit()\n"abc".find("b")  # 1' },
      { cat: 'set', name: t('ui.21','集合操作'), syntax: 'set() / '+t('ex.union','并集')+' | / '+t('ex.intersection','交集')+' & / '+t('ex.difference','差集')+' -', example: 'a = {1, 2, 3}\nb = {2, 3, 4}\na | b   # {1, 2, 3, 4}\na & b   # {2, 3}\na - b   # {1}' },
      { cat: 'deco', name: t('ui.6','装饰器'), syntax: '@deco\ndef f(): ...', example: 'import time\n\ndef timer(func):\n    def wrapper(*args, **kwargs):\n        t0 = time.time()\n        r = func(*args, **kwargs)\n        print("'+t('ex.elapsed','耗时')+'", time.time() - t0)\n        return r\n    return wrapper\n\n@timer\ndef work():\n    time.sleep(1)' },
      { cat: 'gen', name: t('ui.5','生成器'), syntax: 'def gen():\n    yield x', example: 'def count_up(n):\n    i = 0\n    while i < n:\n        yield i\n        i += 1\n\nfor x in count_up(3):\n    print(x)' },
      { cat: 'gen', name: t('ui.20','生成器表达式'), syntax: '(expr for x in seq)', example: 'sum(x * x for x in range(10))\n\n# '+t('ex.lazy','内存友好的惰性求值') },
      { cat: 'venv', name: t('ui.19','venv 虚拟环境'), syntax: 'python -m venv .venv\n.venv\\Scripts\\activate', example: '# Windows\npython -m venv .venv\n.venv\\Scripts\\activate\npip install requests\npip freeze > requirements.txt' },
      { cat: 'lib', name: t('ui.18','常用库导入'), syntax: 'import os\nfrom datetime import datetime', example: 'import os\nimport sys\nimport json\nfrom datetime import datetime\nfrom collections import defaultdict\nfrom pathlib import Path' },
      { cat: 'lib', name: t('ui.17','数据处理导入'), syntax: 'import pandas as pd\nimport numpy as np', example: 'import pandas as pd\nimport numpy as np\n\ndf = pd.DataFrame({"a": [1, 2], "b": [3, 4]})' },
      { cat: 'lib', name: t('ui.16','正则表达式'), syntax: 'import re\nre.search(r"\\d+", s)', example: 'import re\n\nm = re.search(r"\\d+", "abc123")\nm.group() if m else None' }
    ];

    function buildCats() {
      var html = '';
      for (var i = 0; i < CATS.length; i++) {
        var label = catName(CATS[i].id);
        html += '<button class="py-cat-btn' + (CATS[i].id === currentCat ? ' on' : '') + '" data-cat="' + CATS[i].id + '">' + htmlEscape(label) + '</button>';
      }
      catBar.innerHTML = html;
      var btns = catBar.querySelectorAll('.py-cat-btn');
      for (var j = 0; j < btns.length; j++) {
        btns[j].onclick = (function (id) {
          return function () { currentCat = id; buildCats(); render(); };
        })(btns[j].getAttribute('data-cat'));
      }
    }

    function render() {
      var q = searchInput.value.toLowerCase();
      var filtered = [];
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (currentCat !== 'all' && it.cat !== currentCat) { continue; }
        if (q && it.name.toLowerCase().indexOf(q) === -1 && it.syntax.toLowerCase().indexOf(q) === -1) { continue; }
        filtered.push(it);
      }
      if (!filtered.length) {
        pyGrid.innerHTML = '<div class="py-empty">'+t('ui.101','没有匹配的条目')+'</div>';
        return;
      }
      var html = '';
      for (var k = 0; k < filtered.length; k++) {
        var f = filtered[k];
        html += '<div class="py-item" data-idx="' + k + '">';
        html += '<div class="py-item-head"><span class="py-name">' + htmlEscape(f.name) + '</span><span class="py-cat">' + htmlEscape(catName(f.cat)) + '</span></div>';
        html += '<div class="py-syntax">' + htmlEscape(f.syntax) + '</div>';
        html += '<div class="py-example">' + htmlEscape(f.example) + '</div>';
        html += '</div>';
      }
      pyGrid.innerHTML = html;
      var cards = pyGrid.querySelectorAll('.py-item');
      for (var m = 0; m < cards.length; m++) {
        cards[m].onclick = (function (idx) {
          return function () {
            var it = filtered[idx];
            lastCopy = it.example;
            outputText.innerHTML = '<div style="font-size:var(--font-size-sm);margin-bottom:var(--space-1);"><b>' + htmlEscape(it.name) + '</b> · ' + htmlEscape(catName(it.cat)) + '</div><div style="font-family:var(--font-mono);font-size:var(--font-size-sm);white-space:pre-wrap;">' + htmlEscape(it.example) + '</div>';
            copyBtn.onclick = function () { copyToClipboard(lastCopy, copyBtn); };
            setStatus(t('ui.2','已选中「') + it.name + t('ui.1','」，点击复制按钮可复制示例'));
          };
        })(m);
      }
    }

    searchInput.addEventListener('input', render);
    buildCats();
    render();
  })();
  </script>
</body>
</html>
