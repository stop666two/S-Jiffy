<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>二维码读取器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <script src="../../assets/vendor/jsQR.js"></script>
<style>
.drop-zone{border:2px dashed var(--color-border);border-radius:var(--radius-lg);padding:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:border-color 0.15s,background 0.15s;text-align:center;}
.drop-zone:hover{border-color:var(--color-text-primary);background:var(--color-bg-soft);}
.drop-zone.drag-on{border-color:var(--color-accent);background:var(--color-bg-soft);}
.drop-icon{font-size:32px;color:var(--color-text-disabled);margin-bottom:8px;}
.qr-result{border:1px solid rgba(52,101,56,0.35);background:rgba(52,101,56,0.08);border-radius:var(--radius-md);padding:14px;margin-top:var(--space-2);}
.qr-result-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.qr-result-text{font-family:var(--font-mono);font-size:13px;word-break:break-all;}
.qr-open{margin-top:8px;display:inline-block;color:var(--color-accent-hover);font-size:var(--font-size-sm);}
.error-detail{font-size:13px;padding:8px 12px;border-radius:var(--radius-sm);margin-top:8px;background:rgba(159,47,45,0.08);border:1px solid rgba(159,47,45,0.35);color:var(--color-error);white-space:pre-wrap;}
.preview-img{max-width:280px;max-height:280px;border-radius:var(--radius-md);border:1px solid var(--color-border);margin-top:var(--space-2);}
</style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
  <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">QR 码读取器</h1>
    <p class="tool-desc" data-i18n="desc">上传或拖入二维码图片，使用原生 BarcodeDetector / jsQR 解码，支持 URL 一键打开。</p>
    <div class="card">
      <div class="drop-zone" id="dropZone">
        <span class="drop-icon">◱</span>
        <p style="font-size:var(--font-size-sm);color:var(--color-text-secondary);" data-i18n="dropQRImage">拖入QR码图片或点击上传</p>
        <p style="font-size:var(--font-size-xs);color:var(--color-text-disabled);margin-top:4px;">PNG, JPG, WebP, GIF</p>
      </div>
      <input type="file" id="fileInput" accept="image/*" style="display:none">
      <div style="display:flex;gap:8px;margin-top:var(--space-2);flex-wrap:wrap;">
        <button id="fileBtn" class="btn btn-secondary" style="height:36px;font-size:13px;min-width:auto;" data-i18n="common.fileSelect">📁 选择文件</button>
        <button id="clearBtn" class="btn btn-secondary" style="height:36px;font-size:13px;min-width:auto;" data-i18n="ui.clear">清空</button>
      </div>
      <img id="previewImg" class="preview-img" style="display:none;" alt="Preview">
      <div id="errorBox" class="error-detail" style="display:none;"></div>
      <div id="resultBox" class="qr-result" style="display:none;">
        <div class="qr-result-head">
          <span style="color:var(--color-success);font-size:var(--font-size-sm);" data-i18n="qrCodeDecoded">QR码已解码</span>
          <button id="copyBtn" class="btn btn-secondary" style="height:30px;font-size:12px;min-width:auto;" data-i18n="ui.copy">复制</button>
        </div>
        <div id="resultText" class="qr-result-text"></div>
        <a id="openLink" class="qr-open" href="#" target="_blank" rel="noopener noreferrer" style="display:none;" data-i18n="openUrl">打开链接</a>
      </div>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>
    (function() {
      'use strict';
      var fileInput = document.getElementById('fileInput');
      var fileBtn = document.getElementById('fileBtn');
      var dropZone = document.getElementById('dropZone');
      var previewImg = document.getElementById('previewImg');
      var errorBox = document.getElementById('errorBox');
      var resultBox = document.getElementById('resultBox');
      var resultText = document.getElementById('resultText');
      var openLink = document.getElementById('openLink');
      var copyBtn = document.getElementById('copyBtn');
      var decodedText = '';

      function showError(msg){
        errorBox.textContent = msg;
        errorBox.style.display = 'block';
        setStatus(msg, 'error');
      }

      function decodeImage(img){
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        var imageData;
        try { imageData = ctx.getImageData(0, 0, canvas.width, canvas.height); }
        catch (e) { showError(t('canvasError','图片读取失败（可能超过 Canvas 限制）')); return; }
        try {
          if (typeof window !== 'undefined' && 'BarcodeDetector' in window) {
            var detector = new window.BarcodeDetector({ formats: ['qr_code'] });
            detector.detect(imageData).then(function (barcodes) {
              if (barcodes.length > 0 && barcodes[0].rawValue) {
                setResult(barcodes[0].rawValue);
              } else {
                runJsQR(imageData);
              }
            }).catch(function () { runJsQR(imageData); });
          } else {
            runJsQR(imageData);
          }
        } catch (e) {
          runJsQR(imageData);
        }
      }

      function runJsQR(imageData){
        try {
          var code = jsQR(imageData.data, imageData.width, imageData.height);
          if (code && code.data) {
            setResult(code.data);
          } else {
            errorBox.style.display = 'none';
            resultBox.style.display = 'none';
            showError(t('qrNotFound','未在图片中检测到二维码。'));
          }
        } catch (e) {
          showError(t('decodeFailed','解码出错: ')+e.message);
        }
      }

      function setResult(text){
        decodedText = text;
        errorBox.style.display = 'none';
        resultText.textContent = text;
        resultBox.style.display = 'block';
        if (text.indexOf('http://') === 0 || text.indexOf('https://') === 0) {
          openLink.href = text;
          openLink.style.display = 'inline-block';
        } else {
          openLink.style.display = 'none';
        }
        setStatus(t('decodedOk','解码成功'));
      }

      function handleFile(file){
        if (!file) return;
        if (file.type.indexOf('image/') !== 0) {
          showError(t('notImage','请上传图片文件'));
          return;
        }
        errorBox.style.display = 'none';
        resultBox.style.display = 'none';
        var reader = new FileReader();
        reader.onload = function(e) {
          var dataUrl = e.target.result;
          previewImg.src = dataUrl;
          previewImg.style.display = 'block';
          var img = new Image();
          img.onload = function() { decodeImage(img); };
          img.onerror = function() { showError(t('imgLoadFailed','图片加载失败')); };
          img.src = dataUrl;
        };
        reader.onerror = function() { showError(t('readFailed','文件读取失败')); };
        reader.readAsDataURL(file);
      }

      if (fileBtn) fileBtn.addEventListener('click', function() { fileInput.click(); });
      fileInput.addEventListener('change', function() {
        var file = fileInput.files[0];
        handleFile(file);
        this.value = '';
      });

      dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('drag-on'); });
      dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('drag-on'); });
      dropZone.addEventListener('drop', function(e) {
        e.preventDefault();
        dropZone.classList.remove('drag-on');
        var f = e.dataTransfer.files[0];
        if (f) handleFile(f);
      });
      dropZone.addEventListener('click', function() { fileInput.click(); });

      copyBtn.addEventListener('click', function() {
        if (decodedText) { copyToClipboard(decodedText, copyBtn); setStatus(t('common.copied','已复制')); }
      });
      document.getElementById('clearBtn').addEventListener('click', function() {
        fileInput.value=''; previewImg.style.display='none'; previewImg.src='';
        errorBox.style.display='none'; resultBox.style.display='none'; resultText.textContent='';
        decodedText=''; openLink.style.display='none'; setStatus('');
      });
    })();
  </script>
</body>
</html>
