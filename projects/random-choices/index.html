<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>随机选择器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .rc-row { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-bottom:var(--space-3); }
    .rc-row .field { flex:1; min-width:100px; }
    .rc-row label { display:block; font-size:var(--font-size-sm); color:var(--color-text-secondary); margin-bottom:4px; }
  </style>
</head>
<body>
  <header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">随机选择器</h1>
    <p class="tool-desc" data-i18n="desc">从列表中随机选取指定数量的项目，支持允许重复。</p>
    <div class="card">
      <div class="rc-row">
        <div class="field" style="flex:2;"><label for="inputArea" data-i18n="ui.1">选项列表（每行一个）</label><textarea id="inputArea" class="input textarea" style="min-height:120px;" data-i18n="ui.2">选项A&#10;选项B&#10;选项C&#10;选项D&#10;选项E</textarea></div>
      </div>
      <div class="rc-row">
        <div class="field"><label for="pickCount" data-i18n="ui.3">选取数量</label><input id="pickCount" class="input" type="number" value="1" min="1" max="1000"></div>
      </div>
      <div class="rc-row">
        <label style="display:flex;align-items:center;gap:8px;"><input id="dupChk" type="checkbox" checked> 允许重复</label>
      </div>
      <div><button id="genBtn" class="btn btn-primary" data-i18n="ui.4">选取</button></div>
    </div>
    <div class="output-box"><span id="outputText" style="display:block;padding-right:60px;"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
  </main>
  <footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script></script>
  <script>(function(){
    var inputEl = document.getElementById('inputArea');
    var pickEl = document.getElementById('pickCount');
    var dupChk = document.getElementById('dupChk');
    var genBtn = document.getElementById('genBtn');
    var outputEl = document.getElementById('outputText');
    var copyBtn = document.getElementById('copyBtn');

    function cryptoIndex(len) {
      var bytes = new Uint32Array(1);
      crypto.getRandomValues(bytes);
      return bytes[0] % len;
    }

    function generate() {
      var lines = inputEl.value.split('\n').filter(function(s) { return s.trim() !== ''; });
      if (lines.length === 0) { setStatus(t('ui.100','请输入至少一个选项'), 'error'); return; }
      var pick = parseInt(pickEl.value, 10) || 1;
      if (pick < 1) pick = 1;
      if (pick > 10000) pick = 10000;
      var allowDup = dupChk.checked;

      if (!allowDup && pick > lines.length) {
        setStatus('不允许重复时选取数量不能超过选项数 (' + lines.length + ')', 'error');
        return;
      }

      var result = [];
      if (allowDup) {
        for (var i = 0; i < pick; i++) result.push(lines[cryptoIndex(lines.length)]);
      } else {
        var shuffled = lines.slice();
        for (var i = shuffled.length - 1; i > 0; i--) {
          var j = cryptoIndex(i + 1);
          var tmp = shuffled[i];
          shuffled[i] = shuffled[j];
          shuffled[j] = tmp;
        }
        result = shuffled.slice(0, pick);
      }
      outputEl.textContent = result.join('\n');
      setStatus(t('ui.5','已选取 ') + result.length + t('ui.items',' 项'));
    }

    genBtn.addEventListener('click', generate);
    copyBtn.addEventListener('click', function() { if (outputEl.textContent) { copyToClipboard(outputEl.textContent, copyBtn); setStatus(t('ui.copied','已复制')); } });
  })();</script>
</body>
</html>
