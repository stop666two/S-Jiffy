<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>随机姓名生成器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .rn-row { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-bottom:var(--space-3); }
    .rn-row .field { flex:1; min-width:100px; }
    .rn-row label { display:block; font-size:var(--font-size-sm); color:var(--color-text-secondary); margin-bottom:4px; }
  </style>
</head>
<body>
  <header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">随机姓名生成</h1>
    <p class="tool-desc" data-i18n="desc">生成随机人名，支持性别和国家选择（英文/中文/日文）。</p>
    <div class="card">
      <div class="rn-row">
        <div class="field"><label for="countVal" data-i18n="ui.quantity">数量</label><input id="countVal" class="input" type="number" value="5" min="1" max="100"></div>
        <div class="field"><label for="genderSel" data-i18n="ui.1">性别</label>
          <select id="genderSel" class="input" style="width:auto;min-width:80px;">
            <option value="any" data-i18n="ui.all">全部</option>
            <option value="male" data-i18n="ui.2">男性</option>
            <option value="female" data-i18n="ui.3">女性</option>
          </select>
        </div>
        <div class="field"><label for="nationalitySel" data-i18n="ui.4">国家</label>
          <select id="nationalitySel" class="input" style="width:auto;min-width:80px;">
            <option value="en" data-i18n="ui.5">英文</option>
            <option value="cn" data-i18n="ui.6">中文</option>
            <option value="jp" data-i18n="ui.7">日文</option>
          </select>
        </div>
      </div>
      <div><button id="genBtn" class="btn btn-primary" data-i18n="ui.generate">生成</button></div>
    </div>
    <div class="output-box"><span id="outputText" style="display:block;padding-right:60px;"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
  </main>
  <footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>(function(){
    var countEl = document.getElementById('countVal');
    var genderEl = document.getElementById('genderSel');
    var natEl = document.getElementById('nationalitySel');
    var genBtn = document.getElementById('genBtn');
    var outputEl = document.getElementById('outputText');
    var copyBtn = document.getElementById('copyBtn');

    var cnSurnames = [ t('ui.125','王'), t('ui.124','李'), t('ui.123','张'), t('ui.122','刘'), t('ui.121','陈'), t('ui.120','杨'), t('ui.119','黄'), t('ui.118','赵'), t('ui.week','周'), t('ui.117','吴'), t('ui.116','徐'), t('ui.115','孙'), t('ui.114','马'), t('ui.113','朱'), t('ui.112','胡'), t('ui.111','郭'), t('ui.110','何'), t('ui.109','高'), t('ui.50','林'), t('ui.108','罗')];
    var cnMale = [ t('ui.107','伟'), t('ui.106','强'), t('ui.105','磊'), t('ui.104','军'), t('ui.103','勇'), t('ui.102','杰'), t('ui.101','涛'), t('ui.100','明'), t('ui.99','超'), t('ui.98','辉'), t('ui.97','鹏'), t('ui.96','飞'), t('ui.95','斌'), t('ui.94','俊'), t('ui.93','志'), t('ui.92','建'), t('ui.91','平'), t('ui.90','刚'), t('ui.89','龙'), t('ui.88','华')];
    var cnFemale = [ t('ui.87','芳'), t('ui.86','娜'), t('ui.85','敏'), t('ui.84','静'), t('ui.83','丽'), t('ui.82','娟'), t('ui.81','艳'), t('ui.80','玲'), t('ui.79','婷'), t('ui.78','雪'), t('ui.77','琳'), t('ui.76','霞'), t('ui.75','萍'), t('ui.74','红'), t('ui.73','梅'), t('ui.72','燕'), t('ui.16','晶'), t('ui.71','颖'), t('ui.70','茜'), t('ui.69','倩')];
    var enMaleFirst = ['James','John','Robert','Michael','William','David','Richard','Joseph','Thomas','Charles','Daniel','Matthew','Anthony','Mark','Steven','Andrew','Paul','Joshua','Kenneth','Kevin'];
    var enFemaleFirst = ['Mary','Patricia','Jennifer','Linda','Barbara','Elizabeth','Susan','Jessica','Sarah','Karen','Lisa','Nancy','Betty','Margaret','Sandra','Ashley','Dorothy','Kimberly','Emily','Donna'];
    var enLast = ['Smith','Johnson','Williams','Brown','Jones','Garcia','Miller','Davis','Rodriguez','Martinez','Hernandez','Lopez','Gonzalez','Wilson','Anderson','Thomas','Taylor','Moore','Jackson','Martin'];
    var jpSurnames = [ t('ui.68','佐藤'), t('ui.67','铃木'), t('ui.66','高桥'), t('ui.65','田中'), t('ui.64','渡边'), t('ui.63','伊藤'), t('ui.62','山本'), t('ui.61','中村'), t('ui.60','小林'), t('ui.59','加藤'), t('ui.58','吉田'), t('ui.57','山田'), t('ui.56','佐々木'), t('ui.55','山口'), t('ui.54','松下'), t('ui.53','松本'), t('ui.52','井上'), t('ui.51','木村'), t('ui.50','林'), t('ui.49','清水')];
    var jpMale = [ t('ui.48','大辅'), t('ui.47','健太'), t('ui.46','翔太'), t('ui.45','拓也'), t('ui.44','直树'), t('ui.43','瑛太'), t('ui.42','亮太'), t('ui.41','龙也'), t('ui.40','和也'), t('ui.39','正人'), t('ui.38','一辉'), t('ui.37','隼人'), t('ui.36','海斗'), t('ui.35','优斗'), t('ui.34','奏太'), t('ui.33','大和'), t('ui.32','凑'), t('ui.31','莲'), t('ui.30','阳斗'), t('ui.29','苍')];
    var jpFemale = [ t('ui.28','美咲'), t('ui.27','葵'), t('ui.26','爱美'), t('ui.25','优香'), t('ui.24','花子'), t('ui.23','千寻'), t('ui.22','理恵'), t('ui.21','真由美'), t('ui.20','薰'), t('ui.19','麻衣'), t('ui.18','智子'), t('ui.17','由美'), t('ui.16','晶'), t('ui.15','裕美'), t('ui.14','纪子'), t('ui.13','由纪'), t('ui.12','直美'), t('ui.11','清香'), t('ui.10','明美'), t('ui.9','久美子')];

    function pick(arr) {
      var b = new Uint8Array(1);
      crypto.getRandomValues(b);
      return arr[b[0] % arr.length];
    }

    function generate() {
      var count = parseInt(countEl.value, 10) || 1;
      if (count < 1) count = 1;
      if (count > 1000) count = 1000;
      var gender = genderEl.value;
      var nat = natEl.value;
      var result = [];

      for (var i = 0; i < count; i++) {
        var g = gender;
        if (g === 'any') {
          var gb = new Uint8Array(1);
          crypto.getRandomValues(gb);
          g = gb[0] < 128 ? 'male' : 'female';
        }
        if (nat === 'cn') {
          var surname = pick(cnSurnames);
          var given = g === 'male' ? pick(cnMale) : pick(cnFemale);
          result.push(surname + given);
        } else if (nat === 'jp') {
          var surname = pick(jpSurnames);
          var given = g === 'male' ? pick(jpMale) : pick(jpFemale);
          result.push(surname + ' ' + given);
        } else {
          var first = g === 'male' ? pick(enMaleFirst) : pick(enFemaleFirst);
          var last = pick(enLast);
          result.push(first + ' ' + last);
        }
      }
      outputEl.textContent = result.join('\n');
      setStatus(t('ui.generated','已生成 ') + count + t('ui.8',' 个姓名'));
    }

    genBtn.addEventListener('click', generate);
    copyBtn.addEventListener('click', function() { if (outputEl.textContent) { copyToClipboard(outputEl.textContent, copyBtn); setStatus(t('ui.copied','已复制')); } });
  })();</script>
</body>
</html>
