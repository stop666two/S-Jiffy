    ];

    var searchInput = document.getElementById('searchInput');
    var catSelect = document.getElementById('catSelect');
    var cmdList = document.getElementById('cmdList');
    var resultCount = document.getElementById('resultCount');
    var outputText = document.getElementById('outputText');
    var copyBtn = document.getElementById('copyBtn');
    var currentCmd = '';

    function initCats() {
      for (var i = 0; i < CATS.length; i++) {
        var opt = document.createElement('option');
        opt.value = CATS[i];
        opt.textContent = CAT_LABELS[CATS[i]];
        catSelect.appendChild(opt);
      }
    }

    function render() {
      var q = searchInput.value.toLowerCase().trim();
      var cat = catSelect.value;
      var items = [];
      for (var i = 0; i < DATA.length; i++) {
        var d = DATA[i];
        if (cat && d.cat !== cat) continue;
        if (q) {
          var hay = (d.name + ' ' + d.syntax + ' ' + d.desc).toLowerCase();
          if (hay.indexOf(q) === -1) continue;
        }
        items.push(d);
      }
      resultCount.textContent = t('ui.total','共 ') + items.length + ' / ' + DATA.length + t('ui.4',' 条命令');
      if (items.length === 0) {
        var noMatchMsg = t('ui.nomatch','没有匹配的命令，换个关键词试试。');
        cmdList.innerHTML = '<p style="font-size:var(--font-size-sm);color:var(--color-text-secondary)">' + noMatchMsg + '</p>';
        return;
      }
      var html = '';
      for (var j = 0; j < items.length; j++) {
        var it = items[j];
        html += '<div class="cmd-card" data-syntax="' + htmlEscape(it.syntax) + '">'
          + '<div class="cmd-head"><span class="cmd-name">' + htmlEscape(it.name) + '</span><span class="cmd-cat">' + htmlEscape(CAT_LABELS[it.cat] || it.cat) + '</span></div>'
          + '<div class="cmd-syntax">' + htmlEscape(it.syntax) + '</div>'
          + '<div class="cmd-desc">' + htmlEscape(it.desc) + '</div>'
          + '</div>';
      }
      cmdList.innerHTML = html;
      var cards = cmdList.getElementsByClassName('cmd-card');
      for (var k = 0; k < cards.length; k++) {
        cards[k].onclick = (function (el) {
          return function () {
            var syntax = el.getAttribute('data-syntax');
            currentCmd = syntax;
            outputText.textContent = syntax;
            copyToClipboard(syntax, copyBtn);
            setStatus(t('ui.3','已复制命令语法'));
          };
        })(cards[k]);
      }
    }

    initCats();
    render();
    searchInput.oninput = render;
    catSelect.onchange = render;
    copyBtn.onclick = function () {
      if (currentCmd) {
        copyToClipboard(currentCmd, copyBtn);
      } else {
        setStatus(t('ui.165','请先点击一条命令卡片'), 'error');
      }
    };
  })();
  </script>
