<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>正则构建器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css"><style>.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.row label{font-size:13px;color:var(--color-text-secondary);display:block;margin-bottom:4px}.row .input{width:130px}.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.res-item{padding:12px;background:var(--color-bg-soft);border-radius:8px;text-align:center}.res-item .v{font-size:20px;font-weight:600}.res-item .l{font-size:12px;color:var(--color-text-secondary);margin-top:4px}</style></head><body><header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a></header><main class="tool-workspace"><h1 data-i18n="h1">正则构建器</h1><p class="tool-desc" data-i18n="desc">通过可视化选项构建正则表达式。</p><div class="card"><div class="row"><div><label data-i18n="ui.1">匹配文本</label><input id="inputText" class="input" value="hello123@example.com" style="width:100%"></div></div>
<div class="row"><div><label data-i18n="ui.2">模式预设</label><select id="preset" class="input" style="width:auto"><option value="" data-i18n="ui.3">自定义</option><option value="\d+" data-i18n="ui.4">数字</option><option value="[a-zA-Z]+" data-i18n="ui.5">字母</option><option value="\w+@\w+\.\w+" data-i18n="ui.6">邮箱</option><option value="https?://[^\s]+">URL</option><option value="1[3-9]\d{9}" data-i18n="ui.7">手机号</option></select></div></div>
<div class="row"><button id="matchBtn" class="btn btn-primary" data-i18n="ui.8">匹配</button><button id="clearBtn" class="btn btn-secondary" style="min-width:auto;padding:0 12px" data-i18n="ui.clear">清空</button></div></div><div class="output-box"><span id="outputText" style="display:block;padding-right:60px;"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div></main><footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer><script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script><script>(function(){var inp=document.getElementById("inputText"),pr=document.getElementById("preset"),o=document.getElementById("outputText");
document.getElementById("matchBtn").addEventListener("click",function(){var text=inp.value,pat=pr.value;if(!text){setStatus(t('ui.100','请输入文本'),"error");return}
if(!pat){setStatus(t('ui.101','请选择或输入模式'),"error");return}try{var re=new RegExp(pat,"g");var matches=text.match(re);o.textContent=matches?t('matchResult','匹配 {n} 处').replace('{n}',matches.length)+":\n"+matches.join("\n"):t('noMatch','无匹配');setStatus(t('matchResult','匹配 {n} 处').replace('{n}',matches?matches.length:0))}catch(e){setStatus(t('regexError','正则错误: ')+e.message,"error")}});
document.getElementById("clearBtn").addEventListener("click",function(){inp.value="";pr.value="";o.textContent="";setStatus("")});
document.getElementById("copyBtn").addEventListener("click",function(){if(o.textContent){copyToClipboard(o.textContent,this);setStatus(t('ui.102','已复制'))}});})();</script></body></html>
