<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>取整工具 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .rt-row { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-bottom:var(--space-3); }
    .rt-row .field { flex:1; min-width:100px; }
    .rt-row label { display:block; font-size:var(--font-size-sm); color:var(--color-text-secondary); margin-bottom:4px; }
    .result-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:var(--space-2); }
    .result-item { background:var(--color-bg); border:1px solid var(--color-border); border-radius:var(--radius-md); padding:var(--space-2); }
    .result-item .label { font-size:var(--font-size-sm); color:var(--color-text-secondary); }
    .result-item .value { font-size:var(--font-size-lg); font-weight:600; }
  </style>
</head>
<body>
  <header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">数值取整工具</h1>
    <p class="tool-desc" data-i18n="desc">对一个数值同时展示向下取整、向上取整、四舍五入和截断取整四种结果。</p>
    <div class="card">
      <div class="rt-row">
        <div class="field"><label for="inputVal" data-i18n="ui.1">输入数值</label><input id="inputVal" class="input" type="number" value="3.14159" step="any"></div>
        <div class="field"><label for="decVal" data-i18n="ui.2">小数位数</label><input id="decVal" class="input" type="number" value="2" min="0" max="15"></div>
      </div>
      <div><button id="genBtn" class="btn btn-primary" data-i18n="ui.calc">计算</button></div>
      <div class="result-grid" id="resultGrid">
        <div class="result-item"><div class="label" data-i18n="ui.3">向下取整 (floor)</div><div class="value" id="floorVal">-</div></div>
        <div class="result-item"><div class="label" data-i18n="ui.4">向上取整 (ceil)</div><div class="value" id="ceilVal">-</div></div>
        <div class="result-item"><div class="label" data-i18n="ui.5">四舍五入 (round)</div><div class="value" id="roundVal">-</div></div>
        <div class="result-item"><div class="label" data-i18n="ui.6">截断取整 (trunc)</div><div class="value" id="truncVal">-</div></div>
      </div>
    </div>
    <div class="output-box"><span id="outputText" style="display:block;padding-right:60px;"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
  </main>
  <footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>(function(){
    var inputEl = document.getElementById('inputVal');
    var decEl = document.getElementById('decVal');
    var genBtn = document.getElementById('genBtn');
    var outputEl = document.getElementById('outputText');
    var copyBtn = document.getElementById('copyBtn');

    function generate() {
      var val = parseFloat(inputEl.value);
      if (isNaN(val)) { setStatus(t('ui.100','请输入有效数值'), 'error'); return; }
      var dec = parseInt(decEl.value, 10);
      if (isNaN(dec) || dec < 0) dec = 0;
      if (dec > 15) dec = 15;

      var factor = Math.pow(10, dec);
      var floorV = Math.floor(val * factor) / factor;
      var ceilV = Math.ceil(val * factor) / factor;
      var roundV = Math.round(val * factor) / factor;
      var truncV = val >= 0 ? Math.floor(val * factor) / factor : Math.ceil(val * factor) / factor;
      truncV = parseFloat(truncV.toFixed(dec));

      document.getElementById('floorVal').textContent = floorV.toFixed(dec);
      document.getElementById('ceilVal').textContent = ceilV.toFixed(dec);
      document.getElementById('roundVal').textContent = roundV.toFixed(dec);
      document.getElementById('truncVal').textContent = truncV.toFixed(dec);

      outputEl.textContent = 'Floor: ' + floorV.toFixed(dec) + ', Ceil: ' + ceilV.toFixed(dec) + ', Round: ' + roundV.toFixed(dec) + ', Trunc: ' + truncV.toFixed(dec);
      setStatus(t('ui.7','取整完成'));
    }

    genBtn.addEventListener('click', generate);
    copyBtn.addEventListener('click', function() { if (outputEl.textContent) { copyToClipboard(outputEl.textContent, copyBtn); setStatus(t('ui.copied','已复制')); } });
  })();</script>
</body>
</html>
