<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSA 密钥对生成器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .pem-box { margin-top: var(--space-3); }
    .pem-box label { font-size: var(--font-size-xs); color: var(--color-text-secondary); display: block; margin-bottom: 4px; }
    .pem-area { background: var(--color-bg-soft); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-2); font-family: var(--font-mono); font-size: 12px; line-height: 1.4; white-space: pre-wrap; word-break: break-all; min-height: 120px; position: relative; margin-bottom: var(--space-3); }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
  <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a></header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">RSA 密钥对生成器</h1>
    <p class="tool-desc" data-i18n="desc">使用 Web Crypto API 生成 RSA 密钥对，输出 PEM 格式。<span id="httpsWarning" style="display:none;font-size:var(--font-size-xs);color:var(--color-error);margin-top:4px;" data-i18n="ui.1">⚠ 需 HTTPS/localhost 环境</span></p>
    <div class="card" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      <label style="font-size:var(--font-size-sm);color:var(--color-text-secondary);" data-i18n="ui.2">密钥长度</label>
      <select id="bitsSelect" class="input" style="width:auto;min-width:90px;">
        <option value="1024" data-i18n="ui.3">1024 位</option>
        <option value="2048" selected data-i18n="ui.4">2048 位</option>
        <option value="4096" data-i18n="ui.5">4096 位</option>
      </select>
      <button id="generateBtn" class="btn btn-primary" data-i18n="ui.6">生成密钥对</button>
    </div>
    <div class="pem-box">
      <label data-i18n="ui.7">公钥 (Public Key)</label>
      <div class="pem-area" id="publicKeyArea" data-i18n="ui.8">点击上方按钮生成</div>
      <label data-i18n="ui.9">私钥 (Private Key)</label>
      <div class="pem-area" id="privateKeyArea" data-i18n="ui.8">点击上方按钮生成</div>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <button id="copyPubBtn" class="btn btn-secondary" data-i18n="ui.10">复制公钥</button>
      <button id="copyPrivBtn" class="btn btn-secondary" data-i18n="ui.11">复制私钥</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>(function(){
    var bitsEl = document.getElementById('bitsSelect');
    var pubArea = document.getElementById('publicKeyArea');
    var privArea = document.getElementById('privateKeyArea');
    var pubPem = '', privPem = '';
    function arrayBufToPem(buf, label) {
      var bytes = String.fromCharCode.apply(null, new Uint8Array(buf));
      var b64 = btoa(bytes);
      var lines = [];
      lines.push('-----BEGIN ' + label + '-----');
      for (var i = 0; i < b64.length; i += 64) { lines.push(b64.substr(i, 64)); }
      lines.push('-----END ' + label + '-----');
      return lines.join('\n');
    }
    document.getElementById('generateBtn').addEventListener('click', function() {
      var bits = parseInt(bitsEl.value);
      pubArea.textContent = t('ui.19','生成中...');
      privArea.textContent = t('ui.19','生成中...');
      setStatus(t('ui.18','正在生成 RSA ') + bits + t('ui.17',' 密钥对...'));
      crypto.subtle.generateKey(
        { name: 'RSA-OAEP', modulusLength: bits, publicExponent: new Uint8Array([1, 0, 1]), hash: 'SHA-256' },
        true, ['encrypt', 'decrypt']
      ).then(function(keyPair) {
        return Promise.all([
          crypto.subtle.exportKey('spki', keyPair.publicKey),
          crypto.subtle.exportKey('pkcs8', keyPair.privateKey)
        ]);
      }).then(function(keys) {
        pubPem = arrayBufToPem(keys[0], 'PUBLIC KEY');
        privPem = arrayBufToPem(keys[1], 'PRIVATE KEY');
        pubArea.textContent = pubPem;
        privArea.textContent = privPem;
        setStatus('RSA ' + bits + t('ui.16',' 密钥对生成完成'));
      }).catch(function(err) {
        setStatus(t('ui.15','生成失败: ') + err.message, 'error');
        pubArea.textContent = t('ui.14','生成失败');
        privArea.textContent = t('ui.14','生成失败');
      });
    });
    document.getElementById('copyPubBtn').addEventListener('click', function() {
      if (pubPem) { copyToClipboard(pubPem, this); setStatus(t('ui.13','公钥已复制')); }
    });
    document.getElementById('copyPrivBtn').addEventListener('click', function() {
      if (privPem) { copyToClipboard(privPem, this); setStatus(t('ui.12','私钥已复制')); }
    });
  })();if(!isSecureContext()){var w=document.getElementById('httpsWarning');if(w)w.style.display='block';}</script>
</body>
</html>
