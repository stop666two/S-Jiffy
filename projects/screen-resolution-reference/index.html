<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>屏幕分辨率速查 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      align-items: center;
    }
    .filter-row .input {
      width: 240px;
    }
    .res-table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--font-size-sm);
    }
    .res-table th, .res-table td {
      border: 1px solid var(--color-border);
      padding: 6px 10px;
      text-align: left;
    }
    .res-table th {
      background: var(--color-bg-soft);
      color: var(--color-text-secondary);
      font-weight: 600;
    }
    .res-table tbody tr {
      cursor: pointer;
    }
    .res-table tbody tr:hover {
      background: var(--color-bg-soft);
    }
    .res-mono {
      font-family: var(--font-mono);
    }
    .ratio-badge {
      display: inline-block;
      font-size: var(--font-size-xs);
      background: var(--color-bg-soft);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 1px 8px;
    }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">屏幕分辨率速查</h1>
    <p class="tool-desc" data-i18n="desc">常见设备与显示标准的分辨率速查表，支持搜索、比例筛选，点击行复制分辨率。</p>
    <div class="card">
      <div class="filter-row">
        <input id="searchInput" class="input js-focus-input" type="text" placeholder="搜索设备或分辨率，如 iPhone、3840…">
        <select id="ratioSelect" class="input" style="width:auto;">
          <option value="">全部比例</option>
          <option value="16:9">16:9</option>
          <option value="4:3">4:3</option>
          <option value="16:10">16:10</option>
          <option value="21:9">21:9</option>
          <option value="19.5:9">19.5:9</option>
          <option value="3:2">3:2</option>
          <option value="其他">其他</option>
        </select>
        <span style="font-size:var(--font-size-xs);color:var(--color-text-secondary);">点击行即可复制「宽×高」</span>
      </div>
    </div>
    <div style="margin-top:var(--space-2);">
      <table class="res-table">
        <thead>
          <tr><th style="width:36%;">设备</th><th style="width:30%;">分辨率</th><th>宽高比</th></tr>
        </thead>
        <tbody id="resBody"></tbody>
      </table>
    </div>
    <div id="resultBox" class="output-box" style="margin-top:var(--space-2);">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div>S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script>
    (function () {
      var searchEl = document.getElementById('searchInput');
      var ratioSelect = document.getElementById('ratioSelect');
      var resBody = document.getElementById('resBody');
      var outputEl = document.getElementById('outputText');
      var copyBtn = document.getElementById('copyBtn');

      var data = [
        { name: 'iPhone 15 Pro Max', w: 1290, h: 2796 },
        { name: 'iPhone 15 Pro / 15', w: 1170, h: 2532 },
        { name: 'iPhone 15 Plus', w: 1290, h: 2796 },
        { name: 'iPhone SE（第 3 代）', w: 750, h: 1334 },
        { name: 'iPhone 14', w: 1170, h: 2532 },
        { name: 'iPhone 13 mini', w: 1080, h: 2340 },
        { name: 'iPhone 12 / 12 Pro', w: 1170, h: 2532 },
        { name: 'iPad Pro 12.9 英寸', w: 2048, h: 2732 },
        { name: 'iPad Pro 11 英寸', w: 1668, h: 2388 },
        { name: 'iPad Air（10.9 英寸）', w: 1640, h: 2360 },
        { name: 'iPad（10 代）', w: 1620, h: 2160 },
        { name: 'iPad mini（6 代）', w: 1488, h: 2266 },
        { name: 'MacBook Air 13 英寸', w: 2560, h: 1664 },
        { name: 'MacBook Air 15 英寸', w: 2880, h: 1864 },
        { name: 'MacBook Pro 14 英寸', w: 3024, h: 1964 },
        { name: 'MacBook Pro 16 英寸', w: 3456, h: 2234 },
        { name: 'MacBook Pro 13 英寸', w: 2560, h: 1600 },
        { name: 'MacBook', w: 1440, h: 900 },
        { name: 'MacBook Pro', w: 1512, h: 982 },
        { name: 'iMac 24 英寸', w: 4480, h: 2520 },
        { name: 'Studio Display 5K', w: 5120, h: 2880 },
        { name: '8K UHD', w: 7680, h: 4320 },
        { name: '4K UHD（2160p）', w: 3840, h: 2160 },
        { name: '1440p（QHD）', w: 2560, h: 1440 },
        { name: '1080p（Full HD）', w: 1920, h: 1080 },
        { name: '720p（HD）', w: 1280, h: 720 },
        { name: '旧款笔记本常见', w: 1366, h: 768 },
        { name: '旧款笔记本常见', w: 1280, h: 800 },
        { name: '旧款笔记本常见', w: 1024, h: 768 },
        { name: '旧款笔记本常见', w: 1440, h: 900 },
        { name: '旧款笔记本常见', w: 1680, h: 1050 },
        { name: '旧款笔记本常见', w: 1920, h: 1200 },
        { name: '旧款笔记本常见', w: 1600, h: 900 },
        { name: '超宽屏 21:9', w: 3440, h: 1440 },
        { name: '超宽屏 21:9', w: 2560, h: 1080 },
        { name: '超宽屏 24:10', w: 3840, h: 1600 },
        { name: 'Samsung Galaxy S23', w: 1080, h: 2340 },
        { name: 'Samsung Galaxy S23 Ultra', w: 1440, h: 3088 },
        { name: 'Google Pixel 8', w: 1080, h: 2400 },
        { name: 'Google Pixel 8 Pro', w: 1344, h: 2992 },
        { name: 'Surface Pro 9', w: 2736, h: 1824 },
        { name: 'Nintendo Switch', w: 1280, h: 720 },
        { name: 'Steam Deck', w: 1280, h: 800 },
        { name: '旧款 5:4 显示器', w: 1280, h: 1024 }
      ];

      function gcd(a, b) {
        a = Math.abs(a);
        b = Math.abs(b);
        while (b) {
          var t = a % b;
          a = b;
          b = t;
        }
        return a;
      }

      function aspectLabel(w, h) {
        var big = Math.max(w, h);
        var small = Math.min(w, h);
        var a = big / small;
        var targets = [
          { ratio: 16 / 9, label: '16:9' },
          { ratio: 4 / 3, label: '4:3' },
          { ratio: 16 / 10, label: '16:10' },
          { ratio: 21 / 9, label: '21:9' },
          { ratio: 19.5 / 9, label: '19.5:9' },
          { ratio: 3 / 2, label: '3:2' },
          { ratio: 5 / 4, label: '5:4' },
          { ratio: 24 / 10, label: '24:10' }
        ];
        var i;
        for (i = 0; i < targets.length; i++) {
          if (Math.abs(a - targets[i].ratio) / targets[i].ratio < 0.02) {
            return targets[i].label;
          }
        }
        var g = gcd(w, h);
        return (w / g) + ':' + (h / g);
      }

      function filter() {
        var kw = searchEl.value.trim().toLowerCase();
        var ratio = ratioSelect.value;
        var rows = '';
        var count = 0;
        var i;
        for (i = 0; i < data.length; i++) {
          var item = data[i];
          var label = aspectLabel(item.w, item.h);
          if (ratio === '其他' && label !== '16:9' && label !== '4:3' && label !== '16:10' && label !== '21:9' && label !== '19.5:9' && label !== '3:2') {
          } else if (ratio && label !== ratio) {
            continue;
          }
          if (kw) {
            var hay = (item.name + ' ' + item.w + 'x' + item.h + ' ' + item.w + '×' + item.h + ' ' + label).toLowerCase();
            if (hay.indexOf(kw) === -1) continue;
          }
          count++;
          rows += '<tr data-w="' + item.w + '" data-h="' + item.h + '">'
            + '<td>' + htmlEscape(item.name) + '</td>'
            + '<td class="res-mono">' + item.w + ' × ' + item.h + ' px</td>'
            + '<td><span class="ratio-badge">' + htmlEscape(label) + '</span></td>'
            + '</tr>';
        }
        resBody.innerHTML = rows || '<tr><td colspan="3" style="color:var(--color-text-disabled);">没有匹配的分辨率记录</td></tr>';
        outputEl.textContent = '共 ' + data.length + ' 条记录，当前筛选出 ' + count + ' 条。';
      }

      resBody.addEventListener('click', function (e) {
        var tr = e.target;
        while (tr && tr.tagName !== 'TR') {
          tr = tr.parentNode;
        }
        if (!tr || !tr.getAttribute('data-w')) return;
        var text = tr.getAttribute('data-w') + '×' + tr.getAttribute('data-h');
        copyToClipboard(text, copyBtn);
        setStatus('已复制分辨率 ' + text);
      });

      searchEl.addEventListener('input', filter);
      ratioSelect.addEventListener('change', filter);

      copyBtn.addEventListener('click', function () {
        if (outputEl.textContent) {
          copyToClipboard(outputEl.textContent, copyBtn);
          setStatus('已复制到剪贴板');
        }
      });

      filter();
    })();
  </script>
</body>
</html>
