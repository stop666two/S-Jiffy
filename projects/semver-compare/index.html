<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SemVer 版本比较 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .version-row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .version-row .input { width:220px; }
    .comparison-result { font-size:var(--font-size-xl); text-align:center; padding:var(--space-3); }
    .cmp-gt { color:var(--color-success); }
    .cmp-lt { color:var(--color-error); }
    .cmp-eq { color:var(--color-text-secondary); }
    .cmp-invalid { color:var(--color-error); }
    .breakdown-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:var(--space-3); margin-top:var(--space-3); }
    .breakdown-item { text-align:center; padding:var(--space-2); background:var(--color-bg-soft); border-radius:var(--radius-md); }
    .breakdown-item .label { font-size:var(--font-size-xs); color:var(--color-text-secondary); }
    .breakdown-item .val { font-size:var(--font-size-lg); font-weight:600; }
  </style>
</head>
<body>
  <header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">SemVer 版本比较</h1>
    <p class="tool-desc" data-i18n="desc">语义化版本号比较与校验</p>

    <div class="card">
      <div class="version-row">
        <input id="versionA" class="input js-focus-input" placeholder="1.2.3" value="1.2.3">
        <span style="font-size:var(--font-size-lg);color:var(--color-text-secondary);">vs</span>
        <input id="versionB" class="input" placeholder="1.3.0" value="1.3.0">
        <button id="compareBtn" class="btn btn-primary" data-i18n="ui.1">比较</button>
        <button id="swapBtn" class="btn btn-secondary" data-i18n="ui.2">互换</button>
      </div>
    </div>

    <div class="output-box" style="min-height:120px;">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>
    (function () {
      var versionA = document.getElementById('versionA');
      var versionB = document.getElementById('versionB');
      var outputText = document.getElementById('outputText');
      var compareBtn = document.getElementById('compareBtn');
      var swapBtn = document.getElementById('swapBtn');
      var copyBtn = document.getElementById('copyBtn');

      function parseVersion(v) {
        var s = String(v).trim();
        var m = s.match(/^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/);
        if (!m) return null;
        return {
          major: parseInt(m[1], 10),
          minor: parseInt(m[2], 10),
          patch: parseInt(m[3], 10),
          prerelease: m[4] ? m[4].split('.') : null,
          raw: s
        };
      }

      function compareVersions(a, b) {
        if (a.major !== b.major) return a.major - b.major;
        if (a.minor !== b.minor) return a.minor - b.minor;
        if (a.patch !== b.patch) return a.patch - b.patch;
        var pa = a.prerelease;
        var pb = b.prerelease;
        if (pa === null && pb === null) return 0;
        if (pa === null) return 1;
        if (pb === null) return -1;
        var n = Math.max(pa.length, pb.length);
        for (var i = 0; i < n; i++) {
          var x = pa[i];
          var y = pb[i];
          if (x === undefined) return -1;
          if (y === undefined) return 1;
          if (x === y) continue;
          var xn = /^\d+$/.test(x);
          var yn = /^\d+$/.test(y);
          if (xn && yn) {
            var dx = x.replace(/^0+/, '') || '0';
            var dy = y.replace(/^0+/, '') || '0';
            if (dx.length !== dy.length) return dx.length - dy.length;
            return dx < dy ? -1 : 1;
          }
          if (xn) return -1;
          if (yn) return 1;
          return x < y ? -1 : 1;
        }
        return 0;
      }

      function buildHtml(aRaw, bRaw) {
        var a = parseVersion(aRaw);
        var b = parseVersion(bRaw);
        if (!a || !b) {
          return '<div class="comparison-result cmp-invalid">版本号格式无效。请使用语义化版本号，如 "1.2.3"</div>';
        }
        var cmp = compareVersions(a, b);
        var symbol, cls;
        if (cmp > 0) { symbol = '>'; cls = 'cmp-gt'; }
        else if (cmp < 0) { symbol = '<'; cls = 'cmp-lt'; }
        else { symbol = '='; cls = 'cmp-eq'; }

        var html = '<div class="comparison-result ' + cls + '">';
        html += '<span style="font-size:28px;font-weight:700;">' + a.raw + '</span>';
        html += ' &nbsp;<span style="font-size:36px;">' + symbol + '</span>&nbsp; ';
        html += '<span style="font-size:28px;font-weight:700;">' + b.raw + '</span>';
        html += '</div>';

        html += '<div class="breakdown-grid">';
        html += '<div class="breakdown-item"><div class="label">Major</div><div class="val">' + a.major + ' : ' + b.major + '</div></div>';
        html += '<div class="breakdown-item"><div class="label">Minor</div><div class="val">' + a.minor + ' : ' + b.minor + '</div></div>';
        html += '<div class="breakdown-item"><div class="label">Patch</div><div class="val">' + a.patch + ' : ' + b.patch + '</div></div>';
        html += '</div>';

        return html;
      }

      function compare() {
        var a = versionA.value.trim();
        var b = versionB.value.trim();
        if (!a || !b) { setStatus(t('ui.100','请输入两个版本号'), 'error'); return; }
        outputText.innerHTML = buildHtml(a, b);
        setStatus('');
      }

      compareBtn.addEventListener('click', compare);

      swapBtn.addEventListener('click', function () {
        var tmp = versionA.value;
        versionA.value = versionB.value;
        versionB.value = tmp;
        compare();
      });

      copyBtn.addEventListener('click', function () {
        if (outputText.textContent.trim()) { copyToClipboard(outputText.textContent, this); setStatus(t('ui.copied','已复制')); }
      });

      versionA.addEventListener('keydown', function (e) { if (e.key === 'Enter') compareBtn.click(); });
      versionB.addEventListener('keydown', function (e) { if (e.key === 'Enter') compareBtn.click(); });
    })();
  </script>
</body>
</html>
