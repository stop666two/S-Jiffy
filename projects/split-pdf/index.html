<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF分割 - S-Jiffy</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../assets/css/global.css">
<style>
.dropzone{border:1.5px dashed var(--color-border);border-radius:var(--radius-md);padding:36px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;}
.dropzone:hover,.dropzone.dragover{border-color:var(--color-text-primary);background:var(--color-bg-soft);}
.dz-icon{font-size:34px;margin-bottom:8px;}
.dz-label{font-size:var(--font-size-sm);font-weight:500;}
.dz-sub{font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-top:4px;}
.file-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border:1px solid var(--color-border);border-radius:var(--radius-md);margin-bottom:12px;font-size:var(--font-size-sm);}
.file-bar .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
.file-bar .fm{font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-right:12px;}
.file-bar .x{background:none;border:none;cursor:pointer;color:var(--color-text-disabled);font-size:16px;padding:4px;}
.file-bar .x:hover{color:var(--color-error);}
.hint{font-size:var(--font-size-xs);color:var(--color-text-secondary);margin:10px 0;}
.pg-strip{display:flex;align-items:flex-end;flex-wrap:wrap;gap:0;padding:10px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-bg-soft);}
.pg-cell{display:flex;flex-direction:column;align-items:center;cursor:grab;user-select:none;}
.pg-cell.drag{opacity:.35;}
.pg-cell.drop-before{border-left:3px solid var(--color-accent);}
.pg-cell img{width:70px;border:1px solid var(--color-border);border-radius:4px;background:#fff;display:block;}
.pg-cell .pg-no{font-size:10px;color:var(--color-text-secondary);margin-top:2px;}
.split-btn{width:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;align-self:stretch;background:none;border:none;cursor:pointer;color:var(--color-text-disabled);font-size:14px;padding:0 2px;}
.split-btn .line{width:2px;flex:1;min-height:50px;background:var(--color-border);border-radius:2px;}
.split-btn.on{color:var(--color-error);}
.split-btn.on .line{background:var(--color-error);}
.seg{display:inline-block;font-size:var(--font-size-xs);padding:2px 10px;border:1px solid var(--color-border);border-radius:9999px;margin:2px 6px 2px 0;}
.action-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;align-items:center;}
.loading-note{font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-top:8px;}
</style>
</head>
<body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
<main class="tool-workspace">
<h1 data-i18n="h1">PDF分割</h1>
<p class="tool-desc" data-i18n="desc">将PDF文件分割成单独的页面或范围。完全在浏览器中工作。</p>
<div class="card">
<div class="dropzone" id="dropZone">
<div class="dz-icon">✂️</div>
<div class="dz-label" data-i18n="uploadPdfFiles">上传PDF文件</div>
<div class="dz-sub" id="dzSub"></div>
</div>
<input type="file" id="fileInput" accept=".pdf,application/pdf" style="display:none">
</div>
<div class="card" id="workCard" style="display:none">
<div class="file-bar">
<span class="fn" id="fileName"></span>
<span class="fm" id="fileMeta"></span>
<button class="x" id="removeBtn" title="×">✕</button>
</div>
<div class="loading-note" id="loadingNote" style="display:none" data-i18n="loadingPreviews">加载页面预览…</div>
<div id="stripWrap" style="display:none">
<p class="hint" data-i18n="dragReorderClickSplit">拖拽页面以重新排列 · 点击✂分割</p>
<div class="pg-strip" id="pgStrip"></div>
<div style="margin-top:10px;" id="segBox"></div>
</div>
<div class="action-row">
<button class="btn btn-primary" id="splitBtn" disabled data-i18n="selectSplitPoints">请先选择分割点</button>
</div>
</div>
</main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
<script src="../../assets/js/i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js"></script>
<script>
/* ES5 IIFE：var/function，不用 let/const/箭头函数/模板字符串 */
(function(){
'use strict';
function $(id){return document.getElementById(id);}
var MAX_MB=50;
var file=null,buf=null;
var pages=[];            /* 显示顺序 [{thumb,origIdx}] */
var splitAfter={};       /* 显示位置 i（第 i 页后）为分割点 */
var busy=false;
var dz=$('dropZone'),fi=$('fileInput');
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js';
function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';return (b/1048576).toFixed(2)+' MB';}
function readAB(f,cb,eb){var r=new FileReader();r.onload=function(){cb(r.result);};r.onerror=function(){if(eb)eb();};r.readAsArrayBuffer(f);}
function download(blob,name){var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u);},3000);}
function closest(el,sel,root){while(el&&el!==root){if(el.matches&&el.matches(sel))return el;el=el.parentNode;}return null;}
function getDropIdx(e,items){var n=items.length,i,r;for(i=0;i<n;i++){r=items[i].getBoundingClientRect();if(e.clientY<r.top+r.height/2||(e.clientY<r.bottom&&e.clientX<r.left+r.width/2))return i;}return n;}
function clearMarks(c,sel){var els=c.querySelectorAll(sel),i;for(i=0;i<els.length;i++){els[i].classList.remove('drag');els[i].classList.remove('drop-before');}}
function moveArr(a,from,to){if(from===to)return;var it=a.splice(from,1)[0];a.splice(to>from?to-1:to,0,it);}
function sortedSplits(){var a=[],k;for(k in splitAfter){if(splitAfter[k])a.push(parseInt(k,10));}a.sort(function(x,y){return x-y;});return a;}
function segments(){
  var ss=sortedSplits(),b=[0],i;
  for(i=0;i<ss.length;i++)b.push(ss[i]+1);
  b.push(pages.length);
  var out=[];
  for(i=0;i<b.length-1;i++)out.push({start:b[i]+1,end:b[i+1]});
  return out;
}
function renderStrip(){
  var html='',i,prev=-1;
  for(i=0;i<pages.length;i++){
    if(prev!==-1){
      var on=!!splitAfter[prev];
      html+='<button class="split-btn'+(on?' on':'')+'" data-i="'+prev+'" title="✂"><span class="line"></span>'+(on?'✂':'·')+'</button>';
    }
    html+='<div class="pg-cell"><img src="'+pages[i].thumb+'" alt="p'+(i+1)+'"><span class="pg-no">'+(i+1)+'</span></div>';
    prev=i;
  }
  $('pgStrip').innerHTML=html;
  var btns=$('pgStrip').querySelectorAll('.split-btn'),k;
  for(k=0;k<btns.length;k++){btns[k].onclick=function(){toggleSplit(parseInt(this.getAttribute('data-i'),10));};}
  renderSegs();
  updateBtn();
}
function renderSegs(){
  var segs=segments(),html='',i;
  for(i=0;i<segs.length;i++){html+='<span class="seg">Part '+(i+1)+': p.'+segs[i].start+'–'+segs[i].end+'</span>';}
  $('segBox').innerHTML=html;
}
function toggleSplit(i){
  if(splitAfter[i])delete splitAfter[i];else splitAfter[i]=true;
  renderStrip();
}
function updateBtn(){
  var b=$('splitBtn');
  if(busy){b.textContent=t('splitting','拆分中…');}
  else if(!sortedSplits().length){b.textContent=t('selectSplitPoints','请先选择分割点');}
  else{b.textContent='拆分 ('+segments().length+' '+t('files','个文件')+')';}
  b.disabled=busy||!file||!sortedSplits().length;
}
function loadFile(f){
  if(f.type&&f.type!=='application/pdf'&&!(f.name&&f.name.toLowerCase().indexOf('.pdf')!==-1)){setStatus(t('notPdf','请选择PDF文件'),'error');return;}
  if(f.size>MAX_MB*1048576){setStatus(t('tooLarge','文件过大（超过')+' '+MAX_MB+'MB）','error');return;}
  file=f;splitAfter={};pages=[];
  $('workCard').style.display='block';
  $('fileName').textContent=f.name;
  $('fileMeta').textContent=fmtSize(f.size);
  $('stripWrap').style.display='none';
  $('loadingNote').style.display='block';
  setStatus('');
  readAB(f,function(b){buf=b.slice(0);renderThumbs();});
}
function renderThumbs(){
  pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise.then(function(pdf){
    var seq=[],i;
    for(i=1;i<=pdf.numPages;i++)seq.push(i);
    var chain=Promise.resolve();
    seq.forEach(function(pn){
      chain=chain.then(function(){
        return pdf.getPage(pn).then(function(page){
          var vp=page.getViewport({scale:0.3});
          var c=document.createElement('canvas');
          c.width=Math.round(vp.width);c.height=Math.round(vp.height);
          return page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise.then(function(){
            var url=c.toDataURL('image/jpeg',0.78);c.width=0;
            pages.push({thumb:url,origIdx:pn-1});
          });
        });
      });
    });
    chain.then(function(){
      pdf.destroy();
      $('loadingNote').style.display='none';
      $('stripWrap').style.display='block';
      renderStrip();
    },function(){errLoad();});
  },function(){errLoad();});
}
function errLoad(){setStatus(t('badPdf','无法解析的PDF文件或PDF已损坏'),'error');$('loadingNote').style.display='none';}
(function(){
  var dragEl=null,from=-1,to=-1,strip=$('pgStrip');
  function idxOf(el){var a=strip.querySelectorAll('.pg-cell'),i;for(i=0;i<a.length;i++){if(a[i]===el)return i;}return -1;}
  strip.addEventListener('pointerdown',function(e){
    var t=closest(e.target,'.pg-cell',strip);
    if(!t)return;
    if(closest(e.target,'.split-btn',strip))return;
    e.preventDefault();
    dragEl=t;from=idxOf(t);
    try{t.setPointerCapture(e.pointerId);}catch(err){}
    t.classList.add('drag');
  });
  strip.addEventListener('pointermove',function(e){
    if(!dragEl)return;
    var items=strip.querySelectorAll('.pg-cell');
    to=getDropIdx(e,items);
    clearMarks(strip,'.pg-cell');
    if(to<items.length)items[to].classList.add('drop-before');
  });
  strip.addEventListener('pointerup',function(){
    if(!dragEl)return;
    if(from!==to&&to>=0){
      moveArr(pages,from,to);
      renderStrip();
    }
    dragEl=null;from=-1;to=-1;
    clearMarks(strip,'.pg-cell');
  });
  strip.addEventListener('pointercancel',function(){dragEl=null;from=-1;to=-1;clearMarks(strip,'.pg-cell');});
})();
dz.addEventListener('click',function(){fi.click();});
dz.addEventListener('dragover',function(e){e.preventDefault();dz.classList.add('dragover');});
dz.addEventListener('dragleave',function(){dz.classList.remove('dragover');});
dz.addEventListener('drop',function(e){e.preventDefault();dz.classList.remove('dragover');if(e.dataTransfer.files.length)loadFile(e.dataTransfer.files[0]);});
fi.addEventListener('change',function(){if(this.files.length)loadFile(this.files[0]);this.value='';});
$('removeBtn').addEventListener('click',function(){file=null;buf=null;pages=[];splitAfter={};$('workCard').style.display='none';updateBtn();setStatus('');});
$('splitBtn').addEventListener('click',doSplit);
function doSplit(){
  if(!file||busy)return;
  var ss=sortedSplits();
  if(!ss.length)return;
  busy=true;updateBtn();setStatus('');
  PDFLib.PDFDocument.load(new Uint8Array(buf.slice(0))).then(function(pdf){
    var segs=segments(),chain=Promise.resolve(),i;
    for(i=0;i<segs.length;i++){
      (function(idx){
        chain=chain.then(function(){
          var s=segs[idx];
          var order=pages.slice(s.start-1,s.end).map(function(p){return p.origIdx;});
          return PDFLib.PDFDocument.create().then(function(out){
            return out.copyPages(pdf,order).then(function(ps){
              ps.forEach(function(pg){out.addPage(pg);});
              return out.save();
            });
          }).then(function(bytes){
            download(new Blob([bytes.buffer],{type:'application/pdf'}),file.name.replace(/\.pdf$/i,'')+'_part'+(idx+1)+'.pdf');
          });
        });
      })(i);
    }
    chain.then(function(){
      setStatus(segments().length+' '+t('splitPdfsDownloaded','个PDF文件已下载！'));
      busy=false;updateBtn();
    }).catch(function(err){busy=false;updateBtn();setStatus(t('splitFailed','拆分失败：')+err.message,'error');});
  }).catch(function(err){busy=false;updateBtn();setStatus(t('splitFailed','拆分失败：')+err.message,'error');});
}
$('dzSub').textContent=t('supportedFormats','支持：{formats}').replace('{formats}','PDF')+' · '+t('maxPdfHint','最大20MB · .pdf');
})();
</script>
</body>
</html>
