<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SQL 格式化 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css">
<style>.inp-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--space-2)}.inp-row .input{flex:1;min-width:200px}.inp-row select{width:140px}.btn-row{display:flex;gap:8px;margin-bottom:var(--space-3);flex-wrap:wrap}.textarea-box{width:100%;min-height:160px;padding:var(--space-2);font-family:var(--font-mono);font-size:13px;border:1px solid var(--color-border);border-radius:var(--radius-md);resize:vertical;outline:none;transition:border-color .15s}.textarea-box:focus{border-color:var(--color-text-primary);box-shadow:var(--shadow-focus)}.line-num{color:var(--color-text-disabled);padding-right:12px;text-align:right;user-select:none;font-size:12px}.sql-hl{white-space:pre-wrap;word-break:break-all;background:var(--color-bg-soft);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-2);font-family:var(--font-mono);font-size:12px;line-height:1.5;max-height:300px;overflow:auto;margin:0}.sql-hl .kw{color:#881280;font-weight:600}.sql-hl .str{color:#0451A5}.sql-hl .num{color:#098658}.sql-hl .cmt{color:#808080;font-style:italic}</style></head><body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a></header>
<main class="tool-workspace"><h1 data-i18n="h1">SQL 格式化</h1><p class="tool-desc" data-i18n="desc">格式化与压缩 SQL，支持关键字大小写自定义与语法高亮预览。</p>
<div class="card">
<div class="inp-row"><select id="caseSelect" class="input" style="width:140px"><option value="upper" data-i18n="ui.1">关键字大写</option><option value="lower" data-i18n="ui.2">关键字小写</option><option value="none" data-i18n="ui.3">保持原样</option></select><select id="modeSelect" class="input" style="width:120px"><option value="format" data-i18n="ui.format">格式化</option><option value="minify" data-i18n="ui.4">压缩</option></select></div>
<div style="display:flex;gap:12px;flex-wrap:wrap"><div style="flex:1;min-width:300px"><div style="font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-bottom:4px" data-i18n="ui.5">输入 SQL</div><textarea id="inputSql" class="textarea-box" data-i18n-placeholder="ui.101" placeholder="输入 SQL 语句..."></textarea></div><div style="flex:1;min-width:300px"><div style="font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-bottom:4px" data-i18n="ui.6">输出</div><textarea id="outputSql" class="textarea-box" readonly data-i18n-placeholder="ui.102" placeholder="格式化后的 SQL..."></textarea></div></div>
<div style="margin-top:var(--space-2);"><div style="font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-bottom:4px" data-i18n="ui.hl">高亮预览</div><pre id="sqlHighlight" class="sql-hl"></pre></div>
<div class="btn-row" style="margin-top:var(--space-2)"><button id="formatBtn" class="btn btn-primary" data-i18n="ui.format">格式化</button><button id="copySqlBtn" class="btn btn-secondary" data-i18n="ui.copyResult">复制结果</button></div>
</div>
<div class="output-box"><span id="outputText"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
</main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script><script>(function(){var inp=document.getElementById('inputSql'),outp=document.getElementById('outputSql'),caseSel=document.getElementById('caseSelect'),modeSel=document.getElementById('modeSelect'),fmtBtn=document.getElementById('formatBtn'),copyBtn=document.getElementById('copySqlBtn'),out=document.getElementById('outputText'),hlBox=document.getElementById('sqlHighlight');var keywords=['SELECT','FROM','WHERE','AND','OR','NOT','IN','LIKE','BETWEEN','IS','NULL','AS','ON','JOIN','LEFT','RIGHT','INNER','OUTER','FULL','CROSS','NATURAL','USING','ORDER','BY','ASC','DESC','GROUP','HAVING','LIMIT','OFFSET','UNION','ALL','DISTINCT','INSERT','INTO','VALUES','UPDATE','SET','DELETE','CREATE','TABLE','DROP','ALTER','ADD','COLUMN','INDEX','VIEW','PRIMARY','KEY','FOREIGN','REFERENCES','CASCADE','CONSTRAINT','UNIQUE','CHECK','DEFAULT','IF','EXISTS','CASE','WHEN','THEN','ELSE','END','BEGIN','COMMIT','ROLLBACK','TRANSACTION','GRANT','REVOKE','TRUNCATE','REPLACE','MERGE','WITH','RECURSIVE','EXCEPT','INTERSECT','FETCH','NEXT','ROWS','ONLY','COUNT','SUM','AVG','MIN','MAX','CAST','COALESCE','NULLIF','TRUE','FALSE'];function applyCase(s){var cs=caseSel.value;if(cs==='upper')return s.toUpperCase();if(cs==='lower')return s.toLowerCase();return s}function formatSQL(sql){var tokens=[];var current='';var inString=false;var strChar='';for(var i=0;i<sql.length;i++){var ch=sql[i];if(inString){current+=ch;if(ch===strChar&&(i===0||sql[i-1]!=='\\'))inString=false}else{if(ch==="'"||ch==='"'){inString=true;strChar=ch;current+=ch}else if(/[ \t\r\n]/.test(ch)){if(current){tokens.push({type:'word',value:current});current=''}}else if(/[(),;]/.test(ch)){if(current){tokens.push({type:'word',value:current});current=''};tokens.push({type:'sep',value:ch})}else if(/[=<>!]/.test(ch)){if(current){tokens.push({type:'word',value:current});current=''};var next=sql[i+1]||'';if((ch==='<'&&next==='>')||(ch==='!'&&next==='=')||(ch==='='&&next==='=')||(ch==='<'&&next==='=')||(ch==='>'&&next==='=')){tokens.push({type:'op',value:ch+next});i++}else{tokens.push({type:'op',value:ch})}}else{current+=ch}}}if(current)tokens.push({type:'word',value:current});var result='';var indent=0;var newLine=true;for(var i=0;i<tokens.length;i++){var tok=tokens[i];if(tok.type==='sep'){if(tok.value==='('){if(!newLine)result+=' ';result+='(';indent++;newLine=false}else if(tok.value===')'){indent--;result+=')';newLine=false}else if(tok.value===';'){result+=';\n';newLine=true}}else if(tok.type==='op'){result+=' '+tok.value+' ';newLine=false}else{var upper=tok.value.toUpperCase();var isKw=keywords.indexOf(upper)!==-1;if(isKw){if(!newLine&&result.length>0&&result[result.length-1]!=='('&&result[result.length-1]!=='\n'){result+='\n'}for(var j=0;j<indent;j++)result+='  ';result+=applyCase(tok.value);newLine=false;if(tok.value.toUpperCase()==='SELECT'||tok.value.toUpperCase()==('FROM')||tok.value.toUpperCase()==('WHERE')||tok.value.toUpperCase()==('ORDER')||tok.value.toUpperCase()==('GROUP')||tok.value.toUpperCase()==('HAVING')||tok.value.toUpperCase()==('LIMIT')||tok.value.toUpperCase()==('INSERT')||tok.value.toUpperCase()==('UPDATE')||tok.value.toUpperCase()==('DELETE')||tok.value.toUpperCase()==('CREATE')||tok.value.toUpperCase()==('ALTER')||tok.value.toUpperCase()==('DROP')){result+='\n'}}else{if(newLine){for(var j=0;j<indent;j++)result+='  '}result+=tok.value;newLine=false}}}return result.trim()}function minifySQL(sql){var inString=false;var strChar='';var out='';for(var i=0;i<sql.length;i++){var ch=sql[i];if(inString){out+=ch;if(ch===strChar&&sql[i-1]!=='\\')inString=false}else{if(ch==="'"||ch==='"'){inString=true;strChar=ch;out+=ch}else if(/[ \t\n\r]+/.test(ch)){out+=' '}else{out+=ch}}}return out.replace(/\s*([(),;])\s*/g,'$1').replace(/\s{2,}/g,' ').trim()}fmtBtn.addEventListener('click',function(){var sql=inp.value.trim();if(!sql){setStatus(t('ui.100','请输入 SQL'),'error');return}var result=modeSel.value==='format'?formatSQL(sql):minifySQL(sql);outp.value=result;hlBox.innerHTML=highlightSQL(result);out.textContent=result.length>100?result.slice(0,100)+'...':result;setStatus(modeSel.value==='format'?t('ui.103','格式化完成'):t('ui.104','压缩完成'))});
function highlightSQL(sql){
  var h='',i=0;
  while(i<sql.length){
    var ch=sql[i];
    if(ch==='-'&&sql[i+1]==='-'){var j=sql.indexOf('\n',i);if(j===-1)j=sql.length;h+='<span class="cmt">'+htmlEscape(sql.substring(i,j))+'</span>';i=j;}
    else if(ch==='/'&&sql[i+1]==='*'){var j=sql.indexOf('*/',i+2);if(j===-1)j=sql.length-2;h+='<span class="cmt">'+htmlEscape(sql.substring(i,j+2))+'</span>';i=j+2;}
    else if(ch==="'"||ch==='"'){var j=i+1,str=ch;while(j<sql.length){str+=sql[j];if(sql[j]===ch&&sql[j-1]!=='\\'){j++;break;}j++;}h+='<span class="str">'+htmlEscape(str)+'</span>';i=j;}
    else if(/[0-9]/.test(ch)&&(i===0||!/[a-zA-Z_]/.test(sql[i-1]))){var j=i;while(j<sql.length&&/[0-9.]/.test(sql[j]))j++;h+='<span class="num">'+htmlEscape(sql.substring(i,j))+'</span>';i=j;}
    else if(/[a-zA-Z_]/.test(ch)){var j=i;while(j<sql.length&&/[a-zA-Z0-9_]/.test(sql[j]))j++;var w=sql.substring(i,j);if(keywords.indexOf(w.toUpperCase())!==-1){h+='<span class="kw">'+htmlEscape(w)+'</span>';}else{h+=htmlEscape(w);}i=j;}
    else{h+=htmlEscape(ch);i++;}
  }
  return h;
}copyBtn.addEventListener('click',function(){var v=outp.value;if(v){copyToClipboard(v,this);setStatus(t('ui.copied','已复制'))}});document.getElementById('copyBtn').addEventListener('click',function(){if(out.textContent){copyToClipboard(out.textContent,this);setStatus(t('ui.copied','已复制'))}})})();</script></body></html>
