<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SQL 语法检查 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css"><style>
.sql-input{min-height:200px;resize:vertical;font-family:var(--font-mono);font-size:14px;padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-md);outline:none;width:100%;display:block}.sql-input:focus{border-color:var(--color-text-primary);box-shadow:var(--shadow-focus)}.issue{font-size:13px;padding:6px 10px;border-radius:var(--radius-sm);margin:4px 0}.issue.warn{background:#fff8e6;color:#8a6d00}.issue.err{background:#fce8e6;color:#9f2f2d}.issue.ok{background:#e6f4ea;color:#346538}
</style></head><body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
<main class="tool-workspace"><h1 data-i18n="h1">SQL 校验器</h1><p class="tool-desc" data-i18n="desc">基础 SQL 语法检查：检查关键字拼写、引号匹配、常见语法错误。</p>
<div class="card">
<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
<select id="dialectSelect" class="input" style="width:auto;min-width:100px;height:48px;padding:0 12px;">
<option value="generic" data-i18n="ui.1">通用</option><option value="mysql">MySQL</option><option value="postgres">PostgreSQL</option>
</select>
<button id="checkBtn" class="btn btn-primary" data-i18n="ui.2">检查</button>
<button id="clearBtn" class="btn btn-secondary" data-i18n="ui.clear">清空</button>
</div>
<textarea id="sqlInput" class="sql-input js-focus-input" data-i18n-placeholder="ui.100" placeholder="输入 SQL 语句...">SELECT * FORM users WHERE id = 1</textarea>
<div id="results" style="margin-top:12px;"></div>
</div>
<div class="output-box"><span id="outputText" style="display:block;padding-right:60px;"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
</main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script></script><script>(function(){
var sqlInput=document.getElementById('sqlInput');
var results=document.getElementById('results');
var checkBtn=document.getElementById('checkBtn');
var clearBtn=document.getElementById('clearBtn');
var dialectSelect=document.getElementById('dialectSelect');
var outputEl=document.getElementById('outputText');
var copyBtn=document.getElementById('copyBtn');
var keywords=['SELECT','FROM','WHERE','INSERT','INTO','VALUES','UPDATE','SET','DELETE','CREATE','TABLE','DROP','ALTER','ADD','COLUMN','INDEX','VIEW','JOIN','LEFT','RIGHT','INNER','OUTER','FULL','CROSS','ON','AND','OR','NOT','IN','EXISTS','BETWEEN','LIKE','IS','NULL','AS','ORDER','BY','GROUP','HAVING','LIMIT','OFFSET','DISTINCT','COUNT','SUM','AVG','MIN','MAX','UNION','ALL','CASE','WHEN','THEN','ELSE','END','CAST','CONVERT','COALESCE','NULLIF','TRUE','FALSE','PRIMARY','KEY','FOREIGN','REFERENCES','CONSTRAINT','DEFAULT','CHECK','UNIQUE','AUTO_INCREMENT','SERIAL','INTEGER','INT','VARCHAR','TEXT','BOOLEAN','FLOAT','DOUBLE','DECIMAL','DATE','DATETIME','TIMESTAMP','BLOB'];

function check(){
var sql=sqlInput.value;
var issues=[];
if(!sql.trim()){issues.push({type:'warn',msg: t('ui.13','SQL 语句为空')});render结果s(issues);return;}
var upper=sql.toUpperCase();
var typos={'FORM':'FROM','SELEC':'SELECT','SELCT':'SELECT','DELTE':'DELETE','DELET':'DELETE','UDPATE':'UPDATE','UPDTE':'UPDATE','ISNERT':'INSERT','INSRT':'INSERT','WHRER':'WHERE','WAHERE':'WHERE','WERE':'WHERE','GRPOU':'GROUP','GRUOP':'GROUP','ODERR':'ORDER','ORDRE':'ORDER','HAVIG':'HAVING','HAVNG':'HAVING','DINSTINCT':'DISTINCT','UNOIN':'UNION','HTEN':'THEN','WHEEN':'WHEN','ELSEL':'ELSE','ND':'AND','OT':'NOT','TABEL':'TABLE','VAKUES':'VALUES','CLOUMN':'COLUMN','JOINN':'JOIN'};
var tokenRe=/"([^"]*)"|'([^']*)'|`([^`]*)`|\S+/g;
var tokens=[];
var m;
while((m=tokenRe.exec(sql))!==null)tokens.push({text:m[0],index:m.index});
var reported={};
for(var i=0;i<tokens.length;i++){
var t=tokens[i].text;
var up=t.toUpperCase();
if(t.startsWith("'")||t.startsWith('"')||t.startsWith('`'))continue;
if(typos[up]&&!reported[up]){
reported[up]=true;
var line=sql.slice(0,tokens[i].index).split('\n').length;
issues.push({type:'err',msg: t('ui.nth','第 ')+line+ t('ui.12',' 行: 疑似拼写错误 ')+up+ t('ui.11','，应为 ')+typos[up]});
}
}
var inString=false;
var quoteChar='';
var strIssues=[];
for(var i=0;i<sql.length;i++){
var c=sql[i];
if(inString){
if(c===quoteChar&&sql[i-1]!=='\\')inString=false;
}else{
if(c==="'"||c==='"'){inString=true;quoteChar=c;}
}
}
if(inString)issues.push({type:'err',msg: t('ui.10','引号未闭合：存在未闭合的 ') + quoteChar + t('ui.9',' 引号')});
var paren=0;
for(var i=0;i<sql.length;i++){
if(sql[i]==='(')paren++;
if(sql[i]===')')paren--;
}
if(paren>0)issues.push({type:'err',msg: t('ui.8','括号未闭合：缺少 ') + paren + ' 个 )'});
if(paren<0)issues.push({type:'err',msg: t('ui.7','括号多余：多了 ') + (-paren) + ' 个 )'});
var startsWithKeyword=false;
var firstToken=tokens[0];
if(firstToken&&['SELECT','INSERT','UPDATE','DELETE','CREATE','DROP','ALTER','WITH'].indexOf(firstToken.text.toUpperCase())!==-1){
startsWithKeyword=true;
}
if(!startsWithKeyword&&tokens.length>0)issues.push({type:'warn',msg: t('ui.6','语句应以 SQL 关键字开头（SELECT/INSERT/UPDATE/DELETE 等）')});
if(issues.length===0)issues.push({type:'ok',msg: t('ui.5','语法检查通过，未发现明显错误')});
render结果s(issues);
outputEl.textContent = t('ui.4','发现 ')+(issues.filter(function(i){return i.type!=='ok';}).length)+ t('ui.3',' 个问题');
}

function render结果s(issues){
var html='';
for(var i=0;i<issues.length;i++){
var cls=issues[i].type==='err'?'err':issues[i].type==='warn'?'warn':'ok';
var label=issues[i].type==='err'?'错误':issues[i].type==='warn'?'警告':'通过';
html+='<div class="issue '+cls+'">['+label+'] '+issues[i].msg+'</div>';
}
results.innerHTML=html;
}

checkBtn.addEventListener('click',check);
clearBtn.addEventListener('click',function(){sqlInput.value='';results.innerHTML='';outputEl.textContent='';setStatus('');sqlInput.focus();});
copyBtn.addEventListener('click',function(){if(outputEl.textContent){copyToClipboard(outputEl.textContent,copyBtn);setStatus(t('ui.copied','已复制'));}});
sqlInput.addEventListener('keydown',function(e){if(e.ctrlKey&&e.key==='Enter')check();});
})();</script></body></html>
