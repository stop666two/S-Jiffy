<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>删除线生成 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css"></head>
<body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
<main class="tool-workspace"><h1 data-i18n="h1">删除线文字</h1><p class="tool-desc" data-i18n="desc">生成删除线、斜线、下划线、上划线和波浪线文本效果。</p>
<div class="card">
<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
<label style="font-size:var(--font-size-sm);color:var(--color-text-secondary);" data-i18n="ui.1">样式</label>
<select id="styleSelect" class="input" style="width:140px;">
<option value="strike" data-i18n="ui.2">删除线 ~~text~~</option>
<option value="slash" data-i18n="ui.3">斜线 /text/</option>
<option value="underline" data-i18n="ui.4">下划线 _text_</option>
<option value="overline" data-i18n="ui.5">上划线 ‾text‾</option>
<option value="wavy" data-i18n="ui.6">波浪线 ∼text∼</option>
</select>
</div>
</div>
<div class="card"><textarea id="inputText" class="input textarea js-focus-input" data-i18n-placeholder="ui.101" placeholder="输入文本..." style="min-height:100px;"></textarea></div>
<div class="action-bar" style="display:flex;gap:12px;margin:var(--space-2) 0;flex-wrap:wrap;align-items:center;">
<button id="convertBtn" class="btn btn-primary" data-i18n="ui.convert">转换</button><button id="clearBtn" class="btn btn-secondary" data-i18n="ui.clear">清空</button>
</div>
<div class="output-box"><span id="outputText" style="display:block;padding-right:60px;"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
</main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script><script>
(function(){
var inputEl=document.getElementById('inputText');
var outputEl=document.getElementById('outputText');
var styleSelect=document.getElementById('styleSelect');
var convertBtn=document.getElementById('convertBtn');
var clearBtn=document.getElementById('clearBtn');
var copyBtn=document.getElementById('copyBtn');
var combiners={
'strike':'\u0336',
'slash':'\u0337',
'underline':'\u0332',
'overline':'\u0305',
'wavy':'\u0330'
};
function convert(text,style){
var comb=combiners[style];
if(!comb)return text;
var r='';
for(var i=0;i<text.length;i++){
r+=text[i];
if(text[i]!==' ')r+=comb;
}
return r;
}
convertBtn.addEventListener('click',function(){
var t=inputEl.value;
if(!t){setStatus(t('ui.100','请输入文本'),'error');return;}
outputEl.textContent=convert(t,styleSelect.value);
setStatus('');
});
clearBtn.addEventListener('click',function(){inputEl.value='';outputEl.textContent='';setStatus('');inputEl.focus();});
copyBtn.addEventListener('click',function(){if(outputEl.textContent){copyToClipboard(outputEl.textContent,copyBtn);setStatus(t('ui.copied','已复制'));}});
})();
</script></body></html>
