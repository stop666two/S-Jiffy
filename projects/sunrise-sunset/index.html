<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>日出日落时间 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css">
<style>
.ss-grid{display:grid;gap:var(--space-2);}
.ss-card{border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-3);text-align:center;}
.ss-card .big{font-size:28px;font-weight:600;font-family:var(--font-mono);}
.ss-card .lbl{font-size:var(--font-size-xs);color:var(--color-text-secondary);}
.loc-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:var(--space-3);}
.loc-row .field{min-width:100px;}
.loc-row label{display:block;font-size:var(--font-size-sm);color:var(--color-text-secondary);margin-bottom:4px;}
</style></head>
<body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
<main class="tool-workspace"><h1 data-i18n="h1">日出日落时间</h1><p class="tool-desc" data-i18n="desc">根据纬度、经度和日期计算近似的日出日落时间。</p>
<div class="card">
<div class="loc-row">
<div class="field"><label>纬度</label><input id="latInput" class="input" type="number" value="40.7128" step="0.01" style="width:120px;"></div>
<div class="field"><label>经度</label><input id="lngInput" class="input" type="number" value="-74.0060" step="0.01" style="width:120px;"></div>
<div class="field"><label>日期</label><input id="dateInput" class="input" type="date"></div>
<button id="calcBtn" class="btn btn-primary">计算</button>
</div>
</div>
<div class="card"><div class="ss-grid"><div class="ss-card"><div class="lbl">日出</div><div id="sunrise" class="big">—</div></div><div class="ss-card"><div class="lbl">日落</div><div id="sunset" class="big">—</div></div><div class="ss-card"><div class="lbl">昼长</div><div id="dayLength" class="big">—</div></div><div class="ss-card"><div class="lbl">正午</div><div id="solarNoon" class="big">—</div></div><div class="ss-card"><div class="lbl">民用晨光开始</div><div id="civilStart" class="big">—</div></div><div class="ss-card"><div class="lbl">民用暮光结束</div><div id="civilEnd" class="big">—</div></div></div></div>
<div class="day-visual" id="dayVisual" style="height:24px;border-radius:var(--radius-sm);overflow:hidden;margin-bottom:var(--space-3);display:flex;"></div>
<div class="output-box"><span id="outputText" style="display:block;padding-right:60px;"></span><button class="copy-btn" id="copyBtn">复制</button></div></main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div>S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
<script>
(function(){var la=document.getElementById('latInput'),ln=document.getElementById('lngInput'),da=document.getElementById('dateInput');
var o=document.getElementById('outputText');
da.value=new Date().toISOString().slice(0,10);

function calcSun(lat,lng,date){var d=new Date(date);if(isNaN(d.getTime()))return null;
var day=d.getDate(),month=d.getMonth()+1,year=d.getFullYear();
var N=Math.floor(275*month/9)-2*Math.floor((month+9)/12)+day-30;
var lngHour=lng/15;
var tRise=N+(6-lngHour)/24,tSet=N+(18-lngHour)/24,tNoon=N+(12-lngHour)/24;
function pos(t,zenith){
var M=0.9856*t-3.289;
var L=M+1.916*Math.sin(M*Math.PI/180)+0.020*Math.sin(2*M*Math.PI/180)+282.634;
L=L%360;if(L<0)L+=360;
var RA=Math.atan(0.91764*Math.tan(L*Math.PI/180))*180/Math.PI;RA=RA%360;if(RA<0)RA+=360;
var Lq=Math.floor(L/90)*90,RAq=Math.floor(RA/90)*90;RA=(RA+(Lq-RAq))/15;
var sinDec=0.39782*Math.sin(L*Math.PI/180);var cosDec=Math.cos(Math.asin(sinDec));
var cosHA=(Math.cos(zenith*Math.PI/180)-sinDec*Math.sin(lat*Math.PI/180))/(cosDec*Math.cos(lat*Math.PI/180));
return{RA:RA,cosHA:cosHA,t:t};
}
function norm(h){while(h<0)h+=24;while(h>=24)h-=24;return h}
function riseSet(t,zenith,isRise){
var p=pos(t,zenith);
if(p.cosHA>1||p.cosHA<-1)return null;
var Hdeg=Math.acos(p.cosHA)*180/Math.PI;
var H=(isRise?360-Hdeg:Hdeg)/15;
return norm(H+p.RA-0.06571*p.t-6.622-lngHour);
}
var r=riseSet(tRise,90.833,true),s=riseSet(tSet,90.833,false);
if(r===null||s===null)return null;
var n=norm(pos(tNoon,90.833).RA-0.06571*tNoon-6.622-lngHour);
var c1=riseSet(tRise,96,true),c2=riseSet(tSet,96,false);
var dayLen=s-r;if(dayLen<0)dayLen+=24;
return{sunrise:r,sunset:s,dayLength:dayLen,solarNoon:n,civilStart:c1===null?r:c1,civilEnd:c2===null?s:c2};}

function calc(){var lat=parseFloat(la.value)||0,lng=parseFloat(ln.value)||0;var date=da.value;
var r=calcSun(lat,lng,date);if(!r){setStatus('该纬度下太阳不升起或不落下','error');return;}

function fmtH(h){var h2=Math.floor(h);var m=Math.round((h-h2)*60);if(m>=60){h2++;m=0;}
return String(h2).padStart(2,'0')+':'+String(m).padStart(2,'0');}
function fmtDL(h){var h2=Math.floor(h);var m=Math.round((h-h2)*60);return h2+'h '+m+'m';}

document.getElementById('sunrise').textContent=fmtH(r.sunrise)+' UTC';
document.getElementById('sunset').textContent=fmtH(r.sunset)+' UTC';
document.getElementById('dayLength').textContent=fmtDL(r.dayLength);
document.getElementById('solarNoon').textContent=fmtH(r.solarNoon)+' UTC';
document.getElementById('civilStart').textContent=fmtH(r.civilStart)+' UTC';
document.getElementById('civilEnd').textContent=fmtH(r.civilEnd)+' UTC';

var dv=document.getElementById('dayVisual');var total=24;var dayFrac=r.dayLength/total;var nightFrac=1-dayFrac;
dv.innerHTML='<div style="background:#1a1a2e;height:100%;width:'+(r.sunrise/total*100)+'%"></div><div style="background:#fdb813;height:100%;width:'+(dayFrac*100)+'%"></div><div style="background:#1a1a2e;height:100%;width:'+((total-r.sunset)/total*100)+'%"></div>';
setStatus('已计算：纬度='+lat+'，经度='+lng);}

document.getElementById('calcBtn').addEventListener('click',calc);
document.getElementById('copyBtn').addEventListener('click',function(){if(o.textContent){copyToClipboard(o.textContent,this);setStatus('已复制');}});
calc();})();
</script></body></html>
