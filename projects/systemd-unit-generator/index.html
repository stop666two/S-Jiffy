<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>systemd 单元生成器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .field { margin-bottom: var(--space-2); }
    .field label { display: block; font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: 4px; }
    .field .input { width: 100%; }
    .field .textarea { min-height: 90px; font-family: var(--font-mono); font-size: var(--font-size-sm); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 var(--space-3); }
    .form-grid .full { grid-column: 1 / -1; }
    .actions { display: flex; gap: var(--space-2); margin-top: var(--space-3); }
    .hint { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-top: 4px; }
    .dc-tabs { display: flex; gap: var(--space-1); margin-bottom: var(--space-3); }
    .dc-tabs button { flex: 1; height: 44px; font-size: var(--font-size-sm); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); cursor: pointer; transition: all .15s; }
    .dc-tabs button.active { background: var(--color-text-primary); color: #fff; border-color: var(--color-text-primary); }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">systemd 单元生成器</h1>
    <p class="tool-desc" data-i18n="desc">生成 systemd 单元文件，也可生成定时器与配套服务文件（支持 cron 表达式自动转换）</p>
    <div class="dc-tabs">
      <button id="tabUnit" class="active" type="button" data-i18n="ui.tabUnit">单元</button>
      <button id="tabTimer" type="button" data-i18n="ui.tabTimer">定时器</button>
    </div>
    <div id="panelUnit">
      <div class="card">
        <div class="form-grid">
          <div class="field">
            <label data-i18n="ui.1">服务名</label>
            <input id="serviceName" class="input js-focus-input" data-i18n-placeholder="ui.105" placeholder="如 my-service">
          </div>
          <div class="field">
            <label data-i18n="ui.desc">描述</label>
            <input id="description" class="input" data-i18n-placeholder="ui.106" placeholder="如 My background service">
          </div>
          <div class="field full">
            <label data-i18n="ui.2">启动命令 ExecStart</label>
            <input id="execStart" class="input" data-i18n-placeholder="ui.107" placeholder="如 /usr/bin/myapp --config /etc/myapp.conf">
          </div>
          <div class="field">
            <label data-i18n="ui.3">工作目录</label>
            <input id="workingDir" class="input" data-i18n-placeholder="ui.108" placeholder="如 /opt/myapp">
          </div>
          <div class="field">
            <label data-i18n="ui.4">运行用户</label>
            <input id="user" class="input" data-i18n-placeholder="ui.109" placeholder="如 www-data">
          </div>
          <div class="field">
            <label data-i18n="ui.5">重启策略</label>
            <select id="restartPolicy" class="input">
              <option value="no" data-i18n="ui.6">no（不自动重启）</option>
              <option value="on-failure" selected data-i18n="ui.7">on-failure（失败时重启）</option>
              <option value="always" data-i18n="ui.8">always（始终重启）</option>
            </select>
          </div>
          <div class="field">
            <label data-i18n="ui.9">重启间隔 RestartSec</label>
            <input id="restartSec" class="input" value="5" data-i18n-placeholder="ui.110" placeholder="秒，默认 5">
          </div>
          <div class="field full">
            <label data-i18n="ui.10">环境变量（每行一条 KEY=value）</label>
            <textarea id="envVars" class="input textarea" placeholder="NODE_ENV=production&#10;PORT=8080"></textarea>
          </div>
        </div>
        <div class="actions">
          <button id="generateBtn" class="btn btn-primary" data-i18n="ui.11">生成单元文件</button>
          <button id="clearBtn" class="btn btn-secondary" data-i18n="ui.clear">清空</button>
        </div>
      </div>
    </div>
    <div id="panelTimer" style="display:none;">
      <div class="card">
        <div class="form-grid">
          <div class="field">
            <label data-i18n="tmr.serviceName">目标服务名</label>
            <input id="timerServiceName" class="input js-focus-input" data-i18n-placeholder="tmr.phService" placeholder="如 backup">
          </div>
          <div class="field">
            <label data-i18n="tmr.trigger">触发方式</label>
            <select id="trigger" class="input">
              <option value="daily" data-i18n="tmr.daily">每天（OnCalendar=*-*-* 00:00:00）</option>
              <option value="hourly" data-i18n="tmr.hourly">每小时（*-*-* *:00:00）</option>
              <option value="weekly" data-i18n="tmr.weekly">每周（Mon *-*-* 00:00:00）</option>
              <option value="monthly" data-i18n="tmr.monthly">每月（*-*-01 00:00:00）</option>
              <option value="reboot" data-i18n="tmr.reboot">开机后（OnBootSec）</option>
              <option value="custom" data-i18n="tmr.custom">自定义 cron 表达式</option>
            </select>
          </div>
          <div class="field full" id="cronRow" style="display:none;">
            <label data-i18n="tmr.cronLabel">cron 表达式（分 时 日 月 周）</label>
            <input id="cronExpr" class="input" value="0 2 * * *" data-i18n-placeholder="tmr.cronPh" placeholder="如 0 2 * * *">
            <div class="hint" id="cronPreview"></div>
          </div>
          <div class="field">
            <label data-i18n="tmr.accuracy">精度 AccuracySec</label>
            <input id="accuracy" class="input" value="1min" data-i18n-placeholder="tmr.accuracyPh" placeholder="如 1min / 5s / 1h">
          </div>
          <div class="field">
            <label data-i18n="tmr.bootDelay">延迟启动（OnBootSec，reboot 触发时）</label>
            <input id="bootDelay" class="input" value="5min" data-i18n-placeholder="tmr.bootDelayPh" placeholder="如 5min">
          </div>
        </div>
        <div class="actions">
          <button id="timerBtn" class="btn btn-primary" data-i18n="tmr.generate">生成定时器</button>
          <button id="timerClearBtn" class="btn btn-secondary" data-i18n="ui.clear">清空</button>
        </div>
      </div>
    </div>
    <div id="resultBox" class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>
    (function () {
      var output = document.getElementById('outputText');
      var copyBtn = document.getElementById('copyBtn');
      copyBtn.addEventListener('click', function () {
        if (output.textContent) copyToClipboard(output.textContent, copyBtn);
      });

      /* ============ unit tab (original) ============ */
      var nameInput = document.getElementById('serviceName');
      var descInput = document.getElementById('description');
      var execInput = document.getElementById('execStart');
      var workInput = document.getElementById('workingDir');
      var userInput = document.getElementById('user');
      var restartSelect = document.getElementById('restartPolicy');
      var secInput = document.getElementById('restartSec');
      var envInput = document.getElementById('envVars');

      function buildUnit() {
        var name = nameInput.value.trim();
        var desc = descInput.value.trim();
        var exec = execInput.value.trim();
        var work = workInput.value.trim();
        var user = userInput.value.trim();
        var restart = restartSelect.value;
        var sec = secInput.value.trim();
        var envText = envInput.value;

        if (!name) { setStatus(t('ui.100','请输入服务名'), 'error'); return null; }
        if (!/^[a-zA-Z0-9._-]+$/.test(name)) { setStatus(t('ui.101','服务名只能包含字母、数字、点、下划线和连字符'), 'error'); return null; }
        if (!exec) { setStatus(t('ui.102','请输入 ExecStart 启动命令'), 'error'); return null; }
        if (!sec) { setStatus(t('ui.103','请输入重启间隔 RestartSec'), 'error'); return null; }
        if (!/^\d+(\.\d+)?(s|m|h|d)?$/.test(sec)) { setStatus(t('ui.104','RestartSec 必须是数字或数字加单位（s/m/h/d）'), 'error'); return null; }

        var envLines = [];
        var lines = envText.split('\n');
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (!line) continue;
          var eq = line.indexOf('=');
          if (eq <= 0) { setStatus(t('ui.14','环境变量第 ') + (i + 1) + t('ui.15',' 行格式应为 KEY=value'), 'error'); return null; }
          if (/^\s/.test(line) || /\s$/.test(line)) { setStatus(t('ui.14','环境变量第 ') + (i + 1) + t('ui.13',' 行含首尾空格'), 'error'); return null; }
          envLines.push(line);
        }

        var unit = '[Unit]\n';
        unit += 'Description=' + (desc || name) + '\n';
        unit += 'After=network.target\n\n';
        unit += '[Service]\n';
        unit += 'Type=simple\n';
        if (user) unit += 'User=' + user + '\n';
        if (work) unit += 'WorkingDirectory=' + work + '\n';
        for (var j = 0; j < envLines.length; j++) unit += 'Environment=' + envLines[j] + '\n';
        unit += 'ExecStart=' + exec + '\n';
        unit += 'Restart=' + restart + '\n';
        unit += 'RestartSec=' + sec + '\n\n';
        unit += '[Install]\n';
        unit += 'WantedBy=multi-user.target\n';
        return unit;
      }

      document.getElementById('generateBtn').addEventListener('click', function () {
        var unit = buildUnit();
        if (unit === null) { output.textContent = ''; return; }
        output.textContent = unit;
        setStatus(t('ui.12','单元文件已生成'));
      });

      document.getElementById('clearBtn').addEventListener('click', function () {
        output.textContent = '';
        setStatus('');
      });

      /* ============ timer tab (merged from systemd-timer-generator) ============ */
      var tabUnit = document.getElementById('tabUnit'), tabTimer = document.getElementById('tabTimer');
      var panelUnit = document.getElementById('panelUnit'), panelTimer = document.getElementById('panelTimer');
      function switchTab(which) {
        if (which === 'unit') {
          tabUnit.className = 'active'; tabTimer.className = '';
          panelUnit.style.display = ''; panelTimer.style.display = 'none';
        } else {
          tabTimer.className = 'active'; tabUnit.className = '';
          panelTimer.style.display = ''; panelUnit.style.display = 'none';
        }
      }
      tabUnit.addEventListener('click', function () { switchTab('unit'); });
      tabTimer.addEventListener('click', function () { switchTab('timer'); });

      var timerNameInput = document.getElementById('timerServiceName');
      var triggerSelect = document.getElementById('trigger');
      var cronRow = document.getElementById('cronRow');
      var cronInput = document.getElementById('cronExpr');
      var cronPreview = document.getElementById('cronPreview');
      var accInput = document.getElementById('accuracy');
      var bootInput = document.getElementById('bootDelay');

      var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      function pad2(v) {
        var n = parseInt(v, 10);
        if (/^\d+$/.test(v) && n < 10) return '0' + n;
        return v;
      }

      function inRange(v, min, max, name) {
        if (v === '*') return true;
        if (/^\*\//.test(v)) {
          var step = parseInt(v.slice(2), 10);
          if (isNaN(step) || step < 1) return false;
          return true;
        }
        if (!/^\d+$/.test(v)) return false;
        var n = parseInt(v, 10);
        if (n < min || n > max) { setStatus(t('tmr.cronField','cron 字段 ') + name + t('tmr.outOfRange',' 取值超出范围'), 'error'); return false; }
        return true;
      }

      function cronToOnCalendar(expr) {
        var parts = expr.trim().split(/\s+/);
        if (parts.length !== 5) { setStatus(t('tmr.err5fields','cron 表达式必须包含 5 个字段（分 时 日 月 周）'), 'error'); return null; }
        var minute = parts[0];
        var hour = parts[1];
        var dom = parts[2];
        var month = parts[3];
        var dow = parts[4];
        if (!inRange(minute, 0, 59, t('tmr.fieldMinute','分'))) return null;
        if (!inRange(hour, 0, 23, t('tmr.fieldHour','时'))) return null;
        if (!inRange(dom, 1, 31, t('tmr.fieldDay','日'))) return null;
        if (!inRange(month, 1, 12, t('tmr.fieldMonth','月'))) return null;
        if (!inRange(dow, 0, 7, t('tmr.fieldWeek','周'))) return null;
        var dowLabel = '';
        if (dow !== '*') {
          var d = parseInt(dow, 10) % 7;
          dowLabel = DAYS[d] + ' ';
        }
        return dowLabel + month + '-' + dom + ' ' + pad2(hour) + ':' + pad2(minute) + ':00';
      }

      function buildTimer() {
        var name = timerNameInput.value.trim();
        var acc = accInput.value.trim();
        var boot = bootInput.value.trim();
        if (!name) { setStatus(t('tmr.errName','请输入目标服务名'), 'error'); return null; }
        if (!/^[a-zA-Z0-9._-]+$/.test(name)) { setStatus(t('tmr.errNameChars','服务名只能包含字母、数字、点、下划线和连字符'), 'error'); return null; }
        if (!acc) { setStatus(t('tmr.errAccuracy','请输入精度 AccuracySec'), 'error'); return null; }
        if (!/^\d+(\.\d+)?(s|min|m|h|d|w|month|y)$/.test(acc)) { setStatus(t('tmr.errAccuracyFmt','精度格式应为数字加单位（s/min/h/d 等）'), 'error'); return null; }

        var timer = '[Unit]\n';
        timer += 'Description=Timer for ' + name + '\n\n';
        timer += '[Timer]\n';
        var mode = triggerSelect.value;
        if (mode === 'reboot') {
          if (!boot) { setStatus(t('tmr.errBoot','请输入延迟启动时长'), 'error'); return null; }
          if (!/^\d+(\.\d+)?(s|min|m|h|d)$/.test(boot)) { setStatus(t('tmr.errBootFmt','延迟启动格式应为数字加单位（s/min/h/d）'), 'error'); return null; }
          timer += 'OnBootSec=' + boot + '\n';
        } else if (mode === 'custom') {
          var cal = cronToOnCalendar(cronInput.value);
          if (cal === null) return null;
          timer += 'OnCalendar=' + cal + '\n';
        } else {
          var PRESETS = {
            daily: '*-*-* 00:00:00',
            hourly: '*-*-* *:00:00',
            weekly: 'Mon *-*-* 00:00:00',
            monthly: '*-*-01 00:00:00'
          };
          timer += 'OnCalendar=' + PRESETS[mode] + '\n';
        }
        timer += 'AccuracySec=' + acc + '\n';
        timer += 'Persistent=true\n\n';
        timer += '[Install]\n';
        timer += 'WantedBy=timers.target\n';

        var service = '[Unit]\n';
        service += 'Description=Run ' + name + ' on schedule\n\n';
        service += '[Service]\n';
        service += 'Type=oneshot\n';
        service += 'ExecStart=/usr/bin/systemctl start ' + name + '.service\n';

        var enable = t('tmr.enableSteps','启用步骤：') + '\n';
        enable += 'sudo cp ' + name + '.timer /etc/systemd/system/\n';
        enable += 'sudo cp ' + name + '.service /etc/systemd/system/\n';
        enable += 'sudo systemctl daemon-reload\n';
        enable += 'sudo systemctl enable --now ' + name + '.timer\n';
        enable += 'sudo systemctl list-timers ' + name + '.timer\n';

        return name + '.timer\n' + timer + '\n' + name + '.service\n' + service + '\n' + enable;
      }

      function syncCronRow() {
        var show = triggerSelect.value === 'custom';
        cronRow.style.display = show ? 'block' : 'none';
        if (show) {
          var cal = cronToOnCalendar(cronInput.value);
          if (cal !== null) cronPreview.textContent = t('tmr.cronPreview','转换结果：OnCalendar=') + cal;
          else cronPreview.textContent = '';
        }
      }

      triggerSelect.addEventListener('change', syncCronRow);
      cronInput.addEventListener('input', syncCronRow);

      document.getElementById('timerBtn').addEventListener('click', function () {
        var out = buildTimer();
        if (out === null) { output.textContent = ''; return; }
        output.textContent = out;
        setStatus(t('tmr.done','定时器与服务文件已生成'));
      });

      document.getElementById('timerClearBtn').addEventListener('click', function () {
        output.textContent = '';
        setStatus('');
      });
    })();
  </script>
</body>
</html>
