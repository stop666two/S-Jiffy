<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind 配置生成器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .field-row { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); flex-wrap: wrap; }
    .field-row label { width: 110px; font-size: var(--font-size-sm); color: var(--color-text-secondary); flex-shrink: 0; }
    .field-row select { width: 220px; }
    .field-row input[type="color"] { width: 44px; height: 44px; padding: 0; border: 1px solid var(--color-border); border-radius: var(--radius-sm); cursor: pointer; background: var(--color-bg); }
    .field-row input[type="number"] { width: 100px; }
    .code-block { margin: 0; font-family: inherit; font-size: var(--font-size-sm); white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">Tailwind 配置生成器</h1>
    <p class="tool-desc" data-i18n="desc">可视化配置主题扩展、暗色模式与内容路径，一键生成 tailwind.config.js。</p>
    <div class="card">
      <div class="field-row">
        <label data-i18n="ui.1">主色</label>
        <input id="primaryInput" type="color" value="#346538">
        <label data-i18n="ui.2">次要色</label>
        <input id="secondaryInput" type="color" value="#787774">
      </div>
      <div class="field-row">
        <label data-i18n="ui.3">间距基准</label>
        <input id="spacingInput" class="input" type="number" value="8" min="0" step="1">
        <span style="font-size:var(--font-size-sm);color:var(--color-text-secondary);">px（spacing.base）</span>
      </div>
      <div class="field-row">
        <label data-i18n="ui.4">圆角</label>
        <input id="radiusInput" class="input" type="number" value="8" min="0" step="1">
        <span style="font-size:var(--font-size-sm);color:var(--color-text-secondary);">px（borderRadius.base）</span>
      </div>
      <div class="field-row">
        <label data-i18n="ui.5">暗色模式</label>
        <select id="darkSelect" class="input">
          <option value="class" data-i18n="ui.6">class（手动切换）</option>
          <option value="media" data-i18n="ui.7">media（跟随系统）</option>
          <option value="off" data-i18n="ui.8">不启用</option>
        </select>
      </div>
      <div class="field-row">
        <label data-i18n="ui.9">内容路径</label>
        <input id="contentInput" class="input js-focus-input" type="text" value="./index.html" data-i18n-placeholder="ui.102" placeholder="多个路径用逗号分隔，如 ./index.html, ./src/**/*.{js,ts}">
      </div>
    </div>
    <div id="resultBox" class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
<script src="../../assets/js/custom-controls.js"></script>
  <script>
    (function () {
      var primaryInput = document.getElementById('primaryInput');
      var secondaryInput = document.getElementById('secondaryInput');
      var spacingInput = document.getElementById('spacingInput');
      var radiusInput = document.getElementById('radiusInput');
      var darkSelect = document.getElementById('darkSelect');
      var contentInput = document.getElementById('contentInput');
      var outputText = document.getElementById('outputText');
      var currentCode = '';

      function splitPaths(content) {
        var paths = [];
        var cur = '';
        var depth = 0;
        var i;
        for (i = 0; i < content.length; i++) {
          var ch = content.charAt(i);
          if (ch === '{' || ch === '(') {
            depth++;
          } else if (ch === '}' || ch === ')') {
            depth--;
          }
          if (ch === ',' && depth === 0) {
            if (cur.trim()) paths.push(cur.trim());
            cur = '';
          } else {
            cur += ch;
          }
        }
        if (cur.trim()) paths.push(cur.trim());
        return paths;
      }

      function render() {
        var content = contentInput.value.trim();
        var spacing = parseFloat(spacingInput.value);
        var radius = parseFloat(radiusInput.value);
        if (!content) {
          outputText.textContent = '';
          currentCode = '';
          setStatus(t('ui.12','请输入内容路径'));
          return;
        }
        if (!isFinite(spacing) || spacing < 0) {
          outputText.textContent = '';
          currentCode = '';
          setStatus(t('ui.100','间距基准请输入大于等于 0 的数值'), 'error');
          return;
        }
        if (!isFinite(radius) || radius < 0) {
          outputText.textContent = '';
          currentCode = '';
          setStatus(t('ui.101','圆角请输入大于等于 0 的数值'), 'error');
          return;
        }
        var paths = splitPaths(content);
        var dark = darkSelect.value;
        var spacingVal = spacing === 0 ? '0' : spacing + 'px';
        var radiusVal = radius === 0 ? '0' : radius + 'px';
        var code = 'module.exports = {\n';
        code += '  content: ' + JSON.stringify(paths) + ',\n';
        if (dark !== 'off') code += '  darkMode: "' + dark + '",\n';
        code += '  theme: {\n';
        code += '    extend: {\n';
        code += '      colors: {\n';
        code += '        primary: "' + primaryInput.value + '",\n';
        code += '        secondary: "' + secondaryInput.value + '"\n';
        code += '      },\n';
        code += '      spacing: {\n';
        code += '        base: "' + spacingVal + '"\n';
        code += '      },\n';
        code += '      borderRadius: {\n';
        code += '        base: "' + radiusVal + '"\n';
        code += '      }\n';
        code += '    }\n';
        code += '  }\n';
        code += '};\n';
        currentCode = code;
        outputText.innerHTML = '<pre class="code-block">' + htmlEscape(code) + '</pre>';
        setStatus(t('ui.11','已生成 tailwind.config.js'));
      }

      primaryInput.addEventListener('input', render);
      secondaryInput.addEventListener('input', render);
      spacingInput.addEventListener('input', render);
      radiusInput.addEventListener('input', render);
      darkSelect.addEventListener('change', render);
      contentInput.addEventListener('input', render);
      document.getElementById('copyBtn').addEventListener('click', function () {
        if (!currentCode) return;
        copyToClipboard(currentCode, this);
        setStatus(t('ui.10','已复制配置文件'));
      });
      render();
    })();
  </script>
</body>
</html>
