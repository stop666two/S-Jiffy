<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>列对齐工具 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css">
<style>
.align-controls{display:flex;gap:12px;margin-bottom:var(--space-3);flex-wrap:wrap;align-items:center;}
</style></head><body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
<main class="tool-workspace"><h1 data-i18n="h1">列对齐工具</h1><p class="tool-desc" data-i18n="desc">将多行文本按分隔符对齐或左右对齐格式化。</p>
<div class="card"><textarea id="inputText" class="input textarea js-focus-input" data-i18n-placeholder="ui.101" placeholder="例如：&#10;name: Alice&#10;age: 30&#10;location: New York" style="min-height:140px;"></textarea></div>
<div class="align-controls">
<input id="delimiter" class="input" value=":" data-i18n-placeholder="ui.102" placeholder="分隔符" style="width:100px;">
<select id="alignMode" class="input" style="width:auto;min-width:100px;">
  <option value="delimiter" data-i18n="ui.1">按分隔符对齐</option>
  <option value="right" data-i18n="ui.2">右对齐</option>
  <option value="left" data-i18n="ui.3">左对齐</option>
  <option value="center" data-i18n="ui.4">居中对齐</option>
</select>
<button id="alignBtn" class="btn btn-primary" data-i18n="ui.5">对齐</button>
</div>
<div class="output-box"><span id="outputText"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
</main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
<script>(function(){
var i=document.getElementById('inputText'),o=document.getElementById('outputText');
var dInput=document.getElementById('delimiter'),am=document.getElementById('alignMode');
function dispWidth(s){var w=0;for(var k=0;k<s.length;k++){w+=(s.charCodeAt(k)>255?2:1);}return w;}
function padTo(s,target){var pad=target-dispWidth(s);for(var k=0;k<pad;k++)s+=' ';return s;}
document.getElementById('alignBtn').addEventListener('click',function(){
  var text=i.value;if(!text.trim()){setStatus(t('ui.100','请输入文本'),'error');return;}
  var lines=text.split('\n');var delim=dInput.value||':';var mode=am.value;
  if(mode==='delimiter'){
    var parts=lines.map(function(l){var idx=l.indexOf(delim);if(idx===-1)return[l,''];return[l.substring(0,idx),l.substring(idx+delim.length)];});
    var maxLen=0;parts.forEach(function(p){var w=dispWidth(p[0].trim());if(w>maxLen)maxLen=w;});
    o.textContent=parts.map(function(p){return padTo(p[0].trim(),maxLen)+(p[1]?delim+' '+p[1].trim():'');}).join('\n');
  }else{
    var maxWidth=0;lines.forEach(function(l){var w=dispWidth(l);if(w>maxWidth)maxWidth=w;});
    o.textContent=lines.map(function(l){
      var lw=dispWidth(l);
      if(mode==='right')return padTo('',maxWidth-lw)+l;
      if(mode==='center'){var pad=Math.max(0,maxWidth-lw);var lPad=Math.floor(pad/2);return ' '.repeat(lPad)+l;}
      return padTo(l,maxWidth);
    }).join('\n');
  }
  setStatus('');
});
document.getElementById('copyBtn').addEventListener('click',function(){if(o.textContent)copyToClipboard(o.textContent,this);setStatus(t('ui.copied','已复制'));});
})();</script>
</body></html>
