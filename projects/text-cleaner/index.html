<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>文本清理器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css"><style>
.clean-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:250px}@media(max-width:700px){.clean-layout{grid-template-columns:1fr}}.clean-layout textarea{height:250px;resize:vertical;font-family:var(--font-mono);font-size:13px;padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-md);outline:none}.clean-layout textarea:focus{border-color:var(--color-text-primary);box-shadow:var(--shadow-focus)}.option-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.option-grid label{display:flex;align-items:center;gap:6px;font-size:13px;padding:6px 12px;border:1px solid var(--color-border);border-radius:20px;cursor:pointer;transition:all .15s;user-select:none}.option-grid label:hover{border-color:var(--color-text-primary)}.option-grid input[type=checkbox]{accent-color:var(--color-text-primary)}
</style></head><body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
<main class="tool-workspace"><h1 data-i18n="h1">文本清理器</h1><p class="tool-desc" data-i18n="desc">清理文本：移除多余空格、特殊字符、空行，统一标点符号和空白字符。</p>
<div class="card">
<div class="option-grid">
<label title="移除首尾多余空格"><input type="checkbox" id="optTrim" checked> 去除首尾空格</label>
<label title="将连续多个空格合并为一个"><input type="checkbox" id="optExtraSpace" checked> 合并多余空格</label>
<label title="删除空行（连续换行压缩）"><input type="checkbox" id="optEmptyLines" checked> 移除空行</label>
<label title="删除所有不在白名单内的字符"><input type="checkbox" id="optSpecial" checked> 移除特殊字符</label>
<label title="将中文标点（。，；：！？）统一为英文标点"><input type="checkbox" id="optNormalize" checked> 统一标点</label>
<label title="按 Unicode NFKC 标准归一化全角/半角字符"><input type="checkbox" id="optUnicode"> Unicode 标准化</label>
</div>
<div class="opt-hint" style="font-size:12px;color:var(--color-text-secondary);margin:-4px 0 12px 2px;">移除特殊字符时保留：中文、字母数字、空格，以及常用符号 . , ! ? ; : ' &quot; ( ) [ ] { } - @ # $ % &amp; * + / = &lt; &gt; ~ ^ _ ` | \</div>
<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
<button id="cleanBtn" class="btn btn-primary" data-i18n="ui.1">清理</button>
<button id="clearBtn" class="btn btn-secondary" data-i18n="ui.clear">清空</button>
</div>
<div class="clean-layout">
<textarea id="inputText" class="js-focus-input" placeholder="粘贴需要清理的文本...">Hello,  World!!  这是一段  含有多余空格、特殊字符@#$%和 空行的文本。

  第二段  包含  不统一符号...   
第三行</textarea>
<textarea id="outputText" readonly placeholder="清理结果..." style="background:var(--color-bg-soft);"></textarea>
</div>
</div>
<div class="output-box"><span id="statusText" style="display:block;padding-right:60px;"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
</main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script></script><script>(function(){
var inputEl=document.getElementById('inputText');
var outputEl=document.getElementById('outputText');
var cleanBtn=document.getElementById('cleanBtn');
var clearBtn=document.getElementById('clearBtn');
var statusText=document.getElementById('statusText');
var copyBtn=document.getElementById('copyBtn');
var optTrim=document.getElementById('optTrim');
var optExtraSpace=document.getElementById('optExtraSpace');
var optEmptyLines=document.getElementById('optEmptyLines');
var optSpecial=document.getElementById('optSpecial');
var optNormalize=document.getElementById('optNormalize');
var optUnicode=document.getElementById('optUnicode');

function clean(){
var text=inputEl.value;
if(!text){outputEl.value='';statusText.textContent='';setStatus('请输入文本','error');return;}
var result=text;
if(optUnicode.checked)result=result.normalize('NFKC');
if(optNormalize.checked){
result=result.replace(/[「」『』]/g,'"');
result=result.replace(/[【】]/g,'[]');
result=result.replace(/[！]/g,'!');
result=result.replace(/[？]/g,'?');
result=result.replace(/[，]/g,',');
result=result.replace(/[；]/g,';');
result=result.replace(/[：]/g,':');
result=result.replace(/[。]/g,'.');
result=result.replace(/[～]/g,'~');
result=result.replace(/[·・]/g,'.');
result=result.replace(/\u2018|\u2019/g,"'");
result=result.replace(/\u201c|\u201d/g,'"');
result=result.replace(/\u2013|\u2014/g,'-');
}
if(optSpecial.checked)result=result.replace(/[^\w\s\u4e00-\u9fff.,!?;:'"()\[\]{}\-@#$%&*+\/=<>~^_`|\\]/g,'');
if(optEmptyLines.checked){
result=result.replace(/\n\s*\n/g,'\n');
result=result.replace(/^\s*\n/,'');
}
if(optExtraSpace.checked){
result=result.replace(/[ \t]+/g,' ');
result=result.replace(/\n\s+/g,'\n');
}
if(optTrim.checked)result=result.trim();
outputEl.value=result;
var origLen=text.length;
var newLen=result.length;
statusText.textContent = t('ui.3','原始: ')+origLen+ t('ui.2',' 字符 → 清理后: ')+newLen+' 字符 (减少 '+(origLen-newLen)+' 字符)';
setStatus('');
}

cleanBtn.addEventListener('click',clean);
clearBtn.addEventListener('click',function(){inputEl.value='';outputEl.value='';statusText.textContent='';setStatus('');inputEl.focus();});
copyBtn.addEventListener('click',function(){if(outputEl.value){copyToClipboard(outputEl.value,copyBtn);setStatus(t('ui.copied','已复制'));}});
inputEl.addEventListener('keydown',function(e){if(e.ctrlKey&&e.key==='Enter')clean();});
})();</script></body></html>
