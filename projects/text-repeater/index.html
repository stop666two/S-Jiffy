<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文本重复器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .repeater-row { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-bottom:var(--space-3); }
    .repeater-row .field { flex:1; min-width:120px; }
    .repeater-row label { display:block; font-size:var(--font-size-sm); color:var(--color-text-secondary); margin-bottom:4px; }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
  <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">文本重复器</h1>
    <p class="tool-desc" data-i18n="desc">输入文本和重复次数，可选择分隔符。</p>
    <div class="card">
      <div class="repeater-row">
        <div class="field">
          <label for="inputText" data-i18n="ui.1">文本</label>
          <input id="inputText" class="input js-focus-input" data-i18n-placeholder="ui.101" placeholder="要重复的文本">
        </div>
        <div class="field">
          <label for="repeatCount" data-i18n="ui.2">重复次数</label>
          <input id="repeatCount" class="input" type="number" value="3" min="1" max="10000">
        </div>
      </div>
      <div class="repeater-row">
        <div class="field">
          <label for="separatorInput" data-i18n="ui.separator">分隔符</label>
          <input id="separatorInput" class="input" data-i18n-placeholder="ui.102" placeholder="可选，如逗号/换行等">
        </div>
        <div style="display:flex;align-items:flex-end;">
          <button id="repeatBtn" class="btn btn-primary" data-i18n="ui.3">重复</button>
        </div>
      </div>
    </div>
    <div class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script></script>
  <script>
    (function() {
      var inputEl = document.getElementById('inputText');
      var countEl = document.getElementById('repeatCount');
      var sepEl = document.getElementById('separatorInput');
      var repeatBtn = document.getElementById('repeatBtn');
      var outputEl = document.getElementById('outputText');
      var copyBtn = document.getElementById('copyBtn');

      function repeat() {
        var text = inputEl.value;
        var count = parseInt(countEl.value, 10) || 1;
        if (count < 1) count = 1;
        if (count > 100000) count = 100000;
        if (!text) {
          outputEl.textContent = '';
          setStatus(t('ui.100','请输入文本'), 'error');
          return;
        }
        var sep = sepEl.value;
        var parts = [];
        for (var i = 0; i < count; i++) {
          parts.push(text);
        }
        outputEl.textContent = parts.join(sep);
        setStatus(t('ui.6','已重复 ') + count + t('ui.5',' 次') + (sep ? t('ui.4','，分隔符: ') + sep : ''));
      }

      repeatBtn.addEventListener('click', repeat);

      copyBtn.addEventListener('click', function() {
        var text = outputEl.textContent;
        if (text) {
          copyToClipboard(text, copyBtn);
          setStatus(t('ui.copiedClip','已复制到剪贴板'));
        }
      });

      inputEl.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === 'Enter') repeat();
      });
    })();
  </script>
</body>
</html>
