<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文本与二进制互转 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
  <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">文本与二进制互转</h1>
    <p class="tool-desc" data-i18n="desc">将文本转换为二进制（每字符 8 位），或将二进制序列还原为文本。</p>
    <div class="card">
      <textarea id="inputText" class="input textarea js-focus-input" data-i18n-placeholder="ui.104" placeholder="输入文本或二进制..." style="min-height:100px;"></textarea>
    </div>
    <div class="action-bar" style="display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap;">
      <button id="toBinaryBtn" class="btn btn-primary" data-i18n="ui.1">文本 → 二进制</button>
      <button id="toTextBtn" class="btn btn-secondary" data-i18n="ui.2">二进制 → 文本</button>
      <button id="clearBtn" class="btn btn-secondary" data-i18n="ui.clear">清空</button>
    </div>
    <div class="output-box" id="输出Container">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>
    (function() {
      var inputEl = document.getElementById('inputText');
      var outputEl = document.getElementById('outputText');
      var copyBtn = document.getElementById('copyBtn');
      var clearBtn = document.getElementById('clearBtn');

      document.getElementById('toBinaryBtn').addEventListener('click', function() {
        var text = inputEl.value;
        if (!text) { setStatus(t('ui.100','请输入文本'), 'error'); return; }
        var result = [];
        for (var i = 0; i < text.length; i++) {
          var code = text.charCodeAt(i);
          result.push(code.toString(2).padStart(8, '0'));
        }
        outputEl.textContent = result.join(' ');
        setStatus(t('ui.converted','已转换 ') + text.length + t('ui.3',' 个字符'));
      });

      document.getElementById('toTextBtn').addEventListener('click', function() {
        var bin = inputEl.value.trim();
        if (!bin) { setStatus(t('ui.101','请输入二进制序列'), 'error'); return; }
        // Remove spaces, newlines
        var clean = bin.replace(/\s+/g, '');
        if (clean.length % 8 !== 0) {
          setStatus(t('ui.102','二进制位数不是 8 的倍数'), 'error');
          return;
        }
        var result = '';
        for (var i = 0; i < clean.length; i += 8) {
          var byteStr = clean.substring(i, i + 8);
          var code = parseInt(byteStr, 2);
          if (isNaN(code)) {
            setStatus(t('ui.103','包含无效的二进制字符（只能含 0 和 1）'), 'error');
            return;
          }
          result += String.fromCharCode(code);
        }
        outputEl.textContent = result;
        setStatus(t('ui.converted','已转换 ') + (clean.length / 8) + t('ui.bytes',' 字节'));
      });

      clearBtn.addEventListener('click', function() {
        inputEl.value = '';
        outputEl.textContent = '';
        setStatus('');
        inputEl.focus();
      });

      copyBtn.addEventListener('click', function() {
        if (outputEl.textContent) { copyToClipboard(outputEl.textContent, copyBtn); setStatus(t('ui.copied','已复制')); }
      });
    })();
  </script>
</body>
</html>
