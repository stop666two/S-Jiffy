<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>时间推算 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css"><style>.ta-result{font-size:var(--font-size-lg);padding:var(--space-3);text-align:center;background:var(--color-bg-secondary);border-radius:var(--radius-md);margin-top:var(--space-2)}.ta-result .big{font-size:var(--font-size-xxl);font-weight:700;color:var(--color-primary);display:block}</style></head>
<body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a></header>
<main class="tool-workspace"><h1 data-i18n="h1">时间前计算</h1><p class="tool-desc" data-i18n="desc">计算某个日期时间距现在过去了多久，显示具体时长描述。</p>
<div class="card"><input id="dateInput" type="datetime-local" class="input" style="width:260px;">
<div style="display:flex;gap:12px;margin-top:var(--space-2);flex-wrap:wrap;"><button id="calcBtn" class="btn btn-primary" data-i18n="ui.calc">计算</button><button id="nowBtn" class="btn btn-secondary" data-i18n="ui.1">当前时间</button><button id="clearBtn" class="btn btn-secondary" data-i18n="ui.clear">清空</button></div>
</div>
<div class="ta-result"><span class="big" id="resultText">-</span><span id="resultDetail" style="font-size:var(--font-size-sm);color:var(--color-text-secondary);"></span></div>
<div class="output-box"><span id="outputText" style="display:block;padding-right:60px;"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
</main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script><script>
(function(){
var dateInput=document.getElementById('dateInput');
var calcBtn=document.getElementById('calcBtn');
var nowBtn=document.getElementById('nowBtn');
var clearBtn=document.getElementById('clearBtn');
var copyBtn=document.getElementById('copyBtn');
var resultText=document.getElementById('resultText');
var resultDetail=document.getElementById('resultDetail');
var outputEl=document.getElementById('outputText');
function setNow(){var d=new Date();var s=d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0')+'T'+d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');dateInput.value=s;}
function timeAgo(d){
var now=Date.now();
var diff=now-d.getTime();
if(diff<0)return{text: t('ui.5','未来时间'),detail:t('ui.6','输入的时间还未到')};
var abs=diff;
var units=[
{name: t('ui.year','年'),ms:31536000000},
{name: t('ui.month','月'),ms:2592000000},
{name: t('ui.week','周'),ms:604800000},
{name: t('ui.day','天'),ms:86400000},
{name: t('ui.hour','小时'),ms:3600000},
{name: t('ui.minute','分钟'),ms:60000},
{name: t('ui.second','秒'),ms:1000}
];
for(var i=0;i<units.length;i++){
var val=Math.floor(abs/units[i].ms);
if(val>=1){
var remaining=Math.floor((abs%units[i].ms)/1000);
return{text:val+' '+units[i].name+ t('ui.4','前'),detail:t('ui.3','精确值: ') +val+' '+units[i].name+(val>1?'':'')+' '+remaining+' '+t('ui.second','秒')};
}
}
return{text: t('ui.2','刚刚'),detail:t('ui.7','不到 1 秒')};
}
function calc(){
var val=dateInput.value;
if(!val){setStatus(t('ui.100','请选择日期时间'),'error');return;}
var d=new Date(val);
if(isNaN(d.getTime())){setStatus(t('ui.101','无效日期'),'error');return;}
var r=timeAgo(d);
resultText.textContent=r.text;
resultDetail.textContent=r.detail;
outputEl.textContent=r.text+(r.detail?' ('+r.detail+')':'');
setStatus('');
}
dateInput.addEventListener('keydown',function(e){if(e.key==='Enter')calc();});
calcBtn.addEventListener('click',calc);
nowBtn.addEventListener('click',function(){setNow();calc();});
clearBtn.addEventListener('click',function(){dateInput.value='';resultText.textContent='-';resultDetail.textContent='';outputEl.textContent='';setStatus('');});
copyBtn.addEventListener('click',function(){if(outputEl.textContent){copyToClipboard(outputEl.textContent,copyBtn);setStatus(t('ui.copied','已复制'));}});
setNow();
})();
</script></body></html>
