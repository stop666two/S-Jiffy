<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日期时间计算器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .td-row { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-2); }
    .td-field { flex: 1; min-width: 240px; }
    .td-field label { display: block; font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: 4px; }
    .td-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: var(--space-1); margin-bottom: var(--space-2); }
    .td-stat { background: var(--color-bg-soft); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-2); text-align: center; }
    .td-stat .val { font-size: var(--font-size-lg); font-weight: 700; font-family: var(--font-mono); }
    .td-stat .lbl { font-size: var(--font-size-xs); color: var(--color-text-secondary); margin-top: 2px; }
    .td-total-row { display: flex; justify-content: space-between; align-items: center; padding: var(--space-1) 0; border-bottom: 1px solid var(--color-border); font-family: var(--font-mono); }
    .td-total-row:last-child { border-bottom: none; }
    .td-total-row .lbl { font-size: var(--font-size-sm); color: var(--color-text-secondary); }
    .td-total-row .val { font-weight: 600; }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">日期时间计算器</h1>
    <p class="tool-desc" data-i18n="desc">精确计算两个日期之间的差值，包括年、月、日、时、分、秒。</p>
    <div class="card">
      <div class="td-row">
        <div class="td-field">
          <label data-i18n="startDateTime">开始日期/时间</label>
          <input id="d1" class="input js-focus-input" type="datetime-local">
        </div>
        <div class="td-field">
          <label data-i18n="endDateTime">结束日期/时间</label>
          <input id="d2" class="input" type="datetime-local">
        </div>
      </div>
      <div>
        <button id="calcBtn" class="btn btn-primary" data-i18n="calculate">计算</button>
      </div>
    </div>
    <div class="card" id="resultCard" style="display:none;">
      <div class="td-stats">
        <div class="td-stat"><div class="val" id="vYears">0</div><div class="lbl" data-i18n="yearsLabel">年</div></div>
        <div class="td-stat"><div class="val" id="vMonths">0</div><div class="lbl" data-i18n="monthsLabel">月</div></div>
        <div class="td-stat"><div class="val" id="vDays">0</div><div class="lbl" data-i18n="daysLabel">天</div></div>
        <div class="td-stat"><div class="val" id="vHours">0</div><div class="lbl" data-i18n="hoursLabel">小时</div></div>
        <div class="td-stat"><div class="val" id="vMinutes">0</div><div class="lbl" id="minutesLbl" data-i18n="ui.100">分钟</div></div>
        <div class="td-stat"><div class="val" id="vSeconds">0</div><div class="lbl" data-i18n="secondsLabel">秒</div></div>
      </div>
      <div id="totalRows"></div>
    </div>
    <div class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="common.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>
    (function () {
      var d1El = document.getElementById('d1');
      var d2El = document.getElementById('d2');
      var resultCard = document.getElementById('resultCard');
      var outputEl = document.getElementById('outputText');
      var copyBtn = document.getElementById('copyBtn');

      document.getElementById('minutesLbl').textContent = t('minutesLabel', '分钟');
      document.getElementById('calcBtn').textContent = t('calculate', '计算');

      function toLocalInput(d) {
        var pad = function (n) { return (n < 10 ? '0' : '') + n; };
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      }

      var now = new Date();
      d1El.value = toLocalInput(new Date(now.getTime() - 365 * 86400000));
      d2El.value = toLocalInput(now);

      function calcTimeDiff(s1, s2) {
        var d1 = new Date(s1);
        var d2 = new Date(s2);
        if (isNaN(d1.getTime())) return { error: t('invalidStart', '无效的开始日期') };
        if (isNaN(d2.getTime())) return { error: t('invalidEnd', '无效的结束日期') };

        var start, end;
        if (d1 <= d2) { start = d1; end = d2; } else { start = d2; end = d1; }
        var totalMs = end.getTime() - start.getTime();
        var totalSeconds = Math.floor(totalMs / 1000);
        var totalHours = Math.floor(totalMs / 3600000);
        var totalDays = Math.floor(totalMs / 86400000);

        var y = end.getFullYear() - start.getFullYear();
        var mo = end.getMonth() - start.getMonth();
        var d = end.getDate() - start.getDate();
        var h = end.getHours() - start.getHours();
        var mi = end.getMinutes() - start.getMinutes();
        var s = end.getSeconds() - start.getSeconds();

        if (s < 0) { s += 60; mi--; }
        if (mi < 0) { mi += 60; h--; }
        if (h < 0) { h += 24; d--; }
        if (d < 0) {
          mo--;
          var daysInPrevMonth = new Date(end.getFullYear(), end.getMonth(), 0).getDate();
          d += daysInPrevMonth;
        }
        if (mo < 0) { mo += 12; y--; }

        return {
          result: {
            years: y, months: mo, days: d, hours: h, minutes: mi, seconds: s,
            totalDays: totalDays, totalHours: totalHours, totalSeconds: totalSeconds
          }
        };
      }

      function render(r) {
        document.getElementById('vYears').textContent = r.years;
        document.getElementById('vMonths').textContent = r.months;
        document.getElementById('vDays').textContent = r.days;
        document.getElementById('vHours').textContent = r.hours;
        document.getElementById('vMinutes').textContent = r.minutes;
        document.getElementById('vSeconds').textContent = r.seconds;

        var totals = [
          { lbl: t('totalDays', '总天数'), val: r.totalDays.toLocaleString() },
          { lbl: t('totalHours', '总小时数'), val: r.totalHours.toLocaleString() },
          { lbl: t('totalSeconds', '总秒数'), val: r.totalSeconds.toLocaleString() }
        ];
        var box = document.getElementById('totalRows');
        box.innerHTML = '';
        var i, row, lbl, val;
        for (i = 0; i < totals.length; i++) {
          row = document.createElement('div');
          row.className = 'td-total-row';
          lbl = document.createElement('span');
          lbl.className = 'lbl';
          lbl.textContent = totals[i].lbl;
          val = document.createElement('span');
          val.className = 'val';
          val.textContent = totals[i].val;
          row.appendChild(lbl);
          row.appendChild(val);
          box.appendChild(row);
        }
        outputEl.textContent =
          r.years + ' ' + t('yearsLabel', '年') + ' ' + r.months + ' ' + t('monthsLabel', '月') + ' ' + r.days + ' ' + t('daysLabel', '天') + ' ' +
          r.hours + ' ' + t('hoursLabel', '小时') + ' ' + r.minutes + ' ' + t('minutesLabel', '分钟') + ' ' + r.seconds + ' ' + t('secondsLabel', '秒') +
          ' | ' + t('totalDays', '总天数') + ': ' + r.totalDays.toLocaleString() +
          ' | ' + t('totalHours', '总小时数') + ': ' + r.totalHours.toLocaleString() +
          ' | ' + t('totalSeconds', '总秒数') + ': ' + r.totalSeconds.toLocaleString();
        resultCard.style.display = '';
      }

      function calc() {
        if (!d1El.value || !d2El.value) { setStatus(t('emptyInput', '请选择两个日期时间'), 'error'); return; }
        var res = calcTimeDiff(d1El.value, d2El.value);
        if (res.error) { setStatus(res.error, 'error'); return; }
        render(res.result);
        setStatus(t('done', '计算完成'));
      }

      document.getElementById('calcBtn').addEventListener('click', calc);

      copyBtn.addEventListener('click', function () {
        if (outputEl.textContent) {
          copyToClipboard(outputEl.textContent, copyBtn);
          setStatus(t('common.copied', '已复制'));
        }
      });
    })();
  </script>
</body>
</html>
