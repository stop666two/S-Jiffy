<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TSV · CSV · JSON - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css">
<style>
.format-opt{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:var(--space-3);}
.format-opt label{font-size:var(--font-size-sm);color:var(--color-text-secondary);}
.output-format{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:var(--space-2);}
.output-format label{font-size:var(--font-size-sm);display:flex;align-items:center;gap:4px;cursor:pointer;}
</style></head>
<body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
<main class="tool-workspace"><h1 data-i18n="h1">TSV 转换器</h1><p class="tool-desc" data-i18n="desc">在制表符分隔（TSV）、逗号分隔（CSV）和 JSON 格式之间互相转换。</p>
<div class="card"><textarea id="inputText" class="input textarea js-focus-input" data-i18n-placeholder="ui.104" placeholder="粘贴 TSV、CSV 或 JSON 数据..." style="min-height:150px;"></textarea></div>
<div class="format-opt">
<label data-i18n="ui.1">输入格式</label>
<select id="inFormat" class="input" style="width:auto;"><option value="auto" data-i18n="ui.2">自动检测</option><option value="tsv">TSV</option><option value="csv">CSV</option><option value="json">JSON</option></select>
</div>
<div class="output-format"><label><input type="radio" name="outFmt" value="tsv" checked> TSV</label><label><input type="radio" name="outFmt" value="csv"> CSV</label><label><input type="radio" name="outFmt" value="json"> JSON</label><label><input type="radio" name="outFmt" value="markdown"> Markdown</label></div>
<div style="display:flex;gap:12px;margin-bottom:var(--space-3);flex-wrap:wrap;">
<button id="convertBtn" class="btn btn-primary" data-i18n="ui.convert">转换</button>
<button id="clearBtn" class="btn btn-secondary" data-i18n="ui.clear">清空</button>
</div>
<div class="output-box"><span id="outputText" style="display:block;padding-right:60px;"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div></main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
<script>
(function(){var i=document.getElementById('inputText'),o=document.getElementById('outputText'),inf=document.getElementById('inFormat');

function parseLine(l,delim){var parts=[],cur='',inq=false;for(var c=0;c<l.length;c++){var ch=l[c];
if(ch==='"'){inq=!inq;}else if(ch===delim&&!inq){parts.push(cur.trim());cur='';}else{cur+=ch;}}
parts.push(cur.trim());return parts;}

function detectDelim(t){var tab=(t.match(/\t/g)||[]).length;var com=(t.match(/,/g)||[]).length;return tab>com?'\t':',';}

function parseTable(t,delim){var lines=t.split('\n').filter(function(l){return l.trim();});
var rows=[];for(var r=0;r<lines.length;r++)rows.push(parseLine(lines[r],delim));
return rows;}

function toTSV(rows){return rows.map(function(r){return r.map(function(c){return c.indexOf('\t')>=0?'"'+c+'"':c;}).join('\t');}).join('\n');}
function toCSV(rows){return rows.map(function(r){return r.map(function(c){return c.indexOf(',')>=0?'"'+c+'"':c;}).join(',');}).join('\n');}
function toJSON(rows){if(rows.length<1)return'[]';var headers=rows[0];var out=[];for(var r=1;r<rows.length;r++){var obj={};for(var c=0;c<headers.length&&c<rows[r].length;c++){var val=rows[r][c];var num=parseFloat(val);obj[headers[c]]=!isNaN(num)&&val.trim()!==''?num:val;}
out.push(obj);}return JSON.stringify(out,null,2);}
function toMarkdown(rows){if(rows.length<1)return'';var out='| '+rows[0].join(' | ')+' |\n| '+rows[0].map(function(){return'---';}).join(' | ')+' |\n';
for(var r=1;r<rows.length;r++){out+='| '+rows[r].join(' | ')+' |\n';}return out;}

function convert(){var t=i.value.trim();if(!t){setStatus(t('ui.100','请输入数据'),'error');return;}
var delim;if(inf.value==='auto'){delim=detectDelim(t);}else{delim=inf.value==='tsv'?'\t':',';}
var rows;if(inf.value==='json'||(inf.value==='auto'&&t.trim().startsWith('['))){try{var arr=JSON.parse(t.trim());if(!Array.isArray(arr)||arr.length===0){setStatus(t('ui.101','JSON 必须是数组'),'error');return;}
var headers=Object.keys(arr[0]);rows=[headers];for(var r=0;r<arr.length;r++){var rw=[];for(var h=0;h<headers.length;h++){rw.push(arr[r][headers[h]]!==undefined?String(arr[r][headers[h]]):'');}
rows.push(rw);}}catch(e){setStatus(t('ui.102','无效 JSON'),'error');return;}}else{rows=parseTable(t,delim);}
if(rows.length<2){setStatus(t('ui.103','需要表头和数据行'),'error');return;}
var fmt=document.querySelector('input[name="outFmt"]:checked').value;
var result='';switch(fmt){case'tsv':result=toTSV(rows);break;case'csv':result=toCSV(rows);break;case'json':result=toJSON(rows);break;case'markdown':result=toMarkdown(rows);break;}
o.textContent=result;setStatus(t('ui.converted','已转换 ') +(rows.length-1)+ t('ui.rows',' 行'));}

document.getElementById('convertBtn').addEventListener('click',convert);
document.getElementById('clearBtn').addEventListener('click',function(){i.value='';o.textContent='';setStatus('');i.focus();});
document.getElementById('copyBtn').addEventListener('click',function(){if(o.textContent){copyToClipboard(o.textContent,this);setStatus(t('ui.copied','已复制'));}});
})();
</script></body></html>
