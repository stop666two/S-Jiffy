<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeScript 速查卡 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .ts-controls { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; margin-bottom: var(--space-2); }
    .ts-controls input { width: 240px; }
    .ts-cats { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-bottom: var(--space-2); }
    .ts-cat-btn { padding: 4px 12px; border: 1px solid var(--color-border); border-radius: 999px; font-size: var(--font-size-sm); cursor: pointer; background: var(--color-bg); color: var(--color-text-secondary); }
    .ts-cat-btn.on { background: var(--color-accent); color: #fff; border-color: var(--color-accent); }
    .ts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
    @media (max-width: 720px) { .ts-grid { grid-template-columns: 1fr; } }
    .ts-item { border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-2); cursor: pointer; }
    .ts-item:hover { border-color: var(--color-accent); box-shadow: var(--shadow-focus); }
    .ts-item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-1); gap: var(--space-1); }
    .ts-name { font-weight: 600; font-size: var(--font-size-sm); }
    .ts-cat { font-size: var(--font-size-xs); color: var(--color-text-secondary); background: var(--color-bg-soft); padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
    .ts-syntax { font-family: var(--font-mono); font-size: var(--font-size-xs); background: var(--color-bg-soft); border-radius: var(--radius-sm); padding: 4px 8px; margin-bottom: 4px; white-space: pre-wrap; word-break: break-all; }
    .ts-example { font-family: var(--font-mono); font-size: var(--font-size-xs); background: var(--color-bg-soft); border-radius: var(--radius-sm); padding: 4px 8px; white-space: pre-wrap; word-break: break-all; }
    .ts-empty { color: var(--color-text-secondary); font-size: var(--font-size-sm); padding: var(--space-2) 0; }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <a href="../../index.html" class="back-btn">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1>TypeScript 速查卡</h1>
    <p class="tool-desc">TS 常用类型语法与示例，支持分类过滤与搜索，点击条目复制。</p>
    <div class="card">
      <div class="ts-controls">
        <input id="searchInput" type="text" class="input js-focus-input" placeholder="搜索类型或关键词...">
      </div>
      <div class="ts-cats" id="catBar"></div>
      <div class="ts-grid" id="tsGrid"></div>
    </div>
    <div id="resultBox" class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div>S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script>
  (function () {
    var searchInput = document.getElementById('searchInput');
    var catBar = document.getElementById('catBar');
    var tsGrid = document.getElementById('tsGrid');
    var outputText = document.getElementById('outputText');
    var copyBtn = document.getElementById('copyBtn');
    var currentCat = '全部';
    var lastCopy = '';

    var items = [
      { cat: '基础类型', name: '基础类型', syntax: 'let n: number = 1;\nlet s: string = "hi";\nlet b: boolean = true;', example: 'let age: number = 30;\nlet name: string = "Tom";\nlet done: boolean = false;' },
      { cat: '基础类型', name: '数组与元组', syntax: 'let arr: number[];\nlet tup: [string, number];', example: 'const list: number[] = [1, 2, 3];\nconst tup: [string, number] = ["a", 1];' },
      { cat: '基础类型', name: '联合与字面量', syntax: 'type T = "a" | "b";\nlet v: number | string;', example: 'type Direction = "up" | "down";\nconst d: Direction = "up";' },
      { cat: '基础类型', name: 'any / unknown / never', syntax: 'let a: any;\nlet u: unknown;\nfunction f(): never {}', example: 'const u: unknown = 42;\nif (typeof u === "number") { console.log(u + 1); }' },
      { cat: '接口', name: '接口定义', syntax: 'interface User {\n  id: number;\n  name: string;\n}', example: 'interface User { id: number; name: string }\nconst u: User = { id: 1, name: "Tom" };' },
      { cat: '接口', name: '可选与只读属性', syntax: 'interface T {\n  a?: string;\n  readonly b: number;\n}', example: 'interface Config { timeout?: number; readonly url: string }\nconst c: Config = { url: "https://x.com" };' },
      { cat: '接口', name: '接口继承', syntax: 'interface A extends B {}', example: 'interface Animal { eat(): void }\ninterface Dog extends Animal { bark(): void }' },
      { cat: '类型别名', name: '类型别名', syntax: 'type Name = string;\ntype Pair = [number, number];', example: 'type ID = number | string;\nconst uid: ID = "abc123";' },
      { cat: '泛型', name: '泛型函数', syntax: 'function f<T>(x: T): T {\n  return x;\n}', example: 'function identity<T>(x: T): T { return x; }\nidentity<number>(5);' },
      { cat: '泛型', name: '泛型约束', syntax: 'function f<T extends U>(x: T) {}', example: 'function getLen<T extends { length: number }>(x: T): number {\n  return x.length;\n}' },
      { cat: '枚举', name: '数字枚举', syntax: 'enum Color {\n  Red,\n  Green,\n}', example: 'enum Color { Red, Green, Blue }\nconst c: Color = Color.Green; // 1' },
      { cat: '枚举', name: '字符串枚举', syntax: 'enum E {\n  A = "a",\n  B = "b",\n}', example: 'enum HttpMethod { GET = "GET", POST = "POST" }\nHttpMethod.GET; // "GET"' },
      { cat: '函数类型', name: '函数类型标注', syntax: 'type Fn = (a: number) => string;', example: 'const double: (n: number) => number = (n) => n * 2;' },
      { cat: '函数类型', name: '可选参数与默认值', syntax: 'function f(a: number, b?: string) {}', example: 'function greet(name: string, prefix = "Hi"): string {\n  return prefix + " " + name;\n}' },
      { cat: '函数类型', name: '函数重载', syntax: 'function f(a: number): number;\nfunction f(a: string): string;', example: 'function pick(x: number): number;\nfunction pick(x: string): string;\nfunction pick(x: any): any { return x; }' },
      { cat: '类', name: '类与访问修饰符', syntax: 'class A {\n  private x: number;\n  protected y: string;\n  public z: boolean;\n}', example: 'class Animal {\n  constructor(public name: string) {}\n  speak(): void { console.log(this.name); }\n}' },
      { cat: '类', name: '抽象类', syntax: 'abstract class A {\n  abstract f(): void;\n}', example: 'abstract class Shape {\n  abstract area(): number;\n}\nclass Circle extends Shape {\n  area() { return 3.14; }\n}' },
      { cat: '装饰器', name: '类装饰器', syntax: '@decorator\nclass A {}', example: 'function sealed(target: Function) {}\n@sealed\nclass ApiService {}' },
      { cat: '工具类型', name: 'Partial / Required', syntax: 'Partial<T>  // 全部可选\nRequired<T> // 全部必选', example: 'interface User { id: number; name: string }\nconst u: Partial<User> = { name: "Tom" };' },
      { cat: '工具类型', name: 'Pick / Omit', syntax: 'Pick<T, K>    // 选取键\nOmit<T, K>    // 排除键', example: 'interface User { id: number; name: string; age: number }\ntype Brief = Pick<User, "id" | "name">;' },
      { cat: '工具类型', name: 'Record / Readonly', syntax: 'Record<K, V>    // 键值映射\nReadonly<T>    // 全部只读', example: 'const map: Record<string, number> = { a: 1 };\nconst r: Readonly<User> = { id: 1 };' },
      { cat: '工具类型', name: 'NonNullable / ReturnType', syntax: 'NonNullable<T>     // 去 null/undefined\nReturnType<F>     // 函数返回类型', example: 'type A = NonNullable<string | null>; // string\ntype R = ReturnType<() => number>;    // number' },
      { cat: '键操作', name: 'keyof / typeof', syntax: 'type K = keyof T;\ntype V = typeof obj;', example: 'interface P { x: number; y: number }\ntype K = keyof P; // "x" | "y"' },
      { cat: '映射类型', name: '映射类型', syntax: 'type M<T> = {\n  [K in keyof T]: T[K];\n};', example: 'type Mutable<T> = { -readonly [K in keyof T]: T[K] };\ntype Getters<T> = { [K in keyof T as `get${Capitalize<K & string>}`]: () => T[K] };' },
      { cat: '条件类型', name: '条件类型', syntax: 'type R = T extends U ? X : Y;', example: 'type IsString<T> = T extends string ? true : false;\ntype A = IsString<"a">; // true' },
      { cat: '条件类型', name: 'infer 推导', syntax: 'type R = T extends (infer U)[] ? U : never;', example: 'type Elem<T> = T extends (infer U)[] ? U : never;\ntype E = Elem<number[]>; // number' }
    ];

    var cats = ['全部', '基础类型', '接口', '类型别名', '泛型', '枚举', '函数类型', '类', '装饰器', '工具类型', '键操作', '映射类型', '条件类型'];

    function buildCats() {
      var html = '';
      for (var i = 0; i < cats.length; i++) {
        html += '<button class="ts-cat-btn' + (cats[i] === currentCat ? ' on' : '') + '" data-cat="' + cats[i] + '">' + htmlEscape(cats[i]) + '</button>';
      }
      catBar.innerHTML = html;
      var btns = catBar.querySelectorAll('.ts-cat-btn');
      for (var j = 0; j < btns.length; j++) {
        btns[j].onclick = (function (cat) {
          return function () { currentCat = cat; buildCats(); render(); };
        })(cats[j]);
      }
    }

    function render() {
      var q = searchInput.value.toLowerCase();
      var filtered = [];
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (currentCat !== '全部' && it.cat !== currentCat) { continue; }
        if (q && it.name.toLowerCase().indexOf(q) === -1 && it.syntax.toLowerCase().indexOf(q) === -1) { continue; }
        filtered.push(it);
      }
      if (!filtered.length) {
        tsGrid.innerHTML = '<div class="ts-empty">没有匹配的条目</div>';
        return;
      }
      var html = '';
      for (var k = 0; k < filtered.length; k++) {
        var f = filtered[k];
        html += '<div class="ts-item" data-idx="' + k + '">';
        html += '<div class="ts-item-head"><span class="ts-name">' + htmlEscape(f.name) + '</span><span class="ts-cat">' + htmlEscape(f.cat) + '</span></div>';
        html += '<div class="ts-syntax">' + htmlEscape(f.syntax) + '</div>';
        html += '<div class="ts-example">' + htmlEscape(f.example) + '</div>';
        html += '</div>';
      }
      tsGrid.innerHTML = html;
      var cards = tsGrid.querySelectorAll('.ts-item');
      for (var m = 0; m < cards.length; m++) {
        cards[m].onclick = (function (idx) {
          return function () {
            var it = filtered[idx];
            lastCopy = it.example;
            outputText.innerHTML = '<div style="font-size:var(--font-size-sm);margin-bottom:var(--space-1);"><b>' + htmlEscape(it.name) + '</b> · ' + htmlEscape(it.cat) + '</div><div style="font-family:var(--font-mono);font-size:var(--font-size-sm);white-space:pre-wrap;">' + htmlEscape(it.example) + '</div>';
            copyBtn.onclick = function () { copyToClipboard(lastCopy, copyBtn); };
            setStatus('已选中「' + it.name + '」，点击复制按钮可复制示例');
          };
        })(m);
      }
    }

    searchInput.addEventListener('input', render);
    buildCats();
    render();
  })();
  </script>
</body>
</html>
