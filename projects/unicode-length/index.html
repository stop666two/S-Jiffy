<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unicode 长度计算器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .ul-metrics{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-bottom:var(--space-2)}
    .ul-metric{flex:1 1 130px;background:var(--color-bg-soft);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-2);text-align:center}
    .ul-metric .num{font-size:var(--font-size-xl);font-weight:600}
    .ul-metric .lbl{font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-top:4px}
    .ul-note{font-size:var(--font-size-sm);color:var(--color-text-secondary);margin-bottom:var(--space-2);line-height:1.8}
    .ul-note .bad{color:var(--color-error)}
    .ul-tbl{width:100%;border-collapse:collapse;font-size:var(--font-size-xs);margin-top:var(--space-1)}
    .ul-tbl th,.ul-tbl td{border:1px solid var(--color-border);padding:5px 9px;text-align:left;vertical-align:top}
    .ul-tbl th{background:var(--color-bg-soft);font-weight:600;color:var(--color-text-secondary);white-space:nowrap}
    .ul-tbl td:nth-child(2){font-family:var(--font-mono)}
    .ul-tbl .hl{color:var(--color-error)}
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">Unicode 长度计算器</h1>
    <p class="tool-desc" data-i18n="desc">统计文本的码点数、UTF-16 长度、UTF-8 字节数，并逐字符分析代理对与组合字符。</p>
    <div class="card">
      <textarea id="inputText" class="input textarea js-focus-input" data-i18n-placeholder="ui.100" placeholder="输入文本，实时分析 Unicode 长度..." style="min-height:120px;"></textarea>
    </div>
    <div id="resultBox" class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script></script>
  <script>
    (function () {
      var inputEl = document.getElementById('inputText');
      var outputEl = document.getElementById('outputText');
      var copyBtn = document.getElementById('copyBtn');
      var lastPlain = '';

      function utf8Len(code) {
        if (code <= 0x7F) return 1;
        if (code <= 0x7FF) return 2;
        if (code <= 0xFFFF) return 3;
        return 4;
      }

      function isCombining(code) {
        return (code >= 0x0300 && code <= 0x036F) || (code >= 0x1AB0 && code <= 0x1AFF) ||
          (code >= 0x1DC0 && code <= 0x1DFF) || (code >= 0x20D0 && code <= 0x20FF) ||
          (code >= 0xFE20 && code <= 0xFE2F);
      }

      function isVisible(code) {
        return (code >= 0x20 && code !== 0x7F) || code === 0x0A || code === 0x0D;
      }

      function hex4(code) {
        var h = code.toString(16).toUpperCase();
        while (h.length < 4) h = '0' + h;
        return h;
      }

      function render() {
        var text = inputEl.value;
        if (!text) {
          outputEl.innerHTML = '';
          lastPlain = '';
          setStatus('');
          return;
        }
        var chars = [];
        var surrogateCount = 0;
        var surrogateChars = [];
        var combiningCount = 0;
        for (var i = 0; i < text.length; i++) {
          var code = text.charCodeAt(i);
          var isPair = false;
          if (code >= 0xD800 && code <= 0xDBFF && i + 1 < text.length) {
            var low = text.charCodeAt(i + 1);
            if (low >= 0xDC00 && low <= 0xDFFF) {
              code = 0x10000 + ((code - 0xD800) << 10) + (low - 0xDC00);
              isPair = true;
              i++;
            }
          }
          var tag = isPair ? '代理对' : (isCombining(code) ? '组合标记' : '');
          if (isPair) {
            surrogateCount++;
            surrogateChars.push(text.slice(i - 1, i + 1));
          }
          if (isCombining(code)) combiningCount++;
          chars.push({ cp: code, ch: text.slice(i - (isPair ? 1 : 0), i + 1), tag: tag });
        }
        var metrics = [
          { num: chars.length, lbl: '字符数（码点）' },
          { num: text.length, lbl: 'UTF-16 长度' },
          { num: 0, lbl: 'UTF-8 字节数' }
        ];
        var totalBytes = 0;
        for (var j = 0; j < chars.length; j++) {
          totalBytes += utf8Len(chars[j].cp);
        }
        metrics[2].num = totalBytes;
        var html = [];
        html.push('<div class="ul-metrics">');
        for (var m = 0; m < metrics.length; m++) {
          html.push('<div class="ul-metric"><div class="num">' + metrics[m].num + '</div><div class="lbl">' + htmlEscape(metrics[m].lbl) + '</div></div>');
        }
        html.push('</div>');
        html.push('<div class="ul-note">');
        if (surrogateCount > 0) {
          var shown = [];
          for (var s = 0; s < surrogateChars.length; s++) {
            if (shown.indexOf(surrogateChars[s]) === -1 && shown.length < 12) shown.push(surrogateChars[s]);
          }
          html.push('<span class="bad">包含 ' + surrogateCount + ' 个代理对字符（emoji 等）</span>：' + htmlEscape(shown.join(' ')) + (surrogateChars.length > shown.length ? '…' : '') + '<br>');
        } else {
          html.push('不含代理对字符（无 emoji 等超出 BMP 的字符）。<br>');
        }
        if (combiningCount > 0) {
          html.push('<span class="bad">包含 ' + combiningCount + ' 个组合标记</span>，与前面的字符组合显示为一个字形（grapheme cluster），按码点统计会多于视觉字符数。<br>');
        } else {
          html.push(t('ui.4','不含组合标记，码点数与视觉字符数一致。'));
        }
        html.push('</div>');
        html.push('<div style="overflow-x:auto;"><table class="ul-tbl"><thead><tr><th>#</th><th>字符</th><th>码点</th><th>UTF-8 字节数</th><th>说明</th></tr></thead><tbody>');
        for (var k = 0; k < chars.length; k++) {
          var c = chars[k];
          var display = isVisible(c.cp) ? htmlEscape(c.ch) : '<span class="ul-tbl">U+' + hex4(c.cp) + '</span>';
          html.push('<tr><td>' + (k + 1) + '</td><td>' + display + '</td><td>U+' + hex4(c.cp) + '</td><td>' + utf8Len(c.cp) + '</td><td>' + (c.tag ? '<span class="hl">' + htmlEscape(c.tag) + '</span>' : '') + '</td></tr>');
        }
        html.push('</tbody></table></div>');
        outputEl.innerHTML = html.join('');
        lastPlain = t('ui.3','码点数：') + chars.length + '\nUTF-16 长度：' + text.length + '\nUTF-8 字节数：' + totalBytes +
          '\n代理对字符：' + surrogateCount + '\n组合标记：' + combiningCount;
        setStatus(t('ui.2','已分析 ') + chars.length + t('ui.1',' 个码点'));
      }

      inputEl.addEventListener('input', render);
      copyBtn.addEventListener('click', function () {
        if (lastPlain) copyToClipboard(lastPlain, copyBtn);
      });
    })();
  </script>
</body>
</html>
