<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL 编码/解码 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .url-part-grid { display:grid; gap:var(--space-2); }
    .url-part-row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:6px 0; border-bottom:1px solid var(--color-border); }
    .url-part-row:last-child { border-bottom:none; }
    .url-part-label { font-size:var(--font-size-sm); color:var(--color-text-secondary); min-width:72px; font-family:var(--font-mono); }
    .url-part-value { font-family:var(--font-mono); font-size:var(--font-size-base); word-break:break-all; }
    .query-table { width:100%; border-collapse:collapse; font-family:var(--font-mono); font-size:13px; }
    .query-table th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--color-border); color:var(--color-text-secondary); font-weight:500; }
    .query-table td { padding:6px 8px; border-bottom:1px solid var(--color-border); word-break:break-all; }
    .mode-radio { display:flex; gap:12px; align-items:center; margin-bottom:12px; font-size:var(--font-size-sm); }
    .mode-radio label { display:flex; align-items:center; gap:4px; cursor:pointer; }
  </style>
</head>
<body>
  <header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">URL 编解码</h1>
    <p class="tool-desc" data-i18n="desc">URL 编码/解码：标准编码、RFC 3986、表单编码，以及 URL 解析与查询参数提取。</p>
    <div class="card">
      <div class="mode-radio">
        <label><input type="radio" name="urlMode" value="standard" checked> 标准（encodeURIComponent）</label>
        <label><input type="radio" name="urlMode" value="rfc3986"> RFC 3986</label>
        <label><input type="radio" name="urlMode" value="form"> 表单编码</label>
      </div>
      <textarea id="inputText" class="input textarea js-focus-input" data-i18n-placeholder="ui.104" placeholder="输入链接或文本..." style="min-height:120px;"></textarea>
    </div>
    <div class="action-bar" style="display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap;">
      <button id="encodeBtn" class="btn btn-primary" data-i18n="ui.encode">编码</button>
      <button id="decodeBtn" class="btn btn-secondary" data-i18n="ui.decode">解码</button>
      <button id="parseBtn" class="btn btn-secondary" data-i18n="ui.1">解析 URL</button>
      <button id="clearBtn" class="btn btn-secondary" data-i18n="ui.clear">清空</button>
    </div>
    <div id="parse结果" style="display:none;">
      <div class="card"><div class="url-part-grid" id="urlParts"></div></div>
      <div class="card" id="queryCard" style="display:none;"><table class="query-table"><thead><tr><th data-i18n="ui.2">参数</th><th data-i18n="ui.3">值</th></tr></thead><tbody id="queryBody"></tbody></table></div>
    </div>
    <div class="output-box" id="输出Container"><span id="outputText" style="display:block; padding-right:60px;"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
  </main>
  <footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script></script>
  <script>
    (function () {
      var i = document.getElementById('inputText'), o = document.getElementById('outputText');
      var parse结果 = document.getElementById(t('ui.10','parse结果')), urlParts = document.getElementById('urlParts');
      var queryCard = document.getElementById('queryCard'), queryBody = document.getElementById('queryBody');

      function getMode() {
        var radios = document.getElementsByName('urlMode');
        for (var j = 0; j < radios.length; j++) { if (radios[j].checked) return radios[j].value; }
        return 'standard';
      }

      function rfc3986Encode(str) {
        return encodeURIComponent(str).replace(/[!'()*]/g, function(c) {
          return '%' + c.charCodeAt(0).toString(16).toUpperCase();
        });
      }
      function formEncode(str) {
        return encodeURIComponent(str).replace(/%20/g, '+');
      }
      function formDecode(str) {
        return decodeURIComponent(str.replace(/\+/g, ' '));
      }

      function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

      document.getElementById('encodeBtn').addEventListener('click', function () {
        parse结果.style.display = 'none';
        var mode = getMode();
        try {
          if (mode === 'rfc3986') o.textContent = rfc3986Encode(i.value);
          else if (mode === 'form') o.textContent = formEncode(i.value);
          else o.textContent = encodeURIComponent(i.value);
          setStatus('');
        } catch (e) { setStatus(t('ui.100','编码错误'), 'error'); }
      });
      document.getElementById('decodeBtn').addEventListener('click', function () {
        parse结果.style.display = 'none';
        var mode = getMode();
        try {
          if (mode === 'form') o.textContent = formDecode(i.value);
          else o.textContent = decodeURIComponent(i.value);
          setStatus('');
        } catch (e) { o.textContent = ''; setStatus(t('ui.101','解码失败'), 'error'); }
      });
      document.getElementById('parseBtn').addEventListener('click', function () {
        var val = i.value.trim();
        if (!val) { setStatus(t('ui.102','请输入链接'), 'error'); return; }
        parse结果.style.display = 'block';
        try {
          var url = new URL(val);
          var parts = [
            { label: t('ui.9','协议'), value: url.protocol }, { label: t('ui.8','主机'), value: url.host },
            { label: t('ui.7','主机名'), value: url.hostname }, { label: t('ui.6','端口'), value: url.port || '（默认）' },
            { label: t('ui.5','路径'), value: url.pathname }, { label: t('ui.query','查询'), value: url.search || '（无）' },
            { label: t('ui.4','哈希'), value: url.hash || '（无）' }
          ];
          urlParts.innerHTML = parts.map(function(p) {
            return '<div class="url-part-row"><span class="url-part-label">' + escapeHtml(p.label) + '</span><span class="url-part-value">' + escapeHtml(p.value) + '</span></div>';
          }).join('');
          if (url.search) {
            queryCard.style.display = 'block';
            queryBody.innerHTML = '';
            url.searchParams.forEach(function(v, k) {
              queryBody.innerHTML += '<tr><td>' + escapeHtml(k) + '</td><td>' + escapeHtml(v) + '</td></tr>';
            });
          } else { queryCard.style.display = 'none'; }
          o.textContent = val;
          setStatus('');
        } catch (e) {
          urlParts.innerHTML = '<div style="color:var(--color-error);font-size:var(--font-size-sm);">链接无效</div>';
          queryCard.style.display = 'none';
          setStatus(t('ui.103','链接无效'), 'error');
        }
      });
      document.getElementById('clearBtn').addEventListener('click', function () { i.value = ''; o.textContent = ''; parse结果.style.display = 'none'; setStatus(''); i.focus(); });
      document.getElementById('copyBtn').addEventListener('click', function () { if (o.textContent) { copyToClipboard(o.textContent, this); setStatus(t('ui.copied','已复制')); } });
    })();
  </script>
</body>
</html>
