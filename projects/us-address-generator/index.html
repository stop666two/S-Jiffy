<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美国地址生成器 - S-Jiffy</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<link rel="stylesheet" href="../../assets/css/global.css">
<style>
.gen-controls { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:var(--space-3); }
.gen-controls .state-wrap { flex:1; min-width:220px; }
.gen-controls select { width:100%; height:48px; padding:0 var(--space-2); font-size:var(--font-size-base); border:1px solid #DDDDDD; border-radius:var(--radius-md); background:var(--color-bg); font-family:var(--font-mono); }
.addr-head { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid var(--color-border); font-size:var(--font-size-xs); color:var(--color-text-secondary); text-transform:uppercase; letter-spacing:0.5px; }
.addr-row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:11px 14px; border-bottom:1px solid var(--color-border); cursor:pointer; transition:background 0.15s; }
.addr-row:last-child { border-bottom:none; }
.addr-row:hover { background:var(--color-bg-soft); }
.addr-row .k { font-size:var(--font-size-sm); color:var(--color-text-secondary); display:flex; align-items:center; gap:6px; }
.addr-row .v { font-size:var(--font-size-sm); font-family:var(--font-mono); text-align:right; word-break:break-all; display:flex; align-items:center; gap:8px; }
.badge { font-size:10px; font-weight:700; color:var(--color-success); background:rgba(52,101,56,0.08); border:1px solid rgba(52,101,56,0.25); padding:2px 8px; border-radius:9999px; }
.toast { display:inline-flex; align-items:center; gap:6px; font-size:var(--font-size-xs); color:var(--color-success); background:rgba(52,101,56,0.08); border:1px solid rgba(52,101,56,0.25); padding:6px 12px; border-radius:var(--radius-md); margin-top:var(--space-2); }
.map-link { margin-top:var(--space-2); }
</style>
</head>
<body>
<header class="global-header">
  <a href="../../index.html" class="logo">S-Jiffy</a>
  <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a>
</header>
<main class="tool-workspace">
  <h1 data-i18n="h1">美国地址生成器</h1>
  <p class="tool-desc" data-i18n="desc">随机生成逼真的美国地址（姓名、电话、街道、城市、州、邮编），免税州清晰标注。</p>
  <div class="card">
    <div class="gen-controls">
      <div class="state-wrap">
        <label class="input-label" data-i18n="usAddrSelectState">选择州</label>
        <select id="stateSelect"></select>
      </div>
      <button id="generateBtn" class="btn btn-primary" data-i18n="usAddrGenerate">生成地址</button>
      <button id="copyAllBtn" class="btn btn-secondary" data-i18n="usAddrCopyAll">复制全部</button>
    </div>
    <div id="toastBox"></div>
    <div id="addrCard" style="border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden;margin-top:var(--space-2);">
      <div class="addr-head">
        <span data-i18n="usAddrGeneratedInfo">生成的地址信息</span>
        <span class="badge" id="taxBadge" style="display:none;" data-i18n="usAddrTaxFree">免税州</span>
      </div>
      <div class="addr-row" data-field="name">
        <span class="k" data-i18n="usAddrName">姓名</span><span class="v" id="fName">-</span>
      </div>
      <div class="addr-row" data-field="gender">
        <span class="k" data-i18n="usAddrGender">性别</span><span class="v" id="fGender">-</span>
      </div>
      <div class="addr-row" data-field="phone">
        <span class="k" data-i18n="usAddrPhone">电话</span><span class="v" id="fPhone">-</span>
      </div>
      <div class="addr-row" data-field="street">
        <span class="k" data-i18n="usAddrStreet">街道</span><span class="v" id="fStreet">-</span>
      </div>
      <div class="addr-row" data-field="city">
        <span class="k" data-i18n="usAddrCity">城市</span><span class="v" id="fCity">-</span>
      </div>
      <div class="addr-row" data-field="state">
        <span class="k" data-i18n="usAddrState">州</span><span class="v" id="fState">-</span>
      </div>
      <div class="addr-row" data-field="zip">
        <span class="k" data-i18n="usAddrZip">邮政编码</span><span class="v" id="fZip">-</span>
      </div>
    </div>
    <div class="map-link">
      <button id="mapBtn" class="btn btn-secondary" data-i18n="usAddrMap">位置地图</button>
    </div>
  </div>
</main>
<footer class="global-footer">
  <div class="tool-status" id="statusBar"></div>
  <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
</footer>
<script src="../../assets/js/global.js"></script>
<script src="../../assets/js/i18n.js"></script>
<script src="states.js"></script>
<script>
(function () {
  'use strict';
  var stateSelect = document.getElementById('stateSelect');
  var toastBox = document.getElementById('toastBox');
  var taxBadge = document.getElementById('taxBadge');
  var mapBtn = document.getElementById('mapBtn');
  var fields = {
    name: document.getElementById('fName'),
    gender: document.getElementById('fGender'),
    phone: document.getElementById('fPhone'),
    street: document.getElementById('fStreet'),
    city: document.getElementById('fCity'),
    state: document.getElementById('fState'),
    zip: document.getElementById('fZip')
  };
  var current = null;
  var toastTimer = null;

  var FIRST_M = ['James','Robert','John','Michael','David','William','Richard','Joseph','Thomas','Christopher','Charles','Daniel','Matthew','Anthony','Mark','Donald','Steven','Andrew','Paul','Joshua','Kenneth','Kevin','Brian','George','Timothy','Ronald','Edward','Jason','Jeffrey','Ryan','Jacob','Nicholas','Gary','Eric','Jonathan','Stephen','Larry','Justin','Scott','Brandon','Benjamin','Samuel','Raymond','Gregory','Frank','Alexander','Patrick','Jack','Dennis','Jerry'];
  var FIRST_F = ['Mary','Patricia','Jennifer','Linda','Barbara','Elizabeth','Susan','Jessica','Sarah','Karen','Lisa','Nancy','Betty','Margaret','Sandra','Ashley','Dorothy','Kimberly','Emily','Donna','Michelle','Carol','Amanda','Melissa','Deborah','Stephanie','Rebecca','Sharon','Laura','Cynthia','Kathleen','Amy','Angela','Shirley','Anna','Brenda','Pamela','Emma','Nicole','Helen','Samantha','Katherine','Christine','Debra','Rachel','Carolyn','Janet','Catherine','Maria','Heather'];
  var LAST = ['Smith','Johnson','Williams','Brown','Jones','Garcia','Miller','Davis','Rodriguez','Martinez','Hernandez','Lopez','Gonzalez','Wilson','Anderson','Thomas','Taylor','Moore','Jackson','Martin','Lee','Perez','Thompson','White','Harris','Sanchez','Clark','Ramirez','Lewis','Robinson','Walker','Young','Allen','King','Wright','Scott','Torres','Nguyen','Hill','Flores','Green','Adams','Nelson','Baker','Hall','Rivera','Campbell','Mitchell','Carter','Roberts'];

  function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  function generate() {
    var filter = stateSelect.value;
    var st = null;
    if (filter) {
      for (var si = 0; si < US_STATES.length; si++) {
        if (US_STATES[si].abbr === filter) { st = US_STATES[si]; break; }
      }
    }
    if (!st) st = rand(US_STATES);
    var isMale = Math.random() > 0.5;
    var first = isMale ? rand(FIRST_M) : rand(FIRST_F);
    var last = rand(LAST);
    var street = randInt(100, 9999) + ' ' + rand(st.streets);
    var areaCode = rand(st.areaCodes);
    var phone = '(' + areaCode + ') ' + randInt(200, 999) + '-' + ('0000' + randInt(0, 9999)).slice(-4);
    var zip = String(randInt(10000, 99999));
    var lat = st.lat + (Math.random() - 0.5) * 0.1;
    var lng = st.lng + (Math.random() - 0.5) * 0.1;
    current = {
      name: first + ' ' + last,
      gender: isMale ? t('usAddrMale', '男') : t('usAddrFemale', '女'),
      phone: phone,
      street: street,
      city: rand(st.cities),
      state: st.name + ' (' + st.abbr + ')',
      stateAbbr: st.abbr,
      zip: zip,
      taxFree: st.taxFree,
      lat: lat,
      lng: lng
    };
    render();
    setStatus(t('usAddrGenerated', '地址已生成'));
  }

  function render() {
    if (!current) return;
    fields.name.textContent = current.name;
    fields.gender.textContent = current.gender;
    fields.phone.textContent = current.phone;
    fields.street.textContent = current.street;
    fields.city.textContent = current.city;
    fields.state.textContent = current.state;
    fields.zip.textContent = current.zip;
    taxBadge.style.display = current.taxFree ? '' : 'none';
  }

  function showToast() {
    toastBox.innerHTML = '<span class="toast">' + t('usAddrCopiedToast', '已复制到剪贴板！') + '</span>';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastBox.innerHTML = ''; }, 2000);
  }

  function copyField(field, value) {
    var ta = document.createElement('textarea');
    ta.value = value;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    showToast();
  }

  var rows = document.querySelectorAll('.addr-row');
  for (var i = 0; i < rows.length; i++) {
    rows[i].addEventListener('click', function () {
      var f = this.getAttribute('data-field');
      if (!current || !f) return;
      copyField(f, current[f]);
    });
  }

  document.getElementById('generateBtn').addEventListener('click', generate);
  document.getElementById('copyAllBtn').addEventListener('click', function () {
    if (!current) { setStatus(t('usAddrGenerateFirst', '请先生成地址'), 'error'); return; }
    var text = [
      t('usAddrName', '姓名') + ': ' + current.name,
      t('usAddrGender', '性别') + ': ' + current.gender,
      t('usAddrPhone', '电话') + ': ' + current.phone,
      t('usAddrStreet', '街道') + ': ' + current.street,
      t('usAddrCity', '城市') + ': ' + current.city,
      t('usAddrState', '州') + ': ' + current.state + (current.taxFree ? ' [' + t('usAddrTaxFree', '免税州') + ']' : ''),
      t('usAddrZip', '邮政编码') + ': ' + current.zip
    ].join('\n');
    copyField('all', text);
    setStatus(t('common.copied', '已复制'));
  });
  mapBtn.addEventListener('click', function () {
    if (!current) { setStatus(t('usAddrGenerateFirst', '请先生成地址'), 'error'); return; }
    window.open('https://www.openstreetmap.org/?mlat=' + current.lat + '&mlon=' + current.lng + '#map=14/' + current.lat + '/' + current.lng, '_blank');
  });

  stateSelect.appendChild(document.createElement('option'));
  stateSelect.options[0].value = '';
  stateSelect.options[0].textContent = t('usAddrRandomState', '随机（任意州）');
  for (var s = 0; s < US_STATES.length; s++) {
    var opt = document.createElement('option');
    opt.value = US_STATES[s].abbr;
    opt.textContent = US_STATES[s].name + ' (' + US_STATES[s].abbr + ')' + (US_STATES[s].taxFree ? ' ★' : '');
    stateSelect.appendChild(opt);
  }

  generate();
})();
</script>
</body>
</html>
