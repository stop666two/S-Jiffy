<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>User Agent - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css">
<style>.ua-string{font-family:var(--font-mono);font-size:13px;word-break:break-all;background:var(--color-bg-soft);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-2);margin-bottom:var(--space-3);line-height:1.7}.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.info-item{background:var(--color-bg-soft);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-2)}.info-item .lbl{font-size:var(--font-size-xs);color:var(--color-text-secondary)}.info-item .val{font-family:var(--font-mono);font-size:var(--font-size-sm);margin-top:4px;word-break:break-all}.raw-label{font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-bottom:6px}</style></head><body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a></header>
<main class="tool-workspace"><h1 data-i18n="h1">User-Agent 信息</h1><p class="tool-desc" data-i18n="desc">查看当前浏览器的 User-Agent 字符串，并解析出浏览器和操作系统信息。</p>
<div class="card">
<div class="raw-label" data-i18n="ui.1">原始 User-Agent</div>
<div class="ua-string" id="uaRaw"></div>
<div class="info-grid" id="infoGrid"></div>
</div>
<div class="output-box"><span id="outputText"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
</main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script><script>(function(){var uaEl=document.getElementById('uaRaw'),grid=document.getElementById('infoGrid'),out=document.getElementById('outputText');var ua=navigator.userAgent;uaEl.textContent=ua;var info=[];var browser=t('ui.unknown','未知');if(ua.indexOf('Firefox/')!==-1&&ua.indexOf('Seamonkey/')===-1)browser='Firefox';else if(ua.indexOf('Chrome/')!==-1&&ua.indexOf('Edg/')===-1&&ua.indexOf('OPR/')===-1)browser='Chrome';else if(ua.indexOf('Edg/')!==-1)browser='Edge';else if(ua.indexOf('OPR/')!==-1||ua.indexOf('Opera/')!==-1)browser='Opera';else if(ua.indexOf('Safari/')!==-1&&ua.indexOf('Chrome/')===-1)browser='Safari';else if(ua.indexOf('Trident/')!==-1||ua.indexOf('MSIE')!==-1)browser='IE';var os=t('ui.unknown','未知');if(ua.indexOf('Windows NT 10.0')!==-1)os='Windows 10';else if(ua.indexOf('Windows NT 11.0')!==-1)os='Windows 11';else if(ua.indexOf('Windows NT 6.3')!==-1)os='Windows 8.1';else if(ua.indexOf('Windows NT 6.1')!==-1)os='Windows 7';else if(ua.indexOf('Mac OS X')!==-1){var m=ua.match(/Mac OS X (\d+[._]\d+)/);os='macOS '+(m?m[1].replace('_','.'):'')}else if(ua.indexOf('Android')!==-1){var m=ua.match(/Android ([\d.]+)/);os='Android '+(m?m[1]:'')}else if(ua.indexOf('Linux')!==-1)os='Linux';else if(ua.indexOf('like Mac OS X')!==-1)os='iOS';var device=t('ui.desktop','桌面端');if(ua.indexOf('Mobile')!==-1)device=t('ui.mobile','移动端');var lang=navigator.language||navigator.userLanguage||t('ui.unknown','未知');var platform=navigator.platform||t('ui.unknown','未知');info.push({l:t('ui.browser','浏览器'),v:browser});info.push({l:t('ui.os','操作系统'),v:os});info.push({l:t('ui.deviceType','设备类型'),v:device});info.push({l:t('ui.language','语言'),v:lang});info.push({l:t('ui.platform','平台'),v:platform});info.push({l:t('ui.browserVersion','浏览器版本'),v:(navigator.appVersion||'')});grid.innerHTML='';for(var i=0;i<info.length;i++){var el=document.createElement('div');el.className='info-item';el.innerHTML='<div class="lbl">'+htmlEscape(info[i].l)+'</div><div class="val">'+htmlEscape(info[i].v)+'</div>';grid.appendChild(el)}out.textContent='User-Agent: '+ua;document.getElementById('copyBtn').addEventListener('click',function(){if(out.textContent){copyToClipboard(out.textContent,this);setStatus(t('ui.copied','已复制'))}})})();</script></body></html>
