<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UUID生成器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
<style>
.opt-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.uuid-list{font-family:var(--font-mono);font-size:13px;}
.uuid-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--color-border);border-radius:var(--radius-sm);margin-bottom:6px;background:var(--color-bg);word-break:break-all;}
.uuid-row .uuid-copy{background:transparent;border:none;color:var(--color-text-secondary);cursor:pointer;font-size:var(--font-size-xs);flex-shrink:0;padding:4px 6px;border-radius:var(--radius-sm);}
.uuid-row .uuid-copy:hover{color:var(--color-text-primary);background:rgba(0,0,0,0.03);}
.preset-btn{height:36px;min-width:44px;padding:0 12px;font-size:var(--font-size-sm);}
</style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
  <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a></header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">UUID 生成器</h1>
    <p class="tool-desc" data-i18n="desc">生成加密安全的 UUID v4，支持批量生成、大小写与连字符格式切换。<span id="httpsWarning" style="display:none;font-size:var(--font-size-xs);color:var(--color-error);margin-top:4px;" data-i18n="ui.101">⚠ 需 HTTPS/localhost 环境</span></p>

    <div class="card">
      <label style="font-size:var(--font-size-sm);color:var(--color-text-secondary);display:block;margin-bottom:8px;" data-i18n="numberOfUuids">UUID数量</label>
      <div class="opt-row">
        <input id="countInput" class="input" type="number" value="5" min="1" max="100" style="width:110px;">
        <button class="btn btn-secondary preset-btn" data-preset="1">1</button>
        <button class="btn btn-secondary preset-btn" data-preset="5">5</button>
        <button class="btn btn-secondary preset-btn" data-preset="10">10</button>
        <button class="btn btn-secondary preset-btn" data-preset="20">20</button>
      </div>
      <div class="opt-row" style="margin-top:12px;">
        <select id="formatSelect" class="input" style="width:auto;min-width:100px;">
          <option value="lower">小写</option>
          <option value="upper">大写</option>
        </select>
        <label style="font-size:var(--font-size-sm);color:var(--color-text-secondary);display:flex;align-items:center;gap:6px;cursor:pointer;">
          <input type="checkbox" id="hyphenChk" checked> <span data-i18n="ui.100">含连字符</span>
        </label>
        <select id="versionSelect" class="input" style="width:auto;min-width:140px;">
          <option value="v4" data-i18n="ui.v4">UUID v4（随机）</option>
          <option value="v1" data-i18n="ui.v1">UUID v1（时间+MAC）</option>
          <option value="v6" data-i18n="ui.v6">UUID v6（可排序）</option>
        </select>
      </div>
      <div class="opt-row" style="margin-top:12px;">
        <button id="generateBtn" class="btn btn-primary" data-i18n="ui.generate">生成</button>
        <button id="clearBtn" class="btn btn-secondary" data-i18n="ui.clear">清空</button>
      </div>
    </div>

    <div class="output-box" id="outputContainer" style="min-height:120px;">
      <div id="outputText" class="uuid-list" style="display:block;padding-right:60px;"></div>
      <button class="copy-btn" id="copyBtn" data-i18n="ui.copyAll">复制全部</button>
    </div>
    <div id="breakdown" style="display:none;margin-top:var(--space-2);font-family:var(--font-mono);font-size:13px;line-height:1.8;"></div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>
    (function () {
      'use strict';
      var countEl = document.getElementById('countInput'), formatEl = document.getElementById('formatSelect'), o = document.getElementById('outputText');

      function pad2(h){return (h.length<2)?'0'+h:h;}
      function hex8(v){var s=v.toString(16);while(s.length<8)s='0'+s;return s;}
      function hex4(v){var s=v.toString(16);while(s.length<4)s='0'+s;return s;}
      function hex2(v){var s=v.toString(16);while(s.length<2)s='0'+s;return s;}

      function randomUuid(){
        var u;
        try { u = crypto.randomUUID(); }
        catch (e) {
          var b = new Uint8Array(16);
          crypto.getRandomValues(b);
          b[6] = (b[6] & 0x0f) | 0x40;
          b[8] = (b[8] & 0x3f) | 0x80;
          var hex = '';
          for (var i = 0; i < b.length; i++) hex += pad2(b[i].toString(16));
          u = hex.slice(0,8)+'-'+hex.slice(8,12)+'-'+hex.slice(12,16)+'-'+hex.slice(16,20)+'-'+hex.slice(20);
        }
        return u;
      }

      function timeUuid(){
        var tick = BigInt(Date.now()) * 10000n + 0x01b21dd213814000n;
        var timeLow = Number(tick & 0xffffffffn);
        var timeMid = Number((tick >> 32n) & 0xffffn);
        var timeHi = Number((tick >> 48n) & 0x0fffn) | 0x1000;

        var clockSeq = new Uint16Array(1);
        crypto.getRandomValues(clockSeq);
        clockSeq[0] = (clockSeq[0] & 0x3FFF) | 0x8000;

        var node = new Uint8Array(6);
        crypto.getRandomValues(node);
        node[0] = node[0] | 0x01;

        return [
          hex8(timeLow),
          hex4(timeMid),
          hex4(timeHi),
          hex4(clockSeq[0]),
          hex2(node[0]) + hex2(node[1]) + hex2(node[2]) + hex2(node[3]) + hex2(node[4]) + hex2(node[5])
        ].join('-');
      }

      function timeUuidV6(){
        var tick = BigInt(Date.now()) * 10000n + 0x01b21dd213814000n;

        var timeHi = Number((tick >> 48n) & 0x0fffn);
        var timeMid = Number((tick >> 32n) & 0xffffn);
        var timeLow = Number(tick & 0xffffffffn);

        var clockSeq = new Uint16Array(1);
        crypto.getRandomValues(clockSeq);
        clockSeq[0] = (clockSeq[0] & 0x3FFF) | 0x8000;

        var node = new Uint8Array(6);
        crypto.getRandomValues(node);
        node[0] = node[0] & 0xFE | 0x02;

        return [
          hex8((timeHi << 16) | (timeMid >>> 4)),
          hex4(((timeMid & 0x0F) << 12) | ((timeLow >>> 20) & 0xFFF)),
          hex4(((timeLow >>> 8) & 0x0FFF) | 0x6000),
          hex4((clockSeq[0] & 0x3FFF) | 0x8000),
          hex2(node[0]) + hex2(node[1]) + hex2(node[2]) + hex2(node[3]) + hex2(node[4]) + hex2(node[5])
        ].join('-');
      }

      function genUuid(){
        var ver = document.getElementById('versionSelect').value;
        var u = ver === 'v1' ? timeUuid() : ver === 'v6' ? timeUuidV6() : randomUuid();
        if (!document.getElementById('hyphenChk').checked) u = u.replace(/-/g, '');
        return formatEl.value === 'upper' ? u.toUpperCase() : u;
      }

      function renderBreakdown(uuid, ver){
        var bd = document.getElementById('breakdown');
        if (!bd) return;
        var parts = uuid.split('-');
        var html = '';
        if (ver === 'v1') {
          html += '<div>' + t('v1.timeLow','时间戳低位: ') + parts[0] + '</div>';
          html += '<div>' + t('v1.timeMid','时间戳中位: ') + parts[1] + '</div>';
          html += '<div>' + t('v1.timeHi','时间戳高位+版本: ') + parts[2] + '</div>';
          html += '<div>' + t('v1.clockSeq','时钟序列+变体: ') + parts[3] + '</div>';
          html += '<div>' + t('v1.node','节点 (MAC): ') + parts[4] + '</div>';
          html += '<div style="font-size:12px;color:var(--color-text-secondary);">' + t('v1.timestamp','时间戳: ') + new Date().toISOString() + '</div>';
        } else if (ver === 'v6') {
          html += '<div style="font-size:12px;color:var(--color-text-secondary);">' + t('v6.breakdown','UUID v6 十六进制拆分:') + '</div>';
          html += '<div>' + t('v6.timeHiMid','时间戳高位+中位: ') + parts[0] + ' (48 bits)</div>';
          html += '<div>' + t('v6.timeMidLow','时间戳中低位: ') + parts[1] + ' (12+12 bits)</div>';
          html += '<div>' + t('v6.timeLowVersion','时间低位+版本: ') + parts[2] + ' (12+4 bits, v=6)</div>';
          html += '<div>' + t('v6.clockSeq','时钟序列+变体: ') + parts[3] + ' (14+2 bits)</div>';
          html += '<div>' + t('v6.node','节点: ') + parts[4] + ' (48 bits)</div>';
          html += '<div style="font-size:12px;color:var(--color-text-secondary);">' + t('v6.timestamp','时间戳: ') + new Date().toISOString() + '</div>';
        } else {
          bd.style.display = 'none';
          return;
        }
        bd.style.display = 'block';
        bd.innerHTML = html;
      }

      function render(arr){
        o.innerHTML = '';
        for (var i = 0; i < arr.length; i++) {
          (function (val){
            var row = document.createElement('div');
            row.className = 'uuid-row';
            var span = document.createElement('span');
            span.textContent = val;
            var btn = document.createElement('button');
            btn.className = 'uuid-copy';
            btn.textContent = t('common.copy','复制');
            btn.addEventListener('click', function(){ copyToClipboard(val, btn); });
            row.appendChild(span); row.appendChild(btn);
            o.appendChild(row);
          })(arr[i]);
        }
      }

      document.getElementById('generateBtn').addEventListener('click', function () {
        var n = parseInt(countEl.value, 10) || 5;
        if (n < 1) n = 1;
        if (n > 100) n = 100;
        countEl.value = n;
        var ver = document.getElementById('versionSelect').value;
        var arr = [];
        for (var i = 0; i < n; i++) arr.push(genUuid());
        render(arr);
        if (arr.length) renderBreakdown(arr[0], ver);
        var suffix = ver === 'v1' ? t('uuidV1Suffix',' 个 UUID v1') : ver === 'v6' ? t('uuidV6Suffix',' 个 UUID v6') : t('uuidCount',' 个 UUID');
        setStatus(t('generated','已生成 ') + n + suffix);
      });

      var presets = document.querySelectorAll('.preset-btn');
      for (var p = 0; p < presets.length; p++) {
        (function(btn){
          btn.addEventListener('click', function(){ countEl.value = btn.getAttribute('data-preset'); });
        })(presets[p]);
      }

      document.getElementById('clearBtn').addEventListener('click', function () { o.innerHTML = ''; setStatus(''); });
      document.getElementById('copyBtn').addEventListener('click', function () {
        var arr = [];
        var rows = o.querySelectorAll('.uuid-row span');
        for (var i = 0; i < rows.length; i++) arr.push(rows[i].textContent);
        if (arr.length) { copyToClipboard(arr.join('\n'), this); setStatus(t('common.copied','已复制')); }
      });
    })();
  if(!isSecureContext()){var w=document.getElementById('httpsWarning');if(w)w.style.display='block';}
  </script>
</body>
</html>
