<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UUID v1 生成器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .u1-row { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-bottom:var(--space-3); }
    .u1-row .field { flex:1; min-width:80px; }
    .u1-row label { display:block; font-size:var(--font-size-sm); color:var(--color-text-secondary); margin-bottom:4px; }
    .breakdown { font-family:var(--font-mono); font-size:14px; line-height:1.8; }
    .breakdown span { display:inline-block; }
    .time-part { color:#e74c3c; }
    .clock-part { color:#27ae60; }
    .node-part { color:#2980b9; }
    .variant-part { color:#8e44ad; }
  </style>
</head>
<body>
  <header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn" data-i18n="common.back">← 返回</a></header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">UUID v1 生成器</h1>
    <p class="tool-desc" data-i18n="desc">基于时间戳和节点生成 UUID v1（时间基 UUID），显示各字段拆分。</p>
    <div class="card">
      <div class="u1-row">
        <div class="field"><label for="countVal" data-i18n="ui.quantity">数量</label><input id="countVal" class="input" type="number" value="1" min="1" max="100"></div>
      </div>
      <div class="u1-row">
        <label style="display:flex;align-items:center;gap:8px;"><input id="upperChk" type="checkbox"> <span data-i18n="ui.2">大写</span></label>
      </div>
      <div><button id="genBtn" class="btn btn-primary" data-i18n="ui.generate">生成</button></div>
      <div class="breakdown" id="breakdown"></div>
    </div>
    <div class="output-box"><span id="outputText" style="display:block;padding-right:60px;"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
  </main>
  <footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>(function(){
    var countEl = document.getElementById('countVal');
    var upperChk = document.getElementById('upperChk');
    var genBtn = document.getElementById('genBtn');
    var breakdown = document.getElementById('breakdown');
    var outputEl = document.getElementById('outputText');
    var copyBtn = document.getElementById('copyBtn');

    function hex8(v) { var s = v.toString(16); while (s.length < 8) s = '0' + s; return s; }
    function hex4(v) { var s = v.toString(16); while (s.length < 4) s = '0' + s; return s; }
    function hex2(v) { var s = v.toString(16); while (s.length < 2) s = '0' + s; return s; }

    function generateUUIDv1() {
      var now = Date.now();
      var tick = (now * 10000) + 0x01b21dd213814000;
      var timeLow = tick & 0xFFFFFFFF;
      var timeMid = (tick >>> 32) & 0xFFFF;
      var timeHi = ((tick >>> 48) & 0x0FFF) | 0x1000;

      var clockSeq = new Uint16Array(1);
      crypto.getRandomValues(clockSeq);
      clockSeq[0] = (clockSeq[0] & 0x3FFF) | 0x8000;

      var node = new Uint8Array(6);
      crypto.getRandomValues(node);
      node[0] = node[0] | 0x01;

      var parts = [
        hex8(timeLow),
        hex4(timeMid),
        hex4(timeHi),
        hex4(clockSeq[0]),
        hex2(node[0]) + hex2(node[1]) + hex2(node[2]) + hex2(node[3]) + hex2(node[4]) + hex2(node[5])
      ];
      return parts.join('-');
    }

    function parseUUID(uuid) {
      var parts = uuid.split('-');
      return {
        timeLow: parts[0],
        timeMid: parts[1],
        timeHiVersion: parts[2],
        clockSeq: parts[3],
        node: parts[4]
      };
    }

    function generate() {
      var count = parseInt(countEl.value, 10) || 1;
      if (count < 1) count = 1;
      if (count > 100) count = 100;
      var upper = upperChk.checked;

      var result = [];
      var breakHtml = '';
      for (var i = 0; i < count; i++) {
        var uuid = generateUUIDv1();
        if (upper) uuid = uuid.toUpperCase();
        result.push(uuid);

        if (i === 0) {
          var p = parseUUID(uuid);
          breakHtml = '<div><span class="time-part">' + t('ui.3','时间戳低位: ') + p.timeLow + '</span></div>';
          breakHtml += '<div><span class="time-part">' + t('ui.4','时间戳中位: ') + p.timeMid + '</span></div>';
          breakHtml += '<div><span class="time-part">' + t('ui.5','时间戳高位+版本: ') + p.timeHiVersion + '</span></div>';
          breakHtml += '<div><span class="clock-part">' + t('ui.6','时钟序列+变体: ') + p.clockSeq + '</span></div>';
          breakHtml += '<div><span class="node-part">' + t('ui.7','节点 (MAC): ') + p.node + '</span></div>';
          breakHtml += '<div style="margin-top:8px;font-size:12px;color:var(--color-text-secondary);">' + t('ui.8','时间戳: ') + new Date().toISOString() + '</div>';
        }
      }

      breakdown.innerHTML = breakHtml;
      outputEl.textContent = result.join('\n');
      setStatus(t('ui.generated','已生成 ') + count + t('ui.1',' 个 UUID v1'));
    }

    genBtn.addEventListener('click', generate);
    copyBtn.addEventListener('click', function() { if (outputEl.textContent) { copyToClipboard(outputEl.textContent, copyBtn); setStatus(t('ui.copied','已复制')); } });
  })();</script>
</body>
</html>
