<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>王公灵签 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
.logo-text { font-size: var(--font-size-lg); font-weight: 600; }
.draw-card { text-align: center; }
.draw-tip { max-width: 540px; margin: 0 auto var(--space-3); font-size: var(--font-size-sm); color: var(--color-text-secondary); line-height: 1.7; }
.qian-stage { position: relative; width: 120px; height: 230px; margin: 0 auto var(--space-3); }
.qian-tube { position: absolute; left: 50%; bottom: 0; width: 92px; height: 170px; margin-left: -46px; border: 1px solid #5E2018; border-radius: 10px 10px 16px 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.22); z-index: 0; }
.qian-tube::before { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 9px 9px 15px 15px; background: linear-gradient(180deg, #B3442F, #A03224 30%, #8A2B1E 70%, #7C2418); }
.qian-tube::after { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 24px; border-radius: 9px 9px 0 0; background: linear-gradient(180deg, #C0533C, #A93824); box-shadow: inset 0 -4px 6px rgba(0,0,0,0.25), inset 0 2px 3px rgba(255,255,255,0.18); }
.qian-slip { position: absolute; left: 50%; bottom: 20px; width: 56px; height: 96px; margin-left: -28px; z-index: -1; background: repeating-linear-gradient(90deg, transparent 0 26px, rgba(0,0,0,0.05) 26px 27px), linear-gradient(180deg, #FDF9EF, #F6EDD8); border: 1px solid #D8C79F; border-radius: 5px; }
.qian-slip::after { content: "签"; position: absolute; top: 14px; left: 0; right: 0; text-align: center; font-size: 30px; color: #8A4A1F; font-weight: 600; }
.qian-stage.drawing { animation: stageWiggle 2.6s ease-in-out both; }
.qian-stage.drawing .qian-slip { animation: slipRise 2.6s ease-in-out both; }
.qian-stage.drawing .qian-tube::after { animation: lipPulse 0.45s ease-in-out infinite alternate; }
.qian-stage.drawn .qian-slip { animation: slipOut 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
.qian-stage.drawn .qian-slip::after { content: "✓"; color: #346538; }
@keyframes stageWiggle {
  0% { transform: rotate(0deg) translateY(0); }
  10% { transform: rotate(-5deg) translateY(-4px); }
  20% { transform: rotate(4deg) translateY(-9px); }
  35% { transform: rotate(-4deg) translateY(-13px); }
  50% { transform: rotate(5deg) translateY(-11px); }
  65% { transform: rotate(-3deg) translateY(-7px); }
  80% { transform: rotate(2deg) translateY(-3px); }
  100% { transform: rotate(0deg) translateY(0); }
}
@keyframes slipRise {
  0% { bottom: 20px; }
  12% { bottom: 84px; }
  24% { bottom: 24px; }
  36% { bottom: 96px; }
  48% { bottom: 26px; }
  60% { bottom: 106px; }
  72% { bottom: 28px; }
  84% { bottom: 114px; }
  100% { bottom: 118px; }
}
@keyframes slipOut {
  0% { bottom: 118px; opacity: 1; }
  100% { bottom: 132px; opacity: 1; }
}
@keyframes lipPulse { from { opacity: 1; } to { opacity: 0.55; } }
.result-head { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); flex-wrap: wrap; }
.qian-no { font-size: 28px; font-weight: 700; line-height: 1.2; }
.qian-name { font-size: 15px; color: var(--color-text-secondary); font-weight: 600; }
.ji-badge { display: inline-block; padding: 2px 10px; border-radius: 9999px; border: 1px solid; font-size: var(--font-size-sm); }
.jl-up { color: #2E5B31; background: #E9F1E9; border-color: #C4D8C6; }
.jl-mid { color: #8A5B00; background: #F7EFDF; border-color: #E6D5AC; }
.jl-down { color: #98302E; background: #F7E8E7; border-color: #E4C6C4; }
.qian-poem { font-size: 17px; line-height: 2; margin-bottom: var(--space-2); }
.qian-jie { font-size: var(--font-size-sm); color: var(--color-text-secondary); line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
.qian-extra-line { font-size: var(--font-size-sm); color: var(--color-text-secondary); line-height: 1.8; white-space: pre-wrap; word-break: break-word; margin-top: var(--space-1); }
.result-actions { display: flex; gap: var(--space-2); margin-top: var(--space-3); flex-wrap: wrap; }
.result-card.show { animation: fadeUp 0.45s ease-out; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.all-actions { display: flex; gap: var(--space-2); margin-bottom: var(--space-2); }
.all-list { display: none; }
.all-row { border: 1px solid var(--color-border); border-radius: var(--radius-md); margin-bottom: 8px; overflow: hidden; }
.all-head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--color-bg); border: none; cursor: pointer; font-family: var(--font-mono); font-size: 14px; color: var(--color-text-primary); text-align: left; }
.all-head:hover { background: var(--color-bg-soft); }
.all-head::after { content: "▸"; margin-left: auto; color: var(--color-text-secondary); }
.all-row.open .all-head::after { content: "▾"; }
.all-no { flex-shrink: 0; font-weight: 600; }
.all-poem { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--color-text-secondary); font-size: var(--font-size-sm); }
.all-body { display: none; padding: 12px 14px; border-top: 1px dashed var(--color-border); background: var(--color-bg-soft); font-size: var(--font-size-sm); line-height: 1.8; color: var(--color-text-secondary); white-space: pre-wrap; word-break: break-word; }
.all-row.open .all-body { display: block; }
.all-poem-full { color: var(--color-text-primary); margin-bottom: 6px; }
.all-jie { margin-top: 4px; }
.tool-note { margin-top: var(--space-4); font-size: var(--font-size-xs); color: var(--color-text-disabled); text-align: center; }
footer.tool-status { padding: var(--space-2) var(--space-3); border-top: 1px solid var(--color-border); }
  </style>
</head>

  <main class="tool-workspace">
    <h1 data-i18n="h1">王公灵签</h1>
    <p class="tool-desc" data-i18n="desc">王公灵签共五十支，卜问功名事业、财利家宅诸事，一事一签，心诚则灵。</p>
    <div class="card draw-card">
      <p class="draw-tip" data-i18n="ui.1">请默念您的姓名、生辰与所问之事，一事一签，切勿杂问。</p>

        <span class="qian-no" id="resNo"></span>
        <span class="qian-name" id="resName" style="display:none"></span>

      </div>
    </div>
    <div class="card">
      <div class="all-actions">
        <button id="allToggle" class="btn btn-secondary" data-i18n="ui.viewAllSigns">查看全部签文</button>
      </div>
      <div class="all-list" id="allList"></div>
    </div>
    <p class="tool-note" data-i18n="ui.2">本工具数据源自公开传统文化资料，仅供娱乐参考。</p>
  </main>
  <footer class="tool-status" id="statusBar"></footer>
  <script src="../../assets/js/global.js"></script>

  <script>
(function () {
  var CFG = {"name":"王公灵签","noLabel":"第 ","noSuffix":" 签","nameField":"","jiField":"","poemField":"text","poemLabel":"签文","jieField":"jie","jieLabel":"解签","extra":[]};
  CFG.name = t('ui.name','王公灵签');
  CFG.noLabel = t('ui.noLabel','第 ');
  CFG.noSuffix = t('ui.noSuffix',' 签');
  CFG.poemLabel = t('ui.poemLabel','签文');
  CFG.jieLabel = t('ui.jieLabel','解签');
  var QIAN = [{"n":1,"text":"福禄朝天远、名高利更亨、公私财喜庆、百福自来迎。","jie":"吉祥富贵像一条源远流长的江河，自漫无边际的苍穹悠远而来，使得求此灵签的人不只能够扬名立万。而且，财利更加的亨通。不论是在公家方面或是在私人领域，处处都能够得到吉利与欢欣，所有一切的事情自然皆能迎刃而解。","xiangjie":"功名：福禄天降、功成名扬。升迁：升官发财、福自天来。事业：逐步优游、名扬利就。失物：复得有望、完璧留香。财利：财足源远、益利千遍。疾病：消灾解厄、神清气和。婚姻：佳人足好、白首偕老。行人：佳音频催、门第生辉。田宅：物阜丰饶、添购吉兆。出行：一路顺风、安抵家门。店面：日日生财、前景无涯。六甲：天送贵子、造福乡梓。官讼：吉人天相、讼息吉祥。六畜：无疾无碍、无病无灾。家运：和乐安泰、进取无灾。求谋：贵人列队、所求皆遂。移居：此是吉宅、安居世代。祖茔：砂水当前、福祚绵绵。"},{"n":2,"text":"家道未能昌、危危保祸映、暗云侵月桂、家人一炉香。","jie":"家运仍在低迷的谷底徘回，还没有能够兴盛的时候，就要提高警觉，正视着各种情况的变化，守护着家里的人、事、物，随时注意有没有灾祸所映照出来的一些看起来不寻常的举动、境遇或状态。比如看到了月亮被少许乌云侵入时，就不可掉以轻心，这是一种不祥的征兆，要立刻集合家人围在香炉旁烧香敬拜神佛，祈求神明庇佑一家大小平安康宁。","xiangjie":"功名：求官不济、考试不利。升迁：谨守安待、该来就来。事业：循序守○、创业不久。失物：运低无助、何劳寻之。财利：安贫乐道、清心祸消。疾病：痊之不易、求神护庇。婚姻：枝本无叶、莫怪日偏。行人：音信迟疑、会合无期。田宅：五谷欠收、置产利薄。出行：家道未昌、远行不当。店面：此店无气、开之何益。六甲：嗣息未愿、广结善缘。官讼：讼之不吉、求和方利。六畜：饲之无益、徒费心力。家运：家运低迷、大小悒悒。求谋：安份守己、求谋不宜。移居：多方不足、消念祈福。祖茔：环境有亏、祈神解厄。"},{"n":3,"text":"谋道言婚吉、求官在晚成、复开花结子、更物转光明。","jie":"求得此签之人，若设法求取婚姻的话，那将是美事一桩，婚姻必能白首好合。若是求官考试，那就要经过一番折腾，立定志向下苦工才能如愿，也就是属于“大器晚成”的人。而且，不论做任何事情，都会有好的开始和圆满的结果。只是要具备灵活的智能，作阶段性的调整和变通，山不转路转，此路不通另寻他路，要知道条条大路通罗马的道理。","xiangjie":"功名：求官晚成、试场多争。升迁：此职不升、他迁必成。事业：初营多艰、后必欢颜。失物：物去无妨、更遍吉昌。财利：钱财自有、越外莫求。疾病：病色不起、速换良医。婚姻：佳偶孝悌、合和如意。行人：鱼雁信捎、伊人安好。田宅：改易栽种、置产利通。出行：一路通坦、欢喜平安。店面：若想开店、宜改门面。六甲：得子有望、家门吉昌。官讼：讼之不完、律师速换。六畜：无病无灾、财利自来。家运：家运平平、老少康宁。求谋：心中谋求、要勤奔走。移居：迁移有利、发展可期。祖茔：砂水向阳、亡灵安祥。"},{"n":4,"text":"凿石方知玉、淘砂始是金、悲风愁过面、自想不知音。","jie":"我是一块晶莹剔透、光泽亮丽的美玉，为什么一定要经过多层面的锯割、琢磨与刷洗，才会看清楚我的完美无瑕？我是混藏在溪河中，重重泥沙里面的珍贵黄金，为什么必须透过大水的冲刷涤荡，才会发现我的存在？可悲啊！每当想到要面临这一种际遇，愁绪就涌上了面庞，心理感叹着“知音”何在？“伯乐”何在？","xiangjie":"功名：官位莫望、试场空忙。升迁：勤快超昔、他日可及。事业：谨慎经营、创业非今。失物：重新物色、当舍则舍。财利：汲汲营营、财不我应。疾病：宽心从善、带疾延年。婚姻：知音难觅、姻缘难期。行人：流离失所、音信难托。田宅：禾黍凋枯、买卖谁赎。出行：程途多险、请待来年。店面：门市寂寥、雀飞狗跳。六甲：求男嗣继、力行孝悌。官讼：败讼已定、速和吞声。六畜：牲口不兴、静待佳音。家运：丁口有恙、祈神解禳。求谋：安守本份、求谋谁问。移居：喋喋唧唧、丁口不齐。祖茔：真气涣散、居之可叹。"},{"n":5,"text":"称心欢喜、欢喜称心、禄马相朝接、财喜自来迎。","jie":"所做的事情能够满意的达到先前预期的效益与结果，实在令人太高兴了。实在令人太高兴了，所做的事情能够满意的达到先前预期的效益与结果。官职、马车（坐乘）自朝中连接邮驿，一站一站互相传报而来，有了官位，财利自然而然的迎接着你。","xiangjie":"功名：宜其得官、扬名立万。升迁：辛勤有功、实至名隆。事业：蒸蒸日上、创业得赏。失物：他乡协寻、复得宝珍。财利：生涯滚滚、投机莫问。疾病：无忧无愁、灾疾立休。婚姻：珠联壁合、佳人可得。行人：伊人安渡、人在归途。田宅：田产丰足、买卖可图。出行：欢喜出行、满载归程。店面：人气旺盛、穿梭不停。六甲：麟儿喜得、绵绵福泽。官讼：已讼可息、新讼不宜。六畜：六畜兴旺、财利自扬。家运：生气蓬勃、无灾无祸。求谋：事事得宜、偿愿在即。移居：处之安泰、兴发可待。祖茔：砂环水绕、居之安好。"},{"n":6,"text":"古镜复重磨、钱财积聚多、立身终有望、进士必登科。","jie":"把你以前磨过的那一面“古镜”拿出来，重新再把它磨得更为明亮光滑，如此一来，钱财就会愈聚愈多，安身立命有所着落。即使赴京赶考能够高中“进士”必然也是意料中的事情。","xiangjie":"功名：首考不利、再考及第。升迁：老调重弹、升迁必然。事业：重操旧业、名利不坠。失物：重复寻找、失物难逃。财利：营生守旧、财利丰厚。疾病：一心求神、沉疴断根。婚姻：新婚不吉、再婚得利。行人：伊人已动、近日相逢。田宅：桑麻饱满、置产安然。出行：旧地重游、欢喜无忧。店面：老店重开、福自天来。六甲：头胎女产、再生必男。官讼：老案可胜、新案难成。六畜：六畜无灾、血财安泰。家运：谨慎进取、丁口团聚。求谋：一再求谋、终得神佑。移居：莫问迁移、老宅多利。祖茔：凶葬不吉、吉葬有利。"},{"n":7,"text":"有忧不用忧、财喜自当求、公私皆吉庆、灾病一齐休。","jie":"有什么好忧愁的呢？忧愁对事情又有什么帮助？赶快把忧愁抛弃掉，打起精神，乐观进取的去追求财利吧！能够如此，不论是公的领域或私的领域，都会有可喜可贺的吉利情况出现，即使是灾厄或疾病也会一齐消遁无踪。","xiangjie":"功名：前程锦绣、富贵悠悠。升迁：稍安勿躁、喜神报到。事业：鸿图再展、名利均沾。失物：勿嗔勿忧、可望解愁。财利：益利频传、善行合欢。疾病：福星拱照、灾病潜逃。婚姻：佳人有情、前生缘定。行人：音信有凭、会合自迎。田宅：桑麻盈盈、欣喜不停。出行：远行顺畅、愉悦出航。店面：车水马龙、钱声咚咚。六甲：弄璋有准、能武能文。官讼：止争息讼、其乐融融。六畜：微灾不忧、血财可求。家运：离苦得乐、老少讴歌。求谋：谋望皆遂、贵人相随。移居：迁移如意、家道殷奇。祖茔：龙虎登对、福荫不退。"},{"n":8,"text":"有宝有财、禄马飞来、望更清朝吉、往来亦无灾。","jie":"有贵重的珍宝，更有钱财，官职和象征官位所乘用的马车如飞般的疾驰而来，这种景象便可纾解你从夜晚焦虑的望着更漏直到清晨所盼望、等待的美好结果。高中而得到官职与财宝，今后不论去到什么地方，便没有人会看轻你、讥笑你、刁难你了。","xiangjie":"功名：十年寒窗、扬名风光。升迁：等待至今、明早佳音。事业：通路畅快、利名无碍。失物：物去不远、翌晨即还。财利：财多利倍、源通南北。疾病：神清气爽、康健昂扬。婚姻：丽质天生、琴瑟共鸣。行人：异地风光、归期有望。田宅：五谷丰登、买卖多成。出行：东西南北、观花赏梅。店面：南北东西、人潮挤挤。六甲：贵子神送、耀祖光宗。官讼：胜讼将息、善行莫弃。六畜：六畜兴旺、成群嘶昂。家运：家运昌隆、日日亨通。求谋：贵人天助、谋望无阻。移居：顺利如意、必有佳绩。祖茔：金城水环、有财有官。"},{"n":9,"text":"有意望明月、复圆又复缺、间虑苦伤心、终身需守节。","jie":"我诚心诚意的想要观赏一轮圆圆满满、清澈皎洁的月亮，可是她却是圆了又缺，缺了又圆，总是这么的反复无常。而在圆满与残缺之间，让我思虑着人生种种的困苦和艰辛，一阵悲伤不知不觉涌上心头。然而，不管环境如何的变化，不论过程如何的圆缺，我终身一定要坚守志气与节操。绝对不会随着人、事的改变而更变我的立场和原则。","xiangjie":"功名：坚此百忍、梦必成真。升迁：耐心勤勉、终必高迁。事业：惨澹经营、创业不行。失物：去之已远、伤神难圆。财利：财来财去、时散时聚。疾病：反反复覆、时好时不。婚姻：此缘难圆、另谋他年。行人：有音无音、反复难寻。田宅：五谷不齐、购屋不宜。出行：喜喜忧忧、此行该休。店面：此店勿买、忧心难改。六甲：胎孕恐损、虔诚求神。官讼：此讼宜和、莫再纠葛。六畜：旺衰不定、新饲莫行。家运：起起落落、志节勿脱。求谋：求谋止念、自身周全。移居：吉利不现、莫再动念。祖茔：旧坟有凶、新坟莫用。"},{"n":10,"text":"有喜有喜、有财有财、求谋皆称遂、如花带露开。","jie":"有欢喜的是临门了，有欢喜的是临门了。因为得到所祈求的钱财宝物了。因为我得到所祈求的钱财宝物了。而且我计划求取的事情都能够一件一件达到预期的愿望，就好像花蕾受到露水的润泽，而绽放出美丽清香的花朵。","xiangjie":"功名：登科扬名、安享福应。升迁：水到渠涨、当仁不让。事业：稳步成长、达通利彰。失物：物归故主、吉人天助。财利：财如泉泻、永不枯竭。疾病：悉心调养、宿疾远飏。婚姻：如花美眷、永慕爱恋。行人：他乡得意、见面可期。田宅：购田买屋、财利可图。出行：此行大可、灾咎不惹。店面：买租营生、财利必亨。六甲：祭祀有人、接生佳麟。官讼：神佑黎民、讼事不侵。六畜：畜禽安逸、乐自心喜。家运：安康得兼、福祚连连。求谋：求谋皆遂、如痴如醉。移居：福至心灵、乔迁禄迎。祖茔：山环水抱、物阜丰饶。"},{"n":11,"text":"绿柳郁苍苍、今朝过午后、云开见残月、舟回待便风。","jie":"柳树是那样的青翠蓊郁，看起来生意盎然，可是，我却无心留连在此欣赏美景，今天中午过后，浓云散去了就会露出一弯残月。那时候，我将驾着小舟回去，只要等到起风之时，便趁着顺风起程。","xiangjie":"功名：目下有祖、后运有助。升迁：不能如愿、静待他年。事业：稳当保全、兴发来年。失物：复得有望、多方提防。财利：财利虽好、起得太早。疾病：悉心献娱、不日可愈。婚姻：姻缘难缔、耐心佳期。行人：风尘仆仆、会面从速。田宅：田产虽利、静待时机。出行：心情郁结、此去难解。店面：营生过早、尚待人潮。六甲：求神行善、必获麟男。官讼：和解撤讼、贵人无功。六畜：畜旺禽佳、奈何贱价。家运：平安是福、希勿自误。求谋：心有所图、求神助。移居：保守应对、否则运退。祖茔：虚花假穴、砂水欹斜。"},{"n":12,"text":"花谢花重发、月缺月再圆、后和阳谷日、何虑不谊谨。","jie":"花儿凋谢了还会重新绽开出美丽的花朵，月亮残缺了也会再一次的团结圆满。大自然就是呈现这种盈虚消长、周而复始的循环理则在运行。所以花谢花开，月缺月圆完全是一种大自然的现象。了解了这一个道理之后，在阳和日丽的日子里，就必须知道每个阶段应该要如何去做，不必考虑什么时候要乐观进取，什么时候又要谨慎小心了。","xiangjie":"功名：再接再厉、不可放弃。升迁：升迁欲顺、犹待三春。事业：起起落落、终必结果。失物：塞翁失马、复得桑麻。财利：续续断断、只待时援。疾病：时好时坏、春来康泰。婚姻：吵吵闹闹、反成吉兆。行人：书信往返、会晤不难。田宅：田园将芜、待时而锄。出行：此行安稳、必待来春。店面：目下冷清、时到热情。六甲：先女后男、香火不断。官讼：息讼静待、良机可裁。六畜：现今不旺、恐多损伤。家运：此事起伏、他日享福。求谋：若要周全、须待来年。移居：先衰后吉、安待莫急。祖茔：气运未到、久葬富饶。"},{"n":13,"text":"去往心未定、行藏亦未能、一轮清皎洁、和被暗云遮。","jie":"他方有美好的景象等待你去开发拓展，可是去或不去，你却拿不定主意，要做或不做也不能下定决心，这样的迟疑、裹足不前的态度，就好像一轮皎洁圆满的月亮，被乌云遮掩了光辉，无法彰显出曼妙、灿烂绚丽的美景，真是太可惜了。","xiangjie":"功名：功名难图、考试负负。升迁：意志不坚、莫问升迁。事业：经营不力、上班为宜。失物：先机已失、物去难识。财利：争竞财退、薪水可追。疾病：病势渐沈、速求诸神。婚姻：勉强配对、将生怨悔。行人：流离颠沛、归期暧昧。田宅：栽种买卖、无人能裁。出行：行止不定、自家安宁。店面：主人不济、徒负店基。六甲：男胎女胎、神明安排。官讼：小心谨慎、讼已成真。六畜：畜产不旺、痴心愚妄。家运：乌云遮月、谦冲可解。求谋：无力谋事、安份待时。移居：主意犹疑、莫问迁移。祖茔：玄武低陷、此地莫扦。"},{"n":14,"text":"未能事人、焉能事神、若不信吾语、苑香何处尘。","jie":"若是不能殷勤照顾、悉心的服侍一个人，让他服服贴贴感到非常愉悦、快慰的话，那么，你也就无法侍奉一尊神明，毫不间断的早晚三炷香，花果、清茶，持恒的供养。如果不相信我说的这一句话，请去看看人物聚集的书香文苑，何处会沾上一丝丝灰尘呢？","xiangjie":"功名：检讨改进、徐图再拼。升迁：升迁无门、再加勤奋。事业：反省不懈、不宜创业。失物：物已远遁、何劳再问。财利：保守因应、莫存侥幸。疾病：悉心照顾、好转加速。婚姻：多方尊重、求婚亦同。行人：多所沉闷、欲回无门。田宅：栽种欠收、置产保守。出行：走马看花、不如在家。店面：此店不旺、另找他房。六甲：若要生男、多多行善。官讼：和解要快、此事难奈。六畜：服侍禽畜、与人无误。家运：平常安度、守株待兔。求谋：诚意不坚、势难如愿。移居：迁移为何、现居可乐。祖茔：砂水不真、多详细审。"},{"n":15,"text":"出外须防危、居家长虑愁、求福身多吉、得意也须休。","jie":"驾着小舟要到江河的对岸去，想不到来到中途，无一间脱手失掉了划水用的木桨，虽然江河已经过了一半，若此时遇到了风浪，那将如何是好？我终身本就没有可以携带的东西，若再遭遇灾难，那将是无可奈何的事。","xiangjie":"功名：莫求功名、更变营生。升迁：自始非你、不切实际。事业：兢兢业业、秋风落叶。失物：枉费心机、寻之无益。财利：安贫从善、乐天无险。疾病：速求神力、祈禳救济。婚姻：缘起缘灭、此姻难结。行人：音信杳杳、见面难找。田宅：虫害不熟、田宅多忧。出行：此去有灾、改期安排。店面：辛苦奔忙、家当败光。六甲：多作胎检、多方周全。官讼：久讼必了、新讼不妙。六畜：休养休豢、清闲弹弦。家运：难为丁口、注意水火。求谋：处处乌云、孑然一身。移居：静则安守、迁则忧愁。祖茔：砂水散漫、穴场凌乱。"},{"n":16,"text":"出外须防危、居家常虑愁、求福身多吉、得意也须休。","jie":"出门在外处处要小心，提防危险的发生，即使安居家中也要常常思考着，有什么令人忧愁的是可能会发生。祈求神明赐福，因而得到了各种吉祥与荣耀，虽然心里很高兴快乐，但是一定要停止意气昂扬，四处招摇吹嘘。","xiangjie":"功名：缜密谦冲、扬名有功。升迁：降下荣耀、切莫招摇。事业：细密张罗、喜结佳果。失物：事属徒劳、亡羊补牢。财利：汗财留香、行险难享。疾病：勤礼神明、必脱困境。婚姻：已婚多容、欲婚难从。行人：行人安全、终必团圆。田宅：留心变化、利必可夸。出行：出外防危、无咎无悔。店面：谨慎保守、莫争兴头。六甲：得男欣喜、骄则招忌。官讼：弭讼可期、低调为宜。六畜：细心提防、莫出状况。家运：居安思危、福禄相随。求谋：多面张罗、悄悄结果。移居：百般费心、徒然伤神。祖茔：老坟仍佳、新地莫下。"},{"n":17,"text":"春来逢景秀、登舟汛五湖、一枝波涛浪、庶得贵人扶。","jie":"春天来了，四处都是一片繁华美好的景色，我不想辜负这大好的春光，于是驾着一叶小舟，泛波在五湖四海之上，欣赏着那种璀丽的山光水色。忽然蓦地袭来一股高大的巨浪打在小舟上，我无畏无惧、坚定信念的牢牢稳住舟身才能够幸免于难。这一切都要归功于贵人扶持之力。","xiangjie":"功名：站稳脚步、青云得路。升迁：意志若坚、名题乃迁。事业：方向紧握、无畏无错。失物：多方得助、重归故土。财利：景况大好、投机破耗。疾病：疾病消散、神前拜忏。婚姻：虽有波折、终必合和。行人：偶有小失、见面待时。田宅：景象可喜、暗藏凶机。出行：有惊无险、行止自便。店面：看似繁华、暗探高挂。六甲：先女后男、必有才干。官讼：讼可止息、贵人助力。六畜：偶有疾灾、并无大碍。家运：偶有低潮、终必福到。求谋：再接再厉、贵人提携。移居：先衰后稳、我自屈伸。祖茔：堂局不密、或有压逼。"},{"n":18,"text":"忧感暂销镕、求名得再通、宝财临禄位、常偶主人公。","jie":"烦忧已暂时冰消化解，匿去无踪，那是由于，我所企盼得到的名位已经得到了，其他的事情也一再亨通如意。财宝伴随着职位逐步积聚增加，这应该要常常陪伴着礼敬庇佑我的“主神”恩公，以报答祂的大恩大德。","xiangjie":"功名：垂手可得、名利登科。升迁：升官发财、乐自开怀。事业：蒸蒸日扬、利名俱张。失物：耐心等待、定然回来。财利：源源如泉、勤植福田。疾病：疴瘳远遁、康泰谢神。婚姻：宜室宜家、共赏晚霞。行人：名成利得、不日会合。田宅：田产丰腴、买卖大利。出行：一路景秀、沁怀凉透。店面：开张大吉、人潮不息。六甲：梦麟得真、速报神恩。官讼：总如预期、有事不忌。六畜：六畜兴旺、酬主燃香。家运：丁口得助、眉飞色舞。求谋：神威庇佑、有求必周。移居：落脚安居、事事可取。祖茔：得气得局、蜂屯蚁聚。"},{"n":19,"text":"明月暗云浮、花红一半枯、事惹伤心处、行船莫远进。","jie":"皎洁明亮的月儿被浮云遮蔽，显得黯淡无光。开得火红艳丽的花儿却枯萎了一半，怎能引蜂蝶的青睬关爱？此情此景触动了我脆弱的心灵，不禁悲从心起，再也没有闲情意致欣赏山光水色，因而掉转船头，决定不要再往前挺进到更远的地方。","xiangjie":"功名：功名困踬、另谋技职。升迁：非份莫想、他年留香。事业：乌云满天、如何向前。失物：只怪自身、莫怨他人。财利：打消此念、否则难闲。疾病：速求神佛、消灾解祸。婚姻：此缘非善、断难称赞。行人：流落颠离、会面无期。田宅：谨防病虫、置产不从。出行：谨防有险、速消此念。店面：门可罗雀、回头正确。六甲：六甲女胎、注意防灾。官讼：求和沈潜、莫陷深渊。六畜：疾灾连连、求神消愆。家运：迭有病灾、求神安排。求谋：何需算计、安份守己。移居：气运已过、移居不安。祖茔：漫无遮拦、亡灵不安。"},{"n":20,"text":"月被浮云翳、立宇自分明、或乞阴公佑、何虑不开眉。","jie":"光亮洁净的月儿被浮云遮住了，你还舒适的躲在房里而无法查觉，赶快站到门屏间看看就清清楚楚了。接下来就必须思考要如何扫除翳障，若是想不出办法，那只好虔敬的祈求神明作主，神威显赫又慈悲的“王公祖”一定会为你解冤释结。如此，你又何必担忧眉头紧蹙而舒展不开呢？","xiangjie":"功名：细检缺点、他图历练。升迁：希求渺茫、宽心养望。事业：不利开创、老业多防。失物：物去人安、且多行善。财利：求财宜慎、还须安份。疾病：有病速医、或乞神意。婚姻：久婚有变、新婚勿联。行人：音信渺渺、远去迢迢。田宅：买卖不可、休种黍禾。出行：此行不顺、香火随身。店面：门庭冷清、不知客情。六甲：生女委婉、乞神祈男。官讼：情势有变、乞神化险。六畜：不旺不兴、徒增不宁。家运：已蒙灰尘、虔敬礼神。求谋：乌云已见、谋望难现。移居：不动不移、方是上计。祖茔：龙气渐丧、请神祈禳。"},{"n":21,"text":"红日当门照、缺月再团圆、遇珍须得宝、颇有称心田。","jie":"火红般的太阳当着门照射进入屋内，让人感到寒冬远去，温暖的春天来到。残缺的月亮慢慢地又回复饱满团圆的状态，令人倍感欣喜。每当遇到这种不能长久停留的美好景象，要像得到财宝一样的珍惜，把握此大好时光规划事情的进程。如此，做起事来就能够得心应手，称心如意了。","xiangjie":"功名：一吐晦气、名扬得利。升迁：失而复得、营造气和。事业：渐渐拓张、欢颜久长。失物：耐心等候、必有交差。财利：谷底爬升、心想事成。疾病：大病初醒、痊谢神明。婚姻：佳人有情、白首吹笙。行人：低潮已去、会合欢愉。田宅：禾黍满足、购屋吉助。出行：欢喜欢喜、旅途如意。店面：此店亨通、营利长红。六甲：后生俊彦、香火绵绵。官讼：老讼胜止、新事难治。六畜：低迷不再、把握现在。家运：吉昌安康、丁口昂扬。求谋：策谋望愿、悉听尊便。移居：旧雨新知、络绎而至。祖茔：砂水得运、屈曲得伸。"},{"n":22,"text":"桂林一枝、麦穗两岐、鱼儿入网、燕子来时。","jie":"“桂树”象征功名利禄，进入了桂林只可依才能求取一官一职，不像进入象征财富的禾黍菽田园里，总希望它开出两穗、三穗甚至更多。但不论功名或财富，一定要立定志向，下定决心，孜孜不倦勤奋不怠，就像在江海中撒下了网等待鱼儿入网，只要春天一到，燕子飞来的时候，便可享受丰收的喜悦。","xiangjie":"功名：坚定志向、翌春名扬。升迁：主意坚定、文上有名。事业：多角营运、创业来春。失物：小去大来、何必喊衰。财利：撒网若早、鱼儿难逃。疾病：明春病除、求神作主。婚姻：来春谈亲、必有佳音。行人：行人已动、明春相逢。田宅：此时不宜、且待佳机。出行：景色秀丽、家门安抵。店面：时机未到、多作市调。六甲：巧心细算、明春得男。官讼：多方打点、明春安显。六畜：兴旺有期、春来最宜。家运：勤奋豁达、清而不杂。求谋：耐心等待、佳音必来。移居：多方打听、明春可行。祖茔：堂局兜抱、此地尚好。"},{"n":23,"text":"巧说似有情、自想不知音、灾祸欲离脱、如何得全活。","jie":"任凭你舌粲莲花，如何巧妙的诉说，看起来似乎一切都为了我，对我那么的有情意。可是，我自己仔细想过，并非那么有能力、有才华，有智慧了解你心理的真正意图。现在，我只想脱离灾难与祸患，思考着要如何平平安安的渡过这一辈子。","xiangjie":"功名：此路不通、他路有功。升迁：升迁无望、莫怨莫慌。事业：谨慎小心、创业艰辛。失物：有去无回、庶免灾悔。财利：安份自守、快乐长久。疾病：放宽心胸、疾病无踪。婚姻：多阻多碍、情路阴霾。行人：他乡困顿、会期难论。田宅：禾菽枯萎、买卖不对。出行：远行有险、择期再言。店面：营生多累、伙计反背。六甲：欲求嗣男、敬神行善。官讼：讼事久长、怨悔神伤。六畜：多灾多厄、焦头烂额。家运：凡事低调、灾祸不招。求谋：看似美妙、结果难料。移居：迁之无益、守旧安栖。祖茔：砂水反背、否则斜飞。"},{"n":24,"text":"马走来寻鹿、家道丰盈足、有危无不遂、用财须更远。","jie":"我钟爱的那匹马不知跑那里去了，只好放弃它，退而求其次地找寻一头鹿来陪伴。想不到竟然让我的家业蒸蒸日上，家产丰足资源不虞匮乏，每一次发生危险都能够平安渡过。因此，今后我必须广结善缘，再远的地方也要送钱财去布施、赈济当地的穷苦人家，以感谢上天的恩泽，报答神佛荫佑的功德。","xiangjie":"功名：功名成功、大小利通。升迁：如期如愿、多结善缘。事业：四面八方、处处留香。失物：物去勿忧、小去大酬。财利：财多利远、切勿行险。疾病：病渐好转、布施行善。婚姻：此婚神助、益子旺夫。行人：书信往还、归期延缓。田宅：低买高卖、莫嫌法拍。出行：行程无险、愉悦连连。店面：越久越热、不要弃舍。六甲：男儿兴家、代代不差。官讼：当机立断、久成祸患。六畜：畜产兴旺、家门有光。家运：丁口安祥、大小吉昌。求谋：不愁不悲、所求皆遂。移居：先平后昌、财利满堂。祖茔：勾搭小地、有情有气。"},{"n":25,"text":"鹿走白云间、携琴过远山、忽见仙人面、双手倚栏杆。","jie":"鹿群在霭霭的山岚所形成的重重白云中穿梭奔跑，我携带着一张琴要翻越过远方这座山头，途中恐怕会碰上瘴疠或毒蛇猛兽之类的危险，我应该如何排除这些障碍？正忖度间，忽然看见一张仙人的脸，他的双手倚靠在住居的栏杆上，神态非常的悠闲，让我立刻除掉心头上那一层隐忧，宽心大胆的往前迈进。","xiangjie":"功名：坚定信心、成功降临。升迁：有升就好、何必求高。事业：冲破险峻、功成再进。失物：失物难找、虚无缥缈。财利：钱财安稳、不贪不损。疾病：暗里神佑、勿惧勿忧。婚姻：此婚勿筹、终必白首。行人：行人安好、切莫烦恼。田宅：禾黍稳熟、买卖欠周。出行：此行吉贞、神明随身。店面：店稳得助、贵人暗扶。六甲：生男不难、求神如愿。官讼：老讼将结、新讼速解。六畜：六畜平顺、安好单纯。家运：家运安然、丁口欣欢。求谋：贵人穿梭、低调而过。移居：先平后吉、贵人帮助。祖茔：砂水平常、世代安康。"},{"n":26,"text":"鹿马相逢日、云开月色明、有危今已过、仙花果自成。","jie":"鹿马相逢的日子已经来到，扫除过去所有的低潮与不顺，就像拨开云雾的明月那样的光亮洁净。如今，一切的危厄患难都完全过去了，有如神仙种植的花果，渡过脆弱危险的时期，就会自然成长，乃至开花结果。","xiangjie":"功名：功成名扬、府第生香。升迁：得偿夙愿、宽心展颜。事业：开启新机、前景宏丽。失物：何必劳心、或有佳音。财利：财源利倍、守善财随。疾病：康复在即、静心调息。婚姻：神明牵线、百年姻缘。行人：云消雾散、伊人必安。田宅：买卖田宅、福利自来。出行：旅途愉快、平坦舒泰。店面：营生有益、安居乐利。六甲：六甲生男、承欢旦旦。官讼：止争息讼、事事包容。六畜：六畜兴旺、瘟消疫亡。家运：渐次转佳、安和融洽。求谋：全无妨碍、心宽福来。移居：迁移可行、居之有幸。祖茔：气运已到、荫庇富饶。"},{"n":27,"text":"且做江湖客、劳心自知己、一朝兴巨浪、如玉始光辉。","jie":"我有抱负、有理想，只是目前时运不济，暂且委屈寄身在江湖中行走奔波，如此的劳心劳力，也丝毫不敢忘记自己的使命。有朝一日，时机成熟风起云涌，我将一跃而起，鼓动风潮，引领风骚，成为美玉般绽放出万丈光芒的导航者。","xiangjie":"功名：再接再厉、前途快意。升迁：目前非时、想开无事。事业：来年亨通、南北西东。失物：难再寻回、何必愚追。财利：稍安勿躁、来日大好。疾病：耐心安养、体健身强。婚姻：初期平常、越久越香。行人：浮沉多劳、归程难料。田宅：暂且勿动、他日利宏。出行：此行平平、劳顿无病。店面：耐心经营、他日飞腾。六甲：勤修善行、必得男婴。官讼：欲速不达、新讼必差。六畜：时机未到、自寻烦恼。家运：时下平常、他日昂扬。求谋：劳心劳力、目前无益。移居：时机不对、坚定莫悔。祖茔：且莫惊动、待时亨通。"},{"n":28,"text":"枯木未生花、春来喜气佳、忧多生吉兆、脱落如堪夸。","jie":"我非常担忧这一颗濒临枯萎的树木，不能再开出美丽鲜艳的花朵。于是殷勤的照顾，细心的培育着它。如今，春天来了，到处显出一片欣欣向荣，充满喜气的景象，若非我不死心的坚持下去，付出了那么多的心力，才会呈现一线生机，待其抽出了嫩芽，伸展着技叶，便是值得喝彩称赞的时候。","xiangjie":"功名：忍耐吃苦、必能耀祖。升迁：苦干莫怨、升迁不远。事业：惨澹艰辛、历久弥新。失物：好好想想、物在柜箱。财利：辛苦流汗、必有钱赚。疾病：慢调漫理、康复有期。婚姻：休言放弃、再接再厉。行人：久无鱼雁、春来信见。田宅：禾黍不熟、买卖不周。出行：舟车劳顿、安抵家门。店面：另觅他店、钱财立现。六甲：祈神行善、将有佳男。官讼：滋生事端、纠葛难断。六畜：此时此地、禽畜不宜。家运：坚此百忍、否极泰贞。求谋：多求多磨、要成多修。移居：耐心志坚、否则莫迁。祖茔：老坟勿动、新地无功。"},{"n":29,"text":"社稷里中臣、何须作祸崇、事之若有详、家门大吉昌。","jie":"在国家社会里担任要职的政府官员，不论什么事情都要对老百姓说明白他的处理过程，为什么一定要遮遮掩掩含糊蒙骗，引起老百姓的质疑忿怒，制造一些事端之后，再来弹压、协商、解决，这样才显出自己的重要？才会受到更多的尊敬？如果每一件事情都能向人民交代得清清楚楚，让人民透澈了解而服从信任，那将是国家社会最大的福气。","xiangjie":"功名：事事清楚、佳绩可图。升迁：态度含糊、无人能助。事业：开诚布公、走路有风。失物：去方不明、寻之不应。财利：含糊宠统、且莫心动。疾病：时好时坏、详查病灾。婚姻：心态不真、难结姻亲。行人：音讯断续、会期难取。田宅：地段虽美、益利隐晦。出行：行程晦暗、问明事端。店面：勿买勿开、会有后灾。六甲：生女有望、却非弄璋。官讼：止息无期、新讼啜泣。六畜：气运暧昧、恐招邪崇。家运：勿争勿逞、低调守成。求谋：谋求不清、去留不明。移居：考虑不周、迁之发愁。祖茔：明堂破碎、朱雀斜飞。"},{"n":30,"text":"已有清云至、张船待便风、龙登沧海阔、云雨必相从。","jie":"天边已经飘来一大片的清云，我意识到不久将会刮起一阵大风。于是趁现在赶快拉开船上的帆，轻松自在乘着这一阵大风，驾着船到海上去遨游。风来了，吃得饱满的帆扬起了，就像一条龙，登上了波澜壮阔的沧海中，任意驰骋翻腾着，以致蔚成一股气流，云雨必定也会群起簇拥相随。","xiangjie":"功名：挥洒自如、功名神助。升迁：勿忧勿愁、榜上名留。事业：通路大张、八方顺畅。失物：佳音频催、必将回归。财利：财多利厚、心花朵朵。疾病：佳运吉兆、活龙一条。婚姻：已婚有变、新婚珠联。行人：回程途中、不日可逢。田宅：贵人帮助、买卖得意。出行：一路惬意、喜乐交集。店面：时机成熟、一枝独秀。六甲：喜得男生、家运长亨。官讼：不拘新旧、止讼消愁。六畜：六畜兴旺、轻松利强。家运：家运昌盛、厅堂鸣笙。求谋：事事如愿、敬神酬天。移居：时来运转、迁移大赚。祖茔：天心十道、荫庇富饶。"},{"n":31,"text":"千里掌中正、风生浪不成、扁舟乘兴起、忽觅到蓬瀛。","jie":"我意志非常坚定的掌握着舵，不偏不倚、既中且正的在碧波万顷的大海中航行千里之远，绝对不会受到外界的杂音来干扰我前进的方向。一路行来，只有风吹送着帆往前走，并没有形成大波浪。这种景况令驾着扁舟的我顿时兴致大发，张满帆撑稳舵，尽情地往前深入。忽然间，竟让我发现了人人想找的，传闻中美好的蓬莱仙岛。","xiangjie":"功名：坚定方向、扬名故乡。升迁：不偏不倚、合该是你。事业：向前挺进、拓展有幸。失物：失之小物、收之大畜。财利：左右逢源、莫贪险钱。疾病：良医另取、必有奇遇。婚姻：百年好合、永浴爱河。行人：流连忘返、另泊港湾。田宅：五谷丰登、置产多能。出行：快意风景、此行有庆。店面：经营正派、发财三代。六甲：佳男承天、福祈绵绵。官讼：解除纠葛、心宽气和。六畜：大好机会、随养随肥。家运：积善得昌、殊荣安康。求谋：不贪不苛、所求皆得。移居：眼光不差、将会发达。祖茔：山环水抱、佳茔吉兆。"},{"n":32,"text":"升高禄位呈、祸散福重生、万事皆康泰、吉利保长亨。","jie":"我长期处在忧患、低迷的日子里无所作为，只有心存正念行善积德。正因如此，现在才会高升职位，整个人呈现出神清、气爽的样子。祸患消逝得无影无踪，福禄重新降临到我的身上。不论任何事情皆感到安康与祥和，这一些吉利的状况一定可以让我保持长久的亨通。","xiangjie":"功名：眉飞色舞、功名利禄。升迁：平时勤勉、今日高迁。事业：广开通路、畅行无阻。失物：多想多找、必有好兆。财利：求财利多、开源节流。疾病：意志坚定、祸散福生。婚姻：此婚兴家、长亨不假。行人：行人安好、归程未到。田宅：置产栽种、利基长红。出行：欢乐连连、抵家甜甜。店面：虔心供奉、财亨利通。六甲：供神多般、必招儿男。官讼：无忧无惧、自有乐趣。六畜：瘟遁疫消、六畜逍遥。家运：吉祥康泰、诸事无碍。求谋：加重酬劳、万般周到。移居：无灾无祸、早结善果。祖茔：藏风聚气、亨通益利。"},{"n":33,"text":"喜喜未是喜、喜喜便是喜、等待阳和三月景、桃花树上结成子。","jie":"有时候，虽然你感到非常的欢喜，那并不是真正的欢喜。有时候，你感到非常的欢喜，那却确是有实质欢喜的事。其实，欢喜的虚假与真实，完全取决于事情的明朗清澈或混沌晦暗。那么，等到三月天遍地充满阳和日丽的景象，桃花树上结满了果实的时候，一切事情都会“明朗化”，是不是“空欢喜”一场，到时候自然就会揭晓。","xiangjie":"功名：不倦不厌、功名领先。升迁：得失勿重、平常心胸。事业：谨慎自持、等待天时。失物：去向不明、复归无凭。财利：安居乐守、份外莫求。疾病：病况晦暗、春来再看。婚姻：暂勿决定、多看多听。行人：虽无讯息、三月归期。田宅：白费心机、此时不宜。出行：宜其改期、春复无欺。店面：急躁无用、三思有功。六甲：善多感天、得男夏前。官讼：态势浑沌、且待来春。六畜：暂且悠闲、春后再言。家运：守成为本、凡事多忍。求谋：三月来临、成败在心。移居：且细思量、何苦白忙。祖茔：山水不秀、人工剪修。"},{"n":34,"text":"一事未足、一事未能、蛇生龙角日、离暗出光明。","jie":"现在，没有一件事情，足以证明你的运势已经从谷底翻升；现在，更没有任何一件事情能够说明你已经摆脱低迷忧患的境遇而步入坦途。除非，“蛇生龙角”的日子降临，那才是真正远离黑暗、扫尽阴霾，重见光明，亮丽的美好时光。","xiangjie":"功名：勿气勿馁、他日最美。升迁：耐心筹谋、必好采头。事业：安守营生、万里鹏程。失物：找寻耐心、或有佳音。财利：时机未佳、求财尚差。疾病：病况仍暗、不宜乐观。婚姻：多面交投、再定去留。行人：愿望未酬、会面延后。田宅：仍需观望、小心为上。出行：时间不对、出行有悔。店面：破除假象、勿太仓惶。六甲：细细盘算、得男且缓。官讼：勿喜勿欢、多方查探。六畜：再缓几天、眉开欢颜。家运：多看多察、谨慎兴家。求谋：认真去做、后喜必多。移居：时候未到、此去尚早。祖茔：龙气未到、他年福报。"},{"n":35,"text":"烦心烦心、直到如今、蛇猴相会合、正好改前吟。","jie":"实在是令人感到无比的烦闷，实在是令人感到无比的烦闷。那是因为长期以来，一直到今日，总有过不完的困顿、横逆、忧患、阻隔的日子。这种驳杂、颠沛的际遇必须耐心地等到蛇（巳）猴（申）相会合的日子以后，才能完全摆脱这些低迷的情况，再由谷底翻升，逐渐改变以前痛苦呻吟的声音，而进行顺境、如意、笑逐颜开的欢乐歌唱。","xiangjie":"功名：苦中吃苦、名扬千古。升迁：非其时也、勿怠勿懈。事业：扭转颓势、尚待他时。失物：勿忧勿悔、莫再苦追。财利：切勿心急、日后再议。疾病：宽心畅怀、痊愈早来。婚姻：此时勿决、他日愉悦。行人：徘徊谷底、会面无期。田宅：保守谨慎、多看多审。出行：改期方好、此时太早。店面：老店多忍、新店难存。六甲：生男有望、现今不忙。官讼：黑暗在前、光明不远。六畜：欲求兴旺、三个月光。家运：宽心安守、福禄重酬。求谋：此时不吉、百日再提。移居：此时莫移、安守家计。祖茔：待时得气、必有恩庇。"},{"n":36,"text":"残日西山落、绕天日又昏、屈指伤心处、一日一消魂。","jie":"将到尽处的太阳从西边的山头缓缓沉落下去，绕着天空旋转一整天，现在又到了黄昏的时候。我回顾过去，细数着这一路走来所遭遇到种种不如意及忧愁伤心的事情，每一天至少都会有一次令我失魂落魄的境况。","xiangjie":"功名：功名无望、改弦更张。升迁：不求不想、安份守祥。事业：创业错误、另谋出路。失物：此物不祥、去之何伤。财利：命中无富、安乐知足。疾病：坚心勿懈、求神禳解。婚姻：打消念头、此婚难求。行人：流落失意、忘记归期。田宅：勿买勿卖、勿种勿栽。出行：此行有灾、改期安排。店面：足迹稀少、自寻烦恼。六甲：要求男孩、敬神持斋。官讼：还有得磨、讼海生波。六畜：白费工夫、莫养禽畜。家运：家运有阻、求神作主。求谋：大小不拘、自讨没趣。移居：不清不净、饱受虚惊。祖茔：砂水散漫、不须多看。"},{"n":37,"text":"未足未足、未能未能、残灯对斜月、何处是涂埕。","jie":"直到现在，我吃的苦头还不够，直到现在，我吃的苦头还不够。到了这种地步，还不能摆脱困顿的纠缠，到了这种地步，还不能摆脱困顿的纠缠。面对即将燃尽的油灯，与向西斜下快要下沉的月亮互相对应着，这种枯寂、凄凉的景象，好像一切都几乎要结束。如此情况，什么地方是我的康庄大道呢？什么地方又是我安身立命的所在呢？","xiangjie":"功名：柳暗花明、另辟前程。升迁：耕耘自勤、升迁由神。事业：另谋他就、再缔新猷。失物：一次不够、检点力守。财利：蚀本再借、水中捉月。疾病：若要脱险、另找医院。婚姻：此婚难结、莫再咨嗟。行人：他乡未显、归路多艰。田宅：悠闲自持、莫讨苦吃。出行：行程多阻、切莫自误。店面：另谋他途、不论买租。六甲：香烟难继、诚敬神祗。官讼：遥遥无期、止息无底。六畜：多灾多累、血财无归。家运：神佛法幡、丁口欠安。求谋：难有结果、守份无过。移居：南北东西、劝君莫移。祖茔：囚困阴居、何来堂局"},{"n":38,"text":"渐渐浓云散、看看明日圆、春来逢景秀、雨过得长青。","jie":"遮蔽月亮光华的那一片浓厚的乌云渐渐散开了，可以再一次好好欣赏着清澈、光明、圆圆的满月。这就好像春天来了，大地充满秀丽迷人的景色，也像是大雨过后，到处花草树木被雨水刷洗得洁净光亮，呈现一片绿意盎然、生机逢勃的景象。","xiangjie":"功名：快乐赏樱、金榜题名。升迁：静待发榜、题名勿慌。事业：否极而泰、营收满怀。失物：物失不远、或在眼前。财利：会有斩获、多方斟酌。疾病：病将好转、宽心莫烦。婚姻：雨过天晴、琴瑟和鸣。行人：鱼雁相随、梢信回归。田宅：现买现赚、莫再拖延。出行：此番可行、前途怡情。店面：时机已到、营生安好。六甲：生男菁英、拜神虔诚。官讼：止息无灾、好不快哉。六畜：牲畜禽迎、大好前程。家运：浑沌出开、细心福来。求谋：见散阴霾、求谋得彩。移居：初沾福禄、畅行无阻。祖茔：龙运得气、阴灵有依。"},{"n":39,"text":"一只仙家鹤、笼中养数年、今朝终放出、直去上青天。","jie":"在山上修真练道的仙人，家里有一只白鹤，关在笼中饲养了很多年，今天早上终于把它放出去，这一只白鹤就展翅高飞，飞上浩瀚无边的天际去。","xiangjie":"功名：海阔天空、功高名隆。升迁：希望多年、如愿冲天。事业：技术高超、利广名高。失物：远去幽幽、难再回头。财利：生涯无限、财利倍前。疾病：恐不保命、速求神明。婚姻：半途分道、难以偕老。行人：去之已远、讯息难牵。田宅：禾黍超收、买卖多谋。出行：通畅无阻、笑颜于途。店面：客如长龙、久久争锋。六甲：产检安胎、男儿多才。官讼：恢复自由、远离烦忧。六畜：六畜虽优、要防失脱。家运：扬眉吐气、天天欢喜。求谋：难以如愿、鸟飞在天。移居：振翅高飞、利乐展眉。祖茔：龙真穴正、儿孙长亨。"},{"n":40,"text":"本道复无双、神光庇福厚、只害不相干、身在长生路。","jie":"再也找不到第二座庙宇和广应庙一样，如此悉心详细的为天下黎民百姓解忧除惑，广应庙里的神明法力无边，神威显赫，光芒泽被庇荫苍生得到高厚的福禄。只是最担忧有些人民认为广应庙也好、神明也罢，都和他(她)们毫不相干，因为他(她)们正处在兴旺、得意、昌盛、上升的路途中。","xiangjie":"功名：虔诚供奉、扬名成功。升迁：神光不缺、加官晋爵。事业：神通广大、四通八达。失物：乞求神威、勿失复归。财利：无限生涯、神助有加。疾病：神威显赫、驱病可贺。婚姻：求神指引、相爱相亲。行人：留连在途、速求神助。田宅：敬拜神祗、田宅富丽。出行：或乞香火、此行无祸。店面：若不信神、开店多嗔。六甲：求神恩赐、六甲男嗣。官讼：谁能止讼、谢府王公。六畜：乞求王公、六畜亨通。家运：欲兴欲昌、广应庙堂。求谋：畏神敬神、自有贵人。移居：神庇福厚、敬谢再求。祖茔：起伏顿跌、神助妥贴。"},{"n":41,"text":"休说休说、无分无别、挨事来年、水中捉月。","jie":"做什么事情都要先拟定计划，订定时间表，然后再依表定时间按步就班、循序渐进，不要一想到要做什么事情就四处宜说个没完没了。不论大小事都完全一样，没有丝毫分别，否则，“光说不练”的一直拖，拖到明年，明年又有无数个明年，那么，成功就有如水中捉月般的虚幻而毫无实际意义了。","xiangjie":"功名：剑及履及、功名可期。升迁：行动就得、拖则分隔。事业：莫再蹉跎、奋力可搏。失物：时间已过、寻也难获。财利：多方筹备、利通南北。疾病：珍惜性命、速求神明。婚姻：少说多为、中意可追。行人：无音无信、流落至今。田宅：多看多听、财利盈盈。出行：今年平静、来年难行。店面：见好就做、获利必多。六甲：今年生男、再拖困难。官讼：能和就和、拖则干戈。六畜：马上进行、明年疫情。家运：振衰起蔽、再造亮丽。求谋：立刻张罗、再等差错。移居：美景当前、迟滞难圆。祖茔：毫无剥换、更无弯环。"},{"n":42,"text":"愁心愁心、直到如今、若逢龙虎会、方好改前吟。","jie":"我实在感到非常的忧郁沉闷，我实在感到非常的忧郁沉闷。长期以来，一直到现在，运势完全处于下滑的轨道中，做任何事情都不能得心应手，甚至阻碍重重。假如能够等到龙虎相会的日子来临，才能改善这种情况，反向回复在上升趋势中，而吟唱出如意、顺利、欢乐的声音。","xiangjie":"功名：加足马力、登科可期。升迁：默默付出、明年神助。事业：旧业将兴、新创不行。失物：物已远逃、亡羊补牢。财利：安守本分、额外莫问。疾病：笑脸常现、春来体健。婚姻：久婚将合、新婚不可。行人：随波逐流、壮志未酬。田宅：再看再等、成本可省。出行：行程愁闷、安抵家门。店面：老店将发、新店不达。六甲：愁心将平、明春男婴。官讼：久讼无祸、新讼多磨。六畜：暂且偷闲、莫冒风险。家运：再忍一下、前景转佳。求谋：久未如愿、明春可圆。移居：有志难伸、尚待来春。祖茔：砂水有破、气运未过。"},{"n":43,"text":"好笑好笑、作事颠倒、临危不危、反成吉兆。","jie":"实在觉得很好笑，实在觉得很好笑，做起事来怎么都不按部就班，照着事情的既定常态，次第循序而进，却反其道而行，颠倒地由反方向逆势而为。眼看着将要面临阻碍的困境时，即能巧妙的避开而没有发生任何危难。这种操作方式有时反而是一种化凶为吉、转危为安、解厄呈祥的征兆。","xiangjie":"功名：冷门科系、成功之基。升迁：不争不吵、自然叫好。事业：知所变更、奇兵制胜。失物：不可能处、找寻可出。财利：众人追利、我要公益。疾病：久病换医、新病调理。婚姻：小吵小闹、白首到老。行人：他乡优游、近况全周。田宅：低迷买进、利润可亲。出行：快乐出航、喜乐多添。店面：冬天卖扇、夏天裘毡。六甲：香火嗣续、男儿可取。官讼：不按牌理、反而可喜。六畜：众人皆怕、我独多加。家运：谦冲为怀、好运就来。求谋：逆势而为、吉祥不退。移居：人言不可、移之登科。祖茔：逆水一滴、胜龙千里。"},{"n":44,"text":"玉石未分时、忧心转更速、前途通大道、花开发前枝。","jie":"美玉和顽石还不能清晰分辨明白的时刻，忧心烦闷交织着急躁的心情，快速涌上脑海而蒙蔽心智，以致迷失了认辩“升、降”的方向与法则。其实，凡事皆有其一贯的脉络可循，只要依据常态运行轨迹按图索骥，仔细观察详审，便可轻易的判定接下来应该要进行的途径。如此，前方就是通往畅行无阻的康庄大道，就好像美丽的花朵，总是从伸展到外围前头的枝叶优先绽放出芳香的蓓蕾。","xiangjie":"功名：重新审度、必有神助。升迁：依循脉络、宽心快活。事业：冷静冷静、福至心灵。失物：再思再想、物不离箱。财利：好坏未明、暂勿作声。疾病：再审病势、严防闪失。婚姻：暂且搁下、他日再洽。行人：萍梗无踪、何日可逢。田宅：度势审情、大力经营。出行：多方打听、方可免惊。店面：市场需要、获利必高。六甲：得失太重、不可盲从。官讼：审势攻防、胜算可彰。六畜：价格好坏、趋势安排。家运：升降分别、掌握前程。求谋：事若要成、找其特征。移居：烦忧勿迁、喜移得钱。祖茔：四兽无缺、便是好穴。"},{"n":45,"text":"玉仙一春梅、独占百花魁、清香犹未喷、仙子作归回。","jie":"玉仙种植了一珠春梅，这一珠春梅是百花中最特殊最与众不同的春梅。可是，玉仙还没有能够来得及等到这一珠春梅开放出美丽的花朵，品闻享受它芬芳的清香佳味，玉仙已准备好要回到深山，祂修道的洞府中去。","xiangjie":"功名：功名难着、作书立说。升迁：辛苦有份、升迁无门。事业：苦心孤诣、终无大利。失物：白费心机、回归无期。财利：时机未助、难得好处。疾病：百般慰藉、祇神禳解。婚姻：难结连理、途中分歧。行人：他乡苦劳、会期将到。田宅：辛苦田禾、他人收割。出行：行程无味、安抵家内。店面：虚渡光阴、转换从新。六甲：有时自有、莫要强求。官讼：缠讼经年、有苦无甜。六畜：能闲就闲、忧烦无钱。家运：辛苦付出、莫问前途。求谋：顺其自然、守分心安。移居：慎重考虑、何须迁居。祖茔：明堂周密、扦作假地。"},{"n":46,"text":"卦中遇贵人、求谋渐已成、更变文书吉、百福自来迎。","jie":"你到广应庙来求取一支灵签，签文中明白指示必有贵人扶持，因此你就放胆努力去做。现在，你的愿望和筹划的事情都逐渐濒临验收美好结果的阶段。但是，你不可因而疏于防范、失掉戒心，应该更加缜密的审视企划书上是否仍有瑕疵需要更改？或者是否有修改得更加完美的空间？能如此的管控每一部份的细节，最后必然就能收成甜美的果实，众多的福禄吉祥自然而然的来迎接你。","xiangjie":"功名：再三验证、功名荣登。升迁：宽心勿猜、文到喜哉。事业：时时警觉、亨通不绝。失物：再次思索、或有结果。财利：小心为上、益利得偿。疾病：贵人帮扶、灾病尽除。婚姻：相敬如宾、百年相亲。行人：得意将回、多财来归。田宅：琢磨越深、获利越真。出行：无虑无忧、快乐优游。店面：大胆去做、细心利多。六甲：贵人送子、敬神孜孜。官讼：防范文书、终必胜出。六畜：细加检点、兴旺年年。家运：改善缺点、福禄年年。求谋：贵人得力、事事如意。移居：最后再变、贺喜此签。祖茔：鹤膝蜂腰、贵人远朝。"},{"n":47,"text":"改变出尘埃、登江绿水清、诗书从速降、终得贵人扶。","jie":"我打算改变以前积极参与人世间种种公共事务的态度，远离江湖中烦嚣的风风雨雨，抖落身上忒多的红尘埃垢。于是，我登上了江岸，望着绿色的滔滔江水悠悠缓缓而下，是那样的沉静，那样的清澈透底。一时之间，我便把所研读过的诗书，探究过的技术、艺文等等脑海中的东西全部放下，让它一一沉淀，暂且放空自己。蓦地，眼前灵光一现，心中豁然开朗，好像突然间获得贵人帮助似的，我完全看清了一切，了解所有事情的真相。","xiangjie":"功名：勤拭心镜、功名必成。升迁：得失太深、反难称心。事业：适度放空、利乐无穷。失物：万般虚幻、去留何欢。财利：沉静心灵、获利丰盈。疾病：空无一念、日久病痊。婚姻：怨恋沉淀、自有家眷。行人：若能看开、伊人自来。田宅：抛开贪痴、获利不迟。出行：莫杂他念、尽情无险。店面：莫惹尘埃、八方来财。六甲：打破痴迷、生男神庇。官讼：重整头绪、胜出定局。六畜：若要兴旺、切莫慌张。家运：勤修心肠、家运德昌。求谋：托人无用、沉静有功。移居：远离烦嚣、昌盛逍遥。祖茔：水清砂秀、富贵悠久。"},{"n":48,"text":"远行有所造、往可百安宁、平生待敬奉、改得亦将成。","jie":"你为了出远门的事寝食难安，所以才造访广应庙祈求众神庇护你此去平安。现在你可以放心的去，不但一路顺风，而且到达彼方地头之后，也会诸事顺利、吉祥如祥。平常，你对供奉神明的事莫不关心，甚至自己都要受人服侍恭奉。如今，你渐渐的在省悟、学习，快要将以前那些不良的态度完全改变过来。","xiangjie":"功名：扬名四海、乐心开怀。升迁：实至名归、财官相随。事业：海外亨通、利益长红。失物：物去人安、运吉心宽。财利：多多益善、财利如山。疾病：寂瘳远遁、气血通顺。婚姻：佳偶难得、百年好合。行人：得意谦冲、不久相逢。田宅：田禾宅厝、价得佳作。出行：柳绿花红、沿途轻松。店面：生意兴隆、车水马龙。六甲：六甲得男、世代承欢。官讼：两造无猜、笑逐颜开。六畜：六畜兴旺、光辉厅堂。家运：吉利安祥、丁口健康。求谋：事无大小、吉利消遥。移居：此去荣昌、诸事呈祥。祖茔：千里来龙、到头现踪。"},{"n":49,"text":"莫用四十九、变化亦难求、鸾凤相交战、独占六鳌头。","jie":"第四十九首的灵签不可以使用，求得此灵签而使用的人将会诸事坎坷，无法顺畅如意。即使运用变化的手段来规避凶祸，或在使用过程中，以其他方法寻求补助、救济，都无法达到目的。此如同夫妻之间，自结缡起一直吵吵闹闹、争执不休，其严重的情况是六甲生命人之中独一无二居于首位，没有一对夫妻能出其右者，这种境遇就是使用此签的后果。","xiangjie":"功名：速改科系、否则落第。升迁：勿气勿悔、管他升谁。事业：改行转图、另谋生路。失物：去之杳杳、万人难找。财利：安贫得助、要吃头路。疾病：安心烧香、请神解禳。婚姻：此婚暗淡、不如不谈。行人：流落沉沦、敬佛求神。田宅：何利之有、买卖添愁。出行：安守家中、莫找伤痛。店面：开店几天、忧愁频添。六甲：何用执着、男女皆妥。官讼：莫问官讼、新旧难终。六畜：瘟疫多灾、可叹血财。家运：鸡犬不宁、速请神令。求谋：此签真灵、求谋不行。移居：万万不可、原居勿革。祖茔：误用此地、阴灵悲泣。"},{"n":50,"text":"将相本无种、帝王自有真、来意若不诚、添油重三斤。","jie":"武将文相从来都没有父传子的世袭制度，皇帝、王爷就真正会“万世一系”的传承下去。但不论是何等身份的人，一旦踏进广应庙来求取灵签，若是没有怀着诚心诚意的“至诚”态度，就要处罚添加三斤重量的灯油钱。","xiangjie":"功名：眉飞色舞、功名利禄。升迁：平时勤勉、今日高迁。事业：广开通路、畅行无阻。失物：多想多找、必有好兆。财利：求财利多、开源节流。疾病：意志坚定、祸散福生。婚姻：此婚兴家、长亨不假。行人：行人安好、归程未到。田宅：置产栽种、利基长红。出行：欢乐连连、抵家甜甜。店面：虔心供奉、财亨利通。六甲：供神多般、必招儿男。官讼：无忧无惧、自有乐趣。六畜：瘟遁疫消、六畜逍遥。家运：吉祥康泰、诸事无碍。求谋：加重酬劳、万般周到。移居：无灾无祸、早结善果。祖茔：藏风聚气、亨通益利。"}];

  var drawBtn = document.getElementById("drawBtn");
  var againBtn = document.getElementById("againBtn");
  var copyBtn = document.getElementById("copyBtn");
  var allToggle = document.getElementById("allToggle");
  var allList = document.getElementById("allList");
  var qianStage = document.getElementById("qianStage");
  var resultCard = document.getElementById("resultCard");
  var resNo = document.getElementById("resNo");
  var resName = document.getElementById("resName");
  var resJi = document.getElementById("resJi");
  var resPoem = document.getElementById("resPoem");
  var resJie = document.getElementById("resJie");
  var resExtra = document.getElementById("resExtra");
  var drawing = false;
  var lastText = "";

  function jiLevel(ji) {
    var s = String(ji || "").replace(/^\s+|\s+$/g, "");
    if (!s) return "";
    if (s.indexOf("下") !== -1 || s.indexOf("凶") !== -1) return "down";
    if (s.indexOf("中") !== -1) return "mid";
    if (s.indexOf("上") !== -1 || s.indexOf("大") !== -1) return "up";
    return "mid";
  }

  function makeJiBadge(ji) {
    var span = document.createElement("span");
    span.className = "ji-badge jl-" + jiLevel(ji);
    span.textContent = ji;
    return span;
  }

  function clearChildren(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
  }

  function normalize(q) {
    var n = {
      no: q.no || CFG.noLabel + q.n + CFG.noSuffix,
      name: CFG.nameField ? (q[CFG.nameField] || "") : "",
      ji: CFG.jiField ? (q[CFG.jiField] || "") : "",
      poem: CFG.poemField ? (q[CFG.poemField] || "") : "",
      jie: CFG.jieField ? (q[CFG.jieField] || "") : "",
      extra: []
    };
    for (var i = 0; i < CFG.extra.length; i++) {
      var e = CFG.extra[i];
      if (q[e.key]) n.extra.push({ label: e.label, value: q[e.key] });
    }
    return n;
  }

  function buildText(q) {
    var lines = [CFG.name + " · " + q.no];
    if (q.name) lines.push(q.name);
    if (q.ji) lines.push(q.ji);
    if (q.poem) lines.push(CFG.poemLabel + t('ui.colon','：') + q.poem);
    if (q.jie) lines.push(CFG.jieLabel + t('ui.colon','：') + q.jie);
    for (var i = 0; i < q.extra.length; i++) lines.push(q.extra[i].label + t('ui.colon','：') + q.extra[i].value);
    return lines.join("\n");
  }

  function showResult(q) {
    resNo.textContent = q.no;
    resName.style.display = q.name ? "" : "none";
    resName.textContent = q.name;
    clearChildren(resJi);
    if (q.ji) {
      var b = makeJiBadge(q.ji);
      if (b) resJi.appendChild(b);
    }
    resPoem.style.display = q.poem ? "" : "none";
    resPoem.textContent = q.poem;
    resJie.style.display = q.jie ? "" : "none";
    resJie.textContent = q.jie ? CFG.jieLabel + t('ui.colon','：') + q.jie : "";
    clearChildren(resExtra);
    for (var i = 0; i < q.extra.length; i++) {
      var line = document.createElement("div");
      line.className = "qian-extra-line";
      line.textContent = q.extra[i].label + t('ui.colon','：') + q.extra[i].value;
      resExtra.appendChild(line);
    }
    resultCard.style.display = "block";
    resultCard.classList.remove("show");
    void resultCard.offsetWidth;
    resultCard.classList.add("show");
    lastText = buildText(q);
  }

  function startDraw() {
    if (drawing) return;
    if (!QIAN || !QIAN.length) {
      setStatus(t('ui.100','签文数据为空，无法抽签'), "error");
      return;
    }
    drawing = true;
    drawBtn.textContent = t('ui.102','抽签中...');
    drawBtn.disabled = true;
    resultCard.style.display = "none";
    resultCard.classList.remove("show");
    qianStage.classList.remove("drawing", "drawn");
    void qianStage.offsetWidth;
    qianStage.classList.add("drawing");
    var picked = QIAN[Math.floor(Math.random() * QIAN.length)];
    setTimeout(function () {
      qianStage.classList.remove("drawing");
      qianStage.classList.add("drawn");
      drawBtn.textContent = t('ui.103','开始抽签');
      drawBtn.disabled = false;
      drawing = false;
      showResult(normalize(picked));
    }, 2600);
  }

  drawBtn.addEventListener("click", startDraw);
  againBtn.addEventListener("click", startDraw);

  copyBtn.addEventListener("click", function () {
    if (!lastText) return;
    copyToClipboard(lastText, copyBtn);
    setStatus(t('ui.101','结果已复制到剪贴板'));
  });

  allToggle.addEventListener("click", function () {
    var open = allList.style.display !== "none";
    allList.style.display = open ? "none" : "block";
    allToggle.textContent = open ? t('ui.viewAllSigns','查看全部签文') : t('ui.hideAllSigns','收起全部签文');
  });

  (function buildAll() {
    for (var i = 0; i < QIAN.length; i++) {
      var q = normalize(QIAN[i]);
      var row = document.createElement("div");
      row.className = "all-row";
      var head = document.createElement("button");
      head.type = "button";
      head.className = "all-head";
      var noSpan = document.createElement("span");
      noSpan.className = "all-no";
      noSpan.textContent = q.no;
      head.appendChild(noSpan);
      if (q.ji) {
        var b = makeJiBadge(q.ji);
        if (b) head.appendChild(b);
      }
      var poemSpan = document.createElement("span");
      poemSpan.className = "all-poem";
      poemSpan.textContent = q.poem || q.name || q.jie;
      head.appendChild(poemSpan);
      var body = document.createElement("div");
      body.className = "all-body";
      var p = document.createElement("div");
      p.className = "all-poem-full";
      p.textContent = q.poem || q.name;
      body.appendChild(p);
      if (q.jie) {
        var j = document.createElement("div");
        j.className = "all-jie";
        j.textContent = CFG.jieLabel + t('ui.colon','：') + q.jie;
        body.appendChild(j);
      }
      for (var k = 0; k < q.extra.length; k++) {
        var line = document.createElement("div");
        line.className = "all-jie";
        line.textContent = q.extra[k].label + t('ui.colon','：') + q.extra[k].value;
        body.appendChild(line);
      }
      row.appendChild(head);
      row.appendChild(body);
      (function (r) {
        head.addEventListener("click", function () { r.classList.toggle("open"); });
      })(row);
      allList.appendChild(row);
    }
  })();
})();
  </script>
</body>
</html>
