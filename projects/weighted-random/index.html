<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>加权随机选择器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <style>
    .wr-row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-1); }
    .wr-row .row-index { width: 24px; color: var(--color-text-secondary); font-size: var(--font-size-sm); text-align: right; }
    .wr-row .name-input { flex: 1; min-width: 120px; }
    .wr-row .weight-input { width: 110px; font-family: var(--font-mono); }
    .wr-head { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-1); }
    .wr-head .h1 { font-size: var(--font-size-sm); color: var(--color-text-secondary); }
    .wr-head .h1:nth-child(2) { flex: 1; }
    .draw-row { margin-top: var(--space-2); display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
    .hit-box { font-size: var(--font-size-xl); font-weight: bold; color: var(--color-text-primary); padding: var(--space-2); background: var(--color-bg-soft); border-radius: var(--radius-md); min-width: 200px; text-align: center; }
    .res-label { font-size: var(--font-size-sm); color: var(--color-text-secondary); display: block; margin-top: var(--space-3); margin-bottom: var(--space-1); }
    .bar-item { margin-bottom: var(--space-2); }
    .bar-label { font-size: var(--font-size-sm); color: var(--color-text-secondary); display: flex; justify-content: space-between; margin-bottom: 4px; }
    .bar-track { background: var(--color-bg-soft); border-radius: var(--radius-sm); height: 14px; overflow: hidden; }
    .bar-fill { background: var(--color-accent); height: 100%; border-radius: var(--radius-sm); }
    .hist-list { display: flex; gap: var(--space-1); flex-wrap: wrap; }
    .hist-item { font-size: var(--font-size-sm); background: var(--color-bg-soft); border-radius: var(--radius-sm); padding: 4px 10px; color: var(--color-text-primary); }
  </style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
    <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a>
  </header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">加权随机选择器</h1>
    <p class="tool-desc" data-i18n="desc">为每个选项设定权重，用轮盘算法抽取一个命中项，并展示概率分布与抽取历史。</p>
    <div class="card">
      <div class="wr-head">
        <span class="h1">选项名</span>
        <span class="h1">权重</span>
        <span class="h1"></span>
      </div>
      <div id="rowsBox"></div>
      <button class="btn btn-secondary" id="addBtn">+ 添加选项</button>
      <div class="draw-row">
        <button class="btn btn-primary" id="drawBtn">抽取一次</button>
        <div class="hit-box" id="hitBox">—</div>
      </div>
    </div>
    <div id="resultBox" class="output-box">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div>S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script>
    (function () {
      var rowsBox = document.getElementById('rowsBox');
      var addBtn = document.getElementById('addBtn');
      var drawBtn = document.getElementById('drawBtn');
      var hitBox = document.getElementById('hitBox');
      var outputText = document.getElementById('outputText');
      var copyBtn = document.getElementById('copyBtn');
      var rowCount = 0;
      var history = [];

      function addRow(name, weight, focusFirst) {
        rowCount++;
        var row = document.createElement('div');
        row.className = 'wr-row';
        var idx = document.createElement('span');
        idx.className = 'row-index';
        idx.textContent = String(rowCount);
        var nInput = document.createElement('input');
        nInput.type = 'text';
        nInput.className = focusFirst ? 'input name-input js-focus-input' : 'input name-input';
        nInput.placeholder = '选项名';
        if (name !== undefined) {
          nInput.value = name;
        }
        var wInput = document.createElement('input');
        wInput.type = 'text';
        wInput.className = 'input weight-input';
        wInput.placeholder = '权重';
        if (weight !== undefined) {
          wInput.value = weight;
        }
        var delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'btn btn-secondary';
        delBtn.textContent = '删除';
        delBtn.style.padding = '6px 10px';
        delBtn.addEventListener('click', function () {
          rowsBox.removeChild(row);
          reindex();
          render();
        });
        row.appendChild(idx);
        row.appendChild(nInput);
        row.appendChild(wInput);
        row.appendChild(delBtn);
        rowsBox.appendChild(row);
        nInput.addEventListener('input', render);
        wInput.addEventListener('input', render);
        return nInput;
      }

      function reindex() {
        var rows = rowsBox.querySelectorAll('.wr-row');
        for (var i = 0; i < rows.length; i++) {
          rows[i].querySelector('.row-index').textContent = String(i + 1);
        }
      }

      function collect() {
        var rows = rowsBox.querySelectorAll('.wr-row');
        var items = [];
        var filled = false;
        for (var i = 0; i < rows.length; i++) {
          var inputs = rows[i].querySelectorAll('input');
          var ns = inputs[0].value.trim();
          var ws = inputs[1].value.trim();
          if (ns === '' && ws === '') {
            continue;
          }
          filled = true;
          if (ns === '') {
            return { error: '第 ' + (i + 1) + ' 行的选项名为空' };
          }
          if (!/^\d+(\.\d+)?$/.test(ws)) {
            return { error: '第 ' + (i + 1) + ' 行的权重必须是正数' };
          }
          var w = parseFloat(ws);
          if (w <= 0) {
            return { error: '第 ' + (i + 1) + ' 行的权重必须大于 0' };
          }
          items.push({ name: ns, w: w, idx: i + 1 });
        }
        if (!filled) {
          return { empty: true };
        }
        return { items: items };
      }

      function fmt(v) {
        return String(Math.round(v * 100) / 100);
      }

      function render() {
        var data = collect();
        if (data.empty) {
          outputText.innerHTML = '';
          setStatus('');
          return;
        }
        if (data.error) {
          setStatus(data.error, 'error');
          return;
        }
        var items = data.items;
        var total = 0;
        for (var i = 0; i < items.length; i++) {
          total += items[i].w;
        }
        var html = '';
        html += '<span class="res-label">各选项概率分布</span>';
        for (var j = 0; j < items.length; j++) {
          var pct = items[j].w / total * 100;
          html += '<div class="bar-item">';
          html += '<div class="bar-label"><span>' + htmlEscape(items[j].name) + '</span><span>' + htmlEscape(fmt(pct)) + '%</span></div>';
          html += '<div class="bar-track"><div class="bar-fill" style="width:' + Math.min(pct, 100) + '%;"></div></div>';
          html += '</div>';
        }
        if (history.length > 0) {
          html += '<span class="res-label">抽取历史（最近 ' + history.length + ' 次）</span>';
          html += '<div class="hist-list">';
          for (var k = 0; k < history.length; k++) {
            html += '<span class="hist-item">#' + history[k].no + ' ' + htmlEscape(history[k].name) + '</span>';
          }
          html += '</div>';
        }
        outputText.innerHTML = html;
      }

      function draw() {
        var data = collect();
        if (data.empty) {
          setStatus('请先添加选项', 'error');
          return;
        }
        if (data.error) {
          setStatus(data.error, 'error');
          return;
        }
        var items = data.items;
        var total = 0;
        for (var i = 0; i < items.length; i++) {
          total += items[i].w;
        }
        var r = Math.random() * total;
        var cum = 0;
        var picked = items[items.length - 1];
        for (var j = 0; j < items.length; j++) {
          cum += items[j].w;
          if (r < cum) {
            picked = items[j];
            break;
          }
        }
        history.unshift({ no: history.length + 1, name: picked.name });
        history = history.slice(0, 10);
        for (var k = 0; k < history.length; k++) {
          history[k].no = k + 1;
        }
        hitBox.textContent = picked.name;
        setStatus('已抽取：' + picked.name);
        render();
      }

      addRow('选项 A', '1', true);
      addRow('选项 B', '2');
      addRow('选项 C', '3');
      addBtn.addEventListener('click', function () {
        addRow();
        render();
      });
      drawBtn.addEventListener('click', draw);
      copyBtn.addEventListener('click', function () {
        copyToClipboard(outputText.textContent.replace(/\s+/g, ' ').trim(), copyBtn);
      });
      render();
    })();
  </script>
</body>
</html>
