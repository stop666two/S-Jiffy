<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XML 格式化器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
<style>
.tool-row{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
.error-detail{font-size:13px;padding:8px 12px;border-radius:var(--radius-sm);margin-top:8px;background:rgba(159,47,45,0.08);border:1px solid rgba(159,47,45,0.35);color:var(--color-error);white-space:pre-wrap;display:none;}
.success-detail{font-size:13px;padding:8px 12px;border-radius:var(--radius-sm);margin-top:8px;background:rgba(52,101,56,0.08);border:1px solid rgba(52,101,56,0.35);color:var(--color-success);display:none;}
.sub-label{display:block;font-size:var(--font-size-sm);color:var(--color-text-secondary);margin-bottom:8px;}
</style>
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
  <select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
  <main class="tool-workspace">
    <h1 data-i18n="h1">XML 格式化器</h1>
    <p class="tool-desc" data-i18n="desc">格式化、压缩与验证 XML 数据，支持嵌套元素、属性、CDATA 与处理指令。</p>
    <div class="card">
      <label class="sub-label" data-i18n="inputXml">输入XML</label>
      <textarea id="inputText" class="input textarea js-focus-input" placeholder='<root><item id="1"><name>测试</name></item></root>' style="min-height:200px;"></textarea>
      <div id="errorDetail" class="error-detail"></div>
      <div id="successDetail" class="success-detail"></div>
    </div>
    <div class="tool-row">
      <button id="formatBtn" class="btn btn-primary" data-i18n="formatXml">格式化XML</button>
      <button id="minifyBtn" class="btn btn-secondary">压缩</button>
      <button id="validateBtn" class="btn btn-secondary" data-i18n="validateXml">验证XML</button>
      <button id="clearBtn" class="btn btn-secondary">清空</button>
    </div>
    <div class="output-box" id="outputContainer">
      <span id="outputText" style="display:block;padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div data-i18n="common.footer">S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script>
    (function () {
      'use strict';
      var inputEl = document.getElementById('inputText');
      var outputEl = document.getElementById('outputText');
      var errorDetail = document.getElementById('errorDetail');
      var successDetail = document.getElementById('successDetail');

      function hideDetail(){
        errorDetail.style.display='none';
        successDetail.style.display='none';
      }

      function validateXml(xml){
        var parser = new DOMParser();
        var doc = parser.parseFromString(xml, 'text/xml');
        var parseError = doc.querySelector('parsererror');
        if (parseError) {
          var msg = parseError.textContent || '';
          var lineMatch = msg.match(/line\s*(\d+)/i);
          var colMatch = msg.match(/column\s*(\d+)/i);
          return { valid: false, error: msg.trim(), line: lineMatch ? lineMatch[1] : null, col: colMatch ? colMatch[1] : null };
        }
        return { valid: true, doc: doc };
      }

      function formatXmlString(str){
        var tokens = [];
        var re = /<[^>]+>/g;
        var last = 0;
        var m;
        while ((m = re.exec(str)) !== null) {
          if (m.index > last) {
            var text = str.slice(last, m.index).trim();
            if (text !== '') tokens.push({ type: 'text', value: text });
          }
          tokens.push({ type: 'tag', value: m[0] });
          last = re.lastIndex;
        }
        var tail = str.slice(last).trim();
        if (tail !== '') tokens.push({ type: 'text', value: tail });
        var indent = 0;
        var result = [];
        var pad = '  ';
        for (var i = 0; i < tokens.length; i++) {
          var tok = tokens[i];
          if (tok.type === 'text') {
            result.push(pad.repeat(indent) + tok.value);
            continue;
          }
          var tag = tok.value;
          if (tag.indexOf('<?') === 0 || tag.indexOf('<!--') === 0 || tag.indexOf('<![CDATA[') === 0 || tag.indexOf('<!DOCTYPE') === 0) {
            result.push(pad.repeat(indent) + tag);
            continue;
          }
          var isClosing = tag.indexOf('</') === 0;
          var isSelfClosing = tag.slice(-2) === '/>';
          if (isClosing) indent--;
          if (!isClosing && !isSelfClosing && tokens[i + 1] && tokens[i + 1].type === 'text' && tokens[i + 2] && tokens[i + 2].type === 'tag' && tokens[i + 2].value.indexOf('</') === 0) {
            var openName = tag.slice(1, tag.length - 1).split(/\s+/)[0];
            var closeName = tokens[i + 2].value.slice(2, -1).trim();
            if (openName === closeName) {
              result.push(pad.repeat(Math.max(0, indent)) + tag + tokens[i + 1].value + tokens[i + 2].value);
              i += 2;
              continue;
            }
          }
          result.push(pad.repeat(Math.max(0, indent)) + tag);
          if (!isClosing && !isSelfClosing) indent++;
        }
        return result.join('\n');
      }

      function formatXml(xml, minify){
        var res = validateXml(xml);
        if (!res.valid) throw new Error(res.error);
        var serializer = new XMLSerializer();
        if (minify) return serializer.serializeToString(res.doc);
        return formatXmlString(serializer.serializeToString(res.doc));
      }

      function process(mode){
        var text = inputEl.value.trim();
        hideDetail();
        if (!text) { outputEl.textContent=''; setStatus(t('emptyInput','请输入 XML'),'error'); return; }
        try {
          if (mode === 'validate') {
            var res = validateXml(text);
            if (res.valid) {
              outputEl.textContent = '';
              successDetail.innerHTML = '✔ ' + t('validXml','有效 XML');
              successDetail.style.display = 'block';
              setStatus(t('validXml','有效 XML'));
            } else {
              outputEl.textContent = '';
              var lineInfo = '';
              if (res.line) lineInfo = '（line ' + res.line + (res.col ? ', column ' + res.col : '') + '）';
              errorDetail.innerHTML = t('invalidXml','无效 XML') + lineInfo + '<br>' + htmlEscape(res.error);
              errorDetail.style.display = 'block';
              setStatus(t('invalidXml','无效 XML'),'error');
            }
            return;
          }
          outputEl.textContent = formatXml(text, mode === 'minify');
          setStatus('');
        } catch (e) {
          outputEl.textContent = '';
          errorDetail.innerHTML = t('invalidXml','无效 XML') + ': ' + htmlEscape(e.message);
          errorDetail.style.display = 'block';
          setStatus(t('xmlError','XML 格式错误'),'error');
        }
      }

      document.getElementById('formatBtn').addEventListener('click', function () { process('format'); });
      document.getElementById('minifyBtn').addEventListener('click', function () { process('minify'); });
      document.getElementById('validateBtn').addEventListener('click', function () { process('validate'); });
      document.getElementById('clearBtn').addEventListener('click', function () { inputEl.value = ''; outputEl.textContent = ''; hideDetail(); setStatus(''); inputEl.focus(); });
      document.getElementById('copyBtn').addEventListener('click', function () { if (outputEl.textContent) { copyToClipboard(outputEl.textContent, this); setStatus(t('common.copied','已复制')); } });
    })();
  </script>
</body>
</html>
