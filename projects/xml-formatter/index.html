<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XML 格式化器 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/global.css">
</head>
<body>
  <header class="global-header">
    <a href="../../index.html" class="logo">S-Jiffy</a>
  <a href="../../index.html" class="back-btn">← 返回</a></header>
  <main class="tool-workspace">
    <h1>XML Formatter</h1>
    <p class="tool-desc">格式化与压缩 XML 数据。</p>
    <div class="card">
      <textarea id="inputText" class="input textarea js-focus-input" placeholder='<root><item id="1"><name>测试</name></item></root>' style="min-height:200px;"></textarea>
    </div>
    <div class="action-bar" style="display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap;">
      <button id="formatBtn" class="btn btn-primary">格式化</button>
      <button id="minifyBtn" class="btn btn-secondary">压缩</button>
      <button id="clearBtn" class="btn btn-secondary">清空</button>
    </div>
    <div class="output-box" id="输出Container">
      <span id="outputText" style="display:block; padding-right:60px;"></span>
      <button class="copy-btn" id="copyBtn">复制</button>
    </div>
  </main>
  <footer class="global-footer">
    <div class="tool-status" id="statusBar"></div>
    <div>S-Jiffy · 即用即走</div>
  </footer>
  <script src="../../assets/js/global.js"></script>
  <script>
    (function () {
      var inputEl = document.getElementById('inputText');
      var outputEl = document.getElementById('outputText');

      function formatXml(xml, minify) {
        var parser = new DOMParser();
        var doc = parser.parseFromString(xml, 'text/xml');
        var parseError = doc.querySelector('parsererror');
        if (parseError) throw new Error(parseError.textContent);

        var serializer = new XMLSerializer();
        if (minify) {
          return serializer.serializeToString(doc);
        }
        return formatXmlString(serializer.serializeToString(doc));
      }

      function formatXmlString(str) {
        var tokens = [];
        var re = /<[^>]+>/g;
        var last = 0;
        var m;
        while ((m = re.exec(str)) !== null) {
          if (m.index > last) {
            var text = str.slice(last, m.index).trim();
            if (text !== '') tokens.push({ type: 'text', value: text });
          }
          tokens.push({ type: 'tag', value: m[0] });
          last = re.lastIndex;
        }
        var tail = str.slice(last).trim();
        if (tail !== '') tokens.push({ type: 'text', value: tail });
        var indent = 0;
        var result = [];
        var pad = '  ';
        for (var i = 0; i < tokens.length; i++) {
          var tok = tokens[i];
          if (tok.type === 'text') {
            result.push(pad.repeat(indent) + tok.value);
            continue;
          }
          var tag = tok.value;
          if (tag.indexOf('<?') === 0 || tag.indexOf('<!--') === 0 || tag.indexOf('<![CDATA[') === 0) {
            result.push(pad.repeat(indent) + tag);
            continue;
          }
          var isClosing = tag.indexOf('</') === 0;
          var isSelfClosing = tag.slice(-2) === '/>';
          if (isClosing) indent--;
          if (!isClosing && !isSelfClosing && tokens[i + 1] && tokens[i + 1].type === 'text' && tokens[i + 2] && tokens[i + 2].type === 'tag' && tokens[i + 2].value.indexOf('</') === 0) {
            var openName = tag.slice(1, tag.length - 1).split(/\s+/)[0];
            var closeName = tokens[i + 2].value.slice(2, -1).trim();
            if (openName === closeName) {
              result.push(pad.repeat(Math.max(0, indent)) + tag + tokens[i + 1].value + tokens[i + 2].value);
              i += 2;
              continue;
            }
          }
          result.push(pad.repeat(Math.max(0, indent)) + tag);
          if (!isClosing && !isSelfClosing) indent++;
        }
        return result.join('\n');
      }

      document.getElementById('formatBtn').addEventListener('click', function () {
        var text = inputEl.value.trim();
        if (!text) { setStatus('请输入 XML', 'error'); return; }
        try {
          outputEl.textContent = formatXml(text, false);
          setStatus('');
        } catch (e) {
          outputEl.textContent = '';
          setStatus('XML 格式错误', 'error');
        }
      });

      document.getElementById('minifyBtn').addEventListener('click', function () {
        var text = inputEl.value.trim();
        if (!text) { setStatus('请输入 XML', 'error'); return; }
        try {
          outputEl.textContent = formatXml(text, true);
          setStatus('');
        } catch (e) {
          outputEl.textContent = '';
          setStatus('XML 格式错误', 'error');
        }
      });

      document.getElementById('clearBtn').addEventListener('click', function () { inputEl.value = ''; outputEl.textContent = ''; setStatus(''); inputEl.focus(); });
      document.getElementById('copyBtn').addEventListener('click', function () { if (outputEl.textContent) { copyToClipboard(outputEl.textContent, this); setStatus('已复制到剪贴板'); } });
    })();
  </script>
</body>
</html>
