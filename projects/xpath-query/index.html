<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>XPath 查询测试 - S-Jiffy</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg"><link rel="stylesheet" href="../../assets/css/global.css"></head>
<body>
<header class="global-header"><a href="../../index.html" class="logo">S-Jiffy</a><select id="langSwitch" class="lang-switch" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文（台灣）</option><option value="zh-HK">繁体中文（香港）</option><option value="es">Español</option><option value="ja">日本語</option></select><a href="../../index.html" class="back-btn">← 返回</a></header>
<main class="tool-workspace"><h1 data-i18n="h1">XPath 查询工具</h1><p class="tool-desc" data-i18n="desc">在 XML/HTML 中测试 XPath 表达式，查看匹配节点数量和内容。</p>
<div class="card"><input id="xpathInput" class="input" placeholder="XPath 表达式，如 //div[@class='foo']//text()" style="width:100%;max-width:600px;"></div>
<div class="card"><textarea id="inputText" class="input textarea js-focus-input" data-i18n-placeholder="ui.102" placeholder="粘贴 XML 或 HTML..." style="min-height:150px;font-family:var(--font-mono);font-size:var(--font-size-xs);"></textarea></div>
<div class="action-bar" style="display:flex;gap:12px;margin:var(--space-2) 0;flex-wrap:wrap;align-items:center;">
<button id="queryBtn" class="btn btn-primary" data-i18n="ui.query">查询</button><button id="clearBtn" class="btn btn-secondary" data-i18n="ui.clear">清空</button>
</div>
<div class="card" id="resultCard" style="display:none;"><h3 style="margin-bottom:var(--space-1);" data-i18n="ui.1">查询结果</h3><p id="matchCount" style="font-size:var(--font-size-sm);margin-bottom:var(--space-1);"></p><div id="matchResults" style="font-family:var(--font-mono);font-size:var(--font-size-xs);max-height:300px;overflow-y:auto;"></div></div>
<div class="output-box"><span id="outputText" style="display:block;padding-right:60px;"></span><button class="copy-btn" id="copyBtn" data-i18n="ui.copy">复制</button></div>
</main>
<footer class="global-footer"><div class="tool-status" id="statusBar"></div><div data-i18n="common.footer">S-Jiffy · 即用即走</div></footer>
<script src="../../assets/js/global.js"></script>
  <script src="../../assets/js/i18n.js"></script><script>
(function(){
var inputEl=document.getElementById('inputText');
var outputEl=document.getElementById('outputText');
var xpathInput=document.getElementById('xpathInput');
var queryBtn=document.getElementById('queryBtn');
var clearBtn=document.getElementById('clearBtn');
var copyBtn=document.getElementById('copyBtn');
var resultCard=document.getElementById('resultCard');
var matchCount=document.getElementById('matchCount');
var matchResults=document.getElementById('matchResults');
function evaluateXPath(xml,xpath){
var parser=new DOMParser();
var doc;
try{
doc=parser.parseFromString(xml,'text/xml');
var parseErr=doc.querySelector('parsererror');
if(parseErr)doc=parser.parseFromString(xml,'text/html');
}catch(e){doc=parser.parseFromString(xml,'text/html');}
var results=[];
var resolver=null;
try{
var ns=doc.documentElement.getAttribute('xmlns');
if(ns)resolver=doc.createNSResolver(doc.documentElement);
}catch(e){}
try{
var xpathResult=doc.evaluate(xpath,doc,resolver,XPathResult.ANY_TYPE,null);
var node=xpathResult.iterateNext();
while(node){
var val=node.textContent||node.nodeValue||'';
val=val.trim();
if(val)results.push(val);
node=xpathResult.iterateNext();
}
}catch(e){throw new Error(t('ui.6','XPath 错误: ') +e.message);}
return results;
}
queryBtn.addEventListener('click',function(){
var xml=inputEl.value.trim();
var xpath=xpathInput.value.trim();
if(!xml){setStatus(t('ui.100','请输入 XML/HTML'),'error');return;}
if(!xpath){setStatus(t('ui.101','请输入 XPath'),'error');return;}
try{
var results=evaluateXPath(xml,xpath);
resultCard.style.display='block';
matchCount.textContent = t('ui.3','匹配 ')+results.length+ t('ui.2',' 个节点');
matchResults.innerHTML='';
if(results.length===0){
matchResults.innerHTML='<span style="color:var(--color-text-secondary)">'+t('ui.103','无匹配结果')+'</span>';
}else{
var ol=document.createElement('ol');
ol.style.paddingLeft='20px';
for(var i=0;i<Math.min(results.length,100);i++){
var li=document.createElement('li');
li.textContent=results[i].substring(0,200);
ol.appendChild(li);
}
matchResults.appendChild(ol);
if(results.length>100){
var note=document.createElement('p');
note.style.color='var(--color-text-secondary)';
note.textContent = t('ui.5','... 还有 ')+(results.length-100)+ t('ui.4',' 个结果');
matchResults.appendChild(note);
}
}
outputEl.textContent='XPath '+xpath+ t('ui.3',' 匹配 ')+results.length+ t('ui.2',' 个节点');
setStatus('');
}catch(e){
resultCard.style.display='none';
outputEl.textContent='';
setStatus(e.message,'error');
}
});
clearBtn.addEventListener('click',function(){inputEl.value='';xpathInput.value='';outputEl.textContent='';resultCard.style.display='none';matchResults.innerHTML='';setStatus('');inputEl.focus();});
copyBtn.addEventListener('click',function(){if(outputEl.textContent){copyToClipboard(outputEl.textContent,copyBtn);setStatus(t('ui.copied','已复制'));}});
})();
</script></body></html>
