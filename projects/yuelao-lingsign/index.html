    .logo-text { font-size: var(--font-size-lg); font-weight: 600; }

    .qian-card::after { content: "签"; position: absolute; top: 34px; left: 0; right: 0; font-size: 34px; color: #8A4A1F; text-align: center; font-weight: 600; }

    @keyframes qianShake {

      36% { transform: rotate(-6deg) translateY(-22px); }
      48% { transform: rotate(7deg) translateY(-16px); }
      60% { transform: rotate(-5deg) translateY(-8px); }
      72% { transform: rotate(4deg) translateY(0); }
      84% { transform: rotate(-2deg) translateY(4px); }

    }
    @keyframes qianPulse { from { opacity: 1; } to { opacity: 0.5; } }

    .result-actions { display: flex; gap: var(--space-2); margin-top: var(--space-3); flex-wrap: wrap; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .all-head:hover { background: var(--color-bg-soft); }

    <div class="card draw-card">

  <script>
(function () {
  var CFG = {"name":"月老灵签","poemLabel":"签文","jieLabel":"解签","jieField":"jie","extraFields":[]};
  var QIAN = [{"n":1,"no":"第 1 号签","ji":"上上大吉签","text":"关关雎鸠，在河之洲，窈窕淑女，君子好逑。","jie":"春令之鸟儿啭枝头。在于河之洲。一群由冬天醒来之鸠儿歌唱。其婉转歌声。如一少女之求偶之声。此景者。世人之常。男之大当婚。女之长当嫁。君子求之者多。一位淑女终得以淑配。良人得良缘。一路光辉。永远和谐。白头偕老耶。"},{"n":2,"no":"第 2 号签","ji":"中签","text":"落霞与孤鹜齐飞，秋水共长天一色。","jie":"落霞与孤鹜齐飞，秋水共长天一色。落霞与孤鹜。均是寂寞。寥落之象也。于落霞之中。单象影只之鹜飞行者。予人深感秋尽冬之来。旺盛蕃衍之夏季已过。秋已尽。如此际遇之时。君汝宜乐善不倦积德当先。待时之时。自有合成之时。"},{"n":3,"no":"第 3 号签","ji":"上上签","text":"宗庙享之，子孙保之。","jie":"上一代之福延于子孙。祸亦同也。福之延于吾一代。其惠爱之情。当不可须叟忘之。享自上一代。吾当设法延于下一代。事事如此之时。一代延下一代。皆可享用不竭。汝怀念祖先。子孙亦同之。"},{"n":4,"no":"第 4 号签","ji":"中签","text":"斯人也，而有斯疾也；斯人也，而有斯疾也。","jie":"一个人皆有疾。毛病。癖之所成。连圣贤在修养到家之前也是如此。毛病与过失。皆不能免。"},{"n":5,"no":"第 5 号签","ji":"上签","text":"逾东家墙而搂其处子，则得妻。不搂，则不得妻。","jie":"如在偶然之机会。或相处已久。视伊人为终身可许之者。应采取行动。不宜逸失机会。姻缘之至也。必须勇往迈进。"},{"n":6,"no":"第 6 号签","ji":"上吉签","text":"风弄竹声，只道金佩响；月移花影，疑是玉人来。","jie":"风弄竹声，只道金佩响;月移花影，疑是玉人来。春风一动。竹叶之摇晃。沙沙作响。啻可听道金佩在响。月日一日日地去耶。花影见了。心底下。疑玉人来。繇此可知。君之好事已近。"},{"n":7,"no":"第 7 号签","ji":"上签","text":"斯是陋室，唯吾德馨。","jie":"虽居于简陋之闺房。唯一己之德俱备时。自有它馨香之处。易言之。一己。居于极陋之室中。如德。智皆备之时。天自有赐良缘之时。不必自卑自弃耶。"},{"n":8,"no":"第 8 号签","ji":"中上签","text":"期我乎桑中，要我乎上宫，送我乎淇之上也。","jie":"男女之婚姻是终身大事。是决定人生一生幸福之大事。爰之。不得以逾越。不正。强行等。手段行之。必须以正当方式取得对方之芳心。两相情愿之下完成。如违反上述原则行之时。虽结合。惟两者之间。貌合神离。不得行之。否则良缘亦为此破坏无遗。"},{"n":9,"no":"第 9 号签","ji":"下签","text":"则父母，国人皆贱之。","jie":"则父母。亦即使君尔之椿萱也。皆轻视君汝之意。繇此可之。为人子弟者。为合受父母疏远。唾弃。贱之。原因多矣。最大之原因。不出不慎交友。如一己之不慎。一失足成千古恨之时。后果堪虞者。爰之。必须慎行之。婚姻同之。终生之伴侣。必须慎择之。"},{"n":10,"no":"第 10 号签","ji":"上签","text":"有道是养儿防老，积谷防饥。","jie":"自古以来有两大古训。养儿为了一己之防老。老了以后。可繇伊等侍奉。贻娱老年。平素则省吃俭用。积谷可防饥。尤其是养儿耶。必须善教之。婚事同之。结发成伉俪之后。老境亦能相互照顾也。"},{"n":11,"no":"第 11 号签","ji":"中平签","text":"自剪芭蕉写佛经，金莲无复印中庭。清风明月长相忆，玉管朱弦可要听，多病不胜衣更薄，宿妆犹在酒初醒。卫星年违别成何事，卧看牵牛织女星。","jie":"前之一句则是自剪芭蕉之叶。写佛经。清风明月耶长相忆。亦即是清风中之明月。缅怀已往之岁月。往事。一面幻想着自己之前途。皆无补于事者。此景犹如多病之人。衣薄，宿妆又如酒初醒之时。不如现在耶。皆意养吾身。有了健全之身。自有健全之志随之。唯有如此。方有新之机会可逢遇。"},{"n":12,"no":"第 12 号签","ji":"中签","text":"一则以喜，一则以惧。","jie":"此尘世之事。无以两全其美者。甚至有人曰。世人之事耶。十之八九不如意。如此反复不以之世景下。吾人该以如何面对。啻好面对现实。就事情分析。分析。取舍之。不宜奢求之。但亦不必为小挫而气馁欤。"},{"n":13,"no":"第 13 号签","ji":"上签","text":"山穷水尽疑无路，柳暗花明又一村。","jie":"前面一片重重迭迭之山岭。已经觉得自己再业没路可行之际。忽尔又出现一村子来。在心灰意懒。万念俱灰之时。峰回路转。来了一线生机。为君带来莫大希望。是人之命运也。汝已入佳境。必有佳遇耶。"},{"n":14,"no":"第 14 号签","ji":"上上签","text":"谁谓荼苦，其甘如荠。宴尔新婚，如史如弟。","jie":"一己之先入观念。对某物有喜爱。赞赏有加。爱屋及乌。如苦瓜。苦茶。虽是有苦味。但喜爱之人食之必言其美味且甘耶。伴侣之选择复之如是。以爱为出发。自无贵贱之分。爱之有加。"},{"n":15,"no":"第 15 号签","ji":"中签","text":"君子审礼，不呆诬以奸诈。","jie":"君子之为人也。必须注重礼节。凡是明知言行之失去礼节者。皆守正。绝不入不正之途，思想高超。格调要高。如冰清玉洁。必受人欢迎。且他人亦无有可乘之地。无法藉词加以诬蔑者也。"},{"n":16,"no":"第 16 号签","ji":"上上签","text":"意中人，人中意，则那些无情花鸟也情凝，一般的解结枝头学并栖。","jie":"一己之心。尽了人事。必有精账?易言之。意中人。人中意。真情表露时。连那些不能言语之花鸟亦可致意者。意。情之到也。缘份附之。必有时机之来到。"},{"n":17,"no":"第 17 号签","ji":"中签","text":"德者本也，财者未也。","jie":"古人曰。一人之于世。最要者立德。立言。立功三者。有德者轻财。具有德而重财者。德随之堕之。惟财者人生必要之身外物。取之有道。非秤义之财勿取。爰之。由此可知选婿选妻。亦须根据此原则。婿择良人。妻求之淑女。千万不可重财轻德。否则后果堪虞也。"},{"n":18,"no":"第 18 号签","ji":"上签","text":"非独内德茂也，盖亦以外感之助焉。","jie":"雄鹰藏爪。同样道理。具有才能之人。因书读多。品德。学识俱丰。不愿将自己之才华露于外。惟婚姻独有不同。如心中喜欢。可将一己之力。作适度之显示。予以激发对之。引起对方之信赖是心要者。秘而不宜。伊人。无从所得。必有所碍。甚至一走了之。"},{"n":19,"no":"第 19 号签","ji":"中签","text":"或十年，或七八年、或五六年，或三四年。","jie":"或五六年，或三四年皆以年月示之。君汝与她之缘之成也。或费三。四年补六年。或七八年。甚至十年亦不一定。当提起之后。或因时。空。事业之学业。关系分东。有了某种契机。有急骤转变之者。速即恐有变。须耐心待之。"},{"n":20,"no":"第 20 号签","ji":"上签","text":"何如，子曰，可也。","jie":"如有人问。如此问题该何如解决。曰：可也。即可以进行之。问之何人。即是就放于我之师长。伊等之告之于君。可也。汝可抱为南针。毅然行之。婚姻同之。目下君所交之伊人。可与否。还是请教长辈。伊人之眼光中。可者可取之。"},{"n":21,"no":"第 21 号签","ji":"上上签","text":"十亩之间兮，桑者闲闲兮。","jie":"曾是五亩田之家。植之桑麻。家人即可三餐得温饱者。今之也。已有十亩之地可植桑麻。自然更宽裕之。生活稳定。名利该薄之。淡于名利。生活则乐之。否则天谴之。"},{"n":22,"no":"第 22 号签","ji":"上上大吉签","text":"久旱逢甘雨，他乡遇故知，洞房花烛夜，金榜挂名时。","jie":"大吉大利之象，平常所谓双喜临门，已是罕见，如今四喜临门，真是人间少有。，五福临门，世上无双。"},{"n":23,"no":"第 23 号签","ji":"中签","text":"只一点故情留，直似春蚕到老，尚把丝抽。","jie":"伊人作情。汝为其情所迷。如春蚕之蛹。固执之。一个人之情。却未必如此痴之。凡事者。中庸之道守之。未必死心塌地之境地。不可不知者。宜自重之。"},{"n":24,"no":"第 24 号签","ji":"中签","text":"他思之己穷。表明伊也对尔已无爱情可言。不仅无爱情可言。且恨汝入骨之境。原因何在。她尚在孤单一人。是为娇鸾鶵凤。失雌雄。易言之。如有子女。恐怕不与伊人在一起度此生。宜求神解之。","jie":"思念越多恨也越多。即使再多的感情也已化为恩怨情仇，已表明不但没感情，而且非常恨你。原因何在。是因为彼此的不成熟。让她孤单一人幽怨相伴!。如果你们有了孩子，恐怕她也会和孩子离开你，不愿与你相伴共度此生!求得此签目前福缘不佳，切莫等闲视之。宜积极挽回并求月老排解。问缘份，求神解。问婚姻，宜积极挽回。并求月老排解。可免一无所有。"},{"n":25,"no":"第 25 号签","ji":"上签","text":"可妻也。","jie":"可妻也。伊人是好伴侣。可娶嫁之。惟目前尚有若干问题之存在。均是琐碎不必弹虑者。既成好事也。将来必永浴爱河。白头偕老。"},{"n":26,"no":"第 26 号签","ji":"上上签","text":"维熊维罢，男子之祥。维虺维蛇，女子之祥。","jie":"男性梦中见熊。罴等物也。吉祥也。将有飞黄腾达之一日。女性之梦中见虺。蛇之属。亦是祥兆也。本首之诗文告之于君。生男者可成莫雄。生女者为淑媛也。"},{"n":27,"no":"第 27 号签","ji":"上平签","text":"有宗室之美。","jie":"君尔该知，不能仗己为贵族之出。时局已变迁。已无五爵之分。世人皆平等。人生而平等。并无天子。赤子之分也。爰之。君汝为寻佳偶时。必须从平常人寻找去。门当户对。或古人之训也。惟世人之视觉自不同于曩息。宜以爱心与缘份为重可也。"},{"n":28,"no":"第 28 号签","ji":"上签","text":"夫妇也，昆弟也。","jie":"一生结为夫妻。为伉俪。必须如昆弟。亦即是如同手足情深之亲兄弟。相敬如宾。决心结为连理之枝。飞于天空之比翼鸟。终生得幸福矣。"},{"n":29,"no":"第 29 号签","ji":"中平签","text":"有意栽花花不发，无心插柳柳成荫。","jie":"悉心照顾花儿。惟为何。明明作对之。中途夭折。话说回来。简单之插下池边之柳枝却蓬勃发芽。婚姻又如此。本是有意甲家之女。却娶上乙家之女。是非常美妙之事耶。"},{"n":30,"no":"第 30 号签","ji":"中签","text":"话别无长夜，相思又此春。瑶姬不可见，巫峡更何人。运石疑填海，乘槎欲问津。","jie":"时为话别之时。恨时间太短。想思于此。皆空思幻想矣。并无济于事。瑶姬。巫峡。皆不可见之地。于渺茫之地。唯事必须重实际。实事求是。才有收获之时。见茫雾之境。皆无益者。"},{"n":31,"no":"第 31 号签","ji":"中平签","text":"设虚，夜静水寒，鱼不饵。笑满船空载明月。","jie":"万籁俱静。水深又冷之时。鱼儿不得饵。出猎去之时。又逢空手回之。船只载明月上归途也。可知君目下之运也。宜重实际。不宜作虚幻之事。实事求是。否则事事落空。无一所成耶。"},{"n":32,"no":"第 32 号签","ji":"上签","text":"因荷而得藕，有杏不须梅。","jie":"此诗文者以同音谐之。因荷「何」而得藕「偶」。有杏「幸」不须梅「媒」者。君汝可知道。因荷之生方得莲藕。为何我能得偶。我亦不得而知。尔是杏「幸」运之人也。自然不需「梅」。媒来妁之。君之鸿运。无人可与伦比也。"},{"n":33,"no":"第 33 号签","ji":"上上签","text":"可以托六尺之孤，可以寄百里之命。","jie":"君汝如能逢遇鲍叔牙耶。可全心诚意之对付之。伊人也。是贵人也。伊之黼增华之时。君汝亦必有大成之时。爰之。一人之希望。可托于伊之身上。"},{"n":34,"no":"第 34 号签","ji":"中平签","text":"仍旧贯，如之何？何必改作？","jie":"君尔目下虽处在逆境。唯必须持之。不宜变之。见之状。为己周章。则愈形愈挫。不宜见异思迁。坚守旧之况。必有机缘之来。不可慌耶。"},{"n":35,"no":"第 35 号签","ji":"下签","text":"遇人之不淑矣。","jie":"今之所逢遇耶。伊人是害人之人也。明知不可交。宜速止之。另择佳偶去可也。"},{"n":36,"no":"第 36 号签","ji":"上签","text":"投我以木桃，报之以琼瑶。","jie":"我之友予我木桃。如野人之献芹者。吾感激之。必报以琼瑶之玉也。世人曰吃人斤量也。必报以两。今之食两。还斤。易言之。一己之待人以诚。将得善果者无疑。必守之人之守则也。"},{"n":37,"no":"第 37 号签","ji":"中签","text":"求则得之，舍则失之。","jie":"若得机会之时。必须把握之。一有机会。君偶目下逢之际遇也。是红之运。求之则得之。舍其机会则弃之。无法再追者。既有机会。千万不可舍之。"},{"n":38,"no":"第 38 号签","ji":"上吉签","text":"妻焉者，亲之主也。","jie":"妻者。除椿萱。兄弟之外最亲密者。爰之对妻之态度。必须如对己之亲人父母。重视之。平等对待之。"},{"n":39,"no":"第 39 号签","ji":"上签","text":"不得乎亲，不可以为人。不顺乎亲，不可以为子。","jie":"一人如失去父母之心。何以为人乎。失去亲人之心。同时将失去朋友。友朋已失。一切皆去耶。宜知孝敬父母。悌其兄弟及友。方能得于世人之心。"},{"n":40,"no":"第 40 号签","ji":"中签","text":"踏破铁鞋无觅处，得来全不费功夫。","jie":"为了成一事。穿上铁鞋奋斗不懈。费心费力。皆无所获。了然了然耶两手到头来皆空空。"},{"n":41,"no":"第 41 号签","ji":"上平签","text":"良人者，所仰望而终身也，今若此。","jie":"一人之善恶。必须终身能坚守为要件。本心为假冒。狐皮覆之。狐假虎威。终能露出马脚之时。如得知其人之底心露者。立即取消之。渐其疏远之。甚至断之。否则有悔不当初之时也。"},{"n":42,"no":"第 42 号签","ji":"中签","text":"重重迭迭上瑶台，几度呼童扫不开，刚被太阳收拾去，却教明月送将来。","jie":"云雾弥漫于瑶台之上。呼叫小童来扫开它。亦毫无任何效果。所幸强烈阳光将其驱送。迨至皎洁之明月出之。如是难通之运亦由伊带光明来。含之义也。汝今虽有意外之损失。但亦将有意外之收获。时间不至于久耶。"},{"n":43,"no":"第 43 号签","ji":"上吉签","text":"君子有援勤之桃，淑女无投梭之拒。","jie":"身为君子之伊也。有援琴之桃时。淑取自无投梭而拒君于千里之外者。易言之。如男之汝。有意接纳时。淑女之尔。自无拒于千里之外之理由耶。"},{"n":44,"no":"第 44 号签","ji":"上签","text":"遐迩一体，率宾旧王。","jie":"遐也远。迩亦瑶之远也。自古以来有千古不易之理。不论古今之时。东西之地。新人不如旧雨。新土亦不如旧主者也。伊人之关乎微至。"},{"n":45,"no":"第 45 号签","ji":"上签","text":"后生可畏，焉知来者之不如今也。","jie":"君尔目下之人。本是可心满意足之人。焉知后来之人。一个比一个更美好。就此环境下。只好愿君作选择矣。慎选之。品、学，兼丰而体能慎之。"},{"n":46,"no":"第 46 号签","ji":"中上签","text":"不愧于天，不怍于人。","jie":"一人之言行方正之时也。对天而不愧。对地而不昧。视人生之财也。如浮云之所以。心之守正。半夜有人敲门。心自不惊。为人之守则。必须守之。"},{"n":47,"no":"第 47 号签","ji":"中签","text":"害女红者也。","jie":"所谓女红者，为人绣罗衣之人也。此埋头苦干。为人刺绣者。厌其罗衣者居多。因女红辛苦绣之。并不能享用其物而慨叹之。为人作灯泡。牵线是已。"},{"n":48,"no":"第 48 号签","ji":"上吉签","text":"五百英雄都在此，不知谁是状元郎？","jie":"今日在君眼前者。皆为一时之选。人才济济。各有千秋。人人之状元之郎君也。必须慎选。选如意郎君之原则也。品德为首。学识次之。门之当。户又对乎。千万叵重人之财。门阀。否则悔之已晚之时。"},{"n":49,"no":"第 49 号签","ji":"上平签","text":"故好而知其恶，恶而知其美者。","jie":"友朋交上以后。由衷喜欢伊人。唯时间一久。不知不觉发现其缺者。相反之。交上心坎里不太喜欢之人。唯久而久之。反而发现其美之所在。是何者该密交舍之宜疏远之人。宜自行审慎断之。取舍小心可也。"},{"n":50,"no":"第 50 号签","ji":"中签","text":"两世一身，形单影支。","jie":"两世之一身也。指君汝之单身汉渡世之主义。光棍。将形成形单影只。何苦后。男大当婚。女大当嫁。是千古不易之理也。为调节生活之枯燥。宜弃之所谓王老五主义。宜谈婚嫁也。"},{"n":51,"no":"第 51 号签","ji":"上签","text":"虽有善者，亦无如之何矣。","jie":"目下，君之缘份已有定终身之谊。忽尔出现比今更理想。令人可圈可点之人。皆已无益者。啻好皆认命。终生以伊为伴侣可也。勿必左思右想。举棋不定。三心两意。皆于事无益者。"},{"n":52,"no":"第 52 号签","ji":"上上大吉签","text":"云从龙，风从虎，圣人作而万，君万事皆可成也！","jie":"目下君尔之运也。云之从龙。风之从虎之运。龙蟠虎踞之势。风云际会。际遇非常之时。君汝必能功成名遂之时。事事能称心者耶。"},{"n":53,"no":"第 53 号签","ji":"上上签","text":"其所厚者薄，而其所薄者厚。","jie":"世人之现象。出乎人之意料者多。如其某君之于汝。曾施予恩。报之也薄。又对某兄施与之薄。君却以厚礼还之。古人曰。施恩勿念。受惠勿忘。行善者。不必以报为念。上苍知之即足矣。唯本签之意即是。君汝之婚姻复如是。君汝之婚姻复如是。必能有意外之好姻缘来结合耶。"},{"n":54,"no":"第 54 号签","ji":"中签","text":"成也萧何，败也萧何。","jie":"一生之中。父母之命也。该唯命是从。唯时代之变迁。或者世人之新观点也有所变化。如有意见。必须向椿萱申述。其理安在。求父母之同意决定可也。未必为从之而毁者。媒妁之言同之。必须审思之。可否从之。熟虑之后可用自己之主张舍取之。"},{"n":55,"no":"第 55 号签","ji":"上签","text":"不思旧姻，求尔新君。","jie":"不必再思念过去之旧姻缘。可求汝新妇也。易言也。过去者已逝。但。君尔之前突辽远而无穷者。不可气馁。亦更不可骄恣。行之稳健可也。"},{"n":56,"no":"第 56 号签","ji":"上上签","text":"永老无离别，万古当团聚。愿天下有情人，都成眷属。","jie":"本签示之于君尔之意也。君之运也。红而紫者。永老无分离。万古常生活团聚在一起。天下之情人成卷之后。都愿伊人百年和合。琴瑟和鸣。白头偕老耶。"},{"n":57,"no":"第 57 号签","ji":"上上签","text":"是谓凤凰于飞，和鸣锵锵。","jie":"君仰头一看。见了凤凰于飞。齐飞于天空。由鸣声中。和鸣锵锵见之。犹如视君之今。必能得良缘。如一对翱翔空中之凤凰。似瑟琴之和鸣。君也必能与伴侣。永合和鸣。白头偕老者。"},{"n":58,"no":"第 58 号签","ji":"中签","text":"帷旧婚媾，其能降以相从乎？","jie":"一人不自量力。妄图高攀。即使得以攀高。事亦不得以称心者。既然如此。不如降落以求。可做为鸡头。不做牛尾。不如是否。枝头凤凰。尔不能见其外表断其幸也。须知其内容方可知也。"},{"n":59,"no":"第 59 号签","ji":"中签","text":"脍炙，所同也，羊枣，所独也。","jie":"每人对鱼炙肉脍。皆有所好。人人喜欢食之。羊枣则啻有君喜之。由此可知。君尔之所得者。比他人为少。婚姻如是也。君汝喜欢之一型人。有其限也。"},{"n":60,"no":"第 60 号签","ji":"中签","text":"心茍不愆，何惜于人言。","jie":"一人之心茍不愆。无违悖道德之事也。自不怕人言之畏耶。心正自心安理自得。再言之。事之无可奉告之于人之时。心内无疚于人之时。自无烦燥之时。此乃者一人长生永乐之道也。"},{"n":61,"no":"第 61 号签","ji":"中签","text":"不知其人，视其友。","jie":"一个人之良痞。如君不能知其良莠者。观其交友朋即可窥其全貌。伊之交。是皆守正不阿。事事正经之友耶。其人亦是正经之属。可交之。婚姻之可结也。可用同一原理为之。不知其人之为何时。以伊之交友慎之。"},{"n":62,"no":"第 62 号签","ji":"上上大吉签","text":"嘉耦曰配。","jie":"与他(她)是否合得来。如两者之间。有意合之。且经一段时间之交友。认为可合者。可合之。不必多考虑者也。是一己之命也。唯必有善果结之。"},{"n":63,"no":"第 63 号签","ji":"中平签","text":"子规半夜犹啼血，不信东风唤不回。","jie":"子规-杜鹃耶国人南方人曰之吐血鸟。目下是半瞑。一只子规。吐血鸟。尚在呕血似地啼叫。犹如说明。君之耶。离乡背井。居边远之地。有人为君汝相思。伊人不相信君之不回故里去者。伊人坚信。至迟耶。东风吹之时。亦即是春之来时耶。"},{"n":64,"no":"第 64 号签","ji":"上平签","text":"齐大非吾耦也。","jie":"齐之大。亦即是伊人是有钱。有势之人。子女耶。汝该知难而退。古人曰。门不当户不对。何以合之。强求之时。必有害也。降格以求。方是幸运之道。"},{"n":65,"no":"第 65 号签","ji":"上平签","text":"在幽闺自怜。","jie":"一己深锁在闺房之中。自己怜之。为何如今尚未遇终生之伴侣乎。曩昔之习俗。女儿耶不得出闺房。男儿亦不得随便。必凭父母之命。媒妁之言成婚。惟世局之变迁。男女均该走出闺房。去交往。先友后婚可也。"},{"n":66,"no":"第 66 号签","ji":"中签","text":"惊起却回头，有恨无人省。拣尺寒枝不肯栖，寂寞沙洲冷。","jie":"汝之婚姻耶。中之者。惊起却回头去。有恨无人省之。无一人帮忙。省顾吾。阻力太大。爰之。冻尽之寒枝上不肯栖。形成之者。其寂寞沙洲亦冷。挑剔太多而来之阻碍。如能阻力无化为助力时。无法得之也。"},{"n":67,"no":"第 67 号签","ji":"上签","text":"再，斯可矣。","jie":"如果是这一次不能成功。再来一次尝试。必能有成功之机会。千万叵气馁矣。放手做可也。"},{"n":68,"no":"第 68 号签","ji":"上平签","text":"苟有可观，皆有其乐，匪必瑰奇端丽者也。","jie":"亦即是指一定姻缘之完满。端赖于深挚之爱情为基本。即可因之。情深。自不致于计较五美之合。才子貌美为要件。更不愿取伊之财富。方能疼之伊人。是情深为婚姻之基础也。"},{"n":69,"no":"第 69 号签","ji":"中签","text":"天下多负人，何必是。","jie":"君不曾受宠。可另择佳偶去。不必为其人伤了身心。他之人。或可为君带来一生之幸福亦未可料。不必为之伤心。"},{"n":70,"no":"第 70 号签","ji":"上平签","text":"利有攸往。","jie":"利者可攸往。汝之命即是如此。如果伊是真实之富者。尔可以妻之。嫁去可也。"},{"n":71,"no":"第 71 号签","ji":"中上签","text":"虽有丝麻，无弃菅蒯。虽有姬姜，无弃蕉萃。","jie":"君尔。在多方奔走。多年辛苦之后。已得衣锦与三餐美食。唯昔时一己之布衣淡食。却不可忘矣。运桥之后。其探杖。岂可丢失耶。又更须留意者。君之身边得之千金小姐之青睐。岂可丢糟糠于不顾。伊人耶。为君奋斗不懈。获得成功之大恩人耶。两者忘之。弃之。君尔之运也。必开始日衰。不得不小心。"},{"n":72,"no":"第 72 号签","ji":"下签","text":"以若所为，求若所为，犹缘大而鱼也。","jie":"如以君尔之言也。行也。欲求达一己之所望。恐如同在缘木求鱼者。易言之。尔之言行。修养两者之间。恐不合者。可止之。不宜再进者。"},{"n":73,"no":"第 73 号签","ji":"上吉签","text":"白云初晴，幽鸟相逐。","jie":"以往君尔之日子是昏暗晦涩者。如今一扫所有之酶气。白云亦初晴。幽鸟相逐于太空中。君尔之缘也。必可成。且是令人羡慕者。放手去做可也。"},{"n":74,"no":"第 74 号签","ji":"中签","text":"恨相见晚也。","jie":"眼前之伊人。令人可爱。可许吾生。予我身。惟探望之下。伊人己身有主。岂有办法可取也。"},{"n":75,"no":"第 75 号签","ji":"下签","text":"则去偷香窃玉上用心，又不曾得甚。自从海棠开，想到如今。","jie":"君尔耶。在与伊人之间。只为偷香。窃玉之上用心。取去玉。偷其香是己。不为爱情而行。易言之男欢女爱。如此之结合。时之过憋。将同床异梦者。爰之。一己与人之结合耶。必须以爱为基础。方有幸福可言。千万不能以千万不能以美、富为基础。青春一去不复返，时间是公平的，失去了，回不来，千万别拿自己青春开玩笑。单身者，不可存侥幸，要留好名声、给人探听。"},{"n":76,"no":"第 76 号签","ji":"上签","text":"忘足，履之适也。忘腰，带之适也。","jie":"忘了足。伊人为我记之。如一双鞋可适君汝之足也。忘一己之腰。伊人又为带来带。又适人。如此之良缘。尔。有何言拒之。必须速求之。合之。"},{"n":77,"no":"第 77 号签","ji":"上签","text":"标有梅，其实七兮。求我庶士，迨其吉兮。","jie":"标有处。有梅这。但其实只有七分者。求我之庶士也。迨其吉之至可也。何必为之着急。急则不成。又在人之来往上。千万叵做斤斤计较也。为人太小气之时。将受之远之。不可不改也。"},{"n":78,"no":"第 78 号签","ji":"中签","text":"欲速则不达。见小利，则大事不成。","jie":"欲速之不达。顾名思议。一人之办事也。宜见其轻重缓急为之。为理一事。急于功者必败者。不过。亦不能拖延久矣。一面也。不可见小利则趋之。见小利易忘其义。受人厌弃之后。一切皆休矣。不可不知也。"},{"n":79,"no":"第 79 号签","ji":"上签","text":"更洒遍客舍青青，千缕柳色新。","jie":"更洒遍。即是表明春雨不得。客舍青青。客舍。尔之住处。青青也。洗得好干净。春雨来耶。千缕柳色新。岸边之杨柳亦条条着上新绿衣。春景已经呈现汝之眼前。尔已经可喜之时来到。"},{"n":80,"no":"第 80 号签","ji":"上签","text":"悲莫悲兮生别离，乐莫乐兮新相知。","jie":"悲莫悲兮。虽是令人悲哀者。亦不必悲。生而必须别离之苦痛事。君汝已经尝过苦头矣。唯乐莫乐兮。快乐之事。令人鼓起勇气之事。已在眼前。悲已去。乐在眼前。不必再担心者耶。顺境者已至。"},{"n":81,"no":"第 81 号签","ji":"中签","text":"经之营之，不日成之","jie":"日日下注功夫。勤劳扶之。必有大成之时。姻缘如此。如果汝对伊人有信心。愿许身。允者一切者。可千方百计接近去。必有大成之时。信之可行也。"},{"n":82,"no":"第 82 号签","ji":"上上签","text":"行去耶，前朱雀而后玄武，左青龙而右白虎。","jie":"左方见了青龙。右手方却又见了白虎在。可知倾慕尔之才华美貌而来之者多。为此。君亦举棋不定。何君为终生伴侣。而受感。在此时。汝可暂时避之。于宁静之环境为下。作慎谋能断。以衡量妥贴之后为之。"},{"n":83,"no":"第 83 号签","ji":"下签","text":"姑舍是。","jie":"目下之际遇而言。不宜合之。如勇士之断指。断然放弃之。否则惹是非。无利幸可图矣。"},{"n":84,"no":"第 84 号签","ji":"上平签","text":"劝君莫惜金缕衣，劝君惜取少年时，花开堪折直需折，莫待无花空折枝。","jie":"君尔。目下之情形而言。千万不可惜缕衣。但宜惜君之少年时也。少年时光易逝。岂可让其去耶。可知君必须把握住机会。不宜放之。花可摘时则摘之。到无花之时。折空枝何之于益乎。为时必须及时。莫惜金缕衣。皆可穿之时穿之。惟必须惜之十八少年时。是人生之黄金时代。何可白白浪费。如无把握时机之时。犹如花开之后折空枝者也。宜惜之。"},{"n":85,"no":"第 85 号签","ji":"上上大吉签","text":"得其所哉，得其所哉。","jie":"得其所。亦即是赞颂君尔之婚姻。得其所在也。逢此非常际遇之时。君汝可毫不犹豫。决定取之可也。踌躇即失之东隅。但不能收之桑榆者。"},{"n":86,"no":"第 86 号签","ji":"中签","text":"河汉清且浅，相去复几许，盈盈一水间，脉脉不得语。","jie":"楚汉之界。又清又浅之一条河所隔。去对岸之地。复几许。应是地是去耶。不是困难之事耶。又如一盈盈之一水之间。无法说出一语者。可知目下君尔之运也。就婚姻而言。为环境所阻。暂难望及者。或者因学业。或事业。目前无可成之望。耐心等待可也。"},{"n":87,"no":"第 87 号签","ji":"下签","text":"便如凤去秦楼，云敛巫山。","jie":"凤去秦楼耶。表明伊人去矣。巫山之云亦敛欤。可知意中之人走了。是表白两人不宜结合耶。一切之事。婚姻亦如此断矣。不宜馁志。宜另择佳偶去。"},{"n":88,"no":"第 88 号签","ji":"中签","text":"是非吾所谓情也。","jie":"人生之旅途上。是是非非。自所难免。爰之。世人之爱情复是如此。如果无挫折。不是爱情也。友谊又是如此。既然如此。何必为友情。爱情而苦恼。如是没有风浪之友谊。是不堪一击者。真挚之友谊。即是能经得起考验者。不外乎要人看出庐山真面目者。"},{"n":89,"no":"第 89 号签","ji":"中签","text":"卜以决疑，不疑何卜。","jie":"一人之心事。如有疑问。无法决定之时。自向神灵问卜。依神示之无疑。反之。如无疑何必问神卜之。爰之。大部份之事。缑由此可知。不管何种问题。该由己衡量一切情况。毅然决定则可行之。信仰可也。唯决定之权在于君。"},{"n":90,"no":"第 90 号签","ji":"上签","text":"两情若是长久时，又岂在朝朝暮暮。","jie":"两人之情。可指友情爱情者。就友情而言。不知不觉。疏远了。情人也去远。心情纳闷。精神为之不振。情绪低落。唯如此之情况是一时之事。远行之朋友。情人。到时候。必有回来之时。伊等之回来。低落之情绪亦又复活。精神也为此大振。何必朝暮计?"},{"n":91,"no":"第 91 号签","ji":"上签","text":"你往事已沉，我只言自今。","jie":"汝之往事。该全忘却之。不是可以回味者。古人示之曰。昨日死。今日生。昨日之事全去之后。今日起。得以新之决定行之。已往不追。今日者再以新之决定作之。必有大成之时。"},{"n":92,"no":"第 92 号签","ji":"中签","text":"明明如月，何时可掇。","jie":"见水中之月。明知是皎洁之明月。于水中欲掇之。岂有可拾掇之时。伊是形影。何以费了心机亦枉然。一人之财运可托于彩券乎。成功与否。是命运乎。总之。为了一己之前途。必须确定自己之行也。脚踏实地。实事求是。自有大成之时。不宜托于命运也。确保之。必有大成之时。千万叵幻想之。"},{"n":93,"no":"第 93 号签","ji":"上上签","text":"而浮生若梦，为欢几何？","jie":"而浮生若梦，为欢几何人生之于人耶。是浮生若梦。人生五十。时至今日。人生古稀是人生之始。在转瞬间即可逝取之岁月中。人生欢乐几多。唯人生之旅程上。不宜有太多之顾虑。认其可行者断然行之。快乐之事亦可及时行之。不必将人生看得太认真。及时行乐也该行之。如今之休闲观。"},{"n":94,"no":"第 94 号签","ji":"中签","text":"巧言令色，鲜矣仁。","jie":"因人曰巧言令色者。最易解之句为藏里藏刀一己为了达成目的。为君不惜捧红。到头也取得利而后止。如今世之糖衣锭。爰之必须留心其毒计。以免上当。婚姻同之。如是伊人口蜜也藏剑。此可知嘴太甜者心小心之。不为其所动。"},{"n":95,"no":"第 95 号签","ji":"上签","text":"螽斯羽，薨薨兮。宜尔子孙，绳绳兮。","jie":"螽斯之羽耶。展翅飞翔于空中也。薨薨作声。薨。发音哄耶。非常舒适。顺畅之意耶。宜尔子孙。绳绳兮。亦即是际逢非常之际遇时。君尔将有绳绳兮。绵延不断者耶。可欣可贺之家运也。珍惜之。"},{"n":96,"no":"第 96 号签","ji":"上上签","text":"虽执鞭之士，吾亦为之。","jie":"吾亦可为之即是表明。伊既然是可敬之士。我可为之。易言之。伊人情有所钟之时。吾对伊人亦可好好对待。两者之情合之时。必须相对待也。不宜置之不理耶。此时。将是君之大损也。"},{"n":97,"no":"第 97 号签","ji":"中签","text":"归楚，楚人不信。归汉，汉人震恐。足下欲持是安归乎？","jie":"人人为牌之归来而惶恐。在此不容于人之时。君将何如耶。繇此可知。平时之为人必须善耶。否则人人敬而远之。无人将敢接近耶。"},{"n":98,"no":"第 98 号签","ji":"上签","text":"昨夜江边春草生，艨艟巨舰一毛轻，向来枉费推移力，此日中流自在行。","jie":"诗文曰。江边之春草。于昨晚生。君尔目下之运也缝春之时。一切由严冬中苏苏之时。君自此惟艨艟。大船亦如举一毛之轻。事事可以顺畅者。往日非常费力方可行之事。如今。犹如在中流。自由自在。行之顺畅。以往之晦气。一扫而尽。好事就在目前。运亨通者。"},{"n":99,"no":"第 99 号签","ji":"中签","text":"必先苦其心志。","jie":"为解决一件事。不管任何人也得先苦其心志。方有完成之时。婚姻如此。为两人之情。接近去也。必须苦其心与志。方能有培植情感。善果之可能耶。"},{"n":100,"no":"第 100 号签","ji":"上上签","text":"花好、月圆、人寿。","jie":"本签者也。殿之最后之一首签。将周而复始之签。是大吉大利之签。爰之出之诗文曰。花好。月圆。人寿之三者。人生最高愿望皆出之。曰。花好耶。花盛开。月又圆。望月之时。盈满而毫无亏蚀。人寿也。人人愿百年人瑞而偕老。三者皆备。人生之乐亦至于此耶。抽得此签之君。就婚姻之面。亦将是两美之合。百岁团圆者。"}];

    var s = String(ji || "").replace(/^\s+|\s+$/g, "");
    if (!s) return "";
    if (s.indexOf("下") !== -1 || s.indexOf("凶") !== -1) return "down";
    if (s.indexOf("上") !== -1 || s.indexOf("大") !== -1) return "up";
    if (s.indexOf("中") !== -1 || s.indexOf("平") !== -1) return "mid";
    return "mid";
  }

  function makeJiBadge(ji) {
    var span = document.createElement("span");
    span.className = "ji-badge jl-" + jiLevel(ji);
    span.textContent = ji;
    return span;
  }

  function clearChildren(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
  }

  function normalize(q) {
    var n = {
      no: q.no || ("第 " + q.n + " 号签"),
      ji: q.ji || "",
      poem: q.text || q.name || "",
      jie: (CFG.jieField && q[CFG.jieField]) || q.jie || q.jieyue || "",
      extra: []
    };
    for (var i = 0; i < CFG.extraFields.length; i++) {
      var e = CFG.extraFields[i];
      if (q[e.key]) n.extra.push({ label: e.label, value: q[e.key] });
    }
    return n;
  }

  function buildText(q) {
    var lines = [CFG.name + " · " + q.no];
    if (q.ji) lines.push(q.ji);
    if (q.poem) lines.push(CFG.poemLabel + "：" + q.poem);
    lines.push(CFG.jieLabel + "：" + q.jie);
    for (var i = 0; i < q.extra.length; i++) lines.push(q.extra[i].label + "：" + q.extra[i].value);
    return lines.join("\n");
  }

  function showResult(q) {
    resNo.textContent = q.no;
    clearChildren(resJi);
    if (q.ji) {
      var b = makeJiBadge(q.ji);
      if (b) resJi.appendChild(b);
    }
    resPoem.style.display = q.poem ? "" : "none";
    resPoem.textContent = q.poem;
    resJie.textContent = CFG.jieLabel + "：" + q.jie;
    clearChildren(resExtra);
    for (var i = 0; i < q.extra.length; i++) {
      var line = document.createElement("div");
      line.className = "qian-extra-line";
      line.textContent = q.extra[i].label + "：" + q.extra[i].value;
      resExtra.appendChild(line);
    }
    resultCard.style.display = "block";
    resultCard.classList.remove("show");
    void resultCard.offsetWidth;
    resultCard.classList.add("show");
    lastText = buildText(q);
  }

  function startDraw() {
    if (drawing) return;
    if (!QIAN || !QIAN.length) {
      setStatus(t('ui.100','签文数据为空，无法抽签'), "error");
      return;
    }
    drawing = true;
    drawBtn.textContent = t('ui.102','抽签中...');
    drawBtn.disabled = true;
    resultCard.style.display = "none";
    resultCard.classList.remove("show");
    qianCard.classList.remove("drawing", "drawn");
    void qianCard.offsetWidth;
    qianCard.classList.add("drawing");
    var picked = QIAN[Math.floor(Math.random() * QIAN.length)];
    setTimeout(function () {
      qianCard.classList.remove("drawing");
      qianCard.classList.add("drawn");
      drawBtn.textContent = t('ui.103','开始抽签');
      drawBtn.disabled = false;
      drawing = false;
      showResult(normalize(picked));
    }, 2600);
  }

  drawBtn.addEventListener("click", startDraw);
  againBtn.addEventListener("click", startDraw);

  copyBtn.addEventListener("click", function () {
    if (!lastText) return;
    copyToClipboard(lastText, copyBtn);
    setStatus(t('ui.101','结果已复制到剪贴板'));
  });

  allToggle.addEventListener("click", function () {
    var open = allList.style.display !== "none";
    allList.style.display = open ? "none" : "block";
    allToggle.textContent = open ? "查看全部签文" : "收起全部签文";
  });

  (function buildAll() {
    for (var i = 0; i < QIAN.length; i++) {
      var q = normalize(QIAN[i]);
      var row = document.createElement("div");
      row.className = "all-row";
      var head = document.createElement("button");
      head.type = "button";
      head.className = "all-head";
      var noSpan = document.createElement("span");
      noSpan.className = "all-no";
      noSpan.textContent = q.no;
      head.appendChild(noSpan);
      if (q.ji) {
        var b = makeJiBadge(q.ji);
        if (b) head.appendChild(b);
      }
      var poemSpan = document.createElement("span");
      poemSpan.className = "all-poem";
      poemSpan.textContent = q.poem || q.jie;
      head.appendChild(poemSpan);
      var body = document.createElement("div");
      body.className = "all-body";
      var p = document.createElement("div");
      p.className = "all-poem-full";
      p.textContent = q.poem;
      body.appendChild(p);
      var j = document.createElement("div");
      j.className = "all-jie";
      j.textContent = CFG.jieLabel + "：" + q.jie;
      body.appendChild(j);
      for (var k = 0; k < q.extra.length; k++) {
        var line = document.createElement("div");
        line.className = "all-jie";
        line.textContent = q.extra[k].label + "：" + q.extra[k].value;
        body.appendChild(line);
      }
      row.appendChild(head);
      row.appendChild(body);
      head.addEventListener("click", function (e) { e.currentTarget.parentNode.classList.toggle("open"); });
      allList.appendChild(row);
    }
  })();
})();
  </script>
</body>
</html>
