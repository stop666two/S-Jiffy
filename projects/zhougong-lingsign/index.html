  <style>
    .logo-text { font-size: var(--font-size-lg); font-weight: 600; }
    .draw-card { text-align: center; }
    .draw-tip { max-width: 540px; margin: 0 auto var(--space-3); font-size: var(--font-size-sm); color: var(--color-text-secondary); line-height: 1.7; }
    .qian-card { position: relative; width: 96px; height: 196px; margin: 0 auto var(--space-3); background: repeating-linear-gradient(90deg, transparent 0 30px, rgba(0,0,0,0.045) 30px 32px), linear-gradient(180deg, #FBF7EE 0%, #F5EDDC 55%, #F1E6CF 100%); border: 1px solid #D9CBAA; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,0.12); overflow: hidden; user-select: none; }
    .qian-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 26px; background: #B3202C; border-radius: 9px 9px 0 0; }
    .qian-card::after { content: "签"; position: absolute; top: 34px; left: 0; right: 0; font-size: 34px; color: #8A4A1F; text-align: center; font-weight: 600; }
    .qian-card.drawing { animation: qianShake 2.5s ease-in-out both; }
    .qian-card.drawing::before { animation: qianPulse 0.5s ease-in-out infinite alternate; }
    .qian-card.drawn::after { content: "✓"; color: #346538; }
    @keyframes qianShake {
      0% { transform: rotate(0deg) translateY(0); }
      12% { transform: rotate(-7deg) translateY(-8px); }
      24% { transform: rotate(6deg) translateY(-16px); }
      36% { transform: rotate(-6deg) translateY(-22px); }
      48% { transform: rotate(7deg) translateY(-16px); }
      60% { transform: rotate(-5deg) translateY(-8px); }
      72% { transform: rotate(4deg) translateY(0); }
      84% { transform: rotate(-2deg) translateY(4px); }
      100% { transform: rotate(0deg) translateY(0); }
    }
    @keyframes qianPulse { from { opacity: 1; } to { opacity: 0.5; } }
    .result-head { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); flex-wrap: wrap; }
    .qian-no { font-size: 28px; font-weight: 700; line-height: 1.2; }
    .ji-badge { display: inline-block; padding: 2px 10px; border-radius: 9999px; border: 1px solid; font-size: var(--font-size-sm); }
    .jl-up { color: #2E5B31; background: #E9F1E9; border-color: #C4D8C6; }
    .jl-mid { color: #8A5B00; background: #F7EFDF; border-color: #E6D5AC; }
    .jl-down { color: #98302E; background: #F7E8E7; border-color: #E4C6C4; }
    .qian-poem { font-size: 17px; line-height: 2; margin-bottom: var(--space-2); }
    .qian-jie { font-size: var(--font-size-sm); color: var(--color-text-secondary); line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
    .qian-extra-line { font-size: var(--font-size-sm); color: var(--color-text-secondary); line-height: 1.8; white-space: pre-wrap; word-break: break-word; margin-top: var(--space-1); }
    .result-actions { display: flex; gap: var(--space-2); margin-top: var(--space-3); flex-wrap: wrap; }
    .result-card.show { animation: fadeUp 0.45s ease-out; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .all-actions { display: flex; gap: var(--space-2); margin-bottom: var(--space-2); }
    .all-list { display: none; }
    .all-row { border: 1px solid var(--color-border); border-radius: var(--radius-md); margin-bottom: 8px; overflow: hidden; }
    .all-head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--color-bg); border: none; cursor: pointer; font-family: var(--font-mono); font-size: 14px; color: var(--color-text-primary); text-align: left; }
    .all-head:hover { background: var(--color-bg-soft); }
    .all-head::after { content: "▸"; margin-left: auto; color: var(--color-text-secondary); }
    .all-row.open .all-head::after { content: "▾"; }
    .all-no { flex-shrink: 0; font-weight: 600; }
    .all-poem { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--color-text-secondary); font-size: var(--font-size-sm); }
    .all-body { display: none; padding: 12px 14px; border-top: 1px dashed var(--color-border); background: var(--color-bg-soft); font-size: var(--font-size-sm); line-height: 1.8; color: var(--color-text-secondary); white-space: pre-wrap; word-break: break-word; }
    .all-row.open .all-body { display: block; }
    .all-poem-full { color: var(--color-text-primary); margin-bottom: 6px; }
    .all-jie { margin-top: 4px; }
    .tool-note { margin-top: var(--space-4); font-size: var(--font-size-xs); color: var(--color-text-disabled); text-align: center; }
    footer.tool-status { padding: var(--space-2) var(--space-3); border-top: 1px solid var(--color-border); }

    <div class="card draw-card">
      <p class="draw-tip" data-i18n="ui.1">静心默念所问之事，心诚则灵，再开始抽签。</p>

  <script>
(function () {
  var CFG = {"name":"周公灵签","poemLabel":"签文","jieLabel":"解签","jieField":"jie","extraFields":[{"key":"xiangjie","label":"象解"}]};
  var QIAN = [{"n":1,"no":"第 1 签","ji":"上上灵签","text":"天开地辟结良缘，日吉时良万事全。若得此签非小可，人行中正帝王宣。","jie":"灵签之曰：天开地辟。结良缘是天地开创之象。为大吉大利之象也。日吉时良。万事俱全顺遂之命。能蒙神指示为此签之人。非小可也。劝君必行中正帝王亦宣言曰。如能行之正直。积善。修身时。必能持之恒久。如宋太祖。赵匡胤之黄袍加身。急速非速言来时值观音降事报与君之者。 交易-成交婚姻-成合求财-秋冬自身-秋冬吉家宅-祈保六畜-兴旺田蚕-良好寻人-得见行人-得至六甲-生男山坟-向吉讼词-吉利疾病-送医失物-东方移徒-吉昌","xiangjie":"此签有”谋事在人”之意。提醒当事人，未雨绸缪。会成功的人，除了本身的努力进取之外，对将来的一切，也早已预先考虑且准备周详。须知每个人的头上都有一片天，成败操之在己。平日稳紮稳打、厚实基础，更不间断地充实自我，为将来预作准备。凡事深谋远虑、从长计画，对於身边亲朋好友的建议，不妨虚心接受。等到时机成熟之时，亦是准备充足之时，自可从容不迫，满载而归。"},{"n":2,"no":"第 2 签","ji":"中灵签","text":"鲸鱼未化守江湖，未许升腾离碧波。异日峥嵘身变态，从教一跃禹门过。","jie":"灵签之曰：鲸鱼未化守江湖。姜太公之受难时也。为大鲸未变之象。凡事进退待时。不可轻举妄动。动则凶。静则吉。君尔也。得忍且忍。得耐且耐身不而忙。功名自在者。来日峥嵘蜕身时。一跃可过禹门者。交易-无利婚姻-难合求财-欠利自身-还愿家宅-不安六畜-不利田蚕-吉利寻人-见行人-平安六甲-求福山坟-吉讼词-和疾病-祈保失物-东方移徒-吉","xiangjie":"此签有”守时待势”之意。意味当事人，随遇而安。人的一生高低起伏，难免有不顺遂的时候，若不如意的情况接踵而来，更易叫人灰心丧志。须知事在人为，切勿被一时的失意所打垮。此时烦躁冒失有害无益，切忌沉不住气、冲动妄为。凡事保持心平气和，忍一时风平浪静。纵使遭人讥嘲误解，只要知所当为，又何须耿耿于怀。不要放弃任何希望，凡事乐观，相信自己并坚持到底，必有苦尽甘来、如愿以偿之日。"},{"n":3,"no":"第 3 签","ji":"下灵签","text":"冲风冒雨去还归，役役劳身似燕儿。衔得泥来成叠后，到头叠坏复成泥。","jie":"灵签之曰：冲风冒雨去还归。役役劳心似燕儿。君尔之运逢燕子衔泥筑巢之象耶。空心徒劳。无益者。为先难后甘之运。唯应小心。本签之总结也。千方百计。晨昏碌碌不停。谁知此事到底无以可成者。修之。悟之。交易-成婚姻-不成求财-秋冬有利自身-谨防家宅-先凶后吉六畜-有利田蚕-有利寻人-见行人-吉六甲-生男山坟-向吉讼词-有理疾病-还愿失物-见移徒-平安","xiangjie":"此签有”束手无策”之意。奉劝当事人，勿举棋不定。有些人个性刚直、做事一板一眼，临事却不知变通，往往因而错失良机。须知凡事各有利弊，有舍才有得。事有轻重缓急，与其一昧墨守成规，不如跳脱思维、因地制宜，视情况环境调整自己的塬则与做事方法。或集思广益、共同研拟商议，找出解决之道。切忌犹豫不决又固执己见，流于空想而怯做，终将空心劳力，徒然庸人自扰罢了。"},{"n":4,"no":"第 4 签","ji":"中中灵签","text":"菱花镜破复重圆，女再求夫男再婚；自此门闾重改换，更添福禄与儿孙。","jie":"灵签之曰：菱花镜破镜重圆。为破镜重圆之象。凡事成就吉者也。不是上上者。为中中之签。是先凶后吉之签。交易持公平。求财亦在秋冬转旺。如逢如此之中中运也。可积极为善。积德。当有转吉之机。交易-成允婚姻-成求财-秋冬旺自身-秋冬家宅-欠利六畜-养田蚕-可养寻人-见行人-至六甲-祈保山坟-吉讼词-不利疾病-祈福失物-迟见移徒-守旧","xiangjie":"此签有”历久弥坚”之意。意味当事人，不改初衷。须知”人生以服务为目的”，无论各行各业，应秉持着服务人群的精神、坚守做事原则，不存一己之私。切忌被外在的因素影响而轻易弃守原本的理念。凡事一片赤诚、以利他为先，即使人事环境不断地交替更迭，也不会因外在的因素而有所动摇。纵使偶有闲言闲语，但自问无愧于心，面对蜚短流长，又何妨一笑置之。流言不攻自破，真理不辩自明。只要抱守初衷，坚持信念，自可处之泰然、乐在其中。"},{"n":5,"no":"第 5 签","ji":"中平灵签","text":"一锄掘地要求泉，努力求之得最先。无意俄然遇知己，相逢携手上青天。","jie":"灵签之曰：一锄掘地妥求泉水。此象则表征君之运途。是凡事谋略之后。劳心方有成就者也。努力向前必有化凶为吉之时。自励奋斗。偶然遇知己。彼时即是君尔。得贵人之刻。在伊人扶持下。必能上青天矣。交易-好婚姻-合求财-有自身-安家宅-祈福六畜-损田蚕-宜早种寻人-见行人-迟六甲-安山坟-吉讼词-早和疾病-祭星失物-不见移徒-迁好吉","xiangjie":"此签有”休戚相关”之意。意味当事人，推诚相与。有些人为了打响自己的招牌，不惜砸下重金投资，或认为”外来的和尚会念经”，宁可大量对外延揽人才。却不知许多人才或资源也许近在眼前，却被忽视而浑然不觉。须知要巩固长久的名声不坠，还是必须一步一脚印、从自身做起。无论士农工商，如能以身作则、不耻下问，对自己身边的人谦恭有礼、善待有佳，给予优渥良好的福利，让其无后顾之忧，自然会吸引更优秀更杰出的人才慕名而来。凡事只要稳紮稳打、用心经营，相信无须劳心费力，自然有口皆碑，声名远播。"},{"n":6,"no":"第 6 签","ji":"中平灵签","text":"投身岩下饲于菟，须是还他大丈夫。舍己也应难再得，通行天下此人无。","jie":"灵签之曰：于岩下饲于菟者。是凡事宜顺则吉之表征也。得本签之君。应知。为人宜守旧。不可轻举妄动者也。不可贪求非份之外之财。或舍近图远者。皆避免之。予以君知者。使非常清身。岂贫待他时至祥。交易-难婚姻-平平求财-中平自身-中平家宅-不利六畜-损田蚕-早种寻人-见行人-近日回六甲-安山坟-安讼词-有理疾病-设送失物-见移徒-吉","xiangjie":"此签有”见机行事”之意。意味当事人，智勇兼备。人有时会碰到他人故意刁难，甚至以强欺弱、仗势欺人，让事情更加棘手。在此情境之下，常因忍不下一口气，愤而误事。须知有勇无谋于事无补，与其冲动气愤、闹得两败俱伤，还不如保持冷静，用智慧与理智思考应对之道。故事中蔺相如之所以能完璧归赵，即是因为拥有当机立断的机智，与直言不讳的勇气。凡事除了深思熟虑，也应兼具勇敢果断的胆识，适时言所当言、据理力争，无须畏惧强权，以免错失良机。"},{"n":7,"no":"第 7 签","ji":"中中灵签","text":"奔波役役重重险，带水拖泥又渡山。更虑他方求别用，千山万水未能还。","jie":"灵签之曰：奔波役役重重险。带水拖泥又渡山之运途也。凡事必须谨慎。准备酌理。探取根源。明其是非者。审一己之进退。方向者。心存恶者得祸。存直者即可为获福矣。祸福者皆由人作之。退身可得进步难为。只宜守田切莫高扳。交易-平平婚姻-求福求财-秋冬自身-求福家宅-不利六畜-不利田蚕-不利寻人-难行人-阻六甲-求福山坟-不利讼词-亏疾病-祈福失物-见移徒-吉","xiangjie":"此签有”一念之差”之意。奉劝当事人，三思而行。一般人常对现状有所不满，或羡慕别人的际遇或地位环境，认为样样都比自己好，因此汲汲向外寻求，期望藉此获得另一片发展。人应珍惜现有的环境与资源，知福、惜福。谨记在做任何决定之前，务必慎重思量、仔细评估本身与环境的优弱势，找出最适合自己的定位与方向。切忌一时冲动负气出走，结果恐不如预期，既无法适应发挥所长，又藕断丝连、怀念原先熟悉的事物，将陷入进退两难、后悔莫及之境。"},{"n":8,"no":"第 8 签","ji":"上上灵签","text":"岁寒松柏古栽培，雨雪风霜总不摧。异日必当成大用，功名作个栋梁材。","jie":"灵签之曰：本签为松柏之岁寒者。任何之树木枯之后。仍挺具秀者。各面均呈祥。当异日成大材老焉。是大器晚成型。惟不可因此满足。必须因此更加培植。事事积德。方可有更好之明日。要之。象征平地风光夙缘有定。丰熟田稻家获余庆。交易-旺婚姻-成求财-顺利自身-顺利家宅-吉六畜-损田蚕-利寻人-至行人-有信六甲-生男山坟-吉讼词-有理疾病-安失物-见移徒-吉","xiangjie":"此签有”事在人为”之意。鼓励当事人，自强不息。有些人常常虎头蛇尾，短时间的努力不见成效，就打算放弃。然而会成功的人，背后的打拚必定多于常人，辛苦也不足为外人道。范仲淹画粥的故事，最令人感佩的即是他过人的耐力、专注的自制力以及经年累月，从不间断刻苦读书的精神。就如岁寒松柏，在历经雨雪风霜的侵袭后，仍然挺立不摇，坚强地存活下来。因此凡事若定下目标，就应全力以赴。切勿轻言放弃导致功败垂成。只要继续努力、持之以恒，必能先苦后甘，得到丰硕完美的成果。"},{"n":9,"no":"第 9 签","ji":"上上灵签","text":"劳君问我心中事，此意偏宜说向公。一片灵台明似镜，恰如明月正当空。","jie":"灵签之曰：本签者皎月当空之象也。凡事正直则吉之签。虽是前运不佳。前事去之后。渐见顺利者。君尔幸获此签之示者。平素之存心种德之所由成。后得如此之佳境。亦即是心中正直。理顺法宽天无私意莫空虚看。交易-旺婚姻-成求财-平平自身-顺利家宅-吉六畜-损田蚕-利寻人-至行人-动六甲-生男山坟-吉讼词-有理疾病-得安失物-祈福移徒-吉","xiangjie":"此签有”杂不如精”之意。只有把心思赋予于一件事情上，才能真正融会贯通，并能将其发挥到极致。只有不断学习并练习，才能够真正掌握一门技能的精髓，达到炉火纯青的境界。只有熟练掌握一种技能，才能更好地发挥自身的能力，提升自身实力，并拥有更大的胸怀、眼界。"},{"n":10,"no":"第 10 签","ji":"下灵签","text":"椟藏无价宝和珍，只管他乡外处寻。好似将灯来觅火，不如安静莫劳心。","jie":"灵签之曰：将灯不见火之象，凡事自就之表征者，逢此下下之时，宜顶天拜地，始可得无灾，是谋望之不成，修吾身后，积德，布施，后必有回天之机，亦即是机缘若遇何事不成春无限意眼前似真此者也。交易-难婚姻-合求财-难自身-安家宅-欠利六畜-难养田蚕-秋吉寻人-见行人-动六甲-生女山坟-平讼词-亏疾病-设送失物-难见移徒-守旧","xiangjie":"此签有”枉费心机”之意。奉劝当事人，凡事不要强求。人很难感到知足，总是想要更多、想追求的更好，于是千般用计、终日汲汲追求，只为了据为己有，好满足自身的慾望。须知”慾望”乃是无穷止尽的深渊，让人深陷其中而浑然不觉。谨记”知足常乐”，应珍惜现在身边所拥有的事物，淡泊物质名利的渴求。在做任何事之前，先审慎评量自己是否需要。须知”命里有时终须有”，不属于自己的一切，就算强求也是枉然，只是白费心机而已。"},{"n":11,"no":"第 11 签","ji":"上上灵签","text":"欲求好事喜非常，争奈姻亲只暂忙。毕竟到头成好事，贵人接引贵人乡。","jie":"灵签之曰：因祸致福之签。凡事则吉者也。曰欲求好事喜非常。暂时安当守份之时。虽是不合之时。亦可有成之时。贵人自有贵人引导之者。因此。君尔之前途是极光明者。有事盼望到底如斯若问此事贵人提携耶。交易-成婚姻-合求财-有自身-顺利家宅-吉六畜-中平田蚕-中平寻人-见行人-未至六甲-生男山坟-吉讼词-有理疾病-祭星失物-东方移徒-旺","xiangjie":"此签有”见机行事”之意。提醒当事人，凡事处之泰然。人有时会碰到”不得不”的情况，或许是不可抗拒的、或许是强加于己的，却也只能硬着头皮去做，但心中却惴惴不安。所谓”既来之，则安之”。在事情未成定论之时，无须预设太多立场、杞人忧天。持稳身心、处之泰然，把面临的状况当成一种磨练、一种经验，从这个经验中所得到的，不管是有形或无形的收获，绝对是正面的、出乎意料的。另外在抉择不定时，不妨听取身边亲朋好友的意见，有助事情迎刃而解。"},{"n":12,"no":"第 12 签","ji":"上上灵签","text":"时临否极泰当来，抖擞从君出暗埃；若遇卯寅佳信至，管教立志事和谐。","jie":"灵签之曰：时临否极泰当来。多年来之恶运。霉运已去。吉星高照之时。事事顺利。一路顺风。毫无阻碍者。将身上抖之擞之。身上之暗埃尽去。尤在卯寅佳信至时。要之。麻换得丝是笑虽哭。要见分明是见为福。交易-宜迟婚姻-成求财-吉自身-吉家宅-安六畜-不吉田蚕-有利寻人-见到行人-末回六甲-生男山坟-吉讼词-吉疾病-秋吉失物-见移徒-守旧","xiangjie":"此签有”勇往直前”之意。鼓励当事人，百折不挠。有时人在遇到阻碍刁难或被拒绝等不如意的情况发生时，便会心生退惧之意，甚至就此放弃。须知成功并非遥不可及，在努力的过程中，必然会面临各式各样的挑战，考验当事者的决心。故事中申包胥为了求得秦国的援兵，连续七昼夜不眠不休，诚意终于感动秦主愿意出兵增援，让楚国不致灭亡。由此可知，凡事除了必须下定决心之外，还要有坚强的意志力与不屈不挠的毅力。不论过程有多艰难困苦，绝勿轻言放弃，朝着目标持续努力，相信成功之日，已经近在眼前了。"},{"n":13,"no":"第 13 签","ji":"上上灵签","text":"自小生身富贵家，眼前万事总奢华。要君赐受金鱼袋，四海传名足可夸。","jie":"灵签之曰：君尔也。自小生身富贵之家。于是君汝之生活也。总是奢华之世界者。谋望皆成。惟有贵人之扶持者。必能称意。且不劳而成者。易言之。囚徙得赦。病遇良医。龙门得过。名显皇都之象。凡事变化则吉也。交易-宜迟婚姻-成合求财-秋冬自身-祈福家宅-吉六畜-平田蚕-中平寻人-见行人-祈保六甲-生女山坟-吉讼词-有理疾病-得安失物-东方移徒-守旧","xiangjie":"此签有”谦让未遑”之意。提醒当事人，施恩不求报。当有人向我们求助时，凡所当为，义不容辞。如果抱着希望对方回报的预期心理，就失去了原本为善的美意。须知”有心的功德不是真功德”。助人的根本意义，在于无心且单纯地去做，解决了问题之后，心里的快乐，绝非外在的有形物质可比拟。切勿期待对方有所表示、或因此窃喜念念不忘。相反地，如果自己受到帮助，即使是小小的恩惠，也要谨记在心、不可或忘，有机会立即加以报答。谨记施比受更有福，为善不足挂齿。"},{"n":14,"no":"第 14 签","ji":"大吉灵签","text":"宛如仙鹤出樊笼，脱却羁縻处处通。南北东西无障碍，任君直上九霄中。","jie":"灵签之曰：为白鹤冲霄之象也。凡事先忧后吉之大吉签。功名成就。生意鼎盛。婚姻完满。财路亨通之时。宜再多阅圣贤书。修吾身。积吾德。必有喜讯连连之日来也。要之。从心无虑远达亨衢道心自在任意所如者耶。交易-合婚姻-合求财-合自身-还愿家宅-不安六畜-损田蚕-秋吉寻人-见行人-阻六甲-生男山坟-吉讼词-宜和疾病-设送失物-东南移徒-吉","xiangjie":"此签有”公私分明”之意。提醒当事人，豁达大度。有时我们会面临到必须和某人相处共事，偏偏此人曾与你结怨、旧恨未消。在此情境之下，如何化解心中的不快与尴尬，才是最难解的课题，考验当事者的智慧。换个角度思考：很多争执误会都是在不得已或无心的情况下发生。所谓”退一步海阔天空”，应该先抛开心中旧有的成见，同时勿预设太多立场，尽释前嫌。凡事以大局为重、就事论事，不计较个人恩怨。放宽心胸、放大格局，只要心中坦然，必可无所覊绊、从心无虑。"},{"n":15,"no":"第 15 签","ji":"下灵签","text":"触人口气最难吞，忽有灾危祸到门。卵破巢空无宿处，深为稳便把心存。","jie":"灵签之曰：本签示之于弟子曰。触人口气最难吞。如交友中盛气凌人者。令人难以容忍者。亦即是灾厄临时之兆。不可不知也。得罪于人者。如覆巢之祸。爰之。劝君稳便一语存于心。方能有吉。易言之。若得人怨何事可伸。如言不信到底为劳心。巢空之象。因此。凡事守旧则吉者也。交易-成婚姻-阻求财-吉自身-谨防家宅-先凶后吉六畜-旺田蚕-利寻人-见行人-顺六甲-生男山坟-吉讼词-有理疾病-还愿失物-难见移徒-难","xiangjie":"此签有”自食恶果”之意。奉劝当事人，勿一意孤行。有些人的个性直接、作风霸气，做事或说话不留情面，常让人因此尴尬愤怒、下不了台。明知有人不满，也毫不在乎。须知举止过于强悍不留余地最易与人结怨，让人怀恨在心。日积月累，得罪的人越多，对自己越是不利。凡事都应谨言慎行、保持柔软低调的身段、兼顾法理情。对于身边亲朋好友的劝谏，务必虚心接受、认真思考不是处并加以改进。切忌当成耳边风我行我素，免得届时陷入无人愿意出手相助、有理说不清之境，后悔也为时已晚。"},{"n":16,"no":"第 16 签","ji":"中上灵签","text":"攒眉思虑暂时开，咫尺云开见日来。宛似污泥中片玉，良工一举出尘埃。","jie":"灵签之曰：如玉在污泥中之象。如获良玉贵人一举。牵成时。出污泥则。可获吉也。亦即是表明君之今也。咫尺眼前之云拨开即得见日者。时运将到者。曰：得处无伪损中有益顺逆吉凶君子得吉之签。交易-成合婚姻-成求财-冬吉自身-秋冬吉家宅-不安六畜-平田蚕-祈福寻人-见行人-至六甲-虚山坟-安讼词-不利疾病-祈福失物-阻移徒-守旧","xiangjie":"此签有”忠言逆耳”之意。意味当事人，饮水思源。从小到大，我们身边多少会有关心自己的人。诸如父母、师长、朋友...等，或许心直口快直言不讳，但应知忠言逆耳，其用意无非是希望我们行得正、坐得稳，不致产生偏差的行为。应时刻抱持感恩的心，珍惜图报、用心体会。切勿轻视忽略，或视为理所当然、不放在心上。免得忽然有一天，关心的人不见了，离开了，才猛然领悟对方的语重心长而愧叹思念，到时岂不徒然，空留遗憾。"},{"n":17,"no":"第 17 签","ji":"中灵签","text":"莫听闲言与是非，晨昏只好念阿弥。若将妄语为真实，画饼如何疗得饥。","jie":"灵签之曰：如心中不定则看经也枉费心神是已。何以为之。又如人之妄语信之为真。岂非如画饼之充饥。焉得饱食。因时运之未到。时有吉。时有凶。劝尔宜晨昏多念阿弥陀佛。莫听闲言及是非。方可安行。凡事虚少实也。交易-顺利婚姻-阻求财-有自身-吉家宅-祈福六畜-不利田蚕-宜早寻人-见行人-迟六甲-安山坟-吉讼词-和疾病-还愿失物-不见移徒-守旧","xiangjie":"此签有”居心叵测”之意。奉劝当事人，勿心存歹念。有些人会因为别人的才华或才能高过自己而眼红猜忌、又害怕就此被取代，因此处心积虑，或百般阻挠、或肆放谣言。须知人与人相处，最可贵之处在于互信互助、共同扶持，最忌暗箭伤人、尔虞我诈。凡事应持心正直，起心动念皆向善。从自身做起，不道人长短、不搬弄是非。与人合作共事方面，保持和谐良性切磋，见贤思齐、截长补短。多替他人着想，勿存一己之私。"},{"n":18,"no":"第 18 签","ji":"上上灵签","text":"金乌西坠兔东临，日夜循环恒古今。僧道得之无不利，工商农士各开心。","jie":"灵签之曰：皎月当夜空，繇东方上升之象。爰之事事亨泰如意者。心中无事。所作皆奏功。又如上弓之一箭。发之即中也。君之今堪称如日月日夜循环亘古今。僧道得之无不利。因此。工商农士无不一一笑颜逐开者。交易-成婚姻-合求财-顺自身-吉家宅-安六畜-欠利田蚕-早种寻人-至行人-至六甲-生男山坟-大吉讼词-有理疾病-设送失物-迟见移徒-吉","xiangjie":"此签有”言之成理”之意。提醒当事人，勿过于主观。有些人本身通晓事理，加上对人事物观察入微，因此能够掌握先机，猜测事情的发展也往往不出所料。须知本身有一定的自信是必要且可喜的条件，但却不能太过或绝对地主观。过于主观在无形中会渐渐导致个人的自满自傲且无法接受其他不同的意见或批评。当知事情没有绝对，每个人的想法也随时都会改变。因此切忌光凭个人的角度来果断做决定或判断喜恶。仍应保持谦恭谨慎的态度，凡事客观、包容。"},{"n":19,"no":"第 19 签","ji":"中灵签","text":"急水滩头放艇时，狂风作浪欲何为。待他浪静风停后，稳载船归过不危。","jie":"灵签之曰：行舟浪淘之象。亦即是险境者。要之。君尔应知目下宜守旧。愿遵守静则吉。妄为则凶也。杨雄之仕王莽之朝为大夫。何以能胜大任。如在急水滩头放水之险行。待时若问营谋。时至方可为。千万叵轻举妄动。交易-未成婚姻-不就求财-未成自身-祈福家宅-祈福六畜-损田蚕-吉寻人-难行人-至六甲-虚惊山坟-吉讼词-和疾病-祈福失物-难寻移徒-守旧","xiangjie":"此签有”自甘堕落”之意。意味当事人，勿随波逐流。有些人为了取悦或取信对方，不惜昧着良心，一味巴结。这种矫饰的作为，容易引起他人的反感与不齿，纵使爬上高处，地位也难以稳固。凡事应坚守道德、无愧于心，靠自己努力打拚。虽然无法一步登天，但辛苦耕耘定有所成，且凭自己的实力所表现的成果，必可获得众人的肯定支持，声望不坠且难以撼动。另外，慎选合作对象也很重要。因此不论对方的人品、自我情绪管理、或待人接物方面，都是必须考虑在内的因素。"},{"n":20,"no":"第 20 签","ji":"上上灵签","text":"当春久雨喜初晴，玉兔金乌渐渐明。旧事已成新事遂，看看一跳入蓬瀛。","jie":"灵签之曰：本签者也。久雨初晴之象。为万事可成之兆。惟得此吉签。必须早植因缘。之后当有莫大利益。君尔在交友之中。宜留意者。必须选中之一为贵人。彼将成王公封爵之贵。将有大成之日。汝必能攀附上。易言之。佛神护佑百事无忧想平生事到底胜初者。交易-待时婚姻-随意求财-未遇自身-祈福家宅-中平六畜-阻田蚕-阻寻人-迟行人-阻六甲-生女山坟-旧吉讼词-和疾病-祭星失物-见移徒-吉","xiangjie":"此签有”苦尽甘来”之意。 鼓励大家要有坚持不懈的精神，成功者一定有强大的毅力和坚持不懈的精神，而成功能实现，是因为付出了努力、付出了心血。每一次尝试都是在探索，每一次失败都是在进步，要坚持自己的理想，让自己以最快的速度成长。所以请你勇往直前，不怕苦踏实努力，日久必有收获。"},{"n":21,"no":"第 21 签","ji":"上吉灵签","text":"阴阳道合总由天，女嫁男婚岂偶然。但看龙蛇堪运动，熊罴叶梦喜团圆。","jie":"灵签之曰：阴阳道合之签也。凡事和合而大吉者。君逢此为上吉之运。凡事渐获进步。惟不可欲速成。更不得存有欺人之心。今之形成者。获来不易。佳境之时。宜更修之。省之。积吾善可也。易言之。君之今I谋皆逐。婚姻孕男。资财积聚更吉田亩之收。交易-成婚姻-合求财-有自身-吉家宅-安六畜-旺田蚕-旺寻人-见行人-至六甲-生男山坟-大吉讼词-有理疾病-遇良失物-得见移徒-昌盛","xiangjie":"此签有”一探究竟”之意。学习是一个永无止境的过程。凡事要用心去体会，钻研问题才能不断发现其中的精妙之处，并从中获益匪浅。对于遇到的困难，我建议需要勇于挑战，不要畏惧失败，谨记成功的每一步都是值得去学习和积累的。"},{"n":22,"no":"第 22 签","ji":"上吉灵签","text":"四郊田亩皆枯竭，久旱俄然三日霖。花果草芽俱润泽，始知一雨值千金。","jie":"灵签之日：久旱逢雨之象。简易之。遇难中有贵人救之象也。因之。凡事遇难。千万不能馁志。不能心灰意懒。垂头丧气。君汝之命中。凡逢难事。必有贵人来扶之。如行人之有阻。但贵人代之。具有行人来之效。要之。田禾能倍收。谋望相宜。病逢妙药。行人使之好运者也。交易-迟婚姻-合求财-颇有自身-安家宅-祈保六畜-利田蚕-利寻人-难行人-有阻六甲-生女山坟-安吉讼词-亏疾病-设送失物-西方移徒-守旧","xiangjie":"此签有”无刻或忘”之意。，一个人可以不改变整个世界，但是却可以改变自己身边的事情。所以我们每个人都有义务去认真做好自己肩上的事情，为这个世界做出积极的贡献，为其他生命和环境的幸福而努力的去奋斗。这时候我们可以把握当下，创造更多美好的未来，勇敢地走向前方，争取更大的成功。"},{"n":23,"no":"第 23 签","ji":"上平灵签","text":"欲攀仙桂蟾宫去，岂虑天门不放开。谋望一般音信好，高人自送岭头来。","jie":"灵签之曰：本签为望仙扳桂之象。凡事必能遇赀人之象者。虽属上平。惟宜多作福。求神庇佑之。方有化凶趋吉之时。到头。君汝谋望一般喜讯好。高人。贵人也。日将佳音报之而来。要之。商贾者有利。行藏无危。病可安。讼可理。尽可施为。交易-合婚姻-阻求财-随意自身-祈福家宅-欠安六畜-不利田蚕-不利寻人-难行人-有危六甲-祈福山坟-旧吉讼词-亏疾病-安失物-不见移徒-大吉","xiangjie":"此签有”抛砖引玉”之意。 提醒当事人，把爱心当作财富，用付出来换取快乐，付出不一定要有回报，但能够带给他人的是满满的幸福，自己也能够感受到最大的成就感。付出有风险，但付出的每一分努力都会收获到无法言喻的欢乐，所以不要害怕失去，要学会取舍，让自己的心情永远充满正能量。"},{"n":24,"no":"第 24 签","ji":"下灵签","text":"不成邻里不成家，水泡痴人似落花。芳问君恩难得力，到头毕竟事如麻。","jie":"灵签之曰：本签即是痴人丧德之象。凡事守旧待时。君汝目下即是水泡痴人似落花之命也。事事应顺天理。方平安。眼中无人之时。将何。必有福祸来临。不可不慎。亦即是到头毕竟如麻者。爰之。凡事求神作福。祷告。交易-难婚姻-待时求财-阻自身-险家宅-不利六畜-多灾田蚕-多灾寻人-至行人-阻六甲-祈福山坟-安讼词-亏疾病-急求神失物-难移徒-吉","xiangjie":"此签有”执迷不悟”之意。 奉劝当事人要做一个深思熟虑的人，要站在他人的角度去思考，在判断事情之前要先多用心思对事情进行分析，不要先入为主，要虚心听取他人的意见，不要轻易让情绪调动自己的判断，以免最后后悔莫及。"},{"n":25,"no":"第 25 签","ji":"上中灵签","text":"过了忧危第几重，从今再历永无凶。宽心自有宽心计，得遇高人护圣功。","jie":"灵签之曰：君之签。是宽心自有宽心计。得遇高人-贵人也。方能护圣功。易言之。凡事遇贵人方能吉也。亦即能过了忧危第几重。从今再历永无凶之境。凡事谋略之时必守之。不宜盲目冲之。三思而后行。方不致吃大亏。是到头来讼中有理。病得安愈。出外求外。枯井逢泉者也。交易-阻滞婚姻-和合求财-阻自身-阻家宅-平平六畜-不利田蚕-不利寻人-阻隔行人-阻隔六甲-有险山坟-不安讼词-有理疾病-祈福失物-难移徒-不合","xiangjie":"此签有”有惊无险”之意。 提醒当事人在妥善处理各类事务时，要保持理智与冷静，勿自乱阵脚，遇事不可过度着急，同时要学会施恩不求报、予人不追悔，并记住那些帮助自己解决实际困难或解开疑惑的人，需要表达感激之情，给予必要的报答。"},{"n":26,"no":"第 26 签","ji":"平灵签","text":"上下传来事总虚，天边接得一封书。书中许我功名事，直待终时亦是无。","jie":"灵签之曰：是接日虚望之象。宜守旧待时者。不可听信世人之言。宜自吾有主见。以智止谣。何必听人之者。宜向神求之。神灵加护之时。必有转机。因直待终时亦是无者。因此。守之。规谋之。待来日之计用之。易言之。求闲不闻。目下心烦。欲求名利。徒尔虚投者。 交易-不成婚姻-不成求财-阻自身-安家宅-祈福六畜-养田蚕-半熟寻人-西方行人-有信六甲-生女山坟-吉讼词-亏疾病-祈福失物-难寻移徒-守旧","xiangjie":"此签有”误会一场”之意。 在解决问题时要掌握好度，如果一次再三的道歉还没有解决问题，不要用冤枉的方式，适当的表达出自己的立场，让当事人了解自己的情况和态度，可以表示出自己所有的诚意，更有助于双方达成一个共识。"},{"n":27,"no":"第 27 签","ji":"中中灵签","text":"一谋一用一番机，虑后疑前不敢为。时至自然逢贵助，银墙铁壁好安居。","jie":"灵签之曰：本签者澯谢址之家。凡事接引贵人乡者。君之今也。一谋一事一番机之时。举棋不定之刻。惟君正逢贵人助也。有银墙铁壁所安靠之人。虽有贵人之签。必须慎交。方有向善之效。否则受伊人愚弄。反得败名。交易-难婚姻-阻求财-有自身-吉家宅-吉六畜-利田蚕-熟寻人-迟行人-阻六甲-生女山坟-守旧讼词-宜和疾病-延安失物-无踪移徒-吉","xiangjie":"此签有”戒慎恐惧”之意。提醒当事人凡事自食其力。 有时候人们有贪图权力和利益的渴望，会使得他们想要依靠某个有权势的对象，对他们来说他们的”靠山”越稳越好。但是在实际情况中，没有任何一件事可以依靠一步登天而达到成功。就拿故事中的李邺侯来说，他遵循心中雪亮，不愿意被名利束缚，选择放弃有权有势的官职。这就告诉我们脚踏实地，靠自己的实力去打拚，当然在与人合作方面也需要明辨是非，不要妄想贪图太多的利益，免得深陷其中而不能自拔。"},{"n":28,"no":"第 28 签","ji":"上上灵签","text":"东方月上正婵娟，顷刻云遮月半边。莫道圆时还又缺，须教缺处复重圆。","jie":"灵签之曰：月被云遮之象。亦即是凡事。暂时且守旧。待时老。君汝之早年也。事事不遇之时。唯多年辛勤。终能入佳境。事事如意者。好景已迫眉睫。愿君多行善。亦即是言积德。以迓天庥者。君之目前即是浮云遮月不得疑惑。得待云开自见明月时。交易-吉婚姻-合求财-阻自身-祈保家宅-不安六畜-不利田蚕-不利寻人-难行人-滞六甲-有惊山坟-改讼词-亏疾病-难痊失物-西方移徒-守旧","xiangjie":"此签有”幸得援手”之意。提醒当事人，凡事以礼相待。 我们所处的这个社会是一个相互依存并充满机遇的多元文化世界，不应该忽视任何人，而是要在每一次与他们的互动中发掘出有价值的资源。应该用一颗开放的心去接纳来自不同背景的人，尊重他们的个性，并且从他们身上学习到有用的知识，保持对彼此的尊重。同时，我们也应该从这种交流中获得最大的收获，更好地实现生活的更多可能性。"},{"n":29,"no":"第 29 签","ji":"大吉灵签","text":"宝剑光芒出匣时，匣中应不被尘欺。贵人亲手提携起，尽可防身更勿疑。","jie":"灵签之曰：本签示之曰。是宝剑出匣之象。凡事有高人指出时。必有成者。尽可防身更无疑者。时运已济。安闲守分。至卯年月。大有发展。锋芒毕露者。士子科第。仕官之人。得擢升。另言之。宝剑出匣光辉万里贵人指出。无不赞美者也。交易-成婚姻-好求财-利自身-吉家宅-祈福六畜-损田蚕-宜早寻人-见行人-迟六甲-生女山坟-吉讼词-和疾病-还愿失物-南方移徒-兴","xiangjie":"此签有”寻求他志”之意。鼓励当事人，专精技能。尝试先探索自己有兴趣的事情，可以学习新的技能，例如编程、音乐、舞蹈、书法、烹饪等，从而有效地利用自己的时间，也可以效仿百里奚的行为，在自己的工作之外，持续寻找新的活动，锻炼自己的能力，完善自身的素质。此外可以通过与别人分享经历，学习他们的经验与技能，以收获不同的见解，增强自己的素养，从而在生活和工作中取得成功。"},{"n":30,"no":"第 30 签","ji":"中中灵签","text":"劝君切莫向他求，似鹤飞来暗箭投。若去采薪蛇伏草，恐遭毒手也堪忧。","jie":"灵签之曰：本签示之曰。若去采薪蛇伏草。恐遭毒手也堪虞之命途耶。是安身得己之象。凡事暂守旧待时之者。谋事不相宜。一事无成者。田亩。六畜之不利于时。唯山坎是大吉者。易言之。闭口存舌。闲事莫理不可生心恐伤于己。交易-滞婚姻-未合求财-待时自身-平平家宅-安六畜-不利田蚕-不利寻人-阻行人-阻六甲-虚惊山坟-大吉讼词-亏疾病-难痊失物-不见移徒-守旧","xiangjie":"此签有”误信人言”之意。奉劝当事人，应有自主的判断能力。在犹豫不决的时候一定要慎重考虑，在有限的情况下多多思考，收集有效信息，认真考虑所有前提和结果，评估每个可能选择并做出正确的决定。尽快做出决定否则也许会导致时间上的浪费，或进入一种“犹豫不决盲目”的状态，如果你需要可以寻求他人的意见，但最终决定还是要由你来做。"},{"n":31,"no":"第 31 签","ji":"上中灵签","text":"清闲无事静处坐，饥时吃饭困时卧。放下身心不用忙，必定不遭殃与祸。","jie":"灵签之曰：本签曰。清闲无事静处坐。饥时吃饭困时卧。可知君尔者当守己安静之时。凡事宜守旧。不宜在此时轻举妄动。动则凶。静则吉之刻。放下身心不用忙。唯有如此。方可除去祸与殃。易言之。守己安静即是待他时之至。必定周全。交易-宜迟婚姻-合求财-待时自身-安家宅-祈福六畜-平平田蚕-秋熟寻人-难行人-至六甲-生女山坟-吉讼词-和疾病-设送失物-虚移徒-吉","xiangjie":"此签有”思绪杂乱”之意。奉劝当事人，不要随便乱想。 人要有理想而不必执着于妄想。梦想不能唯恣情怀，要有预判未来的能力，以便在逆境中坚持下去，不被失败击垮。只有努力才会出现奇迹。努力的过程是漫长的，它需要耐心与坚持，只有坚持到底才有收获。"},{"n":32,"no":"第 32 签","ji":"上上灵签","text":"渺渺前途事可疑，石中藏玉有谁知。一朝良匠分明剖，始觉其中碧玉奇。","jie":"灵签之曰：君今之命运也。如石中剖玉之象。八百事啻要费力即可成者。易言之。汝是石中藏玉虽知。孜孜不倦中取玉之勤劳人。人生旅途中。常有惊险之象出现。易言之。玉在石中。匠手可知。直待剖出真可施。交易-阻婚姻-成求财-劳力自身-安家宅-平平六畜-旺田蚕-晚成寻人-见行人-杳六甲-虚山坟-改讼词-惊疾病-欠安失物-西方移徒-改","xiangjie":"此签有”寻人捉刀”之意。奉劝当事人，凡事勿太依赖。通过自己尝试去解决问题，可以逐步成长与提升，学会知道如何解决一些简单的问题、遇到难题就会有智慧方法来解决。在解决问题的同时也要记住要有勇气去面对，不断努力最终才能取得成功。"},{"n":33,"no":"第 33 签","ji":"中中灵签","text":"石藏美玉在中心，得指何须向外寻。直待高人来剖析，恰如灵雨涤烦襟。","jie":"灵签之曰：又是珍玉内藏之象。是凡事忍耐得吉者也。君汝之今也。谋略不宜之时。乍看似机缘。行之反覆为之。无一事可成。石中既有玉藏。何必向外去寻。亦即是君守于今。自有展谋之时。不宜动。动不如一静。易言之。珍玉内藏不时求。不见待若遇贵人。事则得吉。交易-迟婚姻-就求财-待时自身-安家宅-祈保六畜-旺田蚕-半熟寻人-劳行人-阻甲-生男山坟-宜改讼词-搁疾病-遇良医失物-北方移徒-吉","xiangjie":"此签有”就事论事”之意。意味当事人，凡事不计前嫌。 没有完美的人或者关系，任何处境都会出现不同意见。当遇到这种情况时，最重要的是学会面对和包容，而不是争吵或怨恨。尊重彼此，友善相处，尊重别人才能获得回报。彼此信任，相处之中更加融洽，这样才能使双方都感到幸福。"},{"n":34,"no":"第 34 签","ji":"上上灵签","text":"出入行藏礼义恭，言必忠良听必聪。心下了然俱洞彻，光明如日正当空。","jie":"灵签之曰：本签也。红日当空之象。凡事自来有成。君之今也。出入行藏礼义恭。言必忠良听必聪。与友朋。长辈之交。必须礼恭。天下之事能透彻。君之运也。光明则如日正当空时。易言之。空中无事秋水澄清别无阻碍。自然有成者。交易-难婚姻-合求财-虚自身-安家宅-清吉六畜-衰田蚕-不利寻人-滞行人-阻六甲-有险山坟-吉讼词-亏疾病-设送失物-虚移徒-守旧","xiangjie":"此签有”事无绝对”之意。意味当事人，勿太过主观。 非常赞同你的观点，每个人对事情有不同的看法和看法，保持开放思维可以更好地接受别人的想法，同时也能更好地探索新的可能性。坚持自己的主张，但也要学会愿意接受其他的建议和反驳，并且勤于学习不同的解决方法，可以给每个人带来更多积极的正能量。"},{"n":35,"no":"第 35 签","ji":"上上灵签","text":"衣冠重整旧宿风，道是无功却有功。扫却当途荆棘碍，三人共议事相同。","jie":"灵签之曰：此签是扫却当途荆棘碍。三人共议事相同者。可知重整之象。凡事改变即大吉。功名。交易均可得利。求财。时运。六畜亦均有利可图。是谋略成功。年运亨通之时。一旦称心。万事通之刻。君汝之今为不须忧虑。自有期间。前程事更换可宜。交易-利婚姻-阻求财-好自身-吉家宅-乱六畜-兴田蚕-不利寻人-至行人-至六甲-惊山坟-宜旧讼词-有理疾病-祈福失物-迟见移徒-安","xiangjie":"此签有”饮水思源”之意。提醒当事人，不要轻易变心弃节。 将追求自己理想的路程持之以恒，即使遇到困难、面临挑战，也要能坚强勇敢、不断前行，保持内心宁静、立正心态，应变多变，不断努力，勇往直前，把自己的生活过得更精彩，才能取得成功。"},{"n":36,"no":"第 36 签","ji":"上上灵签","text":"目前病讼不须忧，实地资财尽可求。恰好系猿今脱锁，得归仙洞去来游。","jie":"灵签之曰：本签曰。目前病讼不须忧。实地资财尽可求。是上上之签。惟有积德。布施之举。必可更进展之机。如忽尔遇不如意之时。因君汝目下是系猿脱锁之象。凡是通泰。因此。再加修心向善。必有神佑。易言之。且自宽舒待他时至路达通衢也。交易-待时婚姻-未成求财-大利自身-安家宅-不安六畜-平田蚕-十足寻人-至行人-至六甲-祈保山坟-吉讼词-有理疾病-欠安失物-远移徒-吉","xiangjie":"此签有”居安思危”之意。提醒当事人，小心行事。人在得到帮助、好运连连或机会来临之时，往往喜不自胜、乐不可支。须知纵然目前看似稳操胜算，有势在必行之意，但切勿过于开怀狂喜，仍应时刻自我警惕”物满则溢、乐极生悲”的道理。冷静下来，仔细审慎地思考接下来该怎么做。在此同时，别忘了兼顾到别人，更不要忽略了他人的感受。应尽量保持平常心，切勿急躁，放慢脚步、顺势而为。"},{"n":37,"no":"第 37 签","ji":"平平灵签","text":"欲问身安运泰时，风中灯烛不相宜。争如收拾深堂坐，庶免光摇静处期。","jie":"灵签之曰：本签也。风前灯烛之签也。不相宜者。惟凡事小心。谨慎则吉也。君必须收拾深堂坐。亦即是得静为宜吉。如动则凶至。只好暂时忍耐之。时到之时。必有吉祥之象。随君而来。易言之。静处安身命待时泰。动心惹祸。静守救危耶。交易-难婚姻-不合求财-有自身-平平家宅-守旧六畜-安田蚕-秋吉寻人-有行人-有信六甲-祈保山坟-勿改讼词-和疾病-祭星失物-难归移徒-守旧","xiangjie":"此签有”漠不关心”之意。提醒当事人，勿太独善其身。有些人不喜欢涉入是非，也不贪图它物，更不愿与人高攀，因此本身信誉极佳。须知本身洁身自爱又能自律是一件好事，但遇到需要帮忙或协助的情况时，也不能完全置之不理。凡事”不沾锅”的处世态度，虽然可以远离许多是非纠葛和省掉许多麻烦，但却会让人觉得过于自命清高、只顾自己不管别人，似乎有点太偏于自私。行事勿独来独往，应多与人结交相处，能帮得上忙的就尽力而为，如果有人需要忠肯的建议，也不要吝开金口。在顾好自己的同时，请别忘了兼善天下。"},{"n":38,"no":"第 38 签","ji":"中平灵签","text":"镜月当空出匣时，刹那云雾暗迷离。宽心守待浮云散，更改相宜可望为。","jie":"灵签之曰：本签为浮云遮月之象。目前事事无须如意之时亦即是劝君叵动。俟时运之来至。动之方吉利。唯有汝宽心守待。耐心待至拨云见皎洁月娘时。汝即家居无忧。人口阴灾作福。保佑之。不致有破财之时。守之。不宜不遵行。交易-待时婚姻-难合求财-难自身-祈保家宅-不安六畜-损田蚕-损寻人-遇行人-阻六甲-虚花山坟-宜修讼词-和疾病-延安失物-虚移徒-吉","xiangjie":"此签有”急躁武断”之意。意味当事人，小不忍则乱大谋。”忍耐”的含意很广，范围包罗万象，不单只是表面上的形容。”忍耐”是积极的、勇敢的、坚强的、乐观的、真心的。举历史故事的例子来说：‘刘琨闻鸡起舞’，是积极的忍耐。‘宰相萧何追韩信’，是勇敢的忍耐。‘程婴忍辱匿孤’，是坚强的忍耐。‘诸葛亮隐居卧龙冈’，是乐观的忍耐。‘郭子仪免胄见回纥’，是真心的忍耐。藉由忍耐，时时刻刻考验我们的心性，并激荡出无比的智慧。凡事忍耐，并不间断地充实自我本身的学识。"},{"n":39,"no":"第 39 签","ji":"中平灵签","text":"天边消息应难问，切莫私心强望求。若把石头磨作镜，精神枉费一时休。","jie":"灵签之曰：本签告之于弟子曰。若把石头磨成镜。精神枉费一时休之安静守旧之象也。一切事宜皆在低潮中。宜小心。小心。如六畜之损。田亩之亏。宜拾旧图新。适合时潮。方能振兴起色。六甲生女亦不必气馁。宜积德。修身为先。必有赖之。易言之。千般用计届时皆空心守旧。不必强求者。交易-阻婚姻-不合求财-平平自身-提防家宅-安六畜-损田蚕-利寻人-难行人-动六甲-生女山坟-大吉讼词-亏疾病-设送失物-空移徒-平安","xiangjie":"此签有”积怨难消”之意。奉劝当事人，勿存心不良。有些人一旦受到不留情的指责或羞辱，就会觉得难以忍受、恼羞成怒。为了达到报复的目的，甚至想利用不相干的人。须知在愤怒当头时，很容易失去理智，产生不好的念头，做出失当的行为。当思”说者无心”，宽容原谅。有些话听过就算了，实在不必因此而耿耿于怀、把自己气得半死，更不应怀恨在心、挟怨报复。另外，自己本身的事，切勿牵连到不相干的人身上。所谓”己所不欲，勿施于人”。"},{"n":40,"no":"第 40 签","ji":"平中灵签","text":"红轮西坠兔东升，阴长阳消是两形。若是女人占此卦，增添福禄称心情。","jie":"灵签之曰：本签是阴长阳消之家。凡事先难后吉者。不管是交易。求财。时运。均在开始时。均为不利。但是因一己之奋斗。苦心造诣。终有出头之日。所幸田亩大收。六畜兴旺。皆是祈福所赐。疾病。皆有险。宜小心。易言之。阴利女人。不宜男子。若问求望。无忧从喜。交易-吉婚姻-不合求财-待时自身-祈福家宅-不利六畜-旺田蚕-旺寻人-隔行人-阻六甲-虚山坟-吉讼词-亏疾病-有惊失物-空移徒-大吉","xiangjie":"此签有”知礼尽孝”之意。意味当事人，不论男女，都应知礼法、尽孝道。孔子说：”非礼勿视、非礼勿言、非礼勿听、非礼勿动。”人必须约束自己的行为举止，凡事都不应越矩。现今电视节目、电影、网路、书籍等，会污染身心产生妄想邪念的，不应看。不道人之短，不说己之长，不过问别人的隐私。别人在说八卦、私事，不关自己的事，避得远远的，不听。不做违反道德良心的事。凡事真诚、尊重、为他人着想，即是知礼。尽孝道是做人的根本，莫忘父母生养之恩，凡事勿让父母操心，时刻挂念、问候关心，而不只是在金钱上的供养。守礼尽孝是道德的根本，不会因为时代变迁而有所改变。"},{"n":41,"no":"第 41 签","ji":"中下灵签","text":"无限好事君须记，恰如认贼作为子。莫贪眼下有些甜，可虑他时还受苦。","jie":"灵签之曰：本签示于弟子曰。认贼为子之象。不宜苟且者。神戒之曰。莫贪眼下有些甜头。趋之。后果堪虞。到头来还是受苦者。功名。交易。尚不理想。求财皆在待时之命运。为认贼作子之时。易言之。只道一着君子莫错宰把身心不致耽搁。交易-难婚姻-未合求财-待时自身-平常家宅-不安六畜-安田蚕-半熟寻人-至行人-至六甲-生男惊山坟-中平讼词-宜和疾病-祭星失物-难寻移徒-祈保","xiangjie":"此签有”贪多必失”之意。奉劝当事人，凡事要懂得节制。对于目前所拥有的，应知好好珍惜、谨慎运用。牢牢把持身心，勿让欲望无止尽的扩大。当知满足现状，切忌还想要更多更多。行事勿过于骄纵奢华，勿沉迷于酒色财气之中。否则纵有金山银山，转眼也会成空。不要妄想把全部的东西都想要占为己有。不属于自己的物事，不必强求。"},{"n":42,"no":"第 42 签","ji":"上灵签","text":"君垂恩泽润无边，覆祷祈禳没党偏。一切有情皆受用，均沾乐利得周全。","jie":"灵签之曰：本签示之曰。天垂甘露之泉。凡事大吉利者。亦即是先难后易者所得。功名成。交易就。婚姻虽平庸。但是难得之缘也。时运至冬季即至。六畜。田亩皆旺之时。宜勤俭。千万不得浪透。陷已于绝境者。易言之。天降甘露。君子莫忘求谋成就。和合吉昌之签也。交易-成婚姻-中吉求财-未有自身-冬吉家宅-祈福六畜-中平田蚕-中平寻人-见行人-动六甲-平安山坟-安讼词-胜疾病-解失物-空移徒-守旧","xiangjie":"此签有”顺势而为”之意。提醒当事人，凡事不要太固执。须知出于善意的做法没有什么不好，但要能审时度势，视情况来推动。勿立刻急于改变现状，而忽略了旧有的行为模式。对于旧有的模式，应仔细评估衡量，去芜存菁、再加上自己的新理念，或可让事情更臻完满。自己的想法固然没错，仍然可以听听别人的意见，对于旁人恳切的建言，要能虚心接受，慎重思考。切忌带着个人的偏见、只为了反对而反对。"},{"n":43,"no":"第 43 签","ji":"大吉灵签","text":"天地交泰万物新，自形自色自怡神。森罗万象皆精彩，事事和谐得称人。","jie":"灵签之曰：本签为天地交泰之象。是事事和谐得称人者。季冬有喜。交春之时。人事遂意者。必是喜事连连之人。万象新之时。自形自色自怡神。事事吉祥之际遇。相机而动者。易言之。本签者天生万物谋望皆新福德积聚瑞气添增。可喜之签也。交易-利婚姻-合求财-有自身-安家宅-吉六畜-中平田蚕-中平寻人-见行人-有阻六甲-生男山坟-东西吉讼词-胜疾病-祭星失物-东方移徒-利","xiangjie":"此签有”不拘小节”之意。提醒当事人，不要太吹毛求疵。有些人除了对自己很严格、对别人也很挑剔，凡事都要求十全十美，尤其重视细节。须知对于自己本身，过度要求完美，反而会放不开、形成一种无形的精神压力。而在待人处世上，更应有容人的雅量。所谓”人非圣贤，孰能无过?”。每个人都有个性上的小小缺失，但只要不影响大局，又何必在意?不要刻意挑三捡四，硬把自己的想法与要求加诸在别人身上，否则容易导致旁人无法忍受。成大事者只放眼大处，不拘泥细节。"},{"n":44,"no":"第 44 签","ji":"中中灵签","text":"棋逢敌手要藏机，黑白盘中未决时。到底欲知谁胜负，须教先着相机宜。","jie":"灵签之曰：本签为棋逢敌手之象也。凡事先吉。凡未小心。节俭则有转恶之嫌。宜小心为之。棋逢敌手之时。必藏有机。决定胜负之时莫迟疑。认为可行则毫不犹豫之下即可。尤应和者。善有善报。恶有恶报。示人早知觉悟多作善。方能有善报者。交易-利婚姻-未合求财-遂意自身-平稳家宅-吉六畜-损田蚕-中平寻人-阻行人-阻六甲-生女山坟-守旧讼词-宜和疾病-祈福失物-空移徒-守旧","xiangjie":"此签有”多方思考”之意。意味当事人，谋定而后动。在面对事情时，不论大小，要能从里到外、仔细地分析判断。保持清明的理智与思路，冷静而缜密地假设任何可能发生的状况，模拟并想出因应之道。眼观四面、耳听八方，着眼大处时，也要兼顾细节。另外，在情况不佳而本身又处于较不利的弱势时，如果想硬碰硬，无异以卵击石，绝对没有好处。不妨请教志同道合的人，共同商议。藉着众人集思广益所想出的办法，也较能万无一失。大家有志一同、互相砥砺，相信定能扭转颓势、迎向成功之路。"},{"n":45,"no":"第 45 签","ji":"上上灵签","text":"温柔自是胜强刚，积善于门大吉昌。若是有人占此卦，宛如止渴遇琼浆。","jie":"灵签之曰：本签为积福门庭之象。凡事谋则吉者也。灵签曰。温柔自是胜强刚。积善于门大吉昌。为使己之事务。求财。时运吉昌者。必须积善。修德。布施。方能亨之。久而弥坚。易言之。天地有感应验非常佛神保持得福寿长之签。交易-利婚姻-合求财-遂好自身-安家宅-吉六畜-中平田蚕-秋利寻人-见行人-阻六甲-生男山坟-东西讼词-胜疾病-祈福失物-东方移徒-利","xiangjie":"此签有”千锤百链”之意。勉励当事人，凡事要禁得起考验。在人生中有一道一道的关卡，会遭遇到很多种情况，都是为了让我们能增长智慧、磨练心性。其中，当然也要学习忍耐。所谓”玉不琢、不成器”，越是可造之才，碰到的挫折与屈辱也会越多。乐观地换个角度想，很多事都只是一种过程，而你比别人多了更多的机会去体验，未尝不是好事。现在你极痛恨的人，说不定日后却是你最感激的人呢。有句话说：”不合理的要求是磨练”。凡事若能忍一时，将来必定受用无穷。"},{"n":46,"no":"第 46 签","ji":"上平灵签","text":"劝君耐守旧生涯，把定身心莫听邪。直待有人轻着力，满园枯木再开花。","jie":"灵签之曰：本签为枯木生花之家。即是万物逢春复苏之象。君尔多年辛劳得报于斯时。惟早植因缘。必有喜事连连。诗日：劝君耐守旧生涯。爰之。君之今宜静。不宜动。动则凶。静则吉。亦方能枯木再开花。向使逢遇贵人。可攀之。伊者后日之诸侯。易言之。决心守旧时至成就行多多逆。安静无忧。交易-成婚姻-就求财-待时自身-吉家宅-安六畜-难田蚕-五分寻人-杳行人-阻六甲-生女山坟-吉讼词-吉疾病-急求神失物-空移徒-守旧","xiangjie":"此签有”随缘自在”之意。意味当事人，人贵自立。很多成功且耳熟能详的人，在尚未成名之前，都只是个平凡而普通的小百姓。他们甚至没有料想到自己会成功。所以不必因为默默无名、或人微言轻而感到沮丧或自卑。毋须羡慕别人，应当知福惜福，坦然乐观地看待现状。每个人的价值观与人生观都不同，不要被别人的言语影响而导致心中摇摆不定。只要固守本分、一心向善，事情不论大小，只要是对的，就尽力去配合，努力把它做好。凡事尽心自律、无愧于心，必有机缘到时、一显身手之日。"},{"n":47,"no":"第 47 签","ji":"上上灵签","text":"锦上添花色更鲜，运来禄马喜双全。时人莫讶功名晚，一举登科四海传。","jie":"灵签之曰：本签者。福禄双全之象者。凡事兴隆大吉之签。曰锦上添花色更鲜。运来之时也喜双全。八十二对大魁。不是晚也。奉献社会人群。积吾德。荫子孙。何乐不为。为天数之所赐。宜再积德。方有同点灯之故。易言之。儿有双亲。守时待庆遂平生志。都来自命。交易-阻婚姻-合求财-利自身-安家宅-祈保六畜-平田蚕-八分寻人-至行人-迟六甲-生男山坟-利讼词-宜和疾病-祈福失物-西北移徒-吉","xiangjie":"此签有”努力向上”之意。鼓励当事人，凡事力图振作。人最怕光说不练、或立定志向后，又轻易退缩、不能坚持到底。须知任何事只要有决心，就无须担忧起步太晚、或觉得不可能、更不要想”放弃”的念头。时时刻刻自我砥砺，朝着目标努力、再努力。所谓”天下无难事，只怕有心人”。切勿半途而废，只要抱着希望、努力不懈地持之以恒，如此成功之日，想必也不远了。"},{"n":48,"no":"第 48 签","ji":"大吉灵签","text":"鵾鸟秋光化作鹏，翱翔得意尽飞腾。直冲万里云霄外，任是诸禽总不能。","jie":"灵签之曰：本签为鵾乌化鹏之吉象也。凡事皆能兴隆大吉。功名成之。利得之。婚合之。六畜旺之。六甲全之。官事。等等。无一不顺利也。直冲云霄之外。无可与伦比者。惟逢此佳境。勿忘今之所由成。积德。布施之再行者。可维护君尔之谋望无疑。易言之。今之君也。桂花时节财禄成此。交易-宜迟婚姻-不合求财-秋旺自身-吉家宅-利六畜-春旺田蚕-中平寻人-见行人-阻六甲-安山坟-吉讼词-胜疾病-祈保失物-西方移徒-守旧","xiangjie":"此签有”胆大心细”之意。提醒当事人，智勇兼俱。有些人够勇敢，但不够细心。有些人够细心，却又不够勇敢。那么要如何”有勇有谋”呢?其实平日若能深入细心地观察周遭，就能发现人事物之中细微巧妙的变化，也可以早一步掌握先机、提前准备行动。凡事仔细用心思考，判断事情的轻重缓急。一旦下了决定之后，就不要再犹豫不决，试着勇敢放手一搏。如果因迟疑再三而畏畏缩缩、导致错失良机，岂不叫人徒呼可惜。"},{"n":49,"no":"第 49 签","ji":"下下灵签","text":"营图万事若冰澌，何必悭贪苦所为。只好静心闲处坐，待他兴变复奚疑。","jie":"灵签之曰：水冻成冰，冰还溶水，若问营谋，何如不理。交易-不利婚姻-不合求财-难自身-祈保家宅-不安六畜-损田蚕-亏寻人-见行人-迟六甲-险山坟-吉讼词-和疾病-难痊失物-凶移徒-守旧","xiangjie":"此签有”自寻死路”之意。奉劝当事人，莫心怀不轨。有些人表面上对别人很好，但其实心里满是害人的念头，只是隐藏的很好，看不出来而已。须知此举也许可以骗得过旁人，但终究骗不了自己。表里不一的人是很痛苦的，有时说了谎，却又怕被揭穿，于是再说一个谎。如此恶性循环，提心吊胆。但是内心交战，知道是”明知不可为而为之”。这种良知的谴责，岂不是自我折磨、苦不堪言?所谓”害人之心不可有”。凡事要能行得正、坐得稳，勿存妄想邪念，免得害人又害己。"},{"n":50,"no":"第 50 签","ji":"大吉灵签","text":"五湖四海尽行船，高挂风帆把舵坚。幸得顺风随所至，满船宝贝称心田。","jie":"灵签之曰：本签曰。五湖四海尽行船。高挂风帆把舵坚。如三宝太监。郑和之行之于南洋也。只要把舵牢住。必可扬德威于异域者。为顺风行船之象。凡事和合大吉者。虽大吉之签。百事兴。唯必留心正应。反应之不同。易言之。本签者自在优游。不须着力。财源重重。无不惟悦者。交易-宜迟婚姻-不合求财-西方自身-吉家宅-利六畜-春旺田蚕-秋利寻人-至行人-阻六甲-安山坟-南利讼词-亏疾病-解失物-西方移徒-守旧","xiangjie":"此签有”友善关怀”之意。提醒当事人，互助互动。即使本身事情再多、再忙，也不能忽略了与周遭旁人跟亲朋好友间的联系交流。透过本身发自于内心的真挚恳切，旁人必能感受到善意与温暖。这种内心的真实感受，胜过外在的一切有形物质。凡事由本身做起，藉由诚恳的表达与关心，自己与他人之间，在无形中也递增了互信互助的情谊，因此而更加团结、更加和谐。"},{"n":51,"no":"第 51 签","ji":"上平灵签","text":"夏日初临日正长，人皆愁恼热非常。天公也解诸人意，故遣薰风特送凉。","jie":"灵签之曰：本签之诗也。炎天生凉之象。凡事所谋稳当者。虽是中平之签。人生之乐在于此。凡事知足之时即大安。谋事不宜因小嫌弃。改大则败者。一石拾之嫌小。舍之。再拾之。无一而足者。到头无石可捡。易言之。进用莫疑。最佳期日至。凡成谋望。不须忧虑。交易-平常婚姻-合求财-秋吉自身-谨防家宅-祈福六畜-平田蚕-损寻人-见行人-动六甲-生男山坟-吉讼词-吉疾病-还愿失物-北方移徒-守旧","xiangjie":"此签有”坦然面对”之意。提醒当事人，知己知彼。如果能够有自知之明，在面对问题的时候，不会选择逃避，也不会冒然有所行动。仔细分析自己的优势与弱势，就能找出适合自己的志向、又能发挥所长之处。知道该怎么努力才能成功；面对挫折与失败，也会勇于承认接受、彻底的自我检讨改进。先知己后才能知彼，再谨慎地审时度势，必能如鱼得水，前景可期。"},{"n":52,"no":"第 52 签","ji":"下灵签","text":"水中捉月费工夫，费尽功夫却又无。莫信闲言并浪论，枉抛心力也难图。","jie":"灵签之曰：水中捉月之象。凡事所为不利。在水中捞月亮很费工夫。但是费尽工夫却又捞不到。不要相信闲言和没有根据的言论。白白用心。做事也不能完成目标。易言之。讹言莫信。费力劳心。家宅不利。不可妄行。交易-难婚姻-未就求财-秋吉自身-欠吉家宅-不安六畜-损田蚕-五分寻人-至行人-有灾六甲-祈保山坟-吉讼词-和疾病-祈保失物-难移徒-平常","xiangjie":"此签有”枉费心力”之意。奉劝当事人，眼见不一定为凭。须知社会上很多种现象都是真真假假、假假真真。有时眼里看到的、耳里听见的，都可能只是表面，甚或是一种假象。是、非、真、假，唯有靠智慧来判断。在做任何事之前，一定要经过仔细的思考与再三的求证。莫被一时的假象所迷惑，也不要立刻就信以为真、冒失行动，结果恐导致白忙一场，只是徒劳心力而已。"},{"n":53,"no":"第 53 签","ji":"上上灵签","text":"失意翻成得意时，龙吟虎啸两相宜。青云有路终须到，许我功名必可期。","jie":"灵签之曰：本签为龙吟虎啸之象也。凡事谋略之。吉昌者也。失意翻成得意时。黑暗之去也黎明至。光明也。于是青云中有路。终于到。天神允我功名可期。易言之。教去即去教。住即住口有亨通到头必利者。一片虔诚祈保之。必有助益于君尔。交易-难成婚姻-成就求财-中平自身-欠吉家宅-不安六畜-损田蚕-五分寻人-见行人-至六甲-祈保山坟-吉讼词-和疾病-安失物-见移徒-吉","xiangjie":"此签有”收放自如”之意。提醒当事人，凡事适度地拿捏分寸。有时人往往太在意别人对自己的看法，所以刻意保持身段，却因此放不开，说话做事也相对地被局限。有时人却因为太过随性，反而变成我行我素，又会让人觉得放肆且不知礼法。其实该严肃时就要严肃，不要仍然嘻皮笑脸、东张西望，会让人觉得举止轻浮、三心二意。该放松时就要放松，不要一昧墨守成规、过于拘谨，又会让人觉得难以相处、不知变通。应视情况场合，调整本身的行为举止。说该说的话，做该做的事。"},{"n":54,"no":"第 54 签","ji":"中下灵签","text":"梦中得宝醒来无，应说巫山只是虚。苦问婚姻并病讼，别寻生路得相宜。","jie":"灵签之曰：本签曰。梦中得宝醒来无。可知君之谋望。均归虚者也。功名。交易。婚姻。求财等。皆守旧方可。目下之所由成者积德。修身之不足所由生。爰之。更在修阴骘方面多下功夫。必有转机之时。前程方可远大。易言之。本签也。戒人去恶从善。趋吉化凶者也。交易-难婚姻-待时求财-阻自身-谨防家宅-欠安六畜-不利田蚕-滞寻人-见行人-迟六甲-祈保山坟-不安讼词-亏疾病-求神保失物-空移徒-吉","xiangjie":"此签有”南柯一梦”之意。奉劝当事人，勿痴心妄想。人常感叹自己时运不济，又冀求功名富贵，希望一切应有尽有，好满足自身的欲望。因此常常幻想，日日做着发财梦、升迁梦，渴望有朝一日真能实现。疏不知人生如梦、得失无常，富贵荣华也只是一时的虚幻，转眼便成过眼云烟。奉劝当事人，与其空无的痴心幻想，还不如脚踏实地、诚恳务实的做好自己的本份。好运不会凭空而来，凡事有付出才有收获，知足即是福。"},{"n":55,"no":"第 55 签","ji":"大吉灵签","text":"相传罔替子孙贤，衣禄丰盈富在天。金马玉堂人快乐，饥时吃饭困时眠。","jie":"灵签之曰：本签示于弟子曰。子孙贤。衣禄丰盈富在天。君尔之命。即是富贵天定者。大吉大利之签者。功名。交易。婚姻。求财皆如意者。而且吃饭困时眠之运。逢此大吉利之时。宜多修德。积善。更可发扬光大者。交易-成婚姻-合求财-利自身-还愿家宅-欠安六畜-损田蚕-吉寻人-难行人-动六甲-平安山坟-安讼词-有贵人疾病-祭星失物-见移徒-吉","xiangjie":"此签有”失控惹祸”之意。提醒当事人，遇事不宜意气用事。有时人与人之间难免意见不合而发生争执口角。须知冲动于事无补，无论对方是否有错在先，但如果因此而忍不下一口气、非要争个理出来，却可能导致撕破脸不相往来、见面又尴尬的局面，甚至拖累到不相干的人替你收拾残局。这都是因为欠缺理智且没有顾虑到后果所造成的影响。俗云：”冤家宜解不宜结”。与其吵得面红耳赤闹得不可开交，还不如冷静下来，想个好方法，既不会伤害到对方，又可以避免让事情重蹈覆辙。心平气和解决问题，而非制造问题。"},{"n":56,"no":"第 56 签","ji":"中平灵签","text":"涧小石粗流水响，力劳撑驾恐损伤。路须指出前江去，风静潮平尽不妨。","jie":"灵签之曰：本签是涧水行船之象。是凡事先难后吉者。虽是君尔力劳撑驾。恐有损伤。先是劳而无功。路顺指出前江去。自有风静浪平。一路顺风之时。必须更修身。积善。布施。天心感应之时。必有更上一层之列。易言之。涧小滩多掌船劳力指出前江风帆顺得。交易-利婚姻-随意求财-中平自身-吉家宅-安六畜-损田蚕-秋利寻人-至行人-至六甲-生男山坟-宜修讼词-有理疾病-即安失物-滞移徒-吉","xiangjie":"此签有”功成身退”之意。意味当事人，凡事见好就收。任何事情在成功之前，都会经过努力的打拚、付出大量的心血，才能得到丰硕的成果。但在任务完成、功成名就之后，如何”见好就收”，才是最困难的考验。须知万事万物都没有一定的准则，既无法预料，也无从掌控。事情来了，就去面对，尽力去做，做完了，就要放下。凡事不要留存太多的眷恋，太多的眷恋只会让人更加执着，形成沉重的包袱丢不下。不要画地自限，适时地跳出束缚，才能随心所欲。凡事随缘，无须强求。"},{"n":57,"no":"第 57 签","ji":"上中灵签","text":"闻是闻非风过耳，好衣好禄日当空。君须记取他年事，汝意还同我意同。","jie":"灵签之曰：本签者好子见娘之象。凡事能遇贵人则化吉也。凡遇事可受贵人扶之。提携之后可成。必为其人所敬仰。一倡百和者。事事可以成功。好衣好禄日当空。易言之。选用谋望皆大吉昌。从心恳切。如子见娘。交易-成婚姻-合求财-顺自身-平家宅-欠安六畜-损田蚕-熟寻人-难行人-阻六甲-生女山坟-吉讼词-宜和疾病-祈保失物-凶","xiangjie":"此签有”随机应变”之意。鼓励当事人，积极表现。有些人很懂得如何随机应变，有时连身边看似不起眼的物事，都可以适时拿来运用，成功地为自己加分不少。须知很多机会往往稍纵即逝，要能够把握契机。即使看似希望渺茫，但仍值得一试，说不定就此一举成功。在自己本身方面，凡事勿预设太多立场，不要太悲观，所谓”因地制宜”，配合环境、人事，适度地调整做人处世的态度。应勇于尝试，不要太固执而一成不变。"},{"n":58,"no":"第 58 签","ji":"中中灵签","text":"忠言善言君须记，莫向他方求别艺。劝君安守旧生涯，除却有余都不是。","jie":"灵签之曰：本签者。要君尔必守旧生涯之象。凡事必须三思而后行。不宜轻举妄动。诗曰。忠言善语君须记。勿因不满现况而见异思迁。一股干劲。结果带来不可收拾之残局。是时悟之。不如不作。即时已晚。噬脐不及者。易言之。得往且往可往旧路温故知新莫求别路。交易-成婚姻-阻求财-吉自身-欠利家宅-平安六畜-损田蚕-五分寻人-见行人-迟六甲-惊山坟-改讼词-亏疾病-欠安失物-凶移徒-守旧","xiangjie":"此签有”虚心求教”之意。告诫当事人，勿恃才傲物。有些人因为本身才气纵横而自视甚高，因此目空一切，对于身边的人事物，也常看不上眼，甚至语多讥讽、一派自以为是，非不得已，决不向他人求教。须知过于刚硬的个性会带给别人不悦的感受而容易导致处处碰壁，如果能够正视并收敛此种狂放自傲的个性，凡事虚心下问，加上本身的才华与能力，相信成就一定不只于此。对于身边亲朋好友的劝告，务必听进心里去，想一想别人为什么这么说。"},{"n":59,"no":"第 59 签","ji":"中平灵签","text":"直上高楼去避身，四边绕处是荆棘。谁知造物安排定，得意番成失意人。","jie":"灵签之曰： 如醉饮酒，如何且守，直待时来，无灾无咎。交易-成婚姻-不合求财-平常自身-安家宅-祈保六畜-大利田蚕-半吉寻人-阻行人-至六甲-祈福山坟-吉讼词-亏疾病-求福失物-凶移徒-吉","xiangjie":"此签有”是非难断”之意。告诫当事人，喜恶勿过于分明。我们有时会对某些人觉得反感，不管对方说什么做什么，就是看不顺眼，非常排斥。甚至双方互不相让，情势也越陷越僵。其实同样的人、事、物，在你看来或许不好，但若换在其他人眼中，却变成是好的。须知”好”与”坏”很难论定，甚至没有一定的准则。但人都是用自己心里的一套标准来评断，而每个人又有不同的想法，所以看出来的事情就有了好、坏、对、错的分别。如果能少点主观、多点客观，好恶心就不会那么重，也比较不会太固执。另外，凡事不要替人强出头，做好自己的本份，修身养性。"},{"n":60,"no":"第 60 签","ji":"中中灵签","text":"抱薪救火火增烟，烧却三千及大千。若问营谋并出入，不如收拾莫忧燃。","jie":"灵签之曰：本签示之于弟子曰。抱薪救火。当然火会增烟。霉头加以霉繇此可知。君尔凡是着手兴事。必须守旧。千万不能逞一时之勇。见人之成。见异思迁。轻举妄动。恐怕有大害。不仅不能成事。反而将事弄砸。得不偿失。易言之。总有千般一旦皆休安心守旧维得无忧。交易-难婚姻-不合求财-微自身-祈保家宅-凶六畜-损田蚕-不利寻人-杳行人-滞六甲-险山坟-平讼词-亏疾病-有惊失物-西方移徒-吉","xiangjie":"此签有”心浮气躁”之意。奉劝当事人，尽量平心静气。须知过度的情绪反应，会让人失去对事物应有的基本分析能力。也因为无法保持冷静，在此时做出的判断往往失策而且导致不可收拾的局面。如遇有大喜大悲大怒之事，不要急着做出反应，先试着把自己冷静下来，让情绪归于平稳。心平气和之后才能专心思考，谨慎反覆过滤求证之后，才能做出正确理智的判断。凡事勿冲动躁进，小心行事，免得乐极生悲，后悔莫及。"},{"n":61,"no":"第 61 签","ji":"大吉灵签","text":"日上吟诗月下歌，逢场作戏笑呵呵。相逢会处难藏隐，喝采齐声嗹哩罗。","jie":"灵签之曰：本签之示于弟子曰。日上吟诗月下歌者。为佳人欢乐之象者。凡是百事兴。大吉昌之征。因时运知。所谋之事也。百事如意之时。惟将如此康泰上盈之道。何如保之。冤之。保之。方能克终。易言之。君之今也。佳人在屋唱。吟诗曲一片欢嘉取乐且足之佳境。交易-利婚姻-成求财-顺自身-吉利家宅-安六畜-旺田蚕-熟寻人-至行人-至六甲-生女山坟-吉讼词-有理疾病-即痊失物-凶移徒-吉","xiangjie":"此签有”不可貌相”之意。鼓励当事人，要有自信。很多人常不甘安于现状，觉得自己地位太低、人微言轻，因此无不想力争上游，爬得越高越好。但俗云：”三百六十行，行行出状元”。职位高低代表的只不过是一时的虚名，不一定非要苦苦追求。这个社会需要各式各样的人，人人各司其职，才能保持平衡。应以自己的工作为荣，知福、惜福，安居乐业。切勿好高骛远，岂不知欲望少一点，快乐就更多一点?另外，切勿轻视小看地位卑微的人，也许其中卧虎藏龙个个身怀绝技，只不过自己有眼不识泰山罢了！"},{"n":62,"no":"第 62 签","ji":"中中灵签","text":"晨昏全赖佛扶持，虽是逢危不见危。若得贵人来接引，此时福禄自相随。","jie":"灵签之曰：本签也。守旧平安之象。凡兴事。能遇贵人扶持之时。必能顺利者。晨昏全赖佛祖扶持。因之。必须先由吾身之修德。积善始。神方能有所庇佑。凡事须隐忍。藏器以待用。不宜急。不可躁。易言之。君之命也。诸事平稳四方名显。改换从新。凶存吉现也。交易-顺婚姻-成求财-西方自身-吉家宅-安六畜-利田蚕-四分寻人-西方行人-阻六甲-祈福山坟-吉讼词-亏疾病-祈福失物-见移徒-守旧","xiangjie":"此签有”人善被欺”之意。意味当事人，勿灰心丧志。莫听他人闲言是非，有时面对别人的调侃相欺，不妨忍一时，无须放在心上。此刻莫要急躁，专注在修养品德之上，保持良好的处世态度，继续努力、并不间断地充实自我本身的学识。俗谚云：”不经一番寒彻骨，焉得梅花扑鼻香?”相信自己、存善持之以恒，必有大成之日。另外，对于亲朋好友的关怀协助，应要谨记在心，有机会便加以报答。"},{"n":63,"no":"第 63 签","ji":"下灵签","text":"昔日行船失了针，今朝依旧海中寻。若还寻得原针在，也费工夫也费心。","jie":"灵签之曰：本签也。海底捞针之象。凡事费劳空力之征。成为如此者。时也命也。不得违之。逞一时之强。却不得任何结果。反而受到不利。甚至吃亏。蚀本之情形出现。福是福基福埋福种。说得分明且宜手拱。交易-成婚姻-不合求财-有自身-谨防家宅-欠利六畜-莫养田蚕-吉寻人-难行人-滞六甲-险山坟-安讼词-宜和疾病-难痊失物-凶移徒-延迁","xiangjie":"此签有”刻苦磨练”之意。奉劝当事人，勿轻言退缩。须知在下任何决定之前，一定要经过审慎而思密的考量。尤其当一切都是未知数时，原本就备加困难，本身是否合适、能否发挥，都是必须再三向自我求证的考虑因素。下定决心去做之后，就不要因为过程中必然遭遇的阻碍或不顺遂而心灰意冷，甚至想干脆走回头路。凡事不要轻言放弃，免得最后落得两头皆空，不仅劳心费力，更蹉跎了岁月，实在得不偿失。"},{"n":64,"no":"第 64 签","ji":"下灵签","text":"譬若金鳞放碧漪，暗遭罗网四边围。思量无计翻身出，命到泉关苦独悲。","jie":"灵签之曰：本签者。暗遭罗网四边围之命者。凡事必须提防歹人陷害。此运者起跌不常者。且虚。险。惊。改。凶之者多。经多方面涉尘。终能出险。惟此历程艰苦异常。无以数计。思量无计翻身出。易言之。身居尘内祸自天来。早须防备免受其灾。交易-中平婚姻-不合求财-虚自身-险家宅-凶六畜-衰田蚕-损寻人-杳行人-有阻六甲-惊山坟-改讼词-亏疾病-灾险失物-凶移徒-吉","xiangjie":"此签有”祸从口出”之意。奉劝当事人，勿心直口快。本身的自我情绪管理很重要，切忌在发怒或不顺意时就口出恶言。须知人在心情不稳定时脱口而出的话杀伤力都很重，在当下极容易触怒或伤害到他人，让人怀恨在心而不自知。这种言语上的过失，恐怕事过境迁也难以弥补。另外平常行事勿过于招摇，在物欲上应知有所节制，避免处处与人逞强比较。凡事谨慎谦虚待人，方可远灾避祸。"},{"n":65,"no":"第 65 签","ji":"中下灵签","text":"眼前欢喜未为欢，危不危兮安不安。割肉成疮因甚事，不如守旧得安全。","jie":"灵签之曰：本签者。割肉成疮之象者。凡事必须守旧待时。不宜轻举妄动也。因时命之注定君尔之命眼欢喜未为欢。危不危兮安不安。日下运多拂逆。毫无利息可言。如百花凋落。无复荣华之望。几希万事皆空之势。易言之。如得止。且止知欢割自己肉痛本一般。交易-小人婚姻-不久长求财-不利自身-是非家宅-不安六畜-损田蚕-损寻人-杳行人-有阻六甲-惊山坟-不利讼词-亏疾病-反覆失物-难寻移徒-守旧","xiangjie":"此签有”自作主张”之意。奉劝当事人，不要太固执。人很主观，有时心里已经有主意的事，虽然可能还是会找大家商议，但纵使多半的人持反对或劝阻之意，却依然我行我素、执意照自己的意思去做，结果往往不如预期，甚至导致一败涂地。须知很多时候我们对事情的看法不见得都能面面俱到，多少会有遗漏或误判之处。因此对于旁人的善意提醒或规劝，应有雅量去接受，虚心检讨并加以改正。所谓”人非圣贤，熟能无过?”就算已经犯下了过失，但只要勇于认错，相信大家仍然会接纳、帮助你，让事情不致于到无法收拾的地步。"},{"n":66,"no":"第 66 签","ji":"中中灵签","text":"路险马行人去远，失群羊困虎相当。危滩船过风翻浪，春暮花残天降霜。","jie":"灵签之曰：本签者意滞之象。凡举事待时。且必须仔细小心。无一是处之时。目下不许君丝毫动之。一动不如一静。以目前之情况守之。不可勉强。一强求。逞一时之勇之时亏即主。弄巧成拙。无一可图利。易言之。守静安静安分无忧不须贪望自有优游。交易-失败婚姻-不久长求财-破失自身-灾家宅-忧疑六畜-损田蚕-损寻人-杳行人-阻六甲-危险山坟-不利讼词-亏疾病-设送失物-不见移徒-莫动","xiangjie":"此签有”六神无主”之意。奉劝当事人，勿心慌着急。人在遇到难题的时候，常会因不知如何是好，所以往往转而向旁人求助，希望藉由对方的建议，能让事情有所帮助。其实自己本身的问题，应该是自己最了解。不妨冷静下来，仔细思考，将事情层层抽丝剥茧、一一厘清之后，也许就能找出症结所在。若实在是想不出办法、非要向他人求助时，也不要随便拉个人就猛吐苦水，应慎选欲请教的对象。有些人可能听完还没消化，就主观的高谈阔论，不但对事情没有帮助，恐还因此被他人的你一言、我一语误导了方向，更加混乱。应请教客观中肯、又能从中指出关键处的对象，才有助于厘清问题，帮忙你解决困难。"},{"n":67,"no":"第 67 签","ji":"上上灵签","text":"一条金秤等君情，无减无增无重轻。为是平生心正直，文章不识义皆明。","jie":"灵签之曰：本签之曰。心中端正之象。凡事能平稳大吉之者。一条金銔等君情。由它衡量即是无减无增。无重轻为人之道。即是人心平生心正直之时。即使不识文章也明白义之道理。易言之。平生正直善处人情只依本分天下则太平矣。清高门路即可。交易-稳婚姻-合求财-利自身-平家宅-安六畜-好田蚕-稳寻人-迟见行人-有信六甲-生男山坟-平讼词-和疾病-祭星失物-见移徒-守旧","xiangjie":"此签有”乐善好施”之意。提醒当事人，适度地投其所好。一个人本身如果存心正直、知礼守法，已属难能可贵。但除了本身的品德之外，如何兼顾人情，也是必须注意的因素。在与人相处时，如果能够多花一点时间，用心倾听对方的感受，不但能让对方觉得有”被重视”的感觉，更可因此知道对方的喜恶，帮得上忙的地方就尽力协助，而对方的禁忌，也可以避免误触。这种处世哲学，跟佛经上所说的”悉令满足诸需求”有异曲同工之妙。人都是互相的，当你替对方解决了问题、让对方心无烦忧之后，对方也会反过来想帮助你。这时再提出自己的看法与做为，相信一定能获得多数人的支持与认同，让事情更圆满。所谓”带人要带心”，也是这个道理。"},{"n":68,"no":"第 68 签","ji":"上上灵签","text":"门庭清吉梦祯祥，积善于门大吉昌。讼理婚成蚕又熟，病逢良药得安康。","jie":"灵签之曰：本签者。日暖风和之象。凡事大吉大利者。君尔之门庭清吉。梦也祯祥。古人劝之。积善之家庆有余。家运大吉大利也。积善者。先由心正。不存邪。助人为乐。修身。布施之谓。因之。讼理婚成蚕又熟。易言之。日暖风和百花大发事莫疑迟从今显达。交易-随意婚姻-成求财-春旺自身-安家宅-旺六畜-旺田蚕-利寻人-至行人-到六甲-防惊山坟-大吉讼词-胜疾病-安失物-急寻移徒-如意","xiangjie":"此签有”世代传承”之意。告诉大家要保持良好的典范。一个人的思想行为，很容易在不自觉中受到别人的影响。若是为人父母师长者，在教导晚辈子女的时候，要以身作则，举手投足间都会是孩子模仿学习的对象，意义重大、影响深远。对自己要求是维持良好的品性道德，勿以恶小而为之，勿以善小而不为。学习他人的长处，若见别人的缺失，也需要警惕自己勿犯相同之过，有益的经验可以传承下去，让青山常在、绿水长流。"},{"n":69,"no":"第 69 签","ji":"中上灵签","text":"冬来岭上一枝梅，叶落枯枝总不摧。探得阳春消息近，依然还我作花魁。","jie":"灵签之曰：本签者梅花占魁之象。凡事宜平吉利者也。冬至。岭上之一枝梅也。虽是叶落枯根。伊亦能傲霜斗雪疏影横斜。放出幽香。为世人报得春之跫音将至。君多年之傲苦也。必得一报。出头天者。易言之。君之运也。一箭落空非空不空看非景致消息在中者。交易-待时婚姻-迟成求财-谨慎自身-祈福家宅-欠利六畜-旺田蚕-旺寻人-见行人-迟六甲-秋虚春实山坟-宜改讼词-亏疾病-虚惊失物-东方移徒-不吉","xiangjie":"此签有”沉冤得雪”之意，告诉大家不要太悲观。人在时不我予时心态本就消极，如果还为他人所误解更如哑巴吃黄莲，苦不堪言。这时候可以看看程婴匿孤存赵的故事，他不但忍辱负重十数年，甚至默默承受不义之丑名，只为了不让忠臣绝后。反观自己，不过一时的不顺遂，何苦因此自怨自艾，只要存心正直，做事情只要是无愧于天地，相信必有时来运转、还你清白之日。"},{"n":70,"no":"第 70 签","ji":"下灵签","text":"朝朝役役恰如蜂，飞来飞去西复东。春暮花残无觅处，此身不恋旧丛中。","jie":"灵签之曰：本签者游蜂采花之象。凡事劳而无功者。飞来飞去而复东。春届暮节花残也无其觅处。栖身之所。交易。婚姻。求财。六畜。生产。皆无一是处。在此苦境之时。最宜修吾身。积吾善。行布施。善吾之言行。方能有转机。易言之。役役终朝暗雨不清用尽机谋争加寂寞者。交易-反覆婚姻-不久长求财-破耗自身-小人家宅-口舌六畜-损田蚕-损寻人-无迹行人-杳六甲-虚花山坟-改讼词-亏疾病-阻失物-空移徒-守旧","xiangjie":"此签有”事与愿违”之意。告诉大家不要一厢情愿。在与人沟通时切忌心直口快、口不择言。说话之前一定要思量再三，婉转有礼的表达其意。如果一开口就让对方觉得不舒服，事情岂不是已经失败了一半，要再补救可能备加困难。本身热心是善但在听取他人言论之时，不应全部信以为真，发挥自己的智慧来判断真假、明辨是非。大家不要自作聪明，认为”事情就是如此”，否则恐遭他人利用，奔波劳碌，还得罪了不相干的人，结果却是白忙一场。对于事情的判断不要先入为主，免得乐极生悲。"},{"n":71,"no":"第 71 签","ji":"上上灵签","text":"谁知爱宠遇强徒，女子当年嫁二夫。自是一弓施两箭，骑龙跨虎上安居。","jie":"灵签之曰：本签之示意者。一弓两箭之象。凡事改变则大吉者。骑龙跨马上安居。凡事切莫堕志。修心向善去。自有好处。目下虽略困。但是。终必逢时。但勤劳。人事己尽天理。无不准。易言之。不审不审事由天命辰午中间切须谨慎。交易-护防婚姻-两合求财-劳力自身-是非家宅-损失六畜-损田蚕-晚寻人-见行人-阻六甲-先惊后实山坟-吉讼词-亏疾病-祈星失物-难移徒-改","xiangjie":"此签有”众志成城”之意，就是团结力量大。人往往为了理想努力去实现，同时有想要兼顾现实面、而不得不蜡烛两头烧，既无人能了解，还可能被误解。这个时候心里会觉得非常疲惫。要知道远大的理想与目标并愿意去实行是很了不起的一件事。既然想去做了，把这股干劲一直保持下去哦，所谓”三个臭皮匠，胜过一个诸葛亮”。有时与其自己单打独斗还不如集思广益、汇聚众人的力量来共同完成一件事。一个人如果做不到的地方，另外一个人也能立即过来补足。大家有志一同、齐心协力，相信必能让事情推动得更加顺利。"},{"n":72,"no":"第 72 签","ji":"中吉灵签","text":"弄蜂须要求他蜜，犹恐遭他尾上针。虽是眼前有异路，暗里深藏荆棘林。","jie":"灵签之曰：本签示之于弟子曰。事须仔细不可强求如蜂采蜜着其由来。事后遂意。皆祖宗积德之所致。若能顺理而行。益加倍植。则天之报施。凡事先苦后甘之象。必须忍耐。否则无由成功。由忍一字。将有转凶化吉之时。交易-迟婚姻-阻求财-阻自身-防家宅-欠利六畜-损田蚕-少收寻人-难行人-迟六甲-虚惊山坟-败设换讼词-亏疾病-设送失物-凶移徒-莫动","xiangjie":"此签有”寄人篱下”之意，告诉大家要忍耐则吉。常常有人会觉得抱负无法伸张、或不得不为某些情况折腰，但所谓”山不转路转，路不转人转”，其实很多时候只要换个角度、逆向思考，心境就能改变，在现实环境受限、不允许大幅度改变时，不妨忍一时，不去做任何草率冲动的决定。保持乐观轻松的心情，而不是轻易地被环境或人事所影响。只要坚守岗位、做好份内之事，相信必有时来运转之日。"},{"n":73,"no":"第 73 签","ji":"上上灵签","text":"春雷震起蛰中虫，脱却尘凡出旧墉。忽遇风云交际处，自然变化得成龙。","jie":"灵签之曰：本签示之于弟子曰。是蛰中变态之象也。凡事变化则吉者。事事求变。舍旧图新。求合时潮。何必烦恼。一定可转机。多费心机。可有转变。君尔可知。功名富贵迟速有时。待时而动则吉也。易言之。震开蛰月思入风云一好变态直入天宫。交易-贵人婚姻-成合求财-春利自身-平常家宅-祈福六畜-春利田蚕-早生寻人-见行人-阻六甲-生男山坟-吉讼词-胜疾病-阴阻失物-难移徒-很苦","xiangjie":"此签有”伯乐相马”之意，告诉大家要沉得住气。韩愈《马说》内言道：”世有伯乐，然后有千里马。千里马常有，而伯乐不常有。”千里马可遇而不可求，那么伯乐在哪里呢，应该要有过人之见，细心深入地观察周遭的人，多花点时间倾听基层的声音，不以外表、学历等外在考量来评断限制一个人，用人唯才。很有可能千里马就在身边，却被自己忽略了呢。在基层者，也不要因为没遇到”伯乐”而丧志，仍应保持良好的工作能力与态度。只要自己不先放弃自己，相信一定能遇到赏识重用的人，让你大展所长。"},{"n":74,"no":"第 74 签","ji":"中下灵签","text":"慵飞野鹤自投笼，欲举鹏霄落陷中。南北东西浑障碍，此身憔悴恨无穷。","jie":"灵签之曰：本签示之于弟子曰。野鹤投笼之象。既然是投笼者失去自由之意。当自守旧留心。今之命也。东西南北浑障碍者。此身憔悴。恨无穷之时。正逢不堪景象。凡事守之。慎之。三思而后行方可。易言之。进身不得退步而行命运乖蹇切勿交争。交易-破耗婚姻-刑伤求财-小人自身-困滞家宅-不安六畜-瘟田蚕-缺寻人-杳春行人-阻六甲-刑劫山坟-绝讼词-祸疾病-延安失物-凶移徒-不利","xiangjie":"此签有”难容二虎”之意，奉劝世人要思虑要周详。人有自信、有才干是一件好事，但过度的锋芒与自信，只会让自己更成为别人眼中的标靶，欲除之而后快。想要更换新的环境也不要急着表现或夸耀自己的能力，要知道同行相忌，尤其是与他人有直接利害关系时，如果本身能力明显胜过对方，就更加容易招人眼红甚至被人在暗地里落井下石，蒙受不白之冤。所以宁可小心内敛，处处谦让，也要保持柔软的身段，做事情要低调谨慎，更要慎选合作对象，避免陷入了水火不容，陷入进退两难之境。"},{"n":75,"no":"第 75 签","ji":"中灵签","text":"宛如抱虎过山前，战战兢兢胆碎寒。幸得山前逢妙手，方能保得一身安。","jie":"灵签之曰：本签示之于弟子曰。宛如抱虎过山前之景也。令人战战兢兢胆碎寒者。凡事必须多擘画。千万不得轻举妄动。机密不密则不成。须防口之血半。惟君尔之修身。积德功夫一至。必能逢得妙手。方能保得一身平安。易言之。危险危险前程阻隔切莫远行自宜守节。先凶后吉者。交易-防滞婚姻-难顺求财-谨慎自身-提防家宅-祈保六畜-损田蚕-五分寻人-杳行人-阻六甲-有危山坟-凶讼词-克亏疾病-祭虎失物-难移徒-吉","xiangjie":"此签有”未雨绸缪”之意，建议大家都应先做好计划。所谓养兵千日、用在一时，只有平日做足了准备，才不会惊慌失措、临时抱佛脚。大家在遇有紧急状况时，要保持冷静千万不要轻举妄动、自乱阵脚，如果本身参与了一件涉及机密的重要任务，就应该守口如瓶谨防一时大意而泄漏口风，本身行为端正，心存善念以诚待人，如此相信纵使遇到再大的困难，也一定会有人愿意伸出援手，帮助你共同度过难关。"},{"n":76,"no":"第 76 签","ji":"上上灵签","text":"鱼龙混杂意和同，耐守寒潭未济中。不觉一朝头角耸，禹门一跳到天宫。","jie":"灵签之曰：本签者。禹门未透之象。凡百事变化则吉之意。鱼与龙两者混杂潭中意和同。耐守于潭却未济中时。唯有一朝头角耸之刻。君尔即可由禹门一跃到天宫去者。贵人逢遇之曰。必有被擢拔之时。彼时商贾者财利勃发。家宅产业兴隆。另言之。虽有址地不如待时营谋出入切莫安为。交易-阻滞婚姻-未合求财-有自身-提防家宅-中平六畜-损田蚕-五分寻人-杳行人-迟六甲-有险山坟-祭讼词-亏疾病-祭星失物-难移徒-守旧","xiangjie":"此签有”常持善念”之意，要多多将心比心。社会上大部分的人都是以自我为中心，很少能真正地顾及到旁人的感受，但是每个人不论贫富、地位高低，内心都想寻求一种快乐而不是痛苦的感觉，如果我们能有这种仁慈的、将心比心的观念，那么在看待别人的时候，自然而然会产生一个”同理心”，了解”己所不欲、勿施于人”的道理，再进而推己及人。如果世人能够做到只问耕耘、不问收获，自己能够做得到的一定自己先去做。"},{"n":77,"no":"第 77 签","ji":"中下灵签","text":"梦中说梦获多财，身外浮名总莫猜。水远山遥难信定，贵人一指笑颜开。","jie":"灵签之曰：本签示之于弟子曰。梦中得财之象。亦即是空虚无力者。总而言之。身外浮名。总无可猜。水远山遥难信定。伊是遥远之地。无法信之。定之。贵人一指时。君尔笑逐颜开。易言之。梦中说梦声名虚望只好待时贵人接引。交易-难婚姻-不合求财-空虚自身-阻家宅-祈福六畜-损田蚕-少收寻人-杳行人-迟六甲-虚山坟-改吉讼词-宜和疾病-设送失物-远移徒-待时","xiangjie":"此签有”笑里藏刀”之意，奉劝世人不要心怀不轨。言语是一门艺术也是一项工具，可以用来杀人也可以用来救人。有人可能天生伶牙俐齿能够把话说得很圆，在当下就能让对方深信不疑，本身能言善道是一件好事，但在说话的同时，”心里想的”也很重要。如果心存善念那么说出口的话，相信也会是好话，如果只是表面上说的好听但心里却充满怨恨，只想着如何报复别人，那”言语”就变成了一种恐怖的工具，可以杀人于无形之中。总之要明白不怀好意，终将害人害己。"},{"n":78,"no":"第 78 签","ji":"上中灵签","text":"冷水来浇白雪洋，不寒不热自温凉。要行天下无他事，惟有中藏一艺强。","jie":"灵签之曰：本签即是平稳用事时。凡事大吉利者。亦即是冷水来浇时也。白雪洋。时令不寒不热时自有温凉者。逢此时令时。君尔行天下时。并无他事。唯君汝。必须藏有一艺之长久。可行天下无阻。易言之。囚徒得赦病遇良医求财谋望贵人指迷。交易-成婚姻-合求财-平平自身-大吉家宅-中平六畜-兴旺田蚕-熟寻人-至行人-至六甲-生男山坟-吉讼词-散疾病-平安失物-即见移徒-大吉","xiangjie":"此签有”人外有人”之意，提醒世人要谨言慎行。有时自以为什么都知道，尤其是对现状驾轻就熟的时候，就很容易不自觉的自满或松懈下来，言行举止也在不知不觉中变得傲慢无礼，所谓”一山还有一山高”，须知天下之大，比我们见多识广的人一定多如牛毛、密如过江之鲫，因此切忌自以为是、咄咄逼人，在自身状况良好的时候，也别忘了提醒自己：”强中仍有强中手”。对自己的要求不要太松懈，应该时刻充实自我，发现有不足的地方，就要想办法弥补。做事情的时候要注意谦冲忍让，不要逞一时口舌之争。"},{"n":79,"no":"第 79 签","ji":"上中灵签","text":"虚空结愿结人缘，保得人安愿未还。得兔忘蹄真绝迹，敢将初誓谩轻瞄。","jie":"灵签之曰：本签示之于弟子曰。信实不虚凡事待时耐守则吉之灵签也。唯君尔虚空结愿结人缘。一人之力。有限者。如果逞一时之勇盲目猛冲。恐有难发生之时。时也命也。汝可悟之。叵逞勇矣。易言之。有人见我空自怀然佛慈指药切莫轻瞒。交易-谨慎婚姻-虚求财-守份自身-许经家宅-还愿六畜-损田蚕-七分寻人-杳行人-滞六甲-生女山坟-向西方吉讼词-如意疾病-解失物-西方移徒-守旧","xiangjie":"此签有”一诺千金”之意，提醒世人要信守承诺。老子说：”夫轻诺必寡信。”就是说一个敢轻言承诺任何事情的人，必然难以守信，所以不要轻易向对象包括他人与自己许下诺言。能够帮助别人是一件美德，但在答应别人之前，一定要先考虑对方的要求，是否适当、合理?，最重要的是要考虑一下自己的能力，如果没有能力做到的事，就不要轻易地向别人许下承诺，因为一旦答应了别人的事，不论大小，都应当全力以赴、尽量做到。"},{"n":80,"no":"第 80 签","ji":"上上灵签","text":"直上高山去学仙，岂知一旦帝王宣。青天白日常明照，志在声名四海传。","jie":"灵签之曰：本签示之于弟子曰。贵人性情之象也。凡百事遇贵人即化凶趋吉者。由诗意得知君尔直上高山去学仙。岂知一旦帝王宣。即青天白日常明照。晴天无一片云。白日常照时。君之命运。正如当中。易言之。有始有终大问西东心中用事贵人重重。交易-遂意婚姻-双配求财-有利自身-吉利家宅-平安六畜-有利田蚕-半收寻人-遇行人-回六甲-生男山坟-吉讼词-有理疾病-平安失物-南方移徒-吉","xiangjie":"此签有”身先士卒”之意，鼓励世人做到无私奉献。现在的社会人与人的相处越来越冷漠，诈骗案件的层出不穷，大部份的人都只想求自保的心态下，很多情况都不愿意再伸出援手，但是还有另一种人只想着如果对事情能有所帮助、就会尽量去做，不计较利益得失，当然更不会想到自己，这类的人以投入义工居多，堪称是人间的活菩萨。要知道个人的力量虽然单薄，但只要愿意去做、把被动的想法化为主动而积极的行动，做到了身先士卒、不问一己之私、不在乎能不能得到回报，相信一定会为自己的内心带来难以言喻的真正快乐。"},{"n":81,"no":"第 81 签","ji":"中中灵签","text":"庭前叶落暮秋时，行客奔程势若飞。谢得天公轻着力，顺风相送宝船归。","jie":"灵签之曰：本签也。从心所望之象也。凡事大吉利者。一叶如秋后。逐渐有机缘。行客之来势如飞奔。风送君尔之船。只要轻轻着力柎即将宝藏船舶推送回来。不必费力者。此者非人力之所逮。易言之。心中所望天必从之所谋用事尽可施为。交易-成合婚姻-和合求财-随意自身-许经家宅-祈保六畜-稳田蚕-晚寻人-至行人-动六甲-虚惊山坟-择地讼词-有胜疾病-有善失物-不见移徒-随意","xiangjie":"此签有”谋事在人”之意，劝人凡事勿太悲观。人在面对艰难或遥不可及的任务时，第一个冒出的念头往往是”不可能”，其实”不可能”是一个消极且较没有自信的想法，如果先入为主的就认定某件事”不可能”时，通常也等于间接否定了自己。因为世事本就难以预料，所以又怎么能肯定，有些事情是绝对不会发生的呢?与其一开始就觉得”不可能”、”做不到”，还不如保持积极乐观的态度，试着踏出第一步，先不要预设太多立场，也可能收获有意想不到的成果。"},{"n":82,"no":"第 82 签","ji":"中中灵签","text":"炎炎烈火焰烧天，焰里还生一朵莲。到底永成根不坏，依然枝叶色新鲜。","jie":"灵签之曰：本签者。火中生莲之象。凡事先难后易者。目下时运未济。千万不可逞英豪。图意外之财。却反而损失不赀。所幸到底永成根不坏。依然枝叶色新鲜契命也。可因命大。遇险而不危。易言之。虽是危险不伤其身营谋用事皆得贵人。交易-小人婚姻-阻求财-劳力自身-谨防家宅-欠安六畜-损田蚕-缺寻人-西方行人-阻六甲-虚惊山坟-改吉讼词-亏疾病-设送失物-南方移徒-守旧","xiangjie":"此签有”因人而异”之意，劝人不要太过执着。在做一件事或向别人表达某些观点时，会发现有人能理解、有人却不能，也许会懊恼：为什么同样一件事、说的是同样的话，反应结果却是两极?其实每个人都有每个人本身的个性、想法与特质包括自己也是。如果把自己的想法强加在别人身上是不行的，常常只会造成反效果。这时候可以试着多花一点时间，去了解别人的观点与性质差异。知道对方的喜恶之后才能进一步沟通，也可以避免误触对方的禁忌，这里处理事情起来一定更加事半功倍。"},{"n":83,"no":"第 83 签","ji":"中上灵签","text":"譬若初三四五蟾，半无半有未完全。须教十五良宵夜，到处清光到处圆。","jie":"灵签之曰：本签者。如月初出之象。凡事举之时。得待时。来济时方吉者。君尔之今则是时运未济之时。今之不逢时叵逞强。欲图意外之财时。反而将失利者。宜控制之。不宜放任行之。汝必须待到十五良宵夜。月光明才可见。到清光。易言之。知足自足如月初出直到圆时无有不吉。交易-待时婚姻-迟求财-勤防自身-夏秋吉家宅-许愿六畜-平田蚕-平寻人-难行人-阻六甲-生女山坟-改吉讼词-和疾病-设送失物-难移徒-守旧","xiangjie":"此签有”凡事适中”之意，凡事都要适可而止，节制平衡是非常重要的。 如果太过沉迷于某些行为中，会对自己的身心健康带来负面影响，我们应该密切注意自己的行为举止，保持良好的习惯，让自己有一个积极健康的生活才能达到凡事适中的 这样的理念。"},{"n":84,"no":"第 84 签","ji":"中下灵签","text":"因名丧德不和同，切忌忙中变作凶。醉后不知何处去，青松影里睡朦胧。","jie":"灵签之曰：本签者。因名丧德之象。因之。凡事劳费心力而无益者也。为了攫取一己之名利。丧其德行。受世人辱骂。指摘者何用。神灵诫之曰。切忌忙中变作凶。本为善意。惟己之言行中不知不觉中。将善心变为恶而导致凶。易言之。君之命也。寒鱼离水美中不足若问营谋如何结局。","xiangjie":"此签暗示，当我们忙于工作和生活时，要特别注意一些小事情，这样可以避免一些误会及不必要的麻烦。因为有时候，我们在说话、做事时，会被冲动所决定，而造成一些不必要的错误。因此，当我们面对挑战时，也要保持冷静，克服冲动，凡事要三思而后行，不要在一时兴起之下做错事情，或者说出伤人的话。此外，当面对他人的讥讽和批评时也要保持理智，不要因此产生怨恨，宽容待人可以得到双赢的结果。"},{"n":85,"no":"第 85 签","ji":"上上灵签","text":"重开山后藏前事，万宝园中可再团。醉咏新诗添逸兴，贵人引接上云衢。","jie":"灵签之曰：本签者。暮春百花盛开之时。凡百事求谋俱吉者也。沉滞已久之命运。于今逐渐入佳境。珍惜此时。把握本刻。立即动之。汝之运途将为尔辟坦途。亦即是万宝园中可再团。易言之。老者还来春暮风和欲求名利早晚遇财。交易-平平婚姻-迟成求财-着力自身-谨防家宅-欠利六畜-旺田蚕-好寻人-难行人-阻六甲-生女山坟-宜改吉讼词-反覆疾病-延滞失物-凶移徒-更新","xiangjie":"此签有”百折不挠”之意。百折不挠是一种要求毅力与坚持的态度。无论是求学还是做事，都要有耐心和信心。受到他人批评与指责时，不妨虚心接受，当成是自己的指引，多方尝试与努力改进缺失，最终可以更好地发挥专业知识，而要实现这一目标，最重要的是我们对事情要做到持之以恒、百折不挠。"},{"n":86,"no":"第 86 签","ji":"大吉灵签","text":"春来花发映阳台，万里舟行进宝来。跃过禹门三级浪，恰如平地一声雷。","jie":"灵签之曰：本签者。帝朝受职之象。凡百事兴者遇贵则吉利者也。春来花发。是百花争妍斗艳之刻。万里舟行进宝来其声声之旺也。如跃过禹门三级浪。恰如平地一声雷响起者。易言之。帝朝受职如贫得宝望用从心签中第一。","xiangjie":"这个签意告诉人们要坚守道德，不论走多远的路都要心存正念，也要坚持不懈地追求进步，不断提升自我。改变自己，努力奋斗，自我超越，在艰难的行程中，不能放弃勇往直前的决心，这样才能获得成功。"},{"n":87,"no":"第 87 签","ji":"中平灵签","text":"人行半岭日衔山，峻险巉岩未可攀。仰望上天垂护佑，此身犹在太虚间。","jie":"灵签之曰：本签者。淘沙见金之象也。凡百事劳心即有成之命运。目下居于日衔山之境。且前面正遇丛山峻岭。艰苦历程中。苦中不得不仰头祈求上苍垂护佑。己身犹在太虚之间。唯劳心可成之命。易言之。剖石见玉淘沙见金须用着力劳心成就。交易-谨防婚姻-有阻求财-劳心自身-欠利家宅-祈福六畜-平平田蚕-平稳寻人-未见行人-迟六甲-空虚山坟-凶讼词-亏疾病-有阻失物-凶移徒-守旧","xiangjie":"此签有”柳暗花明”之意。启示人们不要就此放弃，要改变心态逆境中寻找可能性。即使面临最艰难的挑战，情况不断变化，也要利用机会走出困境，耐心独立地完成它。俗话说”山不转路转，路不转人转”，保持好心情，事情一定会有转机的。"},{"n":88,"no":"第 88 签","ji":"中平灵签","text":"木雕一虎在山林，远望威容意不禁；纵说不妨终可畏，此身如入大江心。","jie":"灵签之曰：本签者。木虎虚惊之象。凡百事宜守待时方吉安。千万叵倚强凌弱。远望威容意不禁者。即使木虎不必畏惧。但己身如同入大江心。岌岌可危。必须防贪求不已。生祸福无不自求者。必慎之。易言之头点雪耳边过风可宜作福前凶后吉。交易-不利婚姻-不合求财-小人自身-口舌家宅-不安六畜-损田蚕-损寻人-杳行人-阻六甲-空虚山坟-凶讼词-亏疾病-祭星失物-凶移徒-守旧","xiangjie":"此签有”揠苗助长”之意。有时候我们因为想知道事情的结果而过分热心，但实际上，保持冷静和理智有助于我们做出正确的决定。有时候，我们可能会走上一条不归路，因此我们要特别小心，不要对事情”一厢情愿”，要学会按兵不动、先保持观望，等到事情明朗以后再做决定。"},{"n":89,"no":"第 89 签","ji":"上上灵签","text":"出入营谋大吉昌，无瑕玉在石中藏。如今幸得高人指，获宝从心喜不常。","jie":"灵签之曰：本签者。玉藏石中之象。凡事称心大吉昌者也。灵签曰。出入营谋大吉昌。君今逢无瑕之玉藏石中。能获贵人指点。扶持。终能得宝。此时此刻当喜非常。令人雀跃者。惟称心时不可大意者。更不忘修德。积善。易言之。本签为如玉藏石贵人指出而得宝称心遂意大吉者。交易-成合婚姻-就求财-随意自身-康泰家宅-吉利六畜-勤理田蚕-着力寻人-见行人-动六甲-生男山坟-吉讼词-胜疾病-平安失物-在移徒-吉","xiangjie":"此签表明，只要有志之心，就能实现自己的目标。重在行动，争取机会，即使时间长大，也不要放弃目标，及时主动去把握机遇、努力尝试，积极向上，总结完成人生的目标。"},{"n":90,"no":"第 90 签","ji":"上上灵签","text":"忽朝一信下天墀，宝贝船装满载归。若问前程成底事，始终应得贵人提。","jie":"灵签之曰：本签者。功名成就之象。凡事进身大吉也。君尔之今运也。忽朝一信天下墀之时。宝贝船装满载归之时。若问前程于神仙。君之今也。始终应得贵人提之刻。凡百事得真人。顺利推进之运。上上者。易言之。君汝之今。欲问功名贵人遇得更增福庆财禄进益者耶。","xiangjie":"此签表明我们应该在人际交往中多多用诚意去对待别人，而不要仅仅只关注自身物质上的需求。皆因诚意可以凝聚彼此相处时的友情，也能深植于心，使两方建立起一种信任，排除虚伪与浮躁。"},{"n":91,"no":"第 91 签","ji":"上上灵签","text":"好把愁眉须展开，大才大用荐将来。一条大路平如掌，凡有施为总称怀。","jie":"灵签之曰：本签为前程有坦途可行之象。凡事谋之行之立见吉利者也。一条坦途可向前行。心中用事不必瞻前顾后。勇往迈进事事可如意。顺利吉昌者。唯行在顶峰。傲视下界之际。勿忘今日之所由生。皆由贵人扶之者。易言之。必留个余地。以防向下坡之崎岖。","xiangjie":"这个签意告诉我们，人生中随时会出现机会或重大的决定，因此我们应该做好万全的准备，不要拖泥带水。我们应该慎重考虑当下的情况、分析优缺点，然后做出正确的决定，以免错失良机。"},{"n":92,"no":"第 92 签","ji":"上上灵签","text":"经商得利称心怀，福禄荣华倍获财。若问进身谋望事，秀才一举状元回。","jie":"灵签之曰：本签者。大吉是一个有利的象征，所有的事情都可以顺利的完成。在礼记里有一句诗：“经商得利称心怀。福禄面也。荣华倍获财。”如果你问我未来的发展，神明可以指示你只要你努力付出，就可以获得辉煌的成功，成为一位衣锦还乡者，即使从小到大，你也可以自由实现自己的目标。交易-胜婚姻-合求财-顺自身-安泰家宅-平安六畜-旺田蚕-五分寻人-见行人-动六甲-生男山坟-大吉讼词-有利疾病-安失物-在移徒-遂意","xiangjie":"这签提醒我们要保持一颗开放的心，将质疑和审慎作为理性的调节，学会去体谅别人，懂得尊重他人，宽容他人，不要片面听信谣言，积极拥抱积极的一面，保持乐观的心态，包容他人的弱点，多用心去关注和理解他人。在日常生活中，要做到对自身和他人都诚实友善，这样才能最大程度地减少负面情绪的发生，营造一个更加融洽的氛围。"},{"n":93,"no":"第 93 签","ji":"中中灵签","text":"鸾凤翎毛雨压垂，此时应被雀轻欺。忽朝一日云霄霁，依旧还教振羽衣。","jie":"灵签之曰：此签意在告诫人们，当前小人势力正处于盛行之时，而君子应该暂时保持低调，保护自己，等待时机到来再行动。在困难的时候，不要轻易放弃，要耐心坚持，寻找出路。同时也要避免急躁恼怒的情绪，保持冷静和理智。君子应该守持高尚的品德和原则，不被眼前的利益所迷惑。交易-待时婚姻-滞求财-有阻自身-谨防家宅-欠利六畜-损田蚕-晚寻人-难行人-留连六甲-有虚山坟-改吉讼词-亏疾病-延安失物-凶移徒-守旧","xiangjie":"详解：此签有”邪不胜正”之意。提醒当事人要警惕身边的人是否有不良企图，不要轻易相信他们的话，要保持警觉和谨慎。对于旁人的明嘲暗讽，何妨忍一时。坚守内心良知认为是对的事，保持良好的心态，坚定自己的信仰和原则，不屈不挠地迎接挑战，最终必能获得胜利。"},{"n":94,"no":"第 94 签","ji":"中中灵签","text":"小人君子别贤愚，事有差讹合是非。琴遇知音当鼓操，争如定静得便宜。","jie":"灵签之曰：本签者。您在遇到朋友或客人时应该表现出耐心和理解，因为不管多么贵重的物品都不可能抵消真正友谊的价值。信仰神佛，便会有贵人帮你扶起。不要局限于某一个领域，主动拓宽视野，去寻找宝贵的机会，去发掘珍贵的财富。交易-待时婚姻-滞求财-阻自身-小人家宅-慎出六畜-损田蚕-少寻人-动行人-动六甲-有女山坟-改吉讼词-如意疾病-阻隔失物-连寻移徒-不利","xiangjie":"此签有”争不如静”之意。提醒当事人，凡事耐性。每个人都有自己的一套看法与想法，有时难免与人意见相左。然而公说公有理、婆说婆有理，避免因误解和激烈的讨论而影响了你的情绪。要把力量放在做好自己事情上，不要太过于在意别人的看法和想法，保持平和的心态就可以走出困境。"},{"n":95,"no":"第 95 签","ji":"上上灵签","text":"事业功勤暮与朝，荣华物态不胜饶。报君记取金鸡斗，福禄声名价自超。","jie":"灵签之曰：本签者。功名将会因为你持之以恒的努力而得到应有的回报，获取的成果会让你受益无穷。此外，它还告诉你，不要操之过急，守己待时是获得好结果的关键，尤其是在有关金钱和事业的事务上。交易-早断婚姻-有成求财-劳力自身-中平家宅-祈保六畜-成田蚕-晚胜寻人-难行人-动六甲-安山坟-大吉讼词-急断疾病-延缠失物-远移徒-守旧","xiangjie":"详解：此签有”勤勉奋发”之意。勉励当事人，要抓住时机，珍惜机会，在每一天勤奋学习，不断进步，时刻做好准备，把自己的实力不断提升，才能取得较大的成功。每天一点一滴所慢慢累积出来的实力，相信届时定能一鸣惊人，成功指日可待。"},{"n":96,"no":"第 96 签","ji":"上上灵签","text":"巍巍宝塔不寻常，八面玲珑尽放光。劝汝志心勤顶礼，天龙拥护降千祥。","jie":"灵签之曰：用诚心去做事情，那么福德就会来到您身边。这个签代表你所有的计划和努力都会带来吉利的结果。此宝塔为耸立云霄巍巍者。八面均放出异彩。啻要君志心勤顶礼。天龙。此吉祥之天兽。为君汝降天祥者。易言之。这此福田诸人皆现可用诚心福德即到。交易-大吉婚姻-和合求财-正胜自身-许经家宅-许经六畜-欠利田蚕-半寻人-遇行人-动六甲-喜山坟-大吉讼词-和疾病-祭星失物-难移徒-吉","xiangjie":"此签有”终能如愿”之意。鼓励当事人，凡事有始有终。人人都希望能有功成名就、大富大贵之日，但别忘了”三分天注定，七分靠打拼”的道理。既然有理想、有梦想，就要靠自己，凡事只要肯做、肯冲、肯拼，抱持着勇往直前、积极进取的态度、持之以恒，必有成功之日。"},{"n":97,"no":"第 97 签","ji":"中下灵签","text":"园林月色摇疏影，恍若铺成满地琼。几度儿童来收拾，岂知收拾总无成。","jie":"此签告诉我们，要明白人生的原则，不应一味追求物质上的财富，要学会放下和珍惜眼前所拥有的一切。诗曰：恍若铺成满地琼。岂知收拾总无成。如君之行动不紧速。将闹得无法收拾。谣言四播。到头来将陷入罗网中自拔不得。如此苦境只有几人知。易言之。君目下之运也。该知富贵在天。贫穷由命不用机谋。皆有分定者耶。","xiangjie":"此签有“欲念无穷”之意。它奉劝当事人，在取之于物事中，要有平衡、够用的概念，要谨慎节制，限制自己的欲望。要知足常乐，不能任由欲望无止尽的扩大，因为这样会导致反效果而毫无帮助。"},{"n":98,"no":"第 98 签","ji":"下灵签","text":"经商出入事迟疑，恐惹闲愁与是非。如鸟飞投罗网陷，相看能有几人知。","jie":"灵签之曰：本签者。当被困在棘手的状况中时，最好的做法就是随缘守旧，直到遇到更好的机会才可以不断进步。诗曰。经商出入事迟疑。也因此惹闲愁。不必要之愁争。听了是是非非。谣言四播。逢遇如此罗网苦境中。必须多修福。积德方能脱离险境者耶。易言之。君之今也。禽遭罗网有理难分。随缘守旧遇贵乃成之命耶。交易-损失婚姻-不长求财-破财自身-小人家宅-忧疑六畜-损田蚕-损寻人-杳行人-困难六甲-刑伤山坟-绝讼词-亏疾病-罗网失物-凶移徒-勿动","xiangjie":"此签有”藉口逃避”之意。奉劝当事人，不要以藉口逃避自己的义务与责任，勇于正视自己，以每个人内心都向往的自由自在无忧无虑的心态面对凡事，把藉口合理化。尤其是为人父母者，更应负起责任，绝无任由对方辛苦、自己逍遥快活之理。遇事不要选择逃避，凡事都应勇于面对、接受。须知每个人的内心都向往能自由自在无忧无虑，因此更应将心比心，绝对不要把自己的快乐建筑在别人的痛苦上。"},{"n":99,"no":"第 99 签","ji":"中平灵签","text":"等闲骑马着鞭来，半有忧危半有财。似火方烧头上屋，天教一雨荡殃灾。","jie":"灵签之曰：不管你是否清楚事实真相，不分是非，我们都会被放回自由的状态，受到上帝的宽恕。此签凶危有财之象，凡事先凶后吉。正受灾殃之刻。一场大雨来了之后。方可将灾厄洗清而去。目下虽事难成。劳心劳力之后。必有转安之时。易言之。君汝也。知如不知不管是非身临枷锁恩赦放归。交易-阻婚姻-刑克求财-破财自身-守谨家宅-祈保六畜-损田蚕-损寻人-招非行人-困难六甲-险山坟-败地讼词-亏疾病-忧危险失物-凶移陟-守旧","xiangjie":"这一签的含义是祸福尚未定夺，提醒当事人保持乐观态度。事情有时可能出乎意料，无论是好是坏，所以不必太过焦虑，凡事以乐观的态度看待它们。又如俗话“既来之，则安之”，我们应该接受发生的一切，因为得失是相伴随的。"},{"n":100,"no":"第 100 签","ji":"中下灵签","text":"欲就东兮欲就西，逢人说事转痴迷。登山不见神仙面，莫若归休更勿提。","jie":"此签意味着变化无常，大部分情况都是空洞的而不实在的，有所谋划的事情会费尽心力才能达成愿望。第一百是盈数，代表它是前数的终结，后数的开始。这意味着黑暗将要走，黎明将要来临。表面上看可能是失去了什么，其实意味着要达到通胜而宽容的目标，只有收集福气才能做到，应小心积累，祈求未来的谋划会有艰辛而长久的成果。","xiangjie":"此签主张一切以实际行动为先。奉劝当事人，务必脚踏实地，谨慎对待一切瞬间的东西，有些事是可遇而不可求，对于昙花一现的物事，切勿妄想执着，无异于守株待兔，只不过是浪费时间、枉费心力罢了。与其执着在不确定的事情上面，还不如跳脱迷思，自力更生。凡事务实、一步一脚印，须知一分耕耘，才有一分收获，只有通过自己的努力才能实现自己的梦想。"}];

  var drawBtn = document.getElementById("drawBtn");
  var againBtn = document.getElementById("againBtn");
  var copyBtn = document.getElementById("copyBtn");
  var allToggle = document.getElementById("allToggle");
  var allList = document.getElementById("allList");
  var qianCard = document.getElementById("qianCard");
  var resultCard = document.getElementById("resultCard");
  var resNo = document.getElementById("resNo");
  var resJi = document.getElementById("resJi");
  var resPoem = document.getElementById("resPoem");
  var resJie = document.getElementById("resJie");
  var resExtra = document.getElementById("resExtra");
  var drawing = false;
  var lastText = "";

  function jiLevel(ji) {
    var s = String(ji || "").replace(/^\s+|\s+$/g, "");
    if (!s) return "";
    if (s.indexOf("下") !== -1 || s.indexOf("凶") !== -1) return "down";
    if (s.indexOf("上") !== -1 || s.indexOf("大") !== -1) return "up";
    if (s.indexOf("中") !== -1 || s.indexOf("平") !== -1) return "mid";
    return "mid";
  }

  function makeJiBadge(ji) {
    var span = document.createElement("span");
    span.className = "ji-badge jl-" + jiLevel(ji);
    span.textContent = ji;
    return span;
  }

  function clearChildren(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
  }

  function normalize(q) {
    var n = {
      no: q.no || ("第 " + q.n + " 号签"),
      ji: q.ji || "",
      poem: q.text || q.name || "",
      jie: (CFG.jieField && q[CFG.jieField]) || q.jie || q.jieyue || "",
      extra: []
    };
    for (var i = 0; i < CFG.extraFields.length; i++) {
      var e = CFG.extraFields[i];
      if (q[e.key]) n.extra.push({ label: e.label, value: q[e.key] });
    }
    return n;
  }

  function buildText(q) {
    var lines = [CFG.name + " · " + q.no];
    if (q.ji) lines.push(q.ji);
    if (q.poem) lines.push(CFG.poemLabel + "：" + q.poem);
    lines.push(CFG.jieLabel + "：" + q.jie);
    for (var i = 0; i < q.extra.length; i++) lines.push(q.extra[i].label + "：" + q.extra[i].value);
    return lines.join("\n");
  }

  function showResult(q) {
    resNo.textContent = q.no;
    clearChildren(resJi);
    if (q.ji) {
      var b = makeJiBadge(q.ji);
      if (b) resJi.appendChild(b);
    }
    resPoem.style.display = q.poem ? "" : "none";
    resPoem.textContent = q.poem;
    resJie.textContent = CFG.jieLabel + "：" + q.jie;
    clearChildren(resExtra);
    for (var i = 0; i < q.extra.length; i++) {
      var line = document.createElement("div");
      line.className = "qian-extra-line";
      line.textContent = q.extra[i].label + "：" + q.extra[i].value;
      resExtra.appendChild(line);
    }
    resultCard.style.display = "block";
    resultCard.classList.remove("show");
    void resultCard.offsetWidth;
    resultCard.classList.add("show");
    lastText = buildText(q);
  }

  function startDraw() {
    if (drawing) return;
    if (!QIAN || !QIAN.length) {
      setStatus(t('ui.100','签文数据为空，无法抽签'), "error");
      return;
    }
    drawing = true;
    drawBtn.textContent = t('ui.102','抽签中...');
    drawBtn.disabled = true;
    resultCard.style.display = "none";
    resultCard.classList.remove("show");
    qianCard.classList.remove("drawing", "drawn");
    void qianCard.offsetWidth;
    qianCard.classList.add("drawing");
    var picked = QIAN[Math.floor(Math.random() * QIAN.length)];
    setTimeout(function () {
      qianCard.classList.remove("drawing");
      qianCard.classList.add("drawn");
      drawBtn.textContent = t('ui.103','开始抽签');
      drawBtn.disabled = false;
      drawing = false;
      showResult(normalize(picked));
    }, 2600);
  }

  drawBtn.addEventListener("click", startDraw);
  againBtn.addEventListener("click", startDraw);

  copyBtn.addEventListener("click", function () {
    if (!lastText) return;
    copyToClipboard(lastText, copyBtn);
    setStatus(t('ui.101','结果已复制到剪贴板'));
  });

  allToggle.addEventListener("click", function () {
    var open = allList.style.display !== "none";
    allList.style.display = open ? "none" : "block";
    allToggle.textContent = open ? t('ui.viewAllSigns','查看全部签文') : t('ui.collapseAllSigns','收起全部签文');
  });

  (function buildAll() {
    for (var i = 0; i < QIAN.length; i++) {
      var q = normalize(QIAN[i]);
      var row = document.createElement("div");
      row.className = "all-row";
      var head = document.createElement("button");
      head.type = "button";
      head.className = "all-head";
      var noSpan = document.createElement("span");
      noSpan.className = "all-no";
      noSpan.textContent = q.no;
      head.appendChild(noSpan);
      if (q.ji) {
        var b = makeJiBadge(q.ji);
        if (b) head.appendChild(b);
      }
      var poemSpan = document.createElement("span");
      poemSpan.className = "all-poem";
      poemSpan.textContent = q.poem || q.jie;
      head.appendChild(poemSpan);
      var body = document.createElement("div");
      body.className = "all-body";
      var p = document.createElement("div");
      p.className = "all-poem-full";
      p.textContent = q.poem;
      body.appendChild(p);
      var j = document.createElement("div");
      j.className = "all-jie";
      j.textContent = CFG.jieLabel + "：" + q.jie;
      body.appendChild(j);
      for (var k = 0; k < q.extra.length; k++) {
        var line = document.createElement("div");
        line.className = "all-jie";
        line.textContent = q.extra[k].label + "：" + q.extra[k].value;
        body.appendChild(line);
      }
      row.appendChild(head);
      row.appendChild(body);
      head.addEventListener("click", function (e) { e.currentTarget.parentNode.classList.toggle("open"); });
      allList.appendChild(row);
    }
  })();
})();
  </script>
</body>
</html>
