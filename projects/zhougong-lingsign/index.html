  extra:[],
  qian:[{"n":1,"text":"福禄朝天远、名高利更亨、公私财喜庆、百福自来迎。","jie":"吉祥富贵像一条源远流长的江河，自漫无边际的苍穹悠远而来，使得求此灵签的人不只能够扬名立万。而且，财利更加的亨通。不论是在公家方面或是在私人领域，处处都能够得到吉利与欢欣，所有一切的事情自然皆能迎刃而解。","xiangjie":"功名：福禄天降、功成名扬。升迁：升官发财、福自天来。事业：逐步优游、名扬利就。失物：复得有望、完璧留香。财利：财足源远、益利千遍。疾病：消灾解厄、神清气和。婚姻：佳人足好、白首偕老。行人：佳音频催、门第生辉。田宅：物阜丰饶、添购吉兆。出行：一路顺风、安抵家门。店面：日日生财、前景无涯。六甲：天送贵子、造福乡梓。官讼：吉人天相、讼息吉祥。六畜：无疾无碍、无病无灾。家运：和乐安泰、进取无灾。求谋：贵人列队、所求皆遂。移居：此是吉宅、安居世代。祖茔：砂水当前、福祚绵绵。"},{"n":2,"text":"家道未能昌、危危保祸映、暗云侵月桂、家人一炉香。","jie":"家运仍在低迷的谷底徘回，还没有能够兴盛的时候，就要提高警觉，正视着各种情况的变化，守护着家里的人、事、物，随时注意有没有灾祸所映照出来的一些看起来不寻常的举动、境遇或状态。比如看到了月亮被少许乌云侵入时，就不可掉以轻心，这是一种不祥的征兆，要立刻集合家人围在香炉旁烧香敬拜神佛，祈求神明庇佑一家大小平安康宁。","xiangjie":"功名：求官不济、考试不利。升迁：谨守安待、该来就来。事业：循序守○、创业不久。失物：运低无助、何劳寻之。财利：安贫乐道、清心祸消。疾病：痊之不易、求神护庇。婚姻：枝本无叶、莫怪日偏。行人：音信迟疑、会合无期。田宅：五谷欠收、置产利薄。出行：家道未昌、远行不当。店面：此店无气、开之何益。六甲：嗣息未愿、广结善缘。官讼：讼之不吉、求和方利。六畜：饲之无益、徒费心力。家运：家运低迷、大小悒悒。求谋：安份守己、求谋不宜。移居：多方不足、消念祈福。祖茔：环境有亏、祈神解厄。"},{"n":3,"text":"谋道言婚吉、求官在晚成、复开花结子、更物转光明。","jie":"求得此签之人，若设法求取婚姻的话，那将是美事一桩，婚姻必能白首好合。若是求官考试，那就要经过一番折腾，立定志向下苦工才能如愿，也就是属于“大器晚成”的人。而且，不论做任何事情，都会有好的开始和圆满的结果。只是要具备灵活的智能，作阶段性的调整和变通，山不转路转，此路不通另寻他路，要知道条条大路通罗马的道理。","xiangjie":"功名：求官晚成、试场多争。升迁：此职不升、他迁必成。事业：初营多艰、后必欢颜。失物：物去无妨、更遍吉昌。财利：钱财自有、越外莫求。疾病：病色不起、速换良医。婚姻：佳偶孝悌、合和如意。行人：鱼雁信捎、伊人安好。田宅：改易栽种、置产利通。出行：一路通坦、欢喜平安。店面：若想开店、宜改门面。六甲：得子有望、家门吉昌。官讼：讼之不完、律师速换。六畜：无病无灾、财利自来。家运：家运平平、老少康宁。求谋：心中谋求、要勤奔走。移居：迁移有利、发展可期。祖茔：砂水向阳、亡灵安祥。"},{"n":4,"text":"凿石方知玉、淘砂始是金、悲风愁过面、自想不知音。","jie":"我是一块晶莹剔透、光泽亮丽的美玉，为什么一定要经过多层面的锯割、琢磨与刷洗，才会看清楚我的完美无瑕？我是混藏在溪河中，重重泥沙里面的珍贵黄金，为什么必须透过大水的冲刷涤荡，才会发现我的存在？可悲啊！每当想到要面临这一种际遇，愁绪就涌上了面庞，心理感叹着“知音”何在？“伯乐”何在？","xiangjie":"功名：官位莫望、试场空忙。升迁：勤快超昔、他日可及。事业：谨慎经营、创业非今。失物：重新物色、当舍则舍。财利：汲汲营营、财不我应。疾病：宽心从善、带疾延年。婚姻：知音难觅、姻缘难期。行人：流离失所、音信难托。田宅：禾黍凋枯、买卖谁赎。出行：程途多险、请待来年。店面：门市寂寥、雀飞狗跳。六甲：求男嗣继、力行孝悌。官讼：败讼已定、速和吞声。六畜：牲口不兴、静待佳音。家运：丁口有恙、祈神解禳。求谋：安守本份、求谋谁问。移居：喋喋唧唧、丁口不齐。祖茔：真气涣散、居之可叹。"},{"n":5,"text":"称心欢喜、欢喜称心、禄马相朝接、财喜自来迎。","jie":"所做的事情能够满意的达到先前预期的效益与结果，实在令人太高兴了。实在令人太高兴了，所做的事情能够满意的达到先前预期的效益与结果。官职、马车（坐乘）自朝中连接邮驿，一站一站互相传报而来，有了官位，财利自然而然的迎接着你。","xiangjie":"功名：宜其得官、扬名立万。升迁：辛勤有功、实至名隆。事业：蒸蒸日上、创业得赏。失物：他乡协寻、复得宝珍。财利：生涯滚滚、投机莫问。疾病：无忧无愁、灾疾立休。婚姻：珠联壁合、佳人可得。行人：伊人安渡、人在归途。田宅：田产丰足、买卖可图。出行：欢喜出行、满载归程。店面：人气旺盛、穿梭不停。六甲：麟儿喜得、绵绵福泽。官讼：已讼可息、新讼不宜。六畜：六畜兴旺、财利自扬。家运：生气蓬勃、无灾无祸。求谋：事事得宜、偿愿在即。移居：处之安泰、兴发可待。祖茔：砂环水绕、居之安好。"},{"n":6,"text":"古镜复重磨、钱财积聚多、立身终有望、进士必登科。","jie":"把你以前磨过的那一面“古镜”拿出来，重新再把它磨得更为明亮光滑，如此一来，钱财就会愈聚愈多，安身立命有所着落。即使赴京赶考能够高中“进士”必然也是意料中的事情。","xiangjie":"功名：首考不利、再考及第。升迁：老调重弹、升迁必然。事业：重操旧业、名利不坠。失物：重复寻找、失物难逃。财利：营生守旧、财利丰厚。疾病：一心求神、沉疴断根。婚姻：新婚不吉、再婚得利。行人：伊人已动、近日相逢。田宅：桑麻饱满、置产安然。出行：旧地重游、欢喜无忧。店面：老店重开、福自天来。六甲：头胎女产、再生必男。官讼：老案可胜、新案难成。六畜：六畜无灾、血财安泰。家运：谨慎进取、丁口团聚。求谋：一再求谋、终得神佑。移居：莫问迁移、老宅多利。祖茔：凶葬不吉、吉葬有利。"},{"n":7,"text":"有忧不用忧、财喜自当求、公私皆吉庆、灾病一齐休。","jie":"有什么好忧愁的呢？忧愁对事情又有什么帮助？赶快把忧愁抛弃掉，打起精神，乐观进取的去追求财利吧！能够如此，不论是公的领域或私的领域，都会有可喜可贺的吉利情况出现，即使是灾厄或疾病也会一齐消遁无踪。","xiangjie":"功名：前程锦绣、富贵悠悠。升迁：稍安勿躁、喜神报到。事业：鸿图再展、名利均沾。失物：勿嗔勿忧、可望解愁。财利：益利频传、善行合欢。疾病：福星拱照、灾病潜逃。婚姻：佳人有情、前生缘定。行人：音信有凭、会合自迎。田宅：桑麻盈盈、欣喜不停。出行：远行顺畅、愉悦出航。店面：车水马龙、钱声咚咚。六甲：弄璋有准、能武能文。官讼：止争息讼、其乐融融。六畜：微灾不忧、血财可求。家运：离苦得乐、老少讴歌。求谋：谋望皆遂、贵人相随。移居：迁移如意、家道殷奇。祖茔：龙虎登对、福荫不退。"},{"n":8,"text":"有宝有财、禄马飞来、望更清朝吉、往来亦无灾。","jie":"有贵重的珍宝，更有钱财，官职和象征官位所乘用的马车如飞般的疾驰而来，这种景象便可纾解你从夜晚焦虑的望着更漏直到清晨所盼望、等待的美好结果。高中而得到官职与财宝，今后不论去到什么地方，便没有人会看轻你、讥笑你、刁难你了。","xiangjie":"功名：十年寒窗、扬名风光。升迁：等待至今、明早佳音。事业：通路畅快、利名无碍。失物：物去不远、翌晨即还。财利：财多利倍、源通南北。疾病：神清气爽、康健昂扬。婚姻：丽质天生、琴瑟共鸣。行人：异地风光、归期有望。田宅：五谷丰登、买卖多成。出行：东西南北、观花赏梅。店面：南北东西、人潮挤挤。六甲：贵子神送、耀祖光宗。官讼：胜讼将息、善行莫弃。六畜：六畜兴旺、成群嘶昂。家运：家运昌隆、日日亨通。求谋：贵人天助、谋望无阻。移居：顺利如意、必有佳绩。祖茔：金城水环、有财有官。"},{"n":9,"text":"有意望明月、复圆又复缺、间虑苦伤心、终身需守节。","jie":"我诚心诚意的想要观赏一轮圆圆满满、清澈皎洁的月亮，可是她却是圆了又缺，缺了又圆，总是这么的反复无常。而在圆满与残缺之间，让我思虑着人生种种的困苦和艰辛，一阵悲伤不知不觉涌上心头。然而，不管环境如何的变化，不论过程如何的圆缺，我终身一定要坚守志气与节操。绝对不会随着人、事的改变而更变我的立场和原则。","xiangjie":"功名：坚此百忍、梦必成真。升迁：耐心勤勉、终必高迁。事业：惨澹经营、创业不行。失物：去之已远、伤神难圆。财利：财来财去、时散时聚。疾病：反反复覆、时好时不。婚姻：此缘难圆、另谋他年。行人：有音无音、反复难寻。田宅：五谷不齐、购屋不宜。出行：喜喜忧忧、此行该休。店面：此店勿买、忧心难改。六甲：胎孕恐损、虔诚求神。官讼：此讼宜和、莫再纠葛。六畜：旺衰不定、新饲莫行。家运：起起落落、志节勿脱。求谋：求谋止念、自身周全。移居：吉利不现、莫再动念。祖茔：旧坟有凶、新坟莫用。"},{"n":10,"text":"有喜有喜、有财有财、求谋皆称遂、如花带露开。","jie":"有欢喜的是临门了，有欢喜的是临门了。因为得到所祈求的钱财宝物了。因为我得到所祈求的钱财宝物了。而且我计划求取的事情都能够一件一件达到预期的愿望，就好像花蕾受到露水的润泽，而绽放出美丽清香的花朵。","xiangjie":"功名：登科扬名、安享福应。升迁：水到渠涨、当仁不让。事业：稳步成长、达通利彰。失物：物归故主、吉人天助。财利：财如泉泻、永不枯竭。疾病：悉心调养、宿疾远飏。婚姻：如花美眷、永慕爱恋。行人：他乡得意、见面可期。田宅：购田买屋、财利可图。出行：此行大可、灾咎不惹。店面：买租营生、财利必亨。六甲：祭祀有人、接生佳麟。官讼：神佑黎民、讼事不侵。六畜：畜禽安逸、乐自心喜。家运：安康得兼、福祚连连。求谋：求谋皆遂、如痴如醉。移居：福至心灵、乔迁禄迎。祖茔：山环水抱、物阜丰饶。"},{"n":11,"text":"绿柳郁苍苍、今朝过午后、云开见残月、舟回待便风。","jie":"柳树是那样的青翠蓊郁，看起来生意盎然，可是，我却无心留连在此欣赏美景，今天中午过后，浓云散去了就会露出一弯残月。那时候，我将驾着小舟回去，只要等到起风之时，便趁着顺风起程。","xiangjie":"功名：目下有祖、后运有助。升迁：不能如愿、静待他年。事业：稳当保全、兴发来年。失物：复得有望、多方提防。财利：财利虽好、起得太早。疾病：悉心献娱、不日可愈。婚姻：姻缘难缔、耐心佳期。行人：风尘仆仆、会面从速。田宅：田产虽利、静待时机。出行：心情郁结、此去难解。店面：营生过早、尚待人潮。六甲：求神行善、必获麟男。官讼：和解撤讼、贵人无功。六畜：畜旺禽佳、奈何贱价。家运：平安是福、希勿自误。求谋：心有所图、求神助。移居：保守应对、否则运退。祖茔：虚花假穴、砂水欹斜。"},{"n":12,"text":"花谢花重发、月缺月再圆、后和阳谷日、何虑不谊谨。","jie":"花儿凋谢了还会重新绽开出美丽的花朵，月亮残缺了也会再一次的团结圆满。大自然就是呈现这种盈虚消长、周而复始的循环理则在运行。所以花谢花开，月缺月圆完全是一种大自然的现象。了解了这一个道理之后，在阳和日丽的日子里，就必须知道每个阶段应该要如何去做，不必考虑什么时候要乐观进取，什么时候又要谨慎小心了。","xiangjie":"功名：再接再厉、不可放弃。升迁：升迁欲顺、犹待三春。事业：起起落落、终必结果。失物：塞翁失马、复得桑麻。财利：续续断断、只待时援。疾病：时好时坏、春来康泰。婚姻：吵吵闹闹、反成吉兆。行人：书信往返、会晤不难。田宅：田园将芜、待时而锄。出行：此行安稳、必待来春。店面：目下冷清、时到热情。六甲：先女后男、香火不断。官讼：息讼静待、良机可裁。六畜：现今不旺、恐多损伤。家运：此事起伏、他日享福。求谋：若要周全、须待来年。移居：先衰后吉、安待莫急。祖茔：气运未到、久葬富饶。"},{"n":13,"text":"去往心未定、行藏亦未能、一轮清皎洁、和被暗云遮。","jie":"他方有美好的景象等待你去开发拓展，可是去或不去，你却拿不定主意，要做或不做也不能下定决心，这样的迟疑、裹足不前的态度，就好像一轮皎洁圆满的月亮，被乌云遮掩了光辉，无法彰显出曼妙、灿烂绚丽的美景，真是太可惜了。","xiangjie":"功名：功名难图、考试负负。升迁：意志不坚、莫问升迁。事业：经营不力、上班为宜。失物：先机已失、物去难识。财利：争竞财退、薪水可追。疾病：病势渐沈、速求诸神。婚姻：勉强配对、将生怨悔。行人：流离颠沛、归期暧昧。田宅：栽种买卖、无人能裁。出行：行止不定、自家安宁。店面：主人不济、徒负店基。六甲：男胎女胎、神明安排。官讼：小心谨慎、讼已成真。六畜：畜产不旺、痴心愚妄。家运：乌云遮月、谦冲可解。求谋：无力谋事、安份待时。移居：主意犹疑、莫问迁移。祖茔：玄武低陷、此地莫扦。"},{"n":14,"text":"未能事人、焉能事神、若不信吾语、苑香何处尘。","jie":"若是不能殷勤照顾、悉心的服侍一个人，让他服服贴贴感到非常愉悦、快慰的话，那么，你也就无法侍奉一尊神明，毫不间断的早晚三炷香，花果、清茶，持恒的供养。如果不相信我说的这一句话，请去看看人物聚集的书香文苑，何处会沾上一丝丝灰尘呢？","xiangjie":"功名：检讨改进、徐图再拼。升迁：升迁无门、再加勤奋。事业：反省不懈、不宜创业。失物：物已远遁、何劳再问。财利：保守因应、莫存侥幸。疾病：悉心照顾、好转加速。婚姻：多方尊重、求婚亦同。行人：多所沉闷、欲回无门。田宅：栽种欠收、置产保守。出行：走马看花、不如在家。店面：此店不旺、另找他房。六甲：若要生男、多多行善。官讼：和解要快、此事难奈。六畜：服侍禽畜、与人无误。家运：平常安度、守株待兔。求谋：诚意不坚、势难如愿。移居：迁移为何、现居可乐。祖茔：砂水不真、多详细审。"},{"n":15,"text":"出外须防危、居家长虑愁、求福身多吉、得意也须休。","jie":"驾着小舟要到江河的对岸去，想不到来到中途，无一间脱手失掉了划水用的木桨，虽然江河已经过了一半，若此时遇到了风浪，那将如何是好？我终身本就没有可以携带的东西，若再遭遇灾难，那将是无可奈何的事。","xiangjie":"功名：莫求功名、更变营生。升迁：自始非你、不切实际。事业：兢兢业业、秋风落叶。失物：枉费心机、寻之无益。财利：安贫从善、乐天无险。疾病：速求神力、祈禳救济。婚姻：缘起缘灭、此姻难结。行人：音信杳杳、见面难找。田宅：虫害不熟、田宅多忧。出行：此去有灾、改期安排。店面：辛苦奔忙、家当败光。六甲：多作胎检、多方周全。官讼：久讼必了、新讼不妙。六畜：休养休豢、清闲弹弦。家运：难为丁口、注意水火。求谋：处处乌云、孑然一身。移居：静则安守、迁则忧愁。祖茔：砂水散漫、穴场凌乱。"},{"n":16,"text":"出外须防危、居家常虑愁、求福身多吉、得意也须休。","jie":"出门在外处处要小心，提防危险的发生，即使安居家中也要常常思考着，有什么令人忧愁的是可能会发生。祈求神明赐福，因而得到了各种吉祥与荣耀，虽然心里很高兴快乐，但是一定要停止意气昂扬，四处招摇吹嘘。","xiangjie":"功名：缜密谦冲、扬名有功。升迁：降下荣耀、切莫招摇。事业：细密张罗、喜结佳果。失物：事属徒劳、亡羊补牢。财利：汗财留香、行险难享。疾病：勤礼神明、必脱困境。婚姻：已婚多容、欲婚难从。行人：行人安全、终必团圆。田宅：留心变化、利必可夸。出行：出外防危、无咎无悔。店面：谨慎保守、莫争兴头。六甲：得男欣喜、骄则招忌。官讼：弭讼可期、低调为宜。六畜：细心提防、莫出状况。家运：居安思危、福禄相随。求谋：多面张罗、悄悄结果。移居：百般费心、徒然伤神。祖茔：老坟仍佳、新地莫下。"},{"n":17,"text":"春来逢景秀、登舟汛五湖、一枝波涛浪、庶得贵人扶。","jie":"春天来了，四处都是一片繁华美好的景色，我不想辜负这大好的春光，于是驾着一叶小舟，泛波在五湖四海之上，欣赏着那种璀丽的山光水色。忽然蓦地袭来一股高大的巨浪打在小舟上，我无畏无惧、坚定信念的牢牢稳住舟身才能够幸免于难。这一切都要归功于贵人扶持之力。","xiangjie":"功名：站稳脚步、青云得路。升迁：意志若坚、名题乃迁。事业：方向紧握、无畏无错。失物：多方得助、重归故土。财利：景况大好、投机破耗。疾病：疾病消散、神前拜忏。婚姻：虽有波折、终必合和。行人：偶有小失、见面待时。田宅：景象可喜、暗藏凶机。出行：有惊无险、行止自便。店面：看似繁华、暗探高挂。六甲：先女后男、必有才干。官讼：讼可止息、贵人助力。六畜：偶有疾灾、并无大碍。家运：偶有低潮、终必福到。求谋：再接再厉、贵人提携。移居：先衰后稳、我自屈伸。祖茔：堂局不密、或有压逼。"},{"n":18,"text":"忧感暂销镕、求名得再通、宝财临禄位、常偶主人公。","jie":"烦忧已暂时冰消化解，匿去无踪，那是由于，我所企盼得到的名位已经得到了，其他的事情也一再亨通如意。财宝伴随着职位逐步积聚增加，这应该要常常陪伴着礼敬庇佑我的“主神”恩公，以报答祂的大恩大德。","xiangjie":"功名：垂手可得、名利登科。升迁：升官发财、乐自开怀。事业：蒸蒸日扬、利名俱张。失物：耐心等待、定然回来。财利：源源如泉、勤植福田。疾病：疴瘳远遁、康泰谢神。婚姻：宜室宜家、共赏晚霞。行人：名成利得、不日会合。田宅：田产丰腴、买卖大利。出行：一路景秀、沁怀凉透。店面：开张大吉、人潮不息。六甲：梦麟得真、速报神恩。官讼：总如预期、有事不忌。六畜：六畜兴旺、酬主燃香。家运：丁口得助、眉飞色舞。求谋：神威庇佑、有求必周。移居：落脚安居、事事可取。祖茔：得气得局、蜂屯蚁聚。"},{"n":19,"text":"明月暗云浮、花红一半枯、事惹伤心处、行船莫远进。","jie":"皎洁明亮的月儿被浮云遮蔽，显得黯淡无光。开得火红艳丽的花儿却枯萎了一半，怎能引蜂蝶的青睬关爱？此情此景触动了我脆弱的心灵，不禁悲从心起，再也没有闲情意致欣赏山光水色，因而掉转船头，决定不要再往前挺进到更远的地方。","xiangjie":"功名：功名困踬、另谋技职。升迁：非份莫想、他年留香。事业：乌云满天、如何向前。失物：只怪自身、莫怨他人。财利：打消此念、否则难闲。疾病：速求神佛、消灾解祸。婚姻：此缘非善、断难称赞。行人：流落颠离、会面无期。田宅：谨防病虫、置产不从。出行：谨防有险、速消此念。店面：门可罗雀、回头正确。六甲：六甲女胎、注意防灾。官讼：求和沈潜、莫陷深渊。六畜：疾灾连连、求神消愆。家运：迭有病灾、求神安排。求谋：何需算计、安份守己。移居：气运已过、移居不安。祖茔：漫无遮拦、亡灵不安。"},{"n":20,"text":"月被浮云翳、立宇自分明、或乞阴公佑、何虑不开眉。","jie":"光亮洁净的月儿被浮云遮住了，你还舒适的躲在房里而无法查觉，赶快站到门屏间看看就清清楚楚了。接下来就必须思考要如何扫除翳障，若是想不出办法，那只好虔敬的祈求神明作主，神威显赫又慈悲的“王公祖”一定会为你解冤释结。如此，你又何必担忧眉头紧蹙而舒展不开呢？","xiangjie":"功名：细检缺点、他图历练。升迁：希求渺茫、宽心养望。事业：不利开创、老业多防。失物：物去人安、且多行善。财利：求财宜慎、还须安份。疾病：有病速医、或乞神意。婚姻：久婚有变、新婚勿联。行人：音信渺渺、远去迢迢。田宅：买卖不可、休种黍禾。出行：此行不顺、香火随身。店面：门庭冷清、不知客情。六甲：生女委婉、乞神祈男。官讼：情势有变、乞神化险。六畜：不旺不兴、徒增不宁。家运：已蒙灰尘、虔敬礼神。求谋：乌云已见、谋望难现。移居：不动不移、方是上计。祖茔：龙气渐丧、请神祈禳。"},{"n":21,"text":"红日当门照、缺月再团圆、遇珍须得宝、颇有称心田。","jie":"火红般的太阳当着门照射进入屋内，让人感到寒冬远去，温暖的春天来到。残缺的月亮慢慢地又回复饱满团圆的状态，令人倍感欣喜。每当遇到这种不能长久停留的美好景象，要像得到财宝一样的珍惜，把握此大好时光规划事情的进程。如此，做起事来就能够得心应手，称心如意了。","xiangjie":"功名：一吐晦气、名扬得利。升迁：失而复得、营造气和。事业：渐渐拓张、欢颜久长。失物：耐心等候、必有交差。财利：谷底爬升、心想事成。疾病：大病初醒、痊谢神明。婚姻：佳人有情、白首吹笙。行人：低潮已去、会合欢愉。田宅：禾黍满足、购屋吉助。出行：欢喜欢喜、旅途如意。店面：此店亨通、营利长红。六甲：后生俊彦、香火绵绵。官讼：老讼胜止、新事难治。六畜：低迷不再、把握现在。家运：吉昌安康、丁口昂扬。求谋：策谋望愿、悉听尊便。移居：旧雨新知、络绎而至。祖茔：砂水得运、屈曲得伸。"},{"n":22,"text":"桂林一枝、麦穗两岐、鱼儿入网、燕子来时。","jie":"“桂树”象征功名利禄，进入了桂林只可依才能求取一官一职，不像进入象征财富的禾黍菽田园里，总希望它开出两穗、三穗甚至更多。但不论功名或财富，一定要立定志向，下定决心，孜孜不倦勤奋不怠，就像在江海中撒下了网等待鱼儿入网，只要春天一到，燕子飞来的时候，便可享受丰收的喜悦。","xiangjie":"功名：坚定志向、翌春名扬。升迁：主意坚定、文上有名。事业：多角营运、创业来春。失物：小去大来、何必喊衰。财利：撒网若早、鱼儿难逃。疾病：明春病除、求神作主。婚姻：来春谈亲、必有佳音。行人：行人已动、明春相逢。田宅：此时不宜、且待佳机。出行：景色秀丽、家门安抵。店面：时机未到、多作市调。六甲：巧心细算、明春得男。官讼：多方打点、明春安显。六畜：兴旺有期、春来最宜。家运：勤奋豁达、清而不杂。求谋：耐心等待、佳音必来。移居：多方打听、明春可行。祖茔：堂局兜抱、此地尚好。"},{"n":23,"text":"巧说似有情、自想不知音、灾祸欲离脱、如何得全活。","jie":"任凭你舌粲莲花，如何巧妙的诉说，看起来似乎一切都为了我，对我那么的有情意。可是，我自己仔细想过，并非那么有能力、有才华，有智慧了解你心理的真正意图。现在，我只想脱离灾难与祸患，思考着要如何平平安安的渡过这一辈子。","xiangjie":"功名：此路不通、他路有功。升迁：升迁无望、莫怨莫慌。事业：谨慎小心、创业艰辛。失物：有去无回、庶免灾悔。财利：安份自守、快乐长久。疾病：放宽心胸、疾病无踪。婚姻：多阻多碍、情路阴霾。行人：他乡困顿、会期难论。田宅：禾菽枯萎、买卖不对。出行：远行有险、择期再言。店面：营生多累、伙计反背。六甲：欲求嗣男、敬神行善。官讼：讼事久长、怨悔神伤。六畜：多灾多厄、焦头烂额。家运：凡事低调、灾祸不招。求谋：看似美妙、结果难料。移居：迁之无益、守旧安栖。祖茔：砂水反背、否则斜飞。"},{"n":24,"text":"马走来寻鹿、家道丰盈足、有危无不遂、用财须更远。","jie":"我钟爱的那匹马不知跑那里去了，只好放弃它，退而求其次地找寻一头鹿来陪伴。想不到竟然让我的家业蒸蒸日上，家产丰足资源不虞匮乏，每一次发生危险都能够平安渡过。因此，今后我必须广结善缘，再远的地方也要送钱财去布施、赈济当地的穷苦人家，以感谢上天的恩泽，报答神佛荫佑的功德。","xiangjie":"功名：功名成功、大小利通。升迁：如期如愿、多结善缘。事业：四面八方、处处留香。失物：物去勿忧、小去大酬。财利：财多利远、切勿行险。疾病：病渐好转、布施行善。婚姻：此婚神助、益子旺夫。行人：书信往还、归期延缓。田宅：低买高卖、莫嫌法拍。出行：行程无险、愉悦连连。店面：越久越热、不要弃舍。六甲：男儿兴家、代代不差。官讼：当机立断、久成祸患。六畜：畜产兴旺、家门有光。家运：丁口安祥、大小吉昌。求谋：不愁不悲、所求皆遂。移居：先平后昌、财利满堂。祖茔：勾搭小地、有情有气。"},{"n":25,"text":"鹿走白云间、携琴过远山、忽见仙人面、双手倚栏杆。","jie":"鹿群在霭霭的山岚所形成的重重白云中穿梭奔跑，我携带着一张琴要翻越过远方这座山头，途中恐怕会碰上瘴疠或毒蛇猛兽之类的危险，我应该如何排除这些障碍？正忖度间，忽然看见一张仙人的脸，他的双手倚靠在住居的栏杆上，神态非常的悠闲，让我立刻除掉心头上那一层隐忧，宽心大胆的往前迈进。","xiangjie":"功名：坚定信心、成功降临。升迁：有升就好、何必求高。事业：冲破险峻、功成再进。失物：失物难找、虚无缥缈。财利：钱财安稳、不贪不损。疾病：暗里神佑、勿惧勿忧。婚姻：此婚勿筹、终必白首。行人：行人安好、切莫烦恼。田宅：禾黍稳熟、买卖欠周。出行：此行吉贞、神明随身。店面：店稳得助、贵人暗扶。六甲：生男不难、求神如愿。官讼：老讼将结、新讼速解。六畜：六畜平顺、安好单纯。家运：家运安然、丁口欣欢。求谋：贵人穿梭、低调而过。移居：先平后吉、贵人帮助。祖茔：砂水平常、世代安康。"},{"n":26,"text":"鹿马相逢日、云开月色明、有危今已过、仙花果自成。","jie":"鹿马相逢的日子已经来到，扫除过去所有的低潮与不顺，就像拨开云雾的明月那样的光亮洁净。如今，一切的危厄患难都完全过去了，有如神仙种植的花果，渡过脆弱危险的时期，就会自然成长，乃至开花结果。","xiangjie":"功名：功成名扬、府第生香。升迁：得偿夙愿、宽心展颜。事业：开启新机、前景宏丽。失物：何必劳心、或有佳音。财利：财源利倍、守善财随。疾病：康复在即、静心调息。婚姻：神明牵线、百年姻缘。行人：云消雾散、伊人必安。田宅：买卖田宅、福利自来。出行：旅途愉快、平坦舒泰。店面：营生有益、安居乐利。六甲：六甲生男、承欢旦旦。官讼：止争息讼、事事包容。六畜：六畜兴旺、瘟消疫亡。家运：渐次转佳、安和融洽。求谋：全无妨碍、心宽福来。移居：迁移可行、居之有幸。祖茔：气运已到、荫庇富饶。"},{"n":27,"text":"且做江湖客、劳心自知己、一朝兴巨浪、如玉始光辉。","jie":"我有抱负、有理想，只是目前时运不济，暂且委屈寄身在江湖中行走奔波，如此的劳心劳力，也丝毫不敢忘记自己的使命。有朝一日，时机成熟风起云涌，我将一跃而起，鼓动风潮，引领风骚，成为美玉般绽放出万丈光芒的导航者。","xiangjie":"功名：再接再厉、前途快意。升迁：目前非时、想开无事。事业：来年亨通、南北西东。失物：难再寻回、何必愚追。财利：稍安勿躁、来日大好。疾病：耐心安养、体健身强。婚姻：初期平常、越久越香。行人：浮沉多劳、归程难料。田宅：暂且勿动、他日利宏。出行：此行平平、劳顿无病。店面：耐心经营、他日飞腾。六甲：勤修善行、必得男婴。官讼：欲速不达、新讼必差。六畜：时机未到、自寻烦恼。家运：时下平常、他日昂扬。求谋：劳心劳力、目前无益。移居：时机不对、坚定莫悔。祖茔：且莫惊动、待时亨通。"},{"n":28,"text":"枯木未生花、春来喜气佳、忧多生吉兆、脱落如堪夸。","jie":"我非常担忧这一颗濒临枯萎的树木，不能再开出美丽鲜艳的花朵。于是殷勤的照顾，细心的培育着它。如今，春天来了，到处显出一片欣欣向荣，充满喜气的景象，若非我不死心的坚持下去，付出了那么多的心力，才会呈现一线生机，待其抽出了嫩芽，伸展着技叶，便是值得喝彩称赞的时候。","xiangjie":"功名：忍耐吃苦、必能耀祖。升迁：苦干莫怨、升迁不远。事业：惨澹艰辛、历久弥新。失物：好好想想、物在柜箱。财利：辛苦流汗、必有钱赚。疾病：慢调漫理、康复有期。婚姻：休言放弃、再接再厉。行人：久无鱼雁、春来信见。田宅：禾黍不熟、买卖不周。出行：舟车劳顿、安抵家门。店面：另觅他店、钱财立现。六甲：祈神行善、将有佳男。官讼：滋生事端、纠葛难断。六畜：此时此地、禽畜不宜。家运：坚此百忍、否极泰贞。求谋：多求多磨、要成多修。移居：耐心志坚、否则莫迁。祖茔：老坟勿动、新地无功。"},{"n":29,"text":"社稷里中臣、何须作祸崇、事之若有详、家门大吉昌。","jie":"在国家社会里担任要职的政府官员，不论什么事情都要对老百姓说明白他的处理过程，为什么一定要遮遮掩掩含糊蒙骗，引起老百姓的质疑忿怒，制造一些事端之后，再来弹压、协商、解决，这样才显出自己的重要？才会受到更多的尊敬？如果每一件事情都能向人民交代得清清楚楚，让人民透澈了解而服从信任，那将是国家社会最大的福气。","xiangjie":"功名：事事清楚、佳绩可图。升迁：态度含糊、无人能助。事业：开诚布公、走路有风。失物：去方不明、寻之不应。财利：含糊宠统、且莫心动。疾病：时好时坏、详查病灾。婚姻：心态不真、难结姻亲。行人：音讯断续、会期难取。田宅：地段虽美、益利隐晦。出行：行程晦暗、问明事端。店面：勿买勿开、会有后灾。六甲：生女有望、却非弄璋。官讼：止息无期、新讼啜泣。六畜：气运暧昧、恐招邪崇。家运：勿争勿逞、低调守成。求谋：谋求不清、去留不明。移居：考虑不周、迁之发愁。祖茔：明堂破碎、朱雀斜飞。"},{"n":30,"text":"已有清云至、张船待便风、龙登沧海阔、云雨必相从。","jie":"天边已经飘来一大片的清云，我意识到不久将会刮起一阵大风。于是趁现在赶快拉开船上的帆，轻松自在乘着这一阵大风，驾着船到海上去遨游。风来了，吃得饱满的帆扬起了，就像一条龙，登上了波澜壮阔的沧海中，任意驰骋翻腾着，以致蔚成一股气流，云雨必定也会群起簇拥相随。","xiangjie":"功名：挥洒自如、功名神助。升迁：勿忧勿愁、榜上名留。事业：通路大张、八方顺畅。失物：佳音频催、必将回归。财利：财多利厚、心花朵朵。疾病：佳运吉兆、活龙一条。婚姻：已婚有变、新婚珠联。行人：回程途中、不日可逢。田宅：贵人帮助、买卖得意。出行：一路惬意、喜乐交集。店面：时机成熟、一枝独秀。六甲：喜得男生、家运长亨。官讼：不拘新旧、止讼消愁。六畜：六畜兴旺、轻松利强。家运：家运昌盛、厅堂鸣笙。求谋：事事如愿、敬神酬天。移居：时来运转、迁移大赚。祖茔：天心十道、荫庇富饶。"},{"n":31,"text":"千里掌中正、风生浪不成、扁舟乘兴起、忽觅到蓬瀛。","jie":"我意志非常坚定的掌握着舵，不偏不倚、既中且正的在碧波万顷的大海中航行千里之远，绝对不会受到外界的杂音来干扰我前进的方向。一路行来，只有风吹送着帆往前走，并没有形成大波浪。这种景况令驾着扁舟的我顿时兴致大发，张满帆撑稳舵，尽情地往前深入。忽然间，竟让我发现了人人想找的，传闻中美好的蓬莱仙岛。","xiangjie":"功名：坚定方向、扬名故乡。升迁：不偏不倚、合该是你。事业：向前挺进、拓展有幸。失物：失之小物、收之大畜。财利：左右逢源、莫贪险钱。疾病：良医另取、必有奇遇。婚姻：百年好合、永浴爱河。行人：流连忘返、另泊港湾。田宅：五谷丰登、置产多能。出行：快意风景、此行有庆。店面：经营正派、发财三代。六甲：佳男承天、福祈绵绵。官讼：解除纠葛、心宽气和。六畜：大好机会、随养随肥。家运：积善得昌、殊荣安康。求谋：不贪不苛、所求皆得。移居：眼光不差、将会发达。祖茔：山环水抱、佳茔吉兆。"},{"n":32,"text":"升高禄位呈、祸散福重生、万事皆康泰、吉利保长亨。","jie":"我长期处在忧患、低迷的日子里无所作为，只有心存正念行善积德。正因如此，现在才会高升职位，整个人呈现出神清、气爽的样子。祸患消逝得无影无踪，福禄重新降临到我的身上。不论任何事情皆感到安康与祥和，这一些吉利的状况一定可以让我保持长久的亨通。","xiangjie":"功名：眉飞色舞、功名利禄。升迁：平时勤勉、今日高迁。事业：广开通路、畅行无阻。失物：多想多找、必有好兆。财利：求财利多、开源节流。疾病：意志坚定、祸散福生。婚姻：此婚兴家、长亨不假。行人：行人安好、归程未到。田宅：置产栽种、利基长红。出行：欢乐连连、抵家甜甜。店面：虔心供奉、财亨利通。六甲：供神多般、必招儿男。官讼：无忧无惧、自有乐趣。六畜：瘟遁疫消、六畜逍遥。家运：吉祥康泰、诸事无碍。求谋：加重酬劳、万般周到。移居：无灾无祸、早结善果。祖茔：藏风聚气、亨通益利。"},{"n":33,"text":"喜喜未是喜、喜喜便是喜、等待阳和三月景、桃花树上结成子。","jie":"有时候，虽然你感到非常的欢喜，那并不是真正的欢喜。有时候，你感到非常的欢喜，那却确是有实质欢喜的事。其实，欢喜的虚假与真实，完全取决于事情的明朗清澈或混沌晦暗。那么，等到三月天遍地充满阳和日丽的景象，桃花树上结满了果实的时候，一切事情都会“明朗化”，是不是“空欢喜”一场，到时候自然就会揭晓。","xiangjie":"功名：不倦不厌、功名领先。升迁：得失勿重、平常心胸。事业：谨慎自持、等待天时。失物：去向不明、复归无凭。财利：安居乐守、份外莫求。疾病：病况晦暗、春来再看。婚姻：暂勿决定、多看多听。行人：虽无讯息、三月归期。田宅：白费心机、此时不宜。出行：宜其改期、春复无欺。店面：急躁无用、三思有功。六甲：善多感天、得男夏前。官讼：态势浑沌、且待来春。六畜：暂且悠闲、春后再言。家运：守成为本、凡事多忍。求谋：三月来临、成败在心。移居：且细思量、何苦白忙。祖茔：山水不秀、人工剪修。"},{"n":34,"text":"一事未足、一事未能、蛇生龙角日、离暗出光明。","jie":"现在，没有一件事情，足以证明你的运势已经从谷底翻升；现在，更没有任何一件事情能够说明你已经摆脱低迷忧患的境遇而步入坦途。除非，“蛇生龙角”的日子降临，那才是真正远离黑暗、扫尽阴霾，重见光明，亮丽的美好时光。","xiangjie":"功名：勿气勿馁、他日最美。升迁：耐心筹谋、必好采头。事业：安守营生、万里鹏程。失物：找寻耐心、或有佳音。财利：时机未佳、求财尚差。疾病：病况仍暗、不宜乐观。婚姻：多面交投、再定去留。行人：愿望未酬、会面延后。田宅：仍需观望、小心为上。出行：时间不对、出行有悔。店面：破除假象、勿太仓惶。六甲：细细盘算、得男且缓。官讼：勿喜勿欢、多方查探。六畜：再缓几天、眉开欢颜。家运：多看多察、谨慎兴家。求谋：认真去做、后喜必多。移居：时候未到、此去尚早。祖茔：龙气未到、他年福报。"},{"n":35,"text":"烦心烦心、直到如今、蛇猴相会合、正好改前吟。","jie":"实在是令人感到无比的烦闷，实在是令人感到无比的烦闷。那是因为长期以来，一直到今日，总有过不完的困顿、横逆、忧患、阻隔的日子。这种驳杂、颠沛的际遇必须耐心地等到蛇（巳）猴（申）相会合的日子以后，才能完全摆脱这些低迷的情况，再由谷底翻升，逐渐改变以前痛苦呻吟的声音，而进行顺境、如意、笑逐颜开的欢乐歌唱。","xiangjie":"功名：苦中吃苦、名扬千古。升迁：非其时也、勿怠勿懈。事业：扭转颓势、尚待他时。失物：勿忧勿悔、莫再苦追。财利：切勿心急、日后再议。疾病：宽心畅怀、痊愈早来。婚姻：此时勿决、他日愉悦。行人：徘徊谷底、会面无期。田宅：保守谨慎、多看多审。出行：改期方好、此时太早。店面：老店多忍、新店难存。六甲：生男有望、现今不忙。官讼：黑暗在前、光明不远。六畜：欲求兴旺、三个月光。家运：宽心安守、福禄重酬。求谋：此时不吉、百日再提。移居：此时莫移、安守家计。祖茔：待时得气、必有恩庇。"},{"n":36,"text":"残日西山落、绕天日又昏、屈指伤心处、一日一消魂。","jie":"将到尽处的太阳从西边的山头缓缓沉落下去，绕着天空旋转一整天，现在又到了黄昏的时候。我回顾过去，细数着这一路走来所遭遇到种种不如意及忧愁伤心的事情，每一天至少都会有一次令我失魂落魄的境况。","xiangjie":"功名：功名无望、改弦更张。升迁：不求不想、安份守祥。事业：创业错误、另谋出路。失物：此物不祥、去之何伤。财利：命中无富、安乐知足。疾病：坚心勿懈、求神禳解。婚姻：打消念头、此婚难求。行人：流落失意、忘记归期。田宅：勿买勿卖、勿种勿栽。出行：此行有灾、改期安排。店面：足迹稀少、自寻烦恼。六甲：要求男孩、敬神持斋。官讼：还有得磨、讼海生波。六畜：白费工夫、莫养禽畜。家运：家运有阻、求神作主。求谋：大小不拘、自讨没趣。移居：不清不净、饱受虚惊。祖茔：砂水散漫、不须多看。"},{"n":37,"text":"未足未足、未能未能、残灯对斜月、何处是涂埕。","jie":"直到现在，我吃的苦头还不够，直到现在，我吃的苦头还不够。到了这种地步，还不能摆脱困顿的纠缠，到了这种地步，还不能摆脱困顿的纠缠。面对即将燃尽的油灯，与向西斜下快要下沉的月亮互相对应着，这种枯寂、凄凉的景象，好像一切都几乎要结束。如此情况，什么地方是我的康庄大道呢？什么地方又是我安身立命的所在呢？","xiangjie":"功名：柳暗花明、另辟前程。升迁：耕耘自勤、升迁由神。事业：另谋他就、再缔新猷。失物：一次不够、检点力守。财利：蚀本再借、水中捉月。疾病：若要脱险、另找医院。婚姻：此婚难结、莫再咨嗟。行人：他乡未显、归路多艰。田宅：悠闲自持、莫讨苦吃。出行：行程多阻、切莫自误。店面：另谋他途、不论买租。六甲：香烟难继、诚敬神祗。官讼：遥遥无期、止息无底。六畜：多灾多累、血财无归。家运：神佛法幡、丁口欠安。求谋：难有结果、守份无过。移居：南北东西、劝君莫移。祖茔：囚困阴居、何来堂局"},{"n":38,"text":"渐渐浓云散、看看明日圆、春来逢景秀、雨过得长青。","jie":"遮蔽月亮光华的那一片浓厚的乌云渐渐散开了，可以再一次好好欣赏着清澈、光明、圆圆的满月。这就好像春天来了，大地充满秀丽迷人的景色，也像是大雨过后，到处花草树木被雨水刷洗得洁净光亮，呈现一片绿意盎然、生机逢勃的景象。","xiangjie":"功名：快乐赏樱、金榜题名。升迁：静待发榜、题名勿慌。事业：否极而泰、营收满怀。失物：物失不远、或在眼前。财利：会有斩获、多方斟酌。疾病：病将好转、宽心莫烦。婚姻：雨过天晴、琴瑟和鸣。行人：鱼雁相随、梢信回归。田宅：现买现赚、莫再拖延。出行：此番可行、前途怡情。店面：时机已到、营生安好。六甲：生男菁英、拜神虔诚。官讼：止息无灾、好不快哉。六畜：牲畜禽迎、大好前程。家运：浑沌出开、细心福来。求谋：见散阴霾、求谋得彩。移居：初沾福禄、畅行无阻。祖茔：龙运得气、阴灵有依。"},{"n":39,"text":"一只仙家鹤、笼中养数年、今朝终放出、直去上青天。","jie":"在山上修真练道的仙人，家里有一只白鹤，关在笼中饲养了很多年，今天早上终于把它放出去，这一只白鹤就展翅高飞，飞上浩瀚无边的天际去。","xiangjie":"功名：海阔天空、功高名隆。升迁：希望多年、如愿冲天。事业：技术高超、利广名高。失物：远去幽幽、难再回头。财利：生涯无限、财利倍前。疾病：恐不保命、速求神明。婚姻：半途分道、难以偕老。行人：去之已远、讯息难牵。田宅：禾黍超收、买卖多谋。出行：通畅无阻、笑颜于途。店面：客如长龙、久久争锋。六甲：产检安胎、男儿多才。官讼：恢复自由、远离烦忧。六畜：六畜虽优、要防失脱。家运：扬眉吐气、天天欢喜。求谋：难以如愿、鸟飞在天。移居：振翅高飞、利乐展眉。祖茔：龙真穴正、儿孙长亨。"},{"n":40,"text":"本道复无双、神光庇福厚、只害不相干、身在长生路。","jie":"再也找不到第二座庙宇和广应庙一样，如此悉心详细的为天下黎民百姓解忧除惑，广应庙里的神明法力无边，神威显赫，光芒泽被庇荫苍生得到高厚的福禄。只是最担忧有些人民认为广应庙也好、神明也罢，都和他(她)们毫不相干，因为他(她)们正处在兴旺、得意、昌盛、上升的路途中。","xiangjie":"功名：虔诚供奉、扬名成功。升迁：神光不缺、加官晋爵。事业：神通广大、四通八达。失物：乞求神威、勿失复归。财利：无限生涯、神助有加。疾病：神威显赫、驱病可贺。婚姻：求神指引、相爱相亲。行人：留连在途、速求神助。田宅：敬拜神祗、田宅富丽。出行：或乞香火、此行无祸。店面：若不信神、开店多嗔。六甲：求神恩赐、六甲男嗣。官讼：谁能止讼、谢府王公。六畜：乞求王公、六畜亨通。家运：欲兴欲昌、广应庙堂。求谋：畏神敬神、自有贵人。移居：神庇福厚、敬谢再求。祖茔：起伏顿跌、神助妥贴。"},{"n":41,"text":"休说休说、无分无别、挨事来年、水中捉月。","jie":"做什么事情都要先拟定计划，订定时间表，然后再依表定时间按步就班、循序渐进，不要一想到要做什么事情就四处宜说个没完没了。不论大小事都完全一样，没有丝毫分别，否则，“光说不练”的一直拖，拖到明年，明年又有无数个明年，那么，成功就有如水中捉月般的虚幻而毫无实际意义了。","xiangjie":"功名：剑及履及、功名可期。升迁：行动就得、拖则分隔。事业：莫再蹉跎、奋力可搏。失物：时间已过、寻也难获。财利：多方筹备、利通南北。疾病：珍惜性命、速求神明。婚姻：少说多为、中意可追。行人：无音无信、流落至今。田宅：多看多听、财利盈盈。出行：今年平静、来年难行。店面：见好就做、获利必多。六甲：今年生男、再拖困难。官讼：能和就和、拖则干戈。六畜：马上进行、明年疫情。家运：振衰起蔽、再造亮丽。求谋：立刻张罗、再等差错。移居：美景当前、迟滞难圆。祖茔：毫无剥换、更无弯环。"},{"n":42,"text":"愁心愁心、直到如今、若逢龙虎会、方好改前吟。","jie":"我实在感到非常的忧郁沉闷，我实在感到非常的忧郁沉闷。长期以来，一直到现在，运势完全处于下滑的轨道中，做任何事情都不能得心应手，甚至阻碍重重。假如能够等到龙虎相会的日子来临，才能改善这种情况，反向回复在上升趋势中，而吟唱出如意、顺利、欢乐的声音。","xiangjie":"功名：加足马力、登科可期。升迁：默默付出、明年神助。事业：旧业将兴、新创不行。失物：物已远逃、亡羊补牢。财利：安守本分、额外莫问。疾病：笑脸常现、春来体健。婚姻：久婚将合、新婚不可。行人：随波逐流、壮志未酬。田宅：再看再等、成本可省。出行：行程愁闷、安抵家门。店面：老店将发、新店不达。六甲：愁心将平、明春男婴。官讼：久讼无祸、新讼多磨。六畜：暂且偷闲、莫冒风险。家运：再忍一下、前景转佳。求谋：久未如愿、明春可圆。移居：有志难伸、尚待来春。祖茔：砂水有破、气运未过。"},{"n":43,"text":"好笑好笑、作事颠倒、临危不危、反成吉兆。","jie":"实在觉得很好笑，实在觉得很好笑，做起事来怎么都不按部就班，照着事情的既定常态，次第循序而进，却反其道而行，颠倒地由反方向逆势而为。眼看着将要面临阻碍的困境时，即能巧妙的避开而没有发生任何危难。这种操作方式有时反而是一种化凶为吉、转危为安、解厄呈祥的征兆。","xiangjie":"功名：冷门科系、成功之基。升迁：不争不吵、自然叫好。事业：知所变更、奇兵制胜。失物：不可能处、找寻可出。财利：众人追利、我要公益。疾病：久病换医、新病调理。婚姻：小吵小闹、白首到老。行人：他乡优游、近况全周。田宅：低迷买进、利润可亲。出行：快乐出航、喜乐多添。店面：冬天卖扇、夏天裘毡。六甲：香火嗣续、男儿可取。官讼：不按牌理、反而可喜。六畜：众人皆怕、我独多加。家运：谦冲为怀、好运就来。求谋：逆势而为、吉祥不退。移居：人言不可、移之登科。祖茔：逆水一滴、胜龙千里。"},{"n":44,"text":"玉石未分时、忧心转更速、前途通大道、花开发前枝。","jie":"美玉和顽石还不能清晰分辨明白的时刻，忧心烦闷交织着急躁的心情，快速涌上脑海而蒙蔽心智，以致迷失了认辩“升、降”的方向与法则。其实，凡事皆有其一贯的脉络可循，只要依据常态运行轨迹按图索骥，仔细观察详审，便可轻易的判定接下来应该要进行的途径。如此，前方就是通往畅行无阻的康庄大道，就好像美丽的花朵，总是从伸展到外围前头的枝叶优先绽放出芳香的蓓蕾。","xiangjie":"功名：重新审度、必有神助。升迁：依循脉络、宽心快活。事业：冷静冷静、福至心灵。失物：再思再想、物不离箱。财利：好坏未明、暂勿作声。疾病：再审病势、严防闪失。婚姻：暂且搁下、他日再洽。行人：萍梗无踪、何日可逢。田宅：度势审情、大力经营。出行：多方打听、方可免惊。店面：市场需要、获利必高。六甲：得失太重、不可盲从。官讼：审势攻防、胜算可彰。六畜：价格好坏、趋势安排。家运：升降分别、掌握前程。求谋：事若要成、找其特征。移居：烦忧勿迁、喜移得钱。祖茔：四兽无缺、便是好穴。"},{"n":45,"text":"玉仙一春梅、独占百花魁、清香犹未喷、仙子作归回。","jie":"玉仙种植了一珠春梅，这一珠春梅是百花中最特殊最与众不同的春梅。可是，玉仙还没有能够来得及等到这一珠春梅开放出美丽的花朵，品闻享受它芬芳的清香佳味，玉仙已准备好要回到深山，祂修道的洞府中去。","xiangjie":"功名：功名难着、作书立说。升迁：辛苦有份、升迁无门。事业：苦心孤诣、终无大利。失物：白费心机、回归无期。财利：时机未助、难得好处。疾病：百般慰藉、祇神禳解。婚姻：难结连理、途中分歧。行人：他乡苦劳、会期将到。田宅：辛苦田禾、他人收割。出行：行程无味、安抵家内。店面：虚渡光阴、转换从新。六甲：有时自有、莫要强求。官讼：缠讼经年、有苦无甜。六畜：能闲就闲、忧烦无钱。家运：辛苦付出、莫问前途。求谋：顺其自然、守分心安。移居：慎重考虑、何须迁居。祖茔：明堂周密、扦作假地。"},{"n":46,"text":"卦中遇贵人、求谋渐已成、更变文书吉、百福自来迎。","jie":"你到广应庙来求取一支灵签，签文中明白指示必有贵人扶持，因此你就放胆努力去做。现在，你的愿望和筹划的事情都逐渐濒临验收美好结果的阶段。但是，你不可因而疏于防范、失掉戒心，应该更加缜密的审视企划书上是否仍有瑕疵需要更改？或者是否有修改得更加完美的空间？能如此的管控每一部份的细节，最后必然就能收成甜美的果实，众多的福禄吉祥自然而然的来迎接你。","xiangjie":"功名：再三验证、功名荣登。升迁：宽心勿猜、文到喜哉。事业：时时警觉、亨通不绝。失物：再次思索、或有结果。财利：小心为上、益利得偿。疾病：贵人帮扶、灾病尽除。婚姻：相敬如宾、百年相亲。行人：得意将回、多财来归。田宅：琢磨越深、获利越真。出行：无虑无忧、快乐优游。店面：大胆去做、细心利多。六甲：贵人送子、敬神孜孜。官讼：防范文书、终必胜出。六畜：细加检点、兴旺年年。家运：改善缺点、福禄年年。求谋：贵人得力、事事如意。移居：最后再变、贺喜此签。祖茔：鹤膝蜂腰、贵人远朝。"},{"n":47,"text":"改变出尘埃、登江绿水清、诗书从速降、终得贵人扶。","jie":"我打算改变以前积极参与人世间种种公共事务的态度，远离江湖中烦嚣的风风雨雨，抖落身上忒多的红尘埃垢。于是，我登上了江岸，望着绿色的滔滔江水悠悠缓缓而下，是那样的沉静，那样的清澈透底。一时之间，我便把所研读过的诗书，探究过的技术、艺文等等脑海中的东西全部放下，让它一一沉淀，暂且放空自己。蓦地，眼前灵光一现，心中豁然开朗，好像突然间获得贵人帮助似的，我完全看清了一切，了解所有事情的真相。","xiangjie":"功名：勤拭心镜、功名必成。升迁：得失太深、反难称心。事业：适度放空、利乐无穷。失物：万般虚幻、去留何欢。财利：沉静心灵、获利丰盈。疾病：空无一念、日久病痊。婚姻：怨恋沉淀、自有家眷。行人：若能看开、伊人自来。田宅：抛开贪痴、获利不迟。出行：莫杂他念、尽情无险。店面：莫惹尘埃、八方来财。六甲：打破痴迷、生男神庇。官讼：重整头绪、胜出定局。六畜：若要兴旺、切莫慌张。家运：勤修心肠、家运德昌。求谋：托人无用、沉静有功。移居：远离烦嚣、昌盛逍遥。祖茔：水清砂秀、富贵悠久。"},{"n":48,"text":"远行有所造、往可百安宁、平生待敬奉、改得亦将成。","jie":"你为了出远门的事寝食难安，所以才造访广应庙祈求众神庇护你此去平安。现在你可以放心的去，不但一路顺风，而且到达彼方地头之后，也会诸事顺利、吉祥如祥。平常，你对供奉神明的事莫不关心，甚至自己都要受人服侍恭奉。如今，你渐渐的在省悟、学习，快要将以前那些不良的态度完全改变过来。","xiangjie":"功名：扬名四海、乐心开怀。升迁：实至名归、财官相随。事业：海外亨通、利益长红。失物：物去人安、运吉心宽。财利：多多益善、财利如山。疾病：寂瘳远遁、气血通顺。婚姻：佳偶难得、百年好合。行人：得意谦冲、不久相逢。田宅：田禾宅厝、价得佳作。出行：柳绿花红、沿途轻松。店面：生意兴隆、车水马龙。六甲：六甲得男、世代承欢。官讼：两造无猜、笑逐颜开。六畜：六畜兴旺、光辉厅堂。家运：吉利安祥、丁口健康。求谋：事无大小、吉利消遥。移居：此去荣昌、诸事呈祥。祖茔：千里来龙、到头现踪。"},{"n":49,"text":"莫用四十九、变化亦难求、鸾凤相交战、独占六鳌头。","jie":"第四十九首的灵签不可以使用，求得此灵签而使用的人将会诸事坎坷，无法顺畅如意。即使运用变化的手段来规避凶祸，或在使用过程中，以其他方法寻求补助、救济，都无法达到目的。此如同夫妻之间，自结缡起一直吵吵闹闹、争执不休，其严重的情况是六甲生命人之中独一无二居于首位，没有一对夫妻能出其右者，这种境遇就是使用此签的后果。","xiangjie":"功名：速改科系、否则落第。升迁：勿气勿悔、管他升谁。事业：改行转图、另谋生路。失物：去之杳杳、万人难找。财利：安贫得助、要吃头路。疾病：安心烧香、请神解禳。婚姻：此婚暗淡、不如不谈。行人：流落沉沦、敬佛求神。田宅：何利之有、买卖添愁。出行：安守家中、莫找伤痛。店面：开店几天、忧愁频添。六甲：何用执着、男女皆妥。官讼：莫问官讼、新旧难终。六畜：瘟疫多灾、可叹血财。家运：鸡犬不宁、速请神令。求谋：此签真灵、求谋不行。移居：万万不可、原居勿革。祖茔：误用此地、阴灵悲泣。"},{"n":50,"text":"将相本无种、帝王自有真、来意若不诚、添油重三斤。","jie":"武将文相从来都没有父传子的世袭制度，皇帝、王爷就真正会“万世一系”的传承下去。但不论是何等身份的人，一旦踏进广应庙来求取灵签，若是没有怀着诚心诚意的“至诚”态度，就要处罚添加三斤重量的灯油钱。","xiangjie":"功名：眉飞色舞、功名利禄。升迁：平时勤勉、今日高迁。事业：广开通路、畅行无阻。失物：多想多找、必有好兆。财利：求财利多、开源节流。疾病：意志坚定、祸散福生。婚姻：此婚兴家、长亨不假。行人：行人安好、归程未到。田宅：置产栽种、利基长红。出行：欢乐连连、抵家甜甜。店面：虔心供奉、财亨利通。六甲：供神多般、必招儿男。官讼：无忧无惧、自有乐趣。六畜：瘟遁疫消、六畜逍遥。家运：吉祥康泰、诸事无碍。求谋：加重酬劳、万般周到。移居：无灾无祸、早结善果。祖茔：藏风聚气、亨通益利。"}]

  qian:[{"n":1,"no":"第 1 号签","text":"蓬莱东阁玉桃香，顺水行舟仙赐方。宜男正好图全计，不必他方卜地长。","jieyue":"在运势尚未通达的时候，当然是有志难伸，一旦鳌头独佔。跟红顶白、锦上添花的人会接踵而来，如果一下子利欲薰心，很容易把大好前程新自断送。这段时候最 好是自我签讨，保持稳健踏实的态度，才能够使到福禄绵绵不绝"},{"n":2,"no":"第 2 号签","text":"潜藏自有光明日，守耐无如待丙丁。龙虎相争生定数，春风一转渐飞惊。","jieyue":"人有三衰六旺，衰的时间短，旺的时间长；旺的时间有贵人相逢，有所扶助，连门庭枯木都有凤凰来朝。要保持有这种吉祥之运，最重要的是要本着忠信孝悌，尤其是不要胡乱听从旁人的口舌是非，打乱自己一往秉持的信念。"},{"n":3,"no":"第 3 号签","text":"明月当三五，天地自无私。一阳来已複，得意在秋时。","jieyue":"牡丹花被喻为富贵之花，是衆花之魁首。在其极盛之时，时间很短促。但只要在做任何事情之时，留着后步（不要去得太尽），这些就不会有什么凶险了。占者防小人得志而对己不利。"},{"n":4,"no":"第 4 号签","text":"正大有鬼神之助，吉祥成忠厚之报。不怕邪魔小崇，只看秋收冬藏。","jieyue":"人世间最难忖测的是人心，所谓「心猿意马」，一刹那间人的思维可以有很大的变化和波动，因此为善为恶也在一念之间。若能使自己时刻秉持忠厚、正大之心，则一生不会经历大凶险，亦不会有太大的蹇滞出现。"},{"n":5,"no":"第 5 号签","text":"柔顺而静，坤之六爻皆吉。阴盛于阳，不怕亢龙之悔。若此消息，只待羊兔相宜。","jieyue":"田园作业，四时有序。播种、插秧、收割、打禾都有一定时节。农人只要按时勤耕当然有收穫，若贪图逸乐或一暴十寒，当然没有收成，到时悔恨亦已迟了。占者宜勤不宜惰，凡事小心则吉。"},{"n":6,"no":"第 6 号签","text":"如争如战，长子克家，从吉而贞。当知天从人愿，不必二二三三。","jieyue":"祖宗积德行善，福泽被及子孙，如果子孙又能恪守祖训，以仁德行事，其人将不虞受凶险所侵。更进一步来说，如果能遇到适当时机，则名声可直上九重天，为人所仰望，这些天从人愿的事，就是从积福德所致。"},{"n":7,"no":"第 7 号签","text":"临物易与，天地人合。一到春风，百祥骈集。","jieyue":"「善有善报，恶有恶报」是人人都认识的语名，但如何能真正地体会到呢？就未必人人知道。简单来说，善就是心中常存有仁恕、行为有德行，恶就是贪婪、嗔怒所引发。因此要有善的报应，就必须要种善的因，这种的话，即使遇上任何凶险都可以化解。"},{"n":8,"no":"第 8 号签","text":"喜喜喜，春凤桃李。鹊噪簷前，锦衣归里。酉戍相看，天祐好子。","jieyue":"名与利，原来本是一体，故此有名则有利，相对来说，有利必有名。运势未到之前，一切的运作是不必强求，亦是强求不到的。但运气一到，就不需好劳心劳力，自然会安安稳稳地不劳而获，而且可以为时甚久。"},{"n":9,"no":"第 9 号签","text":"鲲化为鹏一任飞，长安路上好光辉。阴谋阴卜皆如许，顺水行舟定好归。","jieyue":"东奔西走所求的是甚么？积聚多多，很多时亦只不过是为儿孙作马牛而已！儿孙自然有其福份，只要自己及教导他们积善贻谋便可以，不必有实质的金钱及物业留下来以遗害他们。占者已由当年的忧虑而进展至开始有成就，成功的目标已很接近了。"},{"n":10,"no":"第 10 号签","text":"问仙须要酬天地，百事如心定有利。果能春秋两处好，龙虎呈祥，风云际会。","jieyue":"一个人不如意时，如月亮被云遮挡着而不能得见，一旦云散月落，皎皎的月色当然光照大地，令人感到开怀。对于很多繁琐的事情，会更付出心为去处理，若一旦取得重点，而放手一搏，问题就会迎刃而解了。名利之收穫当在丑年月前，午年月后。"},{"n":11,"no":"第 11 号签","text":"一个兔儿一个鸡，等全无不合人思。有朝遇着东风力，且看天公造化机。","jieyue":"凡是与人合伙营谋，最重要坦诚相对，然后才能取长补短，发挥出最强的力量。若果双方各怀异心，必定会有欺诈的事情发生，那时不独不能有增加自己力量的情况出现，还会互相猜测排斥。占此卦者做事可得成功，其最能获吉的月份是在秋季之后。"},{"n":12,"no":"第 12 号签","text":"十日坐，一日行。矶头有水，不碍利前程。问到如何境，刘阮天台不误人。","jieyue":"有远大的前程，本却离乡别井，独自前往，然后奋斗一番事业。可幸在途中遇到朋友，大家志同道合，一路上同心共济，由于双方的互相激励，终于各自创出大的事业。故占者若能放弃目前名利，远赴外地图谋，则大吉大利，事事皆顺，可扬名于异域。"},{"n":13,"no":"第 13 号签","text":"有剑开神路，何妖敢犯神。君子道长，小人道消。月明终有望，河上任逍遥。","jieyue":"凡是有用的东西，包括人，潜藏着是没有用处的，因为人们跟本就不知道其优点，要表现出其威力或才能才，可以让世人看出及加以利用，当时势可以造就及发挥出物品或人物的实际功能时，就如鲤跃龙门后一样，身价当然上升百倍。"},{"n":14,"no":"第 14 号签","text":"一虎出山，一龙飞天。天缘人缘，上国收贤。生育之美，造化两全。","jieyue":"鹏鸟与鄂鸟都是一飞万里的神鸟，当其展翅腾飞之时，虽然远到月宫都是可以的。最重要的问题是能够乘时而时，这样就会很容易和很迅速了。这是「时势造就出的英雄」，所以在碰到这种时机时，他日的成就，亦是无可限量的。"},{"n":15,"no":"第 15 号签","text":"月到天心人有望，牛郎巧合属天成。不须辗转求良偶，天喜从人命自荣。","jieyue":"寒来暑往，冬收冬藏，一到了秋季时，就是农民准备收割农作物的时间，由于黄梅时节雨水充足，所以田间的农作物今岁不必担心，必定是会得到丰收的。只要在时机成熟的时间进行便可以了，占者运势中上。"},{"n":16,"no":"第 16 号签","text":"时来风送滕王阁，运至何忧跨仙鹤。甲乙两运天云梯，也知桂香味早卓。","jieyue":"人情间的冷暖，锦上添花的很多，而雪中送炭的很少，为什么呢？跟红顶白是人之常情，而打落水狗也是人的劣根性，是根本上很难杜绝的。而以此签来说，事情得到如此的得意，因此不必再担心，如果能耐心一点守候的话，收益便必会更多。"},{"n":17,"no":"第 17 号签","text":"一旦雷声震，四方皆有庆。转吉又增祥，壬癸子午定。","jieyue":"有很多人常常用欺诈手段来取得人的信任或利益，以满足一已之欲。事实上，他所施展的手段，以为很高明，其实往往弄巧反拙，欺人反自欺。只要能够在初期时有正确的宗旨来干，则往后就不会偏歪。"},{"n":18,"no":"第 18 号签","text":"十日滩头生，一日过九滩。东风须着力，人事自完全。","jieyue":"人在营谋时，当然是要全力以赴，但所持的心态是谋事在人，成事在天，因为付出的努力很多时候并非与收穫成正比的。所以开始谋为时不必为成功或失败而忧心忡忡，这样的话，做起事来就可以更为戳力，反而成功的机会更大。"},{"n":19,"no":"第 19 号签","text":"喜得秋风万事足，一举成中天下福。风凰五彩利飞行，只看子午时日卜。","jieyue":"月老即冰人，职司撮合人姻缘的仙人。只要他将红丝繫上，男女虽为仇敌，或远在天涯，也会得到结合，完全不需要自己劳心劳神。在那段时间，只要能够坚守自己的岗位，则在农曆秋季时节，名利会有成就，兼且喜气盈门。"},{"n":20,"no":"第 20 号签","text":"人转丹成白日升，神仙有数利人营。 一朝走马龙行会，此是荣华一美因。","jieyue":"炼丹犹如做事，在基础上已经努力了八九分，只要再加一把劲，不使其有所脱节的话，很容易便会得到一个重大的突破，使自己所坚持、所进行的事情得到圆满的解决。若问荣华何时可以享得，则会在丙丁年月取获。"},{"n":21,"no":"第 21 号签","text":"吉人天相，子丑相当。西北有荣，风行水上。","jieyue":"本来对着一隻老虎，是非常凶险的事，但如果你只是从其虎尾处经过而不惊动它，也是可以顺利而无甚危险的。很多时要想事情得到成功，如果不深入而踏实地去干，一定不会有成的。因此，只要小心一点，即使是进入虎穴，也会无事，而且更能取得成果。"},{"n":22,"no":"第 22 号签","text":"上上等，利有攸往。一日遇合，鼠牛相放。好好机会，名登天榜。","jieyue":"豹变即是由贫贱而富贵，乘龙即指人女婿。如果是栽培得当，一切的风雨的侵害都不会成功，一旦得遇时机便能成就一番事业，振兴名声。只要时刻努力进修，行仁德之事，不生妒忌之心，则福德自然随之而至。"},{"n":23,"no":"第 23 号签","text":"海上一龙飞，春风得意回。从此欣荣遇，只待一壬来。","jieyue":"吃得苦中苦方为人上人，因十年寒窗苦读仍未折桂，始终都不能说是有所成就。犹如人努力在发展自己的事业，但未有寸进，仍然是云遮月头，但如果能得到突破，则一雷天下响，吐气扬眉了，必然惹来豔羡目光。占此卦得运之时应在夏末初秋。"},{"n":24,"no":"第 24 号签","text":"说到龙蛇马又来，看看无不遂心怀。前生俱是有缘份，及到今时运已该。","jieyue":"古人常说：「富易交，贵易妻」。当人取得富贵之后，很多人都会抛弃贫贱时的朋友与妻子。能够象张节一样，「贫贱之交不可忘，糟糠之妻不下堂」又有几人？所以在得意时，能够不动摇自己的心志，才是顶天立地的人，运气才能保持。"},{"n":25,"no":"第 25 号签","text":"猪鼠相合，卯酉相同。一船满载，载载不空，得心应手。只在三四五成功。","jieyue":"寅午戌合成火局，因此在属火之年会很多阻滞，亥子丑合成水局，因此在属水之月会渐渐享通。故占得此签的人，在火年遇木（卯、玉兔）月，如果有金（酉、金鸡）来克制木的话，则可以使不成火局。故此卦是喜水而忌火。"},{"n":26,"no":"第 26 号签","text":"一天喜气一门吉，一人有庆皆受益。一箭中红心，功名成遂转，祥风生四壁，门庭光奕奕。","jieyue":"天数的吉凶，如何地影响人们的命运，未到时节实在是很难预测得到，但当其一到来的时候，也不是人所能抵挡或回避得到的。但占此签者，在三个月之内应该会得出好的结果，万事如意，喜气盈门矣！"},{"n":27,"no":"第 27 号签","text":"凤翥丹山报晓时，人生得意是奇奇。看来自有探龙宝，日月光辉申与鸡。","jieyue":"荆棘满布，虽然是凶险，但若为凤凰栖身之处，则终必落于其中，目前形势既然是未能有这种条件，何妨再耐心地等待时机，现在已经是杞人忧天的话，实在是未有这种必要，占得此签者，凡事要耐心等待，是先凶后吉之象。"},{"n":28,"no":"第 28 号签","text":"前生原是此家人，今世相逢定有因。龙虎呈祥遂天子，五三六二是奇期。","jieyue":"人生的造化（即运气、福份）原有天定，但以自然平常之心来对待的话，自然会感到事事都顺遂，而享得的福泽也会绵绵不绝。功名（官职）的成就也可以得到神明的帮助而取得。应验变迁的时间会在卯巳年月日。"},{"n":29,"no":"第 29 号签","text":"猴儿来，兔儿去，龙呤虎啸。乃是收成佳遇，不须求际。","jieyue":"水与火原本相克，但在某种状况下，水火亦能相济相生，这就是阴阳相契之意。天地原先无极，动则生出阴阳，阴阳相合，则生四衆，而天地间之育物新民，皆由阴阳互相合化而成。故此引伸出得失荣辱，人的际遇而由此而定。"},{"n":30,"no":"第 30 号签","text":"乾三爻，渐三爻。一时遇合，鹤鸣九皋。","jieyue":"人生追求不外乎名利，有些人名利双收，有些人名利俱无，有此人有名无利，有此人是有利无名。无论是属于那一种，只要知足便能生活无忧。「知足者，贫亦乐；不足知者，富亦忧。」此喻示家境富足无名禄，劝人不必因此而羡慕名位的人。"},{"n":31,"no":"第 31 号签","text":"水上顺风吹，高才得意挥。学成文武艺，自有好栽培。","jieyue":"聪明的人考虑事情，有时候也会有失误的，而愚笨的人在考虑事情时，有时候也会福至心灵，偶有佳作，这可说是上天的公平安排。但这些仍未算是最佳处理事情方法，最好是小心谨慎，在遇到障碍时任你有多大计谋，莫要强为，以防有祸。"},{"n":32,"no":"第 32 号签","text":"荣华贵，富贵来。天地生成，多吉少悔。三九遂心怀，虔许善功福自来。","jieyue":"夷吾与子贡均为春秋时人，以擅长于经商闻名。其中子贡的名声更为响亮，因他是孔子的学生，善于辞令，经商曹、鲁国之间，富至千金，并常参与政治活动，并受官职于鲁、卫国家。占得此卦，如欲觅取蝇头小利，到冬天时节应可称心如意。"},{"n":33,"no":"第 33 号签","text":"梅占花魁及第巍，天生福禄禄同辉。问到终身何所就，三七之内是荣华。","jieyue":"相传世上有月下老人，每个人的姻缘都掌握在他手上，只要他在男女双方的脚上系上一条红绳，则这对男女虽远隔千里，到头来也会结合在一起。因此，有很多事情虽然是无可奈何，但亦只能说是命运弄人。只要事事看得开，灾祸是非口舌等等麻烦都不会惹上的。"},{"n":34,"no":"第 34 号签","text":"自从河洛周天数，演到出门交有功。一生际遇须龙马，不用踌躇自合行。","jieyue":"一二三四五为生数，六七八九十为成数。生数不可移，成数可以移，两者之间有着相生相成的关係。一奇、一偶两组数的配搭，表示世间万物皆由阴阳化合而生成。乾为老阳，老阳未变则不能乾坤生合，占之者遇此，万事宜静不宜动，静则吉。"},{"n":35,"no":"第 35 号签","text":"阴德不是非凡事，积善之家度有馀。厄去福来天凑巧，龙飞虎跃一鸡啼。","jieyue":"同室操戈，兄弟不和，是很多家庭中常有发生的事，究其原因，当然是当父母的处事不公平，日积月累而引起的。因此家不齐，身不修就不能当上大事，得到高职。要厄去福来，必须是积善之家，同时要时常行阴德之事才可以，这也是人情练达的一种表现，只要事事小心，遇厄也可无碍。"},{"n":36,"no":"第 36 号签","text":"芹香鹿鸣，不远不近，二五之内，自然有幸，天喜文昌照命。","jieyue":"古老相传，喜鹊鸣噪是为报佳间，必有喜事到来。而古时用灯芯浸油燃点用来明亮，果见到灯芯明亮，也喻示吉兆。既然有种种的佳音佳兆到来，忧愁当然会渐渐消退，代之而起的是好运开始来了。"},{"n":37,"no":"第 37 号签","text":"黄金自重，人天雨映。春花秋果，何悔何吝。","jieyue":"逆水行舟，是吃力不讨好的，因此人生一直在逆水的环境中的话，是相当辛苦的，这就是人处于逆运的时节了，反过来，如果是顺水的随波逐流，可以在瞬息之间，得走千里，即轻鬆又写意，要达到这个地步，日常积德向善，可减少人生的阻碍。"},{"n":38,"no":"第 38 号签","text":"时行运遂不须愁，一到桃花皆自由。果然渊内龙飞跃，脱俗超化始出头。","jieyue":"上天对人都是颇为公平的，每个人一生中都总会有机会给自己发挥的。故俗语说：人有三衰六旺，旺是比衰多的。但究竟如何掌握这个时机？这个时机究竟有多长久呢？就非人所知了。所以有些人在少年时发迹，甘罗在十二岁拜相，亦有人在晚年发迹，如姜太公八十遇文王。但常心存行善之心，则贵不可言。"},{"n":39,"no":"第 39 号签","text":"鞭策长安路，天仙第一班。已及时，春风桃李姓名奇。一枝独佔梅花上，次第春风到草芦。三十六宫春，上国定观光。","jieyue":"人未得时，如龙潜于深渊，蛰伏不动，得时则跃出于渊，大展所长。而其德才华，将会遍泽大千世界，万物受其覆育而欣欣向荣。故凡事要坚忍耐劳，以待时机。"},{"n":40,"no":"第 40 号签","text":"富贵功名各有期，龙虎相逢鸡犬宜。果煞采获仙人手，自是金麟上玉时。","jieyue":"古人说：二人同心，其利断金，几个志同道合的人合在一些，其团结出来的力量是相当大的，办起事来特别容易成功，如管仲、鲍叔牙二人为好朋友，同时以共同做事，所以在辅助晋文公时使得晋文公成为霸主，这就是和合见交情的含义。"},{"n":41,"no":"第 41 号签","text":"圆又缺，缺又圆。连又断，断又连。遇渡桥，舟在前。也须慎言，方得周全。","jieyue":"前途有惊险，处境不佳，蹇滞凶阻如布天罗地网般，只要轻举妄动或偶一失足，就陷入万劫不复之地。但只要谨慎，无急躁之心，可以无碍。故处事要如踏上薄冰上行走一样，步步为营便可。"},{"n":42,"no":"第 42 号签","text":"只说有愁烦，事到其中兴不阑。逢午方可良，不必乱张惶。","jieyue":"自己怀有满腹才华，当然希望能一展抱负，让世人知道，但时运未至，一方面未为人所尝识，另方面亦未取得发挥的机会，使得自己的本领毫无着力之处，怎么办？宜守候时机，及再充实自己，必能大器晚成。"},{"n":43,"no":"第 43 号签","text":"天有时，地有时，人尚少期。要得好时，也看三六九期，忧转嘻嘻。","jieyue":"虽然在这处有损失，但在另一处则有收穫，这此叫「失之东隅，收之桑榆；」即然是有得有失，月亮也是有圆有缺的。所以凡事不要太着重于「强求」，只要做到不过不失，当时运一到，自不然会转为喜乐重重了。"},{"n":44,"no":"第 44 号签","text":"莫孤疑，事在可疑。有可疑，不疾不徐，自有出头日子，当看金花一二枝。","jieyue":"在可以攻的时候攻，在应该守的时候守，如果能真正做到这一地步，就是知道进退了。以这一支签意的理解，现阶段绝对是只适宜守的，因为一进就会産生很多是非口舌和争拗。为保持自己目前尚不算差的运气，还是以守为妙！"},{"n":45,"no":"第 45 号签","text":"天时人事，正是好佳期，又恐跷蹊。但看双入卯金宜，只待十八子一提携。","jieyue":"古语说：「生死有命，富贵攸关。」所以富贵虽然是每个人所梦想、所祈求，但又未能一一如人所愿可以垂手而得。如果能够常常秉持着满招损、谦受益的心态，贫富也不忘其本，当有奇逢之喜，终归有益。"},{"n":46,"no":"第 46 号签","text":"桥已断，路不通。若要通时，也候三五之中。许下善功息不穷。","jieyue":"身离渡口即在江中，箭离弦即已发箭，喻示事情已在进行之中，还可以走回头路吗？当然是不可以了，所以只有鼓其馀勇，继续向自己的目标进发。同时千万不要怨歎做事的收成太迟，上天一定会清楚你的行善之心而给你一个满意的答覆。"},{"n":47,"no":"第 47 号签","text":"已成了，又难保，只待舟济顺风行跑。每事多烦恼，虔心神前修省长安保。","jieyue":"出外征战唯凭仗剑而行，可惜有时连很少的敌人都未必能够一下子消灭，到头来虽然是戎马半生，而且功劳不少，但仍未能得到封候拜将，徒然惹得自己伤悲。因此看来，是非閒事莫管，亦切勿妄求，而且一心向善，诸恶勿作，神必保佑吉昌。"},{"n":48,"no":"第 48 号签","text":"一枝已报晓，恐难得，时尚早。有箇成就之时，须向神前恳告。","jieyue":"当运势未到，有困难重重之时，必须要坚苦卓忍，守着自己的本道而行。长嗟短歎或者怨天尤人，只会增加自己的麻烦，不如放开怀抱，以「输」的心理来努力进取。天上的云雾不能遮盖多时，一旦拨开，青天重见，即如枯木逢春一样，一定会发芽生花的。"},{"n":49,"no":"第 49 号签","text":"牆头草，篱下花，山穷水尽，未必繁华。若要繁华，也要归家，方可如心得奢。","jieyue":"世事如棋局局新，在人世间待人处事，无不为蝇头小利而劳碌。只要环境许可，退隐泉林自耕自种亦是一个好办法。但这对大部份人来说是奢望。退而求次，做人处事以退隐的心情，处处以不争，以退让为先，则可减少很多祸缠。"},{"n":50,"no":"第 50 号签","text":"一声莺报上林春，恐是虚声，未必峥嵘。若要争荣，还候丙丁。","jieyue":"人的命运犹如人行在道路上，如是平坦大道，当然是一帆风顺，平步青云。稍为崎岖则是一步高一步低的摸索向前进。但只要坚忍守成，不焦躁，不急进，看清楚才行，仍可在崎岖的路上选择到较平坦的路来行走，完全视乎个人心性而定。"},{"n":51,"no":"第 51 号签","text":"镜破月缺，孙山保得。若要安康，酬神免业。","jieyue":"游子在外时，难免有思乡亲之情，每在夜阑人静，寂寞无聊，尤其遭逢蹇滞困厄之事时，更会惹得愁思串串，令人惆怅。在这种境况下，必须十分忍耐，善于排遣，更要修德行善，自必有神明永保平安。"},{"n":52,"no":"第 52 号签","text":"虎坐中堂，鸡太相闹。天不如人求，反增多少笑。安而不危，菊花天到。","jieyue":"天道即人道，故人凭着自己的良心来做事是有神明鉴听的，这就即是世说的因果，所以天道是无私的。只对人的反应是基于人的所作所为而定，倘然良知完全泯灭，那么往后的结果会是怎样呢？须记着，祸由自招，求天福不如求自己了。"},{"n":53,"no":"第 53 号签","text":"一枝好花，风雨未到。只待清明香可味，顺水过渡。","jieyue":"树上生花，而无风雨吹打，当然是愈发茂盛。即如做事营运，已有基础，如无特殊因素发生，当然容易臻至佳境。如果在中途遇有阻滞，但有贵人扶助，仍然是行走在坦途之中，只待厄消祸去，福泽自然会随之而至。"},{"n":54,"no":"第 54 号签","text":"一半就，一半不就，惹得争斗。取之不合，治之宜早；吉祥方保，也要慢寻讨。","jieyue":"做事皆有动静两方面，静为思考策划，动为执行。在处于目前的境况，静时未能取得法，动时又容易生出错误，人到此时，可谓狼狈至极，因为有所阻碍而不能顺利前进。故宜以忍耐守成为上，待时运一至，然后才顺势推行。"},{"n":55,"no":"第 55 号签","text":"月在天心人在船，名已将得，利已将偿，何不耐烦，不久起床，也要斟详。","jieyue":"富与贵，是每个人都希望得到的，究竟怎样可以取得富贵呢？道理很简单，但要做到则绝不简单。勤力工作能致富，修心修身得贵来。除此以外，始能戒除贪念，待人和气，谨慎行事都可以协助你取得富贵，所以能有恒地坚守上述条目，灾殃必去，福星常来。"},{"n":56,"no":"第 56 号签","text":"皇皇典，喜喜贲，天衢平坦。只待小人得志，休得动风，自然既济。","jieyue":"人一生吃多少、穿多少，都由命运所定。有的不会缺少，没有的不会多出，因此要常存知足的念头，然后才可以尽情地享受自己的人生。而尤其最重要的，是得意之时不要太逾份，要提防失意之时又如何；故能存信义立世，则能逢凶化吉。"},{"n":57,"no":"第 57 号签","text":"乐以忘忧，也要踌躇。事未必月在楼头，那得要休要休，可向金木人儿一搆。","jieyue":"世人劳碌忙乱，求的不外是名和利。亦由于名和利，使人的天真的个性大变，但最终很多说只不过是徒劳而已！如果你是具有这种取得名利的福份，命运终必令你得到，你不须强求的；否则，纵然耗尽千方百计，也是一场春梦。"},{"n":58,"no":"第 58 号签","text":"可罢即罢，不须斩尽杀绝，事到无可奈何。也要守旧安歇，力保无失可得，三七可决。","jieyue":"很多时做事不是一下子就可以成功的，即使在事前你的准备工夫是如何细心及部署如何慎密，也会因特殊的因素而棋差一着。但只要不惧困难，即使是三战皆北（输了），但只要你一旦成功，每一个人都会因此而对你刮目相看。"},{"n":59,"no":"第 59 号签","text":"去的去，来的来，东南一方。自迩遂依，切莫双疑猜。","jieyue":"一个人天生下来即含着金锁匙的话，其际遇当然较诸一般人的生活为佳。尤其是他由直道前时，每一条都是康庄的坦道，这或许是他积了很多福才有这此日子，姑无论如何，如果在事业上能遂意的话，子孙也有利得多。如果能乐喜好施，其福泽也是无量的。"},{"n":60,"no":"第 60 号签","text":"苦而甘，甘而甘，一子一午。送喜不送忧，也要自裁生。","jieyue":"一个人一生之中有多少衣食，已有定数，所以毋须强自求谋，即使是经过一番苦干后得来的，也会无缘无故的失去，因为这并非是你的福禄所能享用至的。因此，对于一切强求的物品都应谢绝，这样才能保持自己既有的运势，也不会到最后劳而无功。"},{"n":61,"no":"第 61 号签","text":"鸿飞天外，舟动无风。人有月明中，自有喜相逢。","jieyue":"前人种树后人凉，前人积福后人收，既然是已收前人的福荫，后人更应扮作前人，积福积善以留后代人享用。代代积福，代代可享，所谓积善之家，必有馀庆就是这个意思。运势亨通的，则不管何地何方，皆为康庄之道，任你驰骋，因此修善积福至为重要。"},{"n":62,"no":"第 62 号签","text":"吉吉吉，益益益，不必多急，自有文章东壁。只在初三十一，方可必，方可必。","jieyue":"修善修身为一个人秉持的信念，能够时刻地做到，就可以修炼成神仙，这是修道人所期望的最高境界。但要做到这一步，一定要有下功夫的态度，不畏难的精神，才能够把好的运气儘量地发挥出来。因此已有种福因的人，今岁可收得善果的条件。"},{"n":63,"no":"第 63 号签","text":"龙已飞，虎已归，笙歌已歇。兴而不久，万事如灰。","jieyue":"当命蹇时迟，一切不如意事都会接踵而来，灾殃病患，也会因以前积下的因而生出今时的果。以前行善积德者当然是遇难有救，但如果从前未种下如此善福的人，就颇为凶了，自今日起修善修德，虽然是「临急抱佛脚」，但亦可获得一定的庇佑。"},{"n":64,"no":"第 64 号签","text":"生之时多乐，半路上下不相逢。只看无妄之卦，方可悔吝分明。","jieyue":"富贵本为镜中月，水中花，往往很多人「三更穷，五更富」，对于很多本来为贫苦的人家，一旦发迹起来，很容易忘记当日自己捱穷的日子，对于贫苦的人其怜悯心也不会很大，所谓为富不仁，因此这些人很多时会为维持自己的财富而做欺心之事，贫富其实只在于知不知足，能不欺心则天必得佑，祸必不侵。"},{"n":65,"no":"第 65 号签","text":"一天星斗灿辉煌，风雨未光。起而不扬，也要两三番。","jieyue":"当人对每一件事都毫不牵挂地放下时，他实际已到了一个返璞归真的地步，一切名利、荣辱都已是身外之物，绝不会打动他们的心。但很多时你愈不追求的，它愈是追着你，又不是人所可控制，取捨如何？要视乎自己的情况。总之，即是事情看起来已经到了尽头，但最后都会有柳暗花明之象出现，一切无妨。"},{"n":66,"no":"第 66 号签","text":"得失皆天定，忧喜总归命。知天知命，守之为幸。","jieyue":"有积蓄是人人所喜爱的，有钱的人积金，有德行的人则积德。积金是有形的、积德是无形的，但古人言，功名利禄皆由积德之士所有，故积德亦可以成为有形的回报，只要能安份纪，处处以守为重，则不会迷失心性。"},{"n":67,"no":"第 67 号签","text":"一跌复一跌，只恐卤莽灭裂。果能惜得寸金，也要调摄。","jieyue":"每个人的祸福都根由于因果，因果有来自先天命运，也有来自后天。以后天而言，和气待人，大家都不生争拗，自然可得祯祥。乖气凌人，大家互出计谋，自然是戾气冲天，所以要令自己得到兴盛的话，必须以和为上上之策。故此忍让谦和，自然可趋吉避凶。"},{"n":68,"no":"第 68 号签","text":"一门天赐平安福，只恐小人不理。防犬防牛，应取不取。只在三旬裡，也有三分喜。","jieyue":"俗语说，莫信直中直，须防人不仁，很多是非小人会联合起来，口密腹剑地向你提出很多建议，游说你干这干那，千万不要随便答应，尤其是属于丑、戍之年、月、日时期。"},{"n":69,"no":"第 69 号签","text":"防口甚于防川，不当顽顽；急水莫开船，也要黄昏，乃命得长。若知消息，方要周旋停当，当在二七三上。","jieyue":"蛟龙受困于浅泽之中，只是一时之际遇未至，又怎能说其能力平平，因而对其白眼相加，待一朝风云际遇，就会吉人天相，遇险灾消，一洗当年的秃风。做事只要小心，提防小人的口舌则吉。"},{"n":70,"no":"第 70 号签","text":"锦衣万里，劳劳而后喜，一朝可望生成。也是文昌照汝，定是佳人贵子。","jieyue":"人说命好不如运好，运好即一帆风顺，无风无险。如一只船在万里碧波航行，藉着顺风，扯起一帆，在波浪不惊的环境下向前直驶，正是「轻舟已过万重山」。因此只要运气好，一生都在安稳中渡过。"},{"n":71,"no":"第 71 号签","text":"黑云迷径人难走，桥断风吹舟又危。莫思徘徊，且去自思维。","jieyue":"一个人立身处世必须要知足，不要贪图欲望。把自己的思想和行为都深入欲海之中，这样会使人的性格及价值观完全摧毁。如东廓先生当年贫无立锥，以乞维持生活，一朝得志即忘记其初段时间的艰苦，使自己受欲望的枷锁牵着来走，终至不能自拨。因此只要不自暴自弃，全心全意地干，也不要忘本，最后都可以得到成功。"},{"n":72,"no":"第 72 号签","text":"白日雨如注，行人已自栖，闻道天衢泰。还有不宁居，何必向前进，危且殆乎？","jieyue":"前途虽有风险，但由于危桥已过，又回复行到康庄之道，自此便不必再有挂虑，再逢艰难了。正如一直困于浅水的蛟龙，一旦得意飞腾，在天上兴云布雨，显示出其卓绝不凡的能力。故此只要在行事之初段能够谨慎，经过阻滞后，也可获祯祥。"},{"n":73,"no":"第 73 号签","text":"鬼迷神不佑，须求天神救。立善行功成，好事方成就。三接其画，多许诚求。","jieyue":"祸福虽然说是由天所界定，但细心想一想，绝对是由人来取决的，这就是有其因必有果的缘故。而且亦是古语说：「祸兮福所倚，福兮祸所倚」的结果。因此塞翁失马不必以此为忧，得马亦不必以此为喜，因为其中所包含是福是祸仍未清晰。但只要时常修身，反省自己则可保一切平安。"},{"n":74,"no":"第 74 号签","text":"勐虎噬人，恶犬欺生。一箇昏天，如何扬眉吐气。","jieyue":"时来运未至之际，作事如望梅止渴、画饼充饥，始终都是水中月、镜中花，是没有结果的。同时，更多的小人羁伴在侧，使你举步维艰，愈是想前进，愈受阻延。因此，应不畏辛苦做事，步步为营，须防小人作祟，生出意外。"},{"n":75,"no":"第 75 号签","text":"天不佑之，时不合也。花被风折，人在海底。","jieyue":"欲望是无底的深潭，得一想二，得寸进尺，当然这也是人的常情。所以身处高山，就想登天，以为登天很易，当知道难或因进得退时，就知道事情的真象。因此处理事情有时要从正反二方来看，总予人家留有馀地，亦即留有馀地给自己。"},{"n":76,"no":"第 76 号签","text":"水落石出，荣华已矣！若得一通，除非再起。不宜前进，当守时势。","jieyue":"做人要安份守纪，在高位亦常存谦恭之心，不要太过冒进，同时也不要常常存有「人比人」的心理。因为「人比人，比死人」。只要在退处时听凭命运中的升降浮沉，终必获吉。这样才可以做到「得志，与人民一起进取；失意，独善其身」的地步。"},{"n":77,"no":"第 77 号签","text":"前车已覆，当为殷鉴。安份守命，自然顺便。","jieyue":"有才能的人受气运的限制，犹如蛟龙被困，亦似有船而没有江河可渡，始终不能一展所长。这时，凡事应当忍耐守候，以候时机，不宜强为，因人事不易胜天。唯一可以做得适当的是耐心，始终是可以得到时机发挥自己的所长。"},{"n":78,"no":"第 78 号签","text":"牆倾屋拆，大势已裂。防而无悔，土崩地决。","jieyue":"痴人为何能得痴福呢？此无他，因为他的「因」是「痴」，所以其得的「果」也是「痴」。这种「痴」不一定是「傻」，可以说是单纯或太专注，所以常得贵人的扶助而得到安康。"},{"n":79,"no":"第 79 号签","text":"不是知音不与论，只看镜破风不正。逆水莫行舟，气散宜当尽。","jieyue":"做人率性而为，是为天真，但太天真则未必能容于世俗的礼节，所以除非是遁隐泉林，过着隐士的生活，否则亦须顾及少许礼俗之事，只要凡事不欺心，即使祸害不至，再时常修德的话，灾祸自然不会临身。"},{"n":80,"no":"第 80 号签","text":"三分而已，何须望奢。人要回家，只待日西斜。","jieyue":"明明是已有名有利，知道再努力强求也是如此，但亦切勿守株待兔地等待命运的安排，要进取。因为名利如逆水行舟，不进则退，守成是一个最愚蠢的方法，所以一定要抱着奋斗的精神，这样的话，比纵使失这东隅，也必会收之桑榆的。"},{"n":81,"no":"第 81 号签","text":"合而分，分而合。天时人事，雨斟酌。","jieyue":"造物者对人的命运有时也是每多作弄的，因此要计算自己的成功失败亦是没有甚么可根的。在这样情况下，往往有心栽花的，未必能长满花朵，而无心插柳的，偏偏它就很茂盛。因此一得一失，一成一败都有前定之数，凡事与他人合作都会成功，但亦须防合久则分。"},{"n":82,"no":"第 82 号签","text":"月已落，风又紧，舟无蓬，水底影。若要如心，三春一景。","jieyue":"古人说：福无重至，祸不单行。因此遭遇不幸的事情时，感觉上或事实上有很多不利的事情会相继而至。其实这只不过是一种错觉，只要凡事谨慎处理，只问耕耘，不问收穫的小心去做，终必能渡过重重灾厄，到达彼岸。"},{"n":83,"no":"第 83 号签","text":"马已疲，人又疾。天不从人，何须亟亟。","jieyue":"一个人的命运在蹇滞之时，其所得的机缘也是相违背的，当灾祸降临在他身上时，可能当时他的身体情况也是很羸弱的。为甚么呢？这就是「祸不单行」的原故，亦即是因果的循环。既苍天都不予以庇佑，予以关顾，自己就不亟亟地营谋，首先打好自己的基础，充实好己，以候时机一到，自然水到渠成。"},{"n":84,"no":"第 84 号签","text":"秋风正好月当中，忽被雨朦胧。如何往，难成功；不宜谋，须神工。","jieyue":"此签运势有若梅花间竹式，一事成空，一事成喜。空与喜交迭而生，令人徒费力气。在这段时间更要小心草头姓的人，所谓草头人，即姓黄、董、蒋、范、蔡等，若与他们在一起，很容易无端起祸，危及自身的安全，故一切以守为宜。"},{"n":85,"no":"第 85 号签","text":"一去中阻，云雾不开。且自宽怀，须许善愿无碍。","jieyue":"在庭院里打开弦琴，以等待月亮，当月亮运行在天中时，光华映耀，庭院生辉，在此时抚弄琴弦，以作和应，当能触景而生情，但须有节制及忍耐才能达到这个目标。"},{"n":86,"no":"第 86 号签","text":"席已散堂中，寂寞恐难看。若得重欢，只待一轮月上。","jieyue":"花无百日红，有盛必有衰，人无千日好，有吉必有凶。乐极易生悲，忧时福又至。故本着平常之心待人处事，则无大凶险，日落西山的光芒虽好，但在黄昏之际尚能美好几多时间呢？故凡事以守成为妙。"},{"n":87,"no":"第 87 号签","text":"锦绣不成文，只恨修之短。挽回时命，鸡鼠猪牛，也宜推让，问过收成子罕上。","jieyue":"当一个人运势不畅通之时候，事事皆有阻滞，君子安穷，要在运蹇时甘之如饴。守株待兔，缘木求鱼，虽然都是千万中不能得一的机会，但仍然是有其一定微细的机遇的。但切勿不能心急，待时至即可。"},{"n":88,"no":"第 88 号签","text":"悔亡悔亡，空耗两难。人在东，西何可遇，莫劳心力待时遇。","jieyue":"全签皆喻示应遇而不遇，应逢而不逢的情况，水中之月，镜中之花，可望而不可得，精卫鸟啣石欲填平海，空劳气力，以珍珠来打雀，徙然浪费，正如月沉于海底，人在梦中，要勉力而为亦不可得，终是画饼充饥。"},{"n":89,"no":"第 89 号签","text":"隔了几重山与水，前途终是隔难行。只待草头人，方可两成谋。","jieyue":"船到江中心突然遭遇波涛胸涌，拍天而起，这种情况非常之危险，可幸此次情况是有惊无险，终必安然渡过。但虽然如此，仍然不能大意，要作好一切安全措施，使船稳定地向前行，因为前面还有十八个险滩要渡过呢？故此签喻示作事有阻滞但无碍，但仍然要谨慎地贯彻始终，以避免功亏一篑。"},{"n":90,"no":"第 90 号签","text":"雨打梨花，人在天涯，功名多费力，图事不能成，阴阳反复，时过令人嗟。","jieyue":"十分危险，幸得有救。李彦贵求功名自家乡上京赴考，途中遇难获救，家人未悉，以为已赴险曹，故祭之。求得此签者，运蹇时乖，诸事欠吉，加上事事反反覆覆，时好时坏 ，令人摸不着头脑。唯有自已处处小心，靠神灵的庇佑，朋友的协助，然后才能从危机中得救援，一切须待时机。"},{"n":91,"no":"第 91 号签","text":"莫急走，看绊跌，云掩风霾，终是一场冤业。若冤业，修省方免得。","jieyue":"古时人曾假设最危险的事情是甚么？答桉是：盲人骑瞎马，夜半临深池。试想盲人骑着盲马，深夜在一个深渊的旁边，就如此签乘着病弱之马行至危坡，是很容易因疏忽而失足陷下。犹幸危中有救，有执鞭疆的人辅助，使得临危也有救助。"},{"n":92,"no":"第 92 号签","text":"雷声大，雨点小，纵好不好。事在解铃人，福自改过，多行善可保。","jieyue":"已经犯下的错误当然无可挽回，但所受的刑责却因有上天的庇荫而得到宽减，所以纵有祸亦非严重。同时，一切问题的症结仍在你的手上，所以要得到解决之方，就要看解铃之人，多行善则可得福。"},{"n":93,"no":"第 93 号签","text":"心急马行迟，妄干何有益。且自安份，天神护吉。","jieyue":"六阴若相逢，表示将发生灾厄凶危之事，此番透此的消息既然是这样，不必妄动，强要运转乾坤，凡事只要小心在意提防，勤加修饰己身，则自不然灾祸消弭，随着吉祥之神来运转。"},{"n":94,"no":"第 94 号签","text":"事已如此，悔之何及。纵有不祥，还宜阴骘。","jieyue":"每一件事情，到达了某一个地步，就应依着其理法来进行，不必再想或后悔当日为何不如此如此的去做。纵使是绕路而行，终必有成。若一味转变行事方针，则只不过是原地踏步，再无进展之势。故此依理而做，而不必再有猜疑。"},{"n":95,"no":"第 95 号签","text":"已入笼，何可脱。已落空，难觅着。遇鸡鼠，自知觉。病果起，勿服药。","jieyue":"一到春季时万花盛开，花团锦族，在枝头上花朵开放得十分烂漫，令人感到十分写意。但须防盛极必衰，在最灿烂时又会趋于平静，在这种情况下，必须处处小心，步步为营，不能轻率大意，同时一定要居安思危，为将来作出部署，才能转厄为祥。"},{"n":96,"no":"第 96 号签","text":"潭深鱼不饵，鸟飞难弋获。时势已如此，一笑又一哭。","jieyue":"人生的得与失是非常玄妙的，所谓有一得必有一失。例如你抽出更多的时间在事业上，于是你得到成就，但相对来说，你失去和家人相聚的时间，或自己娱乐的时间。因此两者间的关係就如影随形一样，是永远相连在一起的。所以自己要立定心意，要得或是失。"},{"n":97,"no":"第 97 号签","text":"吉凶相半人宜识，莫任劳劳损无益。有时天运一回还，自然天道无痕迹。","jieyue":"心中已萌生了营谋之念头，不必急躁也不必担心，希望是可以得到实现的，而且成绩也是不错的。须注意，重点是在时间和成就上，因此只要不冒然求进，终归可遂心愿，若果急于求成，反为不美。"},{"n":98,"no":"第 98 号签","text":"东不如西，也要识时，是乃有命。可不知之，知时命，久谋自合宜。","jieyue":"究竟一个的成功是易抑或难呢？这是没有定则的。时来运到时，虽难成就者亦变得容易，时乖命蹇，垂手可得之势也会骤生突变，阻障重重，此一切皆由缘来作主宰。但只要尽人事而顺应天命，则万事得吉。"},{"n":99,"no":"第 99 号签","text":"可以转移，可以了结。只恨运命屯邅，故此一得一失。","jieyue":"老虎横在路途之上打瞌睡，对人本是极为凶险之事，因它一醒觉便会噬人。但只要行人小心谨慎，不惊呼狂叫，把睡着的老虎弄醒。这样，你慢慢的从它旁边经过，也是有惊无险，不会发生灾祸的，故平心息气，为此签的重大啓示。"},{"n":100,"no":"第 100 号签","text":"月落星沉，风生雨至。只要龙虎不相争，方可如时利。","jieyue":"桃花、李树在春初发茂，盛放于春末，故春来是桃李由盛而衰之时节。而候鸟亦由迁居地飞返回原居地，人虽然是平静如常地，但外来的冲击颇大，如船置身于波涛之中。依此诗意，凡事均须小心谨慎，提防一切突然而来的变故。"}]

  qian:[{"n":1,"qianyu":"宋太祖登基","ji":"上上","jie":"飞龙变化吉胜无疑之兆。生肖：猴","jieyue":"家宅：三阳交泰转洪钓，瑞气盈门百事新，岁秽时丰财禄旺，又添人口许亲，吉宅人口之卦可得喜气，但防夏月疾难是非涉财火厄，皆因厝前受杀冲伤，向佛祖令旗安门上祭化又嫌水道不美，有利宜修整，则居住平安。岁君：飞龙变化喜逢时，此日升腾果遂期，某望求财皆得利，求官进职更无疑。生意：春月生意欲失财，夏月财利丝丝来，待到秋冬两季节，壮胆经营利路开，五、八、十一月返利可得厚财。谋望：冲霄志气上心头，君子安宁久困穷，岁稔时丰财禄旺，万人头上逞英雄，谋事初时有阻隔，心虽思成，但不随意宜用心窍刻苦谋之，无急迫到底可成也。婚姻：世间天理定婚姻，天配如何误世人，人若自知天理合，何须着意问天神，婚姻成之，是天配良缘，不用问神自能情投意和，白头皆老。出外：一事初有阻隔，但须立胆智交三、五、八月往外有贵人扶助名利双全。开铺：开铺签文叶吉，各事宜小心，可以成功，君若才能高超于五、八、十一月起可得厚财也。合伙：之伙多人多福，各人宜同心同德协力，刻苦经营可得厚财利也。求财：正财初时有些跋涉，宜立胆志向前交三、五、八月返运可得大财利，偏财须大胆谨慎，忍口舌则得之。"},{"n":2,"qianyu":"薛仁贵困白虎关","ji":"中下","jie":"虎鹰相克，循而复吉之兆。生肖：羊","jieyue":"家宅：久淹漏屋欲更新，怎奈伊家欠福神，不但忧惊并怪梦，更添人口及阴人，吉宅人口有喜可得，但防四，七，九月灾疾是非失财，向佛祖保佑平安，外嫌祖山不顺，内是灶君不美，有利宜修整，先人伯叔祖香灯查明奉拜。岁君：虎出山林惊动民，乡民见了却忧疑，虽然不是伤人物，亦是虚惊事可知。生意：白虎凶星当头开，要防阻失惊险来,正材可取偏财失，求神保佑能得财，白虎星当头恐防小人波累，三 ，六，九月阻隔，宜细心防避，从正道财得可安。谋望：不凭天理强支持，妄做胡为岂可基，君子虽贫终身道，莫教失计受人欺，混杂谋事，不凭天理，定生是非口舌，若要事成宜从正道，以免是非。婚姻：自观相见好容仪，谁想中间一点非，不是婚姻休作对，不如撤手且由伊，婚姻有阻隔，对方虽为美丽,当非是百年姻缘，不可强行成婚恐生是非。出外：--开铺：卜开铺之卦应防小人累劫，惊阻凡事宜小心注意，宜请佛祖令旗安门上化吉保平安。合伙：之卦有利可得，但不宜贪心偏心，应忍口舌则免亏本散伙。求财：正财库取利，恐防小人耗劫宜从正道经营，谨慎工作，切勿与人代耽银项，则财得之安稳偏财不可取，取之危险。"},{"n":3,"qianyu":"孟日红寻夫","ji":"大吉","jie":"如鱼化龙灾去终之兆。生肖：马","jieyue":"家宅：莫忧家宅久淹连，天理于人岂有偏，若是从今更改过，管教财谷胜当年，吉宅人口之卦可得喜气，但数年以来财丁阻失，是门庭水道以及灶君不美，宜修通水道，使之合课做过新灶君，则居住财丁昌盛也。岁君：否极从今喜泰来，龙泉磨拂旧尘埃，暮然守旧无他事，闭门深居也获财。生意：有虚无实表皮红，恰似锦被盖鸡笼，幸有福力相扶助，秋冬时节利享通，生意初时有虚无实，面好看内部空交，五、八、十一月返运，可得厚利也。谋望：几年踪迹在江湖，名利无成困路途，今日相逢官贵力，好番春色满皇都，谋事初时有阻隔而且有虚无实，宜立胆智到底有贵人扶助定可成功。婚姻：有缘造物自安排，休叹无缘事不谐，此际好听琴瑟调，莫教夜漏滴空谐，婚姻成之但应从速说合，迟恐有变恐守空房无缘也。出外：一事叶吉但谦心意未定，应有胆敢往于五、八、十一月贵人扶助，各事平安。开铺：之卦为灾去终吉之兆，应小心大量，防止意外事故，初有小利，到底大利也。合伙：之卦可以成功，宜同心协力和气相处，忍口舌可保平安大吉。求财：正财库取利波阻已过，凡事业宜立志经营，候交八、十一月有贵人扶助，可得财利入手偏财初有阻，秋后可得。"},{"n":4,"qianyu":"黄巢出寨","ji":"中平","jie":"花木遭风，借风得舟之兆。生肖：蛇","jieyue":"家宅：无由闲事费支持，枉用贪心不可欺，金产损伤有少失，更防人口有微疲，《吉宅人口之卦可得喜气但防产妇月内惊阻有防三、六、九月灾疾是非失财之厄，皆因门轻重畔，埕口水字不美有利各宜修整则财丁可旺。岁君：劳心费力欲成功，待到花开一阵风，多谢东风轻借力，望东别有一枝红。生意：生意交易欲认真，偏财莫取正财伸，四七九月经营好，买卖求财遂君心，生意取利仍嫌有盒无剑既是空有交易宜谨慎，用苦心智谋秋后有财利。谋望：用尽心机事不成，如今休要问前程，金乌直待震坤日，自然荣显名利成，谋事初时有阻隔不能成功，但应耐心谋之于四，七月有贵人扶助名利双成。婚姻：婚姻到日不须寻，何必区区枉用心，有意种花花不发，无心插柳柳成荫，姻缘在远方成之大吉，若是近处男女两方经常见面的恐难成也。出外：之卦美中不足，恐防有些阻隔，若真心敢往于四，七月便可得到成就。开铺：若是老铺宜守旧经营，若是新创建未开张铺宅恐有不妙之处，勿开为好。合伙：合伙不成，合之不利，因为伙计间有败运者，不要合伙反而安稳大吉也。求财：正财库取利虽有得，恐有阻隔财不住手，应立志经营于四、七、九月一派大好有财利可得，偏财切不可取。"},{"n":5,"qianyu":"苏东坡游江","ji":"大吉","jie":"顺水行舟心动意和之兆。生肖：龙","jieyue":"家宅：门庭兴旺福神多，人虽无灾百事和，春夏宜防官灾疾，秋冬财物满庭稼，喜气盈门，但防春夏月小疾，及火星之厄，早晚火烛小心，是厝内土神愿和久年香火神恩过旺宜安谢土地神恩则财丁昌盛。岁君：舟行风顺去无虑，利涉江湖正遇时，万里程途只可到，所谋遂意事如期。生意：生意兴隆财利开，河有桥来天有阶，五洲四海皆可往，有勇有智有厚利，卜生意道路四通八达，与人交易不可乱猜，宜立智，五、八、十一月可得厚财利。谋望：欲求动止莫怀疑，名利相寻勿待迟，但得便中须速起，休教叹过运中时，做事内心不要乱怀疑要有胆智，灵活谋之交秋后有贵人扶助定可成功。婚姻：婚姻到日不须寻，何必区区枉用心，两边相许无他事，正好乘时射雀屏，婚姻成就百说百合，小登科已到在吉顺也，要借此时运托人说亲也。出外：一事时令当权，凡事勿猜测，大胆前往有贵人重重可得成就。开铺：之卦叶吉，但交易宜谨慎，应防人不仁，有贵人扶助财利兴隆。合伙：之卦叶吉，合之可成，但伙计应同心同德协力经营，有大财利可得。求财：正财库取利宜立智经宜，创举宜占先有贵人扶助可得厚财利，偏财取之恐有失，宜和人家合伙移他人之福也。"},{"n":6,"qianyu":"王昭君和番","ji":"中下","jie":"如鸟失群，称心不遂之兆。生肖：兔","jieyue":"家宅：只望今年百事昌，谁知自小惹祸殃，如今喜得人才好，重把家神炷愿香，《吉宅人口之卦恐防夏月疾难,口舌破财,求佛祖保平安，皆因先人失记小童香灯，应查明安拜，灶位不旺宜做新灶，则居住财丁兴旺。岁君：鸳鸯阻隔两分飞，谋望求财未遇时，守旧却宜休改革，如今进退两迟疑。生意：生意阻滞防有恒，春夏利少勤经营，秋冬两季相交接，千年古树枝又生，生意似鸬鹚限定，上春财喜稀少防阻隔勿执辟，宜见利取，水上生意秋好。谋望：名利从来不易求，茫茫世事水中鸥，天公不任人贫穷，致使白头空浮云，谋事有些阻隔，做事却不可执僻，宜用心窍，补贴些小利事自能成也。婚姻：不将年命合相同，勉强求成岂利通，从然有缘成一处，终须离别分东西，婚姻不成年命不同，勉强求亲虽得成功，终日也要离别，各分东西。出外：之卦恐防称意不遂，有小人寄祸宜守旧经营则免生愁。开铺：之卦未开，勿开或冬尾开之，已开之铺应防火盗，欠账口舌，宜立财帛星君奉拜冬尾有财利。合伙：之卦不成，因伙计三人四心，言行不一致勿合平安也。求财：正财库取财恐是称意不遂，有财利但是聚手经营，宜见利取利，不可贪也偏财恐失切不可取也。"},{"n":7,"qianyu":"韩信得志","ji":"中平","jie":"枯木逢春，暗中有喜之兆。生肖：虎","jieyue":"家宅：淹滞消除正夸？，福神明点照君家，从今莫听闲人说，树正何愁月影斜，吉宅喜气盈门，但防小孩生端 祸非而分家，主事人勿听妇女人言，宜从正气公正理，则家道可圆，埕口水道不美要修通，厝前受杀求令旗安门。岁君：枯木逢春色欲华，愿交树长发萌芽，时人莫把为柴砍，自待春来又发花。生意：春夏生意交易稀，秋冬运开有财利，偏财阻失不可取，正道经营防口舌，生意经营时令合局,宜刻苦维持经营交三、五、八月生意兴隆，有大财利可得。谋望：人在山中待好音，君人拨探说知音，如今借得东风力，万里扬帆渐转身，谋事可成但初谋之有小人阻隔，待三、五八月有贵人扶助，到底可以成功。婚姻：几年久坐少人招，今日枯枝长嫩条，自是有缘千里合，无缘对面路迢迢，婚姻成之佳人出在远方，有缘千里能相会，若是近方的恐是对面不相逢。出外：一事时令当权凡事勿猜测大胆往前有贵人重重，可得成就！开铺：之卦应防小人口舌，防人不仁宜请招财得君镇宅，求佛祖令旗安门上祭化平安。合伙：之卦大吉，合之可成，但伙计应同心同德协力经营，有大财利可得。求财：正财库取财除时利薄，宜刻苦经营立功志维持交二、五、十一月有厚利可取，偏财切不可取之，取之定失。"},{"n":8,"qianyu":"韩文公冻雪","ji":"下下","jie":"破船上滩破船上滩之兆。生肖：牛","jieyue":"家宅：不能安分每奔波，惹得家中祸事多，春夏可忧人口病，秋冬又忙损田禾，吉宅人口连年灾疾，口舌失财，向佛祖相保平安，皆因失祀祖上香火应查明奉祀并做过新灶位，埕口水道宜修通，则居住财丁兴旺。岁君：因见渔舟上逆滩，渔舟上岸且盘桓，前滩过了为闲事，惟有后滩过更难。生意：破船上滩险其中，生意经营有劫凶，来往交易须谨慎，智慧谋取利兴隆，生意经营似破船上滩，财利跋涉，防小人阻隔累害，宜谨慎用智悲谋取利。谋望：命里无时莫强求，何须日夜泛渔舟，红鳞已在秋江上，用尽心机不上钩，谋呈要托别人福，春夏谋之不成，要待交秋月圆，托人帮助为便可成。婚姻：旁人只说俩相当，难测胸怀损虎狼，口好不如心内好，不如独枕卧藤床，婚姻不可成就，因为小人语言不够真实，胸怀似虎狼不可相信。出外：之卦时令不通，恐防小人累害，生端寄祸，宜守旧则免生愁。开铺：之卦不吉，恐伙计不同心，有不美之事发生，勿合平安也。合伙：--求财：正财库取利正如镜内之银，看得见取不着，但宜立志气用谋之可得微利，偏财勿取之。"},{"n":9,"qianyu":"四太子伐中原","ji":"中平","jie":"兰菊芬菲时秋晚节之兆。生肖：鼠","jieyue":"家宅：只望家和万事成，年来愁闷未曾伸，因何不把家神敬，门户无人有响声，吉宅人口可得喜气，家欲合气万事可成，但防夏月疾难祸非涉财，向佛祖保平安，又嫌门轻重畔，灶位不美各宜修整，祖上香灯要拜到则安。岁君：芳兰春景真堪爱，菊吐秋光色又佳，乾坤各自惟消息，不假春风次第开。生意：春夏时运还未通，生意平平利轻松，货物留下秋东卖，时到运开利倍浓，生意虽有利可得，但防夏月阻隔，交秋后有贵人扶助，似兰菊芳芬得后利。谋望：昔年许汝到春来，岂料经营意不谐，且待菊梅开结日，依然名利两成材，卜谋事成，但须切防口舌候四、五月谋之并托人帮助，交秋冬时便可成功。婚姻：婚欲成时待月圆，不须心下意悬悬，虽然好段婚缘事，怎奈他人尚未坚，婚姻成之，但初时人心还未坚，不要急迫，候待月圆便可说合下出聘也。出外：一事要有胆气坚定前往，于二、四月有贵人扶助，可得名利双全。开铺：宜从正道，应防歹人劫物，铺勿离人，财勿露眼，请佛祖令旗安门上平安。合伙：之卦有利，但伙计宜忠直，勿贪心凡事，要能同心协力，要忍口舌秋后可得顺利。求财：正财库取利夏月利少，但宜刻苦维持交九、十月起返运财源广进可得厚利，偏财有利可得，但切不得外涉消息。"},{"n":10,"qianyu":"甘罗十二为丞相","ji":"中下","jie":"滤而即行之兆。生肖：猪","jieyue":"家宅：今年田蚕半吉祥，夏秋又恐损牛羊，冬深人口宜祷福，更防凶人跳矮墙，吉宅人口虽有喜气，但防夏月,疾难口舌，失财贼厄，肖牛者防生痛疾，向佛祖保平安，皆因厝前受水冲伤，求佛祖令旗安门上祭化则平安。岁君：不论平地与山尖，无限风光总被占，采得百花成蜜后，到头辛苦为谁甜。生意：今年生意欲认真，慎防盗贼劫财金，夏月莫挂人家账，秋到求财天有心，生意虽有财利可得，但恐小人,劫货，交易宜谨慎见利取利，则财利吉也。谋望：托人去干心中事，口好如何心不好，早早回头归故里，痴只常惯受灾残，卜谋事须防歹人阻隔，拐骗或抢劫财帛，宜谨慎应防人不仁，勿往外谋之。婚姻：野草闲花迷更乱，一朝乐极更生悲，虑心直待姻缘到，莫听旁人说是非，不可轻信媒人话，是闲花野草也切不可取之，若取之欢乐一时有祸也。出外：卜出外之卦，一事要有胆气坚定前往于二、四月有贵人扶助可得名利双全。开铺：之卦应防盗贼之厄，应防小人诱劫财物，铺门有杀，宜请佛祖符令安门上保平安。合伙：不成，三人四窍伙计不同心，财物恐有走漏，勿合为宜，合之有祸无利也！求财：正财库取财虽有得，但恐防小人负累，勿信直中直，须防仁不仁，宜从正道经营，偏财失之不可取，肖牛、羊者失更大。"},{"n":11,"qianyu":"武吉卖柴","ji":"大吉","jie":"如日之升，久病逢医之兆。生肖：狗","jieyue":"家宅：家旺人兴百事宜，田蚕加倍在秋期，但防阴人生疾病，见喜消灾事可知，吉宅人口可得喜气，但防疾难口舌涉财，是厝内有神恩土德，宜择日改谢清楚，又嫌祖山不顺有利宜修整壮旺，可得财丁兴旺。岁君：囚人出狱公事休，却买甜瓜上酒楼，偶遇故人同畅饮，酒钱不了义相绕。生意：灾过运来得意开，上年赫神恩要还，春夏应防风雨阻，秋冬时节财利来，生意初时利薄又防阻隔，交易宜从正道勿贪心妄取六、八、十一月有贵人可得厚财。谋望：沉迷踪迹未享通，今日承恩谢苍穹，改正前非行大道，自然财禄渐兴隆，谋事前有阻隔，是无先许向神恩，今欲重谋必先改谢神恩交秋后谋定成之。婚姻：前级配偶是今生，莫为资财重与轻，自有贵人扶持处，手攀丹桂上蟾宫，婚姻是前缘配偶，不要计较资财轻重，自有贵人扶持定能成之。出外：一事可大胆往前，凡事勿疑于二、三、五月一派好运自有贵人名利成就。开铺：之卦宜先改谢前年神恩，十一月应防劫厄，上春有阻勿灰心，秋后可得利。合伙：经营必先改谢神恩，伙计之间必须同心同德，言行一致，六、八、十一月可得财利。求财：正财初时利薄，应求神后无谢神应当天改谢之宜正道经营交六、八、十二月地派兴旺重倍偏财勿取。"},{"n":12,"qianyu":"襄王幢子","ji":"中下","jie":"扬花遭风小船出海之兆。生肖：鸡","jieyue":"家宅：路险身衰暮夜归，谨防失足暗中非，家中小口遭灾祸，六甲田蚕也不亏，吉宅人口虽有喜气，但防冲也，还防夏秋口舌失财贼厄，门户小心田蚕有损皆因厝前受杀冲伤，宜求佛祖令旗安门上祭化，居住财丁兴旺。岁君：扬花风卷消息将，恰似襄王忆梦来，夜静更残风力猛，乱飘零落洒莓苔。生意：山高路险有阻坑，生意财利微些些，若是犬吠厚利得，藏货秋冬财利生，生意经营恐有风波阻挡，宜受旧业谨慎经营，九月起可得财，肖犬者得厚财。谋望：欲想前时勉强财，扪心自问尔应灾，君要安为非理事，不招祸至祸自来，谋事恐防是非失财凡事宜从正道，候四，九月时萧犬者谋定成之，余人勿谋。婚姻：未有姻缘不主张，两家命里不相同，媒人只说瞒人话，媒得成来也不长，姻缘未有，命里不相同劝君切莫听媒人话，若是暂时谋之也不长久。出外：一事如小船出海之兆，恐防小人生端寄祸，宜从正道小心经营免生愁。开铺：之卦宜从正直经营，忍口舌不得招灾惹祸，有小利可得，肖犬得厚财利。合伙：之卦似扬花遭风，恐伙计不同心合之亏本破财。求财：正财库运未至宜守旧经营，防小人阻隔交九月起渐渐好转，有财利可得，偏财勿取若取之取恐防要失也。"},{"n":13,"qianyu":"吕蒙政两世姻缘","ji":"大吉","jie":"万物逢春，脱衣换锦。生肖：猴","jieyue":"家宅：今年不似去年贫，财禄重添遇贵宾，人口完成无盗贼，平安赛过九洲人，喜气洋洋，但防疾难口舌失 财盗贼之厄，门户小心皆因祖山不顺，有利宜修整合课，向佛祖保平安，并求福灯吊门上化吉，则财丁可兴旺也。岁君：开花结果喜逢时，赖得天官造化机，谋望求财皆遂意，衣锦还乡事可期。生意：市场货物能购收，精心保管把货留，莫怕初时有阻败，秋至价高利倍售！生意之卦初时财利稀少，但与人交易宜立志坚持候五、九、十一月可得厚财利。谋望：玉体冰肌不可移，真心之有寒岁知，如今喜得阳和日，花落自然中满枝，谋事有贵人扶助，交秋月可定就，但不能三心二意应一心一意，认真谋之。婚姻：郎才女貌世间稀，前缘配定不须疑，如今但愿他人准，好把聘财去定期，郎才女貌前缘配定，美满婚 姻应及早托人前往说定，定期上聘勿失良机。出外：一事名事亨通有贵人扶助，应于三、五、九月往外定有厚财利可得。开铺：之卦宜秋后开业，可一帆风顺得财利，若春夏月开业，宜请佛祖符令贴门上化吉也。合伙：之卦大吉，伙计宜同心同德协力经营，候交秋冬月可得大财利也。求财：正财上半年稀少宜守旧刻苦经营，交五、六、十一月财利亨通，可得厚财大利，偏财初有阻隔后可得，但切须忍口舌。"},{"n":14,"qianyu":"夏得海投文","ji":"中平","jie":"龙蛇混杂，谋望时代。生肖：羊","jieyue":"家宅：不宗香火不收身，未开家门伏祀神，若要财兴人口旺，除非安谢久家神，吉宅人口可得喜气，但防三、四月疾难口舌，祸非失财皆因失祀祖上香灯，嫌灶君不旺，安祀祖上香灯，重做新灶向佛祖保财丁兴旺。岁君：龙蛇混杂最难分，未得风雷变化麟，一日腾云归北海，那时方得见龙津。生意：生意欲做有偏财，购货恐防假不知，货物不可多留久，守旧经营利路开，生意欲做要守旧经营，防三、四月小人拐骗累害，交易欲认真谨慎秋后可得财利。谋望：两头事务尚蹉跎，见好因循本分过，自谋得来不长久，眼前求得也清磨，卜谋事初时有阻隔，宜用劳力心处理之可以成功，但恐不久向神明保佑也。婚姻：婚姻不与众人知，失却伦常邂逅迟，若不被人强占害，亦遭官府受鞭苔，婚姻不成恐被人占害，若成这 恐不合或合之不久，且惹是非也。出外：一事龙蛇混杂内中有事物阻隔，做事勿三心二意，宜守旧经营则安然。开铺：之卦宜守旧经营，防歹人拐骗，以假弄真购买货物谨慎，秋后有财利也。合伙：之卦似龙蛇混杂之兆，恐伙计不同心口舌是非多，勿合免失财利也。求财：正财虽是有得但不安稳，恐阻失宜立志刻苦经营，秋后有财利可得，偏财可取但应忍口舌。"},{"n":15,"qianyu":"诸葛亮出身","ji":"大吉","jie":"旭日东升，谋为果决之兆。生肖：马","jieyue":"家宅：保得自家莫取钱，好香烧炷谢苍天，田蚕六畜皆兴旺，受佛今年胜旧年，吉宅人口可得喜气，但防三、四月口舌涉财，主事人不义之财勿取宜虔诚当天改谢神恩，请佛祖福灯安吊门上祭化之后居住财丁兴隆也。岁君：月满今霄离海边，时人感仰赖青天，清光照耀难星退，君子求谋便得官。生意：春夏财利虽有亏，明智壮大购货归，收购货物仓中放，秋冬出售利非微，生意之卦如龙蛇混杂，恐三、四月有阻隔应谨慎，有贵人扶助五、八、十一月有厚利。谋望：此身相逢更遇邀，龙蛇天外拔迢迢，平生伴你营随意，云有天梯水有路，谋事定成但有些口些舌无妨,宜立智前进有贵人扶助可得名利双成。婚姻：前生注定是姻缘，好貌才郎登对年，要虔事心酬天地，管教夫妻两团圆，前生注定男才女貌俩相配，宜诚心配偶先谢天地，夫妻可得百年皆老。出外：一事时运当权，谋事应有胆量任其向往，有贵人扶助可卜名利双全。开铺：上春恐有阻隔小利，候秋冬月生意兴隆，有贵人扶助源广进。合伙：大吉有财利可得，但防歹人破坏，忍口舌伙计应同心协力经营顺昌也。求财：正财取之有得，但恐防三、四月阻隔，应果决进前交五、八、十一月有厚利入手，偏财有小人恐有官非破财，到底平安也。"},{"n":16,"qianyu":"关公秉烛待旦","ji":"下下","jie":"重囚望赦，浊油点灯。生肖：蛇","jieyue":"家宅：只因不肯敬神明，惹得家中事不宁，今岁若除灾与难，除非重整久家声，吉宅人口可得喜气，但防四、九、十月祸非疾难失财，肖猪狗之人恐惹祸非，宜安份守已，向佛祖奉经拜祖上香灯，做过新灶居住，财丁兴旺兴。岁君：浊油点灯灯自灭，方才剔起又垂微，长心烧书空劳力，何不将身忙自归。生意：何必次次费心机，用尽苦力财力稀，口舌欲任偏财勿，正财守旧能得利，生意似穿破鞋过水，防小人耗财，与人交易信直中直，宜苦力不从经营可得财力。谋望：覆危渡水两头难，万计千磨财利艰，守份安贫宜忍耐，忙忙劳力不如闲，谋事不成如破鞋覆渡水，艰难重重防歹人祸害，九、十月更应谨慎防备。婚姻：方才说起惹忧愁，想是姻缘不到头，如今若得言相许，又恐旁人暗里谣，婚姻不成有小人重重，纵然成之恐不长久，也许被歹徒占有。出外：一事因时令不美，恐防小人生端，宜守旧经营方保无忧。开铺：之卦为浊油点灯，恐防大火是非口舌，小人耗财宜过旧经营平安也。合伙：之卦不吉，伙计多心，恐防是非口舌，亏本切勿合，合之定失。求财：正财库利小九、十月有歹徒负累，宜稳重谨慎经营，见利取利得之安，偏财定失，分文勿取也。"},{"n":17,"qianyu":"王省就亲","ji":"中平","jie":"枯树生枝，一牛二尾。生肖：龙","jieyue":"家宅：莫将怪梦作闲因，邪摩私祸不临神，自是行藏千里合，岂因病小危难消，吉宅人口可得喜气临门，但嫌六杀占宅，恐防六、九、十二月疾难口舌失财，向佛祖奉经保平安，求达摩祖师香火安门上祭化则财丁兴旺。岁君：当时得意反成痴，今日忧疑事不危，若遇贵人相接引，十年桔树又生枝。生意：生意经营切莫贪，牢牢记住守旧框，肖牛之人防阻失，肖羊之人厚利攀，生意有利可得但防阻失，经营要正直谨慎，肖羊者得厚利，肖牛者失财利。谋望：贪多更惹祸临身，名利从来是未真，但得忧游家道乐，知他谁是百年人，谋事可成但有阻隔，做要稳重认真，不可贪心方免惹祸临身。婚姻：不须勉强费尽金，婚来合时何用寻，立志强成非好事，知人知面不知心，婚姻大事切需要探明对方底细，不可马虎从事乱挥金钱，别把野花当红花。出外：一事虽有贵人扶助，但又防小人生端寄祸，不可在外久住，且来来往往。开铺：之卦不美，未开勿开，已开之钥应防盗贼火灾，肖牛者失利肖羊者可得大利。合伙：之卦不美，失字当头，特别是肖牛者更不妙，伙计不同心有小人祸害，勿合也。求财：正财库取利，虽有微利可得，但恐防阻失，凡事业从正道，八、十一月有财利可得，偏财有阻失勿取吉也。"},{"n":18,"qianyu":"董卓收吕布","ji":"中下","jie":"乌云盖月，蟾宫捉兔之兆。生肖：兔","jieyue":"家宅：旧年不利损多端，今年因何又不安，畜产田蚕防损失，更疑火盗两相残，吉宅人口可得喜气，但防疾难祸非失财火盗之厄，是门楼受火烟冲杀，求佛祖令旗门上祭化居住财丁兴旺，妇人有喜小心防冲杀。岁君：养汝原来岁月深，龙面不见空长吟，相应只在秋江上，明月荷花何处寻。生意：偏财一点不能取，正财也要守旧心，生意防阻勿贪心，现买现卖要记心，生意交易似空笼罩鸟，一嫌财利阻隔，二防小人耗劫买卖须用心谨慎。谋望：本来无事做山翁，为受飞禽使运龙，谁料脱身天外去，方贪计尽也成空，谋事难成，防小人阻隔恐生祸是非失财，凡事不可贪心，不可谋守旧则安。婚姻：今晚不管是和非，作教欢心进秀纬，但看却知林里应，五更天晓各分飞，婚姻不成，未与说时勿说,纵然说成洞房花烛结婚也不长久。出外：一事君虽各事通灵，但嫌进令不美有小人无故生端，守旧经营免生衲害。开铺：之卦不美，防小人耗财，防盗窃火灾，交易勿贪心宜从正道。合伙：之卦不美，伙计训怀贪心勿合，免惹是非失利亏本也。求财：正财库取利似空，笼罩鸟财利虚有，又恐小人耗劫宜用心经营，以智谋取之可保平安，偏财定失勿取也。"},{"n":19,"qianyu":"苏秦六国封相","ji":"上上","jie":"万物逢春。生肖：虎","jieyue":"家宅：此卦求问家宅安，财丁两旺事事全，大吉之兆喜且顺，少安老福庆满堂，吉宅之卦签文太旺人口多则兴，人口少则衰，虽有喜气可得，但嫌官非失财，皆因祖山不顺，灶君不旺宜修整合课向佛祖保佑合家平安。岁君：云行雨施正春深，谋望求财总遂心，争公见官皆得理，贵人喜爱自相寻。生意：生意初时有阻缠，刻苦经营利丝丝，待交秋凉寒冬月，货如轮转得厚利，生意初时防阻，财利小宜刻苦经营于五、八月有起色，生意兴隆可得厚利。谋望：逢时日转好和平，谋望求财正利亨，若要经营当此际，皇都及早取功名，谋事有成，但防谋时阻隔凡事勿贪心，不可妄取宜行正道免生祸非而成也。婚姻：人家便把兰门整，好看瑟鸣有凤声，天对姻缘更有合，如今不必问前程，婚姻成之，琴瑟和鸣天配良缘，可把家门修整择其吉日准备迎亲。出外：一事如枯木逢春，有贵人重重宜立胆智，于三月起往外各事平安。开铺：之卦如万物逢春之兆，但初时怕有小阻，宜大胆灵活经营于五、八月起可得厚财利。合伙：之卦吉利，初时有小阻，勿灰心忍口舌，刻苦经营，同心同德定能得财利。求财：正财似雨后春笋，取之大吉，宜立胆智经营进前占先，三、五、八月时令显达可得大利，偏财初有失，宜大胆经营获大利也。"},{"n":20,"qianyu":"曹操下江南","ji":"下下","jie":"破船下滩。生肖：牛","jieyue":"家宅：去年只望今年好，今年何缘又不宁，只为旧房多怪异，却教疑忌损人丁，吉宅人口旺者得喜，衰者破防失之灾，是灶君冲门祖山顺，有利应把灶君祖各宜修理合课向佛祖奉经求佛祖保佑合家平安。岁君：有船无楫难撑驾，更被飘流向海洋，嗟叹世人系不得，误人如此走东西。生意：正直守份生意经，偏财一点取不能，货物不宜贪心购，留货秋后价会升，生意春夏月财利跋涉，宜守旧正直经营，用心刻苦维持，秋后有财利可得。谋望：千谋万计事难成，枉走江山万里程，不如抽身且守耐，不然别月事来惊，谋事难成时运未到，应该守耐之，若要谋之恐有惊阻，失财祸非之危也。婚姻：许了因何又不从，只因年命不相同，莫教勉强心无定，人岂相逢在梦中，婚姻不成虽然曾经相许过，只因年命不同，小人重重，若作成也恰似梦中。出外：之卦不吉，有小人无故生端寄祸，且防水危宜守旧经营，则免生愁也。开铺：之卦时运未通，宜从正道过旧经营，秋后有发展可得财利也。合伙：之卦不美，勿为宜若，合之定被吞没，定是亏本失利并惹起是非。求财：正财库取利稀少，又防小人负累，宜刻苦维持宜守旧经营，交秋时令有利可得，偏财难得不可取之，若为之定失也。"},{"n":21,"qianyu":"上帝收龟精","ji":"大吉","jie":"如鲲化鹏，鸾凤冲霄。生肖：鼠","jieyue":"家宅：须宜另改旧门庭，人旺财兴百事宁，不但田蚕收十倍，更随四方任经营，吉宅可得喜气盈门，如无喜气事就恐有孝服事到来，皆因门字分金不正门庭水字不美，宜修整改正门庭分金水字求佛祖福灯吊正门，上化吉保平安。岁君：鲲化为鹏海浪翻，阴阳交泰太平关，庶人暮有凌云志，平地雷声倚势还。生意：生意求财要有义，偏财一点不得利，肖马之人偏财得，四面八方任行时，春季生意不能得利候五、六月起似龙带雨定有财源广进，惟肖马者有偏财可得。谋望：几年沉落波涛内，未得风雷志气高，今日脱身多变化，应知万里任游遨，谋事有成但防时有阻隔，用心窍候六、九月可成，但肖猴者恐惹官非失财。婚姻：精男巧女两相当，配合婚姻启后昌，此际好求鸾风偶，迟延悔过费思量，精男巧女配合大吉，但要速速下聘办理，不可拖延，若迟恐祸变也。出外：之卦叶吉，有贵人扶助可于三、五月往外有厚利可得各事平安。开铺：卜开铺之卦叶吉，初小利宜壮胆经营交五、六月起如鱼化鹏，可得厚财利也。合伙：之卦大吉，但伙计要有仁义，要同心协力交五、六月起财源广进可得财利。求财：正财库取利上，春财利稀少，但宜刻苦经营秋厚转运，各事亨通可得厚利偏财唯肖马羊者得之。"},{"n":22,"qianyu":"岳飞枪挑小梁王","ji":"大吉","jie":"将军得胜，凤鸣歧山。生肖：猪","jieyue":"家宅：好整新居换新巢，远离群只兔相投，升平无事皆为福，恰似晴明月满宵，吉宅人口之卦虽有喜气可得，但嫌家内不和气且有灾疾，是灶君不旺埕口水路不通，宜择吉方重建新灶，修通水道厝宅修整壮旺居住平安。岁君：凤凰飞出林间去，振翼飞回伏众禽，一日身荣朝上国，四方钦仰尽名闻。生意：正二五九生意时，他有则难价不知，经营勿贪尾空有，偏财得利又失利，生意经营旺相有贵人扶助，宜用智谋大胆经营，于五月起可得厚财利也。谋望：几年静坐守闲居，景色萧条事已虚，此去时通同泰运，名利成就一声雷，数年谋事有虚无，现岁谋事宜，立胆智敢想敢干，于三、七、十一月可成功也。婚姻：旧年夫妻去鸣琴，静里听来鸾凤音，休要蹉跎延岁月，天寒失雁杳难寻，婚姻可成，但宜从速下聘，切不可迟迟拖延岁月事多变。出外：一事得运，身体可平安，大胆前往于三月起有贵人扶助，可得大财利也。开铺：卜开铺之卦，如将军得胜之兆，有贵人扶助宜大胆经营，五月起可得厚财利。合伙：之卦似凤鸣歧山之兆，伙计要同心同德，齐心协力可得大财利也。求财：正财库有利，但初时空有，凡事业宜立胆智交三、八、十一月有贵人扶助，可得厚利，偏财可得恐不住勿贪也。"},{"n":23,"qianyu":"颜回短寿为圣","ji":"下下","jie":"花开遭风，啖河止渴之兆。生肖：狗","jieyue":"家宅：家居不利欲搬移，惹不搬迁惹是非，只是本家人着力，好心人被小人欺，吉宅人口之卦虽有喜气可得，但防疾难口舌失财和盗贼之厄，向佛祖保平安，皆因灶君不旺失祀祖上香灯，宜奉拜周到重新灶君居住兴旺也。岁君：种得桃树满园林，花开遭雨又遭风，当初只望偷桃食，如今到底总成空。生意：生意守分可经营，进出货物看市情，取财勿贪防阻失，现买同卖财利兴，生意宜守旧经营，要现买现卖，不可妄取，防小人劫物六、八、十一月有利可得。谋望：几载蟾宫折桂枝，未逢时节枉心机，寅缘等到花开日，又被连朝大雨欺，谋事难成，恐防小人生端寄祸，累害耗财，肖猴者恐惹官非和失败。婚姻：知人知面不知心，枉使良谋费尽心，只为眼前欢共乐，谁知祸起为娼淫，婚姻不成，对方品质作风差，若成之，恐成之是娼淫惹起是非灾害，不结尾。出外：一事为啖河止渴，恐有小人阻隔，凡事宜守旧经营，各事平安。开铺：卜开铺之卦如花开遭风之兆，未开勿若是老铺宜注意火盗之危，向佛祖保佑平安。合伙：之卦不美，似花开遭风之兆，勿合为要，若合之恐有小人盗劫财物，亏本折利。求财：正财虽有得，但防小人累害，宜守旧经营，钱财不可信中直，应防仁不仁，六、八、十一月有财利也，偏财勿取。"},{"n":24,"qianyu":"唐明皇游月宫","ji":"上上","jie":"吉庆分明，风云际会之兆。生肖：鸡","jieyue":"家宅：汝家无事不须疑，但梦如何有约期，人若安然无他事，提防暗里小人欺，吉宅人口之卦虽有喜气，但阴夏月小疾失财盗贼之厄，门户宜谨慎，有称人承奉祀拜到财丁昌盛，妇联有喜恐无得。岁君：明有当空处处辉，朗然光辉照昏迷，谋所运大家声显，富贵荣华福乐齐。生意：春夏生意有小灾，守份求神能保财，交秋月圆时运转，货物出入利路开，新创生意春夏月防阻失，宜守旧经营，买卖数目应谨慎，交秋月便可得财利。谋望：心欲抽开事未闲，失去无处把身安，如今得有青云路，步上天梯见广寒，谋事初进难成且有阻隔，候三、五、八、十一月用些财帛帮助，事情便可成功。婚姻：婚姻本是合团圆，何必慌忙心里悬，自是有缘千里合，管教男女共安全，婚姻成也缘份生就，男女双方，情投合，同心同德，千里缘合，白头皆老。出外：一事有贵人重重，应于三月往外，不但平安而且有厚利可得。开铺：之事时令合局，为风云际会之兆，宜择吉日，从速开张，定有财利可以得。合伙：之卦顺吉，为吉庆分明兆，但伙计要同心同德，齐心协力，有财利也。求财：正财虽有所得，但防阻失，宜守早，不可偷闲，于三、五、十一月可得厚利，偏财恐失，莫取为好。"},{"n":25,"qianyu":"郭巨埋儿赐黄金","ji":"中平","jie":"铁镜重磨之兆。生肖：猴","jieyue":"家宅：是非叠叠起虚惊，畜产灼危百怪兴，不是营谋不如意，尚防盗贼入门庭，吉宅人口可得喜气，但防夏月疾难口舌，及次次是非盗贼之厄，门前受杀冲伤，求佛祖令符安门上保财丁兴旺，坐北向南白虎畔有石碑移开。岁君：求谋胜遂如君意，欲望青云路转移，守旧却宜方是吉，他时必定见荣华。生意：春夏时令运未通，生意交易守旧风，谋望求财须等候，秋月圆时利倍浓，春夏利薄，宜守旧刻苦经营，秋后可得财利，肖牛者有贵人扶助，新创生意定得厚利。谋望：运未亨通莫强求，眼前求得也成忧，不如守旧依稀过，好得荣华在后秋，肖牛之人谋之定成但是口舌，忍之，余人运未通，候交来年或秋后成之。婚姻：此亲虽好未为良，休要耽迷惹祸殃，且守得有缘份到，不须持早待心坚，婚姻虽好，但内且待缘份到时便可成也。出外：一事上春恐防是非口舌和小人累害，宜勤谨慎守旧业，交秋后各平安。开铺：卜开铺之卦，春夏小利有阻，宜求佛祖符令镇宅保平安，秋后可得财利，肖牛者可得大利。合伙：合伙之卦不美，伙计不同心，各自有私心，恐要亏本惹出是非，勿合为好。求财：正财春夏月时令未通，财利稀薄，宜刻苦守旧经营，秋后后转运有财利，偏财定失，肖马者得大利也。"},{"n":26,"qianyu":"姜太公遇文王","ji":"大吉","jie":"新月如弓之兆。生肖：羊","jieyue":"家宅：敬神自在心头欢，门户光明万事安，不但田蚕皆兴旺，谁知失落不相干，吉宅可有喜气临门，但人口防四、六、九月有口舌痛疾，还防火盗之厄，是厝前受杀，白虎畔有石冲伤，宜求佛祖福灯安门上祭，化居住大吉。岁君：安居旺相进田蚕，天上生云地下雷，禄位高升光显达，荣华富贵入门来。生意：新开商店春夏盈，旧业经营夏平平，欲问交易何时旺，中秋时节财利生，新创业春夏得厚利，宜用苦力，维持，秋后可得财利。谋望：运至方得出运邦，自然财宝聚衣厢，名利喜在随人欲，却笑浮生空白忙，谋事可成但防口舌，宜用苦力，候交秋后有贵人扶助，即可成功也。婚姻：好对婚姻不用谋，有心不必急相催，前生注定非今日，五百年前结果来，婚姻定成且不用媒人，前缘注定，五百年前结成同心同德，互敬互爱。出外：运气方盛宜出运方，有贵人扶助，各事得心应想，可得名利双全。开铺：若新开张铺户，可卜财源广进，若老铺经营，春夏月小得，秋后转运可得厚利也。合伙：之卦叶吉，协力经营有财利可得，但恐合不长久，必须谨慎注意也。求财：正财取之大吉，但春夏月财利稀薄，宜刻苦经营，秋后有贵人可得财利，偏财勿取恐有是非。"},{"n":27,"qianyu":"岳飞风波亭受害","ji":"中下","jie":"泥中取禽，龙入蛇穴。生肖：马","jieyue":"家宅：不祥值梦已虚惊，鸡犬无端作怪声，非是家神来取祸，只因不记旧亡灵，吉宅之卦签文有梦字可化成喜字，但防三、四、九月疾难口舌，是非失财，向佛祖保佑平安，外是祖山不顺，内是灶君不旺，备事修整，则居住财丁兴旺。岁君：家舍惶惶主不祥，只缘先祖作祸殃，且宜作福永祈祷，更答家门香火堂。生意：货物购进快出售，偏财莫取正财筹，稳重谨慎防祸劫，神明炉前好香求，生意似泥中取禽，财利得后恐防小人耗财，宜从正道谨慎经营，勿贪财利则安。谋望：枉使贪心事已迷，不依本份强施为，一朝祸起萧墙内，徒得莺歌鹊已飞，谋事时令不通，谋之恐失也，凡事从正道为佳，肖龙者切不可谋之，谋之定失也。婚姻：占为嫁娶择二堂，意欲求神恐不良，若不三思存善恶，后来追悔受灾殃，占来的嫁娶要惹三重官非，要好好三思不为，若为之恐惹祸非也。出外：时令不美，恐防小人生端寄祸，宜守旧课经营，谨慎用心则平安。开铺：之卦铺面不宜扩大，宜守旧经营，货物不可进得太多，宜立财帛星君奉记吉也。合伙：之卦不吉，如泥中取禽之兆，不可合也，伙计不同心，合之定失财且生是非口舌。求财：正财取利虽有得，但防小人阻隔累劫，凡事从正道守旧经营，偏财勿取，取之定失也。"},{"n":28,"qianyu":"吴春女为王后","ji":"大吉","jie":"万物逢春，谋望遂心之兆。生肖：蛇","jieyue":"家宅：莫将此事起疑心，虽有浮云岂久阴，此际财人两兴旺，更无火盗两相侵，吉宅人口有喜气临门，但防夏月口舌小疾火盗之厄，是厝前有杀冲伤，宜求佛祖七星令旗安门上祭化，有贵人扶助男女老少平安大吉。岁君：贵人接引喜逢时，官非口舌门庭离，病除疾去身安稳，若问求官定得名。生意：公平交易好心机，购货有阴贵人持，偏财勿取取定败，五六十月真价知，生意可得厚利，但初时有阻，幸有贵人扶助，要从正道经营秋后可得厚财利。谋望：积善之家庆有余，吉人自有吉星持，求财心合存天理，任是凶危也消除，谋事可成但防小人阻隔宜立正直有贵人扶助，如若亏人恐生祸非也。婚姻：良谋相对说知音，莫教错过又来春，此际好调琴瑟韵，真是风清月白人，良缘巧合此际可以说成，应该长速下聘，不可迟延拖，若迟这恐生变也。出外：一事宜从正道有贵人扶助，不但平安而且应心得想，东成西就。开铺：之卦叶吉，如万物逢春之兆，宜忍口舌礼貌待客，防火盗之危，宜请水德星君镇宅，秋后可得厚利也。合伙：之卦可成，如万物逢春之兆，但伙计必同心同德，协力经营有厚财利。求财：正财取利大吉，凡事经营宜从正道，不可亏人，交六、八、十一月有贵人扶助，可得厚利，偏财勿取平安。"},{"n":29,"qianyu":"郭子仪拜寿","ji":"上上","jie":"花木逢春，春来花发之兆。生肖：龙","jieyue":"家宅：敬神自是合天心，人善神饮祸不侵，此不淹留无阻滞，田蚕十倍在深秋，吉宅喜气临门田蚕十倍，但嫌夏月人口有小疾口舌涉财，每逢塑望应诚心敬拜佛祖，天地保平安，埕口水道秽修通。岁君：阴阳相合事亨通，如今行在明月中，琴瑟调各门户吉，荣华富贵喜重重。生意：山荼荷花不合丘，初时磨苦小利酬，和气待人心头记，硕果遍地大丰收，生意合伙不利有阻失，独做二、三磨苦小利，交五、八、十一月生意兴隆可得大利。谋望：十年辛苦在寒窗，一旦翻身入选场，幸得朝庭用智士，传扬天府姓名香。定成有贵人扶助，谋之即可随意，但肖龙之人切不可谋，恐祸非失财也。婚姻：赤绳系足问前程，不用求谋事以成，丝牵月明缘份到，静坐好听凤凰鸣。婚姻成之大吉，两人相合不用媒人，待月明之时便可下聘，就可成功也。出外：之卦似春花开之发，凡事勿疑有胆往外，有贵人扶助，可得名利双全。开铺：之卦如春来花发之兆，生意兴隆，可独占鳌头，五月起可得厚财利，但应忍口舌文明经商。合伙：之卦不吉，恐伙计各有私心防是非口舌防阻失，勿合。求财：正财初时稀薄，宜刻苦维持二、五、八、十一月有贵人扶助，可得大财利，偏财初有恐失，但到得底得大利。"},{"n":30,"qianyu":"王可休妻","ji":"中平","jie":"夜雨欺花，玉镜尘之兆。生肖：兔","jieyue":"家宅：有心斋戒不宜开，恐惹祸非横祸来，归去依然修整过，免叫人口起鸣哀，此卦哀声出现，若有六甲喜可将哀误会声消除，但防五、六、十一月口舌祸非疾难，是门字分金不美，灶君山坟不顺，有利各宜修整合课，向佛祖保佑平安。岁君：花正开时夜雨欺，月当明处被支披，寄言桃李本要笑，或者云开也有时。生意：春夏经营难安排，恐有飞祸又破财，交秋冬日生意吉，牛羊之人利路开，春夏月磨苦无利，交秋冬月可得财利，但防小人累害，惟肖牛羊者可得厚利。谋望：世间不及汝聪明，怎奈时乖事不成，且在灯光温习卷，交秋冬日取功名，春夏时乖有小人阻隔，后来有贵人扶助，肖牛羊者定成。婚姻：以前配偶本无缘，却被旁人说乱言，今日欲求难得见，不如归去待迟延，婚姻不成来配偶无缘，又加上旁人说是非，不可议亲，若议之也是不就也。出外：一事似玉镜灰尘之兆，春夏恐事务阻隔，往之不成，中秋后可出外各事平安。开铺：之卦春夏月宜守旧，防小人祸害忍口舌，秋后转运可得财利，肖牛羊者可得厚财利。合伙：之卦虽合成，但恐伙计不同心，各自私偏，合之不长久，肖牛羊者可得厚利。求财：春夏月时令未通，磨力多财利少，宜守旧交秋后，返运可得厚利，偏财唯肖牛羊者可得大财利也。"},{"n":31,"qianyu":"打北齐秦家比械","ji":"中下","jie":"四路虚险，乌云盖月。生肖：虎","jieyue":"家宅：君家何必惹非灾，南北防七星来朝，求祷福神更改吉，不然安得皱眉开，吉宅有七星杀占宅，防三、六、九月灾难口舌失财，向佛祖保平安，请令旗安门上镇宅祭化南北斗星君，居住平安妇，人有喜生女勿出外。岁君：心事忡忡常不宁，坐得方安又未安，兴意施为全未遂，恰似明月被云迷。生意：春夏生意大不祥，正月守分利不偏，祈祷神明力保佑，冬至时节利可添，生意如虎上壁财难得，宜守旧业苦力经营，秋后可得利，肖牛羊者恐折本招祸。谋望：自然心下意忙忙，怎奈他人心自慌，财物如山皆分定，劝君守旧待时光，时令不美谋事难成，肖牛羊之人更不可谋之，定失并防有祸。婚姻：花言巧语岂为真，浪蝶游蜂不可亲，不信但看园内物，一番风雨就伤神，婚姻不成，媒人花言巧语不可信以为真，如浪蝶游蜂不可相亲，若成之恐不长久。出外：一事四路絮险，恐有小人伤害抢劫，宜在家守旧经营，则免生愁。开铺：之卦恐有阻失，肖牛羊者失更大，未开之铺勿开，若是老铺宅应防歹人祸害劫财，宜求佛祖令旗化吉。合伙：之卦不美，如四路虚险之兆，恐伙计有私偏，恐惹是非口舌灾难，勿合为要也。求财：正财春夏月，跋涉又防阻失，凡事立志经营秋后得利，偏财肖牛羊者勿取，恐惹是非受惊。"},{"n":32,"qianyu":"袁术称帝","ji":"中下","jie":"众星侵月，日落斜西之兆。生肖：牛","jieyue":"家宅：阴人灾害事如何，只为家中惹鬼多，如今要保平安日，除非寻僧礼达摩，吉宅人口防夏月有疾难祸非失财，是埕口水道不美，内有阴人作动又嫌祖山不顺，有利各要修整清楚，向佛祖奉经请达摩祖师福灯安门平安。岁君：众星侵月也当防，小口阴人起祸殃，弱也之时休改革，预先借福谢苍穹。生意：守旧经营可平安，小人劫财要提防，百事用心要谨慎，结果只能小利攀，生意不贪心妄作，要仍按旧业 经营防偷劫，货款出入谨慎，用心窍取利也。谋望：古来名利与兵机，谋望虽多得者稀，若不将心且忍耐，必然失计被人欺，谋事有小人累害有口舌，防祸非失财宜用心窍，用些财帛帮助事可成。婚姻：本来婚偶待团圆，怎奈旁人起祸端，若要事成须速早，不然迟慢守寒年，婚姻切切不可拖延，应及早下聘迎娶，若迟延恐失也，今后又恐无妇也。出外：一事时令不通，恐防小人劫财，勿出外，宜守旧经营，则可安然。开铺：之卦不美，未开者开勿，已开者必守旧经营，勿贪财妄取，防小人防亏本，请佛祖符令镇宅平。合伙：之卦似众星侵月之兆，伙计有私心，防小人防亏本，勿合则吉也。求财：正财利小稀薄，防小人耗劫，恐要亏本，宜谨慎从正道，偏财阻失不可取，取必失之。"},{"n":33,"qianyu":"赵子龙救阿斗","ji":"上上","jie":"蛟龙得雨，宝剑出匣之兆。生肖：鼠","jieyue":"家宅：和居新改又新修，更答家门叶满堂，喜得秋成收十倍，遇逢富贵家道和，吉宅喜气临门，但防夏月则口舌是非，失财官厄，家兴无灾家衰失丁，主事宜团结家人，则家道可得圆满，门字分金不美，应修风水居住财丁兴旺。岁君：利磨龙剑快锋芒，志气冲天势敢当，一但偶时携手立，共道英雄志气刚。生意：初时生意市价迟，磨苦只有得小利，秋冬季节时运通，结果定得厚财利，生意经营初时财利跋涉，但宜刻苦经营发展，交三、六、八、十一月如龙得雨。谋望：未逢雷焕便归洲，万炼千磨受苦煎，此去化龙知期日，峥嵘头上有青天，谋事初时不成，有口舌是非，宜忍性用苦力经营，候交秋后定可成就。婚姻：自古婚姻岂偶成，有缘千里得通传，如今宜好团圆日，莫教琵琶向别船，有缘千里结合婚姻成就，白头皆老要及时下聘，切勿错过良机。出外：一事叶吉，应于二、三月时令合局往之，有贵人扶助，可得厚财利也。开铺：之卦似龙得雨，春处夏月恐是非口舌，磨苦小利，秋后转运可得厚财利。合伙：之卦叶吉，但初恐磨苦小利，但伙计宜同心同德，步调一至，秋后转运似龙得雨，可得厚财利。求财：正财初时如鱼于深渊，财利跋涉，宜刻苦经营，交三、六、八月返运似龙得雨可得厚财，偏财一样。"},{"n":34,"qianyu":"孙膑刖足被害","ji":"中平","jie":"病龙得雨，鱼折足之兆。生肖：猪","jieyue":"家宅：怪梦频频心事忧，因何利郎不堪留，但在自已行方便，常念难逃堕九幽，吉宅人口可得六甲喜，但防疾难口舌失财，皆因祖山不顺，宜查明修整，如家内有金斗寿木应速墓团结做善事。岁君：病龙得雨带远危，有病占身事未宜，变化升腾须有日，且宜守旧待明月。生意：今日切防盗劫财，交易出入莫贪闲，数目切勿信他人，刻苦经营祸可排。肖羊之可得大利，但防三、四、月歹人累劫，宜谨慎，数目自检防人不仁。谋望：未动未安势力衰，安排平地起风灾，晓君乐有拿龙手，弄巧反成拙事来，谋事可成但恐成后被人诱骗，歹人生端寄祸劫之，宜谨慎不可信直中直也。婚姻：婚姻一事在秋天，莫听旁人说到颠，要探香花仔细看，休教招错无头莲，婚姻恐不成，是媒人话不真实，是闲花野草，不可看错，应详细探明情况。出外：一事签文不美，恐防小人生端寄祸，不利外出宜守旧，在家乡工作则吉。开铺：之卦宜旧守经营，防是非口舌，防盗贼劫财，宜求佛祖令旗镇宅，有财利也。合伙：之卦恐防伙计三人四心，各有私偏，防歹人劫财物，勿合为妙，若合之恐亏本惹是非也。求财：春夏月跋涉防小人耗劫，不可以人担认，款项防累身宜守旧，六、九月有利入手，偏财勿取也。"},{"n":35,"qianyu":"刘皇叔过江招亲","ji":"上上","jie":"金雉衔赦，金鸡报喜。生肖：狗","jieyue":"家宅：檐前喜鹊叫三声，报汝今年百事成，官位日升财禄进，更依门户发光明，家门喜气盈盈，孕妇可产男儿，但嫌官非口舌失财灾火厄，是厝前受杀冲伤，宜求佛祖福灯吊门上祭化，早晚火烛小心，居住财丁昌盛。岁君：鸡鸣霄汉势冲天，万里程途任着鞭，官位自然财禄进，安居右庆庆时年。生意：今年生意可稀奇，春夏似鸟落毛时，六月开始至秋冬，鸟添羽毛任高低。春夏似鸟落毛生意阻隔，六月起至秋冬似海鹤添寿，可大发展能得大利。谋望：几年松下惜羽毛，不肯低头皆富豪，有日夺身腾碧汉，方知志气此时高。谋事初时有小人阻隔，不可急候，交秋冬事情便可成功也。婚姻：瑶台仙鹤惯牺梧，月里嫦娥岂有夫，惟子欲求佳偶配，及今春色上皇都。卜此婚事可成，不过初时有歹人说是非，但到底大吉可为长久相合之夫妻也。出外：一事签文叶吉，凡事勿疑，要有胆智，往于二、五月有贵人人重重也。开铺：之卦上春有阻隔，防小人祸劫，六月起转运，金鸡报喜可得厚财大利。合伙：之卦大吉，似金鸡报喜之兆，多人多福同心同德，协力经营可得大利。求财：正财如鸟换毛，美在后来凡事宜立胆智前进，二、八、十一月可得厚利，偏财初有阻，后有大利可得。"},{"n":36,"qianyu":"文王遇凤鸣","ji":"上上","jie":"如鱼化龙，凿石见金之兆。生肖：鸡","jieyue":"家宅：瑞气迎祥百事新，贵人相逢便相亲，秋冬小有淹留阻，春夏人财事事亨，吉宅人口之卦可得喜气临门，但签文有淹留两字，恐防夏月涉财是埕口秽气不净，宜经常修理清洁水道流通，居住财丁兴旺。岁君：鱼翻浪跳当三月，此身方起化为龙，他时得位方为吉，百事无忧方变新。生意：春夏财利小小来，逢上阳月路宏开，秋冬时节物涨价，生意经营得厚财。生意可得厚财，但恐上春阻隔少利，宜刻苦经营五、九、十一月有贵人，生意兴隆。谋望：先时一段报君知，秋后经营遂意时，若遇三阳开泰日，即知名利两相宜。谋事可成，但防初时有阻隔，交秋冬有贵人扶助，所谋各事定能成功。婚姻：天配良缘合两头，那堪相合更相谋，水清看见鱼游戏，好把丝纶下钓钩。天配良缘水清鱼戏，情意相投，婚姻定可成功，勿误时机。出外：一事身体虽平安，但有阻隔，可是应有胆智敢于前往，有贵人应心得想。开铺：之卦如鱼如龙之兆，春夏磨苦小利，新开铺定有小阻，但要有胆智经营，秋冬月可得大财利。合伙：之卦如鱼化龙之兆，合之可成，伙计宜同心同德，刻苦经营有贵人扶助，秋后有厚财利可也。求财：正财春夏秋小利，十月超至明年三阳日大吉利。"},{"n":37,"qianyu":"项羽困乌江自刎","ji":"下下","jie":"行船失楫，楚汉争雄。生肖：猴","jieyue":"家宅：无事何须出外游，恐遭灾盗反成忧，今日切防人口损，若见平安只在秋，吉宅人口有喜气可得，但防夏月疾难口舌，盗火失财，求佛祖奉经保平安，山坟不顺有利宜修整壮旺，请南天天帝香火镇宅居住可保平安。岁君：江水无船岂可通，波涛风浪急危饿，出入不宜须守旧，进这难也退无他。生意：防失守分心勿慌，交冬有利路不宽，偏财勿取取必失，求祷神力保平安。春夏财利跋涉，又防小人劫之，交易宜谨慎，稳重行事不可急性，八月起有利入手。谋望：天理于人岂自忘，见他富贵忽忙忙，伊君若要求名利，一旦乌江见汉王。做事虽是精通，但性情急，恐防阻失，宜用心窍智谋之，勿偏想秋冬月可成也。婚姻：眼下心事欲便成，岂知本命不相称，如今只要寻佳偶，且待黄河九渡清。时令未到婚姻难成，宜忍耐些时，皇天不负有心人的。出外：一事如行失楫之兆，恐防奔波小人累害，又防水厄宜守旧勿外出。开铺：之卦不美，如行船失楫之兆，未开铺勿开，若是老铺应防灾盗祸，非失财之厄，宜求佛祖保佑平安。合伙：之卦不美，如楚汉争雄之兆，勿合为佳，若合之伙计不同心恐惹祸非，口舌失财也。求财：正财虽有利可得，但恐小人阻隔，宜从正道，勿贪心妄想，勿迫性则获利不失，偏财定失凶也，勿取之。"},{"n":38,"qianyu":"哪咤出身后为神","ji":"上上","jie":"进身显达，大器晚成之兆。生肖：羊","jieyue":"家宅：君家明德合天心，些小淹留祸不侵，人口六畜休要说，平安二字值千金，吉宅人口舌签文有淹滞二字出现，恐防流泪破失，若有婚事可保无虑，是埕口水道不美，有利修整，初一吉敬拜天地平安可得财利。岁君：红日当天照破云，无愁不独众人钦，君子进身应显达，荣华富贵得安宁。生意：正道买卖勤经营，春夏可得小财经，秋冬时节有财利，肖马五八厚利升。生意取利叶吉，与人交易心地，宜从正道，五、九、十一月扩大经营得厚利肖马者更佳。谋望：天理人心两不亏，自然合道免生灾，公平感得神明佑，南北东西任所为。卜谋事宜从正道，不可亏人，交秋月各事称心如意，定可成功。婚姻：鸳鸯飞入凤凰窝，莫听旁人说事破，自是姻缘天配汝，两人相笑白头过。婚姻可成，但初时有小人破说，双方勿认以为真，可到白头皆老生子传孙。出外：一事身体平安，但闲事勿近，宜从正道，有贵人扶助，可得名利双全。开铺：之卦叶吉，如大器晚成之兆，要公平正道经营，不可亏人，秋后可得厚利，肖马者更妙。合伙：之卦叶吉，肖马者更妙，如大器晚成之兆，伙计宜同心同德，刻苦经营，秋后有财利可得。求财：正财取利叶吉，宜从正道，不可亏人，宜谨慎勤奋经营五、九、十月亨通得厚利，肖马者冬月大胜，偏财定失。"},{"n":39,"qianyu":"司马懿入葫芦谷","ji":"下下","jie":"白虎占度，久客他乡之兆。生肖：马","jieyue":"家宅：畜产无灾人眷旺，无端怪声乱黄昏，如今好问秋成后，早把门庭依旧关，人口兴旺者可得喜气，但防产妇月内危险期，及夏秋月祸非六畜，是门字分金及水道不美，查明之有利宜修整并作过灶君，向佛祖保平安。岁君：忽入深山去路迷，不知何处鹧鸪啼，进退出行皆不利，切须慎防暗中欺。生意：偏财一点不能来，夏月守旧没贪财，诚心诵经求神佛，交秋冬月利路开。初做平，防阻失勿贪心，防小人耗劫，宜谨慎重谋为，秋后可得厚利。谋望：走遍天涯事不成，事成又着一场惊，不如守分随时过，春到人间草木荣。谋事初时，有小人累害劫财等惊阻，宜谨慎用心窍胆智，交小阳可成也。婚姻：栽种芝兰意欲芳，谁知草木怕经霜，如今若得成姻眷，进余进房不长久，芝兰虽芳但恐经霜，婚姻虽免强成之，恐怕不长久，非尔姻缘切勿谈之。出外：一事不美，做事恐有阻隔及小人累害，宜守旧在家经营，则可无忧无虑也。开铺：之卦铺宅离家乡远的勿开，恐防有祸非失财盗窃之危，铺宅在家乡的初有阻涉，勿灰心，秋后可得利。合伙：之卦如白虎占度之兆，凶多吉少，勿合为要，若合之恐亏本，失利惹出祸非也。求财：上春财利小，防小人劫之，宜守旧经营，谨慎稳重，冬月可得财利，肖虎者得大利，偏利失也。"},{"n":40,"qianyu":"夏国美进场","ji":"上上","jie":"桃李芳菲，剑射斗牛之兆。生肖：蛇","jieyue":"家宅：忧疑无虑也无凶，闲愁莫把挂腹中，赖得福神阴力阻，门庭喜气两三重，吉宅喜气盈门，但嫌主事人操心劳累，夏月疾难口舌，肖牛之人防生痛涉财，是因为折虎畔迫塞，宜立八卦安门上抵挡，向佛祖保平安居住财丁兴旺。岁君：鸣鹄冲天得自然，逢时喜气志昂轩，此日升平得自在，翰翔直上九重天。生意：购货防阻切莫贪，偏财无望不可攀，春夏恐防有阻失，交秋冬时力路宽。生意初时阻，失财利小，但宜立志维持五、九、十一月返运，生意旺可得厚利。谋望：失群鸣雁在东西，岂有相逢任飞时，今日脱尘云外去，只留声阶此人知。谋事可成，但防初时有阻隔，候九、十月有贵人扶助定可成功，肖牛者谋之不美也。婚姻：生前虽定自家人，今日相逢又定亲，争奈姻缘时未至，且宜缓缓待寅申。前生注定有缘份，但初时有阻，有人破说，宜向南北斗星君于九、十月定亲。出外：一事叶吉，时令当权，凡事勿疑，大胆出外谋生，有贵人扶助，名利双成。开铺：之卦春夏恐有阻失，防祸非灾厄，宜用心窍刻苦经营，秋后生意兴隆，有大财利也，肖牛者定失。合伙：之卦宜同心同德协力经营，伙计要大公无私，大家出谋献策，有大财利可得。求财：初时利薄，阻隔宜立智维持于三、五、十一月得厚利，偏财初有失。"},{"n":41,"qianyu":"姜承祖遇害","ji":"中平","jie":"落花流水，螳螂捕蝉之兆。生肖：龙","jieyue":"家宅：鬼怪无端入户庭，响声入梦怪人惊，要知因甚人财蹇，只因家庭路不平，吉可得喜气，但防夏秋月疾难失财口舌火厄，向佛祖保平安，厝前受火烟杀冲伤，用八卦符安门上修整水道，祖上香灯拜到居住财丁兴旺。岁君：落花流水两无情，家合惶惶主不宁，小中阴人招疾厄，须当急祷旺宗神。生意：意外之财不可寻，春夏有阻莫贪心，正财少利偏财失，慎防小人劫财金。生意上春防阻失，防小人偷劫，宜守旧业，交易要直勿贪心，交冬可得财利。谋望：当初有意望东楼，既抵蓬来下九洲，不肯回头归去路，即交埋没入荒丘。谋事防人暗算，宜谨慎勿，防口舌失财之祸，心地宜从正道，其事可成。婚姻：休想斯人入汝家，莫教惆伥怨吁嗟，落花有意随流水，流水无情恋落花。此婚事不成，男求女不就，女求男莫恋，流水无情，不能结合也。出外：之卦美中不足，防小人祸害，心中操杂，往之不成，宜在家经营免生祸非。开铺：之卦君心地，宜公平正直，不可亏人勿惹口舌，勿积货防劫厄，宜求佛祖令旗合财帛星君镇铺宅。合伙：之卦如落花流水之兆，时令不吉，勿合为要，若合之，恐惹祸非盗劫失利。求财：正财初时有阻，防小人劫之，经营从正道交秋冬月转运，可得利，偏财莫取。"},{"n":42,"qianyu":"唐天子得国公","ji":"上上","jie":"如鱼得水，囚人遇赦之兆。生肖：兔","jieyue":"家宅：今年喜庆事如何，人口无休畜产多，秋去冬初些小悔，更祷神佑保融和，吉宅气临门，但恐防九、十一月疾难口舌，阻六畜火星小心，宜求本境地头老爷保平安，是埕口水道不美，宜常修清洁居住财丁昌盛。岁君：鱼游出水戏波浪，跳跃优游非等闲，喜逢泰来万事吉，更无阻险在其间。生意：如今得志上青云，谋望求财总遂君，秋末冬初利更重，偏财夏阻冬成堆。现年生意兴隆，但防夏月亏本、五、九、十一月如鱼得水，有贵人可得厚财利。谋望：地冷天寒水作冰，安心守志待仓清，如今正遇阳和日，四海优游任往行。谋事初阻挡不称心，须立志坚持，候交秋月有贵人扶助定可成功。婚姻：天设良缘两相宜，如鱼得水戏河池，此时若得成连娌，那堪相许也相依。天配良缘如鱼得水，立时可成定能同心同德，白头皆老。出外：此次出外叶吉，但嫌心意未定，应有胆智前往三、五月有贵人扶助，可获财利。开铺：之卦如鱼得水之兆，春夏月防祸非失财，秋后转运否极泰来，有厚财大利。合伙：--求财：正财上春跋涉，宜立志维持，谨慎谋之，候五、九、十一月如鱼得水，有厚财利可得，偏财也财样，但不能贪也。"},{"n":43,"qianyu":"仙姬送子","ji":"上上","jie":"蛟龙得雨，谋望遂心。生肖：虎","jieyue":"家宅：福星高照汝家门，些小忧疑不必论，欲安稳时财禄足，神前多把好香焚，吉宅可得财喜，但防夏月口舌疾难，主事人操心劳烦，是厝前受杀冲伤，每逢塑望两日，应拜天地保平安，并求佛祖令旗安门上祭化平安。岁君：日出扶桑万处明，贵人吉庆事皆亨，求财谋望皆如意，若问求官司定得名。生意：劳心吃苦是春时，夏季也是利丝丝，货物大胆停留下，交冬出售得厚长。生意经营上春磨苦，财利稀秋后转运，如龙得雨，生意旺相，可得厚财利。谋望：几年辛苦三更起，以为生平名利中，喜得太阳东海出，光明无处不亨通。几年来谋事劳累双不成就，现年万事亨通，有贵人扶助所谋成功。婚姻：平生喜得自投机，正好成亲送聘仪，相爱相求无别事，勿言贪富及高低。男女双方情投意合，不言富贵荣华，可以下聘成亲平安大吉，白头皆老。出外：时令合局似得雨，前途远大，于三月起大胆往外，有贵人扶助平安。开铺：之卦初有小阻，要用苦力维持，秋后开之生意兴隆，肖龙者谋望遂心得大利。合伙：之卦为龙得雨之兆，若伙计肖龙者，定能得厚利，余人秋后也能得利也。求财：正财大得利，但上春还小，宜苦力坚持，交五、九、十一月转运，似龙得雨，可得大利，偏财有阻，肖龙者得大利。"},{"n":44,"qianyu":"孙策怒斩于吉","ji":"中平","jie":"乌云盖月，沙里淘金之兆。生肖：牛","jieyue":"家宅：欲求香火福神旺，百事无侵耳目端，春夏欲知唇口事，秋冬人口得平安，吉宅防四、五、九月疾难口舌失财，男妇生端宜团结和气，则家道可圆，是由久年香灯神恩太重，宜改谢请上香灯拜到居住财丁兴旺。岁君：乌云遮月暗朦胧，暗昧门庭事未通，且宜守旧方为吉，直待云开万事通。生意：春夏何必枉用心，用尽心机难得金，若得福神来添力，秋冬财利也非轻。生意似沙里淘金，春夏利小阻隔，交秋后转运得利，肖己戌者宜现买现卖，用苦力定得厚利。谋望：秋后冬前欲利交，机关用尽不能成，君能守得阳和日，雨散云开月自明。谋事初时有小人累害劫财，宜谨慎，用心窍胆智交小阳谋之成也。婚姻：天配本是凤姻缘，免把旁人说短长，急慢迟延日过日，勿使琵琶向别船。婚姻成之，但必从速下聘迎接，因有小人破说，如若迟疑恐不能得也。出外：之卦上春时令未谈通，有小人阻隔，交秋厚转运有贵人扶助，出外平安也。开铺：之卦似沙里淘金之兆，上春磨苦小利，注意夜间勿运行，秋后云开明可得财金，肖蛇狗者勿开。合伙：之卦肖蛇狗者勿合，余人合之则吉，但春夏磨苦小阻，秋后月明可得厚利。求财：正财如沙里淘金，春夏磨苦跋涉，宜刻苦勤奋工作，冬月可得财利，偏财不得硬求失也。"},{"n":45,"qianyu":"罗成娶妻","ji":"上上","jie":"万物萌芽，蟾宫折桂之兆。生肖：鼠","jieyue":"家宅：门冷户衰百怪生，人财两散梦魂惊，如今君问平安日，庶民人口进财丁，人财冲冠，防疾难破财是非火盗，男女不和，兄弟分居，宜求佛祖保平安，又嫌门字灶君分金不美，宜修改合课居住财丁昌盛。岁君：风雷鼓舞播乾坤，万物萌芽尽发生，如今君问平安日，待至秋冷月又明。生意：凡事通灵营生意，春夏似月云遮去，秋冬贵人相扶助，借力谋财好局势。按旧来经营恐有阻失，要创新业防初时亏本，要和人合伙移他人福，可得厚财。谋望：本是聪明特达人，恰似明月云遮清，等闲借得东风力，吹去浮云又复明。谋事初时时运未通，防小人阻隔，但又有贵人重重，交三、五月成就，肖牛者更妙。婚姻：本来婚姻要团圆，无奈旁人说乱言，迟定不如早定好，管教男女共完全。有一对好姻缘，但有小人破说，不要乱听闲言宜速定配，成之大吉。出外：一事签文虽安然，但嫌心意未定，要有胆智敢往，五八月有贵人重重。开铺：之卦得鲤鱼，看君的才能，上春恐有阻失，秋后有贵人扶助，能上蟾宫折桂，可得厚财利。合伙：之卦叶吉，如万物逢春之兆，宜同心同德，协力经营，秋后可得厚财利也。求财：正财上春利薄，宜立志气维持，秋后转运有厚利可得，偏财要托他人之福，要忍口舌是非。"},{"n":46,"qianyu":"刘邦斩白蛇","ji":"下下","jie":"恶星占身，新月朦胧之兆。生肖：猪","jieyue":"家宅：家内作怪假疑真，无端思梦又惊人，要知因甚为多事，只为伊家少福神，喜气临门，但防六、九、十二月口舌祸非失财，地灵不旺，灶位不美，宜择吉日修整安灵，谢土地神向佛祖奉经保佑合家平安。岁君：虫蛇入梦主忧疑，慎防家门口舌非，将来运遇方为吉，进退如今未遇时。生意：正二两月守旧框，四九两月小人防，三心二意财难得，偏财勿取正财攀。做事不可三心二意，宜守旧业，四、九月防小人累劫，秋冬可得利，肖羊之人不可原业经营。谋望：心南心北尚迟疑，成否如值未遇期，名利要求非此日，宽心宜守待明时。肖牛之人谋之定成，余者阻挡生口舌，若肖猪犬龙之人勿谋之，原业免生祸非失财。婚姻：婚眷无缘岂易逢，也难进退两三重，从来勉强成婚事，只恐相逢在梦中。婚姻不成，成之无用，非远计也，如果是失夫的可娶。出外：之卦恶星占异，不可往，往之有小人祸累，宜从旧业勤谨工作，可保平安。开铺：之卦不美，如新月不清之兆，防四、六、九月阴失，宜立财帛星君镇宅，求佛祖保平安。合伙：之卦不吉，有恶星占身，有小人祸害，勿合为要，若要合之，恐惹祸非破财，后悔莫及也。求财：偏财至切不可取，取之有祸非，正财宜守旧并忍口舌，勿三心二意，须立智经营，交六、八、十一月可得中财利。"},{"n":47,"qianyu":"许宁祖平番","ji":"中平","jie":"密云不雨，雨湿桃腮之兆。生肖：狗","jieyue":"家宅：门庭暗昧鬼邪多，人眷惊忧乍奈何，若要平安须祀祖，将身快去念弥陀，吉宅人口有喜，但防六、九、十二月疾难是非失财，肖牛之人生痛疾，是厝前受杀冲伤，宜安八卦抵热挡，向佛祖诵经，并修祖山财丁昌盛也。岁君：密云不雨天边暗，却主忧疑事可防，更慎小人来害已，门前暗昧有惊烦。生意：夜间怪梦惊心头，劫财抢物乱一遭，春夏两季宜守旧，秋冬两季财利高。生意防小人耗劫，春夏月勿贪心，秋冬月有小阻，但有厚利得，宜向天地化吉。谋望：否极泰来理自然，莫交运用灾牵连，时有借得东风力，吹去浮云见碧天。谋事肖牛之人有阻失，切勿谋之，余者候，交秋冬月有贵人扶助，定可成功。婚姻：前缘已定枉心亏，从然求得有官非，此处无缘难着聘，何劳注意痴心为。此婚姻不成，若成之有官非口舌，不要枉费心机，君非孤寡辈无须忧疑。出外：一事上春时令未同，恐有小人阻失，交秋冬月可前往，有贵人扶助。开铺：之卦如密云不雨之兆，交易数目宜谨慎，防歹人劫财，秋冬月有财利，肖牛者定失也。合伙：之卦为密云不雨之兆，又有牛尾两旁开之句，失字当头，有恐有歹人盗劫，勿合为要。求财：上春正财不利，八月得利，肖牛者无利也，偏财勿取，取定失，肖龙虎之人忍口舌，取之得利。"},{"n":48,"qianyu":"黄野仁遇仙","ji":"大吉","jie":"金蝉脱壳，九转丹成之兆。生肖：鸡","jieyue":"家宅：凶杀已去福神来，忽汝家中大发财，此际管教人物旺，秋冬百事真和谐，凶灾当头，春夏人口奔波，疾难是非多，失财是厝前受杀冲伤，宜求佛祖令旗安门上，祭化保平安，若有喜凶灾可消除。岁君：宝镜新磨复见光，四方照耀任行藏，成名久有根基在，润色增光声播扬。生意：此卦求问生意经，历时凶险已消清，如今借得东风力，生意兴隆财利升。数年苦力财利难得，现岁凶险消除无阻，立冬后有厚利，肖龙之人更有财利。谋望：百炼千磨方得醇，几年静坐做闲人，如今借得良工力，富贵相逢白色新。谋事防春月有阻，交秋冬月宜用苦力，自有贵人扶助，凡事定能遂心。婚姻：重整衣裳衣色新，相思比做自家人，从来只说人才好，低恐人心又染身。重夫娶之大吉，正配难成，一方有恋一方无心，正如流水无情恋落花。出外：一事有贵人重重，在三、五月出外，但平安而且东成西就，有厚财利可得。开铺：之卦为九转丹成之兆，老铺数年来波阻已过，今年可得厚财利，新开铺宜用苦力经营，冬月有厚利。合伙：之卦叶吉，为金蝉脱壳之兆，除有波阻，伙计宜同心同德，协力经营，秋后有大财利，伙计有肖龙者更妙。求财：正库取财初时利薄，宜加苦力维持于五、九、十一月交运可得利，偏财肖龙之人得之，宜忍口舌。"},{"n":49,"qianyu":"孟姜女哭倒长城","ji":"下下","jie":"柳絮遭风，风扫落叶。生肖：猴","jieyue":"家宅：口舌无端从地来，只因家中有悲哀，归来及早求神佑，合宅如今不受灾，吉宅人口各宜忍口舌，防是非破失，小孩子夜闹，有喜可改化，宜向福德老爷保平安，门字灶君不旺有利宜修整。岁君：群鸦集噪不为奇，慎防家门口舌欺，退步之时方见吉，若然进步主忧疑。生意：货物购售须认真，要防小人劫财金，生意经营宜守旧，数目还防人不仁。恐防亏本和小人耗劫财帛，交易莫信忠直，防人不仁，出入货物要谨慎，钱财勿寄人。谋望：百炼千磨不得齐，心猿意马走东西，鹊巢作成乌鸦占，只为君家命运低。业务虽精通但性急迫，做事不成，防歹人累恐失也，宜守忍。婚姻：本听旁人说事狂，野花那似菊花香，自有良缘来配合，莫认乌鸦做凤凰。君命非孤此时非缘，等待时运，自有良缘婚姻，渐不成是野花看错。出外：一事身体可平安，恐防小人波阻寄祸，凡事宜守旧经营则免生愁。开铺：之卦似风扫落叶之兆，未开者勿开为妙，已开之铺恐防风火厄，小人劫财，求佛祖化吉平安。合伙：之卦似花木遭风之兆，勿合为佳，若合之，恐伙计不同心，小人劫财亏本失利也。求财：正财库取利虽有得，但防小人盗窃，恐失之，不可贪心妄想，宜从正道得则可安，偏财切不可取。"},{"n":50,"qianyu":"唐僧取经","ji":"中平","jie":"乌云盖月，禅门出法之兆。生肖：羊","jieyue":"家宅：人口平安赖佛恩，四处生涯任意勤，年来春夏经营好，勿贪歧路起猜心，吉宅人口虽有喜气可得，但防口舌是非，男女不和，生意可为但不可贪，作物昌盛，埕口水道秽气，要时常修通，请上帝灵符贴保居住平安。岁君：行藏水陆有虚疑，可虑忧疑不可欺，今定所谋前等事，劝君他去莫迟疑。生意：春夏阻失莫贪营，偏财莫取正财宁，待秋冬到可得利，正直守分财利兴。时运不通，春夏月防歹人害劫之，习卖宜正直守分，交秋冬月便可得利。谋望：几年学道讨前程，岂料中途恐虚惊，千万鬼怪俱降伏，秋风清处月光明。谋事可成，但初时防歹人阻隔，宜用小利帮助有吉星拱照，定可成事。婚姻：婚姻急速可为期，赖慢依然有所疑，只是小人言不定，说合成来乍许辞。婚姻宜急速说合下聘，则可成功 ，若迟延不成，是小人乱言也。出外：一事上春未得运，恐防阻失，小人累害，宜守旧候，交秋后往之平安。开铺：之卦似乌云盖月之兆，上春阻失，恐防小人劫财，交秋月明，努力经营可是财利。合伙：之卦似乌云盖月，伙计三人四心，各有私偏，勿合为妙，若合之，恐亏本破财。求财：正财上春利薄，又防阻隔涉财，凡事宜用心窍，守旧经营，交秋月逐渐可得财利，偏财勿取，取定失之。"},{"n":51,"qianyu":"全福签","ji":"上上","jie":"不成转喜，逢凶化吉之兆。生肖：马","jieyue":"家宅：卜吉宅人口求佛祖不诚心，阳宅龙运不旺，灶前污秽，浴盆冲犯帝君，恐防九、十月有灾难破失，常时灶前宜清净，上诸圣神容宜重壮光彩，常时诚心待圣，宜向佛祖送经奉油，可消改水厄，福即来临财丁兴旺。岁君：小孩根苗足养，有旺益上人并茂，虽有小疾无妨，吉星守命平安，小女根基足养，夏月虽有小疾无妨，吉得守度，旺益上人平安。生意：卜现年生意，恐防君办事烦劳操心，恐防歹人累害寄祸，交易谨慎，切勿贪心，宜守旧业，刻苦经营维持，向佛祖奉经添油保生意兴隆，可得大财利。谋望：卜谋事之卦初有，有小人之阻，并防劫财祸非，宜忍口舌，向佛祖诵经添油，有贵人扶助，时运显达可成功。婚姻：自古婚姻定良缘，此卦定卜财喜签，财喜登门有微阻，送经运至得团圆。婚姻之事定成，宜送经添油至佛祖，可化凶为吉，定卜财喜双至也。出外：之事恐尔不全心以待，心坚者，宜向佛祖奉经添油，以全心愿，但肖猪狗之人切勿想成，非非此念必绝。余人可往有利。开铺：之卦恐防初时小人无端生祸劫财，宜守旧经营，向佛祖添油奉经，消灾改厄有财利。合伙：之卦初时恐有隔，伙计宜同心同德合力经营，向佛祖送经奉油，可得财利。求财：正财春夏有阻，失磨力勿贪偏财勿取，向佛祖奉经添油，二月小利。"}]
