  qian:[{"n":1,"no":"第 1 签","ji":"甲甲 大吉","jieyue":"此签谋望事绪，无不遂意，但各有所主，官员占此，有超越之喜，士人有功名之庆，占前程者，福寿绵长，占事业者，根基稳固，若谋望求财，多主有名无实，为语多空虚也。","jie":"犹如平步青云，一切皆可如愿实现，不论是福、禄、寿、喜，都能圆满，并且有超越的现象，可拔得头筹。自然而然地就能享有荣华富贵，这都是上天所给予的恩惠，所的恩泽相当浩大，福气如海之无涯，寿如山之隽永，必须懂得珍惜。可说是得到了天时的配和，只要再加上地利及人和，则无往不利，是上上签。"},{"n":2,"no":"第 2 签","ji":"甲乙 上吉","jieyue":"此签前运不佳。前事蹭蹬。自此以后。渐见顺利。若问究竟归结。全在存心种德。方得成实。倘值境遇遂意。顿忘前因。暗损心术。必至有始无终。自贻后悔。勉之慎之。","jie":"曾经遇到不顺遂的过去，到现在也该是转运的时候了，之后会渐入佳境，但不可因此而骄纵。如能从心做起，随时随地都能发出善的念头，积累福荫，必会有美好的未来。此签的重点在于心里的想法，如能以善念出发，必能排除万难达成目标，但如有偏斜的歹念，则会为自己招来厄运，不可不慎。"},{"n":3,"no":"第 3 签","ji":"甲丙 中吉","jieyue":"此签只宜守旧。不可贪求。但存中直。却得两平。须以孝悌忠信为本。自有福禄来成之应。若思强取强求。反招意外之祸。占者循理守分则吉。","jie":"人生自然该有的衣食住行，在冥冥中自有定数，该吃多少、该用多少，都有一定的份量，不可太过强求，如果一餐吃一碗饭就饱了，一时贪心吃了两碗，也只有苦了自己的肚子了。如果能从人伦的孝悌做起，对上尽忠，为人诚信，相信福禄自会天成，祸患与你无缘。此签重在自我的修养，谨记孝悌忠信，则必能去灾解厄，吉运自现。"},{"n":4,"no":"第 4 签","ji":"甲丁 下下","jieyue":"此签吉事已去。凶祸将来。官事临身。是非自至。凡事谋望不成。求财交易不就。所为皆不利。急宜祈祷神明。积德回天。庶不致贻后悔耳。","jie":"去年的运势相当顺遂，几乎想做的事都可以成功，相较于今年，则出现了明显的衰运，这就是人生，可见的厄运是无法避免了，该如何将伤害减至最低呢?不如诚 心的祷告神明，以诚挚的心焚香膜拜，如能得到神佛的帮助，则能转危为安、转祸为福，若无真心祈求，祸患无法避免，将后悔莫及，还是尽早修为吧!"},{"n":5,"no":"第 5 签","ji":"甲戊 中平","jieyue":"此签先忧后喜。见在主意不定。进退无据。景况甚为冷落。等子丑交承之际。远应年分。近应月日。自有更新气象。如春来万物发生。此前大不相同。凡事待时。终有成就。","jie":"此时的你是万事都无法随心所欲，就算是连最简单的沟通，都是词不达意，连朋友都忘了有你这个人的存在，可说是冷到了极点。厄运总是会结束的，只要过了子丑的交接转换，就会有美好的未来，会犹如春天的来到，将不必忧愁，此时只是日出前的黑暗。子丑交换最久可能是鼠牛年的交换，也可能是鼠牛月或鼠牛日的交换，不论还要多久必须忍耐，迎接美好的未来。"},{"n":6,"no":"第 6 签","ji":"甲己 下下","jieyue":"此签谓之阳为君子。阴为小人。须防有面是背非之人。从此簸弄。彼此怀疑不信。前此浓情。今已中变。何用私意系恋。自取烦恼。凡事拨开迷妄则吉。","jie":"虽然你以很热忱的心与人交往，但对方却是个里外不一的人，看起来和你是那么近的距离，但却永远也无法知道对方在想什么，显得相当陌生。如果你还陷在过去的浓情蜜意之中，将自己沉浸在过去，将万劫不复，因为彼此已经产生了怀疑，倒不如就此放下，不必再为此事或此人努力，或许伤害就到此为止，及早清醒才是。"},{"n":7,"no":"第 7 签","ji":"甲庚 大吉","jieyue":"此签贵人占之。有荐拔之喜。仕人占之。有飞腾之兆。庶人占之。有百倍之利。方外占之。有仙升之期。病患占之。有医药之缘。亦恐有正应反应不同。占者审之。","jie":"比别人幸运的是天生就有道缘，而且又遇到高人的指点，可以很顺利的寻得求道之路，而且可以一路顺遂，得到不错的成就。此签又可解为求医者可求得良药，但又有仙升，即作古升天之意，故求签者要小心处置。此签虽是大吉，但除了以上所提之事，对其余事情几乎都无任何影响，所以不可全部判断为大吉签。"},{"n":8,"no":"第 8 签","ji":"甲辛 上上","jieyue":"此签宜安常守分。前虽困顿。今渐有成。譬如田畴。既有荒歉。亦有丰收。幸处光天化日之下。农工商贾。共享升平。何忧之有。凡事安享自然。时日以秋季为断。","jie":"过去的努力似乎都没有收获，只要再持续下去，今年必定会有结果，而且是不错的回收。田里的收成，完全要靠老天爷的帮忙，适逢风调雨顺，得以丰收，各行各业也因此而有所斩获。此签表示即将有所收获，不管之前有多么不顺遂，到此又是另一番景象，要好好把握，也表示以前的努力，现在才开始要回收，将会有美好的未来。"},{"n":9,"no":"第 9 签","ji":"甲壬 大吉","jieyue":"此签谋为之事。旦夕喜信。若问行人。旦夕即至。婚姻和合。疾病回头。士子科名捷报。仕宦得位超迁。叩问运程。即见好消息也。","jie":"对于期待已久的消息，已经等得快要不耐烦了，然而在突然间却得到好消息的传来，令人喜出望外，不禁喜上眉稍，一切的辛劳都有了回应。表示经过了长时间的 等待，终于有了好回报。此签表示要发挥极大的耐心，不可因暂无消息而放弃，只要能持续以待，必得好的佳音。"},{"n":10,"no":"第 10 签","ji":"甲癸 下下","jieyue":"此签大意晓然。凡有前恶。须宜求神忏悔。若问病讼。冬至后方可。不然莫解。若作非为。祸患立至。占者守分修省可保。","jie":"目前的运势相当不好，如是问病，必是久病不愈，短时间内不会好转。就算是求神问卜，也是无济于事，不如相信上天的安排，冥冥中自会有所变化。运势必须到冬至时才会好转，而且会有很大的变化，此时宜平心静气地等待好运的到来，若不相信天理的安排，一意孤行，则必会招来厄运，谨慎而行。"},{"n":11,"no":"第 11 签","ji":"乙甲 下下","jieyue":"此签先吉后凶。先实后虚。先热闹后落陷。先稠密。后妒害。识透机关。须是平气忍受。善自解脱。不可急躁生事。更加缠缚。独立伤神。明是小人结党。君子守正。孤立无与。静以需之。困可亨。否可泰也。反此则凶。","jie":"今年开始就好事不断，甚为顺遂，而且显得光鲜亮丽，但是人生事事难预料，世事变化无常，受到小人的设计及陷害，让人暗自神伤，但这是考验君子的时候，如果你也和对方一样耍诈，那你和对方又有什么不一样呢?此时应该静下心来，不好的运势，如何抵抗还是不好，倒不如等待好运势的到来，终有否极泰来的时候。"},{"n":12,"no":"第 12 签","ji":"乙乙 中平","jieyue":"此签几番谋望。事与愿违。屡次相左。然遇合有定。须在近江之地。或水旁姓名之人。必有格外投契。一味靠着此人。可保生计安全。此当关系夙缘。不可以有意求。只可以无意遇。莫之为而为。莫之致而致。静。以俟之可耳。","jie":"看似美好的计划，但总是无法成局，在反反覆覆之中，总无定见，这表示时机未到，就算勉强行之，也只能以失败收场。会有一个机缘来改变这一切的衰运，如能遇见住在水边的人或是姓名有水部的人.才得以改运，必须是在无意间遇到的人，刻意认识是没用的，此人将对你的下半生起了极大的变化，几乎会以对方为主导了，从此没有生计上的疑虑。时机到了此人必会出现，不可强求。"},{"n":13,"no":"第 13 签","ji":"乙丙 上吉","jieyue":"此签现在时运未济。且须安静耐守。如彼江头钓翁。何等闲散。宜待卯年月日。大有发迹。士子是时科第。仕宦是时升擢。商贾是时财利。定有高压万人之势。未可以泛常论也。","jie":"目前的时运不佳，适合安身乐命，倒不如学习钓鱼的人，只要一份安闲，不须呼朋引伴，自在地享受那一份安静。快则卯月日，慢则卯年，会有大发之迹，必会成为各行各业的龙头，仕人升官、农人丰收、商人大利，而且会有万人之上的名声，而非一般的泛泛之辈，要好好把握，目前的等待是为了明日的成就。"},{"n":14,"no":"第 14 签","ji":"乙丁 下下","jieyue":"此签先喜后忧。不宜放肆。大概亲而又疏。合而复离。历涉险阻。竟无成就。兢兢业业。庶免后悔。","jie":"见到面貌姣好的女子，对其有好感，但经认识之后，却受到对方的百般刁难，大都是因为对方嫌弃你的条件，当然也包括了财力的不足，这种世间冷暖你会觉得讶异，其实只要是经历过重重险阻的人，才会真的相信并非所有的路都是那么好走的，如遇到险恶的路程也是正常的，不如先自我评估过后，再决定要如何做，只要小心行事，必能减少伤害。"},{"n":15,"no":"第 15 签","ji":"乙戊 中平","jieyue":"此签现在谋事。甚不相宜。看似机缘。终竟反覆。即宜舍此另图。自有好处。春间定得信息。如婚姻前定。自然和合。只可待时。不可妄为。时至自得成就耳。","jie":"看似门当户对的两人，却不是谈姻缘的好对象，就算是强求也不会有结果，可能还会有反效果，倒不如先放下求亲的念头。当春天来临时，会另有好消息，而且是门好姻缘，这是桩好婚事，而且是天注定的，只要慎重行事，等待时机的来临，佳偶自会出现。"},{"n":16,"no":"第 16 签","ji":"乙己 下下","jieyue":"此签不利讼事。以和为贵。凡事虚悬无着也。犹疑不定。皆宜停止。恐有傍人怂恿。不可听信。唯有商谋亲密之人。骨肉之际。庶可免忧患耳。门内参商者宜戒之。","jie":"此时如遇诉讼之事，将无法得到有利的结果，若能求和，甚至退隐山林，必能将伤害减至最低，当然你的心中会有忧虑和怀疑，不如在此都放下，才是最好的决定。会有身旁的人加以怂勇，千万不可相信，此时只能找自己的亲兄弟或亲信之人商议，而且不可走漏消息，应想办法让自己全身而退，不可再留恋了。"},{"n":17,"no":"第 17 签","ji":"乙庚 下下","jieyue":"此签示人当依本分平等。凡事再三筹议。不可涉讼。讼则终凶。若恃财势贿嘱。或情面请托。虽侥幸一时之胜。终必欺心害理。不免子孙之受报耳。占者戒之。","jie":"凡事在商场上，必须凭着公平及真心，不可仗势欺人，刻意剥削他人，如将事情闹上公堂，将对自己不利，甚至两败俱伤。緃使利用手段而获胜，也不是真正的胜利，公理自在人心，天地神明都看到了，其祸害将殃及子孙，所谓“不是不报，只是时候未到”，要深思。此签表示你经常违背常理行事，对私德有所损伤，怕会伤到后代，要小心谨慎。"},{"n":18,"no":"第 18 签","ji":"乙辛 中平","jieyue":"此签不宜妄意求谋。有名无实。只是空华。何用贪痴不已。不如按部就班。脚踏实地行去。内存善心。外行善事。将来自有善报。较之无益之求不已远乎。","jie":"现在所想的美好景象，都是虚空的，而且是不切实际的，如果再一味地空想，将使自己陷入无底的深渊，倒不如脚踏实地，一步一步地踩稳，忘却过去的空想，多做善事，自然会有好的回报。此签表示目前还是耕耘的阶段，或许会很辛苦，但累积汗水，自会收获甜美的果实，只要一心向善，方向就不会错。"},{"n":19,"no":"第 19 签","ji":"乙壬 上吉","jieyue":"此签不问贵贱。皆主谋为和合。年运亨通。从前阻滞。一旦称心。凡动皆主有成。不须疑虑。","jie":"在求得此签之前凡事皆不顺遂，然而从现在开始，运势好转，不论是求什么，几乎都可达成，尤其是求姻缘及子嗣方面，更是会有好结果。过去的不如意，都可以抛到脑后。对于顺利者，或许没有太大的感受，但对于原本失意的人，此签更是灵验，要好好把握良机，不可错过。"},{"n":20,"no":"第 20 签","ji":"乙癸 下下","jieyue":"此签主同心无人。孤立少助。险难在前之象。既经指示。宜早提防。然大势已去。难可挽回。不啻流水浮云之变灭。唯有达观排遣。斩断利锁名缰。毋复系恋。更生事故。占者悟此。则知患难中玉成不少。或又有困而得亨之日乎。","jie":"虽有满腹的心事，但总是没有一个可以倾诉的对象，一直以来都是挫折重重，未来所要面对的路途，也是惊险万分，这一切只能往自己肚里吞。人生世事难预料，对于遇到的不幸，只能让一切付诸流水，不要有太多的计较或留恋，想要等待富贵功名，似乎期待只能落空。此签虽然表示不好，但若能因事先知道而加以预防，或以平常心看待，则会较能释怀。"},{"n":21,"no":"第 21 签","ji":"丙甲 下下","jieyue":"此签系冤仇缠结。讼事最凶。急自耗财。和解为妙。贵人占之。谨和处世。多行善事。免遭凶祸。平人占之。求神忏礼。迁善改过。可得人口平安。一切谋为。均宜回心向善。乃可逢凶化吉。冤家宜解不宜结。明者悟之。","jie":"或许过去因故与人结怨，而这些过节会因现在的相遇而发生冲突，对方也许会因此而有报复的行为发生，此时必须多诵念经文，将这些福报回向给家人，尤其是家中的女眷，对方会针对家中的女性加以报复，只要一心向善，不可恶言相向，则可逢凶化吉，事发时机可能会是月圆之日，要多加小心注意。"},{"n":22,"no":"第 22 签","ji":"丙乙 上吉","jieyue":"此签主潇洒出尘之应。谋望须清高门路方可。一切财利尘俗事。不甚相宜。功名可许。当主翰苑清品。问孕恐涉空花。问病者。有意参玄学道则吉。佳世之人。亦恐辞座之忌。语皆着空故也。","jie":"池中白莲有出污泥而不染的清高之象，高贵清严的外表更是自然天成，但也有孤立清高之意，虽煞白天是欣欣向荣的感觉，但到了晚上，则所有花都休息了，有无法持久的意思。天生与众不同，在别人眼中是相当特异独行的，如果是高官贵族，则此签有荣升之意，如果是一般的平凡百姓，表示口出空言，只有表面好看，其实内在相当空洞，要注意。如果是修道之人，则得道之日已不远了。"},{"n":23,"no":"第 23 签","ji":"丙丙 下下","jieyue":"此签主前运起跌不常。富贵穷通。都经涉历。后运则大不吉。如百花已经开过。从今摇落。无复荣华之望。是以万事成空。总宜退谢。倘更勉强图谋。徒劳罔功。终欠结果。","jie":"人生运势有好有坏，当好运来临时，却像风中花朵，轻易就被吹落，而坏运却紧追而来，一切的富贵穷通早已在你的人生中经历过了，但是荣华富贵早已流逝，不再回头。如果能看透这一点，则较能释怀，若是强求，也只是徒劳无功，不可能有收获的，及早认清事实。"},{"n":24,"no":"第 24 签","ji":"丙丁 中吉","jieyue":"此签先难后易。官员占之。有超擢之喜。士人占之。晚成名利。凡百谋望。收成在后。近占应在夏秋冬。远占应在晚景。不可因现在忧煎。自行堕志也。","jie":"事情的开始，总是较为艰难，或许会有重重险阻，只要立定志向，贯彻始终，最后的收成，会比自己想像得要容易，只要不放弃，必能达成目标，此签也表示出了节令，在春天则无法成事，到了夏天则较可为，如果是秋天到冬天，则绝对会成功，此签更有名利双收的表示，只要坚持到底，成功绝对没有问题。"},{"n":25,"no":"第 25 签","ji":"丙戊 中平","jieyue":"此签作事迟疑。至三冬谋望亨通。卯酉月日。应在次年。或应在远年。枯木开花。言时运先蹇后泰。如秋冬枯落之木。一到春来。开花结果。自有一番更新气象。后福未可量也。","jie":"在处理事务上，总是出现许多的迟疑，原来是受到时令的影响。此签最主要是显示出时令，当遇到虎、马、狗年时，诸事不顺，多受阻滞，但在每年的冬季时，则运势会转好，春夏秋季时则完全不行，当遇到兔及鸡年时，会有枯木开花的荣景，也就是原本已不看好，但却重现生机及活力，而且会有一番新的景象，由衰转荣，而且后福不浅，会完全抛掉衰运。"},{"n":26,"no":"第 26 签","ji":"丙己 中吉","jieyue":"此签谋事。先损后遂。问病。星运未顺。三日后或遇庚日。可望痊可。所谓先庚三日。后庚三日也。讼即解。利即得。婚即成。行人三日内必至。祷雨三日内必降。凡事利达也。","jie":"庄稼的丰收与歉收，完全都是由天决定，这是天地间的常理，无法由人力来改变。意谓着运势的好坏，并非靠努力就可转运，还是必须等待时机的到来。适逢今年运劫不佳，遇到了干旱年，收成势必会有影响，此签表示出了时间签，肯定在三天内会久旱逢甘霖，三天也表示很快的意思，让田里的庄稼有足够的雨水，也表示衰运从此终结，开始顺遂的好运道。"},{"n":27,"no":"第 27 签","ji":"丙庚 中平","jieyue":"此签只宜守分。不可妄为。若谋事返成灾害。不可以大凌小。以富欺贫。讼宜和。名亦有。财缓求。行人阻。病徐安。婚莫急。凡事守己。待时为得。","jie":"天地间的万事万物，各有其所，不可因其小而取之，不可因其弱而欺之，身为英雄豪杰，自有气势风范，不可因此而欺负弱小，更要收敛自己的气势，固守本分。不该是自己的东西，千万不要贪得，必须循规蹈矩，成为众人赞赏的对象，必有后福。此签主要告诫世人安分守己、不可妄为，也有等待最佳时机到来之意。"},{"n":28,"no":"第 28 签","ji":"丙辛 上吉","jieyue":"此签吉利。凡事切莫堕志。更须修心向善。自有好处。问讼久方决。名利稍迟。失物可寻。病宜作福禳解。行人久后必至。","jie":"人世间的功名利禄，并非从天而降，只要辛勤地努力，必能达到，并没有限制在这达官贵族之家，任何人都可以因为勤劳及努力，而得到该有的回馈。所谓的“尽人事，听天命”，当你辛苦努力地往上爬，上天岂有看不见的道理，才德及能力是无法被压抑的，总有出头天的时候，任何事情都是一样，只要努力在先，没有被忽略的道理，所以要先要求自己，就会有出人头地的一天。"},{"n":29,"no":"第 29 签","ji":"丙壬 上吉","jieyue":"此签士人占之大吉。官员占之高擢。庶人占之终有发达。但要修心积善。方得源远流长。不可变易祖德。自损心田。则亦有不应之时也。","jie":"从以前到现在，都是顺利如意的，不像别人历经大风大浪，这一切的吉运，是来自于祖宗的积德，经过长时间的累积，到了你这一代才得以受到福荫，福运的流传，是得自于天理自然，所以必须更知道珍惜，将这份善心加以延长，谨慎操守，让福份能更加绵长，未来也将更加顺遂。千万不可因好运，而肆无忌惮地挥霍，将会招来厄运。"},{"n":30,"no":"第 30 签","ji":"丙癸 中吉","jieyue":"此签目下不宜妄取。只宜守己。官员占之。必有忧疑。若能谨守。自有佳音。士人占之。且待时来。飞腾有日。庶人占之。平安。凡有谋望。先难后易。不可躁进。安分守己。交秋自有遇合。","jie":"现在周围有些许的诱惑，你必须心存正念，不可受到影响，在自己的岗位上奉公守法，未来自有吉运降临。目前有许多欲望在内心挣扎，时机还未成熟，倒不如先放下净空，到了秋天必会有好运到来。此签表示现在正陷入一种内心交战的状态，你越想得到，就越无法达成，只要从心做起，不求回报，自会有福德来临，未来会有苦尽甘来的收获。"},{"n":31,"no":"第 31 签","ji":"丁甲 中吉","jieyue":"此签秋冬平平。一切事宜。交春方有起色。千里好音。是时可至。高堂白发。尤保康宁。守己待时。吉无不利。","jie":"想要执行的事，在秋冬季是不会有太多回应的，只能以平凡来形容，但到了春季就不同了，可以感受到明显的好运到来，而且会得到远方来的好消息，而且有所成就，高堂上的老母因此感到无比的快乐，而且福寿双全。此签虽然表示秋冬只是平常，但依然要十分的努力，到了春天才会有回收，如果因此而不努力，再好的运势也是罔然。"},{"n":32,"no":"第 32 签","ji":"丁乙 下下","jieyue":"此签谋事皆不如意。主口舌之扰。事虽有成。终必有败。空劳心力。只有安分。不可妄为。","jie":"平常待人处事都是用尽心机，而且以私利为前题，太过耗费心力的结果，却无法有好的回报，连带的疾病缠身，且引起口舌是非，最后还是一身空，想要解这个危机，必须从心做起，放下私利的心，一切向善，多作有益他人的事，必能挽回颓势。修心还要修口，谨防口舌带来的是非，必能转回好运。"},{"n":33,"no":"第 33 签","ji":"丁丙 中吉","jieyue":"此签不宜妄想。只宜谨守避祸。作福修善。自有神助。失意反成得意。无望反成有望。若贪图躁进。不唯无益。更恐反遭不测。占者慎之。","jie":"分不清东西南北，眼睛看不清楚，耳朵也听不到，表示不受外在环境的影响，只管自己的事，则可保平安。若多管闲事，则会招来厄运，而且会殃及池鱼，必须要很小心，明明与自己无关的事，却会惹来一身麻顺。不如修养身息，不问俗事，不管贫富贵贱，平心处之，则可避祸。此时不宜急进，必须退守，动则招祸。"},{"n":34,"no":"第 34 签","ji":"丁丁 中吉","jieyue":"此签谋望难成。徒劳心力。幸有贵人接引。必须托以心腹。不得又听邪佞之言。私心拟议。进退不决。失此机会也。","jie":"至少已经持续一年了，在你心里不上不下，无法解决，就这样日复一日，时间越拖越久，心里越磨越烦，总是无法处理，好不容易有贵人出现，你必须敞开胸怀，真心以待，才能解决。如果你心存怀疑，又加上道听涂说，让自己犹豫不决，只是会失去这个机会，让自己陷入深渊之中。目前出现的贵人是相当可信的，不要失去这个可贵的机会，则会有所成。"},{"n":35,"no":"第 35 签","ji":"丁戊 下下","jieyue":"此签先吉后凶。有始无终。防有盗贼之侵。死亡之虑。夫妻折散之忧。亲友嫌隙之咎。主家业退败。人口凋零。大凶之兆。急须种德挽回。庶可化凶为吉也。","jie":"阴宅方位得山得水，是不错的风水，目前家庭幸福、工作顺利，但天有不测风云，谁都无法预期到突然间会有巨大的变化，不只家道中落，还会有生离死别之苦，未来的凄凉之状，令人垂泪，及早面对如此的灾祸。此劫是无法避免的，虽然目前还是如意的状态，也只是风雨前的宁静，尽早预防，可减少伤害，天理循环，非你我可改。"},{"n":36,"no":"第 36 签","ji":"丁己 上吉","jieyue":"此签不可躁进。欲速则不达也。功名富贵。迟速有时。待时而动则吉。鹏程有分。定可达到。名必成。财必遂。运程坦坦。转瞬扬眉吐气时也。","jie":"经过长时间的努力，功名利禄自然而成，看着别人总是先驰得点，也不必太忌妒，事有先后，不见得先努力就会先成功，每个人的机运不同，但此签表示成就会较迟，并非不成，所以不必心急，默默努力，终会功成名就，急躁则会坏事。虽然现在显得辛苦，但晚景必定顺遂，为了未来的享乐，只好现在辛苦点了。"},{"n":37,"no":"第 37 签","ji":"丁庚 中吉","jieyue":"此签显然告人迁善去恶。秉心公正。自有通达之时。若不觉悟改悔。鬼神暗里先知。何能掩蔽。恐不免咎殃之踵至也。","jie":"何必求神问卜才能知善恶，是非进退自在人心，你心理自有尺度，什么是对、什么是错，公理自在人心。若要人不知，除非己莫为，不可因为他人不知而为之，必须心存善念，不可有害人之心，因利己而损人，将会招来厄运，一旦排除了利己之心，一切所为皆为公正，不论何处，都能畅行无阻。"},{"n":38,"no":"第 38 签","ji":"丁辛 下下","jieyue":"此签主有死亡之患。哭泣之哀。凡事不利。有名无实。有始无终。家运凋零。前程蹇滞。作大阴功善事可解。","jie":"独守孤帏，只有虫声唧唧，是多么凄凉的景象啊!只有靠着心中的意念维生，盼望着远方的他能有好消息，好不容易等到了衣锦荣归的伊人，却又如梦一场，是那么短暂，秋风愁雨，苦不堪言，令人哀凄。此签是如此地悲苦，一切的厄运如影随形，挥之不去。此时不宜有任何的决定，不如坚守本位，以不变应万变，静待世局的变化，再苦的运势，就当作是上天给你的磨练。"},{"n":39,"no":"第 39 签","ji":"丁壬 中下","jieyue":"此签宜守旧。不可妄为。作事谋始。无贻后悔。凡事谨密为要。不可浪透信息。反此。则有意外之咎。","jie":"目前处于安乐生活，有点远离尘嚣的状态。若想知道最后的结果，倒不如从最初开始就及早规划，则会有美好的未来。你知道的事情相当多，但千万不可走漏消息，尤其是有人向你打探消息，不如一笑置之，免得招来祸患。更谨防书信上的泄密，不可有‘别人不会知道’的心态，倒不如什么都不说，将可保有安居乐业的生活。"},{"n":40,"no":"第 40 签","ji":"丁癸 上吉","jieyue":"此签谋望尽好。须是自己变更。莫听人言主使。误走程途。不久好音即到。始虽崎岖难行。后自亨衢通利。是为先难后易之象。","jie":"随自己的意愿做改变，将是最好的选择，不须受他人的影响，他人的危言耸听，将使你误入歧述，要谨防受影响。即将有好消息的到来，尽管经历过重重坎坷，接踵而来的将是康庄大道，先苦后甘。此签表示先难后易之象，但最重要的是不要被别人的意见所左右，只要依自己的意愿做个大改变，将会有美好的未来。"},{"n":41,"no":"第 41 签","ji":"戊甲 上吉","jieyue":"此签现在事务皆无定准。讼必反覆。婚有变易。遇子丑月日。或年分。可许遂意。功名初年艰难。子丑科青云直上。吐气扬眉。凡事先难后易。尽人事以待天时可也。","jie":"男儿志在四方，但却不知所措，任何一方都无出路，未来远在天涯，却不知从何处前进。等到鼠牛年交会之际，会得到贵人相助，可一举成名或成就一番功业，所以现在要有所准备，一旦时机到来，则会有成。远在鼠牛年，近在子丑月或日，忍耐目前的困顿及茫然，等待时机。"},{"n":42,"no":"第 42 签","ji":"戊乙 中吉","jieyue":"此签宜反己问心。毋乖神意。恐有恶事恶念。急须改悔。前次所谋不合。从此更新整顿。自有称心之时。若怙恶不悛。及畏难苟安者。则无济也。","jie":"原本神明给你一个顺遂和谐的道路，但因自以为是的个性，将天助好意破坏掉了，而且还怀有不好的念头，在还没害人之前，就会先害到自己，还是尽快将歹念去除，重新立定目标，只要没有害人之心，未来更将得心应手，运势得以否极泰来。不管任何事，都有除旧更新之意。"},{"n":43,"no":"第 43 签","ji":"戊丙 中吉","jieyue":"此签先凶后吉。若问谋望。自有好处。病者虑险。自有解脱。讼事惊惶。渐得安泰。宦途主有风浪。终不为害。凡事存心。默仗神佑获吉。","jie":"遇到了不可抗拒的因素，必须冒着极大的风险前往，看起来危机四伏，但在神明的保护之下，均能化险为夷，最后平安归来。此签有先凶后吉之象，虽然遇到惊涛骇浪，但都能平安化解，如果不遇到这些危险之事，也无法进入到平安之境，当进入吉运之后，前面所遇的灾难就自动化解消逝了。"},{"n":44,"no":"第 44 签","ji":"戊丁 中吉","jieyue":"此签本非恶人。却有恶事。当由见识不明。及被人引诱所致。未免得罪神明。速宜悉心忏悔。力持善愿。以冀感应。将来富贵有准。荣华可期。唯在一念挽回。毋终执迷自误也。","jie":"你本来是个心也善良的人，但在周围引诱之下，做出了错误的事情，不仅胡作非为，还因此伤了自己，赶快重拾善念，用最诚挚的心向神明忏悔，只要回心转念，原本善良的心而重新出发，则能弥补之前的过错，得到神明的帮助，荣华富贵将随即出现。此签要告诉你，知错能改，善莫大焉。"},{"n":45,"no":"第 45 签","ji":"戊戊 中吉","jieyue":"此签劝人竭力存心。中心为忠。如心为恕。凡事人己两平。不可为损人利己。及欺心谋吉之事。心地好时。自沐天心庇荫。发福悠长。彼谋吉者。欲得阴地。先损心地。计亦左矣。岂能及存心者之万一乎。","jie":"有人为了求得好运，总是在阴宅上处心积虑，希望求得一块福地，能够旺子孙、旺家业，但却忘了修好心田，如果只是一昧地找好阴地，但心地却有损人利己之念，最后阴地还是会输给心之地的。此签是要人从心做起，只要心中有善念，不蓄意为恶，就像是一块良田，在心中滋长，为人们带来最大的善报。"},{"n":46,"no":"第 46 签","ji":"戊己 中平","jieyue":"此签不可躁进。欲速则不达也。功名富贵。迟速有时。待时而动则吉。鹏程有分。定可达到。名必成。财必遂。运程坦坦。转瞬扬眉吐气时也。","jie":"明知骑牛才安全，但又贪图骑马的快感，当你选择了骑马时，就等于舍安稳求快速，但也必须经历快速所带来的危险，然而骑在马上的惊惶，又让你想要骑牛，但这时已来不及了，你只能心想着安危，无法顾及山上的风景，此签告诉我们，凡事要谨慎而行，不可想到什么做什么，还是要全面考虑。"},{"n":47,"no":"第 47 签","ji":"戊庚 中平","jieyue":"此签。凡事心气和平。听人劝阻。错误早悔。反自问己。毋使刚愎自用。怙过不悛。致成凶咎。讼事尤戒。虽有怕生冤抑。只宜平情解散则吉。","jie":"一而再，再而三地交待，以和平的方式处理，不可因为自认有理，就对簿公堂，只要以诉讼的方式处理，则必招来厄运，不可能有对自己有利的结果。不如自己平心静气下反问，也许会觉得有失公道，但不是自己认为的就是对的，只要早日打消诉讼的念头，则早日去除厄运。不可急进，只宜退守，则不会有难。"},{"n":48,"no":"第 48 签","ji":"戊辛 中吉","jieyue":"此签景况艰难。人口欠安。凡事类多龃龉。幸转眼之际。恰有一贵人从中得力。诚以指示迷途。须识机缘所在。悉心听从。自得骨肉团圆。人情和合。凡谋遂意矣。否则伥伥然之。岂有安全。保聚之乐乎。","jie":"目前正处于混乱险阻的状况，全家大小兄弟姻亲间全都不和，闹得全部鸡犬不宁。虎头人，表示姓卢或虞等有如虎头字的人或属虎的人，经过此贵人的指点，将破除兄弟内外之间的不睦，重修旧好，家运将转危为安。但是当遇到虎头姓的贵人而不自知时，可能会失去这个大好机会，不得不注意，千万别失去这个可让家运好转的良机。"},{"n":49,"no":"第 49 签","ji":"戊壬 下下","jieyue":"此签主情意隔角。不遇扶持。看似密迩相连。其实咫尺天涯。势同秦越。智士知己知彼。舍此另投。或有遇合。若信。文貌周旋。口头热闹。外密中疏。终鲜实际。不唯耽误时日。更费趋候奔走之劳。此等人为世诟病久矣。奈何其弗之省也。","jie":"虽然与周围的人看似亲近，但却从未真心地相待过，犹如阴阳两界，是无法跨越的。在快速的时间飞逝下，人也渐渐地不再年轻，但总是所托非人，无法成事，白忙一场，倒不如什么都不做，生活过得倒还比较自在。此签表示无法和他人情意交流，无法相信别人，只相信自己，但又交待错人，一生都是如此，所以别再相信不该相信的人了。"},{"n":50,"no":"第 50 签","ji":"戊癸 上吉","jieyue":"此签主年运亨通。时和岁稔。家旺人兴。然修身乃齐家之本。礼教实门内之防。必须周规折矩。仁让雍雍。方遂和平之福。更忌妇人搬弄。宵小离间。是为萋菲谗言。不可偏听。斯家道成而流泽长矣。凡事谨慎和平则吉。","jie":"今年明显地比去年要好，运势也渐渐顺遂，只要亦步亦趋地循规蹈矩，全家和乐融融，则会有更多的福气，要小心女人间的是非，言语离间是破坏的导火线，不必过于听信，得来不易的好运不可因此而破运。此签表示要从人和做起，等到适和的天时，则会旺家旺族，不可等到时机已到，才要调整人事，则会浪费天助好运。"},{"n":51,"no":"第 51 签","ji":"己甲 上吉","jieyue":"此签暂时安分。后此渐有机缘。不求自至。切勿因近年谋为不遂。常自嗟叹。人事有得有失。命运有否有泰。一到亨通之时。名成利就。自有吐气扬眉之日也。","jie":"过去也许有点受阻的感觉，但凡事只宜随遇而安，不可过度强求，运势走到此时，有水到渠成之势，只要顺其自然，一切将会相随心转。不要怪罪过去的不顺遂，如果只会怨天尤人，就算好运来临也只是擦肩而过，以欢欣的心情迎接好运势的到来，一切将会更称心如意。此签表示一时的受阻，不必太在意，即将来临的好运才是值得珍惜的。"},{"n":52,"no":"第 52 签","ji":"己乙 上吉","jieyue":"此签现在光景落寞不堪。几无复有起色。岂知通塞无常。剥复递转。不意之间。顿有好音。自北而至。或已向北而往。名利即在此中。滔滔顺利。凡事有意外遇合。","jie":"目前处于时运不济之时，度过无数个孤独寂寥的日子，意味沉寂地等待，终于等到好运的到来，大约会在秋季，而且是忽然间就会有好运来，将原来停滞不前的运势，一下子就打通了，而且轻松容易地过生活，完全没有生计上的问题，好运或许来自北方，或是必须往北方去，一切在命运中，自会有安排，目前的困顿将是未来顺意的基石。"},{"n":53,"no":"第 53 签","ji":"己丙 下下","jieyue":"此签历涉艰险。谋为不遂。不知避凶趋吉。反自舍安就危。与南鸟北巢何异。须待贵人得力。幸今日已经识面。将来夏秋之交。必有应验。名利可成。婚姻可合。孕育可许。凡事先有机兆。而后成之。","jie":"总是比别人多花许多的力气，还是倍受阻难，而且颠沛流离，重重难关，似乎永无天日，运势无法顺遂，就如南方的飞鸟独自朝着北方而去，等着它的是冰天雪地，并非春暖花开的天堂，也可说是去错地方了。如此的阻运必须有贵人相助，才能有所改变，你的贵人是你已认识的人，但是必须在夏秋之交再度重逢，你才能因贵人的指点而改变运势。要注意贵人的出现，不要错失转运的好机会。"},{"n":54,"no":"第 54 签","ji":"己丁 中平","jieyue":"此签主功名沉滞。时运未济。虽然自逞英豪。志图冲举。然如舟楫未及洪流。鸿毛不遇顺风。仍须守待。唯用功于青灯黄卷之中。皇天不负苦心人。将来自有发迹。慎毋欲速。毋怠惰。功夫既到。天机自合耳。凡事以艰难得之。","jie":"想要超出众人之上，而且自负有超脱的能耐，只可惜天地万物有序，并非有崇高的理想，就一定能达成，必须等待时机的到来，现在是时运不济之时，就如船遇浅滩、羽翼无法顺风，无法依自己的意愿而行，必须努力度过这暗潮汹涌的困境，等待好运势的到来。目前必须努力在读书或自修上，人在困惑之时，可从书本中找到答案，而且不可有懈怠之心，必须勤劳努力，等待好运。"},{"n":55,"no":"第 55 签","ji":"己戊 中平","jieyue":"此签戒营谋务本。衣食随缘。不可贪求。不可过分。若务商贾奇嬴之利。必至使用心机。惯行刻剥。财利终不永久。何如耕作勤俭之人。自食其力。仓廪充实。岂非裕后传家之长计乎。凡事宜守旧。仕人不可改商。定主亏折。若由商改士则吉。庠序食廪米。仕宦食廪禄。","jie":"努力耕作不懈怠，则会衣食无缺地过着好日子，所谓的耕作是指实际操作的工作，并非是从事商业，此签告戒不宜从商，虽然从事商业有更大的收获，但利益大的事情风险也很大，眼前的利润有背后的风险，可能会有更大的损失，无法有稳定的收入，倒不如从事公务员，可以有稳定的收入，长时间的累积，也比从商要好很多。此签建议，如果目前从商，必须改行从事稳定收入的公职较好。"},{"n":56,"no":"第 56 签","ji":"己己 下下","jieyue":"此签主有瞒心昧己之事。官非口舌之灾。始时诪张为幻。希图幸胜。一旦水落石出。机关破露。致遭刑宪之累。自作自受。理所应得。复自嗟叹何益乎。凡有机事机心。及早悔悟免祸。","jie":"虽然心里知道理由不够充份，但仍然以花言巧语在遮饰，此种个性易惹官非，就算在公堂之上，照样自圆其说，欺官骗上，并非自认有理就会赢，毕竟夜路走多了，还是会露出马脚，可以骗别人，但无法骗自己，一旦事迹败露之后，所有罪刑都原形毕露，总会受到法律的制裁，到时不必怨叹。如果能从现在起有所改变，以真心相待，相信必可免除一场牢狱之灾。"},{"n":57,"no":"第 57 签","ji":"己庚 中平","jieyue":"此签凡有疑难。须自作主。不可靠人。如奕棋者。本有仙着可下。人自不识。急须参透此事要着。恰中窍会。自然不劳而理。不战而定。若但随人作计。是非不辨。进退不决。岂有济乎。","jie":"事情层出不穷，变化多端，虽然自己有许多的想法，但总是下不了决定，此时千万不要听从别人的建议，必须自有主张，就如下棋的人，遇到了难解之时，还是必须自己思量，而且会有神来一笔之助，目前虽然闹得沸沸扬扬，必须改变犹豫不决的个性，自己下决定必能度过此时的喧闹，此签告诫千万不可由他人来帮你决定，因为必定是个坏结果，相信自己就对了。"},{"n":58,"no":"第 58 签","ji":"己辛 上吉","jieyue":"此签宜动不宜守。宜远不宜近。口舌之才。必有遇合。名利可成。但恐阴骘有亏。至令天机阻滞。必须勤加积累。上格天心。自然一举冲霄。前程远大。戒人去恶从善。趋吉避凶之意。至深切矣。","jie":"靠着三寸不烂之舌，就可让自己衣食无缺，是个天生靠口才吃饭的人，而且此次的行动，更可让你功成名就，享有富贵荣华，可说达到人生的高点。然而想让自己富贵长在，必须要多积阴德，多做善事，未来的前程将可更长远，并且不受阻碍。如果无视积德之事，就算是好运来临，也只是一时，必会招来厄运，而且不做善事的人，抽到此签也等于是没有，不受好运保佑。"},{"n":59,"no":"第 59 签","ji":"己壬 中平","jieyue":"此签门祚衰微。子嗣艰贵。屡次求神不应。当由己身德薄。未能感格天心。然赖先世以来。余泽未斩。己虽无出。尚可谋立继嗣。上承烟祀。犹为不幸中之幸。凡事不得乎上。可望其次。不得于彼。必得于此。总须善功培植方应。","jie":"家道逐渐衰弱，人丁单薄，门户冷清，对于祈祷之事，没有任何一件实现，只会祈求，却不懂得付出是此签的重点，所以一直无法如愿。所幸祖先有积阴德，庇荫到此代，才不至于因此而断了香火。此签指出，由于人丁过于稀少，无法有自己的子嗣，但会有继子继承衣钵，以解决无后的问题。如果能多加积德，则能更加顺遂。"},{"n":60,"no":"第 60 签","ji":"己癸 上上","jieyue":"此签才品超群。同气和美。但须小心畏慎。不可骄傲取咎。转瞬之间。即有丹诏之荣。槐黄之喜。好音为不远矣。又主兄弟同榜之兆。凡事应在双数。","jie":"兄弟指的是师出同门之谊，不必羡慕兄弟的好名声，因为自己也不差，一切都算顺利，但要记住不可炫耀，也不可仗势或自大，可得到上天的助益而一举成名天下知，而且会与同门师兄弟一同上榜，或同时被提拔重用，必须随时保持谦卑的态度，不可因得势而沾沾自喜，如能时时谦为，排除忌妒之心，则好运会一直常存。此签表示出好事成双，不要排斥或忌妒同门，则能共享荣誉。"},{"n":61,"no":"第 61 签","ji":"庚甲 中吉","jieyue":"此签主道途惊险。小人侵害。唯是善良之人。遇凶不凶。遇险不险。则意外忧惧。弹琴可以解围。焚香可以却敌。彼自谈笑。贼已遁逃。非所谓吉人天相者乎。凡事凶中得吉。阴蒙神佑。当益勉之。","jie":"小人当道，此行必充满险阻，并有盗贼肆虐之象，然而只要是为人正直，且循规蹈矩之人，必能顺利脱险，只是倍受煎熬，无形之中得到神明的庇荫。不妨随自己意愿，来去自如，坦然行事，完全不受影响，只要自己行得正，即使不用干戈，宵小盗贼也自会散去。此签指出遇到凶险之事，会自动化解，若以小人之心以对，反会招厄，必须培养光明正大的心胸。"},{"n":62,"no":"第 62 签","ji":"庚乙 中吉","jieyue":"此签主克敌战胜之兆。言虎狼之人。百千为群。势甚猖獗。赖汝整顿干戈。歼擒不遗余力。是以振旅凯还。正在秋色将老之际。一时功成名遂。恰于虎头城里。喜 气相逢。追寻快意。其亦有行藏自适者乎。凡事先险阻。后亨通。应在秋日。或西方或虎字头州县地名。或应在晚景。","jie":"百千人则意味相当多的人，虎狼心是指作恶多端邪恶之人，必须依赖你大动干戈，才得以铲除，经过一番惨烈征战，胜利之时，已经到了老年，有道是好景不常在 ，当得到名声之时，已经逐渐老了，在有虎字头的地方可以安乐享受老年。此签表示经过激烈的征战，最后克敌致胜，颐养天年，晚年安逸。"},{"n":63,"no":"第 63 签","ji":"庚丙 中吉","jieyue":"此签前途亨通。中间不免折挫。现在虽极疲困。然有一番光景在后。不可堕志。亦是大数注定。必其人平日居心及行事。克邀天鉴。故能不终没没也。三三。乃大 数应验处。凡事失中有得。难中有易。晚景荣华。","jie":"过去南征北讨，无不如意顺遂，虽然耗费许多筋力，而且偶有失败，此时虽然有所阻滞，但终能由败转胜，还是可以得到胜利，这一切都是天理注定。此签有数字 的表示前三三与后三三，表示三、六、九等数时，有所指示，但依所问之事，而有不同的解释，不可断章取义，多参考其他因素。"},{"n":64,"no":"第 64 签","ji":"庚丁 上上","jieyue":"此签谋为和合。得遇贵人提携。凡事称意。不劳而成。必其人素为人所敬信。其事又为众所欣悦。是又恰遇机缘。一倡百和。谈笑中。事立而成功。岂非天人相应 。相时而动者乎。","jie":"所谓吉人自有天相，吉人处事本来就称心如意，而且得天独厚，能得到贵人相助，自己并不须花费多少力气，贵人为天水翁，指贵人应在有天或水字的地名。不须 花费心力，则能得到大众的认同且契合人心，得到事半功倍之效，而且在谈笑之中就得到成功，可说是天时、地利、人和之作，这是个必定会成功的佳运。"},{"n":65,"no":"第 65 签","ji":"庚戊 上上","jieyue":"此签沉滞既久。困而将亨之象。譬寒冬凛冽之际。剥极阳生。渐得交泰更新。万物从此发生。正多美景。占此者冬季有喜。交春人事遂意。另有一番好消息。指日 俟之。","jie":"停滞不前的运势，开始运作了，犹如凛冽的寒冬将尽，接着而来的就是春暖花开的春天，而且逐渐感受到喜气洋洋，尤其是进入到新春之后，心里的愿望似乎得到 了回应，出现了助你实现愿望的贵人，将得到完美的成功。此签指沉滞的运气完全开通了，而且心想事成，就是会出现贵人来帮你实现想法，必须把握良机，尤其是冬春交际，是 转运之时。"},{"n":66,"no":"第 66 签","ji":"庚己 上上","jieyue":"此签不宜远行。只宜守旧。乡邦之地。自有荣华。耕耘之中。亦有发迹。况值运限更新。门庭以内。喜事重重。自可享受优游。倘舍现前实地。希冀远大不可知之 数。将贻后悔。居易俟命者得之。","jie":"若要努力奋发，只需在家乡，根本不必向外谋求机会，只要守住原来的家业，则会有很好的发展。尤其是今年遇到了大发的好流年，家中会喜气洋洋，而且接二连 三，不只一件。此签表示今年的流年大吉大利，家中喜事连连，好运不断，如果坚持出外打拼，则不适用此运，后果将不可想像，无法像留在家乡中这般如意，必须深思。"},{"n":67,"no":"第 67 签","ji":"庚庚 中平","jieyue":"此签好善有好报。作恶有恶报。示人早知警悟。现在所谋不善。天神早已洞照。自是必不可行。何须启问。唯有改悔前过。力从孝悌上起见。自有家室和平之乐。 趋吉避凶。唯人自择。可不悟乎。","jie":"在发心动念之时，老天就都已知道了，既然是不好的坏心眼，又何必再问神佛解决心中的疑虑，其实自己的内心相当清楚，什么是对什么是错，只要改过向善，将 心中的坏念头一并清除，希望能从孝悌开始做起，孝顺父母、友爱手足，是最基本的孝悌之道，只要做到孝悌，则不必担忧家中无法和乐，自然而然地家业平安快乐，有道是家和 万事兴。如果不改除心中的坏念头，厄运则随时而至。"},{"n":68,"no":"第 68 签","ji":"庚辛 中吉","jieyue":"此签劝人知足不辱。知止不耻之意。凡人前事谋为。既已遂意。现在境地。亦可粗安。即当持盈戒满。自守清静。就此求田问舍。自得安常处顺之乐。若贪多不已 。终无厌足。不唯自取烦劳。有不更招意外者乎。进退行止之几。当自决之。","jie":"具有相当好的生意头脑，这几年来得到不少的利润，但也养成了不小的野心，奉劝你适可而止!不如放弃营利，就此退回田野生活，则可过着安居顺遂的生活，人 的欲望是无法满足的，心愈贪，则越显得不足，永无止息之日，如此下去，则会因贪而招来厄运，不到败光家业，厄运是不会停止的。须多深思，此时是必须急流勇退的最佳时机 ，回归恬静的生活，才是真正的人生。"},{"n":69,"no":"第 69 签","ji":"庚壬 中平","jieyue":"此签一切所为。宜踏实地。交游间更宜慎择。谨防所与非人。侵耗陷害。口舌是非。酒色财气结仇等情。唯冀慎之于先。免致受其笼络。斯全身远害之道得矣。凡 事趋吉避凶。改恶从善。不可自误。","jie":"放弃风浪巨大的水路，改以风险较小的陆路，然而各有各的风险，并不见得陆路就会平安无事，还是必须小心为上。不可与富家子弟混在一起，因为看似显贵其实 虚有其表者居多，而且较狡诈，容易受骗，只要失去了利用价值，或分赃不均，随时可以翻脸，这是小人的行为。若疏忽而与小人同谋则凶。"},{"n":70,"no":"第 70 签","ji":"庚癸 中吉","jieyue":"此签言世间一切事故。冥冥中有主之者。须待时候已到。机缘自就。如祷雨者。至诚感动。亦须仰奉天命。然后风伯雨师。方得应候施行。后二句。是言雨降之期 。在中伏之际。凡事皆可类推。","jie":"大自然的天气变化，各有其道理，并非可依人为所控制，人生的吉厄顺阻，不也是如此，必须诚恳地祷告，让天神感受到你的诚意。霖日，则为下雨之日，在大暑 之时表明何时会下雨，竟能准确地在中伏之时下起霖雨，表示出干旱的大暑之时，都会有天降甘霖之时，一切必须等待时机的到来，才能成事。让你的希望有所依靠的，不就是至 诚的祈祷吗?现在的辛苦，必会换得未来的顺遂。"},{"n":71,"no":"第 71 签","ji":"辛甲 中吉","jieyue":"此签离而又合。去而复还之象。凡事机兆已动。现有好音。如归家者已通消息。不日间可团聚。自有夫妻谐和之乐。但暮景霜侵。草木零落。必主晚成。及年力衰 迟之际也。","jie":"通报喜讯的雀鸟在檐前啼叫，预告离家的他即将归来，房间重新再结上喜帐，表示重来一次或是再婚，然而虽然期盼已久的他已回来，然而已到叶落霜凋之时，表 示秋冬之日，或是晚年，暮色侵表示一切都已经太晚了。此签表示所占之事无法在早年达成，必会拖至晚年之时，或秋冬之日，而且有重新来过之意。"},{"n":72,"no":"第 72 签","ji":"辛乙 中平","jieyue":"此签险阻多端。事有蹉跌。人防陷害。如行河畔崎岖之路。又值日色将晚。险何如乎。凡事勉强前进。凶不可言。就此中止。庶可免祸。纵有晚景。须遇申酉戌年 月日。或申酉戌运限。可冀有成耳。","jie":"道路本就崎岖难行，更何况是沿着河渠的坎坷道路，一到日已向西的傍晚，就更难行了，而且处处有危险，只要一脚踩空，则死于非命，所以不可勉强行之，必须 就此停止，则可免于招祸，纵使有荣华富贵的时日，也必须等到申酉戌年月日时，才可达到，现在是处于四面楚歌的状况，必须耐心等待时机的到来，千万不可心急一时，否则会 招来厄运。"},{"n":73,"no":"第 73 签","ji":"辛丙 下下","jieyue":"此签戒勿轻信。凡事与人有约。始虽和合如意。亦是巧言虚花。终无准实。如婚姻之转瞬败盟也。及早参透。免自扰累。或可另作亡羊补牢之计。若终受愚弄。非 徒无益。而受害多矣。人情如此。其可不知悟乎","jie":"口头上的盟约已完全失信了，答应之事已不可能完成了。还要痴心妄想成为夫妻，大家都知道这是不可能的事，却只有自己一心想要挽回，当然只会让自己痛苦不 堪罢了。此签表示以前的誓约早已变化，越早看透越能及时回头，不必再等下去了，不如认清事实，重新来过，会有一个新的开始。不要再执迷不悟了。"},{"n":74,"no":"第 74 签","ji":"辛丁 上吉","jieyue":"此签事有重险。目前甚属艰难。然赖神明默相。虽在危险之中。如履康庄之路。盖缘平日身具善根。足以感格天意。此时心含智慧。足以权度机宜。故能脱险而亨 。行登长安道上。春色满前。正有无限好景。占者唯慎持身心。益加积累。以迓天麻斯善耳。","jie":"在这高峻之地行走，就犹如平地般来去自如，这些危险根本就无法影响，平时为人行善，而且心如明镜，表示得到上天的庇佑，将大吉大利，长安一道指通往功名 利禄之道，放春回，指春色无边，正等待着你的到来。此签表示虽履险境，但对你完全不受影响，只要心存善念，必得善果，接着而来的是顺畅的吉运。"},{"n":75,"no":"第 75 签","ji":"辛戊 中吉","jieyue":"此签事有前缘。不须劳力。自然遇合凑巧。盖称量彼此之间。彼既脱去俗尘。此相遇可落凡近。是以一见倾心。格外投契。不复在世情贫富间论也。婚姻和合。诸 事相宜。道途遂意。谋望皆能如愿矣。","jie":"此时正面临一个天大的好机会，这并非是偶然，而是在前世的因缘契合，于此世延续，见到的第一面，就有如失散己久的亲人，有一见如故的感觉，而且对方与自 己不论是在外貌或是才德方面，皆不相上下，由于如此的投契，所以贵贱贫富，就己经无所谓了。此签指出会遇到与你相合之人，或是处事顺遂如意，一切就是自然天成。但这都 是前世的因缘，要懂得珍惜，才能有良好的轮回。"},{"n":76,"no":"第 76 签","ji":"辛己 中平","jieyue":"此签谋为阴事。神不之告。如法律操自官府。岂得预行宣泄。唯是祸福无门。全凭善恶判断。所为善。自应得福。所为恶。自应得祸。祸福之机。人自知之。将求 福而避祸。可不急去恶而迁善哉。","jie":"三千法律，指的是罪状条文，八千文，是指律文的内容，这是一般凡人无法了解，也不能事先知道，未来的吉凶，完全决定在现在所为的善恶，神佛无法为你多祈 求福份，只有自己的修为才能影响吉凶，一生的祸福都由自己所作为的善恶决定，非他人能决定。此签神明无法有所助益，未来祸福早已决定在自己，求福避祸，倒不如去恶行善 。此签的吉凶完全在各人作为。"},{"n":77,"no":"第 77 签","ji":"辛庚 中下","jieyue":"此签戒宜谨让。凡事准情酌理。探取根源。自能明其是非。审其进退。切不可听傍人言语。妄构讼端。讼必有凶祸在后。至此时悔之晚矣。何如慎之于先之为得也 。凡事宜止不宜进。宜解不宜结。宜静不宜躁。占者慎之。","jie":"树木必须扎下深根，才能稳稳地树立，潺潺的流水也要有个源头，河流才能源源不绝，这是天地万物不变的道理，必须自己探究其原因，去恶从善则能趋吉避凶，为人仁慈则能长寿。千万不要道听途说，傍人在耳边劝说，似乎是有道理，其实都是巧言令色，如因此而涉诉讼，则有厄运，千万要记得，不可涉及讼事，关起耳朵，不要听别人 的小道消息，从根源修德行善，才是最根本的道理。"},{"n":78,"no":"第 78 签","ji":"辛辛 下下","jieyue":"此签家道虽然温饱。宜自谨守。不可倚强欺弱。主有口舌是非。更防贪求不已。致生后祸。祸福无不自己求之。可不慎乎。","jie":"家庭环境富裕。所以不必为了三餐温饱而烦恼，当然心思就无所事事，虽然如此，还是要有自己的定见，如果随周围的宵小起舞，则会造成祸根，家中过于有钱，只是让自己更加浪费，不懂珍惜的结果会反害自己，祸福自有源起，从善则能招福，胡作非为地使坏，只会让自己走入灾祸之中。此签告诫祸福自找，必须懂得修为，去恶从善，修得善果。不论福祸，必定自我承受。"},{"n":79,"no":"第 79 签","ji":"辛壬 中平","jieyue":"此签凡事宜依理顺行。不可妄意强求。反招祸患。如相地者。干亥来龙。自以坐坎向午为顺。若独执偏见。改作丑艮作穴。是为阴阳背逆。岂不致门户凋零之咎乎 。此以见吉可趋。凶可避。慎无颠倒错乱。自贻伊戚也。","jie":"为人处事必须依照天理。干亥来龙，指西北方位是吉位，而坐北朝南的方向是平安吉利的坐向。若无视于天理的运行，硬要移居东北方，则与西北吉位造成直角，是非常不利的方位，若执意要居于东北方，则会面临家道凋零，而且凡事不顺遂，则对家中人口有损。在亥子午年时运势良好，但在丑寅年则较不顺。"},{"n":80,"no":"第 80 签","ji":"辛癸 中平","jieyue":"此签宜趋吉避凶。革故从新。不可妄为。亦不可坐守。始以无故而得祸。后亦可以作善而致福。如人家坟宅未安。必须改换阴阳方向。乃可化凶为吉也。若自己毫 无转动。福何由而集。祸何自而消乎。","jie":"闲来无事却突遭是非缠身，无风不起浪，绝非无中生有，此次缠讼起因于阴阳宅的问题，目前的风水有所不利，只要改变阴阳宅的坐向方位，则可转祸为福，或许 你会心存疑虑，无法认同，如果你等闲视之，则祸患无穷，若能姑且相信，作适当的改变，则会有很明显的转变，不妨试试。此签表示必须有所改变，不可等闲视之，或心存怀疑 ，起身动动，运势也会跟着动动。"},{"n":81,"no":"第 81 签","ji":"壬甲 中吉","jieyue":"此签被人欺凌。暂时耐守。自可昭雪。如人负欠不还。多方谋赖。理曲在人。我何畏哉。自有清正官司在上。恰似高台明镜。一经照察。机关立破。谋赖者从此败 矣。此以见凡事当依本分。毋逞狡诈。本分到处可行。狡诈适自害其身而已矣。","jie":"有借有还是人之常情，借东西给别人，希望别人自己会奉还，然而他人存心狡诈，故意耍赖拖欠，你也无可奈何，幸亏还有天理，犹如高台上的明镜，照亮所有真 理，也照穿了邪恶的机关，狡诈的心可以欺负人，但无法骗过天理，最终还是斗不过天理，迟来的正义还是会来，得到平反，收回了借出的财物。此签告诫天网诙诙，疏而不漏，不是不报，时候未到，不可有故意占人便宜的心态。"},{"n":82,"no":"第 82 签","ji":"壬乙 上吉","jieyue":"此签凡事早植因缘。后此自有莫大利益。如往来俦类中。现有一贤士在前。必须特与订交。厚相结纳。日后此人得志。乃是王侯之贵。幸得以故人肩随上下。托末 光而附尾后。易易事耳。若待临时攀扶。岂有济乎。凡事予则吉观此益信。","jie":"在往来的朋友当中，有一位贤能之人，但此时并没有特别出色的表现或得到赏识。此时你必须特别与他多加交往，不妨以主人的身份多加款待他，并建立起深厚的 交情，以后当他成为王宫侯爵之士，你依然是在他周围的贵客，而且会受到他的提携。此签表示他日的丰收，必须在今日就种下因缘，等到他人升至高官再去拉关系，一切都太迟 了，必须慎选友人交往。"},{"n":83,"no":"第 83 签","ji":"壬丙 下下","jieyue":"此签宜随分退守。恰得安常处顺之乐。若贪现前而图意外。不唯无益。更增烦恼而已。虽则家计艰难。然安闲境地。不可多得。何不爱惜光阴。甘守清况之为得乎 。凡事恬静则吉。妄动则凶。","jie":"即使只是一碗清粥，都要懂得珍惜，将自己的欲望降至最低，则能随遇而安，若苦苦追求福禄财宝，也只是多加妄想，让自己陷入痛苦的煎熬。如果想要自己跟富 贵人家相比，只是更加为难自己罢了，实在是作不到，又何必让自己痛苦，人生在世短短几年，求的是平安闲适的生活，目前虽然物质生活较不充裕，但日子过得还算清闲，如能 自得其乐，不也是很好吗?"},{"n":84,"no":"第 84 签","ji":"壬丁 中平","jieyue":"此签示人扼要争先之道。头绪虽烦。目应批却遵窍。恰得妙着。尽先布置。恐有阴私小人。从中挑拨。不可过听。总须自作主张。依理而行之。积久勿替。则纷烦 定而事绪理矣。凡事不可游移无主。持正有守则吉，治家者切不可听信妇人之言。","jie":"目前处于危难之中，此时必须下狠招，就好比是下棋者，经过深思谨慎地下，这步棋则关系了全局的成败，周围的耳语不必理会，尤其是家中女人，不要理会她的 言论，身体力行礼义之事，而且不可怠惰，必须持之以恒，才能度过此时的难关。此签告诫不可听信也人之言，尤其是家中妇人，要更加小心处置。"},{"n":85,"no":"第 85 签","ji":"壬戊 中平","jieyue":"此签宜守分安命。不可妄求。如春天风雨交加。不待晴霁。于此急迫远行。不知几历艰险。究竟事与愿违。算在意中。失在意外。空受劳苦而已。此贪求躁进之害 也。知几者其慎之。","jie":"平时所用的工具，和人是一样的，制造器具的精巧工匠，虽然有着巧妙的手工，但没有须要用到器具时，也只能默默地钻研自己的手艺，只能随遇而安，固守本分 ，无法强求，一直到秋冬季节，遇到了须要用这个器具的主人，才得以发挥工匠的手艺。此签表示平时专注在手艺方面的钻研，等待时机的到来，时间到了，就会遇到赏识工匠手 艺的主人出现。"},{"n":86,"no":"第 86 签","ji":"壬己 上吉","jieyue":"此签凡事应渐进。不可欲速。不可欺心。如贸易者。虽值物货当行。亦宜为人设想。两得其平。自然渐入佳境。若专求利己。必致损人。天道岂佑之乎。","jie":"平常流通的货物，只要利润适当，则可招来许多买主，所谓薄利多销，如此则能积少成多，时间累积久了，自能成为富裕之人，经常设身处地为他人着想。不蓄意 剥削他人利益，未来一定会比现在更好，这是天理自有定数，但已成为富裕之人，千万要待人以仁，为富不仁者，自断后福。此签告诫必须循序渐进，保有仁心，富裕幸福的日子 则可持久。"},{"n":87,"no":"第 87 签","ji":"壬庚 中平","jieyue":"此签示人光明正直。勿为尔诈我虞之行。胸中既无畛域。天下皆成一家。到处同声相应。同气相求。何不利之有。若以相倾相轧为能。终至两败俱伤。未有能善其 后者。人可不知戒哉。","jie":"从暗中观察对方的所作所为，了解到敌我的分别，就像是同在船上，却心生暗算，虽笑脸迎人，却是笑里藏刀，外在表现得非常亲切，但内心却防卫心态深重，无 法与之交心。此时放下心中的隔阂，排除不必要的干扰，以真心相待，当作无事，看到光彩耀眼的凤毛，则会自然而然由内心发出怜惜之心，与人相处就是如此，放下心中的阻隔 ，彼此则可以同舟共济，化凶为吉。"},{"n":88,"no":"第 88 签","ji":"壬辛 上吉","jieyue":"此签时运将至。所谋必就转瞬交春之后。万物发生。人事亦得喜悦。向者难而今者易。向者塞而今者通。志愿无不畅遂。快矣足矣。然始也可由剥以使之复继也。 亦可由复以至否。此时须识持盈保泰之道。方克有终。是以君子慎之。","jie":"过去常常都要做徒劳无功之事，凡事都有所阻滞，在交春之际，突然间转运了，感受到喜气洋洋的气氛，而且做什么事都异常地顺遂，凡事心想事成，作什么都成 功如意，此时必须更虚心待人，不可因此就趾高气昂，要更安分守己，得意忘形则会破坏好运，此签表示新春之时，即转好运之时，必须把握好运，不要因一时的志得意满而浪费 了大好运。"},{"n":89,"no":"第 89 签","ji":"壬壬 中吉","jieyue":"此签示人隐忍以待时。藏器以待用。不可急。急则颠。不可愤。愤则败。不可躁。躁则陷。是以君子有处困之道。不忧勤惕厉道之经。饮食燕乐道之权。必通经而 达权。急来以缓受之。逆来以顺受之。斯出险济屯之道也。一旦快马挥鞭。龙腾虎变。乃真不可方物矣。此圣意：扶危济困之金丹。人其悟之。","jie":"目前尚不得志，但不可因此而消沈，不如自我排解，高歌取乐，只能等待时机。直到得势之时，已到了晚年时期，依然可以得到至高的名利。此签表示必须忍耐待 时，如果无法以乐观的心态等待，则只能含恨一生，而且破坏了老年的好运。白马也有表示年月的意思，指的是马年或马月，将是可以转运的时机。"},{"n":90,"no":"第 90 签","ji":"壬癸 中平","jieyue":"此签境地宽舒。尽可安常处顺。消受太平之福。若格外富贵荣华。乃由人家积功累德所致。非可勉强贪求。只须反求自己。何得妄渎神明。若自作不靖。平空生事 。求如现在安闲不可复得。有不辗转愁叹者乎。悟开此理。急将贪求之念。易为积德之计。则幸矣。","jie":"能够像你无事安闲度日者，实在没有几个人，你现在的闲适，是得自先人的积德累善而来，无法强求，如果你无法满足现状，还汲汲营营地想要荣华富贵，求天告 神，只是徒增烦恼罢了，这个贪念会造成诸多劳苦，而且后悔也来不及，必须看开此点，及早醒悟，才得以安闲度日，否则将白忙一场，甚至劳碌终生。"},{"n":91,"no":"第 91 签","ji":"癸甲 中吉","jieyue":"此签凡有谋望。皆得成就。但须涉历勤苦方可。故以淘沙见金为比。沙非容易淘。金非容易得。人生苦志读书。亦复如是。爵禄荣华。皆从诗书中得力。君子忧道 不忧贫。唯自求功夫精到。定有效验。若作辍无常。内鲜实功。是坐地待金。岂有冀哉。","jie":"努力必有收获，但并非容易，必须付出心力，才能有所得，就像是读书人一样，努力用功，书中自有颜如玉，书中自有黄金屋，但必须经过辛勤的劳苦，未来功名 皆从书中得来，其中的奥妙，必须细细思量，也就是辛勤用功，才得以功成名就。此签表示没有不劳而获，必须经过一番劳苦，富贵名利才会随之而至。"},{"n":92,"no":"第 92 签","ji":"癸乙 中下","jieyue":"此签年运欠吉。诸事不利。耕作防凶年。置货防折本。是非曰有。病患淹缠。交冬至后。方得清静之象。凡事凶多吉少。祸早福迟。最宜审慎。","jie":"今年的收成与往年不能比，实在是少得可怜，因为天灾所致的歉收，造成了物价的大幅波动，这是百年来的大变动，因为无法防止的天灾，造成了传染病的流行，而且有致命的危险，必须到冬至时节，才得以控制，慢慢地回复以往。此签表示今年运气不佳，诸事不顺遂，必须要到年尾冬至，才能较平顺，然而一年即将过完了，表示凶多吉 少，必须要特别谨慎小心。"},{"n":93,"no":"第 93 签","ji":"癸丙 中吉","jieyue":"此签谋望。起首及中间不免阻滞。末后方得顺利。如春天雨水多。亦不为好。夏天晴干太甚。亦属急迫。一旦时雨滂沱。顿觉生机勃勃。喜出望外。人久困得时者 。似此景像。岂非盈虚消长之听乎。自然吉凶祸福之主于气数者乎。","jie":"春天是一年的开始，连绵的春雨一直下不停，到了夏季时，却又干旱无雨，实在是时运不济，春天洒下的种籽，因为太多的雨水，无法完全生长，到了夏天成长的 时期，须要较多的雨水，反而又干旱，势必今年的收成会有影响，好不容易到了仲夏时期，节气转换之时，来了场滂沱大雨，有久旱逢甘霖的意思，足以滋润干涸的农作物，解决 了危机。"},{"n":94,"no":"第 94 签","ji":"癸丁 中吉","jieyue":"此签示人扼要争先之道。头绪虽烦。目应批却遵窍。恰得妙着。尽先布置。恐有阴私小人。从中挑拨。不可过听。总须自作主张。依理而行之。积久勿替。则纷烦 定而事绪理矣。凡事不可游移无主。持正有守则吉，治家者切不可听信妇人之言。","jie":"平时所用的工具，和人是一样的，制造器具的精巧工匠，虽然有着巧妙的手工，但没有须要用到器具时，也只能默默地钻研自己的手艺，只能随遇而安，固守本分 ，无法强求，一直到秋冬季节，遇到了须要用这个器具的主人，才得以发挥工匠的手艺。此签表示平时专注在手艺方面的钻研，等待时机的到来，时间到了，就会遇到赏识工匠手 艺的主人出现。"},{"n":95,"no":"第 95 签","ji":"癸戊 中吉","jieyue":"此签名利晚成。凡事皆主迟得。如骊珠在手。似宜声价十倍。然机缘未至。强图奚益。必待头颅老大之后。方得贵人扶持。所谋遂意。亨困迟速间。天实主之。岂可冀幸哉。","jie":"明明知道你是个有实力的人，偏偏生不逢时，当机缘未到之时，勉强也是没有用的，一直到两鬓斑白之时，才得到贵人的赏识，所有的名利富贵，都必须在晚年才有所成。在年轻时必须多多充实自己的能力，也许必须度过漫长的蛰伏期，但总有出头天的时候，不可怀忧丧志，晚成就总比一生没有成就要来得好，必须顺势而为。"},{"n":96,"no":"第 96 签","ji":"癸己 上吉","jieyue":"此签诸事迟滞。赖有佛力暗持。皆由积累有素。早经感应。直待功行圆满之后。自有颖秀佳儿。为之光大门户，不过稍迟。必无爽报。人可不以存心阴骘为要哉。 占者合此则吉。否则急自修省可也。","jie":"结婚生子乃是人生大事，在这方面会比较晚成，但还是会有结果，不要抱怨，可以把精神寄托在神明，从事善行，则可招来吉运，现在的报应是累积了前四十年的 因果，也就是现在的祸福是自己过去善恶的结果，由于过去一直行善，所以在功德圆满之时，能喜获麟儿，凡事不可强求，一切都是自己所累积的结果。"},{"n":97,"no":"第 97 签","ji":"癸庚 上上","jieyue":"此签功名晚成。应在五十以外。少壮时有志不遂。衰迟后无意得来。此乃天数所定。然不可因此自足。须更力加培植。事事积德。处处存心。古称现在之福。如点灯。渐点渐消。积来之福如添油。越添越盛。由是增寿加禄。后福未艾。虽晚遇更胜少壮也。圣言不虚。信之宝之。","jie":"过了五十岁之后，对于功名利禄已经快要灰心了，怎么会知道迟来的富贵接着而来，盛况在前，必须更行善积福，将随时心存善念，则寿命会更加延长，地位也会更加崇高。此签表示一切功名皆晚成，在中年之后富贵将不请自来，将善行存于心中，是保有富贵的最佳方式，此后将一切顺遂如意。"},{"n":98,"no":"第 98 签","ji":"癸辛 中吉","jieyue":"此签先凶后吉。凡事逢春则遂。遇卯年月日。渐见生机。不可急遽贪求。枉费心力。无益于事。何如惜养精神，以待水到渠成之妙。非所谓相时而动。动罔不藏者 乎。","jie":"耗费精神在经营事业上，总是毫无头绪，即使辛勤地南北奔波，也是无济于事，必须等到卯年月日，才得以转机，此时才能渐渐顺遂，犹如干枯的树木，每到春天 的时候，依然能发出新芽，犹如重生。此签表示必须经过一番辛勤的努力及失望，直到适当的时机，才得以扬眉吐气，时机未到，做任何的努力都是无济于事，时机到了，有水到 渠成之势，晚景运势亨通。"},{"n":99,"no":"第 99 签","ji":"癸壬 上上","jieyue":"此签主交友言。由疏而密。由淡而浓之象。始时贫贱相交。迹似淡漠。一旦朋友得志。贵极人臣。大有开阁相延之庆。况以车笠旧好。自无不勤加拂拭。有不如骅 骝之开道路者乎。凡事先平而后奇。先名而后实。先艰阻而后顺利。大得贵人之力。","jie":"在他乡异地所认识的朋友，不知他未来会是皇宫贵族，当时均是两袖清风之人，所以交情完全在于人品，反而能交到知心好友，他日成为高官禄爵，必能顺手提携 ，成为共享富贵的朋友。此签表示在穷困潦倒时，才能感到其真心，交情不因身份的而有所不同，才是真正的好友，表示得到朋友的提挈而飞黄腾达。"},{"n":100,"no":"第 100 签","ji":"癸癸 上上","jieyue":"此签已成功而终。前数之终。后数之始也。聚前数之终。则有丰亨豫大之象。藏后数之始。则有引伸不穷之意。是以百事皆宜。根深实茂。永远完成。然必至诚无 伪。积善感通。方得受命如响之应。唯厚所以集福之本而已矣。","jie":"天仙是众仙之上的神明，而雷雨师是掌管雨水的多寡，也是世间凡人耕作收成的重要天神，吉凶祸福凡人不可得知，而我必定知晓，至诚至信的祈祷，只要不贪心 或存有害人之心，愿望必能得到实现。抽中此签为签之终，而百签也有圆满的意思，凡事皆能顺遂，必有所成。百是圆满的终点，也是起点，天地万物自有循环。"}]

  qian:[{"n":1,"ji":"上灵签","text":"福如东海寿南山，君尔何故苦中间？富贵荣华天注定，太白贵人守身边。","jie":"凡事大吉，暗劝世人。","jieyue":"好花芳菲，未曾结籽，狂风吹着，依旧和平，故事相同。","diangu":"在唐朝时期，郭子仪是一位杰出的将领和政治家。他在战争中表现出色，被封为“全禄大夫”，并担任了多个重要职位，包括东都留守、京兆尹等。他对巩固唐朝政权，发展农业和商业都做出了重要贡献。然而，他在安史之乱期间曾与叛军联手，这使他的名声受到一定影响。尽管如此，郭子仪的战术和管理技能仍然被后人称赞，并被视为中国历史上著名的军事家之一。"},{"n":2,"ji":"上灵签","text":"风恬浪静好行舟，高歌鼓舞乐悠悠；四皓八仙齐畅饮，十八学士登瀛洲。","jie":"功名大吉，出外大吉。","jieyue":"天地祥和，龙门方开，功名守得，好事自来，东风不顺，祇于南州。","diangu":"相传古时候有十八位学士，他们游历四方，一路上到处传授学问，受到了众人的敬仰和爱戴。有一天，他们来到了神话中的蓬莱仙境——瀛洲。站在瀛台之巅，十八学士看到了一个全新的世界，他们感慨万千，心中充满了感慨和敬畏。他们体会到了天地间的无限奥妙，也更加坚定了自己学习的决心。登上瀛台之后，十八学士离开了瀛洲，前往更加广阔的天地中，寻找更多的学问和真理。他们不断的学习进修，成为了后世的学术泰斗和伟大的文化传承者。"},{"n":3,"ji":"下下灵签","text":"鬼门关上撞无常，破船更遇浪头风；久远冤家相罗网，运交吉时也遭殃。","jie":"暗阴有财气，光阳则不吉。","jieyue":"卦有异象，暗内穿针，只得小心，凡事莫急。","diangu":"武则天在唐朝晚期统治了中国。她是中国历史上唯一的女皇帝，也是唐朝历史上最具有争议性的统治者之一。在她的统治下，中国经济繁荣，文化发展，政治稳定。她通过实施一系列政治和经济改革，加强了中央政府的控制力，促进了社会的稳定和繁荣。虽然她在统治期间面临一些挑战和反对，但她最终坐稳了天下，为唐朝的繁荣和发展做出了重要贡献。"},{"n":4,"ji":"中平灵签","text":"哑子得梦事难言，瞎子穿针更不然；九曲明珠穿得过，在陈绝粮全因贤。","jie":"凡事艰难，有贵人助。","jieyue":"哑子得梦，前程阻扰，贵人扶事，喜得平安，到老双全。","diangu":"孔子在陈：春秋时，孔子应楚国之聘，拟往一展抱负。孔子是中国古代思想家。他出生于公元前551年，去世于公元前479年，在春秋时期陈国的赫赫威望民间流传着关于他的大量故事，这些故事经过演变汇集而成，形成了《陈典故》。"},{"n":5,"ji":"上灵签","text":"宝镜团圆似月明，琴瑟和鸣畅我情；红杏枝头春意闹，登科一举状元名。","jie":"照时婚姻买卖大吉，初一至十五求大吉。","jieyue":"缺月再圆，并蒂莲开，千年宝镜，故月重新，依旧成双。","diangu":"王安石小登科指的是王安石在他初次参加科举考试时的表现。王安石是北宋时期著名的政治家、改革家和文学家，他小登科的时间约在1040年左右。当时，王安石还是一名年轻的学生，但因为他具有出色的才华和学识，他成功地通过了科举考试，得以成为一名进士，并开始了他的政治生涯。王安石在政治生涯中秉持着自己的改革理念，为宋朝政治、经济和文化的进步做出了卓越的贡献。"},{"n":6,"ji":"中平灵签","text":"叶落根深霜不怕，枯木逢春再发芽；虽是中间多进退，钱财到底属我家。","jie":"求财照时吉，事磨但终成。","jieyue":"凿石得玉，淘沙见金，小船过滩，前程有路，贵人扶持。","diangu":"刘福妻劝夫典故发生在春秋时期，当时刘福是齐国的大臣，他被困在五里外的一个小山洞里。他有一位非常勤劳而忠心的夫人，她不惜一切代价将丈夫营救出来。当刘福重获自由之后，他对夫人说：“这次营救你未免有些冒险，我以后再也不会让你冒这样的危险了!”夫人的回答很简单，只是叮嘱：“夫君，明智点，不要再冒这样的危险了!”"},{"n":7,"ji":"中平灵签","text":"梅花冻雪抖芳菲，江上渔翁把钓飞；夜静水寒鱼不饵，满船空载月明归。","jie":"凡事平常，心诚运至。","jieyue":"劝读书，功名遂，清云有路，开山得宝，宽心待时。","diangu":"三国时期蜀汉名将张飞在战斗中打败了名将严颜，并将其押回蜀汉，张飞问严颜：“大军至，何以不降而敢拒战？”严颜回答：“卿等无状，侵夺我州，我州但有断头将军，无降将军也！”张飞生气，命左右将严颜牵去砍头，严颜面不改容说：“砍头便砍头，何为怒邪！”张飞敬佩严颜的忠心和勇气，就释放了严颜并当他宾客。"},{"n":8,"ji":"上吉灵签","text":"皇天降下紫微星，除妖灭怪得安宁；二十八宿扶圣主，汉王家国再重兴。","jie":"暗时星出大吉，凡事二次大吉。","jieyue":"人生志健，星宿相扶，惊天动地，得水还衬，明月照旧，二次大吉。","diangu":"刘秀(5年—57年)，字文叔，汉朝东汉时期的创业者、开国皇帝。南阳郡蔡阳县人(今河南省南阳市邓州市蔡阳镇)，汉景帝刘启的九世孙，妻子阴丽华是南阳恭已侯阴陵侯阴识之孙女，自幼聪慧过人，勤奋好学，有才华。王莽篡汉后，有志之士纷纷起义，刘秀加入反王莽，后在刘縯组织的农民起义中当任军师，最终继承刘縯的事业，荡平各地反王莽的势力，建立汉朝东汉，即汉光武帝(或称汉刘秀)。其帝号为光武中兴皇帝，葬于洛阳陵园。"},{"n":9,"ji":"上吉灵签","text":"富贵总是天注定，五谷丰登胜上年；共享太平歌舜日，含哺鼓腹乐尧天。","jie":"凡事大吉，白天大吉。","jieyue":"日月被云遮，云开依旧明，前世婚缘，万物生来。","diangu":"舜是中国古代传说中的圣人，在中国文化中占有重要地位。据传，舜是一位善良、聪明、有才干的人，他治理国家十分成功，使百姓安居乐业，建立了伟大的人类社会。舜登临山巅，俯视四野，感受到万物生长，深刻理解了土地的重要性，于是开始耕种山地，种下了各种作物。他将农业视为国家的基础，通过劳动，使人们生产出更多的食物，从而改善了人民的生活状况，实现了国家的繁荣昌盛。"},{"n":10,"ji":"中吉灵签","text":"鲤鱼志气本英雄，屈守池中运未通；一旦峥嵘头角现，风云际会化成龙。","jie":"求财潮涨吉，出外风雨吉。","jieyue":"一时鲤鱼变成龙，西京有路直透天，平安走马，顺利行舟。","diangu":"吕蒙正是宋朝时期的一个着名将领，他在南宋时期任职于福建等地的军队中。据传说，吕蒙正曾经在一次训练中破坏了窑厂的瓷器，被指控犯了“破坏公物”的罪名。吕蒙正为此非常气愤，他认为这些艺术家缺乏良心和责任心，于是他决定采取行动。他带领军队包围了窑厂，并威胁要摧毁所有的瓷器，如果艺术家不退还赔偿款。最终艺术家感到威胁到自己的产业，同意向他赔偿。"},{"n":11,"ji":"下下灵签","text":"白虎出山欲害人，鱼入罗网难脱身；害人之心则害己，飞虫扑火自伤生。","jie":"宜守本份，谨防口舌。","jieyue":"自食恶果，寒心鬼扰，凡事虽成，不宜安身。","diangu":"这是一个关于韩信和钟离的传说。传说，韩信带着五千支军队来到钟离家中，钟离一见到军队就很害怕，怕他会杀掉他及家人，但韩信说他只要看看钟离的弓，不会害他们。钟离也不敢违背韩信的命令，于是将自己的弓树示他，但结果韩信却说他不会杀害他，而是要求他学习弓术，受他的教导。"},{"n":12,"ji":"中吉灵签","text":"太公钓鱼八十秋，除商灭纣再兴周；民安国定太平日，江山万里任君游。","jie":"凡事照旧，潮涨大吉。","jieyue":"身闲不闲卜中知，知足常乐自有福。","diangu":"相传太公是周朝的第一个宰相，为帮助周武王推翻商朝，他在寻求战友和支持者的过程中，来到了周武王的文王的领地。太公听到文王的话，知道他绝对不是一个只顾自己的人。于是，他帮助文王终于推翻了商朝，建立了周朝。"},{"n":13,"ji":"下下灵签","text":"鱼在小涧生长难，深处安身浅水寒；清冷香中抱膝吟，夷齐饿死首阳山。","jie":"头好尾衰，财气趋淡。","jieyue":"万里家州好，作事虎问龙，饶人不可进，息人应自洁。","diangu":"夷和齐两个隐士，不敢吃周朝的粮食，觉得这是一种耻辱，因为周朝在当时是中国的中央王朝，夷和齐则是其前朝国家的人，两个人就一同到首阳山里去隐居了，采了薇草来吃着，后来就在首阳山下饿死了。"},{"n":14,"ji":"中吉灵签","text":"释迦幻化妙应身，老君抛送玉麒麟；真宗求嗣生太子，梁纥祷丘出圣人。","jie":"诚信立世，有求必应，添油向善。","jieyue":"逢事须心诚，自有贵人扶。","diangu":"释迦幻化妙应身，是佛教中的一个概念，意为佛陀能随时随地以不同的身体出现，以方便众生的救渡。这种幻化的能力被称为“神力”，佛陀通过神力，可以在世间出现各种形态，如修行者、僧侣、皇帝、普通人等等，以便面对不同的众生和环境。这种幻化身的能力，既是佛陀智慧和慈悲的表现，也是教育和启迪众生的方法之一。"},{"n":15,"ji":"上吉灵签","text":"日上东方如火轮，十分光彩照乾坤；二十四气尽清洁，一年四季太平春。","jie":"凡事大吉，日照大吉。","jieyue":"前人栽果后人收，凡事迟疑不可取，当时进步，退后难留。","diangu":"观世音菩萨出身于兴林国妙庄王，以慈悲心超渡众生，在南海普陀洛迦山修成正果，号“正法明如来”，她以誓愿救护无明众生苦海，不脱免苦难，则不成佛。观世音菩萨渡人脱离苦海，神通广大。凡有哀求，祈求得到佛恩无量。在中国佛教历史上，观音渡众生一直被认为是佛法之大慈悲，是佛慈悲渡世的极大功德。"},{"n":16,"ji":"中平灵签","text":"一盏孤灯对面休，富贵钱财水上舟；任他险处不见险，主人有福再添油。","jie":"凡事不须强求，向善即逢凶化吉。","jieyue":"摘来钱财，如何得久，免伤和气，且宜退后，多种善果，恶事莫为。","diangu":"朱寿昌弃官寻母典故是一个传说中的故事，讲述的是一个北宋时期的叫朱寿昌的人，他从小失去了母亲，后来他从皇帝那里被收容，考上了官，随后他发誓要找出他的母亲，于是他潜心学习，终于成功了，最终还找到了自己的七十多岁的老母亲。此故事反映了对亲人的情义之深，也反映了勤奋学习的重要性。"},{"n":17,"ji":"中吉灵签","text":"三人各姓同一心，桃园结义情意深；山中石头皆是宝，运来都能变成金。","jie":"凡事人和，能成事业。","jieyue":"志同道合能成事，开花逢春喜气扬，步步相宜，宅旺家兴。","diangu":"桃园结义是指刘备、关羽、张飞三人在桃园结拜为兄弟的典故。三国乱世之时，刘备因对曹操的忠诚感到失望，决定与关羽、张飞一起离开，寻求自己的道路。三人在夜晚相遇于桃园，饮酒高歌，相约结义。通过握手誓言，三人一同宣誓成为兄弟，肝胆相照，同盟共抗曹操。桃园结义的故事象征着忠诚、义气和团结，也成为中华文化中的经典形象之一。"},{"n":18,"ji":"中平灵签","text":"囚人出禁上酒楼，畅饮宽杯解闷头；劝君慎忍一时气，非干己事且相饶。","jie":"宜守本份，以退为进。","jieyue":"好花冽雪里，开时不遇春，宜退不可进，宜守免灾殃。","diangu":"程咬金是唐朝末年的著名将领，他是唐代的豪杰，极有威名，曾经屡建战功，但因为一次意外的失策而被废黜为庶人，家破人亡，孤苦伶仃地流落江湖。据传说，唐朝时期，程咬金被废黜为庶人后，过着极苦的生活。一天，他听说皇帝要为百姓赦免一批罪犯，并且招募战士，让他们重新回到军队中去。于是，程咬金来到了皇宫，请求皇帝给他一个机会，让他重新回到战场上来为国效命。当时的皇帝看到程咬金的忠诚和勇气，便亲自为他恢复了他的官职。从此之后，程咬金又成为了唐朝的一位重要将领，取得了更多的胜利。这个故事告诉我们，即使陷入了困境，也不要失去信心和奋斗的勇气，只要毫不放弃，坚持不懈地努力，就有可能获得成功。"},{"n":19,"ji":"下下灵签","text":"若要求财未得时，只恐鬼贼相侵害；关门闭户家中坐，灾祸偏从天上来。","jie":"遇事不吉，须防小人，防患灾祸。","jieyue":"人逢恶贼心存扰虑，虽有贵人徒劳开心，休贪他人马，自失手中牛。","diangu":"唐玄宗李隆基苦等武惠妃过世后，宦官高力士在民间寻得江采萍，她被封为梅妃。梅妃是才貌双全的女子，唐玄宗对她甚是宠爱，在宫殿周围种上梅树，使她能望见最爱的梅花。但失宠与宠爱更替时，美人杨玉环的到来，最终梅妃只剩下陪伴她的梅花，梅阁成为了冷宫。"},{"n":20,"ji":"中吉灵签","text":"夫妇有意两相求，绸缪未合各成愁；心有灵犀一点通，天注姻缘不须忧。","jie":"逢春大吉，暗事大吉，凡事有成。","jieyue":"先取无长，后取无短，问事迟疑，眼前未遂，日后遇时，云开见日，依旧光辉。","diangu":"宋朝的苏小妹是苏东坡之妹，博学多才，脑筋聪明，个性顽皮。当苏小妹渐渐长大后，她的婚姻成为苏家考虑的问题。当时苏东坡认识了秦少游，就将他相亲给苏小妹。苏小妹新婚之夜准备了三个难题考夫婿，秦少游顺利回答前二题，苏轼暗暗发笑，提示秦少游最后一题答案，秦少游欣然入洞房，于是两人顺利在洞房内云雨交欢。"},{"n":21,"ji":"中吉灵签","text":"牛郎织女各天边，阻隔银河路杳然；百年富贵风前烛，一旦荣华云里仙。","jie":"凡事无实，财气五分。","jieyue":"牛郎识女难会，佳期好事难过，不可向前。","diangu":"七夕相会典故起源于古代中国，也被称为“乞巧节”或“女儿节”。这个节日通常在农历七月七日庆祝，这一天是牛郎和织女相会的日子。传说称，牛郎是一个聪明勤劳的农夫，织女是机智美丽的女神，两人相遇相爱，但是天帝不满意他们的婚姻。他将织女带回天上，并禁止两人相见。但是，他们的爱情感动众神，天鹅帮助牛郎跨越天河，让两人重逢，并且从此地上每年七月七日，牛郎和织女都能在天上相会。这个传说被人们传颂了很久，并演变成了七夕节，这一天人们崇敬美好爱情，祈求自己的爱情能够长久美满。"},{"n":22,"ji":"中平灵签","text":"张弓射日总虚空，朽木难雕白费工；平生常念千声佛，作恶枉烧万主香。","jie":"凡事慎言，事满招损。","jieyue":"他要进前，事有难言，梦中得宝，醒后全无。","diangu":"后羿射日和嫦娥奔月是中国传统神话故事中的两个著名人物。传说，后羿是上古时期的一个英雄，他有一把神奇的弓箭，可以射击远处的目标。当时，天空里出现了十个太阳，使得大地干旱、人民疲劳。后羿便用他的神弓，一箭射下了九个太阳，为人民带来了解脱。而嫦娥则是一位美丽的仙女，丈夫是后羿。她偷吃了后羿得到的不死药后，便飞升上月成为月宫中的仙女。她每天都在月宫里度过孤独的时光，思念丈夫和故乡。这两个故事都寄托了中国人对英雄、仙女和生命的向往和追求，而且在中华文化中既有着载体又有着象征意义。"},{"n":23,"ji":"中平灵签","text":"雷霆霹雳震虚空，天公差我察吉凶；积善之家有馀庆，积恶之家有馀殃。","jie":"作事应随运，求财遇春吉。","jieyue":"世事混吨没定数，劝君宽心莫嗟迟，天高地低原有意，远处晚景不胜情。","diangu":"刘文定买父典故是一个历史上著名的故事，讲述的是唐朝时期一位名叫刘文定的官员因为想要买一部《左传》(一部古代文献)而去找自己的父亲借钱。刘文定的父亲却问他，如果只是为了买一部书而去借债的话，那么这部书到底有多重要呢?刘文定想了一想，回答道：“《左传》可比我父亲的家业还要重要。”他的父亲听到这话后，非常欣慰，借给他了钱。这个故事表达了家教重于历史文化传承的思想，也成为了中国文化中的经典典故之一。"},{"n":24,"ji":"中平灵签","text":"伏羲八卦最精灵，六十甲子推五星；暗虚亏心天地见，举头三尺有神明。","jie":"隐忍则善，静以待时，夜求昌吉，财气三分。","jieyue":"无私作事最开心，前路受阻必有因。","diangu":"伏羲是中国古代神话中被尊为“阴阳之祖”，是古代文明的创始人之一。传说他画出了八卦，用来研究天地间的自然现象，探索宇宙的秩序。伏羲把八卦分为天、地、山、水、澜、雷、火、风，每个卦代表着一种自然现象或力量，让人们对未知事物有一定的理解。"},{"n":25,"ji":"下下灵签","text":"昔日螳螂去捕蝉，岂知黄雀在后边；莫信他人直中直，须防心里仁不仁。","jie":"凡事太险，谨防则吉。","jieyue":"往事劳伤，求财问事，家破人亡，食无求饱，居无求安。","diangu":"作为汉武帝的皇后，吕后确实对韩信有所害处。韩信是汉朝初期的杰出将领，曾帮助刘邦夺取天下，并在刘邦去世后维护过汉王室的稳定。然而，韩信的权力和威望逐渐超过了汉王室，甚至有篡位的嫌疑。吕后对韩信心存戒备和嫉妒，于是在汉武帝亲政后密谋陷害韩信。吕后先是让韩信去边疆镇压叛乱，然后派人暗中向叛军泄露韩信的计划，导致他被包围和击败。随后，吕后又谎称韩信暗中谋反，将他投入大牢，并拒绝释放。最终，韩信在牢狱中自杀身亡。"},{"n":26,"ji":"中平灵签","text":"三藏取经往西天，路途险阻劳圣贤；云横秦岭家何在？雪拥蓝关马不前。","jie":"凡事艰难，财运未到，忍以待时。","jieyue":"凡事多磨，小船过河，流急滩险，往西无路，石头粉碎。","diangu":"说中，唐玄宗下令三藏取经是在公元647年发生的，当时唐玄宗派遣了一位叫做玄奘大师的僧人(又叫三藏)，前往西天取经。三藏取经行程非常艰苦，他历经十八年，最终获得了圣经《释迦牟尼经》。后来，三藏又经过十六年繁琐而艰辛的旅行，最终回到故乡，将取回的《释迦牟尼经》献给唐玄宗，以此使佛教传播开来。"},{"n":27,"ji":"中平灵签","text":"八仙过海赴蟠桃，龙王降夺蓝采和；因贪玉皮动刀战，慈心惟佛来讲和。","jie":"凡事曲折，有贵人助，财运未到。","jieyue":"求财问事，退步回头，枉费心机，贪财人散。","diangu":"“八仙”是指铁拐李、汉钟离、张果老、吕洞宾、何仙姑、蓝采和、韩湘子和曹国舅。八仙因为听说东海海龙王的生日会庆典会很盛大，所以一起坐云兴风，飞往东海参加庆典。八仙中最滑稽的是铁拐李，他不识字，迷路后误入富家子弟家居住，被家人待如上宾，铁拐李半年后被富家千金鞋子上的一个小孔所惊动，得知非常后匆匆离去。八仙终于到达东海，大家一同献礼，玉皇大帝授予他们神仙之名。八仙过海典故寓意着主动参加生日宴请，增进友谊，共庆太平的意义。成语“八仙过海，各显神通”也因此而来。"},{"n":28,"ji":"下下灵签","text":"口占昆山玉，行人问吉凶；劝君急退步，不久落坑中。","jie":"歹心作恶，天降横祸。","jieyue":"神龙伐恶，吉者没事，歹人遭殃，天诛地灭，会有预兆。","diangu":"赛卢医歹心害人是一个历史典故，相传发生在中国南北朝时期。赛卢医是当时著名的医生，他深得皇帝信任，被任命为宫廷医生。然而，赛卢医性格狠毒，常常利用医学知识害人。他经常给病人开错药方，导致病人病情加重，甚至死亡。有一次，赛卢医给一位年轻的妇女开了一剂毒药，导致她死亡。这个事件震惊了整个宫廷，皇帝下令对赛卢医进行调查。调查结果证实了赛卢医的罪行，皇帝下令处死了他。这个典故告诉我们，医生是保护和拯救生命的职业，必须严格遵守职业道德和医学伦理。任何利用医学知识损害人民利益的行为都将受到严厉的惩罚。"}]

  qian:[{"n":1,"no":"第 1 号签","ji":"上上大吉签","text":"关关雎鸠，在河之洲，窈窕淑女，君子好逑。","jie":"春令之鸟儿啭枝头。在于河之洲。一群由冬天醒来之鸠儿歌唱。其婉转歌声。如一少女之求偶之声。此景者。世人之常。男之大当婚。女之长当嫁。君子求之者多。一位淑女终得以淑配。良人得良缘。一路光辉。永远和谐。白头偕老耶。"},{"n":2,"no":"第 2 号签","ji":"中签","text":"落霞与孤鹜齐飞，秋水共长天一色。","jie":"落霞与孤鹜齐飞，秋水共长天一色。落霞与孤鹜。均是寂寞。寥落之象也。于落霞之中。单象影只之鹜飞行者。予人深感秋尽冬之来。旺盛蕃衍之夏季已过。秋已尽。如此际遇之时。君汝宜乐善不倦积德当先。待时之时。自有合成之时。"},{"n":3,"no":"第 3 号签","ji":"上上签","text":"宗庙享之，子孙保之。","jie":"上一代之福延于子孙。祸亦同也。福之延于吾一代。其惠爱之情。当不可须叟忘之。享自上一代。吾当设法延于下一代。事事如此之时。一代延下一代。皆可享用不竭。汝怀念祖先。子孙亦同之。"},{"n":4,"no":"第 4 号签","ji":"中签","text":"斯人也，而有斯疾也；斯人也，而有斯疾也。","jie":"一个人皆有疾。毛病。癖之所成。连圣贤在修养到家之前也是如此。毛病与过失。皆不能免。"},{"n":5,"no":"第 5 号签","ji":"上签","text":"逾东家墙而搂其处子，则得妻。不搂，则不得妻。","jie":"如在偶然之机会。或相处已久。视伊人为终身可许之者。应采取行动。不宜逸失机会。姻缘之至也。必须勇往迈进。"},{"n":6,"no":"第 6 号签","ji":"上吉签","text":"风弄竹声，只道金佩响；月移花影，疑是玉人来。","jie":"风弄竹声，只道金佩响;月移花影，疑是玉人来。春风一动。竹叶之摇晃。沙沙作响。啻可听道金佩在响。月日一日日地去耶。花影见了。心底下。疑玉人来。繇此可知。君之好事已近。"},{"n":7,"no":"第 7 号签","ji":"上签","text":"斯是陋室，唯吾德馨。","jie":"虽居于简陋之闺房。唯一己之德俱备时。自有它馨香之处。易言之。一己。居于极陋之室中。如德。智皆备之时。天自有赐良缘之时。不必自卑自弃耶。"},{"n":8,"no":"第 8 号签","ji":"中上签","text":"期我乎桑中，要我乎上宫，送我乎淇之上也。","jie":"男女之婚姻是终身大事。是决定人生一生幸福之大事。爰之。不得以逾越。不正。强行等。手段行之。必须以正当方式取得对方之芳心。两相情愿之下完成。如违反上述原则行之时。虽结合。惟两者之间。貌合神离。不得行之。否则良缘亦为此破坏无遗。"},{"n":9,"no":"第 9 号签","ji":"下签","text":"则父母，国人皆贱之。","jie":"则父母。亦即使君尔之椿萱也。皆轻视君汝之意。繇此可之。为人子弟者。为合受父母疏远。唾弃。贱之。原因多矣。最大之原因。不出不慎交友。如一己之不慎。一失足成千古恨之时。后果堪虞者。爰之。必须慎行之。婚姻同之。终生之伴侣。必须慎择之。"},{"n":10,"no":"第 10 号签","ji":"上签","text":"有道是养儿防老，积谷防饥。","jie":"自古以来有两大古训。养儿为了一己之防老。老了以后。可繇伊等侍奉。贻娱老年。平素则省吃俭用。积谷可防饥。尤其是养儿耶。必须善教之。婚事同之。结发成伉俪之后。老境亦能相互照顾也。"},{"n":11,"no":"第 11 号签","ji":"中平签","text":"自剪芭蕉写佛经，金莲无复印中庭。清风明月长相忆，玉管朱弦可要听，多病不胜衣更薄，宿妆犹在酒初醒。卫星年违别成何事，卧看牵牛织女星。","jie":"前之一句则是自剪芭蕉之叶。写佛经。清风明月耶长相忆。亦即是清风中之明月。缅怀已往之岁月。往事。一面幻想着自己之前途。皆无补于事者。此景犹如多病之人。衣薄，宿妆又如酒初醒之时。不如现在耶。皆意养吾身。有了健全之身。自有健全之志随之。唯有如此。方有新之机会可逢遇。"},{"n":12,"no":"第 12 号签","ji":"中签","text":"一则以喜，一则以惧。","jie":"此尘世之事。无以两全其美者。甚至有人曰。世人之事耶。十之八九不如意。如此反复不以之世景下。吾人该以如何面对。啻好面对现实。就事情分析。分析。取舍之。不宜奢求之。但亦不必为小挫而气馁欤。"},{"n":13,"no":"第 13 号签","ji":"上签","text":"山穷水尽疑无路，柳暗花明又一村。","jie":"前面一片重重迭迭之山岭。已经觉得自己再业没路可行之际。忽尔又出现一村子来。在心灰意懒。万念俱灰之时。峰回路转。来了一线生机。为君带来莫大希望。是人之命运也。汝已入佳境。必有佳遇耶。"},{"n":14,"no":"第 14 号签","ji":"上上签","text":"谁谓荼苦，其甘如荠。宴尔新婚，如史如弟。","jie":"一己之先入观念。对某物有喜爱。赞赏有加。爱屋及乌。如苦瓜。苦茶。虽是有苦味。但喜爱之人食之必言其美味且甘耶。伴侣之选择复之如是。以爱为出发。自无贵贱之分。爱之有加。"},{"n":15,"no":"第 15 号签","ji":"中签","text":"君子审礼，不呆诬以奸诈。","jie":"君子之为人也。必须注重礼节。凡是明知言行之失去礼节者。皆守正。绝不入不正之途，思想高超。格调要高。如冰清玉洁。必受人欢迎。且他人亦无有可乘之地。无法藉词加以诬蔑者也。"},{"n":16,"no":"第 16 号签","ji":"上上签","text":"意中人，人中意，则那些无情花鸟也情凝，一般的解结枝头学并栖。","jie":"一己之心。尽了人事。必有精账?易言之。意中人。人中意。真情表露时。连那些不能言语之花鸟亦可致意者。意。情之到也。缘份附之。必有时机之来到。"},{"n":17,"no":"第 17 号签","ji":"中签","text":"德者本也，财者未也。","jie":"古人曰。一人之于世。最要者立德。立言。立功三者。有德者轻财。具有德而重财者。德随之堕之。惟财者人生必要之身外物。取之有道。非秤义之财勿取。爰之。由此可知选婿选妻。亦须根据此原则。婿择良人。妻求之淑女。千万不可重财轻德。否则后果堪虞也。"},{"n":18,"no":"第 18 号签","ji":"上签","text":"非独内德茂也，盖亦以外感之助焉。","jie":"雄鹰藏爪。同样道理。具有才能之人。因书读多。品德。学识俱丰。不愿将自己之才华露于外。惟婚姻独有不同。如心中喜欢。可将一己之力。作适度之显示。予以激发对之。引起对方之信赖是心要者。秘而不宜。伊人。无从所得。必有所碍。甚至一走了之。"},{"n":19,"no":"第 19 号签","ji":"中签","text":"或十年，或七八年、或五六年，或三四年。","jie":"或五六年，或三四年皆以年月示之。君汝与她之缘之成也。或费三。四年补六年。或七八年。甚至十年亦不一定。当提起之后。或因时。空。事业之学业。关系分东。有了某种契机。有急骤转变之者。速即恐有变。须耐心待之。"},{"n":20,"no":"第 20 号签","ji":"上签","text":"何如，子曰，可也。","jie":"如有人问。如此问题该何如解决。曰：可也。即可以进行之。问之何人。即是就放于我之师长。伊等之告之于君。可也。汝可抱为南针。毅然行之。婚姻同之。目下君所交之伊人。可与否。还是请教长辈。伊人之眼光中。可者可取之。"},{"n":21,"no":"第 21 号签","ji":"上上签","text":"十亩之间兮，桑者闲闲兮。","jie":"曾是五亩田之家。植之桑麻。家人即可三餐得温饱者。今之也。已有十亩之地可植桑麻。自然更宽裕之。生活稳定。名利该薄之。淡于名利。生活则乐之。否则天谴之。"},{"n":22,"no":"第 22 号签","ji":"上上大吉签","text":"久旱逢甘雨，他乡遇故知，洞房花烛夜，金榜挂名时。","jie":"大吉大利之象，平常所谓双喜临门，已是罕见，如今四喜临门，真是人间少有。，五福临门，世上无双。"},{"n":23,"no":"第 23 号签","ji":"中签","text":"只一点故情留，直似春蚕到老，尚把丝抽。","jie":"伊人作情。汝为其情所迷。如春蚕之蛹。固执之。一个人之情。却未必如此痴之。凡事者。中庸之道守之。未必死心塌地之境地。不可不知者。宜自重之。"},{"n":24,"no":"第 24 号签","ji":"中签","text":"他思之己穷。表明伊也对尔已无爱情可言。不仅无爱情可言。且恨汝入骨之境。原因何在。她尚在孤单一人。是为娇鸾鶵凤。失雌雄。易言之。如有子女。恐怕不与伊人在一起度此生。宜求神解之。","jie":"思念越多恨也越多。即使再多的感情也已化为恩怨情仇，已表明不但没感情，而且非常恨你。原因何在。是因为彼此的不成熟。让她孤单一人幽怨相伴!。如果你们有了孩子，恐怕她也会和孩子离开你，不愿与你相伴共度此生!求得此签目前福缘不佳，切莫等闲视之。宜积极挽回并求月老排解。问缘份，求神解。问婚姻，宜积极挽回。并求月老排解。可免一无所有。"},{"n":25,"no":"第 25 号签","ji":"上签","text":"可妻也。","jie":"可妻也。伊人是好伴侣。可娶嫁之。惟目前尚有若干问题之存在。均是琐碎不必弹虑者。既成好事也。将来必永浴爱河。白头偕老。"},{"n":26,"no":"第 26 号签","ji":"上上签","text":"维熊维罢，男子之祥。维虺维蛇，女子之祥。","jie":"男性梦中见熊。罴等物也。吉祥也。将有飞黄腾达之一日。女性之梦中见虺。蛇之属。亦是祥兆也。本首之诗文告之于君。生男者可成莫雄。生女者为淑媛也。"},{"n":27,"no":"第 27 号签","ji":"上平签","text":"有宗室之美。","jie":"君尔该知，不能仗己为贵族之出。时局已变迁。已无五爵之分。世人皆平等。人生而平等。并无天子。赤子之分也。爰之。君汝为寻佳偶时。必须从平常人寻找去。门当户对。或古人之训也。惟世人之视觉自不同于曩息。宜以爱心与缘份为重可也。"},{"n":28,"no":"第 28 号签","ji":"上签","text":"夫妇也，昆弟也。","jie":"一生结为夫妻。为伉俪。必须如昆弟。亦即是如同手足情深之亲兄弟。相敬如宾。决心结为连理之枝。飞于天空之比翼鸟。终生得幸福矣。"},{"n":29,"no":"第 29 号签","ji":"中平签","text":"有意栽花花不发，无心插柳柳成荫。","jie":"悉心照顾花儿。惟为何。明明作对之。中途夭折。话说回来。简单之插下池边之柳枝却蓬勃发芽。婚姻又如此。本是有意甲家之女。却娶上乙家之女。是非常美妙之事耶。"},{"n":30,"no":"第 30 号签","ji":"中签","text":"话别无长夜，相思又此春。瑶姬不可见，巫峡更何人。运石疑填海，乘槎欲问津。","jie":"时为话别之时。恨时间太短。想思于此。皆空思幻想矣。并无济于事。瑶姬。巫峡。皆不可见之地。于渺茫之地。唯事必须重实际。实事求是。才有收获之时。见茫雾之境。皆无益者。"},{"n":31,"no":"第 31 号签","ji":"中平签","text":"设虚，夜静水寒，鱼不饵。笑满船空载明月。","jie":"万籁俱静。水深又冷之时。鱼儿不得饵。出猎去之时。又逢空手回之。船只载明月上归途也。可知君目下之运也。宜重实际。不宜作虚幻之事。实事求是。否则事事落空。无一所成耶。"},{"n":32,"no":"第 32 号签","ji":"上签","text":"因荷而得藕，有杏不须梅。","jie":"此诗文者以同音谐之。因荷「何」而得藕「偶」。有杏「幸」不须梅「媒」者。君汝可知道。因荷之生方得莲藕。为何我能得偶。我亦不得而知。尔是杏「幸」运之人也。自然不需「梅」。媒来妁之。君之鸿运。无人可与伦比也。"},{"n":33,"no":"第 33 号签","ji":"上上签","text":"可以托六尺之孤，可以寄百里之命。","jie":"君汝如能逢遇鲍叔牙耶。可全心诚意之对付之。伊人也。是贵人也。伊之黼增华之时。君汝亦必有大成之时。爰之。一人之希望。可托于伊之身上。"},{"n":34,"no":"第 34 号签","ji":"中平签","text":"仍旧贯，如之何？何必改作？","jie":"君尔目下虽处在逆境。唯必须持之。不宜变之。见之状。为己周章。则愈形愈挫。不宜见异思迁。坚守旧之况。必有机缘之来。不可慌耶。"},{"n":35,"no":"第 35 号签","ji":"下签","text":"遇人之不淑矣。","jie":"今之所逢遇耶。伊人是害人之人也。明知不可交。宜速止之。另择佳偶去可也。"},{"n":36,"no":"第 36 号签","ji":"上签","text":"投我以木桃，报之以琼瑶。","jie":"我之友予我木桃。如野人之献芹者。吾感激之。必报以琼瑶之玉也。世人曰吃人斤量也。必报以两。今之食两。还斤。易言之。一己之待人以诚。将得善果者无疑。必守之人之守则也。"},{"n":37,"no":"第 37 号签","ji":"中签","text":"求则得之，舍则失之。","jie":"若得机会之时。必须把握之。一有机会。君偶目下逢之际遇也。是红之运。求之则得之。舍其机会则弃之。无法再追者。既有机会。千万不可舍之。"},{"n":38,"no":"第 38 号签","ji":"上吉签","text":"妻焉者，亲之主也。","jie":"妻者。除椿萱。兄弟之外最亲密者。爰之对妻之态度。必须如对己之亲人父母。重视之。平等对待之。"},{"n":39,"no":"第 39 号签","ji":"上签","text":"不得乎亲，不可以为人。不顺乎亲，不可以为子。","jie":"一人如失去父母之心。何以为人乎。失去亲人之心。同时将失去朋友。友朋已失。一切皆去耶。宜知孝敬父母。悌其兄弟及友。方能得于世人之心。"},{"n":40,"no":"第 40 号签","ji":"中签","text":"踏破铁鞋无觅处，得来全不费功夫。","jie":"为了成一事。穿上铁鞋奋斗不懈。费心费力。皆无所获。了然了然耶两手到头来皆空空。"},{"n":41,"no":"第 41 号签","ji":"上平签","text":"良人者，所仰望而终身也，今若此。","jie":"一人之善恶。必须终身能坚守为要件。本心为假冒。狐皮覆之。狐假虎威。终能露出马脚之时。如得知其人之底心露者。立即取消之。渐其疏远之。甚至断之。否则有悔不当初之时也。"},{"n":42,"no":"第 42 号签","ji":"中签","text":"重重迭迭上瑶台，几度呼童扫不开，刚被太阳收拾去，却教明月送将来。","jie":"云雾弥漫于瑶台之上。呼叫小童来扫开它。亦毫无任何效果。所幸强烈阳光将其驱送。迨至皎洁之明月出之。如是难通之运亦由伊带光明来。含之义也。汝今虽有意外之损失。但亦将有意外之收获。时间不至于久耶。"},{"n":43,"no":"第 43 号签","ji":"上吉签","text":"君子有援勤之桃，淑女无投梭之拒。","jie":"身为君子之伊也。有援琴之桃时。淑取自无投梭而拒君于千里之外者。易言之。如男之汝。有意接纳时。淑女之尔。自无拒于千里之外之理由耶。"},{"n":44,"no":"第 44 号签","ji":"上签","text":"遐迩一体，率宾旧王。","jie":"遐也远。迩亦瑶之远也。自古以来有千古不易之理。不论古今之时。东西之地。新人不如旧雨。新土亦不如旧主者也。伊人之关乎微至。"},{"n":45,"no":"第 45 号签","ji":"上签","text":"后生可畏，焉知来者之不如今也。","jie":"君尔目下之人。本是可心满意足之人。焉知后来之人。一个比一个更美好。就此环境下。只好愿君作选择矣。慎选之。品、学，兼丰而体能慎之。"},{"n":46,"no":"第 46 号签","ji":"中上签","text":"不愧于天，不怍于人。","jie":"一人之言行方正之时也。对天而不愧。对地而不昧。视人生之财也。如浮云之所以。心之守正。半夜有人敲门。心自不惊。为人之守则。必须守之。"},{"n":47,"no":"第 47 号签","ji":"中签","text":"害女红者也。","jie":"所谓女红者，为人绣罗衣之人也。此埋头苦干。为人刺绣者。厌其罗衣者居多。因女红辛苦绣之。并不能享用其物而慨叹之。为人作灯泡。牵线是已。"},{"n":48,"no":"第 48 号签","ji":"上吉签","text":"五百英雄都在此，不知谁是状元郎？","jie":"今日在君眼前者。皆为一时之选。人才济济。各有千秋。人人之状元之郎君也。必须慎选。选如意郎君之原则也。品德为首。学识次之。门之当。户又对乎。千万叵重人之财。门阀。否则悔之已晚之时。"},{"n":49,"no":"第 49 号签","ji":"上平签","text":"故好而知其恶，恶而知其美者。","jie":"友朋交上以后。由衷喜欢伊人。唯时间一久。不知不觉发现其缺者。相反之。交上心坎里不太喜欢之人。唯久而久之。反而发现其美之所在。是何者该密交舍之宜疏远之人。宜自行审慎断之。取舍小心可也。"},{"n":50,"no":"第 50 号签","ji":"中签","text":"两世一身，形单影支。","jie":"两世之一身也。指君汝之单身汉渡世之主义。光棍。将形成形单影只。何苦后。男大当婚。女大当嫁。是千古不易之理也。为调节生活之枯燥。宜弃之所谓王老五主义。宜谈婚嫁也。"},{"n":51,"no":"第 51 号签","ji":"上签","text":"虽有善者，亦无如之何矣。","jie":"目下，君之缘份已有定终身之谊。忽尔出现比今更理想。令人可圈可点之人。皆已无益者。啻好皆认命。终生以伊为伴侣可也。勿必左思右想。举棋不定。三心两意。皆于事无益者。"},{"n":52,"no":"第 52 号签","ji":"上上大吉签","text":"云从龙，风从虎，圣人作而万，君万事皆可成也！","jie":"目下君尔之运也。云之从龙。风之从虎之运。龙蟠虎踞之势。风云际会。际遇非常之时。君汝必能功成名遂之时。事事能称心者耶。"},{"n":53,"no":"第 53 号签","ji":"上上签","text":"其所厚者薄，而其所薄者厚。","jie":"世人之现象。出乎人之意料者多。如其某君之于汝。曾施予恩。报之也薄。又对某兄施与之薄。君却以厚礼还之。古人曰。施恩勿念。受惠勿忘。行善者。不必以报为念。上苍知之即足矣。唯本签之意即是。君汝之婚姻复如是。君汝之婚姻复如是。必能有意外之好姻缘来结合耶。"},{"n":54,"no":"第 54 号签","ji":"中签","text":"成也萧何，败也萧何。","jie":"一生之中。父母之命也。该唯命是从。唯时代之变迁。或者世人之新观点也有所变化。如有意见。必须向椿萱申述。其理安在。求父母之同意决定可也。未必为从之而毁者。媒妁之言同之。必须审思之。可否从之。熟虑之后可用自己之主张舍取之。"},{"n":55,"no":"第 55 号签","ji":"上签","text":"不思旧姻，求尔新君。","jie":"不必再思念过去之旧姻缘。可求汝新妇也。易言也。过去者已逝。但。君尔之前突辽远而无穷者。不可气馁。亦更不可骄恣。行之稳健可也。"},{"n":56,"no":"第 56 号签","ji":"上上签","text":"永老无离别，万古当团聚。愿天下有情人，都成眷属。","jie":"本签示之于君尔之意也。君之运也。红而紫者。永老无分离。万古常生活团聚在一起。天下之情人成卷之后。都愿伊人百年和合。琴瑟和鸣。白头偕老耶。"},{"n":57,"no":"第 57 号签","ji":"上上签","text":"是谓凤凰于飞，和鸣锵锵。","jie":"君仰头一看。见了凤凰于飞。齐飞于天空。由鸣声中。和鸣锵锵见之。犹如视君之今。必能得良缘。如一对翱翔空中之凤凰。似瑟琴之和鸣。君也必能与伴侣。永合和鸣。白头偕老者。"},{"n":58,"no":"第 58 号签","ji":"中签","text":"帷旧婚媾，其能降以相从乎？","jie":"一人不自量力。妄图高攀。即使得以攀高。事亦不得以称心者。既然如此。不如降落以求。可做为鸡头。不做牛尾。不如是否。枝头凤凰。尔不能见其外表断其幸也。须知其内容方可知也。"},{"n":59,"no":"第 59 号签","ji":"中签","text":"脍炙，所同也，羊枣，所独也。","jie":"每人对鱼炙肉脍。皆有所好。人人喜欢食之。羊枣则啻有君喜之。由此可知。君尔之所得者。比他人为少。婚姻如是也。君汝喜欢之一型人。有其限也。"},{"n":60,"no":"第 60 号签","ji":"中签","text":"心茍不愆，何惜于人言。","jie":"一人之心茍不愆。无违悖道德之事也。自不怕人言之畏耶。心正自心安理自得。再言之。事之无可奉告之于人之时。心内无疚于人之时。自无烦燥之时。此乃者一人长生永乐之道也。"},{"n":61,"no":"第 61 号签","ji":"中签","text":"不知其人，视其友。","jie":"一个人之良痞。如君不能知其良莠者。观其交友朋即可窥其全貌。伊之交。是皆守正不阿。事事正经之友耶。其人亦是正经之属。可交之。婚姻之可结也。可用同一原理为之。不知其人之为何时。以伊之交友慎之。"},{"n":62,"no":"第 62 号签","ji":"上上大吉签","text":"嘉耦曰配。","jie":"与他(她)是否合得来。如两者之间。有意合之。且经一段时间之交友。认为可合者。可合之。不必多考虑者也。是一己之命也。唯必有善果结之。"},{"n":63,"no":"第 63 号签","ji":"中平签","text":"子规半夜犹啼血，不信东风唤不回。","jie":"子规-杜鹃耶国人南方人曰之吐血鸟。目下是半瞑。一只子规。吐血鸟。尚在呕血似地啼叫。犹如说明。君之耶。离乡背井。居边远之地。有人为君汝相思。伊人不相信君之不回故里去者。伊人坚信。至迟耶。东风吹之时。亦即是春之来时耶。"},{"n":64,"no":"第 64 号签","ji":"上平签","text":"齐大非吾耦也。","jie":"齐之大。亦即是伊人是有钱。有势之人。子女耶。汝该知难而退。古人曰。门不当户不对。何以合之。强求之时。必有害也。降格以求。方是幸运之道。"},{"n":65,"no":"第 65 号签","ji":"上平签","text":"在幽闺自怜。","jie":"一己深锁在闺房之中。自己怜之。为何如今尚未遇终生之伴侣乎。曩昔之习俗。女儿耶不得出闺房。男儿亦不得随便。必凭父母之命。媒妁之言成婚。惟世局之变迁。男女均该走出闺房。去交往。先友后婚可也。"},{"n":66,"no":"第 66 号签","ji":"中签","text":"惊起却回头，有恨无人省。拣尺寒枝不肯栖，寂寞沙洲冷。","jie":"汝之婚姻耶。中之者。惊起却回头去。有恨无人省之。无一人帮忙。省顾吾。阻力太大。爰之。冻尽之寒枝上不肯栖。形成之者。其寂寞沙洲亦冷。挑剔太多而来之阻碍。如能阻力无化为助力时。无法得之也。"},{"n":67,"no":"第 67 号签","ji":"上签","text":"再，斯可矣。","jie":"如果是这一次不能成功。再来一次尝试。必能有成功之机会。千万叵气馁矣。放手做可也。"},{"n":68,"no":"第 68 号签","ji":"上平签","text":"苟有可观，皆有其乐，匪必瑰奇端丽者也。","jie":"亦即是指一定姻缘之完满。端赖于深挚之爱情为基本。即可因之。情深。自不致于计较五美之合。才子貌美为要件。更不愿取伊之财富。方能疼之伊人。是情深为婚姻之基础也。"},{"n":69,"no":"第 69 号签","ji":"中签","text":"天下多负人，何必是。","jie":"君不曾受宠。可另择佳偶去。不必为其人伤了身心。他之人。或可为君带来一生之幸福亦未可料。不必为之伤心。"},{"n":70,"no":"第 70 号签","ji":"上平签","text":"利有攸往。","jie":"利者可攸往。汝之命即是如此。如果伊是真实之富者。尔可以妻之。嫁去可也。"},{"n":71,"no":"第 71 号签","ji":"中上签","text":"虽有丝麻，无弃菅蒯。虽有姬姜，无弃蕉萃。","jie":"君尔。在多方奔走。多年辛苦之后。已得衣锦与三餐美食。唯昔时一己之布衣淡食。却不可忘矣。运桥之后。其探杖。岂可丢失耶。又更须留意者。君之身边得之千金小姐之青睐。岂可丢糟糠于不顾。伊人耶。为君奋斗不懈。获得成功之大恩人耶。两者忘之。弃之。君尔之运也。必开始日衰。不得不小心。"},{"n":72,"no":"第 72 号签","ji":"下签","text":"以若所为，求若所为，犹缘大而鱼也。","jie":"如以君尔之言也。行也。欲求达一己之所望。恐如同在缘木求鱼者。易言之。尔之言行。修养两者之间。恐不合者。可止之。不宜再进者。"},{"n":73,"no":"第 73 号签","ji":"上吉签","text":"白云初晴，幽鸟相逐。","jie":"以往君尔之日子是昏暗晦涩者。如今一扫所有之酶气。白云亦初晴。幽鸟相逐于太空中。君尔之缘也。必可成。且是令人羡慕者。放手去做可也。"},{"n":74,"no":"第 74 号签","ji":"中签","text":"恨相见晚也。","jie":"眼前之伊人。令人可爱。可许吾生。予我身。惟探望之下。伊人己身有主。岂有办法可取也。"},{"n":75,"no":"第 75 号签","ji":"下签","text":"则去偷香窃玉上用心，又不曾得甚。自从海棠开，想到如今。","jie":"君尔耶。在与伊人之间。只为偷香。窃玉之上用心。取去玉。偷其香是己。不为爱情而行。易言之男欢女爱。如此之结合。时之过憋。将同床异梦者。爰之。一己与人之结合耶。必须以爱为基础。方有幸福可言。千万不能以千万不能以美、富为基础。青春一去不复返，时间是公平的，失去了，回不来，千万别拿自己青春开玩笑。单身者，不可存侥幸，要留好名声、给人探听。"},{"n":76,"no":"第 76 号签","ji":"上签","text":"忘足，履之适也。忘腰，带之适也。","jie":"忘了足。伊人为我记之。如一双鞋可适君汝之足也。忘一己之腰。伊人又为带来带。又适人。如此之良缘。尔。有何言拒之。必须速求之。合之。"},{"n":77,"no":"第 77 号签","ji":"上签","text":"标有梅，其实七兮。求我庶士，迨其吉兮。","jie":"标有处。有梅这。但其实只有七分者。求我之庶士也。迨其吉之至可也。何必为之着急。急则不成。又在人之来往上。千万叵做斤斤计较也。为人太小气之时。将受之远之。不可不改也。"},{"n":78,"no":"第 78 号签","ji":"中签","text":"欲速则不达。见小利，则大事不成。","jie":"欲速之不达。顾名思议。一人之办事也。宜见其轻重缓急为之。为理一事。急于功者必败者。不过。亦不能拖延久矣。一面也。不可见小利则趋之。见小利易忘其义。受人厌弃之后。一切皆休矣。不可不知也。"},{"n":79,"no":"第 79 号签","ji":"上签","text":"更洒遍客舍青青，千缕柳色新。","jie":"更洒遍。即是表明春雨不得。客舍青青。客舍。尔之住处。青青也。洗得好干净。春雨来耶。千缕柳色新。岸边之杨柳亦条条着上新绿衣。春景已经呈现汝之眼前。尔已经可喜之时来到。"},{"n":80,"no":"第 80 号签","ji":"上签","text":"悲莫悲兮生别离，乐莫乐兮新相知。","jie":"悲莫悲兮。虽是令人悲哀者。亦不必悲。生而必须别离之苦痛事。君汝已经尝过苦头矣。唯乐莫乐兮。快乐之事。令人鼓起勇气之事。已在眼前。悲已去。乐在眼前。不必再担心者耶。顺境者已至。"},{"n":81,"no":"第 81 号签","ji":"中签","text":"经之营之，不日成之","jie":"日日下注功夫。勤劳扶之。必有大成之时。姻缘如此。如果汝对伊人有信心。愿许身。允者一切者。可千方百计接近去。必有大成之时。信之可行也。"},{"n":82,"no":"第 82 号签","ji":"上上签","text":"行去耶，前朱雀而后玄武，左青龙而右白虎。","jie":"左方见了青龙。右手方却又见了白虎在。可知倾慕尔之才华美貌而来之者多。为此。君亦举棋不定。何君为终生伴侣。而受感。在此时。汝可暂时避之。于宁静之环境为下。作慎谋能断。以衡量妥贴之后为之。"},{"n":83,"no":"第 83 号签","ji":"下签","text":"姑舍是。","jie":"目下之际遇而言。不宜合之。如勇士之断指。断然放弃之。否则惹是非。无利幸可图矣。"},{"n":84,"no":"第 84 号签","ji":"上平签","text":"劝君莫惜金缕衣，劝君惜取少年时，花开堪折直需折，莫待无花空折枝。","jie":"君尔。目下之情形而言。千万不可惜缕衣。但宜惜君之少年时也。少年时光易逝。岂可让其去耶。可知君必须把握住机会。不宜放之。花可摘时则摘之。到无花之时。折空枝何之于益乎。为时必须及时。莫惜金缕衣。皆可穿之时穿之。惟必须惜之十八少年时。是人生之黄金时代。何可白白浪费。如无把握时机之时。犹如花开之后折空枝者也。宜惜之。"},{"n":85,"no":"第 85 号签","ji":"上上大吉签","text":"得其所哉，得其所哉。","jie":"得其所。亦即是赞颂君尔之婚姻。得其所在也。逢此非常际遇之时。君汝可毫不犹豫。决定取之可也。踌躇即失之东隅。但不能收之桑榆者。"},{"n":86,"no":"第 86 号签","ji":"中签","text":"河汉清且浅，相去复几许，盈盈一水间，脉脉不得语。","jie":"楚汉之界。又清又浅之一条河所隔。去对岸之地。复几许。应是地是去耶。不是困难之事耶。又如一盈盈之一水之间。无法说出一语者。可知目下君尔之运也。就婚姻而言。为环境所阻。暂难望及者。或者因学业。或事业。目前无可成之望。耐心等待可也。"},{"n":87,"no":"第 87 号签","ji":"下签","text":"便如凤去秦楼，云敛巫山。","jie":"凤去秦楼耶。表明伊人去矣。巫山之云亦敛欤。可知意中之人走了。是表白两人不宜结合耶。一切之事。婚姻亦如此断矣。不宜馁志。宜另择佳偶去。"},{"n":88,"no":"第 88 号签","ji":"中签","text":"是非吾所谓情也。","jie":"人生之旅途上。是是非非。自所难免。爰之。世人之爱情复是如此。如果无挫折。不是爱情也。友谊又是如此。既然如此。何必为友情。爱情而苦恼。如是没有风浪之友谊。是不堪一击者。真挚之友谊。即是能经得起考验者。不外乎要人看出庐山真面目者。"},{"n":89,"no":"第 89 号签","ji":"中签","text":"卜以决疑，不疑何卜。","jie":"一人之心事。如有疑问。无法决定之时。自向神灵问卜。依神示之无疑。反之。如无疑何必问神卜之。爰之。大部份之事。缑由此可知。不管何种问题。该由己衡量一切情况。毅然决定则可行之。信仰可也。唯决定之权在于君。"},{"n":90,"no":"第 90 号签","ji":"上签","text":"两情若是长久时，又岂在朝朝暮暮。","jie":"两人之情。可指友情爱情者。就友情而言。不知不觉。疏远了。情人也去远。心情纳闷。精神为之不振。情绪低落。唯如此之情况是一时之事。远行之朋友。情人。到时候。必有回来之时。伊等之回来。低落之情绪亦又复活。精神也为此大振。何必朝暮计?"},{"n":91,"no":"第 91 号签","ji":"上签","text":"你往事已沉，我只言自今。","jie":"汝之往事。该全忘却之。不是可以回味者。古人示之曰。昨日死。今日生。昨日之事全去之后。今日起。得以新之决定行之。已往不追。今日者再以新之决定作之。必有大成之时。"},{"n":92,"no":"第 92 号签","ji":"中签","text":"明明如月，何时可掇。","jie":"见水中之月。明知是皎洁之明月。于水中欲掇之。岂有可拾掇之时。伊是形影。何以费了心机亦枉然。一人之财运可托于彩券乎。成功与否。是命运乎。总之。为了一己之前途。必须确定自己之行也。脚踏实地。实事求是。自有大成之时。不宜托于命运也。确保之。必有大成之时。千万叵幻想之。"},{"n":93,"no":"第 93 号签","ji":"上上签","text":"而浮生若梦，为欢几何？","jie":"而浮生若梦，为欢几何人生之于人耶。是浮生若梦。人生五十。时至今日。人生古稀是人生之始。在转瞬间即可逝取之岁月中。人生欢乐几多。唯人生之旅程上。不宜有太多之顾虑。认其可行者断然行之。快乐之事亦可及时行之。不必将人生看得太认真。及时行乐也该行之。如今之休闲观。"},{"n":94,"no":"第 94 号签","ji":"中签","text":"巧言令色，鲜矣仁。","jie":"因人曰巧言令色者。最易解之句为藏里藏刀一己为了达成目的。为君不惜捧红。到头也取得利而后止。如今世之糖衣锭。爰之必须留心其毒计。以免上当。婚姻同之。如是伊人口蜜也藏剑。此可知嘴太甜者心小心之。不为其所动。"},{"n":95,"no":"第 95 号签","ji":"上签","text":"螽斯羽，薨薨兮。宜尔子孙，绳绳兮。","jie":"螽斯之羽耶。展翅飞翔于空中也。薨薨作声。薨。发音哄耶。非常舒适。顺畅之意耶。宜尔子孙。绳绳兮。亦即是际逢非常之际遇时。君尔将有绳绳兮。绵延不断者耶。可欣可贺之家运也。珍惜之。"},{"n":96,"no":"第 96 号签","ji":"上上签","text":"虽执鞭之士，吾亦为之。","jie":"吾亦可为之即是表明。伊既然是可敬之士。我可为之。易言之。伊人情有所钟之时。吾对伊人亦可好好对待。两者之情合之时。必须相对待也。不宜置之不理耶。此时。将是君之大损也。"},{"n":97,"no":"第 97 号签","ji":"中签","text":"归楚，楚人不信。归汉，汉人震恐。足下欲持是安归乎？","jie":"人人为牌之归来而惶恐。在此不容于人之时。君将何如耶。繇此可知。平时之为人必须善耶。否则人人敬而远之。无人将敢接近耶。"},{"n":98,"no":"第 98 号签","ji":"上签","text":"昨夜江边春草生，艨艟巨舰一毛轻，向来枉费推移力，此日中流自在行。","jie":"诗文曰。江边之春草。于昨晚生。君尔目下之运也缝春之时。一切由严冬中苏苏之时。君自此惟艨艟。大船亦如举一毛之轻。事事可以顺畅者。往日非常费力方可行之事。如今。犹如在中流。自由自在。行之顺畅。以往之晦气。一扫而尽。好事就在目前。运亨通者。"},{"n":99,"no":"第 99 号签","ji":"中签","text":"必先苦其心志。","jie":"为解决一件事。不管任何人也得先苦其心志。方有完成之时。婚姻如此。为两人之情。接近去也。必须苦其心与志。方能有培植情感。善果之可能耶。"},{"n":100,"no":"第 100 号签","ji":"上上签","text":"花好、月圆、人寿。","jie":"本签者也。殿之最后之一首签。将周而复始之签。是大吉大利之签。爰之出之诗文曰。花好。月圆。人寿之三者。人生最高愿望皆出之。曰。花好耶。花盛开。月又圆。望月之时。盈满而毫无亏蚀。人寿也。人人愿百年人瑞而偕老。三者皆备。人生之乐亦至于此耶。抽得此签之君。就婚姻之面。亦将是两美之合。百岁团圆者。"}]
